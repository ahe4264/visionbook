<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Concept Graph — Foundations of Computer Vision</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
  onload="window._katexReady=true"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0f1117; color: #e2e8f0;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}
header {
  padding: 10px 18px 8px;
  border-bottom: 1px solid #1e2535;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
header h1 { font-size: 14px; font-weight: 700; color: #f1f5f9; white-space: nowrap; }
#stats { font-size: 11px; color: #64748b; white-space: nowrap; }
#search-wrap { flex: 1; display: flex; align-items: center; gap: 8px; }
#search {
  flex: 1; max-width: 260px;
  background: #1a1f2e; border: 1px solid #2d3748; border-radius: 6px;
  color: #e2e8f0; font-size: 12px; padding: 5px 10px; font-family: inherit;
  outline: none;
}
#search:focus { border-color: #4f46e5; }
#search::placeholder { color: #475569; }
.btn-group { display: flex; gap: 6px; }
.btn {
  background: #1a1f2e; border: 1px solid #2d3748; border-radius: 5px;
  color: #94a3b8; font-size: 10px; font-weight: 600; padding: 4px 10px;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.btn:hover { background: #232b3e; color: #e2e8f0; }
.btn.active { background: #1e1b4b; border-color: #4f46e5; color: #a5b4fc; }

#layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
#sidebar {
  width: 220px; flex-shrink: 0;
  background: #0c0f1a; border-right: 1px solid #1e2535;
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-header {
  padding: 9px 12px 7px;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: #475569;
  border-bottom: 1px solid #1e2535; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
#clear-filter {
  font-size: 9px; color: #6366f1; cursor: pointer; font-weight: 600;
  display: none;
}
#clear-filter:hover { color: #818cf8; }
#chapter-list { flex: 1; overflow-y: auto; padding: 4px 0; }
#chapter-list::-webkit-scrollbar { width: 4px; }
#chapter-list::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
.ch-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px; cursor: pointer;
  transition: background 0.08s;
}
.ch-item:hover { background: #1a1f2e; }
.ch-item.active { background: #1e2030; }
.ch-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.ch-label { font-size: 10px; color: #94a3b8; flex: 1; line-height: 1.3; }
.ch-item.active .ch-label { color: #e2e8f0; }
.ch-count {
  font-size: 9px; color: #475569; font-weight: 600;
  background: #1e2535; border-radius: 10px; padding: 1px 5px;
}
.ch-item.active .ch-count { background: #2d3748; color: #94a3b8; }

/* Graph canvas */
#graph { flex: 1; position: relative; }
svg { width: 100%; height: 100%; }

.link           { stroke-width: 0.9; stroke-opacity: 0.3; }
.link.prereq    { stroke-opacity: 0.55; stroke-width: 1.1; }
.link.highlight { stroke-opacity: 1 !important; stroke-width: 2.5px !important; }
.link.dimmed    { stroke-opacity: 0.03 !important; }

.node circle {
  stroke-width: 1.2;
  transition: r 0.12s;
}
.node:hover .vis-circle { r: 9; stroke-width: 2px; }
.node.dimmed circle { opacity: 0.08; }
.node.dimmed text { opacity: 0; }
.node text {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 9px; font-weight: 600;
  fill: #e2e8f0;
  pointer-events: none;
  paint-order: stroke;
  stroke: #0f1117; stroke-width: 3px;
  dominant-baseline: middle;
  opacity: 0;
}

#hint {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: #475569; pointer-events: none;
  background: rgba(15,17,23,0.7); padding: 4px 10px; border-radius: 20px;
}

/* Detail panel */
#panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px;
  width: 300px;
  background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px;
  padding: 12px; overflow-y: auto; display: none; flex-direction: column; gap: 8px;
  flex-shrink: 0;
}
#panel.visible { display: flex; }
#panel::-webkit-scrollbar { width: 4px; }
#panel::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
#p-close {
  position: absolute; top: 8px; right: 10px;
  font-size: 14px; color: #475569; cursor: pointer; line-height: 1;
}
#p-close:hover { color: #e2e8f0; }
#p-kind {
  font-size: 8px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px;
  display: inline-block; align-self: flex-start;
}
#p-title { font-size: 13px; font-weight: 700; color: #f1f5f9; line-height: 1.3; }
#p-location { font-size: 9px; color: #64748b; line-height: 1.4; }
#p-one-liner { font-size: 10px; color: #94a3b8; line-height: 1.5; }
.p-section {
  font-size: 8px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: #475569; margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.prov-badge {
  font-size: 7px; font-weight: 700; letter-spacing: 0.05em;
  padding: 1px 4px; border-radius: 2px; text-transform: uppercase;
}
.prov-book   { background: #052e16; color: #6ee7b7; border: 1px solid #065f46; }
.prov-para   { background: #1c1917; color: #a8a29e; border: 1px solid #44403c; }
.prov-ai     { background: #1e1b4b; color: #a5b4fc; border: 1px solid #3730a3; }
/* Slot rows (matching chapter-level style) */
.slot-wrap {
  border-left: 2px solid #2d3748; padding-left: 8px;
}
.slot-label {
  font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
  color: #475569; margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.slot-icon { font-size: 10px; }
.slot-text { font-size: 10px; color: #cbd5e1; line-height: 1.6; }
.key-passage-text { color: #93c5fd; font-style: italic; }
.slot-section { font-size: 8px; color: #334155; margin-top: 3px; font-style: italic; }
/* Figures grid */
.figures-grid {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px;
}
.fig-thumb {
  width: 100%; max-width: 100%;
  border-radius: 4px; background: #0c0f1a;
  display: block; cursor: pointer;
}
.fig-thumb:hover { opacity: 0.85; }
.fig-caption {
  font-size: 8px; color: #475569; margin-top: 2px; line-height: 1.3;
}
/* Exercise blocks */
.item-block {
  background: #0f1117; border: 1px solid #1e2d45; border-radius: 5px;
  padding: 7px 9px; margin-bottom: 5px;
}
.item-kind-label {
  font-size: 7px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: #7dd3fc; margin-bottom: 4px;
}
.item-prompt { font-size: 10px; color: #bfdbfe; line-height: 1.55; }
.item-solution {
  font-size: 9px; color: #6ee7b7; line-height: 1.55;
  margin-top: 5px; padding-top: 5px; border-top: 1px solid #1e3a5a;
  max-height: 80px; overflow-y: auto;
}
.item-answer { font-size: 9px; font-weight: 700; color: #86efac; margin-top: 4px; }
/* KaTeX sizing in panel */
.slot-text .katex { font-size: 10px; }
.slot-text .katex-display { overflow-x: auto; margin: 4px 0; }
#p-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 8px; padding: 2px 6px; background: #0c2a40; border: 1px solid #1e3a5a; border-radius: 3px; color: #7dd3fc; }
#p-deps-wrap { display: none; }
#p-dep-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.dep-tag {
  font-size: 8px; padding: 2px 6px; background: #1e1b4b; border: 1px solid #3730a3;
  border-radius: 3px; color: #a5b4fc; cursor: pointer;
}
.dep-tag:hover { background: #312e81; }
#p-items { font-size: 9px; color: #64748b; line-height: 1.6; }

/* Hover tooltip */
#tooltip {
  position: fixed; pointer-events: none;
  background: rgba(13, 17, 30, 0.95);
  border: 1px solid #1e2d45;
  border-radius: 8px;
  padding: 9px 13px 10px;
  display: none; z-index: 100;
  min-width: 180px; max-width: 260px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
}
#tt-kind {
  font-size: 8px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 4px;
}
#tt-title {
  font-size: 13px; font-weight: 700; color: #f1f5f9;
  line-height: 1.3; margin-bottom: 4px;
}
#tt-location { font-size: 9px; color: #475569; line-height: 1.4; }

#loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; background: #0f1117; z-index: 10;
}
#loading p { font-size: 13px; color: #64748b; }
.spinner {
  width: 28px; height: 28px; border: 2px solid #2d3748;
  border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Edge legend */
#edge-legend {
  position: absolute; bottom: 40px; left: 12px;
  background: rgba(12,15,26,0.92); border: 1px solid #1e2535;
  border-radius: 6px; padding: 7px 10px; font-size: 9px;
  pointer-events: none;
}
.legend-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; line-height: 1; }
.legend-row:last-child { margin-bottom: 0; }
.legend-line {
  width: 18px; height: 2px; border-radius: 1px; flex-shrink: 0;
  position: relative;
}
.legend-line::after {
  content: '▶'; font-size: 6px; position: absolute; right: -4px; top: -4px;
}
.legend-label { color: #94a3b8; }
/* Edge tooltip */
#edge-tooltip {
  position: fixed; pointer-events: none;
  background: rgba(13,17,30,0.97); border: 1px solid #1e2d45;
  border-radius: 7px; padding: 8px 11px; display: none; z-index: 101;
  max-width: 240px;
}
#et-kind { font-size: 8px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 4px; }
#et-rationale { font-size: 9px; color: #94a3b8; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>Foundations of Computer Vision</h1>
  <span id="stats">Loading…</span>
  <div id="search-wrap">
    <input id="search" placeholder="Search concepts…" autocomplete="off">
    <div class="btn-group">
      <button class="btn active" id="btn-prereq" title="Toggle prerequisite edges">Prereq</button>
      <button class="btn" id="btn-overlay" title="Toggle overlay edges">Overlay</button>
    </div>
  </div>
</header>

<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header">
      Chapters
      <span id="clear-filter" onclick="clearFilter()">Clear ×</span>
    </div>
    <div id="chapter-list"></div>
  </div>
  <div id="graph">
    <div id="loading"><div class="spinner"></div><p>Building force graph…</p></div>
    <svg id="svg"></svg>
    <div id="tooltip">
      <div id="tt-kind"></div>
      <div id="tt-title"></div>
      <div id="tt-location"></div>
    </div>
    <div id="panel">
      <span id="p-close" onclick="closePanel()">✕</span>
      <span id="p-kind"></span>
      <div id="p-title"></div>
      <div id="p-location"></div>
      <div id="p-one-liner"></div>

      <!-- MOTIVATION -->
      <div id="p-motivation-wrap" style="display:none" class="slot-wrap">
        <div class="slot-label">
          <span class="slot-icon">💡</span>
          MOTIVATION
          <span id="p-motivation-prov" class="prov-badge"></span>
        </div>
        <div id="p-motivation" class="slot-text"></div>
        <div id="p-motivation-section" class="slot-section"></div>
      </div>

      <!-- EXAMPLE (from linked example items) -->
      <div id="p-example-wrap" style="display:none" class="slot-wrap">
        <div class="slot-label">
          <span class="slot-icon">▶</span>
          EXAMPLE
        </div>
        <div id="p-example-text" class="slot-text"></div>
      </div>

      <!-- QUESTION (verbatim — from fill_slots stage) -->
      <div id="p-question-wrap" style="display:none" class="slot-wrap">
        <div class="slot-label">
          <span class="slot-icon">?</span>
          QUESTION
          <span class="prov-badge prov-book">verbatim</span>
        </div>
        <div id="p-question" class="slot-text"></div>
        <div id="p-question-section" class="slot-section"></div>
      </div>

      <!-- KEY PASSAGE (verbatim — from fill_slots stage) -->
      <div id="p-key-passage-wrap" style="display:none" class="slot-wrap">
        <div class="slot-label">
          <span class="slot-icon">·</span>
          KEY PASSAGE
          <span class="prov-badge prov-book">verbatim</span>
        </div>
        <div id="p-key-passage" class="slot-text key-passage-text"></div>
        <div id="p-key-passage-section" class="slot-section"></div>
      </div>

      <!-- ORIGINAL FIGURES -->
      <div id="p-figures-wrap" style="display:none">
        <div class="p-section">🖼 Original Figures</div>
        <div id="p-figures" class="figures-grid"></div>
      </div>

      <!-- PREREQUISITES -->
      <div id="p-deps-wrap" style="display:none">
        <div class="p-section">Prerequisites</div>
        <div id="p-dep-tags"></div>
      </div>

      <!-- EXERCISES -->
      <div id="p-exercises-wrap" style="display:none">
        <div class="p-section">Exercises</div>
        <div id="p-exercises"></div>
      </div>

      <!-- SOURCE TEXT (full verbatim passage) -->
      <div id="p-raw-wrap" style="display:none">
        <div class="p-section" style="cursor:pointer;user-select:none" onclick="toggleRaw()">
          <span id="p-raw-toggle">▶</span> SOURCE TEXT
          <span class="prov-badge prov-book" style="margin-left:auto">verbatim</span>
        </div>
        <div id="p-raw-body" style="display:none;font-size:9px;color:#64748b;line-height:1.6;
          max-height:220px;overflow-y:auto;padding:6px 8px;background:#0c0f1a;
          border-radius:4px;border:1px solid #1e2535;margin-top:4px;white-space:pre-wrap;
          word-break:break-word"></div>
      </div>

      <div id="p-tags-wrap">
        <div class="p-section">Tags</div>
        <div id="p-tags"></div>
      </div>
    </div>
    <div id="edge-tooltip">
      <div id="et-kind"></div>
      <div id="et-rationale"></div>
    </div>
    <div id="edge-legend"></div>
    <div id="hint">Scroll to zoom · Click node · Sidebar to filter chapter</div>
  </div>
</div>

<script>
// ── Color palette for 55 chapters — visually distinct, no repeats ──────────
const PALETTE = [
  '#10b981', // emerald
  '#3b82f6', // blue
  '#f59e0b', // amber
  '#ec4899', // pink
  '#8b5cf6', // violet
  '#06b6d4', // cyan
  '#ef4444', // red
  '#84cc16', // lime
  '#f97316', // orange
  '#a78bfa', // light violet
  '#14b8a6', // teal
  '#fbbf24', // yellow
  '#e879f9', // fuchsia
  '#60a5fa', // light blue
  '#34d399', // light emerald
  '#fb923c', // light orange
  '#f472b6', // light pink
  '#4ade80', // light green
  '#38bdf8', // sky
  '#c084fc', // light purple
  '#2dd4bf', // light teal
  '#facc15', // yellow-400
  '#f87171', // light red
  '#a3e635', // light lime
  '#818cf8', // indigo
  '#fb7185', // rose
  '#22d3ee', // light cyan
  '#fde68a', // light amber
  '#86efac', // light green-300
  '#7dd3fc', // sky-300
  '#d8b4fe', // purple-300
  '#fca5a5', // red-300
  '#6ee7b7', // emerald-300
  '#fdba74', // orange-300
  '#93c5fd', // blue-300
  '#c4b5fd', // violet-300
  '#5eead4', // teal-300
  '#fcd34d', // amber-300
  '#f9a8d4', // pink-300
  '#bef264', // lime-300
  '#67e8f9', // cyan-300
  '#fda4af', // rose-300
  '#a5b4fc', // indigo-300
  '#6d28d9', // violet-700
  '#b45309', // amber-700
  '#0f766e', // teal-700
  '#b91c1c', // red-700
  '#1d4ed8', // blue-700
  '#15803d', // green-700
  '#9333ea', // purple-600
  '#c2410c', // orange-700
  '#0369a1', // sky-700
  '#7e22ce', // purple-700
  '#be185d', // pink-700
  '#4d7c0f', // lime-700
];
function chColor(chNum) { return PALETTE[(chNum - 1) % PALETTE.length]; }

const KIND_COLORS = {
  definition:  { bg: '#052e16', fg: '#6ee7b7', border: '#065f46' },
  idea:        { bg: '#0c2a40', fg: '#7dd3fc', border: '#075985' },
  technique:   { bg: '#1e1b4b', fg: '#a5b4fc', border: '#3730a3' },
  property:    { bg: '#2a1e2a', fg: '#d8b4fe', border: '#7e22ce' },
  result:      { bg: '#1c1917', fg: '#d6d3d1', border: '#57534e' },
};
function kindStyle(kind) {
  return KIND_COLORS[kind] || { bg: '#1e2030', fg: '#94a3b8', border: '#334155' };
}

// ── State ──────────────────────────────────────────────────────────────────
// ── Edge groups — 3 visual categories ────────────────────────────────────
// prerequisite: must know first (core learning order)
// structural:   how concepts relate conceptually (hierarchy/formalization)
// reference:    soft cross-links (see also, contrast)
const EDGE_GROUP = {
  requires:        'prereq',
  special_case_of: 'structural',
  generalizes:     'structural',
  formalizes:      'structural',
  illustrates:     'structural',
  see_also:        'reference',
  contrast_with:   'reference',
  used_to_prove:   'reference',
  teaches_after:   'reference',
};
const GROUP_COLOR = {
  prereq:     '#4f7dc4',  // blue  — must-know-first
  structural: '#2dd4bf',  // teal  — conceptual hierarchy
  reference:  '#475569',  // slate — soft cross-link
};
const GROUP_LABEL = {
  prereq:     'Prerequisite (must know first)',
  structural: 'Structural (hierarchy / formalization)',
  reference:  'Reference (see also / contrast)',
};
function edgeColor(kind) { return GROUP_COLOR[EDGE_GROUP[kind]] || GROUP_COLOR.reference; }
// Keep full kind label for tooltip detail
const EDGE_LABELS = {
  requires:        'Requires',
  see_also:        'See also',
  contrast_with:   'Contrast with',
  illustrates:     'Illustrates',
  special_case_of: 'Special case of',
  generalizes:     'Generalizes',
  formalizes:      'Formalizes',
  teaches_after:   'Teaches after',
  used_to_prove:   'Used to prove',
};

let allNodes = [], allLinks = [], nodeById = {};
let sim, svg, root, linkLayer, nodeLayer, labelLayer;
let zoom;
let activeChapter = null;
let showPrereq = true, showOverlay = true;
let graphData = null;
let itemById    = {};  // id → item record
let assetExt    = {};  // asset_id → file extension (jpg/png/etc)
let rawBody     = {};  // concept_id → verbatim raw_body string
let imagesByRef = {};  // fig_item_id or concept_id → [image, ...]
let allImagesById = {}; // asset_id → image record

// ── Load ──────────────────────────────────────────────────────────────────
const _v = Date.now();
Promise.all([
  fetch(`concept-graph-vision-data.json?v=${_v}`).then(r => r.json()),
  fetch(`concept-graph-raw.json?v=${_v}`).then(r => r.json()).catch(() => ({})),
])
  .then(([g, raw]) => init(g, raw))
  .catch(err => {
    document.getElementById('loading').innerHTML =
      `<p style="color:#ef4444">Failed to load graph data:<br>${err.message}</p>`;
  });

function init(g, raw) {
  graphData = g;
  rawBody = raw || {};

  // Build item lookup
  itemById = Object.fromEntries((g.items || []).map(i => [i.id, i]));

  // Build asset lookups
  (g.images || []).forEach(img => {
    if (!img.asset_id) return;
    allImagesById[img.asset_id] = img;
    if (img.local_path) assetExt[img.asset_id] = img.local_path.split('.').pop() || 'jpg';
    (img.referenced_by || []).forEach(ref => {
      if (!imagesByRef[ref]) imagesByRef[ref] = [];
      imagesByRef[ref].push(img);
    });
  });

  // Build node list
  allNodes = g.concepts.map(c => ({
    id: c.id,
    title: c.title,
    kind: c.kind || 'definition',
    one_liner: c.one_liner || '',
    content: c.content || '',
    motivation_md: c.motivation_md || '',
    // fill_slots fields (present after Stage 21 runs)
    key_passage: c.key_passage || null,
    question: c.question || null,
    motivation: c.motivation || null,
    tags: c.tags || [],
    chapter: c.position?.chapter || 0,
    chapter_title: c.position?.chapter_title || '',
    section: c.position?.section || '',
    section_title: c.position?.section_title || '',
    item_ids: c.item_ids || {},
    quality_flags: c.quality_flags || [],
    _provenance: c._provenance || {},
  }));
  nodeById = Object.fromEntries(allNodes.map(n => [n.id, n]));

  // Build link lists (prereq + overlay)
  const prereqLinks = (g.edges?.prereq || []).map(e => ({
    source: e.from, target: e.to, type: 'prereq',
    kind: e.kind || 'requires', strength: e.strength || 0.5,
    rationale: e.rationale || '',
  })).filter(e => nodeById[e.source] && nodeById[e.target]);

  const overlayLinks = (g.edges?.overlay || []).map(e => ({
    source: e.from, target: e.to, type: 'overlay',
    kind: e.kind || 'see_also', strength: e.strength || 0.5,
    rationale: e.rationale || '',
  })).filter(e => nodeById[e.source] && nodeById[e.target]);

  allLinks = { prereq: prereqLinks, overlay: overlayLinks };

  // Build chapter sidebar
  buildSidebar(g.chapters);

  // Update stats
  document.getElementById('stats').textContent =
    `${allNodes.length} concepts · ${prereqLinks.length} prereq · ${overlayLinks.length} overlay edges`;

  // Build force graph
  buildGraph();
}

// ── Sidebar ──────────────────────────────────────────────────────────────
function buildSidebar(chapters) {
  const counts = {};
  allNodes.forEach(n => { counts[n.chapter] = (counts[n.chapter] || 0) + 1; });
  const sorted = [...chapters].sort((a, b) => a.chapter - b.chapter);
  const list = document.getElementById('chapter-list');
  sorted.forEach(ch => {
    const n = counts[ch.chapter] || 0;
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.dataset.ch = ch.chapter;
    div.innerHTML = `
      <div class="ch-dot" style="background:${chColor(ch.chapter)}"></div>
      <div class="ch-label">Ch ${ch.chapter}. ${ch.chapter_title}</div>
      <div class="ch-count">${n}</div>
    `;
    div.onclick = () => filterChapter(ch.chapter, div);
    list.appendChild(div);
  });
}

function filterChapter(ch, el) {
  if (activeChapter === ch) { clearFilter(); return; }
  activeChapter = ch;
  document.querySelectorAll('.ch-item').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('clear-filter').style.display = 'block';
  applyFilter();
}

function clearFilter() {
  activeChapter = null;
  document.querySelectorAll('.ch-item').forEach(d => d.classList.remove('active'));
  document.getElementById('clear-filter').style.display = 'none';
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  updateVisibility(q, activeChapter);
}

// ── Force graph ──────────────────────────────────────────────────────────
function buildGraph() {
  const svgEl = document.getElementById('svg');
  const graphDiv = document.getElementById('graph');
  let W = graphDiv.clientWidth, H = graphDiv.clientHeight;

  svg = d3.select(svgEl);
  svg.attr('width', W).attr('height', H);

  // 3 group markers + 1 highlight marker
  const defs = svg.append('defs');
  Object.entries(GROUP_COLOR).forEach(([group, color]) => {
    defs.append('marker')
      .attr('id', `arr-${group}`)
      .attr('markerUnits', 'userSpaceOnUse')
      .attr('markerWidth', 8).attr('markerHeight', 8)
      .attr('refX', 8).attr('refY', 4).attr('orient', 'auto')
      .append('path').attr('d', 'M0,0 L0,8 L8,4 z').attr('fill', color);
  });

  // Build legend
  buildLegend();

  root = svg.append('g');
  zoom = d3.zoom().scaleExtent([0.05, 8])
    .on('zoom', e => {
      root.attr('transform', e.transform);
      // Show labels when zoomed in
      const k = e.transform.k;
      labelLayer && labelLayer.selectAll('text').attr('opacity', k > 1.8 ? Math.min(1, (k - 1.8) / 0.8) : 0);
    });
  svg.call(zoom);

  // Chapter cluster centers arranged in a grid
  const chapters = [...new Set(allNodes.map(n => n.chapter))].sort((a,b) => a-b);
  const cols = 8;
  const spacingX = 210, spacingY = 180;
  const clusterCenter = {};
  chapters.forEach((ch, i) => {
    clusterCenter[ch] = {
      x: (i % cols) * spacingX + spacingX / 2,
      y: Math.floor(i / cols) * spacingY + spacingY / 2
    };
  });

  // Initial positions near cluster centers
  allNodes.forEach(n => {
    const c = clusterCenter[n.chapter] || { x: W / 2, y: H / 2 };
    n.x = c.x + (Math.random() - 0.5) * 60;
    n.y = c.y + (Math.random() - 0.5) * 60;
  });

  // Active links based on toggle state
  let activeLinks = getActiveLinks();

  linkLayer = root.append('g').attr('class', 'links');
  nodeLayer = root.append('g').attr('class', 'nodes');
  labelLayer = root.append('g').attr('class', 'labels');

  // Build simulation
  sim = d3.forceSimulation(allNodes)
    .force('link', d3.forceLink(activeLinks)
      .id(d => d.id).distance(40).strength(0.15))
    .force('charge', d3.forceManyBody().strength(-28).distanceMax(160))
    .force('collide', d3.forceCollide(9).strength(0.7))
    .force('clusterX', d3.forceX(n => clusterCenter[n.chapter]?.x || W/2).strength(0.22))
    .force('clusterY', d3.forceY(n => clusterCenter[n.chapter]?.y || H/2).strength(0.22))
    .alphaDecay(0.015)
    .on('tick', ticked);

  drawLinks(activeLinks);
  drawNodes();

  // Fit after simulation settles
  sim.on('end', () => {
    fitGraph(W, H);
    document.getElementById('loading').style.display = 'none';
  });

  // Edge toggle buttons
  document.getElementById('btn-prereq').onclick = () => {
    showPrereq = !showPrereq;
    document.getElementById('btn-prereq').classList.toggle('active', showPrereq);
    refreshLinks();
  };
  document.getElementById('btn-overlay').onclick = () => {
    showOverlay = !showOverlay;
    document.getElementById('btn-overlay').classList.toggle('active', showOverlay);
    refreshLinks();
  };

  // Search
  document.getElementById('search').addEventListener('input', applyFilter);

  // Resize
  window.addEventListener('resize', () => {
    W = graphDiv.clientWidth; H = graphDiv.clientHeight;
    svg.attr('width', W).attr('height', H);
  });

  svg.on('click', () => closePanel());
}

function getActiveLinks() {
  const links = [];
  if (showPrereq) links.push(...allLinks.prereq);
  if (showOverlay) links.push(...allLinks.overlay);
  return links;
}

function refreshLinks() {
  const links = getActiveLinks();
  sim.force('link', d3.forceLink(links).id(d => d.id).distance(40).strength(0.15));
  sim.alpha(0.3).restart();
  drawLinks(links);
}

function drawLinks(links) {
  linkLayer.selectAll('line').remove();
  linkLayer.selectAll('line')
    .data(links)
    .join('line')
    .attr('class', d => `link ${d.type}${EDGE_GROUP[d.kind] === 'prereq' ? ' prereq' : ''}`)
    .attr('stroke', d => edgeColor(d.kind))
    .attr('marker-end', d => `url(#arr-${EDGE_GROUP[d.kind] || 'reference'})`)
    .on('mouseenter', (event, d) => showEdgeTooltip(event, d))
    .on('mousemove',  (event) => moveEdgeTooltip(event))
    .on('mouseleave', () => hideEdgeTooltip());
}

function drawNodes() {
  nodeLayer.selectAll('.node').remove();
  labelLayer.selectAll('text').remove();

  const nodeG = nodeLayer.selectAll('.node')
    .data(allNodes)
    .join('g')
    .attr('class', 'node')
    .style('cursor', 'pointer')
    .on('click', (event, d) => { event.stopPropagation(); lockedId = d.id; applyHighlight(d.id); showPanel(d); hideTooltip(); })
    .on('mouseenter', (event, d) => { highlightNode(d); showTooltip(event, d); })
    .on('mousemove',  (event) => moveTooltip(event))
    .on('mouseleave', () => { clearHighlight(); hideTooltip(); })
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.1).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    ).filter(e => !e.ctrlKey);

  // Invisible hit area — large transparent circle for easy hover/click
  nodeG.append('circle')
    .attr('r', 14)
    .attr('fill', 'transparent')
    .attr('stroke', 'none');

  // Visible node circle
  nodeG.append('circle')
    .attr('class', 'vis-circle')
    .attr('r', 6)
    .attr('fill', d => chColor(d.chapter))
    .attr('fill-opacity', 0.82)
    .attr('stroke', d => chColor(d.chapter))
    .attr('stroke-opacity', 1);

  // Labels (shown when zoomed in)
  labelLayer.selectAll('text')
    .data(allNodes)
    .join('text')
    .text(d => d.title)
    .attr('font-size', '7px')
    .attr('fill', '#e2e8f0')
    .attr('opacity', 0)
    .attr('paint-order', 'stroke')
    .attr('stroke', '#0f1117')
    .attr('stroke-width', '2.5px')
    .attr('dominant-baseline', 'middle')
    .attr('x', 8);
}

function ticked() {
  // Offset line endpoints by node radius so arrowheads are visible outside nodes
  linkLayer.selectAll('line').each(function(d) {
    const dx = d.target.x - d.source.x;
    const dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    d3.select(this)
      .attr('x1', d.source.x + ux * 7)
      .attr('y1', d.source.y + uy * 7)
      .attr('x2', d.target.x - ux * 8)
      .attr('y2', d.target.y - uy * 8);
  });

  nodeLayer.selectAll('.node')
    .attr('transform', d => `translate(${d.x},${d.y})`);

  labelLayer.selectAll('text')
    .attr('transform', d => `translate(${d.x},${d.y})`);
}

function fitGraph(W, H) {
  const xs = allNodes.map(n => n.x), ys = allNodes.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const gw = x1 - x0 + 40, gh = y1 - y0 + 40;
  const scale = Math.min(W / gw, H / gh) * 0.88;
  const tx = (W - gw * scale) / 2 - x0 * scale + 20 * scale;
  const ty = (H - gh * scale) / 2 - y0 * scale + 20 * scale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ── Highlight ─────────────────────────────────────────────────────────────
let lockedId = null;

function applyHighlight(id) {
  const connectedIds = new Set([id]);
  const activeLinks = getActiveLinks();
  activeLinks.forEach(l => {
    const sid = l.source?.id || l.source;
    const tid = l.target?.id || l.target;
    if (sid === id) connectedIds.add(tid);
    if (tid === id) connectedIds.add(sid);
  });
  nodeLayer.selectAll('.node').classed('dimmed', n => !connectedIds.has(n.id));
  linkLayer.selectAll('line').each(function(l) {
    const sid = l.source?.id || l.source;
    const tid = l.target?.id || l.target;
    const isHl = sid === id || tid === id;
    d3.select(this).classed('highlight', isHl).classed('dimmed', !isHl);
  });
}

function clearHighlightVisuals() {
  nodeLayer.selectAll('.node').classed('dimmed', false);
  linkLayer.selectAll('line').classed('highlight', false).classed('dimmed', false);
}

function highlightNode(d) {
  if (lockedId) return;   // don't override the lock with hover
  applyHighlight(d.id);
}

function clearHighlight() {
  if (lockedId) return;   // don't clear when a node is locked
  clearHighlightVisuals();
}

// ── Text rendering ────────────────────────────────────────────────────────
function renderMath(text) {
  // Protect math, escape HTML, render KaTeX, return HTML string
  const mathBlocks = [];
  let s = text;
  s = s.replace(/\$\$([\s\S]*?)\$\$/g, (_, m) => {
    return '\x00MATH' + (mathBlocks.push({ display: true, src: m }) - 1) + '\x00';
  });
  s = s.replace(/\$([^\s$][^$\n]*?)\$/g, (_, m) => {
    return '\x00MATH' + (mathBlocks.push({ display: false, src: m }) - 1) + '\x00';
  });
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/`([^`]+)`/g, '<code style="font-size:9px;background:#0c0f1a;padding:1px 3px;border-radius:2px;color:#7dd3fc">$1</code>');
  s = s.replace(/\x00MATH(\d+)\x00/g, (_, i) => {
    const { display, src } = mathBlocks[+i];
    try {
      if (window.katex) return katex.renderToString(src, { displayMode: display, throwOnError: false });
    } catch {}
    return display ? `<div style="text-align:center">${src}</div>` : src;
  });
  return s;
}

function imgTagFor(assetId) {
  // assetId can be 16-hex OR a QMD fig-name like 'fig-transformers-masked_prediction1'
  const ext = assetExt[assetId] || 'png';
  return `<img class="fig-thumb" src="vision_images/${assetId}.${ext}" alt="" onerror="this.style.display='none'">`;
}

// Get images for a concept — primary source is raw_body [FIGURE:...] tokens
const FIGURE_TOKEN_RE = /\[FIGURE:([^|\]]+)/g;
function imagesForConcept(d) {
  const seen = new Set();
  const imgs = [];
  const addById = (assetId) => {
    const aid = assetId.trim();
    if (!aid || seen.has(aid)) return;
    if (allImagesById[aid]) { seen.add(aid); imgs.push(allImagesById[aid]); }
  };

  // 1. Extract directly from raw_body tokens (most complete source)
  const raw = rawBody[d.id] || '';
  let m;
  FIGURE_TOKEN_RE.lastIndex = 0;
  while ((m = FIGURE_TOKEN_RE.exec(raw)) !== null) addById(m[1]);

  // 2. Also via figure item → referenced_by (catches cases not in raw_body)
  (d.item_ids?.figures || []).forEach(fid => (imagesByRef[fid] || []).forEach(img => addById(img.asset_id)));
  (imagesByRef[d.id] || []).forEach(img => addById(img.asset_id));

  return imgs;
}

function renderItemBlock(item) {
  if (!item) return '';
  const prompt = item.prompt_md ? renderMath(item.prompt_md.replace(/@[\w-]+/g, '')) : '';
  let extra = '';
  if (item.solution_md) {
    extra += `<div class="item-solution">${renderMath(item.solution_md.replace(/@[\w-]+/g, ''))}</div>`;
  }
  if (item.answer) extra += `<div class="item-answer">Answer: ${item.answer}</div>`;
  return `<div class="item-block">
    <div class="item-kind-label">${item.kind || 'item'}</div>
    <div class="item-prompt">${prompt}</div>${extra}
  </div>`;
}

// ── Tooltip ───────────────────────────────────────────────────────────────
// Re-render the open panel once KaTeX is ready (it loads async)
let _pendingPanelNode = null;
function _waitForKatexAndRender() {
  if (window.katex) {
    if (_pendingPanelNode) { showPanel(_pendingPanelNode); _pendingPanelNode = null; }
    return;
  }
  setTimeout(_waitForKatexAndRender, 80);
}
_waitForKatexAndRender();

const tooltipEl = document.getElementById('tooltip');
const ttKind = document.getElementById('tt-kind');
const ttTitle = document.getElementById('tt-title');
const ttLocation = document.getElementById('tt-location');

function showTooltip(event, d) {
  const ks = kindStyle(d.kind);
  ttKind.textContent = (d.kind || 'concept').toUpperCase();
  ttKind.style.color = ks.fg;
  ttTitle.textContent = d.title;
  const ch = d.chapter ? `Ch ${d.chapter}` : '';
  const sec = d.section_title ? `§${d.section} ${d.section_title}` : (d.section ? `§${d.section}` : '');
  ttLocation.textContent = [ch, sec].filter(Boolean).join(' · ');
  tooltipEl.style.display = 'block';
  moveTooltip(event);
}

function moveTooltip(event) {
  const x = event.clientX + 14;
  const y = event.clientY - 10;
  const w = tooltipEl.offsetWidth;
  const h = tooltipEl.offsetHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  tooltipEl.style.left = (x + w > vw ? event.clientX - w - 14 : x) + 'px';
  tooltipEl.style.top  = (y + h > vh ? event.clientY - h - 4 : y) + 'px';
}

function hideTooltip() {
  tooltipEl.style.display = 'none';
}

// ── Visibility filter ─────────────────────────────────────────────────────
function updateVisibility(q, chFilter) {
  nodeLayer.selectAll('.node').each(function(d) {
    const matchSearch = !q || d.title.toLowerCase().includes(q) || d.tags.some(t => t.includes(q));
    const matchCh = !chFilter || d.chapter === chFilter;
    const visible = matchSearch && matchCh;
    d3.select(this).classed('dimmed', !visible);
  });
  linkLayer.selectAll('line').each(function(l) {
    const sid = l.source?.id || l.source;
    const tid = l.target?.id || l.target;
    const sn = nodeById[sid], tn = nodeById[tid];
    const matchS = !chFilter || sn?.chapter === chFilter;
    const matchT = !chFilter || tn?.chapter === chFilter;
    d3.select(this).classed('dimmed', !(matchS && matchT));
  });
}

// ── Panel ─────────────────────────────────────────────────────────────────
function showPanel(d) {
  const ks = kindStyle(d.kind);
  const kind = document.getElementById('p-kind');
  kind.textContent = d.kind || 'concept';
  kind.style.background = ks.bg; kind.style.color = ks.fg; kind.style.border = `1px solid ${ks.border}`;

  document.getElementById('p-title').textContent = d.title;
  document.getElementById('p-location').textContent =
    `Ch ${d.chapter}. ${d.chapter_title} · §${d.section} ${d.section_title}`;
  document.getElementById('p-one-liner').innerHTML = renderMath(d.one_liner);

  function setSlot(wrapId, textId, sectionId, textVal, sectionVal) {
    const wrap = document.getElementById(wrapId);
    if (textVal) {
      document.getElementById(textId).innerHTML = renderMath(textVal.replace(/@[\w-]+/g,''));
      if (sectionId && sectionVal) document.getElementById(sectionId).textContent = sectionVal;
      wrap.style.display = 'block';
    } else {
      wrap.style.display = 'none';
    }
  }

  // ── MOTIVATION ────────────────────────────────────────────────────────────
  const motText = d.motivation?.text || d.motivation_md;
  const motSection = d.motivation?.section || '';
  const motProv = document.getElementById('p-motivation-prov');
  const isVerbatim = !!d.motivation?.text;
  const provLabel = d._provenance?.motivation_md || 'llm_inferred';
  if (motProv) {
    if (isVerbatim) { motProv.textContent = 'verbatim'; motProv.className = 'prov-badge prov-book'; }
    else if (provLabel === 'book_paraphrased') { motProv.textContent = 'paraphrased'; motProv.className = 'prov-badge prov-para'; }
    else { motProv.textContent = 'AI'; motProv.className = 'prov-badge prov-ai'; }
  }
  setSlot('p-motivation-wrap', 'p-motivation', 'p-motivation-section', motText, motSection);

  // ── EXAMPLE (first linked example item) ──────────────────────────────────
  const exampleItem = (d.item_ids?.examples || []).map(id => itemById[id]).find(Boolean);
  const exWrap = document.getElementById('p-example-wrap');
  if (exampleItem?.prompt_md) {
    document.getElementById('p-example-text').innerHTML =
      renderMath(exampleItem.prompt_md.replace(/@[\w-]+/g,''));
    exWrap.style.display = 'block';
  } else {
    exWrap.style.display = 'none';
  }

  // ── QUESTION (verbatim from fill_slots) ───────────────────────────────────
  setSlot('p-question-wrap', 'p-question', 'p-question-section',
    d.question?.text, d.question?.section);

  // ── KEY PASSAGE (verbatim from fill_slots) ────────────────────────────────
  setSlot('p-key-passage-wrap', 'p-key-passage', 'p-key-passage-section',
    d.key_passage?.text, d.key_passage?.section);

  // ── ORIGINAL FIGURES ─────────────────────────────────────────────────────
  const imgs = imagesForConcept(d);
  const figsWrap = document.getElementById('p-figures-wrap');
  const figsEl   = document.getElementById('p-figures');
  if (imgs.length > 0) {
    figsEl.innerHTML = imgs.map(img => {
      const figItem = (d.item_ids?.figures || []).map(fid => itemById[fid])
        .find(fi => fi && (img.referenced_by || []).includes(fi.id));
      const caption = figItem?.caption_md || img.alt_text_md || '';
      return `<div style="width:100%">
        ${imgTagFor(img.asset_id)}
        ${caption ? `<div class="fig-caption">${caption.replace(/\[FIGURE:[^\]]+\]/g,'').trim()}</div>` : ''}
      </div>`;
    }).join('');
    figsWrap.style.display = 'block';
  } else {
    figsWrap.style.display = 'none';
  }

  // ── PREREQUISITES ─────────────────────────────────────────────────────────
  const activeLinks = getActiveLinks();
  const prereqs = activeLinks
    .filter(l => (l.target?.id || l.target) === d.id)
    .map(l => nodeById[l.source?.id || l.source]).filter(Boolean);
  const depsWrap = document.getElementById('p-deps-wrap');
  if (prereqs.length > 0) {
    depsWrap.style.display = 'block';
    document.getElementById('p-dep-tags').innerHTML = prereqs.map(p =>
      `<span class="dep-tag" onclick="lockedId='${p.id}';applyHighlight('${p.id}');showPanel(nodeById['${p.id}'])">${p.title}</span>`
    ).join('');
  } else {
    depsWrap.style.display = 'none';
  }

  // ── EXERCISES ─────────────────────────────────────────────────────────────
  const exerciseItems = [...(d.item_ids?.exercises || []), ...(d.item_ids?.exercise_groups || [])]
    .map(id => itemById[id]).filter(Boolean);
  const exWrapEl = document.getElementById('p-exercises-wrap');
  if (exerciseItems.length > 0) {
    document.getElementById('p-exercises').innerHTML = exerciseItems.map(renderItemBlock).join('');
    exWrapEl.style.display = 'block';
  } else {
    exWrapEl.style.display = 'none';
  }

  // ── SOURCE TEXT (raw_body verbatim passage) ───────────────────────────────
  const raw = rawBody[d.id] || '';
  const rawWrap = document.getElementById('p-raw-wrap');
  const rawBodyEl = document.getElementById('p-raw-body');
  if (raw) {
    // Clean up line-number prefixes and figure tokens for display
    const cleanedRaw = raw
      .replace(/^\d{3,4}\s/gm, '')           // strip line-number prefixes
      .replace(/\[FIGURE:[^\]]*\]/g, '[fig]') // condense figure tokens
      .replace(/\{#[^}]*\}/g, '')            // strip anchors
      .replace(/@\S+/g, '')                  // strip @citations
      .trim();
    rawBodyEl.textContent = cleanedRaw;
    rawWrap.style.display = 'block';
  } else {
    rawWrap.style.display = 'none';
  }
  // Collapse the raw body whenever panel opens for a new concept
  rawBodyEl.style.display = 'none';
  document.getElementById('p-raw-toggle').textContent = '▶';

  // ── TAGS ──────────────────────────────────────────────────────────────────
  document.getElementById('p-tags').innerHTML =
    d.tags.map(t => `<span class="tag">${t}</span>`).join('');

  document.getElementById('panel').style.display = 'flex';
  if (!window.katex) _pendingPanelNode = d;
}

// ── Edge tooltip ──────────────────────────────────────────────────────────
const edgeTipEl = document.getElementById('edge-tooltip');
function showEdgeTooltip(event, d) {
  const color = edgeColor(d.kind);
  const groupLabel = GROUP_LABEL[EDGE_GROUP[d.kind]] || d.kind;
  const kindLabel  = EDGE_LABELS[d.kind] || d.kind;
  document.getElementById('et-kind').textContent = `${kindLabel}  ·  ${groupLabel}`;
  document.getElementById('et-kind').style.color = color;
  document.getElementById('et-rationale').textContent = d.rationale || '';
  edgeTipEl.style.display = 'block';
  moveEdgeTooltip(event);
}
function moveEdgeTooltip(event) {
  const x = event.clientX + 14, y = event.clientY - 10;
  const w = edgeTipEl.offsetWidth, h = edgeTipEl.offsetHeight;
  edgeTipEl.style.left = (x + w > window.innerWidth  ? event.clientX - w - 14 : x) + 'px';
  edgeTipEl.style.top  = (y + h > window.innerHeight ? event.clientY - h - 4  : y) + 'px';
}
function hideEdgeTooltip() { edgeTipEl.style.display = 'none'; }

// ── Legend ────────────────────────────────────────────────────────────────
function buildLegend() {
  const el = document.getElementById('edge-legend');
  el.innerHTML = Object.entries(GROUP_LABEL).map(([group, label]) => {
    const color = GROUP_COLOR[group];
    const opacity = group === 'prereq' ? 1 : 0.6;
    return `<div class="legend-row">
      <div class="legend-line" style="background:${color};opacity:${opacity};color:${color}"></div>
      <span class="legend-label" style="color:${group==='prereq'?'#cbd5e1':'#64748b'}">${label}</span>
    </div>`;
  }).join('');
}

function toggleRaw() {
  const el = document.getElementById('p-raw-body');
  const tog = document.getElementById('p-raw-toggle');
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  tog.textContent = open ? '▼' : '▶';
}

function closePanel() {
  document.getElementById('panel').style.display = 'none';
  lockedId = null;
  clearHighlightVisuals();
}
</script>
