<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculus — Journey</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="controls">
    <h1>Calculus — Journey</h1>
    <div id="stats">loading…</div>

    <label class="sec-label">Edge kinds</label>
    <div id="edge-filters"></div>

    <label class="sec-label">Concept kinds</label>
    <div id="kind-filters"></div>

    <label class="sec-label">Search</label>
    <input id="search" type="search" placeholder="concept title, alias, tag">

    <label class="sec-label">View</label>
    <label class="toggle">
      <input type="checkbox" id="show-only-selected-edges">
      <span>Only show edges touching selection</span>
    </label>

    <p class="hint">Scroll horizontally through the whole book. Each column is a section; each block is a chapter. Click a concept to pin it and see its connections — arcs show prereqs and overlay relations.</p>
  </aside>

  <main id="timeline-wrap">
    <div id="timeline-scroll">
      <svg id="timeline"></svg>
    </div>
  </main>

  <aside id="detail">
    <div id="detail-empty">Click a node for details.</div>
    <div id="detail-body" hidden>
      <button id="detail-close" class="btn-close" title="Close">×</button>
      <span id="detail-kind" class="kind-chip"></span>
      <h2 id="detail-title"></h2>
      <div id="detail-locator"></div>
      <div id="detail-oneliner" class="oneliner"></div>
      <div id="detail-sections"></div>
      <h3>Connected concepts</h3>
      <div id="detail-links"></div>
      <h3 id="detail-items-heading">Items in this section</h3>
      <div id="detail-items"></div>
    </div>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
