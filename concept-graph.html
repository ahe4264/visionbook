<script>
// ── Load graph data ─────────────────────────────────────────────────────────
// If served via the backend (/api/concept-graph/:chapter), data is injected.
// Otherwise falls back to hardcoded sample data below.

async function loadGraphData() {
  // 1. Inline injected data (when opened via openWithData)
  if (window.__GRAPH_DATA__) return adaptServerGraph(window.__GRAPH_DATA__);

  const params = new URLSearchParams(location.search);

  // 2a. Per-chapter file from split_chapters.py output:
  //     /concept-graph.html?book_chapter=5
  const bookChapter = params.get('book_chapter');
  if (bookChapter) {
    const n = parseInt(bookChapter, 10);
    const rel = `chapter_graphs/ch${String(n).padStart(2, '0')}.json`;
    const resp = await fetch(rel);
    if (!resp.ok) throw new Error(`${rel} → HTTP ${resp.status}`);
    return adaptPipelineGraph(await resp.json());
  }

  // 2b. Bundled pipeline output (merge_graph.py): open from repo root over HTTP, e.g.
  //    /concept-graph.html?pipeline
  //    /concept-graph.html?pipeline&graph=create_knowledge_graph/data3/graph.indexed.json
  if (params.has('pipeline') || params.has('kg')) {
    const rel = params.get('graph') || 'create_knowledge_graph/data3/graph.json';
    const resp = await fetch(rel);
    if (!resp.ok) throw new Error(`${rel} → HTTP ${resp.status} (serve the repo root, not file://)`);
    return adaptPipelineGraph(await resp.json());
  }

  // 3. Figure-platform chapter API
  const chapter = params.get('chapter');
  if (chapter) {
    const base = location.protocol === 'file:' ? 'http://localhost:3001' : '';
    try {
      const resp = await fetch(`${base}/api/concept-graph/${chapter}`);
      if (resp.ok) return adaptServerGraph(await resp.json());
    } catch { /* fall through */ }
  }
  // Default: load chapter 1
  const resp = await fetch('chapter_graphs/ch01.json');
  if (resp.ok) return adaptPipelineGraph(await resp.json());
  return SAMPLE_GRAPH;
}

// Adapt the server's .graph.json format to the D3 GRAPH format
function adaptServerGraph(json) {
  // Assign tiers by topological depth: 0=foundation, 1=mid, 2+=advanced
  const topoDepth = computeTopoDepth(json.concepts);
  const maxDepth  = Math.max(1, ...Object.values(topoDepth));

  const nodes = json.concepts.map(c => {
    const d = topoDepth[c.id] || 0;
    const tier = d === 0 ? 'foundation' : d <= 2 ? 'mid' : 'core';
    return {
      id:    c.id,
      label: c.label,
      tier,
      slots: {
        motivation:   c.slots?.motivation   || null,
        example:      c.slots?.example      || null,
        demo:         c.slots?.demo         || [],
        question:     c.slots?.question     || null,
        key_passage:  c.slots?.key_passage  || null,
        pset:         c.slots?.pset         || '',
        visual:       c.slots?.visual       || [],
      },
      deps:        c.deps,
      section_ids: c.section_ids || [],
    };
  });

  // Build edges from deps
  const edges = [];
  nodes.forEach(n => n.deps.forEach(d => edges.push({ source: d, target: n.id, type: 'dep' })));

  return { nodes, edges, title: json.chapterTitle };
}

/** Normalize merge_graph bundle (graph.json or graph.indexed.json) for the viewer Concept shapes. */
function conceptsArrayFromBundle(json) {
  if (Array.isArray(json.concepts)) return json.concepts;
  if (json.concepts_by_id && typeof json.concepts_by_id === 'object')
    return Object.values(json.concepts_by_id);
  return [];
}

function prereqEdgeListFromBundle(json) {
  if (json.edges?.prereq && Array.isArray(json.edges.prereq)) return json.edges.prereq;
  if (json.prereq_in && typeof json.prereq_in === 'object') {
    const flat = [];
    for (const list of Object.values(json.prereq_in)) {
      if (Array.isArray(list)) for (const e of list) flat.push(e);
    }
    return flat;
  }
  return [];
}

function adaptPipelineGraph(json) {
  const prereq = prereqEdgeListFromBundle(json);
  const depMap = {};
  prereq.forEach(e => {
    const fr = e.from;
    const to = e.to;
    if (!fr || !to) return;
    if (!depMap[fr]) depMap[fr] = [];
    depMap[fr].push(to);
  });

  const rawConcepts = conceptsArrayFromBundle(json);
  const concepts = rawConcepts
    .filter(c => c && c.id)
    .map(c => ({
      id: c.id,
      deps: [...new Set(depMap[c.id] || [])],
    }));

  const topoDepth = computeTopoDepth(concepts);
  const nodes = rawConcepts
    .filter(c => c && c.id)
    .map(c => {
      const deps = [...new Set(depMap[c.id] || [])];
      const d = topoDepth[c.id] || 0;
      const tier = d === 0 ? 'foundation' : d <= 2 ? 'mid' : 'core';
      const sec = c.position && c.position.section;
      return {
        id: c.id,
        label: c.title || c.id,
        tier,
        slots: {
          motivation:  c.motivation?.text  || c.slots?.motivation  || c.motivation_md  || null,
          key_passage: c.key_passage?.text || c.slots?.key_passage || c.recap_md       || null,
          question:    c.question?.text    || c.slots?.question    || null,
          example:     c.slots?.example     || c.content           || c.one_liner      || null,
          demo:        [],
          pset:        '',
          visual:      [],
        },
        deps,
        section_ids: sec ? [sec] : [],
      };
    });

  const edges = [];
  nodes.forEach(n => n.deps.forEach(d => edges.push({ source: d, target: n.id, type: 'dep' })));

  // Drop isolated nodes (no edges within this chapter view)
  const connectedIds = new Set(edges.flatMap(e => [e.source, e.target]));
  const filteredNodes = nodes.filter(n => connectedIds.has(n.id));

  const meta = json.meta || {};
  const counts = meta.counts || {};
  const sub = [
    counts.concepts != null && `${counts.concepts} concepts`,
    counts.edges_prereq != null && `${counts.edges_prereq} prereq edges`,
    meta.source_file && String(meta.source_file),
  ]
    .filter(Boolean)
    .join(' · ');

  return {
    nodes: filteredNodes,
    edges,
    title: json.chapterTitle || 'Concept Graph',
    subtitle: sub || null,
  };
}

        example: 'Point (x, y) → (x, y, 1); point at infinity with w = 0.',

// Build edges from deps
GRAPH.nodes.forEach(n => {
  n.deps.forEach(d => {
    GRAPH.edges.push({ source: d, target: n.id, type: 'dep' });
  });
});

// Topological depth: depth 0 = no prerequisites (foundational), depth 2+ = advanced
function computeTopoDepth(nodes) {
  const depMap = {};
  nodes.forEach(n => { depMap[n.id] = n.deps || []; });
  const depth = {};
  const visiting = new Set();
  function getDepth(id) {
    if (depth[id] !== undefined) return depth[id];
    if (visiting.has(id)) return 0; // cycle guard
    visiting.add(id);
    const prereqs = depMap[id] || [];
    depth[id] = prereqs.length === 0 ? 0 : 1 + Math.max(...prereqs.map(p => getDepth(p)));
    visiting.delete(id);
    return depth[id];
  }
  nodes.forEach(n => getDepth(n.id));
  return depth;
}

const TIER_COLOR = {
  foundation: { fill: '#10b981', stroke: '#34d399', badge_bg: '#052e16', badge_fg: '#6ee7b7', label: 'Foundation' },
  mid:        { fill: '#0ea5e9', stroke: '#38bdf8', badge_bg: '#0c2a40', badge_fg: '#7dd3fc', label: 'Mid-level'  },
  core:       { fill: '#6366f1', stroke: '#818cf8', badge_bg: '#1e1b4b', badge_fg: '#a5b4fc', label: 'Advanced'   },
};

const SLOT_META = {
  motivation:  { icon: '💡', iconBg: '#1e2d4a' },
  example:     { icon: '📐', iconBg: '#1a2e2a' },
  key_passage: { icon: '•',  iconBg: '#1a2530' },
  demo:        { icon: '🎮', iconBg: '#1e1f3a' },
  question:    { icon: '❓', iconBg: '#2a1e2a' },

  visual:      { icon: '🖼',  iconBg: '#1e2a20' },
};

// ── Dagre-based render ───────────────────────────────────────────────────────
const NODE_W   = 136;
const NODE_PAD = 11;   // top/bottom padding inside card
const LINE_H   = 15;
const NODE_STROKE = 1.5; // keep in sync with rect stroke-width
const MAX_CHARS = 17;

const TIER_BG = {
  foundation: '#0a2a1a',
  mid:        '#081e2e',
  core:       '#13103a',
};

function wrapLabel(label) {
  const words = label.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? `${cur} ${w}` : w;
    if (test.length > MAX_CHARS && cur) { lines.push(cur); cur = w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
}

/** Distance from rectangle center to its boundary along ray (ux, uy). */
function distToRectEdge(w, h, ux, uy) {
  const hw = w / 2;
  const hh = h / 2;
  let t = Infinity;
  if (Math.abs(ux) > 1e-9) {
    const tx = (ux > 0 ? hw : -hw) / ux;
    if (tx > 0) t = Math.min(t, tx);
  }
  if (Math.abs(uy) > 1e-9) {
    const ty = (uy > 0 ? hh : -hh) / uy;
    if (ty > 0) t = Math.min(t, ty);
  }
  return t === Infinity ? Math.min(hw, hh) : t;
}

/**
 * Smooth edge between node cards. Endpoints use the outer box of the stroked rect
 * (dagre w/h + stroke) so attachment matches the visible border; small skim pulls
 * the tip slightly inside so it meets the outline instead of floating outside.
 */
function smoothLRBezierBetweenNodes(s, t) {
  let dx = t.x - s.x;
  let dy = t.y - s.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 4) return '';
  const ux = dx / len;
  const uy = dy / len;
  const ow = s._w + NODE_STROKE;
  const oh = s._h + NODE_STROKE;
  const tw = t._w + NODE_STROKE;
  const th = t._h + NODE_STROKE;
  const srcSkim = 2.5;
  const tgtSkim = 1.5;
  const da = Math.max(
    6,
    distToRectEdge(ow, oh, ux, uy) - srcSkim
  );
  const db = Math.max(
    6,
    distToRectEdge(tw, th, -ux, -uy) - tgtSkim
  );
  const ax = s.x + ux * da;
  const ay = s.y + uy * da;
  const bx = t.x - ux * db;
  const by = t.y - uy * db;
  dx = bx - ax;
  dy = by - ay;
  const k = Math.min(0.42, Math.max(0.18, 0.38 + 0.0008 * Math.abs(dy)));
  const cx1 = ax + dx * k;
  const cy1 = ay;
  const cx2 = bx - dx * k;
  const cy2 = by;
  return `M${ax},${ay} C${cx1},${cy1} ${cx2},${cy2} ${bx},${by}`;
}

function renderGraph(graphData) {
  const nodes = graphData.nodes.slice();
  const edges = graphData.edges.slice();

  document.querySelector('header h1').textContent = graphData.title || 'Concept Graph';
  const span = document.querySelector('header span');
  span.textContent = (graphData.subtitle ? graphData.subtitle + ' · ' : '') + 'click any node to inspect';

  // Clear previous render
  const svgEl = document.getElementById('svg');
  svgEl.innerHTML = '';

  const svg    = d3.select(svgEl);
  const graphDiv = document.getElementById('graph');
  let W = graphDiv.clientWidth, H = graphDiv.clientHeight;

  // Arrow marker (solid, clean)
  const defs = svg.append('defs');
  defs.append('marker')
    .attr('id', 'arr')
    .attr('markerUnits', 'userSpaceOnUse')
    .attr('markerWidth', 9).attr('markerHeight', 9)
    .attr('refX', 9).attr('refY', 4.5).attr('orient', 'auto')
    .append('path').attr('d', 'M0,0 L0,9 L9,4.5 z').attr('fill', '#94a3b8');

  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.1, 3])
    .on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoom);

  // ── Compute node dimensions from label ──────────────────────────────────────
  const nodeById = {};
  nodes.forEach(n => {
    n._lines = wrapLabel(n.label);
    n._w     = NODE_W;
    n._h     = NODE_PAD * 2 + n._lines.length * LINE_H;
    nodeById[n.id] = n;
  });

  // ── Build Dagre graph ───────────────────────────────────────────────────────
  const dg = new dagre.graphlib.Graph({ directed: true, multigraph: false });
  dg.setGraph({
    rankdir: 'LR',
    ranker:  'tight-tree',
    align:   'UL',
    nodesep: 34,
    ranksep: 42,
    marginx: 16,
    marginy: 30,
    edgesep: 6,
  });
  dg.setDefaultEdgeLabel(() => ({}));

  nodes.forEach(n => dg.setNode(n.id, { width: n._w, height: n._h }));

  // Resolve and de-duplicate edges
  const addedEdges = new Set();
  edges.forEach(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    const key = `${sid}→${tid}`;
    if (nodeById[sid] && nodeById[tid] && sid !== tid && !addedEdges.has(key)) {
      dg.setEdge(sid, tid);
      addedEdges.add(key);
    }
  });

  dagre.layout(dg);

  // Apply Dagre positions to nodes
  nodes.forEach(n => {
    const p = dg.node(n.id);
    if (p) { n.x = p.x; n.y = p.y; }
  });

  // Fit the whole graph in the viewport on first load
  const gi = dg.graph();
  const gw = (gi.width  || W) + 36;
  const gh = (gi.height || H) + 36;
  const scale = Math.min(W / gw, H / gh, 1.15);
  svg.call(zoom.transform,
    d3.zoomIdentity
      .translate((W - gw * scale) / 2 + 16 * scale, (H - gh * scale) / 2 + 16 * scale)
      .scale(scale)
  );

  // ── Edges (node centers; updated on drag) ───────────────────────────────────
  const edgeLayer = root.append('g');

  const linkData = [];
  const linkSeen = new Set();
  dg.edges().forEach(e => {
    const key = `${e.v}→${e.w}`;
    if (nodeById[e.v] && nodeById[e.w] && !linkSeen.has(key)) {
      linkData.push({ source: e.v, target: e.w });
      linkSeen.add(key);
    }
  });

  function linkPathD(d) {
    const s = nodeById[d.source];
    const t = nodeById[d.target];
    if (!s || !t) return '';
    return smoothLRBezierBetweenNodes(s, t);
  }

  const edgePaths = edgeLayer.selectAll('path.edge')
    .data(linkData)
    .join('path')
    .attr('class', 'edge')
    .attr('d', linkPathD)
    .attr('fill', 'none')
    .attr('stroke', '#4a5f78')
    .attr('stroke-width', 1.35)
    .attr('stroke-linejoin', 'round')
    .attr('stroke-linecap', 'round')
    .attr('marker-end', 'url(#arr)');

  function repaintEdges() {
    edgePaths.attr('d', linkPathD);
  }

  // ── Nodes (draggable; zoom-corrected deltas) ─────────────────────────────────
  const nodeLayer = root.append('g');

  const dragBehavior = d3.drag()
    .on('start', function(event, d) {
      d3.select(this).raise();
      d._dragMoved = false;
    })
    .on('drag', function(event, d) {
      const k = d3.zoomTransform(svg.node()).k;
      d.x += event.dx / k;
      d.y += event.dy / k;
      if (Math.abs(event.dx) + Math.abs(event.dy) > 2) d._dragMoved = true;
      d3.select(this).attr('transform', `translate(${d.x - d._w / 2},${d.y - d._h / 2})`);
      repaintEdges();
    });

  const nodeG = nodeLayer.selectAll('g')
    .data(nodes).join('g')
    .attr('class', 'node-g')
    .attr('transform', d => `translate(${d.x - d._w / 2},${d.y - d._h / 2})`)
    .call(dragBehavior)
    .on('click', (event, d) => {
      if (d._dragMoved) {
        d._dragMoved = false;
        event.stopPropagation();
        return;
      }
      event.stopPropagation();
      try { showPanel(d, nodes); } catch(err) { console.error('showPanel error:', err); document.getElementById('panel').classList.add('visible'); }
    });

  nodeG.append('rect')
    .attr('width',  d => d._w)
    .attr('height', d => d._h)
    .attr('rx', 6).attr('ry', 6)
    .attr('fill',         d => TIER_BG[d.tier] || '#13103a')
    .attr('stroke',       d => TIER_COLOR[d.tier].stroke)
    .attr('stroke-width', 1.5);

  nodeG.each(function(d) {
    const el      = d3.select(this);
    const totalH  = d._lines.length * LINE_H;
    const startY  = (d._h - totalH) / 2 + LINE_H * 0.78;
    d._lines.forEach((line, i) => {
      el.append('text')
        .attr('x', d._w / 2)
        .attr('y', startY + i * LINE_H)
        .attr('text-anchor', 'middle')
        .attr('fill', '#e2e8f0')
        .attr('font-family', "'Inter', system-ui, sans-serif")
        .attr('font-size', '11px')
        .attr('font-weight', '600')
        .attr('pointer-events', 'none')
        .text(line);
    });
  });

  window.addEventListener('resize', () => {
    W = graphDiv.clientWidth; H = graphDiv.clientHeight;
  });
  svg.on('click', () => closePanel());
}

// ── Panel ──────────────────────────────────────────────────────────────────
function showPanel(d, allNodes) {
  const tc = TIER_COLOR[d.tier];
  const badge = document.getElementById('p-badge');
  badge.textContent = tc.label;
  badge.style.background = tc.badge_bg;
  badge.style.color = tc.badge_fg;
  badge.style.border = `1px solid ${tc.stroke}40`;

  document.getElementById('p-title').textContent = d.label;

  const slotsEl = document.getElementById('p-slots');
  slotsEl.innerHTML = '';

  // Text slots — extracted from book
  const TEXT_SLOTS = ['motivation', 'example', 'question', 'key_passage'];
  TEXT_SLOTS.forEach(type => {
    const val = d.slots[type];
    if (!val) return;
    const m = SLOT_META[type] || { icon: '•', iconBg: '#1e2a3a' };
    // Support both old plain-string format and new { text, section } format
    const text    = typeof val === 'object' ? val.text    : val;
    const section = typeof val === 'object' ? val.section : null;
    slotsEl.innerHTML += `
      <div class="slot">
        <div class="slot-icon" style="background:${m.iconBg}">${m.icon}</div>
        <div class="slot-content">
          <div class="slot-type">${type.replace('_', ' ')}</div>
          <div class="slot-text">${text}</div>
          ${section ? `<div style="font-size:7px;color:#475569;margin-top:1px;font-style:italic;">§ ${section}</div>` : ''}
        </div>
      </div>`;
  });

  // Visual slot — show as images
  const visuals = d.slots.visual || [];
  if (visuals.length > 0) {
    const backendBase = location.port === '3001' ? '' : 'http://localhost:3001';
    let imgHtml = `<div style="margin-top:7px;padding-top:7px;border-top:1px solid #2d3748;">
      <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;margin-bottom:5px;">🖼 Original Figures</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    visuals.forEach(v => {
      const stem = v.stem || v;
      imgHtml += `<div style="text-align:center">
        <img src="${backendBase}/api/figure-image/${encodeURIComponent(stem)}"
          style="max-width:168px;max-height:118px;border-radius:3px;border:1px solid #334155;display:block;background:#1e293b"
          onerror="this.style.display='none'"
          alt="${stem}"/>
        <div style="font-size:7px;color:#64748b;margin-top:1px">${stem}</div>
      </div>`;
    });
    imgHtml += `</div></div>`;
    slotsEl.innerHTML += imgHtml;
  }

  // Demo slot — linked augmented figures
  const demos = d.slots.demo || [];
  if (demos.length > 0) {
    let demoHtml = `<div style="margin-top:6px;">
      <div style="font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;margin-bottom:4px;">🎮 Augmented Figures</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;">`;
    demos.forEach(d => {
      demoHtml += `<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:#1e1b4b;border:1px solid #4f46e5;color:#a5b4fc;font-weight:600">
        ${d.stem} · score ${typeof d.score === 'number' ? d.score.toFixed(1) : '?'}
      </span>`;
    });
    demoHtml += `</div></div>`;
    slotsEl.innerHTML += demoHtml;
  }

  const depsEl = document.getElementById('p-deps');
  const tagsEl = document.getElementById('p-dep-tags');
  if (d.deps && d.deps.length > 0) {
    depsEl.style.display = 'block';
    tagsEl.innerHTML = d.deps.map(dep => {
      const n = allNodes.find(n => n.id === dep);
      return `<span class="dep-tag">${n ? n.label : dep}</span>`;
    }).join('');
  } else {
    depsEl.style.display = 'none';
  }


  document.getElementById('panel').classList.add('visible');
}

function closePanel() {
  document.getElementById('panel').classList.remove('visible');
}

(function populateSelect() {
  const sel = document.getElementById('chapter-select');
  CHAPTERS.forEach(([n, title]) => {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = title;
    sel.appendChild(opt);
  });
  // Set to current chapter from URL param
  const cur = new URLSearchParams(location.search).get('book_chapter');
  if (cur) sel.value = cur;
})();

function switchChapter(n) {
  if (!n) return;
  const url = new URL(location.href);
  url.searchParams.set('book_chapter', n);
  location.href = url.toString();
}

loadGraphData()
  .then(data => {
    // Sync dropdown with loaded chapter
    const cur = new URLSearchParams(location.search).get('book_chapter');
    if (cur) document.getElementById('chapter-select').value = cur;
    // Update subtitle
    const sub = document.getElementById('header-sub');
    if (data.subtitle) sub.textContent = data.subtitle + ' · click any node to inspect';
    else sub.textContent = 'click any node to inspect';
    renderGraph(data);
  })
  .catch(err => {
    console.error(err);
    document.getElementById('header-sub').textContent = String(err.message || err);
