<!DOCTYPE html>
<html lang="en">
<head>
  <style>html,body{margin:0;height:100%;background:#fff;}body>*:not(canvas):not(script):not(.label){box-sizing:border-box;}</style>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #c { width: 100%; height: 100%; display: block; }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      top: 10px; left: 10px;
      display: flex; flex-direction: column; gap: 6px;
      font-family: sans-serif; font-size: 13px;
    }
    #ui button {
      padding: 4px 10px; cursor: pointer; border: 1px solid #aaa;
      background: #f5f5f5; border-radius: 4px;
    }
    #ui button:hover { background: #e0e0e0; }
    #ui button.active { background: #c8e6ff; border-color: #5aabf0; }
    #ui label { display: flex; flex-direction: column; gap: 2px; }
    #ui input[type=range] { width: 140px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <button id="btnReset">Reset View</button>
    <!-- ADD YOUR CONTROLS HERE -->
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    const camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.zoom = 1.2;
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const HOME_POS = camera.position.clone();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      controls.update();
    });

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color)      div.style.color      = options.color;
      if (options.fontSize)   div.style.fontSize   = options.fontSize;
      if (options.bold)       div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background   = options.background;
        div.style.padding      = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    /* project labels each frame */
    const _v = new THREE.Vector3();
    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);
        const x = ( _v.x * 0.5 + 0.5) * canvas.clientWidth  + offset[0];
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + offset[1];
        div.style.left = x + 'px';
        div.style.top  = y + 'px';
      }
    }

    /* ── Render loop ─────────────────────────────────────────────────────── */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
    }
    animate();

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left   = -d * aspect;
      camera.right  =  d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // ADD YOUR SCENE OBJECTS, GEOMETRY, LABELS, AND INTERACTION LOGIC BELOW HERE

    camera.position.set(7.8, 2.6, 5.8);
    camera.zoom = 1.45;
    camera.updateProjectionMatrix();
    controls.target.set(0.6, 0.6, 2.5);
    controls.update();
    HOME_POS.copy(camera.position);
    HOME_TARGET.copy(controls.target);

    const ui = document.getElementById('ui');

    const depthLabel = document.createElement('label');
    depthLabel.innerHTML = 'Object distance Z <input id="zSlider" type="range" min="2" max="8" step="0.01" value="5">';
    ui.appendChild(depthLabel);

    const yLabel = document.createElement('label');
    yLabel.innerHTML = 'Object height Y <input id="ySlider" type="range" min="0.6" max="3.4" step="0.01" value="2.2">';
    ui.appendChild(yLabel);

    const btnTriangles = document.createElement('button');
    btnTriangles.id = 'btnTriangles';
    btnTriangles.textContent = 'Similar Triangles';
    btnTriangles.classList.add('active');
    ui.appendChild(btnTriangles);

    const btnProjection = document.createElement('button');
    btnProjection.id = 'btnProjection';
    btnProjection.textContent = 'Projection: Perspective';
    btnProjection.classList.add('active');
    ui.appendChild(btnProjection);

    const btnAnimate = document.createElement('button');
    btnAnimate.id = 'btnAnimate';
    btnAnimate.textContent = 'Animate Object';
    ui.appendChild(btnAnimate);

    const zSlider = document.getElementById('zSlider');
    const ySliderEl = document.getElementById('ySlider');

    const black = 0x111111;
    const cyan = 0x7feef0;
    const green = 0x71f178;
    const red = 0xff1010;

    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    const axesGroup = new THREE.Group();
    mainGroup.add(axesGroup);

    const opticalCenter = new THREE.Vector3(0, 0, 0);

    const xDir = new THREE.Vector3(1, 0, 0);
    const yDir = new THREE.Vector3(0, 1, 0);
    const zDir = new THREE.Vector3(0, 0, 1);

    const xAxis = new THREE.ArrowHelper(xDir, opticalCenter, 5.2, black, 0.22, 0.14);
    const yAxis = new THREE.ArrowHelper(yDir, opticalCenter, 3.2, black, 0.22, 0.14);
    const zAxis = new THREE.ArrowHelper(zDir, opticalCenter, 3.2, black, 0.22, 0.14);
    axesGroup.add(xAxis, yAxis, zAxis);

    const xAxisLbl = addLabel('X', new THREE.Vector3(5.55, 0.05, 0), { bold: true, fontSize: '18px', offset: [10, 0] });
    const yAxisLbl = addLabel('Y', new THREE.Vector3(0, 3.45, 0), { bold: true, fontSize: '18px', offset: [12, -2] });
    const zAxisLbl = addLabel('Z', new THREE.Vector3(0, 0.05, 3.45), { bold: true, fontSize: '18px', offset: [0, -16] });

    const planeSize = 4.2;
    const filmMat = new THREE.MeshBasicMaterial({
      color: 0xdfe4e7,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide
    });
    const filmPlane = new THREE.Mesh(new THREE.PlaneGeometry(planeSize, planeSize), filmMat);
    filmPlane.position.set(-1, 1.1, 1.9);
    filmPlane.rotation.y = Math.PI / 4;
    mainGroup.add(filmPlane);

    const framePts = [
      new THREE.Vector3(-1, -1.0, 1.9),
      new THREE.Vector3(-1,  3.2, 1.9),
      new THREE.Vector3(-1,  3.2, 6.1),
      new THREE.Vector3(-1, -1.0, 6.1),
      new THREE.Vector3(-1, -1.0, 1.9)
    ];
    const frameGeom = new THREE.BufferGeometry().setFromPoints(framePts);
    const frameLine = new THREE.Line(frameGeom, new THREE.LineBasicMaterial({ color: black, linewidth: 2 }));
    frameLine.rotation.y = Math.PI / 4;
    frameLine.position.copy(filmPlane.position);
    mainGroup.add(frameLine);

    const planeNormal = new THREE.Vector3(1, 0, -1).normalize();
    const planeU = new THREE.Vector3(0, 1, 0).normalize();
    const planeV = new THREE.Vector3(1, 0, 1).normalize();

    const planeOrigin = filmPlane.position.clone();

    function planePoint(u, v) {
      return planeOrigin.clone().addScaledVector(planeU, u).addScaledVector(planeV, v);
    }

    const vArrowOrigin = planePoint(0.2, -1.0);
    const vArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), vArrowOrigin, 1.65, 0x22dd00, 0.18, 0.11);
    mainGroup.add(vArrow);

    const vLabel = addLabel('v', vArrowOrigin.clone().add(new THREE.Vector3(-0.2, -1.02, 0.08)), { fontSize: '18px', bold: true });

    const imageRect = new THREE.Group();
    mainGroup.add(imageRect);

    const imgColor = red;
    const imgLineMat = new THREE.LineBasicMaterial({ color: imgColor });

    function makeLine(points, material = imgLineMat) {
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
    }

    const objGroup = new THREE.Group();
    mainGroup.add(objGroup);

    const triangleGroup = new THREE.Group();
    mainGroup.add(triangleGroup);

    const projectionGroup = new THREE.Group();
    mainGroup.add(projectionGroup);

    const worldThinGroup = new THREE.Group();
    mainGroup.add(worldThinGroup);

    const imageThinGroup = new THREE.Group();
    mainGroup.add(imageThinGroup);

    const rayMat = new THREE.LineDashedMaterial({ color: black, dashSize: 0.08, gapSize: 0.06 });
    const rayGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const dashedRay = new THREE.Line(rayGeom, rayMat);
    dashedRay.computeLineDistances();
    projectionGroup.add(dashedRay);

    const objectDot = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 28, 20),
      new THREE.MeshBasicMaterial({ color: 0x8f3a1f })
    );
    objGroup.add(objectDot);

    const imageDot = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 28, 20),
      new THREE.MeshBasicMaterial({ color: red })
    );
    projectionGroup.add(imageDot);

    const objectVertical = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: red }));
    const objectTopDiag = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: red }));
    const imageVertical = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: red }));
    const imageTopBase = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: red }));
    const imageSlanted = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: red }));
    objGroup.add(objectVertical, objectTopDiag);
    projectionGroup.add(imageVertical, imageTopBase, imageSlanted);

    const worldGuide1 = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: 0x9aa3ad }));
    const worldGuide2 = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: 0x9aa3ad }));
    worldThinGroup.add(worldGuide1, worldGuide2);

    const imageGuide1 = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: 0x64d7d9 }));
    const imageGuide2 = makeLine([new THREE.Vector3(), new THREE.Vector3()], new THREE.LineBasicMaterial({ color: 0x64d7d9 }));
    imageThinGroup.add(imageGuide1, imageGuide2);

    const triMatWorld = new THREE.MeshBasicMaterial({
      color: green,
      transparent: true,
      opacity: 0.78,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const triMatImage = new THREE.MeshBasicMaterial({
      color: cyan,
      transparent: true,
      opacity: 0.78,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const triWorldLeft = new THREE.Mesh(new THREE.BufferGeometry(), triMatWorld);
    const triWorldRight = new THREE.Mesh(new THREE.BufferGeometry(), triMatWorld);
    const triImageLeft = new THREE.Mesh(new THREE.BufferGeometry(), triMatImage);
    const triImageRight = new THREE.Mesh(new THREE.BufferGeometry(), triMatImage);
    triangleGroup.add(triWorldLeft, triWorldRight, triImageLeft, triImageRight);

    function setTriangle(mesh, a, b, c) {
      const arr = new Float32Array([
        a.x, a.y, a.z,
        b.x, b.y, b.z,
        c.x, c.y, c.z
      ]);
      mesh.geometry.dispose();
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      g.computeVertexNormals();
      mesh.geometry = g;
    }

    const lblx = addLabel('x', new THREE.Vector3(-1.7, 1.45, 2.25), { fontSize: '20px', bold: true });
    const lbly = addLabel('y', new THREE.Vector3(-1.7, -0.05, 2.05), { fontSize: '20px', bold: true });
    const lblf = addLabel('f', new THREE.Vector3(-0.82, -0.65, 1.12), { fontSize: '20px', bold: true });
    const eq1 = addLabel('x / f = X / Z', new THREE.Vector3(1.8, 2.55, 1.2), { background: 'rgba(255,255,255,0.75)', bold: true });
    const eq2 = addLabel('y = f Y / Z', new THREE.Vector3(1.65, 2.15, 1.15), { background: 'rgba(255,255,255,0.75)', bold: true });

    let showTriangles = true;
    let usePerspective = true;
    let autoAnim = false;
    let tAnim = 0;

    function perspectiveProjection(P) {
      const t = planeNormal.dot(planeOrigin) / planeNormal.dot(P);
      return P.clone().multiplyScalar(t);
    }

    function orthographicProjection(P) {
      const camDir = P.clone().normalize();
      const dist = (planeNormal.dot(planeOrigin) - planeNormal.dot(P)) / planeNormal.dot(camDir);
      return P.clone().addScaledVector(camDir, dist);
    }

    function updateDiagram() {
      const Z = parseFloat(zSlider.value);
      const Y = parseFloat(ySliderEl.value);
      const X = 3.0;

      const base = new THREE.Vector3(X, 0, Z);
      const top = new THREE.Vector3(X, Y, Z);
      const proj = usePerspective ? perspectiveProjection(top) : orthographicProjection(top);

      objectDot.position.copy(top);
      imageDot.position.copy(proj);

      const objFoot = new THREE.Vector3(X, 0, Z);
      objectVertical.geometry.setFromPoints([objFoot, top]);
      objectTopDiag.geometry.setFromPoints([objFoot, new THREE.Vector3(5.0, 0, Z)]);

      const imgBottom = planePoint(proj.clone().sub(planeOrigin).dot(planeU), -1.15);
      const imgRightBottom = planePoint(-1.15, 1.6);
      const imgRightTop = planePoint(1.45, 1.6);
      const imgTopLeft = proj.clone();

      imageVertical.geometry.setFromPoints([imgRightBottom, imgRightTop]);
      imageTopBase.geometry.setFromPoints([imgTopLeft, imgRightTop]);
      imageSlanted.geometry.setFromPoints([imgBottom, imgRightBottom]);

      const rayPoints = [top, opticalCenter];
      dashedRay.geometry.setFromPoints(rayPoints);
      dashedRay.computeLineDistances();

      const worldAux1a = new THREE.Vector3(X, 0, Z);
      const worldAux1b = new THREE.Vector3(X, Y, Z);
      const worldAux2a = new THREE.Vector3(5.0, 0, Z);
      const worldAux2b = new THREE.Vector3(X, Y, Z);
      worldGuide1.geometry.setFromPoints([worldAux1a, worldAux1b]);
      worldGuide2.geometry.setFromPoints([worldAux2a, worldAux2b]);

      imageGuide1.geometry.setFromPoints([planePoint(-1.15, -0.2), proj]);
      imageGuide2.geometry.setFromPoints([planePoint(0.05, -1.15), proj]);

      setTriangle(triWorldRight, opticalCenter, top, new THREE.Vector3(5.0, 0, Z));
      setTriangle(triWorldLeft, opticalCenter, top, objFoot);
      setTriangle(triImageRight, opticalCenter, proj, imgRightTop);
      setTriangle(triImageLeft, opticalCenter, proj, imgBottom);

      triangleGroup.visible = showTriangles;
      worldThinGroup.visible = showTriangles;
      imageThinGroup.visible = showTriangles;

      lblx.pos.copy(proj.clone().add(new THREE.Vector3(-0.1, 0.45, -0.15)));
      lbly.pos.copy(vArrowOrigin.clone().add(new THREE.Vector3(-0.28, -0.15, 0.08)));
      lblf.pos.copy(planeOrigin.clone().lerp(opticalCenter, 0.42).add(new THREE.Vector3(0.0, -0.42, 0.0)));
      xAxisLbl.pos.set(5.55, 0.05, 0);
      yAxisLbl.pos.set(0, 3.45, 0);
      zAxisLbl.pos.set(0, 0.05, 3.45);
      vLabel.pos.copy(vArrowOrigin.clone().add(new THREE.Vector3(-0.2, -1.02, 0.08)));

      eq1.pos.set(1.7, 2.55, 1.2);
      eq2.pos.set(1.55, 2.15, 1.15);

      btnProjection.textContent = usePerspective ? 'Projection: Perspective' : 'Projection: Orthographic';
      btnProjection.classList.toggle('active', usePerspective);
      btnTriangles.classList.toggle('active', showTriangles);
      btnAnimate.classList.toggle('active', autoAnim);

      objectDot.material.color.set(usePerspective ? 0x8f3a1f : 0x5d3a96);
      imageDot.material.color.set(usePerspective ? red : 0x365cff);
    }

    zSlider.addEventListener('input', updateDiagram);
    ySliderEl.addEventListener('input', updateDiagram);

    btnTriangles.addEventListener('click', () => {
      showTriangles = !showTriangles;
      updateDiagram();
    });

    btnProjection.addEventListener('click', () => {
      usePerspective = !usePerspective;
      updateDiagram();
    });

    btnAnimate.addEventListener('click', () => {
      autoAnim = !autoAnim;
      updateDiagram();
    });

    renderer.domElement.style.touchAction = 'none';
    let dragging = false;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function screenToNDC(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function dragPlanePoint(event) {
      screenToNDC(event);
      raycaster.setFromCamera(pointer, camera);
      const dragPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), -3.0);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, hit);
      const newY = THREE.MathUtils.clamp(hit.y, 0.6, 3.4);
      const newZ = THREE.MathUtils.clamp(hit.z, 2.0, 8.0);
      ySliderEl.value = newY.toFixed(2);
      zSlider.value = newZ.toFixed(2);
      updateDiagram();
    }

    canvas.addEventListener('pointerdown', (event) => {
      screenToNDC(event);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(objectDot);
      if (hits.length) {
        dragging = true;
        controls.enabled = false;
      }
    });

    window.addEventListener('pointermove', (event) => {
      if (dragging) dragPlanePoint(event);
    });

    window.addEventListener('pointerup', () => {
      dragging = false;
      controls.enabled = true;
    });

    setInterval(() => {
      if (!autoAnim || dragging) return;
      tAnim += 0.02;
      zSlider.value = (5 + 2.4 * Math.sin(tAnim * 0.8)).toFixed(2);
      ySliderEl.value = (2 + 1.0 * Math.sin(tAnim * 1.25 + 0.7)).toFixed(2);
      updateDiagram();
    }, 16);

    updateDiagram();

  </script>
</body>
</html>
