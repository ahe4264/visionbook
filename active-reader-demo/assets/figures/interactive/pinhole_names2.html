<!DOCTYPE html>
<html lang="en">
<head>
  <style>html,body{margin:0;height:100%;background:#fff;}body>*:not(canvas):not(script):not(.label){box-sizing:border-box;}</style>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #c { width: 100%; height: 100%; display: block; }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      top: 10px; left: 10px;
      display: flex; flex-direction: column; gap: 6px;
      font-family: sans-serif; font-size: 13px;
    }
    #ui button {
      padding: 4px 10px; cursor: pointer; border: 1px solid #aaa;
      background: #f5f5f5; border-radius: 4px;
    }
    #ui button:hover { background: #e0e0e0; }
    #ui button.active { background: #c8e6ff; border-color: #5aabf0; }
    #ui label { display: flex; flex-direction: column; gap: 2px; }
    #ui input[type=range] { width: 140px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <button id="btnReset">Reset View</button>
    <!-- ADD YOUR CONTROLS HERE -->
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    const camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.zoom = 1.2;
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const HOME_POS = camera.position.clone();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      controls.update();
    });

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color)      div.style.color      = options.color;
      if (options.fontSize)   div.style.fontSize   = options.fontSize;
      if (options.bold)       div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background   = options.background;
        div.style.padding      = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    /* project labels each frame */
    const _v = new THREE.Vector3();
    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);
        const x = ( _v.x * 0.5 + 0.5) * canvas.clientWidth  + offset[0];
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + offset[1];
        div.style.left = x + 'px';
        div.style.top  = y + 'px';
      }
    }

    /* ── Render loop ─────────────────────────────────────────────────────── */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
    }
    animate();

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left   = -d * aspect;
      camera.right  =  d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // ADD YOUR SCENE OBJECTS, GEOMETRY, LABELS, AND INTERACTION LOGIC BELOW HERE

    /* ── UI controls for the pedagogical diagram ────────────────────────── */
    const ui = document.getElementById('ui');

    const xSliderWrap = document.createElement('label');
    xSliderWrap.innerHTML = 'Move World Point (X)<input id="xSlider" type="range" min="0.6" max="2.4" step="0.01" value="1.55">';
    ui.appendChild(xSliderWrap);

    const ySliderWrap = document.createElement('label');
    ySliderWrap.innerHTML = 'Move World Point (Y)<input id="ySlider" type="range" min="-1.2" max="1.5" step="0.01" value="0.95">';
    ui.appendChild(ySliderWrap);

    const zSliderWrap = document.createElement('label');
    zSliderWrap.innerHTML = 'Move World Point (Z)<input id="zSlider" type="range" min="1.2" max="3.2" step="0.01" value="2.1">';
    ui.appendChild(zSliderWrap);

    const btnAxes = document.createElement('button');
    btnAxes.id = 'btnAxes';
    btnAxes.textContent = 'Hide Coordinate Axes';
    btnAxes.classList.add('active');
    ui.appendChild(btnAxes);

    const btnAnimate = document.createElement('button');
    btnAnimate.id = 'btnAnimate';
    btnAnimate.textContent = 'Animate Light Rays';
    ui.appendChild(btnAnimate);

    /* ── Framing the camera to match the textbook schematic ─────────────── */
    camera.position.set(5.0, 3.4, 5.2);
    camera.lookAt(0.4, 0.1, 0.7);
    camera.zoom = 1.15;
    camera.updateProjectionMatrix();
    controls.target.set(0.4, 0.1, 0.7);
    controls.update();

    /* ── Common materials/colors approximating the printed figure ───────── */
    const colBox = 0x44503f;
    const colPlane = 0xa6b39a;
    const colTop = 0xb8c4ca;
    const colGuide = 0x4d5a60;
    const colAxis = 0x111111;
    const colCallout = 0x7f97a0;
    const colRay = 0xcc5522;
    const colF = 0xff1a1a;

    /* ── Camera body as a translucent box missing the front face ────────── */
    const bodyGroup = new THREE.Group();
    scene.add(bodyGroup);

    const boxGeom = new THREE.BoxGeometry(2.0, 2.0, 2.0);
    const edges = new THREE.EdgesGeometry(boxGeom);
    const edgeMat = new THREE.LineDashedMaterial({
      color: colGuide,
      dashSize: 0.22,
      gapSize: 0.16,
      linewidth: 1
    });
    const edgeLines = new THREE.LineSegments(edges, edgeMat);
    edgeLines.computeLineDistances();
    edgeLines.position.set(-1.0, 0.0, 1.0);
    bodyGroup.add(edgeLines);

    const sideMat = new THREE.MeshBasicMaterial({
      color: colBox,
      transparent: true,
      opacity: 0.95,
      side: THREE.DoubleSide
    });

    const topMat = new THREE.MeshBasicMaterial({
      color: colTop,
      transparent: true,
      opacity: 0.9,
      side: THREE.DoubleSide
    });

    const projMat = new THREE.MeshBasicMaterial({
      color: colPlane,
      transparent: true,
      opacity: 0.82,
      side: THREE.DoubleSide
    });

    function makePlane(w, h, colorMat) {
      return new THREE.Mesh(new THREE.PlaneGeometry(w, h), colorMat);
    }

    const rightFace = makePlane(2, 2, sideMat);
    rightFace.position.set(0, 0, 1);
    rightFace.rotation.y = Math.PI / 2;
    bodyGroup.add(rightFace);

    const topFace = makePlane(2, 2, topMat);
    topFace.position.set(-1, 1, 1);
    topFace.rotation.x = -Math.PI / 2;
    bodyGroup.add(topFace);

    const projectionPlane = makePlane(2, 2, projMat);
    projectionPlane.position.set(-2, 0, 1);
    projectionPlane.rotation.y = Math.PI / 2;
    bodyGroup.add(projectionPlane);

    /* ── Pinhole / camera center ─────────────────────────────────────────── */
    const pinhole = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    pinhole.position.set(0, 0, 1);
    scene.add(pinhole);

    /* ── World coordinate axes with right-hand-rule orientation ─────────── */
    const axesGroup = new THREE.Group();
    scene.add(axesGroup);

    const xDir = new THREE.Vector3(0.72, 0.58, 0.38).normalize();
    const yDir = new THREE.Vector3(0, 1, 0).normalize();
    const zDir = new THREE.Vector3(1, 0, 0).normalize();

    const axisLenX = 3.1;
    const axisLenY = 3.6;
    const axisLenZ = 3.6;

    const xArrow = new THREE.ArrowHelper(xDir, pinhole.position.clone(), axisLenX, colAxis, 0.23, 0.14);
    const yArrow = new THREE.ArrowHelper(yDir, pinhole.position.clone(), axisLenY, colAxis, 0.23, 0.14);
    const zArrow = new THREE.ArrowHelper(zDir, pinhole.position.clone(), axisLenZ, colAxis, 0.23, 0.14);
    axesGroup.add(xArrow, yArrow, zArrow);

    /* ── Optical / principal axis highlighted along +Z ──────────────────── */
    const principalGeom = new THREE.BufferGeometry().setFromPoints([
      pinhole.position.clone(),
      pinhole.position.clone().add(zDir.clone().multiplyScalar(3.2))
    ]);
    const principalLine = new THREE.Line(
      principalGeom,
      new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.85 })
    );
    scene.add(principalLine);

    /* ── A sample world point and its perspective projection ────────────── */
    const worldPoint = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0x1b5e20 })
    );
    scene.add(worldPoint);

    const imagePoint = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 20, 20),
      new THREE.MeshBasicMaterial({ color: colRay })
    );
    scene.add(imagePoint);

    function makeLine(points, material) {
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
    }

    const rayToPinhole = makeLine(
      [new THREE.Vector3(), new THREE.Vector3()],
      new THREE.LineBasicMaterial({ color: colRay, linewidth: 2 })
    );
    scene.add(rayToPinhole);

    const rayToPlane = makeLine(
      [new THREE.Vector3(), new THREE.Vector3()],
      new THREE.LineBasicMaterial({ color: colRay, linewidth: 2, transparent: true, opacity: 0.75 })
    );
    scene.add(rayToPlane);

    const constructionLine = makeLine(
      [new THREE.Vector3(), new THREE.Vector3()],
      new THREE.LineDashedMaterial({ color: colGuide, dashSize: 0.17, gapSize: 0.13 })
    );
    scene.add(constructionLine);

    const verticalGuide = makeLine(
      [new THREE.Vector3(), new THREE.Vector3()],
      new THREE.LineDashedMaterial({ color: colGuide, dashSize: 0.12, gapSize: 0.12 })
    );
    scene.add(verticalGuide);

    /* ── Red focal distance indicator f under the projection plane ──────── */
    const fGroup = new THREE.Group();
    scene.add(fGroup);

    const fLen = 2.0;
    const fY = -1.58;
    const fZ = 1.0;
    const fStart = new THREE.Vector3(-2, fY, fZ);
    const fEnd = new THREE.Vector3(0, fY, fZ);

    const fLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([fStart, fEnd]),
      new THREE.LineBasicMaterial({ color: colF, linewidth: 3 })
    );
    fGroup.add(fLine);

    const leftHead = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), fStart.clone().add(new THREE.Vector3(0.001, 0, 0)), 0.001, colF, 0.18, 0.12);
    const rightHead = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), fEnd.clone().add(new THREE.Vector3(-0.001, 0, 0)), 0.001, colF, 0.18, 0.12);
    fGroup.add(leftHead, rightHead);

    /* ── Curved callout arrows built as tubes plus cone arrowheads ──────── */
    function makeCurvedArrow(points, color) {
      const curve = new THREE.CatmullRomCurve3(points);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 48, 0.022, 8, false),
        new THREE.MeshBasicMaterial({ color })
      );

      const p1 = curve.getPoint(0.97);
      const p2 = curve.getPoint(1.0);
      const dir = p2.clone().sub(p1).normalize();
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.075, 0.18, 12),
        new THREE.MeshBasicMaterial({ color })
      );
      cone.position.copy(p2);
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

      const group = new THREE.Group();
      group.add(tube, cone);
      return group;
    }

    const projCallout = makeCurvedArrow([
      new THREE.Vector3(-3.2, 0.9, 1.1),
      new THREE.Vector3(-3.0, 0.2, 1.05),
      new THREE.Vector3(-2.55, -0.25, 1.02),
      new THREE.Vector3(-2.05, -0.2, 1.0)
    ], colCallout);
    scene.add(projCallout);

    const opticalCallout = makeCurvedArrow([
      new THREE.Vector3(2.55, 0.55, 1.55),
      new THREE.Vector3(2.35, 0.3, 1.36),
      new THREE.Vector3(2.05, 0.15, 1.15),
      new THREE.Vector3(1.8, 0.07, 1.03)
    ], colCallout);
    scene.add(opticalCallout);

    const pinholeCallout = makeCurvedArrow([
      new THREE.Vector3(1.22, -0.75, 1.55),
      new THREE.Vector3(0.92, -0.48, 1.34),
      new THREE.Vector3(0.55, -0.28, 1.18),
      new THREE.Vector3(0.22, -0.11, 1.05)
    ], colCallout);
    scene.add(pinholeCallout);

    /* ── Labels: audit from original figure ────────────────────────────────
       Visible labels reproduced:
       Pinhole camera
       Projection plane
       World coordinates
       Optical / principal axis
       Pinhole / camera center
       X
       Y
       Z
       f
    */
    addLabel('Pinhole camera', new THREE.Vector3(-2.95, 2.45, 0.9), {
      fontSize: '34px',
      fontFamily: 'serif',
      bold: false
    });

    addLabel('Projection plane', new THREE.Vector3(-3.45, 0.95, 1.0), {
      fontSize: '28px',
      offset: [0, 0]
    });

    addLabel('World coordinates', new THREE.Vector3(2.2, 2.55, 1.7), {
      fontSize: '34px'
    });

    const xTip = pinhole.position.clone().add(xDir.clone().multiplyScalar(axisLenX + 0.28));
    const yTip = pinhole.position.clone().add(yDir.clone().multiplyScalar(axisLenY + 0.25));
    const zTip = pinhole.position.clone().add(zDir.clone().multiplyScalar(axisLenZ + 0.28));

    addLabel('X', xTip, { fontSize: '44px', offset: [0, -8] });
    addLabel('Y', yTip, { fontSize: '44px', offset: [-8, -6] });
    addLabel('Z', zTip, { fontSize: '44px', offset: [6, 8] });

    addLabel('Optical / principal axis', new THREE.Vector3(2.95, 0.7, 1.38), {
      fontSize: '30px'
    });

    addLabel('Pinhole / camera center', new THREE.Vector3(1.95, -0.95, 1.28), {
      fontSize: '30px'
    });

    addLabel('<i>f</i>', new THREE.Vector3(-1.0, -1.95, 1.0), {
      fontSize: '34px',
      color: '#111'
    });

    const pLabel = addLabel('P', new THREE.Vector3(0, 0, 0), {
      fontSize: '18px',
      bold: true,
      background: 'rgba(255,255,255,0.75)',
      offset: [10, -10]
    });

    const pPrimeLabel = addLabel('p', new THREE.Vector3(0, 0, 0), {
      fontSize: '16px',
      color: '#8a2d00',
      background: 'rgba(255,255,255,0.7)',
      offset: [12, 10]
    });

    /* ── Perspective geometry update ─────────────────────────────────────── */
    const xSlider = document.getElementById('xSlider');
    const ySlider = document.getElementById('ySlider');
    const zSlider = document.getElementById('zSlider');

    const focalLength = 2.0;     // plane at x = -f behind the pinhole
    let rayPhase = 1.0;
    let animateRays = false;

    function projectToPlane(P) {
      const t = -focalLength / P.x;  // line from origin to point intersects x = -f
      return new THREE.Vector3(-focalLength, P.y * t, 1 + P.z * t);
    }

    function setLinePoints(line, a, b, dashed = false) {
      line.geometry.dispose();
      line.geometry = new THREE.BufferGeometry().setFromPoints([a, b]);
      if (dashed) line.computeLineDistances();
    }

    function updateDiagram() {
      const P = new THREE.Vector3(
        parseFloat(xSlider.value),
        parseFloat(ySlider.value),
        parseFloat(zSlider.value)
      );

      worldPoint.position.copy(P);
      const pProj = projectToPlane(P);
      imagePoint.position.copy(pProj);

      pLabel.pos.copy(P);
      pPrimeLabel.pos.copy(pProj);

      const shownPinhole = pinhole.position.clone();
      const partialOnFront = shownPinhole.clone().lerp(P, rayPhase);
      const partialOnBack = shownPinhole.clone().lerp(pProj, rayPhase);

      setLinePoints(rayToPinhole, shownPinhole, partialOnFront, false);
      setLinePoints(rayToPlane, shownPinhole, partialOnBack, false);

      const baseCorner = new THREE.Vector3(-2, -1, 0);
      setLinePoints(constructionLine, baseCorner, pProj, true);

      const guideTop = new THREE.Vector3(-2, 1, pProj.z);
      const guideBottom = new THREE.Vector3(-2, pProj.y, pProj.z);
      setLinePoints(verticalGuide, guideTop, guideBottom, true);
    }

    updateDiagram();

    /* ── Axes visibility toggle ──────────────────────────────────────────── */
    let showAxes = true;
    btnAxes.addEventListener('click', () => {
      showAxes = !showAxes;
      axesGroup.visible = showAxes;
      principalLine.visible = showAxes;
      btnAxes.textContent = showAxes ? 'Hide Coordinate Axes' : 'Show Coordinate Axes';
      btnAxes.classList.toggle('active', showAxes);
    });

    /* ── Ray animation toggle ────────────────────────────────────────────── */
    btnAnimate.addEventListener('click', () => {
      animateRays = !animateRays;
      btnAnimate.textContent = animateRays ? 'Stop Light Rays' : 'Animate Light Rays';
      btnAnimate.classList.toggle('active', animateRays);
    });

    [xSlider, ySlider, zSlider].forEach(slider => {
      slider.addEventListener('input', () => {
        updateDiagram();
      });
    });

    /* ── Independent per-frame updater using setInterval ─────────────────── */
    setInterval(() => {
      if (animateRays) {
        const t = performance.now() * 0.0026;
        rayPhase = 0.15 + 0.85 * (0.5 + 0.5 * Math.sin(t * 2.0));
      } else {
        rayPhase = 1.0;
      }
      updateDiagram();
    }, 30);

  </script>
</body>
</html>
