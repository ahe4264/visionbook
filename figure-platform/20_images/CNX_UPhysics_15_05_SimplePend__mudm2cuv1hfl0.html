<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700;font-size:12px">Pendulum: the restoring force</span>
<span id="demoTitle" style="font-weight:600;color:#1b4f72"></span>
<span id="demoNarration" style="font-size:11px;line-height:1.5;color:#222"></span>
<span style="display:flex;gap:6px;align-items:center;margin-top:2px">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label style="margin-top:4px">Angular displacement θ (degrees): <output id="thetaSliderVal">25</output>
  <input id="thetaSliderInput" type="range" min="-60" max="60" step="1" value="25"
         oninput="document.getElementById('thetaSliderVal').value=this.value;update_thetaSlider(+this.value)"></label>
<label>Restoring force model
  <select id="forceModelInput" onchange="toggle_forceModel(this.value)">
    <option value="exact">Exact: −mg sin θ</option>
    <option value="small">Small-angle: −mg θ</option>
    <option value="both">Compare both</option>
  </select></label>
<label style="flex-direction:row;align-items:center;gap:6px">
  <input id="showConstructionInput" type="checkbox" onchange="toggle_showConstruction(this.checked)">
  Show weight-decomposition construction</label>
<button id="swingBtn" onclick="trigger_swing()">▶ Release the pendulum</button>
<span style="font-weight:600;font-size:11px;margin-top:4px">Colour key</span>
<span style="display:flex;align-items:center;gap:7px;font-size:12px"><span style="display:inline-block;width:20px;height:4px;border-radius:2px;background:#1b4f72"></span>tension F<sub>T</sub> (along string)</span>
<span style="display:flex;align-items:center;gap:7px;font-size:12px"><span style="display:inline-block;width:20px;height:4px;border-radius:2px;background:#cf3b41"></span>weight mg and its components</span>
<span id="legendLinear" style="display:none;align-items:center;gap:7px;font-size:12px"><span style="display:inline-block;width:20px;height:4px;border-radius:2px;background:#e08a1e"></span>linear estimate −mgθ</span>
<span style="font-weight:600;font-size:11px;margin-top:4px">Numbers</span>
<span id="readout" style="font-size:12px;line-height:1.55;color:#222;font-family:ui-monospace,Consolas,monospace;white-space:pre"></span>
<span style="font-size:10px;color:#666;line-height:1.4">Hover or click any arrow for an explanation.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

var W = 440, H = 430;
var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
draw.viewbox(0, 0, W, H);

var PX = 178, PY = 30, L = 195, WLEN = 95, BOBR = 14, CEIL_H = 24;
var NAVY = '#1b4f72', CRIM = '#cf3b41', ORANGE = '#e08a1e', INK = '#141414', GRAY = '#9a9a9a';

var state = { theta: 25, model: 'exact', constr: false, running: false, thRad: 0, omega: 0 };
var G_OVER_L = 4.0;

/* ---------- static background ---------- */
var ceilGrad = draw.gradient('linear', function (add) {
  add.stop(0, '#eacf9f'); add.stop(1, '#f8ecd8');
}).from(0, 0).to(0, 1);
draw.rect(W, CEIL_H).move(0, 0).fill(ceilGrad);
draw.line(0, CEIL_H, W, CEIL_H).stroke({ color: '#d8c49a', width: 1 });

var bobGrad = draw.gradient('radial', function (add) {
  add.stop(0, '#ffffff'); add.stop(0.45, '#d5d5d5'); add.stop(1, '#7c7c7c');
}).attr({ cx: 0.36, cy: 0.30, r: 0.75 });

var gDyn = draw.group();

/* ---------- collision bookkeeping ---------- */
var obstacles = [];   // sampled points of every stroke drawn this frame
var labelBoxes = [];  // boxes already claimed by text this frame

function addSeg(x1, y1, x2, y2) {
  var d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(d / 7));
  for (var i = 0; i <= n; i++) {
    obstacles.push({ x: x1 + (x2 - x1) * i / n, y: y1 + (y2 - y1) * i / n });
  }
}
function addRing(cx, cy, r) {
  for (var i = 0; i < 14; i++) {
    var a = i / 14 * Math.PI * 2;
    obstacles.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
  }
  obstacles.push({ x: cx, y: cy });
}

function boxScore(b) {
  var pad = 3, s = 0, i;
  for (i = 0; i < obstacles.length; i++) {
    var o = obstacles[i];
    if (o.x > b.x1 - pad && o.x < b.x2 + pad && o.y > b.y1 - pad && o.y < b.y2 + pad) s += 1;
  }
  for (i = 0; i < labelBoxes.length; i++) {
    var q = labelBoxes[i];
    if (!(q.x2 < b.x1 - 2 || q.x1 > b.x2 + 2 || q.y2 < b.y1 - 2 || q.y1 > b.y2 + 2)) s += 60;
  }
  if (b.x1 < 4) s += (4 - b.x1) * 2;
  if (b.x2 > W - 4) s += (b.x2 - (W - 4)) * 2;
  if (b.y1 < CEIL_H + 4) s += (CEIL_H + 4 - b.y1) * 2;
  if (b.y2 > H - 4) s += (b.y2 - (H - 4)) * 2;
  return s;
}

/* try candidate offsets from an anchor, keep the first clear one */
function findSpot(ax, ay, cands, w, h) {
  var best = null;
  for (var i = 0; i < cands.length; i++) {
    var cx = ax + cands[i][0], cy = ay + cands[i][1];
    cx = Math.max(6 + w / 2, Math.min(W - 6 - w / 2, cx));
    cy = Math.max(CEIL_H + 10, Math.min(H - 10, cy));
    var b = { x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2 };
    var sc = boxScore(b);
    if (!best || sc < best.sc) best = { sc: sc, cx: cx, cy: cy, b: b, i: i };
    if (sc === 0) break;
  }
  labelBoxes.push(best.b);
  return best;
}

/* ---------- text helpers ---------- */
function txt(g, x, y, str, o) {
  o = o || {};
  var t = g.plain(str);
  t.font({
    family: 'Georgia, "Times New Roman", serif',
    size: o.size || 14,
    style: o.italic ? 'italic' : 'normal',
    weight: o.weight || 'normal'
  });
  t.attr({
    x: x, y: y, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'middle',
    fill: o.color || INK, 'paint-order': 'stroke', stroke: '#fff',
    'stroke-width': (o.halo == null ? 3.6 : o.halo), 'stroke-linejoin': 'round'
  });
  return t;
}

function subTxt(g, x, y, main, sub, o) {
  o = o || {};
  var size = o.size || 15;
  var t = g.text(function (add) {
    add.tspan(main);
    add.tspan(sub).attr({ 'baseline-shift': 'sub', 'font-size': (size * 0.68).toFixed(1) });
  });
  t.font({ family: 'Georgia, "Times New Roman", serif', size: size, style: 'italic' });
  t.attr({
    x: x, y: y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
    fill: o.color || INK, 'paint-order': 'stroke', stroke: '#fff',
    'stroke-width': 3.6, 'stroke-linejoin': 'round'
  });
  return t;
}

function clipT(dx, dy, hw, hh) {
  var tx = dx === 0 ? 1e9 : hw / Math.abs(dx);
  var ty = dy === 0 ? 1e9 : hh / Math.abs(dy);
  return Math.min(tx, ty);
}

/* place a label in open whitespace; add a faint leader if it had to move */
function smartLabel(g, str, ax, ay, cands, o) {
  o = o || {};
  var size = o.size || 14;
  var w = o.w || (str.length * size * 0.52);
  var h = size * 1.14;
  var spot = findSpot(ax, ay, cands, w, h);
  if (o.leader) {
    var dx = ax - spot.cx, dy = ay - spot.cy, dist = Math.hypot(dx, dy);
    if (dist > w / 2 + 12) {
      var t = clipT(dx, dy, w / 2 + 4, h / 2 + 4);
      g.line(spot.cx + dx * t, spot.cy + dy * t, ax, ay)
        .stroke({ color: '#b6b6b6', width: 0.9 });
    }
  }
  return txt(g, spot.cx, spot.cy, str, {
    size: size, color: o.color, italic: o.italic, halo: o.halo
  });
}

function arrow(g, x1, y1, x2, y2, color, w, quiet) {
  var dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 2) return null;
  var ux = dx / len, uy = dy / len;
  var hl = Math.min(16, Math.max(6, len * 0.30));
  var hw = hl * 0.58;
  var bx = x2 - ux * hl, by = y2 - uy * hl;
  var grp = g.group();
  grp.line(x1, y1, bx, by).stroke({ color: color, width: w, linecap: 'round' });
  grp.polygon([[x2, y2], [bx - uy * hw, by + ux * hw], [bx + uy * hw, by - ux * hw]]
    .map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' ')).fill(color);
  if (!quiet) addSeg(x1, y1, x2, y2);
  return grp;
}

function arcPoly(g, cx, cy, r, a1, a2, opts) {
  var n = 40, pts = [];
  for (var i = 0; i <= n; i++) {
    var a = a1 + (a2 - a1) * i / n;
    var px = cx + r * Math.sin(a), py = cy + r * Math.cos(a);
    pts.push(px.toFixed(2) + ',' + py.toFixed(2));
    if (!opts.quiet && i % 2 === 0) obstacles.push({ x: px, y: py });
  }
  var p = g.polyline(pts.join(' ')).fill('none')
    .stroke({ color: opts.color || INK, width: opts.width || 1.4, linecap: 'round' });
  if (opts.dash) p.attr('stroke-dasharray', opts.dash);
  return p;
}

function interactive(el, tip, title, body) {
  if (!el) return;
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); });
  el.on('mouseleave', function () { hideTooltip(); });
  el.on('click', function () { showPopup(title, body); });
}

/* ---------- main render ---------- */
function render() {
  gDyn.clear();
  obstacles.length = 0;
  labelBoxes.length = 0;

  var thDeg = state.theta, th = thDeg * Math.PI / 180;
  var s = Math.sin(th), c = Math.cos(th), sg = (th >= 0 ? 1 : -1);
  var bob = { x: PX + L * s, y: PY + L * c };

  var radDir = { x: s, y: c };            // along string, away from pivot
  var tenDir = { x: -s, y: -c };          // +y : toward pivot
  var xDir = { x: c, y: -s };             // +x : tangent, away from equilibrium
  var tanDir = { x: -sg * c, y: sg * s }; // restoring tangential direction

  var tanLen = WLEN * Math.abs(s);
  var radLen = WLEN * c;
  var tenLen = WLEN * c;
  var linLen = WLEN * Math.abs(th);

  /* ----- geometry ----- */
  var vert = gDyn.line(PX, PY, PX, PY + L + 16).stroke({ color: '#2a2a2a', width: 1.7, dasharray: '7,5' });
  addSeg(PX, PY, PX, PY + L + 16);
  interactive(vert, 'Equilibrium direction (the hanging position)', 'Equilibrium line',
    'The dashed vertical marks where the string would hang if the bob were at rest. The restoring force always points back toward this line.');
  gDyn.circle(5).center(PX, PY).fill(INK);

  if (Math.abs(th) > 0.03) {
    var arcS = arcPoly(gDyn, PX, PY, L, 0, th, { color: '#2a2a2a', width: 1.8, dash: '8,5' });
    interactive(arcS, 's = L\u03b8 \u2014 arc-length displacement from equilibrium',
      'Arc displacement s',
      'The bob is constrained to a circular arc of radius L, so its displacement from equilibrium is the arc length s = L\u03b8. The restoring force acts along this arc, tangent to the path.');
  }

  var strLine = gDyn.line(PX, PY, bob.x, bob.y).stroke({ color: INK, width: 2 });
  addSeg(PX, PY, bob.x, bob.y);
  interactive(strLine, 'String of length L', 'The string',
    'The string is inextensible, so the bob can only move on a circular arc of radius L. It can pull only along its own direction \u2014 that is why it cancels the radial part of gravity and nothing else.');

  if (Math.abs(thDeg) > 8) {
    arcPoly(gDyn, PX, PY, 44, 0, th, { color: INK, width: 1.2 });
  }

  /* ----- optional decomposition construction ----- */
  var wTip = { x: bob.x, y: bob.y + WLEN };
  if (state.constr && tanLen > 6 && radLen > 6) {
    var rTip = { x: bob.x + radDir.x * radLen, y: bob.y + radDir.y * radLen };
    var tTip = { x: bob.x + tanDir.x * tanLen, y: bob.y + tanDir.y * tanLen };
    var cg = gDyn.group();
    cg.line(rTip.x, rTip.y, wTip.x, wTip.y).stroke({ color: GRAY, width: 1, dasharray: '4,4' });
    cg.line(tTip.x, tTip.y, wTip.x, wTip.y).stroke({ color: GRAY, width: 1, dasharray: '4,4' });
    addSeg(rTip.x, rTip.y, wTip.x, wTip.y);
    addSeg(tTip.x, tTip.y, wTip.x, wTip.y);
    interactive(cg, 'Parallelogram: the two components add back up to w = mg',
      'Vector decomposition',
      'The radial and tangential arrows are the two sides of a parallelogram whose diagonal is the weight itself. Adding them back together returns exactly w = mg, so nothing has been added or lost by resolving the vector.');
  }

  /* ----- force arrows ----- */
  var aTen = arrow(gDyn, bob.x, bob.y, bob.x + tenDir.x * tenLen, bob.y + tenDir.y * tenLen, NAVY, 3.4);
  interactive(aTen, 'F_T = mg cos \u03b8 + mv\u00b2/L \u2014 string tension, toward the pivot',
    'Tension F_T',
    'The string pulls the bob toward the pivot. It must both balance the radial weight component and supply the centripetal force for the circular path: F_T = mg cos \u03b8 + mv\u00b2/L. Only at the turning points, where v = 0, does it reduce to mg cos \u03b8. Tension is always perpendicular to the motion, so it does no work and can never push the bob back toward equilibrium.');

  var aRad = arrow(gDyn, bob.x, bob.y, bob.x + radDir.x * radLen, bob.y + radDir.y * radLen, CRIM, 3.2);
  interactive(aRad, '\u2212mg cos \u03b8 \u2014 radial component of the weight, along the string',
    'Radial component \u2212mg cos \u03b8',
    'This part of the weight lies along the string, pointing away from the pivot. The string\u2019s tension handles it, so it produces no acceleration along the arc \u2014 it only keeps the string taut and bends the path into a circle.');

  if (state.model === 'exact' || state.model === 'both') {
    var aTan = arrow(gDyn, bob.x, bob.y, bob.x + tanDir.x * tanLen, bob.y + tanDir.y * tanLen, CRIM, 3.4);
    interactive(aTan, '\u2212mg sin \u03b8 \u2014 the unbalanced restoring force',
      'Restoring force \u2212mg sin \u03b8',
      'Nothing balances the tangential part of the weight, so this is the net force along the arc. The minus sign means it always points back toward the hanging position, which is exactly what makes the motion oscillate: ma = \u2212mg sin \u03b8.');
  }
  var ox = bob.x, oy = bob.y;
  if (state.model === 'small' || state.model === 'both') {
    var off = (state.model === 'both') ? 11 : 0;
    ox = bob.x + radDir.x * off; oy = bob.y + radDir.y * off;
    var aLin = arrow(gDyn, ox, oy, ox + tanDir.x * linLen, oy + tanDir.y * linLen, ORANGE, 3.2);
    interactive(aLin, '\u2212mg\u03b8 \u2014 linear (small-angle) estimate of the restoring force',
      'Small-angle approximation',
      'Replacing sin \u03b8 by \u03b8 (in radians) makes the restoring force \u2212mg\u03b8 = \u2212(mg/L)s, exactly proportional to displacement. That is Hooke\u2019s law form, so the pendulum becomes a simple harmonic oscillator with period T = 2\u03c0\u221a(L/g).');
    if (state.model === 'both' && Math.abs(linLen - tanLen) > 5) {
      var e1 = { x: bob.x + tanDir.x * tanLen, y: bob.y + tanDir.y * tanLen };
      var e2 = { x: ox + tanDir.x * linLen, y: oy + tanDir.y * linLen };
      gDyn.line(e1.x, e1.y, e2.x, e2.y).stroke({ color: '#8a8a8a', width: 1, dasharray: '3,3' });
    }
  }

  var aW = arrow(gDyn, bob.x, bob.y, wTip.x, wTip.y, CRIM, 3.4);
  interactive(aW, 'w = mg \u2014 the weight, constant in size and always vertical',
    'Weight w = mg',
    'Gravity on the bob never changes in magnitude or direction. Everything interesting comes from resolving this one constant vector into a piece along the string and a piece tangent to the arc.');

  /* angle between weight and radial arrow, at the bob */
  if (Math.abs(thDeg) > 8 && radLen > 26) {
    arcPoly(gDyn, bob.x, bob.y, 31, 0, th, { color: INK, width: 1.1 });
  }

  /* bob drawn over the arrow tails */
  var bobEl = gDyn.circle(BOBR * 2).center(bob.x, bob.y).fill(bobGrad)
    .stroke({ color: '#5f5f5f', width: 0.8 });
  addRing(bob.x, bob.y, BOBR);
  interactive(bobEl, 'Bob of mass m', 'The bob',
    'The whole mass m is idealised as a point at the end of the string. Its acceleration along the arc is a = \u2212g sin \u03b8, independent of m \u2014 the mass cancels out of the equation of motion, so heavy and light bobs swing identically.');

  /* ----- local axes, upper right ----- */
  var AX = 372, AY = 176, AR = 38, BK = 22;
  var axg = gDyn.group();
  axg.line(AX - tenDir.x * BK, AY - tenDir.y * BK, AX + tenDir.x * (AR - 10), AY + tenDir.y * (AR - 10))
    .stroke({ color: INK, width: 0.9 });
  addSeg(AX - tenDir.x * BK, AY - tenDir.y * BK, AX + tenDir.x * AR, AY + tenDir.y * AR);
  arrow(axg, AX + tenDir.x * (AR - 12), AY + tenDir.y * (AR - 12), AX + tenDir.x * AR, AY + tenDir.y * AR, INK, 1.1, true);
  axg.line(AX - xDir.x * BK, AY - xDir.y * BK, AX + xDir.x * (AR - 10), AY + xDir.y * (AR - 10))
    .stroke({ color: INK, width: 0.9 });
  addSeg(AX - xDir.x * BK, AY - xDir.y * BK, AX + xDir.x * AR, AY + xDir.y * AR);
  arrow(axg, AX + xDir.x * (AR - 12), AY + xDir.y * (AR - 12), AX + xDir.x * AR, AY + xDir.y * AR, INK, 1.1, true);
  txt(axg, AX + tenDir.x * (AR + 6) - xDir.x * 15, AY + tenDir.y * (AR + 6) - xDir.y * 15,
    '+y', { italic: true, weight: 'bold', size: 13 });
  txt(axg, AX + xDir.x * (AR + 6) + tenDir.x * 15, AY + xDir.y * (AR + 6) + tenDir.y * 15,
    '+x', { italic: true, weight: 'bold', size: 13 });
  labelBoxes.push({ x1: AX - AR - 22, y1: AY - AR - 22, x2: AX + AR + 22, y2: AY + AR + 22 });
  interactive(axg, 'Local axes: +y along the string toward the pivot, +x tangent to the arc',
    'Rotated coordinate frame',
    'Choosing axes along and perpendicular to the string is what makes the problem easy: the string force lies entirely on +y, so the only equation with a net force is the tangential one, ma = \u2212mg sin \u03b8.');

  /* ================= labels (drawn last, collision-aware) ================= */

  /* small fixed-position symbols first, so they claim their canonical spots */
  if (Math.abs(thDeg) > 8) {
    txt(gDyn, PX + 57 * Math.sin(th / 2), PY + 57 * Math.cos(th / 2), '\u03b8', { italic: true, size: 15 });
    labelBoxes.push({
      x1: PX + 57 * Math.sin(th / 2) - 8, y1: PY + 57 * Math.cos(th / 2) - 9,
      x2: PX + 57 * Math.sin(th / 2) + 8, y2: PY + 57 * Math.cos(th / 2) + 9
    });
  }
  if (Math.abs(thDeg) > 8 && radLen > 26) {
    var bth = { x: bob.x + 44 * Math.sin(th / 2), y: bob.y + 44 * Math.cos(th / 2) };
    txt(gDyn, bth.x, bth.y, '\u03b8', { italic: true, size: 14 });
    labelBoxes.push({ x1: bth.x - 8, y1: bth.y - 9, x2: bth.x + 8, y2: bth.y + 9 });
  }

  /* L on the string */
  var lmx = PX + 0.45 * L * s, lmy = PY + 0.45 * L * c;
  smartLabel(gDyn, 'L', lmx, lmy, [
    [sg * 18 * c, -sg * 18 * s], [sg * 28 * c, -sg * 28 * s],
    [-sg * 20 * c, sg * 20 * s], [sg * 24 * c - 4, -sg * 24 * s - 16]
  ], { italic: true, size: 16, w: 12 });

  /* m beside the bob */
  smartLabel(gDyn, 'm', bob.x, bob.y, [
    [sg * 26, -11], [sg * 30, -24], [sg * 16, -28], [-sg * 28, -14]
  ], { italic: true, size: 16, w: 16 });

  /* s on the dashed arc (inside the arc, clear of the tangential arrow) */
  if (Math.abs(thDeg) > 8) {
    var ha = th / 2;
    var ax0 = PX + L * Math.sin(ha), ay0 = PY + L * Math.cos(ha);
    var inx = -Math.sin(ha), iny = -Math.cos(ha);
    smartLabel(gDyn, 's', ax0, ay0, [
      [inx * 20, iny * 20], [inx * 30, iny * 30], [inx * 40, iny * 40],
      [inx * 24 + Math.cos(ha) * 18 * sg, iny * 24 - Math.sin(ha) * 18 * sg]
    ], { italic: true, size: 16, w: 12, leader: true });
  }

  /* F_T beside the tension arrow */
  if (tenLen > 22) {
    var mx = bob.x + tenDir.x * tenLen * 0.55, my = bob.y + tenDir.y * tenLen * 0.55;
    var ft = findSpot(mx, my, [
      [sg * 24 * c, -sg * 24 * s], [sg * 34 * c, -sg * 34 * s],
      [sg * 26 * c + sg * 6, -sg * 26 * s + 18], [-sg * 26 * c, sg * 26 * s]
    ], 24, 18);
    subTxt(gDyn, ft.cx, ft.cy, 'F', 'T', { size: 16, color: NAVY });
  }

  /* w = mg under the weight arrow */
  smartLabel(gDyn, 'w = mg', wTip.x, wTip.y, [
    [0, 24], [-34, 26], [34, 26], [0, 38]
  ], { italic: true, size: 15, color: CRIM, w: 54 });

  /* -mg cos(theta) beyond the radial tip */
  if (radLen > 14) {
    var rT = { x: bob.x + radDir.x * Math.max(radLen, 34), y: bob.y + radDir.y * Math.max(radLen, 34) };
    smartLabel(gDyn, '\u2212mg cos \u03b8', rT.x, rT.y, [
      [radDir.x * 8 - tanDir.x * 34, radDir.y * 8 - tanDir.y * 34],
      [radDir.x * 20 - tanDir.x * 26, radDir.y * 20 - tanDir.y * 26],
      [radDir.x * 30, radDir.y * 30],
      [-tanDir.x * 46, -tanDir.y * 46],
      [radDir.x * 34 - tanDir.x * 44, radDir.y * 34 - tanDir.y * 44]
    ], { italic: true, size: 14, color: CRIM, w: 68, leader: true });
  }

  /* -mg sin(theta) beyond the tangential tip, kept below the dashed arc */
  if (tanLen > 12 && (state.model === 'exact' || state.model === 'both')) {
    var tT = { x: bob.x + tanDir.x * Math.max(tanLen, 30), y: bob.y + tanDir.y * Math.max(tanLen, 30) };
    smartLabel(gDyn, '\u2212mg sin \u03b8', tT.x, tT.y, [
      [tanDir.x * 12 + radDir.x * 20, tanDir.y * 12 + radDir.y * 20],
      [tanDir.x * 8 + radDir.x * 34, tanDir.y * 8 + radDir.y * 34],
      [tanDir.x * 26 + radDir.x * 14, tanDir.y * 26 + radDir.y * 14],
      [radDir.x * 46, radDir.y * 46],
      [tanDir.x * 30 + radDir.x * 44, tanDir.y * 30 + radDir.y * 44]
    ], { italic: true, size: 14, color: CRIM, w: 64, leader: true });
  }

  /* -mg theta beyond the orange tip */
  if (linLen > 12 && state.model !== 'exact') {
    var oT = { x: ox + tanDir.x * Math.max(linLen, 30), y: oy + tanDir.y * Math.max(linLen, 30) };
    smartLabel(gDyn, '\u2212mg \u03b8', oT.x, oT.y, [
      [tanDir.x * 12 + radDir.x * 20, tanDir.y * 12 + radDir.y * 20],
      [tanDir.x * 10 + radDir.x * 40, tanDir.y * 10 + radDir.y * 40],
      [tanDir.x * 28 + radDir.x * 34, tanDir.y * 28 + radDir.y * 34],
      [radDir.x * 54, radDir.y * 54],
      [tanDir.x * 40 + radDir.x * 54, tanDir.y * 40 + radDir.y * 54]
    ], { italic: true, size: 14, color: ORANGE, w: 44, leader: true });
  }

  updateReadoutPanel(thDeg, s, th);
}

function updateReadoutPanel(thDeg, sinv, rad) {
  var el = document.getElementById('readout');
  if (!el) return;
  var lin = document.getElementById('legendLinear');
  if (lin) lin.style.display = (state.model === 'exact') ? 'none' : 'flex';
  var err = Math.abs(sinv) < 1e-6 ? 0 : (Math.abs(rad) - Math.abs(sinv)) / Math.abs(sinv) * 100;
  var ft = Math.cos(rad) + (state.running ? (state.omega * state.omega) / G_OVER_L : 0);
  var lines = [
    '\u03b8      = ' + thDeg.toFixed(0) + '\u00b0  (' + rad.toFixed(3) + ' rad)',
    'sin \u03b8  = ' + sinv.toFixed(3),
    'F_tan  = ' + (-sinv).toFixed(3) + ' mg',
    'F_rad  = ' + (-Math.cos(rad)).toFixed(3) + ' mg',
    'F_T    = ' + ft.toFixed(3) + ' mg' + (state.running ? '  (swinging)' : '  (at rest)')
  ];
  if (state.model !== 'exact') {
    lines.push('\u03b8 (rad) = ' + Math.abs(rad).toFixed(3));
    lines.push('\u03b8 vs sin \u03b8 : +' + err.toFixed(1) + '%');
  }
  el.textContent = lines.join('\n');
}

/* ---------- interactions ---------- */
function update_thetaSlider(v) {
  stopSwing();
  state.theta = v;
  render();
}
function toggle_forceModel(v) { state.model = v; render(); }
function toggle_showConstruction(on) { state.constr = on; render(); }

function startSwing() {
  if (state.running) return;
  state.thRad = state.theta * Math.PI / 180;
  if (Math.abs(state.thRad) < 0.05) state.thRad = 25 * Math.PI / 180;
  state.omega = 0;
  state.running = true;
  document.getElementById('swingBtn').textContent = '\u23F8 Pause';
  lastT = 0;
  requestAnimationFrame(frame);
}
function stopSwing() {
  if (!state.running) return;
  state.running = false;
  state.omega = 0;
  document.getElementById('swingBtn').textContent = '\u25B6 Release the pendulum';
}
function trigger_swing() {
  if (state.running) { stopSwing(); render(); } else { startSwing(); }
}

var lastT = 0;
function frame(ts) {
  if (!state.running) return;
  if (!lastT) lastT = ts;
  var dt = Math.min(0.04, (ts - lastT) / 1000);
  lastT = ts;
  var n = 6, h = dt / n;
  for (var i = 0; i < n; i++) {
    state.omega += -G_OVER_L * Math.sin(state.thRad) * h;
    state.thRad += state.omega * h;
  }
  state.theta = state.thRad * 180 / Math.PI;
  document.getElementById('thetaSliderInput').value = Math.round(state.theta);
  document.getElementById('thetaSliderVal').value = Math.round(state.theta);
  render();
  requestAnimationFrame(frame);
}

/* ---------- demo steps ---------- */
var steps = [
  {
    t: 'The pendulum at rest',
    n: 'At \u03b8 = 0 the bob hangs on the dashed vertical. The weight w = mg points straight down along the string and is entirely balanced by the tension F_T \u2014 there is no tangential force, so nothing accelerates the bob.',
    theta: 0, model: 'exact', constr: false, swing: false
  },
  {
    t: 'Displace the bob and split the weight',
    n: 'At \u03b8 = 25\u00b0 the weight splits into \u2212mg cos \u03b8 along the string (opposed by tension) and \u2212mg sin \u03b8 tangent to the arc. Only the tangential piece is unbalanced, and it points back toward equilibrium along \u2212x. Tick \u201cShow weight-decomposition construction\u201d to see the parallelogram that builds those two arrows from w.',
    theta: 25, model: 'exact', constr: false, swing: false
  },
  {
    t: 'Push to a large angle',
    n: 'At 60\u00b0 the tangential arrow is long and the radial arrow has shrunk. The restoring force grows with displacement \u2014 but not in proportion to it, because it follows sin \u03b8, not \u03b8.',
    theta: 60, model: 'exact', constr: false, swing: false
  },
  {
    t: 'Sign flip through equilibrium',
    n: 'Released from 25\u00b0, the bob swings. Each time it crosses the dashed vertical the tangential arrow reverses direction, so the force always points back toward the centre \u2014 that is what sustains the oscillation. Watch F_T in the numbers: it peaks at the bottom, where mv\u00b2/L is largest.',
    theta: 25, model: 'exact', constr: false, swing: true
  },
  {
    t: 'The small-angle approximation',
    n: 'In compare view at 12\u00b0 the orange \u2212mg\u03b8 arrow nearly coincides with the crimson \u2212mg sin \u03b8 arrow: the restoring force is proportional to displacement, so the pendulum is a simple harmonic oscillator with T = 2\u03c0\u221a(L/g).',
    theta: 12, model: 'both', constr: false, swing: false
  },
  {
    t: 'Where the approximation breaks',
    n: 'At 50\u00b0 the two arrows visibly disagree \u2014 the true restoring force is weaker than the linear estimate (see the percentage error), the motion is no longer simple harmonic, and the real period lengthens.',
    theta: 50, model: 'both', constr: false, swing: false
  }
];
var curStep = 1;

function applyStep(i) {
  curStep = (i + steps.length) % steps.length;
  var st = steps[curStep];
  stopSwing();
  document.getElementById('thetaSliderInput').value = st.theta;
  document.getElementById('thetaSliderVal').value = st.theta;
  state.theta = st.theta;
  document.getElementById('forceModelInput').value = st.model;
  state.model = st.model;
  document.getElementById('showConstructionInput').checked = st.constr;
  state.constr = st.constr;
  document.getElementById('demoTitle').textContent = st.t;
  document.getElementById('demoNarration').textContent = st.n;
  document.getElementById('stepLabel').textContent = 'Step ' + (curStep + 1) + ' / ' + steps.length;
  if (st.swing) startSwing(); else render();
}
function nextStep() { applyStep(curStep + 1); }
function prevStep() { applyStep(curStep - 1); }

/* ---------- boot: default view matches the source figure (theta = 25 degrees) ---------- */
applyStep(1);
render();
window.__markRendered();
