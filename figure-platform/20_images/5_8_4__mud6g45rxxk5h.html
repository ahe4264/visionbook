<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<label><b>View</b>
  <select id="panelViewInput" onchange="toggle_panelView(this.value)">
    <option value="a">(a) whole plate</option>
    <option value="b">(b) n strips</option>
    <option value="c">(c) kth strip detail</option>
    <option value="all" selected>All three panels</option>
    <option value="anim">Single animated panel</option>
  </select>
</label>
<label>Number of strips n: <output id="nStripsVal">8</output>
  <input id="nStripsInput" type="range" min="1" max="60" step="1" value="8"
         oninput="document.getElementById('nStripsVal').value=this.value;update_nStrips(+this.value)">
</label>
<label>Strip index k: <output id="stripIndexVal">3</output>
  <input id="stripIndexInput" type="range" min="1" max="8" step="1" value="3"
         oninput="document.getElementById('stripIndexVal').value=this.value;update_stripIndex(+this.value)">
</label>
<button id="accumBtn" onclick="trigger_accumulate()">▶ Accumulate strip forces</button>
<span style="border-top:1px solid #dcdfe3;margin-top:6px;padding-top:4px;font-weight:bold">Guided demo</span>
<p id="demoNarration" style="margin:0;font-size:11.5px;line-height:1.45;max-width:100%"></p>
<span><button onclick="prevStep()">◀</button> <span id="stepLabel" style="padding:0 6px"></span> <button onclick="nextStep()">▶</button></span>
<span style="font-size:10px;color:#666;line-height:1.4">Tip: choose a single panel for the biggest view. Hover the plate, strips and arrows for values; click them for an explanation.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;

  g.line(sp.a, yw - 10, sp.a, yw + 10).stroke({ color: INK, width: 2 });
  g.line(sp.b, yw - 10, sp.b, yw + 10).stroke({ color: INK, width: 2 });
  g.line(sp.a, yw, sp.b, yw).stroke({ color: INK, width: 1.7 });
  hHead(g, sp.a, yw, -1); hHead(g, sp.b, yw, 1);
  var wl = txt(g, 'w(x*ₖ)', (sp.a + sp.b) / 2, yw, { size: 23, halo: 7 });
  hookup(wl, 'w(x*ₖ) = ' + widthM(us).toFixed(2) + ' m', 'Width of the strip',
    'The rectangle keeps the plate’s actual width at the sample depth, so its area is w(x*ₖ)·Δxₖ and its force is that area times the pressure ρ·h(x*ₖ).');
}

/* ---------------- animated accumulation panel -------------------- */
function drawPanelAnim(g, clip) {
  var n = state.n, m = (state.accumM == null) ? n : state.accumM, k;
  drawBlob(g);
  for (k = 1; k <= n; k++) {
    var y0 = byTo((k - 1) / n), y1 = byTo(k / n);
    var r = g.rect(PX1 - PX0 + 4, Math.max(1.2, y1 - y0)).move(PX0 - 2, y0)
      .fill(k <= m ? GREENDK : '#ffe6c2').opacity(k <= m ? 0.8 : 0.85)
      .stroke({ color: k <= m ? '#1d6b4d' : '#cfa268', width: (y1 - y0) > 4 ? 0.8 : 0.3 });
    r.clipWith(clip);
    (function (kk) {
      r.css('cursor', 'pointer')
        .on('mousemove', function (e) { showTooltip('strip ' + kk + ':  ρ·h·w·Δx = ' + kN(stripF(kk, n)) + ' kN', e); })
        .on('mouseleave', hideTooltip);
    })(k);
  }
  if (m > 0 && m < n) dashLine(g, byTo(m / n), AX, spanPix(m / n).b + 8);
  tickLab(g, PY_A, 'a'); tickLab(g, PY_B, 'b');
  var run = riemann(n, m);
  var gx = 540, gy0 = 56, gy1 = 216, gw = 26;
  g.rect(gw, gy1 - gy0).move(gx, gy0).fill('#ffffff').opacity(0.92).stroke({ color: '#444', width: 1.2 });
  var frac = clamp(run / EXACT, 0, 1);
  var bar = g.rect(gw, (gy1 - gy0) * frac).move(gx, gy0).fill(GREENDK).opacity(0.9);
  hookup(bar, 'running total = ' + kN(run) + ' kN  of  ' + kN(EXACT) + ' kN',
    'Accumulating the force',
    'The bar is the running sum of the strip forces, added from the surface downward. It climbs fastest where the plate is both wide and deep, because every strip contributes ρ·h·w·Δx.');
  txt(g, 'Σ', gx + gw / 2, gy0 - 16, { size: 22, halo: 4 });
  txt(g, kN(run) + ' kN', gx + gw / 2, gy1 + 16, { size: 17, style: 'normal', halo: 4 });
  txt(g, 'accumulated ' + m + ' of ' + n + ' strips', AX + 14, 40,
    { size: 20, style: 'normal', anchor: 'start', halo: 5 });
}

/* ---------------- readout (secondary, but legible) --------------- */
function readoutData() {
  var n = state.n, k = state.k, us = (k - 0.5) / n;
  var m = (state.view === 'anim' && state.accumM != null) ? state.accumM : n;
  return {
    n: n, k: k, m: m, us: us,
    sum: riemann(n, m), full: riemann(n, n),
    dx: (D_B - D_A) / n, h: depthOf(us), w: widthM(us), dF: stripF(k, n)
  };
}
function readoutHook(el) {
  hookup(el, 'Riemann sum vs. exact integral', 'From sum to integral',
    'Each strip contributes ρ·h(x*ₖ)·w(x*ₖ)·Δxₖ. Adding them gives the Riemann sum shown here; letting n → ∞ (Δxₖ → 0) makes the sum converge to the exact fluid force F = ∫ₐᵇ ρ h(x) w(x) dx, and the error collapses to zero.');
}
function buildReadoutColumn(g, w) {
  var d = readoutData(), H = 442;
  var box = g.rect(w, H).move(0, 0).radius(9).fill('#f7f8f9').stroke({ color: '#cfd5da', width: 1.3 });
  readoutHook(box);
  var cx = w / 2, err = Math.abs(d.full - EXACT) / EXACT * 100;
  txt(g, 'Riemann sum → integral', cx, 28, { size: 21, style: 'normal', weight: 'bold', family: 'sans-serif', fill: '#333' });
  g.line(16, 44, w - 16, 44).stroke({ color: '#dfe3e7', width: 1 });
  txt(g, 'F ≈ Σ ρ h(x*ₖ) w(x*ₖ) Δxₖ', cx, 74, { size: 21, fill: '#222' });
  txt(g, 'n → ∞   ⇓', cx, 106, { size: 19, style: 'normal', fill: '#666' });
  txt(g, 'F = ∫ₐᵇ ρ h(x) w(x) dx', cx, 138, { size: 21, fill: '#222' });
  g.line(16, 162, w - 16, 162).stroke({ color: '#dfe3e7', width: 1 });
  var lines = [
    'n = ' + d.n + '   Δxₖ = ' + d.dx.toFixed(2) + ' m',
    'Σ = ' + kN(d.sum) + ' kN' + (d.m < d.n ? '  (' + d.m + '/' + d.n + ')' : ''),
    'exact = ' + kN(EXACT) + ' kN',
    'error = ' + err.toFixed(2) + ' %'
  ];
  for (var i = 0; i < lines.length; i++)
    txt(g, lines[i], cx, 190 + i * 28, { size: 20, style: 'normal', fill: '#555' });
  g.line(16, 310, w - 16, 310).stroke({ color: '#dfe3e7', width: 1 });
  var l2 = [
    'strip k = ' + d.k,
    'h(x*ₖ) = ' + d.h.toFixed(2) + ' m',
    'w(x*ₖ) = ' + d.w.toFixed(2) + ' m',
    'ΔF = ' + kN(d.dF) + ' kN'
  ];
  for (var j = 0; j < l2.length; j++)
    txt(g, l2[j], cx, 338 + j * 28, { size: 20, style: 'normal', fill: '#777' });
  return H;
}
function buildReadoutRow(g, w) {
  var d = readoutData(), H = 104;
  var box = g.rect(w, H).move(0, 0).radius(8).fill('#f7f8f9').stroke({ color: '#cfd5da', width: 1.3 });
  readoutHook(box);
  var cx = w / 2, err = Math.abs(d.full - EXACT) / EXACT * 100;
  txt(g, 'F ≈ Σ ρ h(x*ₖ) w(x*ₖ) Δxₖ      ⟶      F = ∫ₐᵇ ρ h(x) w(x) dx', cx, 28, { size: 25, fill: '#222' });
  txt(g, 'n = ' + d.n + '    Σ = ' + kN(d.sum) + ' kN' + (d.m < d.n ? ' (' + d.m + '/' + d.n + ')' : '') +
    '    exact = ' + kN(EXACT) + ' kN    error = ' + err.toFixed(2) + ' %',
    cx, 58, { size: 21, style: 'normal', fill: '#555' });
  txt(g, 'strip k = ' + d.k + ':  h(x*ₖ) = ' + d.h.toFixed(2) + ' m,  w(x*ₖ) = ' + d.w.toFixed(2) +
    ' m,  Δxₖ = ' + d.dx.toFixed(2) + ' m  →  ΔF = ' + kN(d.dF) + ' kN',
    cx, 84, { size: 20, style: 'normal', fill: '#777' });
  return H;
}

/* ---------------- render ----------------------------------------- */
function render() {
  draw.clear();
  WATER = draw.gradient('linear', function (add) {
    add.stop(0, '#eaf7fd'); add.stop(0.5, '#bce4f5'); add.stop(1, '#7cc8ea');
  }).from(0, 0).to(0, 1);
  var clip = makeClip();

  var views = (state.view === 'all') ? ['a', 'b', 'c'] : [state.view];
  var N = views.length;
  var VW = 1000, VH = clamp(Math.round(1000 * CH / Math.max(1, CW)), 420, 2600);
  draw.viewbox(0, 0, VW, VH);

  var stackH = N * BLOCK, pad = 10;
  var leftW = VW - SIDEW - 24;
  var sSide = Math.min((leftW - pad) / PW, (VH - 2 * pad) / stackH);
  var sRow = Math.min((VW - 2 * pad) / PW, (VH - ROWH - 2 * pad) / stackH);
  var side = sSide >= sRow;
  var s = Math.min(side ? sSide : sRow, 2.6);

  var blockW = PW * s, blockH = stackH * s;
  var ox = side ? Math.max(pad, (leftW - blockW) / 2) : (VW - blockW) / 2;
  var oy = side ? (VH - blockH) / 2 : Math.max(pad, (VH - ROWH - blockH) / 2);

  for (var i = 0; i < N; i++) {
    var v = views[i];
    var g = draw.group().attr('transform',
      'translate(' + ox.toFixed(2) + ',' + (oy + i * BLOCK * s).toFixed(2) + ') scale(' + s.toFixed(4) + ')');
    panelFrame(g);
    if (v === 'a') drawPanelA(g, clip);
    else if (v === 'b') drawPanelB(g, clip);
    else if (v === 'c') drawPanelC(g, clip);
    else drawPanelAnim(g, clip);
    var cap = v === 'a' ? '(a)' : v === 'b' ? '(b)' : v === 'c' ? '(c)' : '(d)  accumulating the strip forces';
    txt(g, cap, (AX + RIGHT) / 2, CAPY, { size: v === 'anim' ? 22 : 30 });
  }

  /* readout */
  var rg = draw.group();
  if (side) {
    var Hc = buildReadoutColumn(rg, SIDEW);
    var rs = Math.min(1, (VH - 20) / Hc);
    rg.attr('transform', 'translate(' + (VW - SIDEW - 10) + ',' + ((VH - Hc * rs) / 2).toFixed(2) +
      ') scale(' + rs.toFixed(4) + ')');
  } else {
    var rw = clamp(blockW, 620, VW - 20);
    var Hr = buildReadoutRow(rg, 640);
    var rr = Math.min(rw / 640, (ROWH - 8) / Hr);
    rg.attr('transform', 'translate(' + ((VW - 640 * rr) / 2).toFixed(2) + ',' +
      (oy + blockH + 8).toFixed(2) + ') scale(' + rr.toFixed(4) + ')');
  }
}

/* ---------------- controls --------------------------------------- */
function setN(v) {
  state.n = clamp(Math.round(v), 1, 60);
  var ni = document.getElementById('nStripsInput'); if (ni) ni.value = state.n;
  var no = document.getElementById('nStripsVal'); if (no) no.value = state.n;
  var ki = document.getElementById('stripIndexInput'); if (ki) ki.max = state.n;
  if (state.k > state.n) setK(state.n);
  if (state.accumM != null) state.accumM = Math.min(state.accumM, state.n);
}
function setK(v) {
  state.k = clamp(Math.round(v), 1, state.n);
  var ki = document.getElementById('stripIndexInput'); if (ki) ki.value = state.k;
  var ko = document.getElementById('stripIndexVal'); if (ko) ko.value = state.k;
}
function update_nStrips(v) { stopAnim(); setN(v); if (state.view === 'anim') state.accumM = state.n; render(); }
function update_stripIndex(v) { setK(v); render(); }
function toggle_panelView(v) {
  stopAnim(); state.view = v;
  if (v === 'anim' && state.accumM == null) state.accumM = state.n;
  render();
}
function stopAnim() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  var b = document.getElementById('accumBtn'); if (b) b.textContent = '▶ Accumulate strip forces';
}
function startAnim() {
  stopAnim();
  state.accumM = 0; render();
  var b = document.getElementById('accumBtn'); if (b) b.textContent = '■ Stop';
  animTimer = setInterval(function () {
    state.accumM++;
    if (state.accumM >= state.n) { state.accumM = state.n; stopAnim(); }
    render();
  }, Math.max(40, Math.min(220, 2600 / state.n)));
}
function trigger_accumulate() {
  if (animTimer) { stopAnim(); state.accumM = state.n; render(); return; }
  if (state.view !== 'anim') {
    state.view = 'anim';
    var sel = document.getElementById('panelViewInput'); if (sel) sel.value = 'anim';
  }
  startAnim();
}

/* ---------------- guided demo ------------------------------------ */
var STEPS = [
  { t: 'The whole submerged plate',
    n: 'A flat plate hangs vertically in the fluid between depths a and b. At any depth x it has width w(x) and lies under depth h(x) of fluid — but pressure is <i>not</i> constant over the plate, so the force is not just pressure × area.',
    s: { view: 'a', n: 1, k: 1 } },
  { t: 'Slice it into horizontal strips',
    n: 'Partition the depth interval a = x₀ &lt; x₁ &lt; … &lt; xₙ = b. Each horizontal band Aₖ is thin enough that the depth — and therefore the pressure — barely changes across it.',
    s: { view: 'b', n: 8, k: 3 } },
  { t: 'Zoom in on the kth strip',
    n: 'Pick a sample depth x*ₖ inside [xₖ₋₁, xₖ]. Approximate the band by a rectangle of width w(x*ₖ) and thickness Δxₖ at the uniform depth h(x*ₖ): its force is ρ·h(x*ₖ)·w(x*ₖ)·Δxₖ.',
    s: { view: 'c', n: 8, k: 4 } },
  { t: 'Walk down the plate',
    n: 'Slide k from top to bottom: h(x*ₖ) grows steadily while w(x*ₖ) first grows, then shrinks through the bean-shaped notch. Deep <i>and</i> wide strips dominate the total force.',
    s: { view: 'all', n: 8, k: 7 } },
  { t: 'Add up the strips',
    n: 'Accumulating the strip forces from the surface downward builds the Riemann sum F ≈ Σ ρ h(x*ₖ) w(x*ₖ) Δxₖ; the running total climbs fastest through the widest, deepest part of the plate.',
    s: { view: 'anim', n: 8, k: 8 } },
  { t: 'Refine the partition',
    n: 'Raise n and the rectangles fill the plate almost exactly; the sum settles onto the exact value F = ∫ₐᵇ ρ h(x) w(x) dx and the error readout collapses toward zero.',
    s: { view: 'anim', n: 48, k: 24 } }
];
var stepIdx = 0;
function applyStep(i) {
  stepIdx = (i + STEPS.length) % STEPS.length;
  var st = STEPS[stepIdx];
  stopAnim();
  state.view = st.s.view;
  var sel = document.getElementById('panelViewInput'); if (sel) sel.value = st.s.view;
  setN(st.s.n); setK(st.s.k);
  state.accumM = state.n;
  document.getElementById('demoNarration').innerHTML =
    '<b>' + (stepIdx + 1) + '. ' + st.t + '</b><br>' + st.n;
  document.getElementById('stepLabel').textContent = 'Step ' + (stepIdx + 1) + ' / ' + STEPS.length;
  render();
  if (st.s.view === 'anim') startAnim();
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

/* ---------------- resize + init ---------------------------------- */
(function measure() {
  var c = document.getElementById('container'), st = getComputedStyle(c);
  var px = (parseFloat(st.paddingLeft) || 0) + (parseFloat(st.paddingRight) || 0);
  var py = (parseFloat(st.paddingTop) || 0) + (parseFloat(st.paddingBottom) || 0);
  CW = Math.max(120, c.clientWidth - px);
  CH = Math.max(120, c.clientHeight - py);
})();
document.addEventListener('fig-resize', function (e) {
  CW = Math.max(120, e.detail.width || CW);
  CH = Math.max(120, e.detail.height || CH);
  render();
});

setN(8); setK(3);
document.getElementById('demoNarration').innerHTML = '<b>1. ' + STEPS[0].t + '</b><br>' + STEPS[0].n;
document.getElementById('stepLabel').textContent = 'Step 1 / ' + STEPS.length;
render();
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
