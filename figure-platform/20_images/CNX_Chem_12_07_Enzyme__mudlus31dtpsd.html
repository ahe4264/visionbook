<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<strong style="font-size:12px">Enzyme–substrate binding</strong>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#222"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;min-width:54px;text-align:center">1 / 5</span>
  <button onclick="nextStep()">▶</button>
</span>
<label style="margin-top:4px"><span style="display:flex;gap:5px;align-items:center"><input id="modelToggleInput" type="checkbox" onchange="toggle_modelToggle(this.checked)"> Induced fit model <span style="color:#777">(off = lock-and-key)</span></span></label>
<label>Binding progress (left scene): <output id="bindingProgressVal">0</output>
  <input id="bindingProgressInput" type="range" min="0" max="1" step="0.01" value="0" oninput="document.getElementById('bindingProgressVal').value=this.value;update_bindingProgress(+this.value)">
</label>
<button onclick="trigger_playBinding()">▶ Play substrate docking</button>
<label><span style="display:flex;gap:5px;align-items:center"><input id="showGhostOutlineInput" type="checkbox" onchange="toggle_showGhostOutline(this.checked)"> Show original active-site outline</span></label>
<span style="font-size:10px;color:#666;line-height:1.4">Left scene = substrates approaching (slider). Right scene = finished complex. Hover any shape for its name; click for a short explanation.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
(function () {
  var EF = '#e9f2cd', ES = '#7aa42a';            // enzyme fill / olive outline
  var SF = '#c5b3e0', SS = '#5a4280';            // substrate lavender / dark purple
  var PINK = '#ddab99', TAN = '#d8a984', PS = '#8d6a58';
  var INK = '#111111';

  var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
  draw.viewbox(0, 0, 510, 484);
  var root = draw.group();

  var state = { induced: false, p: 0, ghost: false };
  var animId = 0;

  var RIM = 252, BOT = 388, HW = 100, CXL = 135, CXR = 375;

  function clamp(t) { return t < 0 ? 0 : (t > 1 ? 1 : t); }
  function ease(t) { t = clamp(t); return t * t * (3 - 2 * t); }
  function f(n) { return Math.round(n * 10) / 10; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function P(p) { return f(p[0]) + ' ' + f(p[1]); }

  // ── cleft profile: [dx from centre, depth below rim] ─────────────────────
  //  0 rim-L · 1 entry wall · 2,3 rounded well floor · 4 wall · 5 central
  //  spike · 6 wall · 7 V floor · 8 wall · 9 rim-R
  var BASE = [
    [-26, 0], [-24, 22], [-21, 44], [-5, 44], [-2, 22],
    [0, -6], [3, 22], [13, 49], [22, 22], [26, 0]
  ];
  function warp(wf, df, spike, rim) {
    return BASE.map(function (q, i) {
      var y = q[1] * df;
      if (i === 5) y = spike;
      if (i === 0 || i === 9) y = rim;
      return [q[0] * wf, y];
    });
  }
  var OPEN = warp(1.42, 0.34, 6, 0);      // induced fit, free enzyme: broad & shallow
  var SHUT = warp(0.90, 1.10, -11, -8);   // induced fit, bound: pinched & curled up

  function cleftPts(cx, p) {
    var off = BASE;
    if (state.induced) {
      var t = ease((p - 0.12) / 0.82);
      off = [];
      for (var i = 0; i < BASE.length; i++) {
        off.push([lerp(OPEN[i][0], SHUT[i][0], t), lerp(OPEN[i][1], SHUT[i][1], t)]);
      }
    }
    return off.map(function (q) { return [cx + q[0], RIM + q[1]]; });
  }

  function enzymePath(cx, c) {
    var s = [];
    s.push('M ' + (cx - HW) + ' ' + (BOT - 22));
    s.push('C ' + (cx - HW - 3) + ' 342 ' + (cx - HW + 8) + ' 296 ' + (cx - 72) + ' 276');
    s.push('C ' + (cx - 54) + ' 262 ' + (cx - 44) + ' 256 ' + P(c[0]));
    s.push('L ' + P(c[1]));
    s.push('C ' + f(c[2][0]) + ' ' + f(c[2][1] + 7) + ' ' + f(c[3][0]) + ' ' + f(c[3][1] + 7) + ' ' + P(c[4]));
    s.push('L ' + P(c[5]));
    s.push('L ' + P(c[6]));
    s.push('L ' + P(c[7]));
    s.push('L ' + P(c[8]));
    s.push('L ' + P(c[9]));
    s.push('C ' + (cx + 44) + ' 256 ' + (cx + 54) + ' 262 ' + (cx + 72) + ' 276');
    s.push('C ' + (cx + HW - 8) + ' 296 ' + (cx + HW + 3) + ' 342 ' + (cx + HW) + ' ' + (BOT - 22));
    s.push('Q ' + (cx + HW) + ' ' + BOT + ' ' + (cx + HW - 22) + ' ' + BOT);
    s.push('L ' + (cx - HW + 22) + ' ' + BOT);
    s.push('Q ' + (cx - HW) + ' ' + BOT + ' ' + (cx - HW) + ' ' + (BOT - 22) + ' Z');
    return s.join(' ');
  }

  function inter(el, tip, title, body) {
    el.css('cursor', 'pointer');
    el.on('mousemove', function (e) { showTooltip(tip, e); });
    el.on('mouseleave', function () { hideTooltip(); });
    el.on('click', function () { showPopup(title, body); });
  }

  function txt(g, x, y, s, size, color, anchor) {
    var t = g.text(s).font({ family: 'sans-serif', size: size, anchor: anchor || 'middle' })
      .fill(color || INK).attr({ x: x, y: y, 'dominant-baseline': 'alphabetic' });
    t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': 3.5, 'stroke-linejoin': 'round' });
    return t;
  }

  function wedge(g, x1, y1, x2, y2, op) {
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var hl = 15, hw = 7;
    var bx = x2 - hl * Math.cos(ang), by = y2 - hl * Math.sin(ang);
    var px = -Math.sin(ang), py = Math.cos(ang);
    var gg = g.group().opacity(op);
    gg.polygon([
      [x1 + 1.1 * px, y1 + 1.1 * py], [bx + 2.4 * px, by + 2.4 * py],
      [bx - 2.4 * px, by - 2.4 * py], [x1 - 1.1 * px, y1 - 1.1 * py]
    ]).fill(INK);
    gg.polygon([[x2, y2], [bx + hw * px, by + hw * py], [bx - hw * px, by - hw * py]]).fill(INK);
    return gg;
  }

  // ── substrates, drawn in BOUND position about centre cx ─────────────────
  function substrateA(g, cx) {
    var gp = g.group();
    gp.path('M ' + cx + ' 150 L ' + (cx - 44) + ' 150 Q ' + (cx - 66) + ' 150 ' + (cx - 66) + ' 172 ' +
      'L ' + (cx - 66) + ' 224 Q ' + (cx - 66) + ' 246 ' + (cx - 44) + ' 246 L ' + cx + ' 246 Z')
      .fill(SF).stroke({ color: SS, width: 3.4, linejoin: 'round' });
    gp.path('M ' + (cx - 20) + ' 240 L ' + (cx - 6) + ' 240 L ' + (cx - 6) + ' 280 L ' + (cx - 20) + ' 280 Z')
      .fill(SF).stroke({ color: SS, width: 2.8, linejoin: 'round' });
    var tip = gp.path('M ' + (cx - 20) + ' 272 L ' + (cx - 6) + ' 272 L ' + (cx - 6) + ' 282 ' +
      'Q ' + (cx - 6) + ' 292 ' + (cx - 13) + ' 292 Q ' + (cx - 20) + ' 292 ' + (cx - 20) + ' 282 Z')
      .fill(PINK).stroke({ color: SS, width: 2.4, linejoin: 'round' });
    inter(gp, 'Substrate 1 — boxy body with a rectangular peg',
      'Substrate',
      'Substrates are the reactant molecules an enzyme acts on. Only a molecule whose shape and chemistry are complementary to the active site can dock there — that complementarity is the origin of enzyme specificity.');
    inter(tip, 'Contact patch — rounded peg tip, matches the rounded well',
      'Complementary contact patch',
      'The coloured tip is the part of the substrate that actually touches the active site. Its shape, and the weak chemical interactions it forms with the matching patch inside the cleft, decide whether binding happens at all.');
    return gp;
  }

  function substrateB(g, cx) {
    var gp = g.group();
    gp.path('M ' + cx + ' 146 C ' + (cx + 40) + ' 131 ' + (cx + 72) + ' 157 ' + (cx + 74) + ' 192 ' +
      'C ' + (cx + 76) + ' 225 ' + (cx + 50) + ' 246 ' + (cx + 26) + ' 246 L ' + cx + ' 246 Z')
      .fill(SF).stroke({ color: SS, width: 3.4, linejoin: 'round' });
    gp.path('M ' + (cx + 6) + ' 240 L ' + (cx + 21) + ' 240 L ' + (cx + 20) + ' 280 L ' + (cx + 7) + ' 280 Z')
      .fill(SF).stroke({ color: SS, width: 2.8, linejoin: 'round' });
    var tip = gp.path('M ' + (cx + 7) + ' 276 L ' + (cx + 20) + ' 276 L ' + (cx + 13.5) + ' 297 Z')
      .fill(TAN).stroke({ color: SS, width: 2.4, linejoin: 'round' });
    inter(gp, 'Substrate 2 — rounded body with a tapered peg',
      'Substrate',
      'Many enzymes bring two substrates together. Each carries its own peg, so the pair can only be joined once both are seated correctly in the active site.');
    inter(tip, 'Contact patch — tapered tip, matches the V-shaped pocket',
      'Complementary contact patch',
      'This tapered tip fits the V-shaped half of the cleft. It differs from the other substrate\'s rounded peg: the active site reads both shapes, so a wrong molecule simply cannot seat.');
    return gp;
  }

  var PATCH_T = 'Active-site contact patches — complementary to the substrate tips';
  var PATCH_TITLE = 'Active-site contact patch';
  var PATCH_BODY = 'These coloured regions are amino-acid side chains that grip the substrate. Their arrangement mirrors the substrate tips, so a non-matching molecule makes no contacts and drifts away.';

  // ── one enzyme + its substrates ─────────────────────────────────────────
  function drawScene(g, cx, p, isLeft) {
    var c = cleftPts(cx, p);

    var body = g.path(enzymePath(cx, c)).fill(EF).stroke({ color: ES, width: 5, linejoin: 'round' });
    inter(body, 'Enzyme — protein catalyst',
      'Enzyme',
      'The enzyme is a folded protein whose surface carries a small pocket, the active site. The bulk of the protein exists mainly to hold that pocket in exactly the right shape.');

    // well floor depth of the cubic segment
    var yWell = (c[1][1] + 3 * (c[2][1] + 7) + 3 * (c[3][1] + 7) + c[4][1]) / 8;
    var rimY = Math.min(c[0][1], c[9][1]);
    var ryL = Math.max(2.4, Math.min(8, (yWell - rimY) * 0.22));
    var lp = g.ellipse((c[3][0] - c[2][0]) + 20, ryL * 2)
      .center((c[2][0] + c[3][0]) / 2, yWell - ryL * 0.9)
      .fill(PINK).stroke({ color: PS, width: 1.5 });
    var hR = Math.max(4, Math.min(15, (c[7][1] - c[5][1]) * 0.40));
    var wR = Math.max(4, (c[8][0] - c[6][0]) * 0.30);
    var rp = g.polygon([
      [c[7][0] - wR, c[7][1] - hR], [c[7][0] + wR, c[7][1] - hR], [c[7][0], c[7][1] - 2]
    ]).fill(TAN).stroke({ color: PS, width: 1.5, linejoin: 'round' });
    inter(lp, PATCH_T, PATCH_TITLE, PATCH_BODY);
    inter(rp, PATCH_T, PATCH_TITLE, PATCH_BODY);

    if (state.ghost) {
      var g0 = g.path(enzymePath(cx, cleftPts(cx, 0))).fill('none')
        .stroke({ color: '#7d7d7d', width: 2.5, linejoin: 'round' }).attr('stroke-dasharray', '9,6');
      inter(g0, state.induced ? 'Original (unbound) contour — the cleft has moved'
        : 'Original (unbound) contour — identical to the bound one',
        'Original active-site outline',
        state.induced
          ? 'The dashed line is the free enzyme\'s surface. In induced fit the solid outline pulls away from it: the enzyme changes shape as the substrate arrives.'
          : 'The dashed line is the free enzyme\'s surface. In the lock-and-key model it lies exactly on the bound outline — the pocket is rigid and pre-formed.');
    }

    var hitY = rimY - 12;
    var hit = g.rect((c[9][0] - c[0][0]) + 18, (Math.max(yWell, c[7][1]) - hitY) + 18)
      .move(c[0][0] - 9, hitY).fill({ color: '#ffffff', opacity: 0.01 });
    inter(hit, 'Active site — the cleft where catalysis happens',
      'Active site',
      'The active site is a small cleft only a handful of amino acids wide. Its shape and chemistry decide which substrates bind; in induced fit that shape is finalised only once the substrate is in place.');

    var hx = ease(p / 0.45), vy = ease((p - 0.28) / 0.72);
    var dx = 58 * (1 - hx), dy = 92 * (1 - vy);

    var gA = g.group(); substrateA(gA, cx); gA.transform({ translate: [-dx, -dy] });
    var gB = g.group(); substrateB(gB, cx); gB.transform({ translate: [dx, -dy] });

    var seamOp = clamp((p - 0.42) / 0.25);
    if (seamOp > 0.01) {
      g.line(cx, 145 - dy, cx, 252 - dy).stroke({ color: INK, width: 5, linecap: 'butt' }).opacity(seamOp);
    }

    var aOp = clamp(1 - p / 0.45);
    if (aOp > 0.02 && isLeft) {
      wedge(g, cx - 24, 186, cx - 9, 242, aOp);
      wedge(g, cx + 26, 186, cx + 7, 242, aOp);
    }
    return c;
  }

  function render() {
    root.clear();
    var p = state.p;
    var cL = drawScene(root, CXL, p, true);
    drawScene(root, CXR, 1, false);

    var lbl = root.group();

    // "Substrates" + leader lines (left scene only, fades as they dock)
    var subOp = clamp(1 - p / 0.42);
    if (subOp > 0.02) {
      var gs = lbl.group().opacity(subOp);
      gs.line(CXL - 42, 36, CXL - 88, 66).stroke({ color: INK, width: 1.6 });
      gs.line(CXL + 42, 36, CXL + 88, 66).stroke({ color: INK, width: 1.6 });
      txt(gs, CXL, 28, 'Substrates', 17);
    }

    // centre caption for the approaching scene
    var modOp = clamp(1 - p / 0.36);
    if (modOp > 0.02) {
      var gm = lbl.group().opacity(modOp);
      var lines = state.induced ? ['Active', 'site', 'changes', 'to fit'] : ['Active', 'site is', 'proper', 'shape'];
      for (var i = 0; i < lines.length; i++) txt(gm, CXL, 82 + i * 21, lines[i], 16.5);
    }

    // complex label over the right (finished) scene
    var cl = ['Substrate', 'complex', 'formed'];
    for (var j = 0; j < cl.length; j++) txt(lbl, CXR, 48 + j * 21, cl[j], 16.5);

    // the same label appears on the left once it, too, is a complex
    var cOp = clamp((p - 0.64) / 0.28);
    if (cOp > 0.02) {
      var gc = lbl.group().opacity(cOp);
      for (var k = 0; k < cl.length; k++) txt(gc, CXL, 48 + k * 21, cl[k], 16.5);
    }

    // conformational-change callout (induced fit only)
    if (state.induced) {
      var op = clamp((p - 0.15) / 0.25) * 0.95 + 0.05;
      var gcb = lbl.group().opacity(op);
      var midX = (cL[0][0] + cL[9][0]) / 2;
      var yWellL = (cL[1][1] + 3 * (cL[2][1] + 7) + 3 * (cL[3][1] + 7) + cL[4][1]) / 8;
      gcb.ellipse((cL[9][0] - cL[0][0]) + 26, (yWellL - cL[0][1]) + 34)
        .center(midX, (cL[0][1] + yWellL) / 2 + 2)
        .fill('none').stroke({ color: '#8a8a8a', width: 1.3 }).attr('stroke-dasharray', '4,4');
      gcb.line(midX, yWellL + 20, CXL, 322).stroke({ color: '#8a8a8a', width: 1.2 }).attr('stroke-dasharray', '3,3');
      txt(gcb, CXL, 338, 'active site reshapes', 12, '#555');
    }

    txt(lbl, CXL, 418, 'Enzyme', 17);
    txt(lbl, CXR, 418, 'Enzyme', 17);
    txt(lbl, (CXL + CXR) / 2, 466, state.induced ? '(b) Induced fit model' : '(a) Lock-and-key model', 17);
  }

  // ── control handlers ────────────────────────────────────────────────────
  window.toggle_modelToggle = function (on) { state.induced = !!on; render(); };
  window.update_bindingProgress = function (v) { state.p = v; render(); };
  window.toggle_showGhostOutline = function (on) { state.ghost = !!on; render(); };
  window.trigger_playBinding = function () {
    if (animId) cancelAnimationFrame(animId);
    var t0 = null, dur = 2300;
    var slider = document.getElementById('bindingProgressInput');
    var out = document.getElementById('bindingProgressVal');
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var k = clamp((ts - t0) / dur);
      state.p = k;
      slider.value = k; out.value = Math.round(k * 100) / 100;
      render();
      if (k < 1) { animId = requestAnimationFrame(frame); } else { animId = 0; }
    }
    state.p = 0; slider.value = 0; out.value = 0; render();
    animId = requestAnimationFrame(frame);
  };

  // ── demo steps ──────────────────────────────────────────────────────────
  var steps = [
    { title: 'Free enzyme and substrates',
      narration: 'Two scenes of the same enzyme: on the left the substrates are still approaching, on the right they are already bound as a complex. Hover any part to name it — enzyme body, the notched active-site cleft, and the small coloured contact patches whose shapes must match the substrate pegs.',
      state: { induced: false, p: 0, ghost: false } },
    { title: 'Lock-and-key: the pocket is already right',
      narration: 'Drag binding progress forward and the left scene becomes the right one. Trace the cleft: the dashed ghost of the free enzyme never separates from the solid outline. The active site is a rigid, pre-formed shape.',
      state: { induced: false, p: 1, ghost: true } },
    { title: 'Switch to induced fit, unbound',
      narration: 'The free enzyme on the left now shows a broad, shallow depression instead of a snug notch — it does not yet match the pegs. Under strict lock-and-key logic nothing should bind here, yet the right scene shows the complex does form.',
      state: { induced: true, p: 0, ghost: false } },
    { title: 'Induced fit: the pocket closes in',
      narration: 'Sweep the slider again. As the substrates descend, the olive surface deepens and curls inward to hug the pegs; the dashed ghost marks where the cleft used to be, and the dotted ellipse flags the region that moved.',
      state: { induced: true, p: 1, ghost: true } },
    { title: 'Compare the two complexes',
      narration: 'Play the docking animation in each mode back to back. Both end in the same tight complex — the difference is whether the enzyme had to move to get there. Fit can be a consequence of binding, not a precondition for it.',
      state: { induced: true, p: 1, ghost: false } }
  ];
  var cur = 0;

  function applyStep(i) {
    if (animId) { cancelAnimationFrame(animId); animId = 0; }
    cur = (i + steps.length) % steps.length;
    var s = steps[cur];
    state.induced = s.state.induced;
    state.p = s.state.p;
    state.ghost = s.state.ghost;
    document.getElementById('modelToggleInput').checked = state.induced;
    document.getElementById('bindingProgressInput').value = state.p;
    document.getElementById('bindingProgressVal').value = state.p;
    document.getElementById('showGhostOutlineInput').checked = state.ghost;
    document.getElementById('demoNarration').innerHTML = '<b>' + s.title + '</b><br>' + s.narration;
    document.getElementById('stepLabel').textContent = (cur + 1) + ' / ' + steps.length;
    render();
  }
  window.nextStep = function () { applyStep(cur + 1); };
  window.prevStep = function () { applyStep(cur - 1); };

  applyStep(0);
  window.__markRendered();
})();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
