<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Lightweight hover tooltip for generated 3D explainers ───────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body><div data-gallery-back-button><a href="http://127.0.0.1:8976/gallery.html" style="position:fixed;left:14px;top:14px;z-index:2147483647;background:rgba(15,23,42,.92);color:#fff;border:1px solid rgba(148,163,184,.55);border-radius:999px;padding:8px 12px;font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.25)">&#8249; Back to gallery</a></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    // Show error overlay if module scripts fail or take too long
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    // Timeout fallback: if nothing renders in 12s, show overlay
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    let camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // HOME view will be computed from the scene bounds so different scenes
    // (especially tall ones) get a consistent starting zoom/angle while
    // still allowing interactive OrbitControls.
    const HOME_POS = new THREE.Vector3();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    let HOME_ZOOM = 0.75;

    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      camera.zoom = HOME_ZOOM;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // Framing parameters
    const FRAME_HALF_HEIGHT = d; // base frustum half-height used when computing zoom
    const FRAME_MARGIN = 0.08;   // fraction of extra space around content
    const MIN_ZOOM = 0.2;
    const MAX_ZOOM = 5;

    function computeSceneBounds() {
      const box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) {
        // fallback box so empty scenes get a sensible frame
        box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(2 * d, 2 * d, 2 * d));
      }
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { box, center, size };
    }

    /**
     * setCameraView(options)
     * - azimuthDeg: horizontal angle around Y axis, in degrees.
     * - elevationDeg: angle above the ground/XZ plane, in degrees.
     * - zoom: optional orthographic zoom. If omitted, derived from content bounds.
     * - target: optional [x,y,z] camera target. If omitted, uses scene bounds center.
     * - heightFraction: fraction of the view the content's height should occupy.
     * This is the preferred per-figure camera API for matching the source image.
     */
    function setCameraView({
      projection = 'orthographic',
      azimuthDeg = 45,
      elevationDeg = 35,
      rollDeg = 0,
      zoom = null,
      target = null,
      heightFraction = 0.5,
      distanceScale = 1.2
    } = {}) {
      const { center, size } = computeSceneBounds();
      const viewTarget = Array.isArray(target)
        ? new THREE.Vector3(target[0] || 0, target[1] || 0, target[2] || 0)
        : center;

      // Compute zoom so contentHeight occupies `heightFraction` of the view height
      const contentHeight = Math.max(size.y, 1e-6);
      const desiredViewHeight = contentHeight / Math.max(heightFraction, 0.01);
      let resolvedZoom = Number.isFinite(zoom) ? zoom : (2 * FRAME_HALF_HEIGHT) / desiredViewHeight;
      resolvedZoom = Math.min(Math.max(resolvedZoom, MIN_ZOOM), MAX_ZOOM);
      camera.zoom = resolvedZoom;

      // Place camera at a distance scaled to scene size so the viewing angle is meaningful.
      const radius = Math.max(size.length() * distanceScale, FRAME_HALF_HEIGHT * 2);
      const azimuth = THREE.MathUtils.degToRad(azimuthDeg);
      const elevation = THREE.MathUtils.degToRad(elevationDeg);
      const cosElev = Math.cos(elevation);
      const x = viewTarget.x + radius * Math.cos(azimuth) * cosElev;
      const y = viewTarget.y + radius * Math.sin(elevation);
      const z = viewTarget.z + radius * Math.sin(azimuth) * cosElev;
      camera.position.set(x, y, z);

      controls.target.copy(viewTarget);
      camera.up.set(0, 1, 0);
      if (Number.isFinite(rollDeg) && rollDeg !== 0) {
        const viewDir = new THREE.Vector3().subVectors(viewTarget, camera.position).normalize();
        camera.up.applyAxisAngle(viewDir, THREE.MathUtils.degToRad(rollDeg));
      }
      camera.updateProjectionMatrix();
      controls.update();

      HOME_POS.copy(camera.position);
      HOME_TARGET.copy(controls.target);
      HOME_ZOOM = camera.zoom;

      window.__figureCameraView = {
        projection,
        azimuthDeg,
        elevationDeg,
        rollDeg,
        zoom: camera.zoom,
        target: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    /**
     * setStandardView(options)
     * Backwards-compatible wrapper. Prefer setCameraView({ azimuthDeg, elevationDeg, ... }).
     */
    function setStandardView({ azimuth = Math.PI / 4, polar = Math.PI / 4, heightFraction = 0.5 } = {}) {
      const azimuthDeg = THREE.MathUtils.radToDeg(azimuth);
      const elevationDeg = 90 - THREE.MathUtils.radToDeg(polar);
      setCameraView({ azimuthDeg, elevationDeg, heightFraction });
    }

    // Apply a standard view once at startup so tall/narrow scenes get a similar framing.
    // Call this again after adding or loading scene content that changes bounds.
    setStandardView();

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];
    const _v = new THREE.Vector3();

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color) div.style.color = options.color;
      if (options.fontSize) div.style.fontSize = options.fontSize;
      if (options.bold) div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background = options.background;
        div.style.padding = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    const _referenceDistance = 8;

    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);

        // Hide labels that are behind the camera or outside the normalized device
        // coordinate cube to avoid showing offscreen labels.
        if (_v.z > 1 || _v.z < -1 || _v.x < -1 || _v.x > 1 || _v.y < -1 || _v.y > 1) {
          div.style.display = 'none';
          continue;
        }
        div.style.display = '';

        const ox = offset && offset[0] ? offset[0] : 0;
        const oy = offset && offset[1] ? offset[1] : 0;
        const x = (_v.x * 0.5 + 0.5) * canvas.clientWidth + ox;
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + oy;

        // Compute scale differently for orthographic vs perspective cameras.
        let scale;
        const distance = Math.max(camera.position.distanceTo(pos), 1e-4);
        scale = (_referenceDistance / distance) * (camera.zoom || 1);

        // Clamp scale to a reasonable range to avoid extremely small/large labels.
        scale = Math.max(0.5, Math.min(scale, 6));

        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }

    /* ── Interaction explainer helpers ───────────────────────────────────── */
    const _tooltip = document.getElementById('figTooltip');
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _interactiveObjects = [];
    let _hoveredInteractive = null;

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title, body }, '*');
    }

    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }

    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      const pad = 12;
      const x = Math.min(event.clientX + pad, window.innerWidth - _tooltip.offsetWidth - pad);
      const y = Math.max(pad, event.clientY - _tooltip.offsetHeight - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }

    function _setPointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function _firstInteractiveHit(event) {
      if (!_interactiveObjects.length) return null;
      _setPointerFromEvent(event);
      _raycaster.setFromCamera(_pointer, camera);
      const hits = _raycaster.intersectObjects(_interactiveObjects.map(entry => entry.object), true);
      for (const hit of hits) {
        let obj = hit.object;
        while (obj) {
          const entry = _interactiveObjects.find(item => item.object === obj);
          if (entry) return { ...entry, hit };
          obj = obj.parent;
        }
      }
      return null;
    }

    function registerInteractive(object, info = {}) {
      if (!object) return object;
      object.userData = object.userData || {};
      object.userData.interactive = true;
      _interactiveObjects.push({ object, info });
      return object;
    }

    canvas.addEventListener('pointermove', (event) => {
      moveTooltip(event);
      const entry = _firstInteractiveHit(event);
      if (entry) {
        _hoveredInteractive = entry;
        canvas.style.cursor = 'pointer';
        showTooltip(entry.info.tooltip || entry.info.title || 'Click to explain', event);
      } else {
        _hoveredInteractive = null;
        canvas.style.cursor = controls.enabled ? 'grab' : 'default';
        hideTooltip();
      }
    });

    canvas.addEventListener('pointerleave', () => {
      _hoveredInteractive = null;
      canvas.style.cursor = 'default';
      hideTooltip();
    });

    canvas.addEventListener('click', (event) => {
      const entry = _firstInteractiveHit(event) || _hoveredInteractive;
      if (!entry) {
        hidePopup();
        return;
      }
      const title = entry.info.title || entry.info.tooltip || 'Figure element';
      const body = entry.info.body || entry.info.description || 'This part is interactive.';
      showPopup(title, body);
      if (typeof entry.info.onClick === 'function') entry.info.onClick(entry.hit, entry.object);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hidePopup();
        hideTooltip();
      }
    });

    /* ── Render loop ─────────────────────────────────────────────────────── */
    let _firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
      // Frame counter used by the headless verifier to prove the render loop is
      // actually alive (not frozen by an exception thrown after the first frame).
      window.__figFrames = (window.__figFrames || 0) + 1;
      if (_firstFrame) { _firstFrame = false; window.__markRendered?.(); }
    }
    animate();

    /* ── Verification hook (invisible; read by the headless verifier) ──────── */
    // Exposes the live objects so automated checks can confirm the GPU drew
    // something, the scene has content, and no geometry has NaN coordinates.
    window.__figverify = { renderer, scene, camera, controls };

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // @FIGURE_CODE_BEGIN
// origin        -> SphereGeometry(0.09) black
// Y axis        -> Line black + ConeGeometry arrowhead
// X axis(diag)  -> Line black + ConeGeometry arrowhead
// Z axis        -> Line black + ConeGeometry arrowhead
// yaw/pitch/roll arcs -> Line (arc points) red + small cone arrowhead
// image plane   -> Mesh custom quad light grey translucent
// green x,y arrows -> Line + ConeGeometry green
// p, P points   -> SphereGeometry cyan
// dashed ray O->p->P -> Line dashed grey
// elbow line P -> Z axis -> Line grey solid

const BLACK = 0x111111, RED = 0xd62020, GREEN = 0x1a8a1a, GREY = 0xaaaaaa, CYAN = 0x63c9e8;

function makeAxis(dir, length, color, labelHtml, labelOffset) {
  const end = dir.clone().normalize().multiplyScalar(length);
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), end]);
  const mat = new THREE.LineBasicMaterial({ color });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  const coneGeo = new THREE.ConeGeometry(0.1, 0.3, 16);
  const coneMat = new THREE.MeshBasicMaterial({ color });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.copy(end);
  const up = new THREE.Vector3(0,1,0);
  const q = new THREE.Quaternion().setFromUnitVectors(up, dir.clone().normalize());
  cone.quaternion.copy(q);
  scene.add(cone);
  if (labelHtml) addLabel(labelHtml, end.clone().add(labelOffset || new THREE.Vector3(0,0,0)), { fontSize: '24px', bold: true });
  return { line, cone, end };
}

const Ydir = new THREE.Vector3(0,1,0);
const Zdir = new THREE.Vector3(1,0,0);
const Xdir = new THREE.Vector3(0,0.75,0.66).normalize();

const yAxis = makeAxis(Ydir, 4.2, BLACK, 'Y', new THREE.Vector3(0,0.4,0));
const zAxis = makeAxis(Zdir, 6.3, BLACK, 'Z', new THREE.Vector3(0.35,-0.1,0));
const xAxis = makeAxis(Xdir, 3.1, BLACK, 'X', new THREE.Vector3(0.2,0.15,0.15));

const originMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 20), new THREE.MeshBasicMaterial({ color: BLACK }));
scene.add(originMesh);
addLabel('(0,0,0)', new THREE.Vector3(-0.6,-0.4,0), { fontSize: '18px' });
registerInteractive(originMesh, {
  title: 'Camera origin',
  body: 'The camera coordinate frame is centered at (0,0,0). All 3D points P are expressed relative to this origin, and the camera\'s own rotation/translation between frames is defined about this point.'
});

function makeArc(center, axis, radius, startDeg, endDeg, color) {
  const a = axis.clone().normalize();
  let ref = Math.abs(a.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
  const u = new THREE.Vector3().crossVectors(a, ref).normalize();
  const v = new THREE.Vector3().crossVectors(a, u).normalize();
  const pts = [];
  const N = 32;
  for (let i=0;i<=N;i++){
    const t = THREE.MathUtils.degToRad(startDeg + (endDeg-startDeg)*i/N);
    const p = new THREE.Vector3().addVectors(
      u.clone().multiplyScalar(Math.cos(t)*radius),
      v.clone().multiplyScalar(Math.sin(t)*radius)
    ).add(center);
    pts.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
  scene.add(line);
  const p1 = pts[pts.length-2], p2 = pts[pts.length-1];
  const dir = new THREE.Vector3().subVectors(p2,p1).normalize();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.07,0.22,12), new THREE.MeshBasicMaterial({color}));
  cone.position.copy(p2);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  scene.add(cone);
  return { line, cone, points: pts };
}

const yawArc = makeArc(new THREE.Vector3(0,3.75,0), Ydir, 0.65, -80, 50, RED);
addLabel('Yaw', new THREE.Vector3(-1.35, 3.75, 0), { fontSize: '24px', bold: true });
addLabel('&theta;<sub>Y</sub>', new THREE.Vector3(-0.5, 2.1, 0), { fontSize: '20px' });
registerInteractive(yawArc.line, {
  title: 'Yaw (θ_Y)',
  body: 'Yaw is rotation about the camera\'s Y (vertical) axis. It is the first factor applied in the composite rotation matrix R = R_Z(θ_Z) R_Y(θ_Y) R_X(θ_X), sweeping the camera\'s viewing direction left/right.'
});

const pitchArc = makeArc(new THREE.Vector3(0,0,0).addScaledVector(Xdir,1.15), Xdir, 0.58, 20, 210, RED);
addLabel('Pitch', new THREE.Vector3(0.1, 2.75, -0.2), { fontSize: '24px', bold: true });
addLabel('&theta;<sub>X</sub>', new THREE.Vector3(-0.6, 1.45, 0.6), { fontSize: '20px' });
registerInteractive(pitchArc.line, {
  title: 'Pitch (θ_X)',
  body: 'Pitch is rotation about the camera\'s X axis, tilting the view up or down. In the yaw-pitch-roll decomposition it is applied between the yaw and roll rotations.'
});

const rollArc = makeArc(new THREE.Vector3(3.35,0,0), Zdir, 0.6, -70, 60, RED);
addLabel('Roll', new THREE.Vector3(3.45, -0.8, 0), { fontSize: '24px', bold: true });
addLabel('&theta;<sub>Z</sub>', new THREE.Vector3(3.15, 0.95, 0), { fontSize: '20px' });
registerInteractive(rollArc.line, {
  title: 'Roll (θ_Z)',
  body: 'Roll is rotation about the camera\'s Z (optical/depth) axis, tilting the horizon like tilting your head. It is the outermost rotation applied to a 3D point P in the camera frame.'
});

const normal = Xdir.clone();
let ref2 = Math.abs(normal.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
const localX = new THREE.Vector3().crossVectors(ref2, normal).normalize();
const localY = new THREE.Vector3().crossVectors(normal, localX).normalize();
const planeCenter = new THREE.Vector3(2.55, -0.05, 0.9);

const hw = 1.05, hh = 1.55;
const skew = localX.clone().multiplyScalar(0.35);
const c1 = planeCenter.clone().addScaledVector(localX,-hw).addScaledVector(localY,-hh).sub(skew);
const c2 = planeCenter.clone().addScaledVector(localX, hw).addScaledVector(localY,-hh);
const c3 = planeCenter.clone().addScaledVector(localX, hw).addScaledVector(localY, hh);
const c4 = planeCenter.clone().addScaledVector(localX,-hw).addScaledVector(localY, hh).add(skew);

const planeGeo = new THREE.BufferGeometry();
const verts = new Float32Array([
  c1.x,c1.y,c1.z, c2.x,c2.y,c2.z, c3.x,c3.y,c3.z,
  c1.x,c1.y,c1.z, c3.x,c3.y,c3.z, c4.x,c4.y,c4.z
]);
planeGeo.setAttribute('position', new THREE.BufferAttribute(verts,3));
planeGeo.computeVertexNormals();
const planeMat = new THREE.MeshBasicMaterial({ color: 0xdedede, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
const planeMesh = new THREE.Mesh(planeGeo, planeMat);
scene.add(planeMesh);
const outlineGeo = new THREE.BufferGeometry().setFromPoints([c1,c2,c3,c4,c1]);
const outline = new THREE.LineLoop(outlineGeo, new THREE.LineBasicMaterial({ color: 0x333333 }));
scene.add(outline);
registerInteractive(planeMesh, {
  title: 'Image plane',
  body: 'This tilted plane represents the camera\'s local x-y image plane, perpendicular to the camera\'s X (optical) axis. Small green arrows show its local x and y basis vectors, and the point p is the projection of the 3D point P onto this plane.'
});

const arrowOrigin = planeCenter.clone().addScaledVector(localX,-0.55).addScaledVector(localY,-0.85);
function greenArrow(dir, length, label, labelOff) {
  const end = arrowOrigin.clone().addScaledVector(dir, length);
  const geo = new THREE.BufferGeometry().setFromPoints([arrowOrigin, end]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: GREEN }));
  scene.add(line);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.2,12), new THREE.MeshBasicMaterial({ color: GREEN }));
  cone.position.copy(end);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  scene.add(cone);
  addLabel(label, end.clone().add(labelOff), { fontSize: '22px', bold: true, color: '#1a7a1a' });
  return line;
}
const yArrowLine = greenArrow(localY, 1.55, 'y', new THREE.Vector3(-0.2,0.12,0));
const xArrowLine = greenArrow(localX, 1.05, 'x', new THREE.Vector3(0.2,0.02,0));
registerInteractive(yArrowLine, { title: 'Image-plane y axis', tooltip:'local y axis', body: 'The local vertical axis of the 2D image plane, one of the two basis vectors used to express the projected point p in image coordinates.' });
registerInteractive(xArrowLine, { title: 'Image-plane x axis', tooltip:'local x axis', body: 'The local horizontal axis of the 2D image plane, the other basis vector used to express the projected point p in image coordinates.' });

const pPos = arrowOrigin.clone().addScaledVector(localY,0.95).addScaledVector(localX,0.55);
const pMesh = new THREE.Mesh(new THREE.SphereGeometry(0.075,20,20), new THREE.MeshBasicMaterial({ color: CYAN }));
pMesh.position.copy(pPos);
scene.add(pMesh);
addLabel('p', pPos.clone().add(new THREE.Vector3(0.05,0.24,0)), { fontSize: '24px', bold: true });
const stalkBase = new THREE.Vector3(pPos.x, arrowOrigin.y, pPos.z);
const stalkGeo = new THREE.BufferGeometry().setFromPoints([stalkBase, pPos]);
scene.add(new THREE.Line(stalkGeo, new THREE.LineBasicMaterial({ color: GREY })));
registerInteractive(pMesh, {
  title: 'Projected point p',
  body: 'p is the projection of the 3D world point P onto the camera\'s image plane, lying along the ray from the camera origin through P. This is exactly the pinhole-camera projection used to form the 2D image.'
});

// P placed further right and higher, clearly separated from p, matching source composition
const rayDir = pPos.clone().normalize();
const Ppos = rayDir.clone().multiplyScalar(pPos.length()*1.6).add(new THREE.Vector3(3.1, 0.9, -0.3));
const PMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09,20,20), new THREE.MeshBasicMaterial({ color: CYAN }));
PMesh.position.copy(Ppos);
scene.add(PMesh);
addLabel('P', Ppos.clone().add(new THREE.Vector3(0,0.3,0)), { fontSize: '26px', bold: true });
registerInteractive(PMesh, {
  title: '3D world point P',
  body: 'P is a 3D point expressed in the camera coordinate system. As the camera translates and rotates by T and R over a small time Δt, P moves to P_(t+Δt) = -T + R·P_t, which is the basis for deriving the optical flow equation.'
});

const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), pPos, Ppos]);
const rayMat = new THREE.LineDashedMaterial({ color: GREY, dashSize: 0.12, gapSize: 0.09 });
const rayLine = new THREE.Line(rayGeo, rayMat);
rayLine.computeLineDistances();
scene.add(rayLine);

const bend = new THREE.Vector3(Ppos.x, arrowOrigin.y - 0.55, Ppos.z);
const zHit = new THREE.Vector3(Ppos.x*0.72, 0, 0);
const elbowGeo = new THREE.BufferGeometry().setFromPoints([Ppos, bend, zHit]);
const elbowLine = new THREE.Line(elbowGeo, new THREE.LineBasicMaterial({ color: GREY }));
scene.add(elbowLine);
registerInteractive(elbowLine, {
  title: 'Depth construction line',
  body: 'This construction line drops P onto the Z axis, visually indicating its depth component relative to the camera\'s optical axis.'
});

setCameraView({
  projection: 'orthographic',
  azimuthDeg: 18,
  elevationDeg: 12,
  rollDeg: 0,
  zoom: 0.62,
  target: [2.0, 1.5, 0.2],
  heightFraction: 0.6
});
// @FIGURE_CODE_END

  </script>
