<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Lightweight hover tooltip for generated 3D explainers ───────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    // Show error overlay if module scripts fail or take too long
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    // Timeout fallback: if nothing renders in 12s, show overlay
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    let camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // HOME view will be computed from the scene bounds so different scenes
    // (especially tall ones) get a consistent starting zoom/angle while
    // still allowing interactive OrbitControls.
    const HOME_POS = new THREE.Vector3();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    let HOME_ZOOM = 0.75;

    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      camera.zoom = HOME_ZOOM;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // Framing parameters
    const FRAME_HALF_HEIGHT = d; // base frustum half-height used when computing zoom
    const FRAME_MARGIN = 0.08;   // fraction of extra space around content
    const MIN_ZOOM = 0.2;
    const MAX_ZOOM = 5;

    function computeSceneBounds() {
      const box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) {
        // fallback box so empty scenes get a sensible frame
        box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(2 * d, 2 * d, 2 * d));
      }
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { box, center, size };
    }

    /**
     * setCameraView(options)
     * - azimuthDeg: horizontal angle around Y axis, in degrees.
     * - elevationDeg: angle above the ground/XZ plane, in degrees.
     * - zoom: optional orthographic zoom. If omitted, derived from content bounds.
     * - target: optional [x,y,z] camera target. If omitted, uses scene bounds center.
     * - heightFraction: fraction of the view the content's height should occupy.
     * This is the preferred per-figure camera API for matching the source image.
     */
    function setCameraView({
      projection = 'orthographic',
      azimuthDeg = 45,
      elevationDeg = 35,
      rollDeg = 0,
      zoom = null,
      target = null,
      heightFraction = 0.5,
      distanceScale = 1.2
    } = {}) {
      const { center, size } = computeSceneBounds();
      const viewTarget = Array.isArray(target)
        ? new THREE.Vector3(target[0] || 0, target[1] || 0, target[2] || 0)
        : center;

      // Compute zoom so contentHeight occupies `heightFraction` of the view height
      const contentHeight = Math.max(size.y, 1e-6);
      const desiredViewHeight = contentHeight / Math.max(heightFraction, 0.01);
      let resolvedZoom = Number.isFinite(zoom) ? zoom : (2 * FRAME_HALF_HEIGHT) / desiredViewHeight;
      resolvedZoom = Math.min(Math.max(resolvedZoom, MIN_ZOOM), MAX_ZOOM);
      camera.zoom = resolvedZoom;

      // Place camera at a distance scaled to scene size so the viewing angle is meaningful.
      const radius = Math.max(size.length() * distanceScale, FRAME_HALF_HEIGHT * 2);
      const azimuth = THREE.MathUtils.degToRad(azimuthDeg);
      const elevation = THREE.MathUtils.degToRad(elevationDeg);
      const cosElev = Math.cos(elevation);
      const x = viewTarget.x + radius * Math.cos(azimuth) * cosElev;
      const y = viewTarget.y + radius * Math.sin(elevation);
      const z = viewTarget.z + radius * Math.sin(azimuth) * cosElev;
      camera.position.set(x, y, z);

      controls.target.copy(viewTarget);
      camera.up.set(0, 1, 0);
      if (Number.isFinite(rollDeg) && rollDeg !== 0) {
        const viewDir = new THREE.Vector3().subVectors(viewTarget, camera.position).normalize();
        camera.up.applyAxisAngle(viewDir, THREE.MathUtils.degToRad(rollDeg));
      }
      camera.updateProjectionMatrix();
      controls.update();

      HOME_POS.copy(camera.position);
      HOME_TARGET.copy(controls.target);
      HOME_ZOOM = camera.zoom;

      window.__figureCameraView = {
        projection,
        azimuthDeg,
        elevationDeg,
        rollDeg,
        zoom: camera.zoom,
        target: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    /**
     * setStandardView(options)
     * Backwards-compatible wrapper. Prefer setCameraView({ azimuthDeg, elevationDeg, ... }).
     */
    function setStandardView({ azimuth = Math.PI / 4, polar = Math.PI / 4, heightFraction = 0.5 } = {}) {
      const azimuthDeg = THREE.MathUtils.radToDeg(azimuth);
      const elevationDeg = 90 - THREE.MathUtils.radToDeg(polar);
      setCameraView({ azimuthDeg, elevationDeg, heightFraction });
    }

    // Apply a standard view once at startup so tall/narrow scenes get a similar framing.
    // Call this again after adding or loading scene content that changes bounds.
    setStandardView();

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];
    const _v = new THREE.Vector3();

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color) div.style.color = options.color;
      if (options.fontSize) div.style.fontSize = options.fontSize;
      if (options.bold) div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background = options.background;
        div.style.padding = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    const _referenceDistance = 8;

    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);

        // Hide labels that are behind the camera or outside the normalized device
        // coordinate cube to avoid showing offscreen labels.
        if (_v.z > 1 || _v.z < -1 || _v.x < -1 || _v.x > 1 || _v.y < -1 || _v.y > 1) {
          div.style.display = 'none';
          continue;
        }
        div.style.display = '';

        const ox = offset && offset[0] ? offset[0] : 0;
        const oy = offset && offset[1] ? offset[1] : 0;
        const x = (_v.x * 0.5 + 0.5) * canvas.clientWidth + ox;
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + oy;

        // Compute scale differently for orthographic vs perspective cameras.
        let scale;
        const distance = Math.max(camera.position.distanceTo(pos), 1e-4);
        scale = (_referenceDistance / distance) * (camera.zoom || 1);

        // Clamp scale to a reasonable range to avoid extremely small/large labels.
        scale = Math.max(0.5, Math.min(scale, 6));

        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }

    /* ── Interaction explainer helpers ───────────────────────────────────── */
    const _tooltip = document.getElementById('figTooltip');
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _interactiveObjects = [];
    let _hoveredInteractive = null;

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title, body }, '*');
    }

    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }

    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      const pad = 12;
      const x = Math.min(event.clientX + pad, window.innerWidth - _tooltip.offsetWidth - pad);
      const y = Math.max(pad, event.clientY - _tooltip.offsetHeight - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }

    function _setPointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function _firstInteractiveHit(event) {
      if (!_interactiveObjects.length) return null;
      _setPointerFromEvent(event);
      _raycaster.setFromCamera(_pointer, camera);
      const hits = _raycaster.intersectObjects(_interactiveObjects.map(entry => entry.object), true);
      for (const hit of hits) {
        let obj = hit.object;
        while (obj) {
          const entry = _interactiveObjects.find(item => item.object === obj);
          if (entry) return { ...entry, hit };
          obj = obj.parent;
        }
      }
      return null;
    }

    function registerInteractive(object, info = {}) {
      if (!object) return object;
      object.userData = object.userData || {};
      object.userData.interactive = true;
      _interactiveObjects.push({ object, info });
      return object;
    }

    canvas.addEventListener('pointermove', (event) => {
      moveTooltip(event);
      const entry = _firstInteractiveHit(event);
      if (entry) {
        _hoveredInteractive = entry;
        canvas.style.cursor = 'pointer';
        showTooltip(entry.info.tooltip || entry.info.title || 'Click to explain', event);
      } else {
        _hoveredInteractive = null;
        canvas.style.cursor = controls.enabled ? 'grab' : 'default';
        hideTooltip();
      }
    });

    canvas.addEventListener('pointerleave', () => {
      _hoveredInteractive = null;
      canvas.style.cursor = 'default';
      hideTooltip();
    });

    canvas.addEventListener('click', (event) => {
      const entry = _firstInteractiveHit(event) || _hoveredInteractive;
      if (!entry) {
        hidePopup();
        return;
      }
      const title = entry.info.title || entry.info.tooltip || 'Figure element';
      const body = entry.info.body || entry.info.description || 'This part is interactive.';
      showPopup(title, body);
      if (typeof entry.info.onClick === 'function') entry.info.onClick(entry.hit, entry.object);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hidePopup();
        hideTooltip();
      }
    });

    /* ── Render loop ─────────────────────────────────────────────────────── */
    let _firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
      // Frame counter used by the headless verifier to prove the render loop is
      // actually alive (not frozen by an exception thrown after the first frame).
      window.__figFrames = (window.__figFrames || 0) + 1;
      if (_firstFrame) { _firstFrame = false; window.__markRendered?.(); }
    }
    animate();

    /* ── Verification hook (invisible; read by the headless verifier) ──────── */
    // Exposes the live objects so automated checks can confirm the GPU drew
    // something, the scene has content, and no geometry has NaN coordinates.
    window.__figverify = { renderer, scene, camera, controls };

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // @FIGURE_CODE_BEGIN
// O1,O2  -> SphereGeometry(0.12) black
// cameraPlane1/2 -> LineLoop rectangle (grey) tilted around Y
// epipolarPlane -> triangle Mesh (yellow, transparent) O1-P-O2
// lineO1P/lineO2P -> Line red (thick via tube not needed, plain Line)
// epipolarLine1/2 -> Line red on camera plane through epipole & image point
// pointP -> SphereGeometry(0.13) cyan, draggable
// epipole1/2 -> SphereGeometry(0.08) black
// imagePoint1/2 -> SphereGeometry(0.09) red ring look (red w/ white-ish outline)
// baseline -> dashed line black

const O1 = new THREE.Vector3(-4, 0, 0);
const O2 = new THREE.Vector3(4, 0, 0);

// camera plane definitions
const planeAngle1 = -0.55; // rotation around Y
const planeAngle2 = 0.55;
const planeCenter1 = new THREE.Vector3(-2.5, 0.6, 0);
const planeCenter2 = new THREE.Vector3(2.5, 0.6, 0);
const planeW = 2.4, planeH = 3.6;

function planeNormal(angle) {
  const n = new THREE.Vector3(0, 0, 1);
  n.applyAxisAngle(new THREE.Vector3(0,1,0), angle);
  return n;
}
const normal1 = planeNormal(planeAngle1);
const normal2 = planeNormal(planeAngle2);

function makeCameraPlaneOutline(center, angle, w, h, color) {
  const grp = new THREE.Group();
  grp.position.copy(center);
  grp.rotation.y = angle;
  const pts = [
    new THREE.Vector3(-w/2, -h/2, 0),
    new THREE.Vector3(w/2, -h/2, 0),
    new THREE.Vector3(w/2, h/2, 0),
    new THREE.Vector3(-w/2, h/2, 0),
    new THREE.Vector3(-w/2, -h/2, 0),
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color });
  const line = new THREE.Line(geo, mat);
  grp.add(line);
  scene.add(grp);
  return grp;
}

const cameraPlane1 = makeCameraPlaneOutline(planeCenter1, planeAngle1, planeW, planeH, 0x555555);
const cameraPlane2 = makeCameraPlaneOutline(planeCenter2, planeAngle2, planeW, planeH, 0x555555);

// origins
function makeSphere(radius, color, pos) {
  const geo = new THREE.SphereGeometry(radius, 20, 16);
  const mat = new THREE.MeshBasicMaterial({ color });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  scene.add(m);
  return m;
}
const camera1 = makeSphere(0.14, 0x000000, O1);
const camera2 = makeSphere(0.14, 0x000000, O2);

// epipoles: on baseline, at intersection of plane with y=0 line through camera origin roughly
const epipole1 = makeSphere(0.09, 0x000000, new THREE.Vector3(-1.9, 0, 0));
const epipole2 = makeSphere(0.09, 0x000000, new THREE.Vector3(1.9, 0, 0));

// baseline dashed
{
  const mat = new THREE.LineDashedMaterial({ color: 0x000000, dashSize: 0.18, gapSize: 0.12 });
  const geo = new THREE.BufferGeometry().setFromPoints([O1, O2]);
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  scene.add(line);
}

// state
const state = { P: new THREE.Vector3(0, 3, -1), labels: true };

// dynamic objects (rebuilt each update)
let epipolarPlaneMesh, lineO1P, lineO2P, epipolarLine1, epipolarLine2, imagePoint1, imagePoint2, pointPMesh;
let lblP, lblP1, lblP2, lblE1, lblE2, lblO1, lblO2, lblEpiPlane, lblEpi1, lblEpi2, lblCam1, lblCam2;

function planeFrom(center, normal) {
  return new THREE.Plane().setFromNormalAndCoplanarPoint(normal, center);
}

function computeImagePoint(origin, target, center, normal) {
  const plane = planeFrom(center, normal);
  const line = new THREE.Line3(origin, origin.clone().add(target.clone().sub(origin).multiplyScalar(5)));
  const out = new THREE.Vector3();
  const hit = plane.intersectLine(line, out);
  return hit ? out : center.clone();
}

function rebuildDynamic() {
  const P = state.P;

  // remove old
  [epipolarPlaneMesh, lineO1P, lineO2P, epipolarLine1, epipolarLine2, imagePoint1, imagePoint2, pointPMesh].forEach(o => {
    if (o) scene.remove(o);
  });

  // epipolar plane triangle O1-P-O2
  const triGeo = new THREE.BufferGeometry();
  const verts = new Float32Array([
    O1.x, O1.y, O1.z,
    P.x, P.y, P.z,
    O2.x, O2.y, O2.z,
  ]);
  triGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  triGeo.computeVertexNormals();
  const triMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  epipolarPlaneMesh = new THREE.Mesh(triGeo, triMat);
  scene.add(epipolarPlaneMesh);
  registerInteractive(epipolarPlaneMesh, {
    title: 'Epipolar Plane',
    body: 'The epipolar plane is defined by the two camera centers O1, O2 and the 3D point P. As P moves, this plane rotates, but it always passes through both camera origins.',
    tooltip: 'Epipolar plane'
  });

  // image points on each camera plane (intersection of O-P ray with plane)
  const ip1 = computeImagePoint(O1, P, planeCenter1, normal1);
  const ip2 = computeImagePoint(O2, P, planeCenter2, normal2);
  imagePoint1 = makeSphere(0.09, 0xdd0000, ip1);
  imagePoint2 = makeSphere(0.09, 0xdd0000, ip2);
  registerInteractive(imagePoint1, { title: 'Image point p1', body: 'p1 is the projection of the 3D point P onto camera 1\'s image plane — where P appears in camera 1\'s picture.', tooltip: 'p1' });
  registerInteractive(imagePoint2, { title: 'Image point p2', body: 'p2 is the projection of P onto camera 2\'s image plane. Because the geometry is constrained, p2 must lie on the epipolar line corresponding to p1.', tooltip: 'p2' });

  // rays O1->P and O2->P (red, thick look via simple Line)
  function makeLine(a, b, color) {
    const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
    const mat = new THREE.LineBasicMaterial({ color, linewidth: 2 });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    return line;
  }
  lineO1P = makeLine(O1, P, 0xdd0000);
  lineO2P = makeLine(O2, P, 0xdd0000);
  registerInteractive(lineO1P, { title: 'Ray O1–P', body: 'This ray connects camera 1\'s center to the 3D point P. It projects to the image point p1 and, together with O2, defines the epipolar plane.', tooltip: 'Ray to P' });
  registerInteractive(lineO2P, { title: 'Ray O2–P', body: 'This ray connects camera 2\'s center to the 3D point P, projecting to image point p2.', tooltip: 'Ray to P' });

  // epipolar lines: extend line from epipole through image point, clipped to plane extents
  function epipolarLineFor(epipolePos, ip) {
    const dir = ip.clone().sub(epipolePos).normalize();
    const a = epipolePos.clone().sub(dir.clone().multiplyScalar(0.1));
    const b = epipolePos.clone().add(dir.clone().multiplyScalar(3.2));
    return makeLine(a, b, 0xff2222);
  }
  epipolarLine1 = epipolarLineFor(epipole1.position, ip1);
  epipolarLine2 = epipolarLineFor(epipole2.position, ip2);
  registerInteractive(epipolarLine1, { title: 'Epipolar line (camera 1)', body: 'Given p2 in camera 2, the matching point in camera 1 must lie somewhere along this epipolar line. All epipolar lines in camera 1 pass through the epipole e1.', tooltip: 'Epipolar line' });
  registerInteractive(epipolarLine2, { title: 'Epipolar line (camera 2)', body: 'Given p1 in camera 1, the corresponding match in camera 2 must lie along this epipolar line, which always passes through epipole e2.', tooltip: 'Epipolar line' });

  // point P
  pointPMesh = makeSphere(0.15, 0x33d5e0, P);
  registerInteractive(pointPMesh, {
    title: 'Point P (drag me)',
    body: 'P is a 3D point in the world. Drag it around — the epipolar plane and both epipolar lines update instantly, while the epipoles e1 and e2 never move.',
    tooltip: 'Drag to move P'
  });

  // labels
  [lblP, lblP1, lblP2, lblE1, lblE2, lblO1, lblO2, lblEpiPlane, lblEpi1, lblEpi2, lblCam1, lblCam2].forEach(l => { if (l) l.div.remove(); });
  if (state.labels) {
    lblP = addLabel('<b>P</b>', P.clone().add(new THREE.Vector3(0, 0.35, 0)), { fontSize: '20px' });
    lblP1 = addLabel('<b>p<sub>1</sub></b>', ip1.clone().add(new THREE.Vector3(-0.25, -0.3, 0)), { fontSize: '16px' });
    lblP2 = addLabel('<b>p<sub>2</sub></b>', ip2.clone().add(new THREE.Vector3(0.25, -0.3, 0)), { fontSize: '16px' });
    lblE1 = addLabel('e<sub>1</sub>', epipole1.position.clone().add(new THREE.Vector3(0, -0.35, 0)), { fontSize: '16px' });
    lblE2 = addLabel('e<sub>2</sub>', epipole2.position.clone().add(new THREE.Vector3(0, -0.35, 0)), { fontSize: '16px' });
    lblO1 = addLabel('O<sub>1</sub>', O1.clone().add(new THREE.Vector3(0, -0.4, 0)), { fontSize: '16px' });
    lblO2 = addLabel('O<sub>2</sub>', O2.clone().add(new THREE.Vector3(0, -0.4, 0)), { fontSize: '16px' });
    lblCam1 = addLabel('Camera 1', O1.clone().add(new THREE.Vector3(-1.1, 0.05, 0)), { fontSize: '15px' });
    lblCam2 = addLabel('Camera 2', O2.clone().add(new THREE.Vector3(1.1, -0.05, 0)), { fontSize: '15px' });
    lblEpiPlane = addLabel('Epipolar plane', new THREE.Vector3((O1.x+O2.x)/2, (P.y*0.5)+0.3, (O1.z+O2.z+P.z)/3), { fontSize: '16px' });
    lblEpi1 = addLabel('Epipolar line', epipole1.position.clone().add(dirLabelOffset(epipole1.position, ip1)), { fontSize: '12px' });
    lblEpi2 = addLabel('Epipolar line', epipole2.position.clone().add(dirLabelOffset(epipole2.position, ip2)), { fontSize: '12px' });
  }
}

function dirLabelOffset(epi, ip) {
  const dir = ip.clone().sub(epi).normalize();
  return dir.multiplyScalar(1.6).add(new THREE.Vector3(0,0.15,0));
}

rebuildDynamic();

document.getElementById('lblToggle').addEventListener('change', (e) => {
  state.labels = e.target.checked;
  rebuildDynamic();
});

// dragging P
let dragging = false;
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 1); // will set per drag
const raycaster2 = new THREE.Raycaster();
const pointer2 = new THREE.Vector2();

function setPointerNDC(event) {
  const rect = canvas.getBoundingClientRect();
  pointer2.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer2.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

canvas.addEventListener('pointerdown', (event) => {
  setPointerNDC(event);
  raycaster2.setFromCamera(pointer2, camera);
  const hits = raycaster2.intersectObject(pointPMesh, true);
  if (hits.length) {
    dragging = true;
    controls.enabled = false;
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), state.P);
  }
});

window.addEventListener('pointermove', (event) => {
  if (!dragging) return;
  setPointerNDC(event);
  raycaster2.setFromCamera(pointer2, camera);
  const out = new THREE.Vector3();
  if (raycaster2.ray.intersectPlane(dragPlane, out)) {
    state.P.copy(out);
    rebuildDynamic();
  }
});

window.addEventListener('pointerup', () => {
  if (dragging) {
    dragging = false;
    controls.enabled = true;
  }
});

setCameraView({
  projection: 'orthographic',
  azimuthDeg: 90,
  elevationDeg: 8,
  rollDeg: 0,
  zoom: 0.95,
  target: [0, 0.9, 0],
  heightFraction: 0.85
});
// @FIGURE_CODE_END

  </script>
