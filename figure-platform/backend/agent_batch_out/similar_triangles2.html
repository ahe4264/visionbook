<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Lightweight hover tooltip for generated 3D explainers ───────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    // Show error overlay if module scripts fail or take too long
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    // Timeout fallback: if nothing renders in 12s, show overlay
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    let camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // HOME view will be computed from the scene bounds so different scenes
    // (especially tall ones) get a consistent starting zoom/angle while
    // still allowing interactive OrbitControls.
    const HOME_POS = new THREE.Vector3();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    let HOME_ZOOM = 0.75;

    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      camera.zoom = HOME_ZOOM;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // Framing parameters
    const FRAME_HALF_HEIGHT = d; // base frustum half-height used when computing zoom
    const FRAME_MARGIN = 0.08;   // fraction of extra space around content
    const MIN_ZOOM = 0.2;
    const MAX_ZOOM = 5;

    function computeSceneBounds() {
      const box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) {
        // fallback box so empty scenes get a sensible frame
        box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(2 * d, 2 * d, 2 * d));
      }
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { box, center, size };
    }

    /**
     * setCameraView(options)
     * - azimuthDeg: horizontal angle around Y axis, in degrees.
     * - elevationDeg: angle above the ground/XZ plane, in degrees.
     * - zoom: optional orthographic zoom. If omitted, derived from content bounds.
     * - target: optional [x,y,z] camera target. If omitted, uses scene bounds center.
     * - heightFraction: fraction of the view the content's height should occupy.
     * This is the preferred per-figure camera API for matching the source image.
     */
    function setCameraView({
      projection = 'orthographic',
      azimuthDeg = 45,
      elevationDeg = 35,
      rollDeg = 0,
      zoom = null,
      target = null,
      heightFraction = 0.5,
      distanceScale = 1.2
    } = {}) {
      const { center, size } = computeSceneBounds();
      const viewTarget = Array.isArray(target)
        ? new THREE.Vector3(target[0] || 0, target[1] || 0, target[2] || 0)
        : center;

      // Compute zoom so contentHeight occupies `heightFraction` of the view height
      const contentHeight = Math.max(size.y, 1e-6);
      const desiredViewHeight = contentHeight / Math.max(heightFraction, 0.01);
      let resolvedZoom = Number.isFinite(zoom) ? zoom : (2 * FRAME_HALF_HEIGHT) / desiredViewHeight;
      resolvedZoom = Math.min(Math.max(resolvedZoom, MIN_ZOOM), MAX_ZOOM);
      camera.zoom = resolvedZoom;

      // Place camera at a distance scaled to scene size so the viewing angle is meaningful.
      const radius = Math.max(size.length() * distanceScale, FRAME_HALF_HEIGHT * 2);
      const azimuth = THREE.MathUtils.degToRad(azimuthDeg);
      const elevation = THREE.MathUtils.degToRad(elevationDeg);
      const cosElev = Math.cos(elevation);
      const x = viewTarget.x + radius * Math.cos(azimuth) * cosElev;
      const y = viewTarget.y + radius * Math.sin(elevation);
      const z = viewTarget.z + radius * Math.sin(azimuth) * cosElev;
      camera.position.set(x, y, z);

      controls.target.copy(viewTarget);
      camera.up.set(0, 1, 0);
      if (Number.isFinite(rollDeg) && rollDeg !== 0) {
        const viewDir = new THREE.Vector3().subVectors(viewTarget, camera.position).normalize();
        camera.up.applyAxisAngle(viewDir, THREE.MathUtils.degToRad(rollDeg));
      }
      camera.updateProjectionMatrix();
      controls.update();

      HOME_POS.copy(camera.position);
      HOME_TARGET.copy(controls.target);
      HOME_ZOOM = camera.zoom;

      window.__figureCameraView = {
        projection,
        azimuthDeg,
        elevationDeg,
        rollDeg,
        zoom: camera.zoom,
        target: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    /**
     * setStandardView(options)
     * Backwards-compatible wrapper. Prefer setCameraView({ azimuthDeg, elevationDeg, ... }).
     */
    function setStandardView({ azimuth = Math.PI / 4, polar = Math.PI / 4, heightFraction = 0.5 } = {}) {
      const azimuthDeg = THREE.MathUtils.radToDeg(azimuth);
      const elevationDeg = 90 - THREE.MathUtils.radToDeg(polar);
      setCameraView({ azimuthDeg, elevationDeg, heightFraction });
    }

    // Apply a standard view once at startup so tall/narrow scenes get a similar framing.
    // Call this again after adding or loading scene content that changes bounds.
    setStandardView();

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];
    const _v = new THREE.Vector3();

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color) div.style.color = options.color;
      if (options.fontSize) div.style.fontSize = options.fontSize;
      if (options.bold) div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background = options.background;
        div.style.padding = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    const _referenceDistance = 8;

    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);

        // Hide labels that are behind the camera or outside the normalized device
        // coordinate cube to avoid showing offscreen labels.
        if (_v.z > 1 || _v.z < -1 || _v.x < -1 || _v.x > 1 || _v.y < -1 || _v.y > 1) {
          div.style.display = 'none';
          continue;
        }
        div.style.display = '';

        const ox = offset && offset[0] ? offset[0] : 0;
        const oy = offset && offset[1] ? offset[1] : 0;
        const x = (_v.x * 0.5 + 0.5) * canvas.clientWidth + ox;
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + oy;

        // Compute scale differently for orthographic vs perspective cameras.
        let scale;
        const distance = Math.max(camera.position.distanceTo(pos), 1e-4);
        scale = (_referenceDistance / distance) * (camera.zoom || 1);

        // Clamp scale to a reasonable range to avoid extremely small/large labels.
        scale = Math.max(0.5, Math.min(scale, 6));

        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }

    /* ── Interaction explainer helpers ───────────────────────────────────── */
    const _tooltip = document.getElementById('figTooltip');
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _interactiveObjects = [];
    let _hoveredInteractive = null;

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title, body }, '*');
    }

    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }

    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      const pad = 12;
      const x = Math.min(event.clientX + pad, window.innerWidth - _tooltip.offsetWidth - pad);
      const y = Math.max(pad, event.clientY - _tooltip.offsetHeight - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }

    function _setPointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function _firstInteractiveHit(event) {
      if (!_interactiveObjects.length) return null;
      _setPointerFromEvent(event);
      _raycaster.setFromCamera(_pointer, camera);
      const hits = _raycaster.intersectObjects(_interactiveObjects.map(entry => entry.object), true);
      for (const hit of hits) {
        let obj = hit.object;
        while (obj) {
          const entry = _interactiveObjects.find(item => item.object === obj);
          if (entry) return { ...entry, hit };
          obj = obj.parent;
        }
      }
      return null;
    }

    function registerInteractive(object, info = {}) {
      if (!object) return object;
      object.userData = object.userData || {};
      object.userData.interactive = true;
      _interactiveObjects.push({ object, info });
      return object;
    }

    canvas.addEventListener('pointermove', (event) => {
      moveTooltip(event);
      const entry = _firstInteractiveHit(event);
      if (entry) {
        _hoveredInteractive = entry;
        canvas.style.cursor = 'pointer';
        showTooltip(entry.info.tooltip || entry.info.title || 'Click to explain', event);
      } else {
        _hoveredInteractive = null;
        canvas.style.cursor = controls.enabled ? 'grab' : 'default';
        hideTooltip();
      }
    });

    canvas.addEventListener('pointerleave', () => {
      _hoveredInteractive = null;
      canvas.style.cursor = 'default';
      hideTooltip();
    });

    canvas.addEventListener('click', (event) => {
      const entry = _firstInteractiveHit(event) || _hoveredInteractive;
      if (!entry) {
        hidePopup();
        return;
      }
      const title = entry.info.title || entry.info.tooltip || 'Figure element';
      const body = entry.info.body || entry.info.description || 'This part is interactive.';
      showPopup(title, body);
      if (typeof entry.info.onClick === 'function') entry.info.onClick(entry.hit, entry.object);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hidePopup();
        hideTooltip();
      }
    });

    /* ── Render loop ─────────────────────────────────────────────────────── */
    let _firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
      // Frame counter used by the headless verifier to prove the render loop is
      // actually alive (not frozen by an exception thrown after the first frame).
      window.__figFrames = (window.__figFrames || 0) + 1;
      if (_firstFrame) { _firstFrame = false; window.__markRendered?.(); }
    }
    animate();

    /* ── Verification hook (invisible; read by the headless verifier) ──────── */
    // Exposes the live objects so automated checks can confirm the GPU drew
    // something, the scene has content, and no geometry has NaN coordinates.
    window.__figverify = { renderer, scene, camera, controls };

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // @FIGURE_CODE_BEGIN
// Coordinate mapping: three.X = world Z (main axis), three.Y = world Y (up), three.Z = world X (depth, drawn diagonal)
// axes -> Line black
// camera plane -> Mesh PlaneGeometry-like quad, gray, semi-transparent
// pinhole -> SphereGeometry(0.05) black, at origin
// near triangle (green) -> Mesh custom triangle geometry, green transparent
// near triangle (blue/cyan) -> Mesh custom triangle geometry, cyan transparent
// far triangle (green) -> Mesh custom triangle geometry, green transparent
// far triangle (blue/cyan) -> Mesh custom triangle geometry, cyan transparent
// brown object point -> SphereGeometry(0.08) brown
// red object point -> SphereGeometry(0.08) red
// projection lines -> Line dotted black
// red edges -> Line red at plane boundaries
// focal length line -> Line black (f)

const grp = new THREE.Group();
scene.add(grp);

function lineBetween(p1, p2, color, dashed) {
  const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  const mat = dashed
    ? new THREE.LineDashedMaterial({ color, dashSize: 0.12, gapSize: 0.08, linewidth: 2 })
    : new THREE.LineBasicMaterial({ color, linewidth: 2 });
  const line = new THREE.Line(geo, mat);
  if (dashed) line.computeLineDistances();
  grp.add(line);
  return line;
}

function triangleMesh(p1, p2, p3, color) {
  const geo = new THREE.BufferGeometry();
  const verts = new Float32Array([
    p1.x, p1.y, p1.z,
    p2.x, p2.y, p2.z,
    p3.x, p3.y, p3.z
  ]);
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  grp.add(mesh);
  return mesh;
}

// ── Axes ──
const AXIS_LEN = 6;
lineBetween(new THREE.Vector3(0, 0, 0), new THREE.Vector3(AXIS_LEN, 0, 0), 0x000000, false); // Z axis (main horizontal, three.X)
const zArrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 12), new THREE.MeshBasicMaterial({ color: 0x000000 }));
zArrowHead.position.set(AXIS_LEN, 0, 0);
zArrowHead.rotation.z = -Math.PI / 2;
grp.add(zArrowHead);

lineBetween(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 2.4, 0), 0x000000, false); // Y (up) arrow near origin
const yArrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 12), new THREE.MeshBasicMaterial({ color: 0x000000 }));
yArrowHead.position.set(0, 2.4, 0);
grp.add(yArrowHead);

lineBetween(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.9, 1.7, 0.9), 0x000000, false); // diagonal black arrow (X axis of camera coords near origin, points toward viewer/back)
const diagArrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 12), new THREE.MeshBasicMaterial({ color: 0x000000 }));
diagArrowHead.position.set(0.9, 1.7, 0.9);
diagArrowHead.lookAt(new THREE.Vector3(1.5, 2.6, 1.5));
diagArrowHead.rotateX(Math.PI / 2);
grp.add(diagArrowHead);

// ── Camera plane (gray, tilted quad on the left, negative Z-three side) ──
const CP = -2.4; // position along three.X (world Z axis, negative = behind pinhole)
const camPlaneGeo = new THREE.BufferGeometry();
const cpVerts = new Float32Array([
  CP, 2.6, 0.9,
  CP, 2.6, -1.3,
  CP, -2.6, -1.3,
  CP, -2.6, 0.9
]);
camPlaneGeo.setAttribute('position', new THREE.BufferAttribute(cpVerts, 3));
camPlaneGeo.setIndex([0, 1, 2, 0, 2, 3]);
camPlaneGeo.computeVertexNormals();
const camPlaneMat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
const camPlaneMesh = new THREE.Mesh(camPlaneGeo, camPlaneMat);
grp.add(camPlaneMesh);
registerInteractive(camPlaneMesh, {
  title: 'Camera / Image Plane',
  tooltip: 'The virtual camera plane',
  body: 'This is the virtual image plane located at focal length f in front of the pinhole. The object point is projected onto this plane, forming an inverted-avoiding virtual image whose coordinates (x, y) relate to the 3D world coordinates (X, Y, Z) by similar triangles.'
});
// plane outline
lineBetween(new THREE.Vector3(CP, 2.6, 0.9), new THREE.Vector3(CP, 2.6, -1.3), 0x000000, false);
lineBetween(new THREE.Vector3(CP, 2.6, -1.3), new THREE.Vector3(CP, -2.6, -1.3), 0x000000, false);
lineBetween(new THREE.Vector3(CP, -2.6, -1.3), new THREE.Vector3(CP, -2.6, 0.9), 0x000000, false);
lineBetween(new THREE.Vector3(CP, -2.6, 0.9), new THREE.Vector3(CP, 2.6, 0.9), 0x000000, false);

// ── Pinhole at origin ──
const pinhole = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshBasicMaterial({ color: 0x000000 }));
pinhole.position.set(0, 0, 0);
grp.add(pinhole);
let pinholeClicked = false;
registerInteractive(pinhole, {
  title: 'Pinhole (Center of Projection)',
  tooltip: 'Click: pinhole projection',
  body: 'All rays from object points in the world pass through this single point, the pinhole, before reaching the image plane. This is the origin of the camera coordinate system, and the reason perspective projection scales inversely with depth Z.',
  onClick: () => { pinholeClicked = !pinholeClicked; updateObjectPositions(); }
});

// ── Near (camera-side) similar triangle apex points ──
// small object (brown) near camera plane, and its projected point (top of red edge)
const nearImgTop = new THREE.Vector3(CP, 1.3, 0.55);
const nearBase = new THREE.Vector3(CP, 0, 0);
let brownPos = new THREE.Vector3(CP + 0.55, 0.75, 0.28);

// near triangles (small) — green (X-Z face-ish) and cyan (Y face)
let greenNear = triangleMesh(new THREE.Vector3(0,0,0), nearImgTop, nearBase, 0x33cc33);
let cyanNear = triangleMesh(new THREE.Vector3(0,0,0), nearBase, new THREE.Vector3(CP, -1.5, -0.63), 0x33ccff);

registerInteractive(greenNear, {
  title: 'Similar Triangle (near, green)',
  tooltip: 'Similar triangles: x/f = X/Z',
  body: 'This green triangle near the pinhole is similar to the large green triangle out in the scene. Matching angles give x/f = X/Z, one of the two perspective projection equations.'
});
registerInteractive(cyanNear, {
  title: 'Similar Triangle (near, cyan)',
  tooltip: 'Similar triangles: y/f = Y/Z',
  body: 'This cyan triangle near the pinhole is similar to the large cyan triangle out in the scene. Matching angles give y/f = Y/Z, the second perspective projection equation.'
});

// x, y axes on the image plane (green arrows)
lineBetween(new THREE.Vector3(CP, 0, 0), new THREE.Vector3(CP, 1.5, 0.63), 0x33aa33, false);
const xArrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 10), new THREE.MeshBasicMaterial({ color: 0x33aa33 }));
xArrowHead.position.set(CP, 1.5, 0.63);
grp.add(xArrowHead);
lineBetween(new THREE.Vector3(CP, 0, 0), new THREE.Vector3(CP - 0.35, -1.9, -0.8), 0x33aa33, false);
const yImgArrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 10), new THREE.MeshBasicMaterial({ color: 0x33aa33 }));
yImgArrowHead.position.set(CP - 0.35, -1.9, -0.8);
grp.add(yImgArrowHead);

// red vertical edge on image plane
lineBetween(new THREE.Vector3(CP, 1.5, 0.63), new THREE.Vector3(CP, -1.5, -0.63), 0xff2222, false);

// brown sphere (small object near camera)
const brownSphere = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), new THREE.MeshBasicMaterial({ color: 0x6b3a1f }));
brownSphere.position.copy(brownPos);
grp.add(brownSphere);
registerInteractive(brownSphere, {
  title: 'Projected Point (x, y)',
  tooltip: 'Object projection on image plane',
  body: 'This point represents where a 3D world point is imaged on the camera plane. Its coordinates (x, y) are the perspective projections of the world coordinates (X, Y, Z), scaled down by the ratio f/Z.'
});

// focal length line + label position
lineBetween(new THREE.Vector3(CP, -0.1, -0.05), new THREE.Vector3(-0.15, -0.1, -0.05), 0x000000, false);

// ── Far scene: large triangles and object point ──
const FAR = 6.4;
let redPos = new THREE.Vector3(FAR * 0.62, -1.35, 1.35);
const farTop = new THREE.Vector3(FAR, 2.1, 0);
const farBottomFront = new THREE.Vector3(FAR, -2.9, 2.9);
const farBottomBack = new THREE.Vector3(FAR, -2.9, 0);

let greenFar = triangleMesh(new THREE.Vector3(0,0,0), farBottomBack, farBottomFront, 0x33cc33);
let cyanFar = triangleMesh(new THREE.Vector3(0,0,0), farTop, farBottomBack, 0x33ccff);

registerInteractive(greenFar, {
  title: 'Similar Triangle (far, green)',
  tooltip: 'World-space X/Z triangle',
  body: 'The large green triangle spans from the pinhole out to the object in the world. Its base X and depth Z are similar in proportion to the small green triangle at the image plane, giving x/f = X/Z.'
});
registerInteractive(cyanFar, {
  title: 'Similar Triangle (far, cyan)',
  tooltip: 'World-space Y/Z triangle',
  body: 'The large cyan triangle spans from the pinhole out to the object height Y in the world. It is similar to the small cyan triangle at the image plane, giving y/f = Y/Z.'
});

// red edges at far plane
lineBetween(farTop, farBottomBack, 0xff2222, false);
lineBetween(farBottomBack, farBottomFront, 0xff2222, false);

// red object sphere
const redSphere = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), new THREE.MeshBasicMaterial({ color: 0xee1111 }));
redSphere.position.copy(redPos);
grp.add(redSphere);
registerInteractive(redSphere, {
  title: 'Object Point (X, Y, Z)',
  tooltip: 'World-space object',
  body: 'This red point is a 3D object in the world, located at coordinates (X, Y, Z) relative to the pinhole. As Z increases (moves farther away), its projection onto the image plane shrinks — the hallmark of perspective projection.'
});

// vertical gray helper line from red point down to axis (as in figure)
lineBetween(redPos, new THREE.Vector3(redPos.x, -2.9, redPos.z), 0x999999, false);
lineBetween(farTop, new THREE.Vector3(farTop.x, 0, 0), 0x999999, false);

// ── Projection (dotted) lines through pinhole ──
const projLine1 = lineBetween(brownPos, new THREE.Vector3(0,0,0), 0x000000, true);
const projLine2 = lineBetween(new THREE.Vector3(0,0,0), redPos, 0x000000, true);
[projLine1, projLine2].forEach(l => registerInteractive(l, {
  title: 'Projection Ray',
  tooltip: 'Hover: projection ray (similar triangles)',
  body: 'This dashed ray traces the straight-line path of light from the world point, through the pinhole, to its projection on the image plane. Because it is a straight line, the two triangles it forms on either side of the pinhole are similar.'
}));

function updateObjectPositions() {
  const t = pinholeClicked ? 1 : 0;
  const newRed = new THREE.Vector3(THREE.MathUtils.lerp(FAR*0.62, FAR*0.85, t), THREE.MathUtils.lerp(-1.35, -2.0, t), THREE.MathUtils.lerp(1.35, 2.0, t));
  redSphere.position.copy(newRed);
  const newBrown = new THREE.Vector3(CP + 0.55, THREE.MathUtils.lerp(0.75, 0.5, t), THREE.MathUtils.lerp(0.28, 0.19, t));
  brownSphere.position.copy(newBrown);
  projLine1.geometry.setFromPoints([newBrown, new THREE.Vector3(0,0,0)]);
  projLine1.computeLineDistances();
  projLine2.geometry.setFromPoints([new THREE.Vector3(0,0,0), newRed]);
  projLine2.computeLineDistances();
}

// ── Labels ──
addLabel('<i>Z</i>', new THREE.Vector3(3.4, 0.35, 0), { fontSize: '26px' });
addLabel('<i>Y</i>', new THREE.Vector3(FAR, 2.3, 0), { fontSize: '26px' });
addLabel('<i>X</i>', new THREE.Vector3(FAR, -3.15, 1.45), { fontSize: '26px' });
addLabel('<i>x</i>', new THREE.Vector3(CP + 0.1, 1.75, 0.7), { fontSize: '24px' });
addLabel('<i>y</i>', new THREE.Vector3(CP - 0.55, -2.1, -0.85), { fontSize: '24px' });
addLabel('<i>f</i>', new THREE.Vector3(-1.2, -0.35, -0.05), { fontSize: '24px' });

// ── Camera view ──
setCameraView({
  projection: 'orthographic',
  azimuthDeg: 90,
  elevationDeg: 12,
  rollDeg: 0,
  zoom: 0.95,
  target: [1.5, -0.3, 0],
  heightFraction: 0.8
});
// @FIGURE_CODE_END

  </script>
