<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Lightweight hover tooltip for generated 3D explainers ───────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

  <script type="importmap">
  {
    "imports": {

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    // Show error overlay if module scripts fail or take too long
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    // Timeout fallback: if nothing renders in 12s, show overlay
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    let camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // HOME view will be computed from the scene bounds so different scenes
    // (especially tall ones) get a consistent starting zoom/angle while
    // still allowing interactive OrbitControls.
    const HOME_POS = new THREE.Vector3();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    let HOME_ZOOM = 0.75;

    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      camera.zoom = HOME_ZOOM;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // Framing parameters
    const FRAME_HALF_HEIGHT = d; // base frustum half-height used when computing zoom
    const FRAME_MARGIN = 0.08;   // fraction of extra space around content
    const MIN_ZOOM = 0.2;
    const MAX_ZOOM = 5;

    function computeSceneBounds() {
      const box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) {
        // fallback box so empty scenes get a sensible frame
        box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(2 * d, 2 * d, 2 * d));
      }
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { box, center, size };
    }

    /**
     * setCameraView(options)
     * - azimuthDeg: horizontal angle around Y axis, in degrees.
     * - elevationDeg: angle above the ground/XZ plane, in degrees.
     * - zoom: optional orthographic zoom. If omitted, derived from content bounds.
     * - target: optional [x,y,z] camera target. If omitted, uses scene bounds center.
     * - heightFraction: fraction of the view the content's height should occupy.
     * This is the preferred per-figure camera API for matching the source image.
     */
    function setCameraView({
      projection = 'orthographic',
      azimuthDeg = 45,
      elevationDeg = 35,
      rollDeg = 0,
      zoom = null,
      target = null,
      heightFraction = 0.5,
      distanceScale = 1.2
    } = {}) {
      const { center, size } = computeSceneBounds();
      const viewTarget = Array.isArray(target)
        ? new THREE.Vector3(target[0] || 0, target[1] || 0, target[2] || 0)
        : center;

      // Compute zoom so contentHeight occupies `heightFraction` of the view height
      const contentHeight = Math.max(size.y, 1e-6);
      const desiredViewHeight = contentHeight / Math.max(heightFraction, 0.01);
      let resolvedZoom = Number.isFinite(zoom) ? zoom : (2 * FRAME_HALF_HEIGHT) / desiredViewHeight;
      resolvedZoom = Math.min(Math.max(resolvedZoom, MIN_ZOOM), MAX_ZOOM);
      camera.zoom = resolvedZoom;

      // Place camera at a distance scaled to scene size so the viewing angle is meaningful.
      const radius = Math.max(size.length() * distanceScale, FRAME_HALF_HEIGHT * 2);
      const azimuth = THREE.MathUtils.degToRad(azimuthDeg);
      const elevation = THREE.MathUtils.degToRad(elevationDeg);
      const cosElev = Math.cos(elevation);
      const x = viewTarget.x + radius * Math.cos(azimuth) * cosElev;
      const y = viewTarget.y + radius * Math.sin(elevation);
      const z = viewTarget.z + radius * Math.sin(azimuth) * cosElev;
      camera.position.set(x, y, z);

      controls.target.copy(viewTarget);
      camera.up.set(0, 1, 0);
      if (Number.isFinite(rollDeg) && rollDeg !== 0) {
        const viewDir = new THREE.Vector3().subVectors(viewTarget, camera.position).normalize();
        camera.up.applyAxisAngle(viewDir, THREE.MathUtils.degToRad(rollDeg));
      }
      camera.updateProjectionMatrix();
      controls.update();

      HOME_POS.copy(camera.position);
      HOME_TARGET.copy(controls.target);
      HOME_ZOOM = camera.zoom;

      window.__figureCameraView = {
        projection,
        azimuthDeg,
        elevationDeg,
        rollDeg,
        zoom: camera.zoom,
        target: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    /**
     * setStandardView(options)
     * Backwards-compatible wrapper. Prefer setCameraView({ azimuthDeg, elevationDeg, ... }).
     */
    function setStandardView({ azimuth = Math.PI / 4, polar = Math.PI / 4, heightFraction = 0.5 } = {}) {
      const azimuthDeg = THREE.MathUtils.radToDeg(azimuth);
      const elevationDeg = 90 - THREE.MathUtils.radToDeg(polar);
      setCameraView({ azimuthDeg, elevationDeg, heightFraction });
    }

    // Apply a standard view once at startup so tall/narrow scenes get a similar framing.
    // Call this again after adding or loading scene content that changes bounds.
    setStandardView();

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];
    const _v = new THREE.Vector3();

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color) div.style.color = options.color;
      if (options.fontSize) div.style.fontSize = options.fontSize;
      if (options.bold) div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background = options.background;
        div.style.padding = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    const _referenceDistance = 8;

    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);

        // Hide labels that are behind the camera or outside the normalized device
        // coordinate cube to avoid showing offscreen labels.
        if (_v.z > 1 || _v.z < -1 || _v.x < -1 || _v.x > 1 || _v.y < -1 || _v.y > 1) {
          div.style.display = 'none';
          continue;
        }
        div.style.display = '';

        const ox = offset && offset[0] ? offset[0] : 0;
        const oy = offset && offset[1] ? offset[1] : 0;
        const x = (_v.x * 0.5 + 0.5) * canvas.clientWidth + ox;
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + oy;

        // Compute scale differently for orthographic vs perspective cameras.
        let scale;
        const distance = Math.max(camera.position.distanceTo(pos), 1e-4);
        scale = (_referenceDistance / distance) * (camera.zoom || 1);

        // Clamp scale to a reasonable range to avoid extremely small/large labels.
        scale = Math.max(0.5, Math.min(scale, 6));

        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }

    /* ── Interaction explainer helpers ───────────────────────────────────── */
    const _tooltip = document.getElementById('figTooltip');
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _interactiveObjects = [];
    let _hoveredInteractive = null;

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title, body }, '*');
    }

    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }

    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      const pad = 12;
      const x = Math.min(event.clientX + pad, window.innerWidth - _tooltip.offsetWidth - pad);
      const y = Math.max(pad, event.clientY - _tooltip.offsetHeight - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }

    function _setPointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function _firstInteractiveHit(event) {
      if (!_interactiveObjects.length) return null;
      _setPointerFromEvent(event);
      _raycaster.setFromCamera(_pointer, camera);
      const hits = _raycaster.intersectObjects(_interactiveObjects.map(entry => entry.object), true);
      for (const hit of hits) {
        let obj = hit.object;
        while (obj) {
          const entry = _interactiveObjects.find(item => item.object === obj);
          if (entry) return { ...entry, hit };
          obj = obj.parent;
        }
      }
      return null;
    }

    function registerInteractive(object, info = {}) {
      if (!object) return object;
      object.userData = object.userData || {};
      object.userData.interactive = true;
      _interactiveObjects.push({ object, info });
      return object;
    }

    canvas.addEventListener('pointermove', (event) => {
      moveTooltip(event);
      const entry = _firstInteractiveHit(event);
      if (entry) {
        _hoveredInteractive = entry;
        canvas.style.cursor = 'pointer';
        showTooltip(entry.info.tooltip || entry.info.title || 'Click to explain', event);
      } else {
        _hoveredInteractive = null;
        canvas.style.cursor = controls.enabled ? 'grab' : 'default';
        hideTooltip();
      }
    });

    canvas.addEventListener('pointerleave', () => {
      _hoveredInteractive = null;
      canvas.style.cursor = 'default';
      hideTooltip();
    });

    canvas.addEventListener('click', (event) => {
      const entry = _firstInteractiveHit(event) || _hoveredInteractive;
      if (!entry) {
        hidePopup();
        return;
      }
      const title = entry.info.title || entry.info.tooltip || 'Figure element';
      const body = entry.info.body || entry.info.description || 'This part is interactive.';
      showPopup(title, body);
      if (typeof entry.info.onClick === 'function') entry.info.onClick(entry.hit, entry.object);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hidePopup();
        hideTooltip();
      }
    });

    /* ── Render loop ─────────────────────────────────────────────────────── */
    let _firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
      // Frame counter used by the headless verifier to prove the render loop is
      // actually alive (not frozen by an exception thrown after the first frame).
      window.__figFrames = (window.__figFrames || 0) + 1;
      if (_firstFrame) { _firstFrame = false; window.__markRendered?.(); }
    }
    animate();

    /* ── Verification hook (invisible; read by the headless verifier) ──────── */
    // Exposes the live objects so automated checks can confirm the GPU drew
    // something, the scene has content, and no geometry has NaN coordinates.
    window.__figverify = { renderer, scene, camera, controls };

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // @FIGURE_CODE_BEGIN
// birdPath -> Group of small V-shaped Line "birds" receding along path, scale shrinking
// cameraPlane -> LineSegments wireframe quad grey + faint fill
// vanishingPoint -> small black dot (SphereGeometry)
// observerO -> larger black sphere at O
// velocityVectors -> red ArrowHelper along path
// projectionLines -> green Line from O to each bird

const state = { pathOffset: 0, playing: true };

const N = 7;
// Path recedes diagonally to the right and slightly up-then-down like source (birds go up then level off)
const pathStart = new THREE.Vector3(-6.5, 0.9, -0.3);
const pathEnd = new THREE.Vector3(6.0, 2.6, 3.2);

const O = new THREE.Vector3(-0.3, -1.0, 0);

const birdGroup = new THREE.Group();
scene.add(birdGroup);
const projGroup = new THREE.Group();
scene.add(projGroup);
const velGroup = new THREE.Group();
scene.add(velGroup);

// Observer O
const oGeo = new THREE.SphereGeometry(0.16, 16, 16);
const oMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const oMesh = new THREE.Mesh(oGeo, oMat);
oMesh.position.copy(O);
scene.add(oMesh);
registerInteractive(oMesh, {
  title: 'Observer O',
  body: 'This is the camera/observer position. All projection rays converge here as the pinhole through which the bird\'s image is formed on the camera plane.',
  tooltip: 'Observer O'
});
addLabel('O', new THREE.Vector3(O.x - 0.15, O.y - 0.35, O.z), { fontSize: '16px', bold: true });

// Camera plane: vertical quad just in front of O, oriented facing along +X (toward path direction)
const planeCenter = new THREE.Vector3(O.x + 0.9, O.y + 0.9, O.z + 0.1);
const planeW = 1.5, planeH = 2.3;
const right = new THREE.Vector3(0, 0, 1);
const up = new THREE.Vector3(0, 1, 0);
function planeCorner(sx, sy) {
  return planeCenter.clone()
    .add(right.clone().multiplyScalar(sx * planeW / 2))
    .add(up.clone().multiplyScalar(sy * planeH / 2));
}
const p00 = planeCorner(-1,-1), p10 = planeCorner(1,-1), p11 = planeCorner(1,1), p01 = planeCorner(-1,1);
const planePts = [p00,p10, p10,p11, p11,p01, p01,p00];
const planeGeo = new THREE.BufferGeometry().setFromPoints(planePts);
const planeMat = new THREE.LineBasicMaterial({ color: 0x555555 });
const planeLines = new THREE.LineSegments(planeGeo, planeMat);
scene.add(planeLines);
registerInteractive(planeLines, {
  title: 'Camera plane',
  body: 'This represents the image plane of the camera, where the 3D bird positions are projected via perspective projection through the observer point O.',
  tooltip: 'Camera image plane'
});
const planeFillGeo = new THREE.BufferGeometry();
const positions = new Float32Array([
  p00.x,p00.y,p00.z, p10.x,p10.y,p10.z, p11.x,p11.y,p11.z,
  p00.x,p00.y,p00.z, p11.x,p11.y,p11.z, p01.x,p01.y,p01.z
]);
planeFillGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
planeFillGeo.computeVertexNormals();
const planeFillMat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent:true, opacity:0.1, side: THREE.DoubleSide });
scene.add(new THREE.Mesh(planeFillGeo, planeFillMat));

// Vanishing point: intersection with plane along path direction from O
const pathDir = new THREE.Vector3().subVectors(pathEnd, pathStart).normalize();
const tParam = (planeCenter.x - O.x) / pathDir.x;
const vpPos = O.clone().add(pathDir.clone().multiplyScalar(tParam));
vpPos.y -= 0.25;
const vpGeo = new THREE.SphereGeometry(0.07, 12, 12);
const vpMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const vpMesh = new THREE.Mesh(vpGeo, vpMat);
vpMesh.position.copy(vpPos);
scene.add(vpMesh);
registerInteractive(vpMesh, {
  title: 'Vanishing point',
  body: 'As the bird flies away with constant 3D velocity, its projected image position converges to this fixed point over time — the vanishing point, determined only by the direction of velocity, not by starting position.',
  tooltip: 'Vanishing point'
});
addLabel('Vanishing point', new THREE.Vector3(vpPos.x + 0.1, vpPos.y - 0.35, vpPos.z), { fontSize: '14px' });

function makeBird(scale) {
  const pts = [
    new THREE.Vector3(-0.5,0,0), new THREE.Vector3(0,0.28,0), new THREE.Vector3(0.5,0,0)
  ];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x111111 });
  const line = new THREE.Line(geo, mat);
  line.scale.setScalar(scale);
  return line;
}

let birds = [], velArrows = [], projLines = [];

function birdPosAt(tt, offset) {
  const pos = new THREE.Vector3().lerpVectors(pathStart, pathEnd, tt);
  pos.y += offset * (1 - tt) * 0.5;
  return pos;
}

function buildScene() {
  birds.forEach(b=>birdGroup.remove(b));
  velArrows.forEach(a=>velGroup.remove(a));
  projLines.forEach(l=>projGroup.remove(l));
  birds = []; velArrows = []; projLines = [];

  const offset = state.pathOffset;

  for (let i = 0; i < N; i++) {
    const tt = i / (N - 1);
    const basePos = birdPosAt(tt, offset);
    const scale = 0.65 - tt * 0.42;
    const bird = makeBird(Math.max(scale, 0.14));
    bird.position.copy(basePos);
    birdGroup.add(bird);
    birds.push(bird);

    if (i < N - 1) {
      const nextPos = birdPosAt((i+1)/(N-1), offset);
      const arrowDir = new THREE.Vector3().subVectors(nextPos, basePos).normalize();
      const arrow = new THREE.ArrowHelper(arrowDir, basePos.clone(), basePos.distanceTo(nextPos)*0.7, 0xdd0000, 0.15, 0.09);
      velGroup.add(arrow);
      velArrows.push(arrow);
    }

    // Only draw projection rays for the "close" birds inside camera plane region (small birds near O)
    if (tt > 0.35) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([O, basePos]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x22aa22 });
      const projLine = new THREE.Line(lineGeo, lineMat);
      projGroup.add(projLine);
      projLines.push(projLine);
      registerInteractive(projLine, {
        title: 'Projection ray',
        body: 'Each straight line traces a ray from the bird\'s 3D position through the observer O, showing how the point projects onto the camera plane along a perspective ray.',
        tooltip: 'Projection ray'
      });
    }
  }
}

buildScene();

const vLabelPos1 = birdPosAt(0.5, 0).clone().add(new THREE.Vector3(0,0.45,0));
addLabel('<b>V</b>', vLabelPos1, { fontSize: '18px' });

// second (lower) velocity vector + ray, illustrating a parallel path at different offset going to same vanishing point
const farStart = new THREE.Vector3(O.x + 1.4, O.y - 0.15, O.z + 0.05);
const farEnd = new THREE.Vector3(O.x + 3.2, O.y - 0.1, O.z + 0.1);
const farDir = new THREE.Vector3().subVectors(farEnd, farStart).normalize();
const farArrow = new THREE.ArrowHelper(farDir, farStart, farStart.distanceTo(farEnd), 0xdd0000, 0.18, 0.1);
scene.add(farArrow);
addLabel('<b>V</b>', new THREE.Vector3((farStart.x+farEnd.x)/2, farStart.y+0.35, farStart.z), { fontSize: '18px' });

const farRayEnd = new THREE.Vector3(O.x + 6.5, O.y + 0.05, O.z + 0.15);
const farLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([O, farRayEnd]), new THREE.LineBasicMaterial({ color: 0x22aa22 }));
scene.add(farLine);

// UI wiring
const dragEl = document.getElementById('dragPath');
const toggleEl = document.getElementById('toggleVelocity');
dragEl.addEventListener('input', (e) => {
  state.pathOffset = parseFloat(e.target.value);
  buildScene();
});
toggleEl.addEventListener('change', (e) => {
  state.playing = e.target.checked;
});

let clock = 0;
let lastTime = null;
function rafLoop(time) {
  if (lastTime === null) lastTime = time;
  const delta = (time - lastTime) / 1000;
  lastTime = time;
  if (state.playing) {
    clock += delta;
  }
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

window.goToStep = function(step) {
  if (step && step.control_values) {
    if ('dragPath' in step.control_values) {
      state.pathOffset = step.control_values.dragPath;
      dragEl.value = state.pathOffset;
      buildScene();
    }
    if ('toggleVelocity' in step.control_values) {
      state.playing = !!step.control_values.toggleVelocity;
      toggleEl.checked = state.playing;
    }
  }
};

setCameraView({
  projection: 'orthographic',
  azimuthDeg: 90,
  elevationDeg: 8,
  rollDeg: 0,
  zoom: 1.0,
  target: [0, 0.8, 1.2],
  heightFraction: 0.75
});
// @FIGURE_CODE_END

  </script>
