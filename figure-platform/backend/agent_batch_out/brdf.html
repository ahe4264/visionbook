<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    /* ── Reset & canvas fill ─────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Floating HTML labels ────────────────────────────────────────────── */
    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    /* ── Control panel ───────────────────────────────────────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Lightweight hover tooltip for generated 3D explainers ───────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    // Show error overlay if module scripts fail or take too long
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    // Timeout fallback: if nothing renders in 12s, show overlay
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── Renderer ────────────────────────────────────────────────────────── */
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    /* ── Scene ───────────────────────────────────────────────────────────── */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    /* ── Orthographic camera ─────────────────────────────────────────────── */
    const d = 3;                              // half-height in world units
    let aspect = canvas.clientWidth / canvas.clientHeight;
    let camera = new THREE.OrthographicCamera(
      -d * aspect, d * aspect, d, -d, 0.1, 100
    );
    camera.position.set(4, 4, 4);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    /* ── Controls ────────────────────────────────────────────────────────── */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // HOME view will be computed from the scene bounds so different scenes
    // (especially tall ones) get a consistent starting zoom/angle while
    // still allowing interactive OrbitControls.
    const HOME_POS = new THREE.Vector3();
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    let HOME_ZOOM = 0.75;

    document.getElementById('btnReset').addEventListener('click', () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
      camera.zoom = HOME_ZOOM;
      camera.updateProjectionMatrix();
      controls.update();
    });

    // Framing parameters
    const FRAME_HALF_HEIGHT = d; // base frustum half-height used when computing zoom
    const FRAME_MARGIN = 0.08;   // fraction of extra space around content
    const MIN_ZOOM = 0.2;
    const MAX_ZOOM = 5;

    function computeSceneBounds() {
      const box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) {
        // fallback box so empty scenes get a sensible frame
        box.setFromCenterAndSize(new THREE.Vector3(0, 0, 0), new THREE.Vector3(2 * d, 2 * d, 2 * d));
      }
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { box, center, size };
    }

    /**
     * setCameraView(options)
     * - azimuthDeg: horizontal angle around Y axis, in degrees.
     * - elevationDeg: angle above the ground/XZ plane, in degrees.
     * - zoom: optional orthographic zoom. If omitted, derived from content bounds.
     * - target: optional [x,y,z] camera target. If omitted, uses scene bounds center.
     * - heightFraction: fraction of the view the content's height should occupy.
     * This is the preferred per-figure camera API for matching the source image.
     */
    function setCameraView({
      projection = 'orthographic',
      azimuthDeg = 45,
      elevationDeg = 35,
      rollDeg = 0,
      zoom = null,
      target = null,
      heightFraction = 0.5,
      distanceScale = 1.2
    } = {}) {
      const { center, size } = computeSceneBounds();
      const viewTarget = Array.isArray(target)
        ? new THREE.Vector3(target[0] || 0, target[1] || 0, target[2] || 0)
        : center;

      // Compute zoom so contentHeight occupies `heightFraction` of the view height
      const contentHeight = Math.max(size.y, 1e-6);
      const desiredViewHeight = contentHeight / Math.max(heightFraction, 0.01);
      let resolvedZoom = Number.isFinite(zoom) ? zoom : (2 * FRAME_HALF_HEIGHT) / desiredViewHeight;
      resolvedZoom = Math.min(Math.max(resolvedZoom, MIN_ZOOM), MAX_ZOOM);
      camera.zoom = resolvedZoom;

      // Place camera at a distance scaled to scene size so the viewing angle is meaningful.
      const radius = Math.max(size.length() * distanceScale, FRAME_HALF_HEIGHT * 2);
      const azimuth = THREE.MathUtils.degToRad(azimuthDeg);
      const elevation = THREE.MathUtils.degToRad(elevationDeg);
      const cosElev = Math.cos(elevation);
      const x = viewTarget.x + radius * Math.cos(azimuth) * cosElev;
      const y = viewTarget.y + radius * Math.sin(elevation);
      const z = viewTarget.z + radius * Math.sin(azimuth) * cosElev;
      camera.position.set(x, y, z);

      controls.target.copy(viewTarget);
      camera.up.set(0, 1, 0);
      if (Number.isFinite(rollDeg) && rollDeg !== 0) {
        const viewDir = new THREE.Vector3().subVectors(viewTarget, camera.position).normalize();
        camera.up.applyAxisAngle(viewDir, THREE.MathUtils.degToRad(rollDeg));
      }
      camera.updateProjectionMatrix();
      controls.update();

      HOME_POS.copy(camera.position);
      HOME_TARGET.copy(controls.target);
      HOME_ZOOM = camera.zoom;

      window.__figureCameraView = {
        projection,
        azimuthDeg,
        elevationDeg,
        rollDeg,
        zoom: camera.zoom,
        target: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    /**
     * setStandardView(options)
     * Backwards-compatible wrapper. Prefer setCameraView({ azimuthDeg, elevationDeg, ... }).
     */
    function setStandardView({ azimuth = Math.PI / 4, polar = Math.PI / 4, heightFraction = 0.5 } = {}) {
      const azimuthDeg = THREE.MathUtils.radToDeg(azimuth);
      const elevationDeg = 90 - THREE.MathUtils.radToDeg(polar);
      setCameraView({ azimuthDeg, elevationDeg, heightFraction });
    }

    // Apply a standard view once at startup so tall/narrow scenes get a similar framing.
    // Call this again after adding or loading scene content that changes bounds.
    setStandardView();

    /* ── Label system ────────────────────────────────────────────────────── */
    const _labels = [];
    const _v = new THREE.Vector3();

    /**
     * addLabel(text, position3D, options?) → entry
     *   text     : HTML string  ('x<sub>1</sub>', '&lambda;', '<b>bold</b>', …)
     *   position : THREE.Vector3 (world space)
     *   options  : {
     *       color     : css color string  (default '#111')
     *       fontSize  : css string        (default '13px')
     *       bold      : boolean           (default false)
     *       offset    : [dx, dy] pixels   (default [0, 0])
     *       background: css string        (default 'none')
     *     }
     *   Returns an entry object; update entry.pos.set(x,y,z) to reposition.
     */
    function addLabel(text, position, options = {}) {
      const div = document.createElement('div');
      div.className = 'lbl';
      div.innerHTML = text;
      if (options.color) div.style.color = options.color;
      if (options.fontSize) div.style.fontSize = options.fontSize;
      if (options.bold) div.style.fontWeight = 'bold';
      if (options.background) {
        div.style.background = options.background;
        div.style.padding = '1px 4px';
        div.style.borderRadius = '3px';
      }
      document.body.appendChild(div);
      const entry = { div, pos: position.clone(), offset: options.offset || [0, 0] };
      _labels.push(entry);
      return entry;
    }

    const _referenceDistance = 8;

    function _syncLabels() {
      for (const { div, pos, offset } of _labels) {
        _v.copy(pos).project(camera);

        // Hide labels that are behind the camera or outside the normalized device
        // coordinate cube to avoid showing offscreen labels.
        if (_v.z > 1 || _v.z < -1 || _v.x < -1 || _v.x > 1 || _v.y < -1 || _v.y > 1) {
          div.style.display = 'none';
          continue;
        }
        div.style.display = '';

        const ox = offset && offset[0] ? offset[0] : 0;
        const oy = offset && offset[1] ? offset[1] : 0;
        const x = (_v.x * 0.5 + 0.5) * canvas.clientWidth + ox;
        const y = (-_v.y * 0.5 + 0.5) * canvas.clientHeight + oy;

        // Compute scale differently for orthographic vs perspective cameras.
        let scale;
        const distance = Math.max(camera.position.distanceTo(pos), 1e-4);
        scale = (_referenceDistance / distance) * (camera.zoom || 1);

        // Clamp scale to a reasonable range to avoid extremely small/large labels.
        scale = Math.max(0.5, Math.min(scale, 6));

        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }

    /* ── Interaction explainer helpers ───────────────────────────────────── */
    const _tooltip = document.getElementById('figTooltip');
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _interactiveObjects = [];
    let _hoveredInteractive = null;

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title, body }, '*');
    }

    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }

    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      const pad = 12;
      const x = Math.min(event.clientX + pad, window.innerWidth - _tooltip.offsetWidth - pad);
      const y = Math.max(pad, event.clientY - _tooltip.offsetHeight - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }

    function _setPointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function _firstInteractiveHit(event) {
      if (!_interactiveObjects.length) return null;
      _setPointerFromEvent(event);
      _raycaster.setFromCamera(_pointer, camera);
      const hits = _raycaster.intersectObjects(_interactiveObjects.map(entry => entry.object), true);
      for (const hit of hits) {
        let obj = hit.object;
        while (obj) {
          const entry = _interactiveObjects.find(item => item.object === obj);
          if (entry) return { ...entry, hit };
          obj = obj.parent;
        }
      }
      return null;
    }

    function registerInteractive(object, info = {}) {
      if (!object) return object;
      object.userData = object.userData || {};
      object.userData.interactive = true;
      _interactiveObjects.push({ object, info });
      return object;
    }

    canvas.addEventListener('pointermove', (event) => {
      moveTooltip(event);
      const entry = _firstInteractiveHit(event);
      if (entry) {
        _hoveredInteractive = entry;
        canvas.style.cursor = 'pointer';
        showTooltip(entry.info.tooltip || entry.info.title || 'Click to explain', event);
      } else {
        _hoveredInteractive = null;
        canvas.style.cursor = controls.enabled ? 'grab' : 'default';
        hideTooltip();
      }
    });

    canvas.addEventListener('pointerleave', () => {
      _hoveredInteractive = null;
      canvas.style.cursor = 'default';
      hideTooltip();
    });

    canvas.addEventListener('click', (event) => {
      const entry = _firstInteractiveHit(event) || _hoveredInteractive;
      if (!entry) {
        hidePopup();
        return;
      }
      const title = entry.info.title || entry.info.tooltip || 'Figure element';
      const body = entry.info.body || entry.info.description || 'This part is interactive.';
      showPopup(title, body);
      if (typeof entry.info.onClick === 'function') entry.info.onClick(entry.hit, entry.object);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hidePopup();
        hideTooltip();
      }
    });

    /* ── Render loop ─────────────────────────────────────────────────────── */
    let _firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
      // Frame counter used by the headless verifier to prove the render loop is
      // actually alive (not frozen by an exception thrown after the first frame).
      window.__figFrames = (window.__figFrames || 0) + 1;
      if (_firstFrame) { _firstFrame = false; window.__markRendered?.(); }
    }
    animate();

    /* ── Verification hook (invisible; read by the headless verifier) ──────── */
    // Exposes the live objects so automated checks can confirm the GPU drew
    // something, the scene has content, and no geometry has NaN coordinates.
    window.__figverify = { renderer, scene, camera, controls };

    /* ── Resize (ResizeObserver on canvas) ───────────────────────────────── */
    new ResizeObserver(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      aspect = w / h;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }).observe(canvas);

    // @FIGURE_CODE_BEGIN
// plane -> PlaneGeometry(8,5) green
// incoming ray lin -> Line thick orange/yellow gradient (use two-color tube via Line + color attr) + cone arrowhead
// outgoing rays lout -> ArrowHelper green (dark + light) fan of small arrows
// normal n -> ArrowHelper black
// p -> ArrowHelper black (toward light source, short)
// q -> ArrowHelper black (toward main outgoing dir)
// circle -> RingGeometry at origin

const origin = new THREE.Vector3(0,0,0);

// Plane
const planeGeo = new THREE.PlaneGeometry(8,5);
const planeMat = new THREE.MeshBasicMaterial({color:0x66ee00, side:THREE.DoubleSide});
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI/2;
scene.add(plane);
registerInteractive(plane, {
  title: 'Reflecting Surface',
  body: 'This green surface reflects incoming light. Its orientation, described by the normal vector n, determines how light scatters into outgoing rays.',
  tooltip: 'Surface'
});

// plane border
const edges = new THREE.EdgesGeometry(planeGeo);
const border = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x000000}));
border.rotation.x = -Math.PI/2;
scene.add(border);

// Normal n
const nDir = new THREE.Vector3(0,1,0);
const nArrow = new THREE.ArrowHelper(nDir, origin, 1.8, 0x000000, 0.25, 0.15);
scene.add(nArrow);
registerInteractive(nArrow, {
  title: 'Surface Normal (n)',
  body: 'The normal vector n is perpendicular to the surface at the point of incidence. Both the incoming and outgoing light directions are measured relative to n.',
  tooltip: 'n — surface normal'
});
addLabel('<b>n</b>', new THREE.Vector3(0,2.1,0), {fontSize:'22px'});

// state for incoming ray direction (angle from normal, azimuth)
const state = {
  incomingAzimuth: Math.PI, // direction ray comes FROM, in XZ plane (radians)
  incomingElevation: THREE.MathUtils.degToRad(55) // angle above plane
};

let linGroup, pArrow, qArrow, outArrows = [], ring;
const outLabelEntry = addLabel('<i>&#8467;</i><sub>out</sub>=F(<i>&#8467;</i><sub>in</sub>,<b>n</b>,&lambda;,<b>p</b>,<b>q</b>)', new THREE.Vector3(2.2,2.6,-1.3), {fontSize:'20px'});
const linLabelEntry = addLabel('<i>&#8467;</i><sub>in</sub>(&lambda;)', new THREE.Vector3(-2.3,2.0,2.0), {fontSize:'22px'});

function computeGeometry() {
  // p = direction FROM surface point TOWARD light source (i.e. -incoming ray direction)
  const p = new THREE.Vector3(
    Math.sin(state.incomingElevation) === 0 ? 0 : Math.cos(state.incomingAzimuth) * Math.cos(state.incomingElevation),
    Math.sin(state.incomingElevation),
    Math.sin(state.incomingAzimuth) * Math.cos(state.incomingElevation)
  ).normalize();
  return p;
}

function updateScene() {
  const p = computeGeometry();

  // remove old
  if (linGroup) scene.remove(linGroup);
  if (pArrow) scene.remove(pArrow);
  if (qArrow) scene.remove(qArrow);
  outArrows.forEach(a => scene.remove(a));
  outArrows = [];
  if (ring) scene.remove(ring);

  // incoming ray: comes from direction p, traveling toward origin (so from p*len to origin)
  const rayLen = 3.2;
  const start = p.clone().multiplyScalar(rayLen);
  linGroup = new THREE.Group();
  const geo = new THREE.BufferGeometry().setFromPoints([start, origin]);
  const colors = new Float32Array([1,0.9,0.1, 1,0.4,0.0]); // yellow to orange along length? reversed
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const mat = new THREE.LineBasicMaterial({vertexColors:true, linewidth:4});
  const line = new THREE.Line(geo, mat);
  linGroup.add(line);
  // arrowhead pointing to origin
  const dirToOrigin = origin.clone().sub(start).normalize();
  const headStart = start.clone().add(dirToOrigin.clone().multiplyScalar(rayLen*0.72));
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.09,0.32,12), new THREE.MeshBasicMaterial({color:0xff6600}));
  cone.position.copy(headStart.clone().add(dirToOrigin.clone().multiplyScalar(0.05)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirToOrigin);
  linGroup.add(cone);
  scene.add(linGroup);
  registerInteractive(linGroup, {
    title: 'Incoming Light Ray (ℓ_in)',
    body: 'This ray carries light of intensity ℓ_in(λ) traveling in direction p toward the surface. Drag this ray to see how its direction changes the outgoing reflection pattern.',
    tooltip: 'Drag to change incoming ray direction'
  });

  // p arrow (short, black, direction toward light source)
  pArrow = new THREE.ArrowHelper(p, origin, 1.3, 0x000000, 0.2, 0.12);
  scene.add(pArrow);
  registerInteractive(pArrow, {
    title: 'Direction p',
    body: 'The vector p points from the surface toward the source of incoming light. Together with n, it determines the angle of incidence used in the reflectance equation.',
    tooltip: 'p — toward light source'
  });

  // q: mirror-reflect p about n for the main outgoing direction
  const n = new THREE.Vector3(0,1,0);
  const q = p.clone().reflect(n).multiplyScalar(-1); // reflect gives incoming reflect; we want outgoing dir similar to n mirrored
  // Actually construct q as reflection of -p about n (specular-like), but keep close to source figure (q tilted right)
  const qDir = new THREE.Vector3(-p.x, p.y, -p.z).normalize();
  qArrow = new THREE.ArrowHelper(qDir, origin, 1.5, 0x000000, 0.2, 0.12);
  scene.add(qArrow);
  registerInteractive(qArrow, {
    title: 'Direction q',
    body: 'The vector q points toward the viewer/outgoing ray direction being measured. For a Lambertian surface, outgoing intensity does not depend on q, only on p and n.',
    tooltip: 'q — outgoing viewing direction'
  });

  // main outgoing ray (dark green), along qDir but longer, brighter if p is more aligned with n (Lambertian-like)
  const brightness = Math.max(0.15, p.dot(n));
  const mainOutLen = 2.2 + brightness*1.0;
  const mainOut = new THREE.ArrowHelper(qDir, origin, mainOutLen, 0x0a7d0a, 0.28, 0.16);
  scene.add(mainOut);
  outArrows.push(mainOut);
  registerInteractive(mainOut, {
    title: 'Outgoing Ray (ℓ_out)',
    body: 'This is the strongest reflected ray, ℓ_out = F(ℓ_in, n, λ, p, q). Its brightness depends on the alignment between the incoming direction p and the surface normal n.',
    tooltip: 'ℓ_out — main outgoing ray'
  });

  // secondary lighter green ray near normal
  const secondaryDir = new THREE.Vector3(0.15, 1, -0.05).normalize();
  const secondary = new THREE.ArrowHelper(secondaryDir, origin, 1.7, 0x90e090, 0.2, 0.12);
  scene.add(secondary);
  outArrows.push(secondary);

  // small fan of light-green arrows around origin (diffuse scatter)
  const fanCount = 7;
  for (let i=0;i<fanCount;i++){
    const ang = (i/fanCount)*Math.PI*2;
    const fdir = new THREE.Vector3(Math.cos(ang)*0.9, 0.35, Math.sin(ang)*0.9).normalize();
    const fArrow = new THREE.ArrowHelper(fdir, origin, 0.85, 0x7bd87b, 0.13, 0.08);
    scene.add(fArrow);
    outArrows.push(fArrow);
  }

  // circle (ring) at intersection point
  ring = new THREE.Mesh(new THREE.RingGeometry(0.18,0.24,32), new THREE.MeshBasicMaterial({color:0x000000, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.01;
  scene.add(ring);

  // labels p, q
  updateLabelPositions(p, qDir);
}

let pLabel, qLabel;
function updateLabelPositions(p, qDir) {
  if (!pLabel) {
    pLabel = addLabel('<b>p</b>', p.clone().multiplyScalar(1.3).add(new THREE.Vector3(0,0.15,0)), {fontSize:'22px'});
    qLabel = addLabel('<b>q</b>', qDir.clone().multiplyScalar(1.5).add(new THREE.Vector3(0,0.15,0)), {fontSize:'22px'});
  } else {
    pLabel.pos.copy(p.clone().multiplyScalar(1.3).add(new THREE.Vector3(0,0.15,0)));
    qLabel.pos.copy(qDir.clone().multiplyScalar(1.5).add(new THREE.Vector3(0,0.15,0)));
  }
}

updateScene();

setCameraView({
  projection: 'orthographic',
  azimuthDeg: 90,
  elevationDeg: 20,
  rollDeg: 0,
  zoom: 0.8,
  target: [0,0,0],
  heightFraction: 0.75
});

// Drag interaction for incoming ray
let dragging = false;
canvas.addEventListener('pointerdown', (event) => {
  const entry = _firstInteractiveHit(event);
  if (entry && entry.object === linGroup) {
    dragging = true;
    controls.enabled = false;
  }
});
window.addEventListener('pointermove', (event) => {
  if (!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const nx = ((event.clientX - rect.left)/rect.width)*2-1;
  const ny = -((event.clientY - rect.top)/rect.height)*2+1;
  // map horizontal drag to azimuth, vertical drag to elevation
  state.incomingAzimuth = Math.PI + nx*1.4;
  state.incomingElevation = THREE.MathUtils.degToRad(30 + (ny+1)*30);
  updateScene();
});
window.addEventListener('pointerup', () => {
  if (dragging) {
    dragging = false;
    controls.enabled = true;
  }
});

// demo steps
function goToStep(i) {
  if (i === 1) {
    state.incomingAzimuth = Math.PI + 0.6;
    state.incomingElevation = THREE.MathUtils.degToRad(40);
    updateScene();
  } else if (i === 2) {
    // highlight outgoing - no-op visually, camera stays
  } else {
    state.incomingAzimuth = Math.PI;
    state.incomingElevation = THREE.MathUtils.degToRad(55);
    updateScene();
  }
}
window.goToStep = goToStep;
// @FIGURE_CODE_END

  </script>
