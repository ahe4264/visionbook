<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<label><input id="comparisonEmphasisInput" type="checkbox" onchange="toggle_comparisonEmphasis(this.checked)"> Comparison emphasis</label><label>Trace loop rule <select id="loopTraceInput" onchange="update_loopTrace(this.value)"><option value="idle">idle</option><option value="leftR1Drop">left: cross R₁</option><option value="leftR2Drop">left: cross R₂</option><option value="leftV1Rise">left: cross V₁</option><option value="leftEquation">left: equation</option><option value="rightR3Drop">right: cross R₃</option><option value="rightR4Drop">right: cross R₄</option><option value="rightV2Drop">right: cross V₂</option><option value="rightR2Opposite">right: cross R₂ opposite</option><option value="rightEquation">right: equation</option></select></label><span><button onclick="trigger_selectB()">Junction b</button> <button onclick="trigger_selectE()">Junction e</button></span><span><button onclick="trigger_traceLeft()">Trace left loop</button> <button onclick="trigger_traceRight()">Trace right loop</button> <button onclick="trigger_clearLoop()">Clear</button></span><span id="demoNarration" style="display:block;margin:0;font-size:10px;max-width:180px;line-height:1.35"></span><span><button onclick="prevStep()">◀</button> <span id="stepLabel"></span> <button onclick="nextStep()">▶</button></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');

draw.viewbox(0, 0, W, H);

};

var currentLoopState = 'idle';

var stepIndex = 0;

function line(g, x1, y1, x2, y2, color, width, opacity) {
  return g.line(x1, y1, x2, y2).stroke({
    color: color || black,
    width: width || 2.3,
    linecap: 'round',
    linejoin: 'round',
    opacity: opacity == null ? 1 : opacity
  });
}

function ptsAttr(pts) {
  return pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
}

function zigH(g, x1, y, x2, color, width, opacity) {
  var n = 9, amp = 8.5, pts = [[x1, y]];
  var step = (x2 - x1) / n;
  for (var i = 1; i < n; i++) pts.push([x1 + i * step, y + (i % 2 ? -amp : amp)]);
  pts.push([x2, y]);
  return g.polyline(ptsAttr(pts)).fill('none').stroke({
    color: color || blue,
    width: width || 3.7,
    linecap: 'round',
    linejoin: 'round',
    opacity: opacity == null ? 1 : opacity
  });
}

function zigV(g, x, y1, y2, color, width, opacity) {
  var n = 9, amp = 8.5, pts = [[x, y1]];
  var step = (y2 - y1) / n;
  for (var i = 1; i < n; i++) pts.push([x + (i % 2 ? amp : -amp), y1 + i * step]);
  pts.push([x, y2]);
  return g.polyline(ptsAttr(pts)).fill('none').stroke({
    color: color || blue,
    width: width || 3.7,
    linecap: 'round',
    linejoin: 'round',
    opacity: opacity == null ? 1 : opacity
  });
}

function textHalo(g, s, x, y, size, opts) {
  opts = opts || {};
  var t = g.text(s).font({
    family: opts.family || 'Georgia, "Times New Roman", serif',
    size: size || 17,
    style: opts.italic ? 'italic' : 'normal'
  }).fill(opts.fill || '#111');
  t.attr({
    'paint-order': 'stroke',
    stroke: opts.stroke || '#ffffff',
    'stroke-width': opts.halo == null ? 3.2 : opts.halo,
    'stroke-linejoin': 'round'
  });
  if (opts.anchor) t.attr({ 'text-anchor': opts.anchor });
  t.move(x, y);
  return t;
}

function battery(g, p, leftPlateX, rightPlateX, longOnLeft) {
  var y = p.B;
  var longTop = y - 24, longBot = y + 18;
  var shortTop = y - 15, shortBot = y + 9;
  var longX = longOnLeft ? leftPlateX : rightPlateX;
  var shortX = longOnLeft ? rightPlateX : leftPlateX;

  line(g, leftPlateX - 24, y, leftPlateX - 5, y, black, 2.3);
  line(g, rightPlateX + 5, y, rightPlateX + 45, y, black, 2.3);
  line(g, longX, longTop, longX, longBot, black, 2.3);
  line(g, shortX, shortTop, shortX, shortBot, black, 2.3);

  if (longOnLeft) {
    textHalo(g, '+', longX - 20, y - 20, 18, { family: 'Arial, sans-serif', halo: 2.4 });
    textHalo(g, '−', shortX + 10, y - 22, 18, { family: 'Arial, sans-serif', halo: 2.4 });
  } else {
    textHalo(g, '−', shortX - 19, y - 22, 18, { family: 'Arial, sans-serif', halo: 2.4 });
    textHalo(g, '+', longX + 9, y - 20, 18, { family: 'Arial, sans-serif', halo: 2.4 });
  }
}

function drawCircuit(p, labeled) {
  var L = p.L, M = p.M, R = p.R, T = p.T, B = p.B;

  var r1a = L + 52, r1b = L + 100;
  var r3a = M + 78, r3b = M + 124;
  var r2a = T + 48, r2b = T + 94;
  var r4a = T + 48, r4b = T + 94;

  line(baseGroup, L, T, r1a, T);
  zigH(baseGroup, r1a, T, r1b);
  line(baseGroup, r1b, T, M, T);

  line(baseGroup, M, T, r3a, T);
  zigH(baseGroup, r3a, T, r3b);
  line(baseGroup, r3b, T, R, T);

  line(baseGroup, L, T, L, B);
  line(baseGroup, M, T, M, r2a);
  zigV(baseGroup, M, r2a, r2b);
  line(baseGroup, M, r2b, M, B);

  line(baseGroup, R, T, R, r4a);
  zigV(baseGroup, R, r4a, r4b);
  line(baseGroup, R, r4b, R, B);

  line(baseGroup, L, B, L + 56, B);
  battery(baseGroup, p, L + 82, L + 94, true);
  line(baseGroup, L + 139, B, M, B);

  line(baseGroup, M, B, M + 84, B);
  battery(baseGroup, p, M + 98, M + 110, false);
  line(baseGroup, M + 155, B, R, B);

  textHalo(labelGroup, 'R₁ = 3.00 Ω', L + 21, T - 41, 18);
  textHalo(labelGroup, 'R₃ = 3.00 Ω', M + 46, T - 41, 18);
  textHalo(labelGroup, 'R₂ = 3.00 Ω', M - 124, T + 62, 18);
  textHalo(labelGroup, 'R₄ = 4.00 Ω', R - 126, T + 62, 18);
  textHalo(labelGroup, 'V₁ = 24.00 V', L + 32, B - 44, 18);
  textHalo(labelGroup, 'V₂ = 29.00 V', M + 40, B - 44, 18);
  textHalo(labelGroup, p.label, (L + R) / 2 - 8, B + 37, 18, { family: 'Arial, sans-serif' });

  if (labeled) drawNodesForPanel(p);
}

function drawNodesForPanel(p) {
  var nodes = [
    ['a', p.L, p.T, -12, -31],
    ['b', p.M, p.T, -7, -31],
    ['c', p.R, p.T, -5, -31],
    ['f', p.L, p.B, -5, 7],
    ['e', p.M, p.B, -7, 7],
    ['d', p.R, p.B, -10, 7]
  ];
  nodes.forEach(function (n) {
    var name = n[0], x = n[1], y = n[2];
    nodeGroup.circle(8.6).center(x, y).fill(teal).stroke('none');
    textHalo(nodeGroup, name, x + n[3], y + n[4], 18, { italic: true, halo: 3 });
  });
}

function coords(name) {
  var p = panels.right;
  if (name === 'a') return { x: p.L, y: p.T };
  if (name === 'b') return { x: p.M, y: p.T };
  if (name === 'c') return { x: p.R, y: p.T };
  if (name === 'f') return { x: p.L, y: p.B };
  if (name === 'e') return { x: p.M, y: p.B };
  return { x: p.R, y: p.B };
}

function arrow(g, x1, y1, x2, y2, label, lx, ly, color) {
  color = color || warmDark;
  line(g, x1, y1, x2, y2, color, 3, 1);
  var ang = Math.atan2(y2 - y1, x2 - x1);
  var s = 9;
  var p1 = [x2, y2];
  var p2 = [x2 - s * Math.cos(ang - 0.55), y2 - s * Math.sin(ang - 0.55)];
  var p3 = [x2 - s * Math.cos(ang + 0.55), y2 - s * Math.sin(ang + 0.55)];
  g.polygon(ptsAttr([p1, p2, p3])).fill(color).stroke('none');
  if (label) textHalo(g, label, lx, ly, 14, { family: 'Arial, sans-serif', halo: 3 });
}

function equationBox(g, txt, x, y, w) {
  var width = w || Math.max(142, txt.length * 7.2 + 22);
  var h = 31;
  g.rect(width, h).move(x, y).radius(5).fill('#fff8e8').stroke({ color: warm, width: 1.4 });
  textHalo(g, txt, x + 9, y + 7, 14, { family: 'Arial, sans-serif', halo: 2 });
}

function toggle_comparisonEmphasis(on) {
  emphasisOn = !!on;
  redrawEmphasis();
}

function redrawEmphasis() {
  emphasisGroup.clear();
  if (!emphasisOn) return;
  var p = panels.right;
  [['a', p.L, p.T], ['b', p.M, p.T], ['c', p.R, p.T], ['f', p.L, p.B], ['e', p.M, p.B], ['d', p.R, p.B]].forEach(function (n) {
    emphasisGroup.circle(25).center(n[1], n[2]).fill({ color: teal, opacity: 0.12 }).stroke({ color: teal, width: 1.4, opacity: 0.55 });
  });
  line(emphasisGroup, p.L, p.T, p.M, p.T, teal, 7, 0.10);
  line(emphasisGroup, p.M, p.T, p.R, p.T, teal, 7, 0.10);
  line(emphasisGroup, p.L, p.B, p.M, p.B, teal, 7, 0.10);
  line(emphasisGroup, p.M, p.B, p.R, p.B, teal, 7, 0.10);
  line(emphasisGroup, p.L, p.T, p.L, p.B, teal, 7, 0.10);
  line(emphasisGroup, p.M, p.T, p.M, p.B, teal, 7, 0.10);
  line(emphasisGroup, p.R, p.T, p.R, p.B, teal, 7, 0.10);
}

function selectJunction(name, silent) {
  selectedJunction = name;
  currentLoopState = 'idle';
  var sel = document.getElementById('loopTraceInput');
  if (sel) sel.value = 'idle';
  redrawLoop();
  redrawJunction();
  if (!silent) {
    showPopup('Kirchhoff junction rule', name === 'b'
      ? 'At node b, current entering from branch a-b equals the current leaving through branches b-c and b-e. The equation is I_ab = I_bc + I_be.'
      : 'At node e, the currents entering through b-e and f-e equal the current leaving toward d. The equation is I_be + I_fe = I_ed.');
  }
}

function redrawJunction() {
  junctionGroup.clear();
  if (!selectedJunction) return;
  var p = panels.right;
  var b = coords('b'), e = coords('e');
  var a = coords('a'), c = coords('c'), f = coords('f'), d = coords('d');
  var node = selectedJunction === 'b' ? b : e;
  junctionGroup.circle(34).center(node.x, node.y).fill('none').stroke({ color: teal, width: 4, opacity: 0.68 });

  if (selectedJunction === 'b') {
    line(junctionGroup, a.x, a.y, b.x, b.y, warm, 10, 0.20);
    line(junctionGroup, b.x, b.y, c.x, c.y, warm, 10, 0.20);
    line(junctionGroup, b.x, b.y, e.x, e.y, warm, 10, 0.20);
    arrow(junctionGroup, p.L + 112, p.T - 18, p.M - 28, p.T - 18, 'I_ab', p.L + 125, p.T - 42, teal);
    arrow(junctionGroup, p.M + 28, p.T - 18, p.M + 114, p.T - 18, 'I_bc', p.M + 45, p.T - 42, teal);
    arrow(junctionGroup, p.M + 22, p.T + 34, p.M + 22, p.T + 103, 'I_be', p.M + 28, p.T + 60, teal);
    equationBox(junctionGroup, 'I_ab = I_bc + I_be', p.M + 42, p.T + 92, 158);
  } else {
    line(junctionGroup, b.x, b.y, e.x, e.y, warm, 10, 0.20);
    line(junctionGroup, f.x, f.y, e.x, e.y, warm, 10, 0.20);
    line(junctionGroup, e.x, e.y, d.x, d.y, warm, 10, 0.20);
    arrow(junctionGroup, p.M + 22, p.T + 107, p.M + 22, p.B - 30, 'I_be', p.M + 28, p.T + 136, teal);
    arrow(junctionGroup, p.L + 92, p.B + 22, p.M - 35, p.B + 22, 'I_fe', p.L + 119, p.B + 25, teal);
    arrow(junctionGroup, p.M + 35, p.B + 22, p.M + 132, p.B + 22, 'I_ed', p.M + 66, p.B + 25, teal);
    equationBox(junctionGroup, 'I_be + I_fe = I_ed', p.M + 30, p.B - 83, 168);
  }
}

function highlightResistor(g, which, opacity) {
  var p = panels.right;
  opacity = opacity == null ? 0.9 : opacity;
  if (which === 'R1') zigH(g, p.L + 52, p.T, p.L + 100, warm, 8, opacity);
  if (which === 'R3') zigH(g, p.M + 78, p.T, p.M + 124, warm, 8, opacity);
  if (which === 'R2') zigV(g, p.M, p.T + 48, p.T + 94, warm, 8, opacity);
  if (which === 'R4') zigV(g, p.R, p.T + 48, p.T + 94, warm, 8, opacity);
}

function highlightBattery(g, which, opacity) {
  var p = panels.right;
  opacity = opacity == null ? 0.9 : opacity;
  if (which === 'V1') g.rect(39, 58).move(p.L + 71, p.B - 32).radius(4).fill('none').stroke({ color: warm, width: 5, opacity: opacity });
  if (which === 'V2') g.rect(39, 58).move(p.M + 88, p.B - 32).radius(4).fill('none').stroke({ color: warm, width: 5, opacity: opacity });
}

function loopPath(g, side) {
  var p = panels.right;
  var pts = side === 'left'
    ? [[p.L, p.T], [p.M, p.T], [p.M, p.B], [p.L, p.B], [p.L, p.T]]
    : [[p.M, p.T], [p.R, p.T], [p.R, p.B], [p.M, p.B], [p.M, p.T]];
  g.polyline(ptsAttr(pts)).fill('none').stroke({ color: warm, width: 10, opacity: 0.25, linejoin: 'round', linecap: 'round' });
  if (side === 'left') {
    arrow(g, p.L + 58, p.T + 20, p.M - 36, p.T + 20, '', 0, 0, warm);
    arrow(g, p.M - 22, p.T + 62, p.M - 22, p.B - 54, '', 0, 0, warm);
    arrow(g, p.M - 42, p.B - 22, p.L + 70, p.B - 22, '', 0, 0, warm);
    arrow(g, p.L + 23, p.B - 52, p.L + 23, p.T + 62, '', 0, 0, warm);
  } else {
    arrow(g, p.M + 58, p.T + 20, p.R - 40, p.T + 20, '', 0, 0, warm);
    arrow(g, p.R - 23, p.T + 62, p.R - 23, p.B - 54, '', 0, 0, warm);
    arrow(g, p.R - 55, p.B - 22, p.M + 72, p.B - 22, '', 0, 0, warm);
    arrow(g, p.M - 22, p.B - 58, p.M - 22, p.T + 64, '', 0, 0, warm);
  }
}

function redrawLoop() {
  loopGroup.clear();
  if (currentLoopState === 'idle') return;
  selectedJunction = null;
  junctionGroup.clear();

  var p = panels.right;
  var left = currentLoopState.indexOf('left') === 0;
  loopPath(loopGroup, left ? 'left' : 'right');

  if (currentLoopState === 'leftR1Drop') {
    highlightResistor(loopGroup, 'R1');
    equationBox(loopGroup, '−I_ab R₁', p.L + 72, p.T + 117, 100);
  } else if (currentLoopState === 'leftR2Drop') {
    highlightResistor(loopGroup, 'R2');
    equationBox(loopGroup, '−I_ab R₁ − I_be R₂', p.L + 55, p.T + 117, 175);
  } else if (currentLoopState === 'leftV1Rise') {
    highlightBattery(loopGroup, 'V1');
    equationBox(loopGroup, '−I_ab R₁ − I_be R₂ + V₁', p.L + 44, p.T + 117, 210);
  } else if (currentLoopState === 'leftEquation') {
    highlightResistor(loopGroup, 'R1', 0.58);
    highlightResistor(loopGroup, 'R2', 0.58);
    highlightBattery(loopGroup, 'V1', 0.58);
    equationBox(loopGroup, '−I_ab R₁ − I_be R₂ + V₁ = 0', p.L + 35, p.T + 117, 247);
  } else if (currentLoopState === 'rightR3Drop') {
    highlightResistor(loopGroup, 'R3');
    equationBox(loopGroup, '−I_bc R₃', p.M + 68, p.T + 117, 100);
  } else if (currentLoopState === 'rightR4Drop') {
    highlightResistor(loopGroup, 'R4');
    equationBox(loopGroup, '−I_bc R₃ − I_cd R₄', p.M + 45, p.T + 117, 180);
  } else if (currentLoopState === 'rightV2Drop') {
    highlightBattery(loopGroup, 'V2');
    equationBox(loopGroup, '−I_bc R₃ − I_cd R₄ − V₂', p.M + 31, p.T + 117, 225);
  } else if (currentLoopState === 'rightR2Opposite') {
    highlightResistor(loopGroup, 'R2');
    equationBox(loopGroup, '−I_bc R₃ − I_cd R₄ − V₂ + I_be R₂', p.M - 63, p.T + 117, 315);
  } else if (currentLoopState === 'rightEquation') {
    highlightResistor(loopGroup, 'R3', 0.58);
    highlightResistor(loopGroup, 'R4', 0.58);
    highlightBattery(loopGroup, 'V2', 0.58);
    highlightResistor(loopGroup, 'R2', 0.58);
    equationBox(loopGroup, '−I_bc R₃ − I_cd R₄ − V₂ + I_be R₂ = 0', p.M - 82, p.T + 117, 356);
  }

  if (left) {
    arrow(loopGroup, p.L + 110, p.T - 19, p.M - 33, p.T - 19, 'I_ab', p.L + 129, p.T - 42, warmDark);
    arrow(loopGroup, p.M + 21, p.T + 40, p.M + 21, p.B - 44, 'I_be', p.M + 27, p.T + 78, warmDark);
  } else {
    arrow(loopGroup, p.M + 45, p.T - 19, p.M + 135, p.T - 19, 'I_bc', p.M + 63, p.T - 42, warmDark);
    arrow(loopGroup, p.R + 19, p.T + 52, p.R + 19, p.T + 128, 'I_cd', p.R + 25, p.T + 76, warmDark);
    arrow(loopGroup, p.M + 21, p.T + 133, p.M + 21, p.T + 58, 'opposite I_be', p.M + 27, p.T + 93, warmDark);
  }
}

function makeNodeHit(name) {
  var p = coords(name);
  hitGroup.circle(42).center(p.x, p.y).fill({ color: '#ffffff', opacity: 0.001 }).stroke('none')
    .css('cursor', 'pointer')
    .on('mousemove', function (ev) {
      if (name === 'b' || name === 'e') showTooltip('Click node ' + name + ' to apply the junction rule.', ev);
      else showTooltip('Node ' + name + ': a labeled circuit point used for Kirchhoff analysis.', ev);
    })
    .on('mouseleave', function () { hideTooltip(); })
    .on('click', function () {
      if (name === 'b' || name === 'e') selectJunction(name);
      else showPopup('Node ' + name, 'This teal dot is an analysis label added to panel (b). It marks the same physical wire junction or corner already present in panel (a).');
    });
}

var demoSteps = [
  {
    title: 'Compare the two textbook panels',
    narration: 'The default view keeps the original side-by-side comparison: panel (a) is the bare physical circuit, while panel (b) is the same circuit with teal node dots and node letters added for analysis.',
    state: { comparisonEmphasis: 'Original two-panel view', loopTrace: 'idle', junction: null }
  },
  {
    title: 'See what the labels add',
    narration: 'Emphasizing the labels shows that only panel (b)’s node scaffold changes visually; all resistors, batteries, wires, values, and polarities match panel (a).',
    state: { comparisonEmphasis: 'Emphasize analysis labels', loopTrace: 'idle', junction: null }
  },
  {
    title: 'Apply the junction rule',
    narration: 'Click junction b or e in panel (b) to highlight the three connected branches and display the current-balance equation for that node.',
    state: { comparisonEmphasis: 'Emphasize analysis labels', loopTrace: 'idle', junction: 'b' }
  },
  {
    title: 'Trace the left loop',
    narration: 'Step clockwise around a-b-e-f-a in panel (b). Crossing R₁ and R₂ in the assumed current direction gives voltage drops, while crossing V₁ from negative to positive gives a voltage rise.',
    state: { comparisonEmphasis: 'Emphasize analysis labels', loopTrace: 'leftEquation', junction: null }
  },
  {
    title: 'Trace the right loop',
    narration: 'Step clockwise around b-c-d-e-b in panel (b). The signed terms come from the same physical elements, but R₂ is crossed in the opposite direction from the left-loop traversal.',
    state: { comparisonEmphasis: 'Emphasize analysis labels', loopTrace: 'rightEquation', junction: null }
  }
];

function applyStep(i) {
  stepIndex = Math.max(0, Math.min(demoSteps.length - 1, i));
  var st = demoSteps[stepIndex];
  document.getElementById('demoNarration').textContent = st.narration;
  document.getElementById('stepLabel').textContent = (stepIndex + 1) + '/5: ' + st.title;

  var on = st.state.comparisonEmphasis === 'Emphasize analysis labels';
  document.getElementById('comparisonEmphasisInput').checked = on;
  toggle_comparisonEmphasis(on);

  selectedJunction = null;
  junctionGroup.clear();
  update_loopTrace(st.state.loopTrace);
  if (st.state.junction) selectJunction(st.state.junction, true);
}

function prevStep() { applyStep(stepIndex - 1); }
function nextStep() { applyStep(stepIndex + 1); }

drawCircuit(panels.left, false);
drawCircuit(panels.right, true);
['a', 'b', 'c', 'f', 'e', 'd'].forEach(makeNodeHit);

baseGroup.back();
emphasisGroup.front();
loopGroup.front();
junctionGroup.front();
nodeGroup.front();
labelGroup.front();
hitGroup.front();

applyStep(0);

window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
