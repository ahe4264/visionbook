<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<label>Side length a: <output id="sideLengthAVal">0.80</output><input id="sideLengthAInput" type="range" min="0" max="1.3" step="0.01" value="0.8" oninput="document.getElementById('sideLengthAVal').value=(+this.value).toFixed(2);update_sideLengthA(+this.value)"></label>
<label><input id="showAltitudeInput" type="checkbox" checked onchange="toggle_showAltitude(this.checked)"> Show altitude h</label>
<label>Step through cases <select id="caseStepInput" onchange="setCaseStep(this.value)"><option value="noTriangle">no triangle</option><option value="rightTriangle">right triangle</option><option value="twoTriangles" selected>two triangles</option><option value="oneTriangle">one triangle</option></select></label>
<span id="thresholdReadout" style="font-size:11px;line-height:1.35">a = 0.80; h = 0.60; b = 1.00 → two triangles</span>
<span id="demoNarration" style="margin:0;font-size:10px;max-width:180px;line-height:1.35">With a shorter than the altitude h, the candidate side from gamma cannot reach the base. The visible gap shows why no triangle can close.</span>
<span><button onclick="prevStep()">◀</button> <span id="stepLabel">Step 1 / 5</span> <button onclick="nextStep()">▶</button></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
document.documentElement.style.setProperty('--figure-canvas-padding', '6px');

var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
draw.attr({ preserveAspectRatio: 'xMidYMid meet' });

var SIN_A = 0.60;
var COS_A = 0.80;
var H_THRESHOLD = 0.60;
var B_THRESHOLD = 1.00;

var state = {
  a: 0.80,
  showAltitude: true,
  caseName: 'twoTriangles',
  step: 0
};

var caseValues = {
  noTriangle: 0.40,
  rightTriangle: 0.60,
  twoTriangles: 0.80,
  oneTriangle: 1.00
};

var demoSteps = [
  {
    title: 'Too short: no triangle',
    narration: 'With a shorter than the altitude h, the candidate side from gamma cannot reach the base. The visible gap shows why no triangle can close.',
    state: { sideLengthA: 0.40, showAltitude: true, caseStep: 'noTriangle' }
  },
  {
    title: 'Exactly the altitude: right triangle',
    narration: 'When a equals h, the side reaches the base at exactly one point: the foot of the perpendicular. That creates one right triangle.',
    state: { sideLengthA: 0.60, showAltitude: true, caseStep: 'rightTriangle' }
  },
  {
    title: 'Between h and b: two triangles',
    narration: 'When a is longer than h but still shorter than b, it can swing to meet the base in two different places. These two landings produce two distinct triangles.',
    state: { sideLengthA: 0.80, showAltitude: true, caseStep: 'twoTriangles' }
  },
  {
    title: 'At least as long as b: one triangle',
    narration: 'Once a is at least as long as b, the second possible landing disappears, leaving only one triangle.',
    state: { sideLengthA: 1.00, showAltitude: true, caseStep: 'oneTriangle' }
  },
  {
    title: 'Hide the guide, then restore it',
    narration: 'Turning the altitude guide off leaves only the triangle sketches; turning it back on reveals the threshold that organizes all four cases.',
    state: { sideLengthA: 0.80, showAltitude: false, caseStep: 'twoTriangles' }
  }
];

function containerSize() {
  var c = document.getElementById('container');
  var st = getComputedStyle(c);
  return {
    w: Math.max(260, c.clientWidth - (parseFloat(st.paddingLeft) || 0) - (parseFloat(st.paddingRight) || 0)),
    h: Math.max(220, c.clientHeight - (parseFloat(st.paddingTop) || 0) - (parseFloat(st.paddingBottom) || 0))
  };
}

function classifyA(v) {
  if (Math.abs(v - H_THRESHOLD) <= 0.012) return 'rightTriangle';
  if (v < H_THRESHOLD) return 'noTriangle';
  if (v < B_THRESHOLD) return 'twoTriangles';
  return 'oneTriangle';
}

function casePhrase(name) {
  if (name === 'noTriangle') return 'no triangle';
  if (name === 'rightTriangle') return 'one right triangle';
  if (name === 'twoTriangles') return 'two triangles';
  return 'one triangle';
}

function addLine(parent, x1, y1, x2, y2, stroke, width, dash) {
  var ln = parent.line(x1, y1, x2, y2).stroke({
    color: stroke || '#000',
    width: width || 4.2,
    linecap: 'butt',
    linejoin: 'miter'
  });
  if (dash) ln.attr({ 'stroke-dasharray': dash });
  return ln;
}

function addText(parent, s, x, y, size, opts) {
  opts = opts || {};
  var t = parent.text(s);
  t.font({
    family: opts.family || 'Times New Roman, Times, serif',
    size: size || 34,
    style: opts.style == null ? 'italic' : opts.style,
    weight: opts.weight || 'normal',
    anchor: opts.anchor || 'start'
  });
  t.fill(opts.fill || '#000');
  t.attr({
    x: x,
    y: y,
    'paint-order': 'stroke',
    stroke: opts.halo === false ? 'none' : '#fff',
    'stroke-width': opts.halo === false ? 0 : Math.max(2.5, (size || 34) * 0.10),
    'stroke-linejoin': 'round'
  });
  return t;
}

function titleSize(text, w, isStacked) {
  var guess = isStacked ? 33 : 36;
  return Math.max(23, Math.min(guess, (w - 18) / (text.length * 0.50)));
}

function addHeading(parent, s, cx, y, w, stacked) {
  return addText(parent, s, cx, y, titleSize(s, w, stacked), {
    anchor: 'middle',
    style: 'normal',
    halo: true
  });
}

function angleArc(parent, ax, ay, r) {
  var ex = ax + COS_A * r;
  var ey = ay - SIN_A * r;
  return parent.path('M ' + (ax + r) + ' ' + ay + ' A ' + r + ' ' + r + ' 0 0 0 ' + ex + ' ' + ey)
    .fill('none')
    .stroke({ color: '#000', width: 3.2, linecap: 'round' });
}

function rightSquare(parent, x, y, side, dir) {
  dir = dir || 'left';
  if (dir === 'right') {
    return parent.path('M ' + x + ' ' + (y - side) + ' L ' + (x + side) + ' ' + (y - side) + ' L ' + (x + side) + ' ' + y)
      .fill('none').stroke({ color: '#000', width: 3.1 });
  }
  return parent.path('M ' + (x - side) + ' ' + y + ' L ' + (x - side) + ' ' + (y - side) + ' L ' + x + ' ' + (y - side))
    .fill('none').stroke({ color: '#000', width: 3.1 });
}

function makeInteractive(el, tip, title, body) {
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); });
  el.on('mouseleave', function () { hideTooltip(); });
  el.on('click', function () { showPopup(title, body); });
  return el;
}

function midpointLabel(parent, s, x1, y1, x2, y2, dx, dy, size) {
  return addText(parent, s, (x1 + x2) / 2 + (dx || 0), (y1 + y2) / 2 + (dy || 0), size || 33);
}

function addOverlay(parent, r, tip, title, body) {
  var ov = parent.rect(r.w, r.h).move(r.x, r.y).fill({ color: '#fff', opacity: 0 });
  ov.attr({ 'pointer-events': 'all' });
  makeInteractive(ov, tip, title, body);
}

function panelHighlight(parent, r, active) {
  parent.rect(r.w - 4, r.h - 4).move(r.x + 2, r.y + 2).radius(12)
    .fill({ color: '#ffe9a8', opacity: active ? 0.16 : 0 })
    .stroke({ color: '#d49a00', width: active ? 4 : 0, opacity: active ? 0.92 : 0 });
}

function panelScale(r, kind) {
  var titleReserve = 66;
  var markerReserve = 43;
  var availH = r.h - titleReserve - markerReserve;
  var baseY = r.y + r.h - markerReserve;
  var desiredW;
  if (kind === 'twoTriangles') desiredW = 1.47;
  else if (kind === 'oneTriangle') desiredW = 1.92;
  else desiredW = 1.02;
  var s = Math.min(availH / 0.78, (r.w * 0.80) / desiredW);
  s = Math.max(105, s);
  return { s: s, baseY: baseY, topY: r.y + titleReserve };
}

function drawNoTriangle(parent, labels, r, active, stacked) {
  panelHighlight(parent, r, active);
  addHeading(labels, 'No triangle, a < h', r.x + r.w / 2, r.y + 7, r.w, stacked);

  var ps = panelScale(r, 'noTriangle');
  var s = ps.s, ay = ps.baseY;
  var ax = r.x + r.w * 0.11;
  var gx = ax + COS_A * s;
  var gy = ay - SIN_A * s;
  var foot = gx;
  var aLen = active ? Math.min(state.a, H_THRESHOLD - 0.015) : 0.40;
  var aEnd = gy + aLen * s;

  addLine(parent, ax, ay, foot, ay);
  makeInteractive(addLine(parent, ax, ay, gx, gy), 'Known side b', 'Known side b', 'Side b and the acute angle α are fixed. The number of possible SSA triangles changes only when side a changes.');
  makeInteractive(addLine(parent, gx, gy, gx, aEnd), 'Candidate side a is too short', 'a < h: no triangle', 'The side of length a stops above the base line, so it cannot close a triangle.');
  if (active) {
    addLine(parent, gx + 10, aEnd + 8, gx + 10, ay - 3, '#d08a00', 5);
  }
  angleArc(parent, ax, ay, Math.min(56, s * 0.18));

  addText(labels, 'α', ax - 27, ay - 5, 34);
  addText(labels, 'β', foot + 21, ay - 5, 34);
  addText(labels, 'γ', gx - 5, gy - 40, 34);
  midpointLabel(labels, 'b', ax, ay, gx, gy, -18, -1, 33);
  midpointLabel(labels, 'a', gx, gy, gx, aEnd, 18, -3, 33);
  addText(labels, '(a)', r.x + r.w / 2, ay + 14, 34, { anchor: 'middle', style: 'normal' });

  addOverlay(parent, r, 'a < h: no triangle', 'No triangle: a < h', 'The altitude h is the shortest distance from γ to the base line. When a is smaller than h, the candidate side cannot reach the base at all.');
}

function drawRightTriangle(parent, labels, r, active, stacked) {
  panelHighlight(parent, r, active);
  addHeading(labels, 'Right triangle, a = h', r.x + r.w / 2, r.y + 7, r.w, stacked);

  var ps = panelScale(r, 'rightTriangle');
  var s = ps.s, ay = ps.baseY;
  var ax = r.x + r.w * 0.11;
  var gx = ax + COS_A * s;
  var gy = ay - SIN_A * s;
  var beta = gx;

  addLine(parent, ax, ay, beta, ay);
  makeInteractive(addLine(parent, ax, ay, gx, gy), 'Known side b', 'Known side b', 'The fixed side b sets the height h = b sin(α), the reach threshold for side a.');
  makeInteractive(addLine(parent, gx, gy, beta, ay, active ? '#d08a00' : '#000', active ? 5 : 4.2), 'a equals the altitude h', 'a = h: one right triangle', 'Side a reaches exactly the perpendicular foot, giving one triangle with a right angle at β.');
  rightSquare(parent, beta, ay, Math.min(42, s * 0.15), 'left').stroke({ color: active ? '#d08a00' : '#000', width: active ? 3.8 : 3.1 });
  angleArc(parent, ax, ay, Math.min(56, s * 0.18));

  addText(labels, 'α', ax - 27, ay - 5, 34);
  addText(labels, 'β', beta + 21, ay - 5, 34);
  addText(labels, 'γ', gx - 5, gy - 40, 34);
  midpointLabel(labels, 'b', ax, ay, gx, gy, -18, -1, 33);
  midpointLabel(labels, 'a', gx, gy, beta, ay, 18, -3, 33);
  addText(labels, '(b)', r.x + r.w / 2, ay + 14, 34, { anchor: 'middle', style: 'normal' });

  addOverlay(parent, r, 'a = h: right triangle', 'Right triangle: a = h', 'At exactly the altitude, the circle centered at γ with radius a is tangent to the base. A single right triangle is possible.');
}

function drawTwoTriangles(parent, labels, r, active, stacked) {
  panelHighlight(parent, r, active);
  addHeading(labels, 'Two triangles, a > h, a < b', r.x + r.w / 2, r.y + 7, r.w, stacked);

  var ps = panelScale(r, 'twoTriangles');
  var s = ps.s, ay = ps.baseY;
  var ax = r.x + r.w * 0.09;
  var gx = ax + COS_A * s;
  var gy = ay - SIN_A * s;
  var aNow = active ? Math.max(H_THRESHOLD + 0.025, Math.min(state.a, B_THRESHOLD - 0.025)) : 0.80;
  var off = Math.sqrt(Math.max(0, aNow * aNow - H_THRESHOLD * H_THRESHOLD)) * s;
  var leftX = gx - off;
  var rightX = gx + off;
  var baseEnd = rightX;

  addLine(parent, ax, ay, baseEnd, ay);
  makeInteractive(addLine(parent, ax, ay, gx, gy), 'Known side b', 'Known side b', 'Side b is the comparison length that separates the two-triangle case from the one-oblique-triangle case.');
  if (state.showAltitude) {
    makeInteractive(addLine(parent, gx, gy, gx, ay), 'Altitude h = b sin(α)', 'Altitude h', 'The altitude is the shortest possible reach from γ to the base. It explains why a must be at least h before any triangle can form.');
    addText(labels, 'h', gx + 17, gy + (ay - gy) * 0.67, 34);
    rightSquare(parent, gx, ay, Math.min(35, s * 0.12), 'right');
  }

  makeInteractive(addLine(parent, gx, gy, leftX, ay, active ? '#d08a00' : '#000', active ? 5 : 4.2, '16 12'), 'First possible side a', 'First landing for a', 'For h < a < b, the radius a from γ cuts the base in two places.');
  makeInteractive(addLine(parent, gx, gy, rightX, ay, active ? '#d08a00' : '#000', active ? 5 : 4.2, '16 12'), 'Second possible side a', 'Second landing for a', 'The second landing creates a different triangle with the same SSA information.');

  angleArc(parent, ax, ay, Math.min(56, s * 0.18));
  addText(labels, 'α', ax - 27, ay - 5, 34);
  addText(labels, 'β', baseEnd + 21, ay - 5, 34);
  addText(labels, 'γ', gx - 5, gy - 40, 34);
  midpointLabel(labels, 'b', ax, ay, gx, gy, -18, -1, 33);
  midpointLabel(labels, 'a', gx, gy, leftX, ay, -20, -12, 33);
  midpointLabel(labels, 'a', gx, gy, rightX, ay, 22, -11, 33);
  addText(labels, '(c)', r.x + r.w / 2, ay + 14, 34, { anchor: 'middle', style: 'normal' });

  addOverlay(parent, r, 'h < a < b: two triangles', 'Two triangles: h < a < b', 'Here a is long enough to reach the base but not as long as b. The same side length can land on either side of the altitude, producing two distinct triangles.');
}

function drawOneTriangle(parent, labels, r, active, stacked) {
  panelHighlight(parent, r, active);
  addHeading(labels, 'One triangle, a ≥ b', r.x + r.w / 2, r.y + 7, r.w, stacked);

  var ps = panelScale(r, 'oneTriangle');
  var s = ps.s, ay = ps.baseY;
  var ax = r.x + r.w * 0.08;
  var gx = ax + COS_A * s;
  var gy = ay - SIN_A * s;
  var aDraw = Math.max(active ? state.a : 1.14, 1.14);
  var offRight = Math.sqrt(Math.max(0, aDraw * aDraw - H_THRESHOLD * H_THRESHOLD)) * s;
  var beta = gx + offRight;

  addLine(parent, ax, ay, beta, ay);
  makeInteractive(addLine(parent, ax, ay, gx, gy), 'Known side b', 'Known side b', 'When the candidate side is at least this long, the ambiguous second closure disappears.');
  makeInteractive(addLine(parent, gx, gy, beta, ay, active ? '#d08a00' : '#000', active ? 5 : 4.2), 'Single possible side a, with a ≥ b', 'a ≥ b: one triangle', 'With a at least as long as b, only the farther base landing gives a valid oblique triangle.');
  angleArc(parent, ax, ay, Math.min(56, s * 0.18));

  addText(labels, 'α', ax - 27, ay - 5, 34);
  addText(labels, 'β', beta + 21, ay - 5, 34);
  addText(labels, 'γ', gx - 5, gy - 40, 34);
  midpointLabel(labels, 'b', ax, ay, gx, gy, -18, -1, 33);
  midpointLabel(labels, 'a', gx, gy, beta, ay, 22, -4, 33);
  addText(labels, '(d)', r.x + r.w / 2, ay + 14, 34, { anchor: 'middle', style: 'normal' });

  addOverlay(parent, r, 'a ≥ b: one triangle', 'One triangle: a ≥ b', 'The side labeled a is drawn perceptibly at least as long as b. In this range the SSA data determine a single oblique triangle.');
}

function render() {
  var sz = containerSize();
  var aspect = sz.w / sz.h;
  var stacked = aspect < 2.55;
  var W = stacked ? 1200 : 1920;
  var H = stacked ? 790 : 455;
  draw.viewbox(0, 0, W, H);
  draw.clear();

  var geom = draw.group();
  var labels = draw.group();

  if (stacked) {
    var gapX = 26, gapY = 24;
    var pw = (W - gapX * 3) / 2;
    var ph = (H - gapY * 3) / 2;
    drawNoTriangle(geom, labels, { x: gapX, y: gapY, w: pw, h: ph }, state.caseName === 'noTriangle', true);
    drawRightTriangle(geom, labels, { x: gapX * 2 + pw, y: gapY, w: pw, h: ph }, state.caseName === 'rightTriangle', true);
    drawTwoTriangles(geom, labels, { x: gapX, y: gapY * 2 + ph, w: pw, h: ph }, state.caseName === 'twoTriangles', true);
    drawOneTriangle(geom, labels, { x: gapX * 2 + pw, y: gapY * 2 + ph, w: pw, h: ph }, state.caseName === 'oneTriangle', true);
  } else {
    var y = 12, h = H - 24, gap = 22;
    var x0 = 18;
    var wA = 340, wB = 340, wC = 540, wD = 590;
    drawNoTriangle(geom, labels, { x: x0, y: y, w: wA, h: h }, state.caseName === 'noTriangle', false);
    drawRightTriangle(geom, labels, { x: x0 + wA + gap, y: y, w: wB, h: h }, state.caseName === 'rightTriangle', false);
    drawTwoTriangles(geom, labels, { x: x0 + wA + wB + gap * 2, y: y, w: wC, h: h }, state.caseName === 'twoTriangles', false);
    drawOneTriangle(geom, labels, { x: x0 + wA + wB + wC + gap * 3, y: y, w: wD, h: h }, state.caseName === 'oneTriangle', false);
  }

  labels.front();
}

function syncUi() {
  var slider = document.getElementById('sideLengthAInput');
  var out = document.getElementById('sideLengthAVal');
  var chk = document.getElementById('showAltitudeInput');
  var sel = document.getElementById('caseStepInput');
  if (slider) slider.value = state.a;
  if (out) out.value = state.a.toFixed(2);
  if (chk) chk.checked = !!state.showAltitude;
  if (sel) sel.value = state.caseName;

  var readout = document.getElementById('thresholdReadout');
  if (readout) {
    readout.textContent = 'a = ' + state.a.toFixed(2) + '; h = 0.60; b = 1.00 → ' + casePhrase(state.caseName);
  }
  var narr = document.getElementById('demoNarration');
  if (narr) narr.textContent = demoSteps[state.step].narration;
  var stepLabel = document.getElementById('stepLabel');
  if (stepLabel) stepLabel.textContent = 'Step ' + (state.step + 1) + ' / ' + demoSteps.length;
}

function update_sideLengthA(v) {
  state.a = v;
  state.caseName = classifyA(v);
  syncUi();
  render();
}

function toggle_showAltitude(on) {
  state.showAltitude = !!on;
  syncUi();
  render();
}

function setCaseStep(name) {
  if (!caseValues.hasOwnProperty(name)) name = classifyA(state.a);
  state.caseName = name;
  state.a = caseValues[name];
  for (var i = 0; i < demoSteps.length; i++) {
    if (demoSteps[i].state.caseStep === name && demoSteps[i].state.showAltitude === state.showAltitude) {
      state.step = i;
      break;
    }
  }
  syncUi();
  render();
}

function applyDemoStep(i) {
  state.step = (i + demoSteps.length) % demoSteps.length;
  var s = demoSteps[state.step].state;
  state.a = s.sideLengthA;
  state.showAltitude = s.showAltitude;
  state.caseName = s.caseStep;
  syncUi();
  render();
}

function nextStep() {
  applyDemoStep(state.step + 1);
}

function prevStep() {
  applyDemoStep(state.step - 1);
}

document.addEventListener('fig-resize', function () {
  render();
});

applyDemoStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
