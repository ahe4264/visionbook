    'Both carbons are now saturated, so nothing holds the molecule down. The last Ni&ndash;C bonds '
    + 'break and C<sub>2</sub>H<sub>6</sub> leaves. The nickel is unchanged and starts again.'
    + '<br><b>Breaking:</b> 2 &times; Ni&ndash;C &nbsp; <b>Forming:</b> free C<sub>2</sub>H<sub>6</sub>']
];

function setInfo(title, body) {
  uiInfo.innerHTML = '<b>' + title + '</b><br>' + body;
}
function setCaption(html) { uiCap.innerHTML = html; }

let mode = 'gallery';
let focusK = 0;
let playing = false;
let tNow = 0;

function setStageActive(st, on) {
  st.group.traverse(o => o.layers.set(on ? 0 : 1));
  if (on && !st.group.parent) root.add(st.group);
  if (!on && st.group.parent) root.remove(st.group);
  st.labels.forEach(e => { e.div.style.visibility = on ? '' : 'hidden'; });
}

function refit() {
  setCameraView({
    projection: 'oblique', obliqueAngleDeg: 45, depthScale: 0.5,
    heightFraction: mode === 'gallery' ? 0.88 : 0.80
  });
}

function markButtons() {
  uiSteps.forEach(b => b.classList.toggle('active', mode === 'focus' && +b.dataset.k === focusK));
  uiAll.classList.toggle('active', mode === 'gallery');
  uiPlay.classList.toggle('active', mode === 'play' && playing);
  uiPlay.innerHTML = (mode === 'play' && playing) ? '&#10073;&#10073; Pause' : '&#9654; Play the catalytic cycle';
}

function setMode(next, k) {
  mode = next;
  if (k != null) focusK = k;
  if (mode !== 'play') playing = false;
  const keep = (mode === 'gallery') ? [0, 1, 2, 3] : [mode === 'play' ? 0 : focusK];
  stages.forEach((st, i) => setStageActive(st, keep.indexOf(i) >= 0));
  setHighlight(null);

  if (mode === 'gallery') {
    stages.forEach((st, i) => {
      applySnapshot(st, i);
      st.annot.visible = true;
      st.live.div.style.visibility = 'hidden';
    });
    setCaption('<b>The whole cycle, as printed.</b> C<sub>2</sub>H<sub>4</sub> + H<sub>2</sub> '
      + '&#8594; C<sub>2</sub>H<sub>6</sub> over nickel. Pick a step, or play the animation, to see '
      + 'which bonds break and form at each stage.');
  } else if (mode === 'focus') {
    const st = stages[focusK];
    applySnapshot(st, focusK);
    st.annot.visible = true;
    st.live.div.style.visibility = 'hidden';
    setHighlight(stepHighlights(st, focusK));
    setCaption('<b>' + STEP_TXT[focusK][0] + '</b><br>' + STEP_TXT[focusK][1]);
  } else {
    const st = stages[0];
    st.annot.visible = false;
    st.labels.forEach(e => { e.div.style.visibility = 'hidden'; });
    st.live.div.style.visibility = '';
    applyState(st, tNow, false);
    updatePlayCaption();
  }
  markButtons();
  refit();
}

function updatePlayCaption() {
  const k = Math.min(3, Math.floor(tNow));
  const st = stages[0];
  st.live.div.innerHTML = STEP_TXT[k][0];
  setCaption('<b>' + STEP_TXT[k][0] + '</b><br>' + STEP_TXT[k][1]);
}

uiPlay.addEventListener('click', () => {
  if (mode !== 'play') { setMode('play'); playing = true; }
  else playing = !playing;
  markButtons();
});
uiAll.addEventListener('click', () => setMode('gallery'));
uiSteps.forEach(b => b.addEventListener('click', () => setMode('focus', +b.dataset.k)));
uiSlider.addEventListener('input', () => {
  tNow = (+uiSlider.value) / 100;
  if (mode !== 'play') setMode('play');
  playing = false;
  applyState(stages[0], tNow, false);
  updatePlayCaption();
  markButtons();
});

/* ── driver loop (the scaffold renders; this only advances the state) ───── */
let lastMs = performance.now();
function driveFigure() {
  requestAnimationFrame(driveFigure);
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastMs) / 1000);
  lastMs = now;

  if (mode === 'play' && playing) {
    tNow += dt * 0.46;
    if (tNow >= 4) tNow -= 4;
    applyState(stages[0], tNow, false);
    uiSlider.value = String(Math.round(tNow * 100));
    updatePlayCaption();
  }
  if (hlList.length) {
    const k = 0.35 + 0.35 * Math.sin(now * 0.005);
    for (const msh of hlList) if (msh.material && msh.material.emissive) msh.material.emissive.setRGB(k * 1.0, k * 0.68, k * 0.08);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.t -= dt * 1.4;
    if (f.t <= 0) { clearEmissive(f.mesh); flashes.splice(i, 1); }
    else if (f.mesh.material.emissive) f.mesh.material.emissive.setRGB(f.t * 0.85, f.t * 0.72, f.t * 0.15);
  }
}
driveFigure();

/* ── first frame: the printed four-panel figure ─────────────────────────── */
setMode('gallery');
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();

  </script>
</body>
