<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0 0 2px 0;font-size:11px;line-height:1.45;color:#222"></p>
<span style="display:flex;align-items:center;gap:6px">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;font-weight:600"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Object distance d<sub>o</sub> = <output id="objectDistanceVal">2.50</output> f
  <input id="objectDistanceInput" type="range" min="0.4" max="5" step="0.05" value="2.5"
   oninput="document.getElementById('objectDistanceVal').value=(+this.value).toFixed(2);update_objectDistance(+this.value)"></label>
<label><input id="measureOverlayInput" type="checkbox" onchange="toggle_measureOverlay(this.checked)"> Measurement overlay (f, d<sub>o</sub>, d<sub>i</sub>, h<sub>o</sub>, h<sub>i</sub>)</label>
<span style="font-size:11px;color:#444">Isolate a principal ray (or click it in the figure):</span>
<span style="display:flex;gap:4px;flex-wrap:wrap">
  <button id="rayBtn0" onclick="trigger_raySelect(0)">All</button>
  <button id="rayBtn1" onclick="trigger_raySelect(1)">Ray 1</button>
  <button id="rayBtn2" onclick="trigger_raySelect(2)">Ray 2</button>
  <button id="rayBtn3" onclick="trigger_raySelect(3)">Ray 3</button>
</span>
<p id="readout" style="margin:2px 0 0 0;font-size:11px;line-height:1.55;color:#222;font-family:ui-monospace,Consolas,monospace"></p>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var figDraw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
var XD = [-6.6, 9.4], YD = [-3.7, 3.7];
var frame = setPlotFrame({ xDomain: XD, yDomain: YD, margin: 12, draw: figDraw });

var HO = 1.4;          // object height (world units, f = 1)
var LH = 2.5;          // lens half height
var EPS = 0.035;       // |d_o - 1| below this  => image at infinity

var C = {
  axis: '#1b1b1b', lens: '#cfe7f3', lensEdge: '#3f92c0',
  obj: '#ef6a60', r1: '#e03127', r2: '#7ea62b', r3: '#7d66c6',
  F: '#d93a2b', dim: '#c8ccd0', meas: '#111'
};

var state = { d: 2.5, overlay: false, sel: 0, step: 0 };
var K = 1, fs = 13;

/* ---------- small helpers ---------- */
function clipSeg(x0, y0, x1, y1) {
  var xmin = 1, ymin = 1, xmax = frame.width - 1, ymax = frame.height - 1;
  var dx = x1 - x0, dy = y1 - y0, t0 = 0, t1 = 1;
  var p = [-dx, dx, -dy, dy], q = [x0 - xmin, xmax - x0, y0 - ymin, ymax - y0];
  for (var i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return null; }
    else {
      var r = q[i] / p[i];
      if (p[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
  }
  return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy];
}

function head(g, x, y, ang, size, color, op) {
  var pts = [[0, 0], [-size, size * 0.46], [-size, -size * 0.46]];
  var c = Math.cos(ang), s = Math.sin(ang);
  var str = pts.map(function (p) {
    return (x + p[0] * c - p[1] * s) + ',' + (y + p[0] * s + p[1] * c);
  }).join(' ');
  return g.polygon(str).fill({ color: color, opacity: op == null ? 1 : op });
}

function txt(g, s, x, y, o) {
  o = o || {};
  var t = g.plain(String(s));
  t.font({ family: 'sans-serif', size: o.size || fs, weight: o.weight || 'normal' });
  t.fill(o.fill || '#111');
  t.attr({ x: x, y: y, 'text-anchor': o.anchor || 'middle', 'dominant-baseline': 'central' });
  if (o.halo !== false) {
    t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': Math.max(2, (o.size || fs) * 0.30), 'stroke-linejoin': 'round' });
  }
  return t;
}

function labelSub(g, main, sub, x, y, o) {
  o = o || {};
  var s = o.size || fs;
  txt(g, main, x, y, { size: s, anchor: 'end', fill: o.fill, weight: o.weight });
  txt(g, sub, x + s * 0.06, y + s * 0.27, { size: s * 0.7, anchor: 'start', fill: o.fill, weight: o.weight });
}

function wseg(g, p0, p1, color, w, dashed, op) {
  var cl = clipSeg(plotX(p0[0]), plotY(p0[1]), plotX(p1[0]), plotY(p1[1]));
  if (!cl) return null;
  var l = g.line(cl[0], cl[1], cl[2], cl[3]).stroke({
    color: color, width: w, linecap: 'round', opacity: op == null ? 1 : op
  });
  if (dashed) l.attr('stroke-dasharray', (5.5 * K) + ',' + (4.5 * K));
  return l;
}

function segHeadAtT(g, p0, p1, t, color, size) {
  var wx = p0[0] + (p1[0] - p0[0]) * t, wy = p0[1] + (p1[1] - p0[1]) * t;
  var x = plotX(wx), y = plotY(wy);
  if (x < 4 || x > frame.width - 4 || y < 4 || y > frame.height - 4) return;
  var ang = Math.atan2(plotY(p1[1]) - plotY(p0[1]), plotX(p1[0]) - plotX(p0[0]));
  head(g, x, y, ang, size, color);
}

function segHeadAtX(g, p0, p1, wx, color, size) {
  if (Math.abs(p1[0] - p0[0]) < 1e-9) return;
  var t = (wx - p0[0]) / (p1[0] - p0[0]);
  if (t < 0.03 || t > 0.99) return;
  segHeadAtT(g, p0, p1, t, color, size);
}

function interactive(el, tip, title, body, onClick) {
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); });
  el.on('mouseleave', function () { hideTooltip(); });
  el.on('click', function () {
    if (onClick) onClick();
    if (title) showPopup(title, body);
  });
}

function vArrow(g, wx, wy, color, width, op) {
  var x = plotX(wx), y0 = plotY(0), y1 = plotY(wy);
  var dir = (y1 < y0) ? -1 : 1;
  var hs = 9 * K;
  g.line(x, y0, x, y1 - dir * hs * 0.35).stroke({ color: color, width: width, linecap: 'butt', opacity: op == null ? 1 : op });
  head(g, x, y1, dir < 0 ? -Math.PI / 2 : Math.PI / 2, hs, color, op);
}

function bracket(g, wx0, wx1, wy, main, sub, note) {
  var x0 = plotX(wx0), x1 = plotX(wx1), y = plotY(wy);
  var tick = 7 * K, hs = 7 * K;
  g.line(x0, y - tick, x0, y + tick).stroke({ color: C.meas, width: 1.1 * K });
  g.line(x1, y - tick, x1, y + tick).stroke({ color: C.meas, width: 1.1 * K });
  g.line(x0, y, x1, y).stroke({ color: C.meas, width: 1.1 * K });
  if (Math.abs(x1 - x0) > 4 * hs) { head(g, x1, y, 0, hs, C.meas); head(g, x0, y, Math.PI, hs, C.meas); }
  var mid = (x0 + x1) / 2;
  labelSub(g, main, sub, mid + fs * 0.2, y, { size: fs });
  if (note) txt(g, note, mid, y - fs * 1.2, { size: fs * 0.78, fill: '#666' });
}

function vMeasure(g, wx, wy, main, sub, side) {
  var x = plotX(wx), y0 = plotY(0), y1 = plotY(wy);
  var tick = 6 * K, hs = 7 * K;
  g.line(x - tick, y0, x + tick, y0).stroke({ color: C.meas, width: 1.0 * K });
  g.line(x - tick, y1, x + tick, y1).stroke({ color: C.meas, width: 1.0 * K });
  g.line(x, y0, x, y1).stroke({ color: C.meas, width: 1.1 * K });
  if (Math.abs(y1 - y0) > 4 * hs) {
    head(g, x, y1, y1 < y0 ? -Math.PI / 2 : Math.PI / 2, hs, C.meas);
    head(g, x, y0, y1 < y0 ? Math.PI / 2 : -Math.PI / 2, hs, C.meas);
  }
  labelSub(g, main, sub, x + (side > 0 ? fs * 1.7 : -fs * 0.75), (y0 + y1) / 2, { size: fs });
}

/* ---------- optics ---------- */
function optics(d) {
  var o = { d: d, ho: HO, valid: Math.abs(d - 1) >= EPS };
  if (o.valid) { o.di = d / (d - 1); o.hi = -HO / (d - 1); o.m = -o.di / d; }
  return o;
}

/* ---------- main render ---------- */
function render() {
  figDraw.clear();
  var W = frame.width, H = frame.height;
  K = Math.max(0.6, Math.min(1.7, Math.min(W / 720, H / 470)));
  fs = Math.max(9, Math.min(18, H * 0.038));

  var d = state.d, O = optics(d);
  var g = figDraw.group();
  var rayW = 2.3 * K, dimW = 1.5 * K, hs = 8 * K;

  /* axis */
  var ax = g.line(plotX(XD[0] + 0.05), plotY(0), plotX(XD[1] - 0.05), plotY(0))
    .stroke({ color: C.axis, width: 1.15 * K });
  interactive(ax, 'Optical axis', 'Optical axis',
    'The reference line through the centre of the lens. Distances d\u2092, d\u1d62 and f are measured along it, and heights are measured from it.');

  /* lens */
  var cx = plotX(0), bl = plotX(0.17) - plotX(0);
  var lens = g.path('M ' + cx + ' ' + plotY(LH) +
    ' Q ' + (cx - 2 * bl) + ' ' + plotY(0) + ' ' + cx + ' ' + plotY(-LH) +
    ' Q ' + (cx + 2 * bl) + ' ' + plotY(0) + ' ' + cx + ' ' + plotY(LH) + ' Z')
    .fill(C.lens).stroke({ color: C.lensEdge, width: 1.6 * K });
  interactive(lens, 'Converging (biconvex) lens', 'The converging lens',
    'A thin biconvex lens bends every incoming ray toward the axis. In the thin-lens idealisation all the bending happens at the single vertical principal plane through the lens centre.');

  /* dashed principal plane */
  g.line(cx, plotY(LH + 0.5), cx, plotY(-LH - 0.5))
    .stroke({ color: '#222', width: 1.0 * K }).attr('stroke-dasharray', (6 * K) + ',' + (5 * K));

  /* focal points */
  [[-1, 'near'], [1, 'far']].forEach(function (p) {
    var dot = g.circle(4.6 * K * 2).fill(C.F).center(plotX(p[0]), plotY(0));
    interactive(dot, 'Focal point F  (' + p[1] + ' side), one focal length f from the lens',
      'Focal point F',
      'Both focal points sit one focal length f from the lens. Rays arriving parallel to the axis leave through the far F; rays that pass through the near F leave parallel to the axis.');
    txt(g, 'F', plotX(p[0]), plotY(0) + fs * 1.15, { size: fs });
  });

  /* ------- rays ------- */
  var L = 60;
  var y3 = O.valid ? O.hi : null;
  var defs = [
    {
      i: 1, color: C.r1,
      segs: [[[-d, HO], [0, HO]], [[0, HO], [L, HO - HO * L]]],
      tip: 'Ray 1: in parallel to the axis \u2192 out through the far focal point F',
      title: 'Ray 1 \u2014 the parallel ray',
      body: 'Any ray that arrives parallel to the optical axis is refracted so that it leaves through the far focal point F. Its outgoing direction is set by f alone, whatever the object distance.'
    },
    {
      i: 2, color: C.r2,
      segs: [[[-d, HO], [0, 0]], [[0, 0], [d * L, -HO * L]]],
      tip: 'Ray 2: straight through the centre of the lens, undeviated',
      title: 'Ray 2 \u2014 the central ray',
      body: 'A ray aimed at the centre of a thin lens passes straight through: the two surfaces are parallel there, so the ray is not deviated. This ray alone fixes the magnification, h\u1d62/h\u2092 = \u2212d\u1d62/d\u2092.'
    }
  ];
  if (y3 !== null) {
    defs.push({
      i: 3, color: C.r3,
      segs: [[[-d, HO], [0, y3]], [[0, y3], [L, y3]]],
      tip: 'Ray 3: through the near focal point F \u2192 out parallel to the axis',
      title: 'Ray 3 \u2014 the focal ray',
      body: 'A ray passing through the near focal point F emerges parallel to the axis (the time-reverse of ray 1). If the object is closer than f, it is the backward extension of the ray that passes through F.'
    });
  }

  defs.forEach(function (R) {
    var dim = (state.sel !== 0 && state.sel !== R.i);
    var col = dim ? C.dim : R.color;
    var w = dim ? dimW : (state.sel === R.i ? rayW * 1.6 : rayW);
    var rg = g.group();
    R.segs.forEach(function (s) { wseg(rg, s[0], s[1], col, w); });
    /* direction arrowheads */
    segHeadAtT(rg, R.segs[0][0], R.segs[0][1], 0.72, col, hs);
    if (R.i === 1) segHeadAtX(rg, R.segs[1][0], R.segs[1][1], 1.9, col, hs);
    if (R.i === 2) segHeadAtX(rg, R.segs[1][0], R.segs[1][1], Math.min(3.0, XD[1] - 1), col, hs);
    if (R.i === 3) segHeadAtX(rg, R.segs[1][0], R.segs[1][1], 3.2, col, hs);
    /* backward (virtual) extensions */
    if (O.valid && O.di < 0) {
      var tipP = [O.di, O.hi];
      wseg(rg, R.i === 1 ? [0, HO] : (R.i === 2 ? [0, 0] : [0, y3]), tipP, col, w * 0.8, true, 0.85);
    }
    if (R.i === 3 && d < 1) wseg(rg, [-d, HO], [-1, 0], col, w * 0.8, true, 0.8);
    /* hit area */
    R.segs.forEach(function (s) {
      var l = wseg(rg, s[0], s[1], '#000', 12 * K, false, 0);
      if (l) interactive(l, R.tip, R.title, R.body, function () { trigger_raySelect(R.i); });
    });
  });

  /* object + image */
  var objHit = g.line(plotX(-d), plotY(0), plotX(-d), plotY(HO)).stroke({ color: '#000', width: 14 * K, opacity: 0 });
  vArrow(g, -d, HO, C.obj, 5 * K);
  interactive(objHit, 'Object, height h\u2092', 'The object',
    'The luminous object of height h\u2092 stands on the axis a distance d\u2092 from the lens. Every point on it sends rays in all directions \u2014 we only trace the three easy ones from its tip.');

  if (O.valid && Math.abs(O.hi) < 3.45 && O.di > XD[0] + 0.3 && O.di < XD[1] - 0.3) {
    var imgHit = g.line(plotX(O.di), plotY(0), plotX(O.di), plotY(O.hi)).stroke({ color: '#000', width: 14 * K, opacity: 0 });
    vArrow(g, O.di, O.hi, C.obj, 5 * K, O.di < 0 ? 0.8 : 1);
    interactive(imgHit,
      (O.di > 0 ? 'Real, inverted image, height h\u1d62' : 'Virtual, upright image (no light actually there)'),
      'The image',
      O.di > 0
        ? 'All three refracted rays cross here, so this is where the image forms. Light really passes through it, so it is real, and it points downward \u2014 inverted \u2014 with h\u1d62/h\u2092 = \u2212d\u1d62/d\u2092.'
        : 'The refracted rays diverge; only their backward extensions meet. The eye sees an enlarged upright virtual image on the object side \u2014 the magnifying-glass case, with d\u1d62 negative.');
    if (O.di > 0) {
      g.circle(5 * K * 2).fill('none').stroke({ color: '#444', width: 1.1 * K })
        .center(plotX(O.di), plotY(O.hi));
    }
  }

  /* ray number labels */
  var labPos = [
    { i: 1, x: -0.55 * d, y: HO + 0.30, c: C.r1 },
    { i: 2, x: -0.45 * d, y: HO * 0.45 + 0.32, c: C.r2 }
  ];
  if (y3 !== null) labPos.push({ i: 3, x: -0.78 * d, y: HO + 0.22 * (y3 - HO) + 0.32, c: C.r3 });
  labPos.forEach(function (p) {
    var dim = (state.sel !== 0 && state.sel !== p.i);
    txt(g, p.i, plotX(p.x), plotY(p.y), { size: fs * 1.08, weight: 'bold', fill: dim ? C.dim : p.c });
  });

  /* selection ring on the governing marker */
  if (state.sel !== 0) {
    var mx = state.sel === 1 ? 1 : (state.sel === 2 ? 0 : -1);
    var ring = g.circle(11 * K * 2).fill('none')
      .stroke({ color: state.sel === 1 ? C.r1 : (state.sel === 2 ? C.r2 : C.r3), width: 1.8 * K })
      .center(plotX(mx), plotY(0));
    ring.attr('stroke-dasharray', (4 * K) + ',' + (3.5 * K));
  }

  /* ------- measurement overlay ------- */
  if (state.overlay) {
    var mg = g.group();
    var hx = XD[0] + 0.42;
    mg.line(plotX(hx), plotY(HO), plotX(-d), plotY(HO))
      .stroke({ color: '#9aa0a6', width: 0.8 * K }).attr('stroke-dasharray', (3 * K) + ',' + (3 * K));
    vMeasure(mg, hx, HO, 'h', 'o', 1);

    bracket(mg, 0, 1, 0.62, 'f', '', null);
    bracket(mg, -d, 0, -2.95, 'd', 'o', null);

    if (O.valid) {
      if (O.di > 0) {
        var xEnd = Math.min(O.di, XD[1] - 0.4);
        bracket(mg, 0, xEnd, -2.95, 'd', 'i', O.di > XD[1] - 0.4 ? ('d\u1d62 = ' + O.di.toFixed(2) + 'f \u2014 off frame') : null);
      } else {
        bracket(mg, Math.max(O.di, XD[0] + 0.4), 0, -3.38, 'd', 'i', 'negative (virtual)');
      }
      if (Math.abs(O.hi) < 3.3 && O.di > XD[0] + 0.3 && O.di < XD[1] - 0.9) {
        vMeasure(mg, O.di + 0.5, O.hi, 'h', 'i', 1);
      }
    }

    /* compact numeric readout, top-left whitespace */
    var rx = plotX(XD[0] + 0.25), ry = plotY(3.32), lh = fs * 1.35;
    var lines = [
      ['d', 'o', '= ' + d.toFixed(2) + ' f'],
      ['d', 'i', O.valid ? ('= ' + O.di.toFixed(2) + ' f') : '\u2192 \u221e'],
      ['m', '', O.valid ? ('= ' + O.m.toFixed(2) + (O.m < 0 ? '  (real, inverted)' : '  (virtual, upright)')) : '  (image at infinity)']
    ];
    lines.forEach(function (L2, k) {
      var y = ry + k * lh;
      txt(mg, L2[0], rx, y, { anchor: 'start', size: fs * 0.95 });
      if (L2[1]) txt(mg, L2[1], rx + fs * 0.62, y + fs * 0.25, { anchor: 'start', size: fs * 0.68 });
      txt(mg, L2[2], rx + fs * 1.15, y, { anchor: 'start', size: fs * 0.95 });
    });
  }

  updateReadout(O);
}

/* ---------- UI plumbing ---------- */
function updateReadout(O) {
  var el = document.getElementById('readout');
  if (!el) return;
  if (!O.valid) {
    el.innerHTML = 'd<sub>o</sub> = ' + O.d.toFixed(2) + ' f &nbsp; d<sub>i</sub> &rarr; &infin;<br>Refracted rays are parallel &mdash; no image forms.';
    return;
  }
  var type = O.di > 0 ? 'real, inverted' : 'virtual, upright';
  var size = Math.abs(O.m) > 1 ? 'enlarged' : (Math.abs(O.m) < 1 ? 'reduced' : 'same size');
  el.innerHTML = '1/d<sub>o</sub> + 1/d<sub>i</sub> = 1/f<br>' +
    'd<sub>o</sub> = ' + O.d.toFixed(2) + ' f &nbsp; d<sub>i</sub> = ' + O.di.toFixed(2) + ' f<br>' +
    'm = &minus;d<sub>i</sub>/d<sub>o</sub> = ' + O.m.toFixed(2) + '<br>' + type + ', ' + size;
}

function update_objectDistance(v) { state.d = +v; render(); }
function toggle_measureOverlay(on) { state.overlay = !!on; render(); }
function trigger_raySelect(n) {
  state.sel = (state.sel === n && n !== 0) ? 0 : n;
  syncRayButtons();
  render();
}
function syncRayButtons() {
  for (var i = 0; i <= 3; i++) {
    var b = document.getElementById('rayBtn' + i);
    if (b) b.className = (state.sel === i) ? 'active' : '';
  }
}

var STEPS = [
  {
    title: 'The setup',
    narration: 'A red arrow object stands on the optical axis to the left of a converging lens, with focal points F marked one focal length f on each side \u2014 the stage on which the construction is built.',
    state: { objectDistance: 2.5, measureOverlay: 'Ray construction' }
  },
  {
    title: 'Three rays, three rules',
    narration: 'Rays 1, 2 and 3 leave the same point at the object\u2019s tip. Click any one of them (in the figure or with the buttons) to isolate it and see its rule: parallel-then-through-F, straight-through-centre, or through-F-then-parallel.',
    state: { objectDistance: 2.5, measureOverlay: 'Ray construction' }
  },
  {
    title: 'They agree on one point',
    narration: 'All three refracted rays cross below the axis at a single point. The short downward red arrow there is the real, inverted image \u2014 light actually passes through it, so it could be caught on a screen.',
    state: { objectDistance: 2.5, measureOverlay: 'Ray construction' }
  },
  {
    title: 'Measuring the drawing',
    narration: 'Switch on the measurement overlay: brackets appear for d\u2092, d\u1d62 and f, and arrows for h\u2092 and h\u1d62. The ratio h\u1d62/h\u2092 equals \u2212d\u1d62/d\u2092, and the three distances satisfy 1/d\u2092 + 1/d\u1d62 = 1/f.',
    state: { objectDistance: 2.5, measureOverlay: 'Measurement overlay' }
  },
  {
    title: 'Push the object far away',
    narration: 'With the object far from the lens the rays converge just beyond the far focal point: d\u1d62 shrinks toward f and the image becomes small and strongly reduced.',
    state: { objectDistance: 5, measureOverlay: 'Measurement overlay' }
  },
  {
    title: 'Slide it toward the focal point',
    narration: 'As d\u2092 approaches f the refracted rays become nearly parallel, d\u1d62 shoots off to the right and the inverted image grows enormous \u2014 the tradeoff between object and image distance in action.',
    state: { objectDistance: 1.15, measureOverlay: 'Measurement overlay' }
  },
  {
    title: 'Inside the focal point',
    narration: 'Move the object closer than f and the refracted rays diverge; their dashed backward extensions give an upright, magnified virtual image on the object side (d\u1d62 < 0) \u2014 the magnifying-glass case.',
    state: { objectDistance: 0.6, measureOverlay: 'Measurement overlay' }
  }
];

function setStep(i) {
  state.step = (i + STEPS.length) % STEPS.length;
  var s = STEPS[state.step];
  var sl = document.getElementById('objectDistanceInput');
  sl.value = s.state.objectDistance;
  document.getElementById('objectDistanceVal').value = (+s.state.objectDistance).toFixed(2);
  state.d = +s.state.objectDistance;
  var ov = (s.state.measureOverlay === 'Measurement overlay');
  document.getElementById('measureOverlayInput').checked = ov;
  state.overlay = ov;
  state.sel = 0; syncRayButtons();
  document.getElementById('demoNarration').textContent = s.narration;
  document.getElementById('stepLabel').textContent = (state.step + 1) + '/' + STEPS.length + '  ' + s.title;
  render();
}
function nextStep() { setStep(state.step + 1); }
function prevStep() { setStep(state.step - 1); }

document.addEventListener('fig-resize', function () { render(); });

setStep(0);
window.__markRendered();
