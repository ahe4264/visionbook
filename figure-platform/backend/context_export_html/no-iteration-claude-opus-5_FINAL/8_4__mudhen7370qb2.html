<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:bold;font-size:12px;color:#222">Guided demo</span>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#222"></p>
<label style="flex-direction:row;align-items:center;gap:6px">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px"></span>
  <button onclick="nextStep()">▶</button>
</label>

<span style="font-weight:bold;font-size:12px;color:#222;margin-top:4px">Distribution pass</span>
<label style="flex-direction:row;gap:4px;align-items:center;flex-wrap:wrap">
  <button onclick="trigger_distributeReset()">⟲ Reset</button>
  <button onclick="trigger_distributeStep()">Step ▶</button>
  <button onclick="trigger_distributeRun()">Run all</button>
</label>
<span id="distributeStepVal" style="font-size:11px;color:#333">idle — 10 of 10 placed</span>

<label>Probe x → bucket floor(10x): <output id="probeValueVal">0.940</output>
  <input id="probeValueInput" type="range" min="0" max="0.999" step="0.001" value="0.94"
    oninput="document.getElementById('probeValueVal').value=(+this.value).toFixed(3);update_probeValue(+this.value)"></label>

<label style="flex-direction:row;gap:5px;align-items:center"><input id="concatInput" type="checkbox" onchange="toggle_concat(this.checked)"> Show concatenated output</label>

<span style="font-weight:bold;font-size:12px;color:#222;margin-top:4px">Code workbench — bucketSort(A, B)</span>
<span style="font-size:10px;line-height:1.35;color:#555">ops: read(i) · listLength(b) · nodeAt(b,k) · insertAt(b,k,x) · mark(b) · note(t)</span>
<label style="flex-direction:row;gap:4px">
  <button id="tabSample" class="active" onclick="loadSample('sample')">Sample</button>
  <button id="tabBuggy" onclick="loadSample('buggy')">Buggy</button>
  <button id="tabStarter" onclick="loadSample('starter')">Starter</button>
</label>
<textarea id="bucketSortEditorCode" spellcheck="false"></textarea>
<label>Input array A <input id="bucketSortEditorInput" value=".78, .17, .39, .26, .72, .94, .21, .12, .23, .68"></label>
<label style="flex-direction:row;gap:6px;align-items:center">
  <button id="runBtn" onclick="runCode()">▶ Run</button>
  <span id="runStatus" style="font-size:11px;color:#555;cursor:pointer">not run</span>
</label>
<label style="flex-direction:row;gap:3px;align-items:center">
  <button onclick="pbFirst()">⏮</button>
  <button onclick="pbPrev()">◀</button>
  <button id="pbPlayBtn" onclick="pbPlay()">▶</button>
  <button onclick="pbNext()">▶|</button>
  <span id="frameCounter" style="font-size:11px">0 / 0</span>
</label>
<label>Speed: <output id="speedVal">4</output> fps
  <input id="speedInput" type="range" min="1" max="20" step="1" value="4"
    oninput="document.getElementById('speedVal').value=this.value;setSpeed(+this.value)"></label>
<p id="frameCaption" style="margin:0;font-size:11px;min-height:2.4em;color:#1b4f82"></p>
<span id="runLog" style="display:block;max-height:100px;overflow:auto;font:10px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#fff;border:1px solid #dcdfe3;border-radius:4px;padding:4px;color:#444"></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,

     *            or an array of any of those.

        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };

/* ────────── code workbench ────────── */
var SAMPLES = {
  sample: 'function bucketSort(A, B) {\n  const n = 10;\n  for (let i = 1; i <= n; i++) {\n    const x = read(i);\n    const b = Math.floor(n * x);   // half-open bucket [b/10, (b+1)/10)\n    mark(b);\n    // walk the chain to find the sorted insertion point\n    let k = 0;\n    while (k < listLength(b) && nodeAt(b, k) < x) {\n      k++;\n    }\n    insertAt(b, k, x);\n    note(\'placed \' + x + \' at position \' + k + \' of bucket \' + b);\n  }\n}',
  buggy: 'function bucketSort(A, B) {\n  const n = 10;\n  for (let i = 1; i <= n; i++) {\n    const x = read(i);\n    // BUG 1: round() instead of floor() -- .78 lands in bucket 8, not 7\n    const b = Math.round(n * x);\n    mark(b);\n    // BUG 2: always appends at the tail, so a chain can come out unsorted (.17 before .12)\n    insertAt(b, listLength(b), x);\n  }\n}',
  starter: 'function bucketSort(A, B) {\n  const n = 10;\n  for (let i = 1; i <= n; i++) {\n    const x = read(i);\n    // 1. which bucket?   b = ?\n    // 2. where inside the chain?  use listLength(b) / nodeAt(b, k)\n    // 3. insertAt(b, k, x)\n  }\n}'
};
function loadSample(which) {
  document.getElementById('bucketSortEditorCode').value = SAMPLES[which];
  ['Sample', 'Buggy', 'Starter'].forEach(function (nm) {
    var el = document.getElementById('tab' + nm);
    if (el) el.className = (nm.toLowerCase() === which) ? 'active' : '';
  });
}

var WORKER_SRC = [
  'self.onmessage = function(ev){',
  '  var A = ev.data.A, code = ev.data.code, nB = 10;',
  '  var frames = [], buckets = [];',
  '  for (var i=0;i<nB;i++) buckets.push([]);',
  '  var ops = 0, t0 = Date.now(), lastRead = 0, lastMark = -1;',
  '  function fmt(x){ var s = Number(x).toFixed(2); return s.charAt(0)==="0" ? s.slice(1) : s; }',
  '  function snap(){ var o=[]; for(var i=0;i<nB;i++) o.push(buckets[i].slice()); return o; }',
  '  function guard(){',
  '    ops++;',
  '    if (ops > 4000) throw new Error("Operation cap exceeded (4000 API calls) - possible infinite loop.");',
  '    if (frames.length > 800) throw new Error("Frame cap exceeded (800 frames).");',
  '    if (Date.now() - t0 > 1500) throw new Error("Time limit exceeded (1.5 s).");',
  '  }',
  '  function push(kind, ind, msg){ frames.push({kind:kind, state:snap(), indices:ind||null, message:msg, read:lastRead, mark:lastMark}); }',
  '  function chkB(b, who){ b = Math.trunc(Number(b)); if(!(b>=0 && b<nB)) throw new Error(who+"("+b+"): bucket index must be 0.."+(nB-1)); return b; }',
  '  var read = function(i){ guard(); i = Math.trunc(Number(i));',
  '    if(!(i>=1 && i<=A.length)) throw new Error("read("+i+"): A is 1-indexed, valid range 1.."+A.length);',
  '    lastRead = i; push("read", {a:i}, "read A["+i+"] = "+fmt(A[i-1])); return A[i-1]; };',
  '  var listLength = function(b){ b = chkB(b,"listLength"); guard();',
  '    push("probe", {b:b}, "listLength("+b+") = "+buckets[b].length); return buckets[b].length; };',
  '  var nodeAt = function(b,k){ b = chkB(b,"nodeAt"); guard(); k = Math.trunc(Number(k));',
  '    if(!(k>=0 && k<buckets[b].length)) throw new Error("nodeAt("+b+","+k+"): bucket "+b+" has "+buckets[b].length+" node(s)");',
  '    push("compare", {b:b,k:k}, "nodeAt("+b+","+k+") = "+fmt(buckets[b][k])); return buckets[b][k]; };',
  '  var insertAt = function(b,k,x){ b = chkB(b,"insertAt"); guard(); k = Math.trunc(Number(k)); x = Number(x);',
  '    if(!isFinite(x)) throw new Error("insertAt("+b+","+k+",x): x must be a number");',
  '    if(!(k>=0 && k<=buckets[b].length)) throw new Error("insertAt("+b+","+k+"): position must be 0.."+buckets[b].length);',
  '    buckets[b].splice(k,0,x); lastMark = b;',
  '    push("insert", {b:b,k:k}, "insertAt(bucket "+b+", pos "+k+", "+fmt(x)+")"); return null; };',
  '  var mark = function(b){ b = chkB(b,"mark"); guard(); lastMark = b;',
  '    push("mark", {b:b}, "mark bucket "+b+"  -> interval ["+(b/10).toFixed(1)+", "+((b+1)/10).toFixed(1)+")"); return null; };',
  '  var note = function(t){ guard(); push("note", null, String(t)); return null; };',
  '  var err = null;',
  '  try {',
  '    var factory = new Function("read","listLength","nodeAt","insertAt","mark","note",',
  '      "\\"use strict\\";" + code + "\\n; return (typeof bucketSort === \\"function\\") ? bucketSort : null;");',
  '    var fn = factory(read,listLength,nodeAt,insertAt,mark,note);',
  '    if(!fn) throw new Error("No function named bucketSort(A, B) was found - check the entry point name.");',
  '    fn(A.slice(), {});',
  '  } catch(e){ err = (e && e.message) ? e.message : String(e); }',
  '  if (err) frames.push({kind:"error", state:snap(), indices:null, message:"ERROR: "+err, read:lastRead, mark:lastMark});',
  '  else frames.push({kind:"done", state:snap(), indices:null, message:"finished - "+frames.length+" operations recorded", read:0, mark:-1});',
  '  self.postMessage({frames:frames, error:err});',
  '};'
].join('\n');

function parseArray(str) {
  var parts = String(str).split(/[\s,;]+/), out = [];
  for (var i = 0; i < parts.length; i++) {
    if (!parts[i]) continue;
    var v = Number(parts[i]);
    if (!isFinite(v)) continue;
    if (v < 0) v = 0;
    if (v >= 1) v = 0.999;
    out.push(v);
  }
  return out;
}

function setStatus(txt, color) {
  var el = document.getElementById('runStatus');
  el.textContent = txt; el.style.color = color;
}

function bsCheck(buckets) {
  var bad = {}, problems = [], flat = [], b, k;
  for (b = 0; b < 10; b++) for (k = 0; k < buckets[b].length; k++) flat.push(buckets[b][k]);
  var a = bsA.slice().sort(cmpNum), g = flat.slice().sort(cmpNum);
  var msOk = a.length === g.length;
  if (msOk) for (var i = 0; i < a.length; i++) if (Math.abs(a[i] - g[i]) > 1e-9) { msOk = false; break; }
  if (!msOk) problems.push('B does not hold exactly the values of A (' + g.length + ' placed, ' + a.length + ' expected)');
  for (b = 0; b < 10; b++) {
    for (k = 0; k < buckets[b].length; k++) {
      var x = buckets[b][k];
      if (Math.floor(10 * x) !== b) {
        bad[b + ':' + k] = 1;
        problems.push(bsFmt(x) + ' sits in bucket ' + b + ' but floor(10x) = ' + Math.floor(10 * x));
      }
      if (k > 0 && buckets[b][k - 1] > x + 1e-12) {
        bad[b + ':' + k] = 1; bad[b + ':' + (k - 1)] = 1;
        problems.push('bucket ' + b + ' chain out of order: ' + bsFmt(buckets[b][k - 1]) + ' before ' + bsFmt(x));
      }
    }
  }
  return { ok: msOk && problems.length === 0, bad: bad, problems: problems };
}

function runCode() {
  var codeEl = document.getElementById('bucketSortEditorCode');
  var arr = parseArray(document.getElementById('bucketSortEditorInput').value);
  if (!arr.length) { setStatus('✗ input array is empty / unparsable', COL.red); return; }
  bsA = arr;
  pbStop();
  bsReplay = true; bsFrames = []; bsIdx = -1; bsBad = {};
  bsView.buckets = emptyBuckets(); bsView.read = 0; bsView.mark = -1; bsView.hi = null; bsView.bad = {};
  bsRender();
  setStatus('running…', '#8a6d00');
  document.getElementById('runBtn').disabled = true;

  var url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
  var w = new Worker(url);
  var done = false;
  function cleanup() { try { w.terminate(); } catch (e) { } URL.revokeObjectURL(url); document.getElementById('runBtn').disabled = false; }
  var timer = setTimeout(function () {
    if (done) return; done = true; cleanup();
    finishRun({ frames: [{ kind: 'error', state: emptyBuckets(), indices: null, read: 0, mark: -1, message: 'ERROR: timed out — the worker did not finish within 2 s (infinite loop?)' }], error: 'timeout' });
  }, 2000);
  w.onerror = function (e) {
    if (done) return; done = true; clearTimeout(timer); cleanup();
    finishRun({ frames: [{ kind: 'error', state: emptyBuckets(), indices: null, read: 0, mark: -1, message: 'ERROR: ' + (e.message || 'worker failed') }], error: 'worker' });
  };
  w.onmessage = function (e) {
    if (done) return; done = true; clearTimeout(timer); cleanup();
    finishRun(e.data);
  };
  w.postMessage({ A: bsA.slice(), code: codeEl.value });
}

function finishRun(data) {
  bsFrames = data.frames || [];
  if (!bsFrames.length) bsFrames = [{ kind: 'error', state: emptyBuckets(), indices: null, read: 0, mark: -1, message: 'ERROR: no frames recorded — did your code call any API op?' }];
  var last = bsFrames[bsFrames.length - 1];
  if (data.error) {
    bsBad = {};
    setStatus('✗ error — see caption', COL.red);
  } else {
    var res = bsCheck(last.state);
    bsBad = res.bad;
    if (res.ok) setStatus('✓ correct — buckets concatenate to sorted order', '#1a7a34');
    else setStatus('✗ wrong: ' + (res.problems[0] || 'invariant broken') + (res.problems.length > 1 ? ' (+' + (res.problems.length - 1) + ' more, click)' : ''), COL.red);
    document.getElementById('runStatus').onclick = function () {
      showPopup(res.ok ? 'Success check passed' : 'Success check failed',
        res.ok ? 'Every value of A appears exactly once, each x lies in bucket floor(10x), and every chain is increasing — so concatenating buckets 0…9 yields the fully sorted sequence.'
          : 'Problems found:\n• ' + res.problems.slice(0, 8).join('\n• '));
    };
  }
  bsReplay = true;
  bsIdx = 0;
  showFrame(0);
  bsPlay();
}

function frameKindTag(k) {
  return { read: 'read', probe: 'len', compare: 'cmp', insert: 'INSERT', mark: 'mark', note: 'note', done: 'done', error: 'ERR' }[k] || k;
}

function showFrame(i) {
  if (!bsFrames.length) return;
  bsIdx = Math.max(0, Math.min(bsFrames.length - 1, i));
  var f = bsFrames[bsIdx];
  bsReplay = true;
  bsView.buckets = f.state;
  bsView.read = f.read;
  bsView.mark = f.mark;
  bsView.hi = (f.indices && f.indices.b != null && f.indices.k != null) ? { b: f.indices.b, k: f.indices.k } : null;
  bsView.bad = (bsIdx === bsFrames.length - 1) ? bsBad : {};
  document.getElementById('frameCounter').textContent = (bsIdx + 1) + ' / ' + bsFrames.length;
  document.getElementById('frameCaption').textContent = f.message;
  var lines = [], start = Math.max(0, bsIdx - 25);
  for (var j = start; j <= bsIdx; j++) {
    lines.push((j === bsIdx ? '▸ ' : '  ') + (j + 1) + '  [' + frameKindTag(bsFrames[j].kind) + '] ' + bsFrames[j].message);
  }
  var lg = document.getElementById('runLog');
  lg.textContent = lines.join('\n');
  lg.scrollTop = lg.scrollHeight;
  bsRender();
}
function pbFirst() { pbStop(); showFrame(0); }
function pbPrev() { pbStop(); showFrame(bsIdx - 1); }
function pbNext() { pbStop(); showFrame(bsIdx + 1); }
function pbStop() {
  if (bsTimer) { clearInterval(bsTimer); bsTimer = null; }
  bsPlaying = false;
  var b = document.getElementById('pbPlayBtn'); if (b) b.textContent = '▶';
}
function pbPlay() {
  if (!bsFrames.length) return;
  if (bsPlaying) { pbStop(); return; }
  if (bsIdx >= bsFrames.length - 1) bsIdx = -1;
  bsPlaying = true;
  document.getElementById('pbPlayBtn').textContent = '⏸';
  bsTimer = setInterval(function () {
    if (bsIdx >= bsFrames.length - 1) { pbStop(); return; }
    showFrame(bsIdx + 1);
  }, 1000 / bsFps);
}
function setSpeed(v) {
  bsFps = Math.max(1, v);
  if (bsPlaying) { clearInterval(bsTimer); bsTimer = setInterval(function () { if (bsIdx >= bsFrames.length - 1) { pbStop(); return; } showFrame(bsIdx + 1); }, 1000 / bsFps); }
}

/* ────────── boot ────────── */
loadSample('sample');
bsView.buckets = distributeState(10).buckets;
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees

    _autoUiLayout();
  </script>
