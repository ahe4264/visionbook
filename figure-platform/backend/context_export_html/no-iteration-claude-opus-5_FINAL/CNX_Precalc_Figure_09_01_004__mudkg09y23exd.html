<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<label>Blue line constant <i>c</i> in x + 2y = c: <output id="blueInterceptVal">-1</output><input id="blueInterceptInput" type="range" min="-8" max="8" step="0.5" value="-1" oninput="document.getElementById('blueInterceptVal').value=this.value;update_blueIntercept(+this.value)"></label>
<label>Red line slope <i>m</i> in y = m·x + 3: <output id="redSlopeVal">1</output><input id="redSlopeInput" type="range" min="-2" max="2" step="0.1" value="1" oninput="document.getElementById('redSlopeVal').value=this.value;update_redSlope(+this.value)"></label>
<button onclick="trigger_checkSolution()">✓ Check the solution point</button>
<span id="statusCap" style="font-weight:600;color:#1f4f66">One solution</span>
<span style="height:1px;background:#dcdfe3;margin:4px 0"></span>
<span style="font-weight:600">Guided demo</span>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#333"></p>
<span style="display:flex;gap:6px;align-items:center"><button onclick="prevStep()">◀</button><span id="stepLabel" style="font-size:11px"></span><button onclick="nextStep()">▶</button></span>
<span style="font-size:10px;color:#666;line-height:1.4">Hover a line or the dot for details; click the dot to substitute its coordinates into both equations.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;

    /**

    /**

     * nothing reports it. Throwing makes verify2dHtml catch the mistake at

    /**

var cvs = document.createElement('canvas');
cvs.style.cssText = 'width:100%;height:100%;display:block';
container.appendChild(cvs);

var BLUE = '#1276a3', RED = '#ee1c25', GRIDC = '#d9d9d9';
var FONT = 'Helvetica, Arial, sans-serif';

var state = { c: -1, m: 1, showCheck: false };
var geom = {};
var chart = null;

/* ---------- number helpers ---------- */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }

function fmt(v) { var s = String(Math.round(v * 1000) / 1000); return s.replace('-', '\u2212'); }
function plainNum(v) { return String(Math.round(v * 1000) / 1000); }
function tickStr(i) { return i < 0 ? '\u2212' + (-i) : String(i); }

/* ---------- geometry ---------- */
function clipLine(a, b) {
  var pts = [], y, x, e = 1e-9;
  y = a * (-GRID_X) + b; if (y >= -GRID_Y - e && y <= GRID_Y + e) pts.push([-GRID_X, y]);
  y = a * (GRID_X) + b; if (y >= -GRID_Y - e && y <= GRID_Y + e) pts.push([GRID_X, y]);
  if (Math.abs(a) > 1e-12) {
    x = (GRID_Y - b) / a; if (x >= -GRID_X - e && x <= GRID_X + e) pts.push([x, GRID_Y]);
    x = (-GRID_Y - b) / a; if (x >= -GRID_X - e && x <= GRID_X + e) pts.push([x, -GRID_Y]);
  }
  if (pts.length < 2) return null;
  pts.sort(function (p, q) { return p[0] - q[0]; });
  var p0 = pts[0], p1 = pts[pts.length - 1];
  if (Math.abs(p0[0] - p1[0]) < 1e-9 && Math.abs(p0[1] - p1[1]) < 1e-9) return null;
  return [p0, p1];
}

function computeGeom() {
  var c = state.c, m = state.m;
  geom.blue = { a: -0.5, b: c / 2 }; geom.blue.seg = clipLine(-0.5, c / 2);
  geom.red = { a: m, b: 3 }; geom.red.seg = clipLine(m, 3);
  var det = 1 + 2 * m;
  if (Math.abs(det) < 1e-9) {

  } else {

    var x = (c - 6) / det, y = m * x + 3;
    geom.sol = { x: x, y: y };
    var cN = Math.round(c * 2), mN = Math.round(m * 10);
    var fx = frac(5 * (cN - 12), 2 * (5 + mN));
    var fy = frac(mN * fx.n + 30 * fx.d, 10 * fx.d);
    geom.fx = fx; geom.fy = fy;
    geom.onGrid = Math.abs(x) <= GRID_X + 1e-9 && Math.abs(y) <= GRID_Y + 1e-9;

function tokensFor(f) {

}

/* ---------- plugin ---------- */
var figPlugin = {
  id: 'figplug',
  beforeDatasetsDraw: function (ch) { drawBack(ch); },
  afterDatasetsDraw: function (ch) { drawFront(ch); }

function drawBack(ch) {
  var ctx = ch.ctx, sx = ch.scales.x, sy = ch.scales.y;
  var X = function (v) { return sx.getPixelForValue(v); };
  var Y = function (v) { return sy.getPixelForValue(v); };
  var u = X(1) - X(0); UNIT = u;
  var fs = Math.max(7, Math.min(15, u * 0.45)); FS = fs;
  ctx.save();
  ctx.strokeStyle = GRIDC; ctx.lineWidth = 1; ctx.setLineDash([1, 3]);
  var i, j;
  for (i = -GRID_X; i <= GRID_X; i++) { ctx.beginPath(); ctx.moveTo(X(i), Y(GRID_Y)); ctx.lineTo(X(i), Y(-GRID_Y)); ctx.stroke(); }
  for (j = -GRID_Y; j <= GRID_Y; j++) { ctx.beginPath(); ctx.moveTo(X(-GRID_X), Y(j)); ctx.lineTo(X(GRID_X), Y(j)); ctx.stroke(); }
  ctx.setLineDash([]);

  var lw = Math.max(1.2, Math.min(2.4, u * 0.07));
  var ay = Y(0), axv = X(0);
  var ax0 = X(-GRID_X - PADX * 0.8), ax1 = X(GRID_X + PADX * 0.8);
  var ay0 = Y(-GRID_Y - PADX * 0.8), ay1 = Y(GRID_Y + PADX * 0.8);
  ctx.strokeStyle = '#000'; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(ax0, ay); ctx.lineTo(ax1, ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(axv, ay0); ctx.lineTo(axv, ay1); ctx.stroke();
  var ah = Math.max(4.5, u * 0.32);
  arrow(ctx, ax1, ay, 1, 0, ah, '#000'); arrow(ctx, ax0, ay, -1, 0, ah, '#000');
  arrow(ctx, axv, ay1, 0, -1, ah, '#000'); arrow(ctx, axv, ay0, 0, 1, ah, '#000');

  var tl = Math.max(2, u * 0.13);
  ctx.lineWidth = Math.max(1, lw * 0.8); ctx.strokeStyle = '#000';
  ctx.font = Math.round(fs) + 'px ' + FONT;
  for (i = -GRID_X; i <= GRID_X; i++) {
    if (!i) continue;
    ctx.beginPath(); ctx.moveTo(X(i), ay - tl); ctx.lineTo(X(i), ay + tl); ctx.stroke();
    haloText(ctx, tickStr(i), X(i), ay + tl + fs * 1.05, 'center', '#111', fs);
  }
  for (j = -GRID_Y; j <= GRID_Y; j++) {
    if (!j) continue;
    ctx.beginPath(); ctx.moveTo(axv - tl, Y(j)); ctx.lineTo(axv + tl, Y(j)); ctx.stroke();

function drawFront(ch) {

  var X = function (v) { return sx.getPixelForValue(v); };
  var Y = function (v) { return sy.getPixelForValue(v); };

    var ax = X(seg[0][0]), ayy = Y(seg[0][1]), bx = X(seg[1][0]), by = Y(seg[1][1]);
    var s = Math.max(5, u * 0.34);
    arrow(ctx, ax, ayy, ax - bx, ayy - by, s, pairs[k][1]);
    arrow(ctx, bx, by, bx - ax, by - ayy, s, pairs[k][1]);

  /* dashed guides + axis readouts */

    ctx.save();

    ctx.font = Math.round(fs * 1.05) + 'px ' + FONT;
    var cw = ctx.measureText(cap).width;
    var cx0 = X(-GRID_X) + fs * 0.4, cy0 = Y(GRID_Y) + fs * 0.4;
    ctx.fillStyle = 'rgba(255,255,255,0.88)';

    var w = ctx.measureText(L.text).width;
    var x = X(L.p[0]) - u * 0.55;
    if (x - w < 3) x = w + 3;

    haloText(ctx, L.text, x, y, 'right', L.col, fs);

}

  type: 'scatter',
  data: {
    datasets: [
      { label: 'blue', data: [], showLine: true, borderColor: BLUE, borderWidth: 2.4, pointRadius: 0, fill: false, tension: 0 },
      { label: 'red', data: [], showLine: true, borderColor: RED, borderWidth: 2.4, pointRadius: 0, fill: false, tension: 0 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false, animation: false, events: [],
    layout: { padding: layoutPad() },
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      x: { type: 'linear', min: -6.8, max: 6.8, grid: { display: false }, border: { display: false }, ticks: { display: false } },
      y: { type: 'linear', min: -5.8, max: 5.8, grid: { display: false }, border: { display: false }, ticks: { display: false } }
    }
  },
  plugins: [figPlugin]
});
window.__markRendered();
syncScales(); syncData(); updateStatus(); chart.update('none');
requestAnimationFrame(function () { syncScales(); chart.update('none'); });

document.addEventListener('fig-resize', function () {
  requestAnimationFrame(function () { syncScales(); chart.update('none'); });
});

/* ---------- interaction ---------- */
function cpos(e) { var r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function segDist(p, a, b) {
  var vx = b.x - a.x, vy = b.y - a.y, wx = p.x - a.x, wy = p.y - a.y;
  var L = vx * vx + vy * vy; if (L < 1e-9) return Math.hypot(wx, wy);
  var t = Math.max(0, Math.min(1, (wx * vx + wy * vy) / L));
  return Math.hypot(wx - t * vx, wy - t * vy);
}
function segPx(seg) {
  if (!seg) return null;
  var sx = chart.scales.x, sy = chart.scales.y;
  return [{ x: sx.getPixelForValue(seg[0][0]), y: sy.getPixelForValue(seg[0][1]) },
  { x: sx.getPixelForValue(seg[1][0]), y: sy.getPixelForValue(seg[1][1]) }];
}
function hitTest(p) {
  if (geom._dotPx) {
    var d = Math.hypot(p.x - geom._dotPx.x, p.y - geom._dotPx.y);
    if (d < Math.max(9, geom._dotPx.r * 2.6)) {
      return { kind: 'dot', tip: 'Solution (' + fracStr(geom.fx) + ', ' + fracStr(geom.fy) + ') \u2014 lies on BOTH lines. Click to verify.' };
    }
  }
  var bs = segPx(geom.blue.seg), rs = segPx(geom.red.seg);
  var tol = Math.max(6, UNIT * 0.24);
  if (bs && segDist(p, bs[0], bs[1]) < tol) return { kind: 'blue', tip: 'Blue line: ' + geom.blueEq.replace('\u2212', '-') };
  if (rs && segDist(p, rs[0], rs[1]) < tol) return { kind: 'red', tip: 'Red line: ' + geom.redEq.replace('\u2212', '-') };
  return null;
}
cvs.addEventListener('mousemove', function (e) {
  var h = hitTest(cpos(e));
  cvs.style.cursor = h ? 'pointer' : 'default';
  if (h) showTooltip(h.tip, e); else hideTooltip();
});
cvs.addEventListener('mouseleave', hideTooltip);
cvs.addEventListener('click', function (e) {
  var h = hitTest(cpos(e));
  if (!h) return;
  if (h.kind === 'dot') { state.showCheck = true; refresh(); popupCheck(); }
  else if (h.kind === 'blue') {
    showPopup('The blue line', 'Every point on this line satisfies x + 2y = ' + plainNum(state.c) + '. Taken alone, that one equation has infinitely many solutions \u2014 one ordered pair for each point of the line.');
  } else {
    showPopup('The red line', 'Every point on this line satisfies ' + geom.redEq.replace('\u2212', '-') + '. A system asks which ordered pair works for this line AND the blue line at the same time \u2014 that is the crossing point.');
  }
});

function popupCheck() {
  if (geom.parallel) {
    showPopup('No solution', 'The red line now has slope \u22121/2, exactly the blue line\u2019s slope, so the two lines are parallel and never meet. No ordered pair can satisfy both equations, so the system has no solution.');
    return;
  }
  var xs = fracStr(geom.fx), ys = fracStr(geom.fy);
  var body = 'Substituting the point (' + xs + ', ' + ys + ') into both equations:\n\n' +
    'Blue:  x + 2y = (' + xs + ') + 2(' + ys + ') = ' + plainNum(state.c) + '  \u2713\n' +
    'Red:   y = ' + plainNum(state.m) + 'x + 3 \u2192 ' + ys + ' = ' + plainNum(state.m) + '(' + xs + ') + 3  \u2713\n\n' +
    'Both statements are true for the same ordered pair, which is exactly what it means to be the solution of the system.';
  showPopup('Checking the solution', body);
}

/* ---------- controls ---------- */
function update_blueIntercept(v) { state.c = v; refresh(); }
function update_redSlope(v) { state.m = v; refresh(); }
function trigger_checkSolution() {
  state.showCheck = !state.showCheck;
  refresh();
  if (state.showCheck) popupCheck(); else hidePopup();
}

/* ---------- demo player ---------- */
var STEPS = [
  { title: 'The original system', narration: 'Two lines are drawn on one grid: blue x + 2y = \u22121 falling to the right, red \u2212x + y = 3 rising to the right. They cross exactly once, in the second quadrant.', state: { blueIntercept: -1, redSlope: 1, showCheck: false } },
  { title: 'Read the solution', narration: 'Click the black dot: dashed guides drop to the axes at x = \u22127/3 and y = 2/3, and both equations check out when those values are substituted.', state: { blueIntercept: -1, redSlope: 1, showCheck: true } },
  { title: 'Slide the blue line', narration: 'Change the constant to c = 3 and the blue line shifts up; the crossing point slides along the red line to a new place, but there is still exactly one solution.', state: { blueIntercept: 3, redSlope: 1, showCheck: true } },
  { title: 'Rotate the red line', narration: 'Flatten the red line\u2019s slope toward \u22120.4 and the intersection races away to the left, off the visible grid \u2014 the solution still exists but is far from the origin.', state: { blueIntercept: -1, redSlope: -0.4, showCheck: false } },
  { title: 'Parallel: no solution', narration: 'At slope exactly \u22120.5 the red line is parallel to the blue line. The lines never meet, so the system has no solution at all.', state: { blueIntercept: -1, redSlope: -0.5, showCheck: false } },
  { title: 'Back to one crossing', narration: 'Tilt the red line back to a positive slope and a single crossing reappears \u2014 orientation, not position, decides whether a solution exists.', state: { blueIntercept: -1, redSlope: 1, showCheck: false } }
];
var stepIdx = 0;
function applyStep(i) {
  stepIdx = ((i % STEPS.length) + STEPS.length) % STEPS.length;
  var s = STEPS[stepIdx];
  var bi = document.getElementById('blueInterceptInput'), rs = document.getElementById('redSlopeInput');
  bi.value = s.state.blueIntercept; document.getElementById('blueInterceptVal').value = s.state.blueIntercept;
  rs.value = s.state.redSlope; document.getElementById('redSlopeVal').value = s.state.redSlope;
  state.c = +s.state.blueIntercept; state.m = +s.state.redSlope; state.showCheck = !!s.state.showCheck;
  document.getElementById('demoNarration').textContent = s.narration;
  document.getElementById('stepLabel').textContent = (stepIdx + 1) + ' / ' + STEPS.length + ' \u00b7 ' + s.title;
  refresh();
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }
applyStep(0);
// @FIGURE_CODE_END

    _autoUiLayout();
  </script>
