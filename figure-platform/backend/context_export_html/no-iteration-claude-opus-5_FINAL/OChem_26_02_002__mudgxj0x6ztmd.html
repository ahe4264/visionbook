<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<strong style="font-size:12px">Titration of alanine with HO⁻</strong>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#222">&nbsp;</p>
<span style="display:flex;gap:6px;align-items:center"><button onclick="prevStep()">◀</button><span id="stepLabel" style="font-size:11px;flex:1"></span><button onclick="nextStep()">▶</button></span>
<label>Equivalents of HO⁻ added: <output id="equivalentsVal">0.00</output><input id="equivalentsInput" type="range" min="0" max="2" step="0.05" value="0" oninput="document.getElementById('equivalentsVal').value=(+this.value).toFixed(2);update_equivalents(+this.value)"></label>
<label><input id="viewModeInput" type="checkbox" onchange="toggle_viewMode(this.checked)"> Net-charge view (badges + tinted sites)</label>
<span style="font-size:10px;color:#555;line-height:1.45">Hover or click a ✕ landmark or a bracketed structure for an explanation. Click anywhere on the curve to move the slider there.</span>
<span style="font-size:10px;color:#555;line-height:1.45"><b style="color:#e8186c">magenta</b> = protonated ammonium N (and acidic H) &nbsp;·&nbsp; <b style="color:#1f7fc4">blue</b> = neutral amine N</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;

  ctx.beginPath(); ctx.arc(mx, my, dr, 0, 6.2832);
  ctx.fillStyle = '#8c0f42'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.2, dr * 0.35); ctx.stroke();

  if (state.interacted || eq > 0) drawReadout(ctx, ca, X, Y, plotMin, eq, pH);

  ctx.restore();
}

function drawLabel(ctx, x, y, runs, fs) {
  var w = layoutRuns(ctx, runs, fs).w;
  var cx = x, i;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for (i = 0; i < runs.length; i++) {
    var r = runs[i]; ctx.font = fontFor(r, fs);
    var dy = r.sub ? fs * 0.24 : (r.sup ? -fs * 0.45 : 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = fs * 0.36; ctx.strokeText(r.t, cx, y + dy);
    cx += ctx.measureText(r.t).width;
  }
  paintRuns(ctx, x, y, runs, fs);
  return { x0: x, x1: x + w, y0: y - fs * 0.9, y1: y + fs * 0.3 };
}
function curveArrow(ctx, x0, y0, cx, cy, x1, y1, lw) {
  ctx.strokeStyle = '#111'; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
  arrowHead(ctx, x1, y1, Math.atan2(y1 - cy, x1 - cx), lw * 5);
}

var LMTIP = {
  pka1: 'pKa1 = 2.34 — half-equivalence: 50:50 cation / zwitterion',
  pi: 'Isoelectric point pI = 6.01 — pure zwitterion, net charge 0',
  pka2: 'pKa2 = 9.69 — half-equivalence: 50:50 zwitterion / anion'
};
var LMPOP = {
  pka1: ['Half-equivalence: pH = pK\u2081 = 2.34', 'At 0.5 equivalent of HO\u207B exactly half of the \u2013COOH groups have been deprotonated, so [cation] = [zwitterion]. The Henderson\u2013Hasselbalch equation then gives pH = pK\u2090\u2081, which is why the curve is flat (well buffered) here.'],
  pi: ['Isoelectric point: pI = 6.01', 'One full equivalent converts essentially all \u2013COOH to \u2013COO\u207B while the ammonium group is still protonated, so the zwitterion dominates. Its +1 and \u22121 sites cancel: net charge is zero and the molecule will not migrate in an electric field. pI is the average of the two pK\u2090 values, (2.34 + 9.69)/2 \u2248 6.01.'],
  pka2: ['Half-equivalence: pH = pK\u2090\u2082 = 9.69', 'At 1.5 equivalents half of the \u2013NH\u2083\u207A groups have lost a proton, so [zwitterion] = [anion] and pH = pK\u2090\u2082. This is the second buffering plateau of the titration.']
};
var SPPOP = {
  cation: ['Fully protonated cation (net +1)', 'Below pH ~2, both acidic sites are protonated: the ammonium N (magenta) and the carboxylic acid \u2013COOH. The overall charge is +1, so this species migrates toward the cathode in an electric field.'],
  zwitter: ['Zwitterion (net 0)', 'The carboxylate is deprotonated (\u2013COO\u207B) while the ammonium is still protonated (\u2013NH\u2083\u207A). The two charges cancel, giving zero net charge \u2014 the form that dominates at the isoelectric point, pH 6.01.'],
  anion: ['Fully deprotonated anion (net \u22121)', 'Above pH ~10 both acidic protons are gone: a neutral amine (blue H\u2082N) and a carboxylate. The overall charge is \u22121, so this species migrates toward the anode.'],
  pair1: ['50:50 mixture at pK\u2090\u2081', 'Equal amounts of the +1 cation and the neutral zwitterion coexist at 0.5 equivalent. Because the acid and its conjugate base are equal, pH = pK\u2090\u2081 = 2.34 and the solution resists pH change.'],
  pair2: ['50:50 mixture at pK\u2090\u2082', 'Equal amounts of the neutral zwitterion and the \u22121 anion coexist at 1.5 equivalents, so pH = pK\u2090\u2082 = 9.69 \u2014 the second buffer region.']
};

function drawPanel(ctx, chart, ca, X, Y, W, H) {
  var px0 = ca.right + Math.max(8, W * 0.012);
  var panelW = W - px0 - 6;
  if (panelW < 120) return;
  var fs = Math.min(panelW * 0.037, H * 0.034, 26);
  var guard = 0;
  while (guard++ < 80 && fs > 6 && (pairW(ctx, 'zwitter', 'anion', fs, state.charge) > panelW * 0.58 ||
    speciesW(ctx, 'cation', fs, state.charge, true) > panelW * 0.40)) fs -= 0.4;

  var rows = [
    { f: 0.085, kind: 'single', a: 'anion', eq: 2.0, id: 'anion' },
    { f: 0.285, kind: 'pair', a: 'zwitter', b: 'anion', eq: 1.5, id: 'pair2' },
    { f: 0.480, kind: 'single', a: 'zwitter', eq: 1.0, id: 'zwitter' },
    { f: 0.678, kind: 'pair', a: 'cation', b: 'zwitter', eq: 0.5, id: 'pair1' },
    { f: 0.868, kind: 'single', a: 'cation', eq: 0.0, id: 'cation' }
  ];
  var actRow = null;
  if (state.interacted) {
    var best = 9, bi = -1;
    for (var q = 0; q < rows.length; q++) { var d = Math.abs(rows[q].eq - state.eq); if (d < best) { best = d; bi = q; } }
    if (best <= 0.13) actRow = bi;
  }
  var ms = Math.max(3.5, Math.min(ca.right - ca.left, ca.bottom - ca.top) * 0.017);
  var alw = Math.max(0.9, W * 0.0011);

  for (var i = 0; i < rows.length; i++) {
    var R = rows[i], yc = H * R.f, box, x0;
    if (R.kind === 'single') x0 = px0 + panelW * 0.09;
    else x0 = W - 6 - pairW(ctx, R.a, R.b, fs, state.charge);

    /* connector arrow (drawn under the structure) */
    var tx = X(R.eq), ty = Y(pHof(R.eq));
    var endx = tx + (R.eq === 0 ? 4 : (R.eq === 2 ? 4 : ms * 1.8));
    ctx.strokeStyle = '#111'; ctx.lineWidth = alw;
    ctx.beginPath(); ctx.moveTo(x0 - fs * 0.45, yc); ctx.lineTo(endx, ty); ctx.stroke();
    arrowHead(ctx, endx, ty, Math.atan2(ty - yc, endx - (x0 - fs * 0.45)), alw * 5.2);

    var dim = (actRow !== null && actRow !== i);
    ctx.save(); ctx.globalAlpha = dim ? 0.42 : 1;
    if (R.kind === 'single') box = drawSpecies(ctx, x0, yc, R.a, fs, { bracket: true, charge: state.charge });
    else box = drawPair(ctx, x0, yc, R.a, R.b, fs, { charge: state.charge });
    ctx.restore();

    if (actRow === i) {
      ctx.strokeStyle = '#f5a623'; ctx.lineWidth = Math.max(1.4, fs * 0.09);
      rrect(ctx, box.x0 - fs * 0.35, box.y0 - fs * 0.3, (box.x1 - box.x0) + fs * 0.7, (box.y1 - box.y0) + fs * 0.6, fs * 0.3);
      ctx.stroke();
    }
    hits.push({
      x0: box.x0 - fs * 0.4, x1: box.x1 + fs * 0.4, y0: box.y0 - fs * 0.3, y1: box.y1 + fs * 0.4,
      id: R.id, tip: SPPOP[R.id][0], title: SPPOP[R.id][0], body: SPPOP[R.id][1], eq: R.eq
    });
  }

  /* key */
  var kfs = Math.max(7, fs * 0.52);
  ctx.font = kfs.toFixed(1) + 'px ' + FAM; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  var ky = H - kfs * 0.55;
  ctx.fillStyle = MAG; ctx.fillText('\u25A0', px0, ky);
  ctx.fillStyle = '#555'; ctx.fillText(' protonated N (H\u2083N\u207A) / acidic H', px0 + kfs, ky);
  var wkey = ctx.measureText(' protonated N (H\u2083N\u207A) / acidic H').width + kfs * 2.2;
  ctx.fillStyle = BLUE; ctx.fillText('\u25A0', px0 + wkey, ky);
  ctx.fillStyle = '#555'; ctx.fillText(' neutral amine (H\u2082N)', px0 + wkey + kfs, ky);
}

function drawReadout(ctx, ca, X, Y, plotMin, eq, pH) {
  var fs = Math.max(7.5, Math.min(13, plotMin * 0.030));
  var f = fracs(pH), q = f[0] - f[2];
  var l1 = eq.toFixed(2) + ' equiv \u00B7 pH ' + pH.toFixed(2);
  var l3 = 'net charge ' + (q >= 0 ? '+' : '') + q.toFixed(2);
  var segs = [
    { t: '+1 ' + Math.round(f[0] * 100) + '%', c: '#d0021b' },
    { t: '  0 ' + Math.round(f[1] * 100) + '%', c: '#444' },
    { t: '  \u22121 ' + Math.round(f[2] * 100) + '%', c: '#1f6fb4' }
  ];
  ctx.font = fs.toFixed(1) + 'px ' + FAM;
  var w2 = 0, i;
  for (i = 0; i < segs.length; i++) w2 += ctx.measureText(segs[i].t).width;
  var w = Math.max(ctx.measureText(l1).width, ctx.measureText(l3).width, w2) + fs * 1.0;
  var x = ca.left + fs * 0.5, y = ca.top + fs * 0.4;
  var h = fs * 4.5;
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; rrect(ctx, x, y, w, h, fs * 0.35); ctx.fill();
  ctx.strokeStyle = '#9aa7b0'; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#111'; ctx.font = 'bold ' + fs.toFixed(1) + 'px ' + FAM;
  ctx.fillText(l1, x + fs * 0.5, y + fs * 1.25);
  ctx.font = fs.toFixed(1) + 'px ' + FAM;
  var cx = x + fs * 0.5;
  for (i = 0; i < segs.length; i++) { ctx.fillStyle = segs[i].c; ctx.fillText(segs[i].t, cx, y + fs * 2.55); cx += ctx.measureText(segs[i].t).width; }
  ctx.fillStyle = state.charge ? '#111' : '#555';
  ctx.font = (state.charge ? 'bold ' : '') + fs.toFixed(1) + 'px ' + FAM;
  ctx.fillText(l3, x + fs * 0.5, y + fs * 3.85);
}

/* ---------- interaction ---------- */
function render() { chart.update('none'); }

function update_equivalents(v) {
  state.eq = Math.max(0, Math.min(2, v));
  state.interacted = true;
  render();
}
function toggle_viewMode(on) {
  state.charge = !!on;
  state.interacted = true;
  render();
}

function cpos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function findHit(mx, my) {
  for (var i = 0; i < hits.length; i++) {
    var h = hits[i];
    if (h.r != null) { if (Math.hypot(mx - h.cx, my - h.cy) <= h.r) return h; }
    else if (mx >= h.x0 && mx <= h.x1 && my >= h.y0 && my <= h.y1) return h;
  }
  return null;
}
canvas.addEventListener('mousemove', function (e) {
  var p = cpos(e), h = findHit(p.x, p.y), ca = chart.chartArea;
  if (h) { canvas.style.cursor = 'pointer'; showTooltip(h.tip, e); return; }
  if (ca && p.x >= ca.left && p.x <= ca.right && p.y >= ca.top && p.y <= ca.bottom) {
    var v = Math.max(0, Math.min(2, chart.scales.x.getValueForPixel(p.x)));
    var py = chart.scales.y.getPixelForValue(pHof(v));
    if (Math.abs(py - p.y) < 14) {
      canvas.style.cursor = 'pointer';
      showTooltip(v.toFixed(2) + ' equiv HO\u207B \u2192 pH ' + pHof(v).toFixed(2) + ' (click to move marker)', e);
      return;
    }
    canvas.style.cursor = 'crosshair'; hideTooltip(); return;
  }
  canvas.style.cursor = 'default'; hideTooltip();
});
canvas.addEventListener('mouseleave', function () { hideTooltip(); });
canvas.addEventListener('click', function (e) {
  var p = cpos(e), h = findHit(p.x, p.y), ca = chart.chartArea;
  if (h) {
    state.selected = (h.r != null) ? h.id : null;
    state.interacted = true;
    if (h.eq != null) { setSlider(h.eq); }
    else if (h.id === 'pka1') setSlider(0.5);
    else if (h.id === 'pi') setSlider(1.0);
    else if (h.id === 'pka2') setSlider(1.5);
    render();
    showPopup(h.title, h.body);
    return;
  }
  if (ca && p.x >= ca.left && p.x <= ca.right && p.y >= ca.top && p.y <= ca.bottom) {
    var v = Math.round(Math.max(0, Math.min(2, chart.scales.x.getValueForPixel(p.x))) / 0.05) * 0.05;
    state.selected = null; setSlider(v); state.interacted = true; render();
  }
});
function setSlider(v) {
  var inp = document.getElementById('equivalentsInput');
  inp.value = v;
  document.getElementById('equivalentsVal').value = (+v).toFixed(2);
  state.eq = +v;
}

/* ---------- demo steps ---------- */
var STEPS = [
  { title: 'Start: fully protonated cation', n: 'With no base added, alanine sits at low pH as the cation: protonated ammonium and intact carboxylic acid, net charge +1.', eq: 0, charge: false, sel: null },
  { title: 'First buffering region: pK\u2090\u2081', n: 'At 0.5 equivalent the carboxylic acid is half neutralized; the solution holds equal amounts of cation and zwitterion and the pH equals pK\u2090\u2081 = 2.34.', eq: 0.5, charge: false, sel: 'pka1' },
  { title: 'Equivalence point: the zwitterion', n: 'One full equivalent converts nearly all the COOH to COO\u207B. The pH leaps through the steep region and settles at 6.01, where the zwitterion dominates.', eq: 1, charge: false, sel: 'pi' },
  { title: 'Why 6.01 is the isoelectric point', n: 'In the net-charge view the +1 ammonium and \u22121 carboxylate cancel: the dominant species carries zero net charge and will not migrate in an electric field.', eq: 1, charge: true, sel: 'pi' },
  { title: 'Second buffering region: pK\u2090\u2082', n: 'At 1.5 equivalents the ammonium group is half deprotonated; zwitterion and anion are present 50:50 and pH = pK\u2090\u2082 = 9.69.', eq: 1.5, charge: false, sel: 'pka2' },
  { title: 'End: fully deprotonated anion', n: 'By 2.0 equivalents both acidic protons are gone, leaving the neutral blue amine and a carboxylate anion with net charge \u22121 near pH 11.5.', eq: 2, charge: true, sel: null }
];
var stepIdx = 0;
function applyStep(i) {
  stepIdx = Math.max(0, Math.min(STEPS.length - 1, i));
  var S = STEPS[stepIdx];
  setSlider(S.eq);
  var cb = document.getElementById('viewModeInput');
  cb.checked = S.charge; state.charge = S.charge;
  state.selected = S.sel;
  state.interacted = stepIdx > 0;
  document.getElementById('demoNarration').textContent = S.n;
  document.getElementById('stepLabel').textContent = 'Step ' + (stepIdx + 1) + '/' + STEPS.length + ' \u00B7 ' + S.title;
  render();
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
