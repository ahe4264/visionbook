<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font:600 12px Georgia,serif">Guided demo</span>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.45;min-height:74px"></span>
<span style="display:flex;gap:8px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px"></span>
  <button onclick="nextStep()">▶</button>
</span>
<span style="display:block;border-top:1px solid #dcdfe3;margin:2px 0 0"></span>
<label>Distance from hitter (ft): <output id="distanceAlongPathVal">200</output>
  <input id="distanceAlongPathInput" type="range" min="0" max="570" step="5" value="200"
    oninput="document.getElementById('distanceAlongPathVal').value=this.value;update_distanceAlongPath(+this.value)"></label>
<label>Outfield wall distance (ft): <output id="wallPositionVal">400</output>
  <input id="wallPositionInput" type="range" min="100" max="580" step="10" value="400"
    oninput="document.getElementById('wallPositionVal').value=this.value;update_wallPosition(+this.value)"></label>
<label>Wall height (ft): <output id="wallHeightVal">12</output>
  <input id="wallHeightInput" type="range" min="5" max="60" step="1" value="12"
    oninput="document.getElementById('wallHeightVal').value=this.value;update_wallHeight(+this.value)"></label>
<label><input id="viewModeInput" type="checkbox" onchange="toggle_viewMode(this.checked)"> Sampled points view</label>
<button id="flightBtn" onclick="trigger_flight()">▶ Play ball flight</button>
<span id="readout" style="display:block;font-size:11px;line-height:1.45;font-family:Georgia,serif"></span>
<span style="display:block;font-size:10px;color:#666;line-height:1.4">Tip: hover the curve, the marker or the wall; drag the marker dot along the arc.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var SERIF = 'Georgia, "Times New Roman", serif';
var TEAL = '#1a7f9e', WALLRED = '#dd2222', GREEN = '#178a3a';
var RANGE = 565, PEAK = 155;

function hOf(x) { if (x < 0 || x > RANGE) return 0; return 4 * PEAK * x * (RANGE - x) / (RANGE * RANGE); }

var bb = { dist: 200, wallX: 400, wallH: 12, sampled: false, flying: false, flyX: 0, t0: 0, chart: null, drag: false };

var curvePts = [], i;
for (i = 0; i <= 160; i++) { var cx = RANGE * i / 160; curvePts.push({ x: cx, y: hOf(cx) }); }
var sampPts = [];
for (i = 0; i < 12; i++) { sampPts.push({ x: i * 50, y: hOf(i * 50) }); }

function kOf(c) {
  var w = (c.chartArea ? c.chartArea.width : c.width) || 400;
  var h = (c.chartArea ? c.chartArea.height : c.height) || 300;
  var k = Math.min(w, h) / 330;
  return Math.max(0.58, Math.min(1.25, k));
}
function PX(v) { return bb.chart.scales.x.getPixelForValue(v); }
function PY(v) { return bb.chart.scales.y.getPixelForValue(v); }

function ht(ctx, s, x, y, size, align, base, color, weight) {
  ctx.font = (weight ? weight + ' ' : '') + size.toFixed(1) + 'px ' + SERIF;
  ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, size * 0.3); ctx.strokeStyle = '#fff';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color || '#000'; ctx.fillText(s, x, y);
}
function head(ctx, x, y, ang, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size, size * 0.45);
  ctx.lineTo(-size * 0.7, 0); ctx.lineTo(-size, -size * 0.45); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function tw(ctx, s, size, weight) {
  ctx.font = (weight ? weight + ' ' : '') + size.toFixed(1) + 'px ' + SERIF;
  return ctx.measureText(s).width;
}

/* ---------- overlay drawing ---------- */
function drawAxes(ctx, area, k) {
  var y0 = PY(0), x0 = PX(0), s = 8 * k;
  ctx.save(); ctx.setLineDash([]); ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1.2, 1.6 * k);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(area.right + 13 * k, y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, area.top - 11 * k); ctx.stroke();
  head(ctx, area.right + 16 * k, y0, 0, s, '#000');
  head(ctx, x0, area.top - 14 * k, -Math.PI / 2, s, '#000');
  ctx.restore();
}
function drawCurveArrows(ctx, k) {
  var xs = [55, 150, 385, 470, 558], j;
  for (j = 0; j < xs.length; j++) {
    var x = xs[j], d = 4;
    var ax = PX(x), ay = PY(hOf(x));
    var bx = PX(x + d), by = PY(hOf(x + d));
    head(ctx, ax, ay, Math.atan2(by - ay, bx - ax), 8.5 * k, TEAL);
  }
}
function drawOpenCircle(ctx, k) {
  var x = 195, cx = PX(x), cy = PY(hOf(x)), r = 6.5 * k;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = Math.max(1.2, 1.8 * k); ctx.strokeStyle = '#e08a2e'; ctx.stroke(); ctx.restore();
}
function drawWall(ctx, area, k) {
  var w = Math.max(5, 8 * k), x = PX(bb.wallX);
  var yTop = PY(bb.wallH), yBot = PY(0);
  ctx.save(); ctx.fillStyle = WALLRED;
  ctx.fillRect(x - w / 2, yTop, w, yBot - yTop);
  ctx.restore();
}
function drawMarker(ctx, area, k) {
  var d = bb.dist, y = hOf(d), mx = PX(d), my = PY(y);
  ctx.save();
  ctx.setLineDash([4 * k, 4 * k]); ctx.lineWidth = Math.max(1, 1.2 * k); ctx.strokeStyle = '#9aa0a6';
  ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx, PY(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(PX(0), my); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(mx, my, 5.2 * k, 0, 6.2832);
  ctx.fillStyle = TEAL; ctx.fill(); ctx.lineWidth = 1.6 * k; ctx.strokeStyle = '#fff'; ctx.stroke();
  // callout
  var txt = '(' + d.toFixed(0) + ' ft, ' + y.toFixed(0) + ' ft)';
  var fs = 11.5 * k, pad = 4 * k;
  var wTxt = tw(ctx, txt, fs) + pad * 2, hTxt = fs * 1.55;
  var bx = mx + 12 * k, by = my - 14 * k - hTxt;
  if (bx + wTxt > area.right - 2) bx = mx - 12 * k - wTxt;
  if (by < area.top + 2) by = my + 14 * k;
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.strokeStyle = '#b9c0c7'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(bx, by, wTxt, hTxt); ctx.fill(); ctx.stroke();
  ht(ctx, txt, bx + pad, by + hTxt / 2 + fs * 0.35, fs, 'left', 'alphabetic', '#123');
  ctx.restore();
}
function drawBall(ctx, k) {
  var x = bb.flyX, cx = PX(x), cy = PY(hOf(x));
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 7 * k, 0, 6.2832);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 2.2 * k; ctx.strokeStyle = TEAL; ctx.stroke();
  ctx.restore();
}
function drawTable(ctx, area, k) {
  var fs = Math.max(8, 10.5 * k), rowH = fs * 1.38;
  var rows = sampPts.slice();
  var maxH = (PY(168) - area.top) - 6;
  if (rowH * (rows.length + 1) + 8 > maxH) rows = rows.filter(function (p, idx) { return idx % 2 === 0; });
  var w = Math.max(tw(ctx, 'd (ft)  h (ft)', fs) + 26 * k, 74 * k);
  var hgt = rowH * (rows.length + 1) + 8;
  var x1 = area.right - w - 4, y1 = area.top + 3;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = '#b9c0c7'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(x1, y1, w, hgt); ctx.fill(); ctx.stroke();
  ht(ctx, 'd (ft)', x1 + 8 * k, y1 + rowH, fs, 'left', 'alphabetic', '#333', 'bold');
  ht(ctx, 'h (ft)', x1 + w - 8 * k, y1 + rowH, fs, 'right', 'alphabetic', '#333', 'bold');
  ctx.strokeStyle = '#d5dade'; ctx.beginPath();
  ctx.moveTo(x1 + 5, y1 + rowH + 3); ctx.lineTo(x1 + w - 5, y1 + rowH + 3); ctx.stroke();
  for (var r = 0; r < rows.length; r++) {
    var yy = y1 + rowH * (r + 2);
    ht(ctx, rows[r].x.toFixed(0), x1 + 8 * k, yy, fs, 'left', 'alphabetic', '#123');
    ht(ctx, rows[r].y.toFixed(0), x1 + w - 8 * k, yy, fs, 'right', 'alphabetic', TEAL);
  }
  ctx.restore();
  return { l: x1, t: y1, r: x1 + w, b: y1 + hgt };
}
function drawClearance(ctx, area, k, tableBox) {
  var hw = hOf(bb.wallX);
  var landed = bb.wallX > RANGE;
  var clears = !landed && hw > bb.wallH;
  var col = clears ? GREEN : WALLRED;
  var xl = PX(bb.wallX) + 11 * k;
  ctx.save();
  if (!landed) {
    ctx.setLineDash([5 * k, 4 * k]); ctx.lineWidth = Math.max(1, 1.4 * k); ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(xl, PY(bb.wallH)); ctx.lineTo(xl, PY(Math.max(hw, bb.wallH))); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(xl - 4 * k, PY(bb.wallH)); ctx.lineTo(xl + 4 * k, PY(bb.wallH));
    ctx.moveTo(xl - 4 * k, PY(Math.max(hw, bb.wallH))); ctx.lineTo(xl + 4 * k, PY(Math.max(hw, bb.wallH)));
    ctx.stroke();
    // ball position on curve at the wall
    ctx.beginPath(); ctx.arc(PX(bb.wallX), PY(hw), 3.4 * k, 0, 6.2832);
    ctx.fillStyle = col; ctx.fill();
  }
  var l1 = landed ? 'LANDS SHORT' : (clears ? 'CLEARS by ' + (hw - bb.wallH).toFixed(0) + ' ft' : 'HITS WALL');
  var l2 = 'h(' + bb.wallX.toFixed(0) + ') = ' + hw.toFixed(0) + ' ft  vs  wall ' + bb.wallH.toFixed(0) + ' ft';
  var f1 = 12 * k, f2 = 10.5 * k, pad = 5 * k;
  var bw = Math.max(tw(ctx, l1, f1, 'bold'), tw(ctx, l2, f2)) + pad * 2;
  var bh = f1 * 1.35 + f2 * 1.35 + pad;
  var bx = PX(bb.wallX) - bw / 2, by = PY(258);
  if (by < area.top + 2) by = area.top + 2;
  if (bx < area.left + 2) bx = area.left + 2;
  if (bx + bw > area.right - 2) bx = area.right - 2 - bw;
  if (tableBox && !(bx + bw < tableBox.l || bx > tableBox.r || by + bh < tableBox.t || by > tableBox.b)) {
    bx = Math.max(area.left + 2, tableBox.l - bw - 8);
  }
  ctx.setLineDash([3 * k, 3 * k]); ctx.lineWidth = 1; ctx.strokeStyle = col;
  ctx.beginPath(); ctx.moveTo(bx + bw / 2, by + bh);
  ctx.lineTo(xl, PY(Math.max(hw, bb.wallH)) - 3 * k); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = clears ? 'rgba(232,247,236,0.96)' : 'rgba(253,235,235,0.96)';
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, 1.2 * k);
  ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
  ht(ctx, l1, bx + pad, by + pad + f1, f1, 'left', 'alphabetic', col, 'bold');
  ht(ctx, l2, bx + pad, by + pad + f1 + f2 * 1.3, f2, 'left', 'alphabetic', '#333');
  ctx.restore();
}
function drawLabels(ctx, area, k) {
  var fs = 14 * k;
  ctx.save(); ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1, 1.2 * k);
  // Trajectory of ball
  var tx = PX(60), tyv = PY(208);
  ht(ctx, 'Trajectory of ball', tx, tyv, fs, 'left', 'alphabetic', '#000');
  var endX = tx + tw(ctx, 'Trajectory of ball', fs);
  ctx.beginPath(); ctx.moveTo(endX - 22 * k, tyv + 5 * k);
  ctx.lineTo(PX(190) - 4 * k, PY(hOf(195)) + 11 * k); ctx.stroke();
  head(ctx, PX(192) - 2 * k, PY(hOf(195)) + 9 * k,
    Math.atan2((PY(hOf(195)) + 9 * k) - (tyv + 5 * k), (PX(192) - 2 * k) - (endX - 22 * k)), 7.5 * k, '#000');
  // Position of hitter
  var px2 = PX(62), py2 = PY(40);
  ht(ctx, 'Position of hitter', px2, py2, fs, 'left', 'alphabetic', '#000');
  ctx.beginPath(); ctx.moveTo(px2 - 5 * k, py2 - 4 * k); ctx.lineTo(PX(9), PY(7)); ctx.stroke();
  head(ctx, PX(7), PY(5), Math.atan2(PY(5) - (py2 - 4 * k), PX(7) - (px2 - 5 * k)), 7.5 * k, '#000');
  // Outfield wall
  var wx = Math.min(Math.max(PX(bb.wallX), area.left + 40 * k), area.right - 40 * k);
  ht(ctx, 'Outfield wall', wx, PY(bb.wallH) - 9 * k, fs, 'center', 'alphabetic', '#000');
  ctx.restore();
}

/* ---------- chart ---------- */
var cv = document.createElement('canvas');
cv.style.cssText = 'width:100%;height:100%;display:block';
document.getElementById('container').appendChild(cv);

var overlayPlugin = {
  id: 'bbOverlay',
  afterDatasetsDraw: function (c) {
    var ctx = c.ctx, area = c.chartArea, k = kOf(c);
    ctx.save();
    drawAxes(ctx, area, k);
    if (!bb.sampled) drawCurveArrows(ctx, k);
    drawOpenCircle(ctx, k);
    drawWall(ctx, area, k);
    drawMarker(ctx, area, k);
    if (bb.flying) drawBall(ctx, k);
    var tb = bb.sampled ? drawTable(ctx, area, k) : null;
    drawClearance(ctx, area, k, tb);
    drawLabels(ctx, area, k);
    ctx.restore();
  }
};

bb.chart = new Chart(cv.getContext('2d'), {
  type: 'scatter',
  data: {
    datasets: [
      { label: 'Trajectory', data: curvePts, showLine: true, borderColor: TEAL, borderWidth: 3, pointRadius: 0, tension: 0, order: 2 },
      { label: 'Samples', data: sampPts, showLine: false, pointRadius: 4.5, backgroundColor: TEAL, borderColor: TEAL, hidden: true, order: 1 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false, animation: false,
    layout: { padding: { top: 20, right: 24, bottom: 2, left: 2 } },
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      x: {
        type: 'linear', min: 0, max: 600,
        border: { display: false },
        grid: { color: '#cccccc', lineWidth: 1, borderDash: [1, 3], drawTicks: true, tickColor: '#000', tickLength: 5 },
        ticks: { stepSize: 100, color: '#000', font: function (c) { return { family: SERIF, size: Math.round(13 * kOf(c.chart)) }; } },
        title: { display: true, text: 'Distance (ft)', color: '#000', font: function (c) { return { family: SERIF, size: Math.round(15 * kOf(c.chart)) }; } }
      },
      y: {
        type: 'linear', min: 0, max: 320,
        border: { display: false },
        grid: { color: '#cccccc', lineWidth: 1, borderDash: [1, 3], drawTicks: true, tickColor: '#000', tickLength: 5 },
        ticks: {
          stepSize: 50, color: '#000',
          font: function (c) { return { family: SERIF, size: Math.round(13 * kOf(c.chart)) }; },
          callback: function (v) { return (v % 100 === 0 && v !== 0) ? v : ''; }
        },
        title: { display: true, text: 'Height (ft)', color: '#000', font: function (c) { return { family: SERIF, size: Math.round(15 * kOf(c.chart)) }; } }
      }
    }
  },
  plugins: [overlayPlugin]
});
window.__markRendered();

function redraw() { bb.chart.update('none'); updateReadout(); }
function updateReadout() {
  var hw = hOf(bb.wallX), el = document.getElementById('readout');
  if (!el) return;
  var verdict = bb.wallX > RANGE ? 'ball lands short' : (hw > bb.wallH ? 'HOME RUN' : 'hits the wall');
  el.innerHTML = 'h(' + bb.dist + ') = ' + hOf(bb.dist).toFixed(1) + ' ft<br>' +
    'At the wall: h(' + bb.wallX + ') = ' + hw.toFixed(1) + ' ft vs ' + bb.wallH + ' ft → <b>' + verdict + '</b>';
}

/* ---------- interaction handlers ---------- */
function update_distanceAlongPath(v) { bb.dist = v; redraw(); }
function update_wallPosition(v) { bb.wallX = v; redraw(); }
function update_wallHeight(v) { bb.wallH = v; redraw(); }
function toggle_viewMode(on) {
  bb.sampled = !!on;
  bb.chart.data.datasets[0].hidden = bb.sampled;
  bb.chart.data.datasets[1].hidden = !bb.sampled;
  redraw();
}
function trigger_flight() {
  var btn = document.getElementById('flightBtn');
  if (bb.flying) { bb.flying = false; btn.textContent = '▶ Play ball flight'; redraw(); return; }
  bb.flying = true; bb.t0 = performance.now(); bb.flyX = 0;
  btn.textContent = '■ Stop';
  requestAnimationFrame(flightFrame);
}
function flightFrame(now) {
  if (!bb.flying) return;
  var p = (now - bb.t0) / 2600;
  if (p >= 1) {
    bb.flying = false; document.getElementById('flightBtn').textContent = '▶ Play ball flight';
    bb.chart.update('none'); return;
  }
  bb.flyX = p * RANGE;
  bb.chart.update('none');
  requestAnimationFrame(flightFrame);
}

/* ---------- hover / click / drag ---------- */
function mouseData(e) {
  var r = cv.getBoundingClientRect();
  return { mx: e.clientX - r.left, my: e.clientY - r.top };
}
cv.addEventListener('mousemove', function (e) {
  var m = mouseData(e);
  if (bb.drag) {
    var v = bb.chart.scales.x.getValueForPixel(m.mx);
    v = Math.max(0, Math.min(570, Math.round(v / 5) * 5));
    bb.dist = v;
    var s = document.getElementById('distanceAlongPathInput');
    s.value = v; document.getElementById('distanceAlongPathVal').value = v;
    redraw();
    showTooltip('(' + v + ' ft, ' + hOf(v).toFixed(0) + ' ft)', e);
    return;
  }
  var mkx = PX(bb.dist), mky = PY(hOf(bb.dist));
  var dm = Math.hypot(m.mx - mkx, m.my - mky);
  if (dm < 13) {
    cv.style.cursor = 'pointer';
    showTooltip('Marker: (' + bb.dist + ' ft, ' + hOf(bb.dist).toFixed(0) + ' ft) — drag me along the arc', e);
    return;
  }
  if (Math.abs(m.mx - PX(bb.wallX)) < 10 && m.my > PY(bb.wallH) - 6 && m.my < PY(0) + 4) {
    cv.style.cursor = 'pointer';
    showTooltip('Outfield wall: ' + bb.wallH + ' ft tall at ' + bb.wallX + ' ft', e);
    return;
  }
  var xv = bb.chart.scales.x.getValueForPixel(m.mx);
  if (xv >= 0 && xv <= RANGE && Math.abs(m.my - PY(hOf(xv))) < 11) {
    cv.style.cursor = 'pointer';
    showTooltip('Trajectory: at ' + xv.toFixed(0) + ' ft the ball is ' + hOf(xv).toFixed(0) + ' ft high', e);
    return;
  }
  cv.style.cursor = 'default';
  hideTooltip();
});
cv.addEventListener('mouseleave', function () { hideTooltip(); bb.drag = false; });
cv.addEventListener('mousedown', function (e) {
  var m = mouseData(e);
  if (Math.hypot(m.mx - PX(bb.dist), m.my - PY(hOf(bb.dist))) < 15) bb.drag = true;
});
window.addEventListener('mouseup', function () { bb.drag = false; });
cv.addEventListener('click', function (e) {
  if (bb.drag) return;
  var m = mouseData(e);
  if (Math.abs(m.mx - PX(bb.wallX)) < 12 && m.my > PY(bb.wallH) - 8 && m.my < PY(0) + 4) {
    showPopup('The outfield wall',
      'The wall is just a vertical segment of height ' + bb.wallH + ' ft standing at x = ' + bb.wallX + ' ft. ' +
      'The hit is a home run exactly when h(' + bb.wallX + ') = ' + hOf(bb.wallX).toFixed(0) + ' ft exceeds that wall height. ' +
      'Nothing else about the curve matters for that single yes/no question.');
    return;
  }
  var xv = bb.chart.scales.x.getValueForPixel(m.mx);
  if (xv >= 0 && xv <= RANGE && Math.abs(m.my - PY(hOf(xv))) < 14) {
    showPopup('One distance, one height',
      'The flight path is the parabola h(x) = 4·155·x·(565 − x)/565², so each distance x has exactly one height. ' +
      'At x = ' + xv.toFixed(0) + ' ft the ball is ' + hOf(xv).toFixed(0) + ' ft above the ground. ' +
      'The vertex near 283 ft is the maximum height, about 155 ft.');
    return;
  }
  showPopup('Reading the figure',
    'Horizontal axis: distance from the hitter; vertical axis: height above the ground — not time. ' +
    'The teal arc records the whole flight at once, from the origin (the hitter) to the landing point near 565 ft. ' +
    'Move the wall sliders to see the clearance badge flip between CLEARS and HITS WALL.');
});

/* ---------- demo step player ---------- */
var steps = [
  { title: 'The arc of the hit', narration: 'A batted ball leaves the hitter at the origin and traces a downward-opening parabola, peaking a little above 150 ft near 290 ft before landing past 560 ft. Watch the ball travel the whole path.', state: { viewMode: 'Smooth path', distanceAlongPath: 200, wallPosition: 400, wallHeight: 12 }, play: true },
  { title: 'Reading a height at one distance', narration: 'Drag the marker to 200 ft: the dashed drop line ties that horizontal distance to a single height of about 140 ft. Every distance on the axis has exactly one height on the curve.', state: { viewMode: 'Smooth path', distanceAlongPath: 200, wallPosition: 400, wallHeight: 12 } },
  { title: 'Find the peak', narration: 'Slide out to about 290 ft, where the height stops increasing. This vertex is the maximum height of the flight — beyond it the ball is descending.', state: { viewMode: 'Smooth path', distanceAlongPath: 290, wallPosition: 400, wallHeight: 12 } },
  { title: 'Does it clear the wall?', narration: 'The wall stands at 400 ft. Move the marker there and compare: the ball is roughly 140 ft up while the fence is only 12 ft — an easy home run.', state: { viewMode: 'Smooth path', distanceAlongPath: 400, wallPosition: 400, wallHeight: 12 } },
  { title: 'Push the wall out', narration: "Slide the wall toward 560 ft. As the curve dives back to the axis the clearance shrinks and eventually the badge flips to 'HITS WALL' — the question is always a comparison of two heights at one x.", state: { viewMode: 'Smooth path', distanceAlongPath: 555, wallPosition: 550, wallHeight: 12 } },
  { title: 'Same arc, as data', narration: 'Switch to sampled points: the smooth path becomes a set of (distance, height) pairs on the grid. The table and the curve carry identical information about the flight.', state: { viewMode: 'Sampled points', distanceAlongPath: 290, wallPosition: 400, wallHeight: 12 } }
];
var stepIdx = 0;
function setSlider(id, v, fn) {
  var el = document.getElementById(id + 'Input');
  if (!el) return;
  el.value = v;
  var out = document.getElementById(id + 'Val');
  if (out) out.value = v;
  fn(+v);
}
function applyStep(i, userInit) {
  stepIdx = Math.max(0, Math.min(steps.length - 1, i));
  var s = steps[stepIdx];
  var cb = document.getElementById('viewModeInput');
  cb.checked = (s.state.viewMode === 'Sampled points');
  toggle_viewMode(cb.checked);
  setSlider('wallPosition', s.state.wallPosition, update_wallPosition);
  setSlider('wallHeight', s.state.wallHeight, update_wallHeight);
  setSlider('distanceAlongPath', s.state.distanceAlongPath, update_distanceAlongPath);
  document.getElementById('demoNarration').textContent = s.title + ' — ' + s.narration;
  document.getElementById('stepLabel').textContent = 'Step ' + (stepIdx + 1) + ' / ' + steps.length;
  if (userInit && s.play && !bb.flying) trigger_flight();
}
function nextStep() { applyStep(stepIdx + 1, true); }
function prevStep() { applyStep(stepIdx - 1, true); }

applyStep(0, false);
document.addEventListener('fig-resize', function () { bb.chart.resize(); });
// @FIGURE_CODE_END

    _autoUiLayout();
