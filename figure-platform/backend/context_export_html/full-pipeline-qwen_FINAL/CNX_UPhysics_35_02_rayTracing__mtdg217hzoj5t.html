<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<label><input id="mirrorTypeInput" type="checkbox" onchange="toggle_mirrorType(this.checked)"> Convex mirror (unchecked = concave)</label>
<label>Object distance: <output id="objectDistanceVal">2.5</output><input id="objectDistanceInput" type="range" min="0.3" max="3.5" step="0.1" value="2.5" oninput="document.getElementById('objectDistanceVal').value=this.value;update_objectDistance(+this.value)"></label>
<label>Highlight ray: <select id="rayHighlightInput" onchange="update_rayHighlight(+this.value)"><option value="0">All rays</option><option value="1">Ray 1 (blue)</option><option value="2">Ray 2 (red)</option><option value="3">Ray 3 (purple)</option><option value="4">Ray 4 (green)</option></select></label>
<p id="demoNarration" style="margin:0;font-size:11px;max-width:260px"></p>
<div style="display:flex;gap:4px;align-items:center"><button onclick="prevStep()">◀</button><span id="stepLabel" style="font-size:11px"></span><button onclick="nextStep()">▶</button></div>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

(function(){
var W=900,H=540;
var draw=SVG().addTo(document.getElementById('container')).size('100%','100%');
draw.viewbox(0,0,W,H);

var xDom=[-5.8,3.4], yDom=[-3.4,3.4];
var margin=38;

function sx(wx){return margin+(wx-xDom[0])*(W-2*margin)/(xDom[1]-xDom[0]);}
function sy(wy){return H-margin-(wy-yDom[0])*(H-2*margin)/(yDom[1]-yDom[0]);}

var state={mirrorType:'Concave',objectDistance:2.5,highlightRay:0};
var f=1;
var ARC_DEG=65;

var gAxis=draw.group();
var gMirror=draw.group();
var gRays=draw.group();
var gImage=draw.group();
var gLabels=draw.group();
var gEye=draw.group();

function getF(){return state.mirrorType==='Concave'?f:-f;}
function getC(){return 2*getF();}
function getDi(){
  var do_=state.objectDistance, ff=getF();
  var denom=do_-ff;
  if(Math.abs(denom)<0.01) return (denom>=0?1:-1)*999;
  return (do_*ff)/denom;
}
function getM(){
  var di=getDi(), do_=state.objectDistance;
  return -di/do_;
}

function mirrorArcPoints(){
  var cx=getC(), R=2*f, pts=[], n=60;
  if(state.mirrorType==='Concave'){
    for(var i=0;i<=n;i++){
      var th=(-ARC_DEG+2*ARC_DEG*i/n)*Math.PI/180;
      pts.push([cx+R*Math.cos(th), R*Math.sin(th)]);
    }
  } else {
    for(var i=0;i<=n;i++){
      var th=(180-ARC_DEG+2*ARC_DEG*i/n)*Math.PI/180;
      pts.push([cx+R*Math.cos(th), R*Math.sin(th)]);
    }
  }
  return pts;
}

function rayCircleHit(A,d,C,R){
  var ox=A[0]-C[0], oy=A[1]-C[1];
  var a=d[0]*d[0]+d[1]*d[1];
  if(a<1e-12) return null;
  var b=2*(ox*d[0]+oy*d[1]);
  var c=ox*ox+oy*oy-R*R;
  var disc=b*b-4*a*c;
  if(disc<0) return null;
  var sq=Math.sqrt(disc);
  var t1=(-b-sq)/(2*a), t2=(-b+sq)/(2*a);
  var t=null;
  if(t1>0.001) t=t1;
  else if(t2>0.001) t=t2;
  if(t===null) return null;
  return [A[0]+t*d[0], A[1]+t*d[1]];
}

function clipToArc(pt){
  var cx=getC(), R=2*f;
  var angle=Math.atan2(pt[1], pt[0]-cx);
  var deg=angle*180/Math.PI;
  if(state.mirrorType==='Concave'){
    if(deg>ARC_DEG) deg=ARC_DEG;
    if(deg<-ARC_DEG) deg=-ARC_DEG;
  } else {
    if(deg<0) deg+=360;
    var lo=180-ARC_DEG, hi=180+ARC_DEG;
    if(deg<lo) deg=lo;
    if(deg>hi) deg=hi;
  }
  var rad=deg*Math.PI/180;
  return [cx+R*Math.cos(rad), R*Math.sin(rad)];
}

function drawAll(){
  gAxis.clear();gMirror.clear();gRays.clear();gImage.clear();gLabels.clear();gEye.clear();
  
  var do_=state.objectDistance;
  var ff=getF();
  var cc=getC();
  var di=getDi();
  var m=getM();
  var h=1.2;
  var hi=m*h;
  var objX=-do_;
  var imgX=-di;
  var concave=state.mirrorType==='Concave';
  var isVirtual=di<0;
  var showImage=isFinite(di)&&Math.abs(di)<18;
  
  // Axis
  gAxis.line(sx(xDom[0]),sy(0),sx(xDom[1]),sy(0)).stroke({color:'#555',width:1.2});
  
  // Mirror arc with hatching on back side
  var arcPts=mirrorArcPoints();
  var arcStr=arcPts.map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' ');
  
  // Thick pale-blue backing
  gMirror.polyline(arcStr).fill('none').stroke({color:'#d8ecf4',width:16,linecap:'round'});
  // Main arc line
  gMirror.polyline(arcStr).fill('none').stroke({color:'#89b8d4',width:3.5,linecap:'round'});
  
  // Hatching on back side of mirror
  var nHatch=14;
  for(var i=1;i<nHatch;i++){
    var t=i/nHatch;
    var idx=Math.round(t*(arcPts.length-1));
    var pt=arcPts[idx];
    var cx2=getC(), R2=2*f;
    // Normal direction (pointing away from center = back side)
    var nx=pt[0]-cx2, ny=pt[1]-0;
    var nl=Math.sqrt(nx*nx+ny*ny);
    if(nl<0.01) continue;
    nx/=nl; ny/=nl;
    // Hatching: short lines going outward from back of arc at 45 degrees
    var hx=nx*0.18+ny*0.12, hy=ny*0.18-nx*0.12;
    var startX=pt[0]+nx*0.09, startY=pt[1]+ny*0.09;
    gMirror.line(sx(startX),sy(startY),sx(startX+hx),sy(startY+hy))
      .stroke({color:'#89b8d4',width:1.2,linecap:'round'});
  }
  
  // Axis points
  gAxis.circle(6).cx(sx(0)).cy(sy(0)).fill('#333');
  gLabels.text('V').attr({x:sx(0)+8,y:sy(0)+20,'font-size':15,'font-weight':'bold',fill:'#333'});
  
  var fX=concave?-f:f;
  gAxis.circle(6).cx(sx(fX)).cy(sy(0)).fill('#c00');
  gLabels.text('F').attr({x:sx(fX)-5,y:sy(0)+20,'font-size':15,'font-weight':'bold',fill:'#c00'});
  
  var cX=concave?-2*f:2*f;
  gAxis.circle(6).cx(sx(cX)).cy(sy(0)).fill('#333');
  gLabels.text('C').attr({x:sx(cX)-5,y:sy(0)+20,'font-size':15,'font-weight':'bold',fill:'#333'});
  
  // Object arrow
  gRays.line(sx(objX),sy(0),sx(objX),sy(h)).stroke({color:'#cc2222',width:4.5});
  var ahx=sx(objX),ahy=sy(h);
  gRays.polygon((ahx-8)+','+(ahy+16)+' '+ahx+','+ahy+' '+(ahx+8)+','+(ahy+16)).fill('#cc2222');
  gLabels.text('Q').attr({x:sx(objX)-20,y:sy(h)-10,'font-size':16,'font-weight':'bold',fill:'#333'});
  gLabels.text('P').attr({x:sx(objX)-5,y:sy(0)+20,'font-size':15,'font-weight':'bold',fill:'#333'});
  gLabels.text('Object').attr({x:sx(objX)-62,y:sy(h*0.5)+4,'font-size':13,fill:'#333'});
  
  // Image arrow
  if(showImage){
    var imgDash=isVirtual?'7,5':'none';
    gImage.line(sx(imgX),sy(0),sx(imgX),sy(hi)).stroke({color:'#cc2222',width:3.5,'stroke-dasharray':imgDash});
    var ihx=sx(imgX),ihy=sy(hi);
    if(hi<0){
      gImage.polygon((ihx-7)+','+(ihy-14)+' '+ihx+','+ihy+' '+(ihx+7)+','+(ihy-14)).fill('#cc2222');
    } else {
      gImage.polygon((ihx-7)+','+(ihy+14)+' '+ihx+','+ihy+' '+(ihx+7)+','+(ihy+14)).fill('#cc2222');
    }
    // Q' label - offset to avoid crowding
    var qLabelY = hi>0 ? sy(hi)-12 : sy(hi)+22;
    gLabels.text("Q'").attr({x:sx(imgX)+14,y:qLabelY,'font-size':15,'font-weight':'bold',fill:'#333'});
    // P' label - offset below axis
    gLabels.text("P'").attr({x:sx(imgX)+14,y:sy(0)+20,'font-size':15,'font-weight':'bold',fill:'#333'});
    // Image label with leader line
    var ilx=sx(imgX)+60, ily=sy(hi*0.3)+48;
    gLabels.text('Image').attr({x:ilx,y:ily,'font-size':14,fill:'#333'});
    var aex=sx(imgX)+16, aey=sy(hi*0.5);
    gLabels.path('M'+(ilx-4)+','+(ily-14)+' Q'+(ilx-24)+','+(ily-30)+' '+aex+','+aey)
      .fill('none').stroke({color:'#333',width:1.3});
    gLabels.polygon((aex-4)+','+(aey+8)+' '+aex+','+aey+' '+(aex+5)+','+(aey+6)).fill('#333');
  }
  
  // Compute rays
  var R=2*f, Cpt=[cc,0], Qpt=[objX,h];
  var rayData=[];
  
  // Ray 1: parallel to axis
  var hit1,refl1end,ext1=null;
  if(concave){
    var x1v=R*R-h*h;
    var x1=x1v>0?cc+Math.sqrt(x1v):0;
    hit1=[x1,h]; hit1=clipToArc(hit1);
    var fPt=[-f,0];
    var d1=[fPt[0]-hit1[0],fPt[1]-hit1[1]];
    var l1=Math.sqrt(d1[0]*d1[0]+d1[1]*d1[1]);
    if(l1>0.01){d1=[d1[0]/l1,d1[1]/l1];}else{d1=[0,-1];}
    var rl1=isVirtual?1.8:3.2;
    refl1end=[hit1[0]+d1[0]*rl1,hit1[1]+d1[1]*rl1];
    if(isVirtual) ext1=[hit1,[imgX,hi]];
  } else {
    var x1v2=R*R-h*h;
    var x1b=x1v2>0?cc-Math.sqrt(x1v2):0;
    hit1=[x1b,h]; hit1=clipToArc(hit1);
    var fPt1=[f,0];
    var d1b=[hit1[0]-fPt1[0],hit1[1]-fPt1[1]];
    var l1b=Math.sqrt(d1b[0]*d1b[0]+d1b[1]*d1b[1]);
    if(l1b>0.01){d1b=[d1b[0]/l1b,d1b[1]/l1b];}else{d1b=[-1,0];}
    refl1end=[hit1[0]+d1b[0]*2.8,hit1[1]+d1b[1]*2.8];
    ext1=[hit1,[imgX,hi]];
  }
  rayData.push({inc:[Qpt,hit1],refl:[hit1,refl1end],ext:ext1,labelPos:[(objX+hit1[0])/2,h+0.35]});
  
  // Ray 2: through F
  var hit2,refl2end,ext2=null;
  var fPt2=concave?[-f,0]:[f,0];
  var d2=[fPt2[0]-Qpt[0],fPt2[1]-Qpt[1]];
  hit2=rayCircleHit(Qpt,d2,Cpt,R);
  if(!hit2){
    var h2y=concave?h*f/(f-do_):h*f/(f+do_);
    hit2=[0,h2y];
  }
  hit2=clipToArc(hit2);
  if(concave){
    refl2end=[hit2[0]-3.2,hit2[1]];
    if(isVirtual){refl2end=[hit2[0]-1.8,hit2[1]];ext2=[hit2,[imgX,hi]];}
  } else {
    refl2end=[hit2[0]-2.8,hit2[1]];
    ext2=[hit2,[imgX,hi]];
  }
  rayData.push({inc:[Qpt,hit2],refl:[hit2,refl2end],ext:ext2,labelPos:[objX*0.5,h*0.65]});
  
  // Ray 3: through C
  var hit3,refl3end,ext3=null;
  var d3=[cc-Qpt[0],0-Qpt[1]];
  hit3=rayCircleHit(Qpt,d3,Cpt,R);
  if(!hit3){
    var h3y=concave?2*h*f/(2*f-do_):2*h*f/(2*f+do_);
    hit3=[0,h3y];
  }
  hit3=clipToArc(hit3);
  var d3r=[Qpt[0]-hit3[0],Qpt[1]-hit3[1]];
  var l3=Math.sqrt(d3r[0]*d3r[0]+d3r[1]*d3r[1]);
  if(l3>0.01){d3r=[d3r[0]/l3,d3r[1]/l3];}else{d3r=[-1,0];}
  var rl3=isVirtual?1.5:Math.min(3.5,do_*1.1);
  refl3end=[hit3[0]+d3r[0]*rl3,hit3[1]+d3r[1]*rl3];
  if(isVirtual) ext3=[hit3,[imgX,hi]];
  rayData.push({inc:[Qpt,hit3],refl:[hit3,refl3end],ext:ext3,labelPos:[(objX+hit3[0])*0.38,h*0.9]});
  
  // Ray 4: to V
  var hit4=[0,0];
  var d4=[-do_,-h];
  var l4=Math.sqrt(d4[0]*d4[0]+d4[1]*d4[1]);
  d4=[d4[0]/l4,d4[1]/l4];
  var rl4=isVirtual?1.8:3.0;
  var refl4end=[d4[0]*rl4,d4[1]*rl4];
  var ext4=isVirtual?[hit4,[imgX,hi]]:null;
  rayData.push({inc:[Qpt,hit4],refl:[hit4,refl4end],ext:ext4,labelPos:[objX*0.45,-h*0.45]});
  
  // Draw rays
  var rayColors=['#1a7abf','#cc2222','#7744aa','#55aa33'];
  for(var r=0;r<4;r++){
    var rd=rayData[r];
    var col=rayColors[r];
    var alpha=1,lw=2.4;
    if(state.highlightRay>0){
      if(state.highlightRay===r+1){alpha=1;lw=3.5;}
      else{alpha=0.13;lw=1.2;}
    }
    var grp=gRays.group().opacity(alpha);
    
    grp.line(sx(rd.inc[0][0]),sy(rd.inc[0][1]),sx(rd.inc[1][0]),sy(rd.inc[1][1]))
      .stroke({color:col,width:lw});
    drawArrow(grp,rd.inc[0],rd.inc[1],col,lw);
    
    if(rd.refl){
      grp.line(sx(rd.refl[0][0]),sy(rd.refl[0][1]),sx(rd.refl[1][0]),sy(rd.refl[1][1]))
        .stroke({color:col,width:lw});
      drawArrow(grp,rd.refl[0],rd.refl[1],col,lw);
    }
    if(rd.ext){
      grp.line(sx(rd.ext[0][0]),sy(rd.ext[0][1]),sx(rd.ext[1][0]),sy(rd.ext[1][1]))
        .stroke({color:col,width:lw*0.7,'stroke-dasharray':'7,5'});
    }
    
    var lp=rd.labelPos;
    var lbl=grp.text(''+(r+1)).attr({x:sx(lp[0]),y:sy(lp[1]),'font-size':16,'font-weight':'bold',fill:col});
    lbl.css('cursor','pointer');
    lbl.on('click',function(rr){return function(){
      state.highlightRay=(state.highlightRay===rr+1)?0:rr+1;
      document.getElementById('rayHighlightInput').value=state.highlightRay;
      drawAll();
    };}(r));
  }
  
  // Right-angle mark at ray 3 hit point
  var r3h=rayData[2].inc[1];
  // Compute the incident ray direction at hit point
  var incDir=[r3h[0]-Qpt[0], r3h[1]-Qpt[1]];
  var incLen=Math.sqrt(incDir[0]*incDir[0]+incDir[1]*incDir[1]);
  if(incLen>0.01){incDir=[incDir[0]/incLen, incDir[1]/incLen];}
  // Mirror normal at hit point (pointing toward center for concave, away for convex)
  var normDir=[r3h[0]-cc, r3h[1]-0];
  var normLen=Math.sqrt(normDir[0]*normDir[0]+normDir[1]*normDir[1]);
  if(normLen>0.01){normDir=[normDir[0]/normLen, normDir[1]/normLen];}
  if(concave){normDir=[-normDir[0],-normDir[1]];} // normal points toward center (inward)
  
  var sqSize=0.14;
  // Square corner points: from hit point, go along incident dir and normal dir
  var sqP1=[r3h[0]+incDir[0]*sqSize, r3h[1]+incDir[1]*sqSize];
  var sqP2=[sqP1[0]+normDir[0]*sqSize, sqP1[1]+normDir[1]*sqSize];
  var sqP3=[r3h[0]+normDir[0]*sqSize, r3h[1]+normDir[1]*sqSize];
  var sqStr2=sx(sqP1[0])+','+sy(sqP1[1])+' '+sx(sqP2[0])+','+sy(sqP2[1])+' '+sx(sqP3[0])+','+sy(sqP3[1]);
  gRays.polyline(sqStr2).fill('none').stroke({color:'#333',width:1.4});
  
  // Eye - positioned below axis between P and C region, with eyelash detail
  var eyeWorldX = concave ? (objX + cX)/2 : objX*0.5;
  var eyeWorldY = -2.1;
  drawEye(sx(eyeWorldX), sy(eyeWorldY));
}

function drawArrow(grp,from,to,col,lw){
  var dx=to[0]-from[0],dy=to[1]-from[1];
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len<0.05)return;
  var ux=dx/len,uy=dy/len;
  var mid=[from[0]+dx*0.55,from[1]+dy*0.55];
  var sz=0.09;
  var px=-uy*sz,py=ux*sz;
  var tip=[mid[0]+ux*sz*1.6,mid[1]+uy*sz*1.6];
  var b1=[mid[0]-ux*sz*0.5+px,mid[1]-uy*sz*0.5+py];
  var b2=[mid[0]-ux*sz*0.5-px,mid[1]-uy*sz*0.5-py];
  grp.polygon(sx(tip[0])+','+sy(tip[1])+' '+sx(b1[0])+','+sy(b1[1])+' '+sx(b2[0])+','+sy(b2[1])).fill(col);
}

function drawEye(ex,ey){
  var s=20;
  // Eye outline - almond shape using two arcs
  var path='M'+(ex-s)+','+ey+' Q'+(ex-s*0.5)+','+(ey-s*0.55)+' '+ex+','+(ey-s*0.35)+' Q'+(ex+s*0.5)+','+(ey-s*0.55)+' '+(ex+s)+','+ey+' Q'+(ex+s*0.5)+','+(ey+s*0.55)+' '+ex+','+(ey+s*0.35)+' Q'+(ex-s*0.5)+','+(ey+s*0.55)+' '+(ex-s)+','+ey+' Z';
  gEye.path(path).fill('#fff').stroke({color:'#333',width:1.8});
  // Pupil
  gEye.circle(s*0.38).cx(ex+s*0.1).cy(ey).fill('#333');
  // Iris highlight
  gEye.circle(s*0.12).cx(ex+s*0.2).cy(ey-s*0.08).fill('#fff');
  // Upper eyelid line
  gEye.path('M'+(ex-s*0.9)+','+(ey-s*0.15)+' Q'+ex+','+(ey-s*0.65)+' '+(ex+s*0.9)+','+(ey-s*0.15))
    .fill('none').stroke({color:'#333',width:2});
  // Eyelashes - radiating from upper lid
  var lashAngles=[-70,-55,-40,-25,-10,5,20];
  for(var i=0;i<lashAngles.length;i++){
    var ang=lashAngles[i]*Math.PI/180;
    var baseX=ex+Math.cos(ang)*s*0.75;
    var baseY=ey-s*0.4+Math.sin(ang)*s*0.15;
    var tipX=baseX+Math.cos(ang-Math.PI/2)*s*0.35;
    var tipY=baseY+Math.sin(ang-Math.PI/2)*s*0.35;
    gEye.line(baseX,baseY,tipX,tipY).stroke({color:'#333',width:1.2,linecap:'round'});
  }
  // Lower lash (single)
  gEye.line(ex-s*0.3,ey+s*0.4,ex-s*0.4,ey+s*0.6).stroke({color:'#333',width:1.2,linecap:'round'});
}

window.toggle_mirrorType=function(on){state.mirrorType=on?'Convex':'Concave';drawAll();};
window.update_objectDistance=function(v){state.objectDistance=v;drawAll();};
window.update_rayHighlight=function(v){state.highlightRay=v;drawAll();};

var steps=[
  {narration:'With the object far from a concave mirror, all four color-coded rays leave the tip Q and truly cross at Q\u2032 in front of the mirror, forming a real, inverted, reduced image between C and F.',state:{mirrorType:'Concave',objectDistance:2.5,highlightRay:0}},
  {narration:'Ray 1 (blue) travels parallel to the axis and reflects straight through F. Click each numbered ray to isolate its single construction rule.',state:{mirrorType:'Concave',objectDistance:2.5,highlightRay:1}},
  {narration:'With the object between F and the mirror, the reflected rays diverge; only their dashed backward extensions meet behind the mirror, producing a virtual, upright, magnified image.',state:{mirrorType:'Concave',objectDistance:0.6,highlightRay:0}},
  {narration:'Convex mirror: F and C move behind the arc, reflected rays always diverge, and their dashed extensions meet at an upright, reduced virtual image behind the mirror.',state:{mirrorType:'Convex',objectDistance:2.5,highlightRay:0}}
];
var curStep=0;

function applyStep(i){
  curStep=i;
  var s=steps[i];
  state.mirrorType=s.state.mirrorType;
  state.objectDistance=s.state.objectDistance;
  state.highlightRay=s.state.highlightRay||0;
  document.getElementById('mirrorTypeInput').checked=(state.mirrorType==='Convex');
  document.getElementById('objectDistanceInput').value=state.objectDistance;
  document.getElementById('objectDistanceVal').value=state.objectDistance;
  document.getElementById('rayHighlightInput').value=state.highlightRay;
  document.getElementById('demoNarration').textContent=s.narration;
  document.getElementById('stepLabel').textContent=(i+1)+'/'+steps.length;
  drawAll();
}
window.prevStep=function(){if(curStep>0)applyStep(curStep-1);};
window.nextStep=function(){if(curStep<steps.length-1)applyStep(curStep+1);};

applyStep(0);
window.__markRendered();
})();
