<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tangent Line as the Limit of Secants</title>
  <style>
    :root {
      --ink: #20232a;
      --muted: #626875;
      --paper: #ffffff;
      --panel: #f8fafc;
      --line: #b65aab;
      --line-strong: #9c3f92;
      --curve: #28a5dc;
      --arrow: #bfc3c9;
      --axis: #20232a;
      --accent: #115e87;
      --shadow: 0 18px 55px rgba(31, 41, 55, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #eef3f7 0%, #f8fafc 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 24px));
      margin: 16px auto;
    }

    .figure-shell {
      background: var(--paper);
      border: 1px solid #dde4ec;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #dde4ec;
      background: #fbfcfe;
    }

    .tabs {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #eef3f7;
    }

    button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      color: #2f3744;
      background: transparent;
      font: 700 14px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.2);
    }

    .reset {
      margin-left: auto;
      border: 1px solid #cfd8e3;
      background: #ffffff;
    }

    .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-height: 36px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .readout span {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border: 1px solid #d9e1ea;
      border-radius: 6px;
      background: #ffffff;
    }

    .canvas-wrap {
      position: relative;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      user-select: none;
    }

    .panel-frame {
      fill: #ffffff;
      stroke: #e8edf3;
      stroke-width: 1;
    }

    .panel {
      transition: opacity 180ms ease;
    }

    .panel.inactive {
      opacity: 0.36;
    }

    .panel-title {
      fill: #2b2d33;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-style: italic;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      fill: none;
    }

    .axis-label {
      fill: var(--axis);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-style: italic;
    }

    .curve {
      fill: none;
      stroke: var(--curve);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .secant {
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0.82;
    }

    .secant.current {
      stroke: var(--line-strong);
      stroke-width: 3.5;
      opacity: 1;
    }

    .tangent {
      stroke: var(--line-strong);
      stroke-width: 3.7;
      stroke-linecap: round;
    }

    .fan-wedge {
      fill: #c66bbd;
      opacity: 0.22;
    }

    .rot-arrow {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 3;
      opacity: 0.95;
    }

    .point {
      fill: var(--curve);
      stroke: #ffffff;
      stroke-width: 2.6;
      cursor: grab;
    }

    .point:active {
      cursor: grabbing;
    }

    .hit-point {
      fill: transparent;
      cursor: grab;
      pointer-events: all;
    }

    .math-label {
      fill: #191c20;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-style: italic;
    }

    .line-label {
      fill: #25282d;
      font-size: 25px;
      font-weight: 520;
      text-anchor: middle;
    }

    .small-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .mini-readout {
      fill: #ffffff;
      stroke: #cfd8e3;
      stroke-width: 1;
      filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.12));
    }

    .mini-text {
      fill: #27313d;
      font-size: 14px;
      font-weight: 740;
    }

    @media (max-width: 760px) {
      main {
        width: min(100vw - 12px, 620px);
        margin: 6px auto;
      }

      .toolbar {
        padding: 10px;
      }

      .tabs {
        width: 100%;
      }

      button {
        padding: 0 10px;
        font-size: 13px;
      }

      .reset {
        margin-left: 0;
      }

      .readout {
        width: 100%;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" aria-label="Interactive tangent line as the limiting position of secant lines">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="Panel selector">
          <button id="tab-a" type="button" aria-pressed="true">Panel (a)</button>
          <button id="tab-b" type="button" aria-pressed="false">Panel (b)</button>
        </div>
        <div class="readout" aria-live="polite">
          <span id="active-label">Smooth curve</span>
          <span id="secant-readout">secant slope: 0.00</span>
          <span id="tangent-readout">tangent slope: 0.00</span>
        </div>
        <button id="reset" class="reset" type="button">Reset</button>
      </div>
      <div class="canvas-wrap">
        <svg id="figure" viewBox="0 0 1180 620" role="img" aria-label="Two panels showing secant lines rotating toward the tangent line as Q approaches P">
          <defs>
            <marker id="axisArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#20232a"></path>
            </marker>
            <marker id="greyArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
              <path d="M 1 1 L 11 6 L 1 11 L 4 6 z" fill="#bfc3c9"></path>
            </marker>
          </defs>

          <g id="panel-a" class="panel" data-panel="a">
            <rect class="panel-frame" x="18" y="18" width="548" height="548" rx="6"></rect>
            <path id="a-x-axis" class="axis" marker-end="url(#axisArrow)"></path>
            <path id="a-y-axis" class="axis" marker-end="url(#axisArrow)"></path>
            <text id="a-x-label" class="axis-label">x</text>
            <text id="a-y-label" class="axis-label">y</text>
            <g id="a-wedge-layer"></g>
            <g id="a-arrow-layer"></g>
            <g id="a-secant-layer"></g>
            <path id="a-tangent" class="tangent"></path>
            <path id="a-curve" class="curve"></path>
            <text id="a-tangent-label" class="line-label">Tangent<tspan x="0" dy="28">line</tspan></text>
            <text id="a-secant-label" class="line-label">Secant<tspan x="0" dy="28">line</tspan></text>
            <circle id="a-p" class="point" r="8"></circle>
            <circle id="a-q" class="point" r="8"></circle>
            <circle id="a-p-hit" class="hit-point" r="24" data-panel="a" data-point="p"></circle>
            <circle id="a-q-hit" class="hit-point" r="24" data-panel="a" data-point="q"></circle>
            <text id="a-p-label" class="math-label">P</text>
            <text id="a-q-label" class="math-label">Q</text>
            <rect id="a-mini-box" class="mini-readout" x="328" y="501" width="194" height="34" rx="6"></rect>
            <text id="a-mini-text" class="mini-text" x="344" y="523">m<tspan baseline-shift="sub" font-size="11">PQ</tspan> = 0.00</text>
            <text class="panel-title" x="278" y="603">(a)</text>
          </g>

          <g id="panel-b" class="panel inactive" data-panel="b">
            <rect class="panel-frame" x="614" y="18" width="548" height="548" rx="6"></rect>
            <g id="b-wedge-layer"></g>
            <g id="b-arrow-layer"></g>
            <g id="b-secant-layer"></g>
            <path id="b-tangent" class="tangent"></path>
            <circle id="b-circle" class="curve" fill="none"></circle>
            <text id="b-tangent-label" class="line-label">Tangent<tspan x="0" dy="28">line</tspan></text>
            <text id="b-secant-label" class="line-label">Secant<tspan x="0" dy="28">line</tspan></text>
            <circle id="b-p" class="point" r="8"></circle>
            <circle id="b-q" class="point" r="8"></circle>
            <circle id="b-p-hit" class="hit-point" r="24" data-panel="b" data-point="p"></circle>
            <circle id="b-q-hit" class="hit-point" r="24" data-panel="b" data-point="q"></circle>
            <text id="b-p-label" class="math-label">P</text>
            <text id="b-q-label" class="math-label">Q</text>
            <rect id="b-mini-box" class="mini-readout" x="920" y="501" width="194" height="34" rx="6"></rect>
            <text id="b-mini-text" class="mini-text" x="936" y="523">m<tspan baseline-shift="sub" font-size="11">PQ</tspan> = 0.00</text>
            <text class="panel-title" x="876" y="603">(b)</text>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("figure");
      const ns = "http://www.w3.org/2000/svg";
      const mobileQuery = window.matchMedia("(max-width: 760px)");

      const panels = {
        a: {
          name: "Smooth curve",
          x0: 42,
          y0: 52,
          w: 494,
          h: 494,
          xmin: -0.45,
          xmax: 4.95,
          ymin: -0.55,
          ymax: 4.85,
          pX: 0.58,
          qX: 3.55,
          minGap: 0.16
        },
        b: {
          name: "Circle",
          x0: 641,
          y0: 52,
          w: 494,
          h: 494,
          xmin: -2.7,
          xmax: 2.7,
          ymin: -2.7,
          ymax: 2.7,
          r: 1.55,
          pDeg: 157,
          qGap: 126,
          minGap: 5,
          maxGap: 154
        }
      };

      const defaults = JSON.parse(JSON.stringify(panels));
      let activePanel = "a";
      let drag = null;

      const ids = [
        "active-label", "secant-readout", "tangent-readout", "tab-a", "tab-b", "reset",
        "a-curve", "a-tangent", "a-x-axis", "a-y-axis", "a-x-label", "a-y-label",
        "a-p", "a-q", "a-p-hit", "a-q-hit", "a-p-label", "a-q-label", "a-tangent-label",
        "a-secant-label", "a-mini-text", "a-wedge-layer", "a-arrow-layer", "a-secant-layer",
        "b-circle", "b-tangent", "b-p", "b-q", "b-p-hit", "b-q-hit", "b-p-label",
        "b-q-label", "b-tangent-label", "b-secant-label", "b-mini-text", "b-wedge-layer",
        "b-arrow-layer", "b-secant-layer", "panel-a", "panel-b"
      ];
      const el = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));

      function fA(x) {
        return 0.8 + 2.1 * x - 0.37 * x * x;
      }

      function dA(x) {
        return 2.1 - 0.74 * x;
      }

      function sx(panel, x) {
        return panel.x0 + ((x - panel.xmin) / (panel.xmax - panel.xmin)) * panel.w;
      }

      function sy(panel, y) {
        return panel.y0 + panel.h - ((y - panel.ymin) / (panel.ymax - panel.ymin)) * panel.h;
      }

      function wx(panel, x) {
        return panel.xmin + ((x - panel.x0) / panel.w) * (panel.xmax - panel.xmin);
      }

      function wy(panel, y) {
        return panel.ymin + ((panel.y0 + panel.h - y) / panel.h) * (panel.ymax - panel.ymin);
      }

      function pointA(x) {
        const p = panels.a;
        return { x, y: fA(x), sx: sx(p, x), sy: sy(p, fA(x)) };
      }

      function circlePoint(deg) {
        const p = panels.b;
        const rad = deg * Math.PI / 180;
        const x = p.r * Math.cos(rad);
        const y = p.r * Math.sin(rad);
        return { deg, x, y, sx: sx(p, x), sy: sy(p, y) };
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function fmtSlope(value) {
        if (!Number.isFinite(value) || Math.abs(value) > 99) return "vertical";
        return value.toFixed(2).replace("-0.00", "0.00");
      }

      function pathFromPoints(points) {
        return points.map((pt, i) => `${i ? "L" : "M"} ${pt.sx.toFixed(2)} ${pt.sy.toFixed(2)}`).join(" ");
      }

      function setLinePath(pathEl, line) {
        pathEl.setAttribute("d", `M ${line.x1.toFixed(2)} ${line.y1.toFixed(2)} L ${line.x2.toFixed(2)} ${line.y2.toFixed(2)}`);
      }

      function extendedLineFromVector(pt, vx, vy, length) {
        const mag = Math.hypot(vx, vy) || 1;
        const ux = vx / mag;
        const uy = vy / mag;
        return {
          x1: pt.sx - ux * length,
          y1: pt.sy - uy * length,
          x2: pt.sx + ux * length,
          y2: pt.sy + uy * length,
          ux,
          uy
        };
      }

      function extendedLineThrough(p1, p2, length) {
        return extendedLineFromVector(p1, p2.sx - p1.sx, p2.sy - p1.sy, length);
      }

      function makeSvg(tag, attrs = {}) {
        const node = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, value);
        }
        return node;
      }

      function replaceLayer(layer, nodes) {
        layer.replaceChildren(...nodes);
      }

      function wedgePath(point, lineA, lineB, radius) {
        const a = { x: point.sx + lineA.ux * radius, y: point.sy + lineA.uy * radius };
        const b = { x: point.sx + lineB.ux * radius, y: point.sy + lineB.uy * radius };
        return `M ${point.sx.toFixed(2)} ${point.sy.toFixed(2)} L ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)} Z`;
      }

      function arcPath(center, startLine, endLine, radius) {
        const start = { x: center.sx + startLine.ux * radius, y: center.sy + startLine.uy * radius };
        const end = { x: center.sx + endLine.ux * radius, y: center.sy + endLine.uy * radius };
        const cross = startLine.ux * endLine.uy - startLine.uy * endLine.ux;
        const sweep = cross > 0 ? 1 : 0;
        return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${radius} ${radius} 0 0 ${sweep} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
      }

      function angleFromSlope(m) {
        return { vx: 1, vy: -m };
      }

      function slopeBetween(a, b) {
        const dx = b.x - a.x;
        if (Math.abs(dx) < 1e-8) return Infinity;
        return (b.y - a.y) / dx;
      }

      function normalizeDegrees(deg) {
        let out = deg % 360;
        if (out < 0) out += 360;
        return out;
      }

      function shortestReadableDeg(deg) {
        const n = normalizeDegrees(deg);
        return n > 180 ? n - 360 : n;
      }

      function setPoint(prefix, point) {
        el[`${prefix}-p`]?.setAttribute("cx", point.sx);
      }

      function drawAxes() {
        const p = panels.a;
        setLinePath(el["a-x-axis"], {
          x1: sx(p, p.xmin + 0.12),
          y1: sy(p, 0),
          x2: sx(p, p.xmax - 0.08),
          y2: sy(p, 0)
        });
        setLinePath(el["a-y-axis"], {
          x1: sx(p, 0),
          y1: sy(p, p.ymin + 0.1),
          x2: sx(p, 0),
          y2: sy(p, p.ymax - 0.08)
        });
        el["a-x-label"].setAttribute("x", sx(p, p.xmax - 0.25));
        el["a-x-label"].setAttribute("y", sy(p, 0) - 13);
        el["a-y-label"].setAttribute("x", sx(p, 0) + 14);
        el["a-y-label"].setAttribute("y", sy(p, p.ymax - 0.28));
      }

      function drawCurveA() {
        const pts = [];
        for (let i = 0; i <= 140; i += 1) {
          const x = -0.05 + (4.55 / 140) * i;
          pts.push(pointA(x));
        }
        el["a-curve"].setAttribute("d", pathFromPoints(pts));
      }

      function labelAt(textEl, x, y, anchor = "middle") {
        textEl.setAttribute("x", x.toFixed(2));
        textEl.setAttribute("y", y.toFixed(2));
        textEl.setAttribute("text-anchor", anchor);
        const firstTspan = textEl.querySelector("tspan");
        if (firstTspan) firstTspan.setAttribute("x", x.toFixed(2));
      }

      function renderPanelA() {
        const panel = panels.a;
        panel.pX = clamp(panel.pX, -0.05, 4.44);
        panel.qX = clamp(panel.qX, panel.pX + panel.minGap, 4.55);

        const P = pointA(panel.pX);
        const Q = pointA(panel.qX);
        const tangentSlope = dA(panel.pX);
        const secantSlope = slopeBetween(P, Q);
        const tangentVector = angleFromSlope(tangentSlope);
        const tangentLine = extendedLineFromVector(P, tangentVector.vx, tangentVector.vy, 185);
        const currentSecant = extendedLineThrough(P, Q, 395);

        setLinePath(el["a-tangent"], tangentLine);

        const gaps = [1, 0.72, 0.46, 0.24].map((factor) => panel.pX + (panel.qX - panel.pX) * factor);
        const secants = gaps.map((x, index) => {
          const S = pointA(x);
          const line = extendedLineThrough(P, S, 395);
          const path = makeSvg("path", {
            class: `secant${index === 0 ? " current" : ""}`,
            d: `M ${line.x1.toFixed(2)} ${line.y1.toFixed(2)} L ${line.x2.toFixed(2)} ${line.y2.toFixed(2)}`
          });
          return path;
        });
        replaceLayer(el["a-secant-layer"], secants);

        replaceLayer(el["a-wedge-layer"], [
          makeSvg("path", { class: "fan-wedge", d: wedgePath(P, tangentLine, currentSecant, 150) })
        ]);
        replaceLayer(el["a-arrow-layer"], [
          makeSvg("path", { class: "rot-arrow", "marker-end": "url(#greyArrow)", d: arcPath(P, currentSecant, tangentLine, 132) }),
          makeSvg("path", { class: "rot-arrow", "marker-end": "url(#greyArrow)", d: arcPath(P, currentSecant, tangentLine, 180) })
        ]);

        for (const [suffix, point] of [["p", P], ["q", Q]]) {
          el[`a-${suffix}`].setAttribute("cx", point.sx);
          el[`a-${suffix}`].setAttribute("cy", point.sy);
          el[`a-${suffix}-hit`].setAttribute("cx", point.sx);
          el[`a-${suffix}-hit`].setAttribute("cy", point.sy);
        }
        labelAt(el["a-p-label"], P.sx - 22, P.sy - 10, "middle");
        labelAt(el["a-q-label"], Q.sx - 10, Q.sy + 34, "middle");

        const tangentLabelX = clamp(P.sx + tangentLine.ux * 110 - 40, 88, 468);
        const tangentLabelY = clamp(P.sy + tangentLine.uy * 110 - 22, 128, 250);
        labelAt(el["a-tangent-label"], tangentLabelX, tangentLabelY, "middle");
        labelAt(el["a-secant-label"], 522, clamp(P.sy + 18, 270, 405), "middle");

        el["a-mini-text"].textContent = `mPQ = ${fmtSlope(secantSlope)}  |  mtan = ${fmtSlope(tangentSlope)}`;

        if (activePanel === "a") {
          el["active-label"].textContent = "Smooth curve";
          el["secant-readout"].textContent = `secant slope: ${fmtSlope(secantSlope)}`;
          el["tangent-readout"].textContent = `tangent slope: ${fmtSlope(tangentSlope)}`;
        }
      }

      function renderPanelB() {
        const panel = panels.b;
        panel.pDeg = clamp(shortestReadableDeg(panel.pDeg), 85, 235);
        panel.qGap = clamp(panel.qGap, panel.minGap, panel.maxGap);
        const qDeg = panel.pDeg - panel.qGap;
        const P = circlePoint(panel.pDeg);
        const Q = circlePoint(qDeg);
        const rad = panel.pDeg * Math.PI / 180;
        const tangentSlope = -Math.cos(rad) / Math.sin(rad);
        const secantSlope = slopeBetween(P, Q);
        const currentSecant = extendedLineThrough(P, Q, 410);
        const secantDirection = { vx: Q.sx - P.sx, vy: Q.sy - P.sy };
        const tangentVector = { vx: -Math.sin(rad), vy: -Math.cos(rad) };
        if (tangentVector.vx * secantDirection.vx + tangentVector.vy * secantDirection.vy < 0) {
          tangentVector.vx *= -1;
          tangentVector.vy *= -1;
        }
        const tangentLine = extendedLineFromVector(P, tangentVector.vx, tangentVector.vy, 250);

        el["b-circle"].setAttribute("cx", sx(panel, 0));
        el["b-circle"].setAttribute("cy", sy(panel, 0));
        el["b-circle"].setAttribute("r", panel.r * panel.w / (panel.xmax - panel.xmin));
        setLinePath(el["b-tangent"], tangentLine);

        const gaps = [1, 0.72, 0.46, 0.23].map((factor) => panel.qGap * factor);
        const secants = gaps.map((gap, index) => {
          const S = circlePoint(panel.pDeg - gap);
          const line = extendedLineThrough(P, S, 410);
          return makeSvg("path", {
            class: `secant${index === 0 ? " current" : ""}`,
            d: `M ${line.x1.toFixed(2)} ${line.y1.toFixed(2)} L ${line.x2.toFixed(2)} ${line.y2.toFixed(2)}`
          });
        });
        replaceLayer(el["b-secant-layer"], secants);

        replaceLayer(el["b-wedge-layer"], [
          makeSvg("path", { class: "fan-wedge", d: wedgePath(P, tangentLine, currentSecant, 170) })
        ]);
        replaceLayer(el["b-arrow-layer"], [
          makeSvg("path", { class: "rot-arrow", "marker-end": "url(#greyArrow)", d: arcPath(P, currentSecant, tangentLine, 142) }),
          makeSvg("path", { class: "rot-arrow", "marker-end": "url(#greyArrow)", d: arcPath(P, currentSecant, tangentLine, 196) })
        ]);

        for (const [suffix, point] of [["p", P], ["q", Q]]) {
          el[`b-${suffix}`].setAttribute("cx", point.sx);
          el[`b-${suffix}`].setAttribute("cy", point.sy);
          el[`b-${suffix}-hit`].setAttribute("cx", point.sx);
          el[`b-${suffix}-hit`].setAttribute("cy", point.sy);
        }

        labelAt(el["b-p-label"], P.sx - 18, P.sy - 14, "middle");
        labelAt(el["b-q-label"], Q.sx - 10, Q.sy + 34, "middle");
        labelAt(el["b-tangent-label"], clamp(P.sx + tangentLine.ux * 136 - 62, 735, 1000), clamp(P.sy + tangentLine.uy * 136 - 10, 96, 404), "middle");
        labelAt(el["b-secant-label"], 1118, clamp(Q.sy - 16, 248, 338), "middle");

        el["b-mini-text"].textContent = `mPQ = ${fmtSlope(secantSlope)}  |  mtan = ${fmtSlope(tangentSlope)}`;

        if (activePanel === "b") {
          el["active-label"].textContent = "Circle";
          el["secant-readout"].textContent = `secant slope: ${fmtSlope(secantSlope)}`;
          el["tangent-readout"].textContent = `tangent slope: ${fmtSlope(tangentSlope)}`;
        }
      }

      function render() {
        drawAxes();
        drawCurveA();
        renderPanelA();
        renderPanelB();
        updateActiveState();
        updateResponsiveViewBox();
      }

      function updateActiveState() {
        el["tab-a"].setAttribute("aria-pressed", activePanel === "a" ? "true" : "false");
        el["tab-b"].setAttribute("aria-pressed", activePanel === "b" ? "true" : "false");
        el["panel-a"].classList.toggle("inactive", activePanel !== "a" && !mobileQuery.matches);
        el["panel-b"].classList.toggle("inactive", activePanel !== "b" && !mobileQuery.matches);
      }

      function updateResponsiveViewBox() {
        if (mobileQuery.matches) {
          svg.setAttribute("viewBox", activePanel === "a" ? "0 0 590 620" : "590 0 590 620");
          el["panel-a"].style.display = activePanel === "a" ? "" : "none";
          el["panel-b"].style.display = activePanel === "b" ? "" : "none";
        } else {
          svg.setAttribute("viewBox", "0 0 1180 620");
          el["panel-a"].style.display = "";
          el["panel-b"].style.display = "";
        }
      }

      function setActive(panelId) {
        activePanel = panelId;
        render();
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function startDrag(evt) {
        const targetPanel = evt.currentTarget.dataset.panel;
        const point = evt.currentTarget.dataset.point;
        setActive(targetPanel);
        drag = { panel: targetPanel, point };
        evt.currentTarget.setPointerCapture(evt.pointerId);
        evt.preventDefault();
      }

      function dragMove(evt) {
        if (!drag) return;
        const pt = svgPoint(evt);

        if (drag.panel === "a") {
          const panel = panels.a;
          const x = wx(panel, pt.x);
          if (drag.point === "p") {
            const gap = panel.qX - panel.pX;
            panel.pX = clamp(x, -0.05, 4.39);
            panel.qX = clamp(panel.pX + gap, panel.pX + panel.minGap, 4.55);
          } else {
            panel.qX = clamp(x, panel.pX + panel.minGap, 4.55);
          }
        } else {
          const panel = panels.b;
          const x = wx(panel, pt.x);
          const y = wy(panel, pt.y);
          let deg = Math.atan2(y, x) * 180 / Math.PI;
          deg = shortestReadableDeg(deg);
          if (drag.point === "p") {
            panel.pDeg = clamp(deg, 85, 235);
          } else {
            const rawGap = normalizeDegrees(panel.pDeg - deg);
            panel.qGap = clamp(rawGap, panel.minGap, panel.maxGap);
          }
        }

        render();
        evt.preventDefault();
      }

      function endDrag() {
        drag = null;
      }

      for (const id of ["a-p-hit", "a-q-hit", "b-p-hit", "b-q-hit"]) {
        el[id].addEventListener("pointerdown", startDrag);
      }

      svg.addEventListener("pointermove", dragMove);
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);

      el["tab-a"].addEventListener("click", () => setActive("a"));
      el["tab-b"].addEventListener("click", () => setActive("b"));
      el["reset"].addEventListener("click", () => {
        for (const key of ["a", "b"]) {
          Object.assign(panels[key], JSON.parse(JSON.stringify(defaults[key])));
        }
        render();
      });
      mobileQuery.addEventListener("change", updateResponsiveViewBox);

      render();
    })();
  </script>
</body>
</html>
