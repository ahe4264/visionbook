<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homography Plane Geometry</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14171a;
      --muted: #56606b;
      --line: #d7dde4;
      --paper: #ffffff;
      --panel: #f6f8fa;
      --surface: #d2d2d2;
      --cyan: #05dfe6;
      --red: #f10d12;
      --green: #20d40d;
      --black: #0d1115;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #eef2f5;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    main {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .stage {
      position: relative;
      width: min(100%, 1180px);
      aspect-ratio: 16 / 10;
      min-height: 430px;
      overflow: hidden;
      border: 1px solid #cbd3dc;
      background: #fff;
      box-shadow: 0 20px 46px rgba(26, 35, 45, 0.16);
    }

    canvas,
    svg {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
    }

    #flatSvg {
      display: none;
      background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
    }

    body.flat-mode #threeCanvas,
    body.flat-mode .label-layer {
      display: none;
    }

    body.flat-mode #flatSvg {
      display: block;
    }

    .label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .label {
      position: absolute;
      max-width: 190px;
      padding: 2px 5px;
      color: #050607;
      font-weight: 760;
      line-height: 1.05;
      letter-spacing: 0;
      text-shadow:
        -2px -2px 0 #fff,
        2px -2px 0 #fff,
        -2px 2px 0 #fff,
        2px 2px 0 #fff,
        0 0 6px #fff;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .label.large {
      font-size: clamp(22px, 3.7vw, 44px);
    }

    .label.medium {
      font-size: clamp(15px, 2vw, 26px);
    }

    .label.small {
      font-size: clamp(13px, 1.7vw, 22px);
    }

    .label.cyan {
      color: var(--cyan);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 800;
    }

    .label.axis {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 800;
    }

    aside {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border-left: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .panel {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .panel-title {
      margin: 0 0 10px;
      color: #303943;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
      border: 1px solid #c4cbd4;
      border-radius: 7px;
    }

    button {
      min-height: 38px;
      border: 0;
      border-right: 1px solid #c4cbd4;
      background: #fff;
      color: #24303c;
      font: inherit;
      font-size: 13px;
      font-weight: 740;
      cursor: pointer;
    }

    button:last-child {
      border-right: 0;
    }

    button[aria-pressed="true"] {
      background: #162231;
      color: #fff;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(5, 155, 190, 0.28);
      outline-offset: 2px;
    }

    .control {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 9px;
      margin: 9px 0;
    }

    .control label {
      color: #28313a;
      font-size: 13px;
      font-weight: 720;
    }

    .control output {
      color: var(--muted);
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 760;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #162231;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      position: relative;
      padding: 0 11px;
    }

    .matrix::before,
    .matrix::after {
      content: "";
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 9px;
      border: 2px solid #323943;
    }

    .matrix::before {
      left: 0;
      border-right: 0;
    }

    .matrix::after {
      right: 0;
      border-left: 0;
    }

    .matrix span {
      display: block;
      min-width: 0;
      padding: 4px 2px;
      border-radius: 4px;
      background: #f4f7fa;
      color: #111820;
      text-align: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      overflow: hidden;
      white-space: nowrap;
    }

    .readout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid #edf0f3;
      font-size: 13px;
    }

    .readout:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .readout span {
      color: var(--muted);
    }

    .readout output {
      font-variant-numeric: tabular-nums;
      font-weight: 780;
    }

    .flat-panel,
    .flat-plane {
      fill: #fff;
      stroke: #c8d1db;
      stroke-width: 2;
    }

    .flat-grid {
      stroke: #d7dee7;
      stroke-width: 1.3;
    }

    .flat-grid.major {
      stroke: #aeb8c4;
      stroke-width: 2;
    }

    .flat-surface {
      fill: rgba(210, 210, 210, 0.62);
      stroke: #101418;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .flat-ray {
      stroke: var(--cyan);
      stroke-width: 4;
      stroke-dasharray: 14 12;
      stroke-linecap: round;
      fill: none;
    }

    .flat-map-line {
      stroke: rgba(5, 223, 230, 0.45);
      stroke-width: 2.2;
      stroke-dasharray: 7 8;
    }

    .flat-point {
      fill: var(--cyan);
      stroke: #07090b;
      stroke-width: 4;
    }

    .flat-axis-x,
    .flat-axis-y,
    .flat-axis-z {
      stroke-width: 4;
      stroke-linecap: round;
    }

    .flat-axis-x,
    .flat-axis-y {
      stroke: var(--red);
    }

    .flat-axis-z {
      stroke: var(--green);
    }

    .flat-label {
      fill: #090b0d;
      stroke: #fff;
      stroke-width: 6;
      paint-order: stroke fill;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 760;
      font-size: 25px;
    }

    .flat-label.cyan {
      fill: var(--cyan);
      font-style: italic;
      font-size: 32px;
    }

    .flat-label.title {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 17px;
      font-weight: 820;
      stroke-width: 4;
    }

    .flat-label.h {
      font-size: 42px;
      font-style: italic;
    }

    @media (max-width: 920px) {
      body {
        grid-template-columns: 1fr;
      }

      main {
        min-height: auto;
        padding: 10px;
      }

      .stage {
        width: calc(100vw - 20px);
        min-height: 360px;
        aspect-ratio: 1.16 / 1;
      }

      aside {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .control {
        grid-template-columns: 80px minmax(0, 1fr) 52px;
      }

      .matrix span {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="Interactive homography geometry figure">
      <canvas id="threeCanvas"></canvas>
      <svg id="flatSvg" viewBox="0 0 1180 740" role="img" aria-labelledby="flatTitle flatDesc">
        <title id="flatTitle">Collapsed plane-to-image homography</title>
        <desc id="flatDesc">A planar Z equals zero source grid mapped to a foreshortened image-plane grid by a three-by-three homography.</desc>
        <defs>
          <marker id="flatArrowRed" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#f10d12"></path>
          </marker>
          <marker id="flatArrowGreen" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#20d40d"></path>
          </marker>
          <marker id="flatArrowDark" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#12161b"></path>
          </marker>
        </defs>
        <rect class="flat-panel" x="34" y="64" width="455" height="575" rx="8"></rect>
        <rect class="flat-panel" x="690" y="64" width="455" height="575" rx="8"></rect>
        <g id="flatSourceGrid"></g>
        <g id="flatImageGrid"></g>
        <g id="flatLinks"></g>
        <path id="flatHArrow" d="M518,352 C572,320 620,320 666,352" fill="none" stroke="#12161b" stroke-width="4" marker-end="url(#flatArrowDark)"></path>
        <text class="flat-label h" x="579" y="306">H</text>
        <text class="flat-label title" x="54" y="42">world plane: Z = 0</text>
        <text class="flat-label title" x="710" y="42">camera image plane</text>
        <text class="flat-label" x="230" y="675">direct 2D coordinates (X,Y)</text>
        <text class="flat-label" x="822" y="675">image coordinates (x,y)</text>
      </svg>
      <div class="label-layer" id="labelLayer" aria-hidden="true">
        <div class="label large" data-label="camera">Camera<br>center</div>
        <div class="label large" data-label="imagePlane">Camera plane</div>
        <div class="label large" data-label="surface">planar surface</div>
        <div class="label cyan medium" data-label="worldPoint">(X,Y,0)</div>
        <div class="label cyan medium" data-label="imagePoint">(x,y)</div>
        <div class="label small" data-label="origin">O</div>
        <div class="label axis medium" data-label="axisX">X</div>
        <div class="label axis medium" data-label="axisY">Y</div>
        <div class="label axis medium" data-label="axisZ">Z</div>
        <div class="label axis medium" data-label="imgX">x</div>
        <div class="label axis medium" data-label="imgY">y</div>
      </div>
    </section>
  </main>

  <aside>
    <section>
      <h1>Planar Projection Homography</h1>
    </section>

    <section class="panel" aria-label="View mode">
      <p class="panel-title">View</p>
      <div class="segmented">
        <button id="mode3d" type="button" aria-pressed="true">3D Projection</button>
        <button id="modeFlat" type="button" aria-pressed="false">Homography</button>
      </div>
    </section>

    <section class="panel" aria-label="Camera controls">
      <p class="panel-title">Camera Center</p>
      <div class="control">
        <label for="camX">C<sub>x</sub></label>
        <input id="camX" type="range" min="-6.4" max="-2.1" step="0.05" value="-4.8">
        <output id="camXValue" for="camX">-4.80</output>
      </div>
      <div class="control">
        <label for="camY">C<sub>y</sub></label>
        <input id="camY" type="range" min="-3.9" max="1.8" step="0.05" value="-2.5">
        <output id="camYValue" for="camY">-2.50</output>
      </div>
      <div class="control">
        <label for="camZ">C<sub>z</sub></label>
        <input id="camZ" type="range" min="1.2" max="4.8" step="0.05" value="2.6">
        <output id="camZValue" for="camZ">2.60</output>
      </div>
    </section>

    <section class="panel" aria-label="Plane controls">
      <p class="panel-title">World Plane</p>
      <div class="control">
        <label for="planeTilt">Tilt</label>
        <input id="planeTilt" type="range" min="-38" max="38" step="1" value="-12">
        <output id="planeTiltValue" for="planeTilt">-12 deg</output>
      </div>
      <div class="control">
        <label for="planeRotate">Rotate</label>
        <input id="planeRotate" type="range" min="-42" max="42" step="1" value="12">
        <output id="planeRotateValue" for="planeRotate">12 deg</output>
      </div>
    </section>

    <section class="panel" aria-label="Homography matrix">
      <p class="panel-title">H: (X,Y,1) to (x,y,1)</p>
      <div class="matrix" id="matrixH"></div>
    </section>

    <section class="panel" aria-label="Point coordinates">
      <p class="panel-title">Point Mapping</p>
      <div class="readout"><span>plane point</span><output id="worldCoord">(0.80, 0.55, 0)</output></div>
      <div class="readout"><span>image point</span><output id="imageCoord">(0.00, 0.00)</output></div>
      <div class="readout"><span>depth term</span><output id="depthCoord">1.00</output></div>
    </section>
  </aside>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    const canvas = document.getElementById("threeCanvas");
    const flatSvg = document.getElementById("flatSvg");
    const labelLayer = document.getElementById("labelLayer");
    const labels = new Map([...labelLayer.querySelectorAll("[data-label]")].map((el) => [el.dataset.label, el]));
    const matrixH = document.getElementById("matrixH");
    const flatSourceGrid = document.getElementById("flatSourceGrid");
    const flatImageGrid = document.getElementById("flatImageGrid");
    const flatLinks = document.getElementById("flatLinks");
    const mode3d = document.getElementById("mode3d");
    const modeFlat = document.getElementById("modeFlat");
    const outputs = {
      camX: document.getElementById("camXValue"),
      camY: document.getElementById("camYValue"),
      camZ: document.getElementById("camZValue"),
      planeTilt: document.getElementById("planeTiltValue"),
      planeRotate: document.getElementById("planeRotateValue"),
      worldCoord: document.getElementById("worldCoord"),
      imageCoord: document.getElementById("imageCoord"),
      depthCoord: document.getElementById("depthCoord")
    };
    const inputs = {
      camX: document.getElementById("camX"),
      camY: document.getElementById("camY"),
      camZ: document.getElementById("camZ"),
      planeTilt: document.getElementById("planeTilt"),
      planeRotate: document.getElementById("planeRotate")
    };

    const state = {
      cameraCenter: new THREE.Vector3(-4.8, -2.5, 2.6),
      tilt: degToRad(-12),
      rotate: degToRad(12),
      point: new THREE.Vector2(1.35, 0.65),
      mode: "3d",
      draggingCamera: false,
      dragPlane: new THREE.Plane()
    };

    const planeSize = { w: 4.8, h: 3.15 };
    const focal = 1.2;
    const imageSize = { w: 2.25, h: 1.55 };
    const worldUp = new THREE.Vector3(0, 0, 1);
    const target = new THREE.Vector3(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0xffffff, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xffffff, 12, 22);
    const viewCamera = new THREE.PerspectiveCamera(43, 1, 0.1, 80);
    viewCamera.up.set(0, 0, 1);
    viewCamera.position.set(-6.3, -8.4, 5.4);
    viewCamera.lookAt(-1.0, -0.6, 0.55);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xd7dde4, 1.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(-3, -5, 7);
    scene.add(keyLight);

    const planeGroup = new THREE.Group();
    scene.add(planeGroup);
    const dynamic = new THREE.Group();
    scene.add(dynamic);

    const surfaceMat = new THREE.MeshBasicMaterial({
      color: 0xd0d0d0,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const surface = new THREE.Mesh(new THREE.PlaneGeometry(planeSize.w, planeSize.h), surfaceMat);
    planeGroup.add(surface);

    const gridGroup = new THREE.Group();
    planeGroup.add(gridGroup);
    const gridMat = new THREE.LineBasicMaterial({ color: 0x6d737a, transparent: true, opacity: 0.42 });
    const gridMajorMat = new THREE.LineBasicMaterial({ color: 0x111417, transparent: true, opacity: 0.75 });
    for (let x = -2; x <= 2.001; x += 0.5) {
      gridGroup.add(makeLine(new THREE.Vector3(x, -planeSize.h / 2, 0.012), new THREE.Vector3(x, planeSize.h / 2, 0.012), Math.abs(x) < 0.01 ? gridMajorMat : gridMat));
    }
    for (let y = -1.5; y <= 1.501; y += 0.5) {
      gridGroup.add(makeLine(new THREE.Vector3(-planeSize.w / 2, y, 0.012), new THREE.Vector3(planeSize.w / 2, y, 0.012), Math.abs(y) < 0.01 ? gridMajorMat : gridMat));
    }

    const edgeMat = new THREE.LineBasicMaterial({ color: 0x111417, linewidth: 3 });
    const planeEdge = makePolyline([
      new THREE.Vector3(-planeSize.w / 2, -planeSize.h / 2, 0.02),
      new THREE.Vector3(planeSize.w / 2, -planeSize.h / 2, 0.02),
      new THREE.Vector3(planeSize.w / 2, planeSize.h / 2, 0.02),
      new THREE.Vector3(-planeSize.w / 2, planeSize.h / 2, 0.02),
      new THREE.Vector3(-planeSize.w / 2, -planeSize.h / 2, 0.02)
    ], edgeMat);
    planeGroup.add(planeEdge);

    const axisX = makeArrow(0xf10d12);
    const axisY = makeArrow(0xf10d12);
    const axisZ = makeArrow(0x20d40d);
    planeGroup.add(axisX, axisY, axisZ);

    const cameraSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0x050607 })
    );
    dynamic.add(cameraSphere);
    const dragHalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.36, 32, 16),
      new THREE.MeshBasicMaterial({ color: 0x05dfe6, transparent: true, opacity: 0.08, depthWrite: false })
    );
    dynamic.add(dragHalo);

    const imagePlane = new THREE.Mesh(
      new THREE.BufferGeometry(),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.58, side: THREE.DoubleSide, depthWrite: false })
    );
    dynamic.add(imagePlane);
    const imageEdge = makeLineObject(0x1a1f24, false, 0.92);
    dynamic.add(imageEdge);
    const imageGridLines = [];
    for (let i = 0; i < 10; i += 1) {
      const line = makeLineObject(i === 4 || i === 5 ? 0x20262d : 0x8e98a4, false, i === 4 || i === 5 ? 0.76 : 0.36);
      imageGridLines.push(line);
      dynamic.add(line);
    }

    const blackDashed = new THREE.LineDashedMaterial({ color: 0x0d1115, dashSize: 0.17, gapSize: 0.13, transparent: true, opacity: 0.9 });
    const paleDashed = new THREE.LineDashedMaterial({ color: 0xd7dce2, dashSize: 0.14, gapSize: 0.14, transparent: true, opacity: 0.8 });
    const cyanDashed = new THREE.LineDashedMaterial({ color: 0x05dfe6, dashSize: 0.16, gapSize: 0.13, transparent: true, opacity: 0.95 });
    const rays = {
      toPoint: makeLineObject(0x05dfe6, true, 1, cyanDashed),
      camToImage: makeLineObject(0x05dfe6, true, 0.85, cyanDashed),
      frustum: Array.from({ length: 4 }, () => makeLineObject(0x0d1115, true, 1, blackDashed)),
      planeRays: Array.from({ length: 2 }, () => makeLineObject(0xd7dce2, true, 0.85, paleDashed))
    };
    dynamic.add(rays.toPoint, rays.camToImage, ...rays.frustum, ...rays.planeRays);

    const worldPointMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.105, 32, 20),
      new THREE.MeshBasicMaterial({ color: 0x05dfe6 })
    );
    const imagePointMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 32, 20),
      new THREE.MeshBasicMaterial({ color: 0x05dfe6 })
    );
    dynamic.add(worldPointMesh, imagePointMesh);

    const imgAxisX = makeArrow(0x20d40d);
    const imgAxisY = makeArrow(0x20d40d);
    dynamic.add(imgAxisX, imgAxisY);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dragOffset = new THREE.Vector3();
    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(canvas.parentElement);
    window.addEventListener("resize", resize);

    for (const input of Object.values(inputs)) {
      input.addEventListener("input", syncFromControls);
    }
    mode3d.addEventListener("click", () => setMode("3d"));
    modeFlat.addEventListener("click", () => setMode("flat"));
    canvas.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    matrixH.replaceChildren(...Array.from({ length: 9 }, () => document.createElement("span")));
    syncFromControls();
    resize();
    animate();

    function syncFromControls() {
      state.cameraCenter.set(Number(inputs.camX.value), Number(inputs.camY.value), Number(inputs.camZ.value));
      state.tilt = degToRad(Number(inputs.planeTilt.value));
      state.rotate = degToRad(Number(inputs.planeRotate.value));
      updateScene();
    }

    function setMode(mode) {
      state.mode = mode;
      document.body.classList.toggle("flat-mode", mode === "flat");
      mode3d.setAttribute("aria-pressed", String(mode === "3d"));
      modeFlat.setAttribute("aria-pressed", String(mode === "flat"));
      updateScene();
    }

    function updateScene() {
      const geom = computeGeometry();
      planeGroup.quaternion.copy(geom.planeQuat);
      updatePlaneAxes();
      updateImagePlane(geom);
      updateRays(geom);
      updateReadouts(geom);
      drawFlatView(geom);
      updateLabels(geom);
    }

    function computeGeometry() {
      const planeQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(state.tilt, state.rotate, 0, "XYZ"));
      const planeMatrix = new THREE.Matrix4().makeRotationFromQuaternion(planeQuat);
      const C = state.cameraCenter.clone();
      const forward = target.clone().sub(C).normalize();
      const right = new THREE.Vector3().crossVectors(forward, worldUp).normalize();
      if (right.lengthSq() < 0.001) right.set(1, 0, 0);
      const up = new THREE.Vector3().crossVectors(right, forward).normalize();
      const imageCenter = C.clone().addScaledVector(forward, focal);
      const corners = [
        imageCenter.clone().addScaledVector(right, -imageSize.w / 2).addScaledVector(up, -imageSize.h / 2),
        imageCenter.clone().addScaledVector(right, imageSize.w / 2).addScaledVector(up, -imageSize.h / 2),
        imageCenter.clone().addScaledVector(right, imageSize.w / 2).addScaledVector(up, imageSize.h / 2),
        imageCenter.clone().addScaledVector(right, -imageSize.w / 2).addScaledVector(up, imageSize.h / 2)
      ];
      const worldPoint = localPlanePoint(state.point.x, state.point.y, planeMatrix);
      const projection = projectWorldPoint(worldPoint, C, forward, right, up, imageCenter);
      const H = homography(planeQuat, C, right, up, forward);
      return { planeQuat, planeMatrix, C, forward, right, up, imageCenter, corners, worldPoint, projection, H };
    }

    function updatePlaneAxes() {
      placeArrow(axisX, new THREE.Vector3(-1.1, -1.02, 0.05), new THREE.Vector3(1.05, 0, 0), 1.05);
      placeArrow(axisY, new THREE.Vector3(-1.1, -1.02, 0.05), new THREE.Vector3(0, 1.05, 0), 0.95);
      placeArrow(axisZ, new THREE.Vector3(-1.1, -1.02, 0.05), new THREE.Vector3(0, 0, 1), 0.92);
    }

    function updateImagePlane(g) {
      setMeshQuad(imagePlane, g.corners);
      setLinePoints(imageEdge, [...g.corners, g.corners[0]]);
      const lines = [];
      for (let x = -1; x <= 1.001; x += 0.5) {
        lines.push([
          g.imageCenter.clone().addScaledVector(g.right, x * imageSize.w / 2).addScaledVector(g.up, -imageSize.h / 2),
          g.imageCenter.clone().addScaledVector(g.right, x * imageSize.w / 2).addScaledVector(g.up, imageSize.h / 2)
        ]);
      }
      for (let y = -1; y <= 1.001; y += 0.5) {
        lines.push([
          g.imageCenter.clone().addScaledVector(g.right, -imageSize.w / 2).addScaledVector(g.up, y * imageSize.h / 2),
          g.imageCenter.clone().addScaledVector(g.right, imageSize.w / 2).addScaledVector(g.up, y * imageSize.h / 2)
        ]);
      }
      lines.forEach((line, index) => setLinePoints(imageGridLines[index], line));
      const axisBase = g.imageCenter.clone().addScaledVector(g.right, -0.82).addScaledVector(g.up, -0.51);
      placeWorldArrow(imgAxisX, axisBase, g.right, 0.46);
      placeWorldArrow(imgAxisY, axisBase, g.up, 0.42);
    }

    function updateRays(g) {
      worldPointMesh.position.copy(g.worldPoint);
      imagePointMesh.position.copy(g.projection.point);
      cameraSphere.position.copy(g.C);
      dragHalo.position.copy(g.C);
      setLinePoints(rays.toPoint, [g.projection.point, g.worldPoint]);
      setLinePoints(rays.camToImage, [g.C, g.projection.point]);
      g.corners.forEach((corner, i) => setLinePoints(rays.frustum[i], [g.C, corner]));
      const planeCorners = [
        localPlanePoint(-planeSize.w / 2, -planeSize.h / 2, g.planeMatrix),
        localPlanePoint(planeSize.w / 2, planeSize.h / 2, g.planeMatrix)
      ];
      setLinePoints(rays.planeRays[0], [g.C, planeCorners[0]]);
      setLinePoints(rays.planeRays[1], [g.C, planeCorners[1]]);
    }

    function updateReadouts(g) {
      outputs.camX.value = Number(inputs.camX.value).toFixed(2);
      outputs.camY.value = Number(inputs.camY.value).toFixed(2);
      outputs.camZ.value = Number(inputs.camZ.value).toFixed(2);
      outputs.planeTilt.value = `${Math.round(radToDeg(state.tilt))} deg`;
      outputs.planeRotate.value = `${Math.round(radToDeg(state.rotate))} deg`;
      outputs.worldCoord.value = `(${state.point.x.toFixed(2)}, ${state.point.y.toFixed(2)}, 0)`;
      outputs.imageCoord.value = `(${g.projection.x.toFixed(2)}, ${g.projection.y.toFixed(2)})`;
      outputs.depthCoord.value = g.projection.depth.toFixed(2);
      matrixH.querySelectorAll("span").forEach((span, index) => {
        span.textContent = normalizedH(g.H)[index].toFixed(2);
      });
    }

    function updateLabels(g) {
      if (state.mode !== "3d") return;
      const points = {
        camera: g.C.clone().add(new THREE.Vector3(-0.2, -0.25, 0.24)),
        imagePlane: g.corners[3].clone().lerp(g.corners[2], 0.44).addScaledVector(g.up, 0.33),
        surface: localPlanePoint(2.18, -1.88, g.planeMatrix),
        worldPoint: g.worldPoint.clone().add(new THREE.Vector3(0.45, 0.34, 0.24)),
        imagePoint: g.projection.point.clone().addScaledVector(g.right, 0.38).addScaledVector(g.up, 0.18),
        origin: new THREE.Vector3(0, 0, 0),
        axisX: planeGroup.localToWorld(new THREE.Vector3(0.42, -1.02, 0.05)),
        axisY: planeGroup.localToWorld(new THREE.Vector3(-1.1, 0.28, 0.05)),
        axisZ: planeGroup.localToWorld(new THREE.Vector3(-1.1, -1.02, 1.08)),
        imgX: g.imageCenter.clone().addScaledVector(g.right, -0.28).addScaledVector(g.up, -0.5),
        imgY: g.imageCenter.clone().addScaledVector(g.right, -0.83).addScaledVector(g.up, -0.03)
      };
      for (const [key, position] of Object.entries(points)) {
        placeLabel(labels.get(key), position);
      }
    }

    function drawFlatView(g) {
      const sourceRect = { x: 74, y: 104, w: 375, h: 480 };
      const imageRect = { x: 730, y: 104, w: 375, h: 480 };
      const svgEls = [];
      const sourceMap = (x, y) => ({
        x: sourceRect.x + (x + planeSize.w / 2) / planeSize.w * sourceRect.w,
        y: sourceRect.y + (planeSize.h / 2 - y) / planeSize.h * sourceRect.h
      });
      const sampled = [];
      for (let x = -planeSize.w / 2; x <= planeSize.w / 2 + 0.001; x += 0.5) {
        for (let y = -planeSize.h / 2; y <= planeSize.h / 2 + 0.001; y += 0.5) {
          sampled.push(projectLocalByH(g.H, x, y));
        }
      }
      const bounds = boundsOf(sampled);
      const pad = 38;
      const imageMap = (p) => ({
        x: imageRect.x + pad + (p.x - bounds.minX) / Math.max(0.001, bounds.maxX - bounds.minX) * (imageRect.w - 2 * pad),
        y: imageRect.y + imageRect.h - pad - (p.y - bounds.minY) / Math.max(0.001, bounds.maxY - bounds.minY) * (imageRect.h - 2 * pad)
      });

      for (let x = -planeSize.w / 2; x <= planeSize.w / 2 + 0.001; x += 0.5) {
        const a = sourceMap(x, -planeSize.h / 2);
        const b = sourceMap(x, planeSize.h / 2);
        svgEls.push(lineEl(a, b, Math.abs(x) < 0.01 ? "flat-grid major" : "flat-grid"));
      }
      for (let y = -planeSize.h / 2; y <= planeSize.h / 2 + 0.001; y += 0.5) {
        const a = sourceMap(-planeSize.w / 2, y);
        const b = sourceMap(planeSize.w / 2, y);
        svgEls.push(lineEl(a, b, Math.abs(y) < 0.01 ? "flat-grid major" : "flat-grid"));
      }
      svgEls.push(polyEl([
        sourceMap(-planeSize.w / 2, -planeSize.h / 2),
        sourceMap(planeSize.w / 2, -planeSize.h / 2),
        sourceMap(planeSize.w / 2, planeSize.h / 2),
        sourceMap(-planeSize.w / 2, planeSize.h / 2)
      ], "flat-surface"));
      flatSourceGrid.replaceChildren(...svgEls);

      const imageEls = [];
      for (let x = -planeSize.w / 2; x <= planeSize.w / 2 + 0.001; x += 0.5) {
        const a = imageMap(projectLocalByH(g.H, x, -planeSize.h / 2));
        const b = imageMap(projectLocalByH(g.H, x, planeSize.h / 2));
        imageEls.push(lineEl(a, b, Math.abs(x) < 0.01 ? "flat-grid major" : "flat-grid"));
      }
      for (let y = -planeSize.h / 2; y <= planeSize.h / 2 + 0.001; y += 0.5) {
        const a = imageMap(projectLocalByH(g.H, -planeSize.w / 2, y));
        const b = imageMap(projectLocalByH(g.H, planeSize.w / 2, y));
        imageEls.push(lineEl(a, b, Math.abs(y) < 0.01 ? "flat-grid major" : "flat-grid"));
      }
      imageEls.push(polyEl([
        imageMap(projectLocalByH(g.H, -planeSize.w / 2, -planeSize.h / 2)),
        imageMap(projectLocalByH(g.H, planeSize.w / 2, -planeSize.h / 2)),
        imageMap(projectLocalByH(g.H, planeSize.w / 2, planeSize.h / 2)),
        imageMap(projectLocalByH(g.H, -planeSize.w / 2, planeSize.h / 2))
      ], "flat-surface"));
      flatImageGrid.replaceChildren(...imageEls);

      const srcPoint = sourceMap(state.point.x, state.point.y);
      const imgPoint = imageMap(projectLocalByH(g.H, state.point.x, state.point.y));
      const origin = sourceMap(0, 0);
      const xEnd = sourceMap(0.9, 0);
      const yEnd = sourceMap(0, 0.9);
      const zEnd = { x: origin.x - 36, y: origin.y - 64 };
      const linkEls = [
        lineEl(srcPoint, imgPoint, "flat-map-line"),
        circleEl(srcPoint, "flat-point"),
        circleEl(imgPoint, "flat-point"),
        lineEl(origin, xEnd, "flat-axis-x", "url(#flatArrowRed)"),
        lineEl(origin, yEnd, "flat-axis-y", "url(#flatArrowRed)"),
        lineEl(origin, zEnd, "flat-axis-z", "url(#flatArrowGreen)"),
        textEl("X", xEnd.x + 12, xEnd.y + 8, "flat-label"),
        textEl("Y", yEnd.x + 8, yEnd.y - 12, "flat-label"),
        textEl("Z", zEnd.x - 26, zEnd.y - 6, "flat-label"),
        textEl("(X,Y,0)", srcPoint.x + 24, srcPoint.y - 14, "flat-label cyan"),
        textEl("(x,y)", imgPoint.x + 24, imgPoint.y - 14, "flat-label cyan")
      ];
      flatLinks.replaceChildren(...linkEls);
    }

    function homography(planeQuat, C, right, up, forward) {
      const ex = new THREE.Vector3(1, 0, 0).applyQuaternion(planeQuat);
      const ey = new THREE.Vector3(0, 1, 0).applyQuaternion(planeQuat);
      return [
        right.dot(ex), right.dot(ey), -right.dot(C),
        up.dot(ex), up.dot(ey), -up.dot(C),
        forward.dot(ex), forward.dot(ey), -forward.dot(C)
      ];
    }

    function normalizedH(H) {
      const scale = Math.abs(H[8]) > 1e-6 ? H[8] : 1;
      return H.map((v) => v / scale);
    }

    function projectLocalByH(H, x, y) {
      const nx = H[0] * x + H[1] * y + H[2];
      const ny = H[3] * x + H[4] * y + H[5];
      const nz = H[6] * x + H[7] * y + H[8];
      return { x: nx / nz, y: ny / nz, z: nz };
    }

    function projectWorldPoint(P, C, forward, right, up, imageCenter) {
      const v = P.clone().sub(C);
      const depth = v.dot(forward);
      const x = v.dot(right) / depth;
      const y = v.dot(up) / depth;
      return {
        x,
        y,
        depth,
        point: imageCenter.clone().addScaledVector(right, x * focal).addScaledVector(up, y * focal)
      };
    }

    function localPlanePoint(x, y, matrix) {
      return new THREE.Vector3(x, y, 0).applyMatrix4(matrix);
    }

    function makeLine(a, b, material) {
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), material);
      return line;
    }

    function makePolyline(points, material) {
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
    }

    function makeLineObject(color, dashed = false, opacity = 1, customMaterial = null) {
      const mat = customMaterial || (dashed
        ? new THREE.LineDashedMaterial({ color, dashSize: 0.14, gapSize: 0.12, transparent: true, opacity })
        : new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), mat);
    }

    function setLinePoints(line, points) {
      line.geometry.setFromPoints(points);
      line.geometry.computeBoundingSphere();
      if (line.material.isLineDashedMaterial) line.computeLineDistances();
    }

    function setMeshQuad(mesh, corners) {
      const vertices = new Float32Array([
        corners[0].x, corners[0].y, corners[0].z,
        corners[1].x, corners[1].y, corners[1].z,
        corners[2].x, corners[2].y, corners[2].z,
        corners[0].x, corners[0].y, corners[0].z,
        corners[2].x, corners[2].y, corners[2].z,
        corners[3].x, corners[3].y, corners[3].z
      ]);
      mesh.geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
      mesh.geometry.computeVertexNormals();
      mesh.geometry.computeBoundingSphere();
    }

    function makeArrow(color) {
      const arrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, color, 0.16, 0.09);
      arrow.line.material.linewidth = 4;
      return arrow;
    }

    function placeArrow(arrow, origin, direction, length) {
      arrow.position.copy(origin);
      arrow.setDirection(direction.clone().normalize());
      arrow.setLength(length, 0.18, 0.1);
    }

    function placeWorldArrow(arrow, origin, direction, length) {
      arrow.position.copy(origin);
      arrow.setDirection(direction.clone().normalize());
      arrow.setLength(length, 0.13, 0.07);
    }

    function placeLabel(el, worldPos) {
      const rect = canvas.getBoundingClientRect();
      const p = worldPos.clone().project(viewCamera);
      const x = (p.x * 0.5 + 0.5) * rect.width;
      const y = (-p.y * 0.5 + 0.5) * rect.height;
      const halfWidth = Math.max(28, el.offsetWidth / 2 + 8);
      const halfHeight = Math.max(18, el.offsetHeight / 2 + 6);
      el.style.left = `${clamp(x, halfWidth, rect.width - halfWidth)}px`;
      el.style.top = `${clamp(y, halfHeight, rect.height - halfHeight)}px`;
      el.style.opacity = p.z > 1 ? "0" : "1";
    }

    function onPointerDown(event) {
      pointerFromEvent(event);
      raycaster.setFromCamera(pointer, viewCamera);
      const hit = raycaster.intersectObject(dragHalo, false)[0] || raycaster.intersectObject(cameraSphere, false)[0];
      if (!hit) return;
      state.draggingCamera = true;
      canvas.setPointerCapture(event.pointerId);
      const normal = viewCamera.getWorldDirection(new THREE.Vector3()).normalize();
      state.dragPlane.setFromNormalAndCoplanarPoint(normal, state.cameraCenter);
      const p = new THREE.Vector3();
      raycaster.ray.intersectPlane(state.dragPlane, p);
      dragOffset.copy(state.cameraCenter).sub(p);
    }

    function onPointerMove(event) {
      if (!state.draggingCamera) return;
      pointerFromEvent(event);
      raycaster.setFromCamera(pointer, viewCamera);
      const p = new THREE.Vector3();
      if (!raycaster.ray.intersectPlane(state.dragPlane, p)) return;
      p.add(dragOffset);
      p.x = clamp(p.x, Number(inputs.camX.min), Number(inputs.camX.max));
      p.y = clamp(p.y, Number(inputs.camY.min), Number(inputs.camY.max));
      p.z = clamp(p.z, Number(inputs.camZ.min), Number(inputs.camZ.max));
      inputs.camX.value = p.x.toFixed(2);
      inputs.camY.value = p.y.toFixed(2);
      inputs.camZ.value = p.z.toFixed(2);
      syncFromControls();
    }

    function onPointerUp(event) {
      if (!state.draggingCamera) return;
      state.draggingCamera = false;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    }

    function pointerFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      renderer.setSize(rect.width, rect.height, false);
      viewCamera.aspect = rect.width / rect.height;
      viewCamera.updateProjectionMatrix();
      updateScene();
    }

    function animate() {
      renderer.render(scene, viewCamera);
      requestAnimationFrame(animate);
    }

    function boundsOf(points) {
      return points.reduce((acc, p) => ({
        minX: Math.min(acc.minX, p.x),
        maxX: Math.max(acc.maxX, p.x),
        minY: Math.min(acc.minY, p.y),
        maxY: Math.max(acc.maxY, p.y)
      }), { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });
    }

    function lineEl(a, b, cls, markerEnd = null) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
      el.setAttribute("class", cls);
      el.setAttribute("x1", a.x.toFixed(2));
      el.setAttribute("y1", a.y.toFixed(2));
      el.setAttribute("x2", b.x.toFixed(2));
      el.setAttribute("y2", b.y.toFixed(2));
      if (markerEnd) el.setAttribute("marker-end", markerEnd);
      return el;
    }

    function polyEl(points, cls) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      el.setAttribute("class", cls);
      el.setAttribute("points", points.map((p) => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" "));
      return el;
    }

    function circleEl(point, cls) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("class", cls);
      el.setAttribute("cx", point.x.toFixed(2));
      el.setAttribute("cy", point.y.toFixed(2));
      el.setAttribute("r", "12");
      return el;
    }

    function textEl(text, x, y, cls) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("class", cls);
      el.setAttribute("x", x.toFixed(2));
      el.setAttribute("y", y.toFixed(2));
      el.textContent = text;
      return el;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function radToDeg(rad) {
      return rad * 180 / Math.PI;
    }
  </script>
</body>
