<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCGAN Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5e6570;
      --paper: #ffffff;
      --panel: #f5f7fa;
      --edge: #d6dde7;
      --accent: #1368d9;
      --accent-2: #0a9a7a;
      --orange-front: #d6845f;
      --orange-side: #7d3f24;
      --orange-top: #e79770;
      --cyan: #9bd9d1;
      --shadow: 0 18px 48px rgba(31, 39, 52, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef2f7;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 14px;
      padding: 14px;
    }

    main,
    aside {
      min-width: 0;
    }

    .stage-wrap,
    .controls {
      background: var(--paper);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage-wrap {
      display: grid;
      place-items: center;
      overflow: auto;
      min-height: min(720px, calc(100vh - 28px));
    }

    svg {
      display: block;
      width: min(100%, 1500px);
      min-width: 880px;
      height: auto;
      background: #ffffff;
      user-select: none;
    }

    .controls {
      padding: 16px;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .controls h1 {
      margin: 0;
      font-size: 1.04rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .control-row,
    .toggle-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      min-height: 38px;
      border: 1px solid #b9c4d3;
      border-radius: 7px;
      background: #ffffff;
      color: #111827;
      font: inherit;
      font-weight: 700;
      padding: 8px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(19, 104, 217, 0.14);
    }

    button.primary {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
    }

    button.primary.discriminator {
      background: #7a4d12;
      border-color: #7a4d12;
    }

    button svg {
      width: 16px;
      min-width: 16px;
      height: 16px;
      fill: currentColor;
      stroke: currentColor;
    }

    .info-card {
      min-height: 184px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #fbfcfe;
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .info-card h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
    }

    .info-card p {
      margin: 0;
      color: #303846;
      font-size: 0.93rem;
      line-height: 1.42;
    }

    .dim {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border: 1px solid #bfd0e7;
      border-radius: 999px;
      background: #eef5ff;
      color: #163c72;
      padding: 4px 8px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .timeline {
      display: grid;
      gap: 6px;
    }

    .timeline-title {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .step-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .step-list button {
      min-width: 0;
      min-height: 32px;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #333b46;
    }

    .step-list button.active {
      background: #e9f1ff;
      border-color: var(--accent);
      color: #0b4eaa;
    }

    .step-list button.visited {
      border-color: #85bea9;
      background: #ecf9f4;
    }

    label {
      font-size: 0.92rem;
      color: #303846;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .diagram-text {
      font-family: Georgia, "Times New Roman", serif;
      fill: #111111;
    }

    .title-text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 42px;
      fill: #0b0b0b;
    }

    .tensor-label {
      font-size: 30px;
    }

    .op-label {
      font-size: 30px;
    }

    .small-label {
      font-size: 25px;
    }

    .face {
      stroke: #000000;
      stroke-width: 2.7;
      stroke-linejoin: round;
      transition: fill 200ms ease, opacity 200ms ease, stroke 200ms ease, filter 200ms ease;
    }

    .front {
      fill: url(#orangeFront);
    }

    .side {
      fill: url(#orangeSide);
    }

    .top {
      fill: url(#orangeTop);
    }

    .volume-shadow {
      filter: drop-shadow(8px 10px 9px rgba(0, 0, 0, 0.13));
    }

    .z-vector .face {
      fill: var(--cyan);
    }

    .stage.active .face,
    .stage.active .image-plane,
    .annotation-stage.active .annotation-ring {
      stroke: var(--accent);
      stroke-width: 5;
      filter: url(#blueGlow);
    }

    .stage.visited .face,
    .stage.visited .image-plane,
    .annotation-stage.visited .annotation-ring {
      stroke: var(--accent-2);
      stroke-width: 3.7;
    }

    .stage.active .front {
      fill: #f1a36f;
    }

    .stage.active .side {
      fill: #a6532e;
    }

    .stage.active .top {
      fill: #ffc091;
    }

    .stage.dimmed,
    .annotation-stage.dimmed {
      opacity: 0.36;
    }

    .flow-segment {
      fill: none;
      stroke: #000000;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrowBlack);
      transition: stroke 180ms ease, stroke-width 180ms ease, opacity 180ms ease;
    }

    .flow-segment.active {
      stroke: var(--accent);
      stroke-width: 7;
      marker-end: url(#arrowBlue);
      stroke-dasharray: 16 10;
      animation: dash 650ms linear infinite;
      filter: url(#blueGlow);
    }

    .flow-segment.complete {
      stroke: var(--accent-2);
      stroke-width: 5.5;
      marker-end: url(#arrowGreen);
    }

    .op-mark.active {
      fill: #0b4eaa;
      font-weight: 700;
    }

    .brace {
      fill: none;
      stroke: #050505;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .operation-bracket {
      fill: none;
      stroke: #000000;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .image-plane {
      fill: url(#pixelFace);
      stroke: #000000;
      stroke-width: 3;
      filter: drop-shadow(8px 12px 10px rgba(0, 0, 0, 0.18));
      transition: stroke 200ms ease, filter 200ms ease;
    }

    .image-depth {
      fill: #7f8a86;
      stroke: #000000;
      stroke-width: 3;
      opacity: 0.92;
    }

    .mini-square {
      fill: #9bd9d1;
      stroke: #52756f;
      stroke-width: 3;
    }

    .pulse {
      fill: #ffffff;
      stroke: var(--accent);
      stroke-width: 5;
      opacity: 0;
      pointer-events: none;
    }

    .pulse.visible {
      opacity: 1;
      animation: pulse 900ms ease-in-out infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -26;
      }
    }

    @keyframes pulse {
      0% {
        r: 7;
        opacity: 1;
      }

      100% {
        r: 18;
        opacity: 0;
      }
    }

    @media (max-width: 980px) {
      body {
        grid-template-columns: 1fr;
      }

      .stage-wrap {
        min-height: auto;
      }

      aside {
        order: -1;
      }

      .controls {
        min-height: auto;
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 8px;
      }

      svg {
        min-width: 820px;
      }

      .control-row button {
        flex: 1 1 140px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-segment.active,
      .pulse.visible {
        animation: none;
      }
    }
  </style>
</head>

        <path class="operation-bracket" d="M 1058 556 L 1120 520 L 1354 520 L 1292 556 Z"></path>
        <path class="operation-bracket" d="M 1292 556 L 1354 520 L 1500 520 L 1440 556 Z"></path>
        <text id="op-strided" class="diagram-text op-label op-mark" x="1222" y="582" text-anchor="middle">Strided</text>
        <text class="diagram-text op-label op-mark" x="1222" y="619" text-anchor="middle">convolution</text>
        <path class="operation-bracket" d="M 1574 556 L 1770 556 L 1804 538"></path>
        <text id="op-4x4" class="diagram-text op-label op-mark" x="1648" y="582" text-anchor="middle">4 x 4</text>
        <text class="diagram-text op-label op-mark" x="1648" y="619" text-anchor="middle">convolution</text>
        <text id="op-sigmoid" class="diagram-text op-label op-mark" x="1824" y="582" text-anchor="middle">sigmoid</text>
      </g>

      <circle id="pulse" class="pulse" cx="0" cy="0" r="8"></circle>
    </svg>
  </main>

  <aside class="controls" aria-label="Animation controls">
    <h1>DCGAN Forward Pass</h1>
    <div class="control-row">
      <button id="playGenerator" class="primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        Generator
      </button>
      <button id="playDiscriminator" class="primary discriminator" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        Discriminator
      </button>
      <button id="reset" type="button" title="Reset trace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.3 4H3l4-4 4 4H8.1A5 5 0 1 0 12 7z"></path></svg>
        Reset
      </button>
    </div>

    <div class="info-card" aria-live="polite">
      <span id="infoDim" class="dim">Select a pass</span>
      <h2 id="infoTitle">Mirrored convolutional pipelines</h2>
      <p id="infoText">The left pipeline expands a compact noise vector into an image. The right pipeline evaluates an image by repeatedly shrinking spatial size while increasing feature depth.</p>
    </div>

    <div class="timeline">
      <div id="timelineTitle" class="timeline-title">Trace steps</div>
      <div id="stepList" class="step-list" aria-label="Trace steps"></div>
    </div>

    <label for="speed">Animation speed</label>
    <input id="speed" type="range" min="550" max="1800" step="50" value="1050">
    <div class="toggle-row">
      <label for="loop"><input id="loop" type="checkbox"> Loop trace</label>
    </div>
  </aside>

  <script>
    (function () {
      var flows = {
        generator: {
          name: "Generator",
          steps: [
            {
              label: "z",
              ids: ["g-z"],
              dim: "100 x 1",
              title: "Latent variable z",
              text: "A compact random noise vector is the only input to the generator."
            },
            {
              label: "4x4",
              ids: ["g-project"],
              segment: "seg-g-z-project",
              op: "op-project",
              dim: "4 x 4 x 1024",
              title: "Project and reshape",
              text: "The vector is projected and reshaped into a small, deep feature volume."
            },
            {
              label: "8x8",
              ids: ["g8"],
              segment: "seg-g-project-g8",
              op: "op-frac",
              dim: "8 x 8 x 512",
              title: "Fractional convolution",
              text: "A transposed convolution upsamples the spatial grid while reducing channel depth."
            },
            {
              label: "16x16",
              ids: ["g16"],
              segment: "seg-g8-g16",
              op: "op-frac",
              dim: "16 x 16 x 256",
              title: "Fractional convolution",
              text: "The feature map doubles in width and height, carrying mid-level image structure."
            },
            {
              label: "32x32",
              ids: ["g32"],
              segment: "seg-g16-g32",
              op: "op-frac",
              dim: "32 x 32 x 128",
              title: "Fractional convolution",
              text: "The generator keeps expanding the spatial layout toward image resolution."
            },
            {
              label: "64x64",
              ids: ["g64"],
              segment: "seg-g32-g64",
              op: "op-arctan",
              dim: "64 x 64 x 3",
              title: "Output image",
              text: "The final transposed convolution and arctan activation produce a three-channel image."
            }
          ]
        },
        discriminator: {
          name: "Discriminator",
          steps: [
            {
              label: "image",
              ids: ["d-input", "g64"],
              dim: "64 x 64 x 3",
              title: "Real or generated image",
              text: "The discriminator receives either a real image x or the generator output x*."
            },
            {
              label: "32x32",
              ids: ["d32"],
              segment: "seg-d-input-d32",
              op: "op-strided",
              dim: "32 x 32 x 128",
              title: "Strided convolution",
              text: "A strided convolution halves spatial resolution and lifts the representation into feature channels."
            },
            {
              label: "16x16",
              ids: ["d16"],
              segment: "seg-d32-d16",
              op: "op-strided",
              dim: "16 x 16 x 256",
              title: "Strided convolution",
              text: "The downsampling stack keeps compressing the image while increasing depth."
            },
            {
              label: "8x8",
              ids: ["d8"],
              segment: "seg-d16-d8",
              op: "op-strided",
              dim: "8 x 8 x 512",
              title: "Strided convolution",
              text: "Local evidence accumulates into a smaller, deeper feature block."
            },
            {
              label: "4x4",
              ids: ["d4"],
              segment: "seg-d8-d4",
              op: "op-strided",
              dim: "4 x 4 x 1024",
              title: "Strided convolution",
              text: "The final spatial feature volume mirrors the generator's first reshaped tensor."
            },
            {
              label: "1x1",
              ids: ["d1"],
              segment: "seg-d4-d1",
              op: "op-4x4",
              dim: "1 x 1",
              title: "4 x 4 convolution",
              text: "A full-spatial convolution collapses the 4 x 4 feature map into a single logit."
            },
            {
              label: "Pr",
              ids: ["dprob"],
              segment: "seg-d1-prob",
              op: "op-sigmoid",
              dim: "Pr(real)",
              title: "Sigmoid probability",
              text: "The sigmoid maps the logit to the probability that the input image is real."
            }
          ]
        }
      };

      var state = {
        mode: null,
        index: -1,
        timer: null
      };

      var allStages = Array.prototype.slice.call(document.querySelectorAll(".stage, .annotation-stage"));
      var allSegments = Array.prototype.slice.call(document.querySelectorAll(".flow-segment"));
      var allOps = Array.prototype.slice.call(document.querySelectorAll(".op-mark"));
      var pulse = document.getElementById("pulse");
      var infoDim = document.getElementById("infoDim");
      var infoTitle = document.getElementById("infoTitle");
      var infoText = document.getElementById("infoText");
      var stepList = document.getElementById("stepList");
      var timelineTitle = document.getElementById("timelineTitle");
      var speed = document.getElementById("speed");
      var loop = document.getElementById("loop");

      var centers = {
        "g-z": [178, 352],
        "g-project": [340, 500],
        "g8": [558, 487],
        "g16": [676, 470],
        "g32": [748, 420],
        "g64": [852, 365],
        "d-input": [1025, 365],
        "d32": [1170, 420],
        "d16": [1295, 470],
        "d8": [1450, 493],
        "d4": [1650, 506],
        "d1": [1846, 507],
        "dprob": [1830, 462]
      };

      function clearTimer() {
        if (state.timer) {
          window.clearInterval(state.timer);
          state.timer = null;
        }
      }

      function uniqueIdsForSteps(steps, endIndex) {
        var out = [];
        steps.slice(0, endIndex + 1).forEach(function (step) {
          step.ids.forEach(function (id) {
            if (out.indexOf(id) === -1) {
              out.push(id);
            }
          });
        });
        return out;
      }

      function setClasses(mode, index) {
        var flow = flows[mode];
        var current = flow.steps[index];
        var visitedIds = uniqueIdsForSteps(flow.steps, Math.max(0, index - 1));
        var activeIds = current.ids;

        allStages.forEach(function (node) {
          node.classList.remove("active", "visited", "dimmed");
          if (activeIds.indexOf(node.id) !== -1) {
            node.classList.add("active");
          } else if (visitedIds.indexOf(node.id) !== -1) {
            node.classList.add("visited");
          } else {
            node.classList.add("dimmed");
          }
        });

        allSegments.forEach(function (node) {
          node.classList.remove("active", "complete");
        });

        flow.steps.forEach(function (step, stepIndex) {
          if (!step.segment) {
            return;
          }
          var segment = document.getElementById(step.segment);
          if (!segment) {
            return;
          }
          if (stepIndex < index) {
            segment.classList.add("complete");
          } else if (stepIndex === index) {
            segment.classList.add("active");
          }
        });

        allOps.forEach(function (node) {
          node.classList.remove("active");
        });
        if (current.op) {
          var activeOp = document.getElementById(current.op);
          if (activeOp) {
            activeOp.classList.add("active");
          }
        }
      }

      function movePulse(step) {
        var id = step.ids[0];
        var xy = centers[id];
        if (!xy) {
          pulse.classList.remove("visible");
          return;
        }
        pulse.setAttribute("cx", xy[0]);
        pulse.setAttribute("cy", xy[1]);
        pulse.classList.add("visible");
      }

      function renderSteps(mode) {
        var flow = flows[mode];
        stepList.innerHTML = "";
        timelineTitle.textContent = flow.name + " trace";
        flow.steps.forEach(function (step, index) {
          var button = document.createElement("button");
          button.type = "button";
          button.textContent = step.label;
          button.setAttribute("aria-label", flow.name + " step " + (index + 1) + ": " + step.title);
          if (index === state.index) {
            button.classList.add("active");
          } else if (index < state.index) {
            button.classList.add("visited");
          }
          button.addEventListener("click", function () {
            clearTimer();
            setStep(mode, index);
          });
          stepList.appendChild(button);
        });
      }

      function setStep(mode, index) {
        var flow = flows[mode];
        state.mode = mode;
        state.index = Math.max(0, Math.min(index, flow.steps.length - 1));

        var step = flow.steps[state.index];
        setClasses(mode, state.index);
        movePulse(step);
        infoDim.textContent = step.dim;
        infoTitle.textContent = step.title;
        infoText.textContent = step.text;
        renderSteps(mode);
      }

      function play(mode) {
        var flow = flows[mode];
        clearTimer();
        setStep(mode, 0);
        state.timer = window.setInterval(function () {
          var next = state.index + 1;
          if (next >= flow.steps.length) {
            if (loop.checked) {
              next = 0;
            } else {
              clearTimer();
              return;
            }
          }
          setStep(mode, next);
        }, Number(speed.value));
      }

      function reset() {
        clearTimer();
        state.mode = null;
        state.index = -1;
        allStages.forEach(function (node) {
          node.classList.remove("active", "visited", "dimmed");
        });
        allSegments.forEach(function (node) {
          node.classList.remove("active", "complete");
        });
        allOps.forEach(function (node) {
          node.classList.remove("active");
        });
        pulse.classList.remove("visible");
        infoDim.textContent = "Select a pass";
        infoTitle.textContent = "Mirrored convolutional pipelines";
        infoText.textContent = "The left pipeline expands a compact noise vector into an image. The right pipeline evaluates an image by repeatedly shrinking spatial size while increasing feature depth.";
        timelineTitle.textContent = "Trace steps";
        stepList.innerHTML = "";
      }

      document.getElementById("playGenerator").addEventListener("click", function () {
        play("generator");
      });
      document.getElementById("playDiscriminator").addEventListener("click", function () {
        play("discriminator");
      });
      document.getElementById("reset").addEventListener("click", reset);
      speed.addEventListener("input", function () {
        if (state.timer && state.mode) {
          play(state.mode);
        }
      });
    }());
  </script>
</body>
</html>
