<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydrogen-Oxygen Fuel Cell</title>
  <style>
    :root {
      --feed-stroke: 6;
      --current-stroke: 5;
      --accent: #0f7ea8;
      --panel: #f5f7fb;
      --ink: #151515;
      --muted: #57606b;
      --anode: #9229d7;
      --membrane: #3d61ee;
      --wire-flow: #18a3c9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      display: grid;
      place-items: center;
    }

    .figure-app {
      width: min(1180px, 100vw);
      min-height: 100vh;
      padding: clamp(10px, 2vw, 22px);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .stage {
      width: 100%;
      display: grid;
      place-items: center;
      min-height: 0;
    }

    svg {
      width: min(100%, 1060px);
      height: auto;
      max-height: calc(100vh - 150px);
      display: block;
      overflow: visible;
    }

    .toolbar {
      width: min(1060px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto auto minmax(230px, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid #d7dee9;
      border-radius: 8px;
    }

    button,
    input,
    label {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid #aeb8c7;
      background: #ffffff;
      color: #111827;
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(15, 126, 168, 0.18);
      outline-offset: 1px;
    }

    .toggle[aria-pressed="true"] {
      background: #14384b;
      color: #ffffff;
      border-color: #14384b;
    }

    .slider-row {
      display: grid;
      grid-template-columns: max-content minmax(120px, 1fr) 3.5ch;
      gap: 10px;
      align-items: center;
      color: #1f2937;
      min-width: 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
      min-width: 24ch;
      text-align: right;
    }

    .component-shell {
      fill: #b7b7b7;
      stroke: #111;
      stroke-width: 3;
    }

    .gas-channel {
      fill: #2e2e2e;
      stroke: #111;
      stroke-width: 2;
    }

    .electrode {
      fill: var(--anode);
      stroke: #111;
      stroke-width: 3;
    }

    .membrane {
      fill: var(--membrane);
      stroke: #111;
      stroke-width: 3;
    }

    .wire {
      fill: none;
      stroke: #0b0b0b;
      stroke-width: 6;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .wire-flow {
      fill: none;
      stroke: var(--wire-flow);
      stroke-width: calc(var(--current-stroke) * 1px);
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow-current);
      filter: url(#softGlow);
      opacity: 0.95;
    }

    .feed-arrow,
    .flow-arrow {
      fill: none;
      stroke: #ffffff;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrow-white);
    }

    .feed-arrow {
      stroke-width: calc(var(--feed-stroke) * 1px);
    }

    .flow-arrow {
      stroke-width: 5;
    }

    .product-arrow {
      stroke: #ffffff;
      stroke-width: 5;
    }

    .label {
      fill: #111111;
      font-size: 28px;
      dominant-baseline: middle;
    }

    .small-label {
      font-size: 25px;
    }

    .part-label {
      fill: #111111;
      font-size: 26px;
      text-anchor: middle;
    }

    .caption-line {
      stroke: #111111;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
    }

    .charge {
      font-weight: 700;
      font-size: 32px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .charge.minus {
      font-size: 36px;
    }

    .electron circle {
      fill: url(#electronGold);
    }

    .proton circle {
      fill: url(#protonPearl);
    }

    .electron-pulse {
      fill: #ffe476;
      stroke: #111111;
      stroke-width: 2;
      filter: url(#softGlow);
    }

    .reaction-zone,
    .proton-active,
    .cathode-active,
    .feed-active {
      opacity: 0;
      transition: opacity 240ms ease;
      pointer-events: none;
    }

    [data-step="0"] .feed-active,
    [data-step="1"] .reaction-zone,
    [data-step="2"] .proton-active,
    [data-step="3"] .cathode-active {
      opacity: 1;
    }

    [data-step="1"] .anode-highlight,
    [data-step="2"] .membrane-highlight,
    [data-step="3"] .cathode-highlight {
      opacity: 1;
    }

    .zone-highlight {
      opacity: 0;
      transition: opacity 240ms ease;
      fill: none;
      stroke: #fff36a;
      stroke-width: 6;
      stroke-dasharray: 12 9;
      pointer-events: none;
    }

    .diagram-labels,
    .callouts {
      transition: opacity 220ms ease;
    }

    .clean .diagram-labels,
    .clean .callouts {
      opacity: 0;
      pointer-events: none;
    }

    .clean .component-shell {
      fill: #c4c4c4;
    }

    .molecule text {
      font-weight: 700;
    }

    .h-atom {
      fill: url(#hydrogenWhite);
    }

    .o-atom {
      fill: url(#oxygenRed);
    }

    .bubble-shadow {
      filter: url(#dropShadow);
    }

    .split-dot {
      animation: pulseSplit 1.6s ease-in-out infinite;
    }

    .proton-shuttle {
      animation: shuttle 1.8s ease-in-out infinite;
    }

    .water-pop {
      animation: waterPop 1.8s ease-in-out infinite;
    }

    .is-paused .electron-pulse,
    .is-paused .split-dot,
    .is-paused .proton-shuttle,
    .is-paused .water-pop {
      animation-play-state: paused;
    }

    @keyframes pulseSplit {
      0%, 100% { opacity: 0.55; }
      45% { opacity: 1; }
    }

    @keyframes shuttle {
      0%, 100% { transform: translateX(0); opacity: 0.65; }
      50% { transform: translateX(18px); opacity: 1; }
    }

    @keyframes waterPop {
      0%, 100% { opacity: 0.72; }
      55% { opacity: 1; }
    }

    @media (max-width: 740px) {
      .figure-app {
        padding: 8px;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      svg {
        max-height: calc(100vh - 188px);
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .slider-row,
      .status {
        grid-column: 1 / -1;
      }

      .status {
        text-align: left;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="figure-app" aria-labelledby="figure-title">
    <section class="stage">
      <svg id="fuelCell" viewBox="0 0 974 720" role="img" aria-labelledby="figure-title figure-desc" data-step="0">
        <title id="figure-title">Hydrogen-oxygen fuel cell</title>
        <desc id="figure-desc">Interactive diagram of hydrogen gas entering an anode, protons crossing a proton exchange membrane, electrons moving through an external circuit, oxygen entering the cathode, and water leaving as product.</desc>

        <defs>
          <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"></path>
          </marker>
          <marker id="arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#18a3c9"></path>
          </marker>
          <radialGradient id="hydrogenWhite" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"></stop>
            <stop offset="58%" stop-color="#edfafa"></stop>
            <stop offset="100%" stop-color="#b7c8c8"></stop>
          </radialGradient>
          <radialGradient id="oxygenRed" cx="35%" cy="28%" r="72%">
            <stop offset="0%" stop-color="#ff6969"></stop>
            <stop offset="50%" stop-color="#f30000"></stop>
            <stop offset="100%" stop-color="#940000"></stop>
          </radialGradient>
          <radialGradient id="electronGold" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fff5b1"></stop>
            <stop offset="55%" stop-color="#ffd256"></stop>
            <stop offset="100%" stop-color="#a36d1c"></stop>
          </radialGradient>
          <radialGradient id="protonPearl" cx="34%" cy="27%" r="76%">
            <stop offset="0%" stop-color="#ffffff"></stop>
            <stop offset="65%" stop-color="#eaffff"></stop>
            <stop offset="100%" stop-color="#aac8cb"></stop>
          </radialGradient>
          <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"></feDropShadow>
          </filter>
          <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.5" result="glow"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="glow"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
          <symbol id="electronSymbol" viewBox="-18 -18 36 36">
            <circle r="16" fill="url(#electronGold)"></circle>
            <text class="charge minus" y="-1" fill="#111111">-</text>
          </symbol>
          <symbol id="protonSymbol" viewBox="-18 -18 36 36">
            <circle r="16" fill="url(#protonPearl)"></circle>
            <text class="charge" y="1" fill="#111111">+</text>
          </symbol>
        </defs>

        <rect x="0" y="0" width="974" height="720" fill="#ffffff"></rect>

        <g id="reactor">
          <rect class="component-shell" x="236" y="200" width="141" height="413"></rect>
          <rect class="component-shell" x="623" y="200" width="142" height="413"></rect>

          <rect class="gas-channel" x="147" y="238" width="230" height="62"></rect>
          <rect class="gas-channel" x="306" y="300" width="71" height="215"></rect>
          <rect class="gas-channel" x="147" y="515" width="230" height="60"></rect>

          <rect class="gas-channel" x="623" y="238" width="230" height="62"></rect>
          <rect class="gas-channel" x="623" y="300" width="72" height="214"></rect>
          <rect class="gas-channel" x="623" y="514" width="230" height="61"></rect>

          <rect class="electrode" x="377" y="222" width="70" height="369"></rect>
          <rect class="membrane" x="447" y="204" width="106" height="405"></rect>
          <rect class="electrode" x="553" y="222" width="70" height="369"></rect>

          <rect class="zone-highlight anode-highlight" x="383" y="229" width="58" height="355" rx="8"></rect>
          <rect class="zone-highlight membrane-highlight" x="455" y="212" width="90" height="389" rx="8"></rect>
          <rect class="zone-highlight cathode-highlight" x="559" y="229" width="58" height="355" rx="8"></rect>
        </g>

        <g id="wireSystem">
          <path class="wire" d="M 412 222 L 412 94 L 448 94"></path>
          <path class="wire" d="M 553 94 L 588 94 L 588 222"></path>
          <path d="M 448 94 L 468 62 L 484 151 L 505 62 L 521 151 L 542 62 L 562 94" fill="#fff200" stroke="#111111" stroke-width="4" stroke-linejoin="round"></path>
          <path id="currentTrack" class="wire-flow" d="M 412 238 L 412 106 L 448 106 L 468 74 L 484 139 L 505 74 L 521 139 L 542 74 L 562 106 L 588 106 L 588 222"></path>
        </g>

        <g class="diagram-labels">
          <text class="label" x="424" y="30">Electric power</text>
          <text class="label" x="34" y="269">Hydrogen</text>
          <text class="label" x="859" y="269">Oxygen</text>
          <text class="small-label" x="34" y="532">Unused</text>
          <text class="small-label" x="34" y="565">hydrogen</text>
          <text class="label" x="859" y="543">Water</text>
        </g>

        <g class="callouts">
          <path class="caption-line" d="M 411 579 L 388 638"></path>
          <path class="caption-line" d="M 500 602 L 500 636"></path>
          <path class="caption-line" d="M 588 579 L 628 638"></path>
          <text class="part-label" x="391" y="660">Anode</text>
          <text class="part-label" x="501" y="653">Proton</text>
          <text class="part-label" x="501" y="683">exchange</text>
          <text class="part-label" x="501" y="713">membrane</text>
          <text class="part-label" x="645" y="660">Cathode</text>
        </g>

        <g id="flowArrows">
          <path class="feed-arrow" d="M 154 269 L 184 269"></path>
          <path class="flow-arrow" d="M 320 271 C 344 269 345 284 343 311"></path>
          <path class="flow-arrow" d="M 343 325 L 449 328"></path>
          <path class="flow-arrow" d="M 343 451 L 449 452"></path>
          <path class="flow-arrow" d="M 401 325 C 407 316 407 304 407 293"></path>
          <path class="flow-arrow" d="M 401 450 C 407 441 407 429 407 418"></path>
          <path class="flow-arrow" d="M 485 328 L 540 328"></path>
          <path class="flow-arrow" d="M 485 452 L 540 452"></path>
          <path class="feed-arrow" d="M 834 269 L 720 269"></path>
          <path class="flow-arrow" d="M 661 457 L 661 501"></path>
          <path class="flow-arrow product-arrow" d="M 724 543 L 758 543"></path>
          <path class="flow-arrow product-arrow" d="M 337 543 L 195 543"></path>
        </g>

        <g class="feed-active">
          <path d="M 151 269 L 194 269" fill="none" stroke="#b7efff" stroke-width="16" stroke-linecap="round" opacity="0.45"></path>
          <path d="M 834 269 L 718 269" fill="none" stroke="#b7efff" stroke-width="12" stroke-linecap="round" opacity="0.38"></path>
        </g>

        <g id="molecules" class="bubble-shadow">
          <g class="molecule" transform="translate(199 270)">
            <circle class="h-atom" cx="0" cy="0" r="16"></circle>
            <circle class="h-atom" cx="24" cy="0" r="16"></circle>
          </g>
          <g class="molecule" transform="translate(282 271)">
            <circle class="h-atom" cx="0" cy="0" r="16"></circle>
            <circle class="h-atom" cx="24" cy="0" r="16"></circle>
          </g>
          <g class="molecule split-dot" transform="translate(329 328)">
            <circle class="h-atom" cx="0" cy="0" r="16"></circle>
            <circle class="h-atom" cx="24" cy="0" r="16"></circle>
          </g>
          <g class="molecule" transform="translate(329 452)">
            <circle class="h-atom" cx="0" cy="0" r="16"></circle>
            <circle class="h-atom" cx="24" cy="0" r="16"></circle>
          </g>
          <g class="molecule" transform="translate(323 543)">
            <circle class="h-atom" cx="0" cy="0" r="16"></circle>
            <circle class="h-atom" cx="24" cy="0" r="16"></circle>
          </g>
          <g class="molecule" transform="translate(665 267)">
            <circle class="o-atom" cx="0" cy="0" r="22"></circle>
            <circle class="o-atom" cx="28" cy="0" r="22"></circle>
          </g>
          <g class="molecule" transform="translate(793 267)">
            <circle class="o-atom" cx="0" cy="0" r="22"></circle>
            <circle class="o-atom" cx="28" cy="0" r="22"></circle>
          </g>
          <g class="molecule water-pop" transform="translate(666 529)">
            <circle class="h-atom" cx="-18" cy="12" r="16"></circle>
            <circle class="h-atom" cx="20" cy="12" r="16"></circle>
            <circle class="o-atom" cx="1" cy="-4" r="23"></circle>
          </g>
          <g class="molecule" transform="translate(800 534)">
            <circle class="h-atom" cx="-18" cy="19" r="16"></circle>
            <circle class="h-atom" cx="22" cy="19" r="16"></circle>
            <circle class="o-atom" cx="4" cy="0" r="22"></circle>
          </g>
          <circle class="o-atom water-pop" cx="668" cy="371" r="22"></circle>
        </g>

        <g id="charges">
          <use class="electron" href="#electronSymbol" x="412" y="108" width="36" height="36"></use>
          <use class="electron" href="#electronSymbol" x="586" y="115" width="36" height="36"></use>

          <use class="electron" href="#electronSymbol" x="423" y="246" width="36" height="36"></use>
          <use class="electron" href="#electronSymbol" x="400" y="274" width="36" height="36"></use>
          <use class="electron" href="#electronSymbol" x="424" y="367" width="36" height="36"></use>
          <use class="electron" href="#electronSymbol" x="400" y="395" width="36" height="36"></use>

          <use class="electron" href="#electronSymbol" x="593" y="310" width="36" height="36"></use>
          <use class="electron" href="#electronSymbol" x="594" y="351" width="36" height="36"></use>
          <use class="electron" href="#electronSymbol" x="593" y="393" width="36" height="36"></use>

          <use class="proton proton-shuttle" href="#protonSymbol" x="481" y="311" width="36" height="36"></use>
          <use class="proton proton-shuttle" href="#protonSymbol" x="481" y="347" width="36" height="36" style="animation-delay: 0.2s"></use>
          <use class="proton proton-shuttle" href="#protonSymbol" x="481" y="436" width="36" height="36" style="animation-delay: 0.4s"></use>
          <use class="proton proton-shuttle" href="#protonSymbol" x="481" y="471" width="36" height="36" style="animation-delay: 0.6s"></use>
          <use class="proton" href="#protonSymbol" x="633" y="345" width="36" height="36"></use>
          <use class="proton" href="#protonSymbol" x="633" y="402" width="36" height="36"></use>
        </g>

        <g id="electronPulses">
          <circle class="electron-pulse" r="8">
            <animateMotion dur="3.2s" repeatCount="indefinite" path="M 411 240 L 411 108 L 448 108 L 468 76 L 484 139 L 505 76 L 521 139 L 542 76 L 562 108 L 588 108 L 588 223"></animateMotion>
          </circle>
          <circle class="electron-pulse" r="8" opacity="0.82">
            <animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite" path="M 411 240 L 411 108 L 448 108 L 468 76 L 484 139 L 505 76 L 521 139 L 542 76 L 562 108 L 588 108 L 588 223"></animateMotion>
          </circle>
          <circle class="electron-pulse" r="8" opacity="0.72">
            <animateMotion dur="3.2s" begin="-2.2s" repeatCount="indefinite" path="M 411 240 L 411 108 L 448 108 L 468 76 L 484 139 L 505 76 L 521 139 L 542 76 L 562 108 L 588 108 L 588 223"></animateMotion>
          </circle>
        </g>

        <g class="reaction-zone">
          <path d="M 340 320 C 370 302 389 299 415 285" fill="none" stroke="#fff36a" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"></path>
          <text x="322" y="227" fill="#111111" font-size="22" font-weight="700">H<tspan baseline-shift="sub" font-size="14">2</tspan> splits</text>
        </g>

        <g class="proton-active">
          <path d="M 461 390 L 538 390" fill="none" stroke="#fff36a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-white)" opacity="0.72"></path>
          <text x="456" y="184" fill="#111111" font-size="21" font-weight="700">H+ crosses membrane</text>
        </g>

        <g class="cathode-active">
          <path d="M 615 346 C 651 347 672 368 674 407 C 676 455 664 499 668 523" fill="none" stroke="#fff36a" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8"></path>
          <text x="637" y="618" fill="#111111" font-size="22" font-weight="700">Water forms</text>
        </g>
      </svg>
    </section>

    <section class="toolbar" aria-label="Fuel cell controls">
      <button id="playButton" type="button" aria-pressed="true">Pause cycle</button>
      <button id="stepButton" type="button">Step</button>
      <label class="slider-row">
        <span>H<sub>2</sub> feed rate</span>
        <input id="feedSlider" type="range" min="1" max="5" step="1" value="3" aria-label="Hydrogen feed rate">
        <output id="feedValue" for="feedSlider">3</output>
      </label>
      <button id="cleanToggle" class="toggle" type="button" aria-pressed="false">Clean flow</button>
      <div id="statusText" class="status" aria-live="polite">Reactants enter the fuel cell.</div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("fuelCell");
      const playButton = document.getElementById("playButton");
      const stepButton = document.getElementById("stepButton");
      const cleanToggle = document.getElementById("cleanToggle");
      const feedSlider = document.getElementById("feedSlider");
      const feedValue = document.getElementById("feedValue");
      const statusText = document.getElementById("statusText");

      const stages = [
        "Reactants enter the fuel cell.",
        "At the anode, H2 separates into protons and electrons.",
        "Protons pass through the proton exchange membrane.",
        "At the cathode, oxygen combines with protons and electrons to make water."
      ];

      let step = 0;
      let running = true;
      let timer = window.setInterval(nextStep, 1800);

      function setStep(next) {
        step = (next + stages.length) % stages.length;
        svg.dataset.step = String(step);
        statusText.textContent = stages[step];
      }

      function nextStep() {
        setStep(step + 1);
      }

      function setFeedRate(value) {
        const numeric = Number(value);
        const feedStroke = 3 + numeric * 1.45;
        const currentStroke = 2.6 + numeric * 1.25;
        document.documentElement.style.setProperty("--feed-stroke", feedStroke.toFixed(2));
        document.documentElement.style.setProperty("--current-stroke", currentStroke.toFixed(2));
        feedValue.value = String(numeric);
      }

      playButton.addEventListener("click", function () {
        running = !running;
        playButton.setAttribute("aria-pressed", String(running));
        playButton.textContent = running ? "Pause cycle" : "Run cycle";
        svg.classList.toggle("is-paused", !running);
        if (running) {
          timer = window.setInterval(nextStep, 1800);
        } else {
          window.clearInterval(timer);
        }
      });

      stepButton.addEventListener("click", function () {
        if (running) {
          running = false;
          playButton.setAttribute("aria-pressed", "false");
          playButton.textContent = "Run cycle";
          svg.classList.add("is-paused");
          window.clearInterval(timer);
        }
        nextStep();
      });

      cleanToggle.addEventListener("click", function () {
        const clean = !svg.classList.contains("clean");
        svg.classList.toggle("clean", clean);
        cleanToggle.setAttribute("aria-pressed", String(clean));
        cleanToggle.textContent = clean ? "Labeled diagram" : "Clean flow";
      });

      feedSlider.addEventListener("input", function (event) {
        setFeedRate(event.target.value);
      });

      setFeedRate(feedSlider.value);
      setStep(0);
    })();
  </script>
</body>
</html>
