<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type-I Decomposition of a Triangular Region</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #59616d;
      --paper: #ffffff;
      --page: #edf2f7;
      --panel: #f8fafc;
      --line: #d4dbe5;
      --axis: #242124;
      --blue: #27a7da;
      --blue-fill: rgba(83, 177, 211, 0.34);
      --gold-fill: rgba(247, 194, 79, 0.39);
      --red: #f0525f;
      --focus: #0f6c9e;
      --shadow: 0 18px 48px rgba(25, 34, 48, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    main {
      width: min(1220px, 100%);
      background: var(--paper);
      border: 1px solid #d7dfe9;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 1.5vw, 1.28rem);
      font-weight: 720;
      letter-spacing: 0;
    }

    .formula-chip {
      flex: 0 0 auto;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.04rem;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(292px, 350px);
      min-height: 620px;
    }

    .figure-area {
      min-width: 0;
      display: grid;
      align-items: center;
      padding: 16px;
      background: #ffffff;
    }

    .svg-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid #e4e9f0;
      border-radius: 8px;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 680px;
      height: auto;
      background: #ffffff;
      user-select: none;
    }

    .controls {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      background: #ffffff;
      padding: 12px;
    }

    .group-title {
      margin: 0 0 10px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    label {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 0.94rem;
      font-weight: 690;
    }

    label:last-child {
      margin-bottom: 0;
    }

    .field-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .field-row span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      font-style: italic;
      color: #252025;
    }

    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #bac5d3;
      border-radius: 6px;
      padding: 8px 10px;
      background: #ffffff;
      color: var(--ink);
      font: 600 1rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(15, 108, 158, 0.16);
      outline: 0;
    }

    input[aria-invalid="true"] {
      border-color: #bc2b3a;
      background: #fff7f7;
    }

    .error {
      min-height: 1.1rem;
      color: #9f1d2b;
      font-size: 0.79rem;
      line-height: 1.35;
    }

    .limits {
      display: grid;
      gap: 10px;
    }

    .limit-box {
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      background: #ffffff;
      padding: 10px;
    }

    .region-name {
      display: inline-grid;
      place-items: center;
      min-width: 2.25rem;
      min-height: 1.8rem;
      margin-right: 6px;
      border-radius: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .r1-name {
      background: rgba(83, 177, 211, 0.22);
      color: #125f80;
    }

    .r2-name {
      background: rgba(247, 194, 79, 0.28);
      color: #815617;
    }

    .limit-text {
      margin-top: 7px;
      color: #1e2530;
      font: 600 0.94rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      overflow-wrap: anywhere;
    }

    .integral {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.42;
    }

    .status {
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.42;
    }

    .math-label {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      fill: #252025;
    }

    .axis-label {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      fill: #252025;
    }

    .halo {
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .formula-chip {
        white-space: normal;
      }

      .workspace {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .controls {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main aria-label="Interactive figure for decomposing a triangular region into two Type-I regions">
    <div class="topbar">
      <h1>Triangular region R split at x = 0</h1>
      <div class="formula-chip">&#8747;&#8747;<sub>R</sub> (2x - y<sup>2</sup>) dA</div>
    </div>

    <section class="workspace">
      <div class="figure-area">
        <div class="svg-scroll">
          <svg id="plot" viewBox="0 0 900 620" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Triangular region R decomposed into R1 and R2</title>
            <desc id="svg-desc">The region has top boundary y equals 3 and lower boundaries y equals negative x plus 1 on the left and y equals x plus 1 on the right. The y-axis separates the two Type-I pieces.</desc>
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#242124"></path>
              </marker>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#243042" flood-opacity="0.15"></feDropShadow>
              </filter>
            </defs>

            <g id="fills">
              <path id="r1-fill" fill="var(--blue-fill)" stroke="none"></path>
              <path id="r2-fill" fill="var(--gold-fill)" stroke="none"></path>
            </g>

            <g id="region-lines" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path id="top-line" stroke="var(--blue)" stroke-width="6"></path>
              <path id="left-line" stroke="var(--blue)" stroke-width="6"></path>
              <path id="right-line" stroke="var(--blue)" stroke-width="6"></path>
            </g>

            <g id="strips" stroke="var(--red)" stroke-width="5" stroke-linecap="butt">
              <line id="left-strip"></line>
              <line id="right-strip"></line>
            </g>

            <g id="axes" stroke="var(--axis)" stroke-width="3" stroke-linecap="square">
              <line id="x-axis" marker-end="url(#arrow)"></line>
              <line id="y-axis" marker-end="url(#arrow)"></line>
              <line id="tick-neg2" stroke-width="3"></line>
              <line id="tick-pos2" stroke-width="3"></line>
            </g>

            <g id="markers" fill="#ffffff" stroke="#1f88b8" stroke-width="3" filter="url(#softShadow)">
              <circle id="v-left" r="5"></circle>
              <circle id="v-bottom" r="5"></circle>
              <circle id="v-right" r="5"></circle>
            </g>

            <g id="labels">
              <text id="label-y3-left" class="math-label halo" font-size="54">y = 3</text>
              <text id="label-y3-right" class="math-label halo" font-size="54">y = 3</text>
              <text id="label-left-line" class="math-label halo" font-size="44">y = -x + 1</text>
              <text id="label-right-line" class="math-label halo" font-size="44">y = x + 1</text>
              <text id="label-r1" class="math-label" font-size="52" font-weight="700">R<tspan baseline-shift="sub" font-size="30">1</tspan></text>
              <text id="label-r2" class="math-label" font-size="52" font-weight="700">R<tspan baseline-shift="sub" font-size="30">2</tspan></text>
              <text id="label-x" class="axis-label" font-size="44">x</text>
              <text id="label-y" class="axis-label" font-size="44">y</text>
              <text id="tick-label-neg2" class="math-label halo" font-size="42">-2</text>
              <text id="tick-label-zero" class="math-label halo" font-size="42">0</text>
              <text id="tick-label-pos2" class="math-label halo" font-size="42">2</text>
            </g>
          </svg>
        </div>
      </div>

      <aside class="controls" aria-label="Equation controls and integral limits">
        <section class="control-group">
          <p class="group-title">Lower boundaries</p>
          <label for="left-equation">
            R1 lower edge
            <span class="field-row"><span>y =</span><input id="left-equation" type="text" value="-x + 1" autocomplete="off" spellcheck="false" aria-describedby="left-error"></span>
          </label>
          <div id="left-error" class="error" aria-live="polite"></div>

          <label for="right-equation">
            R2 lower edge
            <span class="field-row"><span>y =</span><input id="right-equation" type="text" value="x + 1" autocomplete="off" spellcheck="false" aria-describedby="right-error"></span>
          </label>
          <div id="right-error" class="error" aria-live="polite"></div>
        </section>

        <section class="limits" aria-label="Live Type-I integral limits">
          <div class="limit-box">
            <span class="region-name r1-name">R<sub>1</sub></span>
            <div id="left-limits" class="limit-text"></div>
            <div id="left-integral" class="integral"></div>
          </div>
          <div class="limit-box">
            <span class="region-name r2-name">R<sub>2</sub></span>
            <div id="right-limits" class="limit-text"></div>
            <div id="right-integral" class="integral"></div>
          </div>
        </section>

        <section class="control-group">
          <p class="group-title">Decomposition</p>
          <div id="status" class="status" aria-live="polite"></div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const topY = 3;
      const plot = {
        left: 56,
        right: 832,
        top: 36,
        bottom: 576,
        xMin: -3.35,
        xMax: 3.35,
        yMin: -0.8,
        yMax: 4.25
      };

      const defaults = {
        left: { expr: "-x + 1", m: -1, b: 1 },
        right: { expr: "x + 1", m: 1, b: 1 }
      };

      const model = {
        left: Object.assign({}, defaults.left),
        right: Object.assign({}, defaults.right)
      };

      const el = {
        svg: document.getElementById("plot"),
        r1Fill: document.getElementById("r1-fill"),
        r2Fill: document.getElementById("r2-fill"),
        topLine: document.getElementById("top-line"),
        leftLine: document.getElementById("left-line"),
        rightLine: document.getElementById("right-line"),
        leftStrip: document.getElementById("left-strip"),
        rightStrip: document.getElementById("right-strip"),
        xAxis: document.getElementById("x-axis"),
        yAxis: document.getElementById("y-axis"),
        tickNeg2: document.getElementById("tick-neg2"),
        tickPos2: document.getElementById("tick-pos2"),
        vLeft: document.getElementById("v-left"),
        vBottom: document.getElementById("v-bottom"),
        vRight: document.getElementById("v-right"),
        labelY3Left: document.getElementById("label-y3-left"),
        labelY3Right: document.getElementById("label-y3-right"),
        labelLeftLine: document.getElementById("label-left-line"),
        labelRightLine: document.getElementById("label-right-line"),
        labelR1: document.getElementById("label-r1"),
        labelR2: document.getElementById("label-r2"),
        labelX: document.getElementById("label-x"),
        labelY: document.getElementById("label-y"),
        tickLabelNeg2: document.getElementById("tick-label-neg2"),
        tickLabelZero: document.getElementById("tick-label-zero"),
        tickLabelPos2: document.getElementById("tick-label-pos2"),
        leftInput: document.getElementById("left-equation"),
        rightInput: document.getElementById("right-equation"),
        leftError: document.getElementById("left-error"),
        rightError: document.getElementById("right-error"),
        leftLimits: document.getElementById("left-limits"),
        rightLimits: document.getElementById("right-limits"),
        leftIntegral: document.getElementById("left-integral"),
        rightIntegral: document.getElementById("right-integral"),
        status: document.getElementById("status")
      };

      function sx(x) {
        return plot.left + ((x - plot.xMin) / (plot.xMax - plot.xMin)) * (plot.right - plot.left);
      }

      function sy(y) {
        return plot.bottom - ((y - plot.yMin) / (plot.yMax - plot.yMin)) * (plot.bottom - plot.top);
      }

      function point(x, y) {
        return sx(x).toFixed(2) + " " + sy(y).toFixed(2);
      }

      function pathFrom(points) {
        return points.map(function (p, index) {
          return (index === 0 ? "M " : "L ") + point(p[0], p[1]);
        }).join(" ");
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function cleanExpression(value) {
        return String(value)
          .replace(/\u2212/g, "-")
          .replace(/\s+/g, " ")
          .trim();
      }

      function jsExpression(value) {
        return value
          .replace(/\s+/g, "")
          .replace(/X/g, "x")
          .replace(/(\d|\))x/g, "$1*x")
          .replace(/x(\d|\()/g, "x*$1");
      }

      function parseLinearExpression(raw) {
        const display = cleanExpression(raw);
        if (!display) {
          return { ok: false, message: "Enter a lower boundary in x." };
        }

        const expression = jsExpression(display);
        if (!/^[0-9x+\-*/().]+$/.test(expression)) {
          return { ok: false, message: "Use numbers, x, +, -, *, /, and parentheses." };
        }

        let fn;
        try {
          fn = new Function("x", "\"use strict\"; return (" + expression + ");");
        } catch (error) {
          return { ok: false, message: "The expression is not parseable." };
        }

        const samples = [-2, -1, 0, 1, 2].map(function (x) {
          const y = Number(fn(x));
          return { x: x, y: y };
        });

        if (samples.some(function (sample) { return !Number.isFinite(sample.y); })) {
          return { ok: false, message: "The expression must stay finite here." };
        }

        const b = Number(fn(0));
        const m = Number(fn(1)) - b;
        const linear = samples.every(function (sample) {
          return Math.abs(sample.y - (m * sample.x + b)) < 1e-7;
        });

        if (!linear) {
          return { ok: false, message: "This figure expects a linear boundary in x." };
        }

        return { ok: true, expr: display, m: m, b: b };
      }

      function yOn(line, x) {
        return line.m * x + line.b;
      }

      function topIntersection(line, side) {
        if (Math.abs(line.m) < 1e-7) {
          return side === "left" ? -2 : 2;
        }

        const root = (topY - line.b) / line.m;
        if (!Number.isFinite(root)) {
          return side === "left" ? -2 : 2;
        }

        if (side === "left") {
          return Math.min(-0.18, Math.max(plot.xMin + 0.38, root));
        }

        return Math.max(0.18, Math.min(plot.xMax - 0.38, root));
      }

      function displayNumber(value) {
        if (Math.abs(value) < 0.0005) {
          return "0";
        }
        if (Math.abs(value - Math.round(value)) < 0.0005) {
          return String(Math.round(value));
        }
        return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
      }

      function equationLabel(line) {
        const m = line.m;
        const b = line.b;
        let text = "y = ";

        if (Math.abs(m - 1) < 0.0005) {
          text += "x";
        } else if (Math.abs(m + 1) < 0.0005) {
          text += "-x";
        } else {
          text += displayNumber(m) + "x";
        }

        if (Math.abs(b) >= 0.0005) {
          text += b > 0 ? " + " + displayNumber(b) : " - " + displayNumber(Math.abs(b));
        }

        return text;
      }

      function setLine(lineEl, x1, y1, x2, y2) {
        lineEl.setAttribute("x1", sx(x1));
        lineEl.setAttribute("y1", sy(y1));
        lineEl.setAttribute("x2", sx(x2));
        lineEl.setAttribute("y2", sy(y2));
      }

      function setCircle(circle, x, y) {
        circle.setAttribute("cx", sx(x));
        circle.setAttribute("cy", sy(y));
      }

      function setTextPosition(textEl, x, y, anchor) {
        textEl.setAttribute("x", sx(x));
        textEl.setAttribute("y", sy(y));
        if (anchor) {
          textEl.setAttribute("text-anchor", anchor);
        }
      }

      function regionPath(side, xEdge, line) {
        const points = [];
        const steps = 18;

        if (side === "left") {
          points.push([xEdge, topY], [0, topY], [0, yOn(line, 0)]);
          for (let i = 1; i <= steps; i += 1) {
            const t = i / steps;
            const x = 0 + (xEdge - 0) * t;
            points.push([x, yOn(line, x)]);
          }
        } else {
          points.push([0, topY], [xEdge, topY], [xEdge, yOn(line, xEdge)]);
          for (let i = 1; i <= steps; i += 1) {
            const t = i / steps;
            const x = xEdge + (0 - xEdge) * t;
            points.push([x, yOn(line, x)]);
          }
        }

        return pathFrom(points) + " Z";
      }

      function updateLimits(leftEdge, rightEdge) {
        const leftExpr = escapeHtml(model.left.expr);
        const rightExpr = escapeHtml(model.right.expr);
        const leftX = displayNumber(leftEdge);
        const rightX = displayNumber(rightEdge);

        el.leftLimits.innerHTML = leftX + " &lt;= x &lt;= 0<br>" + leftExpr + " &lt;= y &lt;= 3";
        el.rightLimits.innerHTML = "0 &lt;= x &lt;= " + rightX + "<br>" + rightExpr + " &lt;= y &lt;= 3";

        el.leftIntegral.innerHTML = "Integral: int from " + leftX + " to 0, inner y from " + leftExpr + " to 3.";
        el.rightIntegral.innerHTML = "Integral: int from 0 to " + rightX + ", inner y from " + rightExpr + " to 3.";

        el.status.innerHTML = "The upper limit is y = 3 in both pieces. The inner lower limit switches from " +
          leftExpr + " to " + rightExpr + " at x = 0, so R is written as R1 plus R2.";
      }

      function updateAxes() {
        setLine(el.xAxis, plot.xMin + 0.05, 0, plot.xMax - 0.2, 0);
        setLine(el.yAxis, 0, plot.yMin + 0.02, 0, plot.yMax - 0.18);
        setLine(el.tickNeg2, -2, -0.02, -2, 0.22);
        setLine(el.tickPos2, 2, -0.02, 2, 0.22);

        setTextPosition(el.labelX, plot.xMax - 0.33, 0.28, "middle");
        setTextPosition(el.labelY, 0.24, plot.yMax - 0.2, "middle");
        setTextPosition(el.tickLabelNeg2, -2.12, -0.48, "middle");
        setTextPosition(el.tickLabelZero, 0.2, -0.48, "middle");
        setTextPosition(el.tickLabelPos2, 2, -0.48, "middle");
      }

      function redraw() {
        const leftEdge = topIntersection(model.left, "left");
        const rightEdge = topIntersection(model.right, "right");
        const leftMid = (leftEdge + 0) / 2;
        const rightMid = rightEdge / 2;
        const leftBottom = yOn(model.left, 0);
        const rightBottom = yOn(model.right, 0);

        el.r1Fill.setAttribute("d", regionPath("left", leftEdge, model.left));
        el.r2Fill.setAttribute("d", regionPath("right", rightEdge, model.right));

        el.topLine.setAttribute("d", pathFrom([[leftEdge, topY], [rightEdge, topY]]));
        el.leftLine.setAttribute("d", pathFrom([[leftEdge, topY], [0, leftBottom]]));
        el.rightLine.setAttribute("d", pathFrom([[0, rightBottom], [rightEdge, topY]]));

        setLine(el.leftStrip, leftMid, yOn(model.left, leftMid), leftMid, topY);
        setLine(el.rightStrip, rightMid, yOn(model.right, rightMid), rightMid, topY);

        setCircle(el.vLeft, leftEdge, topY);
        setCircle(el.vBottom, 0, (leftBottom + rightBottom) / 2);
        setCircle(el.vRight, rightEdge, topY);

        el.labelLeftLine.textContent = equationLabel(model.left);
        el.labelRightLine.textContent = equationLabel(model.right);

        setTextPosition(el.labelY3Left, Math.max(leftEdge + 0.65, -1.55), topY + 0.23, "middle");
        setTextPosition(el.labelY3Right, Math.min(rightEdge - 0.85, 1.55), topY + 0.23, "middle");
        setTextPosition(el.labelLeftLine, Math.max(plot.xMin + 0.08, leftEdge - 1.18), 1.98, "start");
        setTextPosition(el.labelRightLine, Math.min(plot.xMax - 1.62, rightEdge - 0.76), 1.98, "start");
        setTextPosition(el.labelR1, (leftEdge + 0) / 2 + 0.03, 2.34, "middle");
        setTextPosition(el.labelR2, rightEdge / 2 - 0.03, 2.34, "middle");

        updateLimits(leftEdge, rightEdge);
        updateAxes();
      }

      function handleInput(side) {
        const input = side === "left" ? el.leftInput : el.rightInput;
        const error = side === "left" ? el.leftError : el.rightError;
        const parsed = parseLinearExpression(input.value);

        if (!parsed.ok) {
          input.setAttribute("aria-invalid", "true");
          error.textContent = parsed.message;
          return;
        }

        input.setAttribute("aria-invalid", "false");
        error.textContent = "";
        model[side] = parsed;
        redraw();
      }

      el.leftInput.addEventListener("input", function () {
        handleInput("left");
      });

      el.rightInput.addEventListener("input", function () {
        handleInput("right");
      });

      redraw();
    }());
  </script>
</body>
</html>
