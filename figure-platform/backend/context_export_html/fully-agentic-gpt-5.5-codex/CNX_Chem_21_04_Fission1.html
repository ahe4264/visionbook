<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neutron-Induced Fission of Uranium-235</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #5a6470;
      --panel: #f6f8fb;
      --edge: #d7dee8;
      --accent: #1f6fb8;
      --accent-dark: #164e82;
      --proton: #6fa82e;
      --neutron: #d4d8c2;
      --neutron-edge: #8f967f;
      --energy: #f2d46a;
      --energy-soft: #f7ebbd;
      --warning: #b63123;
      --chain: #265f9e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(8px, 1.6vw, 18px);
    }

    main {
      width: min(1280px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(25, 38, 54, 0.12);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 980px;
      height: auto;
      user-select: none;
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr) minmax(320px, 0.9fr);
      gap: 12px;
      align-items: stretch;
      padding: 12px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
    }

    .button-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    input,
    output {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid #aeb8c7;
      background: #ffffff;
      color: #111827;
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover,
    button:focus-visible,
    .hotspot:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(31, 111, 184, 0.22);
      outline-offset: 2px;
    }

    .slider-box {
      min-width: 0;
      display: grid;
      grid-template-columns: max-content minmax(120px, 1fr) minmax(132px, max-content);
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid #d1dae6;
      border-radius: 6px;
      background: #ffffff;
    }

    label {
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    output {
      min-width: 132px;
      text-align: center;
      font-weight: 700;
      color: var(--accent-dark);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .info-card {
      min-height: 96px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 14px;
      align-items: start;
      padding: 10px 12px;
      border: 1px solid #d1dae6;
      border-radius: 6px;
      background: #ffffff;
    }

    .symbol-chip {
      min-width: 64px;
      padding: 9px 10px;
      border: 1px solid #c4cfdd;
      border-radius: 6px;
      background: #f8fafc;
      text-align: center;
      font-size: 1.35rem;
      line-height: 1;
      font-weight: 700;
    }

    .symbol-chip sup,
    .symbol-chip sub {
      font-size: 0.58em;
      line-height: 0;
    }

    .info-title {
      margin: 0 0 4px;
      font-weight: 700;
    }

    .info-body {
      margin: 0;
      color: #354150;
      line-height: 1.35;
      font-size: 0.96rem;
    }

    .label {
      fill: var(--ink);
      font-size: 29px;
    }

    .label-mid {
      fill: var(--ink);
      font-size: 24px;
    }

    .label-small {
      fill: var(--ink);
      font-size: 20px;
    }

    .annotation {
      fill: var(--muted);
      font-size: 18px;
    }

    .equation {
      fill: #111111;
      font-size: 27px;
    }

    .isotope-large {
      font-size: 31px;
      fill: #111111;
    }

    .isotope-small {
      font-size: 17px;
      fill: #111111;
    }

    .nucleon {
      stroke-width: 0.8;
      filter: url(#sphereShadow);
    }

    .proton {
      fill: url(#protonGrad);
      stroke: #5d8f25;
    }

    .nucleon-neutron {
      fill: url(#neutronGrad);
      stroke: #a5aa91;
    }

    .arrow {
      stroke: #070707;
      stroke-width: 3.2;
      fill: none;
      marker-end: url(#arrowHead);
    }

    .chain-arrow {
      stroke: var(--chain);
      stroke-width: 2.5;
      stroke-dasharray: 7 6;
      fill: none;
      marker-end: url(#chainHead);
    }

    .burst-line {
      stroke: #d8cfaa;
      stroke-width: 3.4;
      stroke-linecap: round;
    }

    .hotspot {
      cursor: pointer;
      outline: none;
    }

    .hit-ring {
      fill: none;
      stroke: transparent;
      stroke-width: 4;
      pointer-events: none;
    }

    .selected .hit-ring {
      stroke: var(--accent);
      filter: url(#glow);
    }

    .future {
      opacity: 0.23;
    }

    .dim {
      opacity: 0.52;
    }

    #u236Outline {
      fill: none;
      stroke: var(--warning);
      stroke-width: 3;
    }

    #energyBurst {
      fill: url(#energyGrad);
      stroke: #d2b343;
      stroke-width: 1.6;
    }

    #sequenceStatus {
      fill: var(--accent-dark);
      font-size: 18px;
      font-weight: 700;
    }

    .chain-step {
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    svg[data-chain="1"] .chain-one,
    svg[data-chain="2"] .chain-one,
    svg[data-chain="2"] .chain-two {
      opacity: 1;
      pointer-events: auto;
    }

    svg[data-stage="0"] #u236System,
    svg[data-stage="0"] #productsSystem,
    svg[data-stage="1"] #productsSystem {
      opacity: 0.23;
    }

    svg[data-stage="2"] #u235System,
    svg[data-stage="2"] #productsSystem {
      opacity: 0.38;
    }

    svg[data-stage="3"] #u235System {
      opacity: 0.48;
    }

    svg[data-stage="0"] #incomingNeutron {
      transform: translate(0, 0);
    }

    svg[data-stage="1"] #incomingNeutron {
      transform: translate(116px, 0);
    }

    svg[data-stage="2"] #incomingNeutron,
    svg[data-stage="3"] #incomingNeutron {
      opacity: 0.35;
      transform: translate(140px, 0);
    }

    #incomingNeutron {
      transition: transform 650ms ease, opacity 220ms ease;
    }

    svg[data-stage="2"] #u236System {
      animation: wobble 760ms ease-in-out infinite alternate;
    }

    svg.burst-now #krProduct {
      animation: krFly 1100ms cubic-bezier(.2,.8,.22,1);
    }

    svg.burst-now #baProduct {
      animation: baFly 1100ms cubic-bezier(.2,.8,.22,1);
    }

    svg.burst-now .released-neutron {
      animation: neutronFly 1100ms cubic-bezier(.2,.8,.22,1);
    }

    svg.burst-now #energyGroup {
      animation: energyPulse 1000ms ease-out;
    }

    @keyframes wobble {
      from { transform: translate(-3px, 0) scale(1.01, 0.99); }
      to { transform: translate(3px, 0) scale(0.99, 1.015); }
    }

    @keyframes krFly {
      from { transform: translate(-242px, 122px) scale(0.55); opacity: 0; }
      to { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes baFly {
      from { transform: translate(-260px, -112px) scale(0.55); opacity: 0; }
      to { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes neutronFly {
      from { transform: translate(-162px, 0) scale(0.55); opacity: 0; }
      to { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes energyPulse {
      0% { transform: scale(0.5); opacity: 0; }
      45% { transform: scale(1.16); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 860px) {
      body {
        place-items: start center;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .button-row {
        justify-content: start;
      }

      .slider-box {
        grid-template-columns: 1fr;
      }

      output {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="figureTitle">
    <div class="stage">
      <svg id="fissionSvg" viewBox="0 0 1280 710" data-stage="0" data-chain="0" role="img" aria-labelledby="figureTitle figureDesc">
        <title id="figureTitle">Neutron-induced fission of uranium-235</title>
        <desc id="figureDesc">A slow neutron is absorbed by uranium-235 to form unstable uranium-236, which splits into barium-141, krypton-92, three neutrons, and energy.</desc>
        <defs>

          </radialGradient>
          <radialGradient id="neutronGrad" cx="30%" cy="24%" r="74%">

            <stop offset="0.42" stop-color="#d7dac4"></stop>
            <stop offset="1" stop-color="#a8ad93"></stop>
          </radialGradient>
          <radialGradient id="energyGrad" cx="47%" cy="47%" r="62%">
            <stop offset="0" stop-color="#fff6c7"></stop>

            <stop offset="1" stop-color="#f8efce"></stop>
          </radialGradient>
          <filter id="sphereShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1.2" dy="2" stdDeviation="1.6" flood-color="#283316" flood-opacity="0.32"></feDropShadow>
          </filter>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">

          <marker id="chainHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#265f9e"></path>
          </marker>
          <clipPath id="clipU235">
            <circle cx="282" cy="225" r="91"></circle>
          </clipPath>
          <clipPath id="clipKr">

          </clipPath>
          <clipPath id="clipBa">
            <circle cx="904" cy="382" r="72"></circle>
          </clipPath>
          <clipPath id="clipU236">

          <line x1="50" y1="224" x2="160" y2="224" class="arrow"></line>
          <g id="impactLines" opacity="0.7">
            <line x1="145" y1="188" x2="170" y2="213" class="burst-line"></line>
            <line x1="138" y1="208" x2="169" y2="221" class="burst-line"></line>
            <line x1="140" y1="242" x2="170" y2="230" class="burst-line"></line>
          </g>
          <circle class="hit-ring" cx="282" cy="225" r="106"></circle>
          <g id="u235Nucleus" clip-path="url(#clipU235)"></g>

        </g>

        <g id="incomingNeutron" class="hotspot" data-info="incomingNeutron" tabindex="0" role="button" aria-label="Slow neutron">
          <circle class="hit-ring" cx="20" cy="224" r="30"></circle>

          <text x="6" y="272" class="label-small">
            <tspan x="6" dy="0">1</tspan><tspan x="6" dy="20">0</tspan><tspan x="22" dy="-10">n</tspan>
          </text>
        </g>

        <line x1="424" y1="224" x2="525" y2="224" class="arrow"></line>

        <g id="u236System" class="hotspot" data-info="u236" tabindex="0" role="button" aria-label="Unstable uranium-236 nucleus">

          <text x="611" y="430" text-anchor="middle" class="isotope-large">

        <g id="productsSystem">

          <line x1="704" y1="318" x2="818" y2="376" class="arrow"></line>

          <g id="energyGroup" class="hotspot" data-info="energy" tabindex="0" role="button" aria-label="Released energy">
            <circle class="hit-ring" cx="892" cy="236" r="74"></circle>

            <text x="1000" y="83" class="isotope-large">
              <tspan x="1000" dy="0" class="isotope-small">92</tspan><tspan class="isotope-large">Kr</tspan>
              <tspan x="1000" dy="20" class="isotope-small">36</tspan>
            </text>
          </g>

          <g id="baProduct" class="hotspot" data-info="ba141" tabindex="0" role="button" aria-label="Barium-141 product nucleus">

            <g id="baNucleus" clip-path="url(#clipBa)"></g>
            <text x="995" y="386" class="isotope-large">
              <tspan x="995" dy="0" class="isotope-small">141</tspan><tspan class="isotope-large">Ba</tspan>
              <tspan x="995" dy="22" class="isotope-small">56</tspan>
            </text>
          </g>

          <line x1="967" y1="181" x2="1032" y2="165" class="arrow"></line>
          <line x1="968" y1="238" x2="1032" y2="238" class="arrow"></line>
          <line x1="966" y1="290" x2="1032" y2="314" class="arrow"></line>

          <g id="releasedNeutrons" class="hotspot" data-info="releasedNeutron" tabindex="0" role="button" aria-label="Three released neutrons">
            <circle class="hit-ring" cx="1068" cy="238" r="96"></circle>
            <g class="released-neutron">
              <circle cx="1064" cy="160" r="20" class="nucleon nucleon-neutron"></circle>
            </g>
            <g class="released-neutron">
              <circle cx="1064" cy="238" r="20" class="nucleon nucleon-neutron"></circle>
            </g>
            <g class="released-neutron">
              <circle cx="1064" cy="316" r="20" class="nucleon nucleon-neutron"></circle>
            </g>
            <text x="1096" y="246" class="label-mid">3</text>
            <text x="1123" y="228" class="label-small">

          </g>

          <path class="chain-step chain-one chain-arrow" d="M 1088 238 C 1131 238 1150 238 1174 238"></path>
          <path class="chain-step chain-one chain-arrow" d="M 1088 316 C 1130 328 1150 342 1174 358"></path>
          <g class="chain-step chain-two">
            <g transform="translate(1212 112)">
              <circle r="33" fill="#f6fbef" stroke="#8cb36d" stroke-width="2"></circle>
              <circle cx="-13" cy="-8" r="10" class="nucleon proton"></circle>
              <circle cx="7" cy="-13" r="10" class="nucleon nucleon-neutron"></circle>
              <circle cx="13" cy="7" r="10" class="nucleon proton"></circle>
              <circle cx="-6" cy="13" r="10" class="nucleon nucleon-neutron"></circle>
              <path d="M -42 -12 L -65 -12" class="chain-arrow"></path>
              <path d="M 34 -24 L 58 -42 M 38 0 L 64 0 M 34 24 L 58 42" stroke="#265f9e" stroke-width="2" fill="none" stroke-linecap="round"></path>
            </g>
            <g transform="translate(1212 238)">
              <circle r="33" fill="#f6fbef" stroke="#8cb36d" stroke-width="2"></circle>
              <circle cx="-13" cy="-8" r="10" class="nucleon proton"></circle>
              <circle cx="7" cy="-13" r="10" class="nucleon nucleon-neutron"></circle>
              <circle cx="13" cy="7" r="10" class="nucleon proton"></circle>
              <circle cx="-6" cy="13" r="10" class="nucleon nucleon-neutron"></circle>
              <path d="M -42 0 L -65 0" class="chain-arrow"></path>
              <path d="M 34 -24 L 58 -42 M 38 0 L 64 0 M 34 24 L 58 42" stroke="#265f9e" stroke-width="2" fill="none" stroke-linecap="round"></path>
            </g>
            <g transform="translate(1212 364)">
              <circle r="33" fill="#f6fbef" stroke="#8cb36d" stroke-width="2"></circle>
              <circle cx="-13" cy="-8" r="10" class="nucleon proton"></circle>
              <circle cx="7" cy="-13" r="10" class="nucleon nucleon-neutron"></circle>
              <circle cx="13" cy="7" r="10" class="nucleon proton"></circle>

        <g id="equation">
          <text x="180" y="640" class="equation">
            <tspan baseline-shift="super" font-size="17">235</tspan><tspan baseline-shift="sub" font-size="17">92</tspan><tspan>U + </tspan>
            <tspan baseline-shift="super" font-size="17">1</tspan><tspan baseline-shift="sub" font-size="17">0</tspan><tspan>n</tspan>
          </text>
          <line x1="318" y1="627" x2="426" y2="627" class="arrow"></line>
          <text x="442" y="640" class="equation">
            <tspan baseline-shift="super" font-size="17">236</tspan><tspan baseline-shift="sub" font-size="17">92</tspan><tspan>U</tspan>
          </text>
          <line x1="520" y1="627" x2="616" y2="627" class="arrow"></line>
          <text x="635" y="640" class="equation">
            <tspan baseline-shift="super" font-size="17">141</tspan><tspan baseline-shift="sub" font-size="17">56</tspan><tspan>Ba + </tspan>
            <tspan baseline-shift="super" font-size="17">92</tspan><tspan baseline-shift="sub" font-size="17">36</tspan><tspan>Kr + 3 </tspan>
            <tspan baseline-shift="super" font-size="17">1</tspan><tspan baseline-shift="sub" font-size="17">0</tspan><tspan>n</tspan>
          </text>
        </g>

        <text id="sequenceStatus" x="22" y="690">Step 1: slow neutron approaches fissile U-235.</text>
      </svg>
    </div>

    <section class="controls" aria-label="Interactive controls">
      <div class="button-row">
        <button id="playBtn" type="button">Play sequence</button>
        <button id="nextBtn" type="button">Next step</button>
      </div>
      <div class="slider-box">
        <label for="chainSlider">Chain step</label>
        <input id="chainSlider" type="range" min="0" max="2" step="1" value="0">
        <output id="chainOutput" for="chainSlider">one fission</output>
      </div>
      <aside class="info-card" aria-live="polite">
        <div id="infoSymbol" class="symbol-chip"><sup>235</sup><sub>92</sub>U</div>
        <div>
          <p id="infoTitle" class="info-title">Uranium-235 target</p>
          <p id="infoBody" class="info-body">Atomic number 92, mass number 235. A fissile nucleus that can absorb a slow neutron and begin the fission sequence.</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("fissionSvg");
      const playBtn = document.getElementById("playBtn");
      const nextBtn = document.getElementById("nextBtn");
      const chainSlider = document.getElementById("chainSlider");
      const chainOutput = document.getElementById("chainOutput");
      const status = document.getElementById("sequenceStatus");
      const infoSymbol = document.getElementById("infoSymbol");
      const infoTitle = document.getElementById("infoTitle");
      const infoBody = document.getElementById("infoBody");

      const NS = "http://www.w3.org/2000/svg";
      let stage = 0;
      let playTimer = null;

      const stageText = [
        "Step 1: slow neutron approaches fissile U-235.",
        "Step 2: the neutron is absorbed by U-235.",
        "Step 3: unstable U-236 forms as a deformed nucleus.",
        "Step 4: fission releases Ba-141, Kr-92, three neutrons, and energy."
      ];

      const chainText = [
        "one fission",
        "three neutrons",
        "three new fissions"
      ];

      const info = {
        u235: {
          symbol: "<sup>235</sup><sub>92</sub>U",
          title: "Uranium-235 target",
          body: "Atomic number 92, mass number 235. This fissile nucleus absorbs a slow neutron and starts the fission sequence."
        },
        incomingNeutron: {
          symbol: "<sup>1</sup><sub>0</sub>n",
          title: "Slow neutron",
          body: "Atomic number 0, mass number 1. It initiates the event by being captured by U-235."
        },
        u236: {
          symbol: "<sup>236</sup><sub>92</sub>U",
          title: "Unstable uranium-236",
          body: "Atomic number 92, mass number 236. This compound nucleus is highly unstable and rapidly deforms before splitting."
        },
        kr92: {
          symbol: "<sup>92</sup><sub>36</sub>Kr",
          title: "Krypton-92 fragment",
          body: "Atomic number 36, mass number 92. One fission fragment; together with barium, it preserves the original 92 protons."
        },
        ba141: {
          symbol: "<sup>141</sup><sub>56</sub>Ba",
          title: "Barium-141 fragment",
          body: "Atomic number 56, mass number 141. A heavy fission fragment that carries away kinetic energy from the split."
        },
        releasedNeutron: {
          symbol: "3 <sup>1</sup><sub>0</sub>n",
          title: "Released neutrons",
          body: "Atomic number 0, mass number 1 each. These neutrons can strike other U-235 nuclei, sustaining a chain reaction."
        },
        energy: {
          symbol: "E",
          title: "Energy release",
          body: "Large energy output comes from the mass defect and appears mainly as fragment kinetic energy and radiation."
        }
      };

      function seeded(seed) {
        let value = seed >>> 0;
        return function () {
          value = (1664525 * value + 1013904223) >>> 0;
          return value / 4294967296;
        };
      }

      function circle(parent, cx, cy, r, className) {
        const el = document.createElementNS(NS, "circle");
        el.setAttribute("cx", cx.toFixed(1));
        el.setAttribute("cy", cy.toFixed(1));
        el.setAttribute("r", r.toFixed(1));
        el.setAttribute("class", className);
        parent.appendChild(el);
        return el;
      }

      function clusterCircle(parentId, opts) {
        const parent = document.getElementById(parentId);
        const rand = seeded(opts.seed);
        const points = [];
        for (let i = 0; i < opts.count; i += 1) {
          const angle = rand() * Math.PI * 2;
          const radius = Math.sqrt(rand()) * opts.radius;
          const jitterX = (rand() - 0.5) * opts.jitter;
          const jitterY = (rand() - 0.5) * opts.jitter;
          points.push({
            x: opts.cx + Math.cos(angle) * radius + jitterX,
            y: opts.cy + Math.sin(angle) * radius + jitterY,
            r: opts.minR + rand() * (opts.maxR - opts.minR),
            kind: rand() > opts.protonFraction ? "n" : "p"
          });
        }
        points.sort((a, b) => (a.y - b.y) || (a.x - b.x));
        points.forEach((p) => {
          circle(parent, p.x, p.y, p.r, "nucleon " + (p.kind === "p" ? "proton" : "nucleon-neutron"));
        });
      }

      function clusterDeformed(parentId, opts) {
        const parent = document.getElementById(parentId);
        const rand = seeded(opts.seed);
        const points = [];
        let guard = 0;
        while (points.length < opts.count && guard < opts.count * 80) {
          guard += 1;
          const y = (rand() * 2 - 1) * opts.height;
          const halfWidth = opts.neck + opts.bulge * Math.pow(Math.abs(y) / opts.height, 1.55);
          const cap = 1 - Math.pow(Math.abs(y) / opts.height, 5);
          const x = (rand() * 2 - 1) * halfWidth * Math.max(0.46, cap);
          if (Math.abs(x) <= halfWidth && Math.abs(y) <= opts.height) {
            points.push({
              x: opts.cx + x + (rand() - 0.5) * opts.jitter,
              y: opts.cy + y + (rand() - 0.5) * opts.jitter,
              r: opts.minR + rand() * (opts.maxR - opts.minR),
              kind: rand() > opts.protonFraction ? "n" : "p"
            });
          }
        }
        points.sort((a, b) => (a.y - b.y) || (a.x - b.x));
        points.forEach((p) => {
          circle(parent, p.x, p.y, p.r, "nucleon " + (p.kind === "p" ? "proton" : "nucleon-neutron"));
        });
      }

      function setStage(nextStage, animateBurst) {
        stage = (nextStage + stageText.length) % stageText.length;
        svg.dataset.stage = String(stage);
        status.textContent = stageText[stage];
        if (stage === 3 && animateBurst) {
          svg.classList.remove("burst-now");
          void svg.getBoundingClientRect();
          svg.classList.add("burst-now");
          window.setTimeout(() => svg.classList.remove("burst-now"), 1150);
        }
      }

      function stopPlayback() {
        if (playTimer) {
          window.clearInterval(playTimer);
          playTimer = null;
          playBtn.textContent = "Play sequence";
        }
      }

      function startPlayback() {
        stopPlayback();
        setStage(0, false);
        playBtn.textContent = "Pause";
        playTimer = window.setInterval(() => {
          const next = stage + 1;
          setStage(next, true);
          if (next >= stageText.length - 1) {
            stopPlayback();
          }
        }, 1250);
      }

      function showInfo(key, source) {
        const item = info[key] || info.u235;
        infoSymbol.innerHTML = item.symbol;
        infoTitle.textContent = item.title;
        infoBody.textContent = item.body;
        document.querySelectorAll(".hotspot.selected").forEach((el) => el.classList.remove("selected"));
        if (source) {
          source.classList.add("selected");
        }
      }

      function updateChain() {
        const value = Number(chainSlider.value);
        svg.dataset.chain = String(value);
        chainOutput.textContent = chainText[value];
      }

      clusterCircle("u235Nucleus", {
        seed: 235,
        cx: 282,
        cy: 225,
        radius: 82,
        count: 92,
        minR: 15,
        maxR: 21,
        jitter: 15,
        protonFraction: 0.47
      });

      clusterDeformed("u236Nucleus", {
        seed: 236,
        cx: 612,
        cy: 220,
        height: 154,
        neck: 30,
        bulge: 42,
        count: 94,
        minR: 14,
        maxR: 20,
        jitter: 12,
        protonFraction: 0.48
      });

      clusterCircle("krNucleus", {
        seed: 92,
        cx: 885,
        cy: 112,
        radius: 60,
        count: 46,
        minR: 14,
        maxR: 19,
        jitter: 12,
        protonFraction: 0.48
      });

      clusterCircle("baNucleus", {
        seed: 141,
        cx: 904,
        cy: 382,
        radius: 64,
        count: 55,
        minR: 14,
        maxR: 19,
        jitter: 12,
        protonFraction: 0.48
      });

      playBtn.addEventListener("click", () => {
        if (playTimer) {
          stopPlayback();
        } else {
          startPlayback();
        }
      });

      nextBtn.addEventListener("click", () => {
        stopPlayback();
        setStage(stage + 1, true);
      });

      chainSlider.addEventListener("input", updateChain);

      document.querySelectorAll(".hotspot[data-info]").forEach((el) => {
        el.addEventListener("click", () => showInfo(el.dataset.info, el));
        el.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            showInfo(el.dataset.info, el);
          }
        });
      });

      updateChain();
      setStage(0, false);
    }());
  </script>
</body>
</html>
