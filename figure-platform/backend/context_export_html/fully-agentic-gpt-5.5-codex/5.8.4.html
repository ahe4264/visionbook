<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluid Force Integral From Horizontal Strips</title>
  <style>
    :root {
      --ink: #22252b;
      --muted: #59616d;
      --paper: #ffffff;
      --panel: #f7fafc;
      --water-top: #dff5ff;
      --water-bottom: #84d8f3;
      --surface: #ffd98f;
      --surface-stroke: #2b2d32;
      --strip: #a9ded0;
      --strip-strong: #5fc8b1;
      --sample: #e85b62;
      --width: #279dd2;
      --axis: #22252b;
      --rule: #cfd8e3;
      --shadow: 0 18px 48px rgba(31, 41, 55, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #edf4f8 0%, #fafcff 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1220px, calc(100vw - 24px));
      margin: 16px auto;
    }

    .figure-shell {
      overflow: hidden;
      border: 1px solid #dbe4ec;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px 15px;
      border-bottom: 1px solid var(--rule);
      background: #fbfdff;
    }

    .control {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 720;
    }

    .control span,
    .toggle span {
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #147aa6;
    }

    .value-pill {
      min-width: 56px;
      padding: 5px 8px;
      border: 1px solid #d7e0e9;
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .toggle-row {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      justify-content: flex-end;
    }

    .toggle {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 720;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      width: 42px;
      height: 22px;
      accent-color: #147aa6;
      cursor: pointer;
    }

    button {
      min-height: 34px;
      border: 1px solid #cfd8e3;
      border-radius: 6px;
      padding: 0 12px;
      background: #ffffff;
      color: #29313b;
      font: 750 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }

    .formula-box {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid var(--rule);
      background: #ffffff;
      color: #28313b;
      font-size: 14px;
    }

    .formula {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #dfe7ef;
      border-radius: 8px;
      background: #f8fbfd;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.2;
    }

    .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      min-height: 38px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 730;
    }

    .readout span {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      border: 1px solid #dfe7ef;
      border-radius: 6px;
      padding: 4px 8px;
      background: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .svg-wrap {
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: manipulation;
      user-select: none;
    }

    .panel-frame {
      fill: #ffffff;
      stroke: #e3e9ef;
      stroke-width: 1.2;
    }

    .water {
      fill: url(#waterGrad);
    }

    .surface-shape {
      fill: var(--surface);
      stroke: var(--surface-stroke);
      stroke-width: 2.6;
      stroke-linejoin: round;
    }

    .shape-outline {
      fill: none;
      stroke: var(--surface-stroke);
      stroke-width: 2.6;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .axis,
    .bracket {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wave {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .dash-red {
      fill: none;
      stroke: var(--sample);
      stroke-width: 2.4;
      stroke-dasharray: 13 9;
      stroke-linecap: round;
    }

    .partition-line {
      fill: none;
      stroke: var(--width);
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.9;
    }

    .width-line {
      fill: none;
      stroke: var(--width);
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    .strip-poly {
      fill: var(--strip-strong);
      opacity: 0.72;
    }

    .strip-ghost {
      fill: var(--strip);
      opacity: 0.46;
      stroke: #4ea28f;
      stroke-width: 1.2;
    }

    .sample-point {
      fill: #24262b;
      stroke: #24262b;
      stroke-width: 1.5;
    }

    .math {
      fill: #23252a;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 29px;
    }

    .small-math {
      fill: #23252a;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 21px;
    }

    .tiny-label {
      fill: #48515d;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .panel-letter {
      fill: #23252a;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 34px;
    }

    .formula-card {
      fill: rgba(255, 255, 255, 0.92);
      stroke: #cfdae4;
      stroke-width: 1.2;
      filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.12));
    }

    .formula-text {
      fill: #26303a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-style: italic;
    }

    @media (max-width: 760px) {
      main {
        width: min(100vw - 10px, 460px);
        margin: 5px auto;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px;
      }

      .toggle-row {
        justify-content: space-between;
      }

      .formula-box {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .readout {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" aria-label="Interactive derivation of the fluid force integral for a submerged vertical surface">
      <div class="toolbar">
        <label class="control" for="n-slider">
          <span>strips n</span>
          <input id="n-slider" type="range" min="4" max="24" value="8" step="1">
          <output id="n-out" class="value-pill" for="n-slider">8</output>
        </label>
        <label class="control" for="k-slider">
          <span>strip k</span>
          <input id="k-slider" type="range" min="1" max="8" value="4" step="1">
          <output id="k-out" class="value-pill" for="k-slider">4</output>
        </label>
        <div class="toggle-row">
          <label class="toggle" for="single-toggle">
            <input id="single-toggle" type="checkbox" role="switch" aria-label="Toggle single animated panel">
            <span>single animated panel</span>
          </label>
          <button id="play-button" type="button">Pause</button>
        </div>
      </div>
      <div class="formula-box">
        <div class="formula">F<sub>n</sub> = &Sigma; &rho; h(x<sub>k</sub>*) w(x<sub>k</sub>*) &Delta;x<sub>k</sub></div>
        <div class="formula">F = &int;<sub>a</sub><sup>b</sup> &rho; h(x) w(x) dx</div>
        <div class="readout" aria-live="polite">
          <span id="force-out">F_n = 0.00</span>
          <span id="true-out">F = 0.00</span>
          <span id="strip-out">h = 0.00, w = 0.00</span>
        </div>
      </div>
      <div class="svg-wrap">
        <svg id="figure" viewBox="0 0 1180 760" role="img" aria-label="Three panels showing a submerged surface, horizontal partition strips, and the kth rectangular strip approximation">
          <defs>
            <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#dff5ff"></stop>
              <stop offset="100%" stop-color="#86d8f2"></stop>
            </linearGradient>
            <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
              <path d="M 0 0 L 10 0 L 5 10 z" fill="#22252b"></path>
            </marker>
            <marker id="arrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#22252b"></path>
            </marker>
          </defs>
          <g id="scene"></g>
        </svg>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("figure");
      const scene = document.getElementById("scene");
      const nSlider = document.getElementById("n-slider");
      const kSlider = document.getElementById("k-slider");
      const nOut = document.getElementById("n-out");
      const kOut = document.getElementById("k-out");
      const forceOut = document.getElementById("force-out");
      const trueOut = document.getElementById("true-out");
      const stripOut = document.getElementById("strip-out");
      const singleToggle = document.getElementById("single-toggle");
      const playButton = document.getElementById("play-button");
      const narrowQuery = window.matchMedia("(max-width: 760px)");

      const model = {
        a: 2.05,
        b: 7.85,
        maxDepth: 9.4,
        rho: 1,
        n: 8,
        k: 4,
        single: false,
        playing: true,
        animStrip: 1,
        lastFrame: 0
      };

      function el(name, attrs = {}, text = "") {
        const node = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, value);
        }
        if (text) node.textContent = text;
        return node;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function add(parent, node) {
        parent.appendChild(node);
        return node;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function fmt(value, digits = 2) {
        return Number.isFinite(value) ? value.toFixed(digits) : "0.00";
      }

      function sub(value) {
        const map = { "-": "₋", "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉", "n": "ₙ", "k": "ₖ" };
        return String(value).split("").map((char) => map[char] || char).join("");
      }

      function physicalWidth(depth) {
        const t = (depth - (model.a + model.b) / 2) / ((model.b - model.a) / 2);
        if (Math.abs(t) >= 1) return 0;
        const dome = Math.sqrt(Math.max(0, 1 - t * t));
        const asym = 0.94 + 0.17 * Math.cos(1.25 * Math.PI * t - 0.25) + 0.10 * Math.sin(2.65 * Math.PI * t + 0.35);
        return 4.05 * dome * asym;
      }

      function boundaryNorm(depth) {
        const t = (depth - (model.a + model.b) / 2) / ((model.b - model.a) / 2);
        const w = physicalWidth(depth) / 7.4;
        const center = 0.51 + 0.045 * Math.sin(1.55 * Math.PI * t - 0.6) - 0.035 * Math.sin(3.2 * Math.PI * t);
        const left = clamp(center - w * (0.91 + 0.11 * Math.sin(1.8 * Math.PI * t)), 0.04, 0.96);
        const right = clamp(center + w * (1.06 + 0.13 * Math.cos(1.35 * Math.PI * t + 0.8)), 0.04, 0.96);
        return { left, right, center: (left + right) / 2 };
      }

      function h(depth) {
        return depth;
      }

      function sampleDepth(k = model.k, n = model.n) {
        const dx = (model.b - model.a) / n;
        return model.a + (k - 0.5) * dx;
      }

      function stripBounds(k = model.k, n = model.n) {
        const dx = (model.b - model.a) / n;
        return {
          top: model.a + (k - 1) * dx,
          mid: model.a + (k - 0.5) * dx,
          bottom: model.a + k * dx,
          dx
        };
      }

      function riemann(n = model.n, through = n) {
        const dx = (model.b - model.a) / n;
        let total = 0;
        for (let i = 1; i <= through; i += 1) {
          const depth = model.a + (i - 0.5) * dx;
          total += model.rho * h(depth) * physicalWidth(depth) * dx;
        }
        return total;
      }

      function trueForce() {
        const m = 720;
        const dx = (model.b - model.a) / m;
        let sum = 0;
        for (let i = 0; i <= m; i += 1) {
          const depth = model.a + i * dx;
          const coeff = i === 0 || i === m ? 1 : (i % 2 === 0 ? 2 : 4);
          sum += coeff * model.rho * h(depth) * physicalWidth(depth);
        }
        return (dx / 3) * sum;
      }

      function layouts() {
        if (model.single) {
          if (narrowQuery.matches) {
            svg.setAttribute("viewBox", "0 0 430 650");
            return [{ x: 16, y: 14, w: 398, h: 598, mode: "single" }];
          }
          svg.setAttribute("viewBox", "0 0 1000 650");
          return [{ x: 28, y: 18, w: 944, h: 590, mode: "single" }];
        }
        if (narrowQuery.matches) {
          svg.setAttribute("viewBox", "0 0 430 1795");
          return [
            { x: 16, y: 16, w: 398, h: 560, mode: "a" },
            { x: 16, y: 610, w: 398, h: 560, mode: "b" },
            { x: 16, y: 1204, w: 398, h: 560, mode: "c" }
          ];
        }
        svg.setAttribute("viewBox", "0 0 1180 760");
        return [
          { x: 18, y: 18, w: 371, h: 570, mode: "a" },
          { x: 405, y: 18, w: 371, h: 570, mode: "b" },
          { x: 792, y: 18, w: 371, h: 570, mode: "c" }
        ];
      }

      function panelPlot(L, widerRight = false) {
        const left = narrowQuery.matches ? 72 : 60;
        const right = widerRight ? 52 : 24;
        return {
          x: L.x + left,
          y: L.y + 44,
          w: L.w - left - right,
          h: L.h - 112,
          axisX: L.x + left - 10
        };
      }

      function yOf(plot, depth) {
        return plot.y + plot.h * depth / model.maxDepth;
      }

      function xOf(plot, norm) {
        return plot.x + plot.w * norm;
      }

      function shapePoint(plot, depth, side) {
        const b = boundaryNorm(depth);
        return {
          x: xOf(plot, side === "left" ? b.left : b.right),
          y: yOf(plot, depth)
        };
      }

      function shapePath(plot) {
        const right = [];
        const left = [];
        const steps = 90;
        for (let i = 0; i <= steps; i += 1) {
          const depth = model.a + (model.b - model.a) * i / steps;
          right.push(shapePoint(plot, depth, "right"));
          left.push(shapePoint(plot, depth, "left"));
        }
        const pts = right.concat(left.reverse());
        return pts.map((p, i) => `${i === 0 ? "M" : "L"} ${fmt(p.x)} ${fmt(p.y)}`).join(" ") + " Z";
      }

      function stripPolyPath(plot, top, bottom) {
        const p1 = shapePoint(plot, top, "left");
        const p2 = shapePoint(plot, top, "right");
        const p3 = shapePoint(plot, bottom, "right");
        const p4 = shapePoint(plot, bottom, "left");
        return `M ${fmt(p1.x)} ${fmt(p1.y)} L ${fmt(p2.x)} ${fmt(p2.y)} L ${fmt(p3.x)} ${fmt(p3.y)} L ${fmt(p4.x)} ${fmt(p4.y)} Z`;
      }

      function approxRectPath(plot, top, mid, bottom) {
        const l = shapePoint(plot, mid, "left").x;
        const r = shapePoint(plot, mid, "right").x;
        const y0 = yOf(plot, top);
        const y1 = yOf(plot, bottom);
        return `M ${fmt(l)} ${fmt(y0)} L ${fmt(r)} ${fmt(y0)} L ${fmt(r)} ${fmt(y1)} L ${fmt(l)} ${fmt(y1)} Z`;
      }

      function addText(parent, text, x, y, cls = "math", anchor = "middle") {
        return add(parent, el("text", { x: fmt(x), y: fmt(y), class: cls, "text-anchor": anchor }, text));
      }

      function addLine(parent, x1, y1, x2, y2, cls, attrs = {}) {
        return add(parent, el("line", { x1: fmt(x1), y1: fmt(y1), x2: fmt(x2), y2: fmt(y2), class: cls, ...attrs }));
      }

      function waterWavePath(plot) {
        let d = `M ${fmt(plot.x)} ${fmt(plot.y)}`;
        const amp = 4.8;
        const step = 16;
        for (let x = plot.x; x < plot.x + plot.w - step; x += step) {
          d += ` q ${fmt(step / 4)} ${fmt(amp)} ${fmt(step / 2)} 0`;
          d += ` q ${fmt(step / 4)} ${fmt(-amp)} ${fmt(step / 2)} 0`;
        }
        return d;
      }

      function drawCommonPanel(parent, L, letter, widerRight = false) {
        const plot = panelPlot(L, widerRight);
        add(parent, el("rect", { x: L.x, y: L.y, width: L.w, height: L.h, rx: 7, class: "panel-frame" }));
        add(parent, el("rect", { x: plot.x, y: plot.y, width: plot.w, height: plot.h, class: "water" }));
        add(parent, el("path", { d: waterWavePath(plot), class: "wave" }));
        add(parent, el("line", {
          x1: plot.axisX,
          y1: plot.y - 28,
          x2: plot.axisX,
          y2: plot.y + plot.h,
          class: "axis",
          "marker-end": "url(#arrowDown)"
        }));
        addText(parent, `(${letter})`, L.x + L.w / 2, L.y + L.h - 18, "panel-letter");
        return plot;
      }

      function drawDepthBracket(parent, x, y0, y1, label, side = "right") {
        const cap = 16;
        addLine(parent, x, y0, x, y1, "bracket", { "marker-start": "url(#arrowHead)", "marker-end": "url(#arrowHead)" });
        addLine(parent, x - cap, y0, x + cap, y0, "bracket");
        addLine(parent, x - cap, y1, x + cap, y1, "bracket");
        addText(parent, label, x + (side === "right" ? 36 : -36), (y0 + y1) / 2 + 8, "math", side === "right" ? "start" : "end");
      }

      function drawWidthBracket(parent, x0, x1, y, label) {
        addLine(parent, x0, y, x1, y, "bracket", { "marker-start": "url(#arrowHead)", "marker-end": "url(#arrowHead)" });
        addLine(parent, x0, y - 16, x0, y + 16, "bracket");
        addLine(parent, x1, y - 16, x1, y + 16, "bracket");
        addText(parent, label, (x0 + x1) / 2, y + 11, "math");
      }

      function drawPanelA(parent, L) {
        const plot = drawCommonPanel(parent, L, "a", true);
        const d = sampleDepth();
        const yA = yOf(plot, model.a);
        const yB = yOf(plot, model.b);
        const yX = yOf(plot, d);
        const left = shapePoint(plot, d, "left");
        const right = shapePoint(plot, d, "right");
        const topTouch = shapePoint(plot, model.a, "right");
        const bottomTouch = shapePoint(plot, model.b, "left");

        addLine(parent, plot.axisX, yA, topTouch.x + 24, yA, "dash-red");
        addLine(parent, plot.axisX, yB, bottomTouch.x + 56, yB, "dash-red");
        add(parent, el("path", { d: shapePath(plot), class: "surface-shape" }));
        addLine(parent, left.x, yX, right.x, yX, "width-line");
        add(parent, el("circle", { cx: fmt(left.x), cy: fmt(yX), r: 7, class: "sample-point" }));
        add(parent, el("circle", { cx: fmt(right.x), cy: fmt(yX), r: 7, class: "sample-point" }));
        addText(parent, "a", plot.axisX - 28, yA + 8, "math", "end");
        addText(parent, "x", plot.axisX - 28, yX + 9, "math", "end");
        addText(parent, "b", plot.axisX - 28, yB + 8, "math", "end");
        addLine(parent, plot.axisX, yX, plot.axisX + 20, yX, "axis");
        addText(parent, "w(x)", (left.x + right.x) / 2, yX - 22, "math");
        drawDepthBracket(parent, plot.x + plot.w - 24, plot.y, yX, "h(x)");
      }

      function drawPanelB(parent, L) {
        const plot = drawCommonPanel(parent, L, "b", false);
        const shapeD = shapePath(plot);
        const selected = stripBounds();
        const yA = yOf(plot, model.a);
        const yB = yOf(plot, model.b);

        add(parent, el("path", { d: shapeD, class: "surface-shape" }));
        add(parent, el("path", { d: stripPolyPath(plot, selected.top, selected.bottom), class: "strip-poly" }));
        add(parent, el("path", { d: shapeD, class: "shape-outline" }));

        for (let i = 0; i <= model.n; i += 1) {
          const depth = model.a + (model.b - model.a) * i / model.n;
          const y = yOf(plot, depth);
          const left = shapePoint(plot, depth, "left");
          const right = shapePoint(plot, depth, "right");
          addLine(parent, plot.axisX, y, plot.x + plot.w * 0.67, y, "dash-red");
          if (i > 0 && i < model.n) addLine(parent, left.x, y, right.x, y, "partition-line");
        }

        const labelDepths = [
          { text: "a = x₀", depth: model.a, size: "small-math" },
          { text: "x₁", depth: model.a + (model.b - model.a) / model.n, size: "small-math" },
          { text: "x₂", depth: model.a + 2 * (model.b - model.a) / model.n, size: "small-math" },
          { text: "x₃", depth: model.a + 3 * (model.b - model.a) / model.n, size: "small-math" },
          { text: "...", depth: model.a + 0.62 * (model.b - model.a), size: "math" },
          { text: "xₙ₋₁", depth: model.a + (model.n - 1) * (model.b - model.a) / model.n, size: "small-math" },
          { text: "b = xₙ", depth: model.b, size: "small-math" }
        ];
        labelDepths.forEach((item) => {
          if (item.depth >= model.a - 0.01 && item.depth <= model.b + 0.01) {
            addText(parent, item.text, plot.axisX - 20, yOf(plot, item.depth) + 7, item.size, "end");
          }
        });

        const labX = xOf(plot, boundaryNorm(selected.mid).center);
        addText(parent, `A${sub(model.k)}`, labX, yOf(plot, selected.mid) + 10, "math");
        addText(parent, "A₁", xOf(plot, 0.55), yOf(plot, model.a + 0.5 * (model.b - model.a) / model.n) + 10, "small-math");
        if (model.n >= 3) addText(parent, "A₂", xOf(plot, 0.58), yOf(plot, model.a + 1.5 * (model.b - model.a) / model.n) + 10, "small-math");
        addText(parent, "Aₙ", xOf(plot, 0.33), yB - 18, "small-math");
        addText(parent, "...", xOf(plot, 0.55), (yA + yB) / 2 + 20, "math");
      }

      function drawPanelC(parent, L) {
        const plot = drawCommonPanel(parent, L, "c", true);
        const s = stripBounds();
        const yA = yOf(plot, model.a);
        const yB = yOf(plot, model.b);
        const y0 = yOf(plot, s.top);
        const ym = yOf(plot, s.mid);
        const y1 = yOf(plot, s.bottom);
        const left = shapePoint(plot, s.mid, "left");
        const right = shapePoint(plot, s.mid, "right");

        add(parent, el("path", { d: shapePath(plot), class: "surface-shape" }));
        add(parent, el("path", { d: approxRectPath(plot, s.top, s.mid, s.bottom), class: "strip-ghost" }));
        addLine(parent, plot.axisX, ym, right.x + 20, ym, "dash-red");
        add(parent, el("circle", { cx: fmt(plot.axisX), cy: fmt(ym), r: 6.8, class: "sample-point" }));
        add(parent, el("circle", { cx: fmt(left.x), cy: fmt(ym), r: 6.4, class: "sample-point" }));
        add(parent, el("circle", { cx: fmt(right.x), cy: fmt(ym), r: 6.4, class: "sample-point" }));

        addText(parent, "a", plot.axisX - 21, yA + 7, "math", "end");
        addText(parent, "b", plot.axisX - 21, yB + 7, "math", "end");
        addText(parent, "xₖ*", plot.axisX - 15, ym + 7, "math", "end");
        addText(parent, "xₖ₋₁", plot.axisX + 24, y0 + 7, "small-math", "start");
        addText(parent, "xₖ", plot.axisX + 24, y1 + 7, "small-math", "start");
        addLine(parent, plot.axisX, yA, plot.axisX + 20, yA, "axis");
        addLine(parent, plot.axisX, yB, plot.axisX + 20, yB, "axis");
        addLine(parent, plot.axisX, y0, plot.axisX + 20, y0, "axis");
        addLine(parent, plot.axisX, y1, plot.axisX + 20, y1, "axis");

        drawWidthBracket(parent, left.x, right.x, Math.min(plot.y + plot.h - 25, y1 + 58), "w(xₖ*)");
        drawDepthBracket(parent, plot.x + plot.w - 24, plot.y, ym, "h(xₖ*)", "left");
        drawDepthBracket(parent, Math.min(plot.x + plot.w - 34, right.x + 45), y0, y1, "Δxₖ", "left");

        const cardW = Math.min(236, plot.w - 20);
        const cardX = plot.x + 10;
        const cardY = plot.y + plot.h - 65;
        add(parent, el("rect", { x: cardX, y: cardY, width: cardW, height: 42, rx: 7, class: "formula-card" }));
        addText(parent, `h=${fmt(s.mid)},  w=${fmt(physicalWidth(s.mid))}`, cardX + 12, cardY + 27, "tiny-label", "start");
      }

      function drawSingle(parent, L) {
        const plot = drawCommonPanel(parent, L, "", true);
        const activeK = clamp(Math.round(model.animStrip), 1, model.n);
        const partial = riemann(model.n, activeK);
        const shapeD = shapePath(plot);
        add(parent, el("path", { d: shapeD, class: "surface-shape" }));

        for (let i = 1; i <= activeK; i += 1) {
          const s = stripBounds(i, model.n);
          add(parent, el("path", {
            d: approxRectPath(plot, s.top, s.mid, s.bottom),
            class: i === activeK ? "strip-poly" : "strip-ghost"
          }));
        }
        add(parent, el("path", { d: shapeD, class: "shape-outline" }));

        for (let i = 0; i <= model.n; i += 1) {
          const depth = model.a + (model.b - model.a) * i / model.n;
          const y = yOf(plot, depth);
          addLine(parent, plot.axisX, y, plot.x + plot.w * 0.68, y, "dash-red");
          if (i > 0 && i < model.n) {
            const left = shapePoint(plot, depth, "left");
            const right = shapePoint(plot, depth, "right");
            addLine(parent, left.x, y, right.x, y, "partition-line");
          }
        }

        const s = stripBounds(activeK, model.n);
        const left = shapePoint(plot, s.mid, "left");
        const right = shapePoint(plot, s.mid, "right");
        addLine(parent, left.x, yOf(plot, s.mid), right.x, yOf(plot, s.mid), "width-line");
        add(parent, el("circle", { cx: fmt(left.x), cy: fmt(yOf(plot, s.mid)), r: 6.5, class: "sample-point" }));
        add(parent, el("circle", { cx: fmt(right.x), cy: fmt(yOf(plot, s.mid)), r: 6.5, class: "sample-point" }));
        addText(parent, `k = ${activeK}`, xOf(plot, 0.52), yOf(plot, s.mid) - 14, "math");
        drawDepthBracket(parent, plot.x + plot.w - 26, plot.y, yOf(plot, s.mid), "h(xₖ*)");

        const yA = yOf(plot, model.a);
        const yB = yOf(plot, model.b);
        addText(parent, "a", plot.axisX - 24, yA + 7, "math", "end");
        addText(parent, "b", plot.axisX - 24, yB + 7, "math", "end");
        addText(parent, "(animated construction)", L.x + L.w / 2, L.y + L.h - 18, "small-math");

        const boxW = Math.min(500, plot.w - 20);
        const boxX = plot.x + 10;
        const boxY = plot.y + 12;
        add(parent, el("rect", { x: boxX, y: boxY, width: boxW, height: 70, rx: 7, class: "formula-card" }));
        addText(parent, `S${sub(activeK)} = Σ ρ h(xₖ*) w(xₖ*) Δxₖ`, boxX + 16, boxY + 28, "formula-text", "start");
        addText(parent, `accumulated force = ${fmt(partial)} of ${fmt(riemann())}`, boxX + 16, boxY + 56, "tiny-label", "start");
      }

      function updateOutputs() {
        model.k = clamp(model.k, 1, model.n);
        nSlider.value = model.n;
        kSlider.max = model.n;
        kSlider.value = model.k;
        nOut.textContent = model.n;
        kOut.textContent = model.k;
        const s = stripBounds();
        forceOut.textContent = `F_n = ${fmt(riemann())}`;
        trueOut.textContent = `F = ${fmt(trueForce())}`;
        stripOut.textContent = `h = ${fmt(s.mid)}, w = ${fmt(physicalWidth(s.mid))}`;
        playButton.style.visibility = model.single ? "visible" : "hidden";
        playButton.textContent = model.playing ? "Pause" : "Play";
      }

      function render() {
        updateOutputs();
        clear(scene);
        const Ls = layouts();
        if (model.single) {
          drawSingle(scene, Ls[0]);
        } else {
          drawPanelA(scene, Ls[0]);
          drawPanelB(scene, Ls[1]);
          drawPanelC(scene, Ls[2]);
        }
      }

      function tick(now) {
        if (model.single && model.playing) {
          if (!model.lastFrame) model.lastFrame = now;
          const elapsed = now - model.lastFrame;
          if (elapsed > 780) {
            model.animStrip = model.animStrip >= model.n ? 1 : model.animStrip + 1;
            model.k = model.animStrip;
            model.lastFrame = now;
            render();
          }
        } else {
          model.lastFrame = now;
        }
        window.requestAnimationFrame(tick);
      }

      nSlider.addEventListener("input", () => {
        model.n = Number(nSlider.value);
        model.k = clamp(model.k, 1, model.n);
        model.animStrip = clamp(model.animStrip, 1, model.n);
        render();
      });

      kSlider.addEventListener("input", () => {
        model.k = Number(kSlider.value);
        model.animStrip = model.k;
        render();
      });

      singleToggle.addEventListener("change", () => {
        model.single = singleToggle.checked;
        model.animStrip = model.k;
        model.lastFrame = 0;
        render();
      });

      playButton.addEventListener("click", () => {
        model.playing = !model.playing;
        model.lastFrame = 0;
        render();
      });

      narrowQuery.addEventListener("change", render);
      render();
      window.requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
