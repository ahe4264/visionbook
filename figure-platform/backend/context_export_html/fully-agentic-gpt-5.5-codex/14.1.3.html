<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riemann Sum Column for a Double Integral</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee6;
      --teal: #16b3ab;
      --orange: #f59e3d;
      --orange-dark: #d97706;
      --panel: #fbfcfd;
      --blue: #2775bd;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: stretch;
      overflow: hidden;
    }

    .figure-shell {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      background: radial-gradient(circle at 42% 30%, #ffffff 0, #ffffff 46%, #f6f8fb 100%);
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    .panel {
      min-width: 0;
      border-left: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, #ffffff 8%);
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: -14px 0 38px rgba(44, 62, 80, 0.07);
      z-index: 2;
    }

    .panel h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: 0;
    }

    .formula-control {
      display: grid;
      gap: 8px;
    }

    .formula-control label,
    .metric-label {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 700;
      color: #475467;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .formula-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .formula-prefix {
      font: 700 15px/1.1 Georgia, "Times New Roman", serif;
      color: #20242a;
      white-space: nowrap;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 10px 11px;
      font: 600 14px/1.25 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      color: #172033;
      background: #ffffff;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(39, 117, 189, 0.14);
    }

    .error {
      min-height: 17px;
      font-size: 12px;
      line-height: 1.35;
      color: #b42318;
    }

    .metrics {
      display: grid;
      gap: 10px;
    }

    .metric-card {
      border: 1px solid #e0e6ef;
      border-radius: 8px;
      background: #ffffff;
      padding: 12px 12px 11px;
      display: grid;
      gap: 6px;
    }

    .metric-value {
      font: 700 18px/1.1 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      color: #172033;
      word-break: break-word;
    }

    .metric-note {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }

    .swatch-row {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      font-size: 12px;
      color: #4b5563;
      line-height: 1.35;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.12);
    }

    .swatch.orange {
      background: rgba(245, 158, 61, 0.55);
    }

    .swatch.teal {
      background: rgba(93, 196, 194, 0.38);
    }

    .swatch.grid {
      background:
        linear-gradient(90deg, transparent 45%, #aeb8c2 46% 54%, transparent 55%),
        linear-gradient(0deg, transparent 45%, #aeb8c2 46% 54%, transparent 55%),
        #edf6f5;
    }

    .button-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #273445;
      border-radius: 7px;
      padding: 8px 10px;
      font: 700 12px/1.2 inherit;
      cursor: pointer;
    }

    button:hover {
      background: #f3f6fa;
      border-color: #aeb8c2;
    }

    @media (max-width: 780px) {
      body {
        overflow: auto;
      }

      .figure-shell {
        min-height: 100vh;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(430px, 62vh) auto;
      }

      .panel {
        border-left: 0;
        border-top: 1px solid var(--line);
        box-shadow: 0 -14px 32px rgba(44, 62, 80, 0.06);
        padding: 14px 14px 16px;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric-card:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 500px) {
      .figure-shell {
        grid-template-rows: minmax(380px, 56vh) auto;
      }

      .metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive Riemann sum approximation for a double integral">
    <section class="stage">
      <canvas id="figureCanvas" aria-label="3D diagram of a surface over a gridded region with one highlighted Riemann sum column"></canvas>
    </section>

    <aside class="panel">
      <h1>Double Integral as Column Volumes</h1>

      <div class="formula-control">
        <label for="formulaInput">Integrand</label>
        <div class="formula-line">
          <span class="formula-prefix">f(x, y) =</span>
          <input id="formulaInput" type="text" value="2 - x*x - y*y" spellcheck="false" autocomplete="off">
        </div>
        <div id="formulaError" class="error" role="status" aria-live="polite"></div>
      </div>

      <div class="metrics" aria-live="polite">
        <div class="metric-card">
          <div class="metric-label">Sample point</div>
          <div class="metric-value" id="sampleMetric">(0.30, 0.20)</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Height</div>
          <div class="metric-value" id="heightMetric">1.870</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">One column volume</div>
          <div class="metric-value" id="volumeMetric">0.468</div>
        </div>
      </div>

      <p class="metric-note">
        The highlighted parallelepiped uses base area &Delta;A<sub>k</sub> and height
        f(x<sup>*</sup><sub>k</sub>, y<sup>*</sup><sub>k</sub>), so its contribution is
        f(x<sup>*</sup><sub>k</sub>, y<sup>*</sup><sub>k</sub>)&Delta;A<sub>k</sub>.
      </p>

      <div class="swatch-row"><span class="swatch orange"></span><span>representative column</span></div>
      <div class="swatch-row"><span class="swatch teal"></span><span>surface z = f(x, y)</span></div>
      <div class="swatch-row"><span class="swatch grid"></span><span>partition of the xy region</span></div>

      <div class="button-row">
        <button type="button" id="resetPoint">Reset point</button>
        <button type="button" id="resetFormula">Reset formula</button>
      </div>
    </aside>
  </main>

  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById("figureCanvas");
      const ctx = canvas.getContext("2d");
      const formulaInput = document.getElementById("formulaInput");
      const formulaError = document.getElementById("formulaError");
      const sampleMetric = document.getElementById("sampleMetric");
      const heightMetric = document.getElementById("heightMetric");
      const volumeMetric = document.getElementById("volumeMetric");
      const resetPoint = document.getElementById("resetPoint");
      const resetFormula = document.getElementById("resetFormula");

      const DEFAULT_EXPR = "2 - x*x - y*y";
      const domain = { xMin: -1.55, xMax: 1.55, yMin: -1.38, yMax: 1.38 };
      const partition = { xMin: -1.5, xMax: 1.5, yMin: -1.25, yMax: 1.25, nx: 6, ny: 5 };
      const dx = (partition.xMax - partition.xMin) / partition.nx;
      const dy = (partition.yMax - partition.yMin) / partition.ny;
      const deltaA = dx * dy;
      const regionRx = 1.46;
      const regionRy = 1.18;
      const regionPoly = buildRegionPolygon();

      let cssWidth = 900;
      let cssHeight = 620;
      let dpr = 1;
      let view = { cx: 420, cy: 395, s: 120 };
      let sample = { x: 0.3, y: 0.2 };
      let isDragging = false;
      let activeFn = compileExpression(DEFAULT_EXPR).fn;
      let activeExpr = DEFAULT_EXPR;
      let surfaceCache = [];

      function buildRegionPolygon() {
        const pts = [];
        for (let i = 0; i < 144; i += 1) {
          const t = i / 144 * Math.PI * 2;
          const ripple = 1 + 0.055 * Math.sin(2 * t + 0.35) + 0.035 * Math.cos(3 * t - 0.5);
          const x = regionRx * ripple * Math.cos(t) + 0.035 * Math.sin(2 * t);
          const y = regionRy * (1 + 0.035 * Math.cos(t - 0.25)) * ripple * Math.sin(t);
          pts.push({ x, y });
        }
        return pts;
      }

      function compileExpression(src) {
        let expr = String(src || "").trim();
        if (!expr) {
          throw new Error("Enter a formula in x and y.");
        }
        expr = expr.replace(/\^/g, "**");
        if (/[^0-9A-Za-z_\s+\-*/().,]/.test(expr)) {
          throw new Error("Use numbers, x, y, arithmetic, and functions such as sin or sqrt.");
        }
        const allowed = new Set([
          "sin", "cos", "tan", "asin", "acos", "atan", "sqrt", "abs", "exp", "log",
          "pow", "min", "max", "floor", "ceil", "round", "PI", "E", "x", "y"
        ]);
        expr = expr.replace(/\b[A-Za-z_][A-Za-z0-9_]*\b/g, function (name) {
          if (!allowed.has(name)) {
            throw new Error("Unknown symbol: " + name);
          }
          if (name === "x" || name === "y") {
            return name;
          }
          return "Math." + name;
        });
        const fn = new Function("x", "y", '"use strict"; const v = (' + expr + '); return Number.isFinite(v) ? v : NaN;');
        const probe = fn(0.2, -0.1);
        if (!Number.isFinite(probe)) {
          throw new Error("The formula did not return a finite value.");
        }
        return { fn, expr };
      }

      function f(x, y) {
        const v = activeFn(x, y);
        return Number.isFinite(v) ? v : NaN;
      }

      function zView(z) {
        if (!Number.isFinite(z)) {
          return 0;
        }
        return Math.max(-0.7, Math.min(2.75, z));
      }

      function project(x, y, z) {
        return {
          x: view.cx + view.s * (0.92 * y - 0.64 * x),
          y: view.cy + view.s * (0.36 * y + 0.62 * x - 0.74 * zView(z))
        };
      }

      function unprojectToBase(px, py) {
        const a = (px - view.cx) / view.s;
        const b = (py - view.cy) / view.s;
        const det = -0.64 * 0.36 - 0.92 * 0.62;
        return {
          x: (0.36 * a - 0.92 * b) / det,
          y: (-0.62 * a - 0.64 * b) / det
        };
      }

      function pointInRegion(x, y) {
        let inside = false;
        for (let i = 0, j = regionPoly.length - 1; i < regionPoly.length; j = i, i += 1) {
          const pi = regionPoly[i];
          const pj = regionPoly[j];
          const crosses = (pi.y > y) !== (pj.y > y);
          if (crosses) {
            const xAtY = (pj.x - pi.x) * (y - pi.y) / (pj.y - pi.y) + pi.x;
            if (x < xAtY) {
              inside = !inside;
            }
          }
        }
        return inside;
      }

      function clampToRegion(pt) {
        if (pointInRegion(pt.x, pt.y)) {
          return pt;
        }
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 44; i += 1) {
          const mid = (lo + hi) / 2;
          if (pointInRegion(pt.x * mid, pt.y * mid)) {
            lo = mid;
          } else {
            hi = mid;
          }
        }
        return { x: pt.x * lo * 0.985, y: pt.y * lo * 0.985 };
      }

      function cellForSample() {
        const ix = Math.max(0, Math.min(partition.nx - 1, Math.floor((sample.x - partition.xMin) / dx)));
        const iy = Math.max(0, Math.min(partition.ny - 1, Math.floor((sample.y - partition.yMin) / dy)));
        return {
          ix,
          iy,
          x0: partition.xMin + ix * dx,
          x1: partition.xMin + (ix + 1) * dx,
          y0: partition.yMin + iy * dy,
          y1: partition.yMin + (iy + 1) * dy
        };
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        cssWidth = Math.max(320, rect.width);
        cssHeight = Math.max(300, rect.height);
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        canvas.width = Math.round(cssWidth * dpr);
        canvas.height = Math.round(cssHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const reservedRight = cssWidth > 680 ? 118 : 38;
        view.s = Math.min((cssWidth - reservedRight) / 5.35, cssHeight / 4.85);
        view.s = Math.max(62, view.s);
        view.cx = cssWidth * (cssWidth > 680 ? 0.42 : 0.47);
        view.cy = cssHeight * (cssWidth > 680 ? 0.68 : 0.69);
        buildSurfaceCache();
        draw();
      }

      function buildSurfaceCache() {
        surfaceCache = [];
        const nx = 28;
        const ny = 24;
        for (let i = 0; i < nx; i += 1) {
          for (let j = 0; j < ny; j += 1) {
            const x0 = domain.xMin + (domain.xMax - domain.xMin) * i / nx;
            const x1 = domain.xMin + (domain.xMax - domain.xMin) * (i + 1) / nx;
            const y0 = domain.yMin + (domain.yMax - domain.yMin) * j / ny;
            const y1 = domain.yMin + (domain.yMax - domain.yMin) * (j + 1) / ny;
            const cx = (x0 + x1) / 2;
            const cy = (y0 + y1) / 2;
            const vals = [
              f(x0, y0), f(x1, y0), f(x1, y1), f(x0, y1)
            ];
            if (vals.every(Number.isFinite)) {
              surfaceCache.push({
                x0, x1, y0, y1,
                depth: project(cx, cy, vals.reduce((a, b) => a + b, 0) / 4).y,
                pts: [
                  project(x0, y0, vals[0]),
                  project(x1, y0, vals[1]),
                  project(x1, y1, vals[2]),
                  project(x0, y1, vals[3])
                ]
              });
            }
          }
        }
        surfaceCache.sort((a, b) => a.depth - b.depth);
      }

      function draw() {
        ctx.clearRect(0, 0, cssWidth, cssHeight);
        drawBackdrop();
        drawAxes(false);
        drawBasePlane();
        drawPartitionRegion();
        drawSurface();
        drawGhostColumns();
        drawColumn();
        drawAxes(true);
        drawLabels();
        updateMetrics();
      }

      function drawBackdrop() {
        const grad = ctx.createLinearGradient(0, 0, cssWidth, cssHeight);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.62, "#ffffff");
        grad.addColorStop(1, "#f3f7fb");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, cssWidth, cssHeight);
      }

      function basePlanePath() {
        const corners = [
          project(partition.xMin - 0.22, partition.yMin - 0.22, 0),
          project(partition.xMax + 0.22, partition.yMin - 0.22, 0),
          project(partition.xMax + 0.22, partition.yMax + 0.22, 0),
          project(partition.xMin - 0.22, partition.yMax + 0.22, 0)
        ];
        ctx.beginPath();
        ctx.moveTo(corners[0].x, corners[0].y);
        for (let i = 1; i < corners.length; i += 1) {
          ctx.lineTo(corners[i].x, corners[i].y);
        }
        ctx.closePath();
      }

      function drawBasePlane() {
        basePlanePath();
        ctx.fillStyle = "rgba(248, 250, 252, 0.76)";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(125, 137, 151, 0.45)";
        ctx.stroke();
      }

      function regionPath() {
        ctx.beginPath();
        regionPoly.forEach(function (pt, index) {
          const p = project(pt.x, pt.y, 0);
          if (index === 0) {
            ctx.moveTo(p.x, p.y);
          } else {
            ctx.lineTo(p.x, p.y);
          }
        });
        ctx.closePath();
      }

      function drawPartitionRegion() {
        ctx.save();
        regionPath();
        ctx.fillStyle = "rgba(202, 231, 229, 0.46)";
        ctx.fill();
        ctx.clip();

        ctx.lineWidth = 1.35;
        ctx.strokeStyle = "rgba(100, 116, 139, 0.32)";
        for (let i = 0; i <= partition.nx; i += 1) {
          const x = partition.xMin + i * dx;
          drawLine(project(x, partition.yMin, 0), project(x, partition.yMax, 0));
        }
        for (let j = 0; j <= partition.ny; j += 1) {
          const y = partition.yMin + j * dy;
          drawLine(project(partition.xMin, y, 0), project(partition.xMax, y, 0));
        }
        ctx.restore();

        regionPath();
        ctx.lineWidth = 3.25;
        ctx.strokeStyle = "rgba(14, 174, 164, 0.92)";
        ctx.stroke();
      }

      function drawSurface() {
        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        surfaceCache.forEach(function (cell) {
          ctx.beginPath();
          ctx.moveTo(cell.pts[0].x, cell.pts[0].y);
          ctx.lineTo(cell.pts[1].x, cell.pts[1].y);
          ctx.lineTo(cell.pts[2].x, cell.pts[2].y);
          ctx.lineTo(cell.pts[3].x, cell.pts[3].y);
          ctx.closePath();
          ctx.fillStyle = "rgba(106, 202, 200, 0.20)";
          ctx.fill();
        });

        ctx.lineWidth = 0.85;
        ctx.strokeStyle = "rgba(45, 146, 155, 0.20)";
        surfaceCache.forEach(function (cell, idx) {
          if (idx % 3 !== 0) {
            return;
          }
          ctx.beginPath();
          ctx.moveTo(cell.pts[0].x, cell.pts[0].y);
          for (let k = 1; k < cell.pts.length; k += 1) {
            ctx.lineTo(cell.pts[k].x, cell.pts[k].y);
          }
          ctx.closePath();
          ctx.stroke();
        });
        ctx.restore();
      }

      function drawGhostColumns() {
        const columns = [];
        for (let i = 0; i < partition.nx; i += 1) {
          for (let j = 0; j < partition.ny; j += 1) {
            const x0 = partition.xMin + i * dx;
            const x1 = x0 + dx;
            const y0 = partition.yMin + j * dy;
            const y1 = y0 + dy;
            const cx = (x0 + x1) / 2;
            const cy = (y0 + y1) / 2;
            if (!pointInRegion(cx, cy)) {
              continue;
            }
            const height = f(cx, cy);
            if (!Number.isFinite(height)) {
              continue;
            }
            columns.push({ x0, x1, y0, y1, height, depth: project(cx, cy, 0).y });
          }
        }
        columns.sort((a, b) => a.depth - b.depth);
        columns.forEach(function (col) {
          drawPrism(col.x0, col.x1, col.y0, col.y1, col.height, {
            side: "rgba(111, 126, 140, 0.075)",
            top: "rgba(111, 126, 140, 0.10)",
            stroke: "rgba(111, 126, 140, 0.12)",
            lineWidth: 0.8
          });
        });
      }

      function drawColumn() {
        const cell = cellForSample();
        const height = f(sample.x, sample.y);
        drawPrism(cell.x0, cell.x1, cell.y0, cell.y1, height, {
          side: "rgba(245, 158, 61, 0.44)",
          top: "rgba(250, 204, 110, 0.62)",
          stroke: "rgba(195, 109, 28, 0.76)",
          lineWidth: 1.55
        });

        const base = project(sample.x, sample.y, 0);
        const top = project(sample.x, sample.y, height);
        ctx.save();
        ctx.setLineDash([7, 6]);
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = "rgba(231, 84, 45, 0.82)";
        drawLine(base, top);
        ctx.restore();
        drawPoint(base, 6.7, "#ef6a3a", "#ffffff", 2.4);
        drawPoint(top, 6.4, "#ef6a3a", "#ffffff", 2.2);
      }

      function drawPrism(x0, x1, y0, y1, height, style) {
        const h = zView(height);
        const bottom = [
          { x: x0, y: y0, z: 0 },
          { x: x1, y: y0, z: 0 },
          { x: x1, y: y1, z: 0 },
          { x: x0, y: y1, z: 0 }
        ];
        const top = bottom.map(function (p) {
          return { x: p.x, y: p.y, z: h };
        });
        const faces = [
          { pts: [bottom[0], bottom[1], top[1], top[0]], fill: style.side },
          { pts: [bottom[1], bottom[2], top[2], top[1]], fill: style.side },
          { pts: [bottom[2], bottom[3], top[3], top[2]], fill: style.side },
          { pts: [bottom[3], bottom[0], top[0], top[3]], fill: style.side },
          { pts: top, fill: style.top }
        ];
        faces
          .map(function (face) {
            const depth = face.pts.reduce(function (sum, p) {
              return sum + project(p.x, p.y, p.z).y;
            }, 0) / face.pts.length;
            return { face, depth };
          })
          .sort(function (a, b) { return a.depth - b.depth; })
          .forEach(function (entry) {
            const pts = entry.face.pts.map(function (p) { return project(p.x, p.y, p.z); });
            drawPolygon(pts, entry.face.fill, style.stroke, style.lineWidth);
          });
      }

      function drawAxes(frontPass) {
        const origin = project(partition.xMin - 0.35, partition.yMin - 0.35, 0);
        const xEnd = project(partition.xMax + 0.42, partition.yMin - 0.35, 0);
        const yEnd = project(partition.xMin - 0.35, partition.yMax + 0.58, 0);
        const zEnd = project(partition.xMin - 0.35, partition.yMin - 0.35, 2.72);

        ctx.save();
        ctx.lineWidth = frontPass ? 2.4 : 1.6;
        ctx.strokeStyle = frontPass ? "rgba(35, 35, 38, 0.92)" : "rgba(35, 35, 38, 0.34)";
        ctx.fillStyle = ctx.strokeStyle;
        drawArrow(origin, xEnd, 11);
        drawArrow(origin, yEnd, 11);
        drawArrow(origin, zEnd, 11);
        if (frontPass) {
          drawAxisLabel("x", xEnd.x - 15, xEnd.y + 25);
          drawAxisLabel("y", yEnd.x + 20, yEnd.y + 1);
          drawAxisLabel("z", zEnd.x + 14, zEnd.y - 9);
        }
        ctx.restore();
      }

      function drawLabels() {
        const height = f(sample.x, sample.y);
        const cell = cellForSample();
        const top = project(sample.x, sample.y, height);
        const base = project(sample.x, sample.y, 0);
        const midHeight = project(sample.x, sample.y, height * 0.52);
        const baseCorner = project(cell.x0, cell.y0, 0);
        const sideAnchor = project(cell.x1, (cell.y0 + cell.y1) / 2, height * 0.38);

        drawFormulaTitle();

        const mobile = cssWidth < 560;
        const rightX = mobile ? cssWidth - 118 : cssWidth - 166;
        drawCallout(["Height", "f(x*_k, y*_k)"], midHeight, rightX, cssHeight * (mobile ? 0.33 : 0.32));
        drawCallout(["Volume", "f(x*_k,y*_k) " + String.fromCharCode(0x0394) + "A_k"], sideAnchor, rightX, cssHeight * (mobile ? 0.60 : 0.61));
        drawCallout(["Area " + String.fromCharCode(0x0394) + "A_k"], baseCorner, cssWidth * (mobile ? 0.25 : 0.25), cssHeight - 52);
        drawCallout(["(x*_k, y*_k)"], base, cssWidth * (mobile ? 0.66 : 0.58), cssHeight - 38);

        drawTinyTag(formatNumber(height), top.x + 22, top.y - 21, "#ef6a3a");
      }

      function drawFormulaTitle() {
        ctx.save();
        ctx.font = "italic 700 " + Math.max(22, Math.min(42, cssWidth * 0.038)) + "px Georgia, 'Times New Roman', serif";
        ctx.fillStyle = "rgba(32, 34, 38, 0.92)";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const x = cssWidth * (cssWidth > 680 ? 0.62 : 0.56);
        const y = Math.max(34, cssHeight * 0.085);
        ctx.fillText("z = f(x, y)", x, y);
        ctx.restore();
      }

      function drawCallout(lines, anchor, boxX, boxY) {
        ctx.save();
        const fontSize = Math.max(12, Math.min(19, cssWidth * 0.021));
        ctx.font = "700 " + fontSize + "px Inter, ui-sans-serif, system-ui, sans-serif";
        const paddingX = 10;
        const paddingY = 7;
        const lineHeight = fontSize * 1.2;
        let width = 0;
        lines.forEach(function (line) {
          width = Math.max(width, ctx.measureText(line).width);
        });
        width += paddingX * 2;
        const height = lines.length * lineHeight + paddingY * 2;
        const x = clamp(boxX - width / 2, 7, cssWidth - width - 7);
        const y = clamp(boxY - height / 2, 7, cssHeight - height - 7);
        const attach = { x: x + (anchor.x < x ? 0 : anchor.x > x + width ? width : width / 2), y: y + height / 2 };

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(31, 41, 51, 0.85)";
        ctx.fillStyle = "rgba(31, 41, 51, 0.85)";
        drawArrow(attach, anchor, 8);

        roundedRect(x, y, width, height, 7);
        ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(123, 137, 151, 0.34)";
        ctx.stroke();
        ctx.fillStyle = "#22252a";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        lines.forEach(function (line, index) {
          ctx.fillText(line, x + width / 2, y + paddingY + lineHeight * (index + 0.52));
        });
        ctx.restore();
      }

      function drawTinyTag(text, x, y, color) {
        ctx.save();
        ctx.font = "700 12px ui-monospace, SFMono-Regular, Consolas, monospace";
        const width = ctx.measureText(text).width + 12;
        const height = 21;
        x = clamp(x, 6, cssWidth - width - 6);
        y = clamp(y, 6, cssHeight - height - 6);
        roundedRect(x, y, width, height, 6);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.3;
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, x + width / 2, y + height / 2 + 0.5);
        ctx.restore();
      }

      function drawAxisLabel(label, x, y) {
        ctx.save();
        ctx.font = "italic 700 25px Georgia, 'Times New Roman', serif";
        ctx.fillStyle = "rgba(32, 34, 38, 0.95)";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y);
        ctx.restore();
      }

      function drawPolygon(points, fill, stroke, lineWidth) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i += 1) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth || 1;
          ctx.stroke();
        }
      }

      function drawLine(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawArrow(a, b, size) {
        drawLine(a, b);
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - size * Math.cos(angle - Math.PI / 6), b.y - size * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(b.x - size * Math.cos(angle + Math.PI / 6), b.y - size * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }

      function drawPoint(p, radius, fill, stroke, strokeWidth) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = strokeWidth || 1;
        ctx.strokeStyle = stroke || "#ffffff";
        ctx.stroke();
        ctx.restore();
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatNumber(v) {
        if (!Number.isFinite(v)) {
          return "n/a";
        }
        const abs = Math.abs(v);
        if (abs >= 100 || (abs > 0 && abs < 0.01)) {
          return v.toExponential(2);
        }
        return v.toFixed(3);
      }

      function updateMetrics() {
        const height = f(sample.x, sample.y);
        const volume = height * deltaA;
        sampleMetric.textContent = "(" + sample.x.toFixed(2) + ", " + sample.y.toFixed(2) + ")";
        heightMetric.textContent = formatNumber(height);
        volumeMetric.textContent = formatNumber(volume);
      }

      function setSampleFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        sample = clampToRegion(unprojectToBase(px, py));
        draw();
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function hitSample(event) {
        const p = canvasPoint(event);
        const base = project(sample.x, sample.y, 0);
        const top = project(sample.x, sample.y, f(sample.x, sample.y));
        const db = Math.hypot(p.x - base.x, p.y - base.y);
        const dt = Math.hypot(p.x - top.x, p.y - top.y);
        const planePt = unprojectToBase(p.x, p.y);
        return db < 28 || dt < 28 || pointInRegion(planePt.x, planePt.y);
      }

      canvas.addEventListener("pointerdown", function (event) {
        if (!hitSample(event)) {
          return;
        }
        event.preventDefault();
        isDragging = true;
        canvas.classList.add("dragging");
        canvas.setPointerCapture(event.pointerId);
        setSampleFromEvent(event);
      });

      canvas.addEventListener("pointermove", function (event) {
        if (isDragging) {
          event.preventDefault();
          setSampleFromEvent(event);
          return;
        }
        canvas.style.cursor = hitSample(event) ? "grab" : "default";
      });

      function endDrag(event) {
        if (!isDragging) {
          return;
        }
        isDragging = false;
        canvas.classList.remove("dragging");
        try {
          canvas.releasePointerCapture(event.pointerId);
        } catch (err) {
          // Pointer capture may already be released by the browser.
        }
      }

      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);

      formulaInput.addEventListener("input", function () {
        try {
          const compiled = compileExpression(formulaInput.value);
          activeFn = compiled.fn;
          activeExpr = formulaInput.value;
          formulaError.textContent = "";
          formulaInput.removeAttribute("aria-invalid");
          buildSurfaceCache();
          draw();
        } catch (err) {
          formulaError.textContent = err.message;
          formulaInput.setAttribute("aria-invalid", "true");
        }
      });

      resetPoint.addEventListener("click", function () {
        sample = { x: 0.3, y: 0.2 };
        draw();
      });

      resetFormula.addEventListener("click", function () {
        formulaInput.value = DEFAULT_EXPR;
        try {
          const compiled = compileExpression(DEFAULT_EXPR);
          activeFn = compiled.fn;
          activeExpr = DEFAULT_EXPR;
          formulaError.textContent = "";
          formulaInput.removeAttribute("aria-invalid");
          buildSurfaceCache();
          draw();
        } catch (err) {
          formulaError.textContent = err.message;
        }
      });

      window.addEventListener("resize", resize);

      const ro = new ResizeObserver(resize);
      ro.observe(canvas);

      try {
        const compiled = compileExpression(activeExpr);
        activeFn = compiled.fn;
      } catch (err) {
        activeFn = function (x, y) { return 2 - x * x - y * y; };
      }
      resize();
    }());
  </script>
</body>
</html>
