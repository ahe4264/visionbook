<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electron Double-Slit Interference</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #111111;
      --muted: #5a626d;
      --panel: #f3f6f9;
      --line: #cdd5df;
      --gold: #e7b714;
      --gold-deep: #c99b00;
      --wall: #8a8d90;
      --wall-dark: #6f7376;
      --screen: #030303;
      --control: #1f6f8b;
      --control-dark: #14516a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e9eef3;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 318px;
    }

    main {
      min-width: 0;
      min-height: 100vh;
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .figure-shell {
      width: min(100%, 1160px);
      aspect-ratio: 1284 / 979;
      background: var(--paper);
      border: 1px solid #ccd3dc;
      box-shadow: 0 18px 42px rgba(31, 39, 48, 0.16);
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: #ffffff;
    }

    aside {
      min-height: 100vh;
      padding: 18px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: 0;
    }

    .subhead {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.38;
    }

    .control-group {
      display: grid;
      gap: 12px;
    }

    .control {
      display: grid;
      gap: 7px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    label,
    .label {
      color: #20262d;
      font-size: 13px;
      font-weight: 690;
    }

    .readout {
      min-width: 62px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--control);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      background: #dfe6ee;
      border: 1px solid #c6d0da;
      border-radius: 8px;
    }

    .segmented button,
    .icon-button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      color: #23313b;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .segmented button[aria-pressed="true"],
    .icon-button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--control);
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.15);
    }

    .icon-button {
      width: 100%;
      background: #ffffff;
      border: 1px solid #c7d0da;
    }

    .icon-button:focus-visible,
    .segmented button:focus-visible,
    input[type="range"]:focus-visible {
      outline: 3px solid rgba(31, 111, 139, 0.28);
      outline-offset: 2px;
    }

    .note {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .panel-title {
      font-size: 30px;
      font-weight: 560;
      fill: #000000;
    }

    .source-label {
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
      fill: #000000;
    }

    .small-label {
      font-size: 18px;
      font-weight: 720;
      fill: #111111;
    }

    .screen-label {
      font-size: 15px;
      font-weight: 700;
      fill: #343434;
    }

    .wave-line {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3.2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .travel-line {
      fill: none;
      stroke: rgba(231, 183, 20, 0.78);
      stroke-width: 2.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .slit-line {
      stroke: #ffffff;
      stroke-width: 4;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .particle {
      fill: var(--gold);
      stroke: #d4a30b;
      stroke-width: 0.35;
      vector-effect: non-scaling-stroke;
    }

    .wall-face {
      fill: var(--wall);
    }

    .wall-side {
      fill: var(--wall-dark);
    }

    .screen-face {
      fill: var(--screen);
    }

    .model-hidden {
      display: none;
    }

    .model-muted {
      opacity: 0.18;
    }

    @media (max-width: 920px) {
      body {
        grid-template-columns: 1fr;
      }

      aside {
        min-height: auto;
        border-left: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        min-height: auto;
        padding: 10px;
      }

      .figure-shell {
        width: 100%;
      }
    }

    @media (max-width: 700px) {
      main {
        place-items: start;
        overflow-x: auto;
      }

      .figure-shell {
        width: 760px;
        max-width: none;
      }
    }

    @media (max-width: 540px) {
      aside {
        padding: 14px;
        gap: 12px;
      }

      h1 {
        font-size: 16px;
      }

      .subhead,
      .note {
        font-size: 12px;
      }

      .segmented button,
      .icon-button {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="figure-shell" aria-label="Interactive electron double-slit figure">
      <svg id="figure" viewBox="0 0 1284 979" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Electron wave-particle duality through a double slit</title>
        <desc id="svgDesc">Panel a shows waves from two slits interfering on a black detector screen. Panel b shows electron dots accumulating over time into the same interference bands.</desc>
        <defs>
          <clipPath id="topWaveClip">
            <polygon points="392,90 890,18 890,328 392,266"></polygon>
          </clipPath>
          <clipPath id="incidentWaveClip">
            <polygon points="205,48 392,28 392,374 205,290"></polygon>
          </clipPath>
          <clipPath id="topScreenClip">
            <polygon id="topScreenClipShape" points="889,24 987,30 987,374 889,319"></polygon>
          </clipPath>
          <clipPath id="flightClip">
            <polygon points="391,535 650,515 650,815 391,786"></polygon>
          </clipPath>
          <clipPath id="screenClip1">
            <polygon id="screenClipShape1" points="657,492 856,527 856,873 657,784"></polygon>
          </clipPath>
          <clipPath id="screenClip2">
            <polygon id="screenClipShape2" points="873,490 1071,526 1071,871 873,785"></polygon>
          </clipPath>
          <clipPath id="screenClip3">
            <polygon id="screenClipShape3" points="1086,490 1280,527 1280,871 1086,785"></polygon>
          </clipPath>
          <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.2"></feGaussianBlur>
          </filter>
          <linearGradient id="screenSheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#161616"></stop>
            <stop offset="0.45" stop-color="#000000"></stop>
            <stop offset="1" stop-color="#060606"></stop>
          </linearGradient>
        </defs>

        <rect width="1284" height="979" fill="#ffffff"></rect>

        <g id="wavePanel">
          <text class="source-label" x="144" y="172">Electron</text>
          <text class="source-label" x="144" y="196">source</text>

          <g id="incidentWaves" clip-path="url(#incidentWaveClip)"></g>

          <polygon class="wall-side" points="291,54 392,28 392,373 291,314"></polygon>
          <polygon class="wall-face" points="291,54 391,62 391,373 291,314"></polygon>
          <g id="topSlits"></g>

          <g id="diffractedWaves" clip-path="url(#topWaveClip)"></g>
          <g id="interferenceRays" clip-path="url(#topWaveClip)"></g>

          <polygon class="screen-face" points="889,24 987,30 987,374 889,319"></polygon>
          <g id="topScreenBands" clip-path="url(#topScreenClip)"></g>
          <polygon points="889,24 987,30 987,374 889,319" fill="none" stroke="#141414" stroke-width="2"></polygon>

          <text class="panel-title" x="651" y="415">(a)</text>
        </g>

        <g id="particlePanel">
          <text class="source-label" x="10" y="650">Electron</text>
          <text class="source-label" x="10" y="674">source</text>

          <g fill="var(--gold)" stroke="var(--gold-deep)" stroke-width="1">
            <path d="M122 598 L151 598 L151 588 L174 609 L151 630 L151 620 L122 620 Z"></path>
            <path d="M122 704 L151 704 L151 694 L174 715 L151 736 L151 726 L122 726 Z"></path>
          </g>

          <g id="sourceDots"></g>

          <polygon class="wall-side" points="193,494 391,527 391,871 193,784"></polygon>
          <polygon class="wall-face" points="193,494 391,527 391,871 193,784"></polygon>
          <g id="bottomSlits"></g>

          <g id="flightDots" clip-path="url(#flightClip)"></g>

          <g id="screen1">
            <polygon class="screen-face" points="657,492 856,527 856,873 657,784"></polygon>
            <g id="dots1" clip-path="url(#screenClip1)"></g>
            <polygon points="657,492 856,527 856,873 657,784" fill="none" stroke="#070707" stroke-width="2"></polygon>
          </g>
          <g id="screen2">
            <polygon class="screen-face" points="873,490 1071,526 1071,871 873,785"></polygon>
            <g id="dots2" clip-path="url(#screenClip2)"></g>
            <polygon points="873,490 1071,526 1071,871 873,785" fill="none" stroke="#070707" stroke-width="2"></polygon>
          </g>
          <g id="screen3">
            <polygon class="screen-face" points="1086,490 1280,527 1280,871 1086,785"></polygon>
            <g id="dots3" clip-path="url(#screenClip3)"></g>
            <polygon points="1086,490 1280,527 1280,871 1086,785" fill="none" stroke="#070707" stroke-width="2"></polygon>
          </g>

          <g id="timeAxis" transform="translate(0,0)">
            <line x1="738" y1="887" x2="1192" y2="887" stroke="#5b5d60" stroke-width="2"></line>
            <polygon points="1192,887 1174,879 1174,895" fill="#5b5d60"></polygon>
            <text class="small-label" x="930" y="927">Time</text>
            <circle id="timeMarker" cx="738" cy="887" r="5.5" fill="var(--gold)" stroke="#856600" stroke-width="1.5"></circle>
          </g>

          <text class="panel-title" x="651" y="972">(b)</text>
        </g>
      </svg>
    </div>
  </main>

  <aside aria-label="Figure controls">
    <div>
      <h1>Electron Double-Slit Interference</h1>
      <p class="subhead">Wavefronts and individual electron detections are linked by the same interference spacing.</p>
    </div>

    <div class="control-group">
      <div class="control">
        <div class="label">Model view</div>
        <div class="segmented" role="group" aria-label="Model view">
          <button type="button" data-view="both" aria-pressed="true">Both</button>
          <button type="button" data-view="wave" aria-pressed="false">Wave</button>
          <button type="button" data-view="particle" aria-pressed="false">Particles</button>
        </div>
      </div>

      <div class="control">
        <div class="row">
          <label for="timeSlider">Elapsed detections</label>
          <output id="timeReadout" class="readout" for="timeSlider">72%</output>
        </div>
        <input id="timeSlider" type="range" min="0" max="100" value="72" step="1">
      </div>

      <button id="playButton" class="icon-button" type="button" aria-pressed="false" aria-label="Animate elapsed detections">Play</button>

      <div class="control">
        <div class="row">
          <label for="slitSlider">Slit separation</label>
          <output id="slitReadout" class="readout" for="slitSlider">82 px</output>
        </div>
        <input id="slitSlider" type="range" min="48" max="118" value="82" step="1">
      </div>
    </div>

    <p class="note">Increasing slit separation pulls the interference fringes closer together; each dot remains a localized electron detection.</p>
  </aside>

  <script>
    (() => {
      "use strict";

      const svgNS = "http://www.w3.org/2000/svg";
      const gold = "#e7b714";
      const goldDim = "rgba(231, 183, 20, 0.52)";
      const state = {
        view: "both",
        time: 72,
        slit: 82,
        playing: false,
        raf: 0,
        lastTick: 0
      };

      const points = {
        topScreen: [[889, 24], [987, 30], [987, 374], [889, 319]],
        screen1: [[657, 492], [856, 527], [856, 873], [657, 784]],
        screen2: [[873, 490], [1071, 526], [1071, 871], [873, 785]],
        screen3: [[1086, 490], [1280, 527], [1280, 871], [1086, 785]]
      };

      const els = {
        wavePanel: document.getElementById("wavePanel"),
        particlePanel: document.getElementById("particlePanel"),
        incidentWaves: document.getElementById("incidentWaves"),
        diffractedWaves: document.getElementById("diffractedWaves"),
        interferenceRays: document.getElementById("interferenceRays"),
        topSlits: document.getElementById("topSlits"),
        bottomSlits: document.getElementById("bottomSlits"),
        topScreenBands: document.getElementById("topScreenBands"),
        sourceDots: document.getElementById("sourceDots"),
        flightDots: document.getElementById("flightDots"),
        dots1: document.getElementById("dots1"),
        dots2: document.getElementById("dots2"),
        dots3: document.getElementById("dots3"),
        timeMarker: document.getElementById("timeMarker"),
        timeSlider: document.getElementById("timeSlider"),
        slitSlider: document.getElementById("slitSlider"),
        timeReadout: document.getElementById("timeReadout"),
        slitReadout: document.getElementById("slitReadout"),
        playButton: document.getElementById("playButton"),
        viewButtons: Array.from(document.querySelectorAll("[data-view]"))
      };

      function seededRandom(seed) {
        let t = seed >>> 0;
        return () => {
          t += 0x6D2B79F5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function makeSamples(count, seed) {
        const rand = seededRandom(seed);
        return Array.from({ length: count }, (_, index) => ({
          index,
          a: rand(),
          b: rand(),
          c: rand(),
          d: rand(),
          e: rand()
        }));
      }

      const samples = {
        source: makeSamples(84, 1001),
        flight: makeSamples(130, 2002),
        screen1: makeSamples(54, 3003),
        screen2: makeSamples(230, 4004),
        screen3: makeSamples(520, 5005)
      };

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function create(tag, attrs = {}, parent = null) {
        const node = document.createElementNS(svgNS, tag);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, String(value));
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      function polarArc(cx, cy, r, startDeg, endDeg) {
        const a0 = startDeg * Math.PI / 180;
        const a1 = endDeg * Math.PI / 180;
        const x0 = cx + r * Math.cos(a0);
        const y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1);
        const y1 = cy + r * Math.sin(a1);
        const large = Math.abs(endDeg - startDeg) > 180 ? 1 : 0;
        return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
      }

      function mapQuad(quad, u, v) {
        const [p0, p1, p2, p3] = quad;
        const x = (1 - u) * (1 - v) * p0[0] + u * (1 - v) * p1[0] + u * v * p2[0] + (1 - u) * v * p3[0];
        const y = (1 - u) * (1 - v) * p0[1] + u * (1 - v) * p1[1] + u * v * p2[1] + (1 - u) * v * p3[1];
        return [x, y];
      }

      function quadBandPath(quad, v, thickness) {
        const half = thickness / 2;
        const top = Math.max(0, v - half);
        const bottom = Math.min(1, v + half);
        const p0 = mapQuad(quad, 0, top);
        const p1 = mapQuad(quad, 1, top);
        const p2 = mapQuad(quad, 1, bottom);
        const p3 = mapQuad(quad, 0, bottom);
        return `M ${p0[0]} ${p0[1]} L ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]} Z`;
      }

      function fringePeriod() {
        return 0.235 * (82 / state.slit);
      }

      function localFringeV(sample, contrast = 1) {
        const period = fringePeriod();
        const bands = Math.ceil(1 / period) + 3;
        const k = Math.floor(sample.b * bands) - 1;
        const jitter = (sample.c - 0.5) * period * (0.52 - 0.26 * contrast);
        return Math.max(0.012, Math.min(0.988, 0.5 + k * period + jitter));
      }

      function drawSlits() {
        clear(els.topSlits);
        clear(els.bottomSlits);

        const d = state.slit;
        const topCenter = 187;
        const upper = topCenter - d / 2;
        const lower = topCenter + d / 2;
        create("line", { class: "slit-line", x1: 294, y1: upper - 13, x2: 382, y2: upper + 13 }, els.topSlits);
        create("line", { class: "slit-line", x1: 294, y1: lower - 13, x2: 382, y2: lower + 13 }, els.topSlits);

        const bottomCenter = 672;
        const bUpper = bottomCenter - d / 1.55;
        const bLower = bottomCenter + d / 1.55;
        create("line", { class: "slit-line", x1: 202, y1: bUpper - 28, x2: 366, y2: bUpper + 12 }, els.bottomSlits);
        create("line", { class: "slit-line", x1: 202, y1: bLower - 28, x2: 366, y2: bLower + 28 }, els.bottomSlits);
      }

      function drawWaves() {
        clear(els.incidentWaves);
        clear(els.diffractedWaves);
        clear(els.interferenceRays);

        const d = state.slit;
        const source = [224, 187];
        for (let r = 28; r <= 145; r += 10) {
          create("path", {
            class: "wave-line",
            d: polarArc(source[0], source[1], r, -72, 73),
            opacity: 0.96
          }, els.incidentWaves);
        }

        const slitA = [392, 187 - d / 2];
        const slitB = [392, 187 + d / 2];
        for (const slit of [slitA, slitB]) {
          for (let r = 24; r <= 585; r += 14) {
            create("path", {
              class: "travel-line",
              d: polarArc(slit[0], slit[1], r, -40, 39),
              opacity: r < 70 ? 0.95 : 0.82
            }, els.diffractedWaves);
          }
        }

        for (let i = 0; i < 17; i += 1) {
          const y = 78 + i * 14.5;
          const drift = (i - 8) * 5.1 * (82 / state.slit);
          create("path", {
            d: `M 420 ${184 + drift} C 540 ${120 + y * 0.34}, 695 ${60 + y * 0.55}, 891 ${y}`,
            fill: "none",
            stroke: "rgba(231,183,20,0.26)",
            "stroke-width": 1.2,
            "stroke-linecap": "round"
          }, els.interferenceRays);
        }
      }

      function drawTopScreen() {
        clear(els.topScreenBands);
        create("rect", { x: 884, y: 18, width: 112, height: 365, fill: "url(#screenSheen)", opacity: 0.95 }, els.topScreenBands);
        const period = fringePeriod();
        const thickness = Math.max(0.025, period * 0.24);
        for (let v = -period; v <= 1 + period; v += period) {
          const bright = 0.48 + 0.18 * Math.cos((v - 0.5) * Math.PI);
          create("path", {
            d: quadBandPath(points.topScreen, v, thickness * 2.5),
            fill: "#f8dfa1",
            opacity: bright * 0.34,
            filter: "url(#softGlow)"
          }, els.topScreenBands);
          create("path", {
            d: quadBandPath(points.topScreen, v, thickness),
            fill: "#f0ce64",
            opacity: 0.9
          }, els.topScreenBands);
        }
      }

      function drawSourceDots() {
        clear(els.sourceDots);
        for (const s of samples.source) {
          const x = 130 + s.a * 150;
          const y = 585 + s.b * 155;
          if (x > 191 && y > 520 && y < 795) continue;
          const r = 2.2 + s.c * 1.1;
          create("circle", { class: "particle", cx: x, cy: y, r, opacity: 0.95 }, els.sourceDots);
        }
      }

      function drawFlightDots() {
        clear(els.flightDots);
        const visible = Math.round(samples.flight.length * (0.22 + state.time / 128));
        for (let i = 0; i < visible; i += 1) {
          const s = samples.flight[i];
          const x = 405 + s.a * 238;
          const lane = s.b < 0.52 ? -1 : 1;
          const centerY = 672 + lane * (state.slit / 1.6) + (x - 405) * 0.10 * lane;
          const y = centerY + (s.c - 0.5) * (110 + state.time * 0.18);
          const r = 2.3 + s.d * 1.2;
          create("circle", { class: "particle", cx: x, cy: y, r, opacity: 0.9 }, els.flightDots);
        }
      }

      function drawDotsForScreen(target, quad, sampleList, maxCount, banding) {
        clear(target);
        const count = Math.max(0, Math.min(sampleList.length, Math.round(maxCount)));
        for (let i = 0; i < count; i += 1) {
          const s = sampleList[i];
          const u = 0.03 + s.a * 0.94;
          const randomV = 0.035 + s.b * 0.93;
          const fringeV = localFringeV(s, banding);
          const v = randomV * (1 - banding) + fringeV * banding;
          const [x, y] = mapQuad(quad, u, v);
          const r = 2.5 + s.d * 1.15;
          create("circle", {
            class: "particle",
            cx: x.toFixed(2),
            cy: y.toFixed(2),
            r: r.toFixed(2),
            opacity: 0.94
          }, target);
        }
      }

      function drawParticleScreens() {
        const t = state.time / 100;
        const c1 = 10 + 34 * Math.min(1, t * 2.1);
        const c2 = Math.max(0, (t - 0.10) / 0.72) * samples.screen2.length;
        const c3 = Math.max(0, (t - 0.34) / 0.66) * samples.screen3.length;
        const b2 = Math.max(0, (t - 0.35) / 0.45) * 0.46;
        const b3 = Math.max(0, (t - 0.42) / 0.45);

        drawDotsForScreen(els.dots1, points.screen1, samples.screen1, c1, 0.05);
        drawDotsForScreen(els.dots2, points.screen2, samples.screen2, c2, Math.min(0.42, b2));
        drawDotsForScreen(els.dots3, points.screen3, samples.screen3, c3, Math.min(1, b3));

        els.timeMarker.setAttribute("cx", 738 + t * 454);
        document.getElementById("screen1").setAttribute("opacity", t < 0.28 ? "1" : "0.92");
        document.getElementById("screen2").setAttribute("opacity", t < 0.12 ? "0.36" : "1");
        document.getElementById("screen3").setAttribute("opacity", t < 0.34 ? "0.28" : "1");
      }

      function applyView() {
        els.wavePanel.classList.toggle("model-hidden", state.view === "particle");
        els.particlePanel.classList.toggle("model-hidden", state.view === "wave");
        els.viewButtons.forEach(button => {
          button.setAttribute("aria-pressed", button.dataset.view === state.view ? "true" : "false");
        });
      }

      function render() {
        els.timeReadout.textContent = `${Math.round(state.time)}%`;
        els.slitReadout.textContent = `${state.slit} px`;
        drawSlits();
        drawWaves();
        drawTopScreen();
        drawFlightDots();
        drawParticleScreens();
        applyView();
      }

      function tick(now) {
        if (!state.playing) return;
        if (!state.lastTick) state.lastTick = now;
        const delta = now - state.lastTick;
        state.lastTick = now;
        state.time = (state.time + delta * 0.018) % 101;
        els.timeSlider.value = String(Math.round(state.time));
        render();
        state.raf = requestAnimationFrame(tick);
      }

      function setPlaying(next) {
        state.playing = next;
        els.playButton.textContent = next ? "Pause" : "Play";
        els.playButton.setAttribute("aria-pressed", next ? "true" : "false");
        state.lastTick = 0;
        if (state.raf) cancelAnimationFrame(state.raf);
        if (next) state.raf = requestAnimationFrame(tick);
      }

      els.viewButtons.forEach(button => {
        button.addEventListener("click", () => {
          state.view = button.dataset.view;
          applyView();
        });
      });

      els.timeSlider.addEventListener("input", event => {
        state.time = Number(event.target.value);
        setPlaying(false);
        render();
      });

      els.slitSlider.addEventListener("input", event => {
        state.slit = Number(event.target.value);
        render();
      });

      els.playButton.addEventListener("click", () => {
        setPlaying(!state.playing);
      });

      drawSourceDots();
      render();
    })();
  </script>
</body>
</html>
