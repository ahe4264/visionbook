<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubic Unit Cells</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #101215;
      --muted: #5d6670;
      --paper: #ffffff;
      --panel: #f2f5f7;
      --line: #ccd4dd;
      --cube: #cfe8b6;
      --cube-dark: #9cc86e;
      --red: #ef1b2d;
      --orange: #df6425;
      --blue: #176f9b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e9eef2;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .shell {
      width: min(1180px, 100%);
      background: var(--paper);
      border: 1px solid #cbd3dc;
      box-shadow: 0 18px 46px rgba(26, 35, 44, 0.14);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      background: #f8fafb;
      border-bottom: 1px solid var(--line);
    }

    .title-block {
      min-width: 180px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .segmented {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(96px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #29323a;
      min-height: 38px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }

    button[aria-pressed="true"] {
      background: var(--blue);
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(23, 111, 155, 0.24);
    }

    .stage {
      width: 100%;
      overflow-x: auto;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 760px;
      height: auto;
      background: #ffffff;
    }

    .readout {
      display: grid;
      grid-template-columns: minmax(180px, 0.9fr) minmax(260px, 1.5fr) minmax(210px, 1fr);
      gap: 12px;
      padding: 13px 16px 16px;
      border-top: 1px solid var(--line);
      background: #f8fafb;
    }

    .readout-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 11px 12px;
      min-width: 0;
    }

    .readout-label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .readout-value {
      margin: 0;
      font-size: clamp(16px, 1.8vw, 21px);
      line-height: 1.2;
      font-weight: 800;
    }

    .readout-copy {
      margin: 0;
      color: #26313a;
      font-size: 14px;
      line-height: 1.35;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #26313a;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      flex: 0 0 auto;
    }

    .swatch.gray {
      background: linear-gradient(135deg, #d7d9dc 10%, #898d92 80%);
    }

    .swatch.orange {
      background: linear-gradient(135deg, #f28a43 10%, #c74f1d 80%);
    }

    .column-layer {
      transition: opacity 180ms ease;
    }

    .column-layer.is-muted {
      opacity: 0.74;
    }

    .atom {
      cursor: pointer;
      transition: opacity 140ms ease;
    }

    .atom:hover {
      opacity: 0.86;
    }

    .cube-face {
      pointer-events: none;
    }

    .cube-line,
    .lattice-line {
      pointer-events: none;
    }

    @media (max-width: 820px) {
      body {
        padding: 10px;
      }

      .toolbar,
      .readout {
        grid-template-columns: 1fr;
        display: grid;
      }

      .toolbar {
        align-items: stretch;
      }

      .segmented {
        grid-template-columns: 1fr;
      }

      button {
        white-space: normal;
      }

      .readout {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-labelledby="figure-title">
    <div class="toolbar">
      <div class="title-block">
        <h1 id="figure-title">Cubic Unit Cells</h1>
        <div class="subtitle">Lattice point locations paired with space-filling atomic models</div>
      </div>
      <div class="segmented" role="group" aria-label="Select cubic unit cell type">
        <button type="button" data-type="sc" aria-pressed="true">Simple cubic</button>
        <button type="button" data-type="bcc" aria-pressed="false">Body-centered cubic</button>
        <button type="button" data-type="fcc" aria-pressed="false">Face-centered cubic</button>
      </div>
    </div>

    <div class="stage">
      <svg id="unitCellSvg" viewBox="0 0 1300 900" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Three cubic unit cell types</title>
        <desc id="svgDesc">Simple cubic, body-centered cubic, and face-centered cubic cells shown as lattice point diagrams above space-filling sphere models.</desc>
        <defs>
          <radialGradient id="graySphere" cx="35%" cy="31%" r="68%">
            <stop offset="0%" stop-color="#eff1f3"/>
            <stop offset="34%" stop-color="#c8cbd0"/>
            <stop offset="76%" stop-color="#85898e"/>
            <stop offset="100%" stop-color="#676b70"/>
          </radialGradient>
          <radialGradient id="orangeSphere" cx="35%" cy="31%" r="68%">
            <stop offset="0%" stop-color="#ffad65"/>
            <stop offset="38%" stop-color="#e56b2c"/>
            <stop offset="78%" stop-color="#b84619"/>
            <stop offset="100%" stop-color="#8d3414"/>
          </radialGradient>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#242a30" flood-opacity="0.20"/>
          </filter>
          <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
      </svg>
    </div>

    <section class="readout" aria-live="polite">
      <div class="readout-card">
        <p class="readout-label">Selected structure</p>
        <p class="readout-value" id="structureReadout">Simple cubic</p>
      </div>
      <div class="readout-card">
        <p class="readout-label">Selected atom contribution</p>
        <p class="readout-copy" id="atomReadout">Corner atom: 1/8 of an atom belongs to this unit cell.</p>
      </div>
      <div class="readout-card">
        <p class="readout-label">Atoms per unit cell</p>
        <p class="readout-value" id="totalReadout">8 x 1/8 = 1</p>
      </div>
      <div class="readout-card legend" aria-label="Atom contribution legend">
        <span class="legend-item"><span class="swatch gray"></span> Corner: 1/8</span>
        <span class="legend-item"><span class="swatch orange"></span> Face: 1/2</span>
        <span class="legend-item"><span class="swatch orange"></span> Body: 1</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const svg = document.getElementById("unitCellSvg");
      const structureReadout = document.getElementById("structureReadout");
      const atomReadout = document.getElementById("atomReadout");
      const totalReadout = document.getElementById("totalReadout");
      const buttons = Array.from(document.querySelectorAll("[data-type]"));

      const NS = "http://www.w3.org/2000/svg";
      const state = {
        active: "sc",
        selected: { type: "sc", kind: "corner", id: "000" }
      };
      let interactiveAtoms = [];

      const structures = {
        sc: {
          name: "Simple cubic",
          shortName: "Simple cubic",
          top: { cx: 230, cy: 192, scale: 138 },
          bottom: { cx: 230, cy: 608, scale: 112, radiusFactor: 0.46 },
          latticePoints: [],
          modelAtoms: [],
          total: "8 x 1/8 = 1",
          countText: "Simple cubic: 8 corner atoms x 1/8 = 1 atom per unit cell."
        },
        bcc: {
          name: "Body-centered cubic",
          shortName: "Body-centered cubic",
          top: { cx: 650, cy: 176, scale: 154 },
          bottom: { cx: 650, cy: 602, scale: 124, radiusFactor: 0.44 },
          latticePoints: [{ x: 0.5, y: 0.5, z: 0.5, kind: "body" }],
          modelAtoms: [{ x: 0.5, y: 0.5, z: 0.5, kind: "body", color: "orange", id: "body" }],
          total: "8 x 1/8 + 1 = 2",
          countText: "Body-centered cubic: 8 corner atoms x 1/8 plus 1 body-center atom = 2 atoms per unit cell."
        },
        fcc: {
          name: "Face-centered cubic",
          shortName: "Face-centered cubic",
          top: { cx: 1060, cy: 164, scale: 200 },
          bottom: { cx: 1050, cy: 594, scale: 134, radiusFactor: 0.39 },
          latticePoints: [
            { x: 0.5, y: 0.5, z: 0, kind: "face" },
            { x: 0.5, y: 0.5, z: 1, kind: "face" },
            { x: 0.5, y: 0, z: 0.5, kind: "face" },
            { x: 0.5, y: 1, z: 0.5, kind: "face" },
            { x: 0, y: 0.5, z: 0.5, kind: "face" },
            { x: 1, y: 0.5, z: 0.5, kind: "face" }
          ],
          modelAtoms: [],
          total: "8 x 1/8 + 6 x 1/2 = 4",
          countText: "Face-centered cubic: 8 corner atoms x 1/8 plus 6 face-center atoms x 1/2 = 4 atoms per unit cell."
        }
      };

      const corners = [
        { x: 0, y: 0, z: 0, kind: "corner", id: "000" },
        { x: 1, y: 0, z: 0, kind: "corner", id: "100" },
        { x: 1, y: 1, z: 0, kind: "corner", id: "110" },
        { x: 0, y: 1, z: 0, kind: "corner", id: "010" },
        { x: 0, y: 0, z: 1, kind: "corner", id: "001" },
        { x: 1, y: 0, z: 1, kind: "corner", id: "101" },
        { x: 1, y: 1, z: 1, kind: "corner", id: "111" },
        { x: 0, y: 1, z: 1, kind: "corner", id: "011" }
      ];

      structures.sc.modelAtoms = [];
      structures.fcc.modelAtoms = [
        { x: 0.5, y: 0.5, z: 0, kind: "face", color: "orange", id: "front-face" },
        { x: 0.5, y: 0.5, z: 1, kind: "face", color: "orange", id: "back-face" },
        { x: 0.5, y: 0, z: 0.5, kind: "face", color: "orange", id: "bottom-face" },
        { x: 0.5, y: 1, z: 0.5, kind: "face", color: "orange", id: "top-face" },
        { x: 0, y: 0.5, z: 0.5, kind: "face", color: "orange", id: "left-face" },
        { x: 1, y: 0.5, z: 0.5, kind: "face", color: "orange", id: "right-face" }
      ];

      const labels = {
        corner: {
          title: "Corner atom",
          contribution: "1/8",
          text: "Corner atom: 1/8 of an atom belongs to this unit cell."
        },
        face: {
          title: "Face-center atom",
          contribution: "1/2",
          text: "Face-center atom: 1/2 of an atom belongs to this unit cell."
        },
        body: {
          title: "Body-center atom",
          contribution: "1",
          text: "Body-center atom: 1 whole atom belongs to this unit cell."
        }
      };

      const edges = [
        ["000", "100"], ["100", "110"], ["110", "010"], ["010", "000"],
        ["001", "101"], ["101", "111"], ["111", "011"], ["011", "001"],
        ["000", "001"], ["100", "101"], ["110", "111"], ["010", "011"]
      ];

      const faceSets = {
        front: ["000", "100", "110", "010"],
        right: ["100", "101", "111", "110"],
        top: ["010", "110", "111", "011"]
      };

      function create(tag, attrs = {}, parent = svg) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => {
          if (key === "textContent") {
            node.textContent = value;
          } else {
            node.setAttribute(key, String(value));
          }
        });
        parent.appendChild(node);
        return node;
      }

      function project(point, config) {
        const skewX = 0.47;
        const skewY = 0.35;
        return {
          x: config.cx + config.scale * (point.x - 0.5) + config.scale * skewX * (point.z - 0.5),
          y: config.cy - config.scale * (point.y - 0.5) - config.scale * skewY * (point.z - 0.5)
        };
      }

      function pointMap(config) {
        return Object.fromEntries(corners.map((corner) => [corner.id, project(corner, config)]));
      }

      function polygonPoints(ids, points) {
        return ids.map((id) => `${points[id].x},${points[id].y}`).join(" ");
      }

      function depthScore(atom) {
        return atom.z * 3 + atom.y * 0.9 + atom.x * 0.25;
      }

      function drawCube(config, parent, options = {}) {
        const points = pointMap(config);
        const fillOpacity = options.fillOpacity ?? 0.56;
        const strokeWidth = options.strokeWidth ?? 2;
        const lineColor = options.lineColor ?? "#111111";

        create("polygon", {
          class: "cube-face",
          points: polygonPoints(faceSets.front, points),
          fill: "#dfeecf",
          "fill-opacity": fillOpacity,
          stroke: "none"
        }, parent);
        create("polygon", {
          class: "cube-face",
          points: polygonPoints(faceSets.right, points),
          fill: "#a8ce78",
          "fill-opacity": fillOpacity,
          stroke: "none"
        }, parent);
        create("polygon", {
          class: "cube-face",
          points: polygonPoints(faceSets.top, points),
          fill: "#eaf4dd",
          "fill-opacity": fillOpacity,
          stroke: "none"
        }, parent);

        edges.forEach(([a, b]) => {
          create("line", {
            class: "cube-line",
            x1: points[a].x,
            y1: points[a].y,
            x2: points[b].x,
            y2: points[b].y,
            stroke: lineColor,
            "stroke-width": strokeWidth,
            "stroke-linecap": "round"
          }, parent);
        });
      }

      function drawColumnHighlight(parent, structure, columnIndex) {
        const x = [51, 471, 860][columnIndex];
        const y = 67;
        const w = [348, 360, 386][columnIndex];
        create("rect", {
          class: "active-frame",
          x,
          y,
          width: w,
          height: 748,
          rx: 12,
          fill: structure === state.active ? "#eef8fc" : "transparent",
          stroke: structure === state.active ? "#2b7fa6" : "transparent",
          "stroke-width": 2
        }, parent);
      }

      function drawLattice(type, parent) {
        const structure = structures[type];
        const config = structure.top;
        const g = create("g", {
          class: `column-layer ${type === state.active ? "is-active" : "is-muted"}`,
          "data-column": type
        }, parent);

        drawCube(config, g, {
          fillOpacity: 0.72,
          strokeWidth: type === "fcc" ? 2.2 : 2,
          lineColor: "#090909"
        });

        corners.forEach((corner) => {
          const p = project(corner, config);
          create("circle", {
            cx: p.x,
            cy: p.y,
            r: type === "fcc" ? 7.5 : 7,
            fill: "#050505"
          }, g);
        });

        structure.latticePoints.forEach((point) => {
          const p = project(point, config);
          create("circle", {
            cx: p.x,
            cy: p.y,
            r: type === "fcc" ? 7.5 : 7,
            fill: "#ef1b2d"
          }, g);
        });

        if (type === state.active) {
          const p = project(structure.latticePoints[0] || { x: 0, y: 0, z: 0 }, config);
          create("circle", {
            cx: p.x,
            cy: p.y,
            r: 16,
            fill: "none",
            stroke: "#176f9b",
            "stroke-width": 2.5,
            "stroke-opacity": structure.latticePoints.length ? 0.85 : 0
          }, g);
        }
      }

      function drawSphere(atom, config, type, parent) {
        const p = project(atom, config);
        const r = config.scale * structures[type].bottom.radiusFactor;
        const fill = atom.color === "orange" ? "url(#orangeSphere)" : "url(#graySphere)";
        const label = labels[atom.kind].title;
        const circle = create("circle", {
          class: "atom",
          cx: p.x,
          cy: p.y,
          r,
          fill,
          filter: "url(#softShadow)",
          "data-type": type,
          "data-kind": atom.kind,
          "data-id": atom.id,
          "aria-label": `${structures[type].name} ${label}`
        }, parent);

        interactiveAtoms.push({
          type,
          kind: atom.kind,
          id: atom.id,
          x: p.x,
          y: p.y,
          r
        });

        return { p, r };
      }

      function drawModel(type, parent) {
        const structure = structures[type];
        const config = structure.bottom;
        const g = create("g", {
          class: `column-layer ${type === state.active ? "is-active" : "is-muted"}`,
          "data-column": type
        }, parent);

        const atoms = corners.map((corner) => ({ ...corner, color: "gray" }))
          .sort((a, b) => depthScore(b) - depthScore(a))
          .concat(structure.modelAtoms.slice().sort((a, b) => depthScore(b) - depthScore(a)));

        const selected = [];
        atoms.forEach((atom) => {
          const drawn = drawSphere(atom, config, type, g);
          if (state.selected.type === type && state.selected.kind === atom.kind && state.selected.id === atom.id) {
            selected.push({ ...drawn, atom });
          }
        });

        drawCube(config, g, {
          fillOpacity: 0.45,
          strokeWidth: 2.1,
          lineColor: "#050505"
        });

        selected.forEach(({ p, r, atom }) => {
          create("circle", {
            cx: p.x,
            cy: p.y,
            r: r + 7,
            fill: "none",
            stroke: atom.kind === "corner" ? "#176f9b" : "#f2b134",
            "stroke-width": 5,
            "stroke-opacity": 0.88,
            filter: "url(#glow)",
            "pointer-events": "none"
          }, g);
        });
      }

      function drawStaticText(parent) {
        create("text", {
          x: 650,
          y: 34,
          "text-anchor": "middle",
          "font-size": 29,
          "font-weight": 850,
          fill: "#050505",
          textContent: "Lattice point locations"
        }, parent);

        create("text", {
          x: 650,
          y: 402,
          "text-anchor": "middle",
          "font-size": 29,
          "font-weight": 850,
          fill: "#050505",
          textContent: "Cubic unit cells"
        }, parent);

        [
          { x: 230, y: 850, text: "Simple cubic", type: "sc" },
          { x: 650, y: 850, text: "Body-centered cubic", type: "bcc" },
          { x: 1050, y: 850, text: "Face-centered cubic", type: "fcc" }
        ].forEach((label) => {
          create("text", {
            x: label.x,
            y: label.y,
            "text-anchor": "middle",
            "font-size": 28,
            "font-weight": 850,
            fill: label.type === state.active ? "#0e5576" : "#050505",
            textContent: label.text
          }, parent);
        });
      }

      function updateReadout() {
        const structure = structures[state.active];
        const selected = labels[state.selected.kind] || labels.corner;
        structureReadout.textContent = structure.name;
        atomReadout.textContent = selected.text;
        totalReadout.textContent = structure.total;

        buttons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.type === state.active));
        });
      }

      function render() {
        interactiveAtoms = [];
        Array.from(svg.children).forEach((child) => {
          if (child.tagName.toLowerCase() !== "defs" && child.tagName.toLowerCase() !== "title" && child.tagName.toLowerCase() !== "desc") {
            child.remove();
          }
        });

        const root = create("g", { id: "figureRoot" }, svg);

        ["sc", "bcc", "fcc"].forEach((type, index) => {
          drawColumnHighlight(root, type, index);
        });

        drawStaticText(root);

        ["sc", "bcc", "fcc"].forEach((type) => drawLattice(type, root));
        ["sc", "bcc", "fcc"].forEach((type) => drawModel(type, root));

        updateReadout();
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const type = button.dataset.type;
          state.active = type;
          if (type === "sc") {
            state.selected = { type, kind: "corner", id: "000" };
          } else if (type === "bcc") {
            state.selected = { type, kind: "body", id: "body" };
          } else {
            state.selected = { type, kind: "face", id: "front-face" };
          }
          render();
        });
      });

      svg.addEventListener("click", (event) => {
        const matrix = svg.getScreenCTM();
        if (!matrix) return;
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const local = point.matrixTransform(matrix.inverse());
        const hit = interactiveAtoms
          .map((atom) => {
            const dx = local.x - atom.x;
            const dy = local.y - atom.y;
            return { atom, distance: Math.hypot(dx, dy) };
          })
          .filter(({ atom, distance }) => distance <= atom.r)
          .sort((a, b) => a.distance - b.distance)[0];

        if (!hit) return;
        state.active = hit.atom.type;
        state.selected = { type: hit.atom.type, kind: hit.atom.kind, id: hit.atom.id };
        render();
      });

      render();
    })();
  </script>
</body>
</html>
