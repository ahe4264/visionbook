<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shallow Hyperplanes</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #5f686f;
      --panel: #ffffff;
      --page: #f6f7f8;
      --line: #d8dee3;
      --teal: #92d7d0;
      --teal-dark: #2c9d96;
      --orange: #d37a55;
      --orange-dark: #a94f31;
      --gray-plane: #c6cfd1;
      --shadow: 0 18px 55px rgba(20, 28, 35, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      width: min(1500px, calc(100vw - 28px));
      margin: 18px auto;
    }

    .figure-shell {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid #e3e7eb;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      background: #ffffff;
    }

    .panel-letter {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 54px;
      font-weight: 400;
    }

    .axis {
      stroke: #000000;
      stroke-width: 4.2;
      stroke-linecap: round;
      fill: none;
    }

    .axis.thin {
      stroke-width: 3.6;
    }

    .axis.dashed {
      stroke-dasharray: 9 12;
      stroke-width: 3.6;
    }

    .axis-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 46px;
      fill: #000000;
    }

    .axis-label.small {
      font-size: 42px;
    }

    .hyperplane {
      stroke-linecap: butt;
      pointer-events: none;
    }

    .teal-line {
      stroke: var(--teal);
      stroke-width: 10;
    }

    .orange-line {
      stroke: var(--orange);
      stroke-width: 10;
    }

    .origin-dot {
      fill: #000000;
      stroke: #000000;
      stroke-width: 2;
    }

    .region-pos {
      fill: rgba(112, 196, 189, 0.22);
    }

    .region-neg {
      fill: rgba(217, 127, 88, 0.16);
    }

    .plot-boundary {
      fill: transparent;
      stroke: rgba(18, 24, 30, 0.09);
      stroke-width: 1.5;
    }

    .plane {
      stroke: rgba(33, 41, 48, 0.28);
      stroke-width: 1.4;
      stroke-linejoin: round;
    }

    .coord-guide {
      stroke: #151515;
      stroke-width: 2.7;
      stroke-dasharray: 6 8;
      fill: none;
      opacity: 0.78;
    }

    .point {
      fill: #111111;
      stroke: #ffffff;
      stroke-width: 4;
      cursor: grab;
    }

    .point:active {
      cursor: grabbing;
    }

    .point-label {
      font-size: 21px;
      font-weight: 700;
      fill: #101820;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .panel-note {
      font-size: 18px;
      fill: var(--muted);
      font-weight: 650;
      letter-spacing: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(250px, 1.1fr) minmax(220px, 0.8fr) minmax(320px, 1.4fr);
      gap: 16px;
      align-items: center;
      padding: 14px 16px 16px;
      border-top: 1px solid #e6eaee;
      background: #fbfcfd;
    }

    .control-block {
      min-width: 0;
    }

    .control-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: #18212a;
      font-size: 14px;
      font-weight: 750;
    }

    .mono-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 750;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal-dark);
      cursor: pointer;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: #eef2f4;
      border: 1px solid #dce3e8;
      border-radius: 8px;
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 36px;
      padding: 0 10px;
      border-radius: 6px;
      color: #44505b;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .segmented input:checked + label {
      color: #101820;
      background: #ffffff;
      box-shadow: 0 1px 8px rgba(15, 23, 31, 0.10);
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
    }

    .chip {
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid #dfe5ea;
      border-radius: 7px;
      background: #ffffff;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip strong {
      display: block;
      margin-bottom: 2px;
      color: #53606b;
      font-size: 10px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .chip.out {
      border-color: #cfd8de;
      background: #f6faf9;
      font-weight: 850;
    }

    .chip.teal strong {
      color: var(--teal-dark);
    }

    .chip.orange strong {
      color: var(--orange-dark);
    }

    .chip.gray strong {
      color: #667078;
    }

    @media (max-width: 980px) {
      .wrap {
        width: min(100vw - 16px, 1500px);
        margin: 8px auto;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .status-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .status-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chip {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="figure-shell" aria-label="Interactive shallow hyperplanes figure">
      <svg id="figure" viewBox="0 0 1600 720" role="img" aria-labelledby="figTitle figDesc">
        <title id="figTitle">Hyperplanes in one, two, and three dimensional input spaces</title>
        <desc id="figDesc">Three panels show that a neuron threshold is a point in 1D, a line in 2D, and a plane in 3D. Controls rotate selected hyperplanes and a draggable input point updates signed decisions.</desc>
        <defs>
          <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto-start-reverse" markerUnits="strokeWidth">
            <path d="M 0 0 L 11 6.5 L 0 13 z" fill="#000000"></path>
          </marker>
          <clipPath id="clipB">
            <rect x="620" y="62" width="395" height="395"></rect>
          </clipPath>
        </defs>

        <g id="panelA">
          <text class="panel-letter" x="10" y="48">a)</text>
          <path id="aNegRegion" d="M 122 260 L 350 260" stroke="rgba(211,122,85,0.22)" stroke-width="38" stroke-linecap="butt"></path>
          <path id="aPosRegion" d="M 350 260 L 478 260" stroke="rgba(146,215,208,0.28)" stroke-width="38" stroke-linecap="butt"></path>
          <line class="axis" x1="92" y1="260" x2="510" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)"></line>
          <line class="hyperplane teal-line" x1="302" y1="222" x2="302" y2="298"></line>
          <circle class="origin-dot" cx="302" cy="260" r="7"></circle>
          <text class="axis-label" x="484" y="288"><tspan font-style="italic">x</tspan><tspan dy="12" font-size="30">1</tspan></text>
          <text class="panel-note" x="206" y="382">0D hyperplane: a threshold point</text>
        </g>

        <g id="panelB">
          <text class="panel-letter" x="575" y="48">b)</text>
          <g clip-path="url(#clipB)">
            <path id="bNeg" class="region-neg"></path>
            <path id="bPos" class="region-pos"></path>
            <line id="lineTeal2D" class="hyperplane teal-line"></line>
            <line id="lineOrange2D" class="hyperplane orange-line"></line>
          </g>
          <rect class="plot-boundary" x="620" y="62" width="395" height="395"></rect>
          <line class="axis thin" x1="617" y1="260" x2="1027" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)"></line>
          <line class="axis thin" x1="815" y1="58" x2="815" y2="462" marker-start="url(#arrow)" marker-end="url(#arrow)"></line>
          <circle class="origin-dot" cx="815" cy="260" r="7"></circle>
          <text class="axis-label" x="980" y="289"><tspan font-style="italic">x</tspan><tspan dy="12" font-size="30">1</tspan></text>
          <text class="axis-label" x="827" y="54"><tspan font-style="italic">x</tspan><tspan dy="12" font-size="30">2</tspan></text>
          <text class="panel-note" x="668" y="530">1D hyperplanes: lines splitting the plane</text>
        </g>

        <g id="panelC">
          <text class="panel-letter" x="1093" y="48">c)</text>
          <g id="planes3D"></g>
          <g id="axes3D"></g>
          <g id="guides3D"></g>
          <g id="point3D" tabindex="0" role="slider" aria-label="Draggable input point in 3D feature space">
            <circle class="point" r="11"></circle>
            <text class="point-label" x="17" y="-15">input x</text>
          </g>
          <text class="panel-note" x="1206" y="530">2D hyperplanes: planes slicing 3D space</text>
        </g>
      </svg>

      <div class="controls">
        <div class="control-block">
          <div class="control-title">
            <label id="weightLabel" for="weightSlider">weight w</label>
            <span id="weightValue" class="mono-value">0.00</span>
          </div>
          <input id="weightSlider" type="range" min="-1.20" max="1.20" step="0.01" value="0" aria-labelledby="weightLabel">
        </div>

        <div class="control-block">
          <div class="control-title">
            <span>selected hyperplane</span>
            <span id="selectedValue" class="mono-value">teal</span>
          </div>
          <div class="segmented" role="radiogroup" aria-label="Selected hyperplane">
            <input id="selectTeal" name="selectedPlane" type="radio" value="teal" checked>
            <label for="selectTeal">teal neuron</label>
            <input id="selectOrange" name="selectedPlane" type="radio" value="orange">
            <label for="selectOrange">orange neuron</label>
          </div>
        </div>

        <div class="status-grid" aria-live="polite">
          <div class="chip"><strong>x1</strong><span id="x1Val">0.45</span></div>
          <div class="chip"><strong>x2</strong><span id="x2Val">0.35</span></div>
          <div class="chip"><strong>x3</strong><span id="x3Val">0.30</span></div>
          <div class="chip teal"><strong>teal</strong><span id="tealSide">+</span></div>
          <div class="chip orange"><strong>orange</strong><span id="orangeSide">+</span></div>
          <div class="chip gray"><strong>gray</strong><span id="graySide">+</span></div>
          <div class="chip out"><strong>output</strong><span id="classVal">class 1</span></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("figure");
      const planes3D = document.getElementById("planes3D");
      const axes3D = document.getElementById("axes3D");
      const guides3D = document.getElementById("guides3D");
      const point3D = document.getElementById("point3D");
      const weightSlider = document.getElementById("weightSlider");
      const weightValue = document.getElementById("weightValue");
      const selectedValue = document.getElementById("selectedValue");
      const bPos = document.getElementById("bPos");
      const bNeg = document.getElementById("bNeg");
      const lineTeal2D = document.getElementById("lineTeal2D");
      const lineOrange2D = document.getElementById("lineOrange2D");

      const output = {
        x1: document.getElementById("x1Val"),
        x2: document.getElementById("x2Val"),
        x3: document.getElementById("x3Val"),
        teal: document.getElementById("tealSide"),
        orange: document.getElementById("orangeSide"),
        gray: document.getElementById("graySide"),
        klass: document.getElementById("classVal")
      };

      const state = {
        selected: "teal",
        weights: {
          teal: 0,
          orange: 0
        },
        point: {
          x1: 0.45,
          x2: 0.35,
          x3: 0.30
        },
        dragging: false
      };

      const B = {
        ox: 815,
        oy: 260,
        scale: 98,
        xmin: -2,
        xmax: 2,
        ymin: -2,
        ymax: 2
      };

      const C = {
        ox: 1324,
        oy: 315,
        e1: [158, 0],
        e2: [0, -158],
        e3: [-108, 78],
        range: 1.16,
        axis: 1.42
      };

      function ns(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const key in attrs) {
          el.setAttribute(key, attrs[key]);
        }
        return el;
      }

      function fmt(n) {
        return (Math.round(n * 100) / 100).toFixed(2);
      }

      function signLabel(v) {
        return (v >= 0 ? "+ side" : "- side") + " (" + fmt(v) + ")";
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function bMap(p) {
        return [B.ox + p.x * B.scale, B.oy - p.y * B.scale];
      }

      function cProject(x1, x2, x3) {
        return [
          C.ox + x1 * C.e1[0] + x2 * C.e2[0] + x3 * C.e3[0],
          C.oy + x1 * C.e1[1] + x2 * C.e2[1] + x3 * C.e3[1]
        ];
      }

      function polygonPath(points) {
        if (!points.length) {
          return "";
        }
        return "M " + points.map((p) => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L ") + " Z";
      }

      function clipHalfPlane(poly, nx, ny, keepPositive) {
        const out = [];
        const inside = (p) => keepPositive ? nx * p.x + ny * p.y >= -1e-9 : nx * p.x + ny * p.y <= 1e-9;
        const intersect = (a, b) => {
          const da = nx * a.x + ny * a.y;
          const db = nx * b.x + ny * b.y;
          const t = da / (da - db);
          return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        };

        for (let i = 0; i < poly.length; i += 1) {
          const current = poly[i];
          const previous = poly[(i + poly.length - 1) % poly.length];
          const curIn = inside(current);
          const prevIn = inside(previous);

          if (curIn) {
            if (!prevIn) {
              out.push(intersect(previous, current));
            }
            out.push(current);
          } else if (prevIn) {
            out.push(intersect(previous, current));
          }
        }

        return out;
      }

      function lineSegmentForNormal(nx, ny) {
        const candidates = [];
        const add = (x, y) => {
          if (x >= B.xmin - 1e-9 && x <= B.xmax + 1e-9 && y >= B.ymin - 1e-9 && y <= B.ymax + 1e-9) {
            if (!candidates.some((p) => Math.hypot(p.x - x, p.y - y) < 1e-6)) {
              candidates.push({ x, y });
            }
          }
        };

        if (Math.abs(ny) > 1e-9) {
          add(B.xmin, -nx * B.xmin / ny);
          add(B.xmax, -nx * B.xmax / ny);
        }
        if (Math.abs(nx) > 1e-9) {
          add(-ny * B.ymin / nx, B.ymin);
          add(-ny * B.ymax / nx, B.ymax);
        }

        return candidates.slice(0, 2).map(bMap);
      }

      function update2D() {
        const tealNormal = { x: 1, y: state.weights.teal };
        const orangeNormal = { x: state.weights.orange, y: 1 };
        const selectedNormal = state.selected === "teal" ? tealNormal : orangeNormal;
        const rect = [
          { x: B.xmin, y: B.ymin },
          { x: B.xmax, y: B.ymin },
          { x: B.xmax, y: B.ymax },
          { x: B.xmin, y: B.ymax }
        ];
        const pos = clipHalfPlane(rect, selectedNormal.x, selectedNormal.y, true).map(bMap);
        const neg = clipHalfPlane(rect, selectedNormal.x, selectedNormal.y, false).map(bMap);

        bPos.setAttribute("d", polygonPath(pos));
        bNeg.setAttribute("d", polygonPath(neg));

        const tealLine = lineSegmentForNormal(tealNormal.x, tealNormal.y);
        const orangeLine = lineSegmentForNormal(orangeNormal.x, orangeNormal.y);
        lineTeal2D.setAttribute("x1", tealLine[0][0]);
        lineTeal2D.setAttribute("y1", tealLine[0][1]);
        lineTeal2D.setAttribute("x2", tealLine[1][0]);
        lineTeal2D.setAttribute("y2", tealLine[1][1]);
        lineOrange2D.setAttribute("x1", orangeLine[0][0]);
        lineOrange2D.setAttribute("y1", orangeLine[0][1]);
        lineOrange2D.setAttribute("x2", orangeLine[1][0]);
        lineOrange2D.setAttribute("y2", orangeLine[1][1]);
      }

      function planePoints(kind) {
        const r = C.range;
        const wt = state.weights.teal;
        const wo = state.weights.orange;
        if (kind === "gray") {
          return [[-r, -r, 0], [r, -r, 0], [r, r, 0], [-r, r, 0]];
        }
        if (kind === "teal") {
          return [[wt * r, -r, -r], [wt * r, -r, r], [-wt * r, r, r], [-wt * r, r, -r]];
        }
        return [[-r, wo * r, -r], [r, -wo * r, -r], [r, -wo * r, r], [-r, wo * r, r]];
      }

      function draw3D() {
        planes3D.textContent = "";
        axes3D.textContent = "";
        guides3D.textContent = "";

        const planeSpecs = [
          { kind: "gray", fill: "rgba(198, 207, 209, 0.78)" },
          { kind: "teal", fill: "rgba(146, 215, 208, 0.72)" },
          { kind: "orange", fill: "rgba(211, 122, 85, 0.82)" }
        ];

        planeSpecs.forEach((spec) => {
          const pts = planePoints(spec.kind).map((p) => cProject(p[0], p[1], p[2]));
          planes3D.appendChild(ns("path", {
            class: "plane",
            d: polygonPath(pts),
            fill: spec.fill
          }));
        });

        const axisLines = [
          { a: [-C.axis, 0, 0], b: [C.axis, 0, 0], label: "x", sub: "1", offset: [2, 30] },
          { a: [0, -C.axis, 0], b: [0, C.axis, 0], label: "x", sub: "2", offset: [-57, -5] },
          { a: [0, 0, -0.10], b: [0, 0, C.axis], label: "x", sub: "3", offset: [-47, 36] }
        ];

        axisLines.forEach((line) => {
          const a = cProject(line.a[0], line.a[1], line.a[2]);
          const b = cProject(line.b[0], line.b[1], line.b[2]);
          axes3D.appendChild(ns("line", {
            class: "axis thin",
            x1: a[0],
            y1: a[1],
            x2: b[0],
            y2: b[1],
            "marker-start": line.label === "x" && line.sub !== "3" ? "url(#arrow)" : "",
            "marker-end": "url(#arrow)"
          }));

          const text = ns("text", {
            class: "axis-label small",
            x: b[0] + line.offset[0],
            y: b[1] + line.offset[1]
          });
          const t1 = ns("tspan", { "font-style": "italic" });
          t1.textContent = line.label;
          const t2 = ns("tspan", { dy: "10", "font-size": "28" });
          t2.textContent = line.sub;
          text.appendChild(t1);
          text.appendChild(t2);
          axes3D.appendChild(text);
        });

        const p = state.point;
        const pt = cProject(p.x1, p.x2, p.x3);
        const drop = cProject(p.x1, 0, p.x3);
        guides3D.appendChild(ns("path", {
          class: "coord-guide",
          d: "M " + pt[0].toFixed(2) + " " + pt[1].toFixed(2) + " L " + drop[0].toFixed(2) + " " + drop[1].toFixed(2)
        }));
        guides3D.appendChild(ns("path", {
          class: "coord-guide",
          d: "M " + C.ox + " " + C.oy + " L " + drop[0].toFixed(2) + " " + drop[1].toFixed(2)
        }));

        point3D.setAttribute("transform", "translate(" + pt[0].toFixed(2) + " " + pt[1].toFixed(2) + ")");
        point3D.setAttribute("aria-valuetext", "x1 " + fmt(p.x1) + ", x2 " + fmt(p.x2) + ", x3 " + fmt(p.x3));
      }

      function updateStatus() {
        const p = state.point;
        const teal = p.x1 + state.weights.teal * p.x2;
        const orange = state.weights.orange * p.x1 + p.x2;
        const gray = p.x3;
        const positives = [teal, orange, gray].filter((v) => v >= 0).length;
        output.x1.textContent = fmt(p.x1);
        output.x2.textContent = fmt(p.x2);
        output.x3.textContent = fmt(p.x3);
        output.teal.textContent = signLabel(teal);
        output.orange.textContent = signLabel(orange);
        output.gray.textContent = signLabel(gray);
        output.klass.textContent = positives >= 2 ? "class 1" : "class 0";
      }

      function render() {
        weightSlider.value = state.weights[state.selected];
        weightValue.textContent = fmt(state.weights[state.selected]);
        selectedValue.textContent = state.selected;
        update2D();
        draw3D();
        updateStatus();
      }

      function svgPoint(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        const mapped = pt.matrixTransform(svg.getScreenCTM().inverse());
        return [mapped.x, mapped.y];
      }

      function deltaToWorld(dx, dy) {
        const cols = [C.e1, C.e2, C.e3];
        let aa = 0;
        let ab = 0;
        let bb = 0;
        cols.forEach((v) => {
          aa += v[0] * v[0];
          ab += v[0] * v[1];
          bb += v[1] * v[1];
        });
        const det = aa * bb - ab * ab;
        const ux = (bb * dx - ab * dy) / det;
        const uy = (-ab * dx + aa * dy) / det;
        return {
          x1: C.e1[0] * ux + C.e1[1] * uy,
          x2: C.e2[0] * ux + C.e2[1] * uy,
          x3: C.e3[0] * ux + C.e3[1] * uy
        };
      }

      function beginDrag(event) {
        event.preventDefault();
        const p = svgPoint(event);
        state.dragging = {
          id: event.pointerId,
          startScreen: p,
          startPoint: Object.assign({}, state.point)
        };
        point3D.setPointerCapture(event.pointerId);
      }

      function moveDrag(event) {
        if (!state.dragging || state.dragging.id !== event.pointerId) {
          return;
        }
        const p = svgPoint(event);
        const dx = p[0] - state.dragging.startScreen[0];
        const dy = p[1] - state.dragging.startScreen[1];
        const d = deltaToWorld(dx, dy);
        const r = C.range;
        state.point.x1 = clamp(state.dragging.startPoint.x1 + d.x1, -r, r);
        state.point.x2 = clamp(state.dragging.startPoint.x2 + d.x2, -r, r);
        state.point.x3 = clamp(state.dragging.startPoint.x3 + d.x3, -r, r);
        draw3D();
        updateStatus();
      }

      function endDrag(event) {
        if (state.dragging && state.dragging.id === event.pointerId) {
          state.dragging = false;
          point3D.releasePointerCapture(event.pointerId);
        }
      }

      weightSlider.addEventListener("input", () => {
        state.weights[state.selected] = Number(weightSlider.value);
        render();
      });

      document.querySelectorAll("input[name='selectedPlane']").forEach((radio) => {
        radio.addEventListener("change", () => {
          if (radio.checked) {
            state.selected = radio.value;
            render();
          }
        });
      });

      point3D.addEventListener("pointerdown", beginDrag);
      point3D.addEventListener("pointermove", moveDrag);
      point3D.addEventListener("pointerup", endDrag);
      point3D.addEventListener("pointercancel", endDrag);
      point3D.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 0.12 : 0.04;
        const r = C.range;
        if (event.key === "ArrowRight") {
          state.point.x1 = clamp(state.point.x1 + step, -r, r);
        } else if (event.key === "ArrowLeft") {
          state.point.x1 = clamp(state.point.x1 - step, -r, r);
        } else if (event.key === "ArrowUp") {
          state.point.x2 = clamp(state.point.x2 + step, -r, r);
        } else if (event.key === "ArrowDown") {
          state.point.x2 = clamp(state.point.x2 - step, -r, r);
        } else if (event.key === "PageUp") {
          state.point.x3 = clamp(state.point.x3 + step, -r, r);
        } else if (event.key === "PageDown") {
          state.point.x3 = clamp(state.point.x3 - step, -r, r);
        } else {
          return;
        }
        event.preventDefault();
        draw3D();
        updateStatus();
      });

      render();
    }());
  </script>
</body>
</html>
