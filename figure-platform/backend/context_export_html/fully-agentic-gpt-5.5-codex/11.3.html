<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hash Table Chaining</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5b626d;
      --paper: #ffffff;
      --panel: #f4f6f8;
      --line: #cdd3dc;
      --slot: #efefef;
      --slot-empty: #9f9f9f;
      --accent: #1557c0;
      --accent-soft: #e9f0ff;
      --bad: #b42318;
      --good: #18794e;
      --shadow: 0 18px 44px rgba(22, 30, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #eef2f6;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    main {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .figure-shell {
      width: min(100%, 1500px);
      max-height: calc(100vh - 32px);
      aspect-ratio: 1900 / 820;
      overflow: auto;
      background: var(--paper);
      border: 1px solid #c7ced8;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 980px;
      height: 100%;
      min-height: 470px;
      background: #ffffff;
      user-select: none;
    }

    aside {
      min-width: 0;
      min-height: 100vh;
      padding: 18px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
      font-weight: 750;
    }

    .subtle {
      margin: -8px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .expression-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #ffffff;
      border: 1px solid #bcc5d2;
      border-radius: 8px;
    }

    .expression-row code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.95rem;
      color: #263244;
    }

    input {
      min-width: 0;
      border: 0;
      outline: 0;
      font: 600 0.95rem "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      color: #101828;
      background: transparent;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      min-height: 36px;
      border: 1px solid #bac4d2;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font: 700 0.82rem/1.1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .status {
      min-height: 40px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #cfd6df;
      background: #ffffff;
      color: #2d3748;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .status.bad {
      border-color: #f0a7a0;
      color: var(--bad);
      background: #fff3f1;
    }

    .status.good {
      border-color: #a8d8c0;
      color: var(--good);
      background: #f0fbf5;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #d2d9e3;
      border-radius: 8px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 1.28rem;
      line-height: 1.1;
    }

    .legend {
      padding: 11px;
      background: #ffffff;
      border: 1px solid #d2d9e3;
      border-radius: 8px;
    }

    .legend-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 12px;
      font: 0.88rem/1.25 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .key-grid div {
      white-space: nowrap;
    }

    .math,
    .key-label,
    .slot-label,
    .table-title {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .node text,
    .key-label,
    .table-title {
      dominant-baseline: middle;
    }

    .node rect,
    .node line,
    .slot,
    .universe,
    .actual {
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 980px) {
      body {
        grid-template-columns: 1fr;
      }

      aside {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      main {
        padding: 10px;
        align-items: start;
      }

      .figure-shell {
        width: 100%;
        max-height: none;
        aspect-ratio: 1900 / 820;
      }

      svg {
        height: auto;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Interactive figure">
    <div class="figure-shell">
      <svg id="diagram" viewBox="0 0 1900 820" role="img" aria-labelledby="title desc">
        <title id="title">Hash table with collision resolution by chaining</title>
        <desc id="desc">The universe of keys contains actual keys k1 through k8. A hash function maps keys to slots in table T, and keys landing in the same slot form doubly linked list chains.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 12 12" refX="10.2" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#111111"></path>
          </marker>
          <marker id="smallArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 12 6 L 0 12 z" fill="#111111"></path>
          </marker>
          <pattern id="slotHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="14" height="14" fill="#a4a4a4"></rect>
            <line x1="0" y1="0" x2="0" y2="14" stroke="#858585" stroke-width="4"></line>
          </pattern>
        </defs>

        <ellipse class="universe" cx="340" cy="405" rx="305" ry="285" fill="#9d9d9d" stroke="#111111" stroke-width="2.4"></ellipse>
        <ellipse class="actual" cx="340" cy="455" rx="228" ry="170" fill="#eeeeee" stroke="#111111" stroke-width="2.2"></ellipse>

        <text x="340" y="245" text-anchor="middle" class="math" font-size="48">U</text>
        <text x="340" y="293" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42">(universe of keys)</text>
        <text x="164" y="397" text-anchor="middle" class="math" font-size="46">K</text>
        <text x="164" y="445" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="39">(actual</text>
        <text x="164" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="39">keys)</text>

        <g id="keyArrows"></g>
        <g id="keys"></g>

        <text x="782" y="68" text-anchor="middle" class="table-title" font-size="50">T</text>
        <g id="tableRows"></g>
        <g id="slotArrows"></g>
        <g id="chains"></g>
      </svg>
    </div>
  </main>

  <aside>
    <h1>Collision Resolution by Chaining</h1>
    <p class="subtle">Edit the hash expression and watch the arrows and linked lists rebuild from the returned slot index.</p>

    <div class="control">
      <label for="hashExpression">Hash expression</label>
      <div class="expression-row">
        <code>h(k)=</code>
        <input id="hashExpression" spellcheck="false" autocomplete="off" value="k % 9" aria-label="Hash expression as a JavaScript expression">
      </div>
    </div>

    <div class="buttons" aria-label="Expression presets">
      <button type="button" data-expression="k % 9">Original</button>
      <button type="button" data-expression="0">All collide</button>
      <button type="button" data-expression="(k * 4 + 1) % 9">Mixed</button>
    </div>

    <div id="status" class="status good" role="status" aria-live="polite"></div>

    <div class="stats" aria-label="Hash table statistics">
      <div class="stat">
        <span>Slots</span>
        <strong id="slotCount">9</strong>
      </div>
      <div class="stat">
        <span>Longest chain</span>
        <strong id="maxChain">3</strong>
      </div>
      <div class="stat">
        <span>Collisions</span>
        <strong id="collisionCount">4</strong>
      </div>
      <div class="stat">
        <span>Empty slots</span>
        <strong id="emptyCount">5</strong>
      </div>
    </div>

    <div class="legend">
      <p class="legend-title">Numeric key values</p>
      <div id="keyValues" class="key-grid"></div>
    </div>
  </aside>

  <script>
    (() => {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const slotCount = 9;
      const table = { x: 725, y: 105, w: 114, h: 60 };
      const node = { w: 148, h: 54, ptr: 45, gap: 58, rowGap: 30 };
      const chainX = 930;
      const chainOrder = ["k1", "k4", "k5", "k2", "k7", "k3", "k8", "k6"];
      const keys = [
        { id: "k1", n: 10, x: 266, y: 328, lx: -33, ly: 10 },
        { id: "k4", n: 19, x: 314, y: 414, lx: -35, ly: 10 },
        { id: "k5", n: 13, x: 462, y: 414, lx: 0, ly: -26 },
        { id: "k7", n: 31, x: 382, y: 465, lx: -31, ly: 19 },
        { id: "k2", n: 22, x: 330, y: 536, lx: -34, ly: 13 },
        { id: "k3", n: 15, x: 510, y: 552, lx: -31, ly: -10 },
        { id: "k8", n: 16, x: 404, y: 568, lx: -34, ly: 10 },
        { id: "k6", n: 25, x: 266, y: 604, lx: -35, ly: 13 }
      ];

      const byId = new Map(keys.map((key) => [key.id, key]));
      const keyArrows = document.getElementById("keyArrows");
      const keyLayer = document.getElementById("keys");
      const tableRows = document.getElementById("tableRows");
      const slotArrows = document.getElementById("slotArrows");
      const chains = document.getElementById("chains");
      const expressionInput = document.getElementById("hashExpression");
      const status = document.getElementById("status");
      const maxChain = document.getElementById("maxChain");
      const collisionCount = document.getElementById("collisionCount");
      const emptyCount = document.getElementById("emptyCount");
      const keyValues = document.getElementById("keyValues");

      function make(tag, attrs = {}, text = "") {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([name, value]) => {
          if (value !== null && value !== undefined) {
            el.setAttribute(name, String(value));
          }
        });
        if (text) {
          el.textContent = text;
        }
        return el;
      }

      function clear(el) {
        while (el.firstChild) {
          el.removeChild(el.firstChild);
        }
      }

      function slotY(index) {
        return table.y + index * table.h + table.h / 2;
      }

      function keyLabel(id) {
        return id.replace(/^k(\d+)$/, "k$1");
      }

      function addMathKeyText(parent, x, y, id, size, anchor = "middle") {
        const text = make("text", {
          x,
          y,
          "text-anchor": anchor,
          class: "key-label",
          "font-size": size
        });
        const base = make("tspan", {}, "k");
        const sub = make("tspan", {
          "baseline-shift": "sub",
          "font-size": Math.round(size * 0.62)
        }, id.slice(1));
        text.append(base, sub);
        parent.appendChild(text);
        return text;
      }

      function drawKeys() {
        clear(keyLayer);
        keys.forEach((key) => {
          const group = make("g", { "data-key": key.id });
          group.appendChild(make("circle", {
            cx: key.x,
            cy: key.y,
            r: 9,
            fill: "#000000"
          }));
          addMathKeyText(group, key.x + key.lx, key.y + key.ly, key.id, 40);
          const title = make("title", {}, `${keyLabel(key.id)} = ${key.n}`);
          group.appendChild(title);
          keyLayer.appendChild(group);
        });
      }

      function drawKeyValues() {
        keyValues.innerHTML = "";
        keys.forEach((key) => {
          const item = document.createElement("div");
          item.textContent = `${keyLabel(key.id)} = ${key.n}`;
          keyValues.appendChild(item);
        });
      }

      function evaluateExpression(source) {
        let fn;
        try {
          fn = Function("k", "Math", `"use strict"; return (${source});`);
        } catch (error) {
          throw new Error("Expression is not valid JavaScript.");
        }

        const groups = Array.from({ length: slotCount }, () => []);
        const assignments = new Map();
        keys.forEach((key) => {
          let raw;
          try {
            raw = fn(key.n, Math);
          } catch (error) {
            throw new Error(`${keyLabel(key.id)} caused: ${error.message}`);
          }
          const index = Number(raw);
          if (!Number.isFinite(index)) {
            throw new Error(`${keyLabel(key.id)} returned ${String(raw)}, not a finite number.`);
          }
          if (!Number.isInteger(index)) {
            throw new Error(`${keyLabel(key.id)} returned ${index}; slot indices must be integers.`);
          }
          if (index < 0 || index >= slotCount) {
            throw new Error(`${keyLabel(key.id)} returned ${index}; use a slot from 0 to ${slotCount - 1}.`);
          }
          assignments.set(key.id, index);
        });

        chainOrder.forEach((id) => {
          groups[assignments.get(id)].push(byId.get(id));
        });

        return { groups, assignments };
      }

      function fanOffset(position, total) {
        if (total <= 1) return 0;
        return (position - (total - 1) / 2) * 13;
      }

      function drawTable(groups) {
        clear(tableRows);
        groups.forEach((group, index) => {
          const y = table.y + index * table.h;
          const row = make("g", { "data-slot": index });
          row.appendChild(make("text", {
            x: table.x - 18,
            y: y + table.h / 2 + 1,
            "text-anchor": "end",
            "dominant-baseline": "middle",
            fill: "#596170",
            "font-size": 18,
            "font-family": "Georgia, 'Times New Roman', serif"
          }, `T[${index}]`));
          row.appendChild(make("rect", {
            class: "slot",
            x: table.x,
            y,
            width: table.w,
            height: table.h,
            fill: group.length ? "#f1f1f1" : "url(#slotHatch)",
            stroke: "#111111",
            "stroke-width": 2
          }));
          if (group.length) {
            row.appendChild(make("line", {
              x1: table.x + 58,
              y1: y + table.h / 2,
              x2: table.x + table.w - 22,
              y2: y + table.h / 2,
              stroke: "#111111",
              "stroke-width": 2.2
            }));
          } else {
            row.appendChild(make("line", {
              x1: table.x + 34,
              y1: y + table.h - 14,
              x2: table.x + table.w - 34,
              y2: y + 14,
              stroke: "#111111",
              "stroke-width": 3.2,
              "stroke-linecap": "round"
            }));
          }
          tableRows.appendChild(row);
        });
      }

      function nodePositions(group, slotIndex) {
        const centerY = slotY(slotIndex);
        const perRow = group.length > 4 ? 4 : group.length || 1;
        const rows = Math.ceil(group.length / perRow);
        const band = rows * node.h + Math.max(0, rows - 1) * node.rowGap;
        const startY = centerY - band / 2;
        return group.map((key, index) => {
          const row = Math.floor(index / perRow);
          const col = index % perRow;
          return {
            key,
            x: chainX + col * (node.w + node.gap),
            y: startY + row * (node.h + node.rowGap),
            row,
            col
          };
        });
      }

      function drawPointerSlash(parent, x1, y1, x2, y2) {
        parent.appendChild(make("line", {
          x1,
          y1,
          x2,
          y2,
          stroke: "#111111",
          "stroke-width": 3,
          "stroke-linecap": "round"
        }));
      }

      function drawNode(parent, position, index, total) {
        const { x, y, key } = position;
        const group = make("g", { class: "node", "data-node": key.id });
        group.appendChild(make("rect", {
          x,
          y,
          width: node.w,
          height: node.h,
          fill: "#eeeeee",
          stroke: "#111111",
          "stroke-width": 2
        }));
        group.appendChild(make("line", {
          x1: x + node.ptr,
          y1: y,
          x2: x + node.ptr,
          y2: y + node.h,
          stroke: "#111111",
          "stroke-width": 2
        }));
        group.appendChild(make("line", {
          x1: x + node.w - node.ptr,
          y1: y,
          x2: x + node.w - node.ptr,
          y2: y + node.h,
          stroke: "#111111",
          "stroke-width": 2
        }));

        if (index === 0) {
          drawPointerSlash(group, x + 16, y + node.h - 14, x + node.ptr - 15, y + 14);
        } else {
          group.appendChild(make("line", {
            x1: x + 13,
            y1: y + node.h / 2,
            x2: x + node.ptr - 12,
            y2: y + node.h / 2,
            stroke: "#111111",
            "stroke-width": 2.4
          }));
        }

        if (index === total - 1) {
          drawPointerSlash(group, x + node.w - node.ptr + 15, y + node.h - 14, x + node.w - 16, y + 14);
        } else {
          group.appendChild(make("line", {
            x1: x + node.w - node.ptr + 12,
            y1: y + node.h / 2,
            x2: x + node.w - 13,
            y2: y + node.h / 2,
            stroke: "#111111",
            "stroke-width": 2.4
          }));
        }

        addMathKeyText(group, x + node.w / 2, y + node.h / 2 + 1, key.id, 40);
        const title = make("title", {}, `${keyLabel(key.id)} = ${key.n}`);
        group.appendChild(title);
        parent.appendChild(group);
      }

      function connectorPath(from, to, yAdjust) {
        const startX = from.x + node.w;
        const startY = from.y + node.h / 2 + yAdjust;
        const endX = to.x;
        const endY = to.y + node.h / 2 + yAdjust;
        if (to.x > from.x && Math.abs(to.y - from.y) < 1) {
          return `M ${startX} ${startY} L ${endX} ${endY}`;
        }
        const midX = Math.max(startX + 38, to.x - 38);
        return `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;
      }

      function reverseConnectorPath(from, to, yAdjust) {
        const startX = to.x;
        const startY = to.y + node.h / 2 + yAdjust;
        const endX = from.x + node.w;
        const endY = from.y + node.h / 2 + yAdjust;
        if (to.x > from.x && Math.abs(to.y - from.y) < 1) {
          return `M ${startX} ${startY} L ${endX} ${endY}`;
        }
        const midX = Math.max(endX + 44, startX - 44);
        return `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;
      }

      function drawChains(groups) {
        clear(slotArrows);
        clear(chains);
        groups.forEach((group, slotIndex) => {
          if (!group.length) return;
          const positions = nodePositions(group, slotIndex);
          const first = positions[0];
          slotArrows.appendChild(make("line", {
            x1: table.x + table.w,
            y1: slotY(slotIndex),
            x2: first.x - 9,
            y2: first.y + node.h / 2,
            stroke: "#111111",
            "stroke-width": 2.3,
            "marker-end": "url(#arrow)"
          }));

          positions.slice(0, -1).forEach((position, index) => {
            const next = positions[index + 1];
            chains.appendChild(make("path", {
              d: connectorPath(position, next, -10),
              fill: "none",
              stroke: "#111111",
              "stroke-width": 2.3,
              "marker-end": "url(#arrow)"
            }));
            chains.appendChild(make("path", {
              d: reverseConnectorPath(position, next, 12),
              fill: "none",
              stroke: "#111111",
              "stroke-width": 2.3,
              "marker-end": "url(#smallArrow)"
            }));
          });

          positions.forEach((position, index) => drawNode(chains, position, index, positions.length));
        });
      }

      function drawKeyArrows(groups, assignments) {
        clear(keyArrows);
        groups.forEach((group, slotIndex) => {
          group.forEach((key, position) => {
            const offset = fanOffset(position, group.length);
            const endY = slotY(slotIndex) + offset;
            const bendX = 600;
            const path = make("path", {
              d: `M ${key.x + 8} ${key.y - 1} C ${bendX} ${key.y - 26}, ${bendX} ${endY}, ${table.x - 6} ${endY}`,
              fill: "none",
              stroke: "#111111",
              "stroke-width": 2.1,
              "marker-end": "url(#arrow)",
              opacity: assignments.get(key.id) === slotIndex ? 1 : 0.8
            });
            keyArrows.appendChild(path);
          });
        });
      }

      function updateStats(groups) {
        const lengths = groups.map((group) => group.length);
        const longest = Math.max(...lengths);
        const collisions = lengths.reduce((sum, length) => sum + Math.max(0, length - 1), 0);
        const empty = lengths.filter((length) => length === 0).length;
        maxChain.textContent = longest;
        collisionCount.textContent = collisions;
        emptyCount.textContent = empty;
        status.classList.toggle("good", collisions <= 4);
        status.classList.toggle("bad", collisions > 4);
        status.textContent = collisions === 0
          ? "No collisions: every actual key occupies its own slot."
          : `${collisions} collision${collisions === 1 ? "" : "s"}; longest chain length ${longest}.`;
      }

      function render() {
        const source = expressionInput.value.trim();
        if (!source) {
          status.className = "status bad";
          status.textContent = "Enter a JavaScript expression that returns a slot index.";
          return;
        }

        let result;
        try {
          result = evaluateExpression(source);
        } catch (error) {
          status.className = "status bad";
          status.textContent = error.message;
          return;
        }

        drawKeyArrows(result.groups, result.assignments);
        drawTable(result.groups);
        drawChains(result.groups);
        updateStats(result.groups);
      }

      drawKeys();
      drawKeyValues();
      expressionInput.addEventListener("input", render);
      document.querySelectorAll("[data-expression]").forEach((button) => {
        button.addEventListener("click", () => {
          expressionInput.value = button.dataset.expression;
          expressionInput.focus();
          render();
        });
      });
      render();
    })();
  </script>
</body>
</html>
