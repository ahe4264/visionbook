<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manometer Pressure Relationships</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #536170;
      --panel: #ffffff;
      --paper: #fbfcfe;
      --edge: #d8e0e8;
      --edge-strong: #9ba8b5;
      --accent: #1d6fd6;
      --accent-dark: #164d95;
      --accent-soft: #e8f2ff;
      --formula: #fff3bf;
      --formula-edge: #d4a311;
      --mercury: #9ca5a8;
      --mercury-dark: #6c7478;
      --gas: #ebe3f4;
      --shadow: 0 18px 42px rgba(35, 47, 62, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef3f7;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 20px);
    }

    main {
      width: min(1320px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage,
    .controls {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      overflow-x: auto;
      padding: clamp(6px, 1vw, 12px);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 940px;
      height: auto;
      background: #fff;
      border-radius: 6px;
      user-select: none;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1.15fr) minmax(300px, 0.95fr);
      gap: 16px;
      padding: 16px;
      align-items: start;
    }

    .control-block {
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .control-title {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--edge-strong);
      border-radius: 8px;
      overflow: hidden;
    }

    .segmented button {
      min-height: 46px;
      border: 0;
      border-right: 1px solid var(--edge-strong);
      background: #f8fafc;
      color: var(--ink);
      padding: 8px 9px;
      font: inherit;
      font-size: clamp(0.72rem, 1.15vw, 0.92rem);
      font-weight: 750;
      line-height: 1.12;
      cursor: pointer;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .value-pill {
      min-width: 88px;
      padding: 6px 8px;
      border: 1px solid var(--edge);
      border-radius: 6px;
      background: #f8fafc;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      white-space: nowrap;
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      min-width: 0;
      border-top: 3px solid var(--accent);
      padding-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      font-size: clamp(0.86rem, 1.4vw, 1rem);
      white-space: nowrap;
    }

    .derivation {
      border-left: 4px solid var(--formula-edge);
      padding-left: 12px;
      min-height: 122px;
    }

    .derivation h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .derivation ol {
      margin: 0;
      padding-left: 22px;
      color: #26323e;
      font-size: 0.95rem;
      line-height: 1.36;
    }

    .derivation li + li {
      margin-top: 4px;
    }

    .panel-halo {
      fill: transparent;
      stroke: transparent;
      stroke-width: 3;
      rx: 10;
      transition: fill 160ms ease, stroke 160ms ease;
    }

    .panel.active .panel-halo {
      fill: rgba(232, 242, 255, 0.62);
      stroke: #78aeea;
    }

    .glass-outer {
      fill: none;
      stroke: #111;
      stroke-width: 17;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .glass-inner {
      fill: none;
      stroke: #eef2f5;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tube-vapor {
      fill: none;
      stroke: #eee8f7;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mercury {
      fill: none;
      stroke: var(--mercury);
      stroke-width: 12;
      stroke-linecap: butt;
      stroke-linejoin: round;
      transition: d 240ms ease;
    }

    .mercury-shine {
      fill: none;
      stroke: rgba(255, 255, 255, 0.48);
      stroke-width: 2.2;
      stroke-linecap: round;
      pointer-events: none;
    }

    .fluid-surface {
      stroke: #30363d;
      stroke-width: 2;
      transition: transform 240ms ease;
    }

    .gas-bulb {
      fill: var(--gas);
      stroke: #111;
      stroke-width: 2;
    }

    .thin-line {
      stroke: #111;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .guide-line {
      stroke: #111;
      stroke-width: 2.4;
      transition: y1 240ms ease, y2 240ms ease;
    }

    .height-arrow {
      cursor: pointer;
      outline: none;
    }

    .height-arrow line,
    .height-arrow path {
      stroke: #111;
      stroke-width: 2.6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 240ms ease, y1 240ms ease, y2 240ms ease, d 240ms ease;
    }

    .height-arrow text {
      fill: #000;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 27px;
      pointer-events: none;
      transition: transform 240ms ease;
    }

    .height-arrow:hover line,
    .height-arrow:hover path,
    .height-arrow:focus-visible line,
    .height-arrow:focus-visible path {
      stroke: var(--accent-dark);
    }

    .height-arrow:hover text,
    .height-arrow:focus-visible text {
      fill: var(--accent-dark);
    }

    .label {
      fill: #111;
      font-size: 25px;
    }

    .small-label {
      fill: #111;
      font-size: 24px;
    }

    .formula-card {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      rx: 8;
      transition: fill 160ms ease, stroke 160ms ease;
    }

    .formula text {
      fill: #000;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-style: italic;
    }

    .formula.active .formula-card {
      fill: var(--formula);
      stroke: var(--formula-edge);
    }

    .formula.active text {
      font-weight: 700;
    }

    .svg-title {
      fill: var(--muted);
      font-size: 17px;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    @media (max-width: 1050px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .readouts {
        grid-template-columns: repeat(3, minmax(120px, 1fr));
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 8px;
      }

      svg {
        min-width: 900px;
      }

      .controls {
        padding: 12px;
      }

      .segmented {
        grid-template-columns: 1fr;
      }

      .segmented button {
        border-right: 0;
        border-bottom: 1px solid var(--edge-strong);
      }

      .segmented button:last-child {
        border-bottom: 0;
      }

      .readouts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="Interactive U-tube manometer figure">

        <title id="figTitle">Closed-end and open-end manometer pressure relationships</title>
        <desc id="figDesc">Three U-tube manometer configurations show how gas pressure relates to atmospheric pressure and the liquid height difference h.</desc>
        <defs>

          <text class="label" x="439" y="101">Gas</text>

            <line class="thin-line" x1="-9" y1="7" x2="9" y2="7"></line>
            <rect x="-6" y="-6" width="12" height="30" rx="2" fill="#dfe7ea" stroke="#111" stroke-width="1.5"></rect>
            <line class="thin-line" x1="-12" y1="22" x2="12" y2="22"></line>
            <ellipse cx="0" cy="-5" rx="16" ry="4" fill="#dfe7ea" stroke="#111" stroke-width="1.5"></ellipse>
          </g>
          <path class="glass-outer" d="M584 106 L584 344 C584 393 652 393 652 344 L652 72"></path>
          <path class="glass-inner" d="M584 106 L584 344 C584 393 652 393 652 344 L652 72"></path>
          <path id="hg-below" class="mercury" d="M584 146 L584 344 C584 393 652 393 652 344 L652 292"></path>
          <path class="mercury-shine" d="M578 154 L578 342 C578 378 605 389 621 387"></path>
          <line id="surf-below-left" class="fluid-surface" x1="578" x2="590" y1="146" y2="146"></line>
          <line id="surf-below-right" class="fluid-surface" x1="646" x2="658" y1="292" y2="292"></line>
          <line class="thin-line" x1="652" x2="652" y1="68" y2="44"></line>
          <line class="thin-line" x1="625" x2="698" y1="72" y2="82"></line>
          <line class="thin-line" x1="649" x2="649" y1="17" y2="58" marker-end="url(#arrowBlack)"></line>
          <text class="small-label" x="624" y="22">
            <tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="16">atm</tspan>
          </text>
          <text class="small-label" x="706" y="89">Open end</text>
          <g id="h-below" class="height-arrow" data-type="below" tabindex="0" role="button" aria-label="Show open-end lower gas pressure derivation">

            <line id="guide-below-bottom" class="guide-line" x1="652" x2="689" y1="292" y2="292"></line>

            <text id="htext-below" x="664" y="229">h</text>
          </g>
          <g id="formula-below" class="formula" data-type="below">
            <rect class="formula-card" x="493" y="403" width="253" height="48"></rect>
            <text x="514" y="434">
              <tspan>P</tspan><tspan baseline-shift="sub" font-size="18">gas</tspan><tspan> = P</tspan><tspan baseline-shift="sub" font-size="18">atm</tspan><tspan> - h</tspan><tspan>ρ</tspan><tspan>g</tspan>
            </text>
          </g>
        </g>

        <g class="panel" id="panel-above" data-type="above">
          <rect class="panel-halo" x="840" y="14" width="388" height="458"></rect>
          <text class="svg-title" x="856" y="34">Gas above atmosphere</text>
          <circle class="gas-bulb" cx="880" cy="93" r="36" fill="url(#gasGrad)"></circle>
          <text class="label" x="858" y="101">Gas</text>
          <path class="tube-vapor" d="M915 93 H990 Q1003 93 1003 106 V143"></path>
          <path class="thin-line" d="M915 93 H990 Q1003 93 1003 106 V350"></path>
          <g transform="translate(950 76)">
            <line class="thin-line" x1="-14" y1="0" x2="14" y2="0"></line>
            <line class="thin-line" x1="-9" y1="7" x2="9" y2="7"></line>
            <rect x="-6" y="-6" width="12" height="30" rx="2" fill="#dfe7ea" stroke="#111" stroke-width="1.5"></rect>
            <line class="thin-line" x1="-12" y1="22" x2="12" y2="22"></line>
            <ellipse cx="0" cy="-5" rx="16" ry="4" fill="#dfe7ea" stroke="#111" stroke-width="1.5"></ellipse>
          </g>
          <path class="glass-outer" d="M1003 106 L1003 344 C1003 393 1071 393 1071 344 L1071 72"></path>
          <path class="glass-inner" d="M1003 106 L1003 344 C1003 393 1071 393 1071 344 L1071 72"></path>
          <path id="hg-above" class="mercury" d="M1003 143 L1003 344 C1003 393 1071 393 1071 344 L1071 112"></path>

          <line id="surf-above-right" class="fluid-surface" x1="1065" x2="1077" y1="112" y2="112"></line>
          <line class="thin-line" x1="1071" x2="1071" y1="68" y2="44"></line>
          <line class="thin-line" x1="1044" x2="1117" y1="72" y2="82"></line>
          <line class="thin-line" x1="1068" x2="1068" y1="17" y2="58" marker-end="url(#arrowBlack)"></line>
          <text class="small-label" x="1043" y="22">
            <tspan font-style="italic">P</tspan><tspan baseline-shift="sub" font-size="16">atm</tspan>
          </text>
          <text class="small-label" x="1124" y="89">Open end</text>
          <g id="h-above" class="height-arrow" data-type="above" tabindex="0" role="button" aria-label="Show open-end higher gas pressure derivation">
            <title>Open-end, gas above atmosphere derivation</title>
            <line id="guide-above-top" class="guide-line" x1="1071" x2="1124" y1="112" y2="112"></line>
            <line id="guide-above-bottom" class="guide-line" x1="1003" x2="1124" y1="143" y2="143"></line>
            <line id="arrow-above" x1="1107" x2="1107" y1="122" y2="133" marker-start="url(#arrowBlack)" marker-end="url(#arrowBlack)"></line>

            <text x="932" y="434">
              <tspan>P</tspan><tspan baseline-shift="sub" font-size="18">gas</tspan><tspan> = P</tspan><tspan baseline-shift="sub" font-size="18">atm</tspan><tspan> + h</tspan><tspan>ρ</tspan><tspan>g</tspan>
            </text>
          </g>

      </svg>
    </section>

    <section class="controls" aria-label="Manometer controls">
      <div class="control-block">
        <p class="control-title">Configuration</p>
        <div class="segmented" role="group" aria-label="Choose manometer configuration">
          <button type="button" data-config="closed" aria-pressed="true">Closed-end vacuum</button>
          <button type="button" data-config="below" aria-pressed="false">Open-end lower gas</button>
          <button type="button" data-config="above" aria-pressed="false">Open-end higher gas</button>
        </div>
      </div>

      <div class="control-block">
        <p class="control-title">Gas pressure Pgas</p>
        <div class="slider-row">
          <input id="pressureSlider" type="range" min="20" max="145" step="0.1" value="101.3" aria-label="Gas pressure in kilopascals">
          <output id="pressureValue" class="value-pill" for="pressureSlider">101.3 kPa</output>
        </div>
        <div class="readouts" aria-live="polite">
          <div class="metric">
            <span>P<sub>atm</sub></span>
            <strong id="atmReadout">101.3 kPa</strong>
          </div>
          <div class="metric">
            <span>hρg</span>
            <strong id="headReadout">101.3 kPa</strong>
          </div>
          <div class="metric">
            <span>h as Hg column</span>
            <strong id="heightReadout">760 mm</strong>
          </div>
        </div>
      </div>

      <div class="derivation" id="derivation" aria-live="polite">
        <h2 id="derivationTitle">Closed-end vacuum</h2>
        <ol id="derivationSteps"></ol>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const P_ATM = 101.3;
      const KPA_PER_MMHG = 0.133322;
      const SVG_H_PER_KPA_OPEN = 2.15;
      const SVG_H_PER_KPA_CLOSED = 0.94;
      const MIN_VISIBLE_H = 18;

      const state = {
        active: "closed",
        pressure: {
          closed: 101.3,
          below: 65,
          above: 128
        }
      };

      const configs = {
        closed: {
          label: "Closed-end vacuum",
          min: 20,
          max: 145,
          defaultPressure: 101.3,
          formula: "Pgas = hρg",
          pressureHead: pGas => pGas,
          svgHeight: pGas => Math.max(MIN_VISIBLE_H, pGas * SVG_H_PER_KPA_CLOSED),
          levels: h => {
            const mid = 220;
            return {
              left: clamp(mid + h / 2, 138, 322),
              right: clamp(mid - h / 2, 90, 302)
            };
          },
          derivation: [
            "The sealed end contains vacuum, so the pressure on the closed-side mercury surface is 0.",
            "At the same depth in the connected mercury, pressures are equal.",
            "The gas must support a mercury column of height h: Pgas = ρgh.",
            "Writing the factors in the diagram order gives Pgas = hρg."
          ]
        },
        below: {
          label: "Open-end: gas below atmosphere",
          min: 35,
          max: 100,
          defaultPressure: 65,
          formula: "Pgas = Patm - hρg",
          pressureHead: pGas => P_ATM - pGas,
          svgHeight: pGas => Math.max(MIN_VISIBLE_H, (P_ATM - pGas) * SVG_H_PER_KPA_OPEN),
          levels: h => {
            const mid = 219;
            return {
              left: clamp(mid - h / 2, 126, 285),
              right: clamp(mid + h / 2, 154, 318)
            };
          },
          derivation: [
            "The open arm is exposed to atmospheric pressure Patm.",
            "Here the gas-side liquid is higher, so atmospheric pressure is larger by the mercury head hρg.",
            "Balance pressures at one horizontal level: Patm = Pgas + hρg.",
            "Solving for the gas pressure gives Pgas = Patm - hρg."
          ]
        },
        above: {
          label: "Open-end: gas above atmosphere",
          min: 102,
          max: 170,
          defaultPressure: 128,
          formula: "Pgas = Patm + hρg",
          pressureHead: pGas => pGas - P_ATM,
          svgHeight: pGas => Math.max(MIN_VISIBLE_H, (pGas - P_ATM) * SVG_H_PER_KPA_OPEN),
          levels: h => {
            const mid = 132;
            return {
              left: clamp(mid + h / 2, 96, 204),
              right: clamp(mid - h / 2, 78, 168)
            };
          },
          derivation: [
            "The open arm is exposed to atmospheric pressure Patm.",
            "Here the open-arm liquid is higher, so the gas pressure is larger by the mercury head hρg.",
            "Balance pressures at the lower gas-side surface: Pgas = Patm + hρg.",
            "The plus sign marks gas pressure greater than atmospheric pressure."
          ]
        }
      };

      const geometry = {
        closed: {
          path: document.getElementById("hg-closed"),
          leftSurface: document.getElementById("surf-closed-left"),
          rightSurface: document.getElementById("surf-closed-right"),
          topGuide: document.getElementById("guide-closed-top"),
          bottomGuide: document.getElementById("guide-closed-bottom"),
          arrow: document.getElementById("arrow-closed"),
          hText: document.getElementById("htext-closed"),
          pathD: levels => `M164 ${levels.left.toFixed(1)} L164 344 C164 393 232 393 232 344 L232 ${levels.right.toFixed(1)}`,
          surface: {
            left: { x1: 158, x2: 170 },
            right: { x1: 226, x2: 238 }
          },
          guideTop: { x1: 232, x2: 267 },
          guideBottom: { x1: 164, x2: 267 },
          arrowX: 253,
          labelX: 244
        },
        below: {
          path: document.getElementById("hg-below"),
          leftSurface: document.getElementById("surf-below-left"),
          rightSurface: document.getElementById("surf-below-right"),
          topGuide: document.getElementById("guide-below-top"),
          bottomGuide: document.getElementById("guide-below-bottom"),
          arrow: document.getElementById("arrow-below"),
          hText: document.getElementById("htext-below"),
          pathD: levels => `M584 ${levels.left.toFixed(1)} L584 344 C584 393 652 393 652 344 L652 ${levels.right.toFixed(1)}`,
          surface: {
            left: { x1: 578, x2: 590 },
            right: { x1: 646, x2: 658 }
          },
          guideTop: { x1: 584, x2: 689 },
          guideBottom: { x1: 652, x2: 689 },
          arrowX: 672,
          labelX: 664
        },
        above: {
          path: document.getElementById("hg-above"),
          leftSurface: document.getElementById("surf-above-left"),
          rightSurface: document.getElementById("surf-above-right"),
          topGuide: document.getElementById("guide-above-top"),
          bottomGuide: document.getElementById("guide-above-bottom"),
          arrow: document.getElementById("arrow-above"),
          hText: document.getElementById("htext-above"),
          pathD: levels => `M1003 ${levels.left.toFixed(1)} L1003 344 C1003 393 1071 393 1071 344 L1071 ${levels.right.toFixed(1)}`,
          surface: {
            left: { x1: 997, x2: 1009 },
            right: { x1: 1065, x2: 1077 }
          },
          guideTop: { x1: 1071, x2: 1124 },
          guideBottom: { x1: 1003, x2: 1124 },
          arrowX: 1107,
          labelX: 1083
        }
      };

      const slider = document.getElementById("pressureSlider");
      const pressureValue = document.getElementById("pressureValue");
      const headReadout = document.getElementById("headReadout");
      const heightReadout = document.getElementById("heightReadout");
      const atmReadout = document.getElementById("atmReadout");
      const derivationTitle = document.getElementById("derivationTitle");
      const derivationSteps = document.getElementById("derivationSteps");
      const buttons = Array.from(document.querySelectorAll("[data-config]"));
      const arrows = Array.from(document.querySelectorAll(".height-arrow"));

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function setLineY(line, y) {
        line.setAttribute("y1", y.toFixed(1));
        line.setAttribute("y2", y.toFixed(1));
      }

      function setSurface(line, x1, x2, y) {
        line.setAttribute("x1", x1);
        line.setAttribute("x2", x2);
        setLineY(line, y);
      }

      function setVerticalLine(line, x, y1, y2) {
        line.setAttribute("x1", x);
        line.setAttribute("x2", x);
        line.setAttribute("y1", y1.toFixed(1));
        line.setAttribute("y2", y2.toFixed(1));
      }

      function updatePanel(type, pressure) {
        const cfg = configs[type];
        const geo = geometry[type];
        const h = cfg.svgHeight(pressure);
        const levels = cfg.levels(h);
        const upper = Math.min(levels.left, levels.right);
        const lower = Math.max(levels.left, levels.right);
        const arrowInset = Math.min(12, Math.max(6, (lower - upper) * 0.28));

        geo.path.setAttribute("d", geo.pathD(levels));
        setSurface(geo.leftSurface, geo.surface.left.x1, geo.surface.left.x2, levels.left);
        setSurface(geo.rightSurface, geo.surface.right.x1, geo.surface.right.x2, levels.right);
        setLineY(geo.topGuide, upper);
        setLineY(geo.bottomGuide, lower);
        geo.topGuide.setAttribute("x1", geo.guideTop.x1);
        geo.topGuide.setAttribute("x2", geo.guideTop.x2);
        geo.bottomGuide.setAttribute("x1", geo.guideBottom.x1);
        geo.bottomGuide.setAttribute("x2", geo.guideBottom.x2);
        setVerticalLine(geo.arrow, geo.arrowX, upper + arrowInset, lower - arrowInset);
        geo.hText.setAttribute("x", geo.labelX);
        geo.hText.setAttribute("y", ((upper + lower) / 2 + 9).toFixed(1));
      }

      function pressureToMmHg(pressureHead) {
        return pressureHead / KPA_PER_MMHG;
      }

      function renderDerivation(type) {
        derivationTitle.textContent = configs[type].label;
        derivationSteps.replaceChildren();
        configs[type].derivation.forEach(step => {
          const li = document.createElement("li");
          li.textContent = step;
          derivationSteps.appendChild(li);
        });
      }

      function setActive(type, options = {}) {
        state.active = type;
        const cfg = configs[type];
        if (typeof state.pressure[type] !== "number") {
          state.pressure[type] = cfg.defaultPressure;
        }

        slider.min = cfg.min;
        slider.max = cfg.max;
        slider.value = state.pressure[type].toFixed(1);

        buttons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.config === type));
        });

        Object.keys(configs).forEach(key => {
          document.getElementById(`panel-${key}`).classList.toggle("active", key === type);
          document.getElementById(`formula-${key}`).classList.toggle("active", key === type);
        });

        if (options.showDerivation !== false) {
          renderDerivation(type);
        }
        render();
      }

      function render() {
        Object.keys(configs).forEach(type => {
          updatePanel(type, state.pressure[type]);
        });

        const cfg = configs[state.active];
        const pGas = Number(slider.value);
        state.pressure[state.active] = pGas;
        const head = Math.abs(cfg.pressureHead(pGas));
        const hMm = pressureToMmHg(head);

        pressureValue.value = `${pGas.toFixed(1)} kPa`;
        pressureValue.textContent = `${pGas.toFixed(1)} kPa`;
        atmReadout.textContent = `${P_ATM.toFixed(1)} kPa`;
        headReadout.textContent = `${head.toFixed(1)} kPa`;
        heightReadout.textContent = `${Math.round(hMm)} mm`;
      }

      buttons.forEach(button => {
        button.addEventListener("click", () => setActive(button.dataset.config));
      });

      arrows.forEach(arrow => {
        arrow.addEventListener("click", () => setActive(arrow.dataset.type));
        arrow.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setActive(arrow.dataset.type);
          }
        });
      });

      slider.addEventListener("input", render);

      renderDerivation(state.active);
      render();
    })();
  </script>
</body>
</html>
