<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partition Construction for a Scalar Line Integral</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #5e6670;
      --paper: #ffffff;
      --panel: #f7f9fb;
      --line: #cfd6de;
      --blue: #2aa2d6;
      --blue-dark: #1689bd;
      --red: #f15454;
      --red-dark: #c93a3f;
      --gold: #ffe9b9;
      --gold-edge: #bfc3c8;
      --sum: #245e52;
      --shadow: 0 18px 46px rgba(35, 43, 52, 0.16);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background: linear-gradient(180deg, #f4f7fa 0%, #ffffff 72%);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .figure-shell {
      width: min(1220px, 100%);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(145px, 190px));
      gap: 12px;
      align-items: stretch;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .control-card,
    .readout {
      min-width: 0;
      border: 1px solid #d6dde5;
      border-radius: 8px;
      background: #ffffff;
      padding: 10px 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    label,
    .readout-label {
      color: #38414b;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      min-height: 28px;
      border-radius: 6px;
      color: #ffffff;
      background: var(--sum);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--sum);
    }

    .readout {
      display: grid;
      gap: 4px;
      align-content: center;
    }

    .readout-value {
      overflow: hidden;
      color: #16191d;
      font-size: 22px;
      line-height: 1.05;
      font-weight: 830;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .readout-value.small {
      font-size: 18px;
    }

    .stage {
      padding: 10px;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 520px;
      border: 1px solid #dde3e8;
      border-radius: 8px;
      background: #ffffff;
      touch-action: none;
      user-select: none;
    }

    .curve {
      fill: none;
      stroke: var(--blue);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .curve-shadow {
      fill: none;
      stroke: rgba(20, 74, 98, 0.12);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mass-fill {
      fill: none;
      stroke: rgba(255, 221, 148, 0.74);
      stroke-width: 25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mass-edge {
      fill: none;
      stroke: #b9bec5;
      stroke-width: 31;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.68;
    }

    .partition {
      fill: var(--blue);
      stroke: #ffffff;
      stroke-width: 3;
    }

    .sample-main {
      fill: var(--red);
      stroke: #ffffff;
      stroke-width: 2.4;
    }

    .sample-main.active {
      stroke: #7f2027;
      stroke-width: 3;
    }

    .inset-arc {
      fill: none;
      stroke: var(--blue);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .inset-arc-shadow {
      fill: none;
      stroke: rgba(26, 91, 122, 0.13);
      stroke-width: 17;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .handle {
      fill: var(--red);
      stroke: #ffffff;
      stroke-width: 3;
      cursor: grab;
    }

    .handle-zone {
      fill: transparent;
      cursor: grab;
    }

    .handle:active,
    .handle-zone:active {
      cursor: grabbing;
    }

    .math-label,
    .math-small,
    .formula {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      fill: var(--ink);
    }

    .math-label {
      font-size: 44px;
    }

    .math-small {
      font-size: 36px;
    }

    .dim-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-style: italic;
      fill: var(--ink);
    }

    .leader,
    .dim-line,
    .tick {
      fill: none;
      stroke: #22252a;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .leader {
      stroke-width: 2.7;
    }

    .formula-box {
      fill: #ffffff;
      stroke: #bfc3c8;
      stroke-width: 4;
    }

    .formula-wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #202124;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 41px;
      font-style: italic;
      white-space: nowrap;
    }

    .formula-wrap sub {
      font-size: 62%;
    }

    .formula-wrap sup {
      font-size: 62%;
      line-height: 0;
    }

    .zoom-edge {
      fill: none;
      stroke: var(--gold-edge);
      stroke-width: 79;
      stroke-linecap: round;
      opacity: 0.95;
    }

    .zoom-fill {
      fill: none;
      stroke: var(--gold);
      stroke-width: 67;
      stroke-linecap: round;
      opacity: 0.92;
    }

    .arrow-head-edge {
      fill: var(--gold-edge);
    }

    .arrow-head-fill {
      fill: var(--gold);
    }

    .note {
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      font-weight: 720;
      fill: #44505c;
    }

    @media (max-width: 860px) {
      body {
        padding: 10px;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
        padding: 10px;
      }

      .control-card {
        grid-column: 1 / -1;
      }

      .readout-value {
        font-size: 18px;
      }

      .stage {
        padding: 6px;
        overflow-x: auto;
      }

      svg {
        width: max(860px, 100%);
        min-height: 500px;
      }
    }

    @media (max-width: 520px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive line integral partition construction">
    <section class="controls" aria-label="Line integral controls and computed values">
      <div class="control-card">
        <div class="control-row">
          <label for="partitionSlider">partition segments</label>
          <span class="badge" id="partitionBadge">n = 8</span>
        </div>
        <input id="partitionSlider" type="range" min="4" max="28" step="1" value="8" aria-label="Number of partition segments">
      </div>
      <div class="readout">
        <div class="readout-label">&Sigma;&Delta;M<sub>k</sub></div>
        <div class="readout-value" id="sumReadout">0.000</div>
      </div>
      <div class="readout">
        <div class="readout-label">true line integral</div>
        <div class="readout-value" id="trueReadout">0.000</div>
      </div>
      <div class="readout">
        <div class="readout-label">max &Delta;s</div>
        <div class="readout-value small" id="meshReadout">0.000</div>
      </div>
    </section>

    <section class="stage">
      <svg id="figure" viewBox="0 0 1200 820" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Partition construction for a scalar line integral along a curve</title>
        <desc id="svgDesc">A curve from P equals P zero to Q equals P n is partitioned into arcs. The highlighted kth arc is zoomed to the right, where its sample point can be dragged along the isolated arc.</desc>
        <defs>
          <marker id="arrowEnd" markerWidth="15" markerHeight="12" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M 0 0 L 14 6 L 0 12 z" fill="#22252a"></path>
          </marker>
          <marker id="arrowStart" markerWidth="15" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M 14 0 L 0 6 L 14 12 z" fill="#22252a"></path>
          </marker>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#253240" flood-opacity="0.12"></feDropShadow>
          </filter>
        </defs>

        <rect x="0" y="0" width="1200" height="820" fill="#ffffff"></rect>

        <g id="zoomArrow" aria-hidden="true">
          <path class="zoom-edge" d="M 391 405 C 555 402 710 458 803 610"></path>
          <path class="zoom-fill" d="M 391 405 C 555 402 710 458 803 610"></path>
          <polygon class="arrow-head-edge" points="786,621 884,573 850,671"></polygon>
          <polygon class="arrow-head-fill" points="800,621 862,590 841,653"></polygon>
        </g>

        <g id="leftScene">
          <path id="mainCurveShadow" class="curve-shadow"></path>
          <path id="highlightEdge" class="mass-edge"></path>
          <path id="highlightFill" class="mass-fill"></path>
          <path id="mainCurve" class="curve"></path>
          <g id="leftDimensions"></g>
          <g id="samplePoints"></g>
          <g id="partitionPoints"></g>
          <g id="labels"></g>
        </g>

        <g id="rightInset" filter="url(#softShadow)">
          <path id="insetArcShadow" class="inset-arc-shadow"></path>
          <path id="insetArc" class="inset-arc"></path>
          <g id="insetEndpoints"></g>
          <path class="dim-line" d="M 777 560 C 872 564 973 541 1047 493" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"></path>
          <path class="tick" d="M 779 535 L 773 584"></path>
          <path class="tick" d="M 1035 468 L 1059 515"></path>
          <text class="dim-text" x="890" y="540">&Delta;s<tspan baseline-shift="sub" font-size="62%">k</tspan></text>
          <circle id="sampleHandle" class="handle" cx="0" cy="0" r="15" tabindex="0" aria-label="Drag sample point along the kth arc"></circle>
          <circle id="sampleHandleZone" class="handle-zone" cx="0" cy="0" r="34"></circle>
          <text class="math-label" x="735" y="665">
            <tspan>P</tspan><tspan baseline-shift="sub" font-size="65%">k-1</tspan>
          </text>
          <text class="math-label" x="1055" y="550">
            <tspan>P</tspan><tspan baseline-shift="sub" font-size="65%">k</tspan>
          </text>
          <text class="math-label" x="884" y="684">
            <tspan>P</tspan><tspan baseline-shift="super" font-size="58%">*</tspan><tspan baseline-shift="sub" font-size="58%">k</tspan><tspan baseline-shift="baseline">(x</tspan><tspan baseline-shift="super" font-size="58%">*</tspan><tspan baseline-shift="sub" font-size="58%">k</tspan><tspan baseline-shift="baseline">, y</tspan><tspan baseline-shift="super" font-size="58%">*</tspan><tspan baseline-shift="sub" font-size="58%">k</tspan><tspan baseline-shift="baseline">, z</tspan><tspan baseline-shift="super" font-size="58%">*</tspan><tspan baseline-shift="sub" font-size="58%">k</tspan><tspan baseline-shift="baseline">)</tspan>
          </text>
        </g>

        <g id="formulaBox">
          <rect class="formula-box" x="232" y="715" width="606" height="82"></rect>
          <foreignObject x="248" y="722" width="574" height="70">
            <div xmlns="http://www.w3.org/1999/xhtml" class="formula-wrap">
              &Delta;M<sub>k</sub> &asymp; f(x<sup>*</sup><sub>k</sub>, y<sup>*</sup><sub>k</sub>, z<sup>*</sup><sub>k</sub>)&Delta;s<sub>k</sub>
            </div>
          </foreignObject>
        </g>

        <text class="note" id="kReadout" x="870" y="765">kth section readout</text>
      </svg>
    </section>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("figure");
      const slider = document.getElementById("partitionSlider");
      const partitionBadge = document.getElementById("partitionBadge");
      const sumReadout = document.getElementById("sumReadout");
      const trueReadout = document.getElementById("trueReadout");
      const meshReadout = document.getElementById("meshReadout");
      const kReadout = document.getElementById("kReadout");

      const mainCurve = document.getElementById("mainCurve");
      const mainCurveShadow = document.getElementById("mainCurveShadow");
      const highlightEdge = document.getElementById("highlightEdge");
      const highlightFill = document.getElementById("highlightFill");
      const partitionGroup = document.getElementById("partitionPoints");
      const sampleGroup = document.getElementById("samplePoints");
      const labelGroup = document.getElementById("labels");
      const leftDimensions = document.getElementById("leftDimensions");
      const insetArc = document.getElementById("insetArc");
      const insetArcShadow = document.getElementById("insetArcShadow");
      const insetEndpoints = document.getElementById("insetEndpoints");
      const sampleHandle = document.getElementById("sampleHandle");
      const sampleHandleZone = document.getElementById("sampleHandleZone");

      const NS = "http://www.w3.org/2000/svg";
      const insetBezier = [
        { x: 773, y: 612 },
        { x: 861, y: 621 },
        { x: 986, y: 576 },
        { x: 1060, y: 533 }
      ];

      let sampleAlpha = 0.54;
      let dragging = false;

      function cubic(p0, p1, p2, p3, u) {
        const v = 1 - u;
        return {
          x: v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x,
          y: v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y
        };
      }

      function point2D(t) {
        if (t <= 0.56) {
          return cubic(
            { x: 70, y: 700 },
            { x: 171, y: 646 },
            { x: 287, y: 584 },
            { x: 366, y: 512 },
            t / 0.56
          );
        }
        if (t <= 0.86) {
          return cubic(
            { x: 366, y: 512 },
            { x: 454, y: 432 },
            { x: 488, y: 354 },
            { x: 516, y: 258 },
            (t - 0.56) / 0.30
          );
        }
        return cubic(
          { x: 516, y: 258 },
          { x: 548, y: 183 },
          { x: 560, y: 124 },
          { x: 580, y: 70 },
          (t - 0.86) / 0.14
        );
      }

      function point3D(t) {
        return {
          x: -1.8 + 3.7 * t + 0.18 * Math.sin(2 * Math.PI * t),
          y: -1.15 + 2.45 * t + 0.35 * Math.sin(1.55 * Math.PI * t + 0.45),
          z: 0.64 * Math.cos(2.3 * Math.PI * t) - 0.36 * t
        };
      }

      function density(t) {
        const p = point3D(t);
        return 1.18 + 0.28 * Math.sin(1.8 * p.x + 0.9 * p.z) + 0.21 * Math.cos(2.1 * p.y) + 0.24 * t;
      }

      function distance3(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
      }

      const lookup = (() => {
        const steps = 1800;
        const rows = [{ t: 0, s: 0, p: point3D(0) }];
        let s = 0;
        let previous = rows[0].p;
        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps;
          const p = point3D(t);
          s += distance3(previous, p);
          rows.push({ t, s, p });
          previous = p;
        }
        return { rows, total: s };
      })();

      const trueIntegral = (() => {
        let total = 0;
        for (let i = 1; i < lookup.rows.length; i += 1) {
          const a = lookup.rows[i - 1];
          const b = lookup.rows[i];
          const ds = b.s - a.s;
          const tMid = 0.5 * (a.t + b.t);
          total += density(tMid) * ds;
        }
        return total;
      })();

      function tAtArc(s) {
        const target = Math.max(0, Math.min(lookup.total, s));
        let lo = 0;
        let hi = lookup.rows.length - 1;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (lookup.rows[mid].s < target) lo = mid;
          else hi = mid;
        }
        const a = lookup.rows[lo];
        const b = lookup.rows[hi];
        const span = b.s - a.s || 1;
        return a.t + ((target - a.s) / span) * (b.t - a.t);
      }

      function pathFromT(t0, t1, count) {
        let d = "";
        for (let i = 0; i <= count; i += 1) {
          const t = t0 + (t1 - t0) * (i / count);
          const p = point2D(t);
          d += `${i === 0 ? "M" : "L"} ${p.x.toFixed(2)} ${p.y.toFixed(2)} `;
        }
        return d.trim();
      }

      function pathFromBezier(points, count) {
        let d = "";
        for (let i = 0; i <= count; i += 1) {
          const p = cubic(points[0], points[1], points[2], points[3], i / count);
          d += `${i === 0 ? "M" : "L"} ${p.x.toFixed(2)} ${p.y.toFixed(2)} `;
        }
        return d.trim();
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function svgEl(tag, attrs = {}) {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
        return el;
      }

      function addText(parent, x, y, text, className = "math-label", anchor = "start") {
        const el = svgEl("text", { x, y, class: className, "text-anchor": anchor });
        el.textContent = text;
        parent.appendChild(el);
        return el;
      }

      function addMathP(parent, x, y, sub, className = "math-label", anchor = "start") {
        const el = svgEl("text", { x, y, class: className, "text-anchor": anchor });
        const base = svgEl("tspan");
        base.textContent = "P";
        const subNode = svgEl("tspan", { "baseline-shift": "sub", "font-size": "65%" });
        subNode.textContent = sub;
        el.append(base, subNode);
        parent.appendChild(el);
        return el;
      }

      function addPIdentity(parent, x, y, symbol, sub, className = "math-label") {
        const el = svgEl("text", { x, y, class: className });
        const pre = svgEl("tspan");
        pre.textContent = `${symbol} = P`;
        const subNode = svgEl("tspan", { "baseline-shift": "sub", "font-size": "65%" });
        subNode.textContent = sub;
        el.append(pre, subNode);
        parent.appendChild(el);
        return el;
      }

      function addCircle(parent, p, r, className, attrs = {}) {
        const circle = svgEl("circle", {
          cx: p.x.toFixed(2),
          cy: p.y.toFixed(2),
          r,
          class: className,
          ...attrs
        });
        parent.appendChild(circle);
        return circle;
      }

      function addLeader(parent, x1, y1, x2, y2) {
        parent.appendChild(svgEl("path", {
          class: "leader",
          d: `M ${x1.toFixed(1)} ${y1.toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)}`,
          "marker-end": "url(#arrowEnd)"
        }));
      }

      function renderMainDimension(t0, t1) {
        clear(leftDimensions);
        const a = point2D(t0);
        const b = point2D(t1);
        const mid = point2D((t0 + t1) / 2);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const side = ny > 0 ? -1 : 1;
        const offset = 58;
        const p0 = { x: a.x + nx * offset * side, y: a.y + ny * offset * side };
        const p1 = { x: b.x + nx * offset * side, y: b.y + ny * offset * side };
        const pm = { x: mid.x + nx * (offset + 35) * side, y: mid.y + ny * (offset + 35) * side };
        leftDimensions.appendChild(svgEl("path", {
          class: "dim-line",
          d: `M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} C ${pm.x.toFixed(1)} ${pm.y.toFixed(1)} ${pm.x.toFixed(1)} ${pm.y.toFixed(1)} ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`,
          "marker-start": "url(#arrowStart)",
          "marker-end": "url(#arrowEnd)"
        }));
        leftDimensions.appendChild(svgEl("path", {
          class: "tick",
          d: `M ${(p0.x - nx * 22 * side).toFixed(1)} ${(p0.y - ny * 22 * side).toFixed(1)} L ${(p0.x + nx * 22 * side).toFixed(1)} ${(p0.y + ny * 22 * side).toFixed(1)}`
        }));
        leftDimensions.appendChild(svgEl("path", {
          class: "tick",
          d: `M ${(p1.x - nx * 22 * side).toFixed(1)} ${(p1.y - ny * 22 * side).toFixed(1)} L ${(p1.x + nx * 22 * side).toFixed(1)} ${(p1.y + ny * 22 * side).toFixed(1)}`
        }));
        const txt = addText(leftDimensions, pm.x - 44, pm.y - 10, "\u0394s", "dim-text");
        const sub = svgEl("tspan", { "baseline-shift": "sub", "font-size": "62%" });
        sub.textContent = "k";
        txt.appendChild(sub);
      }

      function renderLabels(n, k, partitionTs) {
        clear(labelGroup);
        const p0 = point2D(0);
        const pn = point2D(1);
        const pk0 = point2D(partitionTs[k - 1]);
        const pk1 = point2D(partitionTs[k]);
        addPIdentity(labelGroup, p0.x - 50, p0.y + 59, "P", "0");
        addPIdentity(labelGroup, pn.x - 19, pn.y - 12, "Q", "n");

        const count = Math.min(3, Math.max(0, n - 2));
        for (let i = 1; i <= count; i += 1) {
          if (i === k - 1 || i === k) continue;
          const p = point2D(partitionTs[i]);
          addMathP(labelGroup, p.x + 18, p.y + 42, String(i), "math-label");
        }

        if (n > 3 && n - 1 !== k && n - 1 !== k - 1) {
          const p = point2D(partitionTs[n - 1]);
          addMathP(labelGroup, p.x + 22, p.y + 27, "n-1", "math-label");
        }

        addMathP(labelGroup, pk0.x - 96, pk0.y + 65, "k-1", "math-label");
        addMathP(labelGroup, pk1.x + 54, pk1.y + 25, "k", "math-label");
        addLeader(labelGroup, pk1.x + 52, pk1.y + 1, pk1.x + 9, pk1.y - 2);

        const massX = Math.max(42, pk0.x - 230);
        const massY = Math.min(pk0.y + 162, 684);
        const massText = addText(labelGroup, massX, massY, "Mass \u0394M", "math-label");
        const sub = svgEl("tspan", { "baseline-shift": "sub", "font-size": "65%" });
        sub.textContent = "k";
        massText.appendChild(sub);
        addLeader(labelGroup, massX + 165, massY - 48, pk0.x - 8, pk0.y + 13);
      }

      function computeRiemann(n, k) {
        const ds = lookup.total / n;
        let sum = 0;
        for (let i = 1; i <= n; i += 1) {
          const alpha = i === k ? sampleAlpha : 0.5;
          const t = tAtArc(((i - 1 + alpha) / n) * lookup.total);
          sum += density(t) * ds;
        }
        return { sum, ds };
      }

      function nearestInsetAlpha(p) {
        let best = 0;
        let bestD = Infinity;
        for (let i = 0; i <= 180; i += 1) {
          const u = i / 180;
          const q = cubic(insetBezier[0], insetBezier[1], insetBezier[2], insetBezier[3], u);
          const d = (q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y);
          if (d < bestD) {
            bestD = d;
            best = u;
          }
        }
        return best;
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        const ctm = svg.getScreenCTM();
        return ctm ? pt.matrixTransform(ctm.inverse()) : { x: 0, y: 0 };
      }

      function updateFromPointer(evt) {
        sampleAlpha = nearestInsetAlpha(svgPoint(evt));
        render();
      }

      function render() {
        const n = Number(slider.value);
        const k = Math.min(n, Math.max(2, Math.round(n * 0.55)));
        const partitionTs = [];
        for (let i = 0; i <= n; i += 1) {
          partitionTs.push(tAtArc((i / n) * lookup.total));
        }

        const t0 = partitionTs[k - 1];
        const t1 = partitionTs[k];
        const highlighted = pathFromT(t0, t1, 42);
        const allCurve = pathFromT(0, 1, 240);
        mainCurve.setAttribute("d", allCurve);
        mainCurveShadow.setAttribute("d", allCurve);
        highlightEdge.setAttribute("d", highlighted);
        highlightFill.setAttribute("d", highlighted);

        clear(partitionGroup);
        clear(sampleGroup);
        for (let i = 0; i <= n; i += 1) {
          const p = point2D(partitionTs[i]);
          addCircle(partitionGroup, p, i === 0 || i === n ? 12 : 10, "partition");
        }
        for (let i = 1; i <= n; i += 1) {
          const alpha = i === k ? sampleAlpha : 0.5;
          const t = tAtArc(((i - 1 + alpha) / n) * lookup.total);
          const p = point2D(t);
          addCircle(sampleGroup, p, i === k ? 7.4 : 5.2, `sample-main${i === k ? " active" : ""}`);
        }

        renderMainDimension(t0, t1);
        renderLabels(n, k, partitionTs);

        const insetPath = pathFromBezier(insetBezier, 90);
        insetArc.setAttribute("d", insetPath);
        insetArcShadow.setAttribute("d", insetPath);
        clear(insetEndpoints);
        addCircle(insetEndpoints, insetBezier[0], 14, "partition");
        addCircle(insetEndpoints, insetBezier[3], 14, "partition");
        const h = cubic(insetBezier[0], insetBezier[1], insetBezier[2], insetBezier[3], sampleAlpha);
        sampleHandle.setAttribute("cx", h.x.toFixed(2));
        sampleHandle.setAttribute("cy", h.y.toFixed(2));
        sampleHandleZone.setAttribute("cx", h.x.toFixed(2));
        sampleHandleZone.setAttribute("cy", h.y.toFixed(2));

        const approx = computeRiemann(n, k);
        partitionBadge.textContent = `n = ${n}`;
        sumReadout.textContent = approx.sum.toFixed(4);
        trueReadout.textContent = trueIntegral.toFixed(4);
        meshReadout.textContent = approx.ds.toFixed(4);
        const kthMass = density(tAtArc(((k - 1 + sampleAlpha) / n) * lookup.total)) * approx.ds;
        kReadout.textContent = `Highlighted section: k = ${k}, \u0394M\u2096 \u2248 ${kthMass.toFixed(4)}`;
      }

      slider.addEventListener("input", render);
      [sampleHandle, sampleHandleZone].forEach((target) => {
        target.addEventListener("pointerdown", (evt) => {
          dragging = true;
          target.setPointerCapture(evt.pointerId);
          updateFromPointer(evt);
        });
        target.addEventListener("pointermove", (evt) => {
          if (dragging) updateFromPointer(evt);
        });
        target.addEventListener("pointerup", (evt) => {
          dragging = false;
          target.releasePointerCapture(evt.pointerId);
        });
        target.addEventListener("pointercancel", () => {
          dragging = false;
        });
      });
      sampleHandle.addEventListener("keydown", (evt) => {
        if (evt.key === "ArrowLeft" || evt.key === "ArrowDown") {
          evt.preventDefault();
          sampleAlpha = Math.max(0, sampleAlpha - 0.025);
          render();
        }
        if (evt.key === "ArrowRight" || evt.key === "ArrowUp") {
          evt.preventDefault();
          sampleAlpha = Math.min(1, sampleAlpha + 0.025);
          render();
        }
      });

      trueReadout.textContent = trueIntegral.toFixed(4);
      render();
    })();
  </script>
</body>
</html>
