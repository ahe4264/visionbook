<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green's Theorem on a Region with a Hole</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f6f8;
      --paper: #ffffff;
      --ink: #222326;
      --muted: #5f6670;
      --blue: #28a4dd;
      --blue-dark: #1686bd;
      --region: #c8e4f1;
      --cut: #222326;
      --line: #d5dde3;
      --panel: #f8fbfc;
      --focus: rgba(40, 164, 221, 0.28);
      --shadow: 0 18px 48px rgba(21, 37, 47, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #edf5f8 0%, #ffffff 76%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    main {
      width: min(1180px, 100%);
    }

    .figure-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      background: #fbfdfe;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 26px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid #c7d5df;
      border-radius: 8px;
      background: #eef5f8;
    }

    button {
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 0 13px;
      color: #27323a;
      background: transparent;
      font: 800 14px/1 ui-sans-serif, system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    button[aria-pressed="true"],
    button.primary {
      color: #ffffff;
      background: #1b759d;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    }

    button:focus-visible,
    .svg-stage:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .stage-wrap {
      padding: 12px;
      background: var(--paper);
    }

    .svg-stage {
      display: block;
      width: 100%;
      height: min(72vh, 720px);
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      touch-action: none;
      user-select: none;
    }

    .panel-field {
      fill: var(--panel);
      stroke: #e0e8ed;
      stroke-width: 1.4;
    }

    .region {
      fill: var(--region);
      stroke: var(--blue);
      stroke-width: 9;
      stroke-linejoin: round;
      transition: opacity 280ms ease;
    }

    .outer-arrow,
    .inner-arrow {
      fill: none;
      stroke: var(--blue);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .cut-line {
      fill: none;
      stroke: var(--cut);
      stroke-width: 4.2;
      stroke-linecap: square;
      transition: opacity 340ms ease, stroke-dashoffset 520ms ease;
    }

    .cut-arrow {
      fill: none;
      stroke: var(--cut);
      stroke-width: 3.7;
      stroke-linecap: round;
      transition: opacity 340ms ease, transform 520ms ease;
    }

    .cut-arrow.faint {
      opacity: 0.72;
    }

    .cut-layer {
      opacity: 1;
      transition: opacity 340ms ease;
    }

    .construction-off .cut-layer {
      opacity: 0;
      pointer-events: none;
    }

    .construction-off .cut-line {
      stroke-dashoffset: 160;
    }

    .construction-off .upper-label,
    .construction-off .lower-label {
      opacity: 0;
      transform: translateY(8px);
    }

    .construction-off .single-r-label {
      opacity: 1;
    }

    .panel-b .single-r-label {
      opacity: 0;
    }

    .construction-off .panel-b .single-r-label {
      opacity: 1;
    }

    .label {
      fill: #232326;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 5;
      stroke-linejoin: round;
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .boundary-label {
      font-size: 54px;
    }

    .region-label {
      font-size: 56px;
    }

    .panel-label {
      fill: #232326;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 50px;
      font-style: italic;
      text-anchor: middle;
    }

    .caption-note {
      fill: #4e5961;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hole-hit {
      fill: rgba(255, 255, 255, 0.001);
      cursor: grab;
      pointer-events: all;
    }

    .hole-hit:active {
      cursor: grabbing;
    }

    .hole-outline-active {
      fill: none;
      stroke: rgba(22, 134, 189, 0);
      stroke-width: 24;
      cursor: grab;
      pointer-events: stroke;
    }

    .resize-handle {
      fill: #ffffff;
      stroke: var(--blue-dark);
      stroke-width: 3;
      cursor: nwse-resize;
      filter: drop-shadow(0 2px 3px rgba(23, 61, 79, 0.22));
      pointer-events: all;
    }

    .ghost-handle {
      opacity: 0.88;
    }

    .active-hint {
      fill: none;
      stroke: rgba(22, 134, 189, 0.22);
      stroke-width: 2.2;
      stroke-dasharray: 7 7;
      pointer-events: none;
    }

    .readout {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 0 12px 12px;
      background: var(--paper);
    }

    .fact {
      min-width: 0;
      border: 1px solid #d7e1e7;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfdfe;
    }

    .fact b {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
      color: #65717a;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .fact span {
      display: block;
      color: #25313a;
      font-size: 14px;
      line-height: 1.28;
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
      }

      .topbar {
        align-items: stretch;
      }

      .controls,
      .toggle {
        width: 100%;
      }

      .controls {
        justify-content: stretch;
      }

      .toggle {
        flex: 1 1 auto;
      }

      button {
        padding: 0 10px;
        font-size: 13px;
      }

      .stage-wrap {
        padding: 8px;
      }

      .svg-stage {
        height: min(78vh, 820px);
        min-height: 620px;
      }

      .readout {
        grid-template-columns: 1fr;
        padding: 0 8px 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" aria-labelledby="figure-title">
      <div class="topbar">
        <h1 id="figure-title">Green's Theorem with One Hole</h1>
        <div class="controls" aria-label="Figure controls">
          <div class="toggle" role="group" aria-label="Panel toggle">
            <button id="panelAButton" type="button" aria-pressed="false">Panel (a)</button>
            <button id="panelBButton" type="button" aria-pressed="true">Panel (b)</button>
          </div>
          <button id="resetButton" class="primary" type="button">Reset</button>
        </div>
      </div>

      <div class="stage-wrap">
        <svg id="figureSvg" class="svg-stage" viewBox="0 0 1080 700" role="img" tabindex="0" aria-label="Two panels showing a positively oriented multiply connected region and the cuts used to apply Green's Theorem.">
          <defs>
            <marker id="blueArrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
              <path d="M 0 0 L 12 6 L 0 12 L 3.2 6 Z" fill="#28a4dd"></path>
            </marker>
            <marker id="blackArrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7.2" markerHeight="7.2" orient="auto-start-reverse">
              <path d="M 0 0 L 12 6 L 0 12 L 3.1 6 Z" fill="#222326"></path>
            </marker>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#12303f" flood-opacity="0.12"></feDropShadow>
            </filter>
          </defs>

          <g id="panelA" class="panel-a" transform="translate(28 22)">
            <rect class="panel-field" x="0" y="0" width="500" height="636" rx="8"></rect>
            <path id="regionA" class="region" fill-rule="evenodd" filter="url(#softShadow)"></path>
            <path class="outer-arrow" d="M 255 82 C 202 79 150 87 99 108" marker-end="url(#blueArrow)"></path>
            <path class="outer-arrow" d="M 337 557 C 371 553 398 540 420 515" marker-end="url(#blueArrow)"></path>
            <path id="innerArrowA1" class="inner-arrow" marker-end="url(#blueArrow)"></path>
            <path id="innerArrowA2" class="inner-arrow" marker-end="url(#blueArrow)"></path>
            <path id="holeHitA" class="hole-hit"></path>
            <path id="holeActiveA" class="hole-outline-active"></path>
            <circle id="handleA" class="resize-handle" r="9" aria-hidden="true"></circle>
            <text class="label boundary-label" x="248" y="55" text-anchor="middle">C<tspan dy="13" font-size="31">1</tspan></text>
            <text id="c2LabelA" class="label boundary-label" text-anchor="middle">C<tspan dy="13" font-size="31">2</tspan></text>
            <text class="label region-label" x="238" y="222" text-anchor="middle">R</text>
            <text class="panel-label" x="250" y="622">(a)</text>
          </g>

          <g id="panelB" class="panel-b" transform="translate(552 22)">
            <rect class="panel-field" x="0" y="0" width="500" height="636" rx="8"></rect>
            <path id="regionB" class="region" fill-rule="evenodd" filter="url(#softShadow)"></path>
            <path class="outer-arrow" d="M 255 82 C 202 79 150 87 99 108" marker-end="url(#blueArrow)"></path>
            <path class="outer-arrow" d="M 337 557 C 371 553 398 540 420 515" marker-end="url(#blueArrow)"></path>
            <path id="innerArrowB1" class="inner-arrow" marker-end="url(#blueArrow)"></path>
            <path id="innerArrowB2" class="inner-arrow" marker-end="url(#blueArrow)"></path>

            <g id="cutLayer" class="cut-layer">
              <path id="leftCutTop" class="cut-line"></path>
              <path id="leftCutBottom" class="cut-line"></path>
              <path id="rightCutTop" class="cut-line"></path>
              <path id="rightCutBottom" class="cut-line"></path>
              <path id="leftCutTopArrow" class="cut-arrow" marker-end="url(#blackArrow)"></path>
              <path id="rightCutTopArrow" class="cut-arrow" marker-end="url(#blackArrow)"></path>
              <path id="leftCutBottomArrow" class="cut-arrow faint" marker-end="url(#blackArrow)"></path>
              <path id="rightCutBottomArrow" class="cut-arrow faint" marker-end="url(#blackArrow)"></path>
            </g>

            <path id="holeHitB" class="hole-hit"></path>
            <path id="holeActiveB" class="hole-outline-active"></path>
            <circle id="handleB" class="resize-handle ghost-handle" r="9" aria-hidden="true"></circle>
            <ellipse id="activeHint" class="active-hint"></ellipse>
            <text class="label boundary-label" x="248" y="55" text-anchor="middle">C<tspan dy="13" font-size="31">1</tspan></text>
            <text id="c2LabelB" class="label boundary-label" text-anchor="middle">C<tspan dy="13" font-size="31">2</tspan></text>
            <text id="rLabelB" class="label region-label single-r-label" x="238" y="222" text-anchor="middle">R</text>
            <text class="label region-label upper-label" x="228" y="222" text-anchor="middle">R<tspan dy="-15" font-size="34">'</tspan></text>
            <text class="label region-label lower-label" x="232" y="493" text-anchor="middle">R<tspan dy="-15" font-size="34">''</tspan></text>
            <text class="panel-label" x="250" y="622">(b)</text>
          </g>
        </svg>
      </div>

      <div class="readout" aria-label="Mathematical readout">
        <div class="fact">
          <b>Positive Boundary</b>
          <span>C<sub>1</sub> counterclockwise, C<sub>2</sub> clockwise</span>
        </div>
        <div class="fact">
          <b>Cut Contributions</b>
          <span>Opposite arrows give equal and opposite line integrals</span>
        </div>
        <div class="fact">
          <b>Combined Result</b>
          <span>&int;<sub>C<sub>1</sub></sub> + &int;<sub>C<sub>2</sub></sub> remains after cancellation</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("figureSvg");
      const panelAButton = document.getElementById("panelAButton");
      const panelBButton = document.getElementById("panelBButton");
      const resetButton = document.getElementById("resetButton");
      const panelB = document.getElementById("panelB");

      const elements = {
        regionA: document.getElementById("regionA"),
        regionB: document.getElementById("regionB"),
        holeHitA: document.getElementById("holeHitA"),
        holeHitB: document.getElementById("holeHitB"),
        holeActiveA: document.getElementById("holeActiveA"),
        holeActiveB: document.getElementById("holeActiveB"),
        handleA: document.getElementById("handleA"),
        handleB: document.getElementById("handleB"),
        activeHint: document.getElementById("activeHint"),
        c2LabelA: document.getElementById("c2LabelA"),
        c2LabelB: document.getElementById("c2LabelB"),
        innerArrowA1: document.getElementById("innerArrowA1"),
        innerArrowA2: document.getElementById("innerArrowA2"),
        innerArrowB1: document.getElementById("innerArrowB1"),
        innerArrowB2: document.getElementById("innerArrowB2"),
        leftCutTop: document.getElementById("leftCutTop"),
        leftCutBottom: document.getElementById("leftCutBottom"),
        rightCutTop: document.getElementById("rightCutTop"),
        rightCutBottom: document.getElementById("rightCutBottom"),
        leftCutTopArrow: document.getElementById("leftCutTopArrow"),
        rightCutTopArrow: document.getElementById("rightCutTopArrow"),
        leftCutBottomArrow: document.getElementById("leftCutBottomArrow"),
        rightCutBottomArrow: document.getElementById("rightCutBottomArrow")
      };

      const outerPath = [
        "M 245 86",
        "C 116 78 29 141 25 228",
        "C 22 270 57 282 111 278",
        "C 171 273 190 300 183 331",
        "C 178 360 141 383 124 429",
        "C 96 505 172 555 301 561",
        "C 411 566 476 487 483 362",
        "C 490 225 389 96 245 86",
        "Z"
      ].join(" ");

      const defaults = Object.freeze({ cx: 316, cy: 361, rx: 72, ry: 84 });
      const state = { ...defaults, mode: "b", drag: null };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const fmt = value => Number(value).toFixed(1).replace(/\.0$/, "");

      function holePath(cx, cy, rx, ry) {
        return [
          `M ${fmt(cx - 0.98 * rx)} ${fmt(cy - 0.54 * ry)}`,
          `C ${fmt(cx - 1.06 * rx)} ${fmt(cy - 0.95 * ry)} ${fmt(cx - 0.32 * rx)} ${fmt(cy - 1.01 * ry)} ${fmt(cx + 0.15 * rx)} ${fmt(cy - 0.91 * ry)}`,
          `C ${fmt(cx + 0.84 * rx)} ${fmt(cy - 0.78 * ry)} ${fmt(cx + 1.09 * rx)} ${fmt(cy - 0.18 * ry)} ${fmt(cx + 0.96 * rx)} ${fmt(cy + 0.33 * ry)}`,
          `C ${fmt(cx + 0.78 * rx)} ${fmt(cy + 0.97 * ry)} ${fmt(cx + 0.13 * rx)} ${fmt(cy + 1.08 * ry)} ${fmt(cx - 0.30 * rx)} ${fmt(cy + 0.89 * ry)}`,
          `C ${fmt(cx - 0.88 * rx)} ${fmt(cy + 0.65 * ry)} ${fmt(cx - 0.50 * rx)} ${fmt(cy + 0.10 * ry)} ${fmt(cx - 0.58 * rx)} ${fmt(cy - 0.04 * ry)}`,
          `C ${fmt(cx - 0.70 * rx)} ${fmt(cy - 0.28 * ry)} ${fmt(cx - 1.05 * rx)} ${fmt(cy - 0.14 * ry)} ${fmt(cx - 0.98 * rx)} ${fmt(cy - 0.54 * ry)}`,
          "Z"
        ].join(" ");
      }

      function localPointFromEvent(event) {
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const svgPoint = point.matrixTransform(svg.getScreenCTM().inverse());
        const inA = svgPoint.x < 540;
        return {
          x: svgPoint.x - (inA ? 28 : 552),
          y: svgPoint.y - 22,
          panel: inA ? "a" : "b"
        };
      }

      function constrainHole(next) {
        const rx = clamp(next.rx, 44, 87);
        const ry = clamp(next.ry, 54, 98);
        const cx = clamp(next.cx, 170 + rx, 433 - rx);
        const cy = clamp(next.cy, 177 + ry, 511 - ry);
        return { cx, cy, rx, ry };
      }

      function cutGeometry() {
        const { cx, cy, rx, ry } = state;
        const yTop = cy - 0.16 * ry;
        const yBottom = cy + 0.24 * ry;
        const leftHole = cx - 0.64 * rx;
        const rightHole = cx + 0.99 * rx;
        const leftStart = Math.max(118, Math.min(178, leftHole - 92));
        const rightEnd = Math.min(462, Math.max(410, rightHole + 84));
        return { yTop, yBottom, leftHole, rightHole, leftStart, rightEnd };
      }

      function setLine(path, x1, y1, x2, y2) {
        path.setAttribute("d", `M ${fmt(x1)} ${fmt(y1)} L ${fmt(x2)} ${fmt(y2)}`);
      }

      function setArrow(path, x1, y1, x2, y2) {
        path.setAttribute("d", `M ${fmt(x1)} ${fmt(y1)} L ${fmt(x2)} ${fmt(y2)}`);
      }

      function render() {
        const { cx, cy, rx, ry } = state;
        const hole = holePath(cx, cy, rx, ry);
        const compound = `${outerPath} ${hole}`;

        elements.regionA.setAttribute("d", compound);
        elements.regionB.setAttribute("d", compound);
        elements.holeHitA.setAttribute("d", hole);
        elements.holeHitB.setAttribute("d", hole);
        elements.holeActiveA.setAttribute("d", hole);
        elements.holeActiveB.setAttribute("d", hole);

        elements.handleA.setAttribute("cx", fmt(cx + 0.75 * rx));
        elements.handleA.setAttribute("cy", fmt(cy + 0.72 * ry));
        elements.handleB.setAttribute("cx", fmt(cx + 0.75 * rx));
        elements.handleB.setAttribute("cy", fmt(cy + 0.72 * ry));
        elements.activeHint.setAttribute("cx", fmt(cx));
        elements.activeHint.setAttribute("cy", fmt(cy + 0.05 * ry));
        elements.activeHint.setAttribute("rx", fmt(rx * 1.18));
        elements.activeHint.setAttribute("ry", fmt(ry * 1.16));

        elements.c2LabelA.setAttribute("x", fmt(cx + 0.03 * rx));
        elements.c2LabelA.setAttribute("y", fmt(cy - 1.04 * ry));
        elements.c2LabelB.setAttribute("x", fmt(cx + 0.03 * rx));
        elements.c2LabelB.setAttribute("y", fmt(cy - 1.04 * ry));

        const innerTop = `M ${fmt(cx - 0.76 * rx)} ${fmt(cy - 0.62 * ry)} C ${fmt(cx - 0.18 * rx)} ${fmt(cy - 0.93 * ry)} ${fmt(cx + 0.73 * rx)} ${fmt(cy - 0.75 * ry)} ${fmt(cx + 0.88 * rx)} ${fmt(cy - 0.16 * ry)}`;
        const innerBottom = `M ${fmt(cx + 0.40 * rx)} ${fmt(cy + 0.90 * ry)} C ${fmt(cx - 0.22 * rx)} ${fmt(cy + 1.05 * ry)} ${fmt(cx - 0.70 * rx)} ${fmt(cy + 0.57 * ry)} ${fmt(cx - 0.47 * rx)} ${fmt(cy + 0.06 * ry)}`;
        elements.innerArrowA1.setAttribute("d", innerTop);
        elements.innerArrowA2.setAttribute("d", innerBottom);
        elements.innerArrowB1.setAttribute("d", innerTop);
        elements.innerArrowB2.setAttribute("d", innerBottom);

        const cuts = cutGeometry();
        setLine(elements.leftCutTop, cuts.leftStart, cuts.yTop, cuts.leftHole, cuts.yTop);
        setLine(elements.leftCutBottom, cuts.leftStart + 1, cuts.yBottom, cuts.leftHole + 3, cuts.yBottom);
        setLine(elements.rightCutTop, cuts.rightHole, cuts.yTop, cuts.rightEnd, cuts.yTop);
        setLine(elements.rightCutBottom, cuts.rightHole - 2, cuts.yBottom, cuts.rightEnd - 1, cuts.yBottom);

        const leftMid = (cuts.leftStart + cuts.leftHole) / 2;
        const rightMid = (cuts.rightHole + cuts.rightEnd) / 2;
        setArrow(elements.leftCutTopArrow, leftMid - 32, cuts.yTop - 1, leftMid + 31, cuts.yTop - 1);
        setArrow(elements.rightCutTopArrow, rightMid - 35, cuts.yTop - 1, rightMid + 36, cuts.yTop - 1);
        setArrow(elements.leftCutBottomArrow, leftMid + 34, cuts.yBottom + 1, leftMid - 34, cuts.yBottom + 1);
        setArrow(elements.rightCutBottomArrow, rightMid + 36, cuts.yBottom + 1, rightMid - 35, cuts.yBottom + 1);

        document.body.classList.toggle("construction-off", state.mode === "a");
        panelAButton.setAttribute("aria-pressed", String(state.mode === "a"));
        panelBButton.setAttribute("aria-pressed", String(state.mode === "b"));
      }

      function startDrag(event, kind) {
        event.preventDefault();
        const p = localPointFromEvent(event);
        state.drag = {
          kind,
          pointerId: event.pointerId,
          startX: p.x,
          startY: p.y,
          cx: state.cx,
          cy: state.cy,
          rx: state.rx,
          ry: state.ry
        };
        svg.setPointerCapture(event.pointerId);
      }

      function moveDrag(event) {
        if (!state.drag || event.pointerId !== state.drag.pointerId) {
          return;
        }
        const p = localPointFromEvent(event);
        const dx = p.x - state.drag.startX;
        const dy = p.y - state.drag.startY;
        let next;
        if (state.drag.kind === "resize") {
          const uniform = Math.max(dx * 0.86, dy * 0.72);
          next = {
            cx: state.drag.cx,
            cy: state.drag.cy,
            rx: state.drag.rx + uniform,
            ry: state.drag.ry + uniform * 0.9
          };
        } else {
          next = {
            cx: state.drag.cx + dx,
            cy: state.drag.cy + dy,
            rx: state.drag.rx,
            ry: state.drag.ry
          };
        }
        Object.assign(state, constrainHole(next));
        render();
      }

      function endDrag(event) {
        if (state.drag && event.pointerId === state.drag.pointerId) {
          svg.releasePointerCapture(event.pointerId);
          state.drag = null;
        }
      }

      [elements.holeHitA, elements.holeHitB, elements.holeActiveA, elements.holeActiveB].forEach(node => {
        node.addEventListener("pointerdown", event => startDrag(event, "move"));
      });
      [elements.handleA, elements.handleB].forEach(node => {
        node.addEventListener("pointerdown", event => startDrag(event, "resize"));
      });

      svg.addEventListener("pointermove", moveDrag);
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);

      panelAButton.addEventListener("click", () => {
        state.mode = "a";
        render();
      });

      panelBButton.addEventListener("click", () => {
        state.mode = "b";
        render();
      });

      resetButton.addEventListener("click", () => {
        Object.assign(state, defaults, { mode: "b", drag: null });
        render();
      });

      render();
    })();
  </script>
</body>
</html>
