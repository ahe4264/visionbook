<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell Method: Rectangle to Cylindrical Shell</title>
  <style>
    :root {
      --ink: #22252a;
      --muted: #65717f;
      --paper: #ffffff;
      --panel: #f7fafc;
      --line: #21b8bd;
      --line-dark: #138f96;
      --shell: #a9d9d3;
      --axis: #22252a;
      --grid: #d8dee6;
      --edge: #7b8087;
      --gold: #d79a21;
      --blue: #2563eb;
      --rose: #c24160;
      --violet: #7c3aed;
      --shadow: 0 18px 48px rgba(26, 34, 48, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #edf2f6 0%, #f9fbfd 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1240px, calc(100vw - 20px));
      margin: 14px auto;
    }

    .figure-shell {
      overflow: hidden;
      border: 1px solid #d9e1ea;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(230px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #d9e1ea;
      background: #fbfdff;
    }

    .control {
      min-width: 0;
    }

    .control-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: #313842;
      font-size: 14px;
      font-weight: 750;
    }

    output {
      color: var(--line-dark);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--line-dark);
    }

    .factor-group {
      display: grid;
      grid-template-columns: repeat(4, max-content);
      gap: 6px;
      align-items: center;
      justify-content: end;
    }

    .factor-group > span {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    button {
      min-height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 11px;
      background: #ffffff;
      color: #374151;
      font: 760 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    button[aria-pressed="true"] {
      border-color: var(--line-dark);
      background: #e6f7f5;
      color: #0f7378;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(33, 184, 189, 0.28);
      outline-offset: 2px;
    }

    .readout {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      border-bottom: 1px solid #d9e1ea;
      background: #d9e1ea;
    }

    .readout div {
      min-width: 0;
      padding: 9px 12px;
      background: #ffffff;
    }

    .readout span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .readout strong {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: #1f2937;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage {
      overflow-x: auto;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 780px;
      height: auto;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2.6;
      fill: none;
    }

    .axis-label,
    .math-label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .axis-label {
      font-size: 28px;
    }

    .math-label {
      font-size: 28px;
    }

    .small-math {
      fill: #30343a;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 22px;
    }

    .curve {
      stroke: var(--line);
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
    }

    .strip {
      stroke: rgba(86, 95, 104, 0.75);
      stroke-width: 1.1;
    }

    .strip.selected {
      stroke: #65707a;
      stroke-width: 2.2;
    }

    .shell-edge {
      stroke: rgba(93, 100, 107, 0.86);
      stroke-width: 2.2;
      fill: none;
    }

    .shell-edge.light {
      stroke: rgba(125, 132, 139, 0.42);
      stroke-width: 1.7;
    }

    .formula-line {
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
    }

    .formula-label {
      fill: #1f2937;
      font-size: 15px;
      font-weight: 820;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .caption-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 0 42px 18px;
      background: #ffffff;
    }

    .caption-block {
      text-align: center;
    }

    .caption-box {
      display: inline-block;
      max-width: 430px;
      border: 3px solid #c4c7cb;
      padding: 10px 16px 12px;
      text-align: left;
      color: #25272b;
      font-size: clamp(20px, 2.4vw, 31px);
      line-height: 1.22;
    }

    .panel-mark {
      margin-top: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 3vw, 40px);
      font-style: italic;
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .factor-group {
        justify-content: start;
      }

      .readout {
        grid-template-columns: repeat(2, 1fr);
      }

      .readout div:last-child {
        grid-column: 1 / -1;
      }

      .caption-row {
        grid-template-columns: 1fr;
        gap: 16px;
        padding-inline: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" aria-labelledby="figureTitle">
      <div class="toolbar">
        <div class="control">
          <div class="control-row">
            <label for="kSlider">Strip index <i>k</i></label>
            <output id="kOut" for="kSlider">4 of 8</output>
          </div>
          <input id="kSlider" type="range" min="1" max="8" step="1" value="4" aria-label="Strip index k">
        </div>
        <div class="control">
          <div class="control-row">
            <label for="nSlider">Number of strips <i>n</i></label>
            <output id="nOut" for="nSlider">8</output>
          </div>
          <input id="nSlider" type="range" min="4" max="48" step="1" value="8" aria-label="Number of strips n">
        </div>
        <div class="factor-group" role="group" aria-label="Shell formula factor">
          <span>Formula factor</span>
          <button type="button" data-factor="radius" aria-pressed="true">radius</button>
          <button type="button" data-factor="height" aria-pressed="false">height</button>
          <button type="button" data-factor="circumference" aria-pressed="false">circumference</button>
          <button type="button" data-factor="thickness" aria-pressed="false">thickness</button>
        </div>
      </div>

      <div class="readout" aria-live="polite">
        <div>
          <span>radius</span>
          <strong id="radiusReadout">r = 0.000</strong>
        </div>
        <div>
          <span>height</span>
          <strong id="heightReadout">h = 0.000</strong>
        </div>
        <div>
          <span>thickness</span>
          <strong id="dxReadout">Delta x = 0.000</strong>
        </div>
        <div>
          <span>selected shell</span>
          <strong id="shellReadout">Delta V = 0.000</strong>
        </div>
        <div>
          <span>shell sum</span>
          <strong id="sumReadout">V_n = 0.000</strong>
        </div>
      </div>

      <div class="stage">
        <svg id="figureSvg" viewBox="0 0 1200 610" role="img" aria-labelledby="figureTitle figureDesc">
          <title id="figureTitle">The shell method with a selected rectangle and its cylindrical shell</title>
          <desc id="figureDesc">Panel a shows a vertical rectangle under a decreasing curve. Panel b shows the hollow cylindrical shell generated when that rectangle revolves around the y-axis.</desc>
          <defs>
            <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#22252a"></path>
            </marker>
            <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#138f96"></path>
            </marker>
            <marker id="goldArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#d79a21"></path>
            </marker>
            <linearGradient id="shellSide" x1="0%" x2="100%" y1="0%" y2="0%">
              <stop offset="0%" stop-color="#d7dce1" stop-opacity="0.42"></stop>
              <stop offset="50%" stop-color="#f3f5f7" stop-opacity="0.58"></stop>
              <stop offset="100%" stop-color="#b8deda" stop-opacity="0.48"></stop>
            </linearGradient>
            <linearGradient id="selectedWall" x1="0%" x2="100%" y1="0%" y2="0%">
              <stop offset="0%" stop-color="#bfe8e3" stop-opacity="0.75"></stop>
              <stop offset="100%" stop-color="#8ccdc7" stop-opacity="0.88"></stop>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.13"></feDropShadow>
            </filter>
          </defs>
          <g id="panelA"></g>
          <g id="panelB"></g>
        </svg>
      </div>

      <div class="caption-row">
        <div class="caption-block">
          <div class="caption-box">Rectangle approximating<br>the <i>k</i><sup>th</sup> strip</div>
          <div class="panel-mark">(a)</div>
        </div>
        <div class="caption-block">
          <div class="caption-box">Cylindrical shell generated<br>by the rectangle</div>
          <div class="panel-mark">(b)</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const domain = { a: 0.85, b: 4.9, yMax: 3.25 };
      const panelA = { axisX: 68, baseY: 366, sx: 80, sy: 88 };
      const panelB = { cx: 875, baseY: 366, sx: 47, sy: 70, ry: 38 };
      const factorColor = {
        radius: "#2563eb",
        height: "#c24160",
        circumference: "#d79a21",
        thickness: "#7c3aed"
      };

      const els = {
        panelA: document.getElementById("panelA"),
        panelB: document.getElementById("panelB"),
        kSlider: document.getElementById("kSlider"),
        nSlider: document.getElementById("nSlider"),
        kOut: document.getElementById("kOut"),
        nOut: document.getElementById("nOut"),
        radiusReadout: document.getElementById("radiusReadout"),
        heightReadout: document.getElementById("heightReadout"),
        dxReadout: document.getElementById("dxReadout"),
        shellReadout: document.getElementById("shellReadout"),
        sumReadout: document.getElementById("sumReadout"),
        factorButtons: Array.from(document.querySelectorAll("[data-factor]"))
      };

      const state = {
        n: Number(els.nSlider.value),
        k: Number(els.kSlider.value),
        factor: "radius"
      };

      function f(x) {
        const t = x - domain.a;
        return Math.max(0.28, 3.03 - 0.055 * t - 0.126 * t * t);
      }

      function format(num) {
        return num.toFixed(3);
      }

      function volumeTerm(x, dx) {
        return 2 * Math.PI * x * f(x) * dx;
      }

      function riemannSum(n) {
        const dx = (domain.b - domain.a) / n;
        let total = 0;
        for (let i = 0; i < n; i += 1) {
          total += volumeTerm(domain.a + (i + 0.5) * dx, dx);
        }
        return total;
      }

      function trueVolume() {
        const intervals = 1600;
        const h = (domain.b - domain.a) / intervals;
        let total = 0;
        for (let i = 0; i <= intervals; i += 1) {
          const x = domain.a + i * h;
          const weight = i === 0 || i === intervals ? 1 : (i % 2 === 0 ? 2 : 4);
          total += weight * 2 * Math.PI * x * f(x);
        }
        return total * h / 3;
      }

      const exactVolume = trueVolume();

      function svgEl(tag, attrs, children) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs || {}).forEach(function ([key, value]) {
          if (value !== null && value !== undefined) {
            node.setAttribute(key, String(value));
          }
        });
        (children || []).forEach(function (child) {
          node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
        });
        return node;
      }

      function clear(node) {
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
      }

      function leftX(x) {
        return panelA.axisX + x * panelA.sx;
      }

      function leftY(y) {
        return panelA.baseY - y * panelA.sy;
      }

      function shellX(r) {
        return r * panelB.sx;
      }

      function shellTop(y) {
        return panelB.baseY - y * panelB.sy;
      }

      function curvePath() {
        const points = [];
        const steps = 80;
        for (let i = 0; i <= steps; i += 1) {
          const x = domain.a + (domain.b - domain.a) * i / steps;
          points.push([leftX(x), leftY(f(x))]);
        }
        return points.map(function (point, index) {
          return (index === 0 ? "M " : "L ") + point[0].toFixed(2) + " " + point[1].toFixed(2);
        }).join(" ");
      }

      function regionPath() {
        return "M " + leftX(domain.a).toFixed(2) + " " + panelA.baseY +
          " " + curvePath().replace(/^M /, "L ") +
          " L " + leftX(domain.b).toFixed(2) + " " + panelA.baseY + " Z";
      }

      function ellipsePath(cx, cy, rx, ry) {
        return [
          "M", cx - rx, cy,
          "A", rx, ry, 0, 1, 0, cx + rx, cy,
          "A", rx, ry, 0, 1, 0, cx - rx, cy,
          "Z"
        ].join(" ");
      }

      function frontArcPath(cx, cy, rx, ry) {
        return ["M", cx - rx, cy, "A", rx, ry, 0, 0, 0, cx + rx, cy].join(" ");
      }

      function topArcPath(cx, cy, rx, ry) {
        return ["M", cx - rx, cy, "A", rx, ry, 0, 0, 1, cx + rx, cy].join(" ");
      }

      function annulusPath(cx, cy, outerRx, innerRx, ry) {
        const innerRy = Math.max(8, ry * innerRx / outerRx);
        return [
          "M", cx - outerRx, cy,
          "A", outerRx, ry, 0, 1, 0, cx + outerRx, cy,
          "A", outerRx, ry, 0, 1, 0, cx - outerRx, cy,
          "M", cx - innerRx, cy,
          "A", innerRx, innerRy, 0, 1, 1, cx + innerRx, cy,
          "A", innerRx, innerRy, 0, 1, 1, cx - innerRx, cy,
          "Z"
        ].join(" ");
      }

      function addText(parent, attrs, text) {
        parent.appendChild(svgEl("text", attrs, [text]));
      }

      function addXSub(parent, x, y, subText) {
        const text = svgEl("text", {
          x: x,
          y: y,
          "text-anchor": "middle",
          class: "small-math"
        });
        text.appendChild(svgEl("tspan", {}, ["x"]));
        text.appendChild(svgEl("tspan", {
          "baseline-shift": "sub",
          "font-size": "16"
        }, [subText]));
        parent.appendChild(text);
      }

      function addPanelAStatic(g) {
        g.appendChild(svgEl("line", {
          x1: 18,
          y1: panelA.baseY,
          x2: 520,
          y2: panelA.baseY,
          class: "axis",
          "marker-end": "url(#arrowHead)"
        }));
        g.appendChild(svgEl("line", {
          x1: panelA.axisX,
          y1: 410,
          x2: panelA.axisX,
          y2: 28,
          class: "axis",
          "marker-end": "url(#arrowHead)"
        }));
        addText(g, { x: 525, y: panelA.baseY - 18, class: "axis-label" }, "x");
        addText(g, { x: panelA.axisX + 20, y: 38, class: "axis-label" }, "y");

        g.appendChild(svgEl("path", {
          d: "M 55 80 C 12 82 12 119 68 118 C 130 117 133 80 91 76",
          fill: "none",
          stroke: "#22252a",
          "stroke-width": "2.2"
        }));
        g.appendChild(svgEl("path", {
          d: "M 42 75 L 64 72 L 49 87 Z",
          fill: "#22252a"
        }));
      }

      function drawPanelA(selection) {
        const g = els.panelA;
        clear(g);
        addPanelAStatic(g);

        g.appendChild(svgEl("path", {
          d: regionPath(),
          fill: "#21b8bd",
          opacity: "0.07"
        }));

        const dx = selection.dx;
        const stripLayer = svgEl("g", {});
        const selectedLayer = svgEl("g", {});

        for (let i = 1; i <= state.n; i += 1) {
          const xa = domain.a + (i - 1) * dx;
          const xb = xa + dx;
          const xm = (xa + xb) / 2;
          const height = f(xm);
          const rect = svgEl("rect", {
            x: leftX(xa),
            y: leftY(height),
            width: Math.max(2, leftX(xb) - leftX(xa)),
            height: panelA.baseY - leftY(height),
            class: i === state.k ? "strip selected" : "strip",
            fill: i === state.k ? "rgba(169, 217, 211, 0.82)" : "rgba(169, 217, 211, 0.2)"
          });
          (i === state.k ? selectedLayer : stripLayer).appendChild(rect);
        }

        g.appendChild(stripLayer);
        g.appendChild(selectedLayer);
        g.appendChild(svgEl("path", { d: curvePath(), class: "curve" }));

        const sx0 = leftX(selection.xa);
        const sx1 = leftX(selection.xb);
        const sxm = leftX(selection.xm);
        const sy = leftY(selection.height);
        addText(g, {
          x: sxm,
          y: (sy + panelA.baseY) / 2 + 8,
          "text-anchor": "middle",
          class: "math-label"
        }, "R");
        addText(g, {
          x: sxm + 18,
          y: (sy + panelA.baseY) / 2 + 17,
          "text-anchor": "middle",
          class: "small-math",
          "font-size": "16"
        }, "k");
        addXSub(g, sx0, panelA.baseY + 34, "k-1");
        addXSub(g, sx1, panelA.baseY + 34, "k");

        drawPanelAFactor(g, selection);
      }

      function drawPanelAFactor(g, selection) {
        const color = factorColor[state.factor];
        const xa = leftX(selection.xa);
        const xb = leftX(selection.xb);
        const xm = leftX(selection.xm);
        const yTop = leftY(selection.height);
        const yBase = panelA.baseY;

        if (state.factor === "radius") {
          const y = yBase + 62;
          g.appendChild(svgEl("line", {
            x1: panelA.axisX,
            y1: y,
            x2: xm,
            y2: y,
            stroke: color,
            "stroke-width": "4",
            "marker-end": "url(#tealArrow)"
          }));
          addText(g, { x: (panelA.axisX + xm) / 2, y: y - 9, "text-anchor": "middle", class: "formula-label" }, "r");
        }

        if (state.factor === "height") {
          g.appendChild(svgEl("line", {
            x1: xb + 16,
            y1: yBase,
            x2: xb + 16,
            y2: yTop,
            stroke: color,
            "stroke-width": "4",
            "marker-end": "url(#goldArrow)"
          }));
          addText(g, { x: xb + 27, y: (yTop + yBase) / 2, class: "formula-label" }, "h");
        }

        if (state.factor === "circumference") {
          g.appendChild(svgEl("path", {
            d: "M " + (panelA.axisX - 42) + " 80 C 2 82 8 126 70 127 C 139 128 144 80 96 76",
            stroke: color,
            "stroke-width": "4",
            fill: "none",
            "marker-end": "url(#goldArrow)"
          }));
          addText(g, { x: panelA.axisX + 68, y: 112, class: "formula-label" }, "rotation");
        }

        if (state.factor === "thickness") {
          const y = yBase + 53;
          g.appendChild(svgEl("line", {
            x1: xa,
            y1: y,
            x2: xb,
            y2: y,
            stroke: color,
            "stroke-width": "4"
          }));
          g.appendChild(svgEl("line", { x1: xa, y1: y - 8, x2: xa, y2: y + 8, stroke: color, "stroke-width": "3" }));
          g.appendChild(svgEl("line", { x1: xb, y1: y - 8, x2: xb, y2: y + 8, stroke: color, "stroke-width": "3" }));
          addText(g, { x: (xa + xb) / 2, y: y + 24, "text-anchor": "middle", class: "formula-label" }, "Delta x");
        }
      }

      function addPanelBStatic(g) {
        g.appendChild(svgEl("line", {
          x1: 590,
          y1: panelB.baseY,
          x2: 1165,
          y2: panelB.baseY,
          class: "axis",
          "marker-end": "url(#arrowHead)"
        }));
        g.appendChild(svgEl("line", {
          x1: panelB.cx,
          y1: 382,
          x2: panelB.cx,
          y2: 28,
          class: "axis",
          "marker-end": "url(#arrowHead)"
        }));
        addText(g, { x: 1170, y: panelB.baseY - 18, class: "axis-label" }, "x");
        addText(g, { x: panelB.cx + 21, y: 38, class: "axis-label" }, "y");
      }

      function drawShellStack(g, selection) {
        const dx = selection.dx;
        const stack = svgEl("g", {});
        for (let i = 1; i <= state.n; i += 1) {
          const xa = domain.a + (i - 1) * dx;
          const xb = xa + dx;
          const xm = (xa + xb) / 2;
          const height = f(xm);
          if (i === state.k) {
            continue;
          }
          const x0 = panelB.cx + shellX(xa);
          const x1 = panelB.cx + shellX(xb);
          const yTop = shellTop(height);
          stack.appendChild(svgEl("rect", {
            x: x0,
            y: yTop,
            width: Math.max(1, x1 - x0),
            height: panelB.baseY - yTop,
            fill: "#94a3b8",
            opacity: "0.13",
            stroke: "#94a3b8",
            "stroke-width": "0.7"
          }));
        }
        g.appendChild(stack);
      }

      function drawSelectedShell(g, selection) {
        const innerRx = shellX(selection.xa);
        const outerRx = shellX(selection.xb);
        const midRx = shellX(selection.xm);
        const topY = shellTop(selection.height);
        const innerRy = Math.max(8, panelB.ry * innerRx / outerRx);
        const outerRy = panelB.ry;

        g.appendChild(svgEl("path", {
          d: [
            "M", panelB.cx - outerRx, topY,
            "L", panelB.cx - outerRx, panelB.baseY,
            "A", outerRx, outerRy, 0, 0, 0, panelB.cx + outerRx, panelB.baseY,
            "L", panelB.cx + outerRx, topY,
            "A", outerRx, outerRy, 0, 0, 1, panelB.cx - outerRx, topY,
            "Z"
          ].join(" "),
          fill: "url(#shellSide)",
          opacity: "0.82",
          filter: "url(#softShadow)"
        }));

        g.appendChild(svgEl("path", {
          d: annulusPath(panelB.cx, topY, outerRx, innerRx, outerRy),
          fill: "#dfe5ea",
          opacity: "0.82",
          "fill-rule": "evenodd"
        }));

        g.appendChild(svgEl("path", {
          d: [
            "M", panelB.cx + innerRx, topY,
            "L", panelB.cx + outerRx, topY,
            "L", panelB.cx + outerRx, panelB.baseY,
            "L", panelB.cx + innerRx, panelB.baseY,
            "Z"
          ].join(" "),
          fill: "url(#selectedWall)"
        }));

        g.appendChild(svgEl("path", { d: ellipsePath(panelB.cx, topY, outerRx, outerRy), class: "shell-edge" }));
        g.appendChild(svgEl("path", { d: ellipsePath(panelB.cx, panelB.baseY, outerRx, outerRy), class: "shell-edge light" }));
        g.appendChild(svgEl("path", { d: ellipsePath(panelB.cx, topY, innerRx, innerRy), class: "shell-edge light" }));
        g.appendChild(svgEl("path", { d: ellipsePath(panelB.cx, panelB.baseY, innerRx, innerRy), class: "shell-edge light" }));

        [-1, 1].forEach(function (side) {
          g.appendChild(svgEl("line", {
            x1: panelB.cx + side * outerRx,
            y1: topY,
            x2: panelB.cx + side * outerRx,
            y2: panelB.baseY,
            class: "shell-edge"
          }));
          g.appendChild(svgEl("line", {
            x1: panelB.cx + side * innerRx,
            y1: topY,
            x2: panelB.cx + side * innerRx,
            y2: panelB.baseY,
            class: "shell-edge light"
          }));
        });

        addText(g, {
          x: panelB.cx + outerRx + 24,
          y: (topY + panelB.baseY) / 2 + 10,
          class: "math-label"
        }, "S");
        addText(g, {
          x: panelB.cx + outerRx + 48,
          y: (topY + panelB.baseY) / 2 + 20,
          class: "small-math",
          "font-size": "16"
        }, "k");

        drawPanelBFactor(g, selection, { innerRx, outerRx, midRx, topY, innerRy, outerRy });
      }

      function drawPanelBFactor(g, selection, shell) {
        const color = factorColor[state.factor];
        const yTop = shell.topY;
        const yBase = panelB.baseY;

        if (state.factor === "radius") {
          const y = yBase + 54;
          g.appendChild(svgEl("line", {
            x1: panelB.cx,
            y1: y,
            x2: panelB.cx + shell.midRx,
            y2: y,
            stroke: color,
            "stroke-width": "4",
            "marker-end": "url(#tealArrow)"
          }));
          g.appendChild(svgEl("circle", { cx: panelB.cx + shell.midRx, cy: y, r: 4.5, fill: color }));
          addText(g, {
            x: panelB.cx + shell.midRx / 2,
            y: y - 11,
            "text-anchor": "middle",
            class: "formula-label"
          }, "r_k");
        }

        if (state.factor === "height") {
          const x = panelB.cx + shell.outerRx + 18;
          g.appendChild(svgEl("line", {
            x1: x,
            y1: yBase,
            x2: x,
            y2: yTop,
            stroke: color,
            "stroke-width": "4",
            "marker-end": "url(#goldArrow)"
          }));
          addText(g, {
            x: x + 12,
            y: (yTop + yBase) / 2 + 4,
            class: "formula-label"
          }, "h_k");
        }

        if (state.factor === "circumference") {
          const ry = Math.max(10, panelB.ry * shell.midRx / shell.outerRx);
          g.appendChild(svgEl("path", {
            d: topArcPath(panelB.cx, yTop - 2, shell.midRx, ry),
            stroke: color,
            "stroke-width": "4",
            fill: "none",
            "marker-end": "url(#goldArrow)"
          }));
          g.appendChild(svgEl("path", {
            d: frontArcPath(panelB.cx, yTop - 2, shell.midRx, ry),
            stroke: color,
            "stroke-width": "4",
            fill: "none",
            opacity: "0.35"
          }));
          addText(g, {
            x: panelB.cx,
            y: yTop - ry - 10,
            "text-anchor": "middle",
            class: "formula-label"
          }, "2 pi r_k");
        }

        if (state.factor === "thickness") {
          const y = yTop - 22;
          g.appendChild(svgEl("line", {
            x1: panelB.cx + shell.innerRx,
            y1: y,
            x2: panelB.cx + shell.outerRx,
            y2: y,
            stroke: color,
            "stroke-width": "4"
          }));
          g.appendChild(svgEl("line", { x1: panelB.cx + shell.innerRx, y1: y - 8, x2: panelB.cx + shell.innerRx, y2: y + 8, stroke: color, "stroke-width": "3" }));
          g.appendChild(svgEl("line", { x1: panelB.cx + shell.outerRx, y1: y - 8, x2: panelB.cx + shell.outerRx, y2: y + 8, stroke: color, "stroke-width": "3" }));
          addText(g, {
            x: panelB.cx + (shell.innerRx + shell.outerRx) / 2,
            y: y - 9,
            "text-anchor": "middle",
            class: "formula-label"
          }, "Delta x");
        }
      }

      function drawPanelB(selection) {
        const g = els.panelB;
        clear(g);
        addPanelBStatic(g);
        drawShellStack(g, selection);
        drawSelectedShell(g, selection);
      }

      function currentSelection() {
        const dx = (domain.b - domain.a) / state.n;
        const xa = domain.a + (state.k - 1) * dx;
        const xb = xa + dx;
        const xm = (xa + xb) / 2;
        const height = f(xm);
        return {
          dx,
          xa,
          xb,
          xm,
          height,
          shellVolume: volumeTerm(xm, dx),
          total: riemannSum(state.n)
        };
      }

      function updateReadouts(selection) {
        els.kOut.textContent = state.k + " of " + state.n;
        els.nOut.textContent = String(state.n);
        els.radiusReadout.textContent = "r = " + format(selection.xm);
        els.heightReadout.textContent = "h = " + format(selection.height);
        els.dxReadout.textContent = "Delta x = " + format(selection.dx);
        els.shellReadout.textContent = "Delta V = " + format(selection.shellVolume);
        const error = Math.abs(selection.total - exactVolume);
        els.sumReadout.textContent = "V_n = " + format(selection.total) + "  |err| = " + format(error);
      }

      function render() {
        state.n = Number(els.nSlider.value);
        state.k = Math.min(Number(els.kSlider.value), state.n);
        els.kSlider.max = String(state.n);
        els.kSlider.value = String(state.k);
        const selection = currentSelection();
        updateReadouts(selection);
        drawPanelA(selection);
        drawPanelB(selection);
      }

      els.nSlider.addEventListener("input", function () {
        state.n = Number(els.nSlider.value);
        if (state.k > state.n) {
          state.k = state.n;
        }
        render();
      });

      els.kSlider.addEventListener("input", function () {
        state.k = Number(els.kSlider.value);
        render();
      });

      els.factorButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          state.factor = button.dataset.factor;
          els.factorButtons.forEach(function (other) {
            other.setAttribute("aria-pressed", String(other === button));
          });
          render();
        });
      });

      render();
    }());
  </script>
</body>
</html>
