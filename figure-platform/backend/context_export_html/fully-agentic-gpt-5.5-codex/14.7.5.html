<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change of Variables: Rectangle and Curved Image</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #5f6368;
      --panel: #ffffff;
      --line: #2da7d8;
      --line-dark: #148fc2;
      --fill: rgba(129, 199, 222, 0.45);
      --fill-strong: rgba(129, 199, 222, 0.62);
      --axis: #242424;
      --cream: #fff0cf;
      --cream-edge: #c6c2ba;
      --grid: rgba(33, 150, 188, 0.18);
      --shadow: 0 18px 44px rgba(36, 44, 56, 0.14);
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, #f7fafc 0%, #eef5f8 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .figure-shell {
      width: min(1180px, 100%);
      background: var(--panel);
      border: 1px solid rgba(32, 33, 36, 0.1);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: flex;
      align-items: end;
      gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(32, 33, 36, 0.1);
      background: #fbfdfe;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
      flex: 1 1 260px;
    }

    .field span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(32, 33, 36, 0.2);
      border-radius: 6px;
      padding: 9px 11px;
      color: var(--ink);
      background: white;
      font: 600 16px/1.25 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      outline: none;
    }

    input:focus {
      border-color: var(--line-dark);
      box-shadow: 0 0 0 3px rgba(45, 167, 216, 0.18);
    }

    button {
      min-height: 42px;
      border: 1px solid rgba(32, 33, 36, 0.18);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-weight: 750;
      padding: 0 14px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--line-dark);
      box-shadow: 0 0 0 3px rgba(45, 167, 216, 0.14);
    }

    .status {
      flex: 1 1 280px;
      min-height: 42px;
      display: flex;
      align-items: center;
      color: #34404a;
      font-size: 13px;
      line-height: 1.3;
      background: #eef7fb;
      border: 1px solid rgba(45, 167, 216, 0.22);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .status.error {
      color: #8d241c;
      background: #fff1ef;
      border-color: rgba(185, 49, 38, 0.25);
    }

    .stage {
      position: relative;
      padding: 8px 10px 12px;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 430px;
      touch-action: none;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 760;
      fill: #2b3036;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
    }

    .axis-label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-style: italic;
    }

    .curve,
    .rect-edge,
    .guide-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .guide-line {
      opacity: 0.5;
      stroke-width: 2.3;
      stroke-dasharray: 8 8;
    }

    .mesh-line {
      fill: none;
      stroke: rgba(20, 143, 194, 0.38);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 6 7;
    }

    .region-fill {
      fill: var(--fill-strong);
      stroke: none;
    }

    .parameter-fill {
      fill: var(--fill);
      stroke: none;
    }

    .math-label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-style: italic;
    }

    .plain-label {
      fill: #2c2f33;
      font-size: 18px;
      font-weight: 700;
    }

    .small-label {
      fill: #2c2f33;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-style: italic;
    }

    .curve-label {
      fill: #2c2f33;
      font-size: 19px;
      font-weight: 760;
    }

    .leader {
      stroke: rgba(32, 33, 36, 0.48);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-dasharray: 4 5;
      fill: none;
    }

    .handle {
      fill: var(--line);
      stroke: white;
      stroke-width: 3;
      cursor: grab;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
    }

    .handle:active {
      cursor: grabbing;
    }

    .plot-frame {
      fill: transparent;
      stroke: rgba(32, 33, 36, 0.07);
      stroke-width: 1;
    }

    .arrow-body {
      fill: var(--cream);
      stroke: var(--cream-edge);
      stroke-width: 3.2;
      filter: drop-shadow(0 3px 2px rgba(89, 83, 70, 0.14));
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .field,
      .status {
        flex: 0 0 auto;
        width: 100%;
      }

      button {
        width: 100%;
      }

      svg {
        min-width: 0;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive change of variables figure">
    <section class="controls" aria-label="Transformation controls">
      <label class="field">
        <span>x(u, v)</span>
        <input id="xExpr" value="u*cos(v)" spellcheck="false" autocomplete="off" aria-label="Formula for x as a function of u and v">
      </label>
      <label class="field">
        <span>y(u, v)</span>
        <input id="yExpr" value="u*sin(v)" spellcheck="false" autocomplete="off" aria-label="Formula for y as a function of u and v">
      </label>
      <button id="resetBtn" type="button">Reset</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="stage">
      <svg id="figure" viewBox="0 0 1180 640" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">A rectangle in the uv-plane maps to a curved quadrilateral in the xy-plane</title>
        <desc id="svgDesc">Left panel shows a draggable rectangle S bounded by constant u and v lines. Right panel shows its image R under editable formulas x(u,v) and y(u,v), with corresponding boundary curves labeled.</desc>
        <defs>
          <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 9 5 L 0 10 z" fill="#242424"></path>
          </marker>
          <clipPath id="rightClip">
            <rect id="rightClipRect" x="670" y="100" width="475" height="425" rx="2"></rect>
          </clipPath>
        </defs>
        <g id="arrowLayer"></g>
        <g id="leftLayer"></g>
        <g id="rightLayer"></g>
        <g id="handleLayer"></g>
      </svg>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("figure");
      const leftLayer = document.getElementById("leftLayer");
      const rightLayer = document.getElementById("rightLayer");
      const arrowLayer = document.getElementById("arrowLayer");
      const handleLayer = document.getElementById("handleLayer");
      const xExpr = document.getElementById("xExpr");
      const yExpr = document.getElementById("yExpr");
      const status = document.getElementById("status");
      const resetBtn = document.getElementById("resetBtn");

      let left = { x: 54, y: 92, w: 482, h: 430, uMin: 0, uMax: 4, vMin: 0, vMax: 3 };
      let right = { x: 670, y: 100, w: 475, h: 425 };
      const rightClipRect = document.getElementById("rightClipRect");
      const state = {
        u0: 1.18,
        u1: 2.92,
        v0: 0.72,
        v1: 1.88,
        drag: null,
        lastGood: null,
        compact: false
      };

      const minSide = 0.32;
      const curveSamples = 60;
      const fnNames = [
        "sin", "cos", "tan", "asin", "acos", "atan", "atan2",
        "sqrt", "abs", "log", "exp", "pow", "min", "max",
        "floor", "ceil", "round"
      ];

      function configureLayout() {
        const compact = window.matchMedia("(max-width: 760px)").matches;
        state.compact = compact;
        if (compact) {
          svg.setAttribute("viewBox", "0 0 640 1160");
          left = {
            x: 88,
            y: 128,
            w: 422,
            h: 318,
            uMin: 0,
            uMax: 4,
            vMin: 0,
            vMax: 3,
            axis: { x0: 36, yBottom: 512, x1: 586, yTop: 62, titleX: 320, titleY: 64 }
          };
          right = {
            x: 86,
            y: 720,
            w: 470,
            h: 344,
            axis: { x0: 36, yBottom: 1102, x1: 596, yTop: 658, titleX: 510, titleY: 656 }
          };
        } else {
          svg.setAttribute("viewBox", "0 0 1180 640");
          left = {
            x: 54,
            y: 92,
            w: 482,
            h: 430,
            uMin: 0,
            uMax: 4,
            vMin: 0,
            vMax: 3,
            axis: { x0: 14, yBottom: 566, x1: 538, yTop: 48, titleX: 286, titleY: 52 }
          };
          right = {
            x: 670,
            y: 100,
            w: 475,
            h: 425,
            axis: { x0: 624, yBottom: 565, x1: 1162, yTop: 48, titleX: 1018, titleY: 52 }
          };
        }
        rightClipRect.setAttribute("x", right.x);
        rightClipRect.setAttribute("y", right.y);
        rightClipRect.setAttribute("width", right.w);
        rightClipRect.setAttribute("height", right.h);
      }

      function el(tag, attrs, parent) {
        const node = document.createElementNS(NS, tag);
        if (attrs) {
          Object.entries(attrs).forEach(([key, value]) => {
            if (value !== undefined && value !== null) {
              node.setAttribute(key, String(value));
            }
          });
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      function addText(parent, text, x, y, cls, anchor = "middle", baseline = "middle") {
        const node = el("text", {
          x,
          y,
          class: cls,
          "text-anchor": anchor,
          "dominant-baseline": baseline
        }, parent);
        node.textContent = text;
        return node;
      }

      function pathFrom(points, close = false) {
        const usable = points.filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));
        if (!usable.length) return "";
        const parts = [`M ${usable[0].x.toFixed(2)} ${usable[0].y.toFixed(2)}`];
        for (let i = 1; i < usable.length; i += 1) {
          parts.push(`L ${usable[i].x.toFixed(2)} ${usable[i].y.toFixed(2)}`);
        }
        if (close) parts.push("Z");
        return parts.join(" ");
      }

      function pU(u) {
        return left.x + ((u - left.uMin) / (left.uMax - left.uMin)) * left.w;
      }

      function pV(v) {
        return left.y + left.h - ((v - left.vMin) / (left.vMax - left.vMin)) * left.h;
      }

      function invU(x) {
        return left.uMin + ((x - left.x) / left.w) * (left.uMax - left.uMin);
      }

      function invV(y) {
        return left.vMin + ((left.y + left.h - y) / left.h) * (left.vMax - left.vMin);
      }

      function clamp(value, lo, hi) {
        return Math.max(lo, Math.min(hi, value));
      }

      function sampleSegment(uA, vA, uB, vB, n = curveSamples) {
        const pts = [];
        for (let i = 0; i <= n; i += 1) {
          const t = i / n;
          pts.push({
            u: uA + (uB - uA) * t,
            v: vA + (vB - vA) * t
          });
        }
        return pts;
      }

      function compileOne(expr, label) {
        const cleaned = expr
          .trim()
          .replace(/\^/g, "**")
          .replace(/\bPI\b/g, "pi");
        if (!cleaned) throw new Error(`${label}(u,v) is empty`);
        const header = `const {${fnNames.join(",")}} = Math; const pi = Math.PI; const e = Math.E;`;
        const fn = new Function("u", "v", `"use strict"; ${header} return (${cleaned});`);
        const test = fn((state.u0 + state.u1) / 2, (state.v0 + state.v1) / 2);
        if (!Number.isFinite(test)) throw new Error(`${label}(u,v) did not return a finite value`);
        return fn;
      }

      function getTransform() {
        try {
          const fx = compileOne(xExpr.value, "x");
          const fy = compileOne(yExpr.value, "y");
          const probe = [
            [state.u0, state.v0],
            [state.u1, state.v0],
            [state.u1, state.v1],
            [state.u0, state.v1]
          ];
          probe.forEach(([u, v]) => {
            const x = fx(u, v);
            const y = fy(u, v);
            if (!Number.isFinite(x) || !Number.isFinite(y)) {
              throw new Error("Formula produced a non-finite boundary point");
            }
          });
          state.lastGood = { fx, fy };
          status.classList.remove("error");
          return { fx, fy, ok: true };
        } catch (err) {
          status.classList.add("error");
          if (state.lastGood) {
            status.textContent = `${err.message}. Showing the last valid transformation.`;
            return { ...state.lastGood, ok: false };
          }
          status.textContent = err.message;
          return null;
        }
      }

      function mapPoints(parameterPoints, fx, fy) {
        return parameterPoints
          .map((p) => ({ x: fx(p.u, p.v), y: fy(p.u, p.v), u: p.u, v: p.v }))
          .filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));
      }

      function polygonArea(points) {
        if (points.length < 3) return 0;
        let sum = 0;
        for (let i = 0; i < points.length; i += 1) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          sum += a.x * b.y - b.x * a.y;
        }
        return Math.abs(sum) / 2;
      }

      function jacobianAt(fx, fy, u, v) {
        const h = 1e-4 * Math.max(1, Math.abs(state.u1 - state.u0), Math.abs(state.v1 - state.v0));
        const dxdu = (fx(u + h, v) - fx(u - h, v)) / (2 * h);
        const dxdv = (fx(u, v + h) - fx(u, v - h)) / (2 * h);
        const dydu = (fy(u + h, v) - fy(u - h, v)) / (2 * h);
        const dydv = (fy(u, v + h) - fy(u, v - h)) / (2 * h);
        return dxdu * dydv - dxdv * dydu;
      }

      function fmt(value) {
        if (!Number.isFinite(value)) return "not finite";
        const abs = Math.abs(value);
        if (abs >= 1000 || (abs > 0 && abs < 0.001)) return value.toExponential(2);
        return value.toFixed(abs >= 10 ? 2 : 3);
      }

      function drawAxes(parent, x0, yBottom, x1, yTop, originX, originY, xLabel, yLabel) {
        el("line", {
          x1: x0,
          y1: originY,
          x2: x1,
          y2: originY,
          class: "axis",
          "marker-end": "url(#axisArrow)"
        }, parent);
        el("line", {
          x1: originX,
          y1: yBottom,
          x2: originX,
          y2: yTop,
          class: "axis",
          "marker-end": "url(#axisArrow)"
        }, parent);
        addText(parent, xLabel, x1 + 6, originY - 22, "axis-label", "start");
        addText(parent, yLabel, originX + 18, yTop + 11, "axis-label", "start");
      }

      function drawArrow() {
        arrowLayer.replaceChildren();
        if (state.compact) {
          el("path", {
            class: "arrow-body",
            d: "M 276 518 C 252 548, 255 584, 286 608 L 260 608 L 320 662 L 380 608 L 354 608 C 382 570, 374 532, 334 504 C 348 536, 342 562, 320 580 C 300 563, 292 541, 276 518 Z"
          }, arrowLayer);
          addText(arrowLayer, "T", 320, 588, "plain-label");
        } else {
          el("path", {
            class: "arrow-body",
            d: "M 558 321 C 590 288, 626 283, 660 293 L 660 269 L 704 328 L 660 387 L 660 362 C 622 351, 590 356, 558 389 C 570 356, 595 335, 628 329 C 599 323, 577 323, 558 321 Z"
          }, arrowLayer);
          addText(arrowLayer, "T", 632, 318, "plain-label");
        }
      }

      function drawLeft() {
        leftLayer.replaceChildren();
        const g = leftLayer;
        addText(g, "uv-plane", left.axis.titleX, left.axis.titleY, "panel-title");
        drawAxes(g, left.axis.x0, left.axis.yBottom, left.axis.x1, left.axis.yTop, pU(0), pV(0), "u", "v");
        el("rect", {
          x: left.x,
          y: left.y,
          width: left.w,
          height: left.h,
          class: "plot-frame"
        }, g);

        const x0 = pU(state.u0);
        const x1 = pU(state.u1);
        const y0 = pV(state.v0);
        const y1 = pV(state.v1);
        const ext = 64;

        el("rect", {
          x: x0,
          y: y1,
          width: x1 - x0,
          height: y0 - y1,
          class: "parameter-fill"
        }, g);

        [
          { x1: x0, y1: y0 + ext, x2: x0, y2: y1 - ext },
          { x1: x1, y1: y0 + ext, x2: x1, y2: y1 - ext },
          { x1: x0 - ext, y1: y0, x2: x1 + ext, y2: y0 },
          { x1: x0 - ext, y1: y1, x2: x1 + ext, y2: y1 }
        ].forEach((line) => el("line", { ...line, class: "rect-edge" }, g));

        addText(g, "S", (x0 + x1) / 2, (y0 + y1) / 2, "math-label");
        addText(g, "(u0, v0)", x0 - 18, y0 + 42, "small-label", "end");
        addText(g, "u = u0", x0, y1 - 84, "small-label");
        addText(g, "u = u0 + \u0394u", x1, y1 - 84, "small-label");
        addText(g, "v = v0", x1 + 58, y0 - 2, "small-label", "start");
        addText(g, "v = v0 + \u0394v", x1 + 58, y1 - 2, "small-label", "start");
        addText(g, "\u0394u", (x0 + x1) / 2, y0 + 36, "small-label");
        addText(g, "\u0394v", x1 + 30, (y0 + y1) / 2, "small-label", "start");

        handleLayer.replaceChildren();
        [
          ["nw", x0, y1],
          ["ne", x1, y1],
          ["sw", x0, y0],
          ["se", x1, y0]
        ].forEach(([id, cx, cy]) => {
          const h = el("circle", {
            cx,
            cy,
            r: 10,
            class: "handle",
            tabindex: "0",
            role: "slider",
            "aria-label": `Drag ${id} corner of rectangle S`
          }, handleLayer);
          h.dataset.corner = id;
        });
      }

      function buildImageData(fx, fy) {
        const du = state.u1 - state.u0;
        const dv = state.v1 - state.v0;
        const uPad = du * 0.24;
        const vPad = dv * 0.24;
        const boundaryParams = [
          ...sampleSegment(state.u0, state.v0, state.u1, state.v0),
          ...sampleSegment(state.u1, state.v0, state.u1, state.v1).slice(1),
          ...sampleSegment(state.u1, state.v1, state.u0, state.v1).slice(1),
          ...sampleSegment(state.u0, state.v1, state.u0, state.v0).slice(1)
        ];
        const boundary = mapPoints(boundaryParams, fx, fy);
        const curves = {
          u0: mapPoints(sampleSegment(state.u0, state.v0 - vPad, state.u0, state.v1 + vPad), fx, fy),
          u1: mapPoints(sampleSegment(state.u1, state.v0 - vPad, state.u1, state.v1 + vPad), fx, fy),
          v0: mapPoints(sampleSegment(state.u0 - uPad, state.v0, state.u1 + uPad, state.v0), fx, fy),
          v1: mapPoints(sampleSegment(state.u0 - uPad, state.v1, state.u1 + uPad, state.v1), fx, fy),
          umid: mapPoints(sampleSegment((state.u0 + state.u1) / 2, state.v0, (state.u0 + state.u1) / 2, state.v1), fx, fy),
          vmid: mapPoints(sampleSegment(state.u0, (state.v0 + state.v1) / 2, state.u1, (state.v0 + state.v1) / 2), fx, fy)
        };
        return { boundary, curves };
      }

      function makeProjector(points) {
        const all = points.filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));
        all.push({ x: 0, y: 0 });
        let minX = Math.min(...all.map((p) => p.x));
        let maxX = Math.max(...all.map((p) => p.x));
        let minY = Math.min(...all.map((p) => p.y));
        let maxY = Math.max(...all.map((p) => p.y));
        if (maxX - minX < 0.25) {
          minX -= 0.5;
          maxX += 0.5;
        }
        if (maxY - minY < 0.25) {
          minY -= 0.5;
          maxY += 0.5;
        }
        const padX = (maxX - minX) * 0.16;
        const padY = (maxY - minY) * 0.16;
        minX -= padX;
        maxX += padX;
        minY -= padY;
        maxY += padY;
        const scale = Math.min(right.w / (maxX - minX), right.h / (maxY - minY)) * 0.92;
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        return (p) => ({
          x: right.x + right.w / 2 + (p.x - cx) * scale,
          y: right.y + right.h / 2 - (p.y - cy) * scale
        });
      }

      function midpoint(points, fraction = 0.5) {
        if (!points.length) return { x: 0, y: 0 };
        return points[Math.max(0, Math.min(points.length - 1, Math.round((points.length - 1) * fraction)))];
      }

      function drawLabelWithLeader(parent, label, textX, textY, anchor, target) {
        const elbowX = anchor === "start" ? textX - 12 : textX + 12;
        el("path", {
          class: "leader",
          d: `M ${elbowX.toFixed(1)} ${textY.toFixed(1)} L ${target.x.toFixed(1)} ${target.y.toFixed(1)}`
        }, parent);
        addText(parent, label, textX, textY, "curve-label", anchor);
      }

      function drawRight(transform) {
        rightLayer.replaceChildren();
        const g = rightLayer;
        addText(g, "xy-plane", right.axis.titleX, right.axis.titleY, "panel-title");

        if (!transform) return;

        const { fx, fy, ok } = transform;
        const data = buildImageData(fx, fy);
        const allPoints = [
          ...data.boundary,
          ...data.curves.u0,
          ...data.curves.u1,
          ...data.curves.v0,
          ...data.curves.v1
        ];
        if (data.boundary.length < 4 || allPoints.length < 8) {
          status.classList.add("error");
          status.textContent = "The current formulas do not produce enough finite points to draw R.";
          return;
        }

        const project = makeProjector(allPoints);
        const origin = project({ x: 0, y: 0 });
        drawAxes(g, right.axis.x0, right.axis.yBottom, right.axis.x1, right.axis.yTop, origin.x, origin.y, "x", "y");
        el("rect", {
          x: right.x,
          y: right.y,
          width: right.w,
          height: right.h,
          class: "plot-frame"
        }, g);

        const clipped = el("g", { "clip-path": "url(#rightClip)" }, g);
        const boundaryScreen = data.boundary.map(project);
        el("path", { d: pathFrom(boundaryScreen, true), class: "region-fill" }, clipped);

        Object.values({ umid: data.curves.umid, vmid: data.curves.vmid }).forEach((curve) => {
          el("path", { d: pathFrom(curve.map(project)), class: "mesh-line" }, clipped);
        });

        [
          data.curves.u0,
          data.curves.u1,
          data.curves.v1,
          data.curves.v0
        ].forEach((curve) => {
          el("path", { d: pathFrom(curve.map(project)), class: "curve" }, clipped);
        });

        addText(g, "R", project(mapPoints([{ u: (state.u0 + state.u1) / 2, v: (state.v0 + state.v1) / 2 }], fx, fy)[0]).x,
          project(mapPoints([{ u: (state.u0 + state.u1) / 2, v: (state.v0 + state.v1) / 2 }], fx, fy)[0]).y,
          "math-label");

        const labelPos = state.compact
          ? {
              u0: [102, 710],
              u1: [302, 690],
              v1: [346, 819],
              v0: [346, 1026]
            }
          : {
              u0: [706, 110],
              u1: [916, 78],
              v1: [940, 210],
              v0: [945, 405]
            };
        drawLabelWithLeader(g, "Image of u = u0", labelPos.u0[0], labelPos.u0[1], "start", project(midpoint(data.curves.u0, 0.74)));
        drawLabelWithLeader(g, "Image of u = u0 + \u0394u", labelPos.u1[0], labelPos.u1[1], "start", project(midpoint(data.curves.u1, 0.76)));
        drawLabelWithLeader(g, "Image of v = v0 + \u0394v", labelPos.v1[0], labelPos.v1[1], "start", project(midpoint(data.curves.v1, 0.78)));
        drawLabelWithLeader(g, "Image of v = v0", labelPos.v0[0], labelPos.v0[1], "start", project(midpoint(data.curves.v0, 0.78)));

        const areaR = polygonArea(data.boundary);
        const areaS = Math.abs((state.u1 - state.u0) * (state.v1 - state.v0));
        const centerU = (state.u0 + state.u1) / 2;
        const centerV = (state.v0 + state.v1) / 2;
        const jac = jacobianAt(fx, fy, centerU, centerV);
        if (ok) {
          status.classList.remove("error");
          status.textContent = `J at the rectangle center is about ${fmt(jac)}; area(R)/area(S) is about ${fmt(areaR / areaS)}.`;
        }
      }

      function render() {
        configureLayout();
        drawArrow();
        drawLeft();
        drawRight(getTransform());
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function startDrag(evt) {
        const corner = evt.target.dataset.corner;
        if (!corner) return;
        evt.preventDefault();
        evt.target.setPointerCapture(evt.pointerId);
        state.drag = { corner, pointerId: evt.pointerId };
      }

      function dragMove(evt) {
        if (!state.drag) return;
        const p = svgPoint(evt);
        const u = clamp(invU(p.x), left.uMin + 0.1, left.uMax - 0.1);
        const v = clamp(invV(p.y), left.vMin + 0.1, left.vMax - 0.1);
        const c = state.drag.corner;
        if (c.includes("w")) state.u0 = clamp(u, left.uMin + 0.1, state.u1 - minSide);
        if (c.includes("e")) state.u1 = clamp(u, state.u0 + minSide, left.uMax - 0.1);
        if (c.includes("s")) state.v0 = clamp(v, left.vMin + 0.1, state.v1 - minSide);
        if (c.includes("n")) state.v1 = clamp(v, state.v0 + minSide, left.vMax - 0.1);
        render();
      }

      function endDrag(evt) {
        if (!state.drag) return;
        if (evt.pointerId === state.drag.pointerId) state.drag = null;
      }

      function reset() {
        xExpr.value = "u*cos(v)";
        yExpr.value = "u*sin(v)";
        state.u0 = 1.18;
        state.u1 = 2.92;
        state.v0 = 0.72;
        state.v1 = 1.88;
        render();
      }

      xExpr.addEventListener("input", render);
      yExpr.addEventListener("input", render);
      resetBtn.addEventListener("click", reset);
      svg.addEventListener("pointerdown", startDrag);
      svg.addEventListener("pointermove", dragMove);
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);
      window.addEventListener("resize", render);

      render();
    })();
  </script>
</body>
</html>
