<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axial and Equatorial Positions in ClF3</title>
  <!-- Recreated from local reference image:
       C:\Users\ahe42\Documents\figure-benchmark\public\images\chemistry\3d\CNX_Chem_07_06_Axeq.jpg -->
  <style>
    :root {
      --paper: #ffffff;
      --bg: #f5f7fb;
      --ink: #101418;
      --muted: #526070;
      --green: #83b72f;
      --green-dark: #608b20;
      --gray-bond: #6e756a;
      --red: #c73a31;
      --accent: #0f6fff;
      --accent-soft: #e8f1ff;
      --warn: #f6b73c;
      --panel-line: #111418;
      --edge: #d7dee8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 22px);
    }

    main {
      width: min(1360px, 100%);
      display: grid;
      gap: 12px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      background: var(--paper);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: 0 14px 35px rgba(31, 42, 60, 0.09);
    }

    .readout {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .readout strong {
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .readout span {
      color: var(--muted);
      font-size: clamp(13px, 1.45vw, 16px);
      line-height: 1.35;
    }

    .button-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid #b9c5d6;
      background: #fff;
      color: #182131;
      border-radius: 7px;
      padding: 8px 11px;
      font: 700 14px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    button.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(15, 111, 255, 0.22);
    }

    .figure-frame {
      background: var(--paper);
      border: 1px solid var(--edge);
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 18px 42px rgba(31, 42, 60, 0.11);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 920px;
      height: auto;
      background: #fff;
    }

    .separator {
      stroke: var(--panel-line);
      stroke-width: 2.2;
      stroke-dasharray: 9 9;
      vector-effect: non-scaling-stroke;
    }

    .caption {
      font-size: 28px;
      font-weight: 500;
      fill: var(--ink);
      text-anchor: middle;
    }

    .caption-note {
      font-size: 14px;
      font-weight: 700;
      fill: var(--muted);
      text-anchor: middle;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .panel.is-active .caption-note {
      opacity: 1;
    }

    .panel-focus {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-dasharray: 7 7;
      opacity: 0;
      vector-effect: non-scaling-stroke;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    .panel.is-active .panel-focus {
      opacity: 0.95;
    }

    .frame-edge {
      fill: none;
      stroke: var(--green);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .plane {
      fill: rgba(131, 183, 47, 0.11);
      stroke: var(--green);
      stroke-width: 1.9;
      stroke-dasharray: 7 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .central-bond {
      stroke: var(--gray-bond);
      stroke-width: 2.3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      transition: stroke 160ms ease, stroke-width 160ms ease, opacity 160ms ease;
    }

    .domain-hit {
      stroke: transparent;
      stroke-width: 18;
      stroke-linecap: round;
      pointer-events: stroke;
    }

    .highlight-underlay {
      stroke: var(--warn);
      stroke-width: 7;
      stroke-linecap: round;
      opacity: 0;
      vector-effect: non-scaling-stroke;
      transition: opacity 160ms ease;
    }

    .domain.is-highlighted .highlight-underlay {
      opacity: 0.95;
    }

    .domain.is-highlighted .central-bond {
      stroke: var(--warn);
      stroke-width: 4.1;
    }

    .lone-pair {
      stroke: var(--red);
      stroke-width: 3.2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .domain.is-highlighted .lone-pair {
      stroke-width: 4.4;
    }

    .atom-label {
      font-size: 28px;
      fill: #050505;
      dominant-baseline: middle;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .small-atom-label {
      font-size: 25px;
    }

    .position-dot {
      fill: #fff;
      stroke: var(--green-dark);
      stroke-width: 1.6;
      opacity: 0;
      transition: opacity 160ms ease, fill 160ms ease;
      vector-effect: non-scaling-stroke;
    }

    .domain.is-highlighted .position-dot {
      fill: var(--warn);
      opacity: 1;
    }

    .panel-a-label {
      font-size: 27px;
      fill: #050505;
      cursor: pointer;
      user-select: none;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 6px;
      stroke-linejoin: round;
      transition: fill 160ms ease;
    }

    .panel-a-label.is-selected {
      fill: var(--accent);
    }

    .callout-line {
      stroke: #050505;
      stroke-width: 4.2;
      stroke-linecap: square;
      fill: none;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .structure-label {
      font-size: 15px;
      font-weight: 700;
      fill: #334155;
      text-anchor: middle;
    }

    @media (max-width: 780px) {
      body {
        place-items: start center;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .button-row {
        justify-content: flex-start;
      }

      button {
        padding: 8px 9px;
        font-size: 13px;
      }

      svg {
        min-width: 980px;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="figure-title">
    <section class="toolbar" aria-label="Figure controls">
      <div class="readout">
        <strong id="figure-title">Trigonal bipyramidal positions in ClF<sub>3</sub></strong>
        <span id="status">Panel (b) is selected: two lone pairs occupy equatorial positions, giving the observed T-shaped ClF3 structure.</span>
      </div>
      <div class="button-row" aria-label="Panel selector">
        <button type="button" class="panel-toggle is-active" data-panel="b" aria-pressed="true">(b)</button>
        <button type="button" class="panel-toggle" data-panel="c" aria-pressed="false">(c)</button>
        <button type="button" class="panel-toggle" data-panel="d" aria-pressed="false">(d)</button>
        <button type="button" id="cycle-panel">Cycle</button>
      </div>
    </section>

    <section class="figure-frame" aria-label="Interactive comparison of axial and equatorial lone-pair arrangements">
      <svg id="figure" viewBox="0 0 1320 430" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Axial and equatorial positions in trigonal bipyramidal geometry</title>
        <desc id="svg-desc">Four panels compare the axial and equatorial sites of a trigonal bipyramid and three possible ways to place two lone pairs in ClF3.</desc>

        <defs>
          <g id="tbp-frame">
            <polygon class="plane" points="-91,0 88,-8 31,49" />
            <path class="frame-edge" d="M0,-108 L-91,0 L0,108 L88,-8 L0,-108 L31,49 L0,108 M-91,0 L31,49 M88,-8 L31,49" />
          </g>

          <g id="tbp-domains">
            <g class="domain" data-domain="axial" data-position="axial-top">
              <line class="highlight-underlay" x1="0" y1="0" x2="0" y2="-108" />
              <line class="central-bond" x1="0" y1="0" x2="0" y2="-108" />
              <line class="domain-hit" x1="0" y1="0" x2="0" y2="-108" />
              <circle class="position-dot" cx="0" cy="-108" r="5.5" />
            </g>
            <g class="domain" data-domain="axial" data-position="axial-bottom">
              <line class="highlight-underlay" x1="0" y1="0" x2="0" y2="108" />
              <line class="central-bond" x1="0" y1="0" x2="0" y2="108" />
              <line class="domain-hit" x1="0" y1="0" x2="0" y2="108" />
              <circle class="position-dot" cx="0" cy="108" r="5.5" />
            </g>
            <g class="domain" data-domain="equatorial" data-position="equatorial-left">
              <line class="highlight-underlay" x1="0" y1="0" x2="-91" y2="0" />
              <line class="central-bond" x1="0" y1="0" x2="-91" y2="0" />
              <line class="domain-hit" x1="0" y1="0" x2="-91" y2="0" />
              <circle class="position-dot" cx="-91" cy="0" r="5.5" />
            </g>
            <g class="domain" data-domain="equatorial" data-position="equatorial-right">
              <line class="highlight-underlay" x1="0" y1="0" x2="88" y2="-8" />
              <line class="central-bond" x1="0" y1="0" x2="88" y2="-8" />
              <line class="domain-hit" x1="0" y1="0" x2="88" y2="-8" />
              <circle class="position-dot" cx="88" cy="-8" r="5.5" />
            </g>
            <g class="domain" data-domain="equatorial" data-position="equatorial-lower">
              <line class="highlight-underlay" x1="0" y1="0" x2="31" y2="49" />
              <line class="central-bond" x1="0" y1="0" x2="31" y2="49" />
              <line class="domain-hit" x1="0" y1="0" x2="31" y2="49" />
              <circle class="position-dot" cx="31" cy="49" r="5.5" />
            </g>
          </g>

          <g id="position-map">
            <use href="#tbp-frame" />
            <use href="#tbp-domains" />
          </g>
        </defs>

        <line class="separator" x1="245" y1="10" x2="245" y2="400" />
        <line class="separator" x1="615" y1="10" x2="615" y2="400" />
        <line class="separator" x1="965" y1="10" x2="965" y2="400" />

        <g class="panel panel-a" transform="translate(105 185)">
          <use href="#position-map" />
          <path class="callout-line" d="M-98,-135 L-98,-8 L-42,-8" />
          <path class="callout-line" d="M-1,-80 L42,-80" />
          <text class="panel-a-label" data-choice="equatorial" role="button" tabindex="0" x="-96" y="-143">Equatorial</text>
          <text class="panel-a-label" data-choice="axial" role="button" tabindex="0" x="46" y="-76">Axial</text>
          <text class="caption" x="-2" y="137">(a)</text>
        </g>

        <g class="panel molecule-panel is-active" data-panel="b">
          <rect class="panel-focus" x="265" y="31" width="322" height="354" rx="8" />
          <g transform="translate(430 184)">
            <use href="#position-map" />
            <g data-domain="equatorial" data-position="equatorial-right" class="domain">
              <line class="highlight-underlay" x1="0" y1="0" x2="78" y2="-7" />
              <line class="lone-pair" x1="13" y1="-1" x2="78" y2="-7" />
            </g>
            <g data-domain="equatorial" data-position="equatorial-lower" class="domain">
              <line class="highlight-underlay" x1="0" y1="0" x2="26" y2="42" />
              <line class="lone-pair" x1="7" y1="11" x2="26" y2="42" />
            </g>
            <text class="atom-label small-atom-label" x="0" y="2">Cl</text>
            <text class="atom-label" x="0" y="-123">F</text>
            <text class="atom-label" x="0" y="124">F</text>
            <text class="atom-label" x="-108" y="0">F</text>
          </g>
          <text class="structure-label" x="430" y="340">equatorial lone pairs</text>
          <text class="caption" x="430" y="378">(b)</text>
          <text class="caption-note" x="430" y="402">observed T-shaped ClF3</text>
        </g>

        <g class="panel molecule-panel" data-panel="c">
          <rect class="panel-focus" x="635" y="31" width="302" height="354" rx="8" />
          <g transform="translate(785 184)">
            <use href="#position-map" />
            <g data-domain="axial" data-position="axial-top" class="domain">
              <line class="highlight-underlay" x1="0" y1="0" x2="0" y2="-94" />
              <line class="lone-pair" x1="0" y1="-12" x2="0" y2="-94" />
            </g>
            <g data-domain="equatorial" data-position="equatorial-lower" class="domain">
              <line class="highlight-underlay" x1="0" y1="0" x2="27" y2="43" />
              <line class="lone-pair" x1="7" y1="11" x2="27" y2="43" />
            </g>
            <text class="atom-label small-atom-label" x="0" y="2">Cl</text>
            <text class="atom-label" x="0" y="124">F</text>
            <text class="atom-label" x="-108" y="0">F</text>
            <text class="atom-label" x="108" y="-8">F</text>
          </g>
          <text class="structure-label" x="785" y="340">one axial, one equatorial</text>
          <text class="caption" x="785" y="378">(c)</text>
          <text class="caption-note" x="785" y="402">more 90 deg contacts</text>
        </g>

        <g class="panel molecule-panel" data-panel="d">
          <rect class="panel-focus" x="990" y="31" width="302" height="354" rx="8" />
          <g transform="translate(1140 184)">
            <use href="#position-map" />
            <g data-domain="axial" data-position="axial-top" class="domain">
              <line class="highlight-underlay" x1="0" y1="0" x2="0" y2="-94" />
              <line class="lone-pair" x1="0" y1="-12" x2="0" y2="-94" />
            </g>
            <g data-domain="axial" data-position="axial-bottom" class="domain">
              <line class="highlight-underlay" x1="0" y1="0" x2="0" y2="94" />
              <line class="lone-pair" x1="0" y1="12" x2="0" y2="94" />
            </g>
            <text class="atom-label small-atom-label" x="0" y="2">Cl</text>
            <text class="atom-label" x="-108" y="0">F</text>
            <text class="atom-label" x="108" y="-8">F</text>
            <text class="atom-label" x="42" y="70">F</text>
          </g>
          <text class="structure-label" x="1140" y="340">axial lone pairs</text>
          <text class="caption" x="1140" y="378">(d)</text>
          <text class="caption-note" x="1140" y="402">greatest LP-BP repulsion</text>
        </g>
      </svg>
    </section>
  </main>

  <script>
    (function () {
      const panels = ["b", "c", "d"];
      const status = document.getElementById("status");
      const cycleButton = document.getElementById("cycle-panel");
      const panelButtons = Array.from(document.querySelectorAll(".panel-toggle"));
      const panelGroups = Array.from(document.querySelectorAll(".molecule-panel"));
      const labelButtons = Array.from(document.querySelectorAll(".panel-a-label"));
      let activePanel = "b";
      let activeDomain = null;

      const panelText = {
        b: "Panel (b) is selected: two lone pairs occupy equatorial positions, giving the observed T-shaped ClF3 structure.",
        c: "Panel (c) is selected: one lone pair is forced axial, increasing 90 deg lone-pair-bond-pair contacts.",
        d: "Panel (d) is selected: both lone pairs are axial, so all three F bonds crowd them at 90 deg."
      };

      function setPanel(panel) {
        activePanel = panel;
        panelButtons.forEach((button) => {
          const selected = button.dataset.panel === panel;
          button.classList.toggle("is-active", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        panelGroups.forEach((group) => {
          group.classList.toggle("is-active", group.dataset.panel === panel);
        });
        status.textContent = panelText[panel];
      }

      function setDomain(domain) {
        activeDomain = activeDomain === domain ? null : domain;
        const activeText = activeDomain ? activeDomain : "";
        document.querySelectorAll(".domain").forEach((item) => {
          item.classList.toggle("is-highlighted", item.dataset.domain === activeDomain);
        });
        labelButtons.forEach((label) => {
          const selected = label.dataset.choice === activeText;
          label.classList.toggle("is-selected", selected);
          label.setAttribute("aria-pressed", String(selected));
        });
      }

      panelButtons.forEach((button) => {
        button.addEventListener("click", () => setPanel(button.dataset.panel));
      });

      cycleButton.addEventListener("click", () => {
        const index = panels.indexOf(activePanel);
        setPanel(panels[(index + 1) % panels.length]);
      });

      labelButtons.forEach((label) => {
        label.setAttribute("aria-pressed", "false");
        label.addEventListener("click", () => setDomain(label.dataset.choice));
        label.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setDomain(label.dataset.choice);
          }
        });
      });

      setPanel(activePanel);
    })();
  </script>
</body>
</html>
