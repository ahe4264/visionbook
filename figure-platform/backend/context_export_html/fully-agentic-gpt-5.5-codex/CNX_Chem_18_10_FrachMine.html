<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frasch Process for Mining Sulfur</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #58616b;
      --panel: #f5f7f3;
      --panel-line: #d2d9cf;
      --pipe-fill: #fffef8;
      --mixture: #fff1b9;
      --water: #1578b8;
      --water-light: #6ec3df;
      --air: #667287;
      --sulfur: #e4b127;
      --sulfur-hot: #ffcf45;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      display: grid;
      place-items: center;
    }

    .figure-app {
      width: min(900px, 100vw);
      min-height: 100vh;
      padding: clamp(8px, 1.8vw, 18px);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .stage {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    svg {
      width: min(100%, 760px);
      height: auto;
      max-height: calc(100vh - 118px);
      min-height: 470px;
      display: block;
      overflow: visible;
    }

    .toolbar {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: auto auto minmax(190px, 1fr) auto;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 8px;
    }

    button,
    input,
    label,
    output {
      font: inherit;
    }

    button {
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid #aab4a7;
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover {
      background: #edf5f7;
      border-color: #7ea7b0;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #9bd6e6;
      outline-offset: 2px;
    }

    .speed-control {
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(90px, 1fr) 46px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--water);
    }

    .status {
      color: #304149;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .pipe-outline {
      stroke: #000000;
      stroke-width: 5;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .pipe-stroke-edge {
      fill: none;
      stroke: #000000;
      stroke-linejoin: round;
      stroke-linecap: butt;
    }

    .pipe-stroke-fill {
      fill: none;
      stroke: var(--pipe-fill);
      stroke-linejoin: round;
      stroke-linecap: butt;
    }

    .label {
      font-size: 27px;
      line-height: 1.1;
      fill: #000000;
    }

    .small-label {
      font-size: 22px;
      fill: #1c1c1c;
    }

    .callout {
      stroke: #000000;
      stroke-width: 5;
      stroke-linecap: square;
      vector-effect: non-scaling-stroke;
    }

    .static-arrow {
      stroke: #000000;
      stroke-width: 6;
      stroke-linecap: square;
      fill: none;
      marker-end: url(#arrowHead);
      vector-effect: non-scaling-stroke;
    }

    .flow-path {
      fill: none;
      stroke: transparent;
      stroke-width: 1;
    }

    .particle {
      pointer-events: none;
      filter: url(#particleGlow);
    }

    .water-particle {
      fill: var(--water);
      stroke: #d4f5ff;
      stroke-width: 1.2;
    }

    .air-particle {
      fill: #ffffff;
      stroke: var(--air);
      stroke-width: 2;
    }

    .sulfur-particle {
      fill: var(--sulfur-hot);
      stroke: #8f6410;
      stroke-width: 1.2;
    }

    .bubble {
      fill: #ffffff;
      stroke: #8e9daf;
      stroke-width: 1.4;
      opacity: 0.9;
    }

    .melt-halo {
      animation: meltPulse 3s ease-in-out infinite;
      transform-origin: 380px 1130px;
    }

    .heat-wave {
      fill: none;
      stroke: #b06b12;
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0.45;
      animation: heatRise 2.5s ease-in-out infinite;
    }

    .heat-wave.delay-a {
      animation-delay: -0.8s;
    }

    .heat-wave.delay-b {
      animation-delay: -1.6s;
    }

    .figure-app.is-paused .melt-halo,
    .figure-app.is-paused .heat-wave {
      animation-play-state: paused;
    }

    .legend-swatch {
      stroke: #111111;
      stroke-width: 1.2;
    }

    @keyframes meltPulse {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.96);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.04);
      }
    }

    @keyframes heatRise {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      35% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
        transform: translateY(-26px);
      }
    }

    @media (max-width: 640px) {
      .figure-app {
        padding: 6px;
      }

      svg {
        max-height: calc(100vh - 160px);
        min-height: 430px;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .speed-control {
        grid-column: 1 / -1;
        grid-template-columns: auto minmax(130px, 1fr) 46px;
      }

      .status {
        grid-column: 1 / -1;
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .melt-halo,
      .heat-wave {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="figure-app" aria-labelledby="figureTitle">
    <div class="stage">
      <svg id="fraschDiagram" viewBox="0 0 760 1260" role="img" aria-labelledby="figureTitle figureDesc">
        <title id="figureTitle">Frasch process for mining elemental sulfur</title>
        <desc id="figureDesc">Cutaway diagram showing superheated water descending in the outer pipe, compressed air descending in the inner pipe, and a sulfur, water, and air mixture rising through the middle pipe from a molten sulfur pool.</desc>
        <defs>
          <linearGradient id="soilGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#cc946e"/>
            <stop offset="1" stop-color="#a97652"/>
          </linearGradient>
          <linearGradient id="solidSulfurGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#f1d254"/>
            <stop offset="1" stop-color="#e5bb36"/>
          </linearGradient>
          <radialGradient id="moltenSulfurGradient" cx="50%" cy="40%" r="65%">
            <stop offset="0" stop-color="#fff7c7"/>
            <stop offset="0.48" stop-color="#ffe08a"/>
            <stop offset="1" stop-color="#d99d1b" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="productPipeGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fffefa"/>
            <stop offset="0.42" stop-color="#fff4c9"/>
            <stop offset="1" stop-color="#ffe19a"/>
          </linearGradient>
          <filter id="particleGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="2.2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="22"/>
          </filter>
          <marker id="arrowHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
          </marker>
        </defs>

        <rect x="0" y="0" width="760" height="1260" fill="#ffffff"/>
        <rect x="0" y="704" width="760" height="256" fill="url(#soilGradient)"/>
        <line x1="0" y1="704" x2="760" y2="704" stroke="#bd7765" stroke-width="4"/>
        <rect x="0" y="960" width="760" height="300" fill="url(#solidSulfurGradient)"/>
        <ellipse class="melt-halo" cx="380" cy="1134" rx="190" ry="205" fill="url(#moltenSulfurGradient)" filter="url(#softGlow)"/>
        <ellipse cx="380" cy="1168" rx="116" ry="54" fill="#ffe899" opacity="0.8"/>

        <g aria-hidden="true">
          <path class="pipe-stroke-edge" d="M 255 1168 L 255 380" stroke-width="68"/>
          <path class="pipe-stroke-fill" d="M 255 1168 L 255 380" stroke-width="56"/>
          <path class="pipe-stroke-edge" d="M 505 1168 L 505 445 L 705 445" stroke-width="68"/>
          <path class="pipe-stroke-fill" d="M 505 1168 L 505 445 L 705 445" stroke-width="56"/>
          <path d="M 295 1042
                   L 295 205
                   L 142 205
                   L 142 160
                   L 295 160
                   L 295 132
                   L 465 132
                   L 465 1042
                   C 465 1104 442 1126 410 1126
                   C 385 1126 374 1106 374 1067
                   L 374 968
                   L 356 968
                   L 356 1067
                   C 356 1106 345 1126 321 1126
                   C 291 1126 295 1085 295 1042 Z"
                fill="url(#productPipeGradient)" class="pipe-outline"/>
          <path d="M 704 30
                   L 454 30
                   C 406 30 380 65 380 118
                   L 380 1030"
                class="pipe-stroke-edge" stroke-width="54"/>
          <path d="M 704 30
                   L 454 30
                   C 406 30 380 65 380 118
                   L 380 1030"
                class="pipe-stroke-fill" stroke-width="41"/>
        </g>

        <g id="flowPaths" aria-hidden="true">
          <path id="waterPathRight" class="flow-path" d="M 688 445 L 505 445 L 505 1140"/>
          <path id="waterPathLeft" class="flow-path" d="M 255 408 L 255 1140"/>
          <path id="airPath" class="flow-path" d="M 682 30 L 454 30 C 406 30 380 65 380 118 L 380 1010"/>
          <path id="mixPathLeft" class="flow-path" d="M 325 1100 C 325 1068 325 1032 325 1004 L 325 182 L 150 182"/>
          <path id="mixPathRight" class="flow-path" d="M 435 1100 C 435 1068 435 1032 435 1004 L 435 182 L 150 182"/>
          <path id="meltPathLeft" class="flow-path" d="M 302 1198 C 338 1180 325 1136 325 1100"/>
          <path id="meltPathRight" class="flow-path" d="M 458 1198 C 422 1180 435 1136 435 1100"/>
        </g>

        <g id="flowParticles" aria-hidden="true">
          <circle class="particle water-particle" r="6" data-flow data-path="waterPathRight" data-loop="5.8" data-offset="0"/>
          <circle class="particle water-particle" r="6" data-flow data-path="waterPathRight" data-loop="5.8" data-offset="0.18"/>
          <circle class="particle water-particle" r="6" data-flow data-path="waterPathRight" data-loop="5.8" data-offset="0.36"/>
          <circle class="particle water-particle" r="5" data-flow data-path="waterPathLeft" data-loop="5.2" data-offset="0.08"/>
          <circle class="particle water-particle" r="5" data-flow data-path="waterPathLeft" data-loop="5.2" data-offset="0.29"/>
          <circle class="particle water-particle" r="5" data-flow data-path="waterPathLeft" data-loop="5.2" data-offset="0.51"/>

          <circle class="particle air-particle" r="5.5" data-flow data-path="airPath" data-loop="4.9" data-offset="0"/>
          <circle class="particle air-particle" r="4.8" data-flow data-path="airPath" data-loop="4.9" data-offset="0.16"/>
          <circle class="particle air-particle" r="5.5" data-flow data-path="airPath" data-loop="4.9" data-offset="0.33"/>
          <circle class="particle air-particle" r="4.8" data-flow data-path="airPath" data-loop="4.9" data-offset="0.50"/>

          <circle class="particle sulfur-particle" r="6.2" data-flow data-path="mixPathLeft" data-loop="5.5" data-offset="0.02"/>
          <circle class="particle bubble" r="4.4" data-flow data-path="mixPathLeft" data-loop="5.5" data-offset="0.13"/>
          <circle class="particle sulfur-particle" r="6.2" data-flow data-path="mixPathLeft" data-loop="5.5" data-offset="0.26"/>
          <circle class="particle bubble" r="4.4" data-flow data-path="mixPathLeft" data-loop="5.5" data-offset="0.39"/>
          <circle class="particle sulfur-particle" r="6.2" data-flow data-path="mixPathRight" data-loop="5.7" data-offset="0.04"/>
          <circle class="particle bubble" r="4.4" data-flow data-path="mixPathRight" data-loop="5.7" data-offset="0.17"/>
          <circle class="particle sulfur-particle" r="6.2" data-flow data-path="mixPathRight" data-loop="5.7" data-offset="0.30"/>
          <circle class="particle bubble" r="4.4" data-flow data-path="mixPathRight" data-loop="5.7" data-offset="0.43"/>
          <circle class="particle sulfur-particle" r="5.8" data-flow data-path="meltPathLeft" data-loop="3.8" data-offset="0.21"/>
          <circle class="particle sulfur-particle" r="5.8" data-flow data-path="meltPathRight" data-loop="3.8" data-offset="0.54"/>
        </g>

        <g aria-hidden="true">
          <path class="heat-wave delay-a" d="M 334 1130 C 344 1112 344 1098 334 1082"/>
          <path class="heat-wave" d="M 380 1136 C 390 1118 390 1100 380 1082"/>
          <path class="heat-wave delay-b" d="M 426 1130 C 416 1112 416 1098 426 1082"/>

          <path class="static-arrow" d="M 205 182 L 72 182"/>
          <path class="static-arrow" d="M 645 30 L 540 30"/>
          <path class="static-arrow" d="M 666 445 L 548 445"/>
          <path class="static-arrow" d="M 255 530 L 255 645"/>
          <path class="static-arrow" d="M 255 1005 L 255 1110"/>
          <path class="static-arrow" d="M 505 530 L 505 645"/>
          <path class="static-arrow" d="M 505 1005 L 505 1110"/>
          <path class="static-arrow" d="M 380 410 L 380 555"/>
          <path class="static-arrow" d="M 325 870 L 325 750"/>
          <path class="static-arrow" d="M 435 870 L 435 750"/>
          <path class="static-arrow" d="M 325 360 L 325 250"/>
          <path class="static-arrow" d="M 435 360 L 435 250"/>
          <path class="static-arrow" d="M 325 1050 L 325 940"/>
          <path class="static-arrow" d="M 435 1050 L 435 940"/>
        </g>

        <g aria-hidden="true">
          <text class="label" x="36" y="112">Sulfur, water,</text>
          <text class="label" x="36" y="143">and air</text>
          <text class="label" x="535" y="84">Compressed air</text>
          <text class="label" x="535" y="367">Superheated</text>
          <text class="label" x="535" y="398">water</text>
          <text class="label" x="96" y="664">Soil</text>
          <line class="callout" x1="120" y1="674" x2="120" y2="735"/>
          <text class="label" x="585" y="1015">Solid sulfur</text>
          <text class="label" x="585" y="1047">deposit</text>
          <text class="label" x="306" y="1227">Liquid sulfur</text>
        </g>

        <g aria-label="Flow legend">
          <rect x="22" y="1188" width="216" height="52" rx="8" fill="#ffffff" opacity="0.88" stroke="#d0d0c8"/>
          <circle class="legend-swatch" cx="43" cy="1205" r="7" fill="#1578b8"/>
          <text class="small-label" x="58" y="1212">water down</text>
          <circle class="legend-swatch" cx="43" cy="1228" r="7" fill="#ffcf45"/>
          <text class="small-label" x="58" y="1235">sulfur mixture up</text>
        </g>
      </svg>
    </div>

    <div class="toolbar" aria-label="Animation controls">
      <button id="toggleMotion" type="button" aria-pressed="true">Pause</button>
      <button id="restartMotion" type="button">Restart</button>
      <label class="speed-control">
        <span>Speed</span>
        <input id="speedControl" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Animation speed">
        <output id="speedValue" for="speedControl">1.0x</output>
      </label>
      <span id="processStatus" class="status" aria-live="polite">Water heats sulfur</span>
    </div>
  </main>

  <script>
    (() => {
      const app = document.querySelector('.figure-app');
      const toggle = document.getElementById('toggleMotion');
      const restart = document.getElementById('restartMotion');
      const speedControl = document.getElementById('speedControl');
      const speedValue = document.getElementById('speedValue');
      const status = document.getElementById('processStatus');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let running = !prefersReducedMotion;
      let speed = Number(speedControl.value);
      let elapsed = 0;
      let lastFrame = performance.now();

      const phases = [
        { end: 2.4, label: 'Water heats sulfur' },
        { end: 4.8, label: 'Sulfur melts' },
        { end: 7.2, label: 'Air pressurizes well' },
        { end: 9.6, label: 'Mixture rises' }
      ];

      const particles = Array.from(document.querySelectorAll('[data-flow]')).map((element) => {
        const path = document.getElementById(element.dataset.path);
        return {
          element,
          path,
          length: path.getTotalLength(),
          loop: Number(element.dataset.loop) || 5,
          offset: Number(element.dataset.offset) || 0
        };
      });

      function setRunning(nextRunning) {
        running = nextRunning;
        app.classList.toggle('is-paused', !running);
        toggle.textContent = running ? 'Pause' : 'Play';
        toggle.setAttribute('aria-pressed', String(running));
        lastFrame = performance.now();
      }

      function updateStatus() {
        const phaseTime = elapsed % phases[phases.length - 1].end;
        const active = phases.find((phase) => phaseTime < phase.end) || phases[0];
        status.textContent = active.label;
      }

      function positionParticles() {
        particles.forEach((particle) => {
          const progress = (((elapsed / particle.loop) + particle.offset) % 1 + 1) % 1;
          const point = particle.path.getPointAtLength(progress * particle.length);
          particle.element.setAttribute('transform', `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)})`);
          const fade = 0.68 + 0.32 * Math.sin(progress * Math.PI);
          particle.element.style.opacity = fade.toFixed(2);
        });
      }

      function frame(now) {
        const delta = Math.min((now - lastFrame) / 1000, 0.08);
        lastFrame = now;
        if (running) {
          elapsed += delta * speed;
          updateStatus();
          positionParticles();
        }
        requestAnimationFrame(frame);
      }

      toggle.addEventListener('click', () => {
        setRunning(!running);
      });

      restart.addEventListener('click', () => {
        elapsed = 0;
        updateStatus();
        positionParticles();
      });

      speedControl.addEventListener('input', () => {
        speed = Number(speedControl.value);
        speedValue.textContent = `${speed.toFixed(1)}x`;
      });

      setRunning(running);
      updateStatus();
      positionParticles();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
