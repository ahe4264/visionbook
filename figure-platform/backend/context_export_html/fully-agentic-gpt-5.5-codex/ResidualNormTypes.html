<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Residual Normalization Types</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #162027;
      --muted: #52606b;
      --line: #cbd5dc;
      --soft-line: #e3e9ee;
      --panel: #f5f7f9;
      --orange: #d96f3d;
      --orange-dark: #9c4b29;
      --accent: #1b6fb8;
      --glow: rgba(255, 181, 82, 0.42);
      --shadow: 0 18px 46px rgba(30, 42, 53, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #ffffff 0%, #eef3f6 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: start center;
      padding: clamp(10px, 2vw, 24px);
    }

    .app {
      width: min(100%, 1480px);
      min-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }

    .control-bar,
    .scope-row {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(26, 39, 50, 0.08);
    }

    .control-bar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(19px, 2.1vw, 28px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    button {
      font: inherit;
    }

    .segmented button,
    .animate-btn {
      min-height: 36px;
      border: 1px solid #b9c4cc;
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .segmented button {
      padding: 0 12px;
      font-size: 13px;
      font-weight: 750;
    }

    .segmented button:hover,
    .animate-btn:hover {
      border-color: #7da6c8;
      background: #f2f7fb;
    }

    .segmented button.active {
      border-color: #175f9e;
      background: #1b6fb8;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(27, 111, 184, 0.22);
    }

    .animate-btn {
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .scope-row {
      display: grid;
      grid-template-columns: auto minmax(260px, 1fr);
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .chip-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chip {
      border: 1px solid #c7d1d8;
      border-radius: 999px;
      background: #f8fafb;
      padding: 5px 9px;
      color: #26313a;
      font-size: 12px;
      font-weight: 760;
      line-height: 1;
      white-space: nowrap;
    }

    .chip.pooled {
      border-color: #d26d3f;
      background: #fff0e8;
      color: #733414;
    }

    .scope-sentence {
      min-width: 0;
      color: #2a3640;
      font-size: 13px;
      line-height: 1.35;
    }

    .figure-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(220px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .norm-panel {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .norm-panel:hover,
    .norm-panel:focus-visible {
      border-color: #91adbf;
      transform: translateY(-1px);
      outline: none;
    }

    .norm-panel.active {
      border-color: #1b6fb8;
      box-shadow: 0 18px 48px rgba(27, 111, 184, 0.18), 0 0 0 3px rgba(27, 111, 184, 0.11);
    }

    .panel-svg {
      display: block;
      width: 100%;
      aspect-ratio: 300 / 302;
      background: #ffffff;
      overflow: visible;
    }

    .cell {
      vector-effect: non-scaling-stroke;
      stroke: #38464e;
      stroke-width: 1.05;
      stroke-linejoin: round;
      transition: fill 80ms linear, opacity 160ms ease, stroke-width 120ms ease, stroke 120ms ease;
    }

    .norm-panel:not(.active) .cell[data-selected="true"] {
      opacity: 0.84;
    }

    .norm-panel.active .cell[data-selected="true"] {
      stroke-width: 1.18;
    }

    .norm-panel.applied .cell[data-selected="true"] {
      stroke: #642b12;
      stroke-width: 1.35;
    }

    .axis-label {
      fill: #37434c;
      font-size: 22px;
      font-weight: 560;
      letter-spacing: 0;
    }

    .panel-letter {
      fill: #0d0f10;
      font-size: 34px;
      font-weight: 520;
    }

    .panel-title {
      fill: #111111;
      font-size: 25px;
      font-weight: 560;
      letter-spacing: 0;
    }

    .panel-subtitle {
      fill: #52606b;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .stat-badge {
      opacity: 0;
      transform-origin: center;
      transition: opacity 180ms ease;
    }

    .norm-panel.active .stat-badge {
      opacity: 1;
    }

    .badge-box {
      fill: rgba(255, 255, 255, 0.94);
      stroke: #c8d2d9;
      stroke-width: 1;
    }

    .badge-text {
      fill: #26313a;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .normal-arrow {
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .norm-panel.animating .normal-arrow,
    .norm-panel.applied .normal-arrow {
      opacity: 1;
    }

    .arrow-line {
      stroke: #1b6fb8;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: #1b6fb8;
    }

    @media (max-width: 1220px) {
      .figure-grid {
        grid-template-columns: repeat(3, minmax(220px, 1fr));
      }

      .control-bar {
        grid-template-columns: 1fr;
      }

      .segmented {
        justify-content: flex-start;
      }

      .animate-btn {
        justify-self: start;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .app {
        min-height: calc(100vh - 16px);
      }

      .figure-grid {
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }

      .scope-row {
        grid-template-columns: 1fr;
      }

      .segmented button {
        flex: 1 1 112px;
      }

      .animate-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Interactive comparison of normalization statistic scopes">
    <section class="control-bar" aria-label="Normalization controls">
      <div>
        <h1>Residual Normalization Scopes</h1>
        <p class="subtitle">Orange cells share one mean and variance estimate. Gray cells stay outside the selected statistic.</p>
      </div>
      <div class="segmented" role="tablist" aria-label="Select normalization type">
        <button type="button" class="active" data-select="batch" role="tab" aria-selected="true">BatchNorm</button>
        <button type="button" data-select="ghost" role="tab" aria-selected="false">GhostNorm</button>
        <button type="button" data-select="layer" role="tab" aria-selected="false">LayerNorm</button>
        <button type="button" data-select="group" role="tab" aria-selected="false">GroupNorm</button>
        <button type="button" data-select="instance" role="tab" aria-selected="false">InstanceNorm</button>
      </div>
      <button type="button" class="animate-btn" id="animateBtn">Animate aggregation</button>
    </section>

    <section class="scope-row" aria-live="polite">
      <div class="chips" id="axisChips"></div>
      <div class="scope-sentence" id="scopeSentence"></div>
    </section>

    <section class="figure-grid" id="figureGrid" aria-label="Five cube panels comparing normalization methods"></section>
  </main>

  <script>
    (() => {
      const N = 5;
      const colors = {
        gray: {
          left: "#c8d1d6",
          right: "#d6dee2",
          top: "#e5eaed"
        },
        orange: {
          left: "#d77843",
          right: "#af562e",
          top: "#e78952"
        },
        sweep: {
          left: "#ffc770",
          right: "#f39a4e",
          top: "#ffd68a"
        }
      };

      const norms = [
        {
          id: "batch",
          letter: "a)",
          name: "BatchNorm",
          small: "per channel",
          pooled: ["batch index", "position"],
          held: ["channel"],
          sentence: "BatchNorm pools all batch examples and spatial positions for a single channel.",
          contains: (b, c, p) => c === 0,
          sweepValue: (b, c, p) => b + 0.28 * p,
          sweepMax: N - 1 + 0.28 * (N - 1)
        },
        {
          id: "ghost",
          letter: "b)",
          name: "GhostNorm",
          small: "ghost batch",
          pooled: ["batch subset", "position"],
          held: ["channel", "other batches"],
          sentence: "GhostNorm uses a restricted batch group, pooling only that ghost batch and the spatial positions for a channel.",
          contains: (b, c, p) => c === 0 && b >= 1 && b <= 2,
          sweepValue: (b, c, p) => b - 1 + 0.25 * p,
          sweepMax: 1 + 0.25 * (N - 1)
        },
        {
          id: "layer",
          letter: "c)",
          name: "LayerNorm",
          small: "per sample",
          pooled: ["channel", "position"],
          held: ["batch index"],
          sentence: "LayerNorm pools every channel and spatial position inside one batch sample.",
          contains: (b, c, p) => b === 0,
          sweepValue: (b, c, p) => c + 0.36 * p,
          sweepMax: N - 1 + 0.36 * (N - 1)
        },
        {
          id: "group",
          letter: "d)",
          name: "GroupNorm",
          small: "channel group",
          pooled: ["subset channels", "position"],
          held: ["batch index", "other channels"],
          sentence: "GroupNorm pools spatial positions across a fixed subset of channels within one sample.",
          contains: (b, c, p) => b === 0 && c >= 1 && c <= 2,
          sweepValue: (b, c, p) => c - 1 + 0.32 * p,
          sweepMax: 1 + 0.32 * (N - 1)
        },
        {
          id: "instance",
          letter: "e)",
          name: "InstanceNorm",
          small: "per channel sample",
          pooled: ["position"],
          held: ["batch index", "channel"],
          sentence: "InstanceNorm pools spatial positions for one channel within one sample.",
          contains: (b, c, p) => b === 0 && c === 2,
          sweepValue: (b, c, p) => p,
          sweepMax: N - 1
        }
      ];

      const svgNS = "http://www.w3.org/2000/svg";
      const grid = document.getElementById("figureGrid");
      const axisChips = document.getElementById("axisChips");
      const scopeSentence = document.getElementById("scopeSentence");
      const buttons = Array.from(document.querySelectorAll("[data-select]"));
      const animateBtn = document.getElementById("animateBtn");

      let activeId = "batch";
      let animationFrame = 0;
      let animationStart = 0;
      let isAnimating = false;
      const duration = 2500;

      function el(name, attrs = {}, parent) {
        const node = document.createElementNS(svgNS, name);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, String(value));
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      function pt(b, c, p) {
        const origin = { x: 150, y: 220 };
        const batch = { x: 24, y: -12 };
        const channel = { x: -24, y: -12 };
        const position = { x: 0, y: -25 };
        return {
          x: origin.x + b * batch.x + c * channel.x + p * position.x,
          y: origin.y + b * batch.y + c * channel.y + p * position.y
        };
      }

      function pointsToString(points) {
        return points.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      }

      function facePoints(face, b, c, p) {
        if (face === "left") {
          return [pt(0, c, p), pt(0, c + 1, p), pt(0, c + 1, p + 1), pt(0, c, p + 1)];
        }
        if (face === "right") {
          return [pt(b, 0, p), pt(b + 1, 0, p), pt(b + 1, 0, p + 1), pt(b, 0, p + 1)];
        }
        return [pt(b, c, N), pt(b + 1, c, N), pt(b + 1, c + 1, N), pt(b, c + 1, N)];
      }

      function faceFill(face, selected) {
        return selected ? colors.orange[face] : colors.gray[face];
      }

      function drawCell(group, norm, face, b, c, p) {
        const selected = norm.contains(b, c, p);
        const poly = el("polygon", {
          class: "cell",
          points: pointsToString(facePoints(face, b, c, p)),
          fill: faceFill(face, selected),
          "data-face": face,
          "data-selected": selected ? "true" : "false",
          "data-base-fill": faceFill(face, selected),
          "data-sweep-fill": selected ? colors.sweep[face] : faceFill(face, false),
          "data-sweep-value": norm.sweepValue(b, c, p).toFixed(3),
          "data-sweep-max": norm.sweepMax.toFixed(3)
        }, group);
        if (selected) {
          poly.setAttribute("aria-label", `${norm.name} normalized cell`);
        }
      }

      function drawPanel(norm) {
        const panel = document.createElement("article");
        panel.className = "norm-panel";
        panel.tabIndex = 0;
        panel.dataset.panel = norm.id;
        panel.setAttribute("role", "button");
        panel.setAttribute("aria-label", `${norm.name}: ${norm.sentence}`);

        const svg = el("svg", {
          class: "panel-svg",
          viewBox: "0 0 300 302",
          role: "img",
          "aria-label": `${norm.letter} ${norm.name}, cube showing orange normalized scope`
        });

        const defs = el("defs", {}, svg);
        const marker = el("marker", {
          id: `arrow-${norm.id}`,
          viewBox: "0 0 8 8",
          refX: "7",
          refY: "4",
          markerWidth: "5",
          markerHeight: "5",
          orient: "auto-start-reverse"
        }, defs);
        el("path", {
          class: "arrow-head",
          d: "M 0 0 L 8 4 L 0 8 Z"
        }, marker);

        el("text", { class: "panel-letter", x: "3", y: "34" }, svg).textContent = norm.letter;

        const cells = el("g", { class: "cells" }, svg);
        for (let p = 0; p < N; p += 1) {
          for (let c = N - 1; c >= 0; c -= 1) {
            drawCell(cells, norm, "left", 0, c, p);
          }
        }
        for (let p = 0; p < N; p += 1) {
          for (let b = N - 1; b >= 0; b -= 1) {
            drawCell(cells, norm, "right", b, 0, p);
          }
        }
        for (let c = N - 1; c >= 0; c -= 1) {
          for (let b = 0; b < N; b += 1) {
            drawCell(cells, norm, "top", b, c, N - 1);
          }
        }

        const arrow = el("g", { class: "normal-arrow" }, svg);
        el("path", {
          class: "arrow-line",
          d: "M 178 58 C 205 67, 217 88, 220 110",
          fill: "none",
          markerEnd: `url(#arrow-${norm.id})`
        }, arrow);

        const badge = el("g", { class: "stat-badge" }, svg);
        el("rect", { class: "badge-box", x: "171", y: "19", width: "108", height: "31", rx: "6" }, badge);
        el("text", { class: "badge-text", x: "225", y: "38", "text-anchor": "middle" }, badge).textContent = "mean + variance";

        el("text", {
          class: "axis-label",
          x: "16",
          y: "145",
          "text-anchor": "middle",
          transform: "rotate(-90 16 145)"
        }, svg).textContent = "Position";
        el("text", {
          class: "axis-label",
          x: "73",
          y: "258",
          "text-anchor": "middle",
          transform: "rotate(28 73 258)"
        }, svg).textContent = "channel";
        el("text", {
          class: "axis-label",
          x: "224",
          y: "258",
          "text-anchor": "middle",
          transform: "rotate(-24 224 258)"
        }, svg).textContent = "batch index";
        el("text", { class: "panel-title", x: "150", y: "292", "text-anchor": "middle" }, svg).textContent = norm.name;
        el("text", { class: "panel-subtitle", x: "150", y: "17", "text-anchor": "middle" }, svg).textContent = norm.small;

        panel.appendChild(svg);
        panel.addEventListener("click", () => selectNorm(norm.id, true));
        panel.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectNorm(norm.id, true);
          }
        });
        grid.appendChild(panel);
      }

      function currentNorm() {
        return norms.find((norm) => norm.id === activeId);
      }

      function renderChips(norm) {
        axisChips.innerHTML = "";
        const label = document.createElement("span");
        label.className = "chip-label";
        label.textContent = "pooled";
        axisChips.appendChild(label);
        norm.pooled.forEach((axis) => {
          const chip = document.createElement("span");
          chip.className = "chip pooled";
          chip.textContent = axis;
          axisChips.appendChild(chip);
        });
        const held = document.createElement("span");
        held.className = "chip-label";
        held.textContent = "held fixed";
        axisChips.appendChild(held);
        norm.held.forEach((axis) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = axis;
          axisChips.appendChild(chip);
        });
      }

      function resetCellFills(panel) {
        panel.querySelectorAll(".cell").forEach((cell) => {
          cell.setAttribute("fill", cell.dataset.baseFill);
        });
      }

      function updatePanels() {
        const norm = currentNorm();
        document.querySelectorAll(".norm-panel").forEach((panel) => {
          const isActive = panel.dataset.panel === activeId;
          panel.classList.toggle("active", isActive);
          panel.classList.remove("applied", "animating");
          panel.setAttribute("aria-pressed", isActive ? "true" : "false");
          resetCellFills(panel);
        });
        buttons.forEach((button) => {
          const isActive = button.dataset.select === activeId;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-selected", isActive ? "true" : "false");
        });
        renderChips(norm);
        scopeSentence.textContent = norm.sentence;
      }

      function selectNorm(id, animate) {
        activeId = id;
        stopAnimation();
        updatePanels();
        if (animate) startAnimation();
      }

      function stopAnimation() {
        isAnimating = false;
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }

      function startAnimation() {
        stopAnimation();
        const panel = document.querySelector(`.norm-panel[data-panel="${activeId}"]`);
        if (!panel) return;
        document.querySelectorAll(".norm-panel").forEach((node) => node.classList.remove("applied", "animating"));
        panel.classList.add("animating");
        isAnimating = true;
        animationStart = performance.now();
        animationFrame = requestAnimationFrame(tick);
      }

      function tick(now) {
        if (!isAnimating) return;
        const panel = document.querySelector(`.norm-panel[data-panel="${activeId}"]`);
        if (!panel) return;
        const elapsed = now - animationStart;
        const progress = Math.min(elapsed / duration, 1);
        const selectedCells = Array.from(panel.querySelectorAll('.cell[data-selected="true"]'));
        selectedCells.forEach((cell) => {
          const max = Number(cell.dataset.sweepMax);
          const value = Number(cell.dataset.sweepValue);
          const target = progress * (max + 1.15) - 0.12;
          const band = Math.max(0.58, max * 0.16);
          const inBand = Math.abs(value - target) <= band;
          cell.setAttribute("fill", inBand ? cell.dataset.sweepFill : cell.dataset.baseFill);
        });
        if (progress < 1) {
          animationFrame = requestAnimationFrame(tick);
        } else {
          selectedCells.forEach((cell) => {
            cell.setAttribute("fill", cell.dataset.baseFill);
          });
          panel.classList.remove("animating");
          panel.classList.add("applied");
          scopeSentence.textContent = `${currentNorm().sentence} The highlighted activations now receive the shared normalized statistic.`;
          isAnimating = false;
          animationFrame = 0;
        }
      }

      norms.forEach(drawPanel);
      updatePanels();
      startAnimation();
      buttons.forEach((button) => {
        button.addEventListener("click", () => selectNorm(button.dataset.select, true));
      });
      animateBtn.addEventListener("click", startAnimation);
    })();
  </script>
</body>
</html>
