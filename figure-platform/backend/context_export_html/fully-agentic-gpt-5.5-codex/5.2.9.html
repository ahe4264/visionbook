<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disk Method for a Solid of Revolution</title>
  <style>
    :root {
      --ink: #24262b;
      --muted: #5d6470;
      --paper: #ffffff;
      --page: #eef3f6;
      --panel: #fbfcfe;
      --line: #d7e0e8;
      --axis: #222428;
      --blue: #2aa6d9;
      --blue-dark: #1688bb;
      --blue-soft: rgba(76, 174, 216, 0.26);
      --blue-fill: rgba(103, 188, 222, 0.34);
      --red: #e84f55;
      --shadow: 0 18px 52px rgba(31, 43, 57, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    main {
      width: min(1240px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .inputs {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px;
      min-width: 0;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    input[type="text"],
    input[type="number"] {
      height: 36px;
      border: 1px solid #c7d2de;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: 700 0.96rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 0 10px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="range"]:focus-visible {
      border-color: var(--blue-dark);
      box-shadow: 0 0 0 3px rgba(42, 166, 217, 0.18);
    }

    #expr {
      width: min(270px, 58vw);
    }

    .bound {
      width: 86px;
    }

    .formula {
      justify-self: end;
      color: #202328;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 1.7vw, 1.2rem);
      white-space: nowrap;
    }

    .status {
      grid-column: 1 / -1;
      min-height: 19px;
      color: #9b2f34;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid var(--line);
    }

    .panel {
      min-width: 0;
      background: #fff;
    }

    .panel + .panel {
      border-left: 1px solid var(--line);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(4, auto);
      gap: 12px;
      align-items: center;
      padding: 12px 14px 14px;
      background: var(--panel);
    }

    .slider-wrap {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue-dark);
    }

    .metric {
      min-width: 104px;
      padding: 7px 10px;
      border: 1px solid #d4dde7;
      border-radius: 6px;
      background: #fff;
      white-space: nowrap;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      color: #202328;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.15;
    }

    .math {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
      }

      .topbar,
      .controls {
        grid-template-columns: 1fr;
      }

      .formula {
        justify-self: start;
        white-space: normal;
      }

      .panels {
        grid-template-columns: 1fr;
      }

      .panel + .panel {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .controls {
        gap: 9px;
      }

      .metric {
        min-width: 0;
      }
    }

    @media (max-width: 560px) {
      .inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: end;
      }

      .inputs label:first-child {
        grid-column: 1 / -1;
      }

      #expr {
        width: 100%;
      }

      .bound {
        width: 100%;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .slider-wrap {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Interactive disk method figure">
    <section class="topbar">
      <div class="inputs">
        <label>
          f(x)
          <input id="expr" type="text" value="sqrt(x)" spellcheck="false" autocomplete="off" aria-label="Function f of x">
        </label>
        <label>
          a
          <input id="boundA" class="bound" type="number" value="1" step="0.1" aria-label="Lower bound a">
        </label>
        <label>
          b
          <input id="boundB" class="bound" type="number" value="4" step="0.1" aria-label="Upper bound b">
        </label>
      </div>
      <div class="formula">V = ∫<sub>a</sub><sup>b</sup> π[f(x)]² dx</div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="panels" aria-label="Two panels showing the disk method">
      <div class="panel">
        <svg id="panel2d" viewBox="0 0 560 350" role="img" aria-label="Panel a: region R below y equals f of x">
          <defs>
            <marker id="arrow2d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5 L0,10 Z" fill="#222428"></path>
            </marker>
          </defs>
        </svg>
      </div>
      <div class="panel">
        <svg id="panel3d" viewBox="0 0 600 350" role="img" aria-label="Panel b: solid of revolution with a disk cross section">
          <defs>
            <marker id="arrow3d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
              <path d="M0,0 L10,5 L0,10 Z" fill="#222428"></path>
            </marker>
            <linearGradient id="solidFill" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stop-color="#f8fbfd" stop-opacity="0.16"></stop>
              <stop offset="50%" stop-color="#9bcfe5" stop-opacity="0.22"></stop>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"></stop>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </section>

    <section class="controls" aria-label="Disk sweep controls">
      <div class="slider-wrap">
        <div class="slider-label">
          <span>disk position x</span>
          <span id="xRangeLabel" class="math">a ≤ x ≤ b</span>
        </div>
        <input id="xSlider" type="range" min="1" max="4" step="0.006" value="2.5" aria-label="Disk position x">
      </div>
      <div class="metric">
        <span>x</span>
        <strong id="xValue">2.500</strong>
      </div>
      <div class="metric">
        <span>radius f(x)</span>
        <strong id="radiusValue">1.581</strong>
      </div>
      <div class="metric">
        <span>area π[f(x)]²</span>
        <strong id="areaValue">7.854</strong>
      </div>
      <div class="metric">
        <span>volume estimate</span>
        <strong id="volumeValue">23.562</strong>
      </div>
    </section>
  </main>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const exprInput = document.getElementById("expr");
    const aInput = document.getElementById("boundA");
    const bInput = document.getElementById("boundB");
    const slider = document.getElementById("xSlider");
    const statusEl = document.getElementById("status");
    const xRangeLabel = document.getElementById("xRangeLabel");
    const xValue = document.getElementById("xValue");
    const radiusValue = document.getElementById("radiusValue");
    const areaValue = document.getElementById("areaValue");
    const volumeValue = document.getElementById("volumeValue");
    const svg2d = document.getElementById("panel2d");
    const svg3d = document.getElementById("panel3d");
    const state = { ratio: 0.5 };

    const unaryFns = {
      sqrt: Math.sqrt,
      sin: Math.sin,
      cos: Math.cos,
      tan: Math.tan,
      asin: Math.asin,
      acos: Math.acos,
      atan: Math.atan,
      abs: Math.abs,
      exp: Math.exp,
      log: Math.log,
      ln: Math.log,
      floor: Math.floor,
      ceil: Math.ceil,
      round: Math.round,
      cbrt: Math.cbrt
    };
    const multiFns = {
      pow: Math.pow,
      min: Math.min,
      max: Math.max
    };

    function tokenize(source) {
      const tokens = [];
      let i = 0;
      while (i < source.length) {
        const ch = source[i];
        if (/\s/.test(ch)) {
          i += 1;
          continue;
        }
        if (/[0-9.]/.test(ch)) {
          const match = source.slice(i).match(/^(?:\d+\.\d*|\.\d+|\d+)(?:[eE][+-]?\d+)?/);
          if (!match) throw new Error("Check the number near '" + source.slice(i, i + 6) + "'.");
          tokens.push({ type: "number", value: Number(match[0]) });
          i += match[0].length;
          continue;
        }
        if (/[A-Za-z_π]/.test(ch)) {
          const match = source.slice(i).match(/^[A-Za-z_π][A-Za-z0-9_π]*/);
          tokens.push({ type: "id", value: match[0].toLowerCase() });
          i += match[0].length;
          continue;
        }
        if ("+-*/^(),".includes(ch)) {
          tokens.push({ type: ch, value: ch });
          i += 1;
          continue;
        }
        throw new Error("Only numbers, x, pi, functions, and + - * / ^ are supported.");
      }
      tokens.push({ type: "eof", value: "" });
      return tokens;
    }

    function compileExpression(source) {
      const tokens = tokenize(source || "0");
      let pos = 0;

      function peek(type) {
        return tokens[pos].type === type;
      }

      function consume(type) {
        if (!peek(type)) throw new Error("Expected '" + type + "'.");
        return tokens[pos++];
      }

      function parseExpression() {
        let node = parseTerm();
        while (peek("+") || peek("-")) {
          const op = tokens[pos++].type;
          const right = parseTerm();
          const left = node;
          node = op === "+"
            ? x => left(x) + right(x)
            : x => left(x) - right(x);
        }
        return node;
      }

      function parseTerm() {
        let node = parseSignedPower();
        while (peek("*") || peek("/")) {
          const op = tokens[pos++].type;
          const right = parseSignedPower();
          const left = node;
          node = op === "*"
            ? x => left(x) * right(x)
            : x => left(x) / right(x);
        }
        return node;
      }

      function parseSignedPower() {
        if (peek("+")) {
          pos += 1;
          return parseSignedPower();
        }
        if (peek("-")) {
          pos += 1;
          const inner = parseSignedPower();
          return x => -inner(x);
        }
        return parsePower();
      }

      function parsePower() {
        let node = parsePrimary();
        if (peek("^")) {
          pos += 1;
          const right = parseSignedPower();
          const left = node;
          node = x => Math.pow(left(x), right(x));
        }
        return node;
      }

      function parsePrimary() {
        if (peek("number")) {
          const value = consume("number").value;
          return () => value;
        }
        if (peek("(")) {
          consume("(");
          const node = parseExpression();
          consume(")");
          return node;
        }
        if (peek("id")) {
          const id = consume("id").value;
          if (id === "x") return x => x;
          if (id === "pi" || id === "π") return () => Math.PI;
          if (id === "e") return () => Math.E;
          if (!peek("(")) throw new Error("Use parentheses after " + id + ", for example " + id + "(x).");
          consume("(");
          const args = [];
          if (!peek(")")) {
            args.push(parseExpression());
            while (peek(",")) {
              consume(",");
              args.push(parseExpression());
            }
          }
          consume(")");
          if (unaryFns[id]) {
            if (args.length !== 1) throw new Error(id + " needs one input.");
            return x => unaryFns[id](args[0](x));
          }
          if (id === "pow") {
            if (args.length !== 2) throw new Error("pow needs two inputs.");
            return x => Math.pow(args[0](x), args[1](x));
          }
          if (multiFns[id]) {
            if (args.length < 1) throw new Error(id + " needs at least one input.");
            return x => multiFns[id](...args.map(arg => arg(x)));
          }
          throw new Error("Unsupported function: " + id + ".");
        }
        throw new Error("Enter an expression such as sqrt(x), x^2, or 1 + sin(x).");
      }

      const parsed = parseExpression();
      if (!peek("eof")) throw new Error("Unexpected text after the expression.");
      return parsed;
    }

    function el(name, attrs = {}, text) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) {
        node.setAttribute(key, value);
      }
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function fmt(value, digits = 3) {
      if (!Number.isFinite(value)) return "undefined";
      const abs = Math.abs(value);
      if (abs !== 0 && (abs >= 10000 || abs < 0.001)) return value.toExponential(2);
      return value.toFixed(digits).replace(/\.?0+$/, "");
    }

    function pathFrom(points) {
      return points.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
    }

    function sampleFunction(fn, a, b, count) {
      const samples = [];
      let maxY = 0;
      for (let i = 0; i < count; i += 1) {
        const x = a + (b - a) * i / (count - 1);
        const y = fn(x);
        if (!Number.isFinite(y)) throw new Error("f(x) must be finite on the whole interval.");
        if (y < -1e-8) throw new Error("For the disk method here, use f(x) ≥ 0 on [a,b].");
        const cleanY = Math.max(0, y);
        samples.push({ x, y: cleanY });
        maxY = Math.max(maxY, cleanY);
      }
      if (maxY <= 1e-8) maxY = 1;
      return { samples, maxY };
    }

    function integrate(samples) {
      let total = 0;
      for (let i = 1; i < samples.length; i += 1) {
        const dx = samples[i].x - samples[i - 1].x;
        total += 0.5 * dx * Math.PI * (samples[i].y * samples[i].y + samples[i - 1].y * samples[i - 1].y);
      }
      return total;
    }

    function draw2d(samples, maxY, currentX, currentY, a, b) {
      const defs = svg2d.querySelector("defs");
      svg2d.replaceChildren(defs);
      const axisY = 244;
      const yAxisX = 43;
      const x0 = 86;
      const x1 = 466;
      const topPad = 38;
      const usableH = axisY - topPad;
      const yScale = Math.min(138 / maxY, usableH / maxY);
      const xMap = x => x0 + (x - a) / (b - a) * (x1 - x0);
      const yMap = y => axisY - y * yScale;
      const curve = samples.map(p => [xMap(p.x), yMap(p.y)]);
      const fillPath = "M" + x0 + "," + axisY + " " + pathFrom(curve).slice(1) + " L" + x1 + "," + axisY + " Z";
      const sx = xMap(currentX);
      const sy = yMap(currentY);

      svg2d.append(
        el("line", { x1: 10, y1: axisY, x2: 520, y2: axisY, stroke: "var(--axis)", "stroke-width": 2.2, "marker-end": "url(#arrow2d)" }),
        el("line", { x1: yAxisX, y1: 312, x2: yAxisX, y2: 20, stroke: "var(--axis)", "stroke-width": 2.2, "marker-end": "url(#arrow2d)" }),
        el("path", { d: fillPath, fill: "var(--blue-soft)", stroke: "none" }),
        el("line", { x1: x0, y1: axisY, x2: x0, y2: yMap(samples[0].y), stroke: "var(--axis)", "stroke-width": 2 }),
        el("line", { x1: x1, y1: axisY, x2: x1, y2: yMap(samples[samples.length - 1].y), stroke: "var(--axis)", "stroke-width": 2 }),
        el("path", { d: pathFrom(curve), fill: "none", stroke: "var(--blue)", "stroke-width": 4.2, "stroke-linecap": "round", "stroke-linejoin": "round" }),
        el("line", { x1: sx, y1: axisY, x2: sx, y2: sy, stroke: "var(--blue-dark)", "stroke-width": 2.5, "stroke-dasharray": "7 5" }),
        el("circle", { cx: sx, cy: sy, r: 4.2, fill: "var(--blue-dark)" })
      );

      const labelStyle = { fill: "var(--axis)", "font-family": "Georgia, 'Times New Roman', serif", "font-size": 25, "font-style": "italic" };
      svg2d.append(
        el("text", { x: 520, y: axisY - 12, ...labelStyle }, "x"),
        el("text", { x: yAxisX + 18, y: 28, ...labelStyle }, "y"),
        el("text", { x: x0 - 9, y: axisY + 31, ...labelStyle, "text-anchor": "middle" }, "a"),
        el("text", { x: x1 + 2, y: axisY + 31, ...labelStyle, "text-anchor": "middle" }, "b"),
        el("text", { x: 255, y: 98, ...labelStyle, "font-size": 29, "text-anchor": "middle" }, "y = f(x)"),
        el("text", { x: 282, y: 188, ...labelStyle, "font-size": 31, "text-anchor": "middle" }, "R"),
        el("text", { x: sx + 8, y: axisY + 26, ...labelStyle, "font-size": 21 }, "x")
      );

      const arrowX = x1 + 48;
      svg2d.append(
        el("path", {
          d: "M" + arrowX + "," + (axisY - 37) + " C" + (arrowX + 25) + "," + (axisY - 60) + " " + (arrowX + 28) + "," + (axisY + 42) + " " + arrowX + "," + (axisY + 20),
          fill: "none",
          stroke: "var(--axis)",
          "stroke-width": 1.8,
          "marker-end": "url(#arrow2d)"
        }),
        el("text", { x: 264, y: 333, ...labelStyle, "font-size": 27, "text-anchor": "middle" }, "(a)")
      );
    }

    function drawBrace(svg, x, yTop, yMid, labelSide) {
      const dir = labelSide === "left" ? -1 : 1;
      const w = 14 * dir;
      const d = [
        "M", x, yTop,
        "C", x + w, yTop, x + w, yTop + 10, x + w, yTop + 18,
        "L", x + w, yMid - 10,
        "C", x + w, yMid - 3, x, yMid - 3, x, yMid,
        "C", x + w, yMid + 3, x + w, yMid + 10, x + w, yMid + 18
      ].join(" ");
      svg.append(el("path", { d, fill: "none", stroke: "var(--axis)", "stroke-width": 1.8, "stroke-linecap": "round" }));
    }

    function draw3d(samples, maxY, currentX, currentY, a, b) {
      const defs = svg3d.querySelector("defs");
      svg3d.replaceChildren(defs);
      const axisY = 176;
      const yAxisX = 38;
      const x0 = 82;
      const x1 = 486;
      const yScale = Math.min(110 / maxY, 112);
      const xMap = x => x0 + (x - a) / (b - a) * (x1 - x0);
      const rMap = y => Math.max(0, y * yScale);
      const top = samples.map(p => [xMap(p.x), axisY - rMap(p.y)]);
      const bottom = samples.map(p => [xMap(p.x), axisY + rMap(p.y)]);
      const surfacePath = pathFrom(top) + " L" + bottom.slice().reverse().map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" L") + " Z";
      const sx = xMap(currentX);
      const r = rMap(currentY);
      const diskRx = Math.max(10, r * 0.23);
      const side = sx > 372 ? "left" : "right";
      const labelDir = side === "left" ? -1 : 1;
      const labelX = sx + labelDir * (diskRx + 50);
      const braceX = sx + labelDir * (diskRx + 16);

      svg3d.append(
        el("line", { x1: 10, y1: axisY, x2: 565, y2: axisY, stroke: "var(--axis)", "stroke-width": 2.2, "marker-end": "url(#arrow3d)" }),
        el("line", { x1: yAxisX, y1: 318, x2: yAxisX, y2: 18, stroke: "var(--axis)", "stroke-width": 2.2, "marker-end": "url(#arrow3d)" }),
        el("path", { d: surfacePath, fill: "url(#solidFill)", stroke: "none" })
      );

      const aR = rMap(samples[0].y);
      const bR = rMap(samples[samples.length - 1].y);
      svg3d.append(
        el("ellipse", { cx: x0, cy: axisY, rx: Math.max(12, aR * 0.22), ry: aR, fill: "rgba(255,255,255,0.36)", stroke: "#a6acb4", "stroke-width": 2.1 }),
        el("path", { d: pathFrom(top), fill: "none", stroke: "var(--axis)", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }),
        el("path", { d: pathFrom(bottom), fill: "none", stroke: "var(--axis)", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }),
        el("ellipse", { cx: x1, cy: axisY, rx: Math.max(13, bR * 0.22), ry: bR, fill: "rgba(255,255,255,0.24)", stroke: "var(--axis)", "stroke-width": 2.7 })
      );

      svg3d.append(
        el("ellipse", { cx: sx, cy: axisY, rx: diskRx, ry: r, fill: "var(--blue-fill)", stroke: "var(--blue)", "stroke-width": 4 }),
        el("line", { x1: sx, y1: axisY, x2: sx, y2: axisY - r, stroke: "var(--blue-dark)", "stroke-width": 2.4 }),
        el("line", { x1: sx - diskRx, y1: axisY, x2: sx + diskRx, y2: axisY, stroke: "rgba(42, 166, 217, 0.38)", "stroke-width": 1.8 }),
        el("circle", { cx: sx, cy: axisY, r: 7, fill: "var(--red)" })
      );

      drawBrace(svg3d, braceX, axisY - r, axisY, side);

      const labelStyle = { fill: "var(--axis)", "font-family": "Georgia, 'Times New Roman', serif", "font-size": 25, "font-style": "italic" };
      svg3d.append(
        el("text", { x: 568, y: axisY - 14, ...labelStyle }, "x"),
        el("text", { x: yAxisX + 18, y: 30, ...labelStyle }, "y"),
        el("text", { x: x0 - 4, y: axisY + 32, ...labelStyle, "text-anchor": "middle" }, "a"),
        el("text", { x: sx, y: axisY + 34, ...labelStyle, "text-anchor": "middle" }, "x"),
        el("text", { x: x1, y: axisY + 32, ...labelStyle, "text-anchor": "middle" }, "b"),
        el("text", { x: labelX, y: axisY - Math.max(31, r * 0.43), ...labelStyle, "font-size": 26, "text-anchor": side === "left" ? "end" : "start" }, "f(x)"),
        el("text", { x: 300, y: 333, ...labelStyle, "font-size": 27, "text-anchor": "middle" }, "(b)")
      );

      const areaText = el("text", {
        x: sx,
        y: Math.max(28, axisY - r - 18),
        fill: "var(--blue-dark)",
        "font-family": "Georgia, 'Times New Roman', serif",
        "font-size": 18,
        "font-style": "italic",
        "text-anchor": "middle"
      }, "A(x) = π[f(x)]²");
      svg3d.append(areaText);
    }

    function update() {
      statusEl.textContent = "";
      let fn;
      let a;
      let b;
      try {
        fn = compileExpression(exprInput.value);
        a = Number(aInput.value);
        b = Number(bInput.value);
        if (!Number.isFinite(a) || !Number.isFinite(b)) throw new Error("Bounds must be numbers.");
        if (!(b > a)) throw new Error("Choose bounds with b > a.");
        const { samples, maxY } = sampleFunction(fn, a, b, 220);
        const x = a + state.ratio * (b - a);
        const y = fn(x);
        if (!Number.isFinite(y) || y < -1e-8) throw new Error("The selected disk has no nonnegative radius.");
        const radius = Math.max(0, y);
        const area = Math.PI * radius * radius;
        const volume = integrate(samples);
        slider.min = String(a);
        slider.max = String(b);
        slider.step = String((b - a) / 600);
        slider.value = String(x);
        xRangeLabel.textContent = fmt(a) + " ≤ x ≤ " + fmt(b);
        xValue.textContent = fmt(x);
        radiusValue.textContent = fmt(radius);
        areaValue.textContent = fmt(area);
        volumeValue.textContent = fmt(volume);
        draw2d(samples, maxY, x, radius, a, b);
        draw3d(samples, maxY, x, radius, a, b);
      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    slider.addEventListener("input", () => {
      const a = Number(aInput.value);
      const b = Number(bInput.value);
      const x = Number(slider.value);
      if (Number.isFinite(a) && Number.isFinite(b) && b > a && Number.isFinite(x)) {
        state.ratio = Math.min(1, Math.max(0, (x - a) / (b - a)));
      }
      update();
    });

    [exprInput, aInput, bInput].forEach(input => {
      input.addEventListener("input", update);
    });

    update();
  </script>
</body>
</html>
