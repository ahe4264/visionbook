<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enzyme-Substrate Binding Models</title>
  <style>
    :root {
      --ink: #1e1e1e;
      --muted: #4f5c62;
      --panel: #f4f8f4;
      --panel-line: #ccd8c7;
      --enzyme-edge: #111111;
      --enzyme: #b4ce68;
      --enzyme-light: #e9f1d2;
      --enzyme-mid: #d2df96;
      --substrate: #cbb8dc;
      --substrate-light: #ddcfe9;
      --tab: #d8ab8f;
      --tab-dark: #bb8465;
      --accent: #0a6b78;
      --accent-soft: #d9f0f1;
      --fit: #ba5a28;
      --good: #40782a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .figure-app {
      width: min(1220px, 100vw);
      max-width: 100vw;
      min-width: 0;
      min-height: 100vh;
      padding: clamp(8px, 1.8vw, 22px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .stage {
      width: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    svg {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      max-height: calc(100vh - 128px);
      min-height: 286px;
      display: block;
      overflow: visible;
    }

    .toolbar {
      width: min(980px, 100%);
      max-width: 100%;
      min-width: 0;
      margin: 0 auto;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      display: grid;
      grid-template-columns: auto auto minmax(190px, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .toolbar > * {
      min-width: 0;
    }

    .segmented {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid #b9cac0;
      border-radius: 8px;
      background: #ffffff;
    }

    button,
    input,
    label {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid #8da69b;
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      padding: 7px 12px;
      cursor: pointer;
      line-height: 1.1;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(10, 107, 120, 0.18);
      outline-offset: 1px;
    }

    .segmented button {
      border-color: transparent;
      min-width: 132px;
    }

    button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .play {
      min-width: 92px;
      font-weight: 700;
    }

    .scrubber {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      align-items: center;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .readout {
      color: var(--muted);
      font-size: 0.95rem;
      min-width: 118px;
      text-align: right;
    }

    .model-pair {
      transition: opacity 180ms ease, filter 180ms ease;
    }

    .model-pair.is-muted {
      opacity: 0.34;
      filter: grayscale(0.2);
    }

    .panel-backdrop {
      fill: #ffffff;
      stroke: none;
    }

    .label {
      fill: var(--ink);
      font-size: 25px;
      font-weight: 400;
    }

    .small-label {
      fill: var(--ink);
      font-size: 24px;
      font-weight: 400;
    }

    .caption {
      fill: var(--ink);
      font-size: 24px;
      font-weight: 400;
    }

    .enzyme-label {
      fill: var(--ink);
      font-size: 24px;
      font-weight: 400;
    }

    .callout,
    .leader {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      fill: none;
      stroke: #111111;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .enzyme-body {
      fill: var(--enzyme);
      stroke: var(--enzyme-edge);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .enzyme-inner {
      fill: var(--enzyme-light);
      opacity: 0.96;
      stroke: none;
    }

    .active-pocket {
      fill: none;
      stroke: #8fa33e;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.92;
    }

    .active-pocket.lock {
      stroke: var(--good);
    }

    .active-pocket.fit {
      stroke: var(--fit);
    }

    .substrate-main {
      fill: var(--substrate);
      stroke: #111111;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .substrate-shine {
      fill: var(--substrate-light);
      opacity: 0.78;
    }

    .substrate-tab {
      fill: var(--tab);
      stroke: var(--tab-dark);
      stroke-width: 1.4;
    }

    .divider-line {
      stroke: #111111;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .fit-ghost {
      fill: none;
      stroke: var(--fit);
      stroke-width: 3;
      stroke-dasharray: 7 7;
      opacity: 0;
      pointer-events: none;
    }

    .dock-highlight {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0;
      pointer-events: none;
    }

    .motion-trail {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 4 6;
      opacity: 0.34;
    }

    .contact {
      opacity: 0;
    }

    .contact line {
      stroke: var(--accent);
      stroke-width: 2.6;
      stroke-linecap: round;
    }

    .flex-lines {
      opacity: 0;
    }

    .flex-lines path {
      fill: none;
      stroke: var(--fit);
      stroke-width: 2.6;
      stroke-linecap: round;
    }

    @media (max-width: 720px) {
      .figure-app {
        width: 100%;
        grid-template-rows: auto auto;
        align-content: center;
        overflow: hidden;
      }

      svg {
        max-height: none;
        max-width: 100%;
        min-height: 0;
        height: auto;
      }

      .toolbar {
        width: 100%;
        min-width: 0;
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .segmented {
        width: 100%;
        min-width: 0;
        grid-template-columns: 1fr;
      }

      .segmented button {
        min-width: 0;
        padding-inline: 6px;
        font-size: clamp(0.88rem, 3.8vw, 1rem);
      }

      .scrubber {
        grid-template-columns: 1fr;
        white-space: normal;
      }

      .readout {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="figure-app" aria-labelledby="figure-title">
    <div class="stage">
      <svg id="enzymeFigure" viewBox="0 0 1000 440" role="img" aria-labelledby="figure-title figure-desc">
        <title id="figure-title">Lock-and-key and induced-fit models of enzyme-substrate binding</title>
        <desc id="figure-desc">Four-panel comparison showing substrates approaching active sites and forming enzyme-substrate complexes. Controls toggle and animate lock-and-key versus induced-fit binding.</desc>

        <defs>
          <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto">
            <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#111111"></path>
          </marker>

          <g id="leftSubstrateSymbol">
            <path class="substrate-main" d="M 0 0 C -28 -3 -49 19 -48 47 C -48 60 -39 61 -28 62 L -28 76 C -28 83 -15 86 -10 79 L -10 48 L 0 48 Z"></path>
            <path class="substrate-shine" d="M -11 9 C -31 11 -42 27 -40 45 C -39 51 -35 52 -27 52 L -18 52 L -18 31 C -15 21 -13 14 -11 9 Z"></path>
            <path class="substrate-tab" d="M -27 62 L -10 62 L -10 78 C -13 84 -24 83 -27 77 Z"></path>

            <path class="substrate-shine" d="M 12 9 C 31 11 42 27 40 45 C 39 51 35 52 27 52 L 18 52 L 18 31 C 15 21 14 14 12 9 Z"></path>
            <path class="substrate-tab" d="M 27 62 L 10 62 L 10 78 C 14 84 24 83 27 77 Z"></path>
          </g>

          <g id="complexSubstrates">
            <use href="#leftSubstrateSymbol" transform="translate(0 0)"></use>
            <use href="#rightSubstrateSymbol" transform="translate(0 0)"></use>
            <line class="divider-line" x1="0" y1="3" x2="0" y2="75"></line>
          </g>

          <g id="enzymeInnerShape">
            <path class="enzyme-inner" d="M -78 7 C -67 -21 -43 -29 -23 -22 C -16 -17 -17 5 -9 11 C -2 17 8 14 12 7 L 21 -23 C 45 -28 73 -16 82 10 C 74 36 43 47 4 48 C -40 49 -71 36 -78 7 Z"></path>
          </g>

          <g id="lockEnzyme">
            <path class="enzyme-body" d="M -100 0 C -94 -34 -56 -52 -24 -44 C -13 -41 -16 -6 -8 -1 C -2 3 8 2 12 -3 C 18 -12 12 -40 23 -44 C 53 -52 92 -35 100 0 C 105 35 68 52 5 52 C -57 52 -107 34 -100 0 Z"></path>
            <use href="#enzymeInnerShape"></use>
            <path class="active-pocket lock" d="M -24 -42 C -14 -36 -17 -5 -8 1 C -1 8 9 6 14 -2 C 20 -13 14 -37 24 -43"></path>
          </g>

          <g id="complexEnzyme">
            <use href="#lockEnzyme"></use>
            <path class="dock-highlight" d="M -32 -40 C -20 -28 -21 7 -8 13 C 1 18 14 15 21 4 C 28 -9 21 -31 33 -42"></path>
          </g>
        </defs>

        <rect class="panel-backdrop" x="0" y="0" width="1000" height="440"></rect>

        <g id="lockPair" class="model-pair" data-model="lock">
          <g id="lockBeforePanel" transform="translate(0 0)">
            <text class="label" x="107" y="24" text-anchor="middle">Substrates</text>
            <line class="leader" x1="77" y1="34" x2="49" y2="100"></line>
            <line class="leader" x1="144" y1="34" x2="176" y2="101"></line>
            <text class="small-label" x="106" y="90" text-anchor="middle">
              <tspan x="106" dy="0">Active</tspan>
              <tspan x="106" dy="29">site is</tspan>
              <tspan x="106" dy="29">proper</tspan>
              <tspan x="106" dy="29">shape</tspan>
            </text>
            <path class="arrow" d="M 49 178 C 79 187 83 212 84 238" marker-end="url(#arrowhead)"></path>
            <path class="arrow" d="M 163 178 C 134 188 129 212 128 238" marker-end="url(#arrowhead)"></path>
            <path class="motion-trail" id="lockLeftTrail" d="M 45 168 C 55 198 70 222 84 244"></path>
            <path class="motion-trail" id="lockRightTrail" d="M 174 168 C 162 199 146 222 129 244"></path>

            <g transform="translate(106 290)">
              <use href="#lockEnzyme"></use>
              <path class="dock-highlight" id="lockDockHighlight" d="M -30 -39 C -18 -25 -19 8 -8 14 C 0 19 13 16 20 5 C 29 -9 21 -30 32 -41"></path>
            </g>
            <g id="lockContact" class="contact" transform="translate(106 290)">
              <line x1="-22" y1="-14" x2="-34" y2="-29"></line>
              <line x1="-4" y1="0" x2="-7" y2="-20"></line>
              <line x1="19" y1="-13" x2="31" y2="-30"></line>
            </g>
            <g id="lockMovingLeft" transform="translate(49 90)">
              <use href="#leftSubstrateSymbol"></use>
            </g>
            <g id="lockMovingRight" transform="translate(176 90)">
              <use href="#rightSubstrateSymbol"></use>
            </g>
            <text class="enzyme-label" x="106" y="378" text-anchor="middle">Enzyme</text>
          </g>

          <g id="lockComplexPanel" transform="translate(0 0)">
            <text class="small-label" x="366" y="89" text-anchor="middle">
              <tspan x="366" dy="0">Substrate</tspan>
              <tspan x="366" dy="29">complex</tspan>
              <tspan x="366" dy="29">formed</tspan>
            </text>
            <g transform="translate(366 290)">
              <use href="#complexEnzyme"></use>
            </g>
            <g id="lockFinalComplex" transform="translate(366 166)">
              <use href="#complexSubstrates"></use>
            </g>
            <g id="lockFinalContact" class="contact" transform="translate(366 290)">
              <line x1="-23" y1="-18" x2="-34" y2="-33"></line>
              <line x1="0" y1="-3" x2="0" y2="-28"></line>
              <line x1="22" y1="-18" x2="34" y2="-34"></line>
            </g>
            <text class="enzyme-label" x="366" y="378" text-anchor="middle">Enzyme</text>
          </g>

          <text class="caption" x="235" y="420" text-anchor="middle">(a) Lock-and-key model</text>
        </g>

        <g id="fitPair" class="model-pair is-muted" data-model="fit">
          <g id="fitBeforePanel" transform="translate(0 0)">
            <text class="label" x="633" y="24" text-anchor="middle">Substrates</text>
            <line class="leader" x1="596" y1="34" x2="568" y2="100"></line>
            <line class="leader" x1="666" y1="34" x2="699" y2="101"></line>
            <text class="small-label" x="634" y="90" text-anchor="middle">
              <tspan x="634" dy="0">Active</tspan>
              <tspan x="634" dy="29">site</tspan>
              <tspan x="634" dy="29">changes</tspan>
              <tspan x="634" dy="29">to fit</tspan>
            </text>
            <path class="arrow" d="M 568 178 C 598 188 604 215 609 239" marker-end="url(#arrowhead)"></path>
            <path class="arrow" d="M 696 178 C 666 188 656 214 650 239" marker-end="url(#arrowhead)"></path>
            <path class="motion-trail" id="fitLeftTrail" d="M 565 168 C 575 199 594 222 608 244"></path>
            <path class="motion-trail" id="fitRightTrail" d="M 699 168 C 686 199 667 222 650 244"></path>

            <g transform="translate(632 290)">
              <path id="fitGhostPocket" class="fit-ghost" d="M -30 -43 C -14 -40 -5 -29 8 -32 C 18 -35 26 -43 36 -38 C 43 -34 47 -31 55 -35"></path>
              <path id="fitEnzymeBody" class="enzyme-body" d="M -100 0 C -94 -34 -56 -52 -24 -44 C -10 -40 -2 -29 9 -32 C 16 -34 24 -43 32 -38 C 38 -35 39 -31 45 -34 C 66 -46 94 -35 100 0 C 105 35 68 52 5 52 C -57 52 -107 34 -100 0 Z"></path>
              <use href="#enzymeInnerShape"></use>
              <path id="fitPocketLine" class="active-pocket fit" d="M -24 -43 C -9 -36 -2 -23 9 -26 C 18 -29 25 -39 33 -33 C 39 -29 41 -26 47 -30"></path>
              <path class="dock-highlight" id="fitDockHighlight" d="M -32 -39 C -20 -25 -21 8 -8 14 C 0 19 13 16 20 5 C 29 -9 21 -30 32 -41"></path>
              <g id="fitFlexLines" class="flex-lines">
                <path d="M -51 -22 C -38 -15 -34 -3 -31 11"></path>
                <path d="M 53 -23 C 41 -16 36 -3 32 12"></path>
                <path d="M -9 -46 C -2 -38 4 -38 12 -46"></path>
              </g>
            </g>
            <g id="fitContact" class="contact" transform="translate(632 290)">
              <line x1="-23" y1="-14" x2="-34" y2="-29"></line>
              <line x1="-3" y1="0" x2="-7" y2="-20"></line>
              <line x1="20" y1="-13" x2="32" y2="-30"></line>
            </g>
            <g id="fitMovingLeft" transform="translate(568 90)">
              <use href="#leftSubstrateSymbol"></use>
            </g>
            <g id="fitMovingRight" transform="translate(699 90)">
              <use href="#rightSubstrateSymbol"></use>
            </g>
            <text class="enzyme-label" x="632" y="378" text-anchor="middle">Enzyme</text>
          </g>

          <g id="fitComplexPanel" transform="translate(0 0)">
            <text class="small-label" x="878" y="89" text-anchor="middle">
              <tspan x="878" dy="0">Substrate</tspan>
              <tspan x="878" dy="29">complex</tspan>
              <tspan x="878" dy="29">formed</tspan>
            </text>
            <g transform="translate(878 290)">
              <use href="#complexEnzyme"></use>
            </g>
            <g id="fitFinalComplex" transform="translate(878 166)">
              <use href="#complexSubstrates"></use>
            </g>
            <g id="fitFinalContact" class="contact" transform="translate(878 290)">
              <line x1="-23" y1="-18" x2="-34" y2="-33"></line>
              <line x1="0" y1="-3" x2="0" y2="-28"></line>
              <line x1="22" y1="-18" x2="34" y2="-34"></line>
            </g>
            <text class="enzyme-label" x="878" y="378" text-anchor="middle">Enzyme</text>
          </g>

          <text class="caption" x="755" y="420" text-anchor="middle">(b) Induced fit model</text>
        </g>
      </svg>
    </div>

    <section class="toolbar" aria-label="Interactive controls">
      <div class="segmented" role="group" aria-label="Binding model">
        <button id="lockButton" type="button" aria-pressed="true">Lock-and-key</button>
        <button id="fitButton" type="button" aria-pressed="false">Induced fit</button>
      </div>
      <button id="playButton" class="play" type="button" aria-pressed="false">Play</button>
      <label class="scrubber" for="progressSlider">
        <span>Binding progress</span>
        <input id="progressSlider" type="range" min="0" max="100" value="0" step="1">
      </label>
      <div id="readout" class="readout" aria-live="polite">Approach</div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var state = {
        model: "lock",
        progress: 0,
        playing: false,
        lastTime: 0,
        rafId: 0
      };

      var els = {
        figure: document.getElementById("enzymeFigure"),
        lockButton: document.getElementById("lockButton"),
        fitButton: document.getElementById("fitButton"),
        playButton: document.getElementById("playButton"),
        slider: document.getElementById("progressSlider"),
        readout: document.getElementById("readout"),
        lockPair: document.getElementById("lockPair"),
        fitPair: document.getElementById("fitPair"),
        lockMovingLeft: document.getElementById("lockMovingLeft"),
        lockMovingRight: document.getElementById("lockMovingRight"),
        fitMovingLeft: document.getElementById("fitMovingLeft"),
        fitMovingRight: document.getElementById("fitMovingRight"),
        lockFinalComplex: document.getElementById("lockFinalComplex"),
        fitFinalComplex: document.getElementById("fitFinalComplex"),
        lockDockHighlight: document.getElementById("lockDockHighlight"),
        fitDockHighlight: document.getElementById("fitDockHighlight"),
        lockContact: document.getElementById("lockContact"),
        fitContact: document.getElementById("fitContact"),
        lockFinalContact: document.getElementById("lockFinalContact"),
        fitFinalContact: document.getElementById("fitFinalContact"),
        fitBody: document.getElementById("fitEnzymeBody"),
        fitPocketLine: document.getElementById("fitPocketLine"),
        fitGhostPocket: document.getElementById("fitGhostPocket"),
        fitFlexLines: document.getElementById("fitFlexLines")
      };

      var mobileQuery = window.matchMedia("(max-width: 720px)");
      var fitOpen = [-100, 0, -94, -34, -56, -52, -24, -44, -10, -40, -2, -29, 9, -32, 16, -34, 24, -43, 32, -38, 38, -35, 39, -31, 45, -34, 66, -46, 94, -35, 100, 0, 105, 35, 68, 52, 5, 52, -57, 52, -107, 34, -100, 0];
      var fitClosed = [-100, 0, -94, -34, -56, -52, -24, -44, -13, -41, -16, -6, -8, -1, -2, 3, 8, 2, 12, -3, 18, -12, 12, -40, 23, -44, 53, -52, 92, -35, 100, 0, 105, 35, 68, 52, 5, 52, -57, 52, -107, 34, -100, 0];
      var pocketOpen = [-24, -43, -9, -36, -2, -23, 9, -26, 18, -29, 25, -39, 33, -33, 39, -29, 41, -26, 47, -30];
      var pocketClosed = [-24, -42, -14, -36, -17, -5, -8, 1, -1, 8, 9, 6, 14, -2, 20, -13, 14, -37, 24, -43];

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function mix(a, b, t) {
        return a + (b - a) * t;
      }

      function interpolateArray(a, b, t) {
        var out = [];
        for (var i = 0; i < a.length; i += 1) {
          out.push(mix(a[i], b[i], t));
        }
        return out;
      }

      function bodyPath(values) {
        return [
          "M", values[0], values[1],
          "C", values[2], values[3], values[4], values[5], values[6], values[7],
          "C", values[8], values[9], values[10], values[11], values[12], values[13],
          "C", values[14], values[15], values[16], values[17], values[18], values[19],
          "C", values[20], values[21], values[22], values[23], values[24], values[25],
          "C", values[26], values[27], values[28], values[29], values[30], values[31],
          "C", values[32], values[33], values[34], values[35], values[36], values[37],
          "C", values[38], values[39], values[40], values[41], values[42], values[43],
          "Z"
        ].join(" ");
      }

      function pocketPath(values) {
        return [
          "M", values[0], values[1],
          "C", values[2], values[3], values[4], values[5], values[6], values[7],
          "C", values[8], values[9], values[10], values[11], values[12], values[13],
          "C", values[14], values[15], values[16], values[17], values[18], values[19]
        ].join(" ");
      }

      function setTransform(el, x, y) {
        el.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
      }

      function setOpacity(el, value) {
        el.style.opacity = String(clamp(value, 0, 1));
      }

      function updateMovingSubstrates(model, t) {
        var p = easeInOut(t);
        if (model === "lock") {
          setTransform(els.lockMovingLeft, mix(49, 106, p), mix(90, 171, p));
          setTransform(els.lockMovingRight, mix(176, 106, p), mix(90, 171, p));
          setTransform(els.fitMovingLeft, 568, 90);
          setTransform(els.fitMovingRight, 699, 90);
        } else {
          setTransform(els.fitMovingLeft, mix(568, 632, p), mix(90, 171, p));
          setTransform(els.fitMovingRight, mix(699, 632, p), mix(90, 171, p));
          setTransform(els.lockMovingLeft, 49, 90);
          setTransform(els.lockMovingRight, 176, 90);
        }
      }

      function updateFitMorph(t, active) {
        var p = active ? easeInOut(t) : 0;
        var bodyValues = interpolateArray(fitOpen, fitClosed, p);
        var pocketValues = interpolateArray(pocketOpen, pocketClosed, p);
        els.fitBody.setAttribute("d", bodyPath(bodyValues));
        els.fitPocketLine.setAttribute("d", pocketPath(pocketValues));
        setOpacity(els.fitGhostPocket, active ? 0.45 * p : 0);
        setOpacity(els.fitFlexLines, active ? Math.sin(p * Math.PI) * 0.95 : 0);
      }

      function updateHighlights(t) {
        var selectedLock = state.model === "lock";
        var dock = clamp((t - 0.62) / 0.38, 0, 1);
        var finalGlow = 0.28 + dock * 0.72;

        setOpacity(els.lockDockHighlight, selectedLock ? dock : 0);
        setOpacity(els.fitDockHighlight, selectedLock ? 0 : dock);
        setOpacity(els.lockContact, selectedLock ? dock : 0);
        setOpacity(els.fitContact, selectedLock ? 0 : dock);
        setOpacity(els.lockFinalContact, selectedLock ? dock : 0.2);
        setOpacity(els.fitFinalContact, selectedLock ? 0.2 : dock);
        setOpacity(els.lockFinalComplex, selectedLock ? finalGlow : 0.72);
        setOpacity(els.fitFinalComplex, selectedLock ? 0.72 : finalGlow);
      }

      function updateModelClasses() {
        var isLock = state.model === "lock";
        els.lockPair.classList.toggle("is-muted", !isLock);
        els.fitPair.classList.toggle("is-muted", isLock);
        els.lockButton.setAttribute("aria-pressed", String(isLock));
        els.fitButton.setAttribute("aria-pressed", String(!isLock));
      }

      function updateViewBox() {
        if (!mobileQuery.matches) {
          els.figure.setAttribute("viewBox", "0 0 1000 440");
          return;
        }
        els.figure.setAttribute("viewBox", state.model === "lock" ? "0 0 650 440" : "430 0 650 440");
      }

      function updateReadout() {
        var label;
        if (state.progress < 0.2) {
          label = "Approach";
        } else if (state.progress < 0.62) {
          label = state.model === "lock" ? "Rigid fit" : "Active site flexes";
        } else if (state.progress < 0.96) {
          label = "Docking";
        } else {
          label = "Complex formed";
        }
        els.readout.textContent = label;
      }

      function render() {
        updateViewBox();
        updateModelClasses();
        updateMovingSubstrates(state.model, state.progress);
        updateFitMorph(state.progress, state.model === "fit");
        updateHighlights(state.progress);
        els.slider.value = String(Math.round(state.progress * 100));
        updateReadout();
      }

      function setModel(model) {
        state.model = model;
        state.progress = 0;
        stopAnimation();
        render();
      }

      function stopAnimation() {
        state.playing = false;
        state.lastTime = 0;
        els.playButton.textContent = "Play";
        els.playButton.setAttribute("aria-pressed", "false");
        if (state.rafId) {
          window.cancelAnimationFrame(state.rafId);
          state.rafId = 0;
        }
      }

      function step(timestamp) {
        if (!state.playing) {
          return;
        }
        if (!state.lastTime) {
          state.lastTime = timestamp;
        }
        var delta = timestamp - state.lastTime;
        state.lastTime = timestamp;
        state.progress += delta / 2600;
        if (state.progress >= 1) {
          state.progress = 1;
          stopAnimation();
          render();
          return;
        }
        render();
        state.rafId = window.requestAnimationFrame(step);
      }

      function togglePlay() {
        if (state.playing) {
          stopAnimation();
          render();
          return;
        }
        if (state.progress >= 1) {
          state.progress = 0;
        }
        state.playing = true;
        state.lastTime = 0;
        els.playButton.textContent = "Pause";
        els.playButton.setAttribute("aria-pressed", "true");
        state.rafId = window.requestAnimationFrame(step);
      }

      els.lockButton.addEventListener("click", function () {
        setModel("lock");
      });

      els.fitButton.addEventListener("click", function () {
        setModel("fit");
      });

      els.playButton.addEventListener("click", togglePlay);

      els.slider.addEventListener("input", function () {
        stopAnimation();
        state.progress = Number(els.slider.value) / 100;
        render();
      });

      if (typeof mobileQuery.addEventListener === "function") {
        mobileQuery.addEventListener("change", render);
      } else if (typeof mobileQuery.addListener === "function") {
        mobileQuery.addListener(render);
      }

      render();
    }());
  </script>
</body>
</html>
