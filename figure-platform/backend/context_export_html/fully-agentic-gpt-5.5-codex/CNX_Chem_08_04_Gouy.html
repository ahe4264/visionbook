  <style>
    :root {
      color-scheme: light;
      --ink: #121417;
      --muted: #56616e;
      --panel: #f7f9fc;
      --edge: #d8e0ea;
      --gold: #d9bd19;
      --gold-light: #fbef73;
      --field: #9227e8;
      --field-soft: rgba(146, 39, 232, 0.14);
      --accent: #1667c9;
      --accent-dark: #0b4d98;
      --danger: #ac3051;
      --success: #176f55;
      --glass: rgba(180, 248, 255, 0.38);
      --shadow: 0 16px 38px rgba(21, 32, 48, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef3f7;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 20px);
    }

    main {
      width: min(1320px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage,
    .controls {
      background: #fff;
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      overflow-x: auto;
      padding: clamp(6px, 1.1vw, 12px);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 920px;
      height: auto;
      background: #fff;
      border-radius: 6px;
      user-select: none;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(270px, 0.92fr) minmax(320px, 1.1fr) minmax(300px, 0.95fr);
      gap: 14px;
      align-items: stretch;
      padding: 14px;
    }

    .control-block {
      min-width: 0;
      display: grid;
      gap: 9px;
      align-content: start;
    }

    .control-title {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
    }

    button {
      border: 1px solid transparent;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 750;
      min-height: 42px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent-dark);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(22, 103, 201, 0.25);
      outline-offset: 2px;
    }

    .animate {
      width: 100%;
      color: #fff;
      background: #293544;
      border-color: #1b2430;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .field-value {
      min-width: 5.4ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .readout {
      min-width: 0;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px 10px;
    }

    .readout span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    .readout strong {
      display: block;
      margin-top: 3px;
      overflow-wrap: anywhere;
      font-size: clamp(0.9rem, 1.5vw, 1.06rem);
      font-variant-numeric: tabular-nums;
    }

    .caption {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      padding-inline: 2px;
    }

    .svg-label {
      font-size: 28px;
      font-weight: 650;
      fill: #111;
    }

    .svg-small {
      font-size: 20px;
      font-weight: 750;
      fill: #1c2733;
    }

    .svg-tiny {
      font-size: 17px;
      font-weight: 700;
      fill: #293544;
    }

    .callout {
      stroke: #101010;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .field-line {
      fill: none;
      stroke: var(--field);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#purpleArrow);
      opacity: 0.88;
    }

    .field-gap-line {
      fill: none;
      stroke: var(--field);
      stroke-width: 3.2;
      stroke-linecap: round;
      marker-end: url(#purpleArrowSmall);
      opacity: 0.92;
    }

    .measurement-line {
      stroke: #2b3037;
      stroke-width: 2.3;
      stroke-dasharray: 7 7;
      fill: none;
    }

    .metal-outline {
      stroke: #0d0d0d;
      stroke-width: 3.5;
      stroke-linejoin: round;
    }

    .gold-outline {
      stroke: #b79c05;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .moving {
      transition: transform 120ms linear, opacity 120ms linear;
    }

    @media (max-width: 880px) {
      body {
        place-items: start center;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .readouts {
        grid-template-columns: 1fr;
      }

      .caption {
        font-size: 0.86rem;
      }
    }
  </style>
</head>

      const basePanAnchor = { x: 1060, y: 96 };

      const state = {
        kind: "paramagnetic",
        strength: Number(fieldSlider.value),
        progress: 1,
        animating: false,
        startTime: 0
      };

      function rotatePoint(point, degrees) {
        const radians = degrees * Math.PI / 180;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);
        const dx = point.x - pivot.x;
        const dy = point.y - pivot.y;
        return {
          x: pivot.x + dx * cos - dy * sin,
          y: pivot.y + dx * sin + dy * cos
        };
      }

      function formatSigned(value, digits, unit) {
        const sign = value > 0 ? "+" : value < 0 ? "-" : "";
        return sign + Math.abs(value).toFixed(digits) + unit;
      }

      function responseForState() {
        const isPara = state.kind === "paramagnetic";
        const field = state.strength / 100;
        const energized = field * state.progress;
        const susceptibility = (isPara ? 3.4 : -0.62) * energized;
        const apparentMass = (isPara ? 18.0 : -3.4) * energized;
        const maxAngle = isPara ? 5.4 : 3.2;
        const angle = (isPara ? -1 : 1) * maxAngle * energized;
        const tubeTug = (isPara ? 18 : -11) * energized;
        return { isPara, field, energized, susceptibility, apparentMass, angle, tubeTug };
      }

      function setButtonState() {
        const isPara = state.kind === "paramagnetic";
        paramagneticBtn.setAttribute("aria-pressed", String(isPara));
        diamagneticBtn.setAttribute("aria-pressed", String(!isPara));
      }

      function render() {
        const r = responseForState();
        const sampleAnchor = rotatePoint(leftAnchor, r.angle);
        const panAnchor = rotatePoint(rightAnchor, r.angle);
        const sampleDx = sampleAnchor.x - baseSampleTop.x;
        const sampleDy = sampleAnchor.y + 122 + r.tubeTug - baseSampleTop.y;
        const panDx = panAnchor.x - basePanAnchor.x;
        const panDy = panAnchor.y - basePanAnchor.y;
        const fieldOpacity = 0.18 + r.energized * 0.82;
        const strokeBoost = 0.72 + r.energized * 0.65;

        beam.setAttribute("transform", "rotate(" + r.angle.toFixed(3) + " " + pivot.x + " " + pivot.y + ")");
        sampleAssembly.setAttribute("transform", "translate(" + sampleDx.toFixed(2) + " " + sampleDy.toFixed(2) + ")");
        panAssembly.setAttribute("transform", "translate(" + panDx.toFixed(2) + " " + panDy.toFixed(2) + ")");

        sampleString.setAttribute("x1", sampleAnchor.x.toFixed(2));
        sampleString.setAttribute("y1", sampleAnchor.y.toFixed(2));
        sampleString.setAttribute("x2", sampleAnchor.x.toFixed(2));
        sampleString.setAttribute("y2", (baseSampleTop.y + sampleDy).toFixed(2));

        fieldGroup.style.opacity = fieldOpacity.toFixed(3);
        fieldLines.forEach(function (line, index) {
          const baseWidth = line.classList.contains("field-gap-line") ? 3.0 : 3.7;
          const flicker = state.animating ? Math.sin((state.startTime / 160) + index) * 0.14 : 0;
          line.style.strokeWidth = (baseWidth * strokeBoost + flicker).toFixed(2);
        });

        const forceOpacity = Math.min(1, Math.max(0.12, r.energized * 1.25));
        forceGlyph.style.opacity = forceOpacity.toFixed(2);
        forceGlyph.setAttribute("transform", "translate(0 " + (r.isPara ? 0 : -8).toFixed(1) + ")");
        forceArrow.setAttribute("d", r.isPara ? "M 430 314 L 430 380" : "M 430 385 L 430 323");
        forceArrow.setAttribute("stroke", r.isPara ? "#176f55" : "#ac3051");
        forceLabel.textContent = r.isPara ? "heavier" : "lighter";
        forceLabel.setAttribute("fill", r.isPara ? "#176f55" : "#ac3051");
        forceLabel.setAttribute("y", r.isPara ? "356" : "349");

        adjustWeight.style.opacity = Math.max(0.35, Math.min(1, 0.45 + Math.abs(r.apparentMass) / 18)).toFixed(2);
        adjustWeight.setAttribute("transform", "translate(1111 " + (232 - Math.abs(r.apparentMass) * 0.22).toFixed(2) + ")");
        sampleLiquid.style.opacity = r.isPara ? "0.84" : "0.62";

        const chiText = formatSigned(r.susceptibility, 2, " x 10^-6");
        const angleText = Math.abs(r.angle).toFixed(1) + " deg";
        const massText = formatSigned(r.apparentMass, 1, " mg");
        const weightText = r.apparentMass >= 0.05 ? "add to pan" : r.apparentMass <= -0.05 ? "remove from pan" : "balanced";

        fieldValue.textContent = Math.round(state.strength) + "%";
        chiReadout.textContent = chiText;
        deflectionReadout.textContent = angleText;
        massReadout.textContent = massText;
        svgResponse.textContent = r.isPara ? "attracted" : "repelled";
        svgResponse.setAttribute("fill", r.isPara ? "#176f55" : "#ac3051");
        svgMass.textContent = massText;
        svgWeights.textContent = weightText;
        svgUnpaired.textContent = r.isPara ? "Unpaired electrons: 2" : "Unpaired electrons: 0";
      }

      function animate(timestamp) {
        if (!state.animating) {
          return;
        }
        if (!state.startTime) {
          state.startTime = timestamp;
        }
        const elapsed = timestamp - state.startTime;
        const duration = 1800;
        const t = Math.min(1, elapsed / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        const settle = t > 0.72 ? Math.sin((t - 0.72) * Math.PI * 3) * (1 - t) * 0.08 : 0;
        state.progress = Math.max(0, Math.min(1, ease + settle));
        render();
        if (t < 1) {
          window.requestAnimationFrame(animate);
        } else {
          state.progress = 1;
          state.animating = false;
          state.startTime = 0;
          animateBtn.disabled = false;
          animateBtn.textContent = "Animate weighing";
          render();
        }
      }

      function startWeighingAnimation() {
        state.progress = 0;
        state.animating = true;
        state.startTime = 0;
        animateBtn.disabled = true;
        animateBtn.textContent = "Energizing magnets";
        render();
        window.requestAnimationFrame(animate);
      }

      paramagneticBtn.addEventListener("click", function () {
        state.kind = "paramagnetic";
        state.progress = 1;
        state.animating = false;
        animateBtn.disabled = false;
        animateBtn.textContent = "Animate weighing";
        setButtonState();
        render();
      });

      diamagneticBtn.addEventListener("click", function () {
        state.kind = "diamagnetic";
        state.progress = 1;
        state.animating = false;
        animateBtn.disabled = false;
        animateBtn.textContent = "Animate weighing";
        setButtonState();
        render();
      });

      fieldSlider.addEventListener("input", function (event) {
        state.strength = Number(event.target.value);
        if (!state.animating) {
          state.progress = 1;
        }
        render();
      });

      animateBtn.addEventListener("click", startWeighingAnimation);

      svg.addEventListener("pointerdown", function (event) {
        const target = event.target;
        if (target && target.closest && target.closest("#magnets, #sampleTube")) {
          startWeighingAnimation();
        }
      });

      setButtonState();
      render();
    }());
  </script>
</body>
</html>
