<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StyleGAN Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #121417;
      --muted: #5b6570;
      --panel: #ffffff;
      --paper: #fbfcfd;
      --edge: #d7dee6;
      --blue: #4a6879;
      --blue-light: #9bd5d0;
      --orange: #d7825d;
      --orange-dark: #8b452b;
      --gray: #c8d0d2;
      --gray-dark: #445054;
      --trace: #166ca8;
      --trace-hot: #f5a623;
      --noise: #70c9c1;
      --shadow: 0 16px 42px rgba(17, 28, 40, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #edf2f6;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .figure-shell {
      width: min(1360px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 12px;
      align-items: stretch;
    }

    .stage,
    .controls {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      min-width: 0;
      overflow: auto;
      padding: 10px;
    }

    svg {
      width: 100%;
      min-width: 920px;
      height: auto;
      display: block;
      background: var(--paper);
      border-radius: 6px;
    }

    .controls {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .controls h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .control-group {
      display: grid;
      gap: 8px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .readout {
      font-variant-numeric: tabular-nums;
      color: var(--trace);
      font-weight: 800;
    }

    button {
      appearance: none;
      border: 1px solid #b8c5d0;
      border-radius: 6px;
      background: #f8fafc;
      color: var(--ink);
      min-height: 38px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover {
      background: #eef6fb;
      border-color: #8fb4cb;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--trace);
    }

    .status {
      min-height: 80px;
      border: 1px solid #dbe4ec;
      background: #f7fafc;
      border-radius: 6px;
      padding: 10px;
      color: #34414d;
      font-size: 13px;
      line-height: 1.4;
    }

    .small-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .label {
      font-family: Georgia, "Times New Roman", serif;
      fill: #0f1114;
      font-size: 25px;
    }

    .sans {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      fill: #26313b;
    }

    .caption {
      font-size: 23px;
      font-family: Georgia, "Times New Roman", serif;
      fill: #101318;
    }

    .dim {
      font-size: 23px;
      font-family: Georgia, "Times New Roman", serif;
      fill: #111418;
    }

    .row-title {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 32px;
      fill: #080a0c;
      text-anchor: middle;
    }

    .brace {
      fill: none;
      stroke: #090a0b;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .underbrace {
      fill: none;
      stroke: #21262c;
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.7;
    }

    .edge-line {
      stroke: #0e1115;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .arrow {
      fill: none;
      stroke: #4b697b;
      stroke-width: 3;
      marker-end: url(#arrowHead);
    }

    .soft-arrow {
      fill: none;
      stroke: #9cb8c8;
      stroke-width: 3;
      marker-end: url(#softArrow);
    }

    .split-line {
      fill: none;
      stroke: #4b697b;
      stroke-width: 3;
    }

    .trace-line {
      fill: none;
      stroke: var(--trace);
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0;
      marker-end: url(#traceArrow);
    }

    .trace-line.active {
      opacity: 0.88;
      stroke-dasharray: 12 10;
      animation: dash 0.75s linear infinite;
    }

    .face-front,
    .face-top,
    .face-side,
    .norm,
    .noise-panel {
      vector-effect: non-scaling-stroke;
      transition: opacity 0.25s ease, stroke 0.25s ease, stroke-width 0.25s ease, filter 0.25s ease, transform 0.25s ease;
    }

    .face-front {
      stroke: #111418;
      stroke-width: 2;
    }

    .face-top,
    .face-side {
      stroke: #111418;
      stroke-width: 2;
    }

    .traceable.active .face-front,
    .traceable.active .norm,
    .traceable.active .noise-panel,
    .traceable.active .linear-front {
      stroke: var(--trace-hot);
      stroke-width: 4;
      filter: url(#glow);
    }

    .style-target.active .norm {
      stroke: var(--trace-hot);
      stroke-width: 4.5;
      filter: url(#glow);
    }

    .noise-overlay {
      fill: url(#noiseTexture);
      opacity: 0.27;
      transition: opacity 0.2s ease;
      mix-blend-mode: multiply;
    }

    .noise-channel {
      fill: #ffd166;
      opacity: 0.15;
      transition: opacity 0.2s ease;
    }

    .noise-arrow {
      fill: none;
      stroke: #99b5c6;
      stroke-width: 3;
      marker-end: url(#softArrow);
      transition: stroke-width 0.2s ease, opacity 0.2s ease, stroke 0.2s ease;
    }

    .noise-meter {
      fill: #64beb7;
      opacity: 0.75;
      transition: width 0.2s ease, opacity 0.2s ease;
    }

    .moving-dot {
      fill: #f5a623;
      stroke: #ffffff;
      stroke-width: 3;
      filter: url(#dotShadow);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .moving-dot.on {
      opacity: 1;
    }

    .output-pixel {
      stroke: none;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -22;
      }
    }

    @media (max-width: 960px) {
      body {
        padding: 8px;
      }

      .figure-shell {
        grid-template-columns: 1fr;
      }

      svg {
        min-width: 760px;
      }

      .controls {
        order: -1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.8fr);
        align-items: start;
      }

      .controls h1 {
        grid-column: 1 / -1;
      }

      .status {
        min-height: 66px;
      }
    }

    @media (max-width: 620px) {
      .controls {
        grid-template-columns: 1fr;
      }

      svg {
        min-width: 700px;
      }
    }
  </style>
</head>

          <path class="arrow" d="M690 754 V696"></path>
          <path class="arrow" d="M954 754 V696"></path>
          <path class="arrow" d="M1214 754 V696"></path>

          <g id="linear1" class="traceable">
            <rect class="linear-front" x="618" y="650" width="160" height="28" fill="#d7825d" stroke="#0e1115" stroke-width="2"></rect>
            <polygon points="618,650 626,644 786,644 778,650" fill="#dc8e6c" stroke="#0e1115" stroke-width="2"></polygon>
            <polygon points="778,650 786,644 786,672 778,678" fill="#8b452b" stroke="#0e1115" stroke-width="2"></polygon>
            <text class="caption" x="698" y="630" text-anchor="middle">Style, <tspan font-weight="700">y</tspan><tspan baseline-shift="sub" font-size="70%">1</tspan></text>
            <text class="caption" x="698" y="708" text-anchor="middle">Linear transform</text>
            <text class="caption" x="698" y="740" text-anchor="middle">2&#215;1&#215;512</text>
            <path class="arrow" d="M698 650 V506"></path>
          </g>

          <g id="linear2" class="traceable">
            <rect class="linear-front" x="882" y="650" width="160" height="28" fill="#d7825d" stroke="#0e1115" stroke-width="2"></rect>
            <polygon points="882,650 890,644 1050,644 1042,650" fill="#dc8e6c" stroke="#0e1115" stroke-width="2"></polygon>
            <polygon points="1042,650 1050,644 1050,672 1042,678" fill="#8b452b" stroke="#0e1115" stroke-width="2"></polygon>
            <text class="caption" x="962" y="630" text-anchor="middle">Style, <tspan font-weight="700">y</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan></text>
            <text class="caption" x="962" y="708" text-anchor="middle">Linear transform</text>
            <text class="caption" x="962" y="740" text-anchor="middle">2&#215;1&#215;512</text>
            <path class="arrow" d="M962 650 V506"></path>
          </g>

          <g id="linear3" class="traceable">
            <rect class="linear-front" x="1146" y="650" width="160" height="28" fill="#d7825d" stroke="#0e1115" stroke-width="2"></rect>
            <polygon points="1146,650 1154,644 1314,644 1306,650" fill="#dc8e6c" stroke="#0e1115" stroke-width="2"></polygon>
            <polygon points="1306,650 1314,644 1314,672 1306,678" fill="#8b452b" stroke="#0e1115" stroke-width="2"></polygon>
            <text class="caption" x="1226" y="630" text-anchor="middle">Style, <tspan font-weight="700">y</tspan><tspan baseline-shift="sub" font-size="70%">3</tspan></text>
            <text class="caption" x="1226" y="708" text-anchor="middle">Linear transform</text>
            <text class="caption" x="1226" y="740" text-anchor="middle">2&#215;1&#215;512</text>
            <path class="arrow" d="M1226 650 V506"></path>
          </g>
        </g>

        <g id="groupBraces" aria-hidden="true">
          <path class="underbrace" d="M304 594 C304 615 330 615 330 632 H530 C530 615 556 615 556 594"></path>
          <text class="sans" x="430" y="654" text-anchor="middle">Main generative pipeline</text>
          <path class="underbrace" d="M540 292 C540 313 570 313 570 330 H1264 C1264 313 1294 313 1294 292"></path>
          <text class="sans" x="918" y="356" text-anchor="middle">Noise</text>
          <path class="underbrace" d="M224 878 C224 899 252 899 252 910 H1326 C1326 899 1354 899 1354 878"></path>
          <text class="sans" x="790" y="905" text-anchor="middle">Style</text>
        </g>

        <g id="motionPaths">
          <path id="p-zw" class="trace-line" d="M390 744 C410 728 420 724 444 742"></path>
          <path id="p-w-y1" class="trace-line" d="M586 754 H690 V650"></path>
          <path id="p-w-y2" class="trace-line" d="M586 754 H954 V650"></path>
          <path id="p-w-y3" class="trace-line" d="M586 754 H1214 V650"></path>
          <path id="p-y1-block" class="trace-line" d="M698 650 V492"></path>
          <path id="p-y2-block" class="trace-line" d="M962 650 V492"></path>
          <path id="p-y3-block" class="trace-line" d="M1226 650 V492"></path>
          <path id="p-const-b1" class="trace-line" d="M508 446 H640"></path>
          <path id="p-b1-b2" class="trace-line" d="M828 446 H986"></path>
          <path id="p-b2-b3" class="trace-line" d="M1174 407 H1358"></path>
          <path id="p-b3-out" class="trace-line" d="M1482 424 H1492"></path>
        </g>

        <circle id="flowDot" class="moving-dot" cx="0" cy="0" r="9"></circle>
      </svg>
    </section>

    <aside class="controls" aria-label="Interactive controls">
      <h1>StyleGAN Architecture</h1>
      <div class="control-group">
        <button id="playTrace" type="button">Trace style flow</button>
        <button id="resetTrace" type="button">Reset trace</button>
      </div>
      <div class="control-group">
        <div class="control-label">
          <span>Noise scale &#968;</span>
          <span id="psiReadout" class="readout">1.00</span>
        </div>
        <input id="noiseScale" type="range" min="0" max="2" value="1" step="0.01" aria-label="Noise scale psi">
      </div>
      <div id="statusText" class="status" aria-live="polite">
        Ready. The mapping network turns latent z into w, while separate linear transforms produce y1, y2, and y3 for per-channel scale and offset.
      </div>
      <p class="small-note">Noise is local and spatial; style is global and channel-wise.</p>
    </aside>
  </main>

  <script>
    (() => {
      const svg = document.getElementById('diagram');
      const flowDot = document.getElementById('flowDot');
      const playButton = document.getElementById('playTrace');
      const resetButton = document.getElementById('resetTrace');
      const slider = document.getElementById('noiseScale');
      const psiReadout = document.getElementById('psiReadout');
      const statusText = document.getElementById('statusText');
      let runToken = 0;

      const byId = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      const traceGroups = [
        'latentZ', 'mappingNet', 'intermediateW', 'linear1', 'linear2', 'linear3',
        'styleTarget1', 'styleTarget2', 'styleTarget3', 'constantInput',
        'block4', 'block8a', 'block8b', 'imageOutput'
      ];

      function clearActive() {
        traceGroups.forEach((id) => byId(id)?.classList.remove('active'));
        document.querySelectorAll('.trace-line').forEach((path) => path.classList.remove('active'));
        flowDot.classList.remove('on');
      }

      function activate(ids) {
        traceGroups.forEach((id) => byId(id)?.classList.toggle('active', ids.includes(id)));
      }

      function setStatus(text) {
        statusText.textContent = text;
      }

      function animatePath(pathId, duration, token) {
        return new Promise((resolve) => {
          const path = byId(pathId);
          if (!path || token !== runToken) {
            resolve();
            return;
          }
          const length = path.getTotalLength();
          const start = performance.now();
          path.classList.add('active');
          flowDot.classList.add('on');

          function frame(now) {
            if (token !== runToken) {
              path.classList.remove('active');
              resolve();
              return;
            }
            const t = Math.min(1, (now - start) / duration);
            const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            const point = path.getPointAtLength(length * eased);
            flowDot.setAttribute('cx', point.x.toFixed(2));
            flowDot.setAttribute('cy', point.y.toFixed(2));
            if (t < 1) {
              requestAnimationFrame(frame);
            } else {
              path.classList.remove('active');
              resolve();
            }
          }
          requestAnimationFrame(frame);
        });
      }

      async function step(pathId, activeIds, text, duration, token) {
        if (token !== runToken) return;
        activate(activeIds);
        setStatus(text);
        await animatePath(pathId, duration, token);
        await sleep(180);
      }

      async function runTrace() {
        runToken += 1;
        const token = runToken;
        clearActive();
        playButton.disabled = true;
        playButton.textContent = 'Tracing...';

        await step('p-zw', ['latentZ', 'mappingNet', 'intermediateW'], 'z is mapped by the fully connected network into the intermediate latent w.', 950, token);
        await step('p-w-y1', ['intermediateW', 'linear1'], 'w feeds the first linear transform, producing y1 for the first 4x4 synthesis operation.', 900, token);
        await step('p-y1-block', ['linear1', 'styleTarget1'], 'y1 supplies a per-channel scale and offset at the 4x4 feature map.', 760, token);
        await step('p-const-b1', ['constantInput', 'styleTarget1', 'block4'], 'The learned 4x4x512 constant is styled and convolved into the first learned feature volume.', 900, token);
        await step('p-w-y2', ['intermediateW', 'linear2'], 'The same w branches to y2, keeping global style consistent across the next block.', 900, token);
        await step('p-y2-block', ['linear2', 'styleTarget2'], 'y2 applies another channel-wise scale and offset before the second 4x4 convolution.', 760, token);
        await step('p-b1-b2', ['block4', 'styleTarget2', 'block8a'], 'The synthesis pipeline upsamples from 4x4 to 8x8 while preserving the styled channel structure.', 940, token);
        await step('p-w-y3', ['intermediateW', 'linear3'], 'w also produces y3, the style vector used at the 8x8 resolution level.', 900, token);
        await step('p-y3-block', ['linear3', 'styleTarget3'], 'y3 modulates the 8x8 channels, separating global style from stochastic noise.', 760, token);
        await step('p-b2-b3', ['block8a', 'styleTarget3', 'block8b'], 'The final 8x8 block receives the style-adjusted channels and continues synthesis.', 900, token);
        await step('p-b3-out', ['block8b', 'imageOutput'], 'The styled feature map is converted into the image-like output at the right edge.', 700, token);

        if (token === runToken) {
          activate(['intermediateW', 'linear1', 'linear2', 'linear3', 'styleTarget1', 'styleTarget2', 'styleTarget3']);
          flowDot.classList.remove('on');
          setStatus('Trace complete. Style y1, y2, and y3 come from the shared w, while noise enters separately at each resolution.');
          playButton.disabled = false;
          playButton.textContent = 'Trace style flow';
        }
      }

      function updateNoise() {
        const value = Number(slider.value);
        const label = value.toFixed(2);
        psiReadout.textContent = label;
        for (let i = 1; i <= 3; i += 1) {
          byId(`psiLabel${i}`).textContent = label;
          const meter = byId(`noiseMeter${i}`);
          const arrow = byId(`noiseArrow${i}`);
          const baseWidth = i === 3 ? 92 : 78;
          const width = Math.max(4, baseWidth * (0.12 + 0.44 * value));
          meter.setAttribute('width', width.toFixed(1));
          meter.style.opacity = String(0.25 + Math.min(value, 2) * 0.35);
          arrow.style.strokeWidth = String(1.4 + value * 3.2);
          arrow.style.opacity = String(0.28 + value * 0.34);
          arrow.style.stroke = value > 1.15 ? '#f5a623' : '#99b5c6';
          const node = byId(`noise${i}`);
          const scale = 0.86 + value * 0.11;
          node.querySelector('.noise-panel').style.transformBox = 'fill-box';
          node.querySelector('.noise-panel').style.transformOrigin = 'center bottom';
          node.querySelector('.noise-panel').style.transform = `scale(${scale.toFixed(3)})`;
        }

        const overlays = document.querySelectorAll('.noise-overlay');
        const channels = document.querySelectorAll('.noise-channel');
        overlays.forEach((overlay, index) => {
          const multiplier = index === 2 ? 1.12 : 1;
          overlay.style.opacity = String(Math.min(0.62, 0.05 + value * 0.22 * multiplier));
        });
        channels.forEach((channel) => {
          channel.style.opacity = String(Math.min(0.7, 0.08 + value * 0.26));
        });

        if (value < 0.08) {
          setStatus('Noise scale is near zero: the synthesis blocks keep their global style, but stochastic spatial detail is suppressed.');
        } else if (value > 1.35) {
          setStatus('Larger psi makes z1 x psi1, z2 x psi2, and z3 x psi3 visibly stronger, highlighting affected channels at every resolution.');
        } else {
          setStatus('Noise terms are scaled and broadcast into the feature maps, while y1, y2, and y3 still control per-channel style.');
        }
      }

      playButton.addEventListener('click', runTrace);
      resetButton.addEventListener('click', () => {
        runToken += 1;
        clearActive();
        playButton.disabled = false;
        playButton.textContent = 'Trace style flow';
        setStatus('Reset. The diagram is ready to trace z to w, then y1, y2, and y3 into the synthesis blocks.');
      });
      slider.addEventListener('input', updateNoise);

      updateNoise();
    })();
  </script>
</body>
</html>
