<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heterogeneous and Homogeneous Coordinates</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111318;
      --muted: #59616d;
      --paper: #ffffff;
      --surface: #f3f6f8;
      --edge: #d7dee6;
      --plane: rgba(137, 165, 166, 0.22);
      --plane-edge: rgba(83, 111, 112, 0.78);
      --axis: #111318;
      --red: #f3151d;
      --red-dark: #7a080d;
      --accent: #14748a;
      --gold: #e3a619;
      --gold-soft: rgba(227, 166, 25, 0.22);
      --blue-soft: rgba(20, 116, 138, 0.16);
      --shadow: 0 18px 48px rgba(21, 31, 42, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #edf1f4;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 28px);
    }

    main {
      width: min(1180px, 100%);
      background: var(--paper);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--edge);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafb 100%);
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.5vw, 28px);
      line-height: 1.08;
      font-weight: 760;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status span {
      border: 1px solid var(--edge);
      background: #ffffff;
      border-radius: 999px;
      padding: 6px 9px;
    }

    .figure-area {
      position: relative;
      background: #ffffff;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      user-select: none;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 4.4;
      stroke-linecap: round;
      fill: none;
    }

    .axis.thin {
      stroke-width: 3.4;
    }

    .plane {
      fill: var(--plane);
      stroke: var(--plane-edge);
      stroke-width: 2.8;
    }

    .plane.left {
      stroke: rgba(116, 141, 142, 0.38);
    }

    .plane-grid {
      stroke: rgba(83, 111, 112, 0.36);
      stroke-width: 1.5;
      fill: none;
    }

    .ray {
      stroke: #15181d;
      stroke-width: 3.2;
      stroke-dasharray: 10 9;
      stroke-linecap: round;
      fill: none;
    }

    .bridge {
      stroke: rgba(17, 19, 24, 0.5);
      stroke-width: 2.4;
      fill: none;
    }

    .bridge.linked {
      stroke: var(--gold);
      stroke-width: 3.2;
    }

    .point {
      fill: var(--red);
      stroke: #121212;
      stroke-width: 3.5;
      cursor: grab;
    }

    .point:active {
      cursor: grabbing;
    }

    .selected {
      fill: #ff2c33;
    }

    .equiv {
      fill: #ffd25a;
      stroke: #7d5900;
      stroke-width: 2.6;
    }

    .equiv-group {
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .equiv-group.on {
      opacity: 1;
    }

    .halo {
      fill: var(--gold-soft);
      stroke: var(--gold);
      stroke-width: 2.2;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .halo.on {
      opacity: 1;
    }

    .math {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      fill: #0f1115;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .label {
      font-size: 25px;
    }

    .small-label {
      font-size: 17px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-style: normal;
      fill: var(--muted);
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .space-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      fill: #111111;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .drag-zone {
      fill: transparent;
      cursor: crosshair;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 14px 18px;
      align-items: center;
      padding: 14px 18px 16px;
      border-top: 1px solid var(--edge);
      background: var(--surface);
    }

    .slider-row {
      display: grid;
      grid-template-columns: auto minmax(150px, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    label {
      font-size: 14px;
      font-weight: 690;
      color: #252a31;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    output {
      min-width: 3.4em;
      text-align: right;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-weight: 760;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 690;
      color: #252a31;
      white-space: nowrap;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
    }

    .readout {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .readout div {
      min-width: 0;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #ffffff;
      padding: 8px 10px;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .readout strong {
      display: block;
      color: #222831;
      font-size: 12px;
      margin-bottom: 2px;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .topbar,
      .controls {
        padding-left: 12px;
        padding-right: 12px;
      }

      .topbar,
      .controls {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: block;
      }

      .status {
        justify-content: flex-start;
        margin-top: 10px;
        white-space: normal;
      }

      .controls {
        display: grid;
      }

      .space-title {
        font-size: 38px;
      }

      .label {
        font-size: 36px;
      }

      .small-label {
        font-size: 24px;
      }

      .slider-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      output {
        text-align: left;
      }

      .toggle {
        justify-content: flex-start;
      }

      .readout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <h1>Heterogeneous and Homogeneous Coordinates</h1>
      <div class="status" aria-live="polite">
        <span id="xyStatus">(x, y) = (0.72, 0.62)</span>
        <span id="lambdaStatus">&lambda; = 1.60</span>
      </div>
    </header>

    <section class="figure-area" aria-label="Interactive relationship between a 2D point and its homogeneous coordinate ray">
      <svg id="scene" viewBox="0 0 1100 660" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Homogeneous coordinate equivalence class</title>
        <desc id="svgDesc">A draggable two-dimensional point maps to the canonical homogeneous point on the w equals one plane, and scaled representatives lie on the same ray through the origin.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 1 1 L 11 6 L 1 11 z" fill="#111318"></path>
          </marker>
          <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1d2630" flood-opacity="0.18"></feDropShadow>
          </filter>
        </defs>

        <text class="space-title" x="28" y="176">Heterogeneous</text>
        <text class="space-title" x="850" y="176">Homogeneous</text>

        <polygon id="leftPlane" class="plane left"></polygon>
        <rect id="leftDragZone" class="drag-zone" x="80" y="235" width="320" height="280" rx="4"></rect>

        <g id="leftAxes">
          <line id="leftXAxis" class="axis" marker-end="url(#arrow)"></line>
          <line id="leftYAxis" class="axis" marker-end="url(#arrow)"></line>
          <text id="leftXLabel" class="math label">x</text>
          <text id="leftYLabel" class="math label">y</text>
        </g>

        <polygon id="homogeneousPlane" class="plane"></polygon>
        <line id="planeGridX" class="plane-grid"></line>
        <line id="planeGridY" class="plane-grid"></line>

        <g id="rightAxes">
          <line id="rightXAxis" class="axis thin" marker-end="url(#arrow)"></line>
          <line id="rightYAxis" class="axis thin" marker-end="url(#arrow)"></line>
          <line id="rightWAxis" class="axis thin" marker-end="url(#arrow)"></line>
          <line id="wTick" class="axis thin"></line>
          <text id="rightXLabel" class="math label">x</text>
          <text id="rightYLabel" class="math label">y</text>
          <text id="rightWLabel" class="math label">w</text>
          <text id="wOneLabel" class="math label">1</text>
          <text id="planeLabel" class="small-label">w = 1 plane</text>
        </g>

        <line id="rayLine" class="ray"></line>
        <line id="bridgeLine" class="bridge"></line>

        <g id="equivGroup" class="equiv-group"></g>

        <circle id="leftHalo" class="halo" r="22"></circle>
        <circle id="canonicalHalo" class="halo" r="22"></circle>
        <circle id="selectedHalo" class="halo" r="22"></circle>

        <circle id="leftPoint" class="point" r="11" filter="url(#softShadow)" tabindex="0"></circle>
        <circle id="canonicalPoint" class="point" r="12" filter="url(#softShadow)"></circle>
        <circle id="selectedPoint" class="point selected" r="12" filter="url(#softShadow)"></circle>

        <text id="leftPointLabel" class="math label"></text>
        <text id="canonicalLabel" class="math label">(x,y,1)</text>
        <text id="selectedLabel" class="math label">(&lambda;x,&lambda;y,&lambda;)</text>
        <text id="originLabel" class="small-label">origin</text>
      </svg>
    </section>

    <section class="controls" aria-label="Homogeneous coordinate controls">
      <div class="slider-row">
        <label for="wSlider">Selected homogeneous w</label>
        <input id="wSlider" type="range" min="0.25" max="2" value="1.6" step="0.01">
        <output id="wOutput" for="wSlider">1.60</output>
      </div>
      <label class="toggle" for="linkedToggle">
        <input id="linkedToggle" type="checkbox" checked>
        Linked equivalence class
      </label>
      <div class="readout" aria-live="polite">
        <div><strong>Canonical embedding</strong><span id="canonicalReadout">(x, y, 1) = (0.72, 0.62, 1)</span></div>
        <div><strong>Selected representative</strong><span id="representativeReadout">(&lambda;x, &lambda;y, &lambda;) = (1.15, 0.99, 1.60)</span></div>
        <div><strong>Recovered heterogeneous point</strong><span id="recoverReadout">(X/W, Y/W) = (0.72, 0.62)</span></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("scene");
      const state = {
        x: 0.72,
        y: 0.62,
        lambda: 1.6,
        linked: true,
        dragging: false
      };

      const left = {
        origin: { x: 230, y: 420 },
        scale: 115,
        xMin: -1.1,
        xMax: 1.1,
        yMin: -0.7,
        yMax: 1.25
      };

      const right = {
        origin: { x: 585, y: 410 },
        bx: { x: 70, y: -62 },
        by: { x: 0, y: -82 },
        bw: { x: 135, y: 0 },
        xMin: -1.15,
        xMax: 1.15,
        yMin: -0.75,
        yMax: 1.32
      };

      const ids = [
        "leftPlane", "leftXAxis", "leftYAxis", "leftXLabel", "leftYLabel",
        "homogeneousPlane", "planeGridX", "planeGridY", "rightXAxis",
        "rightYAxis", "rightWAxis", "rightXLabel", "rightYLabel",
        "rightWLabel", "wTick", "wOneLabel", "planeLabel", "rayLine",
        "bridgeLine", "leftPoint", "canonicalPoint", "selectedPoint",
        "leftPointLabel", "canonicalLabel", "selectedLabel", "leftHalo",
        "canonicalHalo", "selectedHalo", "originLabel"
      ];
      const el = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));

      const wSlider = document.getElementById("wSlider");
      const linkedToggle = document.getElementById("linkedToggle");
      const wOutput = document.getElementById("wOutput");
      const xyStatus = document.getElementById("xyStatus");
      const lambdaStatus = document.getElementById("lambdaStatus");
      const canonicalReadout = document.getElementById("canonicalReadout");
      const representativeReadout = document.getElementById("representativeReadout");
      const recoverReadout = document.getElementById("recoverReadout");
      const equivGroup = document.getElementById("equivGroup");

      function fmt(value) {
        return Number(value).toFixed(2);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function pointString(point) {
        return `${point.x},${point.y}`;
      }

      function setLine(node, a, b) {
        node.setAttribute("x1", a.x);
        node.setAttribute("y1", a.y);
        node.setAttribute("x2", b.x);
        node.setAttribute("y2", b.y);
      }

      function setCircle(node, p) {
        node.setAttribute("cx", p.x);
        node.setAttribute("cy", p.y);
      }

      function setText(node, p, dx, dy) {
        node.setAttribute("x", p.x + (dx || 0));
        node.setAttribute("y", p.y + (dy || 0));
      }

      function leftProject(x, y) {
        return {
          x: left.origin.x + x * left.scale,
          y: left.origin.y - y * left.scale
        };
      }

      function leftInvert(screenPoint) {
        return {
          x: clamp((screenPoint.x - left.origin.x) / left.scale, left.xMin, left.xMax),
          y: clamp((left.origin.y - screenPoint.y) / left.scale, left.yMin, left.yMax)
        };
      }

      function project3(x, y, w) {
        return {
          x: right.origin.x + x * right.bx.x + y * right.by.x + w * right.bw.x,
          y: right.origin.y + x * right.bx.y + y * right.by.y + w * right.bw.y
        };
      }

      function svgPointFromEvent(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function updateStaticGeometry() {
        const leftCorners = [
          leftProject(left.xMin, left.yMin),
          leftProject(left.xMax, left.yMin),
          leftProject(left.xMax, left.yMax),
          leftProject(left.xMin, left.yMax)
        ];
        el.leftPlane.setAttribute("points", leftCorners.map(pointString).join(" "));
        setLine(el.leftXAxis, leftProject(left.xMin - 0.08, 0), leftProject(left.xMax + 0.18, 0));
        setLine(el.leftYAxis, leftProject(0, left.yMin - 0.08), leftProject(0, left.yMax + 0.18));
        setText(el.leftXLabel, leftProject(left.xMax + 0.15, 0), 8, -10);
        setText(el.leftYLabel, leftProject(0, left.yMax + 0.16), 12, -10);

        const planeCorners = [
          project3(right.xMin, right.yMin, 1),
          project3(right.xMax, right.yMin, 1),
          project3(right.xMax, right.yMax, 1),
          project3(right.xMin, right.yMax, 1)
        ];
        el.homogeneousPlane.setAttribute("points", planeCorners.map(pointString).join(" "));
        setLine(el.planeGridX, project3(right.xMin, 0, 1), project3(right.xMax, 0, 1));
        setLine(el.planeGridY, project3(0, right.yMin, 1), project3(0, right.yMax, 1));

        setLine(el.rightXAxis, project3(-1.15, 0, 0), project3(1.28, 0, 0));
        setLine(el.rightYAxis, project3(0, -0.65, 0), project3(0, 1.45, 0));
        setLine(el.rightWAxis, project3(-0.04, 0, -0.18), project3(0, 0, 2.35));
        setLine(el.wTick, { x: project3(0, 0, 1).x, y: project3(0, 0, 1).y - 14 }, { x: project3(0, 0, 1).x, y: project3(0, 0, 1).y + 14 });
        setText(el.rightXLabel, project3(1.28, 0, 0), 9, -8);
        setText(el.rightYLabel, project3(0, 1.45, 0), 8, -8);
        setText(el.rightWLabel, project3(0, 0, 2.35), 2, 48);
        setText(el.wOneLabel, project3(0, 0, 1), -9, 55);
        setText(el.planeLabel, project3(-1.12, 1.31, 1), -2, 4);
        setText(el.originLabel, right.origin, -44, 24);
      }

      function updateEquivalencePoints() {
        const scales = [0.5, 1.25, 2.0];
        equivGroup.innerHTML = "";
        scales.forEach((scale, index) => {
          if (Math.abs(scale - 1) < 0.001) {
            return;
          }
          const p = project3(scale * state.x, scale * state.y, scale);
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("class", "equiv");
          circle.setAttribute("r", index === 2 ? "9" : "8");
          circle.setAttribute("cx", p.x);
          circle.setAttribute("cy", p.y);
          equivGroup.appendChild(circle);

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("class", "small-label");
          text.textContent = scale === 2 ? "(2x,2y,2)" : `(${fmt(scale)}x,${fmt(scale)}y,${fmt(scale)})`;
          const labelOffsets = {
            "0.5": { x: 12, y: 30 },
            "1.25": { x: -112, y: -16 },
            "2": { x: 12, y: -13 }
          };
          const offset = labelOffsets[String(scale)];
          text.setAttribute("x", p.x + offset.x);
          text.setAttribute("y", p.y + offset.y);
          equivGroup.appendChild(text);
        });
      }

      function render() {
        const lambda = state.lambda;
        const leftPoint = leftProject(state.x, state.y);
        const canonical = project3(state.x, state.y, 1);
        const selected = project3(lambda * state.x, lambda * state.y, lambda);
        const rayEnd = project3(2.08 * state.x, 2.08 * state.y, 2.08);

        setLine(el.rayLine, right.origin, rayEnd);
        setLine(el.bridgeLine, leftPoint, canonical);
        el.bridgeLine.classList.toggle("linked", state.linked);

        setCircle(el.leftPoint, leftPoint);
        setCircle(el.canonicalPoint, canonical);
        setCircle(el.selectedPoint, selected);
        setCircle(el.leftHalo, leftPoint);
        setCircle(el.canonicalHalo, canonical);
        setCircle(el.selectedHalo, selected);
        [el.leftHalo, el.canonicalHalo, el.selectedHalo].forEach((node) => node.classList.toggle("on", state.linked));

        setText(el.leftPointLabel, leftPoint, -22, -24);
        el.leftPointLabel.textContent = `(${fmt(state.x)}, ${fmt(state.y)})`;
        setText(el.canonicalLabel, canonical, -28, 54);
        setText(el.selectedLabel, selected, -92, -28);

        updateEquivalencePoints();
        equivGroup.classList.toggle("on", state.linked);

        wOutput.textContent = fmt(lambda);
        xyStatus.textContent = `(x, y) = (${fmt(state.x)}, ${fmt(state.y)})`;
        lambdaStatus.textContent = `\u03bb = ${fmt(lambda)}`;
        canonicalReadout.textContent = `(x, y, 1) = (${fmt(state.x)}, ${fmt(state.y)}, 1)`;
        representativeReadout.textContent = `(\u03bbx, \u03bby, \u03bb) = (${fmt(lambda * state.x)}, ${fmt(lambda * state.y)}, ${fmt(lambda)})`;
        recoverReadout.textContent = `(X/W, Y/W) = (${fmt((lambda * state.x) / lambda)}, ${fmt((lambda * state.y) / lambda)})`;
      }

      function movePointFromEvent(event) {
        const p = leftInvert(svgPointFromEvent(event));
        state.x = p.x;
        state.y = p.y;
        render();
      }

      function beginDrag(event) {
        state.dragging = true;
        svg.setPointerCapture(event.pointerId);
        movePointFromEvent(event);
      }

      svg.addEventListener("pointermove", (event) => {
        if (state.dragging) {
          movePointFromEvent(event);
        }
      });

      svg.addEventListener("pointerup", (event) => {
        state.dragging = false;
        if (svg.hasPointerCapture(event.pointerId)) {
          svg.releasePointerCapture(event.pointerId);
        }
      });

      svg.addEventListener("pointercancel", () => {
        state.dragging = false;
      });

      document.getElementById("leftDragZone").addEventListener("pointerdown", beginDrag);
      el.leftPoint.addEventListener("pointerdown", beginDrag);

      el.leftPoint.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 0.1 : 0.03;
        if (event.key === "ArrowLeft") state.x = clamp(state.x - step, left.xMin, left.xMax);
        if (event.key === "ArrowRight") state.x = clamp(state.x + step, left.xMin, left.xMax);
        if (event.key === "ArrowDown") state.y = clamp(state.y - step, left.yMin, left.yMax);
        if (event.key === "ArrowUp") state.y = clamp(state.y + step, left.yMin, left.yMax);
        if (event.key.startsWith("Arrow")) {
          event.preventDefault();
          render();
        }
      });

      wSlider.addEventListener("input", () => {
        state.lambda = Number(wSlider.value);
        render();
      });

      linkedToggle.addEventListener("change", () => {
        state.linked = linkedToggle.checked;
        render();
      });

      updateStaticGeometry();
      render();
    })();
  </script>
</body>
</html>
