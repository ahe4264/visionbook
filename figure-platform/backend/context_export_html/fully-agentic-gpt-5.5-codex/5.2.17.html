<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure 5.2.17 - Washer Method</title>
  <style>
    :root {
      --ink: #202329;
      --muted: #59616d;
      --line: #cfd6dd;
      --blue: #239bd5;
      --blue-soft: #cfeaf5;
      --red: #e45555;
      --panel: #ffffff;
      --wash: #b7bbc0;
      --shadow: 0 16px 34px rgba(25, 34, 45, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, #f6f8fb 0%, #eef3f7 100%);
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    .figure-shell {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 18px 0 24px;
    }

    .control-bar {
      display: grid;
      grid-template-columns: minmax(160px, 0.8fr) minmax(160px, 0.8fr) minmax(260px, 1.35fr) minmax(250px, 1.25fr);
      gap: 12px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .control-unit,
    .metric-box {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 18px rgba(28, 39, 54, 0.08);
    }

    .control-unit {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
    }

    .control-unit label,
    .slider-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .equation-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 1.02rem;
      font-family: Cambria, Georgia, serif;
      font-style: italic;
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      border: 1px solid #bfc8d2;
      border-radius: 6px;
      padding: 8px 9px;
      color: var(--ink);
      background: #fff;
      font: 600 1rem "Segoe UI", Arial, sans-serif;
    }

    input[type="text"]:focus,
    input[type="range"]:focus-visible {
      outline: 3px solid rgba(35, 155, 213, 0.22);
      border-color: var(--blue);
    }

    input.invalid {
      border-color: #c43b42;
      background: #fff5f5;
    }

    .slider-unit {
      padding: 10px 12px 8px;
    }

    .slider-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .metric-box {
      display: grid;
      gap: 2px;
      padding: 9px 12px;
      align-content: center;
      font-variant-numeric: tabular-nums;
    }

    .metric-line {
      white-space: nowrap;
      color: var(--ink);
      font-size: 0.91rem;
    }

    .metric-line strong {
      font-weight: 800;
    }

    .metric-line.subtle {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .views {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
      gap: 14px;
    }

    .view-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .view-title {
      display: flex;
      align-items: center;
      min-height: 39px;
      padding: 9px 13px;
      border-bottom: 1px solid #e3e8ee;
      color: #2d3540;
      font-weight: 800;
      font-size: 0.94rem;
    }

    .stage {
      width: 100%;
      aspect-ratio: 640 / 430;
      display: block;
      background: #fff;
    }

    svg.stage text {
      user-select: none;
    }

    .axis {
      stroke: #23262b;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .axis-red {
      stroke: var(--red);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .curve {
      fill: none;
      stroke: var(--blue);
      stroke-width: 4;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .region {
      fill: rgba(157, 212, 232, 0.62);
      stroke: none;
    }

    .boundary {
      fill: none;
      stroke: #2b2f35;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      stroke: #2b2f35;
      stroke-width: 1.6;
      vector-effect: non-scaling-stroke;
    }

    .math-label {
      fill: #191b20;
      font-family: Cambria, Georgia, serif;
      font-size: 24px;
      font-style: italic;
    }

    .small-label {
      fill: #252931;
      font-family: Cambria, Georgia, serif;
      font-size: 20px;
      font-style: italic;
    }

    .plain-label {
      fill: #2c323a;
      font: 700 13px "Segoe UI", Arial, sans-serif;
    }

    .washer-fill {
      fill: rgba(176, 180, 185, 0.64);
      stroke: rgba(126, 132, 139, 0.88);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .washer-hole {
      fill: rgba(255, 255, 255, 0.95);
      stroke: rgba(136, 142, 150, 0.92);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .slice-line {
      stroke: #87909b;
      stroke-width: 2;
      stroke-dasharray: 6 5;
      vector-effect: non-scaling-stroke;
    }

    .formula-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: baseline;
      margin-top: 12px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 22px rgba(28, 39, 54, 0.08);
      color: #27303a;
      font-size: 0.95rem;
    }

    .formula-strip .math {
      font-family: Cambria, Georgia, serif;
      font-size: 1.08rem;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .figure-shell {
        width: min(720px, calc(100vw - 18px));
        padding-top: 10px;
      }

      .control-bar {
        grid-template-columns: 1fr 1fr;
      }

      .views {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .control-bar {
        grid-template-columns: 1fr;
      }

      .metric-line {
        white-space: normal;
      }

      .view-title {
        min-height: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive washer method figure">
    <section class="control-bar" aria-label="Controls">
      <div class="control-unit">
        <label for="functionInput">Generating curve</label>
        <div class="equation-row">
          <span>f(x) =</span>
          <input id="functionInput" type="text" value="x^2" autocomplete="off" spellcheck="false" aria-label="Function f of x">
        </div>
      </div>

      <div class="control-unit">
        <label for="axisInput">Axis of rotation</label>
        <div class="equation-row">
          <span>y =</span>
          <input id="axisInput" type="text" value="-1" autocomplete="off" spellcheck="false" aria-label="Axis of rotation y equals c">
        </div>
      </div>

      <div class="control-unit slider-unit">
        <div class="slider-top">
          <span class="slider-label">Washer position</span>
          <span class="slider-value" id="xReadout">x = 1.00</span>
        </div>
        <input id="xSlider" type="range" min="0" max="2" step="0.01" value="1" aria-label="Washer position x">
      </div>

      <div class="metric-box" aria-live="polite">
        <div class="metric-line"><strong id="radiusReadout">R = 2.000, r = 1.000</strong></div>
        <div class="metric-line" id="areaReadout">A = 3.000*pi = 9.425</div>
        <div class="metric-line subtle" id="volumeReadout">V = 11.733*pi = 36.861</div>
      </div>
    </section>

    <section class="views">
      <article class="view-panel">
        <div class="view-title">Region, axis, and moving washer</div>
        <svg id="planeSvg" class="stage" viewBox="0 0 640 430" role="img" aria-label="Two dimensional region and washer cross-section"></svg>
      </article>

      <article class="view-panel">
        <div class="view-title">Solid of revolution</div>
        <canvas id="solidCanvas" class="stage" width="640" height="430" role="img" aria-label="Three dimensional washer solid"></canvas>
      </article>
    </section>

    <div class="formula-strip" aria-live="polite">
      <span class="math">R(x) = f(x) - c</span>
      <span class="math">r = 0 - c</span>
      <span class="math">A(x) = &pi;(R(x)<sup>2</sup> - r<sup>2</sup>)</span>
      <span id="defaultNote">For f(x)=x<sup>2</sup> and c=-1: V = 176&pi;/15.</span>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const svg = document.getElementById("planeSvg");
      const canvas = document.getElementById("solidCanvas");
      const functionInput = document.getElementById("functionInput");
      const axisInput = document.getElementById("axisInput");
      const xSlider = document.getElementById("xSlider");
      const xReadout = document.getElementById("xReadout");
      const radiusReadout = document.getElementById("radiusReadout");
      const areaReadout = document.getElementById("areaReadout");
      const volumeReadout = document.getElementById("volumeReadout");

      const SVG_NS = "http://www.w3.org/2000/svg";
      const W = 640;
      const H = 430;
      const PI_SYMBOL = "\u03c0";
      const MAX_ABS_Y = 1e4;
      let activeFunction = compileExpression("x^2");
      let activeAxis = compileExpression("-1");
      let activeC = -1;

      function normalizeExpression(source) {
        return String(source || "")
          .trim()
          .replace(/^\s*y\s*=\s*/i, "")
          .replace(/\u2212/g, "-")
          .replace(/\u03c0/gi, "pi")
          .replace(/\^/g, "**");
      }

      function compileExpression(source) {
        const raw = normalizeExpression(source);
        if (!raw) {
          throw new Error("Empty expression");
        }
        const rewritten = raw
          .replace(/\b(sin|cos|tan|sqrt|abs|exp|log|pow|min|max)\b/gi, "Math.$1")
          .replace(/\bpi\b/gi, "Math.PI")
          .replace(/\be\b/g, "Math.E");
        if (!/^[0-9xX+\-*/().,\sA-Za-z_]+$/.test(rewritten)) {
          throw new Error("Unsupported character");
        }
        const names = rewritten.match(/[A-Za-z_][A-Za-z0-9_]*/g) || [];
        const allowed = new Set(["x", "X", "Math", "PI", "E", "sin", "cos", "tan", "sqrt", "abs", "exp", "log", "pow", "min", "max"]);
        for (const name of names) {
          if (!allowed.has(name)) {
            throw new Error("Unsupported token");
          }
        }
        const fn = new Function("x", "const X = x; return (" + rewritten + ");");
        const valueAt = (x) => {
          const value = Number(fn(Number(x)));
          if (!Number.isFinite(value) || Math.abs(value) > MAX_ABS_Y) {
            throw new Error("Value out of range");
          }
          return value;
        };
        valueAt(0.7);
        return valueAt;
      }

      function sampleFunction(fn, n = 96) {
        const points = [];
        for (let i = 0; i <= n; i += 1) {
          const x = 2 * i / n;
          let y = 0;
          try {
            y = fn(x);
          } catch (error) {
            y = 0;
          }
          points.push({ x, y });
        }
        return points;
      }

      function radiiAt(fn, c, x) {
        let fx = fn(x);
        if (!Number.isFinite(fx)) {
          fx = 0;
        }
        const dCurve = Math.abs(fx - c);
        const dAxis = Math.abs(0 - c);
        return {
          fx,
          outer: Math.max(dCurve, dAxis),
          inner: Math.min(dCurve, dAxis),
          signedOuter: fx - c,
          signedInner: -c
        };
      }

      function washerArea(fn, c, x) {
        const r = radiiAt(fn, c, x);
        return Math.PI * Math.max(0, r.outer * r.outer - r.inner * r.inner);
      }

      function integrateVolume(fn, c) {
        const n = 240;
        const h = 2 / n;
        let sum = washerArea(fn, c, 0) + washerArea(fn, c, 2);
        for (let i = 1; i < n; i += 1) {
          const weight = i % 2 === 0 ? 2 : 4;
          sum += weight * washerArea(fn, c, i * h);
        }
        return sum * h / 3;
      }

      function fixed(value, digits = 3) {
        if (!Number.isFinite(value)) {
          return "--";
        }
        const text = value.toFixed(digits);
        return text.replace(/\.?0+$/, (match) => match.startsWith(".") ? "" : match);
      }

      function pathFromPoints(points, xMap, yMap) {
        return points.map((p, i) => {
          const x = xMap(p.x);
          const y = yMap(p.y);
          return (i === 0 ? "M " : "L ") + x.toFixed(2) + " " + y.toFixed(2);
        }).join(" ");
      }

      function makeSvgNode(name, attrs = {}, text = "") {
        const node = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, String(value));
        }
        if (text) {
          node.textContent = text;
        }
        return node;
      }

      function drawPlane(fn, c, xValue) {
        const points = sampleFunction(fn, 120);
        const selected = radiiAt(fn, c, xValue);
        const yValues = points.map((p) => p.y).concat([0, c, c - selected.outer, c + selected.outer, 4]);
        const yMinRaw = Math.min(...yValues);
        const yMaxRaw = Math.max(...yValues);
        const yPad = Math.max(0.45, (yMaxRaw - yMinRaw) * 0.08);
        const yMin = yMinRaw - yPad;
        const yMax = yMaxRaw + yPad;
        const xMin = -0.18;
        const xMax = 2.35;
        const margin = { left: 78, right: 40, top: 22, bottom: 54 };
        const plotW = W - margin.left - margin.right;
        const plotH = H - margin.top - margin.bottom;
        const xMap = (x) => margin.left + (x - xMin) / (xMax - xMin) * plotW;
        const yMap = (y) => margin.top + (yMax - y) / (yMax - yMin) * plotH;
        const yScale = plotH / (yMax - yMin);
        const xAxisY = yMap(0);
        const yAxisX = xMap(0);
        const axisY = yMap(c);
        const x0 = xMap(0);
        const x2 = xMap(2);
        const y0 = yMap(0);
        const fxY = yMap(selected.fx);
        const washerCx = xMap(xValue);
        const washerCy = axisY;
        const outerRy = Math.max(5, selected.outer * yScale);
        const innerRy = Math.max(0, selected.inner * yScale);
        const outerRx = Math.max(13, Math.min(34, outerRy * 0.18));
        const innerRx = selected.inner > 0 ? Math.max(7, outerRx * Math.min(0.92, selected.inner / Math.max(selected.outer, 1e-6))) : 0;

        const curvePath = pathFromPoints(points, xMap, yMap);
        const regionPath = "M " + x0.toFixed(2) + " " + y0.toFixed(2) + " " +
          pathFromPoints(points, xMap, yMap).replace(/^M [^L]+ /, "") +
          " L " + x2.toFixed(2) + " " + y0.toFixed(2) + " Z";

        svg.replaceChildren();

        const defs = makeSvgNode("defs");
        const marker = makeSvgNode("marker", {
          id: "arrowHead",
          markerWidth: 10,
          markerHeight: 10,
          refX: 8,
          refY: 5,
          orient: "auto",
          markerUnits: "strokeWidth"
        });
        marker.appendChild(makeSvgNode("path", { d: "M 0 0 L 10 5 L 0 10 Z", fill: "#23262b" }));
        const redMarker = makeSvgNode("marker", {
          id: "redArrowHead",
          markerWidth: 10,
          markerHeight: 10,
          refX: 8,
          refY: 5,
          orient: "auto",
          markerUnits: "strokeWidth"
        });
        redMarker.appendChild(makeSvgNode("path", { d: "M 0 0 L 10 5 L 0 10 Z", fill: "#e45555" }));
        defs.append(marker, redMarker);
        svg.appendChild(defs);

        svg.appendChild(makeSvgNode("line", { class: "axis-red", x1: 18, y1: axisY, x2: W - 24, y2: axisY }));
        svg.appendChild(makeSvgNode("line", { class: "axis", x1: xMap(xMin + 0.02), y1: xAxisY, x2: xMap(xMax - 0.02), y2: xAxisY, "marker-end": "url(#arrowHead)" }));
        svg.appendChild(makeSvgNode("line", { class: "axis", x1: yAxisX, y1: yMap(yMin + 0.04 * (yMax - yMin)), x2: yAxisX, y2: yMap(yMax - 0.02 * (yMax - yMin)), "marker-end": "url(#arrowHead)" }));

        svg.appendChild(makeSvgNode("path", { class: "region", d: regionPath }));
        svg.appendChild(makeSvgNode("path", { class: "curve", d: curvePath }));
        svg.appendChild(makeSvgNode("line", { class: "boundary", x1: x2, y1: y0, x2, y2: yMap(fn(2)) }));

        svg.appendChild(makeSvgNode("line", { class: "slice-line", x1: washerCx, y1: fxY, x2: washerCx, y2: washerCy + outerRy }));
        svg.appendChild(makeSvgNode("ellipse", { class: "washer-fill", cx: washerCx, cy: washerCy, rx: outerRx, ry: outerRy }));
        if (innerRy > 2 && innerRx > 2) {
          svg.appendChild(makeSvgNode("ellipse", { class: "washer-hole", cx: washerCx, cy: washerCy, rx: innerRx, ry: innerRy }));
        }
        svg.appendChild(makeSvgNode("line", { class: "axis-red", x1: Math.max(18, washerCx - outerRx - 5), y1: axisY, x2: Math.min(W - 24, washerCx + outerRx + 5), y2: axisY }));

        svg.appendChild(makeSvgNode("line", { class: "tick", x1: x2, y1: xAxisY - 8, x2, y2: xAxisY + 8 }));
        svg.appendChild(makeSvgNode("line", { class: "tick", x1: yAxisX - 8, y1: yMap(4), x2: yAxisX + 8, y2: yMap(4) }));
        svg.appendChild(makeSvgNode("line", { class: "tick", x1: yAxisX - 8, y1: yMap(1), x2: yAxisX + 8, y2: yMap(1) }));

        const xLabel = makeSvgNode("text", { class: "math-label", x: W - 47, y: xAxisY - 15 }, "x");
        const yLabel = makeSvgNode("text", { class: "math-label", x: yAxisX + 16, y: 22 }, "y");
        const zeroLabel = makeSvgNode("text", { class: "small-label", x: yAxisX - 28, y: xAxisY + 28 }, "0");
        const twoLabel = makeSvgNode("text", { class: "small-label", x: x2 - 8, y: xAxisY + 31 }, "2");
        const fourLabel = makeSvgNode("text", { class: "small-label", x: yAxisX - 26, y: yMap(4) + 7 }, "4");
        const oneSqLabel = makeSvgNode("text", { class: "small-label", x: yAxisX - 38, y: yMap(1) + 7 }, "x");
        const superscript = makeSvgNode("tspan", { "baseline-shift": "super", "font-size": "14" }, "2");
        oneSqLabel.appendChild(superscript);
        svg.append(xLabel, yLabel, zeroLabel, twoLabel, fourLabel, oneSqLabel);

        const axisText = makeSvgNode("text", { class: "small-label", x: 22, y: axisY + 7 }, "y = " + fixed(c, 2));
        svg.appendChild(axisText);

        const regionText = makeSvgNode("text", { class: "math-label", x: xMap(1.43), y: yMap(Math.max(0.45, Math.min(2.3, fn(1.55) * 0.58))) }, "R");
        const sliceText = makeSvgNode("text", { class: "small-label", x: washerCx - 9, y: xAxisY + 35 }, "x");
        svg.append(regionText, sliceText);

        const arcX = xMap(2.22);
        const arcTop = axisY - 36;
        const arcBottom = axisY + 36;
        const rotationPath = "M " + (arcX - 5).toFixed(1) + " " + arcTop.toFixed(1) +
          " C " + (arcX - 30).toFixed(1) + " " + (axisY - 22).toFixed(1) + " " +
          (arcX - 28).toFixed(1) + " " + (axisY + 25).toFixed(1) + " " +
          (arcX - 3).toFixed(1) + " " + arcBottom.toFixed(1);
        svg.appendChild(makeSvgNode("path", {
          d: rotationPath,
          fill: "none",
          stroke: "#2b2f35",
          "stroke-width": 2,
          "marker-end": "url(#arrowHead)",
          "vector-effect": "non-scaling-stroke"
        }));

        const topValue = Math.max(0, selected.fx);
        const upperLabelY = yMap(Math.max(c + selected.outer, topValue));
        const lowerLabelY = yMap(c + selected.inner);
        svg.appendChild(makeSvgNode("text", { class: "plain-label", x: Math.min(W - 140, washerCx + outerRx + 8), y: Math.max(18, upperLabelY + 16) }, "outer R"));
        svg.appendChild(makeSvgNode("text", { class: "plain-label", x: Math.min(W - 140, washerCx + innerRx + 7), y: Math.max(36, lowerLabelY - 7) }, "inner r"));
      }

      function canvasPoint(canvasEl) {
        const rect = canvasEl.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(320, Math.round(rect.width * dpr));
        const height = Math.max(215, Math.round(rect.height * dpr));
        if (canvasEl.width !== width || canvasEl.height !== height) {
          canvasEl.width = width;
          canvasEl.height = height;
        }
        return { width, height, dpr };
      }

      function drawSolid(fn, c, xValue) {
        const info = canvasPoint(canvas);
        const ctx = canvas.getContext("2d");
        const w = info.width;
        const h = info.height;
        ctx.clearRect(0, 0, w, h);

        const samples = [];
        let maxOuter = 0.1;
        for (let i = 0; i <= 150; i += 1) {
          const x = 2 * i / 150;
          const r = radiiAt(fn, c, x);
          samples.push({ x, ...r });
          maxOuter = Math.max(maxOuter, r.outer);
        }
        const selected = radiiAt(fn, c, xValue);
        maxOuter = Math.max(maxOuter, selected.outer, selected.inner);

        const left = w * 0.13;
        const right = w * 0.87;
        const cy = h * 0.54;
        const modelW = right - left;
        const scale = Math.min(h * 0.39 / maxOuter, h * 0.115);
        const depth = Math.max(16 * info.dpr, Math.min(42 * info.dpr, scale * 0.55));
        const xMap = (x) => left + (x / 2) * modelW;
        const topY = (r) => cy - r.outer * scale;
        const bottomY = (r) => cy + r.outer * scale;
        const innerTopY = (r) => cy - r.inner * scale;
        const innerBottomY = (r) => cy + r.inner * scale;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "rgba(228, 85, 85, 0.8)";
        ctx.lineWidth = 2 * info.dpr;
        ctx.beginPath();
        ctx.moveTo(w * 0.04, cy);
        ctx.lineTo(w * 0.96, cy);
        ctx.stroke();

        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "#6f7780";
        ctx.beginPath();
        ctx.ellipse((left + right) / 2, cy + maxOuter * scale * 0.87, modelW * 0.48, h * 0.035, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const bodyGradient = ctx.createLinearGradient(0, cy - maxOuter * scale, 0, cy + maxOuter * scale);
        bodyGradient.addColorStop(0, "rgba(202, 229, 240, 0.96)");
        bodyGradient.addColorStop(0.38, "rgba(209, 233, 242, 0.86)");
        bodyGradient.addColorStop(0.52, "rgba(213, 216, 219, 0.94)");
        bodyGradient.addColorStop(1, "rgba(158, 164, 171, 0.96)");

        const first = samples[0];
        const last = samples[samples.length - 1];
        ctx.beginPath();
        ctx.moveTo(xMap(first.x), topY(first));
        for (let i = 1; i < samples.length; i += 1) {
          ctx.lineTo(xMap(samples[i].x), topY(samples[i]));
        }
        ctx.ellipse(xMap(last.x), cy, depth, last.outer * scale, 0, -Math.PI / 2, Math.PI / 2, false);
        for (let i = samples.length - 2; i >= 0; i -= 1) {
          ctx.lineTo(xMap(samples[i].x), bottomY(samples[i]));
        }
        ctx.ellipse(xMap(first.x), cy, depth, first.outer * scale, 0, Math.PI / 2, -Math.PI / 2, false);
        ctx.closePath();
        ctx.fillStyle = bodyGradient;
        ctx.fill();
        ctx.strokeStyle = "rgba(124, 131, 139, 0.72)";
        ctx.lineWidth = 2 * info.dpr;
        ctx.stroke();

        ctx.save();
        ctx.globalAlpha = 0.38;
        ctx.strokeStyle = "#9aa4ad";
        ctx.lineWidth = 1.3 * info.dpr;
        for (let i = 24; i <= 126; i += 26) {
          const s = samples[i];
          ctx.beginPath();
          ctx.moveTo(xMap(s.x), topY(s));
          ctx.lineTo(xMap(s.x), bottomY(s));
          ctx.stroke();
        }
        ctx.restore();

        const channelGradient = ctx.createLinearGradient(left, 0, right, 0);
        channelGradient.addColorStop(0, "rgba(246, 247, 248, 0.97)");
        channelGradient.addColorStop(0.48, "rgba(204, 207, 211, 0.92)");
        channelGradient.addColorStop(1, "rgba(238, 240, 242, 0.98)");

        ctx.beginPath();
        ctx.moveTo(xMap(first.x), innerTopY(first));
        for (let i = 1; i < samples.length; i += 1) {
          ctx.lineTo(xMap(samples[i].x), innerTopY(samples[i]));
        }
        ctx.ellipse(xMap(last.x), cy, depth * 0.72, Math.max(1, last.inner * scale), 0, -Math.PI / 2, Math.PI / 2, false);
        for (let i = samples.length - 2; i >= 0; i -= 1) {
          ctx.lineTo(xMap(samples[i].x), innerBottomY(samples[i]));
        }
        ctx.ellipse(xMap(first.x), cy, depth * 0.72, Math.max(1, first.inner * scale), 0, Math.PI / 2, -Math.PI / 2, false);
        ctx.closePath();
        ctx.fillStyle = channelGradient;
        ctx.fill();
        ctx.strokeStyle = "rgba(150, 156, 163, 0.58)";
        ctx.stroke();

        ctx.strokeStyle = "rgba(228, 85, 85, 0.9)";
        ctx.lineWidth = 1.5 * info.dpr;
        ctx.beginPath();
        ctx.moveTo(w * 0.045, cy);
        ctx.lineTo(w * 0.955, cy);
        ctx.stroke();

        function capAt(sample, alpha) {
          const x = xMap(sample.x);
          const outer = sample.outer * scale;
          const inner = sample.inner * scale;
          const capGradient = ctx.createLinearGradient(x - depth, cy - outer, x + depth, cy + outer);
          capGradient.addColorStop(0, "rgba(242, 244, 246, " + alpha + ")");
          capGradient.addColorStop(0.5, "rgba(178, 184, 190, " + (alpha * 0.72) + ")");
          capGradient.addColorStop(1, "rgba(236, 238, 240, " + alpha + ")");
          ctx.fillStyle = capGradient;
          ctx.strokeStyle = "rgba(139, 146, 154, 0.62)";
          ctx.lineWidth = 1.8 * info.dpr;
          ctx.beginPath();
          ctx.ellipse(x, cy, depth, outer, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          if (inner > 2) {
            const holeGradient = ctx.createLinearGradient(x - depth * 0.6, 0, x + depth * 0.6, 0);
            holeGradient.addColorStop(0, "rgba(255, 255, 255, 0.98)");
            holeGradient.addColorStop(0.55, "rgba(221, 224, 227, 0.96)");
            holeGradient.addColorStop(1, "rgba(246, 247, 248, 0.98)");
            ctx.fillStyle = holeGradient;
            ctx.beginPath();
            ctx.ellipse(x, cy, depth * 0.64, inner, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(139, 146, 154, 0.58)";
            ctx.stroke();
          }
        }

        capAt(first, 0.54);
        capAt(last, 0.92);

        const sliceX = xMap(xValue);
        ctx.save();
        ctx.globalAlpha = 0.86;
        ctx.fillStyle = "rgba(172, 178, 185, 0.28)";
        ctx.strokeStyle = "rgba(78, 92, 106, 0.82)";
        ctx.lineWidth = 2 * info.dpr;
        ctx.beginPath();
        ctx.ellipse(sliceX, cy, depth * 0.9, selected.outer * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        if (selected.inner * scale > 2) {
          ctx.globalCompositeOperation = "destination-out";
          ctx.beginPath();
          ctx.ellipse(sliceX, cy, depth * 0.58, selected.inner * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = "rgba(87, 96, 106, 0.78)";
          ctx.beginPath();
          ctx.ellipse(sliceX, cy, depth * 0.58, selected.inner * scale, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        ctx.fillStyle = "#252b33";
        ctx.font = Math.round(13 * info.dpr) + "px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("x = " + fixed(xValue, 2), sliceX, Math.min(h - 16 * info.dpr, cy + selected.outer * scale + 24 * info.dpr));

        ctx.fillStyle = "rgba(36, 42, 50, 0.82)";
        ctx.font = "italic " + Math.round(16 * info.dpr) + "px Cambria, Georgia, serif";
        ctx.textAlign = "left";
        ctx.fillText("inner radius " + fixed(selected.inner, 2), left + 10 * info.dpr, cy - selected.inner * scale - 10 * info.dpr);
        ctx.fillText("outer radius " + fixed(selected.outer, 2), Math.min(sliceX + 18 * info.dpr, w - 150 * info.dpr), Math.max(24 * info.dpr, cy - selected.outer * scale - 8 * info.dpr));
        ctx.restore();
      }

      function update() {
        let nextFunction = activeFunction;
        let nextAxis = activeAxis;
        functionInput.classList.remove("invalid");
        axisInput.classList.remove("invalid");

        try {
          nextFunction = compileExpression(functionInput.value);
          activeFunction = nextFunction;
        } catch (error) {
          functionInput.classList.add("invalid");
          nextFunction = activeFunction;
        }

        try {
          nextAxis = compileExpression(axisInput.value);
          const value = nextAxis(0);
          if (!Number.isFinite(value)) {
            throw new Error("Invalid axis");
          }
          activeAxis = nextAxis;
          activeC = value;
        } catch (error) {
          axisInput.classList.add("invalid");
        }

        const fn = nextFunction;
        const c = activeC;
        const xValue = Number(xSlider.value);
        const selected = radiiAt(fn, c, xValue);
        const area = washerArea(fn, c, xValue);
        const areaFactor = area / Math.PI;
        const volume = integrateVolume(fn, c);
        const volumeFactor = volume / Math.PI;

        xReadout.textContent = "x = " + fixed(xValue, 2);
        radiusReadout.textContent = "R = " + fixed(selected.outer, 3) + ", r = " + fixed(selected.inner, 3);
        areaReadout.textContent = "A = " + fixed(areaFactor, 3) + PI_SYMBOL + " = " + fixed(area, 3);
        volumeReadout.textContent = "V = " + fixed(volumeFactor, 3) + PI_SYMBOL + " = " + fixed(volume, 3);

        drawPlane(fn, c, xValue);
        drawSolid(fn, c, xValue);
      }

      functionInput.addEventListener("input", update);
      axisInput.addEventListener("input", update);
      xSlider.addEventListener("input", update);
      window.addEventListener("resize", update);
      update();
    })();
  </script>
</body>
</html>
