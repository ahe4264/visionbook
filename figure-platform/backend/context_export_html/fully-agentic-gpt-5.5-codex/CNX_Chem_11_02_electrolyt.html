<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electrolyte Conductivity Comparison</title>
  <!-- Recreated from the provided local reference image:
       C:\Users\ahe42\Documents\figure-benchmark\public\images\chemistry\3d\CNX_Chem_11_02_electrolyt.jpg -->
  <style>
    :root {
      --ink: #111111;
      --muted: #52606d;
      --panel: #f5f8fb;
      --edge: #cbd7e3;
      --accent: #126e8b;
      --green: #82c91e;
      --yellow: #fff45c;
      --red: #e94c5b;
      --glass: #9dc9c9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 22px);
    }

    .figure-shell {
      width: min(1320px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage {
      width: 100%;
      overflow: auto;
      border: 1px solid #e1e7ef;
      border-radius: 8px;
      background: linear-gradient(#ffffff 0%, #ffffff 72%, #f7fbfc 100%);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 980px;
      height: auto;
      max-height: calc(100vh - 132px);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(250px, auto) minmax(250px, 1fr) minmax(180px, auto);
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
    }

    .solution-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid #9dafbf;
      border-radius: 7px;
      background: #ffffff;
      color: #15202b;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(18, 110, 139, 0.25);
      outline-offset: 2px;
    }

    button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .slider-wrap {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    label,
    .value,
    .readout {
      font-size: 14px;
      line-height: 1.25;
    }

    label {
      font-weight: 700;
      color: #24313f;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .value {
      width: 42px;
      text-align: right;
      font-weight: 700;
      color: #24313f;
    }

    .readout {
      min-width: 180px;
      color: #24313f;
      grid-column: 1 / -1;
    }

    .readout strong {
      display: block;
      color: #111111;
    }

    .panel-focus {
      fill: #ffffff;
      stroke: transparent;
      stroke-width: 3;
      transition: stroke 180ms ease, fill 180ms ease;
    }

    .apparatus.active .panel-focus {
      fill: #f5fbfd;
      stroke: #2a87a3;
    }

    .apparatus:not(.active) .panel-focus {
      opacity: 0.72;
    }

    .wire {
      fill: none;
      stroke: #0a0b0b;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .glass-line {
      fill: rgba(218, 245, 245, 0.38);
      stroke: var(--glass);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .glass-highlight {
      fill: none;
      stroke: rgba(255, 255, 255, 0.72);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .liquid {
      fill: #8be7e3;
      opacity: 0.5;
    }

    .plate {
      fill: url(#plateGrad);
      stroke: #6e777c;
      stroke-width: 3;
      opacity: 0.86;
    }

    .electrode-label {
      font-size: 32px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .negative {
      fill: #31373b;
    }

    .positive {
      fill: var(--red);
    }

    .caption-main {
      font-size: 26px;
      text-anchor: middle;
      fill: #111111;
    }

    .caption-sub {
      font-size: 25px;
      text-anchor: middle;
      fill: #111111;
    }

    .particle text {
      font-size: 20px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .ion-arrow {
      stroke: #293038;
      stroke-width: 2.6;
      stroke-linecap: round;
      opacity: 0.85;
    }

    .bulb-glow {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 200ms ease;
    }

    .bulb-glass {
      fill: url(#bulbGlass);
      stroke: #9dc8c9;
      stroke-width: 3;
    }

    .filament {
      fill: none;
      stroke: #191919;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bulb-base {
      fill: #9ec7cb;
      stroke: #7a9ca0;
      stroke-width: 2;
    }

    .wall-source {
      fill: #40585f;
      stroke: #24343a;
      stroke-width: 2;
    }

    .plug {
      fill: #162026;
    }

    @media (max-width: 850px) {
      body {
        padding: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .solution-buttons {
        grid-template-columns: 1fr 1fr 1fr;
      }

      button {
        padding-inline: 6px;
        font-size: 13px;
      }

      label,
      .value,
      .readout {
        font-size: 13px;
      }

      svg {
        max-height: none;
        min-width: 960px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bulb-glow,
      .panel-focus {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive comparison of nonelectrolyte, strong electrolyte, and weak electrolyte conductivity">
    <div class="stage">
      <svg id="figure" viewBox="0 0 1320 720" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Electrolytic conductivity in ethanol, potassium chloride, and acetic acid solution</title>
        <desc id="svg-desc">Three beakers are wired in series with a wall source and light bulb. Ethanol has neutral molecules and a dark bulb, KCl has many migrating ions and a bright bulb, and acetic acid has a small number of ions plus molecules and a dim bulb.</desc>
        <defs>
          <radialGradient id="ionGrad" cx="34%" cy="28%" r="70%">
            <stop offset="0" stop-color="#d9ff73"/>
            <stop offset="0.42" stop-color="#88d31d"/>
            <stop offset="1" stop-color="#37a80d"/>
          </radialGradient>
          <linearGradient id="plateGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f0f1ee"/>
            <stop offset="0.55" stop-color="#c9d0ce"/>
            <stop offset="1" stop-color="#e7e9e5"/>
          </linearGradient>
          <radialGradient id="bulbGlass" cx="44%" cy="25%" r="72%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.58" stop-color="#edf8f8"/>
            <stop offset="1" stop-color="#cfe8e9"/>
          </radialGradient>
          <radialGradient id="bulbGlowGrad" cx="50%" cy="50%" r="62%">
            <stop offset="0" stop-color="#fff799"/>
            <stop offset="0.45" stop-color="#f5ff50"/>
            <stop offset="1" stop-color="#f2ff50" stop-opacity="0"/>
          </radialGradient>
          <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <marker id="arrowHead" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#293038"></path>
          </marker>
        </defs>
        <g id="static-layer"></g>
        <g id="particle-layer"></g>
      </svg>
    </div>

    <section class="controls" aria-label="Conductivity controls">
      <div class="solution-buttons" role="group" aria-label="Select solution">
        <button type="button" data-solution="ethanol" aria-pressed="true">ethanol</button>
        <button type="button" data-solution="kcl" aria-pressed="false">KCl</button>
        <button type="button" data-solution="acetic" aria-pressed="false">acetic acid</button>
      </div>
      <div class="slider-wrap">
        <label for="concentration">Solute concentration</label>
        <input id="concentration" type="range" min="0" max="100" value="70">
        <span class="value" id="concentration-value">70%</span>
      </div>
      <button type="button" id="motion-toggle" aria-pressed="true">pause motion</button>
      <div class="readout" id="readout" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("figure");
      const staticLayer = document.getElementById("static-layer");
      const particleLayer = document.getElementById("particle-layer");
      const concentrationSlider = document.getElementById("concentration");
      const concentrationValue = document.getElementById("concentration-value");
      const readout = document.getElementById("readout");
      const motionToggle = document.getElementById("motion-toggle");
      const buttons = Array.from(document.querySelectorAll("[data-solution]"));

      const panels = [
        {
          id: "ethanol",
          x: 0,
          title: "ethanol",
          subtitle: "No conductivity",
          mode: "none",
          conductivityLabel: "dark bulb, neutral molecules only"
        },
        {
          id: "kcl",
          x: 440,
          title: "KCl",
          subtitle: "High conductivity",
          mode: "strong",
          conductivityLabel: "bright bulb, complete ion dissociation"
        },
        {
          id: "acetic",
          x: 880,
          title: "acetic acid solution",
          subtitle: "Low conductivity",
          mode: "weak",
          conductivityLabel: "dim bulb, partial ion dissociation"
        }
      ];

      const state = {
        selected: "ethanol",
        concentration: Number(concentrationSlider.value),
        moving: true,
        particles: [],
        lastFrame: performance.now()
      };

      function el(name, attrs = {}, parent = null, text = "") {
        const node = document.createElementNS(SVG_NS, name);
        Object.entries(attrs).forEach(([key, value]) => {
          if (value !== null && value !== undefined) {
            node.setAttribute(key, String(value));
          }
        });
        if (text) node.textContent = text;
        if (parent) parent.appendChild(node);
        return node;
      }

      function seededRandom(seed) {
        let t = seed >>> 0;
        return () => {
          t += 0x6D2B79F5;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      function randBetween(rng, min, max) {
        return min + (max - min) * rng();
      }

      function setAttrs(node, attrs) {
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
      }

      function apparatus(panel) {
        const x = panel.x;
        const g = el("g", { class: "apparatus", id: `panel-${panel.id}` }, staticLayer);
        panel.group = g;
        panel.bulbGlow = null;
        panel.bulbCore = null;
        panel.clipId = `clip-${panel.id}`;
        panel.bounds = {
          minX: x + 127,
          maxX: x + 313,
          minY: 392,
          maxY: 548
        };

        el("rect", {
          class: "panel-focus",
          x: x + 12,
          y: 14,
          width: 416,
          height: 684,
          rx: 8
        }, g);

        const clipPath = el("clipPath", { id: panel.clipId }, svg.querySelector("defs"));
        el("path", {
          d: `M ${x + 109} 392 C ${x + 166} 382 ${x + 255} 382 ${x + 316} 392 L ${x + 316} 542 C ${x + 292} 563 ${x + 126} 563 ${x + 103} 542 L ${x + 103} 392 Z`
        }, clipPath);

        drawPowerSource(g, x);
        drawWires(g, x);
        drawBulb(g, panel);
        drawBeaker(g, x);
        drawElectrodes(g, x);

        el("text", { class: "caption-main", x: x + 220, y: 642 }, g, panel.title);
        el("text", { class: "caption-sub", x: x + 220, y: 674 }, g, panel.subtitle);
      }

      function drawPowerSource(parent, x) {
        el("path", {
          class: "wall-source",
          d: `M ${x + 36} 82 L ${x + 76} 66 L ${x + 76} 111 L ${x + 36} 128 Z`
        }, parent);
        el("path", {
          fill: "#6f8589",
          d: `M ${x + 47} 88 L ${x + 70} 80 L ${x + 70} 105 L ${x + 47} 116 Z`
        }, parent);
        el("path", {
          class: "plug",
          d: `M ${x + 70} 91 L ${x + 103} 101 L ${x + 99} 116 L ${x + 68} 106 Z`
        }, parent);
        el("rect", { class: "plug", x: x + 86, y: 94, width: 20, height: 17, rx: 3 }, parent);
        el("line", { x1: x + 58, y1: 92, x2: x + 58, y2: 108, stroke: "#26373d", "stroke-width": 3 }, parent);
      }

      function drawWires(parent, x) {
        el("path", {
          class: "wire",
          d: `M ${x + 99} 107 C ${x + 130} 154 ${x + 139} 228 ${x + 139} 360`
        }, parent);
        el("path", {
          class: "wire",
          d: `M ${x + 101} 105 C ${x + 174} 161 ${x + 250} 170 ${x + 301} 115`
        }, parent);
        el("path", {
          class: "wire",
          d: `M ${x + 306} 120 C ${x + 315} 199 ${x + 292} 254 ${x + 286} 351`
        }, parent);
      }

      function drawBulb(parent, panel) {
        const x = panel.x;
        const bx = x + 305;
        const by = 69;
        const bulb = el("g", {}, parent);
        panel.bulbGlow = el("circle", {
          class: "bulb-glow",
          cx: bx,
          cy: by,
          r: 53,
          fill: "url(#bulbGlowGrad)",
          filter: "url(#softGlow)",
          opacity: 0
        }, bulb);
        panel.bulbCore = el("circle", {
          cx: bx,
          cy: by,
          r: 30,
          fill: "#fff27a",
          opacity: 0
        }, bulb);
        el("path", {
          class: "bulb-glass",
          d: `M ${bx - 36} ${by - 9}
              C ${bx - 36} ${by - 36} ${bx - 15} ${by - 58} ${bx + 11} ${by - 56}
              C ${bx + 43} ${by - 54} ${bx + 60} ${by - 20} ${bx + 45} ${by + 8}
              C ${bx + 37} ${by + 22} ${bx + 26} ${by + 31} ${bx + 23} ${by + 48}
              L ${bx - 13} ${by + 48}
              C ${bx - 16} ${by + 30} ${bx - 27} ${by + 22} ${bx - 33} ${by + 9}
              C ${bx - 35} ${by + 4} ${bx - 36} ${by - 3} ${bx - 36} ${by - 9} Z`
        }, bulb);
        el("path", {
          class: "filament",
          d: `M ${bx - 14} ${by + 14} L ${bx - 9} ${by - 5}
              C ${bx - 5} ${by - 10} ${bx - 2} ${by} ${bx + 1} ${by - 6}
              C ${bx + 5} ${by - 13} ${bx + 8} ${by} ${bx + 12} ${by - 6}
              C ${bx + 16} ${by - 11} ${bx + 20} ${by - 6} ${bx + 17} ${by + 13}`
        }, bulb);
        el("line", { class: "filament", x1: bx - 22, y1: by + 14, x2: bx - 14, y2: by + 14 }, bulb);
        el("line", { class: "filament", x1: bx + 17, y1: by + 14, x2: bx + 26, y2: by + 14 }, bulb);
        el("circle", { cx: bx - 22, cy: by + 14, r: 4, fill: "#101010" }, bulb);
        el("circle", { cx: bx + 26, cy: by + 14, r: 4, fill: "#101010" }, bulb);
        el("path", {
          class: "bulb-base",
          d: `M ${bx - 19} ${by + 48} L ${bx + 25} ${by + 48} L ${bx + 20} ${by + 85} L ${bx - 13} ${by + 85} Z`
        }, bulb);
        for (let i = 0; i < 5; i += 1) {
          el("line", {
            x1: bx - 19,
            y1: by + 54 + i * 6,
            x2: bx + 24,
            y2: by + 54 + i * 6,
            stroke: "#71979b",
            "stroke-width": 3
          }, bulb);
        }
      }

      function drawBeaker(parent, x) {
        const b = el("g", {}, parent);
        const bx = x + 90;
        const by = 272;
        el("path", {
          class: "liquid",
          d: `M ${bx + 18} 399
              C ${bx + 63} 388 ${bx + 190} 388 ${bx + 239} 399
              L ${bx + 239} 544
              C ${bx + 211} 563 ${bx + 55} 563 ${bx + 28} 544 Z`
        }, b);
        el("ellipse", {
          cx: bx + 129,
          cy: 399,
          rx: 111,
          ry: 18,
          fill: "#77e0dc",
          opacity: 0.38
        }, b);
        el("path", {
          class: "glass-line",
          d: `M ${bx + 22} ${by + 17}
              C ${bx + 28} ${by + 10} ${bx + 36} ${by + 7} ${bx + 48} ${by + 7}
              L ${bx + 238} ${by + 7}
              C ${bx + 249} ${by + 7} ${bx + 252} ${by + 17} ${bx + 244} ${by + 25}
              C ${bx + 239} ${by + 30} ${bx + 237} ${by + 39} ${bx + 237} ${by + 48}
              L ${bx + 237} ${by + 262}
              C ${bx + 208} ${by + 290} ${bx + 51} ${by + 291} ${bx + 22} ${by + 262}
              L ${bx + 22} ${by + 50}
              C ${bx + 22} ${by + 31} ${bx + 13} ${by + 25} ${bx - 5} ${by + 24}
              C ${bx + 1} ${by + 11} ${bx + 11} ${by + 8} ${bx + 22} ${by + 17} Z`
        }, b);
        el("path", {
          class: "glass-highlight",
          d: `M ${bx + 38} ${by + 17} C ${bx + 75} ${by + 12} ${bx + 94} ${by + 12} ${bx + 112} ${by + 16}`
        }, b);
        el("path", {
          class: "glass-highlight",
          d: `M ${bx + 153} ${by + 15} C ${bx + 205} ${by + 12} ${bx + 225} ${by + 15} ${bx + 228} ${by + 28}`
        }, b);
      }

      function drawElectrodes(parent, x) {
        const bx = x + 90;
        el("polygon", {
          class: "plate",
          points: `${bx + 67},345 ${bx + 120},366 ${bx + 120},555 ${bx + 67},527`
        }, parent);
        el("polygon", {
          class: "plate",
          points: `${bx + 210},323 ${bx + 264},344 ${bx + 264},509 ${bx + 210},482`
        }, parent);
        el("text", { class: "electrode-label negative", x: bx + 92, y: 383 }, parent, "-");
        el("text", { class: "electrode-label positive", x: bx + 237, y: 357 }, parent, "+");
      }

      function rebuildParticles() {
        particleLayer.replaceChildren();
        state.particles = [];
        const c = state.concentration / 100;

        panels.forEach((panel, panelIndex) => {
          const group = el("g", {
            "clip-path": `url(#${panel.clipId})`,
            id: `particles-${panel.id}`
          }, particleLayer);
          const rng = seededRandom(4900 + panelIndex * 997 + Math.round(state.concentration * 19));

          if (panel.mode === "none") {
            const moleculeCount = Math.round(c * 8);
            for (let i = 0; i < moleculeCount; i += 1) {
              addMolecule(panel, group, rng, i);
            }
            return;
          }

          if (panel.mode === "strong") {
            const ionCount = Math.round(c * 18);
            for (let i = 0; i < ionCount; i += 1) {
              addIon(panel, group, rng, i % 2 === 0 ? "+" : "-", i, ionCount);
            }
            return;
          }

          const ionCount = Math.round(c * 7);
          const moleculeCount = Math.round(c * 7);
          for (let i = 0; i < moleculeCount; i += 1) {
            addMolecule(panel, group, rng, i);
          }
          for (let i = 0; i < ionCount; i += 1) {
            addIon(panel, group, rng, i % 2 === 0 ? "+" : "-", i, ionCount);
          }
        });

        updateVisualState();
      }

      function addIon(panel, parent, rng, charge, index, total) {
        const bounds = panel.bounds;
        const columns = panel.mode === "strong" ? 4 : 3;
        const rows = Math.max(1, Math.ceil(total / columns));
        const column = index % columns;
        const row = Math.floor(index / columns);
        const usableWidth = bounds.maxX - bounds.minX - 46;
        const usableHeight = bounds.maxY - bounds.minY - 48;
        const particle = {
          kind: "ion",
          panel,
          charge,
          x: bounds.minX + 23 + ((column + 0.25 + rng() * 0.5) / columns) * usableWidth,
          y: bounds.minY + 24 + ((row + 0.25 + rng() * 0.5) / rows) * usableHeight,
          phase: rng() * Math.PI * 2,
          speed: panel.mode === "strong" ? randBetween(rng, 26, 44) : randBetween(rng, 14, 24),
          node: null
        };
        const g = el("g", { class: "particle ion", "data-charge": charge }, parent);
        const line = charge === "+"
          ? el("line", { class: "ion-arrow", x1: 24, y1: 0, x2: -28, y2: 0, "marker-end": "url(#arrowHead)" }, g)
          : el("line", { class: "ion-arrow", x1: -24, y1: 0, x2: 28, y2: 0, "marker-end": "url(#arrowHead)" }, g);
        line.setAttribute("transform", `translate(0 ${index % 2 === 0 ? -2 : 2})`);
        el("circle", { r: panel.mode === "strong" ? 13 : 12, fill: "url(#ionGrad)", stroke: "#61ae13", "stroke-width": 1.4 }, g);
        el("circle", { cx: -5, cy: -5, r: 4, fill: "#dfff7a", opacity: 0.85 }, g);
        el("text", { y: 1 }, g, charge);
        particle.node = g;
        state.particles.push(particle);
        positionParticle(particle);
      }

      function addMolecule(panel, parent, rng) {
        const bounds = panel.bounds;
        const particle = {
          kind: "molecule",
          panel,
          x: randBetween(rng, bounds.minX + 22, bounds.maxX - 22),
          y: randBetween(rng, bounds.minY + 25, bounds.maxY - 24),
          vx: randBetween(rng, -10, 10),
          vy: randBetween(rng, -7, 7),
          angle: randBetween(rng, 0, 360),
          spin: randBetween(rng, -18, 18),
          node: null
        };
        const g = el("g", { class: "particle molecule" }, parent);
        const offsets = [
          [-8, 0, 11],
          [7, -3, 11],
          [3, 9, 9]
        ];
        offsets.forEach(([cx, cy, r]) => {
          el("circle", { cx, cy, r, fill: "url(#ionGrad)", stroke: "#62b715", "stroke-width": 1.2 }, g);
          el("circle", { cx: cx - 4, cy: cy - 4, r: 3.5, fill: "#dfff7a", opacity: 0.7 }, g);
        });
        particle.node = g;
        state.particles.push(particle);
        positionParticle(particle);
      }

      function positionParticle(particle) {
        if (particle.kind === "molecule") {
          particle.node.setAttribute("transform", `translate(${particle.x.toFixed(2)} ${particle.y.toFixed(2)}) rotate(${particle.angle.toFixed(2)})`);
        } else {
          const bob = Math.sin(particle.phase) * 1.8;
          particle.node.setAttribute("transform", `translate(${particle.x.toFixed(2)} ${(particle.y + bob).toFixed(2)})`);
        }
      }

      function updateParticles(dt) {
        if (!state.moving) return;

        state.particles.forEach((particle) => {
          const bounds = particle.panel.bounds;
          if (particle.kind === "molecule") {
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.angle += particle.spin * dt;
            if (particle.x < bounds.minX + 20 || particle.x > bounds.maxX - 20) particle.vx *= -1;
            if (particle.y < bounds.minY + 22 || particle.y > bounds.maxY - 22) particle.vy *= -1;
            particle.x = Math.max(bounds.minX + 20, Math.min(bounds.maxX - 20, particle.x));
            particle.y = Math.max(bounds.minY + 22, Math.min(bounds.maxY - 22, particle.y));
          } else {
            const dir = particle.charge === "+" ? -1 : 1;
            particle.x += dir * particle.speed * dt;
            particle.phase += dt * 5;
            if (particle.x < bounds.minX + 14) {
              particle.x = bounds.maxX - 16;
              particle.y = bounds.minY + 18 + Math.random() * (bounds.maxY - bounds.minY - 36);
            }
            if (particle.x > bounds.maxX - 14) {
              particle.x = bounds.minX + 16;
              particle.y = bounds.minY + 18 + Math.random() * (bounds.maxY - bounds.minY - 36);
            }
          }
          positionParticle(particle);
        });
      }

      function panelBrightness(panel) {
        const c = state.concentration / 100;
        if (panel.mode === "none") return 0;
        if (panel.mode === "strong") return c;
        return c * 0.38;
      }

      function updateVisualState() {
        panels.forEach((panel) => {
          const brightness = panelBrightness(panel);
          const glowOpacity = panel.mode === "strong" ? brightness * 0.95 : brightness * 0.9;
          const coreOpacity = panel.mode === "strong" ? brightness * 0.78 : brightness * 0.45;
          panel.bulbGlow.setAttribute("opacity", glowOpacity.toFixed(2));
          panel.bulbCore.setAttribute("opacity", coreOpacity.toFixed(2));
          panel.bulbGlow.setAttribute("r", (34 + brightness * 31).toFixed(1));
          panel.group.classList.toggle("active", panel.id === state.selected);
        });

        concentrationValue.textContent = `${state.concentration}%`;
        const selectedPanel = panels.find((panel) => panel.id === state.selected);
        const ionCount = state.particles.filter((particle) => particle.panel.id === state.selected && particle.kind === "ion").length;
        const moleculeCount = state.particles.filter((particle) => particle.panel.id === state.selected && particle.kind === "molecule").length;
        const brightnessPercent = Math.round(panelBrightness(selectedPanel) * 100);
        readout.innerHTML = `<strong>${selectedPanel.title}: ${selectedPanel.subtitle}</strong>${selectedPanel.conductivityLabel}<br>bulb output ${brightnessPercent}%, ions ${ionCount}, neutral clusters ${moleculeCount}`;
      }

      function animate(time) {
        const dt = Math.min(0.05, (time - state.lastFrame) / 1000);
        state.lastFrame = time;
        updateParticles(dt);
        requestAnimationFrame(animate);
      }

      panels.forEach(apparatus);
      rebuildParticles();
      updateVisualState();

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.solution;
          buttons.forEach((candidate) => {
            candidate.setAttribute("aria-pressed", String(candidate === button));
          });
          updateVisualState();
        });
      });

      concentrationSlider.addEventListener("input", () => {
        state.concentration = Number(concentrationSlider.value);
        rebuildParticles();
      });

      motionToggle.addEventListener("click", () => {
        state.moving = !state.moving;
        motionToggle.textContent = state.moving ? "pause motion" : "resume motion";
        motionToggle.setAttribute("aria-pressed", String(state.moving));
      });

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        state.moving = false;
        motionToggle.textContent = "resume motion";
        motionToggle.setAttribute("aria-pressed", "false");
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
