<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spherical wedge volume element</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #64707a;
      --panel: #ffffff;
      --line: #d9e0e6;
      --soft: #f5f7f9;
      --accent: #18716b;
      --orange: #d66f2c;
      --green: #2e8b65;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(180deg, #fbfcfd 0%, #eef3f6 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 0;
    }

    .stage {
      position: relative;
      min-height: 640px;
      padding: 18px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      min-height: 560px;
      border: 1px solid #dfe6eb;
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.48) 38%, rgba(236, 242, 246, 0.58) 100%);
      box-shadow: 0 18px 42px rgba(31, 47, 59, 0.12);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 560px;
    }

    .caption-chip {
      position: absolute;
      left: 18px;
      top: 18px;
      max-width: min(390px, calc(100% - 36px));
      padding: 10px 12px;
      border: 1px solid rgba(25, 54, 69, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(7px);
      box-shadow: 0 10px 28px rgba(30, 48, 59, 0.08);
      pointer-events: none;
    }

    .caption-chip h1 {
      margin: 0 0 4px;
      font-size: clamp(17px, 1.7vw, 22px);
      line-height: 1.08;
      font-weight: 760;
      letter-spacing: 0;
    }

    .caption-chip p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.86);
      border-left: 1px solid var(--line);
      box-shadow: -16px 0 32px rgba(38, 55, 66, 0.06);
    }

    .group {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 13px 13px 12px;
    }

    .group h2 {
      margin: 0 0 11px;
      font-size: 13px;
      line-height: 1;
      color: #2b3a42;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .control {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 64px;
      gap: 10px;
      align-items: center;
      min-height: 35px;
      margin: 8px 0;
    }

    .control label {
      font-size: 15px;
      font-weight: 680;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1;
      white-space: nowrap;
    }

    .value {
      min-width: 58px;
      text-align: right;
      color: #2f4856;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .readout {
      border: 1px solid rgba(24, 113, 107, 0.25);
      background: linear-gradient(180deg, rgba(235, 249, 246, 0.96), rgba(255, 255, 255, 0.96));
      border-radius: 8px;
      padding: 13px;
    }

    .readout .formula {
      color: #183339;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.18;
      margin-bottom: 7px;
    }

    .readout .numbers {
      color: #395563;
      font-size: 12px;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }

    .legend {
      display: grid;
      gap: 8px;
      color: #3e515b;
      font-size: 12px;
      line-height: 1.35;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 18px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .swatch.green { background: rgba(83, 168, 126, 0.72); }
    .swatch.gold { background: rgba(238, 192, 74, 0.68); }
    .swatch.orange { background: rgba(224, 112, 53, 0.66); }
    .swatch.ghost { background: rgba(178, 192, 201, 0.28); }

    @media (max-width: 980px) {
      .figure-shell {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 520px;
        padding: 12px 12px 0;
      }

      .canvas-wrap,
      canvas {
        min-height: 500px;
      }

      .controls {
        border-left: 0;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .readout {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 640px) {
      .stage {
        min-height: 440px;
      }

      .canvas-wrap,
      canvas {
        min-height: 430px;
      }

      .caption-chip {
        left: 10px;
        top: 10px;
        padding: 9px 10px;
      }

      .caption-chip p {
        display: none;
      }

      .controls {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .control {
        grid-template-columns: 48px minmax(0, 1fr) 58px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell">
    <section class="stage" aria-label="Interactive three-dimensional spherical wedge">
      <div class="canvas-wrap">
        <canvas id="scene" aria-label="Transparent spherical coordinate volume element"></canvas>
        <div class="caption-chip">
          <h1>Spherical wedge volume element</h1>
          <p>Six bounds: two spheres, two vertical half-planes, and two cones.</p>
        </div>
      </div>
    </section>

    <aside class="controls" aria-label="Spherical coordinate controls">
      <section class="group">
        <h2>Radial bounds</h2>
        <div class="control">
          <label for="rho1">ρ₁</label>
          <input id="rho1" type="range" min="0.80" max="3.20" step="0.01">
          <output id="rho1Out" class="value"></output>
        </div>
        <div class="control">
          <label for="rho2">ρ₂</label>
          <input id="rho2" type="range" min="1.00" max="3.80" step="0.01">
          <output id="rho2Out" class="value"></output>
        </div>
        <div class="control">
          <label for="dr">dρ</label>
          <input id="dr" type="range" min="0.15" max="1.60" step="0.01">
          <output id="drOut" class="value"></output>
        </div>
      </section>

      <section class="group">
        <h2>Azimuthal bounds</h2>
        <div class="control">
          <label for="theta1">θ₁</label>
          <input id="theta1" type="range" min="0" max="82" step="1">
          <output id="theta1Out" class="value"></output>
        </div>
        <div class="control">
          <label for="theta2">θ₂</label>
          <input id="theta2" type="range" min="6" max="96" step="1">
          <output id="theta2Out" class="value"></output>
        </div>
        <div class="control">
          <label for="dtheta">dθ</label>
          <input id="dtheta" type="range" min="6" max="66" step="1">
          <output id="dthetaOut" class="value"></output>
        </div>
      </section>

      <section class="group">
        <h2>Polar bounds</h2>
        <div class="control">
          <label for="phi1">φ₁</label>
          <input id="phi1" type="range" min="10" max="76" step="1">
          <output id="phi1Out" class="value"></output>
        </div>
        <div class="control">
          <label for="phi2">φ₂</label>
          <input id="phi2" type="range" min="18" max="88" step="1">
          <output id="phi2Out" class="value"></output>
        </div>
        <div class="control">
          <label for="dphi">dφ</label>
          <input id="dphi" type="range" min="6" max="56" step="1">
          <output id="dphiOut" class="value"></output>
        </div>
      </section>

      <section class="readout" aria-live="polite">
        <div class="formula">dV = ρ² sinφ dρ dθ dφ</div>
        <div id="volumeOut" class="numbers"></div>
      </section>

      <section class="group legend" aria-label="Surface legend">
        <div class="legend-row"><span class="swatch green"></span><span>outer spherical face ρ = ρ₂</span></div>
        <div class="legend-row"><span class="swatch gold"></span><span>inner and conical faces</span></div>
        <div class="legend-row"><span class="swatch orange"></span><span>azimuthal half-plane faces</span></div>
        <div class="legend-row"><span class="swatch ghost"></span><span>transparent bounding surfaces</span></div>
      </section>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const state = {
        rho1: 1.65,
        rho2: 2.45,
        theta1: 22,
        theta2: 50,
        phi1: 35,
        phi2: 58
      };

      const bounds = {
        rho1: [0.80, 3.20],
        rho2: [1.00, 3.80],
        theta1: [0, 82],
        theta2: [6, 96],
        phi1: [10, 76],
        phi2: [18, 88]
      };

      const ids = [
        "rho1", "rho2", "theta1", "theta2", "phi1", "phi2",
        "dr", "dtheta", "dphi"
      ];
      const controls = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));
      const outputs = Object.fromEntries(ids.map((id) => [id, document.getElementById(`${id}Out`)]));
      const volumeOut = document.getElementById("volumeOut");

      let view = { width: 0, height: 0, scale: 1, originX: 0, originY: 0 };

      const deg = Math.PI / 180;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const lerp = (a, b, t) => a + (b - a) * t;

      function point(rho, thetaDeg, phiDeg) {
        const theta = thetaDeg * deg;
        const phi = phiDeg * deg;
        const sp = Math.sin(phi);
        return {
          x: rho * sp * Math.cos(theta),
          y: rho * sp * Math.sin(theta),
          z: rho * Math.cos(phi)
        };
      }

      function project(p) {
        const sx = p.y * 0.92 - p.x * 0.58;
        const sy = -p.z * 0.98 + p.x * 0.52 + p.y * 0.10;
        return {
          x: view.originX + sx * view.scale,
          y: view.originY + sy * view.scale,
          depth: p.x * 0.54 + p.y * 0.36 - p.z * 0.18
        };
      }

      function clearCanvas() {
        const g = ctx.createLinearGradient(0, 0, 0, view.height);
        g.addColorStop(0, "#fbfdfe");
        g.addColorStop(1, "#edf3f6");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, view.width, view.height);

        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = "#edf2f5";
        ctx.lineWidth = 1;
        const step = Math.max(32, Math.round(view.scale * 0.62));
        for (let x = view.originX % step; x < view.width; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, view.height);
          ctx.stroke();
        }
        for (let y = view.originY % step; y < view.height; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(view.width, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function addSurface(polys, u0, u1, v0, v1, uSteps, vSteps, fn, style) {
        for (let i = 0; i < uSteps; i += 1) {
          const ua = lerp(u0, u1, i / uSteps);
          const ub = lerp(u0, u1, (i + 1) / uSteps);
          for (let j = 0; j < vSteps; j += 1) {
            const va = lerp(v0, v1, j / vSteps);
            const vb = lerp(v0, v1, (j + 1) / vSteps);
            const pts3 = [fn(ua, va), fn(ub, va), fn(ub, vb), fn(ua, vb)];
            const pts2 = pts3.map(project);
            polys.push({
              pts2,
              depth: pts2.reduce((sum, p) => sum + p.depth, 0) / pts2.length,
              fill: style.fill,
              stroke: style.stroke,
              lineWidth: style.lineWidth || 1
            });
          }
        }
      }

      function drawPolygon(poly) {
        ctx.beginPath();
        poly.pts2.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = poly.fill;
        ctx.fill();
        if (poly.stroke) {
          ctx.strokeStyle = poly.stroke;
          ctx.lineWidth = poly.lineWidth;
          ctx.stroke();
        }
      }

      function pathFrom3D(points3) {
        const points2 = points3.map(project);
        ctx.beginPath();
        points2.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        return points2;
      }

      function drawCurve(points3, color = "#25282b", width = 2, dash = []) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.setLineDash(dash);
        pathFrom3D(points3);
        ctx.stroke();
        ctx.restore();
      }

      function drawArrowhead(a, b, color = "#25282b", size = 10) {
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - size * Math.cos(angle - Math.PI / 6), b.y - size * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(b.x - size * Math.cos(angle + Math.PI / 6), b.y - size * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawArrow3D(from3, to3, color, width, label, labelOffset = { x: 0, y: 0 }) {
        const a = project(from3);
        const b = project(to3);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        drawArrowhead(a, b, color, 13);
        if (label) {
          drawText(label, b.x + labelOffset.x, b.y + labelOffset.y, {
            size: 34,
            family: "Georgia, 'Times New Roman', serif",
            italic: true,
            color
          });
        }
        ctx.restore();
      }

      function drawText(text, x, y, opt = {}) {
        const size = opt.size || 14;
        const family = opt.family || "Inter, system-ui, sans-serif";
        const style = opt.italic ? "italic " : "";
        const weight = opt.weight ? `${opt.weight} ` : "";
        ctx.save();
        ctx.font = `${style}${weight}${size}px ${family}`;
        ctx.textAlign = opt.align || "center";
        ctx.textBaseline = opt.baseline || "middle";
        const metrics = ctx.measureText(text);
        const pad = 8;
        let xx = clamp(x, pad + metrics.width / 2, view.width - pad - metrics.width / 2);
        let yy = clamp(y, pad + size / 2, view.height - pad - size / 2);
        if (opt.backdrop !== false) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
          const bx = ctx.textAlign === "left" ? xx - 3 : xx - metrics.width / 2 - 5;
          ctx.fillRect(bx, yy - size * 0.56, metrics.width + 10, size * 1.12);
        }
        ctx.fillStyle = opt.color || "#202124";
        ctx.fillText(text, xx, yy);
        ctx.restore();
      }

      function phiArcPoints(rho, theta, phiA, phiB, steps) {
        const pts = [];
        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          pts.push(point(rho, theta, lerp(phiA, phiB, t)));
        }
        return pts;
      }

      function thetaArcPoints(rho, thetaA, thetaB, phi, steps) {
        const pts = [];
        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          pts.push(point(rho, lerp(thetaA, thetaB, t), phi));
        }
        return pts;
      }

      function drawArcArrow(points3, label, labelAt = 0.58, labelShift = { x: 0, y: 0 }) {
        const pts2 = points3.map(project);
        ctx.save();
        ctx.strokeStyle = "#232528";
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        pts2.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        drawArrowhead(pts2[pts2.length - 3], pts2[pts2.length - 1], "#232528", 10);
        ctx.restore();
        const idx = clamp(Math.round((pts2.length - 1) * labelAt), 0, pts2.length - 1);
        drawText(label, pts2[idx].x + labelShift.x, pts2[idx].y + labelShift.y, {
          size: 31,
          family: "Georgia, 'Times New Roman', serif",
          italic: true
        });
      }

      function drawDoubleArrow(a, b, color = "#25282b") {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        drawArrowhead(a, b, color, 9);
        drawArrowhead(b, a, color, 9);
        ctx.restore();
      }

      function drawRadiusDimension(rho, label, offsetX) {
        const base = project({ x: 0, y: 0, z: 0 });
        const top = project({ x: 0, y: 0, z: rho });
        const a = { x: base.x + offsetX, y: base.y };
        const b = { x: top.x + offsetX, y: top.y };
        ctx.save();
        ctx.strokeStyle = "#24262a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(base.x - 8, base.y);
        ctx.lineTo(a.x, a.y);
        ctx.moveTo(top.x - 8, top.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
        drawDoubleArrow(a, b);
        drawText(label, a.x - 20, (a.y + b.y) / 2, {
          size: 31,
          family: "Georgia, 'Times New Roman', serif",
          italic: true
        });
      }

      function buildScenePolygons() {
        const { rho1, rho2, theta1, theta2, phi1, phi2 } = state;
        const polys = [];

        const ghost = {
          fill: "rgba(173, 188, 198, 0.18)",
          stroke: "rgba(96, 111, 121, 0.16)",
          lineWidth: 0.8
        };
        const ghostWarm = {
          fill: "rgba(217, 225, 229, 0.15)",
          stroke: "rgba(96, 111, 121, 0.14)",
          lineWidth: 0.8
        };

        addSurface(polys, theta1, theta2, 0.5, phi2, 14, 13, (t, p) => point(rho2, t, p), ghost, "outer shell");
        addSurface(polys, theta1, theta2, 0.5, phi2, 10, 11, (t, p) => point(rho1, t, p), ghostWarm, "inner shell");
        addSurface(polys, 0.02, rho2, 0.5, phi2, 11, 11, (r, p) => point(r, theta1, p), ghostWarm, "theta plane 1");
        addSurface(polys, 0.02, rho2, 0.5, phi2, 11, 11, (r, p) => point(r, theta2, p), ghostWarm, "theta plane 2");
        addSurface(polys, theta1, theta2, 0.02, rho2, 13, 12, (t, r) => point(r, t, phi1), ghostWarm, "cone phi 1");
        addSurface(polys, theta1, theta2, 0.02, rho2, 13, 12, (t, r) => point(r, t, phi2), ghostWarm, "cone phi 2");

        addSurface(polys, theta1, theta2, phi1, phi2, 8, 8, (t, p) => point(rho2, t, p), {
          fill: "rgba(74, 151, 113, 0.67)",
          stroke: "rgba(34, 92, 68, 0.28)",
          lineWidth: 1
        });
        addSurface(polys, theta1, theta2, phi1, phi2, 8, 8, (t, p) => point(rho1, t, p), {
          fill: "rgba(235, 199, 75, 0.48)",
          stroke: "rgba(129, 112, 39, 0.24)",
          lineWidth: 1
        });
        addSurface(polys, rho1, rho2, phi1, phi2, 5, 8, (r, p) => point(r, theta1, p), {
          fill: "rgba(243, 150, 55, 0.62)",
          stroke: "rgba(156, 78, 29, 0.26)",
          lineWidth: 1
        });
        addSurface(polys, rho1, rho2, phi1, phi2, 5, 8, (r, p) => point(r, theta2, p), {
          fill: "rgba(224, 91, 49, 0.54)",
          stroke: "rgba(142, 58, 34, 0.24)",
          lineWidth: 1
        });
        addSurface(polys, theta1, theta2, rho1, rho2, 8, 5, (t, r) => point(r, t, phi1), {
          fill: "rgba(251, 191, 65, 0.58)",
          stroke: "rgba(164, 118, 32, 0.28)",
          lineWidth: 1
        });
        addSurface(polys, theta1, theta2, rho1, rho2, 8, 5, (t, r) => point(r, t, phi2), {
          fill: "rgba(217, 181, 70, 0.50)",
          stroke: "rgba(133, 103, 33, 0.24)",
          lineWidth: 1
        });

        return polys;
      }

      function drawBoundaryCurves() {
        const { rho1, rho2, theta1, theta2, phi1, phi2 } = state;
        const dark = "rgba(39, 42, 44, 0.84)";
        const soft = "rgba(52, 67, 76, 0.42)";
        const steps = 32;

        [rho1, rho2].forEach((r) => {
          [phi1, phi2].forEach((p) => drawCurve(thetaArcPoints(r, theta1, theta2, p, steps), dark, 1.7));
          [theta1, theta2].forEach((t) => drawCurve(phiArcPoints(r, t, phi1, phi2, steps), dark, 1.7));
        });
        [theta1, theta2].forEach((t) => {
          [phi1, phi2].forEach((p) => {
            const pts = [];
            for (let i = 0; i <= steps; i += 1) pts.push(point(lerp(rho1, rho2, i / steps), t, p));
            drawCurve(pts, dark, 1.7);
          });
        });

        [phi1, phi2].forEach((p) => {
          drawCurve(thetaArcPoints(rho2, theta1, theta2, p, steps), soft, 1.4, [5, 5]);
        });
        [theta1, theta2].forEach((t) => {
          drawCurve(phiArcPoints(rho2, t, 0.5, phi2, steps), soft, 1.3, [5, 5]);
        });
      }

      function drawAnnotations() {
        const { rho1, rho2, theta1, theta2, phi1, phi2 } = state;
        const axisLen = Math.max(3.95, rho2 + 0.42);
        const axisColor = "#202124";

        drawArrow3D({ x: 0, y: 0, z: 0 }, { x: axisLen, y: 0, z: 0 }, axisColor, 2.7, "x", { x: -8, y: 28 });
        drawArrow3D({ x: 0, y: 0, z: 0 }, { x: 0, y: axisLen, z: 0 }, axisColor, 2.7, "y", { x: 22, y: -6 });
        drawArrow3D({ x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: axisLen }, axisColor, 2.7, "z", { x: 28, y: -10 });

        drawRadiusDimension(rho2, "ρ₂", -96);
        drawRadiusDimension(rho1, "ρ₁", -54);

        const baseR = Math.max(1.0, rho2 * 0.55);
        const thetaArc1 = thetaArcPoints(baseR * 0.82, 0, theta1, 90, 28);
        const thetaArc2 = thetaArcPoints(baseR * 1.10, 0, theta2, 90, 32);
        drawArcArrow(thetaArc1, "θ₁", 0.72, { x: 8, y: 12 });
        drawArcArrow(thetaArc2, "θ₂", 0.62, { x: -2, y: 23 });

        [theta1, theta2].forEach((t) => {
          drawCurve([point(0, t, 90), point(rho2 * 1.10, t, 90)], "rgba(35, 37, 40, 0.58)", 1.8);
        });

        const thetaMid = (theta1 + theta2) / 2;
        const phiArcR1 = rho2 * 1.10;
        const phiArcR2 = rho2 * 1.27;
        const phiArc1 = phiArcPoints(phiArcR1, thetaMid, 0, phi1, 34);
        const phiArc2 = phiArcPoints(phiArcR2, thetaMid, 0, phi2, 38);
        drawArcArrow(phiArc1, "φ₁", 0.72, { x: 12, y: -16 });
        drawArcArrow(phiArc2, "φ₂", 0.68, { x: 18, y: -12 });

        [phi1, phi2].forEach((p) => {
          drawCurve([point(0, thetaMid, p), point(rho2 * 1.33, thetaMid, p)], "rgba(35, 37, 40, 0.72)", 2);
        });

        const labelPoint = project(point(rho2 * 1.06, theta2, (phi1 + phi2) / 2));
        drawText("ρ = ρ₂", labelPoint.x + 38, labelPoint.y - 8, {
          size: 15,
          family: "Georgia, 'Times New Roman', serif",
          italic: true,
          color: "#29533f"
        });

        const coneLabel = project(point(rho2 * 0.82, thetaMid, phi2));
        drawText("φ bounds", coneLabel.x + 48, coneLabel.y + 28, {
          size: 13,
          color: "#4d5d66",
          backdrop: true
        });
      }

      function draw() {
        const parent = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const width = Math.max(320, Math.floor(parent.width));
        const height = Math.max(380, Math.floor(parent.height));
        if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        view.width = width;
        view.height = height;
        view.scale = Math.min(width / 8.15, height / 7.05);
        view.originX = width * (width < 560 ? 0.47 : 0.43);
        view.originY = height * (width < 560 ? 0.69 : 0.68);

        clearCanvas();

        const polys = buildScenePolygons();
        polys.sort((a, b) => a.depth - b.depth);
        polys.forEach(drawPolygon);
        drawBoundaryCurves();
        drawAnnotations();
      }

      function formatDegree(value) {
        return `${Math.round(value)}°`;
      }

      function enforceBounds(changed) {
        state.rho1 = clamp(state.rho1, bounds.rho1[0], bounds.rho1[1]);
        state.rho2 = clamp(state.rho2, bounds.rho2[0], bounds.rho2[1]);
        if (state.rho2 - state.rho1 < 0.15) {
          if (changed === "rho2") state.rho1 = state.rho2 - 0.15;
          else state.rho2 = state.rho1 + 0.15;
        }
        state.rho1 = clamp(state.rho1, bounds.rho1[0], bounds.rho1[1]);
        state.rho2 = clamp(state.rho2, bounds.rho2[0], bounds.rho2[1]);

        state.theta1 = clamp(state.theta1, bounds.theta1[0], bounds.theta1[1]);
        state.theta2 = clamp(state.theta2, bounds.theta2[0], bounds.theta2[1]);
        if (state.theta2 - state.theta1 < 6) {
          if (changed === "theta2") state.theta1 = state.theta2 - 6;
          else state.theta2 = state.theta1 + 6;
        }
        state.theta1 = clamp(state.theta1, bounds.theta1[0], bounds.theta1[1]);
        state.theta2 = clamp(state.theta2, bounds.theta2[0], bounds.theta2[1]);

        state.phi1 = clamp(state.phi1, bounds.phi1[0], bounds.phi1[1]);
        state.phi2 = clamp(state.phi2, bounds.phi2[0], bounds.phi2[1]);
        if (state.phi2 - state.phi1 < 6) {
          if (changed === "phi2") state.phi1 = state.phi2 - 6;
          else state.phi2 = state.phi1 + 6;
        }
        state.phi1 = clamp(state.phi1, bounds.phi1[0], bounds.phi1[1]);
        state.phi2 = clamp(state.phi2, bounds.phi2[0], bounds.phi2[1]);
      }

      function syncControls() {
        controls.rho1.value = state.rho1.toFixed(2);
        controls.rho2.value = state.rho2.toFixed(2);
        controls.theta1.value = Math.round(state.theta1);
        controls.theta2.value = Math.round(state.theta2);
        controls.phi1.value = Math.round(state.phi1);
        controls.phi2.value = Math.round(state.phi2);

        const dr = state.rho2 - state.rho1;
        const dtheta = state.theta2 - state.theta1;
        const dphi = state.phi2 - state.phi1;
        controls.dr.value = dr.toFixed(2);
        controls.dtheta.value = Math.round(dtheta);
        controls.dphi.value = Math.round(dphi);

        outputs.rho1.value = state.rho1.toFixed(2);
        outputs.rho2.value = state.rho2.toFixed(2);
        outputs.theta1.value = formatDegree(state.theta1);
        outputs.theta2.value = formatDegree(state.theta2);
        outputs.phi1.value = formatDegree(state.phi1);
        outputs.phi2.value = formatDegree(state.phi2);
        outputs.dr.value = dr.toFixed(2);
        outputs.dtheta.value = formatDegree(dtheta);
        outputs.dphi.value = formatDegree(dphi);

        const rho = (state.rho1 + state.rho2) / 2;
        const phi = ((state.phi1 + state.phi2) / 2) * deg;
        const dThetaRad = dtheta * deg;
        const dPhiRad = dphi * deg;
        const approx = rho * rho * Math.sin(phi) * dr * dThetaRad * dPhiRad;
        const exact = ((state.rho2 ** 3 - state.rho1 ** 3) / 3) *
          (Math.cos(state.phi1 * deg) - Math.cos(state.phi2 * deg)) * dThetaRad;

        volumeOut.innerHTML =
          `Δρ = ${dr.toFixed(2)}, Δθ = ${dThetaRad.toFixed(3)} rad, Δφ = ${dPhiRad.toFixed(3)} rad<br>` +
          `midpoint estimate: ${approx.toFixed(4)} cubic units<br>` +
          `finite wedge volume: ${exact.toFixed(4)} cubic units`;
      }

      function handleBoundInput(id) {
        state[id] = Number(controls[id].value);
        enforceBounds(id);
        syncControls();
        draw();
      }

      function handleIncrementInput(id) {
        if (id === "dr") {
          const maxDr = bounds.rho2[1] - state.rho1;
          state.rho2 = state.rho1 + clamp(Number(controls.dr.value), 0.15, maxDr);
        } else if (id === "dtheta") {
          const maxDTheta = bounds.theta2[1] - state.theta1;
          state.theta2 = state.theta1 + clamp(Number(controls.dtheta.value), 6, maxDTheta);
        } else if (id === "dphi") {
          const maxDPhi = bounds.phi2[1] - state.phi1;
          state.phi2 = state.phi1 + clamp(Number(controls.dphi.value), 6, maxDPhi);
        }
        enforceBounds(id);
        syncControls();
        draw();
      }

      ["rho1", "rho2", "theta1", "theta2", "phi1", "phi2"].forEach((id) => {
        controls[id].addEventListener("input", () => handleBoundInput(id));
      });
      ["dr", "dtheta", "dphi"].forEach((id) => {
        controls[id].addEventListener("input", () => handleIncrementInput(id));
      });

      window.addEventListener("resize", draw);
      enforceBounds();
      syncControls();
      draw();
    })();
  </script>
</body>
</html>
