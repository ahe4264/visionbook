<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snell's Law Refraction Geometry</title>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #5d6673;
      --panel: #ffffff;
      --line: #050505;
      --blue: #0b45ff;
      --normal: #079cff;
      --soft-blue: #eaf4ff;
      --soft-cyan: #f0fbff;
      --warning: #a84312;
      --shadow: 0 18px 44px rgba(21, 33, 52, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5f7fb;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .figure-shell {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: stretch;
    }

    .stage,
    .controls {
      background: var(--panel);
      border: 1px solid #dce3ec;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      min-width: 0;
      padding: 10px;
    }

    svg {
      display: block;
      width: 100%;
      height: min(78vh, 760px);
      min-height: 500px;
      touch-action: none;
      user-select: none;
      background: #ffffff;
      border-radius: 6px;
    }

    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .control-group {
      display: grid;
      gap: 8px;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #2b313b;
      font-size: 0.95rem;
      font-weight: 650;
    }

    output {
      min-width: 4.7em;
      color: #111827;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .readout {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #dbe5f0;
      border-radius: 8px;
      background: #f9fbfe;
      font-size: 0.95rem;
      line-height: 1.35;
    }

    .equation {
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .status {
      color: var(--muted);
    }

    .status.warning {
      color: var(--warning);
      font-weight: 750;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #ffffff;
      color: #172033;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--blue);
      outline: 2px solid rgba(11, 69, 255, 0.16);
      outline-offset: 1px;
    }

    .region-fill.upper {
      fill: var(--soft-blue);
      opacity: 0.42;
    }

    .region-fill.lower {
      fill: var(--soft-cyan);
      opacity: 0.55;
    }

    .interface {
      stroke: var(--line);
      stroke-width: 7;
      stroke-linecap: square;
    }

    .normal {
      stroke: var(--normal);
      stroke-width: 3.2;
      stroke-linecap: round;
    }

    .ray {
      stroke: var(--blue);
      stroke-width: 7;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .ray.reflected {
      stroke-dasharray: 0;
    }

    .ray.hidden-ray {
      opacity: 0;
    }

    .angle-arc {
      stroke: #222a35;
      stroke-width: 2.2;
      fill: none;
    }

    .critical-arc {
      stroke: var(--warning);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 6 5;
      opacity: 0;
    }

    .critical-arc.visible {
      opacity: 1;
    }

    .right-angle {
      stroke: #222;
      stroke-width: 1.3;
      fill: rgba(255, 255, 255, 0.62);
    }

    .figure-label {
      fill: #20242b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 39px;
      letter-spacing: 0;
    }

    .small-label {
      font-size: 24px;
    }

    .ray-label {
      font-size: 31px;
      fill: #111;
    }

    .angle-label {
      font-size: 29px;
      font-weight: 650;
      fill: #252a32;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .handle {
      fill: #ffffff;
      stroke: var(--blue);
      stroke-width: 4;
      cursor: grab;
      filter: drop-shadow(0 2px 3px rgba(20, 36, 70, 0.25));
    }

    .handle:active {
      cursor: grabbing;
    }

    .handle-halo {
      fill: rgba(11, 69, 255, 0.08);
      stroke: none;
      cursor: grab;
    }

    .tir-badge {
      opacity: 0;
    }

    .tir-badge.visible {
      opacity: 1;
    }

    .tir-badge rect {
      fill: #fff4ed;
      stroke: #f1a36e;
      stroke-width: 1.4;
      rx: 7;
    }

    .tir-badge text {
      fill: var(--warning);
      font-size: 20px;
      font-weight: 750;
    }

    @media (max-width: 860px) {
      body {
        padding: 10px;
      }

      .figure-shell {
        grid-template-columns: 1fr;
      }

      .controls {
        padding: 14px;
      }

      svg {
        height: 68vh;
        min-height: 420px;
      }
    }

    @media (max-width: 520px) {
      .stage {
        padding: 6px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }

      svg {
        min-height: 390px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive Snell's law figure">
    <section class="stage" aria-label="Refraction diagram">
      <svg id="snellSvg" viewBox="0 0 900 650" role="img" aria-labelledby="figTitle figDesc">
        <title id="figTitle">Snell's law geometry at a planar interface</title>
        <desc id="figDesc">A blue incident ray crosses a horizontal interface between media n1 and n2. The incident angle, refracted angle, surface normal, and total internal reflection condition update interactively.</desc>

        <rect class="region-fill upper" x="0" y="0" width="900" height="320"></rect>
        <rect class="region-fill lower" x="0" y="320" width="900" height="330"></rect>

        <line class="normal" id="normalLine" x1="450" y1="78" x2="450" y2="590"></line>
        <line class="interface" x1="45" y1="320" x2="855" y2="320"></line>
        <path class="right-angle" d="M 450 283 L 487 283 L 487 320 L 450 320 Z"></path>

        <path class="angle-arc" id="theta1Arc"></path>
        <path class="angle-arc" id="theta2Arc"></path>
        <path class="critical-arc" id="criticalArc"></path>

        <path class="ray" id="incidentRay"></path>
        <path class="ray" id="refractedRay"></path>
        <path class="ray reflected hidden-ray" id="reflectedRay"></path>

        <g class="tir-badge" id="tirBadge">
          <rect x="535" y="348" width="235" height="39"></rect>
          <text x="552" y="374">total internal reflection</text>
        </g>

        <text class="figure-label" x="145" y="276">n<tspan baseline-shift="sub" font-size="65%">1</tspan></text>
        <text class="figure-label" x="145" y="390">n<tspan baseline-shift="sub" font-size="65%">2</tspan></text>
        <text class="figure-label small-label" x="468" y="88">surface</text>
        <text class="figure-label small-label" x="468" y="126">normal</text>
        <text class="ray-label" id="rayDirectionLabel">ray direction</text>
        <text class="angle-label" id="theta1Label"></text>
        <text class="angle-label" id="theta2Label"></text>
        <text class="angle-label" id="criticalLabel" style="fill:#a84312;font-size:20px;"></text>

        <circle class="handle-halo" id="handleHalo" r="24"></circle>
        <circle class="handle" id="dragHandle" r="10" tabindex="0" role="slider" aria-label="Incident angle" aria-valuemin="2" aria-valuemax="88"></circle>
      </svg>
    </section>

    <aside class="controls" aria-label="Snell's law controls">
      <h1 class="control-title">Snell's Law</h1>

      <div class="control-group">
        <label for="thetaInput">&theta;<sub>1</sub> incident angle <output id="thetaValue">39.0&deg;</output></label>
        <input id="thetaInput" type="range" min="2" max="88" step="0.1" value="39" aria-label="Incident angle theta one">
      </div>

      <div class="control-group">
        <label for="n1Input">n<sub>1</sub> upper medium <output id="n1Value">1.00</output></label>
        <input id="n1Input" type="range" min="1" max="2.2" step="0.01" value="1">
      </div>

      <div class="control-group">
        <label for="n2Input">n<sub>2</sub> lower medium <output id="n2Value">1.50</output></label>
        <input id="n2Input" type="range" min="1" max="2.2" step="0.01" value="1.5">
      </div>

      <div class="readout" aria-live="polite">
        <div class="equation" id="equationReadout">n1 sin(theta1) = n2 sin(theta2)</div>
        <div class="status" id="statusReadout"></div>
        <div class="status" id="criticalReadout"></div>
      </div>

      <div class="button-row" aria-label="Preset media">
        <button type="button" data-preset="airGlass">air to glass</button>
        <button type="button" data-preset="glassAir">glass to air</button>
        <button type="button" data-preset="nearCritical">near critical</button>
        <button type="button" data-preset="reset">reset</button>
      </div>
    </aside>
  </main>

  <script>
    (() => {
      'use strict';

      const svg = document.getElementById('snellSvg');
      const origin = { x: 450, y: 320 };
      const rayLength = 445;
      const arcR1 = 108;
      const arcR2 = 106;
      const DEG = Math.PI / 180;
      const RAD = 180 / Math.PI;

      const state = {
        theta1: 39,
        n1: 1,
        n2: 1.5
      };

      const el = {
        incidentRay: document.getElementById('incidentRay'),
        refractedRay: document.getElementById('refractedRay'),
        reflectedRay: document.getElementById('reflectedRay'),
        theta1Arc: document.getElementById('theta1Arc'),
        theta2Arc: document.getElementById('theta2Arc'),
        criticalArc: document.getElementById('criticalArc'),
        theta1Label: document.getElementById('theta1Label'),
        theta2Label: document.getElementById('theta2Label'),
        criticalLabel: document.getElementById('criticalLabel'),
        rayDirectionLabel: document.getElementById('rayDirectionLabel'),
        dragHandle: document.getElementById('dragHandle'),
        handleHalo: document.getElementById('handleHalo'),
        tirBadge: document.getElementById('tirBadge'),
        thetaInput: document.getElementById('thetaInput'),
        n1Input: document.getElementById('n1Input'),
        n2Input: document.getElementById('n2Input'),
        thetaValue: document.getElementById('thetaValue'),
        n1Value: document.getElementById('n1Value'),
        n2Value: document.getElementById('n2Value'),
        equationReadout: document.getElementById('equationReadout'),
        statusReadout: document.getElementById('statusReadout'),
        criticalReadout: document.getElementById('criticalReadout')
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function fmt(value, digits = 1) {
        return Number(value).toFixed(digits);
      }

      function upperPoint(thetaDeg, length) {
        const a = thetaDeg * DEG;
        return {
          x: origin.x - length * Math.sin(a),
          y: origin.y - length * Math.cos(a)
        };
      }

      function lowerPoint(thetaDeg, length) {
        const a = thetaDeg * DEG;
        return {
          x: origin.x + length * Math.sin(a),
          y: origin.y + length * Math.cos(a)
        };
      }

      function reflectedPoint(thetaDeg, length) {
        const a = thetaDeg * DEG;
        return {
          x: origin.x + length * Math.sin(a),
          y: origin.y - length * Math.cos(a)
        };
      }

      function linePath(a, b) {
        return `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
      }

      function arcPath(thetaDeg, radius, side) {
        const theta = clamp(thetaDeg, 0.1, 89.8);
        const steps = Math.max(8, Math.ceil(theta / 4));
        const points = [];

        for (let i = 0; i <= steps; i += 1) {
          const a = (theta * i / steps) * DEG;
          const x = side === 'upper'
            ? origin.x - radius * Math.sin(a)
            : origin.x + radius * Math.sin(a);
          const y = side === 'upper'
            ? origin.y - radius * Math.cos(a)
            : origin.y + radius * Math.cos(a);
          points.push(`${x.toFixed(2)} ${y.toFixed(2)}`);
        }

        return `M ${points.join(' L ')}`;
      }

      function textAtUpper(thetaDeg, radius) {
        const a = thetaDeg * DEG / 2;
        return {
          x: origin.x - radius * Math.sin(a) - 12,
          y: origin.y - radius * Math.cos(a) + 8
        };
      }

      function textAtLower(thetaDeg, radius) {
        const a = thetaDeg * DEG / 2;
        return {
          x: origin.x + radius * Math.sin(a) + 10,
          y: origin.y + radius * Math.cos(a) + 10
        };
      }

      function svgPointFromEvent(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function setThetaFromPoint(point) {
        const dx = origin.x - point.x;
        const dy = origin.y - point.y;
        if (dy <= 0) return;
        state.theta1 = clamp(Math.atan2(dx, dy) * RAD, 2, 88);
        render();
      }

      function snell() {
        const sinTheta2 = (state.n1 / state.n2) * Math.sin(state.theta1 * DEG);
        const tir = sinTheta2 > 1;
        const theta2 = tir ? null : Math.asin(clamp(sinTheta2, -1, 1)) * RAD;
        const critical = state.n1 > state.n2 ? Math.asin(state.n2 / state.n1) * RAD : null;
        return { sinTheta2, tir, theta2, critical };
      }

      function render() {
        const source = upperPoint(state.theta1, rayLength);
        const data = snell();

        el.incidentRay.setAttribute('d', linePath(source, origin));
        el.dragHandle.setAttribute('cx', source.x);
        el.dragHandle.setAttribute('cy', source.y);
        el.handleHalo.setAttribute('cx', source.x);
        el.handleHalo.setAttribute('cy', source.y);
        el.dragHandle.setAttribute('aria-valuenow', fmt(state.theta1, 1));

        const labelT = 0.35;
        const labelX = source.x + (origin.x - source.x) * labelT - 8;
        const labelY = source.y + (origin.y - source.y) * labelT + 4;
        const rayAngle = Math.atan2(origin.y - source.y, origin.x - source.x) * RAD;
        el.rayDirectionLabel.setAttribute('x', labelX.toFixed(2));
        el.rayDirectionLabel.setAttribute('y', labelY.toFixed(2));
        el.rayDirectionLabel.setAttribute('transform', `rotate(${rayAngle.toFixed(2)} ${labelX.toFixed(2)} ${labelY.toFixed(2)})`);

        el.theta1Arc.setAttribute('d', arcPath(state.theta1, arcR1, 'upper'));
        const t1Label = textAtUpper(state.theta1, arcR1 + 38);
        el.theta1Label.setAttribute('x', t1Label.x.toFixed(2));
        el.theta1Label.setAttribute('y', t1Label.y.toFixed(2));
        el.theta1Label.textContent = `θ₁ ${fmt(state.theta1)}°`;

        if (data.tir) {
          const reflected = reflectedPoint(state.theta1, rayLength * 0.86);
          el.reflectedRay.setAttribute('d', linePath(origin, reflected));
          el.refractedRay.classList.add('hidden-ray');
          el.reflectedRay.classList.remove('hidden-ray');
          el.theta2Arc.setAttribute('d', '');
          el.theta2Label.textContent = '';
          el.tirBadge.classList.add('visible');
        } else {
          const transmitted = lowerPoint(data.theta2, rayLength);
          el.refractedRay.setAttribute('d', linePath(origin, transmitted));
          el.refractedRay.classList.remove('hidden-ray');
          el.reflectedRay.classList.add('hidden-ray');
          el.tirBadge.classList.remove('visible');
          el.theta2Arc.setAttribute('d', arcPath(data.theta2, arcR2, 'lower'));
          const t2Label = textAtLower(data.theta2, arcR2 + 38);
          el.theta2Label.setAttribute('x', t2Label.x.toFixed(2));
          el.theta2Label.setAttribute('y', t2Label.y.toFixed(2));
          el.theta2Label.textContent = `θ₂ ${fmt(data.theta2)}°`;
        }

        if (data.critical !== null) {
          el.criticalArc.setAttribute('d', arcPath(data.critical, arcR1 + 26, 'upper'));
          el.criticalArc.classList.add('visible');
          const cLabel = textAtUpper(data.critical, arcR1 + 74);
          el.criticalLabel.setAttribute('x', cLabel.x.toFixed(2));
          el.criticalLabel.setAttribute('y', cLabel.y.toFixed(2));
          el.criticalLabel.textContent = `θc ${fmt(data.critical)}°`;
        } else {
          el.criticalArc.classList.remove('visible');
          el.criticalLabel.textContent = '';
        }

        el.thetaInput.value = fmt(state.theta1, 1);
        el.n1Input.value = fmt(state.n1, 2);
        el.n2Input.value = fmt(state.n2, 2);
        el.thetaValue.textContent = `${fmt(state.theta1)}°`;
        el.n1Value.textContent = fmt(state.n1, 2);
        el.n2Value.textContent = fmt(state.n2, 2);

        const lhs = state.n1 * Math.sin(state.theta1 * DEG);
        if (data.tir) {
          el.equationReadout.textContent = `${fmt(state.n1, 2)} sin(${fmt(state.theta1)}°) = ${fmt(lhs, 3)} > ${fmt(state.n2, 2)}`;
          el.statusReadout.textContent = 'No real refracted angle exists; the reflected ray is symmetric about the surface normal.';
          el.statusReadout.classList.add('warning');
        } else {
          const rhs = state.n2 * Math.sin(data.theta2 * DEG);
          el.equationReadout.textContent = `${fmt(state.n1, 2)} sin(${fmt(state.theta1)}°) = ${fmt(state.n2, 2)} sin(${fmt(data.theta2)}°) = ${fmt(rhs, 3)}`;
          const bend = data.theta2 < state.theta1 - 0.05
            ? 'The ray bends toward the normal in the lower medium.'
            : data.theta2 > state.theta1 + 0.05
              ? 'The ray bends away from the normal in the lower medium.'
              : 'The ray continues without angular bending.';
          el.statusReadout.textContent = bend;
          el.statusReadout.classList.remove('warning');
        }

        if (data.critical !== null) {
          el.criticalReadout.textContent = `critical angle θc = asin(n2/n1) = ${fmt(data.critical)}°`;
        } else {
          el.criticalReadout.textContent = 'total internal reflection requires n1 > n2';
        }
      }

      let dragging = false;

      function beginDrag(event) {
        dragging = true;
        svg.setPointerCapture(event.pointerId);
        setThetaFromPoint(svgPointFromEvent(event));
      }

      function moveDrag(event) {
        if (!dragging) return;
        setThetaFromPoint(svgPointFromEvent(event));
      }

      function endDrag(event) {
        dragging = false;
        if (svg.hasPointerCapture(event.pointerId)) {
          svg.releasePointerCapture(event.pointerId);
        }
      }

      el.dragHandle.addEventListener('pointerdown', beginDrag);
      el.handleHalo.addEventListener('pointerdown', beginDrag);
      svg.addEventListener('pointermove', moveDrag);
      svg.addEventListener('pointerup', endDrag);
      svg.addEventListener('pointercancel', endDrag);

      el.dragHandle.addEventListener('keydown', (event) => {
        const step = event.shiftKey ? 5 : 1;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          event.preventDefault();
          state.theta1 = clamp(state.theta1 - step, 2, 88);
          render();
        }
        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          state.theta1 = clamp(state.theta1 + step, 2, 88);
          render();
        }
      });

      el.thetaInput.addEventListener('input', () => {
        state.theta1 = Number(el.thetaInput.value);
        render();
      });

      el.n1Input.addEventListener('input', () => {
        state.n1 = Number(el.n1Input.value);
        render();
      });

      el.n2Input.addEventListener('input', () => {
        state.n2 = Number(el.n2Input.value);
        render();
      });

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => {
          const preset = button.dataset.preset;
          if (preset === 'airGlass') Object.assign(state, { theta1: 39, n1: 1, n2: 1.5 });
          if (preset === 'glassAir') Object.assign(state, { theta1: 39, n1: 1.5, n2: 1 });
          if (preset === 'nearCritical') Object.assign(state, { theta1: 45, n1: 1.5, n2: 1 });
          if (preset === 'reset') Object.assign(state, { theta1: 39, n1: 1, n2: 1.5 });
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
