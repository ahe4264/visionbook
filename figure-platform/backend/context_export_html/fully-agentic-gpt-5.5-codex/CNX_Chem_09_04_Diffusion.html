<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaseous Diffusion Through a Stopcock</title>
  <style>
    :root {
      --ink: #141414;
      --muted: #53626a;
      --panel: #f4f8f9;
      --panel-line: #cbdadc;
      --glass: #dceff0;
      --glass-edge: #9bc7c8;
      --tube: #d7ecee;
      --hydrogen: #ffffff;
      --oxygen: #d5160b;
      --oxygen-dark: #9f130c;
      --hydrogen-glow: #58bfc7;
      --accent: #1f7f8a;
      --accent-dark: #145f69;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      display: grid;
      place-items: center;
    }

    .figure-app {
      width: min(1320px, 100vw);
      min-height: 100vh;
      padding: clamp(8px, 1.8vw, 20px);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .stage {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    svg {
      width: 100%;
      max-height: calc(100vh - 140px);
      min-height: 265px;
      height: auto;
      display: block;
      overflow: visible;
    }

    .toolbar {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
    }

    button,
    input,
    label {
      font: inherit;
    }

    button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid #9fb4b9;
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover {
      background: #eef6f7;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(31, 127, 138, 0.3);
      outline-offset: 2px;
    }

    .slider-wrap {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) 72px;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .time-readout {
      color: var(--accent-dark);
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .toggle {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(20, 20, 20, 0.28);
    }

    .swatch.h2 {
      background: #ffffff;
    }

    .swatch.o2 {
      background: var(--oxygen);
      border-color: var(--oxygen-dark);
    }

    .glass-fill {
      fill: url(#glassGradient);
      stroke: var(--glass-edge);
      stroke-width: 4.5;
    }

    .tube-fill {
      fill: var(--tube);
      stroke: var(--glass-edge);
      stroke-width: 4.5;
      stroke-linejoin: round;
    }

    .valve-line {
      fill: #d7e8e9;
      stroke: var(--glass-edge);
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .valve-detail {
      fill: none;
      stroke: var(--glass-edge);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .caption {
      font-size: 25px;
      fill: #050505;
      text-anchor: middle;
    }

    .panel-letter {
      font-size: 24px;
      fill: #050505;
      text-anchor: middle;
    }

    .formula {
      font-size: 28px;
      fill: #050505;
      text-anchor: middle;
    }

    .formula tspan {
      baseline-shift: sub;
      font-size: 58%;
    }

    .particle-h2 {
      fill: var(--hydrogen);
      stroke: rgba(151, 188, 190, 0.25);
      stroke-width: 1;
    }

    .particles {
      clip-path: url(#vesselClip);
    }

    .particle-o2 {
      fill: var(--oxygen);
      stroke: var(--oxygen-dark);
      stroke-width: 0.6;
    }

    .mass-mode .particle-h2 {
      stroke: var(--hydrogen-glow);
      stroke-width: 3;
      filter: url(#h2Glow);
    }

    .mass-mode .particle-o2 {
      stroke-width: 2;
    }

    .mass-hint {
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }

    .mass-mode .mass-hint {
      opacity: 1;
    }

    .speed-arrow-h2 {
      fill: none;
      stroke: var(--hydrogen-glow);
      stroke-width: 5;
      stroke-linecap: round;
      marker-end: url(#arrowH2);
    }

    .speed-arrow-o2 {
      fill: none;
      stroke: var(--oxygen);
      stroke-width: 4;
      stroke-linecap: round;
      marker-end: url(#arrowO2);
    }

    .speed-label {
      font-size: 15px;
      font-weight: 700;
      fill: var(--accent-dark);
      text-anchor: middle;
    }

    .active-frame {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      opacity: 0.85;
      stroke-dasharray: 10 8;
      rx: 10;
    }

    .phase-tag {
      font-size: 16px;
      font-weight: 700;
      fill: var(--accent-dark);
      text-anchor: middle;
    }

    @media (max-width: 760px) {
      .figure-app {
        min-height: 100vh;
        grid-template-rows: auto auto;
      }

      svg {
        max-height: none;
        min-height: 0;
      }

      .caption {
        font-size: 40px;
      }

      .panel-letter {
        font-size: 35px;
      }

      .phase-tag {
        font-size: 22px;
      }

      .formula {
        font-size: 54px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .slider-wrap {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .time-readout {
        text-align: left;
      }

      .legend {
        justify-content: space-between;
        flex-wrap: wrap;
      }

      button,
      .toggle {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="figure-app" id="app">
    <section class="stage" aria-label="Interactive diffusion figure">
      <svg id="diffusionSvg" viewBox="0 0 1300 390" role="img" aria-labelledby="title desc">
        <title id="title">Hydrogen and oxygen gases diffusing after a stopcock opens</title>
        <desc id="desc">Three panels show hydrogen initially in the left bulb and oxygen in the right bulb, then a just-opened stopcock where hydrogen has spread faster, and finally a uniform mixture.</desc>
        <defs>
          <radialGradient id="glassGradient" cx="35%" cy="28%" r="75%">
            <stop offset="0" stop-color="#edf8f8"/>
            <stop offset="0.78" stop-color="#d9eef0"/>
            <stop offset="1" stop-color="#cfe7e9"/>
          </radialGradient>
          <filter id="h2Glow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="2.1" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <marker id="arrowH2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#58bfc7"></path>
          </marker>
          <marker id="arrowO2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d5160b"></path>
          </marker>
          <clipPath id="vesselClip">
            <circle cx="95" cy="130" r="79"></circle>
            <circle cx="340" cy="130" r="79"></circle>
            <path d="M 169 112 C 185 112 190 123 197 130 C 190 137 185 148 169 148 L 271 148 C 255 148 250 137 243 130 C 250 123 255 112 271 112 Z"></path>
          </clipPath>
        </defs>

        <g class="panel" id="panelA" transform="translate(0 0)">
          <rect class="active-frame" id="frameA" x="10" y="8" width="405" height="318"></rect>
          <text class="formula" x="105" y="26">H<tspan>2</tspan></text>
          <text class="formula" x="345" y="26">O<tspan>2</tspan></text>
          <g class="apparatus" data-open="false"></g>
          <g class="particles" id="particlesA"></g>
          <text class="caption" x="220" y="294">Stopcock closed</text>
          <text class="panel-letter" x="220" y="329">(a)</text>
          <text class="phase-tag" id="tagA" x="220" y="355">initial separation</text>
        </g>

        <g class="panel" id="panelB" transform="translate(432 0)">
          <rect class="active-frame" id="frameB" x="10" y="8" width="405" height="318"></rect>
          <g class="apparatus" data-open="true"></g>
          <g class="mass-hint">
            <path class="speed-arrow-h2" d="M 180 103 C 218 74, 275 70, 329 88"></path>
            <path class="speed-arrow-o2" d="M 285 170 C 260 181, 232 180, 211 166"></path>
            <text class="speed-label" x="260" y="63">H2 faster</text>
            <text class="speed-label" x="250" y="202">O2 slower</text>
          </g>
          <g class="particles" id="particlesB"></g>
          <text class="caption" x="220" y="294">Stopcock open</text>
          <text class="panel-letter" x="220" y="329">(b)</text>
          <text class="phase-tag" id="tagB" x="220" y="355">lighter H2 disperses first</text>
        </g>

        <g class="panel" id="panelC" transform="translate(864 0)">
          <rect class="active-frame" id="frameC" x="10" y="8" width="405" height="318"></rect>
          <g class="apparatus" data-open="true"></g>
          <g class="particles" id="particlesC"></g>
          <text class="caption" x="220" y="253">Some time after</text>
          <text class="caption" x="220" y="294">Stopcock open</text>
          <text class="panel-letter" x="220" y="329">(c)</text>
          <text class="phase-tag" id="tagC" x="220" y="355">uniform mixture</text>
        </g>
      </svg>
    </section>

    <form class="toolbar" onsubmit="return false;">
      <button type="button" id="playButton" aria-label="Play diffusion animation">Play</button>
      <div class="slider-wrap">
        <label for="timeSlider">Elapsed time</label>
        <input id="timeSlider" type="range" min="0" max="100" value="100" step="1">
        <output class="time-readout" id="timeReadout" for="timeSlider">100%</output>
      </div>
      <label class="toggle" for="massToggle">
        <input id="massToggle" type="checkbox">
        <span>Color-code by molecular mass</span>
      </label>
      <div class="legend" aria-hidden="true">
        <span class="legend-item"><span class="swatch h2"></span>H2</span>
        <span class="legend-item"><span class="swatch o2"></span>O2</span>
      </div>
    </form>
  </main>

  <script>
    (() => {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const app = document.getElementById("app");
      const slider = document.getElementById("timeSlider");
      const readout = document.getElementById("timeReadout");
      const playButton = document.getElementById("playButton");
      const massToggle = document.getElementById("massToggle");
      const particleGroups = {
        a: document.getElementById("particlesA"),
        b: document.getElementById("particlesB"),
        c: document.getElementById("particlesC")
      };
      const frames = {
        a: document.getElementById("frameA"),
        b: document.getElementById("frameB"),
        c: document.getElementById("frameC")
      };

      const H2_START = [
        [34, 132], [42, 99], [55, 67], [63, 156], [72, 118], [77, 193],
        [95, 61], [98, 146], [104, 91], [112, 174], [126, 120], [129, 72],
        [137, 199], [146, 96], [154, 146], [165, 65], [170, 178], [181, 119],
        [191, 148], [58, 181], [85, 213], [117, 220], [150, 220], [192, 97],
        [210, 131], [31, 168], [128, 156], [94, 114], [67, 78], [158, 126]
      ];
      const O2_START = [
        [277, 130], [293, 101], [306, 158], [310, 74], [326, 122], [333, 190],
        [341, 94], [350, 150], [358, 61], [363, 213], [375, 116], [383, 181],
        [394, 88], [397, 144], [413, 120], [298, 187], [320, 215], [347, 220],
        [374, 74], [391, 202], [286, 162], [329, 67], [361, 130], [407, 170],
        [304, 121], [332, 146], [354, 181], [385, 151], [418, 91], [318, 94]
      ];
      const H2_MID = [
        [58, 99], [72, 168], [94, 68], [104, 132], [129, 191], [150, 96],
        [329, 62], [348, 101], [365, 83], [383, 128], [395, 170], [323, 193],
        [356, 213], [388, 203], [302, 142], [416, 108], [288, 91], [351, 153],
        [372, 179], [314, 116], [404, 80], [334, 131], [390, 57], [276, 166],
        [214, 130], [89, 210], [294, 203], [407, 148], [122, 155], [419, 190]
      ];
      const O2_MID = [
        [129, 67], [166, 82], [170, 130], [207, 130], [248, 130], [291, 102],
        [311, 75], [328, 118], [337, 180], [342, 58], [353, 143], [363, 96],
        [369, 214], [382, 63], [389, 167], [401, 121], [409, 195], [421, 88],
        [423, 148], [316, 206], [302, 162], [333, 89], [355, 123], [376, 196],
        [394, 98], [414, 168], [282, 188], [321, 139], [363, 162], [386, 222]
      ];
      const H2_END = [
        [46, 82], [50, 151], [70, 190], [82, 106], [96, 63], [99, 146],
        [117, 186], [131, 96], [148, 132], [163, 211], [178, 78], [192, 164],
        [210, 130], [238, 130], [280, 91], [294, 174], [311, 63], [324, 136],
        [345, 202], [358, 91], [379, 166], [394, 61], [405, 122], [421, 192],
        [90, 223], [127, 224], [151, 65], [308, 215], [371, 223], [405, 90]
      ];
      const O2_END = [
        [41, 121], [63, 69], [76, 166], [92, 213], [107, 102], [121, 145],
        [139, 190], [154, 84], [169, 125], [184, 209], [203, 129], [238, 130],
        [281, 73], [292, 147], [309, 104], [319, 194], [337, 132], [352, 60],
        [363, 166], [381, 216], [392, 96], [409, 139], [422, 181], [74, 132],
        [137, 62], [171, 166], [297, 214], [330, 82], [374, 121], [404, 204]
      ];

      function createSvgElement(name, attrs = {}) {
        const element = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, String(value)));
        return element;
      }

      function drawApparatus(group, isOpen) {
        const tube = createSvgElement("path", {
          class: "tube-fill",
          d: "M 168 112 C 181 112 185 122 192 130 C 185 138 181 148 168 148 L 272 148 C 259 148 255 138 248 130 C 255 122 259 112 272 112 Z"
        });
        group.appendChild(tube);

        group.appendChild(createSvgElement("circle", {
          class: "glass-fill",
          cx: 95,
          cy: 130,
          r: 81
        }));
        group.appendChild(createSvgElement("circle", {
          class: "glass-fill",
          cx: 340,
          cy: 130,
          r: 81
        }));
        group.appendChild(createSvgElement("path", {
          class: "tube-fill",
          d: "M 169 112 C 185 112 190 123 197 130 C 190 137 185 148 169 148 L 271 148 C 255 148 250 137 243 130 C 250 123 255 112 271 112 Z"
        }));

        const valve = createSvgElement("g", { transform: "translate(220 0)" });
        valve.appendChild(createSvgElement("rect", {
          class: "valve-line",
          x: -16,
          y: 99,
          width: 32,
          height: 64,
          rx: 8
        }));
        valve.appendChild(createSvgElement("path", {
          class: "valve-detail",
          d: "M -18 112 H 18 M -18 148 H 18 M -9 100 L -18 85 H 18 L 9 100 M -8 163 V 177 H 8 V 163"
        }));
        valve.appendChild(createSvgElement("ellipse", {
          class: "valve-line",
          cx: 0,
          cy: 85,
          rx: 25,
          ry: 8
        }));
        valve.appendChild(createSvgElement("path", {
          class: "valve-detail",
          d: "M -12 177 H 12 M -8 185 H 8"
        }));

        if (!isOpen) {
          valve.appendChild(createSvgElement("path", {
            class: "valve-line",
            d: "M -11 108 H 11 V 152 H -11 Z"
          }));
          valve.appendChild(createSvgElement("path", {
            class: "valve-detail",
            d: "M -16 130 H 16"
          }));
        } else {
          valve.appendChild(createSvgElement("path", {
            class: "valve-detail",
            d: "M -21 130 H 21 M -9 120 H 9 M -9 140 H 9"
          }));
        }
        group.appendChild(valve);
      }

      document.querySelectorAll(".apparatus").forEach((group) => {
        drawApparatus(group, group.dataset.open === "true");
      });

      function mix(a, b, t) {
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        return [
          a[0] + (b[0] - a[0]) * eased,
          a[1] + (b[1] - a[1]) * eased
        ];
      }

      function speciesPoints(species, key) {
        if (species === "h2") {
          if (key === "start") return H2_START;
          if (key === "mid") return H2_MID;
          return H2_END;
        }
        if (key === "start") return O2_START;
        if (key === "mid") return O2_MID;
        return O2_END;
      }

      function interpolateSpecies(species, fromKey, toKey, t) {
        const from = speciesPoints(species, fromKey);
        const to = speciesPoints(species, toKey);
        return from.map((point, index) => mix(point, to[index], t));
      }

      function statePoints(panelKey, progress) {
        if (panelKey === "a") {
          return {
            h2: H2_START,
            o2: O2_START
          };
        }

        if (panelKey === "b") {
          const t = Math.min(1, progress * 2);
          return {
            h2: interpolateSpecies("h2", "start", "mid", t),
            o2: interpolateSpecies("o2", "start", "mid", t * 0.72)
          };
        }

        const t = Math.max(0, (progress - 0.5) * 2);
        return {
          h2: interpolateSpecies("h2", "mid", "end", t),
          o2: interpolateSpecies("o2", "mid", "end", t)
        };
      }

      function renderParticles(group, points) {
        group.textContent = "";
        [
          ["h2", points.h2],
          ["o2", points.o2]
        ].forEach(([species, list]) => {
          list.forEach(([cx, cy], index) => {
            const radius = species === "h2" ? 6 : 5.7;
            const circle = createSvgElement("circle", {
              class: `particle-${species}`,
              cx: cx.toFixed(2),
              cy: cy.toFixed(2),
              r: radius,
              "data-index": index
            });
            group.appendChild(circle);
          });
        });
      }

      function updateFrames(progress) {
        if (progress > 0.985) {
          Object.values(frames).forEach((frame) => {
            frame.style.opacity = "0";
          });
          document.getElementById("panelB").style.opacity = "1";
          document.getElementById("panelC").style.opacity = "1";
          return;
        }

        const active = progress < 0.33 ? "a" : progress < 0.77 ? "b" : "c";
        Object.entries(frames).forEach(([key, frame]) => {
          frame.style.opacity = key === active ? "0.85" : "0";
        });

        document.getElementById("panelB").style.opacity = String(0.42 + 0.58 * Math.min(1, progress * 2));
        document.getElementById("panelC").style.opacity = String(0.38 + 0.62 * Math.max(0, (progress - 0.5) * 2));
      }

      function update(value) {
        const progress = Number(value) / 100;
        renderParticles(particleGroups.a, statePoints("a", progress));
        renderParticles(particleGroups.b, statePoints("b", progress));
        renderParticles(particleGroups.c, statePoints("c", progress));
        updateFrames(progress);
        readout.value = `${Math.round(progress * 100)}%`;
      }

      let rafId = 0;
      let playing = false;
      let startTime = 0;
      let startValue = 0;
      const duration = 7000;

      function stopAnimation() {
        playing = false;
        playButton.textContent = "Play";
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const next = Math.min(100, startValue + (elapsed / duration) * 100);
        slider.value = String(next);
        update(next);
        if (next < 100 && playing) {
          rafId = requestAnimationFrame(step);
        } else {
          stopAnimation();
        }
      }

      playButton.addEventListener("click", () => {
        if (playing) {
          stopAnimation();
          return;
        }
        if (Number(slider.value) >= 100) {
          slider.value = "0";
          update(0);
        }
        playing = true;
        startTime = 0;
        startValue = Number(slider.value);
        playButton.textContent = "Pause";
        rafId = requestAnimationFrame(step);
      });

      slider.addEventListener("input", () => {
        stopAnimation();
        update(slider.value);
      });

      massToggle.addEventListener("change", () => {
        app.classList.toggle("mass-mode", massToggle.checked);
      });

      update(slider.value);
    })();
  </script>
</body>
</html>
