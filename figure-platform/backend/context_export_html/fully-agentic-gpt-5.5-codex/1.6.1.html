<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continuity of sine and cosine on the unit circle</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #242226;
      --muted: #6f6870;
      --axis: #242226;
      --circle: #28a8df;
      --p: #f05a61;
      --q: #289ed6;
      --sector: rgba(171, 103, 177, 0.34);
      --panel: #fff;
      --panel-border: #d6d1d6;
      --soft: #f7f4f7;
      --focus: #1769aa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .figure-shell {
      width: min(1120px, 100%);
      min-height: min(760px, calc(100vh - 36px));
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: stretch;
    }

    .stage {
      min-width: 0;
      border: 1px solid #eee9ee;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff 0%, #fff 72%, #fbfafb 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 36px);
      min-height: 520px;
      display: block;
      touch-action: none;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .unit-circle {
      fill: none;
      stroke: var(--circle);
      stroke-width: 4;
    }

    .circle-ghost {
      fill: none;
      stroke: var(--circle);
      stroke-width: 4;
      stroke-dasharray: 38 16;
      opacity: 0.26;
    }

    .sector {
      fill: var(--sector);
      stroke: rgba(136, 78, 144, 0.38);
      stroke-width: 1.4;
    }

    .radius-q {
      stroke: #251f25;
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    .radius-p {
      stroke: var(--p);
      stroke-width: 2.8;
      stroke-linecap: round;
    }

    .chord {
      stroke: rgba(89, 66, 94, 0.52);
      stroke-width: 2;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
    }

    .guide {
      stroke: rgba(36, 34, 38, 0.28);
      stroke-width: 1.5;
      stroke-dasharray: 5 7;
    }

    .angle-arc {
      fill: none;
      stroke: #3b333d;
      stroke-width: 2.1;
      stroke-linecap: round;
    }

    .angle-arc.x {
      stroke: #19161a;
      marker-end: url(#tinyArrow);
    }

    .motion-arrow {
      fill: none;
      stroke: #242226;
      stroke-width: 2.7;
      stroke-linecap: round;
      marker-end: url(#arrowHead);
    }

    .point {
      stroke: #fff;
      stroke-width: 2;
    }

    .point.p {
      fill: var(--p);
    }

    .point.q {
      fill: var(--q);
    }

    .drag-target {
      fill: transparent;
      cursor: grab;
    }

    .drag-target:active {
      cursor: grabbing;
    }

    .math-label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 25px;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .coord-label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .small-label {
      fill: #3f3940;
      font-size: 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .caption-box {
      fill: #fff;
      stroke: #bdb9bd;
      stroke-width: 3;
      rx: 0;
    }

    .caption-text {
      fill: #302b31;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
    }

    .panel {
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(42, 35, 43, 0.08);
    }

    .panel h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: 0;
      font-weight: 700;
    }

    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .readout-item {
      background: var(--soft);
      border: 1px solid #ebe5eb;
      border-radius: 6px;
      padding: 9px 10px;
    }

    .readout-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 2px;
    }

    .readout-item strong {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      white-space: nowrap;
    }

    .control {
      display: grid;
      gap: 7px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      font-size: 14px;
      line-height: 1.2;
    }

    .control-row output {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--focus);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid #bbb3bb;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    button:hover {
      background: #f4f0f4;
      border-color: #9e969f;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(23, 105, 170, 0.26);
      outline-offset: 2px;
    }

    button:active {
      transform: translateY(1px);
    }

    .wide {
      grid-column: 1 / -1;
    }

    .status {
      border-left: 4px solid var(--circle);
      padding: 8px 0 8px 12px;
      color: #464047;
      font-size: 14px;
      line-height: 1.45;
      min-height: 60px;
    }

    .limits {
      display: grid;
      gap: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.2;
      padding: 12px;
      border-radius: 6px;
      background: #fbfbfb;
      border: 1px solid #ebe8eb;
    }

    .limits .em {
      color: #1769aa;
      font-style: italic;
    }

    @media (max-width: 860px) {
      body {
        padding: 10px;
      }

      .figure-shell {
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .stage {
        min-height: 470px;
      }

      svg {
        min-height: 470px;
        max-height: none;
      }

      .panel {
        padding: 12px;
        gap: 12px;
      }

      .panel h1 {
        font-size: 17px;
      }

      .readout {
        grid-template-columns: repeat(4, 1fr);
      }

      .readout-item {
        padding: 8px;
      }

      .readout-item strong {
        font-size: 12px;
      }
    }

    @media (max-width: 560px) {
      .stage {
        min-height: 430px;
      }

      svg {
        min-height: 430px;
      }

      .readout,
      .buttons {
        grid-template-columns: 1fr 1fr;
      }

      .coord-label {
        font-size: 27px;
      }

      .caption-text {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive unit circle continuity figure">
    <section class="stage">
      <svg id="figure" viewBox="0 0 760 680" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Continuity of sine and cosine from the unit circle</title>
        <desc id="svgDesc">A point P at angle x moves along the unit circle toward a fixed point Q at angle c. The collapsing sector shows why sine and cosine coordinates approach their values at c.</desc>
        <defs>
          <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#242226"></path>
          </marker>
          <marker id="arrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#242226"></path>
          </marker>
          <marker id="tinyArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#19161a"></path>
          </marker>
        </defs>

        <g id="plot">
          <path id="sector" class="sector"></path>
          <line id="xAxis" class="axis" x1="72" y1="330" x2="692" y2="330" marker-end="url(#axisArrow)"></line>
          <line id="yAxis" class="axis" x1="310" y1="638" x2="310" y2="34" marker-end="url(#axisArrow)"></line>
          <circle class="circle-ghost" cx="310" cy="330" r="190"></circle>
          <circle class="unit-circle" cx="310" cy="330" r="190"></circle>
          <line id="guideP" class="guide"></line>
          <line id="guideQ" class="guide"></line>
          <line id="radiusQ" class="radius-q"></line>
          <line id="radiusP" class="radius-p"></line>
          <line id="chord" class="chord"></line>
          <path id="arcC" class="angle-arc"></path>
          <path id="arcX" class="angle-arc x"></path>
          <path id="motionArrow" class="motion-arrow"></path>
          <circle id="pointQ" class="point q" r="9"></circle>
          <circle id="pointP" class="point p" r="9"></circle>
          <circle id="dragQ" class="drag-target" r="23" aria-label="Drag fixed angle c"></circle>
          <circle id="dragP" class="drag-target" r="23" aria-label="Drag variable angle x"></circle>
          <text id="labelQ" class="coord-label">Q(cos c, sin c)</text>
          <text id="labelP" class="coord-label">P(cos x, sin x)</text>
          <text id="labelC" class="math-label">c</text>
          <text id="labelX" class="math-label">x</text>
          <text id="deltaLabel" class="small-label"></text>
        </g>

        <g id="caption">
          <rect class="caption-box" x="170" y="572" width="500" height="78"></rect>
          <text class="caption-text" x="193" y="610">
            <tspan>As </tspan><tspan font-style="italic">x</tspan><tspan> approaches </tspan><tspan font-style="italic">c</tspan><tspan> the point</tspan>
            <tspan x="193" dy="35" font-style="italic">P</tspan><tspan font-style="normal"> approaches the point </tspan><tspan font-style="italic">Q</tspan><tspan font-style="normal">.</tspan>
          </text>
        </g>
      </svg>
    </section>

    <aside class="panel" aria-label="Controls">
      <h1>Unit-circle continuity</h1>

      <div class="readout" aria-live="polite">
        <div class="readout-item">
          <span>x</span>
          <strong id="xRead">0.00 rad</strong>
        </div>
        <div class="readout-item">
          <span>c</span>
          <strong id="cRead">0.00 rad</strong>
        </div>
        <div class="readout-item">
          <span>|x - c|</span>
          <strong id="gapRead">0.00</strong>
        </div>
        <div class="readout-item">
          <span>P - Q</span>
          <strong id="coordGapRead">0.00</strong>
        </div>
      </div>

      <label class="control">
        <span class="control-row">
          <span>Angle x</span>
          <output id="xOutput">0.00 rad</output>
        </span>
        <input id="xSlider" type="range" min="-3.1416" max="6.2832" step="0.005" value="0.65">
      </label>

      <label class="control">
        <span class="control-row">
          <span>Target angle c</span>
          <output id="cOutput">0.00 rad</output>
        </span>
        <input id="cSlider" type="range" min="-3.1416" max="6.2832" step="0.005" value="1.05">
      </label>

      <div class="buttons">
        <button id="approachLeft" type="button">Approach from left</button>
        <button id="approachRight" type="button">Approach from right</button>
        <button id="approachBoth" class="wide" type="button">Animate two-sided limit</button>
      </div>

      <div id="status" class="status">Move x toward c: the point P and its coordinates approach the fixed point Q.</div>

      <div class="limits" aria-label="Limit statements">
        <div>lim<sub>x -> c</sub> <span class="em">sin x</span> = <span class="em">sin c</span></div>
        <div>lim<sub>x -> c</sub> <span class="em">cos x</span> = <span class="em">cos c</span></div>
      </div>
    </aside>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("figure");
      const origin = { x: 310, y: 330 };
      const radius = 190;
      const twoPi = Math.PI * 2;
      const state = {
        x: 0.65,
        c: 1.05,
        raf: null,
        drag: null
      };

      const els = {
        sector: document.getElementById("sector"),
        guideP: document.getElementById("guideP"),
        guideQ: document.getElementById("guideQ"),
        radiusP: document.getElementById("radiusP"),
        radiusQ: document.getElementById("radiusQ"),
        chord: document.getElementById("chord"),
        arcC: document.getElementById("arcC"),
        arcX: document.getElementById("arcX"),
        motionArrow: document.getElementById("motionArrow"),
        pointP: document.getElementById("pointP"),
        pointQ: document.getElementById("pointQ"),
        dragP: document.getElementById("dragP"),
        dragQ: document.getElementById("dragQ"),
        labelP: document.getElementById("labelP"),
        labelQ: document.getElementById("labelQ"),
        labelC: document.getElementById("labelC"),
        labelX: document.getElementById("labelX"),
        deltaLabel: document.getElementById("deltaLabel"),
        xSlider: document.getElementById("xSlider"),
        cSlider: document.getElementById("cSlider"),
        xOutput: document.getElementById("xOutput"),
        cOutput: document.getElementById("cOutput"),
        xRead: document.getElementById("xRead"),
        cRead: document.getElementById("cRead"),
        gapRead: document.getElementById("gapRead"),
        coordGapRead: document.getElementById("coordGapRead"),
        status: document.getElementById("status"),
        approachLeft: document.getElementById("approachLeft"),
        approachRight: document.getElementById("approachRight"),
        approachBoth: document.getElementById("approachBoth")
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function normalizePositive(angle) {
        return ((angle % twoPi) + twoPi) % twoPi;
      }

      function shortestDelta(from, to) {
        let delta = normalizePositive(to) - normalizePositive(from);
        if (delta > Math.PI) delta -= twoPi;
        if (delta < -Math.PI) delta += twoPi;
        return delta;
      }

      function pointAt(angle, scale) {
        const r = radius * (scale || 1);
        return {
          x: origin.x + r * Math.cos(angle),
          y: origin.y - r * Math.sin(angle)
        };
      }

      function polarPath(start, end, r, preferShort) {
        const a0 = start;
        let sweep = preferShort ? shortestDelta(start, end) : end - start;
        if (Math.abs(sweep) < 0.0001) sweep = sweep < 0 ? -0.0001 : 0.0001;
        const endAngle = a0 + sweep;
        const startPoint = pointAt(a0, r / radius);
        const endPoint = pointAt(endAngle, r / radius);
        const largeArc = Math.abs(sweep) > Math.PI ? 1 : 0;
        const sweepFlag = sweep >= 0 ? 0 : 1;
        return `M ${startPoint.x.toFixed(2)} ${startPoint.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} ${sweepFlag} ${endPoint.x.toFixed(2)} ${endPoint.y.toFixed(2)}`;
      }

      function sectorPath(a, b) {
        const delta = shortestDelta(a, b);
        const start = pointAt(a);
        const end = pointAt(a + delta);
        const largeArc = Math.abs(delta) > Math.PI ? 1 : 0;
        const sweepFlag = delta >= 0 ? 0 : 1;
        return [
          `M ${origin.x} ${origin.y}`,
          `L ${start.x.toFixed(2)} ${start.y.toFixed(2)}`,
          `A ${radius} ${radius} 0 ${largeArc} ${sweepFlag} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`,
          "Z"
        ].join(" ");
      }

      function setLine(line, p1, p2) {
        line.setAttribute("x1", p1.x.toFixed(2));
        line.setAttribute("y1", p1.y.toFixed(2));
        line.setAttribute("x2", p2.x.toFixed(2));
        line.setAttribute("y2", p2.y.toFixed(2));
      }

      function setCircle(circle, p) {
        circle.setAttribute("cx", p.x.toFixed(2));
        circle.setAttribute("cy", p.y.toFixed(2));
      }

      function labelPosition(point, kind) {
        const right = point.x >= origin.x;
        const high = point.y < origin.y;
        const x = clamp(point.x + (right ? 28 : -246), 22, 500);
        let y = point.y + (high ? -20 : 42);
        if (kind === "p" && Math.abs(point.x - origin.x) < 60) y += 22;
        y = clamp(y, 42, 540);
        return { x, y };
      }

      function setTextPosition(text, p) {
        text.setAttribute("x", p.x.toFixed(2));
        text.setAttribute("y", p.y.toFixed(2));
      }

      function formatAngle(angle) {
        return `${angle.toFixed(2)} rad`;
      }

      function updateStatus(gap, chordLength) {
        if (gap < 0.015) {
          els.status.textContent = "At x = c, P and Q coincide, so both coordinates match exactly.";
        } else if (gap < 0.18) {
          els.status.textContent = "The sector is narrow: P is close to Q, and the sine and cosine coordinates are close too.";
        } else {
          els.status.textContent = "Move x toward c: the point P travels on the circle toward Q and the shaded sector shrinks.";
        }
        els.deltaLabel.textContent = `arc gap |x - c| = ${gap.toFixed(3)}`;
      }

      function render() {
        const p = pointAt(state.x);
        const q = pointAt(state.c);
        const delta = shortestDelta(state.x, state.c);
        const gap = Math.abs(delta);
        const chordLength = Math.hypot(p.x - q.x, p.y - q.y) / radius;
        const mid = state.x + delta / 2;

        els.sector.setAttribute("d", sectorPath(state.x, state.c));
        setLine(els.radiusP, origin, p);
        setLine(els.radiusQ, origin, q);
        setLine(els.chord, p, q);
        setLine(els.guideP, p, { x: p.x, y: origin.y });
        setLine(els.guideQ, q, { x: q.x, y: origin.y });
        setCircle(els.pointP, p);
        setCircle(els.pointQ, q);
        setCircle(els.dragP, p);
        setCircle(els.dragQ, q);

        els.arcC.setAttribute("d", polarPath(0, state.c, 84, false));
        els.arcX.setAttribute("d", polarPath(0, state.x, 54, false));

        const arrowStart = pointAt(state.x + delta * 0.2, 1.22);
        const arrowEnd = pointAt(state.x + delta * 0.82, 1.22);
        els.motionArrow.setAttribute("d", `M ${arrowStart.x.toFixed(2)} ${arrowStart.y.toFixed(2)} Q ${pointAt(mid, 1.34).x.toFixed(2)} ${pointAt(mid, 1.34).y.toFixed(2)} ${arrowEnd.x.toFixed(2)} ${arrowEnd.y.toFixed(2)}`);
        els.motionArrow.style.opacity = gap < 0.035 ? "0.16" : "1";

        setTextPosition(els.labelP, labelPosition(p, "p"));
        setTextPosition(els.labelQ, labelPosition(q, "q"));
        setTextPosition(els.labelC, pointAt(state.c / 2, 0.48));
        setTextPosition(els.labelX, pointAt(state.x / 2, 0.32));
        setTextPosition(els.deltaLabel, pointAt(mid, 1.08));

        els.xSlider.value = state.x.toFixed(4);
        els.cSlider.value = state.c.toFixed(4);
        els.xOutput.value = formatAngle(state.x);
        els.cOutput.value = formatAngle(state.c);
        els.xRead.textContent = formatAngle(state.x);
        els.cRead.textContent = formatAngle(state.c);
        els.gapRead.textContent = gap.toFixed(3);
        els.coordGapRead.textContent = chordLength.toFixed(3);
        updateStatus(gap, chordLength);
      }

      function stopAnimation() {
        if (state.raf) {
          cancelAnimationFrame(state.raf);
          state.raf = null;
        }
      }

      function animateApproach(side) {
        stopAnimation();
        const startOffset = side === "left" ? -1.55 : 1.55;
        const start = state.c + startOffset;
        const duration = 2100;
        const t0 = performance.now();
        state.x = start;

        function tick(now) {
          const t = clamp((now - t0) / duration, 0, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          const offset = startOffset * (1 - eased);
          state.x = state.c + offset;
          render();
          if (t < 1) {
            state.raf = requestAnimationFrame(tick);
          } else {
            state.raf = null;
          }
        }

        state.raf = requestAnimationFrame(tick);
      }

      function animateBoth() {
        stopAnimation();
        const duration = 4600;
        const t0 = performance.now();

        function tick(now) {
          const t = clamp((now - t0) / duration, 0, 1);
          const firstHalf = t < 0.5;
          const local = firstHalf ? t / 0.5 : (t - 0.5) / 0.5;
          const side = firstHalf ? -1 : 1;
          const eased = 1 - Math.pow(1 - local, 3);
          state.x = state.c + side * 1.55 * (1 - eased);
          render();
          if (t < 1) {
            state.raf = requestAnimationFrame(tick);
          } else {
            state.raf = null;
          }
        }

        state.raf = requestAnimationFrame(tick);
      }

      function sliderValue(slider) {
        return Number.parseFloat(slider.value);
      }

      els.xSlider.addEventListener("input", function () {
        stopAnimation();
        state.x = sliderValue(els.xSlider);
        render();
      });

      els.cSlider.addEventListener("input", function () {
        stopAnimation();
        state.c = sliderValue(els.cSlider);
        render();
      });

      els.approachLeft.addEventListener("click", function () {
        animateApproach("left");
      });

      els.approachRight.addEventListener("click", function () {
        animateApproach("right");
      });

      els.approachBoth.addEventListener("click", animateBoth);

      function clientToSvgPoint(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function angleFromEvent(event) {
        const pt = clientToSvgPoint(event);
        return Math.atan2(origin.y - pt.y, pt.x - origin.x);
      }

      function beginDrag(which, event) {
        stopAnimation();
        state.drag = which;
        event.currentTarget.setPointerCapture(event.pointerId);
        event.preventDefault();
      }

      function dragMove(event) {
        if (!state.drag) return;
        const angle = angleFromEvent(event);
        if (state.drag === "p") {
          state.x = angle;
        } else {
          state.c = angle;
        }
        render();
      }

      function endDrag() {
        state.drag = null;
      }

      els.dragP.addEventListener("pointerdown", function (event) {
        beginDrag("p", event);
      });
      els.dragQ.addEventListener("pointerdown", function (event) {
        beginDrag("q", event);
      });
      svg.addEventListener("pointermove", dragMove);
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);

      render();
    }());
  </script>
</body>
</html>
