<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surface Flux Through a Small Patch</title>
  <style>
    :root {
      --ink: #24242a;
      --muted: #596170;
      --paper: #ffffff;
      --panel: #f7fafc;
      --teal: #18bfc3;
      --teal-dark: #0a9fa9;
      --teal-pale: #ccefdc;
      --purple: #b45ab1;
      --purple-dark: #823687;
      --gold: #fee8b4;
      --gold-border: #abb0b8;
      --line: #2a2a2e;
      --shadow: 0 18px 45px rgba(39, 48, 66, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #edf4f5 0%, #f8fafc 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 22px));
      margin: 14px auto;
    }

    .figure-shell {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid #dbe3ea;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #dbe3ea;
      background: #fbfdff;
    }

    .slider-row {
      display: grid;
      grid-template-columns: auto minmax(130px, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    label,
    .toggle {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal-dark);
    }

    .velocity-value {
      min-width: 76px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      text-align: right;
    }

    .toggle {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-self: end;
      color: var(--ink);
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--purple);
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 315px;
      gap: 0;
      min-height: 600px;
    }

    .stage {
      position: relative;
      min-width: 0;
      background:
        radial-gradient(circle at 22% 18%, rgba(24, 191, 195, 0.11), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 590px;
      touch-action: none;
      user-select: none;
    }

    .readout {
      display: grid;
      align-content: start;
      gap: 14px;
      padding: 18px 18px 20px;
      border-left: 1px solid #dbe3ea;
      background: var(--panel);
    }

    .readout h1 {
      margin: 0;
      font-size: clamp(1.18rem, 2vw, 1.55rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .formula {
      padding: 12px;
      border: 1px solid #d5dde5;
      border-radius: 8px;
      background: #ffffff;
      color: #33343a;
      font-family: "Cambria Math", Cambria, Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      align-items: baseline;
      padding-bottom: 10px;
      border-bottom: 1px solid #dbe3ea;
    }

    .metric span:first-child {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .metric span:last-child {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-weight: 850;
      text-align: right;
    }

    .metric.rate span:last-child {
      color: var(--teal-dark);
      font-size: 1.18rem;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.45;
    }

    .surface-fill {
      fill: rgba(196, 235, 210, 0.47);
      stroke: rgba(17, 158, 164, 0.72);
      stroke-width: 2;
    }

    .grid-line {
      fill: none;
      stroke: rgba(17, 158, 164, 0.42);
      stroke-width: 1.6;
      stroke-dasharray: 8 9;
    }

    .patch-fill {
      fill: url(#patchGradient);
      stroke: var(--teal);
      stroke-width: 3;
      cursor: grab;
      pointer-events: auto;
    }

    .patch-fill:active {
      cursor: grabbing;
    }

    .patch-ridge {
      fill: none;
      stroke: rgba(4, 124, 132, 0.8);
      stroke-width: 1.4;
      stroke-dasharray: 7 8;
      pointer-events: none;
    }

    .leader {
      fill: none;
      stroke: #2e2f35;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .caption-link {
      fill: none;
      stroke: #969ca6;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-arrow {
      stroke: #1f2024;
      stroke-width: 4;
      stroke-linecap: round;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.85));
    }

    .normal-line {
      stroke: var(--purple);
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.7));
    }

    .normal-dot {
      fill: var(--teal);
      stroke: #ffffff;
      stroke-width: 2.5;
    }

    .label {
      fill: var(--ink);
      font-weight: 800;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .math-label {
      font-family: "Cambria Math", Cambria, Georgia, serif;
      font-size: 38px;
      font-weight: 700;
    }

    .small-label {
      font-size: 17px;
      font-weight: 850;
    }

    .caption-text {
      fill: #25252a;
      font-size: 31px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    @media (max-width: 860px) {
      .controls,
      .content {
        grid-template-columns: 1fr;
      }

      .toggle {
        justify-self: start;
      }

      .readout {
        border-top: 1px solid #dbe3ea;
        border-left: 0;
      }

      svg {
        min-height: 500px;
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100vw - 12px, 1180px);
        margin: 6px auto;
      }

      .figure-shell {
        border-radius: 6px;
      }

      .controls {
        padding: 10px;
      }

      .slider-row {
        grid-template-columns: 1fr;
      }

      .velocity-value {
        text-align: left;
      }

      svg {
        min-height: 430px;
      }

      .readout {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" aria-labelledby="figure-title">
      <div class="controls">
        <div class="slider-row">
          <label for="velocity">Flow velocity magnitude</label>
          <input id="velocity" type="range" min="0" max="45" step="0.5" value="25" aria-describedby="velocityNumber">
          <output id="velocityNumber" class="velocity-value" for="velocity">25.0 cm/s</output>
        </div>
        <label class="toggle" for="reverseFlow">
          <input id="reverseFlow" type="checkbox">
          opposite n
        </label>
      </div>

      <div class="content">
        <div class="stage">
          <svg id="fluxSvg" viewBox="0 0 860 600" role="img" aria-labelledby="figure-title figure-desc">
            <title id="figure-title">Surface flux through a small curved patch</title>
            <desc id="figure-desc">A curved teal surface patch sigma sub k can be dragged over a larger surface. The normal vector and area update, and a slider changes the volume rate F dot n times Delta S sub k.</desc>
            <defs>
              <linearGradient id="patchGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#dff4cb"/>
                <stop offset="0.48" stop-color="#bcecd7"/>
                <stop offset="1" stop-color="#7ddfd7"/>
              </linearGradient>
              <marker id="purpleArrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="strokeWidth">
                <path d="M 1 13 L 7 1 L 13 13 Z" fill="#ffffff" stroke="#b45ab1" stroke-width="2"/>
              </marker>
              <marker id="blackArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
                <path d="M 0 0 L 10 5.5 L 0 11 Z" fill="#1f2024"/>
              </marker>
              <marker id="leaderArrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#2e2f35"/>
              </marker>
              <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#969ca6"/>
              </marker>
            </defs>

            <path id="surfaceFill" class="surface-fill"></path>
            <g id="gridLines"></g>
            <g id="flowGroup"></g>

            <g id="patchGroup">
              <path id="patchPath" class="patch-fill"></path>
              <path id="patchRidge" class="patch-ridge"></path>
            </g>

            <path id="areaLeader" class="leader" marker-end="url(#leaderArrow)"></path>
            <text id="areaLabel" class="label math-label" text-anchor="middle">
              <tspan id="areaTitle">Area ΔSₖ</tspan>
              <tspan id="areaValue" class="small-label" x="0" dy="25">2.00 cm²</tspan>
            </text>

            <path id="surfaceLeader" class="leader" marker-end="url(#leaderArrow)"></path>
            <text id="surfaceLabel" class="label math-label" text-anchor="start">Surface σₖ</text>

            <line id="normalLine" class="normal-line" marker-end="url(#purpleArrow)"></line>
            <circle id="normalDot" class="normal-dot" r="11"></circle>
            <text id="normalLabel" class="label math-label" text-anchor="middle">n</text>

            <path id="captionConnector" class="caption-link" marker-end="url(#grayArrow)"></path>
            <rect x="54" y="405" width="560" height="142" rx="9" fill="#fee8b4" stroke="#abb0b8" stroke-width="4"/>
            <text class="caption-text" x="86" y="450">
              <tspan x="86" dy="0">The volume of fluid</tspan>
              <tspan x="86" dy="38">crossing σₖ in the</tspan>
              <tspan x="86" dy="38">direction of n per unit time.</tspan>
            </text>
          </svg>
        </div>

        <aside class="readout" aria-live="polite">
          <h1>Flux Through σₖ</h1>
          <div class="formula">
            F(x*ₖ,y*ₖ,z*ₖ) · n(x*ₖ,y*ₖ,z*ₖ) ΔSₖ
          </div>
          <div class="metric">
            <span>normal component F · n</span>
            <span id="componentText">25.0 cm/s</span>
          </div>
          <div class="metric">
            <span>patch area ΔSₖ</span>
            <span id="areaText">2.00 cm²</span>
          </div>
          <div class="metric rate">
            <span>volume rate</span>
            <span id="rateText">50.0 cm³/s</span>
          </div>
          <p id="signNote" class="note">Positive flux means the fluid crosses in the direction of the chosen normal.</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("fluxSvg");
      const surfaceFill = document.getElementById("surfaceFill");
      const gridLines = document.getElementById("gridLines");
      const patchPath = document.getElementById("patchPath");
      const patchRidge = document.getElementById("patchRidge");
      const flowGroup = document.getElementById("flowGroup");
      const areaLeader = document.getElementById("areaLeader");
      const areaLabel = document.getElementById("areaLabel");
      const areaValue = document.getElementById("areaValue");
      const surfaceLeader = document.getElementById("surfaceLeader");
      const surfaceLabel = document.getElementById("surfaceLabel");
      const normalLine = document.getElementById("normalLine");
      const normalDot = document.getElementById("normalDot");
      const normalLabel = document.getElementById("normalLabel");
      const captionConnector = document.getElementById("captionConnector");
      const velocity = document.getElementById("velocity");
      const reverseFlow = document.getElementById("reverseFlow");
      const velocityNumber = document.getElementById("velocityNumber");
      const componentText = document.getElementById("componentText");
      const areaText = document.getElementById("areaText");
      const rateText = document.getElementById("rateText");
      const signNote = document.getElementById("signNote");

      const U_MIN = -1.15;
      const U_MAX = 1.15;
      const V_MIN = -0.92;
      const V_MAX = 0.92;
      const PATCH_DU = 0.46;
      const PATCH_DV = 0.42;
      const VIEW = { cx: 410, cy: 248, ux: 216, vx: 96, vy: 78, z: 142 };

      const state = { u: -0.06, v: 0.02, dragging: false };
      const initialMetric = areaMetric(state.u, state.v);
      const areaCalibration = 2 / initialMetric;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function surfaceZ(u, v) {
        return 0.26 * Math.sin(1.45 * u) + 0.19 * Math.cos(1.65 * v) + 0.08 * u * v;
      }

      function dzdu(u, v) {
        return 0.377 * Math.cos(1.45 * u) + 0.08 * v;
      }

      function dzdv(u, v) {
        return -0.3135 * Math.sin(1.65 * v) + 0.08 * u;
      }

      function projectXYZ(x, y, z) {
        return {
          x: VIEW.cx + VIEW.ux * x + VIEW.vx * y,
          y: VIEW.cy + VIEW.vy * y - VIEW.z * z
        };
      }

      function projectSurface(u, v) {
        return projectXYZ(u, v, surfaceZ(u, v));
      }

      function areaMetric(u, v) {
        const zu = dzdu(u, v);
        const zv = dzdv(u, v);
        return Math.sqrt(1 + zu * zu + zv * zv);
      }

      function normalAt(u, v) {
        const zu = dzdu(u, v);
        const zv = dzdv(u, v);
        const len = Math.sqrt(zu * zu + zv * zv + 1);
        return { x: -zu / len, y: -zv / len, z: 1 / len };
      }

      function vector(a, b) {
        return { x: b.x - a.x, y: b.y - a.y };
      }

      function length2D(v) {
        return Math.hypot(v.x, v.y) || 1;
      }

      function normalize2D(v) {
        const len = length2D(v);
        return { x: v.x / len, y: v.y / len };
      }

      function pointPath(points) {
        return points.map((p, i) => `${i ? "L" : "M"} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" ");
      }

      function surfacePatchPath(u1, u2, v1, v2, samples = 13) {
        const pts = [];
        for (let i = 0; i <= samples; i += 1) {
          pts.push(projectSurface(u1 + (u2 - u1) * i / samples, v1));
        }
        for (let i = 1; i <= samples; i += 1) {
          pts.push(projectSurface(u2, v1 + (v2 - v1) * i / samples));
        }
        for (let i = 1; i <= samples; i += 1) {
          pts.push(projectSurface(u2 - (u2 - u1) * i / samples, v2));
        }
        for (let i = 1; i < samples; i += 1) {
          pts.push(projectSurface(u1, v2 - (v2 - v1) * i / samples));
        }
        return `${pointPath(pts)} Z`;
      }

      function gridPolyline(kind, value, samples = 38) {
        const pts = [];
        for (let i = 0; i <= samples; i += 1) {
          const t = i / samples;
          const u = kind === "u" ? value : U_MIN + (U_MAX - U_MIN) * t;
          const v = kind === "v" ? value : V_MIN + (V_MAX - V_MIN) * t;
          pts.push(projectSurface(u, v));
        }
        return pointPath(pts);
      }

      function drawSurface() {
        surfaceFill.setAttribute("d", surfacePatchPath(U_MIN, U_MAX, V_MIN, V_MAX, 28));
        const lines = [];
        [-0.72, -0.36, 0, 0.36, 0.72].forEach((u) => {
          lines.push(`<path class="grid-line" d="${gridPolyline("u", u)}"/>`);
        });
        [-0.58, 0, 0.58].forEach((v) => {
          lines.push(`<path class="grid-line" d="${gridPolyline("v", v)}"/>`);
        });
        gridLines.innerHTML = lines.join("");
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function nearestUV(px, py) {
        let v = clamp((py - VIEW.cy) / VIEW.vy, V_MIN + PATCH_DV / 2, V_MAX - PATCH_DV / 2);
        let u = clamp((px - VIEW.cx - VIEW.vx * v) / VIEW.ux, U_MIN + PATCH_DU / 2, U_MAX - PATCH_DU / 2);
        let step = 0.34;

        for (let pass = 0; pass < 7; pass += 1) {
          let best = { u, v, d: Infinity };
          for (let iu = -1; iu <= 1; iu += 1) {
            for (let iv = -1; iv <= 1; iv += 1) {
              const cu = clamp(u + iu * step, U_MIN + PATCH_DU / 2, U_MAX - PATCH_DU / 2);
              const cv = clamp(v + iv * step, V_MIN + PATCH_DV / 2, V_MAX - PATCH_DV / 2);
              const p = projectSurface(cu, cv);
              const d = (p.x - px) ** 2 + (p.y - py) ** 2;
              if (d < best.d) best = { u: cu, v: cv, d };
            }
          }
          u = best.u;
          v = best.v;
          step *= 0.48;
        }
        return { u, v };
      }

      function setPatchFromPointer(evt) {
        const p = svgPoint(evt);
        const uv = nearestUV(p.x, p.y);
        state.u = uv.u;
        state.v = uv.v;
        render();
      }

      function renderFlow(center, normalTip, u, v, sign, magnitude) {
        const normalDir = normalize2D(vector(center, normalTip));
        const flowDir = { x: normalDir.x * sign, y: normalDir.y * sign };
        const tangentA = normalize2D(vector(projectSurface(u - 0.12, v), projectSurface(u + 0.12, v)));
        const tangentB = normalize2D(vector(projectSurface(u, v - 0.12), projectSurface(u, v + 0.12)));
        const flowLength = 52 + 34 * (magnitude / 45);
        const starts = [
          { x: center.x - tangentA.x * 98 + tangentB.x * 18, y: center.y - tangentA.y * 98 + tangentB.y * 18 },
          { x: center.x + tangentA.x * 100 + tangentB.x * 12, y: center.y + tangentA.y * 100 + tangentB.y * 12 },
          { x: center.x - tangentB.x * 84 - tangentA.x * 12, y: center.y - tangentB.y * 84 - tangentA.y * 12 }
        ];

        flowGroup.innerHTML = starts.map((mid) => {
          const start = { x: mid.x - flowDir.x * flowLength * 0.54, y: mid.y - flowDir.y * flowLength * 0.54 };
          const end = { x: mid.x + flowDir.x * flowLength * 0.46, y: mid.y + flowDir.y * flowLength * 0.46 };
          return `<line class="flow-arrow" x1="${start.x.toFixed(2)}" y1="${start.y.toFixed(2)}" x2="${end.x.toFixed(2)}" y2="${end.y.toFixed(2)}" marker-end="url(#blackArrow)"/>`;
        }).join("");
      }

      function render() {
        const u = state.u;
        const v = state.v;
        const u1 = u - PATCH_DU / 2;
        const u2 = u + PATCH_DU / 2;
        const v1 = v - PATCH_DV / 2;
        const v2 = v + PATCH_DV / 2;
        const center = projectSurface(u, v);
        const normal = normalAt(u, v);
        const normalTip = projectXYZ(u + normal.x * 0.58, v + normal.y * 0.58, surfaceZ(u, v) + normal.z * 0.58);
        const patchArea = areaCalibration * areaMetric(u, v);
        const magnitude = Number(velocity.value);
        const sign = reverseFlow.checked ? -1 : 1;
        const component = sign * magnitude;
        const rate = component * patchArea;

        patchPath.setAttribute("d", surfacePatchPath(u1, u2, v1, v2, 16));
        patchRidge.setAttribute("d", gridPolyline("v", v, 16).replace(/^M [^L]+ L /, "M "));
        const ridgeLeft = projectSurface(u1, v);
        const ridgeRight = projectSurface(u2, v);
        patchRidge.setAttribute("d", `M ${ridgeLeft.x.toFixed(2)} ${ridgeLeft.y.toFixed(2)} C ${(center.x - 40).toFixed(2)} ${(center.y - 14).toFixed(2)} ${(center.x + 40).toFixed(2)} ${(center.y + 14).toFixed(2)} ${ridgeRight.x.toFixed(2)} ${ridgeRight.y.toFixed(2)}`);

        normalLine.setAttribute("x1", center.x);
        normalLine.setAttribute("y1", center.y);
        normalLine.setAttribute("x2", normalTip.x);
        normalLine.setAttribute("y2", normalTip.y);
        normalDot.setAttribute("cx", center.x);
        normalDot.setAttribute("cy", center.y);
        normalLabel.setAttribute("x", normalTip.x + 22);
        normalLabel.setAttribute("y", normalTip.y - 10);

        renderFlow(center, normalTip, u, v, sign, magnitude);

        const areaAnchor = projectSurface(u + PATCH_DU * 0.38, v - PATCH_DV * 0.46);
        const labelX = clamp(center.x + 126, 132, 700);
        const labelY = clamp(center.y - 112, 46, 158);
        areaLabel.setAttribute("x", labelX);
        areaLabel.setAttribute("y", labelY);
        areaValue.setAttribute("x", labelX);
        areaLeader.setAttribute("d", `M ${labelX - 20} ${labelY + 13} C ${labelX - 74} ${labelY + 18} ${areaAnchor.x + 42} ${areaAnchor.y - 42} ${areaAnchor.x} ${areaAnchor.y}`);

        const surfaceTextX = clamp(center.x + 170, 590, 696);
        const surfaceTextY = clamp(center.y - 8, 130, 255);
        surfaceLabel.setAttribute("x", surfaceTextX);
        surfaceLabel.setAttribute("y", surfaceTextY);
        const surfaceAnchor = projectSurface(u + PATCH_DU / 2, v + PATCH_DV * 0.25);
        surfaceLeader.setAttribute("d", `M ${surfaceTextX + 120} ${surfaceTextY + 20} C ${surfaceTextX + 86} ${surfaceTextY + 58} ${surfaceAnchor.x + 52} ${surfaceAnchor.y + 15} ${surfaceAnchor.x} ${surfaceAnchor.y}`);

        captionConnector.setAttribute("d", `M 565 405 C 610 358 ${center.x + 85} ${center.y + 78} ${center.x + 26} ${center.y + 32}`);

        velocityNumber.textContent = `${magnitude.toFixed(1)} cm/s`;
        componentText.textContent = `${component.toFixed(1)} cm/s`;
        areaText.textContent = `${patchArea.toFixed(2)} cm²`;
        areaValue.textContent = `${patchArea.toFixed(2)} cm²`;
        rateText.textContent = `${rate.toFixed(1)} cm³/s`;
        signNote.textContent = rate >= 0
          ? "Positive flux means the fluid crosses in the direction of the chosen normal."
          : "Negative flux means the fluid crosses opposite the chosen normal.";
      }

      drawSurface();
      render();

      svg.addEventListener("pointerdown", (evt) => {
        state.dragging = true;
        svg.setPointerCapture(evt.pointerId);
        setPatchFromPointer(evt);
      });

      svg.addEventListener("pointermove", (evt) => {
        if (!state.dragging) return;
        setPatchFromPointer(evt);
      });

      svg.addEventListener("pointerup", (evt) => {
        state.dragging = false;
        if (svg.hasPointerCapture(evt.pointerId)) svg.releasePointerCapture(evt.pointerId);
      });

      svg.addEventListener("pointercancel", (evt) => {
        state.dragging = false;
        if (svg.hasPointerCapture(evt.pointerId)) svg.releasePointerCapture(evt.pointerId);
      });

      velocity.addEventListener("input", render);
      reverseFlow.addEventListener("change", render);
    })();
  </script>
</body>
</html>
