<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endpoint Error in Optical Flow</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5b6472;
      --panel: #ffffff;
      --paper: #f6f8fb;
      --accent: #e41414;
      --angle: #2563eb;
      --truth: #111111;
      --estimate: #111111;
      --ring: rgba(37, 99, 235, 0.18);
      --shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, #ffffff 0%, #eef3f8 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure-shell {
      width: min(1120px, 100vw);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: clamp(12px, 2vw, 24px);
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(12px);
      min-width: 0;
      max-width: 100%;
    }

    .metric-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: #e9eef5;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .metric-toggle button,
    .reset-button {
      border: 0;
      border-radius: 6px;
      min-height: 36px;
      padding: 0 14px;
      color: #1f2937;
      background: transparent;
      font: 700 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    .metric-toggle button[aria-pressed="true"] {
      color: #ffffff;
      background: #111827;
      box-shadow: 0 5px 14px rgba(17, 24, 39, 0.22);
    }

    .reset-button {
      border: 1px solid rgba(148, 163, 184, 0.55);
      background: #ffffff;
    }

    .readout {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .readout strong {
      color: #111827;
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.32);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }

    svg {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: min(72vh, 680px);
      touch-action: none;
      user-select: none;
    }

    .axis-grid line {
      stroke: #f1f4f8;
      stroke-width: 1;
    }

    .vector {
      stroke: var(--ink);
      stroke-width: 7;
      stroke-linecap: round;
      marker-end: url(#arrowhead);
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6));
    }

    .endpoint-error {
      stroke: var(--accent);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .angle-arc {
      fill: none;
      stroke: var(--angle);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .angle-radius {
      stroke: var(--angle);
      stroke-width: 2;
      stroke-dasharray: 6 7;
      opacity: 0.62;
    }

    .angle-fill {
      fill: rgba(37, 99, 235, 0.10);
      stroke: none;
    }

    .endpoint-halo {
      fill: var(--ring);
      stroke: rgba(37, 99, 235, 0.34);
      stroke-width: 2;
      opacity: 0;
      transition: opacity 140ms ease;
    }

    .drag-hit {
      fill: transparent;
      cursor: grab;
    }

    .drag-hit:active {
      cursor: grabbing;
    }

    .handle {
      fill: #ffffff;
      stroke: #111827;
      stroke-width: 3;
      opacity: 0.96;
      pointer-events: none;
    }

    .draggable:hover .endpoint-halo,
    .draggable.is-active .endpoint-halo {
      opacity: 1;
    }

    .label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 68px;
      fill: #000000;
    }

    .small-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 60px;
      fill: #000000;
    }

    .metric-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      fill: #000000;
      font-weight: 700;
    }

    .angle-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      fill: var(--angle);
      font-weight: 700;
    }

    .hat-label {
      font-size: 34px;
      font-weight: 700;
    }

    .formula {
      position: absolute;
      right: 16px;
      bottom: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.34);
      color: #111827;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .figure-shell {
        padding: 8px;
        gap: 8px;
        min-height: auto;
        grid-template-rows: auto auto;
        width: 100vw;
        max-width: 100vw;
      }

      .toolbar {
        align-items: stretch;
        display: grid;
        grid-template-columns: 1fr;
        width: 100%;
        overflow: hidden;
      }

      .metric-toggle,
      .readout,
      .reset-button {
        width: 100%;
        min-width: 0;
      }

      .metric-toggle {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .metric-toggle button {
        min-width: 0;
        padding: 0 8px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .readout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .readout span {
        min-width: 0;
      }

      svg {
        height: auto;
        min-height: 0;
        aspect-ratio: 960 / 680;
      }

      .formula {
        right: 10px;
        left: auto;
        bottom: 10px;
        font-size: 14px;
        max-width: min(280px, calc(100% - 20px));
        overflow-wrap: anywhere;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive diagram of endpoint error between optical flow vectors">
    <section class="toolbar" aria-label="Controls">
      <div class="metric-toggle" role="group" aria-label="Metric">
        <button id="endpointMode" type="button" aria-pressed="true">Endpoint error</button>
        <button id="angularMode" type="button" aria-pressed="false">Angular error</button>
      </div>
      <div class="readout" aria-live="polite">
        <span>Endpoint error: <strong id="distanceValue">0.00</strong></span>
        <span>Angular error: <strong id="angleValue">0.0°</strong></span>
      </div>
      <button class="reset-button" id="resetButton" type="button">Reset vectors</button>
    </section>

    <section class="canvas-wrap">
      <svg id="figure" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
        <title id="title">Endpoint error for optical flow</title>
        <desc id="desc">Two black optical flow vectors share an origin. A red segment connects their endpoints and can be compared with the angular difference between them.</desc>
        <defs>
          <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5.9" refY="3.5" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#111111"></path>
          </marker>
          <filter id="labelBacking" x="-15%" y="-20%" width="130%" height="140%">
            <feFlood flood-color="#ffffff" flood-opacity="0.78" result="flood"></feFlood>
            <feComposite in="flood" in2="SourceGraphic" operator="in"></feComposite>
            <feMerge>
              <feMergeNode></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <g class="axis-grid" aria-hidden="true">
          <line x1="110" y1="100" x2="110" y2="620"></line>
          <line x1="210" y1="100" x2="210" y2="620"></line>
          <line x1="310" y1="100" x2="310" y2="620"></line>
          <line x1="410" y1="100" x2="410" y2="620"></line>
          <line x1="510" y1="100" x2="510" y2="620"></line>
          <line x1="610" y1="100" x2="610" y2="620"></line>
          <line x1="710" y1="100" x2="710" y2="620"></line>
          <line x1="70" y1="160" x2="820" y2="160"></line>
          <line x1="70" y1="260" x2="820" y2="260"></line>
          <line x1="70" y1="360" x2="820" y2="360"></line>
          <line x1="70" y1="460" x2="820" y2="460"></line>
          <line x1="70" y1="560" x2="820" y2="560"></line>
        </g>

        <g id="angleGroup">
          <path id="angleFill" class="angle-fill"></path>
          <line id="angleRadiusA" class="angle-radius"></line>
          <line id="angleRadiusB" class="angle-radius"></line>
          <path id="angleArc" class="angle-arc"></path>
          <text id="angleLabel" class="angle-label" filter="url(#labelBacking)">Angular error</text>
        </g>

        <line id="truthVector" class="vector" x1="86" y1="620" x2="575" y2="46"></line>
        <line id="estimateVector" class="vector" x1="86" y1="620" x2="654" y2="323"></line>
        <line id="errorSegment" class="endpoint-error" x1="575" y1="46" x2="654" y2="323"></line>

        <text id="truthLabel" class="label" x="296" y="84" filter="url(#labelBacking)">(u,v)</text>
        <g id="estimateLabel" class="small-label" transform="translate(510 490)" filter="url(#labelBacking)">
          <text x="0" y="0">(u,v)</text>
          <text class="hat-label" x="36" y="-33">^</text>
          <text class="hat-label" x="107" y="-33">^</text>
        </g>
        <text id="endpointLabel" class="metric-label" x="650" y="108" filter="url(#labelBacking)">
          <tspan x="650" dy="0">Endpoint</tspan>
          <tspan x="650" dy="84">error</tspan>
        </text>

        <circle id="originDot" cx="86" cy="620" r="5" fill="#111111"></circle>

        <g id="truthHandleGroup" class="draggable" data-vector="truth" aria-label="Drag ground truth vector endpoint">
          <circle id="truthHalo" class="endpoint-halo" r="25"></circle>
          <circle id="truthHit" class="drag-hit" r="34"></circle>
          <circle id="truthHandle" class="handle" r="7"></circle>
        </g>
        <g id="estimateHandleGroup" class="draggable" data-vector="estimate" aria-label="Drag estimated vector endpoint">
          <circle id="estimateHalo" class="endpoint-halo" r="25"></circle>
          <circle id="estimateHit" class="drag-hit" r="34"></circle>
          <circle id="estimateHandle" class="handle" r="7"></circle>
        </g>
      </svg>
      <div id="formula" class="formula">EPE = √((û - u)² + (v̂ - v)²)</div>
    </section>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("figure");
      const origin = { x: 86, y: 620 };
      const defaults = {
        truth: { x: 575, y: 46 },
        estimate: { x: 654, y: 323 }
      };
      const state = {
        mode: "endpoint",
        truth: { ...defaults.truth },
        estimate: { ...defaults.estimate },
        active: null
      };

      const bounds = {
        minX: 120,
        maxX: 820,
        minY: 38,
        maxY: 590
      };

      const els = {
        truthVector: document.getElementById("truthVector"),
        estimateVector: document.getElementById("estimateVector"),
        errorSegment: document.getElementById("errorSegment"),
        truthHandleGroup: document.getElementById("truthHandleGroup"),
        estimateHandleGroup: document.getElementById("estimateHandleGroup"),
        truthHandle: document.getElementById("truthHandle"),
        estimateHandle: document.getElementById("estimateHandle"),
        truthHalo: document.getElementById("truthHalo"),
        estimateHalo: document.getElementById("estimateHalo"),
        truthHit: document.getElementById("truthHit"),
        estimateHit: document.getElementById("estimateHit"),
        truthLabel: document.getElementById("truthLabel"),
        estimateLabel: document.getElementById("estimateLabel"),
        endpointLabel: document.getElementById("endpointLabel"),
        angleGroup: document.getElementById("angleGroup"),
        angleFill: document.getElementById("angleFill"),
        angleArc: document.getElementById("angleArc"),
        angleRadiusA: document.getElementById("angleRadiusA"),
        angleRadiusB: document.getElementById("angleRadiusB"),
        angleLabel: document.getElementById("angleLabel"),
        distanceValue: document.getElementById("distanceValue"),
        angleValue: document.getElementById("angleValue"),
        endpointMode: document.getElementById("endpointMode"),
        angularMode: document.getElementById("angularMode"),
        resetButton: document.getElementById("resetButton"),
        formula: document.getElementById("formula")
      };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const length = (point) => Math.hypot(point.x - origin.x, point.y - origin.y);
      const pointOnRay = (point, radius) => {
        const dx = point.x - origin.x;
        const dy = point.y - origin.y;
        const mag = Math.hypot(dx, dy) || 1;
        return { x: origin.x + dx / mag * radius, y: origin.y + dy / mag * radius };
      };

      function clientToSvgPoint(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function vectorAngle(point) {
        return Math.atan2(point.y - origin.y, point.x - origin.x);
      }

      function angularDifference(a, b) {
        let diff = Math.abs(a - b);
        while (diff > Math.PI) diff = Math.abs(diff - Math.PI * 2);
        return diff;
      }

      function polarPoint(radius, angle) {
        return {
          x: origin.x + radius * Math.cos(angle),
          y: origin.y + radius * Math.sin(angle)
        };
      }

      function arcPath(radius, a0, a1) {
        let delta = a1 - a0;
        if (delta > Math.PI) delta -= Math.PI * 2;
        if (delta < -Math.PI) delta += Math.PI * 2;
        const endAngle = a0 + delta;
        const start = polarPoint(radius, a0);
        const end = polarPoint(radius, endAngle);
        const largeArc = Math.abs(delta) > Math.PI ? 1 : 0;
        const sweep = delta >= 0 ? 1 : 0;
        return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${radius} ${radius} 0 ${largeArc} ${sweep} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
      }

      function wedgePath(radius, a0, a1) {
        let delta = a1 - a0;
        if (delta > Math.PI) delta -= Math.PI * 2;
        if (delta < -Math.PI) delta += Math.PI * 2;
        const endAngle = a0 + delta;
        const start = polarPoint(radius, a0);
        const end = polarPoint(radius, endAngle);
        const largeArc = Math.abs(delta) > Math.PI ? 1 : 0;
        const sweep = delta >= 0 ? 1 : 0;
        return `M ${origin.x} ${origin.y} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${radius} ${radius} 0 ${largeArc} ${sweep} ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
      }

      function setLine(line, x1, y1, x2, y2) {
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
      }

      function setCircle(circle, point) {
        circle.setAttribute("cx", point.x);
        circle.setAttribute("cy", point.y);
      }

      function placeVectorLabel(label, point, kind) {
        const baseX = kind === "truth"
          ? clamp(point.x - 286, 18, 760)
          : clamp(point.x - 142, 18, 760);
        const baseY = kind === "truth"
          ? clamp(point.y - 78, 64, 646)
          : clamp(point.y + 132, 64, 646);
        if (kind === "estimate") {
          label.setAttribute("transform", `translate(${baseX} ${baseY})`);
        } else {
          label.setAttribute("x", baseX);
          label.setAttribute("y", baseY);
        }
      }

      function placeEndpointLabel() {
        const mid = {
          x: (state.truth.x + state.estimate.x) / 2,
          y: (state.truth.y + state.estimate.y) / 2
        };
        const dx = state.estimate.x - state.truth.x;
        const dy = state.estimate.y - state.truth.y;
        const mag = Math.hypot(dx, dy) || 1;
        const px = -dy / mag;
        const py = dx / mag;
        const preferRight = mid.x < 700 ? 1 : -1;
        const x = clamp(mid.x + px * 28 * preferRight + 44, 560, 810);
        const y = clamp(mid.y + py * 28 * preferRight - 66, 86, 450);
        els.endpointLabel.querySelectorAll("tspan").forEach((tspan, index) => {
          tspan.setAttribute("x", x);
          tspan.setAttribute("dy", index === 0 ? "0" : "74");
        });
        els.endpointLabel.setAttribute("x", x);
        els.endpointLabel.setAttribute("y", y);
      }

      function updateAngleGeometry() {
        const truthAngle = vectorAngle(state.truth);
        const estimateAngle = vectorAngle(state.estimate);
        const radius = clamp(Math.min(length(state.truth), length(state.estimate)) * 0.28, 76, 150);
        const pA = pointOnRay(state.truth, radius);
        const pB = pointOnRay(state.estimate, radius);
        setLine(els.angleRadiusA, origin.x, origin.y, pA.x, pA.y);
        setLine(els.angleRadiusB, origin.x, origin.y, pB.x, pB.y);
        els.angleArc.setAttribute("d", arcPath(radius, truthAngle, estimateAngle));
        els.angleFill.setAttribute("d", wedgePath(radius, truthAngle, estimateAngle));

        let delta = estimateAngle - truthAngle;
        if (delta > Math.PI) delta -= Math.PI * 2;
        if (delta < -Math.PI) delta += Math.PI * 2;
        const midAngle = truthAngle + delta / 2;
        const labelPoint = polarPoint(radius + 32, midAngle);
        els.angleLabel.setAttribute("x", clamp(labelPoint.x + 8, 118, 710));
        els.angleLabel.setAttribute("y", clamp(labelPoint.y + 18, 116, 612));
      }

      function updateMode() {
        const endpointMode = state.mode === "endpoint";
        els.endpointMode.setAttribute("aria-pressed", String(endpointMode));
        els.angularMode.setAttribute("aria-pressed", String(!endpointMode));
        els.errorSegment.style.opacity = endpointMode ? "1" : "0.20";
        els.endpointLabel.style.opacity = endpointMode ? "1" : "0.20";
        els.angleGroup.style.opacity = endpointMode ? "0" : "1";
        els.angleGroup.style.pointerEvents = "none";
        els.formula.textContent = endpointMode
          ? "EPE = √((û - u)² + (v̂ - v)²)"
          : "θ = cos⁻¹((û · u) / (||û|| ||u||))";
      }

      function update() {
        setLine(els.truthVector, origin.x, origin.y, state.truth.x, state.truth.y);
        setLine(els.estimateVector, origin.x, origin.y, state.estimate.x, state.estimate.y);
        setLine(els.errorSegment, state.truth.x, state.truth.y, state.estimate.x, state.estimate.y);
        [els.truthHandle, els.truthHalo, els.truthHit].forEach((el) => setCircle(el, state.truth));
        [els.estimateHandle, els.estimateHalo, els.estimateHit].forEach((el) => setCircle(el, state.estimate));

        placeVectorLabel(els.truthLabel, state.truth, "truth");
        placeVectorLabel(els.estimateLabel, state.estimate, "estimate");
        placeEndpointLabel();
        updateAngleGeometry();

        const dx = state.estimate.x - state.truth.x;
        const dy = state.estimate.y - state.truth.y;
        const distance = Math.hypot(dx, dy) / 64;
        const angle = angularDifference(vectorAngle(state.truth), vectorAngle(state.estimate)) * 180 / Math.PI;
        els.distanceValue.textContent = distance.toFixed(2);
        els.angleValue.textContent = `${angle.toFixed(1)}°`;
        updateMode();
      }

      function beginDrag(event) {
        const group = event.currentTarget;
        state.active = group.dataset.vector;
        group.classList.add("is-active");
        group.setPointerCapture(event.pointerId);
      }

      function moveDrag(event) {
        if (!state.active) return;
        event.preventDefault();
        const point = clientToSvgPoint(event);
        state[state.active] = {
          x: clamp(point.x, bounds.minX, bounds.maxX),
          y: clamp(point.y, bounds.minY, bounds.maxY)
        };
        update();
      }

      function endDrag(event) {
        if (!state.active) return;
        const group = state.active === "truth" ? els.truthHandleGroup : els.estimateHandleGroup;
        group.classList.remove("is-active");
        if (group.hasPointerCapture(event.pointerId)) {
          group.releasePointerCapture(event.pointerId);
        }
        state.active = null;
      }

      [els.truthHandleGroup, els.estimateHandleGroup].forEach((group) => {
        group.addEventListener("pointerdown", beginDrag);
        group.addEventListener("pointermove", moveDrag);
        group.addEventListener("pointerup", endDrag);
        group.addEventListener("pointercancel", endDrag);
      });

      els.endpointMode.addEventListener("click", () => {
        state.mode = "endpoint";
        update();
      });

      els.angularMode.addEventListener("click", () => {
        state.mode = "angular";
        update();
      });

      els.resetButton.addEventListener("click", () => {
        state.truth = { ...defaults.truth };
        state.estimate = { ...defaults.estimate };
        update();
      });

      update();
    })();
  </script>
</body>
</html>
