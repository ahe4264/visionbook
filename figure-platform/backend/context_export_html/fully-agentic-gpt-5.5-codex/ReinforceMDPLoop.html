<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reinforcement Learning MDP Loop</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111312;
      --muted: #53605e;
      --paper: #ffffff;
      --teal: #9edbd5;
      --teal-focus: #b7eee7;
      --orange: #d97b55;
      --orange-strong: #e55f22;
      --amber: #ffbf3c;
      --line: #d3ddd9;
      --shadow: 0 18px 42px rgba(23, 35, 37, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f4f8f7;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(12px, 3vw, 28px);
    }

    main {
      width: min(100%, 980px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 1.8vw, 1.35rem);
      font-weight: 720;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    #status {
      min-width: min(46vw, 360px);
      color: var(--muted);
      font-size: clamp(0.78rem, 1.6vw, 0.92rem);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button {
      border: 1px solid #b8c8c5;
      background: #ffffff;
      color: #173331;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(28, 50, 48, 0.08);
    }

    button:hover {
      border-color: var(--orange);
      color: #7b351b;
    }

    button:focus-visible {
      outline: 3px solid rgba(255, 191, 60, 0.55);
      outline-offset: 2px;
    }

    .figure-frame {
      width: 100%;
      aspect-ratio: 760 / 500;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
      user-select: none;
    }

    .box rect {
      fill: var(--teal);
      stroke: #111312;
      stroke-width: 2.2;
      transition: fill 160ms ease, filter 160ms ease, stroke-width 160ms ease;
    }

    .box.clickable {
      cursor: pointer;
    }

    .box.clickable:hover rect,
    .box.is-active rect {
      fill: var(--teal-focus);
      stroke-width: 3.2;
      filter: url(#boxGlow);
    }

    .box-title {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .agent-title {
      font-size: 41px;
    }

    .box-subtitle {
      font-size: 28px;
      font-weight: 500;
    }

    .formula {
      font-family: "Cambria Math", Cambria, "Times New Roman", serif;
      font-size: 31px;
      font-style: italic;
    }

    .small-sub {
      font-size: 0.62em;
    }

    .flow {
      fill: none;
      stroke: var(--orange);
      stroke-width: 3.4;
      stroke-linecap: square;
      stroke-linejoin: miter;
      marker-end: url(#arrow);
      transition: stroke 140ms ease, stroke-width 140ms ease, filter 140ms ease;
    }

    .flow.is-active {
      stroke: var(--orange-strong);
      stroke-width: 6.2;
      marker-end: url(#arrowActive);
      filter: url(#flowGlow);
    }

    .time-divider {
      fill: none;
      stroke: #111312;
      stroke-width: 3.6;
      stroke-linecap: butt;
      stroke-dasharray: 7 12;
    }

    .label-pad rect {
      fill: rgba(255, 255, 255, 0.96);
      stroke: transparent;
      stroke-width: 2;
      transition: fill 140ms ease, stroke 140ms ease, filter 140ms ease;
    }

    .label-pad text {
      fill: #050505;
      dominant-baseline: middle;
      text-anchor: middle;
      transition: fill 140ms ease;
    }

    .label-main {
      font-size: 30px;
      font-weight: 460;
    }

    .label-var {
      font-family: "Cambria Math", Cambria, "Times New Roman", serif;
      font-size: 30px;
      font-style: italic;
    }

    .label-pad.is-active rect {
      fill: #fff5de;
      stroke: var(--amber);
      filter: url(#labelGlow);
    }

    .label-pad.is-active text {
      fill: #81300d;
    }

    .concept {
      transition: fill 140ms ease, filter 140ms ease, font-weight 140ms ease;
    }

    .concept.is-active {
      fill: #7a2b08;
      font-weight: 750;
      filter: url(#textGlow);
    }

    .token {
      opacity: 0;
      pointer-events: none;
      filter: url(#tokenGlow);
    }

    .token-core {
      fill: #ffffff;
      stroke: var(--orange-strong);
      stroke-width: 3;
    }

    .token-symbol {
      font-family: "Cambria Math", Cambria, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 700;
      fill: #7a2b08;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    @media (max-width: 620px) {
      body {
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        width: 100%;
        justify-content: space-between;
      }

      #status {
        min-width: 0;
        flex: 1;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="figure-title">
    <div class="topbar">
      <h1 id="figure-title">Markov Decision Process Interaction Loop</h1>
      <div class="controls">
        <div id="status" aria-live="polite">Ready</div>
        <button id="replay" type="button" aria-label="Replay one MDP time step">Replay</button>
      </div>
    </div>

    <div class="figure-frame">
      <svg id="mdp-svg" viewBox="0 0 760 500" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Agent and environment reinforcement learning loop</title>
        <desc id="svg-desc">A policy inside the agent selects an action from the current state. The environment uses state transition and reward probabilities to return a reward and next state.</desc>

        <defs>
          <marker id="arrow" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10.5" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 12 6 L 0 12 Z" fill="#d97b55"></path>
          </marker>
          <marker id="arrowActive" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10.5" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 12 6 L 0 12 Z" fill="#e55f22"></path>
          </marker>
          <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffbf3c" flood-opacity="0.45"></feDropShadow>
          </filter>
          <filter id="flowGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffbf3c" flood-opacity="0.8"></feDropShadow>
          </filter>
          <filter id="labelGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffbf3c" flood-opacity="0.55"></feDropShadow>
          </filter>
          <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffbf3c" flood-opacity="0.55"></feDropShadow>
          </filter>
          <filter id="tokenGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#e55f22" flood-opacity="0.75"></feDropShadow>
          </filter>
        </defs>

        <g id="agent-box" class="box clickable" role="button" tabindex="0" aria-label="Agent policy">
          <rect x="282" y="1.5" width="216" height="133" rx="25"></rect>
          <text class="box-title agent-title" x="390" y="56" text-anchor="middle">Agent</text>
          <text id="agent-policy" class="box-subtitle concept" x="390" y="102" text-anchor="middle">
            <tspan>Policy </tspan><tspan class="formula">π</tspan><tspan class="formula">[a</tspan><tspan class="formula small-sub" baseline-shift="sub">t</tspan><tspan class="formula">|s</tspan><tspan class="formula small-sub" baseline-shift="sub">t</tspan><tspan class="formula">]</tspan>
          </text>
        </g>

        <g id="env-box" class="box clickable" role="button" tabindex="0" aria-label="Environment dynamics and reward function">
          <rect x="246" y="259" width="288" height="216" rx="42"></rect>
          <text class="box-title" x="390" y="306" text-anchor="middle">Environment</text>
          <text id="env-transition" class="box-subtitle concept" x="390" y="346" text-anchor="middle">State transition</text>
          <text id="env-transition-formula" class="formula concept" x="390" y="379" text-anchor="middle">
            <tspan>Pr(s</tspan><tspan class="small-sub" baseline-shift="sub">t+1</tspan><tspan>|s</tspan><tspan class="small-sub" baseline-shift="sub">t</tspan><tspan>, a</tspan><tspan class="small-sub" baseline-shift="sub">t</tspan><tspan>)</tspan>
          </text>
          <text id="env-reward" class="box-subtitle concept" x="390" y="423" text-anchor="middle">Reward function</text>
          <text id="env-reward-formula" class="formula concept" x="390" y="456" text-anchor="middle">
            <tspan>Pr(r</tspan><tspan class="small-sub" baseline-shift="sub">t+1</tspan><tspan>|s</tspan><tspan class="small-sub" baseline-shift="sub">t</tspan><tspan>, a</tspan><tspan class="small-sub" baseline-shift="sub">t</tspan><tspan>)</tspan>
          </text>
        </g>

        <g id="flows">
          <path id="path-reward-return" class="flow" d="M 246 420 H 52 V 37 H 282"></path>
          <path id="path-state-return" class="flow" d="M 246 323 H 148 V 95 H 282"></path>
          <path id="path-state-input" class="flow" d="M 148 154 H 614 V 323 H 534"></path>
          <path id="path-action" class="flow" d="M 498 64 H 708 V 420 H 534"></path>
          <path class="time-divider" d="M 173 286 V 438"></path>
        </g>

        <g id="label-reward-current" class="label-pad">
          <rect x="2" y="183" width="105" height="61" rx="4"></rect>
          <text class="label-main" x="54" y="203">Reward</text>
          <text class="label-var" x="54" y="231">r<tspan class="small-sub" baseline-shift="sub">t</tspan></text>
        </g>

        <g id="label-state-left" class="label-pad">
          <rect x="111" y="183" width="76" height="61" rx="4"></rect>
          <text class="label-main" x="149" y="203">State</text>
          <text class="label-var" x="149" y="231">s<tspan class="small-sub" baseline-shift="sub">t</tspan></text>
        </g>

        <g id="label-state-right" class="label-pad">
          <rect x="573" y="183" width="82" height="61" rx="4"></rect>
          <text class="label-main" x="614" y="203">State</text>
          <text class="label-var" x="614" y="231">s<tspan class="small-sub" baseline-shift="sub">t</tspan></text>
        </g>

        <g id="label-action" class="label-pad">
          <rect x="661" y="183" width="95" height="61" rx="4"></rect>
          <text class="label-main" x="708" y="203">Action</text>
          <text class="label-var" x="708" y="231">a<tspan class="small-sub" baseline-shift="sub">t</tspan></text>
        </g>

        <g id="label-next-state" class="label-pad">
          <rect x="181" y="294" width="64" height="39" rx="4"></rect>
          <text class="label-var" x="213" y="313">s<tspan class="small-sub" baseline-shift="sub">t+1</tspan></text>
        </g>

        <g id="label-reward-next" class="label-pad">
          <rect x="180" y="390" width="68" height="39" rx="4"></rect>
          <text class="label-var" x="214" y="410">r<tspan class="small-sub" baseline-shift="sub">t+1</tspan></text>
        </g>

        <g id="token-state" class="token" transform="translate(246 323)">
          <circle class="token-core" r="13"></circle>
          <text class="token-symbol" y="1">s</text>
        </g>
        <g id="token-action" class="token" transform="translate(498 64)">
          <circle class="token-core" r="13"></circle>
          <text class="token-symbol" y="1">a</text>
        </g>
        <g id="token-next" class="token" transform="translate(246 323)">
          <circle class="token-core" r="13"></circle>
          <text class="token-symbol" y="1">s'</text>
        </g>
        <g id="token-reward" class="token" transform="translate(246 420)">
          <circle class="token-core" r="13"></circle>
          <text class="token-symbol" y="1">r</text>
        </g>
      </svg>
    </div>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("mdp-svg");
      const status = document.getElementById("status");
      const replay = document.getElementById("replay");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const activeClass = "is-active";
      let runId = 0;
      let autoplayTimer = 0;

      const byId = (id) => document.getElementById(id);
      const activate = (ids) => {
        svg.querySelectorAll("." + activeClass).forEach((node) => node.classList.remove(activeClass));
        ids.forEach((id) => {
          const node = byId(id);
          if (node) node.classList.add(activeClass);
        });
      };

      const hideTokens = () => {
        ["token-state", "token-action", "token-next", "token-reward"].forEach((id) => {
          const token = byId(id);
          token.style.opacity = "0";
        });
      };

      const delay = (ms) => new Promise((resolve) => window.setTimeout(resolve, reduceMotion ? Math.min(ms, 120) : ms));

      const moveToken = (tokenId, pathId, duration, localRunId) => new Promise((resolve) => {
        const token = byId(tokenId);
        const path = byId(pathId);
        const length = path.getTotalLength();
        const started = performance.now();
        token.style.opacity = "1";

        if (reduceMotion) {
          const point = path.getPointAtLength(length);
          token.setAttribute("transform", `translate(${point.x} ${point.y})`);
          window.setTimeout(() => {
            token.style.opacity = "0";
            resolve();
          }, 140);
          return;
        }

        const tick = (now) => {
          if (localRunId !== runId) {
            token.style.opacity = "0";
            resolve();
            return;
          }
          const progress = Math.min(1, (now - started) / duration);
          const eased = 0.5 - Math.cos(progress * Math.PI) / 2;
          const point = path.getPointAtLength(length * eased);
          token.setAttribute("transform", `translate(${point.x} ${point.y})`);
          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            window.setTimeout(() => {
              token.style.opacity = "0";
              resolve();
            }, 120);
          }
        };

        requestAnimationFrame(tick);
      });

      const scheduleAutoplay = () => {
        window.clearTimeout(autoplayTimer);
        autoplayTimer = window.setTimeout(playStep, 4200);
      };

      const playStep = async () => {
        const localRunId = ++runId;
        window.clearTimeout(autoplayTimer);
        hideTokens();

        status.textContent = "State s_t returns to the agent";
        activate(["path-state-return", "label-state-left", "label-next-state", "agent-box"]);
        await moveToken("token-state", "path-state-return", 1450, localRunId);
        if (localRunId !== runId) return;

        status.textContent = "Policy selects action a_t";
        activate(["agent-box", "agent-policy", "path-action", "label-action"]);
        await moveToken("token-action", "path-action", 1450, localRunId);
        if (localRunId !== runId) return;

        status.textContent = "Environment samples transition and reward";
        activate(["env-box", "env-transition", "env-transition-formula", "env-reward", "env-reward-formula", "path-state-input", "path-action", "label-state-right", "label-action"]);
        await delay(650);
        if (localRunId !== runId) return;

        status.textContent = "Reward r_t+1 and next state s_t+1 close the loop";
        activate(["path-state-return", "path-reward-return", "label-next-state", "label-reward-next", "label-reward-current", "env-transition-formula", "env-reward-formula"]);
        await Promise.all([
          moveToken("token-next", "path-state-return", 1650, localRunId),
          moveToken("token-reward", "path-reward-return", 1650, localRunId)
        ]);
        if (localRunId !== runId) return;

        await delay(420);
        activate([]);
        status.textContent = "Ready";
        scheduleAutoplay();
      };

      const manualFocus = (kind) => {
        ++runId;
        window.clearTimeout(autoplayTimer);
        hideTokens();
        if (kind === "agent") {
          status.textContent = "Agent policy maps state to action";
          activate(["agent-box", "agent-policy", "path-action", "label-action"]);
        } else {
          status.textContent = "Environment returns transition and reward";
          activate(["env-box", "env-transition", "env-transition-formula", "env-reward", "env-reward-formula", "path-state-input", "path-reward-return", "label-state-right", "label-reward-next"]);
        }
        scheduleAutoplay();
      };

      byId("agent-box").addEventListener("click", () => manualFocus("agent"));
      byId("env-box").addEventListener("click", () => manualFocus("environment"));
      [byId("agent-box"), byId("env-box")].forEach((node) => {
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            manualFocus(node.id === "agent-box" ? "agent" : "environment");
          }
        });
      });
      replay.addEventListener("click", playStep);

      window.addEventListener("load", () => window.setTimeout(playStep, 350));
    })();
  </script>
</body>
</html>
