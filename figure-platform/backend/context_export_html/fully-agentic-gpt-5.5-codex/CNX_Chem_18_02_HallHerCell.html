<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall-Heroult Electrolytic Cell</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #52606d;
      --panel: #f6f8fb;
      --edge: #d8e1eb;
      --accent: #2368d8;
      --green: #a8c963;
      --aluminum: #bfc5c8;
      --steel: #3a3c3f;
      --ceramic: #e5ad90;
      --carbon: #020202;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(8px, 1.6vw, 18px);
    }

    main {
      width: min(1280px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(28, 39, 54, 0.11);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 960px;
      height: auto;
      user-select: none;
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(250px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
    }

    label,
    input,
    output {
      font: inherit;
    }

    label {
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    output,
    .readout {
      min-width: 86px;
      padding: 7px 10px;
      border: 1px solid #c6d1df;
      border-radius: 6px;
      background: #fff;
      text-align: center;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .readout {
      color: #265f32;
    }

    .label {
      fill: var(--ink);
      font-size: 26px;
    }

    .label-small {
      fill: var(--ink);
      font-size: 20px;
    }

    .inside-label {
      fill: #fff;
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
    }

    .ion-label {
      fill: #1e293b;
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }

    .reaction {
      fill: #243047;
      font-size: 18px;
      font-weight: 700;
    }

    .leader,
    .outline,
    .busbar,
    .polarity {
      stroke: #000;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .leader {
      stroke-width: 5;
      fill: none;
    }

    .outline {
      stroke-width: 3;
      fill: none;
    }

    .busbar {
      stroke-width: 4;
      fill: #fff;
    }

    .polarity {
      stroke-width: 4;
      fill: none;
    }

    .bubble {
      fill: #fff;
      stroke: rgba(35, 60, 73, 0.35);
      stroke-width: 1.5;
    }

    .bubble-label {
      fill: #243447;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }

    .al-ion {
      fill: #5a7dd7;
      stroke: #fff;
      stroke-width: 2;
    }

    .oxide-ion {
      fill: #e66d48;
      stroke: #fff;
      stroke-width: 2;
    }

    .electron {
      fill: #1f2937;
    }

    .spark {
      fill: #f7fcff;
      stroke: #5e6a73;
      stroke-width: 1.5;
      opacity: 0;
    }

    @media (max-width: 700px) {
      body {
        place-items: start center;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      label {
        white-space: normal;
      }

      output,
      .readout {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<main aria-label="Interactive Hall-Heroult electrolytic cell">
  <div class="stage">
    <svg id="cellSvg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
      <title id="title">Hall-Heroult electrolytic cell for aluminum production</title>
      <desc id="desc">A labeled cross section of a Hall-Heroult cell with animated aluminum ions moving to the carbon cathode, oxide ions moving to carbon anodes, and oxygen, carbon monoxide, and carbon dioxide bubbles rising faster as applied current increases.</desc>

      <defs>
        <linearGradient id="steelGrad" x1="0" x2="1">
          <stop offset="0" stop-color="#2d2f31"/>
          <stop offset="0.5" stop-color="#56595d"/>
          <stop offset="1" stop-color="#25272a"/>
        </linearGradient>
        <linearGradient id="ceramicGrad" x1="0" x2="1">
          <stop offset="0" stop-color="#e9b79d"/>
          <stop offset="1" stop-color="#dda185"/>
        </linearGradient>
        <linearGradient id="alGrad" x1="0" x2="1">
          <stop offset="0" stop-color="#aeb4b8"/>
          <stop offset="0.45" stop-color="#e6eaec"/>
          <stop offset="1" stop-color="#969da2"/>
        </linearGradient>
        <linearGradient id="rodGrad" x1="0" x2="1">
          <stop offset="0" stop-color="#26282a"/>
          <stop offset="0.55" stop-color="#777b80"/>
          <stop offset="1" stop-color="#202224"/>
        </linearGradient>
        <clipPath id="electrolyteClip">
          <rect x="296" y="360" width="616" height="236"/>
        </clipPath>
        <clipPath id="cellLiquidClip">
          <rect x="296" y="350" width="616" height="330"/>
        </clipPath>
        <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
        </marker>
      </defs>

      <rect width="1280" height="820" fill="#fff"/>

      <g id="exhaust">
        <path d="M216 347 L216 94 L260 94 L260 44 M358 44 L358 94 L990 94 L990 347" class="outline"/>
        <path d="M307 112 L307 20" class="leader" marker-end="url(#arrowHead)"/>
        <text class="label" x="250" y="136">HF and particulates</text>
        <text class="label" x="250" y="168">exhaust to filter plant</text>
      </g>

      <g id="vessel">
        <path d="M168 346 L296 346 L296 664 L912 664 L912 346 L1035 346 L1035 790 L168 790 Z" fill="url(#steelGrad)" stroke="#000" stroke-width="3"/>
        <path d="M216 346 L296 346 L296 664 L912 664 L912 346 L986 346 L986 748 L216 748 Z" fill="url(#ceramicGrad)" stroke="#000" stroke-width="3"/>
        <rect x="296" y="360" width="616" height="236" fill="#a8c963"/>
        <rect x="296" y="360" width="616" height="18" fill="#d5e8a7" opacity="0.9"/>
        <rect id="aluminumLayer" x="296" y="596" width="616" height="62" fill="url(#alGrad)"/>
        <path id="aluminumShine" d="M296 602 C450 618 650 588 912 604 L912 658 L296 658 Z" fill="#edf2f4" opacity="0.25"/>
        <path id="cathodeFloor" d="M282 660 L918 660 L918 710 L282 710 Z" fill="#000"/>
        <text class="inside-label" x="602" y="700">Carbon cathode (-)</text>
        <rect x="296" y="350" width="616" height="14" fill="#cfe4a0" opacity="0.9"/>
      </g>

      <g id="anodes">
        <rect x="442" y="190" width="22" height="170" fill="url(#rodGrad)" stroke="#000" stroke-width="3"/>
        <rect x="492" y="190" width="22" height="170" fill="url(#rodGrad)" stroke="#000" stroke-width="3"/>
        <rect x="404" y="265" width="108" height="118" fill="url(#rodGrad)" stroke="#000" stroke-width="3"/>
        <rect x="424" y="290" width="18" height="28" fill="#fff" stroke="#000" stroke-width="3"/>
        <rect x="466" y="290" width="18" height="28" fill="#fff" stroke="#000" stroke-width="3"/>
        <rect x="355" y="315" width="200" height="225" fill="#000"/>
        <text class="inside-label" x="455" y="475">Carbon</text>
        <text class="inside-label" x="455" y="506">anode (+)</text>

        <rect x="736" y="190" width="22" height="170" fill="url(#rodGrad)" stroke="#000" stroke-width="3"/>
        <rect x="786" y="190" width="22" height="170" fill="url(#rodGrad)" stroke="#000" stroke-width="3"/>
        <rect x="698" y="265" width="108" height="118" fill="url(#rodGrad)" stroke="#000" stroke-width="3"/>
        <rect x="718" y="290" width="18" height="28" fill="#fff" stroke="#000" stroke-width="3"/>
        <rect x="760" y="290" width="18" height="28" fill="#fff" stroke="#000" stroke-width="3"/>
        <rect x="650" y="315" width="200" height="225" fill="#000"/>
        <text class="inside-label" x="750" y="475">Carbon</text>
        <text class="inside-label" x="750" y="506">anode (+)</text>

        <rect x="464" y="192" width="596" height="12" fill="#fff" stroke="#000" stroke-width="3"/>
        <text class="label" x="1070" y="207">+</text>
      </g>

      <g id="negativeBus">
        <path d="M92 681 L282 681" class="busbar"/>
        <text class="label" x="60" y="692">-</text>
        <path d="M912 664 L1084 679" class="busbar"/>
      </g>

      <g id="staticBubbles" clip-path="url(#electrolyteClip)">
        <circle class="bubble" cx="348" cy="524" r="8"/>
        <circle class="bubble" cx="351" cy="504" r="5"/>
        <circle class="bubble" cx="342" cy="488" r="5"/>
        <circle class="bubble" cx="349" cy="472" r="4"/>
        <circle class="bubble" cx="558" cy="536" r="7"/>
        <circle class="bubble" cx="563" cy="505" r="5"/>
        <circle class="bubble" cx="558" cy="427" r="4"/>
        <circle class="bubble" cx="635" cy="512" r="7"/>
        <circle class="bubble" cx="640" cy="490" r="5"/>
        <circle class="bubble" cx="641" cy="455" r="5"/>
        <circle class="bubble" cx="641" cy="416" r="4"/>
        <circle class="bubble" cx="849" cy="538" r="8"/>
        <circle class="bubble" cx="856" cy="516" r="5"/>
        <circle class="bubble" cx="853" cy="486" r="5"/>
        <circle class="bubble" cx="854" cy="427" r="4"/>
      </g>

      <g id="ionLayer" clip-path="url(#cellLiquidClip)"></g>
      <g id="bubbleLayer" clip-path="url(#electrolyteClip)"></g>
      <g id="sparkLayer"></g>

      <g id="reactionLabels">
        <path d="M370 622 C430 637 475 638 536 625" fill="none" stroke="#4a658d" stroke-width="3" stroke-dasharray="8 7"/>
        <text class="reaction" x="348" y="626">Al3+ + 3e- -> Al(l)</text>
        <path d="M862 284 C895 300 922 330 936 362" fill="none" stroke="#7d402a" stroke-width="3" stroke-dasharray="8 7"/>
        <text class="reaction" x="858" y="276">O2- oxidized at C anodes</text>
      </g>

      <g id="labels">
        <text class="label" x="15" y="438">Ceramic</text>
        <path d="M116 430 L230 430" class="leader"/>
        <text class="label" x="15" y="507">Steel shell</text>
        <path d="M146 499 L190 499" class="leader"/>

        <path d="M890 370 L1060 370" class="leader"/>
        <text class="label" x="1070" y="379">Crust</text>

        <path d="M850 486 L1058 454" class="leader"/>
        <path d="M850 516 L1058 454" class="leader"/>
        <text class="label" x="1070" y="497">Bubbles of O2, CO,</text>
        <text class="label" x="1070" y="528">and CO2</text>

        <path d="M890 555 L1060 555" class="leader"/>
        <text class="label" x="1070" y="566">Al2O3 dissolved</text>
        <text class="label" x="1070" y="596">in molten Na3AlF6</text>

        <path id="moltenAlLeader" d="M890 625 L1060 625" class="leader"/>
        <text class="label" x="1070" y="636">Molten aluminum</text>
      </g>
    </svg>
  </div>

  <section class="controls" aria-label="Hall-Heroult cell controls">
    <label for="currentSlider">Applied current</label>
    <input id="currentSlider" type="range" min="20" max="100" value="55" step="1">
    <output id="currentValue" for="currentSlider">55 kA</output>
    <div id="layerReadout" class="readout">Al layer 62</div>
  </section>
</main>

<script>
(() => {
  const svgNS = "http://www.w3.org/2000/svg";
  const slider = document.getElementById("currentSlider");
  const currentValue = document.getElementById("currentValue");
  const layerReadout = document.getElementById("layerReadout");
  const ionLayer = document.getElementById("ionLayer");
  const bubbleLayer = document.getElementById("bubbleLayer");
  const sparkLayer = document.getElementById("sparkLayer");
  const aluminumLayer = document.getElementById("aluminumLayer");
  const aluminumShine = document.getElementById("aluminumShine");
  const moltenAlLeader = document.getElementById("moltenAlLeader");

  const anodeFaces = [
    { x: 355, y: 315, w: 200, h: 225 },
    { x: 650, y: 315, w: 200, h: 225 }
  ];
  const gasLabels = ["O2", "CO", "CO2"];
  const ions = [];
  const bubbles = [];
  const sparks = [];
  let current = Number(slider.value);
  let last = performance.now();
  let bubbleAccumulator = 0;
  let ionAccumulator = 0;

  function makeSvg(tag, attrs, parent) {
    const node = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function makeIon(kind) {
    const oxide = kind === "oxide";
    const x = oxide ? 320 + Math.random() * 540 : 330 + Math.random() * 520;
    const y = oxide ? 560 + Math.random() * 28 : 372 + Math.random() * 42;
    const g = makeSvg("g", { opacity: "0.98" }, ionLayer);
    makeSvg("circle", {
      class: oxide ? "oxide-ion" : "al-ion",
      cx: 0,
      cy: 0,
      r: oxide ? 13 : 12
    }, g);
    makeSvg("text", {
      class: "ion-label",
      x: 0,
      y: 5
    }, g).textContent = oxide ? "O2-" : "Al3+";
    const face = anodeFaces[Math.floor(Math.random() * anodeFaces.length)];
    return {
      kind,
      node: g,
      x,
      y,
      baseX: x,
      phase: Math.random() * Math.PI * 2,
      targetX: oxide ? face.x + 20 + Math.random() * (face.w - 40) : x,
      targetY: oxide ? face.y + face.h - 8 - Math.random() * 56 : 622 + Math.random() * 24,
      speed: oxide ? 22 + Math.random() * 18 : 26 + Math.random() * 16,
      face
    };
  }

  function resetIon(ion) {
    ionLayer.removeChild(ion.node);
    const replacement = makeIon(ion.kind);
    Object.assign(ion, replacement);
  }

  function makeBubble(face) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const startX = side < 0 ? face.x - 8 - Math.random() * 16 : face.x + face.w + 8 + Math.random() * 16;
    const startY = face.y + face.h - 20 - Math.random() * 96;
    const g = makeSvg("g", { opacity: "0.95" }, bubbleLayer);
    const r = 5 + Math.random() * 7;
    makeSvg("circle", { class: "bubble", cx: 0, cy: 0, r: r.toFixed(1) }, g);
    makeSvg("text", { class: "bubble-label", x: 0, y: 4 }, g).textContent = gasLabels[Math.floor(Math.random() * gasLabels.length)];
    return {
      node: g,
      x: startX,
      y: startY,
      wobble: Math.random() * Math.PI * 2,
      speed: 28 + Math.random() * 44,
      r,
      ttl: 1
    };
  }

  function makeSpark(x, y) {
    const node = makeSvg("circle", { class: "spark", cx: x, cy: y, r: 3 }, sparkLayer);
    return { node, age: 0, maxAge: 0.75 };
  }

  function setLayerFromCurrent() {
    const t = (current - 20) / 80;
    const height = 38 + t * 66;
    const y = 658 - height;
    aluminumLayer.setAttribute("y", y.toFixed(1));
    aluminumLayer.setAttribute("height", height.toFixed(1));
    aluminumShine.setAttribute("d", `M296 ${(y + 6).toFixed(1)} C450 ${(y + 22).toFixed(1)} 650 ${(y - 8).toFixed(1)} 912 ${(y + 8).toFixed(1)} L912 658 L296 658 Z`);
    moltenAlLeader.setAttribute("d", `M890 ${(y + height * 0.45).toFixed(1)} L1060 ${(y + height * 0.45).toFixed(1)}`);
    currentValue.textContent = `${current} kA`;
    layerReadout.textContent = `Al layer ${Math.round(height)}`;
  }

  function updateControls() {
    current = Number(slider.value);
    setLayerFromCurrent();
  }

  for (let i = 0; i < 10; i += 1) {
    ions.push(makeIon(i % 2 === 0 ? "aluminum" : "oxide"));
  }
  for (let i = 0; i < 8; i += 1) {
    const face = anodeFaces[i % anodeFaces.length];
    bubbles.push(makeBubble(face));
    bubbles[i].y -= Math.random() * 120;
  }
  setLayerFromCurrent();
  slider.addEventListener("input", updateControls);

  function animate(now) {
    const dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    const intensity = current / 55;
    bubbleAccumulator += dt * (1.5 + intensity * 3.8);
    ionAccumulator += dt * (0.9 + intensity * 1.3);

    while (bubbleAccumulator > 1) {
      bubbleAccumulator -= 1;
      bubbles.push(makeBubble(anodeFaces[Math.floor(Math.random() * anodeFaces.length)]));
    }

    while (ionAccumulator > 1 && ions.length < 24) {
      ionAccumulator -= 1;
      ions.push(makeIon(Math.random() < 0.5 ? "aluminum" : "oxide"));
    }

    ions.forEach((ion) => {
      const speed = ion.speed * (0.55 + intensity * 0.7);
      ion.phase += dt * 4;
      if (ion.kind === "oxide") {
        ion.y -= speed * dt;
        ion.x += (ion.targetX - ion.x) * dt * 1.3 + Math.sin(ion.phase) * 0.35;
        if (ion.y <= ion.targetY) {
          bubbles.push(makeBubble(ion.face));
          sparks.push(makeSpark(ion.x, ion.y));
          resetIon(ion);
        }
      } else {
        ion.y += speed * dt;
        ion.x = ion.baseX + Math.sin(ion.phase) * 7;
        if (ion.y >= ion.targetY) {
          sparks.push(makeSpark(ion.x, ion.y));
          resetIon(ion);
        }
      }
      ion.node.setAttribute("transform", `translate(${ion.x.toFixed(1)} ${ion.y.toFixed(1)})`);
    });

    for (let i = bubbles.length - 1; i >= 0; i -= 1) {
      const bubble = bubbles[i];
      bubble.wobble += dt * 4;
      bubble.y -= bubble.speed * intensity * dt;
      bubble.x += Math.sin(bubble.wobble) * dt * 14;
      bubble.ttl = Math.min(1, Math.max(0, (bubble.y - 355) / 185));
      bubble.node.setAttribute("opacity", (0.25 + bubble.ttl * 0.75).toFixed(2));
      bubble.node.setAttribute("transform", `translate(${bubble.x.toFixed(1)} ${bubble.y.toFixed(1)})`);
      if (bubble.y < 360 || bubbles.length > 42) {
        bubbleLayer.removeChild(bubble.node);
        bubbles.splice(i, 1);
      }
    }

    for (let i = sparks.length - 1; i >= 0; i -= 1) {
      const spark = sparks[i];
      spark.age += dt;
      const t = spark.age / spark.maxAge;
      spark.node.setAttribute("r", (3 + t * 15).toFixed(1));
      spark.node.setAttribute("opacity", Math.max(0, 0.75 - t).toFixed(2));
      if (t >= 1) {
        sparkLayer.removeChild(spark.node);
        sparks.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
