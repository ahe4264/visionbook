<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sp3d Hybridization in PCl5</title>
  <style>
    :root {
      --ink: #161616;
      --muted: #5b6367;
      --line: #cfd8d2;
      --panel: #f7faf8;
      --panel-strong: #eaf2ee;
      --orange: #f28d24;
      --orange-dark: #c86a12;
      --green: #34b33f;
      --green-dark: #137a2c;
      --dash: #7aa530;
      --focus: #1f6fb2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(1180px, 100vw);
      max-width: 100vw;
      min-width: 0;
      min-height: 100vh;
      padding: clamp(10px, 2vw, 22px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    header {
      width: min(1060px, 100%);
      min-width: 0;
      margin: 0 auto;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.5vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.15;
    }

    .formula {
      color: var(--muted);
      font-size: clamp(0.88rem, 1.9vw, 1rem);
      line-height: 1.35;
      white-space: nowrap;
    }

    .stage {
      min-height: 0;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    svg {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: calc(100vh - 158px);
      display: block;
      overflow: hidden;
    }

    .toolbar {
      width: min(1060px, 100%);
      min-width: 0;
      margin: 0 auto;
      padding: 10px;
      display: grid;
      grid-template-columns: auto minmax(170px, 1fr);
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .segments {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
      width: max-content;
    }

    button {
      min-height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 6px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #ffffff;
      background: #2f6f4e;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    button:focus-visible,
    .orbital-hit:focus-visible {
      outline: 3px solid rgba(31, 111, 178, 0.35);
      outline-offset: 3px;
    }

    .status {
      min-width: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.3;
      text-align: right;
    }

    .panel {
      transition: opacity 180ms ease;
    }

    .panel[aria-hidden="true"] {
      opacity: 0;
      pointer-events: none;
    }

    .panel-title {
      font-size: 28px;
      font-weight: 700;
      fill: var(--ink);
    }

    .panel-caption {
      font-size: 18px;
      fill: var(--muted);
    }

    .panel-letter {
      font-size: 32px;
      fill: #000000;
    }

    .atom-label {
      font-size: 16px;
      font-weight: 700;
      fill: rgba(0, 0, 0, 0.48);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .bond,
    .bond-cover {
      stroke-linecap: round;
      transition: stroke 160ms ease, stroke-width 160ms ease, filter 160ms ease, opacity 160ms ease;
    }

    .bond {
      stroke: url(#bondOrange);
      stroke-width: 18;
    }

    .bond-cover {
      stroke: rgba(58, 177, 63, 0.45);
      stroke-width: 8;
    }

    .atom {
      transition: filter 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }

    .bond.active {
      stroke: #f6ad2f;
      stroke-width: 24;
      filter: url(#goldGlow);
    }

    .bond-cover.active {
      stroke: rgba(255, 221, 80, 0.8);
      stroke-width: 11;
      filter: url(#goldGlow);
    }

    .atom.active {
      stroke: #f6ad2f;
      stroke-width: 5;
      filter: url(#goldGlow);
    }

    .orbital-hit {
      cursor: pointer;
    }

    .lobe {
      fill: url(#lobeFill);
      stroke: rgba(206, 105, 23, 0.35);
      stroke-width: 2;
      transition: fill 160ms ease, stroke 160ms ease, stroke-width 160ms ease, filter 160ms ease;
    }

    .orbital-hit:hover .lobe,
    .orbital-hit.active .lobe {
      fill: url(#lobeActiveFill);
      stroke: #b45b0d;
      stroke-width: 4;
      filter: url(#goldGlow);
    }

    .orbital-axis {
      stroke: rgba(122, 165, 48, 0.58);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 8 9;
      pointer-events: none;
      transition: stroke 160ms ease, stroke-width 160ms ease;
    }

    .orbital-hit.active .orbital-axis {
      stroke: #465f17;
      stroke-width: 3.2;
    }

    .geometry-edge {
      fill: none;
      stroke: rgba(122, 165, 48, 0.88);
      stroke-width: 2.4;
      stroke-dasharray: 10 9;
      stroke-linecap: round;
    }

    .orbital-label {
      font-family: "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 28px;
      fill: #000000;
      pointer-events: none;
    }

    .orbital-label tspan {
      font-size: 18px;
    }

    @media (max-width: 720px) {
      .app {
        padding: 8px;
        gap: 8px;
      }

      header {
        align-items: start;
        flex-direction: column;
        gap: 2px;
      }

      .formula {
        white-space: normal;
      }

      svg {
        width: calc(100vw - 16px);
        max-height: none;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .panel-caption {
        display: none;
      }

      .segments {
        width: 100%;
        grid-auto-columns: 1fr;
      }

      button {
        padding: 0 8px;
        font-size: 0.93rem;
      }

      .status {
        text-align: left;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="figure-title">
    <header>
      <h1 id="figure-title">sp<sup>3</sup>d Hybridization in PCl<sub>5</sub></h1>
      <div class="formula">Trigonal bipyramidal: 2 axial and 3 equatorial P-Cl directions</div>
    </header>

    <div class="stage">
      <svg id="figure" viewBox="0 0 1120 600" role="img" aria-labelledby="svg-title svg-desc" data-view="compare">
        <title id="svg-title">Interactive figure comparing PCl5 molecular geometry and sp3d hybrid orbitals</title>
        <desc id="svg-desc">Panel a shows phosphorus pentachloride as a ball-and-stick trigonal bipyramid. Panel b shows five sp3d hybrid orbital lobes in the same directions. Selecting an orbital lobe highlights the matching P-Cl bond.</desc>

        <defs>
          <radialGradient id="phosphorus" cx="35%" cy="28%" r="72%">
            <stop offset="0" stop-color="#ffca69"/>
            <stop offset="0.38" stop-color="#ef8827"/>
            <stop offset="1" stop-color="#b84f10"/>
          </radialGradient>

          <radialGradient id="chlorine" cx="32%" cy="27%" r="76%">
            <stop offset="0" stop-color="#b8f06a"/>
            <stop offset="0.42" stop-color="#3dbd43"/>
            <stop offset="1" stop-color="#08752b"/>
          </radialGradient>

          <linearGradient id="bondOrange" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f9a23b"/>
            <stop offset="0.52" stop-color="#ec7d1f"/>
            <stop offset="1" stop-color="#cc6013"/>
          </linearGradient>

          <radialGradient id="lobeFill" cx="36%" cy="30%" r="78%">
            <stop offset="0" stop-color="#ffe7a4" stop-opacity="0.95"/>
            <stop offset="0.43" stop-color="#f8ad42" stop-opacity="0.84"/>
            <stop offset="1" stop-color="#f07f21" stop-opacity="0.72"/>
          </radialGradient>

          <radialGradient id="lobeActiveFill" cx="35%" cy="29%" r="78%">
            <stop offset="0" stop-color="#fff2a7"/>
            <stop offset="0.46" stop-color="#ffc857"/>
            <stop offset="1" stop-color="#f18521"/>
          </radialGradient>

          <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
          </filter>

          <filter id="goldGlow" x="-55%" y="-55%" width="210%" height="210%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feFlood flood-color="#ffd95b" flood-opacity="0.7" result="color"/>
            <feComposite in="color" in2="blur" operator="in" result="glow"/>
            <feMerge>
              <feMergeNode in="glow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <g id="moleculePanel" class="panel" transform="translate(75 92)">
          <text class="panel-title" x="210" y="0" text-anchor="middle">PCl<tspan baseline-shift="sub" font-size="18">5</tspan> molecule</text>
          <text class="panel-caption" x="210" y="27" text-anchor="middle">five P-Cl bonds to trigonal-bipyramid vertices</text>

          <g aria-label="Ball-and-stick model of phosphorus pentachloride">
            <line class="bond" data-key="upperLeft" x1="210" y1="210" x2="106" y2="174"/>
            <line class="bond-cover" data-key="upperLeft" x1="160" y1="193" x2="106" y2="174"/>

            <line class="bond" data-key="axialTop" x1="210" y1="210" x2="210" y2="82"/>
            <line class="bond-cover" data-key="axialTop" x1="210" y1="137" x2="210" y2="82"/>

            <line class="bond" data-key="axialBottom" x1="210" y1="210" x2="210" y2="340"/>
            <line class="bond-cover" data-key="axialBottom" x1="210" y1="284" x2="210" y2="340"/>

            <line class="bond" data-key="right" x1="210" y1="210" x2="348" y2="210"/>
            <line class="bond-cover" data-key="right" x1="286" y1="210" x2="348" y2="210"/>

            <line class="bond" data-key="lowerLeft" x1="210" y1="210" x2="82" y2="248"/>
            <line class="bond-cover" data-key="lowerLeft" x1="145" y1="229" x2="82" y2="248"/>

            <circle class="atom" data-key="upperLeft" cx="106" cy="174" r="30" fill="url(#chlorine)" filter="url(#softShadow)"/>
            <circle class="atom" data-key="axialTop" cx="210" cy="82" r="31" fill="url(#chlorine)" filter="url(#softShadow)"/>
            <circle class="atom" data-key="right" cx="348" cy="210" r="30" fill="url(#chlorine)" filter="url(#softShadow)"/>
            <circle class="atom" data-key="axialBottom" cx="210" cy="340" r="31" fill="url(#chlorine)" filter="url(#softShadow)"/>
            <circle class="atom" data-key="lowerLeft" cx="82" cy="248" r="32" fill="url(#chlorine)" filter="url(#softShadow)"/>
            <circle cx="210" cy="210" r="29" fill="url(#phosphorus)" filter="url(#softShadow)"/>

            <text class="atom-label" x="210" y="210">P</text>
            <text class="atom-label" x="210" y="82">Cl</text>
            <text class="atom-label" x="210" y="340">Cl</text>
            <text class="atom-label" x="348" y="210">Cl</text>
            <text class="atom-label" x="106" y="174">Cl</text>
            <text class="atom-label" x="82" y="248">Cl</text>
          </g>

          <text class="panel-letter" x="210" y="454" text-anchor="middle">(a)</text>
        </g>

        <g id="orbitalPanel" class="panel" transform="translate(635 92)">
          <text class="panel-title" x="210" y="0" text-anchor="middle">sp<tspan baseline-shift="super" font-size="18">3</tspan>d hybrid orbitals</text>
          <text class="panel-caption" x="210" y="27" text-anchor="middle">one 3s, three 3p, and one 3d orbital mixed</text>

          <g aria-label="Five sp3d orbital lobes in a trigonal bipyramidal arrangement">
            <path class="geometry-edge" d="M226 68 L356 205 L221 344 L82 248 L92 156 Z"/>
            <path class="geometry-edge" d="M92 156 L356 205 L82 248"/>

            <g class="orbital-hit" data-key="axialTop" tabindex="0" role="button" aria-label="axial top sp3d orbital">
              <path class="lobe" d="M206 197 C178 149 190 82 226 58 C269 78 268 145 225 197 Z"/>
              <line class="orbital-axis" x1="214" y1="207" x2="226" y2="76"/>
            </g>

            <g class="orbital-hit" data-key="upperLeft" tabindex="0" role="button" aria-label="upper-left equatorial sp3d orbital">
              <path class="lobe" d="M202 198 C158 151 111 128 83 155 C88 194 145 210 204 207 Z"/>
              <line class="orbital-axis" x1="212" y1="209" x2="100" y2="160"/>
            </g>

            <g class="orbital-hit" data-key="right" tabindex="0" role="button" aria-label="right equatorial sp3d orbital">
              <path class="lobe" d="M228 200 C283 174 339 177 366 205 C342 239 282 239 228 216 Z"/>
              <line class="orbital-axis" x1="218" y1="209" x2="348" y2="206"/>
            </g>

            <g class="orbital-hit" data-key="lowerLeft" tabindex="0" role="button" aria-label="lower-left equatorial sp3d orbital">
              <path class="lobe" d="M202 214 C145 204 91 214 78 248 C105 279 162 264 205 224 Z"/>
              <line class="orbital-axis" x1="213" y1="213" x2="96" y2="247"/>
            </g>

            <g class="orbital-hit" data-key="axialBottom" tabindex="0" role="button" aria-label="axial bottom sp3d orbital">
              <path class="lobe" d="M207 224 C178 277 192 331 221 354 C260 330 265 270 226 222 Z"/>
              <line class="orbital-axis" x1="215" y1="214" x2="221" y2="333"/>
            </g>

            <circle cx="216" cy="210" r="8.5" fill="#050505"/>

            <text class="orbital-label" x="257" y="72">sp<tspan baseline-shift="super">3</tspan>d</text>
            <text class="orbital-label" x="356" y="213">sp<tspan baseline-shift="super">3</tspan>d</text>
            <text class="orbital-label" x="196" y="385">sp<tspan baseline-shift="super">3</tspan>d</text>
            <text class="orbital-label" x="20" y="270">sp<tspan baseline-shift="super">3</tspan>d</text>
            <text class="orbital-label" x="12" y="172">sp<tspan baseline-shift="super">3</tspan>d</text>
          </g>

          <text class="panel-letter" x="210" y="454" text-anchor="middle">(b)</text>
        </g>
      </svg>
    </div>

    <div class="toolbar" aria-label="Figure controls">
      <div class="segments" role="group" aria-label="View">
        <button type="button" data-view-button="compare" aria-pressed="true">Compare</button>
        <button type="button" data-view-button="molecule" aria-pressed="false">Molecule</button>
        <button type="button" data-view-button="orbitals" aria-pressed="false">Orbitals</button>
      </div>
      <div id="status" class="status" aria-live="polite">No orbital selected.</div>
    </div>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("figure");
      const moleculePanel = document.getElementById("moleculePanel");
      const orbitalPanel = document.getElementById("orbitalPanel");
      const status = document.getElementById("status");
      const viewButtons = Array.from(document.querySelectorAll("[data-view-button]"));
      const lobeButtons = Array.from(document.querySelectorAll(".orbital-hit"));
      const activeTargets = Array.from(document.querySelectorAll("[data-key]"));

      const directions = {
        axialTop: "Top axial sp3d orbital aligned with the upper axial P-Cl bond.",
        axialBottom: "Bottom axial sp3d orbital aligned with the lower axial P-Cl bond.",
        right: "Equatorial sp3d orbital aligned with the right P-Cl bond.",
        upperLeft: "Equatorial sp3d orbital aligned with the upper-left P-Cl bond.",
        lowerLeft: "Equatorial sp3d orbital aligned with the lower-left P-Cl bond."
      };

      const mobileQuery = window.matchMedia("(max-width: 720px)");

      const layouts = {
        desktop: {
          viewBoxes: {
            compare: "0 0 1120 600",
            molecule: "0 0 1120 600",
            orbitals: "0 0 1120 600"
          },
          transforms: {
            compare: {
              molecule: "translate(75 92)",
              orbitals: "translate(635 92)"
            },
            molecule: {
              molecule: "translate(350 88) scale(1.08)",
              orbitals: "translate(635 92)"
            },
            orbitals: {
              molecule: "translate(75 92)",
              orbitals: "translate(350 88) scale(1.08)"
            }
          }
        },
        mobile: {
          viewBoxes: {
            compare: "0 0 560 1040",
            molecule: "0 0 560 540",
            orbitals: "0 0 560 540"
          },
          transforms: {
            compare: {
              molecule: "translate(25 55)",
              orbitals: "translate(25 565)"
            },
            molecule: {
              molecule: "translate(25 55)",
              orbitals: "translate(25 55)"
            },
            orbitals: {
              molecule: "translate(25 55)",
              orbitals: "translate(25 55)"
            }
          }
        }
      };

      let currentView = "compare";
      let selectedKey = null;

      function setView(view) {
        currentView = view;
        const layout = mobileQuery.matches ? layouts.mobile : layouts.desktop;
        svg.dataset.view = view;
        svg.setAttribute("viewBox", layout.viewBoxes[view]);
        moleculePanel.setAttribute("transform", layout.transforms[view].molecule);
        orbitalPanel.setAttribute("transform", layout.transforms[view].orbitals);
        moleculePanel.setAttribute("aria-hidden", view === "orbitals" ? "true" : "false");
        orbitalPanel.setAttribute("aria-hidden", view === "molecule" ? "true" : "false");

        viewButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.viewButton === view));
        });
      }

      function setActive(key, revealPair) {
        selectedKey = key;
        activeTargets.forEach((target) => {
          target.classList.toggle("active", target.dataset.key === key);
        });
        status.textContent = directions[key] || "No orbital selected.";

        if (revealPair && currentView === "orbitals") {
          setView("compare");
        }
      }

      viewButtons.forEach((button) => {
        button.addEventListener("click", () => setView(button.dataset.viewButton));
      });

      lobeButtons.forEach((button) => {
        button.addEventListener("click", () => setActive(button.dataset.key, true));
        button.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setActive(button.dataset.key, true);
          }
        });
      });

      if (mobileQuery.addEventListener) {
        mobileQuery.addEventListener("change", () => setView(currentView));
      } else {
        mobileQuery.addListener(() => setView(currentView));
      }

      setView(currentView);
      if (selectedKey) {
        setActive(selectedKey, false);
      }
    })();
  </script>
</body>
</html>
