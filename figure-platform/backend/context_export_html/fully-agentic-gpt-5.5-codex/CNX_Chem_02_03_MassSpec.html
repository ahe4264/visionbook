<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zirconium Mass Spectrometry</title>
  <style>
    :root {
      --paper: #fbfcff;
      --ink: #15171b;
      --muted: #4c5665;
      --line: #151515;
      --cyan: #18b8bd;
      --cyan-dark: #008f99;
      --cyan-soft: #caeef0;
      --accent: #f08a21;
      --accent-2: #6d477b;
      --focus: #ffd166;
      --grid: #8b9197;
      --panel: #ffffff;
      --control: #eef3f8;
      --control-border: #b8c3cf;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #eef3f8 0%, #ffffff 44%, #f5f8fb 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1360px, 100vw);
      padding: clamp(8px, 1.4vw, 18px);
    }

    .figure-shell {
      background: var(--paper);
      border: 1px solid #d7dee8;
      box-shadow: 0 18px 42px rgba(30, 42, 58, 0.13);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #d7dee8;
      background: #fff;
    }

    .field-control {
      display: grid;
      grid-template-columns: auto minmax(150px, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    .field-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .isotope-readout {
      min-width: 184px;
      padding: 7px 10px;
      border: 1px solid var(--control-border);
      background: var(--control);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan-dark);
    }

    .mode-tabs {
      display: inline-grid;
      grid-template-columns: repeat(3, auto);
      gap: 4px;
      padding: 4px;
      background: var(--control);
      border: 1px solid var(--control-border);
    }

    .mode-tabs button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 11px;
      font: 700 14px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .mode-tabs button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(20, 28, 40, 0.16);
    }

    .figure-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.95fr) minmax(330px, 1fr);
      gap: 0;
      background: #fff;
    }

    .panel {
      min-width: 0;
      border-right: 1px solid #d7dee8;
    }

    .panel:last-child {
      border-right: 0;
    }

    .panel-title {
      margin: 0;
      padding: 10px 14px 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    .single .figure-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .instrument-only .chart-panel,
    .spectrum-only .instrument-panel {
      display: none;
    }

    .instrument-only .instrument-panel,
    .spectrum-only .chart-panel {
      border-right: 0;
    }

    .label {
      fill: var(--ink);
      font-size: 22px;
      font-weight: 500;
    }

    .small-label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 500;
    }

    .tiny-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .axis-label {
      fill: var(--ink);
      font-size: 23px;
      font-weight: 800;
    }

    .axis-number {
      fill: var(--ink);
      font-size: 21px;
    }

    .gridline {
      stroke: var(--grid);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--line);
      stroke-width: 2.2;
      vector-effect: non-scaling-stroke;
    }

    .instrument-line {
      stroke: var(--line);
      stroke-width: 2.2;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .wire {
      fill: none;
      stroke: #df6f38;
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
    }

    .lens {
      fill: #b7bad8;
      stroke: #55556d;
      stroke-width: 2.3;
      vector-effect: non-scaling-stroke;
    }

    .aperture {
      fill: #e7e8ef;
      stroke: #696a82;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .ion-path {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0.45;
      transition: opacity 160ms ease, stroke-width 160ms ease, stroke 160ms ease;
      vector-effect: non-scaling-stroke;
    }

    .ion-path.selected {
      stroke: var(--cyan-dark);
      stroke-width: 7;
      opacity: 1;
      filter: drop-shadow(0 0 4px rgba(0, 143, 153, 0.35));
    }

    .beam-label {
      fill: var(--cyan-dark);
      font-size: 16px;
      font-weight: 800;
      pointer-events: none;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .beam-label.selected {
      opacity: 1;
    }

    .detector-hit {
      fill: var(--focus);
      stroke: #5a4600;
      stroke-width: 2;
      opacity: 0;
      transition: opacity 160ms ease;
      vector-effect: non-scaling-stroke;
    }

    .detector-hit.selected {
      opacity: 1;
    }

    .bar {
      fill: var(--cyan);
      cursor: pointer;
      transition: fill 160ms ease, opacity 160ms ease;
    }

    .bar:hover,
    .bar:focus {
      fill: var(--cyan-dark);
      outline: none;
    }

    .bar.selected {
      fill: var(--cyan-dark);
      filter: drop-shadow(0 0 5px rgba(0, 143, 153, 0.42));
    }

    .bar.dimmed {
      opacity: 0.55;
    }

    .bar-label {
      fill: var(--ink);
      font-size: 19px;
      font-weight: 500;
      pointer-events: none;
    }

    .annotation-box {
      fill: #fff8df;
      stroke: #d1a531;
      stroke-width: 1.6;
      vector-effect: non-scaling-stroke;
    }

    .annotation-text {
      fill: #332700;
      font-size: 15px;
      font-weight: 700;
    }

    .note-line {
      stroke: var(--line);
      stroke-width: 2.3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .field-control {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .isotope-readout {
        width: 100%;
      }

      .mode-tabs {
        width: 100%;
      }

      .mode-tabs button {
        padding: 8px 6px;
      }

      .figure-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: 0;
        border-bottom: 1px solid #d7dee8;
      }

      .panel:last-child {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell both" aria-label="Interactive zirconium mass spectrometer figure">
      <div class="controls">
        <label class="field-control" for="fieldSlider">
          <span class="field-title">Magnetic field strength</span>
          <input id="fieldSlider" type="range" min="0" max="4" step="1" value="0" aria-label="Magnetic field strength, scan zirconium isotopes">
          <span id="readout" class="isotope-readout" aria-live="polite">Zr-90, m/z 90</span>
        </label>
        <div class="mode-tabs" role="group" aria-label="Panel view">
          <button type="button" data-view="both" aria-pressed="true">Both</button>
          <button type="button" data-view="instrument" aria-pressed="false">Instrument</button>
          <button type="button" data-view="spectrum" aria-pressed="false">Spectrum</button>
        </div>
      </div>

      <div class="figure-grid">
        <article class="panel instrument-panel">
          <h2 class="panel-title">Mass spectrometer: cations separate by mass-to-charge ratio</h2>
          <svg id="instrumentSvg" viewBox="0 0 820 520" role="img" aria-labelledby="instrumentTitle instrumentDesc">
            <title id="instrumentTitle">Schematic mass spectrometer for zirconium ions</title>
            <desc id="instrumentDesc">A sample is vaporized, ionized by an electron beam, accelerated, deflected by a magnet, and separated into paths that strike a detector.</desc>
            <defs>
              <linearGradient id="tubeGradient" x1="0%" x2="0%" y1="0%" y2="100%">
                <stop offset="0%" stop-color="#f6f7f7"/>
                <stop offset="45%" stop-color="#dfe3e5"/>
                <stop offset="100%" stop-color="#ffffff"/>
              </linearGradient>
              <linearGradient id="metalGradient" x1="0%" x2="100%" y1="0%" y2="0%">
                <stop offset="0%" stop-color="#777"/>
                <stop offset="35%" stop-color="#f2f2f2"/>
                <stop offset="70%" stop-color="#9b9b9b"/>
                <stop offset="100%" stop-color="#4b4b4b"/>
              </linearGradient>
              <linearGradient id="detectorGradient" x1="0%" x2="100%" y1="0%" y2="0%">
                <stop offset="0%" stop-color="#eff3bd"/>
                <stop offset="100%" stop-color="#aebd77"/>
              </linearGradient>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
              </filter>
            </defs>

            <text class="label" x="16" y="38">Sample</text>
            <text class="label" x="16" y="65">enters</text>
            <text class="label" x="16" y="92">here</text>
            <path class="note-line" d="M42 105 L42 210"/>
            <path class="note-line" d="M36 210 L70 210"/>

            <text class="label" x="105" y="58">Heater vaporizes</text>
            <text class="label" x="105" y="85">sample</text>
            <path class="note-line" d="M128 103 L128 166"/>

            <path d="M62 168
                     C48 168 36 194 36 225
                     C36 256 51 287 73 287
                     L480 287
                     C517 287 548 260 548 225
                     C548 190 517 167 480 167
                     Z"
                  fill="url(#tubeGradient)" stroke="#222" stroke-width="2.3" vector-effect="non-scaling-stroke"/>
            <ellipse cx="34" cy="225" rx="13" ry="28" fill="#cdd1d4" stroke="#444" stroke-width="2"/>
            <ellipse cx="72" cy="225" rx="13" ry="28" fill="#eff1f2" stroke="#777" stroke-width="2"/>

            <path class="wire" d="M92 198
              C88 198 88 216 92 216
              C96 216 96 198 100 198
              C104 198 104 216 108 216
              C112 216 112 198 116 198
              C120 198 120 216 124 216
              C128 216 128 198 132 198
              C136 198 136 216 140 216
              C144 216 144 198 148 198
              C152 198 152 216 156 216
              C160 216 160 198 164 198"/>
            <rect x="92" y="216" width="73" height="11" fill="#dce7e6" opacity="0.75"/>

            <g aria-label="vaporized zirconium sample">
              <circle cx="91" cy="225" r="4" fill="#17b7bd"/>
              <circle cx="101" cy="219" r="4" fill="#0caab0"/>
              <circle cx="111" cy="228" r="4" fill="#17b7bd"/>
              <circle cx="121" cy="222" r="4" fill="#0caab0"/>
              <circle cx="132" cy="229" r="4" fill="#17b7bd"/>
              <circle cx="143" cy="222" r="4" fill="#0caab0"/>
              <circle cx="154" cy="228" r="4" fill="#17b7bd"/>
              <circle cx="103" cy="234" r="4" fill="#0caab0"/>
              <circle cx="137" cy="236" r="4" fill="#17b7bd"/>
            </g>

            <path d="M118 287 L118 339 L143 339 L143 287 Z" fill="#595959" stroke="#222" stroke-width="2"/>
            <path d="M130 339 L130 392" class="note-line"/>
            <text class="label" x="68" y="422">Electron beam</text>
            <text class="label" x="68" y="449">source</text>
            <g fill="none" stroke="#f5a000" stroke-width="2.6" vector-effect="non-scaling-stroke">
              <path d="M130 287 L104 230"/>
              <path d="M130 287 L116 230"/>
              <path d="M130 287 L130 230"/>
              <path d="M130 287 L144 230"/>
              <path d="M130 287 L156 230"/>
            </g>

            <g id="straightIonLines" stroke="#19bfc5" stroke-width="3" vector-effect="non-scaling-stroke">
              <path d="M166 224 L210 224"/>
              <path d="M166 235 L210 235"/>
              <path d="M166 246 L210 246"/>
            </g>

            <g aria-label="accelerating electric field lenses">
              <ellipse class="lens" cx="247" cy="225" rx="25" ry="58"/>
              <ellipse class="aperture" cx="257" cy="225" rx="16" ry="52"/>
              <path d="M237 225 L289 196 L289 254 Z" fill="#eef0f5"/>
              <ellipse class="lens" cx="340" cy="225" rx="25" ry="58"/>
              <ellipse class="aperture" cx="350" cy="225" rx="16" ry="52"/>
              <path d="M330 225 L382 196 L382 254 Z" fill="#eef0f5"/>
              <path class="note-line" d="M291 250 L291 330"/>
              <text class="label" x="196" y="363">Ions accelerated</text>
            </g>

            <g stroke="#19bfc5" stroke-width="4" vector-effect="non-scaling-stroke">
              <path d="M235 225 L321 225"/>
              <path d="M350 225 L475 225"/>
              <path d="M235 236 L321 236"/>
              <path d="M350 236 L475 236"/>
            </g>

            <path d="M535 164
                     C575 182 606 212 629 248
                     L740 375
                     C759 397 752 434 724 451
                     C700 466 668 458 651 436
                     L511 274
                     C485 243 493 183 535 164 Z"
                  fill="#8e5f9b" opacity="0.36"/>
            <text class="label" x="596" y="28">Magnet</text>
            <path class="note-line" d="M623 42 L623 103"/>

            <g transform="rotate(23 560 174)" filter="url(#softShadow)">
              <rect x="501" y="94" width="124" height="92" rx="11" fill="url(#metalGradient)" stroke="#1f1f1f" stroke-width="2.3"/>
              <ellipse cx="563" cy="186" rx="65" ry="20" fill="#6f5a78" stroke="#1f1f1f" stroke-width="2.3"/>
            </g>
            <g transform="rotate(23 500 333)" filter="url(#softShadow)">
              <rect x="439" y="287" width="124" height="92" rx="11" fill="url(#metalGradient)" stroke="#1f1f1f" stroke-width="2.3"/>
              <ellipse cx="501" cy="287" rx="65" ry="20" fill="#c7c7c7" stroke="#1f1f1f" stroke-width="2.3"/>
            </g>

            <g id="ionPaths" aria-label="curved zirconium ion paths"></g>
            <g id="pathLabels" aria-hidden="true"></g>
            <g id="detectorHits" aria-hidden="true"></g>

            <g aria-label="detector">
              <path d="M641 355 L710 426" class="instrument-line"/>
              <g transform="rotate(-42 705 399)">
                <ellipse cx="705" cy="399" rx="36" ry="54" fill="#eceff1" stroke="#333" stroke-width="2.2"/>
                <ellipse cx="705" cy="399" rx="25" ry="48" fill="url(#detectorGradient)" stroke="#556044" stroke-width="1.5"/>
              </g>
              <path class="note-line" d="M704 428 L704 492"/>
              <text class="label" x="645" y="512">Detector</text>
            </g>

            <path class="note-line" d="M516 308 L526 456"/>
            <text class="label" x="447" y="426">Magnetic field</text>
            <text class="label" x="447" y="453">deflects lightest</text>
            <text class="label" x="447" y="480">ions most</text>

            <g id="instrumentAnnotation" aria-live="polite">
              <rect class="annotation-box" x="553" y="300" width="188" height="62" rx="4"/>
              <text class="annotation-text" x="566" y="324" id="instrumentAnno1">Zr-90 reaches detector</text>
              <text class="annotation-text" x="566" y="347" id="instrumentAnno2">m/z = 90; abundance 51%</text>
            </g>
          </svg>
        </article>

        <article class="panel chart-panel">
          <h2 class="panel-title">Zirconium mass spectrum: natural abundance</h2>
          <svg id="chartSvg" viewBox="0 0 500 520" role="img" aria-labelledby="chartTitle chartDesc">
            <title id="chartTitle">Mass spectrum of zirconium isotopes</title>
            <desc id="chartDesc">Bar chart of relative abundance versus mass-to-charge ratio for Zr-90, Zr-91, Zr-92, Zr-94, and Zr-96.</desc>
            <g id="gridLines"></g>
            <path class="axis" d="M83 34 L83 410 L460 410"/>
            <g id="chartTicks"></g>
            <text class="axis-number" x="52" y="416">0</text>
            <text class="axis-number" x="38" y="231">50</text>
            <text class="axis-number" x="26" y="44">100</text>
            <text class="axis-label" x="122" y="493">Mass-to-charge ratio</text>
            <g transform="translate(26 278) rotate(-90)">
              <text class="axis-label">Relative abundance (%)</text>
            </g>
            <g id="bars"></g>
            <g id="chartAnnotation" aria-live="polite">
              <rect class="annotation-box" x="104" y="63" width="262" height="52" rx="4"/>
              <text class="annotation-text" x="117" y="86" id="chartAnno1">Selected peak: Zr-90</text>
              <text class="annotation-text" x="117" y="107" id="chartAnno2">51% relative abundance</text>
            </g>
          </svg>
        </article>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var isotopes = [
        { id: "zr90", label: "Zr-90", mass: 90, abundance: 51, color: "#0099a4" },
        { id: "zr91", label: "Zr-91", mass: 91, abundance: 11, color: "#0aaeb7" },
        { id: "zr92", label: "Zr-92", mass: 92, abundance: 18, color: "#10b9bf" },
        { id: "zr94", label: "Zr-94", mass: 94, abundance: 18, color: "#35c4c8" },
        { id: "zr96", label: "Zr-96", mass: 96, abundance: 2, color: "#65d4d7" }
      ];

      var selectedIndex = 0;
      var shell = document.querySelector(".figure-shell");
      var slider = document.getElementById("fieldSlider");
      var readout = document.getElementById("readout");
      var ionGroup = document.getElementById("ionPaths");
      var labelGroup = document.getElementById("pathLabels");
      var hitGroup = document.getElementById("detectorHits");
      var barsGroup = document.getElementById("bars");
      var gridGroup = document.getElementById("gridLines");
      var ticksGroup = document.getElementById("chartTicks");
      var instrumentAnno1 = document.getElementById("instrumentAnno1");
      var instrumentAnno2 = document.getElementById("instrumentAnno2");
      var chartAnno1 = document.getElementById("chartAnno1");
      var chartAnno2 = document.getElementById("chartAnno2");
      var svgNS = "http://www.w3.org/2000/svg";
      var chart = { x0: 83, y0: 410, w: 377, h: 376, minX: 89, maxX: 97.7 };

      function makeSvg(name, attrs) {
        var el = document.createElementNS(svgNS, name);
        Object.keys(attrs || {}).forEach(function (key) {
          el.setAttribute(key, attrs[key]);
        });
        return el;
      }

      function yForPercent(percent) {
        return chart.y0 - (percent / 100) * chart.h;
      }

      function xForMass(mass) {
        return chart.x0 + ((mass - chart.minX) / (chart.maxX - chart.minX)) * chart.w;
      }

      function makePathData(isotope, index) {
        var selectedMass = isotopes[selectedIndex].mass;
        var field = selectedMass / 96;
        var ratio = field * 96 / isotope.mass;
        var endY = 326 + 80 * ratio;
        var startY = 218 + index * 9;
        var c1y = startY - 2;
        var c2y = 268 + 100 * ratio;
        return {
          d: "M 378 " + startY.toFixed(1) +
             " L 474 " + startY.toFixed(1) +
             " C 526 " + c1y.toFixed(1) +
             " 586 " + c2y.toFixed(1) +
             " 704 " + endY.toFixed(1),
          endX: 704,
          endY: endY,
          labelX: 666,
          labelY: endY - 9
        };
      }

      function buildInstrument() {
        isotopes.forEach(function (iso, index) {
          var path = makeSvg("path", {
            id: "path-" + iso.id,
            class: "ion-path",
            "data-index": index,
            stroke: iso.color
          });
          path.addEventListener("click", function () {
            setSelected(index);
          });
          ionGroup.appendChild(path);

          var label = makeSvg("text", {
            id: "path-label-" + iso.id,
            class: "beam-label"
          });
          label.textContent = iso.label;
          labelGroup.appendChild(label);

          var hit = makeSvg("circle", {
            id: "hit-" + iso.id,
            class: "detector-hit",
            r: 7
          });
          hitGroup.appendChild(hit);
        });
      }

      function buildChart() {
        for (var pct = 10; pct <= 100; pct += 10) {
          var y = yForPercent(pct);
          gridGroup.appendChild(makeSvg("path", {
            class: "gridline",
            d: "M 83 " + y.toFixed(1) + " L 460 " + y.toFixed(1)
          }));
          ticksGroup.appendChild(makeSvg("path", {
            class: "axis",
            d: "M 66 " + y.toFixed(1) + " L 83 " + y.toFixed(1)
          }));
        }

        for (var mass = 89; mass <= 97; mass += 1) {
          var x = xForMass(mass);
          ticksGroup.appendChild(makeSvg("path", {
            class: "axis",
            d: "M " + x.toFixed(1) + " 410 L " + x.toFixed(1) + " 428"
          }));
          if (mass === 90 || mass === 92 || mass === 94 || mass === 96) {
            var tickLabel = makeSvg("text", {
              class: "axis-number",
              x: x - 14,
              y: 452
            });
            tickLabel.textContent = String(mass);
            ticksGroup.appendChild(tickLabel);
          }
        }

        isotopes.forEach(function (iso, index) {
          var x = xForMass(iso.mass);
          var y = yForPercent(iso.abundance);
          var barW = 15;
          var bar = makeSvg("rect", {
            id: "bar-" + iso.id,
            class: "bar",
            "data-index": index,
            x: x - barW / 2,
            y: y,
            width: barW,
            height: chart.y0 - y,
            tabindex: "0",
            role: "button",
            "aria-label": iso.label + ", mass-to-charge ratio " + iso.mass + ", relative abundance " + iso.abundance + " percent"
          });
          bar.addEventListener("click", function () {
            setSelected(index);
          });
          bar.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              setSelected(index);
            }
          });
          barsGroup.appendChild(bar);

          var label = makeSvg("text", {
            class: "bar-label",
            id: "bar-label-" + iso.id,
            x: x - (iso.label === "Zr-91" ? 31 : 28),
            y: Math.max(35, y - 10)
          });
          label.textContent = iso.label;
          barsGroup.appendChild(label);
        });
      }

      function updateInstrumentPaths() {
        isotopes.forEach(function (iso, index) {
          var data = makePathData(iso, index);
          var selected = index === selectedIndex;
          var path = document.getElementById("path-" + iso.id);
          var label = document.getElementById("path-label-" + iso.id);
          var hit = document.getElementById("hit-" + iso.id);
          path.setAttribute("d", data.d);
          path.classList.toggle("selected", selected);
          label.setAttribute("x", data.labelX);
          label.setAttribute("y", data.labelY);
          label.classList.toggle("selected", selected);
          hit.setAttribute("cx", data.endX);
          hit.setAttribute("cy", data.endY);
          hit.classList.toggle("selected", selected);
        });
      }

      function updateBars() {
        isotopes.forEach(function (iso, index) {
          var bar = document.getElementById("bar-" + iso.id);
          bar.classList.toggle("selected", index === selectedIndex);
          bar.classList.toggle("dimmed", index !== selectedIndex);
        });
      }

      function updateAnnotations() {
        var iso = isotopes[selectedIndex];
        readout.textContent = iso.label + ", m/z " + iso.mass;
        instrumentAnno1.textContent = iso.label + " reaches detector";
        instrumentAnno2.textContent = "m/z = " + iso.mass + "; abundance " + iso.abundance + "%";
        chartAnno1.textContent = "Selected peak: " + iso.label;
        chartAnno2.textContent = iso.abundance + "% relative abundance";
      }

      function setSelected(index) {
        selectedIndex = Math.max(0, Math.min(isotopes.length - 1, index));
        slider.value = String(selectedIndex);
        updateInstrumentPaths();
        updateBars();
        updateAnnotations();
      }

      slider.addEventListener("input", function () {
        setSelected(Number(slider.value));
      });

      document.querySelectorAll(".mode-tabs button").forEach(function (button) {
        button.addEventListener("click", function () {
          var view = button.getAttribute("data-view");
          shell.classList.remove("both", "single", "instrument-only", "spectrum-only");
          if (view === "instrument") {
            shell.classList.add("single", "instrument-only");
          } else if (view === "spectrum") {
            shell.classList.add("single", "spectrum-only");
          } else {
            shell.classList.add("both");
          }
          document.querySelectorAll(".mode-tabs button").forEach(function (tab) {
            tab.setAttribute("aria-pressed", String(tab === button));
          });
        });
      });

      buildInstrument();
      buildChart();
      setSelected(0);
    }());
  </script>
</body>
</html>
