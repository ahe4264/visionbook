<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pappus' Theorem: Torus Volume</title>
  <style>
    :root {
      --ink: #24262b;
      --muted: #5e6672;
      --paper: #ffffff;
      --panel: #f7fafc;
      --rule: #d9e1ea;
      --axis: #232326;
      --red: #f0525b;
      --blue: #16a4df;
      --gold: #f8dfab;
      --gold-strong: #f0b84f;
      --green: #16856f;
      --shadow: 0 18px 48px rgba(28, 37, 50, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef3f7 0%, #fbfcfe 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1240px, calc(100vw - 22px));
      margin: 14px auto;
    }

    .figure-shell {
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 12px 14px;
      border-bottom: 1px solid var(--rule);
      background: #fbfdff;
    }

    .control {
      min-width: 0;
    }

    .control-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: #333941;
      font-size: 14px;
      font-weight: 750;
    }

    output {
      color: #136f94;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      accent-color: #1597c6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      min-width: 236px;
    }

    button {
      min-height: 38px;
      border: 1px solid #c9d5e0;
      border-radius: 7px;
      background: #ffffff;
      color: #26313c;
      font: inherit;
      font-size: 14px;
      font-weight: 760;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover {
      border-color: #93b5c8;
      background: #f2f8fb;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      padding: 0 13px;
      border-color: #1189b8;
      background: #e8f7fc;
      color: #075f83;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 326px;
      min-height: 590px;
    }

    .canvas-wrap {
      position: relative;
      min-height: 590px;
      background:
        radial-gradient(circle at 48% 18%, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0) 34%),
        linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .side-panel {
      display: grid;
      align-content: start;
      gap: 13px;
      border-left: 1px solid var(--rule);
      padding: 16px;
      background: var(--panel);
    }

    .readout {
      display: grid;
      gap: 8px;
      padding-bottom: 2px;
    }

    .value-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: baseline;
      padding: 10px 11px;
      border: 1px solid #dbe5ed;
      border-radius: 8px;
      background: #ffffff;
    }

    .value-box strong {
      color: #2e3742;
      font-size: 13px;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .value-box span {
      color: #0b6d66;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .components {
      display: grid;
      gap: 8px;
    }

    .components-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
      text-transform: uppercase;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .chip {
      min-height: 36px;
      padding: 0 9px;
      font-size: 13px;
      text-align: center;
    }

    .chip.active {
      border-color: #f0525b;
      background: #fff1f2;
      color: #9c1d2b;
    }

    .formula-card {
      overflow: hidden;
      border: 1px solid #dbe5ed;
      border-radius: 8px;
      background: #ffffff;
    }

    .formula-line {
      padding: 11px 12px;
      border-bottom: 1px solid #edf2f6;
      color: #34404b;
      font-size: 15px;
      line-height: 1.35;
    }

    .formula-line:last-child {
      border-bottom: 0;
    }

    .formula-line.active {
      background: #fff5dc;
      box-shadow: inset 4px 0 0 var(--gold-strong);
    }

    .formula-line .label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .formula {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      color: #22252b;
    }

    .factor {
      border-radius: 4px;
      padding: 0 2px;
      transition: background 140ms ease, color 140ms ease;
    }

    .factor.hot {
      background: #ffe0a3;
      color: #7c4a00;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 920px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .canvas-wrap {
        min-height: 560px;
      }

      .side-panel {
        border-top: 1px solid var(--rule);
        border-left: 0;
      }
    }

    @media (max-width: 620px) {
      main {
        width: min(100vw - 12px, 1240px);
        margin: 6px auto;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .actions {
        min-width: 0;
      }

      button {
        flex: 1 1 142px;
      }

      .canvas-wrap {
        min-height: 520px;
      }

      .chip-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <section class="figure-shell" aria-label="Interactive torus generated by Pappus' theorem">
    <div class="toolbar">
      <label class="control">
        <span class="control-row"><span>Major radius <i>a</i></span><output id="aOut">2.60</output></span>
        <input id="aSlider" type="range" min="1.70" max="3.80" step="0.05" value="2.60">
      </label>
      <label class="control">
        <span class="control-row"><span>Tube radius <i>b</i></span><output id="bOut">0.72</output></span>
        <input id="bSlider" type="range" min="0.28" max="1.35" step="0.01" value="0.72">
      </label>
      <div class="actions">
        <button class="primary" id="playBtn" type="button">Animate circle</button>
        <button id="sequenceBtn" type="button">Highlight sequence</button>
      </div>
    </div>

    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="torusCanvas" aria-label="A grey perspective torus with a highlighted generating circle, centroid path, major radius a, tube radius b, and Pappus theorem caption"></canvas>
      </div>

      <aside class="side-panel">
        <div class="readout">
          <div class="value-box">
            <strong>Volume</strong>
            <span id="volumeOut">0.00</span>
          </div>
          <div class="value-box">
            <strong>Surface area</strong>
            <span id="surfaceOut">0.00</span>
          </div>
        </div>

        <div class="components">
          <div class="components-title">Pappus components</div>
          <div class="chip-grid" role="group" aria-label="Highlight Pappus components">
            <button class="chip active" data-component="circle" type="button">Generating circle</button>
            <button class="chip" data-component="path" type="button">Centroid path</button>
            <button class="chip" data-component="major" type="button">Major radius a</button>
            <button class="chip" data-component="tube" type="button">Tube radius b</button>
          </div>
        </div>

        <div class="formula-card">
          <div class="formula-line active" data-formula="path">
            <span class="label">Centroid distance</span>
            <span class="formula"><span class="factor factor-path">2&pi;a</span></span>
          </div>
          <div class="formula-line active" data-formula="circle">
            <span class="label">Area of circular region</span>
            <span class="formula"><span class="factor factor-circle">&pi;b<sup>2</sup></span></span>
          </div>
          <div class="formula-line" data-formula="volume">
            <span class="label">Volume by Pappus</span>
            <span class="formula">V = <span class="factor factor-path">2&pi;a</span><span class="factor factor-circle">&pi;b<sup>2</sup></span> = 2&pi;<sup>2</sup>ab<sup>2</sup></span>
          </div>
          <div class="formula-line" data-formula="surface">
            <span class="label">Surface area by Pappus</span>
            <span class="formula">S = <span class="factor factor-path">2&pi;a</span><span class="factor factor-tube">2&pi;b</span> = 4&pi;<sup>2</sup>ab</span>
          </div>
        </div>

        <div class="note" id="numericNote">
          The centroid is the center of the circular region, so its path has circumference 2&pi;a.
        </div>
      </aside>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("torusCanvas");
  const ctx = canvas.getContext("2d");
  const aSlider = document.getElementById("aSlider");
  const bSlider = document.getElementById("bSlider");
  const aOut = document.getElementById("aOut");
  const bOut = document.getElementById("bOut");
  const volumeOut = document.getElementById("volumeOut");
  const surfaceOut = document.getElementById("surfaceOut");
  const playBtn = document.getElementById("playBtn");
  const sequenceBtn = document.getElementById("sequenceBtn");
  const numericNote = document.getElementById("numericNote");
  const chips = Array.from(document.querySelectorAll(".chip"));
  const formulaLines = Array.from(document.querySelectorAll(".formula-line"));

  const state = {
    a: Number(aSlider.value),
    b: Number(bSlider.value),
    angle: 0,
    playing: false,
    component: "circle",
    sequencing: false,
    lastTime: 0,
    sequenceStart: 0
  };

  const componentOrder = ["circle", "path", "major", "tube"];
  const componentText = {
    circle: "Generating circle",
    path: "Centroid path",
    major: "Major radius a",
    tube: "Tube radius b"
  };

  const TAU = Math.PI * 2;
  const viewTilt = 0.34;
  const ySkew = 0.04;
  let cssWidth = 0;
  let cssHeight = 0;
  let geom = null;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function fmt(value, digits = 2) {
    return value.toLocaleString(undefined, {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
  }

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cssWidth = Math.max(320, rect.width);
    cssHeight = Math.max(500, rect.height);
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    canvas.style.width = `${cssWidth}px`;
    canvas.style.height = `${cssHeight}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function updateValues() {
    state.a = Number(aSlider.value);
    state.b = Math.min(Number(bSlider.value), state.a - 0.18);
    if (Number(bSlider.value) !== state.b) {
      bSlider.value = state.b.toFixed(2);
    }
    bSlider.max = Math.max(0.3, state.a - 0.18).toFixed(2);

    const volume = 2 * Math.PI * Math.PI * state.a * state.b * state.b;
    const surface = 4 * Math.PI * Math.PI * state.a * state.b;
    const pathLength = TAU * state.a;
    const circleArea = Math.PI * state.b * state.b;
    const rimLength = TAU * state.b;

    aOut.textContent = fmt(state.a);
    bOut.textContent = fmt(state.b);
    volumeOut.textContent = fmt(volume);
    surfaceOut.textContent = fmt(surface);
    numericNote.innerHTML =
      `2&pi;a = ${fmt(pathLength)}, &pi;b<sup>2</sup> = ${fmt(circleArea)}, and 2&pi;b = ${fmt(rimLength)}.`;

    updateHighlights();
    draw();
  }

  function setComponent(component, stopSequence = true) {
    state.component = component;
    if (stopSequence) {
      state.sequencing = false;
      sequenceBtn.textContent = "Highlight sequence";
    }
    updateHighlights();
    draw();
  }

  function updateHighlights() {
    chips.forEach((chip) => {
      chip.classList.toggle("active", chip.dataset.component === state.component);
    });

    const active = state.component;
    formulaLines.forEach((line) => {
      const key = line.dataset.formula;
      const on =
        (active === "path" && (key === "path" || key === "volume" || key === "surface")) ||
        (active === "circle" && (key === "circle" || key === "volume")) ||
        (active === "major" && (key === "path" || key === "volume" || key === "surface")) ||
        (active === "tube" && (key === "circle" || key === "surface" || key === "volume"));
      line.classList.toggle("active", on);
    });

    document.querySelectorAll(".factor").forEach((factor) => factor.classList.remove("hot"));
    if (active === "path" || active === "major") {
      document.querySelectorAll(".factor-path").forEach((factor) => factor.classList.add("hot"));
    }
    if (active === "circle") {
      document.querySelectorAll(".factor-circle").forEach((factor) => factor.classList.add("hot"));
    }
    if (active === "tube") {
      document.querySelectorAll(".factor-circle, .factor-tube").forEach((factor) => factor.classList.add("hot"));
    }
  }

  function configureGeometry() {
    const topReserved = cssHeight < 560 ? 32 : 42;
    const captionReserved = cssHeight < 560 ? 158 : 172;
    const usableHeight = Math.max(270, cssHeight - topReserved - captionReserved);
    const outer = state.a + state.b;
    const horizontalScale = cssWidth * 0.43 / outer;
    const verticalScale = usableHeight * 0.45 / (state.b + outer * viewTilt);
    const scale = clamp(Math.min(horizontalScale, verticalScale), 45, 122);
    const cx = cssWidth * 0.5;
    const cy = topReserved + usableHeight * 0.46;
    geom = { cx, cy, scale, topReserved, captionReserved, outer };
  }

  function project(point) {
    return {
      x: geom.cx + point.x * geom.scale,
      y: geom.cy - point.y * geom.scale + point.z * geom.scale * viewTilt - point.x * geom.scale * ySkew * 0.02,
      depth: point.z
    };
  }

  function torusPoint(u, v) {
    const ring = state.a + state.b * Math.cos(v);
    return {
      x: ring * Math.cos(u),
      y: state.b * Math.sin(v),
      z: ring * Math.sin(u)
    };
  }

  function torusNormal(u, v) {
    return {
      x: Math.cos(v) * Math.cos(u),
      y: Math.sin(v),
      z: Math.cos(v) * Math.sin(u)
    };
  }

  function shadeColor(normal, depth) {
    const light = normalize({ x: -0.42, y: 0.82, z: 0.38 });
    const ndotl = Math.max(0, normal.x * light.x + normal.y * light.y + normal.z * light.z);
    const backSoft = 1 - Math.max(0, -depth) * 0.025;
    const value = clamp(182 + ndotl * 58 + backSoft * 14, 172, 244);
    return `rgb(${value}, ${value + 2}, ${value + 3})`;
  }

  function normalize(point) {
    const len = Math.hypot(point.x, point.y, point.z) || 1;
    return { x: point.x / len, y: point.y / len, z: point.z / len };
  }

  function drawTorus() {
    const uSegments = 78;
    const vSegments = 24;
    const quads = [];

    for (let i = 0; i < uSegments; i += 1) {
      const u0 = i / uSegments * TAU;
      const u1 = (i + 1) / uSegments * TAU;
      for (let j = 0; j < vSegments; j += 1) {
        const v0 = j / vSegments * TAU;
        const v1 = (j + 1) / vSegments * TAU;
        const world = [
          torusPoint(u0, v0),
          torusPoint(u1, v0),
          torusPoint(u1, v1),
          torusPoint(u0, v1)
        ];
        const centerU = (u0 + u1) / 2;
        const centerV = (v0 + v1) / 2;
        const normal = torusNormal(centerU, centerV);
        const avgDepth = world.reduce((sum, point) => sum + point.z, 0) / world.length;
        quads.push({
          screen: world.map(project),
          depth: avgDepth,
          color: shadeColor(normal, avgDepth),
          alpha: 0.98
        });
      }
    }

    quads.sort((left, right) => left.depth - right.depth);
    ctx.lineJoin = "round";
    quads.forEach((quad) => {
      ctx.beginPath();
      ctx.moveTo(quad.screen[0].x, quad.screen[0].y);
      for (let i = 1; i < quad.screen.length; i += 1) {
        ctx.lineTo(quad.screen[i].x, quad.screen[i].y);
      }
      ctx.closePath();
      ctx.globalAlpha = quad.alpha;
      ctx.fillStyle = quad.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    const innerRx = Math.max(4, (state.a - state.b) * geom.scale);
    const innerRy = Math.max(3, innerRx * viewTilt);
    const outerRx = (state.a + state.b) * geom.scale;
    const outerRy = outerRx * viewTilt + state.b * geom.scale * 0.92;

    const shine = ctx.createRadialGradient(
      geom.cx - outerRx * 0.12,
      geom.cy - outerRy * 0.45,
      innerRy * 0.2,
      geom.cx - outerRx * 0.08,
      geom.cy - outerRy * 0.35,
      outerRx * 0.8
    );
    shine.addColorStop(0, "rgba(255, 255, 255, 0.42)");
    shine.addColorStop(0.45, "rgba(255, 255, 255, 0.14)");
    shine.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.ellipse(geom.cx, geom.cy, outerRx, outerRy, 0, 0, TAU);
    ctx.ellipse(geom.cx, geom.cy, innerRx, innerRy, 0, TAU, 0, true);
    ctx.fill("evenodd");
    ctx.restore();
  }

  function drawAxis() {
    const active = state.component === "major";
    const top = geom.cy - geom.scale * (state.b + 2.3);
    const bottom = geom.cy + geom.scale * (state.b + state.a * viewTilt + 1.15);
    ctx.save();
    ctx.strokeStyle = active ? "#0b6d66" : "#252528";
    ctx.lineWidth = active ? 4.5 : 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(geom.cx, top);
    ctx.lineTo(geom.cx, bottom);
    ctx.stroke();
    ctx.fillStyle = "#202124";
    ctx.beginPath();
    ctx.arc(geom.cx, geom.cy, active ? 11 : 9, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawCentroidPath() {
    const active = state.component === "path" || state.component === "major";
    const rx = state.a * geom.scale;
    const ry = rx * viewTilt;
    ctx.save();
    ctx.strokeStyle = active ? "#f02836" : "#f0525b";
    ctx.lineWidth = active ? 4 : 3;
    ctx.setLineDash([18, 13]);
    ctx.beginPath();
    ctx.ellipse(geom.cx, geom.cy, rx, ry, 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);

    if (state.playing || state.angle > 0.03) {
      ctx.strokeStyle = "#de2b38";
      ctx.lineWidth = active ? 5 : 3.5;
      ctx.beginPath();
      const start = 0;
      const end = state.angle % TAU;
      const steps = Math.max(6, Math.ceil(end / TAU * 80));
      for (let i = 0; i <= steps; i += 1) {
        const t = start + (end - start) * i / steps;
        const p = project({ x: state.a * Math.cos(t), y: 0, z: state.a * Math.sin(t) });
        if (i === 0) {
          ctx.moveTo(p.x, p.y);
        } else {
          ctx.lineTo(p.x, p.y);
        }
      }
      ctx.stroke();
    }

    drawPathArrow(2.18, active);
    drawPathArrow(4.58, active);
    ctx.restore();
  }

  function drawPathArrow(angle, active) {
    const p = project({ x: state.a * Math.cos(angle), y: 0, z: state.a * Math.sin(angle) });
    const p2 = project({ x: state.a * Math.cos(angle + 0.04), y: 0, z: state.a * Math.sin(angle + 0.04) });
    const rot = Math.atan2(p2.y - p.y, p2.x - p.x);
    const size = active ? 20 : 17;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(rot);
    ctx.fillStyle = active ? "#de2b38" : "#f0525b";
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.72, -size * 0.48);
    ctx.lineTo(-size * 0.34, 0);
    ctx.lineTo(-size * 0.72, size * 0.48);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function circleCenter(angle = state.angle) {
    return {
      x: state.a * Math.cos(angle),
      y: 0,
      z: state.a * Math.sin(angle)
    };
  }

  function drawGeneratingCircle() {
    const active = state.component === "circle";
    const angle = state.angle;
    const radial = { x: Math.cos(angle), y: 0, z: Math.sin(angle) };
    const center = circleCenter(angle);
    const steps = 88;
    const screen = [];
    for (let i = 0; i < steps; i += 1) {
      const t = i / steps * TAU;
      screen.push(project({
        x: center.x + state.b * Math.cos(t) * radial.x,
        y: state.b * Math.sin(t),
        z: center.z + state.b * Math.cos(t) * radial.z
      }));
    }

    ctx.save();
    ctx.beginPath();
    screen.forEach((p, i) => {
      if (i === 0) {
        ctx.moveTo(p.x, p.y);
      } else {
        ctx.lineTo(p.x, p.y);
      }
    });
    ctx.closePath();
    ctx.fillStyle = active ? "rgba(255, 225, 164, 0.92)" : "rgba(255, 225, 164, 0.75)";
    ctx.strokeStyle = active ? "#0a93d1" : "#16a4df";
    ctx.lineWidth = active ? 4 : 3;
    ctx.fill();
    ctx.stroke();

    const c = project(center);
    ctx.fillStyle = active ? "#ff3346" : "#f0525b";
    ctx.beginPath();
    ctx.arc(c.x, c.y, active ? 10 : 8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawDoubleArrow(from, to, options) {
    const settings = Object.assign({
      color: "#222326",
      width: 2.5,
      head: 10,
      label: "",
      labelOffsetX: 0,
      labelOffsetY: -8,
      fontSize: 28
    }, options);
    const angle = Math.atan2(to.y - from.y, to.x - from.x);
    const drawHead = (point, direction) => {
      ctx.save();
      ctx.translate(point.x, point.y);
      ctx.rotate(direction);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-settings.head, -settings.head * 0.55);
      ctx.lineTo(-settings.head * 0.68, 0);
      ctx.lineTo(-settings.head, settings.head * 0.55);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };

    ctx.save();
    ctx.strokeStyle = settings.color;
    ctx.fillStyle = settings.color;
    ctx.lineWidth = settings.width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    drawHead(to, angle);
    drawHead(from, angle + Math.PI);
    if (settings.label) {
      ctx.font = `italic ${settings.fontSize}px Georgia, "Times New Roman", serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(settings.label, (from.x + to.x) / 2 + settings.labelOffsetX, (from.y + to.y) / 2 + settings.labelOffsetY);
    }
    ctx.restore();
  }

  function drawRadiiLabels() {
    const center = circleCenter(state.angle);
    const radial = { x: Math.cos(state.angle), y: 0, z: Math.sin(state.angle) };
    const majorStart = project({ x: 0.12 * radial.x, y: 0, z: 0.12 * radial.z });
    const majorEnd = project({ x: (state.a - 0.13) * radial.x, y: 0, z: (state.a - 0.13) * radial.z });
    const bStart = project(center);
    const bEnd = project({
      x: center.x + state.b * radial.x,
      y: center.y,
      z: center.z + state.b * radial.z
    });

    const majorActive = state.component === "major";
    const tubeActive = state.component === "tube";
    drawDoubleArrow(majorStart, majorEnd, {
      color: majorActive ? "#0b6d66" : "#222326",
      width: majorActive ? 4.2 : 2.6,
      head: majorActive ? 14 : 11,
      label: "a",
      labelOffsetY: state.angle > Math.PI * 0.45 && state.angle < Math.PI * 1.55 ? 20 : -18,
      fontSize: majorActive ? 40 : 36
    });
    drawDoubleArrow(bStart, bEnd, {
      color: tubeActive ? "#b77900" : "#222326",
      width: tubeActive ? 4.2 : 2.6,
      head: tubeActive ? 14 : 11,
      label: "b",
      labelOffsetY: -18,
      labelOffsetX: 3,
      fontSize: tubeActive ? 40 : 36
    });
  }

  function roundedRectPath(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
  }

  function drawCallout() {
    const boxW = clamp(cssWidth * 0.63, 290, 610);
    const boxH = cssWidth < 520 ? 112 : 126;
    const boxX = (cssWidth - boxW) / 2;
    const boxY = cssHeight - boxH - 18;
    const target = project({
      x: state.a * Math.cos(Math.max(state.angle, 5.02)),
      y: 0,
      z: state.a * Math.sin(Math.max(state.angle, 5.02))
    });
    const baseX = boxX + boxW * 0.74;
    const baseY = boxY;

    ctx.save();
    ctx.fillStyle = "#fde8bb";
    ctx.strokeStyle = "#b9bdc2";
    ctx.lineWidth = 4;
    ctx.lineJoin = "miter";

    ctx.beginPath();
    ctx.moveTo(boxX, boxY);
    ctx.lineTo(baseX, boxY);
    ctx.lineTo(baseX - 58, boxY - 116);
    ctx.lineTo(baseX - 26, boxY - 101);
    ctx.lineTo(target.x - 18, target.y + 10);
    ctx.lineTo(baseX - 86, boxY - 125);
    ctx.lineTo(baseX - 101, boxY - 68);
    ctx.lineTo(boxX + boxW, boxY);
    ctx.lineTo(boxX + boxW, boxY + boxH);
    ctx.lineTo(boxX, boxY + boxH);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const fontSize = clamp(boxW / 12.8, 30, 47);
    ctx.fillStyle = "#24262b";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.font = `${fontSize}px Inter, "Segoe UI", sans-serif`;
    const left = boxX + clamp(boxW * 0.07, 22, 42);
    ctx.fillText("The centroid travels", left, boxY + boxH * 0.45);
    ctx.fillText("a distance ", left, boxY + boxH * 0.78);
    const prefixWidth = ctx.measureText("a distance ").width;
    ctx.font = `italic ${fontSize}px Georgia, "Times New Roman", serif`;
    ctx.fillText("2\u03c0a.", left + prefixWidth, boxY + boxH * 0.78);
    ctx.restore();
  }

  function drawSmallLabels() {
    ctx.save();
    ctx.fillStyle = "#4d5661";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `700 ${clamp(cssWidth / 55, 12, 15)}px Inter, "Segoe UI", sans-serif`;
    const pathPoint = project({ x: state.a * Math.cos(1.38), y: 0, z: state.a * Math.sin(1.38) });
    if (state.component === "path") {
      drawLabelPill(pathPoint.x + 4, pathPoint.y - 34, `centroid path = 2\u03c0a`, "#fff1f2", "#f0525b");
    }
    if (state.component === "circle") {
      const c = project(circleCenter(state.angle));
      drawLabelPill(c.x, c.y - state.b * geom.scale - 25, `area = \u03c0b\u00b2`, "#fff5dc", "#d49213");
    }
    ctx.restore();
  }

  function drawLabelPill(x, y, text, fill, stroke) {
    ctx.save();
    ctx.font = `800 ${clamp(cssWidth / 54, 12, 15)}px Inter, "Segoe UI", sans-serif`;
    const padX = 10;
    const h = 28;
    const w = ctx.measureText(text).width + padX * 2;
    const clampedX = clamp(x, w / 2 + 8, cssWidth - w / 2 - 8);
    const clampedY = clamp(y, h / 2 + 8, cssHeight - h / 2 - 8);
    roundedRectPath(clampedX - w / 2, clampedY - h / 2, w, h, 7);
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#26313c";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, clampedX, clampedY + 0.5);
    ctx.restore();
  }

  function draw() {
    if (!ctx || cssWidth === 0 || cssHeight === 0) {
      return;
    }
    configureGeometry();
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const bg = ctx.createLinearGradient(0, 0, 0, cssHeight);
    bg.addColorStop(0, "#ffffff");
    bg.addColorStop(1, "#f8fafc");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cssWidth, cssHeight);

    drawAxis();
    drawTorus();
    drawCentroidPath();
    drawGeneratingCircle();
    drawRadiiLabels();
    drawSmallLabels();
    drawCallout();
  }

  function tick(time) {
    if (!state.lastTime) {
      state.lastTime = time;
    }
    const dt = Math.min(40, time - state.lastTime);
    state.lastTime = time;

    if (state.playing) {
      state.angle = (state.angle + dt * 0.0009) % TAU;
      draw();
    }

    if (state.sequencing) {
      if (!state.sequenceStart) {
        state.sequenceStart = time;
      }
      const index = Math.floor((time - state.sequenceStart) / 1600) % componentOrder.length;
      const next = componentOrder[index];
      if (state.component !== next) {
        state.component = next;
        updateHighlights();
        draw();
      }
    }

    requestAnimationFrame(tick);
  }

  aSlider.addEventListener("input", updateValues);
  bSlider.addEventListener("input", updateValues);

  playBtn.addEventListener("click", () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? "Pause animation" : "Animate circle";
    if (state.playing && state.component !== "circle" && state.component !== "path") {
      setComponent("circle", false);
    }
  });

  sequenceBtn.addEventListener("click", () => {
    state.sequencing = !state.sequencing;
    state.sequenceStart = 0;
    sequenceBtn.textContent = state.sequencing ? "Stop sequence" : "Highlight sequence";
  });

  chips.forEach((chip) => {
    chip.addEventListener("click", () => setComponent(chip.dataset.component));
  });

  window.addEventListener("resize", resizeCanvas);

  updateValues();
  resizeCanvas();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
