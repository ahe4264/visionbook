<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ni-Catalyzed Hydrogenation of Ethylene</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7faf7;
      --ink: #172015;
      --muted: #51604b;
      --panel: #ffffff;
      --line: #cbd8c8;
      --accent: #1d7f4f;
      --accent-2: #1f5fd0;
      --break: #d04b34;
      --form: #0a7b63;
      --shadow: rgba(22, 46, 20, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    main.figure-shell {
      width: min(1180px, 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .topbar,
    .status {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px var(--shadow);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 25px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .formula {
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
    }

    .controls,
    .step-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid #aec8ad;
      background: #fff;
      color: #15341d;
      border-radius: 7px;
      min-height: 34px;
      padding: 7px 10px;
      font: 700 13px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      background: #eff8ee;
      outline: none;
    }

    button:active {
      transform: translateY(1px);
    }

    button[aria-pressed="true"],
    .step-button.active {
      background: #dff2e5;
      border-color: var(--accent);
      color: #073b27;
    }

    .figure-stage {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 14px 34px var(--shadow);
      overflow: hidden;
      min-height: 530px;
      position: relative;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 530px;
    }

    .panel-frame {
      fill: #ffffff;
      stroke: #d7e3d5;
      stroke-width: 1.5;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .mechanism-panel.active .panel-frame {
      opacity: 1;
      stroke: #73b178;
      stroke-width: 2.6;
    }

    .surface-base {
      fill: url(#surfaceGradient);
      stroke: #43a445;
      stroke-width: 1.2;
    }

    .surface-edge {
      fill: #31913d;
      opacity: 0.95;
    }

    .surface-atom {
      fill: url(#niSphere);
      stroke: rgba(30, 115, 34, 0.4);
      stroke-width: 0.7;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .surface-atom:hover,
    .surface-atom:focus {
      filter: url(#glow);
      transform: scale(1.18);
      outline: none;
    }

    .bond {
      stroke: #333b38;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .bond.light {
      stroke: #b9c2bc;
      stroke-width: 5;
    }

    .double-bond {
      stroke: #202624;
      stroke-width: 5.5;
      stroke-linecap: round;
    }

    .pi-break {
      stroke: var(--break);
      stroke-width: 4;
      stroke-dasharray: 8 7;
      stroke-linecap: round;
      opacity: 0;
    }

    .form-bond {
      stroke: var(--form);
      stroke-width: 4;
      stroke-dasharray: 7 7;
      stroke-linecap: round;
      opacity: 0;
    }

    .atom-c {
      fill: url(#carbonSphere);
      stroke: #1e2524;
      stroke-width: 1.1;
    }

    .atom-h {
      fill: url(#hydrogenSphere);
      stroke: #c7cfca;
      stroke-width: 1;
    }

    .ghost {
      opacity: 0.3;
    }

    .arrow,
    .curved-arrow {
      fill: none;
      stroke: #111;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrowHead);
    }

    .arrow.thin {
      stroke-width: 2.5;
    }

    .arrow.blue {
      stroke: var(--accent-2);
      marker-end: url(#arrowHeadBlue);
    }

    .label {
      font-size: 24px;
      fill: #111;
    }

    .label.small {
      font-size: 19px;
      fill: #223020;
    }

    .caption {
      font-size: 28px;
      font-weight: 700;
      fill: #111;
    }

    .note {
      font-size: 20px;
      fill: #1f3421;
    }

    .callout-line {
      stroke: #111;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .surface-click-hint {
      font-size: 14px;
      fill: #496046;
      opacity: 0.9;
    }

    .active-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-dasharray: 11 8;
      opacity: 0;
      pointer-events: none;
    }

    .mechanism-panel.active .active-ring {
      opacity: 1;
      animation: dash 1.4s linear infinite;
    }

    .mechanism-panel .step-emphasis {
      opacity: 0;
    }

    .mechanism-panel.active .step-emphasis {
      opacity: 1;
    }

    .status {
      display: grid;
      grid-template-columns: minmax(150px, 0.28fr) 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      min-height: 72px;
    }

    .status-title {
      font-weight: 800;
      color: #133a24;
    }

    .status-text {
      color: #273728;
      line-height: 1.35;
      font-size: 14px;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      color: #40513d;
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .swatch {
      width: 18px;
      height: 4px;
      border-radius: 99px;
      background: var(--form);
    }

    .swatch.break {
      background: var(--break);
    }

    .swatch.diffuse {
      background: var(--accent-2);
    }

    .step-a .h2-approach {
      animation: h2Dissociate 3.1s ease-in-out infinite;
    }

    .step-a.active .form-bond {
      animation: pulseForm 1.25s ease-in-out infinite;
    }

    .step-b .ethylene-descend {
      animation: ethyleneAdsorb 3.1s ease-in-out infinite;
    }

    .step-b.active .pi-break,
    .step-b.active .form-bond {
      animation: pulseBreak 1.2s ease-in-out infinite;
    }

    .step-c .migrate-left {
      animation: migrateLeft 3.1s ease-in-out infinite;
    }

    .step-c .migrate-right {
      animation: migrateRight 3.1s ease-in-out infinite;
    }

    .step-c.active .form-bond {
      animation: pulseForm 1.25s ease-in-out infinite;
    }

    .step-d .ethane-rise {
      animation: ethaneDesorb 3.1s ease-in-out infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -38;
      }
    }

    @keyframes pulseForm {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes pulseBreak {
      0%, 100% {
        opacity: 0.25;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes h2Dissociate {
      0%, 18% {
        transform: translate(0, -45px) scale(0.86);
        opacity: 0.42;
      }
      45%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes ethyleneAdsorb {
      0%, 18% {
        transform: translate(0, -58px) scale(0.9);
        opacity: 0.55;
      }
      53%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes migrateLeft {
      0%, 20% {
        transform: translate(-38px, 7px);
      }
      55%, 100% {
        transform: translate(0, 0);
      }
    }

    @keyframes migrateRight {
      0%, 20% {
        transform: translate(38px, 7px);
      }
      55%, 100% {
        transform: translate(0, 0);
      }
    }

    @keyframes ethaneDesorb {
      0%, 22% {
        transform: translate(0, 42px) scale(0.94);
      }
      68%, 100% {
        transform: translate(0, -8px) scale(1);
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .topbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .controls,
      .step-buttons,
      .legend {
        justify-content: flex-start;
      }

      .figure-stage {
        min-height: 620px;
        overflow-x: auto;
        overflow-y: hidden;
      }

      svg {
        width: 1180px;
        max-width: none;
        min-height: 620px;
      }

      .status {
        grid-template-columns: 1fr;
      }

      .label {
        font-size: 21px;
      }

      .note {
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const steps = {
        a: {
          title: "Step (a): H2 dissociates",
          text: "Hydrogen molecules adsorb onto nickel, split into H atoms, and form Ni-H surface bonds. The metal surface weakens H-H bonding and positions the atoms for hydrogenation."
        },
        b: {
          title: "Step (b): Ethylene adsorbs",
          text: "Ethylene approaches the Ni lattice. The C-C pi bond is weakened as the alkene binds to surface nickel atoms through new Ni-C interactions."
        },
        c: {
          title: "Step (c): H atoms diffuse and add",
          text: "Adsorbed H atoms migrate across the surface and collide with the bound carbon atoms, forming new C-H bonds while the molecule becomes saturated."
        },
        d: {
          title: "Step (d): Ethane desorbs",
          text: "Once C2H6 is formed, its interaction with Ni is weaker than the adsorbed intermediates, so ethane leaves the surface and exposes catalytic sites again."
        }
      };

      const order = ["a", "b", "c", "d"];
      const panels = Array.from(document.querySelectorAll(".mechanism-panel"));
      const buttons = Array.from(document.querySelectorAll(".step-button"));
      const playPause = document.getElementById("playPause");
      const statusTitle = document.getElementById("statusTitle");
      const statusText = document.getElementById("statusText");
      let current = "a";
      let playing = true;
      let timer = null;

      function setStep(step, fromTimer = false) {
        current = step;
        panels.forEach(panel => panel.classList.toggle("active", panel.dataset.step === step));
        buttons.forEach(button => {
          const selected = button.dataset.step === step;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        statusTitle.textContent = steps[step].title;
        statusText.textContent = steps[step].text;

        if (!fromTimer && playing) {
          restartCycle();
        }
      }

      function advance() {
        const index = order.indexOf(current);
        setStep(order[(index + 1) % order.length], true);
      }

      function restartCycle() {
        clearInterval(timer);
        timer = setInterval(advance, 3300);
      }

      function setPlaying(value) {
        playing = value;
        playPause.setAttribute("aria-pressed", String(value));
        playPause.textContent = value ? "Pause cycle" : "Play cycle";
        clearInterval(timer);
        if (value) {
          restartCycle();
        }
      }

      buttons.forEach(button => {
        button.addEventListener("click", () => {
          setStep(button.dataset.step);
        });
      });

      playPause.addEventListener("click", () => {
        setPlaying(!playing);
      });

      document.querySelectorAll(".surface-atom").forEach(atom => {
        atom.setAttribute("role", "button");
        atom.setAttribute("aria-label", "Nickel surface atom");
        atom.addEventListener("click", () => explainNickel(atom.dataset.panel));
        atom.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            explainNickel(atom.dataset.panel);
          }
        });
      });

      function explainNickel(panel) {
        setStep(panel);
        statusTitle.textContent = "Ni surface atom selected";
        statusText.textContent = "This green lattice site is nickel. Adsorption to neighboring Ni atoms weakens H-H and C-C pi bonds, holds reactive fragments close together, and lowers the barrier for forming the C-H bonds in ethane.";
      }

      setStep("a", true);
      restartCycle();
    })();
  </script>
