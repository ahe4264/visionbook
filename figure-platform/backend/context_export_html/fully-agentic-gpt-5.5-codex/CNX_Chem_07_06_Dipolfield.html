<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polar HF Molecules in an Electric Field</title>
  <!-- Recreated from local reference image:
       C:\Users\ahe42\Documents\figure-benchmark\public\images\chemistry\3d\CNX_Chem_07_06_Dipolfield.jpg -->
  <style>
    :root {
      --ink: #111111;
      --muted: #4d5662;
      --line: #111111;
      --plate-a: #e9e9e9;
      --plate-b: #b8bcc1;
      --field-fill: #fbf2cf;
      --field-strong: #e4cf75;
      --panel: #f7f9fb;
      --panel-edge: #d7dde6;
      --accent: #1f6fb2;
      --accent-dark: #124978;
      --green: #71bf45;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(8px, 1.6vw, 18px);
    }

    .figure-shell {
      width: min(1320px, 100%);
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .stage {
      width: 100%;
      min-width: 0;
      overflow: auto;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 14px 34px rgba(24, 35, 54, 0.08);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 860px;
      height: auto;
    }

    .controls {
      min-width: 0;
      display: grid;
      grid-template-columns: auto auto minmax(230px, 1fr) minmax(210px, 0.62fr);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--panel-edge);
      border-radius: 8px;
      background: var(--panel);
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid #a8b3c1;
      border-radius: 7px;
      background: #ffffff;
      color: #182335;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    button:hover {
      background: #edf5fc;
      border-color: #7ea8cf;
    }

    button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(31, 111, 178, 0.28);
      outline-offset: 2px;
    }

    .mode-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #a8b3c1;
      border-radius: 7px;
      overflow: hidden;
      background: #ffffff;
    }

    .mode-toggle button {
      border: 0;
      border-radius: 0;
      min-width: 112px;
    }

    .slider-wrap {
      display: grid;
      grid-template-columns: auto minmax(130px, 1fr) 54px;
      gap: 10px;
      align-items: center;
      min-width: 0;
      color: #263241;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .readout {
      min-height: 38px;
      display: grid;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
    }

    .readout strong {
      color: var(--accent-dark);
    }

    .caption,
    .panel-letter,
    .charge,
    .plate-mark,
    .field-label {
      font-family: "Times New Roman", Times, serif;
      fill: var(--ink);
    }

    .panel-title {
      font: 700 22px/1 Arial, Helvetica, sans-serif;
      fill: #172033;
      text-anchor: middle;
    }

    .caption {
      font-size: 25px;
      fill: #1f1f1f;
      text-anchor: middle;
    }

    .panel-letter {
      font-size: 28px;
      text-anchor: middle;
    }

    .charge {
      font-size: 31px;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.88);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .plate-mark {
      font-size: 31px;
      paint-order: stroke;
      stroke: rgba(251, 242, 207, 0.65);
      stroke-width: 3px;
    }

    .field-label {
      font-size: 29px;
      text-anchor: middle;
    }

    .plate {
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .plate-front {
      fill: url(#plateGradient);
    }

    .plate-field {
      fill: url(#chargedPlateGradient);
    }

    .panel-divider {
      stroke: #e2e5ea;
      stroke-width: 2;
    }

    .bond {
      stroke: #d8d8d8;
      stroke-width: 18;
      stroke-linecap: round;
    }

    .hydrogen {
      fill: url(#hydrogenGradient);
      stroke: rgba(150, 150, 150, 0.18);
      stroke-width: 1;
    }

    .fluorine {
      fill: url(#fluorineGradient);
      stroke: rgba(42, 90, 26, 0.18);
      stroke-width: 1;
    }

    .field-arrow {
      stroke: #b89828;
      stroke-width: 2.5;
      fill: none;
      marker-end: url(#fieldArrowHead);
      opacity: 0;
      transition: opacity 120ms linear, stroke-width 120ms linear;
    }

    .field-bg {
      fill: var(--field-fill);
      opacity: 0;
      transition: opacity 120ms linear;
    }

    .target-axis {
      stroke: rgba(31, 111, 178, 0.26);
      stroke-width: 2;
      stroke-dasharray: 7 8;
      opacity: 0;
    }

    .molecule {
      filter: drop-shadow(0 8px 8px rgba(40, 56, 35, 0.18));
    }

    @media (max-width: 760px) {
      body {
        padding: 6px;
      }

      .controls {
        grid-template-columns: 1fr;
        width: calc(100vw - 12px);
        max-width: calc(100vw - 12px);
        justify-self: start;
      }

      .mode-toggle {
        grid-template-columns: 1fr;
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }

      .mode-toggle button,
      .controls > button {
        min-width: 0;
        width: 100%;
      }

      .stage {
        width: calc(100vw - 12px);
        max-width: calc(100vw - 12px);
        justify-self: start;
      }

      .readout {
        font-size: 13px;
      }

      .slider-wrap {
        grid-template-columns: 1fr auto;
        row-gap: 5px;
      }

      .slider-wrap input {
        min-width: 0;
      }

      .slider-wrap span:first-child {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive comparison of polar HF molecules with and without an electric field">
    <section class="stage">
      <svg id="figure" viewBox="0 0 1280 790" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">HF dipoles align in an electric field</title>
        <desc id="svgDesc">Two panels compare random HF molecule orientations without an electric field and aligned HF molecules between negative and positive plates. Controls change the applied field strength and animate the alignment.</desc>
        <defs>
          <linearGradient id="plateGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f3f3f3"/>
            <stop offset="0.45" stop-color="#d9dbde"/>
            <stop offset="1" stop-color="#aeb2b8"/>
          </linearGradient>
          <linearGradient id="chargedPlateGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d9d2b5"/>
            <stop offset="0.5" stop-color="#c3bda2"/>
            <stop offset="1" stop-color="#9b9686"/>
          </linearGradient>
          <radialGradient id="fluorineGradient" cx="34%" cy="27%" r="70%">
            <stop offset="0" stop-color="#eff9dc"/>
            <stop offset="0.23" stop-color="#a7dc69"/>
            <stop offset="0.62" stop-color="#70bf43"/>
            <stop offset="1" stop-color="#3f772b"/>
          </radialGradient>
          <radialGradient id="hydrogenGradient" cx="34%" cy="27%" r="70%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.48" stop-color="#ffffff"/>
            <stop offset="0.78" stop-color="#e8e8e8"/>
            <stop offset="1" stop-color="#b9b9b9"/>
          </radialGradient>
          <marker id="fieldArrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b89828"></path>
          </marker>
        </defs>

        <rect width="1280" height="790" fill="#ffffff"></rect>
        <line class="panel-divider" x1="652" y1="60" x2="652" y2="742"></line>

        <g id="panelA" aria-label="Panel a, no electric field">
          <text class="panel-title" x="330" y="43">No electric field</text>
          <polygon class="plate plate-front" points="54,66 94,104 94,711 54,751"></polygon>
          <polygon class="plate plate-front" points="574,104 614,66 614,751 574,711"></polygon>
          <g id="leftMolecules"></g>
          <text class="panel-letter" x="330" y="777">(a)</text>
        </g>

        <g id="panelB" aria-label="Panel b, applied electric field">
          <rect id="fieldBackground" class="field-bg" x="704" y="67" width="520" height="684"></rect>
          <g id="fieldLines" aria-hidden="true">
            <line class="field-arrow" x1="1160" y1="153" x2="778" y2="153"></line>
            <line class="field-arrow" x1="1160" y1="303" x2="778" y2="303"></line>
            <line class="field-arrow" x1="1160" y1="453" x2="778" y2="453"></line>
            <line class="field-arrow" x1="1160" y1="603" x2="778" y2="603"></line>
          </g>
          <polygon class="plate plate-field" points="698,66 737,104 737,711 698,751"></polygon>
          <polygon class="plate plate-field" points="1217,104 1256,66 1256,751 1217,711"></polygon>
          <text id="minusPlate" class="plate-mark" x="723" y="84" text-anchor="middle">-</text>
          <text id="plusPlate" class="plate-mark" x="1226" y="86" text-anchor="middle">+</text>
          <text id="fieldLabel" class="field-label" x="845" y="31">Electric field</text>
          <line id="fieldPointer" x1="849" y1="40" x2="877" y2="109" stroke="#050505" stroke-width="4" stroke-linecap="square"></line>
          <g id="rightMolecules"></g>
          <text class="panel-letter" x="976" y="777">(b)</text>
        </g>
      </svg>
    </section>

    <section class="controls" aria-label="Electric field controls">
      <div class="mode-toggle" role="group" aria-label="Field state">
        <button id="offBtn" type="button" aria-pressed="false">No field</button>
        <button id="onBtn" type="button" aria-pressed="true">Field on</button>
      </div>
      <button id="animateBtn" type="button">Play alignment</button>
      <label class="slider-wrap" for="strength">
        <span>Field strength</span>
        <input id="strength" type="range" min="0" max="100" step="1" value="100">
        <span id="strengthValue">100%</span>
      </label>
      <div id="readout" class="readout" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const leftLayer = document.getElementById("leftMolecules");
      const rightLayer = document.getElementById("rightMolecules");
      const strengthInput = document.getElementById("strength");
      const strengthValue = document.getElementById("strengthValue");
      const offBtn = document.getElementById("offBtn");
      const onBtn = document.getElementById("onBtn");
      const animateBtn = document.getElementById("animateBtn");
      const readout = document.getElementById("readout");
      const fieldBackground = document.getElementById("fieldBackground");
      const fieldArrows = Array.from(document.querySelectorAll(".field-arrow"));
      const fieldLabel = document.getElementById("fieldLabel");
      const fieldPointer = document.getElementById("fieldPointer");
      const minusPlate = document.getElementById("minusPlate");
      const plusPlate = document.getElementById("plusPlate");

      const sphere = {
        hydrogenRadius: 37,
        fluorineRadius: 53,
        bondDistance: 41
      };

      const panelAData = [
        { x: 184, y: 352, angle: 28, labelShift: 4 },
        { x: 449, y: 176, angle: -31, labelShift: 2 },
        { x: 393, y: 390, angle: -92, labelShift: 0 },
        { x: 177, y: 646, angle: -125, labelShift: 1 },
        { x: 448, y: 574, angle: 163, labelShift: -3 }
      ];

      const panelBData = [
        { x: 1094, y: 136, randomAngle: -144 },
        { x: 871, y: 291, randomAngle: 71 },
        { x: 860, y: 441, randomAngle: -83 },
        { x: 1098, y: 561, randomAngle: 134 },
        { x: 877, y: 675, randomAngle: -126 }
      ];

      let fieldEnabled = true;
      let userStrength = 100;
      let currentStrength = 100;
      let animationFrame = 0;

      function svgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          el.setAttribute(key, String(value));
        });
        return el;
      }

      function polarPoint(cx, cy, angleDeg, distance) {
        const angle = angleDeg * Math.PI / 180;
        return {
          x: cx + Math.cos(angle) * distance,
          y: cy + Math.sin(angle) * distance
        };
      }

      function readableChargePosition(cx, cy, angleDeg, end, extra) {
        const baseDistance = end === "plus" ? 86 : 91;
        const point = polarPoint(cx, cy, angleDeg + (end === "plus" ? 180 : 0), baseDistance + (extra || 0));
        const isPlus = end === "plus";
        const anchor = point.x < cx - 10 ? "end" : point.x > cx + 10 ? "start" : "middle";
        return {
          x: point.x,
          y: point.y + (isPlus ? -1 : 8),
          anchor
        };
      }

      function createMolecule(layer, id, data, interactive) {
        const shell = svgEl("g", { class: "molecule", "data-id": id });
        const axis = svgEl("line", {
          class: "target-axis",
          x1: -72,
          y1: 0,
          x2: 72,
          y2: 0
        });
        const body = svgEl("g", {});
        const bond = svgEl("line", {
          class: "bond",
          x1: -sphere.bondDistance,
          y1: 0,
          x2: sphere.bondDistance,
          y2: 0
        });
        const hydrogen = svgEl("circle", {
          class: "hydrogen",
          cx: -sphere.bondDistance,
          cy: 0,
          r: sphere.hydrogenRadius
        });
        const fluorine = svgEl("circle", {
          class: "fluorine",
          cx: sphere.bondDistance,
          cy: 0,
          r: sphere.fluorineRadius
        });
        const plus = svgEl("text", { class: "charge", "data-charge": "plus" });
        const minus = svgEl("text", { class: "charge", "data-charge": "minus" });

        plus.textContent = "δ+";
        minus.textContent = "δ−";
        body.append(bond, hydrogen, fluorine);
        shell.append(axis, body, plus, minus);
        layer.append(shell);

        return { shell, body, plus, minus, axis, data, interactive };
      }

      const leftMolecules = panelAData.map((item, index) => createMolecule(leftLayer, `a${index}`, item, false));
      const rightMolecules = panelBData.map((item, index) => createMolecule(rightLayer, `b${index}`, item, true));

      function alignmentFactor(strength) {
        const normalized = Math.max(0, Math.min(100, strength)) / 100;
        return 1 - Math.pow(1 - normalized, 1.65);
      }

      function angleForField(data, strength) {
        const align = alignmentFactor(strength);
        return data.randomAngle * (1 - align);
      }

      function setMolecule(molecule, angleDeg, showAxis) {
        const { x, y, labelShift } = molecule.data;
        molecule.shell.setAttribute("transform", `translate(${x} ${y})`);
        molecule.body.setAttribute("transform", `rotate(${angleDeg})`);
        molecule.axis.style.opacity = showAxis ? "1" : "0";

        const plusPosition = readableChargePosition(0, 0, angleDeg, "plus", labelShift);
        const minusPosition = readableChargePosition(0, 0, angleDeg, "minus", labelShift);

        molecule.plus.setAttribute("x", plusPosition.x.toFixed(1));
        molecule.plus.setAttribute("y", plusPosition.y.toFixed(1));
        molecule.plus.setAttribute("text-anchor", plusPosition.anchor);
        molecule.minus.setAttribute("x", minusPosition.x.toFixed(1));
        molecule.minus.setAttribute("y", minusPosition.y.toFixed(1));
        molecule.minus.setAttribute("text-anchor", minusPosition.anchor);
      }

      function updateFieldVisual(strength) {
        const active = strength > 0.5;
        const normalized = Math.max(0, Math.min(100, strength)) / 100;
        const backgroundOpacity = active ? 0.34 + normalized * 0.52 : 0;
        fieldBackground.style.opacity = backgroundOpacity.toFixed(3);
        fieldLabel.style.opacity = active ? "1" : "0.22";
        fieldPointer.style.opacity = active ? "1" : "0.18";
        minusPlate.style.opacity = active ? "1" : "0.24";
        plusPlate.style.opacity = active ? "1" : "0.24";

        fieldArrows.forEach((line, index) => {
          const threshold = 0.11 + index * 0.07;
          const arrowOpacity = Math.max(0, Math.min(0.72, (normalized - threshold) * 1.55));
          line.style.opacity = arrowOpacity.toFixed(3);
          line.style.strokeWidth = (1.5 + normalized * 2.4).toFixed(2);
        });
      }

      function render() {
        leftMolecules.forEach((molecule) => setMolecule(molecule, molecule.data.angle, false));

        const shownStrength = fieldEnabled ? currentStrength : 0;
        rightMolecules.forEach((molecule) => {
          setMolecule(molecule, angleForField(molecule.data, shownStrength), shownStrength > 76);
        });

        updateFieldVisual(shownStrength);
        strengthValue.textContent = `${Math.round(userStrength)}%`;
        offBtn.setAttribute("aria-pressed", String(!fieldEnabled));
        onBtn.setAttribute("aria-pressed", String(fieldEnabled));

        if (shownStrength < 1) {
          readout.innerHTML = "<strong>No applied field:</strong> HF molecules remain randomly oriented by thermal motion.";
        } else if (shownStrength < 45) {
          readout.innerHTML = "<strong>Weak field:</strong> only partial alignment appears; several dipoles still tilt away from the field axis.";
        } else if (shownStrength < 82) {
          readout.innerHTML = "<strong>Moderate field:</strong> the delta-plus H ends increasingly rotate toward the negative plate.";
        } else {
          readout.innerHTML = "<strong>Strong field:</strong> H δ+ faces the negative plate and F δ− faces the positive plate.";
        }
      }

      function animateTo(targetStrength, options) {
        const startStrength = currentStrength;
        const start = performance.now();
        const duration = options && options.duration ? options.duration : 850;

        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
        }

        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          currentStrength = startStrength + (targetStrength - startStrength) * eased;
          render();
          if (t < 1) {
            animationFrame = requestAnimationFrame(tick);
          } else {
            currentStrength = targetStrength;
            animationFrame = 0;
            render();
          }
        }

        animationFrame = requestAnimationFrame(tick);
      }

      offBtn.addEventListener("click", () => {
        fieldEnabled = false;
        animateTo(0, { duration: 650 });
      });

      onBtn.addEventListener("click", () => {
        fieldEnabled = true;
        if (userStrength < 1) {
          userStrength = 100;
          strengthInput.value = "100";
        }
        animateTo(userStrength, { duration: 850 });
      });

      animateBtn.addEventListener("click", () => {
        fieldEnabled = true;
        if (userStrength < 1) {
          userStrength = 100;
          strengthInput.value = "100";
        }
        currentStrength = 0;
        render();
        animateTo(userStrength, { duration: 1550 });
      });

      strengthInput.addEventListener("input", () => {
        userStrength = Number(strengthInput.value);
        fieldEnabled = userStrength > 0;
        animateTo(fieldEnabled ? userStrength : 0, { duration: 220 });
      });

      render();
    })();
  </script>
</body>
</html>
