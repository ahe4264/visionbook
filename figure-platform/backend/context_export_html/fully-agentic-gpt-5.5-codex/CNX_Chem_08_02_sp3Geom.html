<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sp3 Hybridization Geometry</title>
  <style>
    :root {
      --ink: #151515;
      --muted: #5d636b;
      --soft: #eef2f5;
      --panel: #f8fafc;
      --blue: #3c74bd;
      --red: #df6262;
      --orange: #f2a22b;
      --orange-dark: #c97113;
      --gray: #8e949b;
      --focus: #2267b2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .figure {
      width: min(1280px, 100vw);
      min-height: 100vh;
      padding: clamp(10px, 2vw, 22px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.4vw, 1.75rem);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.82rem, 1.7vw, 0.98rem);
      line-height: 1.35;
      text-align: right;
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      width: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 166px);
      min-height: 360px;
      overflow: visible;
    }

    .toolbar {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: var(--panel);
      border: 1px solid #d9e0e7;
      border-radius: 8px;
    }

    .checks,
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .checks {
      padding-right: 12px;
      border-right: 1px solid #d9e0e7;
    }

    label.check {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border: 1px solid #ccd6df;
      border-radius: 7px;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
      font-size: 0.94rem;
      line-height: 1;
      white-space: nowrap;
    }

    label.check[data-key="s"] {
      border-color: rgba(60, 116, 189, 0.42);
    }

    label.check[data-key="px"],
    label.check[data-key="py"],
    label.check[data-key="pz"] {
      border-color: rgba(223, 98, 98, 0.26);
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--focus);
      margin: 0;
    }

    button {
      min-height: 34px;
      padding: 5px 11px;
      border: 1px solid #c6d0db;
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button:hover {
      background: #eef6ff;
      border-color: #8eb7e1;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(34, 103, 178, 0.3);
      outline-offset: 2px;
    }

    .readout {
      min-width: 210px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
      text-align: right;
    }

    .section-title {
      font-size: 23px;
      font-weight: 700;
      fill: #1c1c1c;
    }

    .small-caption {
      font-size: 16px;
      fill: var(--muted);
    }

    .axis {
      stroke: #0b0b0b;
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .axis-light {
      stroke: #969ca3;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .axis-label {
      fill: #000000;
      font-family: "Times New Roman", Times, serif;
      font-size: 24px;
      font-style: italic;
    }

    .orbital-label {
      fill: #000000;
      font-family: "Times New Roman", Times, serif;
      font-size: 25px;
      font-style: italic;
    }

    .arrow-label {
      fill: #111111;
      font-size: 23px;
    }

    .angle-label {
      fill: #383838;
      font-size: 15px;
      font-weight: 700;
    }

    .equation {
      fill: #303840;
      font-size: 13px;
    }

    .source-orbital,
    .dynamic-hybrid {
      transition: opacity 180ms ease, filter 180ms ease;
    }

    .inactive {
      opacity: 0.16;
      filter: grayscale(0.6);
    }

    .term-off {
      opacity: 0.25;
    }

    .term-s {
      fill: #2767ad;
      font-weight: 700;
    }

    .term-p {
      fill: #9b4b4b;
      font-weight: 700;
    }

    .ghost-axis {
      stroke-width: 3.5;
      stroke-linecap: round;
      opacity: 0.72;
      pointer-events: none;
    }

    .ghost-sphere {
      opacity: 0.34;
      pointer-events: none;
    }

    .center-dot {
      fill: #0d0d0d;
    }

    @media (max-width: 760px) {
      .figure {
        padding: 8px;
        grid-template-rows: auto auto auto;
      }

      header,
      .toolbar {
        align-items: start;
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
      }

      .subtitle,
      .readout {
        text-align: left;
      }

      .checks {
        border-right: 0;
        padding-right: 0;
        padding-bottom: 8px;
        border-bottom: 1px solid #d9e0e7;
      }

      .toolbar {
        order: 2;
      }

      .stage {
        order: 3;
      }

      svg {
        max-height: none;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="title">
    <header>
      <div>
        <h1 id="title">sp<sup>3</sup> hybridization: from one s and three p orbitals to tetrahedral hybrids</h1>
      </div>
      <p class="subtitle">Toggle the ingredients to isolate each orbital's contribution to the four equivalent hybrids.</p>
    </header>

    <div class="stage">
      <svg id="diagram" viewBox="0 0 1280 900" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Stepwise sp3 hybridization and tetrahedral geometry</title>
        <desc id="svgDesc">The figure shows four pre-hybridization atomic orbitals, a hybridization arrow to four sp3 hybrids, and a downward arrow to the tetrahedral arrangement with 109.5 degree bond angles.</desc>

        <defs>
          <marker id="arrowHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 0 0 L 12 6 L 0 12 Z" fill="#0b0b0b"></path>
          </marker>
          <marker id="grayHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="34" markerHeight="34" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 Z" fill="#8a8d91"></path>
          </marker>
          <radialGradient id="sGrad" cx="40%" cy="33%" r="65%">
            <stop offset="0%" stop-color="#c9defa" stop-opacity="0.96"></stop>
            <stop offset="65%" stop-color="#75a3df" stop-opacity="0.88"></stop>
            <stop offset="100%" stop-color="#2f66b0" stop-opacity="0.74"></stop>
          </radialGradient>
          <radialGradient id="sGradSoft" cx="40%" cy="33%" r="65%">
            <stop offset="0%" stop-color="#d7e8fc" stop-opacity="0.9"></stop>
            <stop offset="100%" stop-color="#3c74bd" stop-opacity="0.34"></stop>
          </radialGradient>
          <radialGradient id="blueLobe" cx="35%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#e5f0ff" stop-opacity="0.98"></stop>
            <stop offset="55%" stop-color="#83addf" stop-opacity="0.9"></stop>
            <stop offset="100%" stop-color="#3467ad" stop-opacity="0.76"></stop>
          </radialGradient>
          <radialGradient id="redLobe" cx="35%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#ffe4e1" stop-opacity="0.98"></stop>
            <stop offset="58%" stop-color="#f08a83" stop-opacity="0.9"></stop>
            <stop offset="100%" stop-color="#c74343" stop-opacity="0.76"></stop>
          </radialGradient>
          <radialGradient id="orangeLobe" cx="34%" cy="34%" r="75%">
            <stop offset="0%" stop-color="#fff7cf" stop-opacity="0.98"></stop>
            <stop offset="43%" stop-color="#ffd66f" stop-opacity="0.96"></stop>
            <stop offset="100%" stop-color="#ec9220" stop-opacity="0.9"></stop>
          </radialGradient>
          <radialGradient id="orangeSmall" cx="40%" cy="38%" r="70%">
            <stop offset="0%" stop-color="#fff5c2" stop-opacity="0.92"></stop>
            <stop offset="100%" stop-color="#f0a12a" stop-opacity="0.8"></stop>
          </radialGradient>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.16"></feDropShadow>
          </filter>
          <path id="lobeLarge" d="M 0 0 C 22 -34 78 -38 103 0 C 78 38 22 34 0 0 Z"></path>
          <path id="lobeSmall" d="M 0 0 C 8 -11 25 -12 34 0 C 25 12 8 11 0 0 Z"></path>
          <path id="pHalf" d="M 0 0 C 19 -24 64 -27 88 0 C 64 27 19 24 0 0 Z"></path>
        </defs>

        <text id="atomicTitle" x="35" y="36" class="section-title">Atomic orbitals before hybridization</text>
        <text id="hybridsTitle" x="690" y="36" class="section-title">Four equivalent sp<tspan baseline-shift="super" font-size="15">3</tspan> hybrid orbitals</text>
        <text id="tetraTitle" x="700" y="660" class="section-title">Tetrahedral arrangement</text>
        <text id="tetraCaption" x="700" y="684" class="small-caption">Four corners are separated by 109.5 degrees.</text>

        <g id="atomicLayer"></g>

        <g id="hybridArrow">
          <line id="hybridArrowLine" x1="540" y1="176" x2="675" y2="176" stroke="#8a8d91" stroke-width="8" marker-end="url(#grayHead)"></line>
          <text id="hybridArrowText" x="540" y="150" class="arrow-label">Hybridization</text>
        </g>

        <g id="individualHybrids"></g>

        <g id="downArrow">
          <line id="downArrowLine" x1="958" y1="558" x2="958" y2="638" stroke="#8a8d91" stroke-width="8" marker-end="url(#grayHead)"></line>
          <text id="downArrowText1" x="986" y="588" class="arrow-label">Gives a tetrahedral</text>
          <text id="downArrowText2" x="986" y="615" class="arrow-label">arrangement</text>
        </g>

        <g id="finalHybrid"></g>
      </svg>
    </div>

    <section class="toolbar" aria-label="Orbital contribution controls">
      <div class="checks">
        <label class="check" data-key="s"><input id="toggleS" type="checkbox" checked> s</label>
        <label class="check" data-key="px"><input id="togglePx" type="checkbox" checked> p<sub>x</sub></label>
        <label class="check" data-key="py"><input id="togglePy" type="checkbox" checked> p<sub>y</sub></label>
        <label class="check" data-key="pz"><input id="togglePz" type="checkbox" checked> p<sub>z</sub></label>
      </div>
      <div class="quick" aria-label="Quick selections">
        <button type="button" data-preset="all">All</button>
        <button type="button" data-preset="s">s only</button>
        <button type="button" data-preset="px">p<sub>x</sub> only</button>
        <button type="button" data-preset="py">p<sub>y</sub> only</button>
        <button type="button" data-preset="pz">p<sub>z</sub> only</button>
      </div>
      <div class="readout" id="readout" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const svgNS = "http://www.w3.org/2000/svg";
      const root = document.getElementById("diagram");
      const atomicLayer = document.getElementById("atomicLayer");
      const individualLayer = document.getElementById("individualHybrids");
      const finalLayer = document.getElementById("finalHybrid");
      const readout = document.getElementById("readout");

      const toggles = {
        s: document.getElementById("toggleS"),
        px: document.getElementById("togglePx"),
        py: document.getElementById("togglePy"),
        pz: document.getElementById("togglePz")
      };

      const atomicBase = [
        { key: "s", label: "s", kind: "s" },
        { key: "px", label: "p", sub: "x", kind: "p", axis: [1, 0, 0] },
        { key: "py", label: "p", sub: "y", kind: "p", axis: [0, 1, 0] },
        { key: "pz", label: "p", sub: "z", kind: "p", axis: [0, 0, 1] }
      ];

      let atomicPanels = [];
      let hybridOrigins = [];
      let finalOrigin = { x: 1015, y: 780 };
      let activeLayout = "";

      const layoutConfigs = {
        desktop: {
          viewBox: "0 0 1280 900",
          atomicOrigins: [{ x: 95, y: 177 }, { x: 350, y: 177 }, { x: 95, y: 430 }, { x: 350, y: 430 }],
          hybridOrigins: [{ x: 840, y: 176 }, { x: 1095, y: 176 }, { x: 840, y: 430 }, { x: 1095, y: 430 }],
          finalOrigin: { x: 1015, y: 780 },
          text: {
            atomicTitle: { x: 35, y: 36 },
            hybridsTitle: { x: 690, y: 36 },
            tetraTitle: { x: 700, y: 660 },
            tetraCaption: { x: 700, y: 684 }
          },
          arrows: {
            hybridArrowLine: { x1: 540, y1: 176, x2: 675, y2: 176 },
            hybridArrowText: { x: 540, y: 150 },
            downArrowLine: { x1: 958, y1: 558, x2: 958, y2: 638 },
            downArrowText1: { x: 986, y: 588 },
            downArrowText2: { x: 986, y: 615 }
          }
        },
        mobile: {
          viewBox: "0 0 560 1640",
          atomicOrigins: [{ x: 135, y: 205 }, { x: 385, y: 205 }, { x: 135, y: 485 }, { x: 385, y: 485 }],
          hybridOrigins: [{ x: 140, y: 860 }, { x: 395, y: 860 }, { x: 140, y: 1115 }, { x: 395, y: 1115 }],
          finalOrigin: { x: 280, y: 1535 },
          text: {
            atomicTitle: { x: 34, y: 24 },
            hybridsTitle: { x: 58, y: 755 },
            tetraTitle: { x: 142, y: 1390 },
            tetraCaption: { x: 118, y: 1416 }
          },
          arrows: {
            hybridArrowLine: { x1: 280, y1: 620, x2: 280, y2: 700 },
            hybridArrowText: { x: 304, y: 665 },
            downArrowLine: { x1: 280, y1: 1270, x2: 280, y2: 1340 },
            downArrowText1: { x: 306, y: 1302 },
            downArrowText2: { x: 306, y: 1328 }
          }
        }
      };

      const hybrids = [
        { name: "H1", signs: { px: 1, py: 1, pz: 1 }, direction: [1, 1, 1] },
        { name: "H2", signs: { px: 1, py: -1, pz: -1 }, direction: [1, -1, -1] },
        { name: "H3", signs: { px: -1, py: 1, pz: -1 }, direction: [-1, 1, -1] },
        { name: "H4", signs: { px: -1, py: -1, pz: 1 }, direction: [-1, -1, 1] }
      ];

      function el(name, attrs) {
        const node = document.createElementNS(svgNS, name);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          if (value !== null && value !== undefined) node.setAttribute(key, String(value));
        });
        return node;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function project(vec, scale) {
        const x = vec[0];
        const y = vec[1];
        const z = vec[2];
        return {
          x: scale * (x + 0.58 * y),
          y: scale * (-z - 0.58 * y)
        };
      }

      function len2(v) {
        return Math.hypot(v.x, v.y) || 1;
      }

      function unit2(v) {
        const m = len2(v);
        return { x: v.x / m, y: v.y / m };
      }

      function vector3FromState(signs, state) {
        return [
          state.px ? signs.px : 0,
          state.py ? signs.py : 0,
          state.pz ? signs.pz : 0
        ];
      }

      function rotateFor(vec2) {
        return Math.atan2(vec2.y, vec2.x) * 180 / Math.PI;
      }

      function state() {
        return {
          s: toggles.s.checked,
          px: toggles.px.checked,
          py: toggles.py.checked,
          pz: toggles.pz.checked
        };
      }

      function setAttrs(id, attrs) {
        const node = document.getElementById(id);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
      }

      function applyLayout(force) {
        const layoutName = window.matchMedia("(max-width: 760px)").matches ? "mobile" : "desktop";
        if (!force && layoutName === activeLayout) return;
        activeLayout = layoutName;
        const cfg = layoutConfigs[layoutName];
        root.setAttribute("viewBox", cfg.viewBox);
        Object.entries(cfg.text).forEach(([id, attrs]) => setAttrs(id, attrs));
        Object.entries(cfg.arrows).forEach(([id, attrs]) => setAttrs(id, attrs));
        atomicPanels = atomicBase.map((panel, index) => Object.assign({}, panel, { origin: cfg.atomicOrigins[index] }));
        hybridOrigins = cfg.hybridOrigins;
        finalOrigin = cfg.finalOrigin;
        clear(atomicLayer);
        atomicPanels.forEach(drawAtomicOrbital);
      }

      function drawAxes(parent, origin, scale, options) {
        const opts = Object.assign({ labels: true, light: false }, options || {});
        const axes = [
          { label: "x", v: [1, 0, 0], neg: [-0.9, 0, 0] },
          { label: "y", v: [0, 1, 0], neg: [0, -0.72, 0] },
          { label: "z", v: [0, 0, 1], neg: [0, 0, -0.72] }
        ];
        axes.forEach((axis) => {
          const p1 = project(axis.neg, scale);
          const p2 = project(axis.v, scale);
          parent.appendChild(el("line", {
            x1: origin.x + p1.x,
            y1: origin.y + p1.y,
            x2: origin.x + p2.x,
            y2: origin.y + p2.y,
            class: opts.light ? "axis-light" : "axis",
            "marker-end": opts.light ? null : "url(#arrowHead)"
          }));
          if (opts.labels) {
            const lp = project([axis.v[0] * 1.12, axis.v[1] * 1.12, axis.v[2] * 1.12], scale);
            const text = el("text", {
              x: origin.x + lp.x + (axis.label === "x" ? 8 : 0),
              y: origin.y + lp.y + (axis.label === "z" ? -7 : 6),
              class: "axis-label"
            });
            text.textContent = axis.label;
            parent.appendChild(text);
          }
        });
      }

      function orbitalLabel(parent, origin, label, sub) {
        const text = el("text", {
          x: origin.x - 8,
          y: origin.y + 86,
          class: "orbital-label",
          "text-anchor": "middle"
        });
        text.textContent = label;
        if (sub) {
          const t = el("tspan", { "baseline-shift": "sub", "font-size": "16" });
          t.textContent = sub;
          text.appendChild(t);
        }
        parent.appendChild(text);
      }

      function drawPHalf(parent, origin, direction, fill, length, width, extraClass) {
        const v = unit2(project(direction, 1));
        const angle = rotateFor(v);
        const sx = length / 88;
        const sy = width / 54;
        const use = el("use", {
          href: "#pHalf",
          fill,
          stroke: "rgba(70,70,70,0.16)",
          "stroke-width": 1.2,
          class: extraClass || "",
          transform: `translate(${origin.x} ${origin.y}) rotate(${angle}) scale(${sx} ${sy})`,
          filter: "url(#softShadow)"
        });
        parent.appendChild(use);
      }

      function drawAtomicOrbital(panel) {
        const g = el("g", { class: "source-orbital", "data-orbital": panel.key });
        drawAxes(g, panel.origin, 108);
        if (panel.kind === "s") {
          g.appendChild(el("circle", {
            cx: panel.origin.x,
            cy: panel.origin.y,
            r: 30,
            fill: "url(#sGrad)",
            stroke: "rgba(45, 86, 148, 0.38)",
            "stroke-width": 1.2,
            filter: "url(#softShadow)"
          }));
        } else {
          drawPHalf(g, panel.origin, panel.axis, "url(#blueLobe)", 90, 56);
          drawPHalf(g, panel.origin, panel.axis.map((n) => -n), "url(#redLobe)", 90, 56);
        }
        orbitalLabel(g, panel.origin, panel.label, panel.sub);
        atomicLayer.appendChild(g);
      }

      function drawContributionGhosts(parent, origin, stateValue, scale) {
        if (stateValue.s) {
          parent.appendChild(el("circle", {
            cx: origin.x,
            cy: origin.y,
            r: 24,
            fill: "url(#sGradSoft)",
            class: "ghost-sphere"
          }));
        }
        const ghostAxes = [
          { key: "px", v: [1, 0, 0], color: "#3c74bd" },
          { key: "py", v: [0, 1, 0], color: "#df6262" },
          { key: "pz", v: [0, 0, 1], color: "#6f9ed9" }
        ];
        ghostAxes.forEach((axis) => {
          if (!stateValue[axis.key]) return;
          const p = project(axis.v, scale);
          const n = project(axis.v.map((value) => -value), scale * 0.62);
          parent.appendChild(el("line", {
            x1: origin.x + n.x,
            y1: origin.y + n.y,
            x2: origin.x + p.x,
            y2: origin.y + p.y,
            stroke: axis.color,
            class: "ghost-axis"
          }));
        });
      }

      function drawHybridShape(parent, origin, signs, stateValue, scale, compact) {
        const selectedP = ["px", "py", "pz"].filter((key) => stateValue[key]);
        const hasS = stateValue.s;
        const vector = vector3FromState(signs, stateValue);
        const screen = project(vector, scale);
        const mag = Math.hypot(vector[0], vector[1], vector[2]);
        parent.appendChild(el("circle", { cx: origin.x, cy: origin.y, r: compact ? 3.5 : 4.4, class: "center-dot" }));

        if (!hasS && selectedP.length === 0) {
          parent.appendChild(el("circle", {
            cx: origin.x,
            cy: origin.y,
            r: compact ? 15 : 20,
            fill: "#d9dee4",
            stroke: "#a8b0ba",
            "stroke-width": 1.2
          }));
          return;
        }

        if (mag < 0.01) {
          parent.appendChild(el("circle", {
            cx: origin.x,
            cy: origin.y,
            r: compact ? 24 : 29,
            fill: "url(#sGrad)",
            stroke: "rgba(45, 86, 148, 0.32)",
            "stroke-width": 1.1,
            filter: "url(#softShadow)"
          }));
          return;
        }

        const u = unit2(screen);
        const angle = rotateFor(u);
        parent.appendChild(el("line", {
          x1: origin.x - u.x * (compact ? 34 : 43),
          y1: origin.y - u.y * (compact ? 34 : 43),
          x2: origin.x + u.x * (compact ? 85 : 104),
          y2: origin.y + u.y * (compact ? 85 : 104),
          class: "axis-light"
        }));

        if (!hasS) {
          const l = compact ? 70 : 82;
          const w = compact ? 43 : 52;
          drawPHalf(parent, origin, vector, "url(#blueLobe)", l, w);
          drawPHalf(parent, origin, vector.map((n) => -n), "url(#redLobe)", l, w);
          return;
        }

        const strength = selectedP.length / 3;
        const largeLen = (compact ? 78 : 101) * (0.82 + 0.18 * strength);
        const largeWid = (compact ? 48 : 64) * (0.86 + 0.14 * strength);
        const smallLen = compact ? 24 : 33;
        const smallWid = compact ? 17 : 22;

        parent.appendChild(el("use", {
          href: "#lobeSmall",
          fill: "url(#orangeSmall)",
          stroke: "rgba(180, 97, 20, 0.22)",
          "stroke-width": 1,
          transform: `translate(${origin.x} ${origin.y}) rotate(${angle + 180}) scale(${smallLen / 34} ${smallWid / 24})`,
          filter: "url(#softShadow)"
        }));
        parent.appendChild(el("use", {
          href: "#lobeLarge",
          fill: "url(#orangeLobe)",
          stroke: "rgba(193, 105, 20, 0.45)",
          "stroke-width": 1.5,
          transform: `translate(${origin.x} ${origin.y}) rotate(${angle}) scale(${largeLen / 103} ${largeWid / 76})`,
          filter: "url(#softShadow)"
        }));
      }

      function drawEquation(parent, origin, hybrid, stateValue) {
        const text = el("text", {
          x: origin.x - 68,
          y: origin.y + 112,
          class: "equation"
        });
        const pieces = [
          { key: "s", value: "s", cls: "term-s" },
          { key: "px", value: `${hybrid.signs.px > 0 ? " + " : " - "}p`, sub: "x", cls: "term-p" },
          { key: "py", value: `${hybrid.signs.py > 0 ? " + " : " - "}p`, sub: "y", cls: "term-p" },
          { key: "pz", value: `${hybrid.signs.pz > 0 ? " + " : " - "}p`, sub: "z", cls: "term-p" }
        ];
        const h = el("tspan", { "font-weight": "700" });
        h.textContent = hybrid.name + " = ";
        text.appendChild(h);
        pieces.forEach((piece) => {
          const t = el("tspan", { class: `${piece.cls} ${stateValue[piece.key] ? "" : "term-off"}` });
          t.textContent = piece.value;
          text.appendChild(t);
          if (piece.sub) {
            const sub = el("tspan", {
              class: `${piece.cls} ${stateValue[piece.key] ? "" : "term-off"}`,
              "baseline-shift": "sub",
              "font-size": "9"
            });
            sub.textContent = piece.sub;
            text.appendChild(sub);
          }
        });
        parent.appendChild(text);
      }

      function drawIndividualHybrids(stateValue) {
        clear(individualLayer);
        hybridOrigins.forEach((origin, index) => {
          const g = el("g", { class: "dynamic-hybrid" });
          drawAxes(g, origin, 104);
          drawContributionGhosts(g, origin, stateValue, 58);
          drawHybridShape(g, origin, hybrids[index].signs, stateValue, 45, false);
          drawEquation(g, origin, hybrids[index], stateValue);
          individualLayer.appendChild(g);
        });
      }

      function drawTetraEdges(parent, origin) {
        const projected = hybrids.map((h) => {
          const p = project(h.direction, 58);
          return { x: origin.x + p.x, y: origin.y + p.y };
        });
        const pairs = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
        pairs.forEach((pair) => {
          const a = projected[pair[0]];
          const b = projected[pair[1]];
          parent.appendChild(el("line", {
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y,
            stroke: "#9aa2a9",
            "stroke-width": 1.5,
            "stroke-dasharray": "6 7",
            opacity: 0.54
          }));
        });
      }

      function drawAngle(parent, origin) {
        parent.appendChild(el("path", {
          d: `M ${origin.x + 17} ${origin.y - 60} Q ${origin.x + 64} ${origin.y - 42} ${origin.x + 72} ${origin.y + 5}`,
          fill: "none",
          stroke: "#555",
          "stroke-width": 1.7,
          "stroke-dasharray": "3 4"
        }));
        const t = el("text", {
          x: origin.x + 67,
          y: origin.y - 53,
          class: "angle-label"
        });
        t.textContent = "109.5";
        const degree = el("tspan", { "baseline-shift": "super", "font-size": "10" });
        degree.textContent = "o";
        t.appendChild(degree);
        parent.appendChild(t);
      }

      function drawFinalHybrid(stateValue) {
        clear(finalLayer);
        const origin = finalOrigin;
        const g = el("g", {});
        drawAxes(g, origin, 100);
        drawTetraEdges(g, origin);
        drawContributionGhosts(g, origin, stateValue, 54);

        const order = [2, 1, 3, 0];
        order.forEach((idx) => {
          drawHybridShape(g, origin, hybrids[idx].signs, stateValue, 43, true);
        });

        const allOn = stateValue.s && stateValue.px && stateValue.py && stateValue.pz;
        if (allOn) drawAngle(g, origin);
        finalLayer.appendChild(g);
      }

      function updateAtomicOpacity(stateValue) {
        atomicLayer.querySelectorAll(".source-orbital").forEach((node) => {
          const key = node.getAttribute("data-orbital");
          node.classList.toggle("inactive", !stateValue[key]);
        });
      }

      function updateReadout(stateValue) {
        const active = ["s", "px", "py", "pz"].filter((key) => stateValue[key]);
        if (active.length === 4) {
          readout.innerHTML = "Full mix: one s plus three p orbitals produces four equivalent sp<sup>3</sup> hybrids with 109.5&deg; tetrahedral separation.";
        } else if (active.length === 0) {
          readout.textContent = "No orbital contributions selected.";
        } else if (active.length === 1 && active[0] === "s") {
          readout.textContent = "s only: the contribution is spherical and equal in every hybrid, but it does not set a direction by itself.";
        } else if (active.length === 1) {
          const label = active[0].replace("p", "p");
          readout.innerHTML = label.charAt(0) + "<sub>" + label.charAt(1) + "</sub> only: the selected p orbital supplies directional phase; opposite hybrids receive opposite signs.";
        } else {
          const pretty = active.map((key) => key === "s" ? "s" : "p<sub>" + key.slice(1) + "</sub>").join(" + ");
          readout.innerHTML = "Partial mix: " + pretty + " is shown. Add the missing p orbital(s) to recover four identical tetrahedral sp<sup>3</sup> hybrids.";
        }
      }

      function render() {
        applyLayout(false);
        const stateValue = state();
        updateAtomicOpacity(stateValue);
        drawIndividualHybrids(stateValue);
        drawFinalHybrid(stateValue);
        updateReadout(stateValue);
      }

      function setPreset(preset) {
        Object.keys(toggles).forEach((key) => {
          toggles[key].checked = preset === "all" || preset === key;
        });
        render();
      }

      Object.values(toggles).forEach((checkbox) => checkbox.addEventListener("change", render));
      document.querySelectorAll("[data-preset]").forEach((button) => {
        button.addEventListener("click", () => setPreset(button.getAttribute("data-preset")));
      });
      window.addEventListener("resize", () => render());
      applyLayout(true);
      render();
    }());
  </script>
</body>
</html>
