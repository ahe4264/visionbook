<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constant Parameter Curves on a Parametric Surface</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #626a73;
      --soft: #f7f9fb;
      --panel: #ffffff;
      --line: #d8dee7;
      --axis: #24262b;
      --orange: #ee941b;
      --orange-dark: #cc7609;
      --purple: #b758ad;
      --purple-dark: #8d3d86;
      --blue: #2d7fae;
      --error: #b3261e;
      --shadow: 0 18px 48px rgba(36, 44, 56, 0.13);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef3f7;
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .figure-shell {
      width: min(1280px, 100%);
      background: var(--panel);
      border: 1px solid rgba(32, 33, 36, 0.11);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .equations,
    .sliders {
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .equations {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field,
    .slider-field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    input[type="text"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid #cbd4df;
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
      font: 650 14px/1.25 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    input[type="text"]:focus,
    input[type="range"]:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(45, 127, 174, 0.18);
    }

    .range-row {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) 54px;
      align-items: center;
      gap: 10px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .swatch.orange {
      background: var(--orange);
    }

    .swatch.purple {
      background: var(--purple);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    output {
      color: var(--ink);
      font: 700 13px/1 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      text-align: right;
    }

    .status {
      grid-column: 1 / -1;
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .status.error {
      color: var(--error);
      font-weight: 700;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(260px, 0.95fr) 116px minmax(360px, 1.35fr);
      gap: 4px;
      align-items: stretch;
      padding: 16px;
      background:
        linear-gradient(180deg, #ffffff 0%, #f8fbfd 100%);
    }

    .panel {
      position: relative;
      min-width: 0;
      min-height: 420px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
    }

    .panel-title {
      position: absolute;
      left: 14px;
      top: 12px;
      z-index: 2;
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
      text-transform: uppercase;
    }

    .uv-panel svg,
    .map-arrow svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .surface-panel {
      display: grid;
      grid-template-rows: 1fr;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-arrow {
      min-height: 420px;
      display: grid;
      place-items: center;
      color: #aeb5be;
    }

    .formula-caption {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      color: #4a535d;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }

    .formula-caption span {
      padding: 5px 8px;
      border: 1px solid rgba(98, 106, 115, 0.18);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(5px);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    @media (max-width: 980px) {
      body {
        display: block;
        padding: 10px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .map-arrow {
        min-height: 80px;
      }

      .map-arrow svg {
        transform: rotate(90deg);
        max-width: 130px;
      }

      .panel {
        min-height: 360px;
      }
    }

    @media (max-width: 640px) {
      .equations {
        grid-template-columns: 1fr;
      }

      .controls {
        padding: 12px;
      }

      .stage {
        padding: 10px;
      }

      .panel {
        min-height: 330px;
      }

      .range-row {
        grid-template-columns: auto minmax(90px, 1fr) 50px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive figure showing constant parameter curves on a parametric surface">
    <section class="controls" aria-label="Parametric surface controls">
      <div class="equations">
        <div class="field">
          <label for="xExpr">x(u,v)</label>
          <input id="xExpr" type="text" value="u*cos(v)" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
          <label for="yExpr">y(u,v)</label>
          <input id="yExpr" type="text" value="u*sin(v)" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
          <label for="zExpr">z(u,v)</label>
          <input id="zExpr" type="text" value="u" spellcheck="false" autocomplete="off">
        </div>
        <div id="status" class="status">Edit the component equations to redraw the surface and its parameter curves.</div>
      </div>

      <div class="sliders">
        <div class="slider-field">
          <label for="uSlider">constant u value</label>
          <div class="range-row">
            <span class="swatch orange" aria-hidden="true"></span>
            <input id="uSlider" type="range" min="0.45" max="1.65" step="0.01" value="1.05">
            <output id="uOut" for="uSlider">1.05</output>
          </div>
        </div>
        <div class="slider-field">
          <label for="vSlider">constant v value</label>
          <div class="range-row">
            <span class="swatch purple" aria-hidden="true"></span>
            <input id="vSlider" type="range" min="-2.30" max="2.30" step="0.01" value="0.18">
            <output id="vOut" for="vSlider">0.18</output>
          </div>
        </div>
      </div>
    </section>

    <section class="stage" aria-label="Parameter domain maps to curves on the surface">
      <div class="panel uv-panel">
        <div class="panel-title">uv-parameter domain</div>
        <svg id="uvSvg" viewBox="0 0 460 380" role="img" aria-label="uv plane with a vertical constant u line and a horizontal constant v line">
          <defs>
            <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#24262b"></path>
            </marker>
          </defs>
          <rect x="0" y="0" width="460" height="380" fill="#ffffff"></rect>
          <g opacity="0.65" stroke="#dfe5ec" stroke-width="1">
            <path d="M 92 48 V 318"></path>
            <path d="M 172 48 V 318"></path>
            <path d="M 252 48 V 318"></path>
            <path d="M 332 48 V 318"></path>
            <path d="M 56 88 H 404"></path>
            <path d="M 56 148 H 404"></path>
            <path d="M 56 208 H 404"></path>
            <path d="M 56 268 H 404"></path>
          </g>
          <line x1="42" y1="314" x2="418" y2="314" stroke="#24262b" stroke-width="2.6" marker-end="url(#axisArrow)"></line>
          <line x1="82" y1="340" x2="82" y2="28" stroke="#24262b" stroke-width="2.6" marker-end="url(#axisArrow)"></line>
          <text x="419" y="298" fill="#242124" font-size="30" font-family="Georgia, serif" font-style="italic">u</text>
          <text x="97" y="32" fill="#242124" font-size="30" font-family="Georgia, serif" font-style="italic">v</text>
          <line id="uvVLine" x1="248" y1="56" x2="248" y2="330" stroke="#ee941b" stroke-width="5.5"></line>
          <line id="uvHLine" x1="48" y1="190" x2="412" y2="190" stroke="#b758ad" stroke-width="5.5"></line>
          <text id="uLabel" x="264" y="80" fill="#242124" font-size="24" font-weight="500">
            <tspan font-family="Georgia, serif" font-style="italic">u</tspan><tspan font-family="Inter, Segoe UI, sans-serif"> constant</tspan>
          </text>
          <text id="vLabel" x="284" y="176" fill="#242124" font-size="24" font-weight="500">
            <tspan font-family="Georgia, serif" font-style="italic">v</tspan><tspan font-family="Inter, Segoe UI, sans-serif"> constant</tspan>
          </text>
        </svg>
      </div>

      <div class="map-arrow" aria-hidden="true">
        <svg viewBox="0 0 140 160">
          <defs>
            <marker id="mapArrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5dca6" stroke="#aeb5be" stroke-width="1"></path>
            </marker>
          </defs>
          <path d="M 10 110 C 38 42, 88 32, 123 48" fill="none" stroke="#aeb5be" stroke-width="5" stroke-linecap="round"></path>
          <path d="M 12 110 C 42 50, 88 45, 118 58" fill="none" stroke="#f9e7bd" stroke-width="18" stroke-linecap="round" marker-end="url(#mapArrowHead)"></path>
          <path d="M 12 110 C 42 50, 88 45, 118 58" fill="none" stroke="#aeb5be" stroke-width="3" stroke-linecap="round"></path>
        </svg>
      </div>

      <div class="panel surface-panel">
        <div class="panel-title">xyz-space surface</div>
        <canvas id="surfaceCanvas" aria-label="3D parametric surface with highlighted constant parameter curves"></canvas>
        <div class="formula-caption" aria-hidden="true">
          <span>r(u,v) = (x(u,v), y(u,v), z(u,v))</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const uMin = 0.45;
      const uMax = 1.65;
      const vMin = -2.30;
      const vMax = 2.30;
      const orange = "#ee941b";
      const orangeDark = "#cc7609";
      const purple = "#b758ad";
      const purpleDark = "#8d3d86";

      const els = {
        xExpr: document.getElementById("xExpr"),
        yExpr: document.getElementById("yExpr"),
        zExpr: document.getElementById("zExpr"),
        uSlider: document.getElementById("uSlider"),
        vSlider: document.getElementById("vSlider"),
        uOut: document.getElementById("uOut"),
        vOut: document.getElementById("vOut"),
        status: document.getElementById("status"),
        uvVLine: document.getElementById("uvVLine"),
        uvHLine: document.getElementById("uvHLine"),
        uLabel: document.getElementById("uLabel"),
        vLabel: document.getElementById("vLabel"),
        canvas: document.getElementById("surfaceCanvas")
      };

      const ctx = els.canvas.getContext("2d");
      let compiled = null;
      let animationFrame = 0;

      function clamp(value, lo, hi) {
        return Math.max(lo, Math.min(hi, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function compileExpression(expr) {
        const source = expr.trim().replace(/\^/g, "**");
        if (!source) {
          throw new Error("Each component needs an expression.");
        }
        return new Function(
          "u",
          "v",
          "const pi=Math.PI, PI=Math.PI, e=Math.E, E=Math.E;" +
          "with (Math) { return Number(" + source + "); }"
        );
      }

      function compileAll() {
        const fx = compileExpression(els.xExpr.value);
        const fy = compileExpression(els.yExpr.value);
        const fz = compileExpression(els.zExpr.value);
        const test = [
          evaluateWith(fx, fy, fz, 1.0, 0.0),
          evaluateWith(fx, fy, fz, 1.35, 1.0)
        ];
        if (!test.every(isFinitePoint)) {
          throw new Error("The equations must produce finite x, y, and z values.");
        }
        compiled = { fx, fy, fz };
        els.status.classList.remove("error");
        els.status.textContent = "Edit the equations or sweep u and v to see how parameter lines become surface curves.";
      }

      function evaluateWith(fx, fy, fz, u, v) {
        return {
          x: fx(u, v),
          y: fy(u, v),
          z: fz(u, v),
          u: u,
          v: v
        };
      }

      function evaluate(u, v) {
        return evaluateWith(compiled.fx, compiled.fy, compiled.fz, u, v);
      }

      function isFinitePoint(p) {
        return Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z);
      }

      function updateUvPanel() {
        const u = Number(els.uSlider.value);
        const v = Number(els.vSlider.value);
        const uT = (u - uMin) / (uMax - uMin);
        const vT = (v - vMin) / (vMax - vMin);
        const x = lerp(116, 354, uT);
        const y = lerp(286, 82, vT);
        els.uvVLine.setAttribute("x1", x);
        els.uvVLine.setAttribute("x2", x);
        els.uvHLine.setAttribute("y1", y);
        els.uvHLine.setAttribute("y2", y);
        els.uLabel.setAttribute("x", clamp(x + 16, 132, 312));
        els.uLabel.setAttribute("y", 80);
        els.vLabel.setAttribute("x", clamp(x + 46, 185, 302));
        els.vLabel.setAttribute("y", clamp(y - 18, 94, 270));
        els.uOut.textContent = u.toFixed(2);
        els.vOut.textContent = v.toFixed(2);
      }

      function resizeCanvas() {
        const rect = els.canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(320, Math.round(rect.width * dpr));
        const height = Math.max(300, Math.round(rect.height * dpr));
        if (els.canvas.width !== width || els.canvas.height !== height) {
          els.canvas.width = width;
          els.canvas.height = height;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function buildSurface() {
        const uSteps = 34;
        const vSteps = 42;
        const grid = [];
        const bounds = {
          minX: Infinity,
          maxX: -Infinity,
          minY: Infinity,
          maxY: -Infinity,
          minZ: Infinity,
          maxZ: -Infinity
        };

        for (let i = 0; i <= uSteps; i += 1) {
          const u = lerp(uMin, uMax, i / uSteps);
          const row = [];
          for (let j = 0; j <= vSteps; j += 1) {
            const v = lerp(vMin, vMax, j / vSteps);
            const point = evaluate(u, v);
            if (!isFinitePoint(point)) {
              throw new Error("The equations produced a non-finite value on the sampled domain.");
            }
            bounds.minX = Math.min(bounds.minX, point.x);
            bounds.maxX = Math.max(bounds.maxX, point.x);
            bounds.minY = Math.min(bounds.minY, point.y);
            bounds.maxY = Math.max(bounds.maxY, point.y);
            bounds.minZ = Math.min(bounds.minZ, point.z);
            bounds.maxZ = Math.max(bounds.maxZ, point.z);
            row.push(point);
          }
          grid.push(row);
        }

        const rangeX = bounds.maxX - bounds.minX;
        const rangeY = bounds.maxY - bounds.minY;
        const rangeZ = bounds.maxZ - bounds.minZ;
        const span = Math.max(rangeX, rangeY, rangeZ, 0.001);
        const center = {
          x: (bounds.minX + bounds.maxX) / 2,
          y: (bounds.minY + bounds.maxY) / 2,
          z: (bounds.minZ + bounds.maxZ) / 2
        };
        return { grid, bounds, center, span, uSteps, vSteps };
      }

      function projectFactory(model, width, height) {
        const projected = [];
        const marginX = Math.max(52, width * 0.09);
        const marginY = Math.max(62, height * 0.15);
        let minPx = Infinity;
        let maxPx = -Infinity;
        let minPy = Infinity;
        let maxPy = -Infinity;

        function rawProject(p) {
          const x = (p.x - model.center.x) / model.span;
          const y = (p.y - model.center.y) / model.span;
          const z = (p.z - model.center.z) / model.span;
          return {
            px: y - 0.56 * x,
            py: -z + 0.46 * x - 0.10 * y,
            depth: 0.64 * x + 0.28 * y + 0.36 * z,
            source: p
          };
        }

        for (const row of model.grid) {
          for (const point of row) {
            const pr = rawProject(point);
            projected.push(pr);
            minPx = Math.min(minPx, pr.px);
            maxPx = Math.max(maxPx, pr.px);
            minPy = Math.min(minPy, pr.py);
            maxPy = Math.max(maxPy, pr.py);
          }
        }

        const scale = Math.min(
          (width - 2 * marginX) / Math.max(0.001, maxPx - minPx),
          (height - 2 * marginY) / Math.max(0.001, maxPy - minPy)
        );
        const offsetX = (width - (minPx + maxPx) * scale) / 2;
        const offsetY = (height - (minPy + maxPy) * scale) / 2 - height * 0.015;

        function project(p) {
          const pr = rawProject(p);
          return {
            x: pr.px * scale + offsetX,
            y: pr.py * scale + offsetY,
            depth: pr.depth,
            source: p
          };
        }

        return { project, scale };
      }

      function drawCurve(points, projector, style) {
        if (!points.length) {
          return;
        }
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = style.stroke;
        ctx.lineWidth = style.width;
        if (style.shadow) {
          ctx.shadowColor = style.shadow;
          ctx.shadowBlur = 7;
        }
        ctx.beginPath();
        points.forEach((p, index) => {
          const q = projector.project(p);
          if (index === 0) {
            ctx.moveTo(q.x, q.y);
          } else {
            ctx.lineTo(q.x, q.y);
          }
        });
        ctx.stroke();
        ctx.restore();
      }

      function sampleConstantU(u, count) {
        const points = [];
        for (let j = 0; j <= count; j += 1) {
          points.push(evaluate(u, lerp(vMin, vMax, j / count)));
        }
        return points;
      }

      function sampleConstantV(v, count) {
        const points = [];
        for (let i = 0; i <= count; i += 1) {
          points.push(evaluate(lerp(uMin, uMax, i / count), v));
        }
        return points;
      }

      function drawLabel(textParts, x, y, align, accentColor) {
        ctx.save();
        ctx.font = "600 21px Inter, Segoe UI, sans-serif";
        const plain = textParts.map((part) => part.text).join("");
        const padX = 9;
        const textWidth = ctx.measureText(plain).width;
        const boxWidth = textWidth + padX * 2;
        const boxHeight = 34;
        const bx = align === "right" ? x - boxWidth : x;
        const by = y - 25;
        ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
        ctx.strokeStyle = "rgba(98, 106, 115, 0.15)";
        roundRect(ctx, bx, by, boxWidth, boxHeight, 7);
        ctx.fill();
        ctx.stroke();
        let tx = bx + padX;
        for (const part of textParts) {
          ctx.font = part.italic ? "italic 23px Georgia, serif" : "600 21px Inter, Segoe UI, sans-serif";
          ctx.fillStyle = part.accent ? accentColor : "#202124";
          ctx.fillText(part.text, tx, y);
          tx += ctx.measureText(part.text).width;
        }
        ctx.restore();
      }

      function roundRect(context, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + w, y, x + w, y + h, radius);
        context.arcTo(x + w, y + h, x, y + h, radius);
        context.arcTo(x, y + h, x, y, radius);
        context.arcTo(x, y, x + w, y, radius);
        context.closePath();
      }

      function drawAxes(projector, model, width, height) {
        const base = {
          x: model.bounds.minX - 0.08 * model.span,
          y: model.bounds.minY - 0.06 * model.span,
          z: model.bounds.minZ - 0.12 * model.span
        };
        const length = 0.58 * model.span;
        const axes = [
          { label: "x", end: { x: base.x + length, y: base.y, z: base.z } },
          { label: "y", end: { x: base.x, y: base.y + length, z: base.z } },
          { label: "z", end: { x: base.x, y: base.y, z: base.z + length } }
        ];
        const b = projector.project(base);
        ctx.save();
        ctx.strokeStyle = "#24262b";
        ctx.fillStyle = "#24262b";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.font = "italic 28px Georgia, serif";
        axes.forEach((axis) => {
          const e = projector.project(axis.end);
          drawArrow(b.x, b.y, e.x, e.y);
          const lx = clamp(e.x + (e.x - b.x) * 0.10, 16, width - 26);
          const ly = clamp(e.y + (e.y - b.y) * 0.10, 28, height - 18);
          ctx.fillText(axis.label, lx, ly);
        });
        ctx.restore();
      }

      function drawArrow(x1, y1, x2, y2) {
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const size = 9;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - size * Math.cos(angle - Math.PI / 6), y2 - size * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(x2 - size * Math.cos(angle + Math.PI / 6), y2 - size * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }

      function render() {
        resizeCanvas();
        const width = els.canvas.clientWidth;
        const height = els.canvas.clientHeight;
        ctx.clearRect(0, 0, width, height);

        if (!compiled) {
          return;
        }

        let model;
        try {
          model = buildSurface();
        } catch (error) {
          els.status.classList.add("error");
          els.status.textContent = error.message;
          return;
        }

        const projector = projectFactory(model, width, height);
        const cells = [];
        for (let i = 0; i < model.uSteps; i += 1) {
          for (let j = 0; j < model.vSteps; j += 1) {
            const p00 = projector.project(model.grid[i][j]);
            const p10 = projector.project(model.grid[i + 1][j]);
            const p11 = projector.project(model.grid[i + 1][j + 1]);
            const p01 = projector.project(model.grid[i][j + 1]);
            cells.push({
              points: [p00, p10, p11, p01],
              depth: (p00.depth + p10.depth + p11.depth + p01.depth) / 4,
              shade: 0.50 + 0.24 * ((i / model.uSteps) * 0.55 + (j / model.vSteps) * 0.45)
            });
          }
        }

        cells.sort((a, b) => a.depth - b.depth);
        ctx.save();
        cells.forEach((cell) => {
          ctx.beginPath();
          ctx.moveTo(cell.points[0].x, cell.points[0].y);
          for (let k = 1; k < cell.points.length; k += 1) {
            ctx.lineTo(cell.points[k].x, cell.points[k].y);
          }
          ctx.closePath();
          const tone = Math.round(238 - cell.shade * 28);
          ctx.fillStyle = "rgba(" + tone + ", " + (tone + 3) + ", " + (tone + 7) + ", 0.86)";
          ctx.strokeStyle = "rgba(136, 143, 151, 0.17)";
          ctx.lineWidth = 0.6;
          ctx.fill();
          ctx.stroke();
        });
        ctx.restore();

        for (let i = 0; i <= 5; i += 1) {
          drawCurve(sampleConstantU(lerp(uMin, uMax, i / 5), 76), projector, {
            stroke: "rgba(99, 107, 116, 0.62)",
            width: 2.0
          });
        }
        for (let j = 0; j <= 5; j += 1) {
          drawCurve(sampleConstantV(lerp(vMin, vMax, j / 5), 76), projector, {
            stroke: "rgba(99, 107, 116, 0.62)",
            width: 2.0
          });
        }

        const uValue = Number(els.uSlider.value);
        const vValue = Number(els.vSlider.value);
        const uCurve = sampleConstantU(uValue, 110);
        const vCurve = sampleConstantV(vValue, 110);
        drawCurve(vCurve, projector, {
          stroke: purpleDark,
          width: 7.5,
          shadow: "rgba(183, 88, 173, 0.22)"
        });
        drawCurve(vCurve, projector, { stroke: purple, width: 5.2 });
        drawCurve(uCurve, projector, {
          stroke: orangeDark,
          width: 7.5,
          shadow: "rgba(238, 148, 27, 0.24)"
        });
        drawCurve(uCurve, projector, { stroke: orange, width: 5.2 });

        drawAxes(projector, model, width, height);

        const uLabelAnchor = projector.project(uCurve[Math.floor(uCurve.length * 0.78)]);
        const vLabelAnchor = projector.project(vCurve[Math.floor(vCurve.length * 0.86)]);
        drawLabel(
          [
            { text: "Constant " },
            { text: "u", italic: true, accent: true },
            { text: "-curve" }
          ],
          clamp(uLabelAnchor.x - 118, 18, width - 238),
          clamp(uLabelAnchor.y - 28, 42, height - 78),
          "left",
          orangeDark
        );
        drawLabel(
          [
            { text: "Constant " },
            { text: "v", italic: true, accent: true },
            { text: "-curve" }
          ],
          clamp(vLabelAnchor.x + 18, 18, width - 236),
          clamp(vLabelAnchor.y + 12, 48, height - 64),
          "left",
          purpleDark
        );
      }

      function scheduleRender() {
        updateUvPanel();
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(render);
      }

      function recompileAndRender() {
        try {
          compileAll();
        } catch (error) {
          compiled = null;
          els.status.classList.add("error");
          els.status.textContent = error.message;
        }
        scheduleRender();
      }

      [els.xExpr, els.yExpr, els.zExpr].forEach((input) => {
        input.addEventListener("input", recompileAndRender);
      });
      [els.uSlider, els.vSlider].forEach((input) => {
        input.addEventListener("input", scheduleRender);
      });
      window.addEventListener("resize", scheduleRender);

      recompileAndRender();
    }());
  </script>
</body>
</html>
