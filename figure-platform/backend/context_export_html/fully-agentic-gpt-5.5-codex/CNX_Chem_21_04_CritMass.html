<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub-critical and Critical Mass</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #4b5563;
      --line: #cbd5e1;
      --paper: #ffffff;
      --panel: #f7fafc;
      --blue-mass: #8994cc;
      --blue-mass-deep: #707bb7;
      --accent: #d97706;
      --continue: #2563eb;
      --escape: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .figure-app {
      width: min(1180px, 100%);
      min-width: 0;
      display: grid;
      gap: 10px;
      align-content: start;
      overflow-x: hidden;
    }

    .stage {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      min-width: 0;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 330px;
      touch-action: manipulation;
    }

    .controls {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .controls > * {
      min-width: 0;
    }

    .toggle-group,
    .cascade-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      min-height: 36px;
      border: 1px solid #b6c2d2;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: 700 13px/1 Arial, Helvetica, sans-serif;
      padding: 8px 11px;
      cursor: pointer;
    }

    button:hover {
      background: #eef4ff;
      border-color: #7da5d8;
    }

    button.active {
      background: #1f4b99;
      border-color: #1f4b99;
      color: #fff;
    }

    .slider-wrap {
      display: grid;
      grid-template-columns: auto minmax(145px, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-width: 0;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      min-width: 0;
      accent-color: #1f4b99;
    }

    .meter {
      min-width: 235px;
      display: grid;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .meter-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .meter strong {
      color: var(--ink);
    }

    .panel-title {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .panel-letter {
      font-size: 28px;
      font-weight: 500;
    }

    .callout-title {
      font-size: 16px;
      font-weight: 800;
    }

    .callout-text {
      font-size: 14px;
      font-weight: 700;
      fill: #334155;
    }

    .small-note {
      font-size: 13px;
      fill: #475569;
      font-weight: 700;
    }

    .tiny-note {
      font-size: 12px;
      fill: #475569;
      font-weight: 700;
    }

    .mass-circle {
      fill: var(--blue-mass);
      opacity: 0.94;
      transition: r 240ms ease, opacity 180ms ease, stroke-width 180ms ease;
    }

    .panel-shell {
      transition: opacity 180ms ease;
    }

    .panel-shell.dimmed {
      opacity: 0.46;
    }

    .active-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-dasharray: 11 8;
      opacity: 0;
      transition: opacity 160ms ease, r 240ms ease, cx 240ms ease, cy 240ms ease;
      pointer-events: none;
    }

    .active-ring.on {
      opacity: 1;
    }

    .threshold-ring {
      fill: none;
      stroke: #475569;
      stroke-width: 2;
      stroke-dasharray: 7 7;
      opacity: 0.42;
      pointer-events: none;
    }

    .arrow {
      stroke: #050505;
      stroke-width: 4.6;
      stroke-linecap: square;
      fill: none;
    }

    .escape-arrow {
      stroke: #050505;
    }

    .continue-arrow {
      stroke: #050505;
    }

    .cascade-arrow {
      stroke: #164e9b;
      stroke-width: 4.2;
      stroke-linecap: round;
      fill: none;
      marker-end: url(#cascadeHead);
      opacity: 0;
      animation: drawArrow 520ms ease forwards;
    }

    .fission-star {
      fill: url(#starGradient);
      stroke: #ffeaa2;
      stroke-width: 0.6;
      filter: drop-shadow(0 0 4px rgba(255, 196, 52, 0.7));
    }

    .neutron {
      fill: url(#neutronGradient);
      stroke: #c5c0a8;
      stroke-width: 1;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.25));
    }

    .legend-box {
      fill: rgba(255, 255, 255, 0.86);
      stroke: #d9e1ec;
      stroke-width: 1.2;
    }

    .fraction-bar-bg {
      fill: #e5e7eb;
    }

    .fraction-escape {
      fill: rgba(220, 38, 38, 0.83);
    }

    .fraction-continue {
      fill: rgba(37, 99, 235, 0.86);
    }

    .mass-preview {
      fill: rgba(137, 148, 204, 0.26);
      stroke: #1f4b99;
      stroke-width: 3;
      stroke-dasharray: 8 7;
      pointer-events: none;
    }

    .cascade-star {
      fill: url(#starGradient);
      stroke: #fff1a8;
      stroke-width: 0.8;
      filter: drop-shadow(0 0 8px rgba(255, 200, 54, 0.95));
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: popStar 620ms ease forwards;
    }

    .moving-neutron {
      fill: url(#neutronGradient);
      stroke: #bfb89d;
      stroke-width: 1;
      opacity: 0;
      animation: flyNeutron 900ms ease-out forwards;
      offset-path: path("M 610 125 L 695 202");
    }

    @keyframes popStar {
      0% {
        transform: scale(0.35);
        opacity: 0;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0.96;
      }
    }

    @keyframes drawArrow {
      0% {
        opacity: 0;
        stroke-dasharray: 0 140;
      }
      100% {
        opacity: 0.95;
        stroke-dasharray: 140 0;
      }
    }

    @keyframes flyNeutron {
      0% {
        offset-distance: 0%;
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      100% {
        offset-distance: 100%;
        opacity: 1;
      }
    }

    @media (max-width: 780px) {
      body {
        padding: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
        max-width: 100%;
      }

      .stage {
        overflow-x: auto;
      }

      svg {
        width: 760px;
        max-width: none;
      }

      .slider-wrap {
        grid-template-columns: 1fr;
      }

      label {
        white-space: normal;
      }

      .meter {
        min-width: 0;
      }

      .meter-row {
        justify-content: flex-start;
      }

      .meter-row strong {
        margin-left: 8px;
      }

      .panel-title {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-app" aria-label="Interactive figure comparing sub-critical and critical mass">
    <section class="stage">
      <svg id="criticalMassSvg" viewBox="0 0 1100 700" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Sub-critical mass and critical mass in nuclear fission</title>
        <desc id="svgDesc">Side-by-side circular diagrams show that small sub-critical mass loses many neutrons while larger critical mass sustains a fission chain reaction.</desc>
        <defs>
          <marker id="arrowHead" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#050505"></path>
          </marker>
          <marker id="cascadeHead" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#164e9b"></path>
          </marker>
          <radialGradient id="starGradient" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#ffffff"></stop>
            <stop offset="26%" stop-color="#fff6b0"></stop>
            <stop offset="58%" stop-color="#ffd43b"></stop>
            <stop offset="100%" stop-color="#ffb020" stop-opacity="0.05"></stop>
          </radialGradient>
          <radialGradient id="neutronGradient" cx="35%" cy="30%" r="62%">
            <stop offset="0%" stop-color="#f8f7e8"></stop>
            <stop offset="52%" stop-color="#d6d4bd"></stop>
            <stop offset="100%" stop-color="#a8a98e"></stop>
          </radialGradient>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.16"></feDropShadow>
          </filter>
        </defs>

        <rect x="0" y="0" width="1100" height="700" fill="#fff"></rect>
        <text x="250" y="47" class="panel-title" text-anchor="middle">Sub-critical mass</text>
        <text x="805" y="47" class="panel-title" text-anchor="middle">Critical mass</text>

        <g id="subPanel" class="panel-shell">
          <circle id="subMass" class="mass-circle" cx="245" cy="324" r="160"></circle>
          <circle class="threshold-ring" cx="245" cy="324" r="160"></circle>
          <g id="subArrows"></g>
          <g id="subStars"></g>
          <circle class="neutron" cx="100" cy="170" r="13"></circle>
          <line class="arrow" x1="115" y1="188" x2="167" y2="241" marker-end="url(#arrowHead)"></line>
          <text x="245" y="620" class="panel-letter" text-anchor="middle">(a)</text>
        </g>

        <g id="critPanel" class="panel-shell">
          <circle id="critMass" class="mass-circle" cx="805" cy="324" r="240"></circle>
          <circle class="threshold-ring" cx="805" cy="324" r="240"></circle>
          <g id="critArrows"></g>
          <g id="critStars"></g>
          <g id="cascadeOverlay"></g>
          <circle class="neutron" cx="605" cy="115" r="13"></circle>
          <line class="arrow" x1="618" y1="132" x2="692" y2="204" marker-end="url(#arrowHead)"></line>
          <text x="805" y="620" class="panel-letter" text-anchor="middle">(b)</text>
        </g>

        <circle id="activeRing" class="active-ring" cx="245" cy="324" r="170"></circle>
        <circle id="massPreview" class="mass-preview" cx="245" cy="324" r="160"></circle>

        <g id="leftCallout" filter="url(#softShadow)">
          <rect class="legend-box" x="42" y="520" width="265" height="68" rx="8"></rect>
          <text x="58" y="543" class="callout-title">Panel (a): many neutrons escape</text>
          <rect x="58" y="556" width="215" height="14" class="fraction-bar-bg" rx="7"></rect>
          <rect id="subEscapeBar" x="58" y="556" height="14" class="fraction-escape" rx="7"></rect>
          <rect id="subContinueBar" y="556" height="14" class="fraction-continue" rx="7"></rect>
          <text id="subFractionText" x="58" y="584" class="callout-text">68% escape, 32% cause fission</text>
        </g>

        <g id="rightCallout" filter="url(#softShadow)">
          <rect class="legend-box" x="715" y="520" width="338" height="68" rx="8"></rect>
          <text x="731" y="543" class="callout-title">Panel (b): chain reaction sustained</text>
          <rect x="731" y="556" width="268" height="14" class="fraction-bar-bg" rx="7"></rect>
          <rect id="critEscapeBar" x="731" y="556" height="14" class="fraction-escape" rx="7"></rect>
          <rect id="critContinueBar" y="556" height="14" class="fraction-continue" rx="7"></rect>
          <text id="critFractionText" x="731" y="584" class="callout-text">34% escape, 66% cause fission</text>
        </g>

        <g id="sliderAnnotation">
          <line x1="505" y1="610" x2="595" y2="610" stroke="#cbd5e1" stroke-width="3"></line>
          <circle cx="505" cy="610" r="13" fill="#8994cc" opacity="0.65"></circle>
          <circle cx="595" cy="610" r="22" fill="#8994cc" opacity="0.65"></circle>
          <text x="550" y="648" class="small-note" text-anchor="middle">larger radius means less surface escape</text>
        </g>

        <g id="cascadeStatus" aria-hidden="true">
          <rect class="legend-box" x="484" y="72" width="150" height="55" rx="8"></rect>
          <text x="559" y="94" class="tiny-note" text-anchor="middle">cascade events</text>
          <text id="cascadeCount" x="559" y="117" class="callout-title" text-anchor="middle">0 fissions</text>
        </g>
      </svg>
    </section>

    <section class="controls" aria-label="Interactive controls">
      <div class="toggle-group" aria-label="Panel selector">
        <button type="button" id="subBtn" class="active">Panel (a)</button>
        <button type="button" id="critBtn">Panel (b)</button>
      </div>
      <div class="cascade-group">
        <button type="button" id="playCascade">Play cascade</button>
        <button type="button" id="resetCascade">Reset</button>
      </div>
      <div class="slider-wrap">
        <label for="massSlider">Fissile material mass</label>
        <input id="massSlider" type="range" min="45" max="105" step="1" value="50" />
        <output id="massValue" for="massSlider">50%</output>
      </div>
      <div class="meter" aria-live="polite">
        <div class="meter-row"><span>Neutron escape</span><strong id="escapeValue">68%</strong></div>
        <div class="meter-row"><span>Further fission</span><strong id="continueValue">32%</strong></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const svgNS = "http://www.w3.org/2000/svg";
      const subBtn = document.getElementById("subBtn");
      const critBtn = document.getElementById("critBtn");
      const playCascade = document.getElementById("playCascade");
      const resetCascade = document.getElementById("resetCascade");
      const massSlider = document.getElementById("massSlider");
      const massValue = document.getElementById("massValue");
      const escapeValue = document.getElementById("escapeValue");
      const continueValue = document.getElementById("continueValue");
      const subPanel = document.getElementById("subPanel");
      const critPanel = document.getElementById("critPanel");
      const subMass = document.getElementById("subMass");
      const critMass = document.getElementById("critMass");
      const activeRing = document.getElementById("activeRing");
      const massPreview = document.getElementById("massPreview");
      const subFractionText = document.getElementById("subFractionText");
      const critFractionText = document.getElementById("critFractionText");
      const subEscapeBar = document.getElementById("subEscapeBar");
      const subContinueBar = document.getElementById("subContinueBar");
      const critEscapeBar = document.getElementById("critEscapeBar");
      const critContinueBar = document.getElementById("critContinueBar");
      const cascadeOverlay = document.getElementById("cascadeOverlay");
      const cascadeCount = document.getElementById("cascadeCount");

      const panels = {
        sub: { cx: 245, cy: 324, minR: 122, maxR: 168, baseR: 160, massValue: 50 },
        crit: { cx: 805, cy: 324, minR: 190, maxR: 240, baseR: 240, massValue: 100 }
      };

      const subStars = [
        [117, 382, 25], [208, 277, 26], [224, 382, 24], [275, 292, 26],
        [276, 198, 26], [285, 460, 24], [320, 394, 24]
      ];
      const critStars = [
        [700, 220, 24], [800, 228, 26], [898, 196, 25], [988, 270, 24],
        [705, 320, 25], [800, 314, 24], [922, 306, 25], [995, 358, 24],
        [676, 392, 25], [755, 395, 24], [872, 388, 24], [964, 424, 24],
        [740, 474, 24], [818, 505, 25], [900, 500, 24], [855, 448, 24],
        [640, 328, 23]
      ];

      const subArrows = [
        [113, 375, 92, 318, "escape"], [121, 390, 77, 430, "escape"],
        [198, 292, 247, 305, "continue"], [213, 292, 262, 355, "continue"],
        [229, 384, 261, 431, "escape"], [226, 397, 202, 480, "escape"],
        [280, 205, 279, 145, "escape"], [284, 206, 339, 154, "escape"],
        [276, 290, 284, 226, "escape"], [303, 292, 394, 275, "escape"],
        [322, 401, 384, 450, "escape"], [292, 458, 269, 512, "escape"],
        [288, 468, 335, 506, "escape"], [224, 377, 160, 387, "escape"]
      ];

      const critArrows = [
        [704, 221, 760, 231, "continue"], [796, 229, 816, 170, "continue"],
        [801, 230, 867, 200, "continue"], [893, 197, 975, 248, "continue"],
        [982, 271, 920, 302, "continue"], [924, 305, 848, 320, "continue"],
        [798, 314, 730, 316, "continue"], [709, 320, 648, 344, "continue"],
        [643, 329, 582, 302, "continue"], [677, 394, 617, 395, "continue"],
        [678, 394, 652, 459, "escape"], [754, 396, 724, 455, "continue"],
        [754, 395, 803, 462, "continue"], [821, 503, 809, 568, "escape"],
        [821, 504, 876, 548, "escape"], [902, 501, 958, 555, "escape"],
        [964, 424, 971, 486, "escape"], [966, 424, 1054, 450, "escape"],
        [994, 358, 1051, 329, "escape"], [996, 358, 1046, 400, "escape"],
        [898, 196, 897, 145, "escape"], [805, 170, 803, 75, "escape"],
        [808, 170, 872, 105, "escape"], [872, 388, 910, 435, "continue"],
        [740, 474, 670, 475, "escape"], [703, 319, 704, 252, "continue"],
        [640, 328, 600, 370, "continue"]
      ];

      const cascadeGenerations = [
        [[695, 202]],
        [[790, 225], [705, 320]],
        [[898, 196], [922, 306], [755, 395], [640, 328]],
        [[988, 270], [995, 358], [872, 388], [964, 424], [818, 505], [740, 474], [676, 392], [900, 500]]
      ];

      let activePanel = "sub";
      let cascadeTimers = [];

      function make(tag, attrs = {}, parent = null) {
        const el = document.createElementNS(svgNS, tag);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, String(value)));
        if (parent) parent.appendChild(el);
        return el;
      }

      function starPoints(cx, cy, outer, inner, points = 18) {
        const coords = [];
        for (let i = 0; i < points * 2; i += 1) {
          const angle = -Math.PI / 2 + (i * Math.PI) / points;
          const radius = i % 2 === 0 ? outer : inner;
          coords.push(`${(cx + Math.cos(angle) * radius).toFixed(1)},${(cy + Math.sin(angle) * radius).toFixed(1)}`);
        }
        return coords.join(" ");
      }

      function addStar(groupId, item, className = "fission-star") {
        const group = document.getElementById(groupId);
        make("polygon", {
          points: starPoints(item[0], item[1], item[2], item[2] * 0.33, 18),
          class: className
        }, group);
      }

      function addArrow(groupId, arrow, className = "arrow") {
        const group = document.getElementById(groupId);
        make("line", {
          x1: arrow[0],
          y1: arrow[1],
          x2: arrow[2],
          y2: arrow[3],
          class: `${className} ${arrow[4] === "escape" ? "escape-arrow" : "continue-arrow"}`,
          "marker-end": "url(#arrowHead)"
        }, group);
      }

      function renderStaticFigure() {
        subArrows.forEach((arrow) => addArrow("subArrows", arrow));
        critArrows.forEach((arrow) => addArrow("critArrows", arrow));
        subStars.forEach((item) => addStar("subStars", item));
        critStars.forEach((item) => addStar("critStars", item));
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function radiusFor(panelName, massPercent) {
        const panel = panels[panelName];
        const localMin = panelName === "sub" ? 45 : 75;
        const localMax = panelName === "sub" ? 75 : 105;
        const t = clamp((massPercent - localMin) / (localMax - localMin), 0, 1);
        return panel.minR + t * (panel.maxR - panel.minR);
      }

      function fractionsFor(massPercent) {
        const t = clamp((massPercent - 45) / 60, 0, 1);
        const escape = Math.round(72 - 38 * Math.pow(t, 0.82));
        return { escape, further: 100 - escape };
      }

      function setBar(escapeBar, continueBar, x, width, escape) {
        const escapeWidth = Math.round(width * escape / 100);
        escapeBar.setAttribute("x", x);
        escapeBar.setAttribute("width", escapeWidth);
        continueBar.setAttribute("x", x + escapeWidth);
        continueBar.setAttribute("width", width - escapeWidth);
      }

      function setPanel(panelName, massPercent, syncSlider) {
        activePanel = panelName;
        if (syncSlider) massSlider.value = String(massPercent);
        const selectedMass = Number(massSlider.value);
        const subR = panelName === "sub" ? radiusFor("sub", selectedMass) : panels.sub.baseR;
        const critR = panelName === "crit" ? radiusFor("crit", selectedMass) : panels.crit.baseR;
        const active = panels[panelName];
        const activeR = panelName === "sub" ? subR : critR;
        const fractions = fractionsFor(selectedMass);
        const subFixed = { escape: 68, further: 32 };
        const critFixed = { escape: 34, further: 66 };
        const subShown = panelName === "sub" ? fractions : subFixed;
        const critShown = panelName === "crit" ? fractions : critFixed;

        subMass.setAttribute("r", subR.toFixed(1));
        critMass.setAttribute("r", critR.toFixed(1));
        activeRing.setAttribute("cx", active.cx);
        activeRing.setAttribute("cy", active.cy);
        activeRing.setAttribute("r", (activeR + 12).toFixed(1));
        activeRing.classList.add("on");
        massPreview.setAttribute("cx", active.cx);
        massPreview.setAttribute("cy", active.cy);
        massPreview.setAttribute("r", activeR.toFixed(1));

        subBtn.classList.toggle("active", panelName === "sub");
        critBtn.classList.toggle("active", panelName === "crit");
        subPanel.classList.toggle("dimmed", panelName !== "sub");
        critPanel.classList.toggle("dimmed", panelName !== "crit");
        massValue.textContent = `${selectedMass}%`;
        escapeValue.textContent = `${fractions.escape}%`;
        continueValue.textContent = `${fractions.further}%`;
        subFractionText.textContent = `${subShown.escape}% escape, ${subShown.further}% cause fission`;
        critFractionText.textContent = `${critShown.escape}% escape, ${critShown.further}% cause fission`;
        setBar(subEscapeBar, subContinueBar, 58, 215, subShown.escape);
        setBar(critEscapeBar, critContinueBar, 731, 268, critShown.escape);
      }

      function clearCascade() {
        cascadeTimers.forEach((timer) => window.clearTimeout(timer));
        cascadeTimers = [];
        cascadeOverlay.replaceChildren();
        cascadeCount.textContent = "0 fissions";
        playCascade.disabled = false;
      }

      function addCascadeArrow(from, to, delayIndex) {
        const line = make("line", {
          x1: from[0],
          y1: from[1],
          x2: to[0],
          y2: to[1],
          class: "cascade-arrow",
          style: `animation-delay: ${delayIndex * 38}ms`
        }, cascadeOverlay);
        return line;
      }

      function addCascadeStar(point) {
        make("polygon", {
          points: starPoints(point[0], point[1], 31, 10, 20),
          class: "cascade-star"
        }, cascadeOverlay);
      }

      function playCascadeAnimation() {
        clearCascade();
        setPanel("crit", 100, true);
        playCascade.disabled = true;

        make("circle", {
          class: "moving-neutron",
          cx: 0,
          cy: 0,
          r: 9
        }, cascadeOverlay);

        cascadeTimers.push(window.setTimeout(() => {
          addCascadeStar(cascadeGenerations[0][0]);
          cascadeCount.textContent = "1 fission";
        }, 830));

        for (let generation = 1; generation < cascadeGenerations.length; generation += 1) {
          cascadeTimers.push(window.setTimeout(() => {
            const parents = cascadeGenerations[generation - 1];
            const children = cascadeGenerations[generation];
            children.forEach((child, index) => {
              const parent = parents[Math.floor(index / 2)] || parents[parents.length - 1];
              addCascadeArrow(parent, child, index);
              addCascadeStar(child);
            });
            const events = children.length;
            cascadeCount.textContent = `${events} fissions`;
            if (generation === cascadeGenerations.length - 1) playCascade.disabled = false;
          }, 900 + generation * 820));
        }
      }

      renderStaticFigure();
      setPanel("sub", 50, true);
      subBtn.addEventListener("click", () => {
        clearCascade();
        setPanel("sub", panels.sub.massValue, true);
      });
      critBtn.addEventListener("click", () => {
        clearCascade();
        setPanel("crit", panels.crit.massValue, true);
      });
      massSlider.addEventListener("input", () => {
        clearCascade();
        const mass = Number(massSlider.value);
        const inferredPanel = mass >= 76 ? "crit" : "sub";
        setPanel(inferredPanel, mass, false);
      });
      playCascade.addEventListener("click", playCascadeAnimation);
      resetCascade.addEventListener("click", clearCascade);
    })();
  </script>
</body>
</html>
