<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conv1D Channels</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #101315;
      --slate: #424b4f;
      --muted: #687277;
      --edge: #d7dcde;
      --paper: #ffffff;
      --panel: #f5f7f7;
      --teal: #7bd8d1;
      --terra: #b46d59;
      --shadow: 0 16px 42px rgba(42, 52, 57, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef2f3;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .figure-shell {
      width: min(1420px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 14px;
      align-items: stretch;
    }

    .stage,
    .controls {
      background: var(--paper);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      min-width: 0;
      overflow: auto;
      padding: 8px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 820px;
      height: min(78vh, 720px);
      min-height: 520px;
      background: #fff;
      border-radius: 6px;
      user-select: none;
      touch-action: manipulation;
    }

    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .equation {
      margin: 0;
      padding: 11px 12px;
      border: 1px solid #e1e6e8;
      border-radius: 8px;
      background: #fbfcfc;
      color: #2b3438;
      font-size: 14px;
      line-height: 1.45;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      color: #2d363a;
      font-size: 13px;
      font-weight: 750;
    }

    output {
      color: var(--terra);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--terra);
    }

    .readout {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .chip {
      min-width: 0;
      height: 28px;
      border: 1px solid #d6dcde;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #1e282c;
      font-size: 12px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      background: #fff;
    }

    .legend-note {
      margin-top: auto;
      color: #737c80;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 980px) {
      body {
        padding: 10px;
        place-items: start center;
      }

      .figure-shell {
        grid-template-columns: 1fr;
      }

      .controls {
        order: -1;
      }

      svg {
        height: 64vh;
        min-height: 460px;
      }
    }

    @media (max-width: 560px) {
      .chips {
        grid-template-columns: repeat(3, 1fr);
      }

      .controls {
        padding: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="figure-shell">
    <main class="stage" aria-label="Interactive schematic of a one-dimensional convolution with multiple channels">
      <svg id="figure" viewBox="0 0 1500 760" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Multi-channel one-dimensional convolution</title>
        <desc id="svgDesc">Input feature volume H, weights Omega, and output feature volume H prime shown as projected grids with interactive channel and kernel-width highlighting.</desc>
      </svg>
    </main>

    <aside class="controls">
      <h1>Conv1D With Channels</h1>
      <p class="equation">
        H&#8242;<sub>j,x</sub> = b<sub>j</sub> + &Sigma;<sub>i</sub> &Sigma;<sub>t</sub>
        &Omega;<sub>j,i,t</sub> H<sub>i,x+t</sub>
      </p>

      <label class="control" for="channelSlider">
        <span class="control-head">
          <span>Output channel</span>
          <output id="channelOut">H&#8242;1</output>
        </span>
        <input id="channelSlider" type="range" min="1" max="4" step="1" value="1">
      </label>

      <label class="control" for="kernelSlider">
        <span class="control-head">
          <span>Kernel width</span>
          <output id="kernelOut">3</output>
        </span>
        <input id="kernelSlider" type="range" min="1" max="5" step="1" value="3">
      </label>

      <p id="dimReadout" class="readout"></p>
      <div id="channelChips" class="chips" aria-label="Input channel color key"></div>
      <p id="sliceReadout" class="readout"></p>
      <p class="legend-note">Terracotta links trace the channel-wise sums. The highlighted input span is the current receptive field.</p>
    </aside>
  </div>

  <script>
    (() => {
      const svg = document.getElementById("figure");
      const channelSlider = document.getElementById("channelSlider");
      const kernelSlider = document.getElementById("kernelSlider");
      const channelOut = document.getElementById("channelOut");
      const kernelOut = document.getElementById("kernelOut");
      const dimReadout = document.getElementById("dimReadout");
      const sliceReadout = document.getElementById("sliceReadout");
      const chipBox = document.getElementById("channelChips");
      const ns = "http://www.w3.org/2000/svg";

      const dims = {
        inputWidth: 8,
        height: 5,
        inputChannels: 5,
        outputChannels: 4
      };

      const state = {
        outputChannel: 0,
        kernelWidth: 3
      };

      const ink = "#101315";
      const slate = "#424b4f";
      const lightSlate = "#6d777b";
      const terra = "#b46d59";
      const teal = "#7bd8d1";
      const channelColors = ["#7bd8d1", "#d79b63", "#8fc36a", "#789fd3", "#c37fa6"];

      const inputGeom = {
        origin: { x: 92, y: 565 },
        wx: 54,
        wy: 0,
        hx: 0,
        hy: -57,
        cx: 31,
        cy: -27,
        r: 27
      };

      const outputGeom = {
        origin: { x: 1198, y: 565 },
        wx: 48,
        wy: 0,
        hx: 0,
        hy: -57,
        cx: 38,
        cy: -34,
        r: 27
      };

      const weightGeom = {
        origin: { x: 707, y: 480 },
        kx: 39,
        ky: 0,
        ix: 0,
        iy: -34,
        ox: 20,
        oy: -18,
        r: 14
      };

      function el(name, attrs = {}, parent = svg) {
        const node = document.createElementNS(ns, name);
        for (const [key, value] of Object.entries(attrs)) {
          if (value !== undefined && value !== null) {
            node.setAttribute(key, value);
          }
        }
        parent.appendChild(node);
        return node;
      }

      function text(parent, x, y, value, attrs = {}) {
        const node = el("text", {
          x,
          y,
          "font-family": "Inter, ui-sans-serif, system-ui, sans-serif",
          "letter-spacing": "0",
          ...attrs
        }, parent);
        node.textContent = value;
        return node;
      }

      function point(geom, w, h, c) {
        return {
          x: geom.origin.x + w * geom.wx + h * geom.hx + c * geom.cx,
          y: geom.origin.y + w * geom.wy + h * geom.hy + c * geom.cy
        };
      }

      function weightPoint(k, inputChannel, outputChannel) {
        return {
          x: weightGeom.origin.x + k * weightGeom.kx + inputChannel * weightGeom.ix + outputChannel * weightGeom.ox,
          y: weightGeom.origin.y + k * weightGeom.ky + inputChannel * weightGeom.iy + outputChannel * weightGeom.oy
        };
      }

      function clear() {
        while (svg.firstChild) {
          svg.removeChild(svg.firstChild);
        }
      }

      function drawMetadata() {
        const title = el("title", { id: "svgTitle" });
        title.textContent = "Multi-channel one-dimensional convolution";
        const desc = el("desc", { id: "svgDesc" });
        desc.textContent = "Input feature volume H, weights Omega, and output feature volume H prime shown as projected grids with interactive channel and kernel-width highlighting.";
      }

      function drawDefs() {
        const defs = el("defs");
        const arrow = el("marker", {
          id: "arrowSlate",
          viewBox: "0 0 10 10",
          refX: "9",
          refY: "5",
          markerWidth: "8",
          markerHeight: "8",
          orient: "auto-start-reverse"
        }, defs);
        el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: slate }, arrow);

        const arrowSmall = el("marker", {
          id: "arrowTerra",
          viewBox: "0 0 10 10",
          refX: "9",
          refY: "5",
          markerWidth: "7",
          markerHeight: "7",
          orient: "auto"
        }, defs);
        el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: terra }, arrowSmall);

        const glow = el("filter", {
          id: "softGlow",
          x: "-35%",
          y: "-35%",
          width: "170%",
          height: "170%"
        }, defs);
        el("feGaussianBlur", { stdDeviation: "3.6", result: "blur" }, glow);
        el("feColorMatrix", {
          in: "blur",
          type: "matrix",
          values: "0 0 0 0 0.706 0 0 0 0 0.427 0 0 0 0 0.349 0 0 0 0.55 0",
          result: "color"
        }, glow);
        const merge = el("feMerge", {}, glow);
        el("feMergeNode", { in: "color" }, merge);
        el("feMergeNode", { in: "SourceGraphic" }, merge);
      }

      function drawAxes() {
        const g = el("g", { "aria-hidden": "true" });
        el("path", {
          d: "M 54 212 L 251 62",
          fill: "none",
          stroke: slate,
          "stroke-width": "2.4",
          "marker-start": "url(#arrowSlate)",
          "marker-end": "url(#arrowSlate)"
        }, g);
        text(g, 111, 136, "Width", {
          fill: slate,
          "font-size": "31",
          transform: "rotate(-37 111 136)"
        });

        el("path", {
          d: "M 54 590 L 54 230",
          fill: "none",
          stroke: slate,
          "stroke-width": "2.4",
          "marker-start": "url(#arrowSlate)",
          "marker-end": "url(#arrowSlate)"
        }, g);
        text(g, 24, 420, "Height", {
          fill: slate,
          "font-size": "31",
          "text-anchor": "middle",
          transform: "rotate(-90 24 420)"
        });

        el("path", {
          d: "M 335 50 L 675 50",
          fill: "none",
          stroke: slate,
          "stroke-width": "2.4",
          "marker-start": "url(#arrowSlate)",
          "marker-end": "url(#arrowSlate)"
        }, g);
        el("path", {
          d: "M 335 50 L 304 65",
          fill: "none",
          stroke: slate,
          "stroke-width": "2.4",
          "marker-end": "url(#arrowSlate)"
        }, g);
        el("path", {
          d: "M 675 50 L 706 35",
          fill: "none",
          stroke: slate,
          "stroke-width": "2.4",
          "marker-end": "url(#arrowSlate)"
        }, g);
        text(g, 505, 36, "Channels", {
          fill: slate,
          "font-size": "31",
          "text-anchor": "middle"
        });
      }

      function drawOperator(parent, x, y, symbol) {
        const group = el("g", {}, parent);
        el("circle", {
          cx: x,
          cy: y,
          r: "23",
          fill: "#fff",
          stroke: terra,
          "stroke-width": "2"
        }, group);
        text(group, x, y + 10, symbol, {
          fill: terra,
          "font-size": "44",
          "font-weight": "300",
          "text-anchor": "middle"
        });
      }

      function drawFlow() {
        const g = el("g", {});
        el("path", {
          d: "M 515 375 C 565 357 609 357 653 371",
          fill: "none",
          stroke: slate,
          "stroke-width": "3",
          "marker-end": "url(#arrowSlate)"
        }, g);
        el("path", {
          d: "M 676 381 C 703 398 715 407 741 407",
          fill: "none",
          stroke: slate,
          "stroke-width": "3",
          "marker-end": "url(#arrowSlate)"
        }, g);
        el("path", {
          d: "M 923 396 C 957 383 980 376 1003 375",
          fill: "none",
          stroke: slate,
          "stroke-width": "3",
          "marker-end": "url(#arrowSlate)"
        }, g);
        el("path", {
          d: "M 1032 377 C 1086 362 1136 349 1194 337",
          fill: "none",
          stroke: slate,
          "stroke-width": "3",
          "marker-end": "url(#arrowSlate)"
        }, g);
        drawOperator(g, 681, 374, "\u2297");
        drawOperator(g, 1024, 374, "\u2295");
      }

      function drawCircle(parent, x, y, r, attrs = {}) {
        return el("circle", {
          cx: x,
          cy: y,
          r,
          fill: "#fff",
          stroke: ink,
          "stroke-width": "2.4",
          ...attrs
        }, parent);
      }

      function drawInputVolume(startPos, selectedRow) {
        const g = el("g", {});
        const bandLayer = el("g", {}, g);
        const nodeLayer = el("g", {}, g);
        const kernel = state.kernelWidth;

        for (let c = dims.inputChannels - 1; c >= 0; c -= 1) {
          const a = point(inputGeom, startPos, selectedRow, c);
          const b = point(inputGeom, startPos + kernel - 1, selectedRow, c);
          el("rect", {
            x: a.x - inputGeom.r - 6,
            y: a.y - inputGeom.r - 7,
            width: Math.max(1, b.x - a.x) + inputGeom.r * 2 + 12,
            height: inputGeom.r * 2 + 14,
            rx: "3",
            fill: channelColors[c],
            opacity: "0.22",
            stroke: channelColors[c],
            "stroke-width": "2.4"
          }, bandLayer);
        }

        for (let c = dims.inputChannels - 1; c >= 0; c -= 1) {
          for (let h = dims.height - 1; h >= 0; h -= 1) {
            for (let w = 0; w < dims.inputWidth; w += 1) {
              const p = point(inputGeom, w, h, c);
              const inField = h === selectedRow && w >= startPos && w < startPos + kernel;
              drawCircle(nodeLayer, p.x, p.y, inputGeom.r, {
                fill: inField ? "#f9fbfb" : "#fff",
                stroke: inField ? channelColors[c] : (c === 0 ? ink : lightSlate),
                "stroke-width": inField ? "3.3" : (c === 0 ? "2.5" : "2.1"),
                opacity: c === 0 || inField ? "1" : "0.78"
              });
            }
          }
        }

        text(g, 248, 672, "Input layer, H", {
          fill: ink,
          "font-size": "39",
          "text-anchor": "middle"
        });
        text(g, 324, 617, "receptive field", {
          fill: terra,
          "font-size": "20",
          "font-weight": "700",
          "text-anchor": "middle"
        });
      }

      function drawWeights() {
        const g = el("g", {});
        const active = state.outputChannel;

        for (let out = dims.outputChannels - 1; out >= 0; out -= 1) {
          const slice = el("g", {
            opacity: out === active ? "1" : "0.30"
          }, g);
          const topLeft = weightPoint(-0.45, -0.45, out);
          const bottomRight = weightPoint(state.kernelWidth - 0.55, dims.inputChannels - 0.55, out);
          el("rect", {
            x: topLeft.x - 10,
            y: bottomRight.y - 17,
            width: Math.max(52, state.kernelWidth * weightGeom.kx + 18),
            height: dims.inputChannels * Math.abs(weightGeom.iy) + 15,
            rx: "5",
            fill: out === active ? "#fff4ef" : "#f4f5f5",
            stroke: out === active ? terra : "#8d969a",
            "stroke-width": out === active ? "3" : "1.5"
          }, slice);

          for (let i = dims.inputChannels - 1; i >= 0; i -= 1) {
            for (let k = 0; k < state.kernelWidth; k += 1) {
              const p = weightPoint(k, i, out);
              const fill = out === active ? channelColors[i] : "#f1f1f1";
              drawCircle(slice, p.x, p.y, weightGeom.r, {
                fill,
                stroke: out === active ? "#2b1711" : "#6f777a",
                "stroke-width": out === active ? "2.2" : "1.4",
                opacity: out === active ? "0.96" : "1"
              });
            }
          }
        }

        const activeTop = weightPoint((state.kernelWidth - 1) / 2, dims.inputChannels - 0.25, active);
        text(g, activeTop.x + 7, activeTop.y - 22, `\u03A9[${active + 1}, :, :]`, {
          fill: terra,
          stroke: "#fff",
          "stroke-width": "5",
          "paint-order": "stroke fill",
          "font-size": "19",
          "font-weight": "800",
          "text-anchor": "middle"
        });
        text(g, 815, 635, "Weights, \u03A9", {
          fill: ink,
          "font-size": "36",
          "text-anchor": "middle"
        });
      }

      function drawOutputVolume(outWidth, selectedPos, selectedRow) {
        const g = el("g", {});
        for (let c = dims.outputChannels - 1; c >= 0; c -= 1) {
          const selected = c === state.outputChannel;
          const sliceGroup = el("g", {
            "data-output-channel": String(c),
            role: "button",
            tabindex: "0",
            "aria-label": `Select output channel ${c + 1}`,
            cursor: "pointer"
          }, g);

          const first = point(outputGeom, 0, dims.height - 1, c);
          const last = point(outputGeom, outWidth - 1, 0, c);
          if (selected) {
            el("path", {
              d: `M ${first.x - 35} ${first.y - 35} L ${last.x + 35} ${first.y - 35} L ${last.x + 35} ${last.y + 35} L ${first.x - 35} ${last.y + 35} Z`,
              fill: teal,
              opacity: "0.16",
              stroke: terra,
              "stroke-width": "3",
              "stroke-dasharray": "8 7"
            }, sliceGroup);
          }

          for (let h = dims.height - 1; h >= 0; h -= 1) {
            for (let w = 0; w < outWidth; w += 1) {
              const p = point(outputGeom, w, h, c);
              const focal = selected && h === selectedRow && w === selectedPos;
              drawCircle(sliceGroup, p.x, p.y, outputGeom.r, {
                fill: focal ? "#cfecea" : (selected ? "#f7ffff" : "#fff"),
                stroke: focal ? terra : (selected ? slate : lightSlate),
                "stroke-width": focal ? "4" : (selected ? "2.7" : "2.2"),
                filter: focal ? "url(#softGlow)" : undefined,
                opacity: selected || c === 0 ? "1" : "0.82"
              });
              if (focal) {
                el("path", {
                  d: `M ${p.x - 11} ${p.y + 1} L ${p.x} ${p.y + 1} L ${p.x + 15} ${p.y - 15}`,
                  fill: "none",
                  stroke: teal,
                  "stroke-width": "5",
                  "stroke-linecap": "round",
                  "stroke-linejoin": "round"
                }, sliceGroup);
              }
            }
          }

          sliceGroup.addEventListener("click", () => {
            state.outputChannel = c;
            channelSlider.value = String(c + 1);
            render();
          });
          sliceGroup.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              state.outputChannel = c;
              channelSlider.value = String(c + 1);
              render();
            }
          });
        }

        text(g, 1336, 672, "Output layer, H\u2032", {
          fill: ink,
          "font-size": "36",
          "text-anchor": "middle"
        });
      }

      function drawContributionArrows(startPos, selectedRow) {
        const g = el("g", {});
        for (let i = 0; i < dims.inputChannels; i += 1) {
          const src = point(inputGeom, startPos + state.kernelWidth - 1, selectedRow, i);
          const dst = weightPoint(Math.max(0, state.kernelWidth - 1), i, state.outputChannel);
          const midX = (src.x + dst.x) / 2 + 20;
          const midY = Math.min(src.y, dst.y) - 45;
          el("path", {
            d: `M ${src.x + 32} ${src.y} C ${midX} ${midY}, ${midX + 22} ${midY}, ${dst.x - 20} ${dst.y}`,
            fill: "none",
            stroke: terra,
            "stroke-width": "2.4",
            opacity: "0.55",
            "marker-end": "url(#arrowTerra)"
          }, g);
        }

        const wSrc = weightPoint(state.kernelWidth - 1, 0, state.outputChannel);
        const outWidth = dims.inputWidth - state.kernelWidth + 1;
        const outPos = Math.floor((outWidth - 1) / 2);
        const outDst = point(outputGeom, outPos, selectedRow, state.outputChannel);
        el("path", {
          d: `M ${wSrc.x + 28} ${wSrc.y - 4} C 995 ${wSrc.y - 60}, 1088 ${outDst.y - 30}, ${outDst.x - 36} ${outDst.y}`,
          fill: "none",
          stroke: terra,
          "stroke-width": "3",
          opacity: "0.68",
          "marker-end": "url(#arrowTerra)"
        }, g);
      }

      function drawLabels(outWidth) {
        const g = el("g", {});
        text(g, 1190, 98, `output width = ${outWidth}`, {
          fill: terra,
          "font-size": "20",
          "font-weight": "800"
        });
      }

      function renderChips() {
        chipBox.replaceChildren();
        channelColors.forEach((color, index) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.style.borderColor = color;
          chip.style.background = `${color}33`;
          chip.textContent = `H${index + 1}`;
          chipBox.appendChild(chip);
        });
      }

      function render() {
        const outWidth = dims.inputWidth - state.kernelWidth + 1;
        const selectedPos = Math.floor((outWidth - 1) / 2);
        const selectedRow = 2;
        const inputStart = selectedPos;

        clear();
        drawMetadata();
        drawDefs();
        drawAxes();
        drawFlow();
        drawInputVolume(inputStart, selectedRow);
        drawContributionArrows(inputStart, selectedRow);
        drawWeights();
        drawOutputVolume(outWidth, selectedPos, selectedRow);
        drawLabels(outWidth);

        channelOut.textContent = `H\u2032${state.outputChannel + 1}`;
        kernelOut.textContent = String(state.kernelWidth);
        dimReadout.textContent = `Valid convolution: input width ${dims.inputWidth} gives output width ${outWidth}.`;
        sliceReadout.textContent = `H\u2032 channel ${state.outputChannel + 1} combines all ${dims.inputChannels} input-channel slices with \u03A9[${state.outputChannel + 1}, :, :].`;
      }

      channelSlider.addEventListener("input", () => {
        state.outputChannel = Number(channelSlider.value) - 1;
        render();
      });

      kernelSlider.addEventListener("input", () => {
        state.kernelWidth = Number(kernelSlider.value);
        render();
      });

      renderChips();
      render();
    })();
  </script>
</body>
</html>
