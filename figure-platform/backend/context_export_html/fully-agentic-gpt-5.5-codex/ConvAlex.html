<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlexNet Convolutional Architecture</title>
  <style>
    :root {
      --ink: #151515;
      --muted: #535f62;
      --paper: #ffffff;
      --panel: #f5f7f7;
      --line: #cbd5d5;
      --teal: #d3edeb;
      --teal-dark: #a0d9d3;
      --orange: #d18362;
      --orange-dark: #773c23;
      --accent: #176d78;
      --rf: #e6a43b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f6f7f8;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .figure-shell {
      width: min(1240px, 100%);
      background: var(--paper);
      border: 1px solid #dfe6e6;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(22, 35, 38, 0.10);
      overflow: hidden;
    }

    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(210px, 1fr) auto minmax(240px, 1.1fr);
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      background: #f8fbfb;
      border-bottom: 1px solid #dfe7e7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #9fb2b4;
      border-radius: 6px;
      background: #ffffff;
      color: #12373d;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover,
    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #e6f3f2;
    }

    .slider-label {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      color: #23383b;
      font-weight: 650;
      min-width: 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #23383b;
      font-weight: 650;
      white-space: nowrap;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    #statusLine {
      min-width: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .svg-wrap {
      overflow-x: auto;
      background: #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 720px;
      height: auto;
      user-select: none;
    }

    .dim-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      fill: #0c0c0c;
    }

    .stage-caption,
    .op-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      fill: #0e0e0e;
    }

    .op-label {
      font-size: 23px;
    }

    .small-label {
      font-size: 18px;
      fill: #283033;
    }

    .arrow,
    .leader,
    .dim-arrow {
      fill: none;
      stroke: #111111;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
      marker-end: url(#arrowHead);
    }

    .dim-arrow {
      stroke-width: 2.4;
    }

    .arrow.active {
      stroke: var(--accent);
      stroke-width: 5;
      filter: url(#softGlow);
    }

    .volume {
      cursor: pointer;
    }

    .volume .main-face,
    .volume .top-face,
    .volume .side-face,
    .volume .slice-face,
    .input-frame,
    .input-side {
      stroke: #111111;
      stroke-linejoin: round;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .volume .main-face {
      fill: var(--teal);
    }

    .volume .top-face,
    .volume .side-face {
      fill: var(--teal-dark);
    }

    .volume .slice-face {
      fill: rgba(211, 237, 235, 0.42);
      stroke-width: 1.6;
    }

    .volume.kernel .main-face {
      fill: var(--orange);
    }

    .volume.kernel .top-face,
    .volume.kernel .side-face {
      fill: var(--orange-dark);
    }

    .volume.kernel .slice-face {
      fill: rgba(209, 131, 98, 0.45);
    }

    .flow-block.active .main-face,
    .flow-block.active .input-frame {
      stroke: var(--accent);
      stroke-width: 5;
      filter: url(#softGlow);
    }

    .flow-block.active .top-face,
    .flow-block.active .side-face,
    .flow-block.active .input-side {
      stroke: var(--accent);
      stroke-width: 4.5;
    }

    .ellipsis {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      letter-spacing: 2px;
      fill: #24484a;
      opacity: 0.78;
    }

    .input-frame {
      fill: none;
    }

    .input-side {
      fill: #070707;
    }

    .photo-shadow {
      fill: rgba(0, 0, 0, 0.22);
    }

    .callout-box {
      fill: rgba(255, 255, 255, 0.94);
      stroke: #98b3b6;
      stroke-width: 1.6;
      rx: 8;
    }

    .callout-title {
      fill: #153e45;
      font-weight: 800;
      font-size: 18px;
    }

    .callout-text {
      fill: #324246;
      font-size: 15px;
    }

    .rf-patch {
      fill: rgba(230, 164, 59, 0.30);
      stroke: #b86821;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .rf-prev {
      fill: rgba(23, 109, 120, 0.22);
      stroke: #176d78;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .rf-line {
      stroke: #b86821;
      stroke-width: 2.4;
      stroke-dasharray: 8 6;
      fill: none;
      marker-end: url(#rfArrow);
    }

    .activation {
      fill: #ffffff;
      stroke: #176d78;
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }

    .kernel-tag {
      fill: #6f341f;
      font-weight: 800;
      font-size: 18px;
    }

    @media (max-width: 820px) {
      body {
        padding: 8px;
      }

      .figure-shell {
        border-radius: 6px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 9px;
        align-items: stretch;
      }

      button {
        width: 100%;
      }

      .toggle {
        white-space: normal;
      }

      #statusLine {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive AlexNet convolutional architecture figure">
    <section class="toolbar" aria-label="AlexNet figure controls">
      <button id="playFlow" type="button" aria-pressed="false">Animate data flow</button>
      <label class="slider-label" for="layerSlider">
        <span>Layer index</span>
        <input id="layerSlider" type="range" min="1" max="3" value="1" step="1">
        <span id="layerReadout">1</span>
      </label>
      <label class="toggle" for="rfToggle">
        <input id="rfToggle" type="checkbox">
        <span>Receptive-field overlay</span>
      </label>
      <div id="statusLine" aria-live="polite"></div>
    </section>

    <div class="svg-wrap">
      <svg id="alexNetSvg" viewBox="0 0 1310 720" role="img" aria-labelledby="figTitle figDesc">
        <title id="figTitle">AlexNet convolutional neural network architecture</title>
        <desc id="figDesc">A left-to-right perspective volume diagram showing an input image, convolutional kernels, feature map tensors, fully connected layers, dimension labels, animated flow highlighting, and a receptive-field overlay.</desc>
        <defs>
          <marker id="arrowHead" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L10,4.5 L0,9 Z" fill="#111111"></path>
          </marker>
          <marker id="rfArrow" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L10,4.5 L0,9 Z" fill="#b86821"></path>
          </marker>
          <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"></feGaussianBlur>
            <feFlood flood-color="#35a7b3" flood-opacity="0.45" result="color"></feFlood>
            <feComposite in="color" in2="blur" operator="in" result="glow"></feComposite>
            <feMerge>
              <feMergeNode in="glow"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
          <linearGradient id="photoSky" x1="0%" y1="0%" x2="100%" y2="58%">
            <stop offset="0%" stop-color="#1d0902"></stop>
            <stop offset="32%" stop-color="#9d5209"></stop>
            <stop offset="56%" stop-color="#f3b83e"></stop>
            <stop offset="79%" stop-color="#53220b"></stop>
            <stop offset="100%" stop-color="#090403"></stop>
          </linearGradient>
          <radialGradient id="candleGlow" cx="48%" cy="42%" r="52%">
            <stop offset="0%" stop-color="#fff0a4" stop-opacity="0.95"></stop>
            <stop offset="46%" stop-color="#f2b132" stop-opacity="0.55"></stop>
            <stop offset="100%" stop-color="#541403" stop-opacity="0"></stop>
          </radialGradient>
          <clipPath id="inputClip">
            <polygon points="76,176 238,78 238,432 76,534"></polygon>
          </clipPath>
        </defs>

        <rect x="0" y="0" width="1310" height="720" fill="#ffffff"></rect>

        <g id="photoGroup" class="flow-block" data-flow-id="input">
          <polygon class="photo-shadow" points="101,188 259,96 259,448 101,548"></polygon>
          <polygon class="input-side" points="238,78 259,96 259,448 238,432"></polygon>
          <g clip-path="url(#inputClip)">
            <rect x="40" y="40" width="260" height="520" fill="url(#photoSky)"></rect>
            <circle cx="172" cy="252" r="116" fill="url(#candleGlow)"></circle>
            <polygon points="38,350 260,280 260,566 38,566" fill="#050505"></polygon>
            <g opacity="0.94">
              <ellipse cx="155" cy="338" rx="27" ry="39" fill="#8d230b"></ellipse>
              <ellipse cx="188" cy="329" rx="24" ry="34" fill="#aa300d"></ellipse>
              <ellipse cx="218" cy="318" rx="21" ry="32" fill="#6d1a0b"></ellipse>
              <ellipse cx="246" cy="304" rx="20" ry="31" fill="#3f1309"></ellipse>
              <line x1="146" y1="318" x2="142" y2="264" stroke="#6e2508" stroke-width="4"></line>
              <line x1="181" y1="310" x2="181" y2="249" stroke="#7a2a08" stroke-width="4"></line>
              <line x1="211" y1="298" x2="215" y2="235" stroke="#7a2a08" stroke-width="4"></line>
              <line x1="241" y1="285" x2="248" y2="221" stroke="#7a2a08" stroke-width="4"></line>
              <path d="M137 268 C142 246 151 237 156 263 C154 281 141 285 137 268 Z" fill="#fff7b1"></path>
              <path d="M174 252 C181 224 190 214 194 249 C192 273 177 278 174 252 Z" fill="#fff6aa"></path>
              <path d="M210 237 C217 213 226 202 229 235 C225 259 212 263 210 237 Z" fill="#ffef88"></path>
              <path d="M244 221 C252 191 261 184 263 221 C259 242 247 247 244 221 Z" fill="#ffe780"></path>
            </g>
            <text x="98" y="492" fill="#ffffff" opacity="0.70" font-family="Georgia, serif" font-size="21" transform="rotate(-22 98 492)">AlexNet</text>
          </g>
          <polygon class="input-frame" points="76,176 238,78 238,432 76,534"></polygon>
        </g>

        <g id="arrows"></g>
        <g id="diagramObjects"></g>
        <g id="labels"></g>
        <g id="rfOverlay" aria-hidden="true"></g>
        <g id="callout" aria-hidden="true"></g>
      </svg>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const svgNS = "http://www.w3.org/2000/svg";
      const times = "\u00d7";
      const svg = document.getElementById("alexNetSvg");
      const objects = document.getElementById("diagramObjects");
      const labels = document.getElementById("labels");
      const arrows = document.getElementById("arrows");
      const overlay = document.getElementById("rfOverlay");
      const callout = document.getElementById("callout");
      const playButton = document.getElementById("playFlow");
      const layerSlider = document.getElementById("layerSlider");
      const layerReadout = document.getElementById("layerReadout");
      const rfToggle = document.getElementById("rfToggle");
      const statusLine = document.getElementById("statusLine");

      const inputQuad = [
        { x: 76, y: 176 },
        { x: 238, y: 78 },
        { x: 238, y: 432 },
        { x: 76, y: 534 }
      ];

      const volumeSpecs = {
        kernel1: { id: "kernel1", role: "kernel", flowId: "kernel1", x: 296, y: 382, w: 28, h: 116, d: 32, slices: 2 },
        stage1: { id: "stage1", role: "stage", flowId: "stage1", x: 365, y: 389, w: 80, h: 80, d: 48, slices: 5, dots: true },
        kernel2: { id: "kernel2", role: "kernel", flowId: "kernel2", x: 506, y: 407, w: 50, h: 50, d: 36, slices: 2 },
        stage2: { id: "stage2", role: "stage", flowId: "stage2", x: 596, y: 423, w: 58, h: 58, d: 58, slices: 6, dots: true },
        kernel3: { id: "kernel3", role: "kernel", flowId: "kernel3", x: 736, y: 432, w: 45, h: 45, d: 42, slices: 2 },
        stage3: { id: "stage3", role: "stage", flowId: "stage3", x: 817, y: 438, w: 43, h: 43, d: 72, slices: 7, dots: true },
        stage5: { id: "stage5", role: "stage", flowId: "stage5", x: 932, y: 439, w: 42, h: 42, d: 50, slices: 4, dots: false }
      };

      const stageData = {
        1: {
          blockId: "stage1",
          arrowId: "arrowInput",
          name: "Conv1",
          kernel: "Conv 11" + times + "11, stride 4",
          dims: "55" + times + "55" + times + "96",
          prev: "224" + times + "224" + times + "3 input",
          spatialFrom: 224,
          spatialTo: 55,
          channelFrom: 3,
          channelTo: 96,
          rf: 11,
          prevWindow: "11" + times + "11 pixels on the input image",
          prevBlockId: "input"
        },
        2: {
          blockId: "stage2",
          arrowId: "arrow12",
          name: "Conv2",
          kernel: "Conv 5" + times + "5",
          dims: "27" + times + "27" + times + "256",
          prev: "55" + times + "55" + times + "96 feature map",
          spatialFrom: 55,
          spatialTo: 27,
          channelFrom: 96,
          channelTo: 256,
          rf: 51,
          prevWindow: "5" + times + "5 region on the previous feature map",
          prevBlockId: "stage1",
          prevFraction: 5 / 55
        },
        3: {
          blockId: "stage3",
          arrowId: "arrow23",
          name: "Conv3",
          kernel: "Conv 3" + times + "3",
          dims: "13" + times + "13" + times + "384",
          prev: "27" + times + "27" + times + "256 feature map",
          spatialFrom: 27,
          spatialTo: 13,
          channelFrom: 256,
          channelTo: 384,
          rf: 99,
          prevWindow: "3" + times + "3 region on the previous feature map",
          prevBlockId: "stage2",
          prevFraction: 3 / 27
        }
      };

      const flowOrder = ["input", "stage1", "stage2", "stage3"];
      let selectedLayer = 1;
      let flowIndex = 0;
      let timer = null;

      function el(name, attrs, text) {
        const node = document.createElementNS(svgNS, name);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          if (key === "className") {
            node.setAttribute("class", value);
          } else if (key === "dataset") {
            Object.entries(value).forEach(([dataKey, dataValue]) => {
              node.dataset[dataKey] = dataValue;
            });
          } else {
            node.setAttribute(key, value);
          }
        });
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function points(list) {
        return list.map((p) => p.x + "," + p.y).join(" ");
      }

      function clear(node) {
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
      }

      function faceQuad(spec) {
        return [
          { x: spec.x, y: spec.y },
          { x: spec.x + spec.w, y: spec.y },
          { x: spec.x + spec.w, y: spec.y + spec.h },
          { x: spec.x, y: spec.y + spec.h }
        ];
      }

      function volumeCenter(spec) {
        return {
          x: spec.x + spec.w / 2 + spec.d * 0.42,
          y: spec.y + spec.h / 2 - spec.d * 0.18
        };
      }

      function drawVolume(spec) {
        const groupClass = spec.role === "stage" ? "volume flow-block stage-block" : "volume kernel";
        const g = el("g", {
          id: spec.id,
          className: groupClass,
          dataset: { flowId: spec.flowId }
        });

        for (let i = spec.slices; i >= 1; i -= 1) {
          const off = (i * spec.d) / (spec.slices + 2);
          g.appendChild(el("polygon", {
            className: "slice-face",
            points: points([
              { x: spec.x + off, y: spec.y - off },
              { x: spec.x + spec.w + off, y: spec.y - off },
              { x: spec.x + spec.w + off, y: spec.y + spec.h - off },
              { x: spec.x + off, y: spec.y + spec.h - off }
            ])
          }));
        }

        g.appendChild(el("polygon", {
          className: "top-face",
          points: points([
            { x: spec.x, y: spec.y },
            { x: spec.x + spec.d, y: spec.y - spec.d },
            { x: spec.x + spec.w + spec.d, y: spec.y - spec.d },
            { x: spec.x + spec.w, y: spec.y }
          ])
        }));

        g.appendChild(el("polygon", {
          className: "side-face",
          points: points([
            { x: spec.x + spec.w, y: spec.y },
            { x: spec.x + spec.w + spec.d, y: spec.y - spec.d },
            { x: spec.x + spec.w + spec.d, y: spec.y + spec.h - spec.d },
            { x: spec.x + spec.w, y: spec.y + spec.h }
          ])
        }));

        g.appendChild(el("polygon", {
          className: "main-face",
          points: points(faceQuad(spec))
        }));

        if (spec.dots) {
          const dot = el("text", {
            className: "ellipsis",
            x: spec.x + spec.w + spec.d * 0.46,
            y: spec.y + spec.h / 2 - spec.d * 0.42,
            transform: "rotate(-90 " + (spec.x + spec.w + spec.d * 0.46) + " " + (spec.y + spec.h / 2 - spec.d * 0.42) + ")",
            "text-anchor": "middle"
          }, "...");
          g.appendChild(dot);
        }

        if (spec.role === "stage") {
          g.addEventListener("click", () => {
            const layer = Number(spec.id.replace("stage", ""));
            if (layer >= 1 && layer <= 3) {
              pauseFlow();
              setSelectedLayer(layer);
            }
          });
        }

        objects.appendChild(g);
      }

      function drawFcColumn(id, x, y, h, label, shortColumn) {
        const width = shortColumn ? 15 : 16;
        const d = shortColumn ? 14 : 18;
        const gap = shortColumn ? 42 : 58;
        const topHeight = (h - gap) * 0.47;
        const bottomY = y + topHeight + gap;
        const bottomHeight = h - topHeight - gap;

        const g = el("g", { id: id, className: "volume fc-column", dataset: { flowId: id } });
        [0, 1].forEach((idx) => {
          const yy = idx === 0 ? y : bottomY;
          const hh = idx === 0 ? topHeight : bottomHeight;
          const spec = { x, y: yy, w: width, h: hh, d, slices: 0 };
          g.appendChild(el("polygon", {
            className: "top-face",
            points: points([
              { x: spec.x, y: spec.y },
              { x: spec.x + spec.d, y: spec.y - spec.d },
              { x: spec.x + spec.w + spec.d, y: spec.y - spec.d },
              { x: spec.x + spec.w, y: spec.y }
            ])
          }));
          g.appendChild(el("polygon", {
            className: "side-face",
            points: points([
              { x: spec.x + spec.w, y: spec.y },
              { x: spec.x + spec.w + spec.d, y: spec.y - spec.d },
              { x: spec.x + spec.w + spec.d, y: spec.y + spec.h - spec.d },
              { x: spec.x + spec.w, y: spec.y + spec.h }
            ])
          }));
          g.appendChild(el("polygon", {
            className: "main-face",
            points: points(faceQuad(spec))
          }));
        });
        g.appendChild(el("text", {
          className: "ellipsis",
          x: x + width + d * 0.54,
          y: y + topHeight + gap * 0.54,
          "text-anchor": "middle"
        }, "..."));
        objects.appendChild(g);

        const txt = el("text", {
          className: "dim-label",
          x: x + width + d + 10,
          y: y - 24,
          transform: "rotate(-34 " + (x + width + d + 10) + " " + (y - 24) + ")"
        }, label);
        labels.appendChild(txt);
      }

      function drawArrow(id, x1, y1, x2, y2) {
        arrows.appendChild(el("path", {
          id,
          className: "arrow",
          d: "M " + x1 + " " + y1 + " L " + x2 + " " + y2
        }));
      }

      function drawDimensionLabel(text, x, y, targetX, targetY, rotation) {
        const group = el("g", {});
        group.appendChild(el("text", {
          className: "dim-label",
          x,
          y,
          transform: "rotate(" + rotation + " " + x + " " + y + ")"
        }, text));
        group.appendChild(el("path", {
          className: "dim-arrow",
          d: "M " + (x - 8) + " " + (y + 10) + " L " + targetX + " " + targetY
        }));
        labels.appendChild(group);
      }

      function drawOpLabel(lines, x, y, rotation) {
        const text = el("text", {
          className: "op-label",
          x,
          y,
          transform: "rotate(" + rotation + " " + x + " " + y + ")"
        });
        lines.forEach((line, idx) => {
          const span = el("tspan", { x, dy: idx === 0 ? 0 : 25 }, line);
          text.appendChild(span);
        });
        labels.appendChild(text);
      }

      function renderStaticFigure() {
        Object.values(volumeSpecs).forEach(drawVolume);
        drawFcColumn("fc1", 1036, 170, 350, "4096", false);
        drawFcColumn("fc2", 1108, 170, 350, "4096", false);
        drawFcColumn("fc3", 1180, 360, 160, "1000", true);
        drawFcColumn("softmax", 1232, 360, 160, "1000", true);

        drawArrow("arrowInput", 213, 560, 356, 503);
        drawArrow("arrow12", 444, 535, 584, 497);
        drawArrow("arrow23", 655, 535, 806, 505);
        drawArrow("arrow34", 873, 536, 1024, 520);
        drawArrow("arrowFc1", 1067, 535, 1102, 535);
        drawArrow("arrowFc2", 1139, 535, 1174, 535);
        drawArrow("arrowSoft", 1207, 535, 1227, 535);

        drawDimensionLabel("224" + times + "224" + times + "3", 245, 76, 235, 94, -30);
        drawDimensionLabel("55" + times + "55" + times + "96", 392, 343, 363, 386, -30);
        drawDimensionLabel("27" + times + "27" + times + "256", 606, 390, 595, 423, -30);
        drawDimensionLabel("13" + times + "13" + times + "384", 807, 404, 815, 438, -30);
        drawDimensionLabel("13" + times + "13" + times + "256", 916, 414, 931, 439, -30);

        const tag = el("g", {});
        tag.appendChild(el("path", {
          className: "leader",
          d: "M 517 355 L 542 388"
        }));
        tag.appendChild(el("text", {
          className: "kernel-tag",
          x: 462,
          y: 343
        }, "Conv 5" + times + "5"));
        labels.appendChild(tag);

        drawOpLabel(["Conv 11" + times + "11", "stride 4"], 70, 665, -34);
        drawOpLabel(["MaxPool"], 344, 650, -34);
        drawOpLabel(["Conv 5" + times + "5"], 435, 653, -34);
        drawOpLabel(["MaxPool"], 560, 653, -34);
        drawOpLabel(["Conv 3" + times + "3"], 690, 653, -34);
        drawOpLabel(["MaxPool + FC"], 840, 665, -34);
        drawOpLabel(["FC"], 1026, 646, -34);
        drawOpLabel(["FC"], 1098, 646, -34);
        drawOpLabel(["FC"], 1168, 646, -34);
        drawOpLabel(["Softmax"], 1216, 646, -34);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function interp(p, q, t) {
        return { x: lerp(p.x, q.x, t), y: lerp(p.y, q.y, t) };
      }

      function pointOnQuad(quad, u, v) {
        const top = interp(quad[0], quad[1], u);
        const bottom = interp(quad[3], quad[2], u);
        return interp(top, bottom, v);
      }

      function patchOnQuad(quad, u, v, fraction) {
        const half = fraction / 2;
        const u0 = Math.max(0, u - half);
        const u1 = Math.min(1, u + half);
        const v0 = Math.max(0, v - half);
        const v1 = Math.min(1, v + half);
        return [
          pointOnQuad(quad, u0, v0),
          pointOnQuad(quad, u1, v0),
          pointOnQuad(quad, u1, v1),
          pointOnQuad(quad, u0, v1)
        ];
      }

      function getBlock(flowId) {
        if (flowId === "input") {
          return document.getElementById("photoGroup");
        }
        return Object.values(volumeSpecs).find((spec) => spec.id === flowId);
      }

      function getBlockElement(flowId) {
        if (flowId === "input") {
          return document.getElementById("photoGroup");
        }
        return document.getElementById(flowId);
      }

      function setActiveFlow(flowId) {
        document.querySelectorAll(".flow-block.active").forEach((node) => node.classList.remove("active"));
        document.querySelectorAll(".arrow.active").forEach((node) => node.classList.remove("active"));

        const active = getBlockElement(flowId);
        if (active) {
          active.classList.add("active");
        }

        if (flowId === "stage1") {
          document.getElementById("arrowInput").classList.add("active");
        } else if (flowId === "stage2") {
          document.getElementById("arrow12").classList.add("active");
        } else if (flowId === "stage3") {
          document.getElementById("arrow23").classList.add("active");
        }
      }

      function setSelectedLayer(layer) {
        selectedLayer = layer;
        layerSlider.value = String(layer);
        layerReadout.textContent = String(layer);
        setActiveFlow(stageData[layer].blockId);
        updateStatus(stageData[layer]);
        renderCallout(stageData[layer]);
        renderReceptiveField();
      }

      function updateStatus(data) {
        statusLine.textContent = data.name + ": " + data.kernel + " maps " + data.prev + " to " + data.dims +
          "; spatial extent shrinks " + data.spatialFrom + " to " + data.spatialTo +
          " while channel depth grows " + data.channelFrom + " to " + data.channelTo + ".";
      }

      function renderCallout(data) {
        clear(callout);
        const spec = volumeSpecs[data.blockId];
        const center = volumeCenter(spec);
        const boxX = Math.min(Math.max(center.x - 170, 270), 820);
        const boxY = Math.max(22, spec.y - 174);

        callout.appendChild(el("rect", {
          className: "callout-box",
          x: boxX,
          y: boxY,
          width: 346,
          height: 114
        }));
        callout.appendChild(el("path", {
          className: "leader",
          d: "M " + (boxX + 172) + " " + (boxY + 114) + " L " + center.x + " " + center.y,
          "marker-end": "none",
          "stroke-width": 1.7
        }));
        callout.appendChild(el("text", {
          className: "callout-title",
          x: boxX + 18,
          y: boxY + 28
        }, "Layer " + selectedLayer + " - " + data.name + " output"));
        callout.appendChild(el("text", {
          className: "callout-text",
          x: boxX + 18,
          y: boxY + 55
        }, "Kernel: " + data.kernel + "   Result: " + data.dims));
        callout.appendChild(el("text", {
          className: "callout-text",
          x: boxX + 18,
          y: boxY + 79
        }, "Spatial size " + data.spatialFrom + " -> " + data.spatialTo + "; channels " + data.channelFrom + " -> " + data.channelTo));
        callout.appendChild(el("text", {
          className: "callout-text",
          x: boxX + 18,
          y: boxY + 101
        }, "Input receptive field: " + data.rf + times + data.rf + " pixels"));
      }

      function renderReceptiveField() {
        clear(overlay);
        if (!rfToggle.checked) {
          return;
        }

        const data = stageData[selectedLayer];
        const u = 0.56;
        const v = 0.47;
        const inputFraction = Math.max(data.rf / 224, 0.045);
        const inputPatch = patchOnQuad(inputQuad, u, v, inputFraction);
        overlay.appendChild(el("polygon", {
          className: "rf-patch",
          points: points(inputPatch)
        }));

        const currentSpec = volumeSpecs[data.blockId];
        const currentPoint = pointOnQuad(faceQuad(currentSpec), u, v);
        overlay.appendChild(el("circle", {
          className: "activation",
          cx: currentPoint.x,
          cy: currentPoint.y,
          r: 8
        }));

        const inputCenter = pointOnQuad(inputQuad, u, v);
        overlay.appendChild(el("path", {
          className: "rf-line",
          d: "M " + inputCenter.x + " " + inputCenter.y + " C " +
            (inputCenter.x + 150) + " " + (inputCenter.y - 100) + ", " +
            (currentPoint.x - 90) + " " + (currentPoint.y - 80) + ", " +
            currentPoint.x + " " + currentPoint.y
        }));

        if (data.prevBlockId && data.prevBlockId !== "input") {
          const prevSpec = volumeSpecs[data.prevBlockId];
          const prevPatch = patchOnQuad(faceQuad(prevSpec), u, v, Math.max(data.prevFraction, 0.15));
          const prevCenter = pointOnQuad(faceQuad(prevSpec), u, v);
          overlay.appendChild(el("polygon", {
            className: "rf-prev",
            points: points(prevPatch)
          }));
          overlay.appendChild(el("path", {
            className: "rf-line",
            d: "M " + prevCenter.x + " " + prevCenter.y + " L " + currentPoint.x + " " + currentPoint.y
          }));
        }

        const textX = Math.min(currentPoint.x + 24, 1045);
        const textY = Math.max(currentPoint.y - 76, 92);
        overlay.appendChild(el("rect", {
          x: textX - 10,
          y: textY - 23,
          width: 268,
          height: 66,
          rx: 7,
          fill: "rgba(255,255,255,0.92)",
          stroke: "#deb15e",
          "stroke-width": 1.5
        }));
        overlay.appendChild(el("text", {
          className: "callout-text",
          x: textX,
          y: textY
        }, "Selected activation"));
        overlay.appendChild(el("text", {
          className: "callout-text",
          x: textX,
          y: textY + 22
        }, "Input RF: " + data.rf + times + data.rf + " pixels"));
        overlay.appendChild(el("text", {
          className: "callout-text",
          x: textX,
          y: textY + 44
        }, data.prevWindow));
      }

      function advanceFlow() {
        const flowId = flowOrder[flowIndex % flowOrder.length];
        setActiveFlow(flowId);

        if (flowId === "input") {
          statusLine.textContent = "Input image: 224" + times + "224" + times + "3 color samples enter the convolutional stack.";
          clear(callout);
          clear(overlay);
        } else {
          const layer = flowId === "stage1" ? 1 : flowId === "stage2" ? 2 : 3;
          selectedLayer = layer;
          layerSlider.value = String(layer);
          layerReadout.textContent = String(layer);
          updateStatus(stageData[layer]);
          renderCallout(stageData[layer]);
          renderReceptiveField();
        }

        flowIndex += 1;
      }

      function playFlow() {
        if (timer) {
          pauseFlow();
          return;
        }
        flowIndex = 0;
        playButton.setAttribute("aria-pressed", "true");
        playButton.textContent = "Pause animation";
        advanceFlow();
        timer = window.setInterval(advanceFlow, 1450);
      }

      function pauseFlow() {
        if (!timer) {
          return;
        }
        window.clearInterval(timer);
        timer = null;
        playButton.setAttribute("aria-pressed", "false");
        playButton.textContent = "Animate data flow";
      }

      renderStaticFigure();
      setSelectedLayer(1);

      layerSlider.addEventListener("input", (event) => {
        pauseFlow();
        setSelectedLayer(Number(event.target.value));
      });

      rfToggle.addEventListener("change", () => {
        renderReceptiveField();
      });

      playButton.addEventListener("click", playFlow);

      svg.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          pauseFlow();
          setSelectedLayer(Math.min(3, selectedLayer + 1));
        } else if (event.key === "ArrowLeft") {
          pauseFlow();
          setSelectedLayer(Math.max(1, selectedLayer - 1));
        }
      });
    })();
  </script>
</body>
