<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galilean Telescope Ray Geometry</title>
  <style>
    :root {
      --ink: #20242a;
      --muted: #65707f;
      --panel: #ffffff;
      --edge: #d9e1ec;
      --blue: #0b49ff;
      --purple: #cf6df5;
      --purple-dark: #9c35da;
      --green: #137a57;
      --amber: #a85d04;
      --soft: #f5f7fb;
      --shadow: 0 18px 45px rgba(29, 42, 66, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--soft);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .figure-shell {
      width: min(1260px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: stretch;
    }

    .stage,
    .controls {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      min-width: 0;
      padding: 10px;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 760px;
      height: min(72vh, 650px);
      min-height: 460px;
      background: #fff;
      border-radius: 6px;
      touch-action: none;
      user-select: none;
    }

    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .metric {
      border: 1px solid #dbe7f5;
      background: linear-gradient(180deg, #f8fbff, #ffffff);
      border-radius: 8px;
      padding: 12px;
    }

    .metric-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .metric-value {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--blue);
      font-weight: 800;
      font-size: 1.55rem;
      line-height: 1.1;
    }

    .metric-value small {
      color: var(--muted);
      font-weight: 650;
      font-size: 0.88rem;
    }

    .control {
      display: grid;
      gap: 8px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink);
      font-size: 0.93rem;
      font-weight: 700;
    }

    output,
    .status {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .readouts {
      display: grid;
      gap: 8px;
      border-top: 1px solid #e7edf5;
      padding-top: 12px;
      font-size: 0.9rem;
    }

    .readout-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    button {
      border: 1px solid #bdd0e7;
      background: #eef6ff;
      color: #134880;
      border-radius: 7px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #e1f0ff;
    }

    .axis {
      stroke: var(--blue);
      stroke-width: 1.35;
    }

    .lens {
      fill: #fff;
      stroke: #050505;
      stroke-width: 4.2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ray {
      fill: none;
      stroke: var(--purple);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ray.strong {
      stroke-width: 5.2;
    }

    .ray.fine {
      stroke-width: 2.3;
      opacity: 0.82;
    }

    .virtual {
      fill: none;
      stroke: var(--purple);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 5 7;
      opacity: 0.86;
      vector-effect: non-scaling-stroke;
    }

    .bracket {
      fill: none;
      stroke: #111;
      stroke-width: 2;
      stroke-linecap: square;
      vector-effect: non-scaling-stroke;
    }

    .blue-label {
      fill: var(--blue);
      font: 30px Georgia, "Times New Roman", serif;
      font-weight: 700;
    }

    .math-label {
      fill: #111;
      font: italic 30px Georgia, "Times New Roman", serif;
    }

    .small-label {
      fill: #111;
      font: 20px Inter, ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
    }

    .guide-label {
      fill: var(--muted);
      font: 14px Inter, ui-sans-serif, system-ui, sans-serif;
      font-weight: 750;
    }

    .drag-handle {
      cursor: grab;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .input-knob {
      fill: #1d2530;
      stroke: #fff;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .lens-hotspot {
      fill: transparent;
      cursor: ew-resize;
    }

    .focal-dot {
      fill: var(--blue);
    }

    .focal-point {
      fill: var(--purple-dark);
    }

    .angle-arc {
      fill: none;
      stroke: #050505;
      stroke-width: 2.2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .angle-reference {
      stroke: #1f5fff;
      stroke-width: 1.1;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 920px) {
      body {
        padding: 10px;
      }

      .figure-shell {
        grid-template-columns: 1fr;
      }

      svg {
        height: min(62vh, 540px);
        min-height: 390px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive Galilean telescope ray diagram">
    <section class="stage">
      <svg id="diagram" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
        <title id="title">Two-lens Galilean telescope ray geometry</title>
        <desc id="desc">A convex objective lens and concave eyepiece lens bend two parallel input rays into a magnified parallel output bundle in the afocal setting.</desc>
        <defs>
          <marker id="arrowBlack" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#050505"></path>
          </marker>
          <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf6df5"></path>
          </marker>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <line id="axis" class="axis" x1="35" y1="250" x2="1165" y2="250"></line>

        <g id="brackets">
          <path id="f1Bracket" class="bracket"></path>
          <path id="f2Bracket" class="bracket"></path>
          <text id="f1Label" class="math-label" text-anchor="middle">f<tspan baseline-shift="sub" font-size="18">1</tspan></text>
          <text id="f2Label" class="math-label" text-anchor="middle">f<tspan baseline-shift="sub" font-size="18">2</tspan></text>
        </g>

        <g id="rays">
          <polyline id="rayTop" class="ray strong" points=""></polyline>
          <polyline id="rayBottom" class="ray fine" points=""></polyline>
          <path id="virtualFocus" class="virtual"></path>
        </g>

        <g id="focalMarker">
          <circle id="axisDot" class="focal-dot" r="6.5"></circle>
          <line id="dLine" x1="0" y1="0" x2="0" y2="0" stroke="#111" stroke-width="3" marker-end="url(#arrowBlack)" vector-effect="non-scaling-stroke"></line>
          <circle id="focalPoint" class="focal-point" r="6.5"></circle>
          <text id="dLabel" class="small-label">d</text>
        </g>

        <g id="lenses">
          <path id="lens1" class="lens"></path>
          <path id="lens2" class="lens drag-handle"></path>
          <rect id="lens2Hotspot" class="lens-hotspot" width="70" height="240" rx="4"></rect>
          <text id="lens1Label" class="blue-label" text-anchor="middle">lens 1</text>
          <text id="lens2Label" class="blue-label" text-anchor="middle">lens 2</text>
        </g>

        <g id="angles">
          <line id="inputReference" class="angle-reference"></line>
          <path id="inputArc" class="angle-arc" marker-end="url(#arrowBlack)"></path>
          <text id="deltaI1" class="math-label" text-anchor="end">&delta;<tspan baseline-shift="sub" font-size="18">i</tspan></text>
          <text id="deltaI2" class="math-label" text-anchor="end">&delta;<tspan baseline-shift="sub" font-size="18">i</tspan></text>
          <circle id="angleHandle" class="input-knob drag-handle" r="6"></circle>

          <line id="outputReference" class="angle-reference"></line>
          <path id="outputArc" class="angle-arc" marker-end="url(#arrowBlack)"></path>
          <text id="deltaO" class="math-label">&delta;<tspan baseline-shift="sub" font-size="18">o</tspan></text>
        </g>

        <text id="separationNote" class="guide-label" text-anchor="middle"></text>
      </svg>
    </section>

    <aside class="controls" aria-label="Telescope controls">
      <div class="metric">
        <p class="metric-label">Afocal angular magnification</p>
        <div class="metric-value"><span id="magText">3.44x</span><small id="magFormula">&delta;<sub>o</sub>/&delta;<sub>i</sub> = f<sub>1</sub>/f<sub>2</sub></small></div>
      </div>

      <label class="control">
        <span class="control-header">
          <span>Objective focal length f<sub>1</sub></span>
          <output id="f1Out">55.0 cm</output>
        </span>
        <input id="f1Slider" type="range" min="42" max="64" value="55" step="0.5">
      </label>

      <label class="control">
        <span class="control-header">
          <span>Eyepiece focal length f<sub>2</sub></span>
          <output id="f2Out">16.0 cm</output>
        </span>
        <input id="f2Slider" type="range" min="10" max="22" value="16" step="0.5">
      </label>

      <button id="resetSpacing" type="button">Set afocal spacing</button>

      <div class="readouts" aria-live="polite">
        <div class="readout-line">
          <span>Input angle &delta;<sub>i</sub></span>
          <span id="angleInOut" class="status">4.8&deg;</span>
        </div>
        <div class="readout-line">
          <span>Central exit angle &delta;<sub>o</sub></span>
          <span id="angleOutOut" class="status">16.3&deg;</span>
        </div>
        <div class="readout-line">
          <span>Lens separation</span>
          <span id="sepOut" class="status">39.0 cm</span>
        </div>
        <div class="readout-line">
          <span>Exit beam</span>
          <span id="beamOut" class="status">parallel</span>
        </div>
      </div>
    </aside>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("diagram");
      const axisY = 250;
      const leftX = 45;
      const rightX = 1168;
      const x1 = 350;
      const scale = 10;
      const lensMinGap = 176;
      const lensMaxX = 1030;
      const rayHeights = [axisY - 68, axisY - 8];

      const state = {
        f1: 55,
        f2: 16,
        angleDeg: 4.8,
        lens2OffsetPx: 0
      };

      const els = {
        rayTop: document.getElementById("rayTop"),
        rayBottom: document.getElementById("rayBottom"),
        virtualFocus: document.getElementById("virtualFocus"),
        lens1: document.getElementById("lens1"),
        lens2: document.getElementById("lens2"),
        lens2Hotspot: document.getElementById("lens2Hotspot"),
        lens1Label: document.getElementById("lens1Label"),
        lens2Label: document.getElementById("lens2Label"),
        f1Bracket: document.getElementById("f1Bracket"),
        f2Bracket: document.getElementById("f2Bracket"),
        f1Label: document.getElementById("f1Label"),
        f2Label: document.getElementById("f2Label"),
        axisDot: document.getElementById("axisDot"),
        dLine: document.getElementById("dLine"),
        focalPoint: document.getElementById("focalPoint"),
        dLabel: document.getElementById("dLabel"),
        inputReference: document.getElementById("inputReference"),
        inputArc: document.getElementById("inputArc"),
        outputReference: document.getElementById("outputReference"),
        outputArc: document.getElementById("outputArc"),
        deltaI1: document.getElementById("deltaI1"),
        deltaI2: document.getElementById("deltaI2"),
        deltaO: document.getElementById("deltaO"),
        angleHandle: document.getElementById("angleHandle"),
        separationNote: document.getElementById("separationNote"),
        f1Slider: document.getElementById("f1Slider"),
        f2Slider: document.getElementById("f2Slider"),
        f1Out: document.getElementById("f1Out"),
        f2Out: document.getElementById("f2Out"),
        magText: document.getElementById("magText"),
        angleInOut: document.getElementById("angleInOut"),
        angleOutOut: document.getElementById("angleOutOut"),
        sepOut: document.getElementById("sepOut"),
        beamOut: document.getElementById("beamOut"),
        resetSpacing: document.getElementById("resetSpacing")
      };

      let activeDrag = null;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function fmt(value, digits) {
        return value.toFixed(digits);
      }

      function pt(x, y) {
        return fmt(x, 1) + "," + fmt(y, 1);
      }

      function toRad(deg) {
        return deg * Math.PI / 180;
      }

      function toDeg(rad) {
        return rad * 180 / Math.PI;
      }

      function svgPoint(evt) {
        const p = svg.createSVGPoint();
        p.x = evt.clientX;
        p.y = evt.clientY;
        return p.matrixTransform(svg.getScreenCTM().inverse());
      }

      function lens1Path(cx) {
        return [
          "M", cx, axisY - 174,
          "C", cx - 12, axisY - 92, cx - 12, axisY + 92, cx, axisY + 174,
          "C", cx + 12, axisY + 92, cx + 12, axisY - 92, cx, axisY - 174,
          "Z"
        ].join(" ");
      }

      function lens2Path(cx) {
        return [
          "M", cx - 11, axisY - 96,
          "C", cx - 2, axisY - 48, cx - 2, axisY + 48, cx - 11, axisY + 96,
          "L", cx + 11, axisY + 96,
          "C", cx + 2, axisY + 48, cx + 2, axisY - 48, cx + 11, axisY - 96,
          "Z"
        ].join(" ");
      }

      function bracketPath(xa, xb, y) {
        return [
          "M", xa, y - 8,
          "L", xa, y + 8,
          "M", xa, y,
          "L", xb, y,
          "M", xb, y - 8,
          "L", xb, y + 8
        ].join(" ");
      }

      function arcPath(cx, cy, radius, startAngle, endAngle) {
        const sx = cx + radius * Math.cos(startAngle);
        const sy = cy + radius * Math.sin(startAngle);
        const ex = cx + radius * Math.cos(endAngle);
        const ey = cy + radius * Math.sin(endAngle);
        const largeArc = Math.abs(endAngle - startAngle) > Math.PI ? 1 : 0;
        const sweep = endAngle >= startAngle ? 1 : 0;
        return "M " + fmt(sx, 1) + " " + fmt(sy, 1) +
          " A " + radius + " " + radius + " 0 " + largeArc + " " + sweep + " " +
          fmt(ex, 1) + " " + fmt(ey, 1);
      }

      function classifyBeam(rays) {
        const lensGap = Math.abs(rays[0].y2 - rays[1].y2);
        const farGap = Math.abs(rays[0].yRight - rays[1].yRight);
        const slopeGap = Math.abs(rays[0].mOut - rays[1].mOut);
        if (slopeGap < 0.0008) {
          return "parallel";
        }
        return farGap < lensGap ? "converging" : "diverging";
      }

      function geometry() {
        const f1px = state.f1 * scale;
        const f2px = state.f2 * scale;
        const mIn = Math.tan(toRad(state.angleDeg));
        const xFocus = x1 + f1px;
        const yFocus = axisY + f1px * mIn;
        const afocalX2 = xFocus - f2px;
        const minX2 = x1 + lensMinGap;
        const maxX2 = Math.min(lensMaxX, rightX - f2px - 35);
        const x2 = clamp(afocalX2 + state.lens2OffsetPx, minX2, maxX2);
        state.lens2OffsetPx = x2 - afocalX2;

        const rays = rayHeights.map((yAtLens1) => {
          const yLeft = yAtLens1 - mIn * (x1 - leftX);
          const mBetween = (yFocus - yAtLens1) / f1px;
          const y2 = yAtLens1 + mBetween * (x2 - x1);
          const mOut = mBetween + (y2 - axisY) / f2px;
          const yRight = y2 + mOut * (rightX - x2);
          return { yLeft, yAtLens1, mBetween, y2, mOut, yRight };
        });

        const avgMOut = (rays[0].mOut + rays[1].mOut) / 2;
        return {
          f1px,
          f2px,
          mIn,
          xFocus,
          yFocus,
          afocalX2,
          x2,
          maxX2,
          rays,
          avgMOut,
          beam: classifyBeam(rays),
          separationCm: (x2 - x1) / scale,
          magnification: state.f1 / state.f2
        };
      }

      function render() {
        const g = geometry();

        els.lens1.setAttribute("d", lens1Path(x1));
        els.lens2.setAttribute("d", lens2Path(g.x2));
        els.lens2Hotspot.setAttribute("x", g.x2 - 35);
        els.lens2Hotspot.setAttribute("y", axisY - 120);
        els.lens1Label.setAttribute("x", x1 + 8);
        els.lens1Label.setAttribute("y", axisY - 190);
        els.lens2Label.setAttribute("x", g.x2 + 4);
        els.lens2Label.setAttribute("y", axisY - 126);

        els.rayTop.setAttribute("points", [
          pt(leftX, g.rays[0].yLeft),
          pt(x1, g.rays[0].yAtLens1),
          pt(g.x2, g.rays[0].y2),
          pt(rightX, g.rays[0].yRight)
        ].join(" "));
        els.rayBottom.setAttribute("points", [
          pt(leftX, g.rays[1].yLeft),
          pt(x1, g.rays[1].yAtLens1),
          pt(g.x2, g.rays[1].y2),
          pt(rightX, g.rays[1].yRight)
        ].join(" "));
        els.virtualFocus.setAttribute("d", "M " + pt(g.x2, g.rays[0].y2) + " L " + pt(g.xFocus, g.yFocus));

        els.axisDot.setAttribute("cx", g.xFocus);
        els.axisDot.setAttribute("cy", axisY);
        const dDelta = g.yFocus - axisY;
        const dSign = dDelta >= 0 ? 1 : -1;
        const dStart = Math.abs(dDelta) > 20 ? axisY + dSign * 7 : axisY;
        const dEnd = Math.abs(dDelta) > 20 ? g.yFocus - dSign * 8 : g.yFocus;
        els.dLine.setAttribute("x1", g.xFocus);
        els.dLine.setAttribute("y1", dStart);
        els.dLine.setAttribute("x2", g.xFocus);
        els.dLine.setAttribute("y2", dEnd);
        els.focalPoint.setAttribute("cx", g.xFocus);
        els.focalPoint.setAttribute("cy", g.yFocus);
        els.dLabel.setAttribute("x", g.xFocus + 12);
        els.dLabel.setAttribute("y", (axisY + g.yFocus) / 2 + 6);

        const f1Y = axisY + 205;
        const f2Y = axisY + 154;
        els.f1Bracket.setAttribute("d", bracketPath(x1, g.xFocus, f1Y));
        els.f2Bracket.setAttribute("d", bracketPath(g.x2, g.x2 + g.f2px, f2Y));
        els.f1Label.setAttribute("x", (x1 + g.xFocus) / 2);
        els.f1Label.setAttribute("y", f1Y - 16);
        els.f2Label.setAttribute("x", g.x2 + g.f2px / 2);
        els.f2Label.setAttribute("y", f2Y - 16);

        const handleX = leftX + 44;
        const handleY = g.rays[0].yAtLens1 - g.mIn * (x1 - handleX);
        els.angleHandle.setAttribute("cx", handleX);
        els.angleHandle.setAttribute("cy", handleY);

        els.inputReference.setAttribute("x1", leftX + 12);
        els.inputReference.setAttribute("x2", leftX + 120);
        els.inputReference.setAttribute("y1", axisY);
        els.inputReference.setAttribute("y2", axisY);
        els.inputArc.setAttribute("d", arcPath(leftX + 25, axisY, 27, 0, Math.atan(g.mIn)));
        els.deltaI1.setAttribute("x", leftX - 7);
        els.deltaI1.setAttribute("y", handleY + 13);
        els.deltaI2.setAttribute("x", leftX - 8);
        els.deltaI2.setAttribute("y", axisY - 5);

        const outAngle = Math.atan(g.avgMOut);
        const outCx = Math.min(rightX - 210, Math.max(g.x2 + 205, g.xFocus + 95));
        els.outputReference.setAttribute("x1", outCx - 16);
        els.outputReference.setAttribute("x2", outCx + 112);
        els.outputReference.setAttribute("y1", axisY);
        els.outputReference.setAttribute("y2", axisY);
        els.outputArc.setAttribute("d", arcPath(outCx, axisY, 36, 0, outAngle));
        els.deltaO.setAttribute("x", outCx + 48);
        els.deltaO.setAttribute("y", axisY + 48);

        const spacingErrorCm = (g.x2 - g.afocalX2) / scale;
        els.separationNote.setAttribute("x", g.x2);
        els.separationNote.setAttribute("y", axisY + 126);
        els.separationNote.textContent = Math.abs(spacingErrorCm) < 0.08 ? "afocal spacing" : (spacingErrorCm > 0 ? "+" : "") + fmt(spacingErrorCm, 1) + " cm from afocal";

        els.f1Out.textContent = fmt(state.f1, 1) + " cm";
        els.f2Out.textContent = fmt(state.f2, 1) + " cm";
        els.magText.textContent = fmt(g.magnification, 2) + "x";
        els.angleInOut.textContent = fmt(state.angleDeg, 1) + "\u00b0";
        els.angleOutOut.textContent = fmt(toDeg(Math.atan(g.avgMOut)), 1) + "\u00b0";
        els.sepOut.textContent = fmt(g.separationCm, 1) + " cm";
        els.beamOut.textContent = g.beam;
        els.beamOut.style.color = g.beam === "parallel" ? "var(--green)" : "var(--amber)";
      }

      function startDrag(kind, evt) {
        activeDrag = kind;
        evt.preventDefault();
        if (evt.currentTarget.setPointerCapture) {
          evt.currentTarget.setPointerCapture(evt.pointerId);
        }
      }

      function onPointerMove(evt) {
        if (!activeDrag) {
          return;
        }
        const p = svgPoint(evt);
        const g = geometry();

        if (activeDrag === "angle") {
          const fixedX = leftX + 44;
          const yAtLens = rayHeights[0];
          const slope = (yAtLens - p.y) / (x1 - fixedX);
          state.angleDeg = clamp(toDeg(Math.atan(slope)), 1.0, 8.5);
        }

        if (activeDrag === "lens2") {
          const x2 = clamp(p.x, x1 + lensMinGap, g.maxX2);
          state.lens2OffsetPx = x2 - g.afocalX2;
        }

        render();
      }

      function endDrag() {
        activeDrag = null;
      }

      els.f1Slider.addEventListener("input", function () {
        state.f1 = Number(els.f1Slider.value);
        state.lens2OffsetPx = 0;
        render();
      });

      els.f2Slider.addEventListener("input", function () {
        state.f2 = Number(els.f2Slider.value);
        state.lens2OffsetPx = 0;
        render();
      });

      els.resetSpacing.addEventListener("click", function () {
        state.lens2OffsetPx = 0;
        render();
      });

      els.angleHandle.addEventListener("pointerdown", startDrag.bind(null, "angle"));
      els.rayTop.addEventListener("pointerdown", startDrag.bind(null, "angle"));
      els.rayBottom.addEventListener("pointerdown", startDrag.bind(null, "angle"));
      els.lens2.addEventListener("pointerdown", startDrag.bind(null, "lens2"));
      els.lens2Hotspot.addEventListener("pointerdown", startDrag.bind(null, "lens2"));
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", endDrag);
      window.addEventListener("pointercancel", endDrag);

      render();
    }());
  </script>
</body>
</html>
