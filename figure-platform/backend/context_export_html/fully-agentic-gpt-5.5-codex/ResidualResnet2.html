<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResidualResnet2 Interactive Figure</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #121820;
      --muted: #536677;
      --panel: #eef3f5;
      --panel-edge: #101418;
      --blue-front: #b7d1dc;
      --blue-top: #d5e6ed;
      --blue-side: #7fa3b4;
      --orange-front: #b7663c;
      --orange-top: #eaa07d;
      --orange-side: #78391f;
      --green: #9fd5ce;
      --amber: #d58359;
      --active: #f2b84b;
      --path: #1d3442;
      --skip: #6d4cc2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f8f8;
      color: var(--ink);
    }

    main.figure-shell {
      width: min(100vw, 1540px);
      padding: 12px;
    }

    .canvas-wrap {
      position: relative;
      background: #fff;
      border: 1px solid #dbe3e7;
      box-shadow: 0 18px 44px rgba(22, 35, 46, 0.11);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 520px;
      touch-action: manipulation;
    }

    .controls {
      position: absolute;
      left: 18px;
      top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d4dee3;
      border-radius: 8px;
      box-shadow: 0 7px 18px rgba(35, 45, 54, 0.12);
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .control-block {
      display: grid;
      gap: 3px;
      min-width: 176px;
    }

    .control-label {
      color: #263642;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    input[type="range"] {
      width: 172px;
      accent-color: #315c75;
    }

    button {
      border: 1px solid #1c3545;
      background: #244b63;
      color: #fff;
      border-radius: 7px;
      padding: 8px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #163647;
      outline: 2px solid #9dc4d7;
      outline-offset: 2px;
    }

    .hint {
      position: absolute;
      right: 18px;
      bottom: 14px;
      max-width: min(390px, calc(100% - 36px));
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #d4dee3;
      border-radius: 8px;
      color: #344653;
      font-size: 13px;
      line-height: 1.35;
      box-shadow: 0 7px 18px rgba(35, 45, 54, 0.12);
      z-index: 2;
    }

    .svg-label {
      font-family: Georgia, "Times New Roman", serif;
      fill: #0b0f13;
      font-size: 28px;
    }

    .ui-label {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      fill: #1b2b35;
      font-size: 16px;
      font-weight: 700;
    }

    .small-label {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      fill: #334c5a;
      font-size: 14px;
      font-weight: 650;
    }

    .tiny-label {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      fill: #435663;
      font-size: 12px;
      font-weight: 650;
    }

    .rotated-label {
      font-size: 24px;
      font-style: italic;
    }

    .stage-hit {
      fill: transparent;
      cursor: pointer;
    }

    .stage-outline {
      fill: none;
      stroke: transparent;
      stroke-width: 4;
      pointer-events: none;
      transition: stroke 160ms ease, opacity 160ms ease;
    }

    .stage-group:hover .stage-outline,
    .stage-group.selected .stage-outline {
      stroke: #e7a93c;
      opacity: 0.9;
    }

    .stage-group:hover .click-target,
    .stage-group.selected .click-target {
      filter: url(#stageGlow);
    }

    .feature-edge,
    .flow-edge {
      stroke: #0f151a;
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .main-line,
    .skip-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrowBlack);
    }

    .main-line {
      stroke: var(--path);
      stroke-width: 2.4;
    }

    .skip-line {
      stroke: var(--skip);
      stroke-width: 2.4;
    }

    .active-stroke {
      stroke: var(--active);
      stroke-width: 5;
      filter: url(#softGlow);
    }

    .repeat-tick {
      fill: #acc7d2;
      stroke: #1a2830;
      stroke-width: 1.25;
      rx: 2;
    }

    .repeat-tick.major {
      fill: #84a9b9;
    }

    .subsample {
      fill: #b7cbd5;
      stroke: #0f151a;
      stroke-width: 1.7;
    }

    .dim-line {
      stroke: #0c1013;
      stroke-width: 2;
      fill: none;
      marker-start: url(#arrowTiny);
      marker-end: url(#arrowTiny);
    }

    .dash {
      stroke-dasharray: 7 8;
    }

    .detail-card {
      fill: #c8d1d4;
      stroke: #0e1215;
      stroke-width: 2.2;
    }

    .layer-box {
      stroke: #10161a;
      stroke-width: 1.25;
      rx: 6;
    }

    .conv {
      fill: #d6dde0;
    }

    .bn {
      fill: var(--amber);
    }

    .relu {
      fill: var(--green);
    }

    .flow-particle {
      filter: url(#softGlow);
    }

    .add-ring {
      fill: #dfe7ea;
      stroke: #0f151a;
      stroke-width: 1.8;
      transition: fill 160ms ease, transform 160ms ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .add-ring.hot {
      fill: #ffd56b;
      transform: scale(1.16);
    }

    .zoom-connector {
      stroke: #e0a233;
      stroke-width: 2.4;
      stroke-dasharray: 7 6;
      fill: none;
      opacity: 0.9;
      marker-end: url(#arrowGold);
    }

    @media (max-width: 760px) {
      main.figure-shell {
        padding: 0;
      }

      .canvas-wrap {
        border-left: 0;
        border-right: 0;
      }

      svg {
        min-height: 650px;
      }

      .controls {
        position: static;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
        flex-wrap: wrap;
      }

      .hint {
        position: static;
        max-width: none;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive ResNet residual architecture figure">
    <div class="canvas-wrap">
      <div class="controls" aria-label="Figure controls">
        <div class="control-block">
          <label class="control-label" for="depthSlider">Depth: <span id="depthLabel">24 blocks</span></label>
          <input id="depthSlider" type="range" min="0" max="1" step="1" value="0" aria-valuemin="24" aria-valuemax="36" aria-valuenow="24" />
        </div>
        <button id="animateBtn" type="button">Animate block</button>
      </div>

      <svg id="resnetSvg" viewBox="0 0 1540 760" role="img" aria-labelledby="figTitle figDesc">
        <title id="figTitle">Deep residual network architecture with an interactive bottleneck residual block</title>
        <desc id="figDesc">A ResNet tensor flow from 224 by 224 by 3 input through convolution, residual stages, average pooling, fully connected layer and softmax. The residual-block inset shows a main convolution path, skip connection, and addition.</desc>
        <defs>
          <linearGradient id="photoGrad" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#090909" />
            <stop offset="0.37" stop-color="#4d2307" />
            <stop offset="0.59" stop-color="#dc921e" />
            <stop offset="0.72" stop-color="#3c1607" />
            <stop offset="1" stop-color="#050505" />
          </linearGradient>
          <linearGradient id="blueFront" x1="0" x2="1">
            <stop offset="0" stop-color="#c7dce5" />
            <stop offset="1" stop-color="#9fbfce" />
          </linearGradient>
          <linearGradient id="orangeFront" x1="0" x2="1">
            <stop offset="0" stop-color="#da895f" />
            <stop offset="1" stop-color="#884426" />
          </linearGradient>
          <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="stageGlow" x="-35%" y="-35%" width="170%" height="170%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e8aa3d" flood-opacity="0.75" />
          </filter>
          <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f151a" />
          </marker>
          <marker id="arrowTiny" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#0c1013" />
          </marker>
          <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d69528" />
          </marker>
        </defs>

        <g id="detailInset" aria-label="Bottleneck residual block detail">
          <rect class="detail-card" x="470" y="16" width="1010" height="165" rx="26" />
          <text id="detailTitle" class="ui-label" x="500" y="45">conv2_x residual bottleneck</text>
          <text id="detailDim" class="tiny-label" x="500" y="67">56 x 56 spatial grid, 64-channel bottleneck, 256-channel output</text>
          <path id="skipFlowPath" class="skip-line" d="M 575 102 L 610 102 L 610 42 L 1423 42 L 1423 102 L 1458 102" />
          <path id="mainFlowPath" class="main-line" d="M 575 102 L 640 102 L 678 102 L 735 102 L 782 102 L 885 102 L 933 102 L 993 102 L 1107 102 L 1155 102 L 1217 102 L 1343 102 L 1399 102 L 1458 102" />
          <g transform="translate(510 76)">
            <polygon points="0,12 18,0 74,0 56,12" fill="#d8e7ee" class="feature-edge" />
            <rect x="0" y="12" width="56" height="52" fill="url(#blueFront)" class="feature-edge" />
            <polygon points="56,12 74,0 74,48 56,64" fill="#719bad" class="feature-edge" />
          </g>
          <text class="ui-label" x="592" y="110">=</text>

          <g id="layerChain">
            <g transform="translate(665 84)">
              <rect class="layer-box conv" x="0" y="-18" width="104" height="36" />
              <text id="squeezeLabel" class="ui-label" x="52" y="6" text-anchor="middle">Conv 1x1</text>
            </g>
            <g transform="translate(792 84)">
              <rect class="layer-box bn" x="0" y="-18" width="40" height="36" />
              <text class="ui-label" x="20" y="6" text-anchor="middle">BN</text>
            </g>
            <g transform="translate(853 84)">
              <rect class="layer-box relu" x="0" y="-18" width="58" height="36" />
              <text class="ui-label" x="29" y="6" text-anchor="middle">ReLU</text>
            </g>
            <g transform="translate(932 84)">
              <rect class="layer-box conv" x="0" y="-18" width="116" height="36" />
              <text id="spatialLabel" class="ui-label" x="58" y="6" text-anchor="middle">Conv 3x3</text>
            </g>
            <g transform="translate(1070 84)">
              <rect class="layer-box bn" x="0" y="-18" width="40" height="36" />
              <text class="ui-label" x="20" y="6" text-anchor="middle">BN</text>
            </g>
            <g transform="translate(1131 84)">
              <rect class="layer-box relu" x="0" y="-18" width="58" height="36" />
              <text class="ui-label" x="29" y="6" text-anchor="middle">ReLU</text>
            </g>
            <g transform="translate(1210 84)">
              <rect class="layer-box conv" x="0" y="-18" width="124" height="36" />
              <text id="expandLabel" class="ui-label" x="62" y="6" text-anchor="middle">Conv 1x1</text>
            </g>
          </g>
          <g id="addNode" transform="translate(1397 84)">
            <circle class="add-ring" r="13" />
            <path d="M -9 0 H 9 M 0 -9 V 9" stroke="#0f151a" stroke-width="1.8" />
          </g>
          <text id="skipLabel" class="tiny-label" x="1218" y="31">identity / projection skip carries x directly</text>
          <text id="detailOutput" class="tiny-label" x="1357" y="134">output = F(x) + x</text>
        </g>

        <g id="mainFlow" aria-label="Main ResNet tensor flow">
          <g id="inputImage">
            <polygon points="84,247 191,181 191,498 84,572" fill="url(#photoGrad)" stroke="#0a0a0a" stroke-width="3" />
            <path d="M 104 444 C 116 382 124 385 129 444 C 138 369 153 363 156 444 C 161 390 169 371 173 444" fill="none" stroke="#e38a22" stroke-width="5" stroke-linecap="round" opacity="0.76" />
            <path d="M 176 340 C 178 311 182 307 184 339 M 164 361 C 165 337 169 334 171 360 M 143 390 C 144 354 149 352 151 389" fill="none" stroke="#ffe06a" stroke-width="3" stroke-linecap="round" opacity="0.9" />
            <text class="svg-label rotated-label" x="42" y="630" transform="rotate(-34 42 630)">Conv 7x7</text>
            <text class="svg-label rotated-label" x="84" y="651" transform="rotate(-34 84 651)">Stride 2</text>
            <line class="dim-line" x1="198" y1="171" x2="318" y2="93" />
            <text class="svg-label rotated-label" x="247" y="108" transform="rotate(-34 247 108)">224 x 224 x 3</text>
          </g>

          <g id="convOut">
            <polygon points="207,345 222,336 298,336 283,345" fill="#eea37e" stroke="#101418" stroke-width="2" />
            <rect x="207" y="345" width="76" height="188" fill="url(#orangeFront)" stroke="#101418" stroke-width="2" />
            <polygon points="283,345 298,336 298,520 283,533" fill="#803f22" stroke="#101418" stroke-width="2" />
            <text class="svg-label rotated-label" x="138" y="652" transform="rotate(-34 138 652)">MaxPool</text>
            <line class="dim-line" x1="301" y1="331" x2="410" y2="258" />
            <text class="svg-label rotated-label" x="332" y="283" transform="rotate(-34 332 283)">112 x 112 x 64</text>
          </g>

          <g class="stage-group selected" id="stage1" data-stage="0" tabindex="0" role="button" aria-label="Open conv2_x stage detail">
            <rect class="stage-hit" x="300" y="387" width="210" height="179" />
            <g class="click-target" id="stage1Volume">
              <polygon points="304,441 327,426 365,426 342,441" fill="#d5e6ed" class="feature-edge" />
              <rect x="304" y="441" width="38" height="87" fill="url(#blueFront)" class="feature-edge" />
              <polygon points="342,441 365,426 365,511 342,528" fill="#719bad" class="feature-edge" />
              <polygon points="336,437 359,422 397,422 374,437" fill="#d5e6ed" class="feature-edge" />
              <rect x="336" y="437" width="38" height="87" fill="url(#blueFront)" class="feature-edge" />
              <polygon points="374,437 397,422 397,507 374,524" fill="#719bad" class="feature-edge" />
              <polygon points="368,433 391,418 429,418 406,433" fill="#d5e6ed" class="feature-edge" />
              <rect x="368" y="433" width="38" height="87" fill="url(#blueFront)" class="feature-edge" />
              <polygon points="406,433 429,418 429,503 406,520" fill="#719bad" class="feature-edge" />
            </g>
            <rect class="stage-outline" x="296" y="414" width="140" height="122" rx="6" />
            <text class="svg-label rotated-label" x="289" y="627" transform="rotate(-34 289 627)">Subsample</text>
            <text class="svg-label rotated-label" x="346" y="381" transform="rotate(-34 346 381)">ResBlock</text>
            <text class="svg-label rotated-label" x="334" y="430" transform="rotate(-34 334 430)">56 x 56 x 256(64)</text>
            <path class="dim-line" d="M 341 408 L 459 357" />
            <g id="stageTicks0"></g>
            <text id="stageCount0" class="small-label" x="334" y="566" text-anchor="middle">3 residual blocks</text>
          </g>

          <g id="transition12" aria-label="Subsample transition to 28 by 28">
            <path class="main-line" d="M 438 482 L 499 482" />
            <g transform="translate(490 426)">
              <polygon points="0,14 18,2 70,2 52,14" fill="#d5e6ed" class="feature-edge" />
              <rect x="0" y="14" width="52" height="55" class="subsample" />
              <polygon points="52,14 70,2 70,56 52,69" fill="#719bad" class="feature-edge" />
            </g>
            <text class="svg-label rotated-label" x="481" y="651" transform="rotate(-34 481 651)">Subsample</text>
          </g>

          <g class="stage-group" id="stage2" data-stage="1" tabindex="0" role="button" aria-label="Open conv3_x stage detail">
            <rect class="stage-hit" x="535" y="387" width="225" height="175" />
            <g class="click-target" id="stage2Volume">
              <polygon points="560,484 581,472 691,472 669,484" fill="#d5e6ed" class="feature-edge" />
              <rect x="560" y="484" width="109" height="27" fill="url(#blueFront)" class="feature-edge" />
              <polygon points="669,484 691,472 691,498 669,511" fill="#719bad" class="feature-edge" />
            </g>
            <rect class="stage-outline" x="552" y="468" width="147" height="50" rx="6" />
            <text class="svg-label rotated-label" x="561" y="378" transform="rotate(-34 561 378)">ResBlock</text>
            <text class="svg-label rotated-label" x="544" y="430" transform="rotate(-34 544 430)">28 x 28 x 512(128)</text>
            <path class="dim-line" d="M 589 455 L 726 402" />
            <g id="stageTicks1"></g>
            <text id="stageCount1" class="small-label" x="619" y="566" text-anchor="middle">4 residual blocks</text>

          <g id="transition23" aria-label="Subsample transition to 14 by 14">
            <path class="main-line" d="M 705 498 L 767 498" />
            <g transform="translate(763 470)">
              <rect x="0" y="0" width="54" height="25" class="subsample" />
            </g>
            <text class="svg-label rotated-label" x="708" y="655" transform="rotate(-34 708 655)">Subsample</text>
          </g>

          <g class="stage-group" id="stage3" data-stage="2" tabindex="0" role="button" aria-label="Open conv4_x stage detail">
            <rect class="stage-hit" x="812" y="387" width="368" height="173" />
            <g class="click-target" id="stage3Volume">
              <polygon points="826,503 848,491 1006,491 984,503" fill="#d5e6ed" class="feature-edge" />
              <rect x="826" y="503" width="158" height="23" fill="url(#blueFront)" class="feature-edge" />
              <polygon points="984,503 1006,491 1006,513 984,526" fill="#719bad" class="feature-edge" />

            <text class="svg-label rotated-label" x="791" y="442" transform="rotate(-34 791 442)">14 x 14 x 1024(256)</text>
            <path class="dim-line" d="M 872 476 L 1012 424" />
            <g id="stageTicks2"></g>
            <text id="stageCount2" class="small-label" x="1018" y="566" text-anchor="middle">14 residual blocks</text>
          </g>

          <g id="transition34" aria-label="Subsample transition to 7 by 7">
            <path class="main-line" d="M 1216 524 L 1258 524" />
            <text class="svg-label rotated-label" x="1116" y="657" transform="rotate(-34 1116 657)">Subsample</text>
          </g>

          <g class="stage-group" id="stage4" data-stage="3" tabindex="0" role="button" aria-label="Open conv5_x stage detail">
            <rect class="stage-hit" x="1240" y="371" width="190" height="189" />
            <g class="click-target" id="stage4Volume">
              <polygon points="1248,523 1269,512 1424,512 1403,523" fill="#d5e6ed" class="feature-edge" />
              <rect x="1248" y="523" width="155" height="19" fill="url(#blueFront)" class="feature-edge" />
              <polygon points="1403,523 1424,512 1424,530 1403,542" fill="#719bad" class="feature-edge" />
            </g>
            <rect class="stage-outline" x="1238" y="505" width="192" height="44" rx="6" />
            <text class="svg-label rotated-label" x="1281" y="384" transform="rotate(-34 1281 384)">ResBlock</text>
            <text class="svg-label rotated-label" x="1270" y="429" transform="rotate(-34 1270 429)">7 x 7 x 2048(512)</text>
            <path class="dim-line" d="M 1284 493 L 1403 446" />
            <g id="stageTicks3"></g>
            <text id="stageCount3" class="small-label" x="1330" y="566" text-anchor="middle">3 residual blocks</text>
          </g>

          <g id="classifier" aria-label="Average pooling fully connected and softmax classifier">
            <path class="main-line" d="M 1428 532 L 1460 532" />
            <g transform="translate(1458 360)">
              <path d="M 8 0 H 18 V 71 L 13 65 L 8 71 Z" fill="#9ad5cc" stroke="#101418" stroke-width="2" />
              <path d="M 8 109 H 18 V 176 H 8 Z" fill="#9ad5cc" stroke="#101418" stroke-width="2" />
              <circle cx="13" cy="86" r="2" fill="#101418" />
              <circle cx="13" cy="96" r="2" fill="#101418" />
            </g>
            <g transform="translate(1496 360)">
              <path d="M 8 0 H 18 V 71 L 13 65 L 8 71 Z" fill="#9ad5cc" stroke="#101418" stroke-width="2" />
              <path d="M 8 109 H 18 V 176 H 8 Z" fill="#9ad5cc" stroke="#101418" stroke-width="2" />
              <circle cx="13" cy="86" r="2" fill="#101418" />
              <circle cx="13" cy="96" r="2" fill="#101418" />
            </g>
            <text class="svg-label rotated-label" x="1370" y="665" transform="rotate(-34 1370 665)">AvgPool + FC</text>
            <text class="svg-label rotated-label" x="1439" y="645" transform="rotate(-34 1439 645)">Softmax</text>
            <text class="svg-label" x="1430" y="350">1000</text>
            <text class="svg-label" x="1491" y="350">1000</text>
          </g>

          <g id="countAnnotations" aria-label="Total residual block count annotations">
            <text id="overallCountText" class="ui-label" x="534" y="523" text-anchor="middle">24 blocks total</text>
            <circle cx="483" cy="514" r="4" fill="#486a7a" />
            <circle cx="517" cy="514" r="4" fill="#486a7a" />
            <circle cx="550" cy="514" r="4" fill="#486a7a" />
            <circle cx="583" cy="514" r="4" fill="#486a7a" />
          </g>

          <path id="stageZoomConnector" class="zoom-connector" d="M 356 420 C 430 320 478 210 520 164" />
        </g>
      </svg>

      <div class="hint" id="hintText">Click a stage tensor to zoom the bottleneck labels for that stage. The skip path adds the input activation back after the three convolutional bottleneck path.</div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("resnetSvg");
      const svgns = "http://www.w3.org/2000/svg";
      const depthSlider = document.getElementById("depthSlider");
      const depthLabel = document.getElementById("depthLabel");
      const animateBtn = document.getElementById("animateBtn");
      const addNode = document.querySelector("#addNode .add-ring");
      const hintText = document.getElementById("hintText");

      const stages = [
        {
          id: "stage1",
          key: "conv2_x",
          title: "conv2_x residual bottleneck",
          dim: "56 x 56 x 256",
          spatial: "56 x 56",
          inChannels: 256,
          bottleneck: 64,
          outChannels: 256,
          ticksBox: { x: 306, y: 543, width: 112, height: 13 },
          connector: "M 356 420 C 430 320 478 210 520 164"
        },
        {
          id: "stage2",
          key: "conv3_x",
          title: "conv3_x residual bottleneck",
          dim: "28 x 28 x 512",
          spatial: "28 x 28",
          inChannels: 512,
          bottleneck: 128,
          outChannels: 512,
          ticksBox: { x: 555, y: 530, width: 154, height: 13 },
          connector: "M 618 470 C 690 312 725 220 754 164"
        },
        {
          id: "stage3",
          key: "conv4_x",
          title: "conv4_x residual bottleneck",
          dim: "14 x 14 x 1024",
          spatial: "14 x 14",
          inChannels: 1024,
          bottleneck: 256,
          outChannels: 1024,
          ticksBox: { x: 827, y: 545, width: 384, height: 13 },
          connector: "M 1000 493 C 987 340 980 225 1010 164"
        },
        {
          id: "stage4",
          key: "conv5_x",
          title: "conv5_x residual bottleneck",
          dim: "7 x 7 x 2048",
          spatial: "7 x 7",
          inChannels: 2048,
          bottleneck: 512,
          outChannels: 2048,
          ticksBox: { x: 1248, y: 555, width: 154, height: 13 },
          connector: "M 1332 508 C 1280 334 1245 223 1234 164"
        }
      ];

      const depthConfigs = {
        24: {
          total: 24,
          counts: [3, 4, 14, 3],
          note: "24-block setting: the deeper middle stage carries most repeated bottlenecks; tensor sizes remain unchanged."
        },
        36: {
          total: 36,
          counts: [3, 8, 22, 3],
          note: "36-block setting: more residual bottlenecks are inserted inside stages, but the stage tensor dimensions stay fixed."
        }
      };

      let currentDepth = 24;
      let selectedStageIndex = 0;

      function svgEl(name, attrs) {
        const el = document.createElementNS(svgns, name);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          el.setAttribute(key, String(value));
        });
        return el;
      }

      function setText(id, value) {
        const el = document.getElementById(id);
        if (el) {
          el.textContent = value;
        }
      }

      function drawRepeatTicks(stageIndex, count) {
        const group = document.getElementById("stageTicks" + stageIndex);
        const box = stages[stageIndex].ticksBox;
        group.replaceChildren();

        const maxTickWidth = Math.max(4, Math.min(14, (box.width - 2) / count - 2));
        const gap = count > 1 ? (box.width - count * maxTickWidth) / (count - 1) : 0;
        for (let i = 0; i < count; i += 1) {
          const tick = svgEl("rect", {
            x: box.x + i * (maxTickWidth + gap),
            y: box.y,
            width: maxTickWidth,
            height: box.height,
            class: "repeat-tick" + (i === 0 || i === count - 1 ? " major" : ""),
            rx: 2
          });
          const title = svgEl("title", {});
          title.textContent = stages[stageIndex].key + " residual block " + (i + 1) + " of " + count;
          tick.appendChild(title);
          group.appendChild(tick);
        }
      }

      function updateDepth(depth) {
        currentDepth = depth;
        const config = depthConfigs[depth];
        depthLabel.textContent = depth + " blocks";
        depthSlider.setAttribute("aria-valuenow", String(depth));
        setText("overallCountText", depth + " blocks total");

        config.counts.forEach((count, index) => {
          drawRepeatTicks(index, count);
          setText("stageCount" + index, count + " residual blocks");
        });

        const stage = stages[selectedStageIndex];
        hintText.textContent = stage.key + " selected. " + config.note + " Click another tensor block to inspect its bottleneck channel counts.";
      }

      function updateStage(index) {
        selectedStageIndex = index;
        const stage = stages[index];
        document.querySelectorAll(".stage-group").forEach((group) => group.classList.remove("selected"));
        document.getElementById(stage.id).classList.add("selected");

        setText("detailTitle", stage.title);
        setText("detailDim", stage.spatial + " spatial grid, " + stage.bottleneck + "-channel bottleneck, " + stage.outChannels + "-channel output");
        setText("squeezeLabel", "Conv 1x1");
        setText("spatialLabel", "Conv 3x3");
        setText("expandLabel", "Conv 1x1");
        setText("skipLabel", "1x1 projection skip: " + stage.inChannels + " -> " + stage.outChannels + " channels");
        setText("detailOutput", stage.dim + " output = F(x) + x");

        document.getElementById("stageZoomConnector").setAttribute("d", stage.connector);

        const convNodes = document.querySelectorAll("#layerChain .conv + text");
        if (convNodes[0]) {
          convNodes[0].textContent = "1x1: " + stage.inChannels + " -> " + stage.bottleneck;
        }
        if (convNodes[1]) {
          convNodes[1].textContent = "3x3: " + stage.bottleneck;
        }
        if (convNodes[2]) {
          convNodes[2].textContent = "1x1: " + stage.bottleneck + " -> " + stage.outChannels;
        }

        hintText.textContent = stage.key + " maps " + stage.dim + ". The bottleneck compresses to " + stage.bottleneck + " channels, applies a 3x3 spatial convolution, then expands to " + stage.outChannels + " before residual addition.";
      }

      function createParticle(pathId, color, radius, delaySeconds) {
        const particle = svgEl("circle", {
          r: radius,
          fill: color,
          class: "flow-particle"
        });
        const motion = svgEl("animateMotion", {
          dur: "2.4s",
          begin: delaySeconds + "s",
          fill: "freeze",
          calcMode: "spline",
          keySplines: "0.4 0 0.2 1",
          keyTimes: "0;1"
        });
        const mpath = svgEl("mpath", { href: "#" + pathId });
        motion.appendChild(mpath);
        particle.appendChild(motion);
        svg.appendChild(particle);
        motion.beginElement();
        return particle;
      }

      function animateForwardPass() {
        const oldParticles = svg.querySelectorAll(".flow-particle");
        oldParticles.forEach((node) => node.remove());
        addNode.classList.remove("hot");

        document.getElementById("mainFlowPath").classList.add("active-stroke");
        document.getElementById("skipFlowPath").classList.add("active-stroke");

        const particles = [
          createParticle("mainFlowPath", "#f2b84b", 7, 0),
          createParticle("mainFlowPath", "#ffd76e", 5, 0.22),
          createParticle("skipFlowPath", "#6d4cc2", 7, 0)
        ];

        window.setTimeout(() => {
          addNode.classList.add("hot");
          hintText.textContent = "The main bottleneck path computes F(x) while the skip connection carries x in parallel. At the circled plus, the tensors are added element by element.";
        }, 2100);

        window.setTimeout(() => {
          document.getElementById("mainFlowPath").classList.remove("active-stroke");
          document.getElementById("skipFlowPath").classList.remove("active-stroke");
          particles.forEach((node) => node.remove());
        }, 3300);
      }

      function wireStageInteractions() {
        stages.forEach((stage, index) => {
          const group = document.getElementById(stage.id);
          group.addEventListener("click", () => updateStage(index));
          group.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              updateStage(index);
            }
          });
        });
      }

      depthSlider.addEventListener("input", () => {
        const depth = depthSlider.value === "0" ? 24 : 36;
        updateDepth(depth);
      });

      animateBtn.addEventListener("click", animateForwardPass);

      wireStageInteractions();
      updateDepth(currentDepth);
      updateStage(0);
    })();
  </script>
</body>
</html>
