<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N2O4 and NO2 Equilibrium</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5c6670;
      --blue: #526fb8;
      --red: #c64a2b;
      --paper: #ffffff;
      --panel: #f7f8fa;
      --panel-edge: #d7dde4;
      --cream: #f7edc7;
      --active: #1f7f8d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f1f4f7;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(8px, 1.8vw, 18px);
    }

    main {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: grid;
      gap: 12px;
    }

    .stage,
    .controls {
      background: var(--paper);
      border: 1px solid var(--panel-edge);
      border-radius: 8px;
      box-shadow: 0 16px 38px rgba(25, 36, 50, 0.12);
      min-width: 0;
    }

    .stage {
      overflow-x: auto;
      padding: clamp(6px, 1vw, 12px);
      min-width: 0;
    }

    svg {
      display: block;
      width: 100%;
      max-height: calc(100vh - 230px);
      min-width: min(720px, 100%);
      height: auto;
      user-select: none;
      touch-action: none;
      background: #ffffff;
      border-radius: 6px;
    }

    .controls {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(240px, 1.25fr) minmax(210px, auto);
      gap: 12px;
      align-items: center;
    }

    label,
    button,
    input {
      font: inherit;
    }

    .range-row {
      display: grid;
      grid-template-columns: auto minmax(130px, 1fr) 5.5em;
      gap: 9px;
      align-items: center;
      min-width: 0;
      color: var(--muted);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--active);
    }

    .value {
      color: var(--ink);
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #aeb8c3;
      border-radius: 8px;
      overflow: hidden;
      background: #eef2f5;
    }

    .segmented button {
      min-height: 38px;
      border: 0;
      border-right: 1px solid #aeb8c3;
      background: transparent;
      cursor: pointer;
      color: #33404c;
      font-weight: 700;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button[aria-pressed="true"] {
      background: #ffffff;
      color: #0e6370;
      box-shadow: inset 0 -3px 0 var(--active);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(31, 127, 141, 0.28);
      outline-offset: 2px;
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(2, minmax(88px, 1fr));
      gap: 6px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .readouts b {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-top: 2px;
    }

    .caption {
      color: #53606a;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }

    .axis {
      stroke: #111111;
      stroke-width: 2.4;
      fill: none;
    }

    .curve-blue {
      stroke: var(--blue);
      stroke-width: 6;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .curve-red {
      stroke: var(--red);
      stroke-width: 6;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .molecule-bond {
      stroke: #374151;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .snapshot-shell {
      fill: #ffffff;
      stroke: #808080;
      stroke-width: 5;
    }

    .snapshot-active .snapshot-shell {
      stroke: var(--active);
      stroke-width: 7;
    }

    .snapshot-active .halo {
      opacity: 1;
    }

    .halo {
      fill: rgba(31, 127, 141, 0.10);
      stroke: rgba(31, 127, 141, 0.35);
      stroke-width: 2;
      opacity: 0;
    }

    .marker-line {
      stroke: #151515;
      stroke-width: 2.2;
      stroke-dasharray: 7 7;
    }

    .drag-target {
      fill: transparent;
      cursor: ew-resize;
    }

    .small-label {
      font-size: 21px;
      fill: var(--ink);
    }

    .panel-letter {
      font-size: 28px;
      fill: var(--ink);
    }

    #eqLabelA,
    #eqLabelB {
      paint-order: stroke;
      stroke: var(--cream);
      stroke-width: 8;
      stroke-linejoin: round;
    }

    @media (max-width: 760px) {
      body {
        place-items: start center;
      }

      svg {
        min-width: 0;
        max-width: 100%;
        max-height: none;
      }

      .controls {
        grid-template-columns: 1fr;
        overflow: hidden;
      }

      .readouts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .caption {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Interactive figure showing N2O4 and NO2 reaching dynamic equilibrium">
    <section class="stage" aria-label="Figure canvas">
      <svg id="figure" viewBox="0 0 1000 825" role="img" aria-labelledby="title desc">
        <title id="title">N2O4 decomposes to NO2 and reaches dynamic equilibrium</title>
        <desc id="desc">Three molecular snapshots above a switchable concentration or rate graph. Dragging the time marker updates all readouts and highlights the matching vial snapshot.</desc>
        <defs>
          <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"></path>
          </marker>
          <marker id="thinArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#111111" stroke-width="1.2"></path>
          </marker>
          <radialGradient id="oxygenGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0" stop-color="#ff7474"></stop>
            <stop offset="0.55" stop-color="#e51f2c"></stop>
            <stop offset="1" stop-color="#9f1019"></stop>
          </radialGradient>
          <radialGradient id="nitrogenGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0" stop-color="#86a5e8"></stop>
            <stop offset="0.58" stop-color="#375ead"></stop>
            <stop offset="1" stop-color="#1d356f"></stop>
          </radialGradient>
          <linearGradient id="glassShine" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"></stop>
            <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.2"></stop>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a5568" flood-opacity="0.22"></feDropShadow>
          </filter>
          <clipPath id="clip-snap-0"><circle cx="160" cy="230" r="72"></circle></clipPath>
          <clipPath id="clip-snap-1"><circle cx="500" cy="230" r="72"></circle></clipPath>
          <clipPath id="clip-snap-2"><circle cx="840" cy="230" r="72"></circle></clipPath>
        </defs>

        <rect x="0" y="0" width="1000" height="825" fill="#ffffff"></rect>

        <g id="snapshotLayer"></g>

        <g id="moleculeCallouts">
          <path d="M 268 320 L 191 272" stroke="#111111" stroke-width="5" fill="none"></path>
          <text class="small-label" x="274" y="330">N<tspan baseline-shift="sub" font-size="65%">2</tspan>O<tspan baseline-shift="sub" font-size="65%">4</tspan></text>
          <path d="M 594 319 L 517 270" stroke="#111111" stroke-width="5" fill="none"></path>
          <text class="small-label" x="600" y="330">NO<tspan baseline-shift="sub" font-size="65%">2</tspan></text>
          <text class="panel-letter" x="500" y="376" text-anchor="middle">(a)</text>
        </g>

        <g id="graphLayer">
          <rect id="equilibriumShade" x="0" y="0" width="0" height="0" fill="#f7edc7" opacity="0.78"></rect>
          <path id="xAxis" class="axis" marker-end="url(#axisArrow)"></path>
          <path id="yAxis" class="axis" marker-end="url(#axisArrow)"></path>
          <line id="equilibriumLine" class="marker-line"></line>
          <path id="blueCurve" class="curve-blue"></path>
          <path id="redCurve" class="curve-red"></path>
          <g id="blueLabel"></g>
          <g id="redLabel"></g>
          <text id="eqLabelA" class="small-label" x="0" y="0">Equilibrium</text>
          <text id="eqLabelB" class="small-label" x="0" y="0">achieved</text>
          <text id="zeroLabel" class="small-label" x="0" y="0">0</text>
          <text id="xLabel" class="small-label" x="0" y="0" text-anchor="middle">Time</text>
          <text id="yLabel" class="small-label" x="0" y="0" text-anchor="middle" transform="">Concentration</text>
          <text id="panelLetter" class="panel-letter" x="500" y="800" text-anchor="middle">(b)</text>
          <line id="timeMarker" class="marker-line"></line>
          <circle id="markerKnob" cx="0" cy="0" r="10" fill="#ffffff" stroke="#111111" stroke-width="2.3"></circle>
          <circle id="blueDot" r="8" fill="#526fb8" stroke="#ffffff" stroke-width="2.5"></circle>
          <circle id="redDot" r="8" fill="#c64a2b" stroke="#ffffff" stroke-width="2.5"></circle>
          <rect id="dragTarget" class="drag-target"></rect>
        </g>
      </svg>
    </section>

    <section class="controls" aria-label="Interactive controls">
      <div class="range-row">
        <label for="initialSlider">Initial [N2O4]</label>
        <input id="initialSlider" type="range" min="0.60" max="1.40" step="0.02" value="1.00">
        <span class="value" id="initialValue">1.00 M</span>
      </div>

      <div class="range-row">
        <label for="timeSlider">Time marker</label>
        <input id="timeSlider" type="range" min="0" max="10" step="0.01" value="2.50">
        <span class="value" id="timeValue">2.50</span>
      </div>

      <div class="segmented" role="group" aria-label="Graph quantity">
        <button type="button" data-mode="concentration" aria-pressed="true">Concentration (b)</button>
        <button type="button" data-mode="rate" aria-pressed="false">Rate (c)</button>
      </div>

      <div class="readouts" aria-live="polite">
        <span>[N2O4]<b id="n2o4Value">0.000 M</b></span>
        <span>[NO2]<b id="no2Value">0.000 M</b></span>
        <span>Forward rate<b id="forwardValue">0.000</b></span>
        <span>Reverse rate<b id="reverseValue">0.000</b></span>
      </div>

      <p class="caption" id="statusText">Before equilibrium, concentrations change and opposing rates are unequal.</p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("figure");
      const snapshotLayer = document.getElementById("snapshotLayer");
      const initialSlider = document.getElementById("initialSlider");
      const timeSlider = document.getElementById("timeSlider");
      const initialValue = document.getElementById("initialValue");
      const timeValue = document.getElementById("timeValue");
      const n2o4Value = document.getElementById("n2o4Value");
      const no2Value = document.getElementById("no2Value");
      const forwardValue = document.getElementById("forwardValue");
      const reverseValue = document.getElementById("reverseValue");
      const statusText = document.getElementById("statusText");
      const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));

      const graph = {
        x: 112,
        y: 432,
        w: 780,
        h: 284,
        eqT: 5,
        endT: 10
      };

      const chemistry = {
        Kc: 1.12,
        kForward: 0.68,
        approach: 0.74
      };
      chemistry.kReverse = chemistry.kForward / chemistry.Kc;

      const moleculePositions = [
        { x: -40, y: -36, s: 0.82, r: 16 },
        { x: 6, y: -47, s: 0.78, r: -10 },
        { x: 42, y: -28, s: 0.76, r: 22 },
        { x: -52, y: 6, s: 0.8, r: -22 },
        { x: -9, y: 0, s: 0.76, r: 34 },
        { x: 46, y: 13, s: 0.74, r: -14 },
        { x: -31, y: 42, s: 0.78, r: 12 },
        { x: 12, y: 45, s: 0.82, r: -26 },
        { x: 1, y: 24, s: 0.72, r: 42 },
        { x: -58, y: -17, s: 0.66, r: -34 },
        { x: 58, y: -5, s: 0.66, r: 28 },
        { x: -2, y: -22, s: 0.68, r: 5 },
        { x: 28, y: 38, s: 0.66, r: -4 },
        { x: -49, y: 30, s: 0.64, r: 38 },
        { x: 39, y: -48, s: 0.62, r: -38 },
        { x: -17, y: -57, s: 0.58, r: 8 },
        { x: 59, y: 40, s: 0.58, r: 14 },
        { x: -64, y: -48, s: 0.54, r: -12 }
      ];

      const snapshots = [
        { label: "t = 0", x: 160, y: 230, tubeX: 129, tubeY: 65, t: 0, clip: "clip-snap-0" },
        { label: "pre-equilibrium", x: 500, y: 230, tubeX: 469, tubeY: 65, t: 2.45, clip: "clip-snap-1" },
        { label: "at equilibrium", x: 840, y: 230, tubeX: 809, tubeY: 65, t: graph.eqT, clip: "clip-snap-2" }
      ];

      const state = {
        initial: Number(initialSlider.value),
        time: Number(timeSlider.value),
        mode: "concentration",
        dragging: false
      };

      function el(name, attrs = {}, parent = null) {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => {
          if (value !== null && value !== undefined) node.setAttribute(key, String(value));
        });
        if (parent) parent.appendChild(node);
        return node;
      }

      function setAttrs(node, attrs) {
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function mixColor(a, b, t) {
        const clamp = Math.max(0, Math.min(1, t));
        const ca = a.match(/\w\w/g).map((x) => parseInt(x, 16));
        const cb = b.match(/\w\w/g).map((x) => parseInt(x, 16));
        const cc = ca.map((v, i) => Math.round(v + (cb[i] - v) * clamp));
        return "#" + cc.map((v) => v.toString(16).padStart(2, "0")).join("");
      }

      function equilibriumFor(c0) {
        const K = chemistry.Kc;
        const x = (-K + Math.sqrt(K * K + 16 * K * c0)) / 8;
        const n2o4 = Math.max(0, c0 - x);
        const no2 = Math.max(0, 2 * x);
        const rate = chemistry.kForward * n2o4;
        return { x, n2o4, no2, forward: rate, reverse: rate };
      }

      function progressAt(t) {
        if (t >= graph.eqT) return 1;
        const raw = 1 - Math.exp(-chemistry.approach * Math.max(0, t));
        const atEq = 1 - Math.exp(-chemistry.approach * graph.eqT);
        return raw / atEq;
      }

      function valuesAt(t, c0 = state.initial) {
        const eq = equilibriumFor(c0);
        const p = progressAt(t);
        const n2o4 = c0 - eq.x * p;
        const no2 = 2 * eq.x * p;
        return {
          c0,
          t,
          p,
          n2o4,
          no2,
          forward: chemistry.kForward * n2o4,
          reverse: chemistry.kReverse * no2 * no2,
          eq
        };
      }

      function xScale(t) {
        return graph.x + (t / graph.endT) * graph.w;
      }

      function yScale(value, maxY) {
        return graph.y + graph.h - (value / maxY) * graph.h;
      }

      function curvePath(fn, maxY) {
        const steps = 180;
        let d = "";
        for (let i = 0; i <= steps; i += 1) {
          const t = (graph.endT * i) / steps;
          const x = xScale(t);
          const y = yScale(fn(t), maxY);
          d += `${i === 0 ? "M" : "L"} ${x.toFixed(2)} ${y.toFixed(2)} `;
        }
        return d.trim();
      }

      function moleculeCircle(group, cx, cy, r, fill) {
        el("circle", { cx, cy, r, fill, stroke: "rgba(20,20,20,0.18)", "stroke-width": 0.6 }, group);
        el("circle", { cx: cx - r * 0.28, cy: cy - r * 0.32, r: r * 0.26, fill: "#ffffff", opacity: 0.55 }, group);
      }

      function drawNO2(parent, x, y, scale, rotate) {
        const g = el("g", { transform: `translate(${x} ${y}) rotate(${rotate}) scale(${scale})` }, parent);
        el("line", { class: "molecule-bond", x1: -9, y1: 0, x2: 8, y2: 0 }, g);
        el("line", { class: "molecule-bond", x1: 7, y1: 0, x2: 17, y2: 11 }, g);
        moleculeCircle(g, 0, 0, 10, "url(#nitrogenGrad)");
        moleculeCircle(g, -14, -4, 10, "url(#oxygenGrad)");
        moleculeCircle(g, 18, 12, 10, "url(#oxygenGrad)");
      }

      function drawN2O4(parent, x, y, scale, rotate) {
        const g = el("g", { transform: `translate(${x} ${y}) rotate(${rotate}) scale(${scale})` }, parent);
        el("line", { class: "molecule-bond", x1: -8, y1: 0, x2: 8, y2: 0 }, g);
        el("line", { class: "molecule-bond", x1: -8, y1: 0, x2: -20, y2: -13 }, g);
        el("line", { class: "molecule-bond", x1: -8, y1: 0, x2: -19, y2: 14 }, g);
        el("line", { class: "molecule-bond", x1: 8, y1: 0, x2: 21, y2: -13 }, g);
        el("line", { class: "molecule-bond", x1: 8, y1: 0, x2: 20, y2: 14 }, g);
        moleculeCircle(g, -8, 0, 9.5, "url(#nitrogenGrad)");
        moleculeCircle(g, 8, 0, 9.5, "url(#nitrogenGrad)");
        moleculeCircle(g, -24, -17, 9.5, "url(#oxygenGrad)");
        moleculeCircle(g, -23, 18, 9.5, "url(#oxygenGrad)");
        moleculeCircle(g, 25, -17, 9.5, "url(#oxygenGrad)");
        moleculeCircle(g, 24, 18, 9.5, "url(#oxygenGrad)");
      }

      function tubeColor(no2, c0) {
        const eqNo2 = equilibriumFor(c0).no2 || 1;
        const fraction = Math.max(0, Math.min(1, no2 / eqNo2));
        if (fraction < 0.48) {
          return mixColor("d9ddf2", "f1d779", fraction / 0.48);
        }
        return mixColor("f1d779", "e2853b", (fraction - 0.48) / 0.52);
      }

      function tubeOpacity(no2, c0) {
        const fraction = Math.max(0, Math.min(1, no2 / (equilibriumFor(c0).no2 || 1)));
        return 0.58 + fraction * 0.35;
      }

      function drawTube(parent, snap, color, opacity) {
        const g = el("g", { transform: `translate(${snap.tubeX} ${snap.tubeY}) rotate(-32)`, filter: "url(#softShadow)" }, parent);
        el("rect", {
          x: 0,
          y: 0,
          width: 33,
          height: 155,
          rx: 15,
          fill: color,
          opacity
        }, g);
        el("rect", {
          x: 4,
          y: 5,
          width: 9,
          height: 138,
          rx: 5,
          fill: "url(#glassShine)",
          opacity: 0.72
        }, g);
        el("path", {
          d: "M 3 133 C 9 151 20 159 33 155 L 33 130 C 23 139 12 139 3 133 Z",
          fill: color,
          opacity: 0.82
        }, g);
      }

      function drawCurvedArrow(parent, snap) {
        const path = `M ${snap.x + 30} 130 C ${snap.x - 22} 142 ${snap.x - 18} 193 ${snap.x - 8} 206`;
        el("path", {
          d: path,
          stroke: "#111111",
          "stroke-width": 1.35,
          fill: "none",
          "marker-end": "url(#thinArrow)"
        }, parent);
      }

      function drawSnapshot(snap, index, activeIndex) {
        const vals = valuesAt(snap.t, state.initial);
        const g = el("g", { class: index === activeIndex ? "snapshot-active" : "" }, snapshotLayer);

        el("rect", { class: "halo", x: snap.x - 105, y: 40, width: 210, height: 278, rx: 8 }, g);
        el("text", { x: snap.x, y: 33, "text-anchor": "middle", "font-size": 27, fill: "#111111" }, g).textContent = snap.label;
        drawTube(g, snap, tubeColor(vals.no2, state.initial), tubeOpacity(vals.no2, state.initial));
        drawCurvedArrow(g, snap);
        el("circle", { class: "snapshot-shell", cx: snap.x, cy: snap.y, r: 72 }, g);

        const clipped = el("g", { "clip-path": `url(#${snap.clip})` }, g);
        el("circle", { cx: snap.x, cy: snap.y, r: 70, fill: "#fbfbfb" }, clipped);

        const totalAmount = vals.n2o4 + vals.no2;
        const n4 = vals.no2 < 0.01 ? 7 : Math.max(1, Math.round((vals.n2o4 / totalAmount) * 9));
        const n2 = vals.no2 < 0.01 ? 0 : Math.max(4, Math.round((vals.no2 / totalAmount) * 11));
        const ordered = moleculePositions.slice();

        for (let i = 0; i < n4 && i < ordered.length; i += 1) {
          const p = ordered[i];
          drawN2O4(clipped, snap.x + p.x, snap.y + p.y, p.s * 0.84, p.r);
        }

        for (let i = 0; i < n2 && i + n4 < ordered.length; i += 1) {
          const p = ordered[i + n4];
          drawNO2(clipped, snap.x + p.x, snap.y + p.y, p.s * 0.98, p.r + 18);
        }
      }

      function activeSnapshotIndex() {
        if (state.time < 0.55) return 0;
        if (state.time < graph.eqT) return 1;
        return 2;
      }

      function renderSnapshots() {
        clear(snapshotLayer);
        const active = activeSnapshotIndex();
        snapshots.forEach((snap, index) => drawSnapshot(snap, index, active));
      }

      function setChemicalLabel(groupId, x, y, parts, color) {
        const group = document.getElementById(groupId);
        clear(group);
        const text = el("text", { x, y, "font-size": 24, fill: color }, group);
        parts.forEach((part) => {
          const tspan = el("tspan", {}, text);
          tspan.textContent = part.text;
          if (part.sub) {
            tspan.setAttribute("baseline-shift", "sub");
            tspan.setAttribute("font-size", "65%");
          }
          if (part.sup) {
            tspan.setAttribute("baseline-shift", "super");
            tspan.setAttribute("font-size", "65%");
          }
          if (part.italic) tspan.setAttribute("font-style", "italic");
        });
      }

      function graphMax() {
        const eq = equilibriumFor(state.initial);
        if (state.mode === "concentration") {
          return Math.max(state.initial, eq.no2, 0.8) * 1.17;
        }
        return Math.max(chemistry.kForward * state.initial, eq.forward, 0.45) * 1.15;
      }

      function renderGraphFrame() {
        const gx = graph.x;
        const gy = graph.y;
        const gh = graph.h;
        const gw = graph.w;
        const xEnd = gx + gw;
        const yEnd = gy + gh;
        const eqX = xScale(graph.eqT);

        setAttrs(document.getElementById("equilibriumShade"), { x: eqX, y: gy, width: xEnd - eqX, height: gh });
        setAttrs(document.getElementById("xAxis"), { d: `M ${gx} ${yEnd} L ${xEnd + 52} ${yEnd}` });
        setAttrs(document.getElementById("yAxis"), { d: `M ${gx} ${yEnd} L ${gx} ${gy - 48}` });
        setAttrs(document.getElementById("equilibriumLine"), { x1: eqX, y1: gy, x2: eqX, y2: yEnd });
        setAttrs(document.getElementById("zeroLabel"), { x: gx + 22, y: yEnd + 38 });
        setAttrs(document.getElementById("xLabel"), { x: gx + gw / 2, y: yEnd + 37 });
        setAttrs(document.getElementById("yLabel"), {
          x: gx - 56,
          y: gy + gh / 2,
          transform: `rotate(-90 ${gx - 56} ${gy + gh / 2})`
        });
        setAttrs(document.getElementById("dragTarget"), { x: gx - 18, y: gy - 34, width: gw + 36, height: gh + 78 });
      }

      function renderCurves() {
        const maxY = graphMax();
        const blueCurve = document.getElementById("blueCurve");
        const redCurve = document.getElementById("redCurve");
        const yLabel = document.getElementById("yLabel");
        const panelLetter = document.getElementById("panelLetter");

        if (state.mode === "concentration") {
          const eq = equilibriumFor(state.initial);
          const eqRedY = yScale(eq.no2, maxY);
          const eqBlueY = yScale(eq.n2o4, maxY);
          const labelY = eqBlueY - eqRedY > 82 ? eqRedY + 34 : eqRedY - 54;

          blueCurve.setAttribute("d", curvePath((t) => valuesAt(t).n2o4, maxY));
          redCurve.setAttribute("d", curvePath((t) => valuesAt(t).no2, maxY));
          yLabel.textContent = "Concentration";
          panelLetter.textContent = "(b)";
          setAttrs(document.getElementById("eqLabelA"), { x: xScale(graph.eqT) + 86, y: labelY });
          setAttrs(document.getElementById("eqLabelB"), { x: xScale(graph.eqT) + 86, y: labelY + 32 });
          setChemicalLabel("redLabel", xScale(3.25), yScale(valuesAt(3.25).no2, maxY) - 18, [
            { text: "NO" }, { text: "2", sub: true }
          ], "#111111");
          setChemicalLabel("blueLabel", xScale(3.25), yScale(valuesAt(3.25).n2o4, maxY) + 34, [
            { text: "N" }, { text: "2", sub: true }, { text: "O" }, { text: "4", sub: true }
          ], "#111111");
        } else {
          const eq = equilibriumFor(state.initial);
          const eqRateY = yScale(eq.forward, maxY);

          blueCurve.setAttribute("d", curvePath((t) => valuesAt(t).forward, maxY));
          redCurve.setAttribute("d", curvePath((t) => valuesAt(t).reverse, maxY));
          yLabel.textContent = "Rate";
          panelLetter.textContent = "(c)";
          setAttrs(document.getElementById("eqLabelA"), { x: xScale(graph.eqT) + 86, y: eqRateY + 58 });
          setAttrs(document.getElementById("eqLabelB"), { x: xScale(graph.eqT) + 86, y: eqRateY + 90 });
          setChemicalLabel("blueLabel", xScale(0.92), yScale(valuesAt(0.92).forward, maxY) - 14, [
            { text: "k", italic: true }, { text: "f", sub: true }, { text: "[N" }, { text: "2", sub: true }, { text: "O" }, { text: "4", sub: true }, { text: "]" }
          ], "#111111");
          setChemicalLabel("redLabel", xScale(0.92), yScale(valuesAt(0.92).reverse, maxY) - 4, [
            { text: "k", italic: true }, { text: "r", sub: true }, { text: "[NO" }, { text: "2", sub: true }, { text: "]" }, { text: "2", sup: true }
          ], "#111111");
        }
      }

      function renderMarkerAndReadouts() {
        const vals = valuesAt(state.time);
        const maxY = graphMax();
        const x = xScale(state.time);
        const top = graph.y - 18;
        const bottom = graph.y + graph.h;
        const blueY = state.mode === "concentration" ? yScale(vals.n2o4, maxY) : yScale(vals.forward, maxY);
        const redY = state.mode === "concentration" ? yScale(vals.no2, maxY) : yScale(vals.reverse, maxY);

        setAttrs(document.getElementById("timeMarker"), { x1: x, y1: top, x2: x, y2: bottom });
        setAttrs(document.getElementById("markerKnob"), { cx: x, cy: bottom + 1 });
        setAttrs(document.getElementById("blueDot"), { cx: x, cy: blueY });
        setAttrs(document.getElementById("redDot"), { cx: x, cy: redY });

        initialValue.textContent = `${state.initial.toFixed(2)} M`;
        timeValue.textContent = state.time.toFixed(2);
        n2o4Value.textContent = `${vals.n2o4.toFixed(3)} M`;
        no2Value.textContent = `${vals.no2.toFixed(3)} M`;
        forwardValue.textContent = vals.forward.toFixed(3);
        reverseValue.textContent = vals.reverse.toFixed(3);

        const rateGap = Math.abs(vals.forward - vals.reverse);
        if (state.time >= graph.eqT || rateGap < 0.006) {
          statusText.textContent = "At equilibrium, forward and reverse rates are equal while molecules continue interconverting.";
        } else {
          statusText.textContent = "Before equilibrium, concentrations change and opposing rates are unequal.";
        }
      }

      function renderButtons() {
        modeButtons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.mode === state.mode ? "true" : "false");
        });
      }

      function renderAll() {
        renderSnapshots();
        renderGraphFrame();
        renderCurves();
        renderMarkerAndReadouts();
        renderButtons();
      }

      function setTime(t) {
        state.time = Math.max(0, Math.min(graph.endT, t));
        timeSlider.value = state.time.toFixed(2);
        renderSnapshots();
        renderMarkerAndReadouts();
      }

      function localPoint(evt) {
        const point = svg.createSVGPoint();
        point.x = evt.clientX;
        point.y = evt.clientY;
        return point.matrixTransform(svg.getScreenCTM().inverse());
      }

      function timeFromPointer(evt) {
        const p = localPoint(evt);
        return ((p.x - graph.x) / graph.w) * graph.endT;
      }

      document.getElementById("dragTarget").addEventListener("pointerdown", (evt) => {
        state.dragging = true;
        evt.currentTarget.setPointerCapture(evt.pointerId);
        setTime(timeFromPointer(evt));
      });

      document.getElementById("dragTarget").addEventListener("pointermove", (evt) => {
        if (state.dragging) setTime(timeFromPointer(evt));
      });

      document.getElementById("dragTarget").addEventListener("pointerup", (evt) => {
        state.dragging = false;
        evt.currentTarget.releasePointerCapture(evt.pointerId);
      });

      document.getElementById("dragTarget").addEventListener("pointercancel", () => {
        state.dragging = false;
      });

      timeSlider.addEventListener("input", () => {
        setTime(Number(timeSlider.value));
      });

      initialSlider.addEventListener("input", () => {
        state.initial = Number(initialSlider.value);
        renderAll();
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.mode = button.dataset.mode;
          renderCurves();
          renderMarkerAndReadouts();
          renderButtons();
        });
      });

      renderAll();
    })();
  </script>
</body>
</html>
