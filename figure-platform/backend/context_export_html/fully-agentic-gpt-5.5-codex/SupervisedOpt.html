<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervised Learning Optimization Landscape</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111414;
      --muted: #697475;
      --axis: #111414;
      --grid: #d9e4e2;
      --teal-dark: #2f7870;
      --teal: #4db7aa;
      --teal-mid: #8bd0c9;
      --teal-light: #b4e1dd;
      --orange: #cb7e5b;
      --orange-stroke: #874326;
      --paper: #ffffff;
      --control: #f3f8f7;
      --shadow: 0 20px 54px rgba(13, 49, 46, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f7fbfa;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 24px);
    }

    .figure {
      width: min(100%, 1360px);
      background: var(--paper);
      border: 1px solid #d8e4e1;
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(10px, 2vw, 22px);
    }

    .plots {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(14px, 2.2vw, 28px);
      align-items: start;
    }

    .panel {
      min-width: 0;
      position: relative;
    }

    .plot-frame {
      width: 100%;
      aspect-ratio: 1.18 / 1;
      position: relative;
      overflow: visible;
    }

    canvas,
    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    svg {
      touch-action: none;
      user-select: none;
      overflow: visible;
    }

    .loss-svg {
      cursor: crosshair;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 3.4;
      fill: none;
      stroke-linecap: square;
    }

    .tick {
      stroke: #777f80;
      stroke-width: 2.4;
    }

    .minor-tick {
      stroke: #777f80;
      stroke-width: 1.8;
      opacity: 0.82;
    }

    .tick-label {
      fill: #737b7c;
      font-size: 23px;
    }

    .axis-label {
      fill: #050707;
      font-size: 34px;
      font-weight: 500;
    }

    .plot-title {
      fill: #050707;
      font-size: 36px;
      font-weight: 500;
    }

    .panel-tag {
      fill: #050707;
      font-size: 36px;
      font-weight: 520;
    }

    .data-point {
      fill: var(--orange);
      stroke: var(--orange-stroke);
      stroke-width: 2;
    }

    .ghost-line {
      stroke-linecap: round;
      opacity: 0.78;
    }

    .fit-line {
      stroke: #24786f;
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 2px 1px rgba(255,255,255,0.85));
    }

    .projection {
      stroke: #ffffff;
      stroke-width: 2;
      stroke-dasharray: 6 7;
      opacity: 0.85;
    }

    .marker-ring {
      fill: #d7f1ee;
      stroke: #164a45;
      stroke-width: 4;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.22));
    }

    .marker-dot {
      fill: #174f49;
      pointer-events: none;
    }

    .path-line {
      fill: none;
      stroke: #c9d0d0;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .path-point {
      fill: #ace5df;
      stroke: none;
    }

    .path-label,
    .line-label {
      font-size: 22px;
      font-weight: 540;
      paint-order: stroke;
      stroke: white;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .path-label {
      fill: white;
      stroke: rgba(30, 45, 45, 0.25);
    }

    .line-label {
      fill: #63c2ba;
      opacity: 0.9;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      margin-top: clamp(12px, 2vw, 20px);
      padding: 14px;
      background: var(--control);
      border: 1px solid #d5e6e3;
      border-radius: 8px;
    }

    .control {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .control-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      color: #243735;
      font-size: 15px;
      font-weight: 660;
    }

    .value {
      min-width: 5.5ch;
      text-align: right;
      color: #1d6e66;
      font-variant-numeric: tabular-nums;
      font-weight: 760;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .readout {
      min-width: 172px;
      display: grid;
      gap: 2px;
      color: #29413e;
      font-size: 13px;
      line-height: 1.25;
    }

    .readout strong {
      color: #143f3b;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }

    .reset {
      appearance: none;
      border: 1px solid #94c7c0;
      background: #ffffff;
      color: #195d56;
      border-radius: 7px;
      padding: 9px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset:hover,
    .reset:focus-visible {
      background: #e8f6f4;
      outline: none;
    }

    @media (max-width: 860px) {
      body {
        padding: 8px;
      }

      .figure {
        padding: 10px;
      }

      .plots {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .readout {
        min-width: 0;
      }

      .axis-label {
        font-size: 30px;
      }

      .plot-title,
      .panel-tag {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-label="Interactive supervised learning optimization figure">
    <div class="plots">
      <section class="panel" aria-label="Panel a, loss landscape over model parameters">
        <div class="plot-frame">
          <canvas id="loss-canvas" aria-hidden="true"></canvas>
          <svg id="loss-svg" class="loss-svg" viewBox="0 0 640 540" role="img" aria-label="Colored contour heatmap of loss as a function of intercept and slope">
            <defs>
              <clipPath id="loss-clip">
                <rect id="loss-clip-rect"></rect>
              </clipPath>
            </defs>
            <g id="loss-static"></g>
            <g id="loss-path" clip-path="url(#loss-clip)"></g>
            <g id="loss-dynamic" clip-path="url(#loss-clip)"></g>
          </svg>
        </div>
      </section>

      <section class="panel" aria-label="Panel b, supervised data and fitted linear model">
        <div class="plot-frame">
          <svg id="data-svg" viewBox="0 0 640 540" role="img" aria-label="Scatter data with an interactive fitted line">
            <defs>
              <clipPath id="data-clip">
                <rect id="data-clip-rect"></rect>
              </clipPath>
            </defs>
            <g id="data-static"></g>
            <g id="data-lines" clip-path="url(#data-clip)"></g>
            <g id="data-points" clip-path="url(#data-clip)"></g>
          </svg>
        </div>
      </section>
    </div>

    <div class="controls" aria-label="Interactive model parameter controls">
      <label class="control" for="phi0">
        <span class="control-label">Intercept, &phi;<sub>0</sub><span id="phi0-value" class="value"></span></span>
        <input id="phi0" type="range" min="-1" max="2" step="0.01" value="0.70">
      </label>
      <label class="control" for="phi1">
        <span class="control-label">Slope, &phi;<sub>1</sub><span id="phi1-value" class="value"></span></span>
        <input id="phi1" type="range" min="0" max="4" step="0.01" value="0.58">
      </label>
      <div class="readout">
        <span>Current loss</span>
        <strong id="loss-value"></strong>
        <button id="reset" class="reset" type="button">Reset to minimum</button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const svgns = "http://www.w3.org/2000/svg";
      const view = { width: 640, height: 540 };
      const lossPlot = {
        left: 86,
        top: 66,
        width: 518,
        height: 382,
        xMin: -1,
        xMax: 2,
        yMin: 0,
        yMax: 4
      };
      const dataPlot = {
        left: 78,
        top: 58,
        width: 526,
        height: 390,
        xMin: 0,
        xMax: 2,
        yMin: 0,
        yMax: 2
      };

      const samples = [
        [0.05, 0.66],
        [0.20, 0.90],
        [0.34, 1.05],
        [0.47, 0.99],
        [0.79, 1.50],
        [0.82, 1.40],
        [1.08, 1.29],
        [1.18, 1.50],
        [1.40, 1.55],
        [1.60, 1.68],
        [1.66, 1.73],
        [1.91, 1.60]
      ];

      const pathPoints = [
        { phi0: -0.56, phi1: 0.25, label: "0" },
        { phi0: -0.12, phi1: 0.34, label: "1" },
        { phi0: 0.20, phi1: 0.47, label: "2" },
        { phi0: 0.49, phi1: 0.55, label: "3" },
        { phi0: 0.70, phi1: 0.58, label: "4" }
      ];

      const state = {
        phi0: Number(document.getElementById("phi0").value),
        phi1: Number(document.getElementById("phi1").value),
        dragging: false
      };

      const fit = leastSquares(samples);
      const lossAtFit = loss(fit.phi0, fit.phi1);
      const palette = [
        [248, 252, 251],
        [225, 243, 240],
        [180, 225, 221],
        [139, 208, 201],
        [77, 183, 170],
        [47, 120, 112],
        [27, 77, 72]
      ];

      const canvas = document.getElementById("loss-canvas");
      const lossSvg = document.getElementById("loss-svg");
      const dataSvg = document.getElementById("data-svg");
      const phi0Slider = document.getElementById("phi0");
      const phi1Slider = document.getElementById("phi1");
      const phi0Value = document.getElementById("phi0-value");
      const phi1Value = document.getElementById("phi1-value");
      const lossValue = document.getElementById("loss-value");

      buildStaticLoss();
      buildStaticData();
      drawLossCanvas();
      update();

      window.addEventListener("resize", drawLossCanvas);
      phi0Slider.addEventListener("input", function () {
        state.phi0 = Number(phi0Slider.value);
        update();
      });
      phi1Slider.addEventListener("input", function () {
        state.phi1 = Number(phi1Slider.value);
        update();
      });
      document.getElementById("reset").addEventListener("click", function () {
        state.phi0 = fit.phi0;
        state.phi1 = fit.phi1;
        syncSliders();
        update();
      });

      lossSvg.addEventListener("pointerdown", function (event) {
        state.dragging = true;
        lossSvg.setPointerCapture(event.pointerId);
        setFromPointer(event);
      });
      lossSvg.addEventListener("pointermove", function (event) {
        if (state.dragging) {
          setFromPointer(event);
        }
      });
      lossSvg.addEventListener("pointerup", endDrag);
      lossSvg.addEventListener("pointercancel", endDrag);

      function endDrag(event) {
        state.dragging = false;
        try {
          lossSvg.releasePointerCapture(event.pointerId);
        } catch (error) {
          // The capture may already be gone after a browser cancel event.
        }
      }

      function buildStaticLoss() {
        const g = document.getElementById("loss-static");
        g.replaceChildren();
        setAttrs(document.getElementById("loss-clip-rect"), {
          x: lossPlot.left,
          y: lossPlot.top,
          width: lossPlot.width,
          height: lossPlot.height
        });

        g.appendChild(text("a)", 4, 38, "panel-tag", "start", "middle"));
        g.appendChild(text("Loss, L[\u03c6]", view.width / 2, 39, "plot-title", "middle", "middle"));
        drawAxes(g, lossPlot, {
          xTicks: [-1, 0, 1, 2],
          yTicks: [0, 1, 2, 3, 4],
          xMinor: [-0.5, 0.5, 1.5],
          yMinor: [0.5, 1.5, 2.5, 3.5],
          xLabel: "Intercept, \u03c60",
          yLabel: "Slope, \u03c61"
        });
      }

      function buildStaticData() {
        const g = document.getElementById("data-static");
        const points = document.getElementById("data-points");
        const lines = document.getElementById("data-lines");
        g.replaceChildren();
        points.replaceChildren();
        lines.replaceChildren();
        setAttrs(document.getElementById("data-clip-rect"), {
          x: dataPlot.left,
          y: dataPlot.top,
          width: dataPlot.width,
          height: dataPlot.height
        });

        g.appendChild(text("b)", 4, 38, "panel-tag", "start", "middle"));
        drawAxes(g, dataPlot, {
          xTicks: [0, 1, 2],
          yTicks: [0, 1, 2],
          xMinor: [0.2, 0.4, 0.6, 0.8, 1.2, 1.4, 1.6, 1.8],
          yMinor: [0.2, 0.4, 0.6, 0.8, 1.2, 1.4, 1.6, 1.8],
          xLabel: "Input, x",
          yLabel: "Output, y"
        });

        pathPoints.forEach(function (p, index) {
          const line = fittedLineElement(dataPlot, p.phi0, p.phi1);
          line.classList.add("ghost-line");
          line.setAttribute("stroke", index === pathPoints.length - 1 ? "#1f6f67" : ["#c8ebe7", "#9cdad4", "#7bcac3", "#4db7aa"][Math.min(index, 3)]);
          line.setAttribute("stroke-width", index === pathPoints.length - 1 ? "5" : "4.4");
          lines.appendChild(line);

          const labelX = index === 0 ? 0.25 : 0.09 + index * 0.03;
          const labelY = p.phi0 + p.phi1 * labelX;
          const label = text(p.label, dataX(labelX), dataY(labelY) + (index === 0 ? 30 : 0), "line-label", "middle", "middle");
          lines.appendChild(label);
        });

        const fitLine = fittedLineElement(dataPlot, state.phi0, state.phi1);
        fitLine.setAttribute("id", "fit-line");
        fitLine.classList.add("fit-line");
        lines.appendChild(fitLine);

        samples.forEach(function (sample) {
          const c = document.createElementNS(svgns, "circle");
          c.classList.add("data-point");
          setAttrs(c, { cx: dataX(sample[0]), cy: dataY(sample[1]), r: 10.5 });
          points.appendChild(c);
        });
      }

      function drawAxes(g, plot, config) {
        const x0 = plot.left;
        const y0 = plot.top + plot.height;
        const x1 = plot.left + plot.width;
        const y1 = plot.top;

        const box = document.createElementNS(svgns, "rect");
        setAttrs(box, {
          x: plot.left,
          y: plot.top,
          width: plot.width,
          height: plot.height,
          fill: "none",
          stroke: "#111414",
          "stroke-width": 3.4
        });
        g.appendChild(box);

        (config.xMinor || []).forEach(function (tick) {
          const x = scale(tick, plot.xMin, plot.xMax, plot.left, plot.left + plot.width);
          const l = line(x, y0, x, y0 + 7, "minor-tick");
          g.appendChild(l);
        });
        (config.yMinor || []).forEach(function (tick) {
          const y = scale(tick, plot.yMin, plot.yMax, plot.top + plot.height, plot.top);
          const l = line(x0 - 7, y, x0, y, "minor-tick");
          g.appendChild(l);
        });

        config.xTicks.forEach(function (tick) {
          const x = scale(tick, plot.xMin, plot.xMax, plot.left, plot.left + plot.width);
          g.appendChild(line(x, y0, x, y0 + 11, "tick"));
          g.appendChild(text(formatTick(tick), x, y0 + 36, "tick-label", "middle", "middle"));
        });

        config.yTicks.forEach(function (tick) {
          const y = scale(tick, plot.yMin, plot.yMax, plot.top + plot.height, plot.top);
          g.appendChild(line(x0 - 11, y, x0, y, "tick"));
          g.appendChild(text(formatTick(tick), x0 - 22, y + 1, "tick-label", "end", "middle"));
        });

        g.appendChild(text(config.xLabel, plot.left + plot.width / 2, view.height - 23, "axis-label", "middle", "middle"));
        const yLabel = text(config.yLabel, 26, plot.top + plot.height / 2, "axis-label", "middle", "middle");
        yLabel.setAttribute("transform", "rotate(-90 26 " + (plot.top + plot.height / 2) + ")");
        g.appendChild(yLabel);
      }

      function drawLossCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) {
          return;
        }
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, rect.width, rect.height);

        const sx = rect.width / view.width;
        const sy = rect.height / view.height;
        const px = {
          left: lossPlot.left * sx,
          top: lossPlot.top * sy,
          width: lossPlot.width * sx,
          height: lossPlot.height * sy
        };

        const imageW = Math.max(220, Math.round(px.width));
        const imageH = Math.max(170, Math.round(px.height));
        const off = document.createElement("canvas");
        off.width = imageW;
        off.height = imageH;
        const offCtx = off.getContext("2d");
        const image = offCtx.createImageData(imageW, imageH);
        const stats = lossStats();
        for (let y = 0; y < imageH; y += 1) {
          const phi1 = scale(y + 0.5, 0, imageH, lossPlot.yMax, lossPlot.yMin);
          for (let x = 0; x < imageW; x += 1) {
            const phi0 = scale(x + 0.5, 0, imageW, lossPlot.xMin, lossPlot.xMax);
            const raw = loss(phi0, phi1);
            const normalized = Math.pow(clamp((raw - lossAtFit) / (stats.max - lossAtFit), 0, 1), 0.58);
            const rgb = ramp(normalized);
            const i = (y * imageW + x) * 4;
            image.data[i] = rgb[0];
            image.data[i + 1] = rgb[1];
            image.data[i + 2] = rgb[2];
            image.data[i + 3] = 255;
          }
        }
        offCtx.putImageData(image, 0, 0);
        ctx.drawImage(off, px.left, px.top, px.width, px.height);

        drawContours(ctx, sx, sy, stats);
      }

      function drawContours(ctx, sx, sy, stats) {
        const levels = [0.04, 0.08, 0.14, 0.22, 0.32, 0.45, 0.60, 0.77, 0.95].map(function (t) {
          return lossAtFit + t * (stats.max - lossAtFit);
        });
        const cols = 84;
        const rows = 84;
        const values = [];
        for (let j = 0; j <= rows; j += 1) {
          values[j] = [];
          const phi1 = scale(j, 0, rows, lossPlot.yMax, lossPlot.yMin);
          for (let i = 0; i <= cols; i += 1) {
            const phi0 = scale(i, 0, cols, lossPlot.xMin, lossPlot.xMax);
            values[j][i] = loss(phi0, phi1);
          }
        }

        ctx.save();
        ctx.lineWidth = Math.max(1.5, 2.1 * Math.min(sx, sy));
        ctx.strokeStyle = "rgba(230, 247, 244, 0.52)";
        levels.forEach(function (level) {
          for (let j = 0; j < rows; j += 1) {
            for (let i = 0; i < cols; i += 1) {
              const points = contourSegments(i, j, cols, rows, values, level);
              points.forEach(function (segment) {
                ctx.beginPath();
                ctx.moveTo(segment[0].x * sx, segment[0].y * sy);
                ctx.lineTo(segment[1].x * sx, segment[1].y * sy);
                ctx.stroke();
              });
            }
          }
        });
        ctx.restore();
      }

      function contourSegments(i, j, cols, rows, values, level) {
        const p = [
          { x: gridX(i, cols), y: gridY(j, rows), v: values[j][i] },
          { x: gridX(i + 1, cols), y: gridY(j, rows), v: values[j][i + 1] },
          { x: gridX(i + 1, cols), y: gridY(j + 1, rows), v: values[j + 1][i + 1] },
          { x: gridX(i, cols), y: gridY(j + 1, rows), v: values[j + 1][i] }
        ];
        const crossings = [];
        addCrossing(crossings, p[0], p[1], level);
        addCrossing(crossings, p[1], p[2], level);
        addCrossing(crossings, p[2], p[3], level);
        addCrossing(crossings, p[3], p[0], level);
        if (crossings.length === 2) {
          return [[crossings[0], crossings[1]]];
        }
        if (crossings.length === 4) {
          return [[crossings[0], crossings[1]], [crossings[2], crossings[3]]];
        }
        return [];
      }

      function addCrossing(out, a, b, level) {
        const da = a.v - level;
        const db = b.v - level;
        if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
          const t = da / (da - db);
          out.push({ x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) });
        }
      }

      function gridX(i, cols) {
        return scale(i, 0, cols, lossPlot.left, lossPlot.left + lossPlot.width);
      }

      function gridY(j, rows) {
        return scale(j, 0, rows, lossPlot.top, lossPlot.top + lossPlot.height);
      }

      function update() {
        state.phi0 = clamp(state.phi0, -1, 2);
        state.phi1 = clamp(state.phi1, 0, 4);
        syncSliders();
        updateLossMarker();
        updateDataFit();
        phi0Value.textContent = state.phi0.toFixed(2);
        phi1Value.textContent = state.phi1.toFixed(2);
        lossValue.textContent = loss(state.phi0, state.phi1).toFixed(3);
      }

      function syncSliders() {
        phi0Slider.value = state.phi0.toFixed(2);
        phi1Slider.value = state.phi1.toFixed(2);
      }

      function updateLossMarker() {
        const g = document.getElementById("loss-dynamic");
        g.replaceChildren();
        const x = lossX(state.phi0);
        const y = lossY(state.phi1);

        g.appendChild(line(x, lossPlot.top + lossPlot.height, x, y, "projection"));
        g.appendChild(line(lossPlot.left, y, x, y, "projection"));

        const ring = document.createElementNS(svgns, "circle");
        ring.classList.add("marker-ring");
        setAttrs(ring, { cx: x, cy: y, r: 12.5 });
        g.appendChild(ring);

        const dot = document.createElementNS(svgns, "circle");
        dot.classList.add("marker-dot");
        setAttrs(dot, { cx: x, cy: y, r: 4.2 });
        g.appendChild(dot);

        const label = text("current", x + 15, y - 15, "line-label", "start", "middle");
        label.setAttribute("fill", "#164f49");
        g.appendChild(label);

        drawPath();
      }

      function drawPath() {
        const g = document.getElementById("loss-path");
        g.replaceChildren();
        const d = pathPoints.map(function (p, index) {
          const prefix = index === 0 ? "M" : "L";
          return prefix + lossX(p.phi0).toFixed(2) + " " + lossY(p.phi1).toFixed(2);
        }).join(" ");
        const path = document.createElementNS(svgns, "path");
        path.classList.add("path-line");
        path.setAttribute("d", d);
        g.appendChild(path);

        pathPoints.forEach(function (p, index) {
          const cx = lossX(p.phi0);
          const cy = lossY(p.phi1);
          const c = document.createElementNS(svgns, "circle");
          c.classList.add("path-point");
          setAttrs(c, { cx: cx, cy: cy, r: 10 });
          g.appendChild(c);

          const lx = cx + (index === 0 ? -2 : 0);
          const ly = cy + 28;
          g.appendChild(text(p.label, lx, ly, "path-label", "middle", "middle"));
        });
      }

      function updateDataFit() {
        const fitLine = document.getElementById("fit-line");
        const fresh = fittedLineElement(dataPlot, state.phi0, state.phi1);
        ["x1", "y1", "x2", "y2"].forEach(function (name) {
          fitLine.setAttribute(name, fresh.getAttribute(name));
        });
      }

      function setFromPointer(event) {
        const pt = lossSvg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        const svgPt = pt.matrixTransform(lossSvg.getScreenCTM().inverse());
        state.phi0 = scale(svgPt.x, lossPlot.left, lossPlot.left + lossPlot.width, lossPlot.xMin, lossPlot.xMax);
        state.phi1 = scale(svgPt.y, lossPlot.top + lossPlot.height, lossPlot.top, lossPlot.yMin, lossPlot.yMax);
        update();
      }

      function fittedLineElement(plot, phi0, phi1) {
        const l = document.createElementNS(svgns, "line");
        setAttrs(l, {
          x1: dataX(0),
          y1: dataY(phi0),
          x2: dataX(2),
          y2: dataY(phi0 + 2 * phi1)
        });
        return l;
      }

      function leastSquares(points) {
        const n = points.length;
        const meanX = points.reduce(function (sum, p) { return sum + p[0]; }, 0) / n;
        const meanY = points.reduce(function (sum, p) { return sum + p[1]; }, 0) / n;
        let numerator = 0;
        let denominator = 0;
        points.forEach(function (p) {
          numerator += (p[0] - meanX) * (p[1] - meanY);
          denominator += Math.pow(p[0] - meanX, 2);
        });
        const phi1 = numerator / denominator;
        const phi0 = meanY - phi1 * meanX;
        return { phi0: phi0, phi1: phi1 };
      }

      function loss(phi0, phi1) {
        return samples.reduce(function (sum, p) {
          return sum + Math.pow(phi0 + phi1 * p[0] - p[1], 2);
        }, 0) / samples.length;
      }

      function lossStats() {
        let max = 0;
        for (let j = 0; j <= 80; j += 1) {
          const phi1 = scale(j, 0, 80, lossPlot.yMin, lossPlot.yMax);
          for (let i = 0; i <= 80; i += 1) {
            const phi0 = scale(i, 0, 80, lossPlot.xMin, lossPlot.xMax);
            max = Math.max(max, loss(phi0, phi1));
          }
        }
        return { max: max };
      }

      function ramp(t) {
        const scaled = clamp(t, 0, 1) * (palette.length - 1);
        const i = Math.min(palette.length - 2, Math.floor(scaled));
        const f = scaled - i;
        return [
          Math.round(lerp(palette[i][0], palette[i + 1][0], f)),
          Math.round(lerp(palette[i][1], palette[i + 1][1], f)),
          Math.round(lerp(palette[i][2], palette[i + 1][2], f))
        ];
      }

      function lossX(phi0) {
        return scale(phi0, lossPlot.xMin, lossPlot.xMax, lossPlot.left, lossPlot.left + lossPlot.width);
      }

      function lossY(phi1) {
        return scale(phi1, lossPlot.yMin, lossPlot.yMax, lossPlot.top + lossPlot.height, lossPlot.top);
      }

      function dataX(x) {
        return scale(x, dataPlot.xMin, dataPlot.xMax, dataPlot.left, dataPlot.left + dataPlot.width);
      }

      function dataY(y) {
        return scale(y, dataPlot.yMin, dataPlot.yMax, dataPlot.top + dataPlot.height, dataPlot.top);
      }

      function line(x1, y1, x2, y2, className) {
        const l = document.createElementNS(svgns, "line");
        if (className) {
          l.classList.add(className);
        }
        setAttrs(l, { x1: x1, y1: y1, x2: x2, y2: y2 });
        return l;
      }

      function text(content, x, y, className, anchor, baseline) {
        const t = document.createElementNS(svgns, "text");
        t.textContent = content;
        if (className) {
          t.classList.add(className);
        }
        setAttrs(t, {
          x: x,
          y: y,
          "text-anchor": anchor || "start",
          "dominant-baseline": baseline || "auto"
        });
        return t;
      }

      function setAttrs(el, attrs) {
        Object.keys(attrs).forEach(function (key) {
          el.setAttribute(key, attrs[key]);
        });
      }

      function scale(value, inMin, inMax, outMin, outMax) {
        return outMin + (value - inMin) * (outMax - outMin) / (inMax - inMin);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatTick(value) {
        return Number.isInteger(value) ? String(value) : value.toFixed(1);
      }
    })();
  </script>
</body>
</html>
