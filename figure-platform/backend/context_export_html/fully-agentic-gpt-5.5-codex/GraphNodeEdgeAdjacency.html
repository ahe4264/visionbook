<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph Node, Edge, and Adjacency Representations</title>
  <!-- Recreated from the provided local reference image:
       C:\Users\ahe42\Documents\figure-benchmark\public\images\cs\2d\GraphNodeEdgeAdjacency.png -->
  <style>
    :root {
      --ink: #141414;
      --muted: #5d6770;
      --paper: #ffffff;
      --panel: #f4f7f8;
      --edge: #486a7a;
      --blue: #46687a;
      --brown: #7b3c25;
      --teal: #2d8d82;
      --grid: #3f5158;
      --hilite: #ffd45f;
      --hilite-soft: rgba(255, 212, 95, 0.28);
      --shadow: 0 20px 54px rgba(27, 43, 56, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7fafb;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 22px);
    }

    .figure-shell {
      width: min(1640px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage {
      width: 100%;
      overflow: auto;
      border: 1px solid #dce4e8;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1060px;
      height: auto;
      max-height: calc(100vh - 116px);
      background: var(--paper);
    }

    .figure-shell[data-view="a"] svg,
    .figure-shell[data-view="b"] svg,
    .figure-shell[data-view="c"] svg,
    .figure-shell[data-view="d"] svg {
      min-width: min(100%, 720px);
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #d6e0e4;
      border-radius: 8px;
      background: #ffffff;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    button {
      appearance: none;
      min-height: 34px;
      border: 1px solid #aebdc5;
      border-radius: 7px;
      background: #ffffff;
      color: #20313a;
      font: 700 14px/1 Arial, Helvetica, sans-serif;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: #597889;
      background: #f1f6f8;
    }

    button[aria-pressed="true"] {
      background: #315f73;
      color: #ffffff;
      border-color: #315f73;
    }

    .status {
      min-width: 0;
      color: #465a64;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .panel.hidden {
      display: none;
    }

    .panel-letter {
      font-size: 44px;
      fill: #000000;
    }

    .math-label {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .graph-edge {
      stroke: var(--edge);
      stroke-width: 3.4;
      stroke-linecap: round;
      fill: none;
      transition: stroke-width 160ms ease, stroke 160ms ease;
    }

    .edge-hit {
      stroke: transparent;
      stroke-width: 24;
      stroke-linecap: round;
      fill: none;
      cursor: pointer;
    }

    .graph-edge.selected {
      stroke: #e7a52c;
      stroke-width: 7;
    }

    .graph-edge.related {
      stroke: #6990a0;
      stroke-width: 5;
    }

    .node circle {
      fill: #ffffff;
      stroke: var(--brown);
      stroke-width: 3.5;
      transition: stroke-width 160ms ease, fill 160ms ease;
    }

    .node text {
      font-size: 31px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .node {
      cursor: pointer;
    }

    .node.selected circle,
    .node.edge-end circle {
      fill: #fff5ce;
      stroke: #d39125;
      stroke-width: 6;
    }

    .node.related circle {
      stroke-width: 5;
    }

    .feature-cell {
      stroke: #40545a;
      stroke-width: 2.8;
      rx: 1;
      ry: 1;
    }

    .feature-stack .feature-cell {
      stroke-width: 2.2;
    }

    .feature-stack {
      pointer-events: none;
    }

    .feature-stack.active .feature-cell,
    .edge-stack.active .feature-cell {
      stroke: #e5a620;
      stroke-width: 3.2;
    }

    .edge-label text {
      font-size: 16px;
      font-weight: 700;
      fill: #74412b;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .edge-label {
      pointer-events: none;
    }

    .edge-label rect {
      fill: rgba(255, 255, 255, 0.92);
      stroke: rgba(123, 60, 37, 0.32);
      stroke-width: 1;
      rx: 4;
    }

    .edge-label.selected rect {
      fill: #fff1bb;
      stroke: #d39125;
      stroke-width: 2;
    }

    .matrix-title {
      fill: var(--blue);
      font-size: 33px;
      text-anchor: middle;
    }

    .matrix-title.brown {
      fill: var(--brown);
    }

    .matrix-title.teal {
      fill: var(--teal);
    }

    .matrix-dim {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 35px;
      text-anchor: middle;
      fill: currentColor;
    }

    .axis-label {
      font-size: 30px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .adj-cell {
      fill: #ffffff;
      stroke: var(--grid);
      stroke-width: 3.5;
      transition: fill 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }

    .adj-cell.on {
      fill: var(--blue);
    }

    .adj-cell.node-axis {
      stroke: #f2bf3f;
      stroke-width: 5;
    }

    .adj-cell.edge-entry {
      fill: #ffd45f;
      stroke: #a66a00;
      stroke-width: 5;
    }

    .matrix-cell {
      transition: stroke 160ms ease, stroke-width 160ms ease, filter 160ms ease;
    }

    .matrix-cell.selected-col {
      stroke: #e0a21e;
      stroke-width: 4.5;
      filter: drop-shadow(0 0 3px rgba(224, 162, 30, 0.55));
    }

    .matrix-header.selected {
      fill: #b07411;
      font-weight: 700;
    }

    .soft-band {
      fill: var(--hilite-soft);
      stroke: none;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .status {
        text-align: left;
        white-space: normal;
      }

      button {
        flex: 1 1 58px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" data-view="all">
    <div class="controls" aria-label="Figure controls">
      <div class="tabs" role="toolbar" aria-label="Panel view">
        <button type="button" data-panel="all" aria-pressed="true">All</button>
        <button type="button" data-panel="a" aria-pressed="false">a</button>
        <button type="button" data-panel="b" aria-pressed="false">b</button>
        <button type="button" data-panel="c" aria-pressed="false">c</button>
        <button type="button" data-panel="d" aria-pressed="false">d</button>
      </div>
      <div class="status" id="status" aria-live="polite">Graph data structures: G, A, X, and E</div>
      <button type="button" id="reset">Reset</button>
    </div>

    <div class="stage">
      <svg id="figure" viewBox="0 0 1640 540" role="img" aria-labelledby="title desc">
        <title id="title">Graph represented by adjacency, node feature, and edge feature matrices</title>
        <desc id="desc">Four linked panels show a six-node undirected graph, a six by six adjacency matrix, a five by six node feature matrix, and a four by seven edge feature matrix.</desc>

        <g id="panel-a" class="panel" data-panel="a">
          <text class="panel-letter" x="0" y="39">a)</text>
          <g id="graph-edges"></g>
          <g id="edge-feature-stacks"></g>
          <g id="node-feature-stacks"></g>
          <g id="edge-labels"></g>
          <g id="graph-nodes"></g>
        </g>

        <g id="panel-b" class="panel" data-panel="b" transform="translate(755 0)">
          <text class="panel-letter" x="0" y="39">b)</text>
          <text class="matrix-title" x="184" y="106">Adjacency</text>
          <text class="matrix-title" x="184" y="148">matrix, <tspan class="math-label">A</tspan></text>
          <text class="matrix-dim" x="184" y="191" fill="#46687a">N x N</text>
          <g id="adjacency-matrix" transform="translate(82 214)"></g>
        </g>

        <g id="panel-c" class="panel" data-panel="c" transform="translate(1180 0)">
          <text class="panel-letter" x="0" y="39">c)</text>
          <text class="matrix-title brown" x="92" y="97">Node</text>
          <text class="matrix-title brown" x="92" y="139">data, <tspan class="math-label">X</tspan></text>
          <text class="matrix-dim" x="92" y="181" fill="#7b3c25">D x N</text>
          <g id="node-matrix" transform="translate(193 53)"></g>
        </g>

        <g id="panel-d" class="panel" data-panel="d" transform="translate(1180 276)">
          <text class="panel-letter" x="0" y="49">d)</text>
          <text class="matrix-title teal" x="92" y="139">Edge</text>
          <text class="matrix-title teal" x="92" y="181">data, <tspan class="math-label">E</tspan></text>
          <text class="matrix-dim" x="92" y="223" fill="#2d8d82">D<tspan baseline-shift="sub" font-size="22">E</tspan> x E</text>
          <g id="edge-matrix" transform="translate(171 34)"></g>
        </g>
      </svg>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const shell = document.querySelector(".figure-shell");
      const svg = document.getElementById("figure");
      const status = document.getElementById("status");

      const colors = {
        rust: "#c97955",
        rustDark: "#884728",
        peach: "#e4b39a",
        brownDark: "#4b291d",
        teal: "#4eb9ae",
        tealMid: "#78b9b2",
        tealPale: "#b9dcd7",
        tealDark: "#2b6661",
        tealDeep: "#285c59",
        blank: "#ffffff",
        blue: "#46687a"
      };

      const nodes = [
        { id: 1, x: 277, y: 108, sx: 316, sy: 4 },
        { id: 2, x: 50, y: 123, sx: 86, sy: 43 },
        { id: 3, x: 146, y: 329, sx: 92, sy: 316 },
        { id: 4, x: 493, y: 130, sx: 532, sy: 29 },
        { id: 5, x: 636, y: 275, sx: 676, sy: 225 },
        { id: 6, x: 375, y: 509, sx: 420, sy: 469 }
      ];

      const edges = [
        { id: "1-3", u: 1, v: 3, sx: 246, sy: 156, lx: 215, ly: 214 },
        { id: "1-4", u: 1, v: 4, sx: 397, sy: 38, lx: 385, ly: 116 },
        { id: "2-3", u: 2, v: 3, sx: 61, sy: 190, lx: 85, ly: 227 },
        { id: "3-4", u: 3, v: 4, sx: 352, sy: 221, lx: 313, ly: 245 },
        { id: "3-6", u: 3, v: 6, sx: 234, sy: 415, lx: 263, ly: 407 },
        { id: "4-5", u: 4, v: 5, sx: 584, sy: 134, lx: 565, ly: 198 },
        { id: "5-6", u: 5, v: 6, sx: 540, sy: 375, lx: 511, ly: 389 }
      ];

      const nodeFeatures = [
        [colors.rust, colors.peach, colors.rust, colors.rust, colors.brownDark, colors.rustDark],
        [colors.rustDark, colors.rustDark, colors.peach, colors.rustDark, colors.rustDark, colors.rust],
        [colors.rustDark, colors.rustDark, colors.peach, colors.rustDark, colors.rust, colors.rustDark],
        [colors.rust, colors.rustDark, colors.rustDark, colors.rust, colors.rust, colors.peach],
        [colors.peach, colors.rustDark, colors.rust, colors.rust, colors.rustDark, colors.rustDark]
      ];

      const edgeFeatures = [
        [colors.tealDark, colors.teal, colors.tealMid, colors.tealPale, colors.tealPale, colors.tealMid, colors.tealDark],
        [colors.tealPale, colors.tealPale, colors.tealPale, colors.tealDark, colors.tealPale, colors.tealPale, colors.tealPale],
        [colors.tealPale, colors.teal, colors.blank, colors.tealDark, colors.tealDeep, colors.tealPale, colors.tealDark],
        [colors.tealPale, colors.tealDark, colors.tealDeep, colors.tealMid, colors.tealDark, colors.tealDark, colors.tealPale]
      ];

      const selected = {
        node: null,
        edge: null,
        view: "all"
      };

      function el(tag, attrs) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          if (value !== null && value !== undefined) {
            node.setAttribute(key, String(value));
          }
        });
        return node;
      }

      function appendText(parent, text, attrs) {
        const t = el("text", attrs);
        t.textContent = text;
        parent.appendChild(t);
        return t;
      }

      function nodeById(id) {
        return nodes.find((node) => node.id === id);
      }

      function incidentTo(edge, nodeId) {
        return edge.u === nodeId || edge.v === nodeId;
      }

      function edgeIndexById(id) {
        return edges.findIndex((edge) => edge.id === id);
      }

      function stack(parent, cells, x, y, size, gap, className, attrs) {
        const group = el("g", Object.assign({ class: className || "" }, attrs || {}));
        cells.forEach((fill, index) => {
          group.appendChild(el("rect", {
            class: "feature-cell matrix-cell",
            x,
            y: y + index * (size + gap),
            width: size,
            height: size,
            fill
          }));
        });
        parent.appendChild(group);
        return group;
      }

      function drawGraph() {
        const edgeGroup = document.getElementById("graph-edges");
        const nodeGroup = document.getElementById("graph-nodes");
        const nodeStackGroup = document.getElementById("node-feature-stacks");
        const edgeStackGroup = document.getElementById("edge-feature-stacks");
        const labelGroup = document.getElementById("edge-labels");

        edges.forEach((edge) => {
          const a = nodeById(edge.u);
          const b = nodeById(edge.v);
          const line = el("line", {
            class: "graph-edge",
            id: "edge-line-" + edge.id,
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y
          });
          const hit = el("line", {
            class: "edge-hit",
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y,
            "data-edge": edge.id,
            tabindex: 0,
            role: "button",
            "aria-label": "Edge " + edge.u + " to " + edge.v
          });
          hit.addEventListener("click", () => selectEdge(edge.id));
          hit.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectEdge(edge.id);
            }
          });
          edgeGroup.appendChild(line);
          edgeGroup.appendChild(hit);

          const label = el("g", { class: "edge-label", id: "edge-label-" + edge.id });
          label.appendChild(el("rect", {
            x: edge.lx - 20,
            y: edge.ly - 13,
            width: 40,
            height: 25
          }));
          appendText(label, edge.u + "\\" + edge.v, { x: edge.lx, y: edge.ly + 1 });
          labelGroup.appendChild(label);
        });

        edges.forEach((edge, index) => {
          stack(edgeStackGroup, edgeFeatures.map((row) => row[index]), edge.sx, edge.sy, 16, 2, "edge-stack feature-stack", {
            id: "edge-stack-" + edge.id,
            "data-edge": edge.id
          });
        });

        nodes.forEach((node) => {
          stack(nodeStackGroup, nodeFeatures.map((row) => row[node.id - 1]), node.sx, node.sy, 16, 2, "node-stack feature-stack", {
            id: "node-stack-" + node.id,
            "data-node": node.id
          });
        });

        nodes.forEach((node) => {
          const group = el("g", {
            class: "node",
            id: "node-" + node.id,
            "data-node": node.id,
            tabindex: 0,
            role: "button",
            "aria-label": "Node " + node.id
          });
          group.appendChild(el("circle", { cx: node.x, cy: node.y, r: 31 }));
          appendText(group, String(node.id), { x: node.x, y: node.y + 1 });
          group.addEventListener("click", () => selectNode(node.id));
          group.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectNode(node.id);
            }
          });
          nodeGroup.appendChild(group);
        });
      }

      function adjacencyValue(row, col) {
        return edges.some((edge) => {
          return (edge.u === row && edge.v === col) || (edge.u === col && edge.v === row);
        });
      }

      function drawAdjacency() {
        const group = document.getElementById("adjacency-matrix");
        const size = 33;
        const gap = 5;
        const pitch = size + gap;

        for (let col = 1; col <= 6; col += 1) {
          appendText(group, String(col), {
            class: "axis-label matrix-header adj-col-header",
            id: "adj-col-head-" + col,
            x: 23 + (col - 1) * pitch,
            y: -14
          });
        }

        for (let row = 1; row <= 6; row += 1) {
          appendText(group, String(row), {
            class: "axis-label matrix-header adj-row-header",
            id: "adj-row-head-" + row,
            x: -18,
            y: 17 + (row - 1) * pitch
          });
        }

        for (let row = 1; row <= 6; row += 1) {
          for (let col = 1; col <= 6; col += 1) {
            const rect = el("rect", {
              class: "adj-cell matrix-cell" + (adjacencyValue(row, col) ? " on" : ""),
              id: "adj-" + row + "-" + col,
              x: (col - 1) * pitch,
              y: (row - 1) * pitch,
              width: size,
              height: size,
              "data-row": row,
              "data-col": col
            });
            rect.addEventListener("click", () => {
              if (row === col) {
                selectNode(row);
              } else if (adjacencyValue(row, col)) {
                const edge = edges.find((candidate) => {
                  return (candidate.u === row && candidate.v === col) || (candidate.u === col && candidate.v === row);
                });
                selectEdge(edge.id);
              } else {
                selectNode(row);
              }
            });
            group.appendChild(rect);
          }
        }
      }

      function drawNodeMatrix() {
        const group = document.getElementById("node-matrix");
        const size = 33;
        const gap = 6;
        const pitch = size + gap;

        for (let col = 1; col <= 6; col += 1) {
          appendText(group, String(col), {
            class: "axis-label matrix-header node-header",
            id: "x-head-" + col,
            x: 16 + (col - 1) * pitch,
            y: -18
          });
        }

        nodeFeatures.forEach((row, rowIndex) => {
          row.forEach((fill, colIndex) => {
            group.appendChild(el("rect", {
              class: "feature-cell matrix-cell node-cell",
              id: "x-" + (rowIndex + 1) + "-" + (colIndex + 1),
              x: colIndex * pitch,
              y: rowIndex * pitch,
              width: size,
              height: size,
              fill,
              "data-node": colIndex + 1
            }));
          });
        });
      }

      function drawEdgeMatrix() {
        const group = document.getElementById("edge-matrix");
        const size = 33;
        const gap = 6;
        const pitch = size + gap;

        edges.forEach((edge, index) => {
          appendText(group, String(edge.u), {
            class: "axis-label matrix-header edge-header edge-header-top",
            id: "e-head-u-" + edge.id,
            x: 16 + index * pitch,
            y: 17
          });
          appendText(group, String(edge.v), {
            class: "axis-label matrix-header edge-header edge-header-bottom",
            id: "e-head-v-" + edge.id,
            x: 16 + index * pitch,
            y: 60
          });
        });

        edgeFeatures.forEach((row, rowIndex) => {
          row.forEach((fill, colIndex) => {
            group.appendChild(el("rect", {
              class: "feature-cell matrix-cell edge-cell",
              id: "e-" + (rowIndex + 1) + "-" + edges[colIndex].id,
              x: colIndex * pitch,
              y: 83 + rowIndex * pitch,
              width: size,
              height: size,
              fill,
              "data-edge": edges[colIndex].id
            }));
          });
        });
      }

      function clearClasses(selector, classes) {
        document.querySelectorAll(selector).forEach((item) => {
          classes.forEach((className) => item.classList.remove(className));
        });
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function updateHighlights() {
        clearClasses(".node", ["selected", "related", "edge-end"]);
        clearClasses(".graph-edge", ["selected", "related"]);
        clearClasses(".edge-label", ["selected"]);
        clearClasses(".feature-stack", ["active"]);
        clearClasses(".adj-cell", ["node-axis", "edge-entry"]);
        clearClasses(".matrix-cell", ["selected-col"]);
        clearClasses(".matrix-header", ["selected"]);

        if (selected.node !== null) {
          const node = selected.node;
          document.getElementById("node-" + node).classList.add("selected");
          document.getElementById("node-stack-" + node).classList.add("active");
          document.getElementById("x-head-" + node).classList.add("selected");
          document.querySelectorAll('[data-node="' + node + '"].node-cell').forEach((cell) => {
            cell.classList.add("selected-col");
          });
          document.querySelectorAll(".adj-cell").forEach((cell) => {
            const row = Number(cell.dataset.row);
            const col = Number(cell.dataset.col);
            if (row === node || col === node) {
              cell.classList.add("node-axis");
            }
          });
          document.getElementById("adj-row-head-" + node).classList.add("selected");
          document.getElementById("adj-col-head-" + node).classList.add("selected");
          edges.filter((edge) => incidentTo(edge, node)).forEach((edge) => {
            document.getElementById("edge-line-" + edge.id).classList.add("related");
          });
          setStatus("Node " + node + ": row and column in A, column in X");
        }

        if (selected.edge !== null) {
          const edge = edges.find((candidate) => candidate.id === selected.edge);
          document.getElementById("edge-line-" + edge.id).classList.add("selected");
          document.getElementById("edge-label-" + edge.id).classList.add("selected");
          document.getElementById("edge-stack-" + edge.id).classList.add("active");
          document.getElementById("node-" + edge.u).classList.add("edge-end");
          document.getElementById("node-" + edge.v).classList.add("edge-end");
          document.getElementById("adj-" + edge.u + "-" + edge.v).classList.add("edge-entry");
          document.getElementById("adj-" + edge.v + "-" + edge.u).classList.add("edge-entry");
          document.getElementById("e-head-u-" + edge.id).classList.add("selected");
          document.getElementById("e-head-v-" + edge.id).classList.add("selected");
          document.querySelectorAll('[data-edge="' + edge.id + '"].edge-cell').forEach((cell) => {
            cell.classList.add("selected-col");
          });
          setStatus("Edge " + edge.u + "\\" + edge.v + ": endpoints in G, column in E");
        }

        if (selected.node === null && selected.edge === null) {
          setStatus("Graph data structures: G, A, X, and E");
        }
      }

      function selectNode(node) {
        selected.node = node;
        selected.edge = null;
        updateHighlights();
      }

      function selectEdge(edgeId) {
        selected.edge = edgeId;
        selected.node = null;
        updateHighlights();
      }

      function resetSelection() {
        selected.node = null;
        selected.edge = null;
        updateHighlights();
      }

      const viewBoxes = {
        all: "0 0 1640 540",
        a: "0 0 690 540",
        b: "735 0 430 540",
        c: "1160 0 480 254",
        d: "1160 264 480 276"
      };

      function setView(view) {
        selected.view = view;
        shell.dataset.view = view;
        svg.setAttribute("viewBox", viewBoxes[view]);
        document.querySelectorAll(".panel").forEach((panel) => {
          panel.classList.toggle("hidden", view !== "all" && panel.dataset.panel !== view);
        });
        document.querySelectorAll("[data-panel]").forEach((button) => {
          if (button.tagName.toLowerCase() === "button") {
            button.setAttribute("aria-pressed", button.dataset.panel === view ? "true" : "false");
          }
        });
      }

      drawGraph();
      drawAdjacency();
      drawNodeMatrix();
      drawEdgeMatrix();
      updateHighlights();

      document.querySelectorAll("button[data-panel]").forEach((button) => {
        button.addEventListener("click", () => setView(button.dataset.panel));
      });
      document.getElementById("reset").addEventListener("click", resetSelection);
    }());
  </script>
</body>
</html>
