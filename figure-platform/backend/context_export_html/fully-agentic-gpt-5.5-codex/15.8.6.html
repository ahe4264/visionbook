<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure 15.8.6 - Curl and a Paddle Wheel</title>
  <style>
    :root {
      --ink: #242326;
      --muted: #59626d;
      --line: #d9e0e7;
      --panel: #ffffff;
      --stage: #fbfdff;
      --blue: #87cde4;
      --blue-strong: #4aa7c9;
      --salmon: #f7c9b6;
      --salmon-dark: #2a2528;
      --focus: #2b7ea0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef3f7;
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .figure-shell {
      width: min(1180px, 100%);
      background: var(--panel);
      border: 1px solid rgba(32, 35, 38, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 46px rgba(28, 39, 52, 0.12);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) minmax(210px, 0.75fr);
      gap: 14px;
      align-items: end;
      padding: 13px 16px 12px;
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
    }

    .control {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      line-height: 1.2;
    }

    output,
    .readout {
      color: var(--ink);
      font: 700 13px/1.25 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--focus);
    }

    input[type="range"]:focus-visible {
      outline: 3px solid rgba(43, 126, 160, 0.22);
      outline-offset: 4px;
      border-radius: 999px;
    }

    .readout {
      min-height: 34px;
      display: grid;
      align-content: center;
      padding: 7px 9px;
      border: 1px solid #dbe4ec;
      border-radius: 6px;
      background: #ffffff;
    }

    .stage {
      background: var(--stage);
      padding: clamp(8px, 1.8vw, 18px);
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 900 / 640;
      touch-action: none;
      user-select: none;
    }

    .flow-arc {
      fill: none;
      stroke: var(--blue);
      stroke-width: 5.2;
      stroke-linecap: round;
      opacity: 0.95;
    }

    .spindle,
    .rod,
    .rotation-arrow {
      fill: none;
      stroke: var(--ink);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rod {
      stroke-width: 4.2;
    }

    .spindle-guide {
      fill: none;
      stroke: #6d6970;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-dasharray: 7 8;
      opacity: 0.55;
    }

    .curl-vector {
      fill: none;
      stroke: var(--ink);
      stroke-width: 5.2;
      stroke-linecap: round;
    }

    .blade {
      fill: var(--salmon);
      stroke: var(--salmon-dark);
      stroke-width: 4;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.05));
    }

    .hub {
      fill: #211f22;
      stroke: #211f22;
      stroke-width: 2;
      cursor: grab;
    }

    .hub-hit {
      fill: transparent;
      cursor: grab;
      pointer-events: all;
    }

    .dragging .hub,
    .dragging .hub-hit {
      cursor: grabbing;
    }

    .math-label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 66px;
      paint-order: stroke;
      stroke: rgba(251, 253, 255, 0.86);
      stroke-width: 7;
      stroke-linejoin: round;
    }

    .curl-label {
      font-size: 64px;
    }

    .small-label {
      fill: var(--muted);
      font: 700 15px/1 Inter, "Segoe UI", Roboto, Arial, sans-serif;
      paint-order: stroke;
      stroke: rgba(251, 253, 255, 0.88);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .badge {
      fill: rgba(255, 255, 255, 0.82);
      stroke: rgba(89, 98, 109, 0.28);
      stroke-width: 1.4;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .controls {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 11px 12px;
      }

      .stage {
        padding: 6px;
      }

      .curl-label {
        font-size: 54px;
      }

      .math-label {
        font-size: 56px;
      }
    }
  </style>
</head>
<body>
  <main class="figure-shell" aria-label="Interactive figure showing curl as the axis and rate of a small paddle wheel in a fluid flow">
    <section class="controls" aria-label="Figure controls">
      <div class="control">
        <label for="rate">
          <span>Rotation rate</span>
          <output id="rateOut" for="rate">1.00x</output>
        </label>
        <input id="rate" type="range" min="-2" max="2" step="0.01" value="1" aria-label="Rotation rate">
      </div>
      <div class="control">
        <label for="strength">
          <span>Local field strength</span>
          <output id="strengthOut" for="strength">1.00x</output>
        </label>
        <input id="strength" type="range" min="0" max="2.4" step="0.01" value="1" aria-label="Local field strength">
      </div>
      <div class="readout" id="curlReadout" aria-live="polite">curl = +0.90 k</div>
    </section>

    <section class="stage">
      <svg id="figure" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
        <title id="title">Curl vector and rotating paddle wheel at point P0</title>
        <desc id="desc">A draggable point P0 sits at the pivot of a four-bladed paddle wheel in a circular fluid flow. Dashed blue arcs show circulation, and a vertical spindle arrow labeled Curl F of P0 shows the local curl vector.</desc>
        <defs>
          <marker id="curlArrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#242326"></path>
          </marker>
          <marker id="flowArrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 1 1 L 11 6 L 1 11 Q 4.3 6 1 1 Z" fill="#87cde4"></path>
          </marker>
        </defs>

        <rect width="900" height="640" fill="#fbfdff"></rect>
        <g id="rings"></g>
        <g id="spindleBack"></g>
        <g id="rods"></g>
        <g id="blades"></g>
        <g id="spindleFront"></g>
        <g id="labels"></g>
        <g id="pointGroup">
          <circle id="hub" class="hub" cx="450" cy="352" r="13"></circle>
          <circle id="hubHit" class="hub-hit" cx="450" cy="352" r="34"></circle>
        </g>
      </svg>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("figure");
      const rings = document.getElementById("rings");
      const rods = document.getElementById("rods");
      const blades = document.getElementById("blades");
      const spindleBack = document.getElementById("spindleBack");
      const spindleFront = document.getElementById("spindleFront");
      const labels = document.getElementById("labels");
      const pointGroup = document.getElementById("pointGroup");
      const hub = document.getElementById("hub");
      const hubHit = document.getElementById("hubHit");
      const rate = document.getElementById("rate");
      const strength = document.getElementById("strength");
      const rateOut = document.getElementById("rateOut");
      const strengthOut = document.getElementById("strengthOut");
      const curlReadout = document.getElementById("curlReadout");

      const state = {
        p: { x: 450, y: 352 },
        angle: -0.16,
        dragging: false,
        lastTime: performance.now()
      };

      const bounds = {
        minX: 220,
        maxX: 680,
        minY: 268,
        maxY: 422
      };

      const create = (name, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.keys(attrs || {}).forEach((key) => el.setAttribute(key, attrs[key]));
        return el;
      };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const fmt = (value) => (value >= 0 ? "+" : "") + value.toFixed(2);

      function fieldShape(point) {
        const horizontalVariation = 0.9 * Math.cos((point.x - 430) / 190);
        const verticalVariation = 0.5 * Math.sin((point.y - 350) / 110);
        return horizontalVariation + verticalVariation;
      }

      function curlScalar() {
        return Number(rate.value) * Number(strength.value) * fieldShape(state.p);
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function arcPath(cx, cy, rx, ry, startDeg, endDeg) {
        const start = (Math.PI / 180) * startDeg;
        const end = (Math.PI / 180) * endDeg;
        const x0 = cx + rx * Math.cos(start);
        const y0 = cy + ry * Math.sin(start);
        const x1 = cx + rx * Math.cos(end);
        const y1 = cy + ry * Math.sin(end);
        const largeArc = Math.abs(endDeg - startDeg) > 180 ? 1 : 0;
        const sweep = endDeg > startDeg ? 1 : 0;
        return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rx} ${ry} 0 ${largeArc} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
      }

      function addText(parent, text, x, y, className, anchor) {
        const t = create("text", {
          x: x.toFixed(1),
          y: y.toFixed(1),
          class: className,
          "text-anchor": anchor || "middle"
        });
        t.textContent = text;
        parent.appendChild(t);
        return t;
      }

      function drawRings(curl) {
        rings.replaceChildren();
        const p = state.p;
        const dir = curl >= 0 ? 1 : -1;
        const mag = Math.min(1, Math.abs(curl) / 3.1);
        const widths = [3.8, 4.6, 5.2, 5.7];
        const ringData = [
          { rx: 122, ry: 60, starts: [-28, 62, 150, 236] },
          { rx: 176, ry: 88, starts: [-17, 79, 170, 255] },
          { rx: 232, ry: 118, starts: [3, 93, 187, 272] },
          { rx: 292, ry: 151, starts: [17, 112, 205, 290] }
        ];

        ringData.forEach((ring, idx) => {
          ring.starts.forEach((start, segIdx) => {
            const length = 43 + idx * 7 + (segIdx % 2) * 9;
            const a0 = dir > 0 ? start : start + length;
            const a1 = dir > 0 ? start + length : start;
            const path = create("path", {
              d: arcPath(p.x, p.y, ring.rx, ring.ry, a0, a1),
              class: "flow-arc",
              "stroke-width": (widths[idx] + mag * 1.8).toFixed(2),
              opacity: (0.55 + Number(strength.value) * 0.18).toFixed(2)
            });
            if (segIdx === 0 || (idx > 1 && segIdx === 2)) {
              path.setAttribute("marker-end", "url(#flowArrow)");
            }
            rings.appendChild(path);
          });
        });
      }

      function projectedVector(angle) {
        const e1 = { x: 1, y: -0.12 };
        const e2 = { x: 0.46, y: 0.82 };
        const x = e1.x * Math.cos(angle) + e2.x * Math.sin(angle);
        const y = e1.y * Math.cos(angle) + e2.y * Math.sin(angle);
        const length = Math.hypot(x, y) || 1;
        return { x: x / length, y: y / length };
      }

      function drawPaddleWheel(curl) {
        rods.replaceChildren();
        blades.replaceChildren();
        const p = state.p;
        const pieces = [];

        for (let i = 0; i < 4; i += 1) {
          const a = state.angle + i * Math.PI / 2;
          const d = projectedVector(a);
          const tangent = { x: -d.y, y: d.x };
          const side = Math.sin(a);
          const inner = 82;
          const outer = 224;
          const halfWidth = 28 + 17 * Math.abs(Math.cos(a));
          const centerDepth = p.y + d.y * 153 + side * 7;

          const rodEnd = {
            x: p.x + d.x * (outer - 10),
            y: p.y + d.y * (outer - 10)
          };
          const r = create("line", {
            x1: p.x,
            y1: p.y,
            x2: rodEnd.x.toFixed(1),
            y2: rodEnd.y.toFixed(1),
            class: "rod"
          });
          rods.appendChild(r);

          const p1 = {
            x: p.x + d.x * inner + tangent.x * halfWidth,
            y: p.y + d.y * inner + tangent.y * halfWidth
          };
          const p2 = {
            x: p.x + d.x * outer + tangent.x * halfWidth,
            y: p.y + d.y * outer + tangent.y * halfWidth
          };
          const p3 = {
            x: p.x + d.x * outer - tangent.x * halfWidth,
            y: p.y + d.y * outer - tangent.y * halfWidth
          };
          const p4 = {
            x: p.x + d.x * inner - tangent.x * halfWidth,
            y: p.y + d.y * inner - tangent.y * halfWidth
          };
          pieces.push({
            depth: centerDepth,
            node: create("polygon", {
              points: [p1, p2, p3, p4].map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" "),
              class: "blade",
              opacity: (0.88 + Math.min(0.1, Math.abs(curl) * 0.03)).toFixed(2)
            })
          });
        }

        pieces
          .sort((a, b) => a.depth - b.depth)
          .forEach((piece) => blades.appendChild(piece.node));
      }

      function drawSpindleAndLabels(curl) {
        spindleBack.replaceChildren();
        spindleFront.replaceChildren();
        labels.replaceChildren();
        const p = state.p;
        const mag = Math.abs(curl);
        const direction = curl >= 0 ? -1 : 1;
        const arrowLen = mag < 0.015 ? 3 : clamp(58 + mag * 35, 64, 152);
        const top = p.y - 238;
        const bottom = p.y + 190;

        spindleBack.appendChild(create("line", {
          x1: p.x,
          y1: top.toFixed(1),
          x2: p.x,
          y2: bottom.toFixed(1),
          class: "spindle-guide"
        }));

        const arrowEndY = p.y + direction * arrowLen;
        if (mag >= 0.015) {
          spindleFront.appendChild(create("line", {
            x1: p.x,
            y1: p.y,
            x2: p.x,
            y2: arrowEndY.toFixed(1),
            class: "curl-vector",
            "marker-end": "url(#curlArrowUp)"
          }));
        } else {
          spindleFront.appendChild(create("circle", {
            cx: p.x,
            cy: p.y,
            r: 18,
            fill: "none",
            stroke: "#242326",
            "stroke-width": 3.2,
            opacity: 0.65
          }));
        }

        const rotRadiusX = 58 + Math.min(18, mag * 6);
        const rotRadiusY = 20;
        const rotY = p.y - 218;
        const spinDir = curl >= 0 ? 1 : -1;
        const start = spinDir > 0 ? 205 : -25;
        const end = spinDir > 0 ? 515 : -335;
        spindleFront.appendChild(create("path", {
          d: arcPath(p.x, rotY, rotRadiusX, rotRadiusY, start, end),
          class: "rotation-arrow",
          "stroke-width": 3.1,
          "marker-end": "url(#curlArrowUp)"
        }));

        const labelY = curl >= 0 ? arrowEndY - 28 : arrowEndY + 58;
        const label = addText(labels, "Curl F(P\u2080)", p.x + 182, labelY, "math-label curl-label", "middle");
        label.setAttribute("aria-hidden", "true");
        addText(labels, "P\u2080", p.x - 43, p.y + 58, "math-label", "middle");

        const badgeX = clamp(p.x - 265, 24, 612);
        const badgeY = clamp(p.y - 244, 18, 112);
        const badge = create("g", {});
        badge.appendChild(create("rect", {
          x: badgeX,
          y: badgeY,
          width: 248,
          height: 60,
          rx: 7,
          class: "badge"
        }));
        addText(badge, "local circulation density", badgeX + 124, badgeY + 22, "small-label", "middle");
        addText(badge, `curl F(P\u2080) = ${fmt(curl)} k`, badgeX + 124, badgeY + 45, "small-label", "middle");
        labels.appendChild(badge);
      }

      function updateOutputs(curl) {
        const rateValue = Number(rate.value);
        const strengthValue = Number(strength.value);
        rateOut.textContent = `${rateValue.toFixed(2)}x`;
        strengthOut.textContent = `${strengthValue.toFixed(2)}x`;
        const direction = Math.abs(curl) < 0.015 ? "zero" : curl > 0 ? "upward" : "downward";
        curlReadout.textContent = `curl = ${fmt(curl)} k, ${direction}`;
      }

      function render() {
        const curl = curlScalar();
        drawRings(curl);
        drawSpindleAndLabels(curl);
        drawPaddleWheel(curl);
        hub.setAttribute("cx", state.p.x);
        hub.setAttribute("cy", state.p.y);
        hubHit.setAttribute("cx", state.p.x);
        hubHit.setAttribute("cy", state.p.y);
        updateOutputs(curl);
      }

      function tick(now) {
        const dt = Math.min(0.05, (now - state.lastTime) / 1000);
        state.lastTime = now;
        const curl = curlScalar();
        const angularSpeed = curl * 1.35;
        state.angle += angularSpeed * dt;
        render();
        requestAnimationFrame(tick);
      }

      function beginDrag(evt) {
        state.dragging = true;
        pointGroup.classList.add("dragging");
        svg.setPointerCapture(evt.pointerId);
        moveDrag(evt);
      }

      function moveDrag(evt) {
        if (!state.dragging) {
          return;
        }
        const pt = svgPoint(evt);
        state.p.x = clamp(pt.x, bounds.minX, bounds.maxX);
        state.p.y = clamp(pt.y, bounds.minY, bounds.maxY);
        render();
      }

      function endDrag(evt) {
        state.dragging = false;
        pointGroup.classList.remove("dragging");
        if (svg.hasPointerCapture(evt.pointerId)) {
          svg.releasePointerCapture(evt.pointerId);
        }
      }

      hubHit.addEventListener("pointerdown", beginDrag);
      hub.addEventListener("pointerdown", beginDrag);
      svg.addEventListener("pointermove", moveDrag);
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);
      rate.addEventListener("input", render);
      strength.addEventListener("input", render);

      render();
      requestAnimationFrame(tick);
    }());
  </script>
</body>
</html>
