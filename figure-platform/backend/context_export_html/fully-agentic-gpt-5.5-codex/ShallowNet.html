<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShallowNet Interactive Figure</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #6f7378;
      --paper: #ffffff;
      --panel: #f7f9fb;
      --line: #111111;
      --orange: #cf7d5f;
      --orange-dark: #b95f42;
      --teal: #71cbc2;
      --teal-soft: #d9f4f1;
      --focus: #157f75;
      --rule: #d9dde3;
      --shadow: 0 18px 42px rgba(31, 38, 46, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #f3f6f8 0%, #ffffff 38%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 28px;
    }

    .figure-shell {
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--rule);
      background: #fbfcfd;
    }

    .segmented,
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .segmented {
      padding: 3px;
      border: 1px solid #d3d9df;
      border-radius: 8px;
      background: #eef2f5;
    }

    button {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #2d343b;
      font: 650 14px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    .segmented button {
      padding: 0 11px;
    }

    .segmented button[aria-pressed="true"] {
      border-color: #c9d1d8;
      background: #ffffff;
      color: #0b0f13;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .clear-button {
      padding: 0 12px;
      border-color: #cfd6dc;
      background: #ffffff;
    }

    button:focus-visible,
    input[type="range"]:focus-visible,
    .hidden-hit:focus-visible {
      outline: 3px solid rgba(21, 127, 117, 0.25);
      outline-offset: 2px;
    }

    .slider-wrap {
      justify-content: flex-end;
      color: #293038;
      font-size: 14px;
      font-weight: 650;
    }

    .slider-wrap input {
      width: min(230px, 40vw);
      accent-color: var(--focus);
    }

    .unit-count {
      display: inline-grid;
      min-width: 2.2ch;
      place-items: center;
      color: var(--focus);
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      padding: 12px;
      background: var(--paper);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      border-radius: 6px;
      background: #ffffff;
      touch-action: manipulation;
    }

    .panel-backdrop {
      fill: #ffffff;
    }

    .panel-divider {
      stroke: #eef1f4;
      stroke-width: 2;
    }

    .panel-title {
      fill: #000000;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: 500;
    }

    .edge {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3.2;
    }

    .edge.black {
      stroke: var(--line);
    }

    .edge.orange {
      stroke: var(--orange);
    }

    .edge.ghost {
      opacity: 0.42;
    }

    .edge.selected {
      stroke-width: 6.6;
      filter: drop-shadow(0 0 5px rgba(21, 127, 117, 0.38));
    }

    .edge.selected.black {
      stroke: #0d766e;
    }

    .edge.selected.orange {
      stroke: var(--orange-dark);
    }

    .node {
      fill: #ffffff;
      stroke: #050505;
      stroke-width: 3.2;
    }

    .bias-node {
      fill: #ffffff;
      stroke: var(--orange);
      stroke-width: 3;
    }

    .node.selected {
      fill: var(--teal-soft);
      stroke: var(--focus);
      stroke-width: 4.2;
    }

    .activation-stroke {
      fill: none;
      stroke: var(--teal);
      stroke-width: 8;
      stroke-linecap: round;
      opacity: 0.82;
      pointer-events: none;
    }

    .node-label,
    .bias-label,
    .weight-label {
      pointer-events: none;
      dominant-baseline: middle;
      text-anchor: middle;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .node-label {
      fill: #000000;
      font-size: 42px;
    }

    .hidden-label {
      font-size: 38px;
    }

    .bias-label {
      fill: var(--orange);
      font-size: 36px;
      font-style: normal;
    }

    .weight-label {
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
      font-size: 30px;
    }

    .weight-label.theta-bias,
    .weight-label.phi-bias {
      fill: var(--orange);
    }

    .weight-label.theta-input,
    .weight-label.phi-output {
      fill: #8d8d8d;
    }

    .weight-label.revealed {
      fill: #0e665f;
      font-weight: 650;
    }

    .math-sub {
      font-size: 58%;
      baseline-shift: sub;
      font-style: normal;
    }

    .hidden-hit {
      cursor: pointer;
    }

    .status {
      min-height: 32px;
      padding: 8px 16px 12px;
      color: #46505a;
      font-size: 14px;
      line-height: 1.35;
      border-top: 1px solid #eef1f4;
      background: #fbfcfd;
    }

    .status strong {
      color: #111111;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      main {
        width: calc(100vw - 18px);
        padding-top: 10px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .segmented {
        justify-content: center;
      }

      .segmented button {
        flex: 1 1 auto;
      }

      .slider-wrap {
        justify-content: space-between;
      }

      .slider-wrap input {
        width: min(100%, 320px);
        flex: 1 1 180px;
      }

      .canvas-wrap {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" aria-labelledby="figure-title">
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="Panel view">
          <button type="button" data-mode="both" aria-pressed="true">Both</button>
          <button type="button" data-mode="a" aria-pressed="false">Panel a</button>
          <button type="button" data-mode="b" aria-pressed="false">Panel b</button>
        </div>
        <label class="slider-wrap">
          <span>Hidden units <output id="unitCount" class="unit-count">3</output></span>
          <input id="unitSlider" type="range" min="1" max="6" value="3" step="1" aria-label="Number of hidden units">
          <button type="button" id="clearSelection" class="clear-button">Clear</button>
        </label>
      </div>
      <div class="canvas-wrap">
        <svg id="networkSvg" role="img" aria-labelledby="figure-title figure-desc"></svg>
      </div>
      <p id="figure-title" class="status">
        <strong>Shallow network:</strong>
        <span id="selectionStatus">No hidden unit selected.</span>
      </p>
      <p id="figure-desc" hidden>
        Interactive shallow neural network with one input, a variable hidden layer, one output, bias nodes, theta weights, and phi weights.
      </p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const svg = document.getElementById("networkSvg");
      const slider = document.getElementById("unitSlider");
      const count = document.getElementById("unitCount");
      const status = document.getElementById("selectionStatus");
      const clear = document.getElementById("clearSelection");
      const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));
      const NS = "http://www.w3.org/2000/svg";

      const state = {
        mode: "both",
        units: 3,
        selected: null
      };

      const layout = {
        panelWidth: 600,
        panelHeight: 430,
        margin: 24,
        singleWidth: 648,
        singleHeight: 472,
        bothWidth: 1280,
        bothHeight: 484,
        stackedHeight: 928
      };

      function makeEl(name, attrs = {}, text) {
        const node = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attrs)) {
          if (value !== null && value !== undefined) {
            node.setAttribute(key, String(value));
          }
        }
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function defs() {
        const d = makeEl("defs");
        [
          ["arrow-black", "#111111"],
          ["arrow-orange", "#cf7d5f"],
          ["arrow-selected-black", "#0d766e"],
          ["arrow-selected-orange", "#b95f42"],
          ["arrow-ghost", "#cf7d5f"]
        ].forEach(([id, fill]) => {
          const marker = makeEl("marker", {
            id,
            viewBox: "0 0 12 12",
            refX: 10.5,
            refY: 6,
            markerWidth: 12,
            markerHeight: 12,
            orient: "auto",
            markerUnits: "userSpaceOnUse"
          });
          marker.appendChild(makeEl("path", { d: "M0,0 L12,6 L0,12 Z", fill }));
          d.appendChild(marker);
        });
        return d;
      }

      function pointToward(from, to, distance) {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        return { x: from.x + (dx / len) * distance, y: from.y + (dy / len) * distance };
      }

      function segment(from, to, startRadius, endRadius) {
        return {
          start: pointToward(from, to, startRadius),
          end: pointToward(to, from, endRadius)
        };
      }

      function labelPoint(from, to, t, offset) {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        return {
          x: from.x + dx * t + nx * offset,
          y: from.y + dy * t + ny * offset
        };
      }

      function addPath(group, from, to, classes, markerId, startRadius = 0, endRadius = 0) {
        const s = segment(from, to, startRadius, endRadius);
        const path = makeEl("path", {
          d: `M ${s.start.x.toFixed(1)} ${s.start.y.toFixed(1)} L ${s.end.x.toFixed(1)} ${s.end.y.toFixed(1)}`,
          class: `edge ${classes}`,
          "marker-end": `url(#${markerId})`
        });
        group.appendChild(path);
        return path;
      }

      function addMathLabel(group, x, y, symbol, subscript, classes) {
        const text = makeEl("text", {
          x: x.toFixed(1),
          y: y.toFixed(1),
          class: `weight-label ${classes}`
        });
        text.appendChild(makeEl("tspan", {}, symbol));
        text.appendChild(makeEl("tspan", { class: "math-sub", dx: 1 }, subscript));
        group.appendChild(text);
      }

      function addNodeLabel(group, x, y, symbol, subscript, hidden = false) {
        const text = makeEl("text", {
          x,
          y: y + 4,
          class: `node-label${hidden ? " hidden-label" : ""}`
        });
        text.appendChild(makeEl("tspan", {}, symbol));
        if (subscript) text.appendChild(makeEl("tspan", { class: "math-sub", dx: 1 }, subscript));
        group.appendChild(text);
      }

      function addSimpleLabel(group, x, y, text, className) {
        group.appendChild(makeEl("text", { x, y: y + 2, class: className }, text));
      }

      function hiddenYValues(units) {
        if (units === 1) return [258];
        const top = units <= 3 ? 132 : 96;
        const bottom = units <= 3 ? 370 : 406;
        return Array.from({ length: units }, (_, i) => top + ((bottom - top) * i) / (units - 1));
      }

      function isSmallScreen() {
        return window.matchMedia("(max-width: 760px)").matches;
      }

      function panelPositions() {
        if (state.mode === "a") return [{ key: "a", variant: "labeled", x: 24, y: 28 }];
        if (state.mode === "b") return [{ key: "b", variant: "clean", x: 24, y: 28 }];
        if (isSmallScreen()) {
          return [
            { key: "a", variant: "labeled", x: 24, y: 24 },
            { key: "b", variant: "clean", x: 24, y: 476 }
          ];
        }
        return [
          { key: "a", variant: "labeled", x: 18, y: 28 },
          { key: "b", variant: "clean", x: 660, y: 28 }
        ];
      }

      function viewBoxForPanels(panels) {
        if (state.mode === "both" && isSmallScreen()) return `0 0 ${layout.singleWidth} ${layout.stackedHeight}`;
        if (state.mode === "both") return `0 0 ${layout.bothWidth} ${layout.bothHeight}`;
        return `0 0 ${layout.singleWidth} ${layout.singleHeight}`;
      }

      function addHiddenNode(group, panelKey, index, cx, cy, selected, showActivation) {
        const hit = makeEl("g", {
          class: "hidden-hit",
          tabindex: "0",
          role: "button",
          "aria-label": `Highlight hidden unit h ${index}`,
          "data-index": index
        });
        hit.addEventListener("click", () => selectHidden(index));
        hit.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectHidden(index);
          }
        });
        hit.appendChild(makeEl("circle", {
          cx,
          cy,
          r: 38,
          class: `node${selected ? " selected" : ""}`
        }));
        if (showActivation) {
          hit.appendChild(makeEl("path", {
            d: `M ${cx + 20} ${cy - 28} Q ${cx + 47} ${cy} ${cx + 20} ${cy + 28}`,
            class: "activation-stroke"
          }));
        }
        addNodeLabel(hit, cx, cy, "h", String(index), true);
        group.appendChild(hit);
      }

      function drawPanel(root, panel) {
        const group = makeEl("g", { transform: `translate(${panel.x}, ${panel.y})` });
        root.appendChild(group);

        group.appendChild(makeEl("rect", {
          x: 0,
          y: 0,
          width: layout.panelWidth,
          height: layout.panelHeight,
          class: "panel-backdrop"
        }));
        group.appendChild(makeEl("text", {
          x: 2,
          y: 34,
          class: "panel-title"
        }, `${panel.key})`));

        const labeled = panel.variant === "labeled";
        const selected = state.selected && state.selected <= state.units ? state.selected : null;
        const revealForClean = !labeled && selected;
        const ys = hiddenYValues(state.units);
        const xNode = { x: 56, y: 262 };
        const hiddenX = labeled ? 320 : 322;
        const output = { x: 560, y: 262 };
        const inputBias = labeled ? { x: 56, y: 146 } : { x: 78, y: 78 };
        const outputBias = labeled ? { x: 320, y: 58 } : { x: 320, y: 78 };
        const radius = 38;

        if (state.mode === "both" && !isSmallScreen() && panel.key === "b") {
          group.appendChild(makeEl("line", {
            x1: -28,
            y1: 24,
            x2: -28,
            y2: layout.panelHeight - 20,
            class: "panel-divider"
          }));
        }

        const edgeLayer = makeEl("g");
        const labelLayer = makeEl("g");
        const nodeLayer = makeEl("g");
        group.appendChild(edgeLayer);
        group.appendChild(labelLayer);
        group.appendChild(nodeLayer);

        const showBiasNodes = labeled || revealForClean;
        if (showBiasNodes) {
          ys.forEach((y, idx) => {
            const i = idx + 1;
            const h = { x: hiddenX, y };
            const selectedEdge = selected === i;
            const marker = selectedEdge ? "arrow-selected-orange" : revealForClean ? "arrow-ghost" : "arrow-orange";
            const classes = `orange${selectedEdge ? " selected" : ""}${revealForClean && !selectedEdge ? " ghost" : ""}`;
            if (labeled || selectedEdge) addPath(edgeLayer, inputBias, h, classes, marker, 38, radius);
            if (labeled || selectedEdge) {
              const p = labelPoint(inputBias, h, 0.56, labeled && i === 1 ? -20 : 16);
              addMathLabel(labelLayer, p.x, p.y, "θ", `${i}0`, selectedEdge ? "theta-bias revealed" : "theta-bias");
            }
          });
        }

        ys.forEach((y, idx) => {
          const i = idx + 1;
          const h = { x: hiddenX, y };
          const selectedEdge = selected === i;
          const inputMarker = selectedEdge ? "arrow-selected-black" : "arrow-black";
          const outputMarker = selectedEdge ? "arrow-selected-black" : "arrow-black";
          addPath(edgeLayer, xNode, h, `black${selectedEdge ? " selected" : ""}`, inputMarker, radius, radius);
          addPath(edgeLayer, h, output, `black${selectedEdge ? " selected" : ""}`, outputMarker, radius, radius);

          if (labeled || selectedEdge) {
            const thetaOffset = i === 1 ? -20 : i === state.units ? 20 : 0;
            const theta = labelPoint(xNode, h, labeled ? 0.56 : 0.47, thetaOffset);
            addMathLabel(labelLayer, theta.x, theta.y, "θ", `${i}1`, selectedEdge ? "theta-input revealed" : "theta-input");

            const phiOffset = i === 1 ? -20 : i === state.units ? 20 : -16;
            const phi = labelPoint(h, output, 0.45, phiOffset);
            addMathLabel(labelLayer, phi.x, phi.y, "φ", `${i}`, selectedEdge ? "phi-output revealed" : "phi-output");
          }
        });

        if (showBiasNodes) {
          addPath(edgeLayer, outputBias, output, `orange${selected ? " ghost" : ""}`, selected ? "arrow-ghost" : "arrow-orange", 38, radius);
          const p = labelPoint(outputBias, output, 0.54, -18);
          addMathLabel(labelLayer, p.x, p.y, "φ", "0", "phi-bias");
        }

        nodeLayer.appendChild(makeEl("circle", { cx: xNode.x, cy: xNode.y, r: radius, class: "node" }));
        addNodeLabel(nodeLayer, xNode.x, xNode.y, "x");

        ys.forEach((y, idx) => {
          const i = idx + 1;
          addHiddenNode(nodeLayer, panel.key, i, hiddenX, y, selected === i, labeled);
        });

        nodeLayer.appendChild(makeEl("circle", { cx: output.x, cy: output.y, r: radius, class: "node" }));
        addNodeLabel(nodeLayer, output.x, output.y, "y");

        if (showBiasNodes) {
          nodeLayer.appendChild(makeEl("circle", { cx: inputBias.x, cy: inputBias.y, r: 38, class: "bias-node" }));
          addSimpleLabel(nodeLayer, inputBias.x, inputBias.y, "1", "bias-label");
          nodeLayer.appendChild(makeEl("circle", { cx: outputBias.x, cy: outputBias.y, r: 38, class: "bias-node" }));
          addSimpleLabel(nodeLayer, outputBias.x, outputBias.y, "1", "bias-label");
        }
      }

      function render() {
        if (state.selected && state.selected > state.units) state.selected = state.units;
        count.value = String(state.units);
        count.textContent = String(state.units);
        slider.value = String(state.units);
        modeButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode));
        });

        const panels = panelPositions();
        svg.setAttribute("viewBox", viewBoxForPanels(panels));
        svg.replaceChildren(defs());
        panels.forEach((panel) => drawPanel(svg, panel));

        if (state.selected) {
          status.innerHTML = `Selected <strong>h<sub>${state.selected}</sub></strong>: θ<sub>${state.selected}0</sub> bias, θ<sub>${state.selected}1</sub> input weight, and φ<sub>${state.selected}</sub> output contribution are highlighted.`;
        } else {
          status.textContent = "No hidden unit selected.";
        }
      }

      function selectHidden(index) {
        state.selected = state.selected === index ? null : index;
        render();
      }

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.mode = button.dataset.mode;
          render();
        });
      });

      slider.addEventListener("input", () => {
        state.units = Number(slider.value);
        render();
      });

      clear.addEventListener("click", () => {
        state.selected = null;
        render();
      });

      window.addEventListener("resize", () => {
        render();
      });

      render();
    })();
  </script>
</body>
</html>
