<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downs Cell Electrolysis</title>
  <style>
    :root {
      --ink: #111111;
      --muted: #56606c;
      --panel: #f4f7fb;
      --panel-line: #cfd8e5;
      --bath: #cfd4ef;
      --wall: #969aa1;
      --chlorine: #dfeac4;
      --sodium: #ebcbe8;
      --sodium-deep: #d899d1;
      --copper: #e3ae88;
      --cathode: #b9bfd4;
      --highlight: #f5b642;
      --na-ion: #256fb0;
      --cl-ion: #d9dc54;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      display: grid;
      place-items: center;
    }

    .figure-app {
      width: min(1180px, 100%);
      min-height: 100vh;
      padding: clamp(10px, 2vw, 22px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .stage {
      width: 100%;
      display: grid;
      place-items: center;
      min-height: 0;
    }

    svg {
      width: min(100%, 1080px);
      height: auto;
      max-height: calc(100vh - 190px);
      display: block;
      overflow: visible;
    }

    .toolbar {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr);
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 8px;
    }

    button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid #aeb8c7;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: #5f718a;
      outline: 3px solid rgba(62, 121, 191, 0.22);
      outline-offset: 2px;
    }

    .reaction-card {
      min-height: 56px;
      padding: 8px 12px;
      border-left: 4px solid #8391a7;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: inset 0 0 0 1px #e1e6ef;
    }

    .reaction-card[data-region="anode"] {
      border-left-color: #ad6c31;
    }

    .reaction-card[data-region="cathode"] {
      border-left-color: #456cbb;
    }

    .reaction-title {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .reaction-equation {
      font-size: clamp(15px, 2.2vw, 20px);
      font-weight: 700;
      line-height: 1.25;
    }

    .reaction-note {
      color: #374151;
      font-size: 13px;
      line-height: 1.25;
      margin-top: 2px;
    }

    .label {
      font-size: 19px;
      fill: var(--ink);
    }

    .small-label {
      font-size: 16px;
      fill: var(--ink);
    }

    .source-label {
      fill: #ffffff;
    }

    .equation-label {
      font-size: 18px;
      font-weight: 700;
      fill: #1f2937;
      pointer-events: none;
    }

    .leader,
    .outline,
    .pipe,
    .wire {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .leader {
      stroke-width: 3;
    }

    .outline,
    .pipe {
      stroke-width: 4;
    }

    .wall-part {
      fill: var(--wall);
      stroke: var(--ink);
      stroke-width: 4;
      stroke-linejoin: miter;
    }

    .screen-line {
      fill: none;
      stroke: #1d1d1d;
      stroke-width: 2.2;
      opacity: 0.92;
    }

    .screen-outline {
      fill: rgba(255, 255, 255, 0.14);
      stroke: #111111;
      stroke-width: 3.2;
    }

    .electrode-hit {
      cursor: pointer;
      outline: none;
    }

    .electrode-hit:focus-visible .focus-ring,
    .electrode-hit:hover .focus-ring {
      opacity: 1;
    }

    .focus-ring {
      fill: none;
      stroke: var(--highlight);
      stroke-width: 6;
      stroke-linejoin: round;
      opacity: 0;
      pointer-events: none;
    }

    .active-cathode .cathode-glow,
    .active-anode .anode-glow {
      opacity: 0.95;
      animation: pulseGlow 1.3s ease-in-out infinite alternate;
    }

    .cathode-glow,
    .anode-glow {
      opacity: 0;
      pointer-events: none;
    }

    .ion text {
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .ion circle {
      stroke: rgba(0, 0, 0, 0.38);
      stroke-width: 1;
    }

    .bubble {
      fill: #e9f39d;
      stroke: rgba(64, 92, 26, 0.45);
      stroke-width: 1.2;
      opacity: 0.9;
    }

    .sodium-drop {
      fill: var(--sodium-deep);
      stroke: #7a4470;
      stroke-width: 1.4;
      opacity: 0.95;
    }

    .motion-path {
      fill: none;
      stroke: transparent;
    }

    @keyframes pulseGlow {
      from {
        filter: drop-shadow(0 0 2px rgba(245, 182, 66, 0.35));
      }
      to {
        filter: drop-shadow(0 0 11px rgba(245, 182, 66, 0.95));
      }
    }

    @media (max-width: 720px) {
      .figure-app {
        grid-template-rows: auto auto;
      }

      svg {
        max-height: none;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .active-cathode .cathode-glow,
      .active-anode .anode-glow {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="figure-app" aria-label="Interactive Downs cell diagram">
    <section class="stage">
      <svg id="downsCell" viewBox="0 0 760 620" role="img" aria-labelledby="figureTitle figureDesc">
        <title id="figureTitle">Downs cell for electrolysis of molten sodium chloride</title>
        <desc id="figureDesc">A labeled cross-section shows molten sodium chloride inside a steel cell, a central anode beneath a chlorine outlet, an iron screen, outer cathode surfaces, a sodium metal side collector, and a voltage source.</desc>

        <defs>
          <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 12 5 L 0 10 z" fill="#111111"></path>
          </marker>

          <clipPath id="screenClip">
            <path d="M241 450 L241 333 C288 312 356 312 404 333 L404 450 C359 426 291 426 241 450 Z"></path>
          </clipPath>

          <path id="clPathA" class="motion-path" d="M302 288 C327 298 347 317 351 351"></path>
          <path id="clPathB" class="motion-path" d="M246 386 C274 360 297 344 318 340"></path>
          <path id="clPathC" class="motion-path" d="M404 387 C375 360 350 344 329 340"></path>
          <path id="naPathLeft" class="motion-path" d="M328 348 C298 352 265 374 228 421"></path>
          <path id="naPathRight" class="motion-path" d="M338 348 C377 352 410 374 421 421"></path>
          <path id="gasPathA" class="motion-path" d="M324 322 C319 276 323 215 323 156 C323 126 321 112 342 89 L607 89"></path>
          <path id="gasPathB" class="motion-path" d="M347 321 C342 275 344 216 344 151 C344 120 341 105 365 88 L607 88"></path>
          <path id="sodiumPath" class="motion-path" d="M423 292 C467 292 503 292 514 313 C531 348 532 389 570 405 L666 405"></path>
        </defs>

        <rect x="1" y="1" width="758" height="618" fill="#ffffff"></rect>

        <!-- cell body and molten salt bath -->
        <rect x="178" y="264" width="287" height="212" fill="var(--bath)"></rect>
        <rect class="wall-part" x="160" y="216" width="18" height="274"></rect>
        <rect class="wall-part" x="160" y="216" width="232" height="17"></rect>
        <rect class="wall-part" x="438" y="216" width="44" height="17"></rect>
        <rect class="wall-part" x="464" y="216" width="18" height="274"></rect>
        <rect class="wall-part" x="160" y="474" width="322" height="17"></rect>
        <rect class="wall-part" x="132" y="428" width="103" height="15"></rect>
        <rect class="wall-part" x="440" y="428" width="94" height="15"></rect>
        <rect class="wall-part" x="307" y="474" width="48" height="17"></rect>

        <!-- sodium side collector and Na outlet -->
        <path d="M413 324 L413 295 Q413 278 430 278 L505 278 L505 259 Q505 248 528 248 Q552 248 552 266 L552 320 L521 379 L521 402 Q521 412 533 412 L577 412 L577 397 L538 397 L538 350 L505 292 L431 292 L431 324 Z" fill="var(--sodium)" stroke="#111111" stroke-width="4" stroke-linejoin="round"></path>
        <path d="M429 286 H505 Q519 321 531 349" fill="none" stroke="var(--sodium-deep)" stroke-width="8" stroke-linecap="round" opacity="0.72"></path>
        <path class="leader" d="M578 405 H680" marker-end="url(#arrow)"></path>

        <!-- chlorine stack and hood -->
        <path d="M300 289 L300 153 L313 125 L313 101 Q313 75 340 75 L497 75 M334 289 L334 152 L321 126 L321 103 Q321 98 326 98 L497 98" fill="none" stroke="#111111" stroke-width="26" stroke-linejoin="round" stroke-linecap="butt"></path>
        <path d="M300 289 L300 153 L313 125 L313 101 Q313 75 340 75 L497 75 L497 98 L327 98 Q321 98 321 103 L321 126 L334 152 L334 289 Z" fill="var(--chlorine)" stroke="#111111" stroke-width="4" stroke-linejoin="round"></path>
        <path d="M300 288 L242 326 L242 359 L407 359 L407 326 L334 288 Z" fill="var(--chlorine)" stroke="#111111" stroke-width="4" stroke-linejoin="round"></path>
        <path class="leader" d="M505 86 H608" marker-end="url(#arrow)"></path>

        <!-- NaCl feed pipe and cap -->
        <path class="pipe" d="M407 178 V214"></path>
        <path class="pipe" d="M421 178 V214"></path>
        <rect x="387" y="209" width="52" height="14" fill="#ffffff" stroke="#111111" stroke-width="3"></rect>
        <path class="leader" d="M421 192 H633"></path>

        <!-- iron screen mesh -->
        <g clip-path="url(#screenClip)" aria-hidden="true">
          <rect x="236" y="319" width="181" height="142" fill="rgba(255,255,255,0.08)"></rect>
          <path class="screen-line" d="M242 336 C286 318 357 318 404 336"></path>
          <path class="screen-line" d="M242 352 C288 334 356 334 404 352"></path>
          <path class="screen-line" d="M242 368 C288 350 356 350 404 368"></path>
          <path class="screen-line" d="M242 384 C288 366 356 366 404 384"></path>
          <path class="screen-line" d="M242 400 C288 382 356 382 404 400"></path>
          <path class="screen-line" d="M242 416 C288 398 356 398 404 416"></path>
          <path class="screen-line" d="M242 432 C288 414 356 414 404 432"></path>
          <path class="screen-line" d="M252 326 C246 354 246 422 243 455"></path>
          <path class="screen-line" d="M271 321 C267 353 267 421 265 449"></path>
          <path class="screen-line" d="M290 317 C288 351 288 422 287 444"></path>
          <path class="screen-line" d="M309 315 C308 351 308 422 307 440"></path>
          <path class="screen-line" d="M328 315 C328 351 328 422 328 438"></path>
          <path class="screen-line" d="M347 316 C350 351 350 422 350 441"></path>
          <path class="screen-line" d="M366 319 C370 353 370 421 372 446"></path>
          <path class="screen-line" d="M386 325 C391 354 391 422 404 455"></path>
        </g>
        <path class="screen-outline" d="M241 450 L241 333 C288 312 356 312 404 333 L404 450"></path>

        <!-- cathode plates -->
        <g id="cathodeVisual">
          <path class="cathode-glow" d="M207 387 H235 V449 H207 Z M414 387 H441 V449 H414 Z M132 428 H235 V443 H132 Z M440 428 H534 V443 H440 Z" fill="none" stroke="#456cbb" stroke-width="10" stroke-linejoin="round"></path>
          <rect x="216" y="386" width="16" height="63" fill="var(--cathode)" stroke="#111111" stroke-width="3"></rect>
          <rect x="413" y="386" width="17" height="63" fill="var(--cathode)" stroke="#111111" stroke-width="3"></rect>
          <path class="outline" d="M208 324 H242 V449"></path>
          <path class="outline" d="M440 324 H407 V449"></path>
        </g>

        <!-- anode -->
        <g id="anodeVisual">
          <path class="anode-glow" d="M282 359 H358 V392 H340 V525 H315 V392 H282 Z" fill="none" stroke="#f5b642" stroke-width="10" stroke-linejoin="round"></path>
          <rect x="314" y="380" width="26" height="145" fill="var(--copper)" stroke="#111111" stroke-width="3"></rect>
          <rect x="282" y="359" width="75" height="33" fill="var(--copper)" stroke="#111111" stroke-width="3"></rect>
        </g>

        <!-- animated ions, chlorine gas, and sodium flow -->
        <g aria-hidden="true">
          <g class="ion">
            <circle r="8" fill="var(--cl-ion)"></circle>
            <text dy="0.5" fill="#4c4f00">Cl-</text>
            <animateMotion dur="4.8s" repeatCount="indefinite" begin="0s"><mpath href="#clPathA"></mpath></animateMotion>
          </g>
          <g class="ion">
            <circle r="8" fill="var(--cl-ion)"></circle>
            <text dy="0.5" fill="#4c4f00">Cl-</text>
            <animateMotion dur="5.6s" repeatCount="indefinite" begin="-1.5s"><mpath href="#clPathB"></mpath></animateMotion>
          </g>
          <g class="ion">
            <circle r="8" fill="var(--cl-ion)"></circle>
            <text dy="0.5" fill="#4c4f00">Cl-</text>
            <animateMotion dur="5.4s" repeatCount="indefinite" begin="-2.2s"><mpath href="#clPathC"></mpath></animateMotion>
          </g>
          <g class="ion">
            <circle r="8" fill="#8fc2f0"></circle>
            <text dy="0.5" fill="#0b497f">Na+</text>
            <animateMotion dur="5.3s" repeatCount="indefinite" begin="-0.4s"><mpath href="#naPathLeft"></mpath></animateMotion>
          </g>
          <g class="ion">
            <circle r="8" fill="#8fc2f0"></circle>
            <text dy="0.5" fill="#0b497f">Na+</text>
            <animateMotion dur="5.1s" repeatCount="indefinite" begin="-2.8s"><mpath href="#naPathRight"></mpath></animateMotion>
          </g>
          <circle class="bubble" r="6">
            <animateMotion dur="4.7s" repeatCount="indefinite" begin="-0.3s"><mpath href="#gasPathA"></mpath></animateMotion>
          </circle>
          <circle class="bubble" r="5">
            <animateMotion dur="5.1s" repeatCount="indefinite" begin="-2.1s"><mpath href="#gasPathB"></mpath></animateMotion>
          </circle>
          <circle class="bubble" r="4.5">
            <animateMotion dur="4.2s" repeatCount="indefinite" begin="-3.1s"><mpath href="#gasPathA"></mpath></animateMotion>
          </circle>
          <circle class="sodium-drop" r="6">
            <animateMotion dur="5.8s" repeatCount="indefinite" begin="-0.6s"><mpath href="#sodiumPath"></mpath></animateMotion>
          </circle>
          <circle class="sodium-drop" r="5">
            <animateMotion dur="6.2s" repeatCount="indefinite" begin="-3.2s"><mpath href="#sodiumPath"></mpath></animateMotion>
          </circle>
        </g>

        <!-- electrode hit regions kept after visuals for pointer access -->
        <g id="cathodeRegion" class="electrode-hit" role="button" tabindex="0" aria-label="Cathode half reaction" data-region="cathode">
          <path class="focus-ring" d="M206 321 H244 V456 H206 Z M405 321 H443 V456 H405 Z M130 426 H237 V446 H130 Z M438 426 H536 V446 H438 Z"></path>
          <path d="M206 321 H244 V456 H206 Z M405 321 H443 V456 H405 Z M130 426 H237 V446 H130 Z M438 426 H536 V446 H438 Z" fill="transparent"></path>
          <title>Cathode: Na+ gains electrons to form liquid sodium.</title>
        </g>
        <g id="anodeRegion" class="electrode-hit" role="button" tabindex="0" aria-label="Anode half reaction" data-region="anode">
          <path class="focus-ring" d="M278 355 H361 V396 H344 V528 H310 V396 H278 Z"></path>
          <path d="M278 355 H361 V396 H344 V528 H310 V396 H278 Z" fill="transparent"></path>
          <title>Anode: chloride ions lose electrons to form chlorine gas.</title>
        </g>

        <!-- external circuit -->
        <path class="wire" stroke-width="4" d="M224 449 V503"></path>
        <path class="wire" stroke-width="4" d="M328 525 V546 H604"></path>
        <path class="wire" stroke-width="4" d="M466 443 H531 V538 H604"></path>
        <rect x="604" y="510" width="86" height="66" fill="#8e8e8e" stroke="#111111" stroke-width="4"></rect>
        <text x="647" y="536" class="small-label source-label" text-anchor="middle">Voltage</text>
        <text x="647" y="558" class="small-label source-label" text-anchor="middle">source</text>

        <!-- labels and leaders -->
        <text x="506" y="65" class="label">Cl<tspan baseline-shift="sub" font-size="13">2</tspan> outlet</text>
        <text x="639" y="195" class="label">Inlet for</text>
        <text x="639" y="219" class="label">NaCl</text>
        <text x="30" y="260" class="label">Molten</text>
        <text x="30" y="284" class="label">NaCl</text>
        <path class="leader" d="M87 264 H190"></path>
        <text x="54" y="373" class="label">Iron</text>
        <text x="30" y="397" class="label">screen</text>
        <path class="leader" d="M91 367 H292"></path>
        <text x="570" y="300" class="label">Liquid</text>
        <text x="570" y="324" class="label">Na metal</text>
        <path class="leader" d="M540 291 H561"></path>
        <text x="586" y="383" class="label">Na outlet</text>
        <text x="175" y="526" class="label">Cathode (-)</text>
        <path class="leader" d="M225 505 V449"></path>
        <text x="340" y="526" class="label">Anode (+)</text>
        <path class="leader" d="M350 505 V392"></path>

        <text id="svgEquation" x="324" y="584" class="equation-label" text-anchor="middle">2 NaCl(l) -> 2 Na(l) + Cl2(g)</text>
      </svg>
    </section>

    <section class="toolbar" aria-label="Figure controls">
      <button id="toggleMotion" type="button" aria-pressed="false">Pause motion</button>
      <div id="reactionCard" class="reaction-card" data-region="overall" aria-live="polite">
        <div id="reactionTitle" class="reaction-title">Overall reaction</div>
        <div id="reactionEquation" class="reaction-equation">2 NaCl(l) -> 2 Na(l) + Cl2(g)</div>
        <div id="reactionNote" class="reaction-note">Molten sodium and chlorine are kept apart so the products do not recombine.</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const svg = document.getElementById('downsCell');
      const toggleMotion = document.getElementById('toggleMotion');
      const reactionCard = document.getElementById('reactionCard');
      const reactionTitle = document.getElementById('reactionTitle');
      const reactionEquation = document.getElementById('reactionEquation');
      const reactionNote = document.getElementById('reactionNote');
      const svgEquation = document.getElementById('svgEquation');
      const regions = Array.from(document.querySelectorAll('.electrode-hit'));

      const reactions = {
        cathode: {
          title: 'Cathode (-): reduction at the outer electrode',
          equation: 'Na+ + e- -> Na(l)',
          note: 'Sodium ions gain electrons; liquid sodium floats and flows into the side collector.',
          svg: 'Cathode: Na+ + e- -> Na(l)'
        },
        anode: {
          title: 'Anode (+): oxidation at the central electrode',
          equation: '2 Cl- -> Cl2(g) + 2 e-',
          note: 'Chloride ions lose electrons; chlorine gas rises through the central outlet.',
          svg: 'Anode: 2 Cl- -> Cl2(g) + 2 e-'
        }
      };

      function setRegion(region) {
        const data = reactions[region];
        if (!data) {
          return;
        }
        svg.classList.toggle('active-cathode', region === 'cathode');
        svg.classList.toggle('active-anode', region === 'anode');
        reactionCard.dataset.region = region;
        reactionTitle.textContent = data.title;
        reactionEquation.textContent = data.equation;
        reactionNote.textContent = data.note;
        svgEquation.textContent = data.svg;
      }

      regions.forEach((region) => {
        region.addEventListener('click', () => setRegion(region.dataset.region));
        region.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            setRegion(region.dataset.region);
          }
        });
      });

      let paused = false;
      toggleMotion.addEventListener('click', () => {
        paused = !paused;
        if (paused) {
          svg.pauseAnimations();
          toggleMotion.textContent = 'Resume motion';
        } else {
          svg.unpauseAnimations();
          toggleMotion.textContent = 'Pause motion';
        }
        toggleMotion.setAttribute('aria-pressed', String(paused));
      });

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        paused = true;
        svg.pauseAnimations();
        toggleMotion.textContent = 'Resume motion';
        toggleMotion.setAttribute('aria-pressed', 'true');
      }
    })();
  </script>
</body>
</html>
