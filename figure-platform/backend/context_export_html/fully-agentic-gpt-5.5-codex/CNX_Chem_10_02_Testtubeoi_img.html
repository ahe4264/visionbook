<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oil Viscosity and Falling Spheres</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #56626b;
      --paper: #ffffff;
      --panel: #f6f8fa;
      --panel-line: #cbd4dc;
      --accent: #176c7a;
      --accent-dark: #0f4f5a;
      --accent-soft: #e8f4f6;
      --gold: #e7c247;
      --gold-dark: #d2a11f;
      --red-edge: #b84428;
      --glass: rgba(214, 232, 238, 0.58);
      --glass-edge: #8aa4ad;
      --shadow: 0 18px 46px rgba(33, 42, 52, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef2f5;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(8px, 1.7vw, 18px);
    }

    main {
      width: min(1260px, 100%);
      display: grid;
      gap: 12px;
    }

    .stage,
    .controls {
      background: var(--paper);
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage {
      overflow-x: auto;
      padding: clamp(4px, 1vw, 10px);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 800px;
      height: auto;
      background: #ffffff;
      border-radius: 6px;
      user-select: none;
    }

    .controls {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(250px, auto) minmax(260px, 1fr) minmax(190px, auto);
      gap: 12px;
      align-items: center;
    }

    .button-row,
    .toggle-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    input,
    label {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid #9caab4;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      background: #ffffff;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: #eef5f7;
    }

    button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #ffffff;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(23, 108, 122, 0.3);
      outline-offset: 2px;
    }

    .slider-wrap {
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(150px, 1fr) 96px;
      gap: 10px;
      align-items: center;
      color: var(--ink);
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .readout {
      text-align: right;
      color: var(--accent-dark);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .toggle-row {
      justify-content: flex-end;
      color: var(--ink);
      font-weight: 700;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .base-front-label {
      font-size: 28px;
      font-weight: 700;
    }

    .grade-label,
    .single-grade-label {
      font-size: 27px;
      font-weight: 700;
    }

    .axis-label {
      fill: #593b12;
      font-size: 17px;
      font-weight: 700;
    }

    .small-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .velocity-label rect {
      fill: rgba(255, 255, 255, 0.95);
      stroke: #87949b;
      stroke-width: 1;
    }

    .velocity-label text {
      fill: #1d2a31;
      font-size: 14px;
      font-weight: 700;
    }

    .tube-edge {
      fill: none;
      stroke: var(--glass-edge);
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    .tube-glass {
      fill: var(--glass);
      stroke: var(--glass-edge);
      stroke-width: 2;
    }

    .glass-line {
      stroke: rgba(99, 124, 133, 0.58);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .tick {
      stroke: rgba(95, 116, 124, 0.62);
      stroke-width: 1.4;
      stroke-linecap: round;
    }

    .meniscus {
      stroke: rgba(122, 92, 31, 0.36);
      stroke-width: 2;
    }

    .comparison-fade {
      opacity: 0;
      pointer-events: none;
    }

    .active-layer {
      opacity: 1;
      pointer-events: auto;
    }

    #comparisonLayer,
    #singleLayer {
      transition: opacity 180ms ease;
    }

    .ball {
      filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.28));
    }

    @media (max-width: 820px) {
      body {
        place-items: start center;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .button-row,
      .toggle-row {
        justify-content: flex-start;
      }

      .slider-wrap {
        grid-template-columns: 1fr;
      }

      .readout {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <svg id="figure" viewBox="0 0 1120 650" role="img" aria-labelledby="figTitle figDesc">
        <title id="figTitle">Motor-oil viscosity ranked by falling metal spheres</title>
        <desc id="figDesc">Four graduated cylinders on a base labeled Oil viscosity (SAE) compare SAE 20, 30, 40, and 50 oils. Identical metal spheres fall fastest in lower SAE oil and slow as the SAE grade increases.</desc>
        <defs id="defs">
          <linearGradient id="baseTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3cf3d"></stop>
            <stop offset="0.58" stop-color="#efd868"></stop>
            <stop offset="1" stop-color="#f7e7a3"></stop>
          </linearGradient>
          <linearGradient id="baseFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4d358"></stop>
            <stop offset="1" stop-color="#e8be3e"></stop>
          </linearGradient>
          <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#cfe0e6" stop-opacity="0.35"></stop>
            <stop offset="0.28" stop-color="#f6fbfd" stop-opacity="0.72"></stop>
            <stop offset="0.65" stop-color="#bdd2da" stop-opacity="0.48"></stop>
            <stop offset="1" stop-color="#e4eff2" stop-opacity="0.36"></stop>
          </linearGradient>
          <radialGradient id="metalBall" cx="34%" cy="31%" r="70%">
            <stop offset="0" stop-color="#f8fbfb"></stop>
            <stop offset="0.28" stop-color="#d4d9da"></stop>
            <stop offset="0.6" stop-color="#8c9597"></stop>
            <stop offset="1" stop-color="#3f474b"></stop>
          </radialGradient>
          <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f4d17"></path>
          </marker>
        </defs>

        <g id="baseLayer">
          <polygon points="88,430 1032,430 1104,558 16,558" fill="url(#baseTop)" stroke="#bc4d2f" stroke-width="1.7"></polygon>
          <polygon points="16,558 1104,558 1104,612 16,612" fill="url(#baseFront)" stroke="#bc4d2f" stroke-width="1.7"></polygon>
          <text class="base-front-label" x="560" y="594" text-anchor="middle">Oil viscosity (SAE)</text>
          <line x1="184" y1="486" x2="934" y2="486" stroke="#7f4d17" stroke-width="3" marker-end="url(#arrowHead)"></line>
          <text class="axis-label" x="560" y="475" text-anchor="middle">viscosity increases</text>
        </g>
        <g id="comparisonLayer" class="active-layer"></g>
        <g id="singleLayer" class="comparison-fade"></g>
      </svg>
    </div>

    <section class="controls" aria-label="Oil viscosity figure controls">
      <div class="button-row" aria-label="Animation controls">
        <button id="compareButton" type="button" aria-pressed="true">Compare oils</button>
        <button id="singleButton" type="button" aria-pressed="false">Single SAE</button>
        <button id="playButton" type="button">Pause</button>
        <button id="resetButton" type="button">Restart drop</button>
      </div>

      <label class="slider-wrap" for="gradeSlider">
        <span>Single SAE grade</span>
        <input id="gradeSlider" type="range" min="20" max="50" step="1" value="35">
        <span id="gradeReadout" class="readout">SAE 35</span>
      </label>

      <label class="toggle-row" for="velocityToggle">
        <input id="velocityToggle" type="checkbox" checked>
        <span>Terminal velocity labels</span>
      </label>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const geometry = {
        topY: 65,
        oilTop: 130,
        bottomY: 450,
        tubeWidth: 64,
        ballRadius: 23
      };

      const grades = [
        { grade: 20, x: 190, color: "#f5da78", tint: "#fff2ad", label: "1.00x" },
        { grade: 30, x: 440, color: "#f0ce57", tint: "#ffeaa0", label: "0.79x" },
        { grade: 40, x: 690, color: "#eea15e", tint: "#ffd177", label: "0.58x" },
        { grade: 50, x: 940, color: "#f56246", tint: "#ff9a72", label: "0.37x" }
      ];

      const refs = {
        svg: document.getElementById("figure"),
        defs: document.getElementById("defs"),
        comparisonLayer: document.getElementById("comparisonLayer"),
        singleLayer: document.getElementById("singleLayer"),
        compareButton: document.getElementById("compareButton"),
        singleButton: document.getElementById("singleButton"),
        playButton: document.getElementById("playButton"),
        resetButton: document.getElementById("resetButton"),
        slider: document.getElementById("gradeSlider"),
        readout: document.getElementById("gradeReadout"),
        velocityToggle: document.getElementById("velocityToggle")
      };

      const state = {
        mode: "compare",
        running: true,
        startMs: performance.now(),
        holdTime: 0,
        singleGrade: 35,
        raf: 0
      };

      const comparisonItems = [];
      let singleItem = null;

      function el(name, attrs, parent) {
        const node = document.createElementNS(SVG_NS, name);
        Object.keys(attrs || {}).forEach(function (key) {
          if (key === "textContent") {
            node.textContent = attrs[key];
          } else {
            node.setAttribute(key, attrs[key]);
          }
        });
        if (parent) {
          parent.appendChild(node);
        }
        return node;
      }

      function makeOilGradient(id, color, tint) {
        const gradient = el("linearGradient", { id: id, x1: "0", y1: "0", x2: "1", y2: "0" }, refs.defs);
        el("stop", { offset: "0", "stop-color": shade(color, -0.12) }, gradient);
        el("stop", { offset: "0.28", "stop-color": tint }, gradient);
        el("stop", { offset: "0.52", "stop-color": color }, gradient);
        el("stop", { offset: "1", "stop-color": shade(color, -0.08) }, gradient);
        return gradient;
      }

      function setOilGradient(gradient, color, tint) {
        const stops = gradient.querySelectorAll("stop");
        stops[0].setAttribute("stop-color", shade(color, -0.12));
        stops[1].setAttribute("stop-color", tint);
        stops[2].setAttribute("stop-color", color);
        stops[3].setAttribute("stop-color", shade(color, -0.08));
      }

      function shade(hex, amount) {
        const rgb = hexToRgb(hex);
        const changed = rgb.map(function (channel) {
          return clamp(Math.round(channel + 255 * amount), 0, 255);
        });
        return rgbToHex(changed);
      }

      function mixColor(a, b, t) {
        const ca = hexToRgb(a);
        const cb = hexToRgb(b);
        return rgbToHex(ca.map(function (channel, index) {
          return Math.round(channel + (cb[index] - channel) * t);
        }));
      }

      function hexToRgb(hex) {
        const value = hex.replace("#", "");
        return [
          parseInt(value.slice(0, 2), 16),
          parseInt(value.slice(2, 4), 16),
          parseInt(value.slice(4, 6), 16)
        ];
      }

      function rgbToHex(rgb) {
        return "#" + rgb.map(function (channel) {
          return clamp(channel, 0, 255).toString(16).padStart(2, "0");
        }).join("");
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function oilForGrade(grade) {
        if (grade <= 20) {
          return { color: grades[0].color, tint: grades[0].tint };
        }
        if (grade >= 50) {
          return { color: grades[3].color, tint: grades[3].tint };
        }
        const lowerIndex = Math.floor((grade - 20) / 10);
        const upperIndex = lowerIndex + 1;
        const localT = (grade - grades[lowerIndex].grade) / 10;
        return {
          color: mixColor(grades[lowerIndex].color, grades[upperIndex].color, localT),
          tint: mixColor(grades[lowerIndex].tint, grades[upperIndex].tint, localT)
        };
      }

      function terminalVelocityPx(grade) {
        return 92 - (grade - 20) * (58 / 30);
      }

      function relativeVelocity(grade) {
        return terminalVelocityPx(grade) / terminalVelocityPx(20);
      }

      function positionForTime(seconds, grade) {
        const start = geometry.oilTop + geometry.ballRadius + 3;
        const bottom = geometry.bottomY - geometry.ballRadius;
        const tau = 0.62 + (grade - 20) * 0.0065;
        const speed = terminalVelocityPx(grade);
        const fall = speed * Math.max(0, seconds - tau * (1 - Math.exp(-seconds / tau)));
        return clamp(start + fall, start, bottom);
      }

      function reachedBottom(seconds, grade) {
        return positionForTime(seconds, grade) >= geometry.bottomY - geometry.ballRadius - 0.5;
      }

      function drawCylinder(parent, spec) {
        const g = el("g", { "data-grade": spec.grade }, parent);
        const oil = oilForGrade(spec.grade);
        const gradientId = "oil-" + spec.grade + "-" + Math.round(spec.x);
        const oilGradient = makeOilGradient(gradientId, oil.color, oil.tint);
        const x = spec.x;
        const tubeX = x - geometry.tubeWidth / 2;

        el("ellipse", { cx: x, cy: 478, rx: 78, ry: 13, fill: "rgba(138, 93, 23, 0.22)" }, g);
        el("polygon", {
          points: [
            [x - 70, 474], [x - 43, 452], [x + 43, 452], [x + 70, 474],
            [x + 70, 491], [x + 42, 507], [x - 42, 507], [x - 70, 491]
          ].map(function (point) { return point.join(","); }).join(" "),
          fill: "#d9e5e8",
          stroke: "#8ca3ab",
          "stroke-width": "2"
        }, g);
        el("polygon", {
          points: [
            [x - 48, 471], [x - 28, 458], [x + 28, 458], [x + 48, 471],
            [x + 42, 486], [x + 26, 494], [x - 26, 494], [x - 42, 486]
          ].map(function (point) { return point.join(","); }).join(" "),
          fill: "#eef5f7",
          stroke: "#b3c2c8",
          "stroke-width": "1.5"
        }, g);

        el("rect", {
          x: tubeX,
          y: geometry.oilTop,
          width: geometry.tubeWidth,
          height: geometry.bottomY - geometry.oilTop,
          fill: "url(#" + gradientId + ")"
        }, g);
        el("rect", {
          x: tubeX,
          y: geometry.topY + 9,
          width: geometry.tubeWidth,
          height: geometry.oilTop - geometry.topY - 9,
          fill: "url(#glassFill)"
        }, g);
        el("line", { class: "meniscus", x1: tubeX + 2, y1: geometry.oilTop, x2: tubeX + geometry.tubeWidth - 2, y2: geometry.oilTop }, g);
        el("rect", {
          class: "tube-glass",
          x: tubeX,
          y: geometry.topY + 9,
          width: geometry.tubeWidth,
          height: geometry.bottomY - geometry.topY - 9
        }, g);
        el("path", {
          class: "tube-edge",
          d: [
            "M", x - 41, geometry.topY,
            "L", x - 35, geometry.topY + 9,
            "L", tubeX, geometry.topY + 34,
            "M", x + 41, geometry.topY,
            "L", x + 35, geometry.topY + 9
          ].join(" ")
        }, g);
        el("rect", {
          x: x - 39,
          y: geometry.topY - 4,
          width: 78,
          height: 8,
          rx: 3,
          fill: "#d6e5e9",
          stroke: "#8ca3ab",
          "stroke-width": "2"
        }, g);
        el("line", { class: "glass-line", x1: x - 24, y1: geometry.topY + 12, x2: x - 24, y2: geometry.topY + 44 }, g);

        [176, 216, 256, 296, 336, 376, 416].forEach(function (tickY, index) {
          el("line", {
            class: "tick",
            x1: tubeX + 5,
            y1: tickY,
            x2: tubeX + (index % 2 === 0 ? 20 : 14),
            y2: tickY
          }, g);
        });

        const ball = el("circle", {
          class: "ball",
          cx: x,
          cy: positionForTime(0, spec.grade),
          r: geometry.ballRadius,
          fill: "url(#metalBall)"
        }, g);

        const label = makeVelocityLabel(g, x, spec.grade);

        return {
          group: g,
          ball: ball,
          label: label,
          oilGradient: oilGradient,
          grade: spec.grade,
          x: x
        };
      }

      function makeVelocityLabel(parent, x, grade) {
        const isRightSide = x < 850;
        const labelX = isRightSide ? x + 31 : x - 126;
        const label = el("g", { class: "velocity-label", opacity: "0" }, parent);
        el("rect", { x: labelX, y: 0, width: 96, height: 39, rx: 6 }, label);
        el("text", { x: labelX + 9, y: 16, textContent: "vT " + velocityText(grade) }, label);
        el("text", { x: labelX + 9, y: 32, textContent: relativeVelocity(grade).toFixed(2) + "x SAE 20" }, label);
        return label;
      }

      function velocityText(grade) {
        if (grade <= 23) {
          return "fastest";
        }
        if (grade < 35) {
          return "high";
        }
        if (grade < 46) {
          return "lower";
        }
        return "slowest";
      }

      function drawGradeLabels(parent) {
        grades.forEach(function (spec) {
          el("text", {
            class: "grade-label",
            x: spec.x,
            y: 539,
            "text-anchor": "middle",
            textContent: String(spec.grade)
          }, parent);
        });
        el("text", { class: "small-label", x: 190, y: 417, "text-anchor": "middle", textContent: "lowest drag" }, parent);
        el("text", { class: "small-label", x: 940, y: 417, "text-anchor": "middle", textContent: "greatest drag" }, parent);
      }

      function drawSingleLayer() {
        singleItem = drawCylinder(refs.singleLayer, { grade: state.singleGrade, x: 560 });
        singleItem.gradeText = el("text", {
          class: "single-grade-label",
          x: 560,
          y: 539,
          "text-anchor": "middle",
          textContent: "SAE " + state.singleGrade
        }, refs.singleLayer);
        singleItem.caption = el("text", {
          class: "small-label",
          x: 560,
          y: 417,
          "text-anchor": "middle",
          textContent: "continuous viscosity setting"
        }, refs.singleLayer);
      }

      function updateSingleAppearance() {
        const oil = oilForGrade(state.singleGrade);
        setOilGradient(singleItem.oilGradient, oil.color, oil.tint);
        singleItem.grade = state.singleGrade;
        singleItem.gradeText.textContent = "SAE " + state.singleGrade;
        singleItem.label.querySelectorAll("text")[0].textContent = "vT " + velocityText(state.singleGrade);
        singleItem.label.querySelectorAll("text")[1].textContent = relativeVelocity(state.singleGrade).toFixed(2) + "x SAE 20";
        refs.readout.textContent = "SAE " + state.singleGrade;
      }

      function currentTimeSeconds() {
        if (state.running) {
          return (performance.now() - state.startMs) / 1000;
        }
        return state.holdTime;
      }

      function setRunning(nextRunning) {
        if (state.running === nextRunning) {
          return;
        }
        if (nextRunning) {
          state.startMs = performance.now() - state.holdTime * 1000;
        } else {
          state.holdTime = currentTimeSeconds();
        }
        state.running = nextRunning;
        refs.playButton.textContent = state.running ? "Pause" : "Play";
      }

      function resetDrop() {
        state.holdTime = 0;
        state.startMs = performance.now();
        state.running = true;
        refs.playButton.textContent = "Pause";
        updateFrame();
      }

      function switchMode(mode) {
        state.mode = mode;
        refs.compareButton.setAttribute("aria-pressed", String(mode === "compare"));
        refs.singleButton.setAttribute("aria-pressed", String(mode === "single"));
        refs.comparisonLayer.setAttribute("class", mode === "compare" ? "active-layer" : "comparison-fade");
        refs.singleLayer.setAttribute("class", mode === "single" ? "active-layer" : "comparison-fade");
        resetDrop();
      }

      function updateItem(item, seconds) {
        const y = positionForTime(seconds, item.grade);
        item.ball.setAttribute("cy", y.toFixed(2));
        item.label.setAttribute("transform", "translate(0 " + (y - 19).toFixed(2) + ")");
        const showLabel = refs.velocityToggle.checked && seconds > 1.25 && !reachedBottom(seconds, item.grade);
        item.label.setAttribute("opacity", showLabel ? "1" : "0");
      }

      function updateFrame() {
        const seconds = currentTimeSeconds();
        if (state.mode === "compare") {
          comparisonItems.forEach(function (item) {
            updateItem(item, seconds);
          });
          if (state.running && comparisonItems.every(function (item) { return reachedBottom(seconds, item.grade); })) {
            setRunning(false);
          }
        } else {
          updateItem(singleItem, seconds);
          if (state.running && reachedBottom(seconds, singleItem.grade)) {
            setRunning(false);
          }
        }
      }

      function animate() {
        updateFrame();
        state.raf = requestAnimationFrame(animate);
      }

      grades.forEach(function (spec) {
        comparisonItems.push(drawCylinder(refs.comparisonLayer, spec));
      });
      drawGradeLabels(refs.comparisonLayer);
      drawSingleLayer();
      updateSingleAppearance();

      refs.compareButton.addEventListener("click", function () {
        switchMode("compare");
      });

      refs.singleButton.addEventListener("click", function () {
        switchMode("single");
      });

      refs.playButton.addEventListener("click", function () {
        setRunning(!state.running);
      });

      refs.resetButton.addEventListener("click", resetDrop);

      refs.slider.addEventListener("input", function () {
        state.singleGrade = Number(refs.slider.value);
        updateSingleAppearance();
        if (state.mode !== "single") {
          switchMode("single");
        } else {
          resetDrop();
        }
      });

      refs.velocityToggle.addEventListener("change", updateFrame);

      animate();
    }());
  </script>
</body>
</html>
