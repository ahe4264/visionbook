<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fibonacci Heap Representations</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --muted: #5e6570;
      --paper: #ffffff;
      --panel: #f3f5f7;
      --line: #cfd5dd;
      --node: #dedede;
      --accent: #0d5cc8;
      --accent-soft: #e8f1ff;
      --orange: #c75b12;
      --blue: #1265d8;
      --purple: #7c3fc7;
      --green: #18804c;
      --shadow: 0 18px 48px rgba(22, 30, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #e9edf2;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    main {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .figure-shell {
      width: min(100%, 1540px);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: var(--paper);
      border: 1px solid #c7ced8;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 980px;
      height: auto;
      min-height: 520px;
      background: #ffffff;
      user-select: none;
    }

    aside {
      min-width: 0;
      min-height: 100vh;
      padding: 18px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.2;
      font-weight: 780;
    }

    .control-group {
      display: grid;
      gap: 9px;
    }

    .label {
      font-size: 0.75rem;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 760;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: #dfe4ea;
      border: 1px solid #c6ced8;
      border-radius: 8px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid #b9c2ce;
      border-radius: 7px;
      background: #ffffff;
      color: #161a20;
      font-weight: 720;
      cursor: pointer;
    }

    button:hover {
      border-color: #8b98a8;
    }

    button[aria-pressed="true"],
    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .insert-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
    }

    input {
      width: 100%;
      min-height: 38px;
      border: 1px solid #b9c2ce;
      border-radius: 7px;
      padding: 7px 9px;
      background: #ffffff;
      color: var(--ink);
    }

    .readout {
      border: 1px solid #c7ced8;
      border-radius: 8px;
      background: #ffffff;
      padding: 12px;
      display: grid;
      gap: 8px;
      min-height: 132px;
    }

    .readout-title {
      font-weight: 800;
      font-size: 0.95rem;
    }

    .fields {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 5px 8px;
      font-size: 0.91rem;
      line-height: 1.25;
    }

    .fields dt {
      margin: 0;
      color: var(--muted);
      font-weight: 760;
    }

    .fields dd {
      margin: 0;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }

    .legend {
      display: grid;
      gap: 6px;
      font-size: 0.87rem;
      color: #252b33;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .swatch {
      width: 24px;
      height: 4px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: #111111;
    }

    .swatch.parent {
      background: var(--orange);
    }

    .swatch.child {
      background: var(--blue);
    }

    .swatch.left {
      background: var(--purple);
    }

    .swatch.right {
      background: var(--green);
    }

    .status {
      min-height: 48px;
      border: 1px solid #c7ced8;
      border-radius: 8px;
      background: #ffffff;
      padding: 10px 12px;
      color: #262d36;
      font-size: 0.93rem;
      line-height: 1.35;
    }

    .tree-edge,
    .pointer-edge,
    .min-arrow,
    .highlight-edge,
    .root-line {
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tree-edge {
      stroke: #111111;
      stroke-width: 2.8;
    }

    .root-line {
      stroke: #111111;
      stroke-width: 2;
      stroke-dasharray: 7 9;
    }

    .pointer-edge {
      stroke: #111111;
      stroke-width: 2.2;
    }

    .min-arrow {
      stroke: #111111;
      stroke-width: 2.2;
    }

    .highlight-edge {
      stroke-width: 5;
      opacity: 0.92;
    }

    .highlight-parent {
      stroke: var(--orange);
    }

    .highlight-child {
      stroke: var(--blue);
    }

    .highlight-left {
      stroke: var(--purple);
    }

    .highlight-right {
      stroke: var(--green);
    }

    .nil-line {
      stroke-dasharray: 4 7;
    }

    .node {
      cursor: pointer;
    }

    .node circle {
      fill: var(--node);
      stroke: #111111;
      stroke-width: 2.2;
      transition: fill 180ms ease, stroke 180ms ease, stroke-width 180ms ease;
    }

    .node.marked circle {
      fill: #000000;
    }

    .node text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      dominant-baseline: middle;
      text-anchor: middle;
      fill: #000000;
      pointer-events: none;
    }

    .node.marked text {
      fill: #ffffff;
      font-weight: 700;
    }

    .node.selected circle {
      stroke: var(--accent);
      stroke-width: 5.2;
    }

    .node.ghost circle {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .panel-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      dominant-baseline: middle;
      fill: #111111;
    }

    .heap-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-style: italic;
      text-anchor: middle;
      fill: #111111;
    }

    .small-label {
      font-size: 18px;
      font-weight: 740;
      text-anchor: middle;
      fill: #20252c;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .caption-band {
      fill: #f7f9fb;
      stroke: #d7dde5;
      stroke-width: 1.2;
    }

    .caption {
      font-size: 17px;
      fill: #2d333c;
    }

    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
      }

      main {
        padding: 10px;
      }

      .figure-shell {
        max-height: none;
      }

      aside {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="figure-shell" aria-label="Interactive Fibonacci heap figure">
      <svg id="heapSvg" viewBox="0 0 1500 640" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Fibonacci heap shown as abstract trees and explicit pointer lists</title>
        <desc id="svgDesc">An interactive recreation of a Fibonacci heap with roots 23, 7, 3, 17, and 24. The minimum root is 3 and marked nodes are 18, 39, and 26.</desc>
      </svg>
    </div>
  </main>

  <aside aria-label="Figure controls">
    <h1>Fibonacci Heap H</h1>

    <section class="control-group" aria-label="Panel mode">
      <div class="label">Panel</div>
      <div class="segmented">
        <button id="modeA" type="button" aria-pressed="true">Tree (a)</button>
        <button id="modeB" type="button" aria-pressed="false">Pointers (b)</button>
      </div>
    </section>

    <section class="control-group" aria-label="Insertion animation">
      <div class="label">FIB-HEAP-INSERT</div>
      <div class="insert-row">
        <input id="insertKey" type="number" min="-99" max="999" step="1" value="2" aria-label="new node key">
        <button id="insertBtn" class="primary" type="button">Insert</button>
      </div>
      <button id="resetBtn" type="button">Reset heap</button>
    </section>

    <section class="readout" aria-live="polite">
      <div class="readout-title" id="selectedTitle">Selected node: 3</div>
      <dl class="fields" id="fieldList"></dl>
    </section>

    <section class="control-group">
      <div class="label">Pointer highlight</div>
      <div class="legend">
        <div class="legend-row"><span class="swatch parent"></span><span>p: parent pointer</span></div>
        <div class="legend-row"><span class="swatch child"></span><span>child: first child pointer</span></div>
        <div class="legend-row"><span class="swatch left"></span><span>left sibling pointer</span></div>
        <div class="legend-row"><span class="swatch right"></span><span>right sibling pointer</span></div>
      </div>
    </section>

    <div class="status" id="statusText">Panel (a) shows the five min-heap-ordered trees sharing one dashed circular root list.</div>
  </aside>

  <script>
    (function () {
      "use strict";

      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("heapSvg");
      const modeA = document.getElementById("modeA");
      const modeB = document.getElementById("modeB");
      const insertBtn = document.getElementById("insertBtn");
      const resetBtn = document.getElementById("resetBtn");
      const insertKey = document.getElementById("insertKey");
      const selectedTitle = document.getElementById("selectedTitle");
      const fieldList = document.getElementById("fieldList");
      const statusText = document.getElementById("statusText");

      const radius = 33;
      const baseRoots = ["23", "7", "3", "17", "24"];
      const baseNodes = {
        "23": { key: 23, marked: false, parent: null, children: [] },
        "7": { key: 7, marked: false, parent: null, children: [] },
        "3": { key: 3, marked: false, parent: null, children: ["18", "52", "38"] },
        "18": { key: 18, marked: true, parent: "3", children: ["39"] },
        "52": { key: 52, marked: false, parent: "3", children: [] },
        "38": { key: 38, marked: false, parent: "3", children: ["41"] },
        "39": { key: 39, marked: true, parent: "18", children: [] },
        "41": { key: 41, marked: false, parent: "38", children: [] },
        "17": { key: 17, marked: false, parent: null, children: ["30"] },
        "30": { key: 30, marked: false, parent: "17", children: [] },
        "24": { key: 24, marked: false, parent: null, children: ["26", "46"] },
        "26": { key: 26, marked: true, parent: "24", children: ["35"] },
        "46": { key: 46, marked: false, parent: "24", children: [] },
        "35": { key: 35, marked: false, parent: "26", children: [] }
      };

      const state = {
        mode: "abstract",
        selected: "3",
        nodes: cloneNodes(baseNodes),
        roots: baseRoots.slice(),
        min: "3",
        inserted: null,
        animation: null
      };

      const stages = [
        "A new singleton node is created with p = NIL and child = NIL.",
        "Two root-list neighbors are rewired: 3.right and 17.left now point through the new node.",
        "The circular doubly linked root list is restored with the new root spliced in.",
        "H.min is compared with the new key and updated only if the inserted key is smaller."
      ];

      function cloneNodes(nodes) {
        const copy = {};
        Object.keys(nodes).forEach((id) => {
          copy[id] = {
            key: nodes[id].key,
            marked: nodes[id].marked,
            parent: nodes[id].parent,
            children: nodes[id].children.slice()
          };
        });
        return copy;
      }

      function el(tag, attrs, parent) {
        const node = document.createElementNS(NS, tag);
        Object.keys(attrs || {}).forEach((name) => {
          if (attrs[name] !== null && attrs[name] !== undefined) {
            node.setAttribute(name, attrs[name]);
          }
        });
        if (parent) parent.appendChild(node);
        return node;
      }

      function rootOrderForRender(progress) {
        if (!state.inserted) return state.roots.slice();
        if (state.roots.includes(state.inserted.id)) return state.roots.slice();
        if (progress > 0.32) {
          const order = baseRoots.slice();
          order.splice(order.indexOf("3") + 1, 0, state.inserted.id);
          return order;
        }
        return state.roots.slice();
      }

      function positions(progress) {
        const hasInserted = Boolean(state.inserted);
        const useInsertedLayout = hasInserted && (state.roots.includes(state.inserted.id) || progress > 0.25);
        const yRoot = state.mode === "pointer" ? 166 : 165;
        const map = useInsertedLayout ? {
          "23": { x: 145, y: yRoot },
          "7": { x: 315, y: yRoot },
          "3": { x: 600, y: yRoot },
          "17": { x: 1050, y: yRoot },
          "24": { x: 1325, y: yRoot },
          "18": { x: 480, y: 318 },
          "52": { x: 600, y: 318 },
          "38": { x: 720, y: 318 },
          "39": { x: 480, y: 480 },
          "41": { x: 720, y: 480 },
          "30": { x: 1050, y: 318 },
          "26": { x: 1248, y: 318 },
          "46": { x: 1402, y: 318 },
          "35": { x: 1248, y: 480 }
        } : {
          "23": { x: 160, y: yRoot },
          "7": { x: 360, y: yRoot },
          "3": { x: 690, y: yRoot },
          "17": { x: 1085, y: yRoot },
          "24": { x: 1350, y: yRoot },
          "18": { x: 560, y: 312 },
          "52": { x: 690, y: 312 },
          "38": { x: 820, y: 312 },
          "39": { x: 560, y: 458 },
          "41": { x: 820, y: 458 },
          "30": { x: 1085, y: 312 },
          "26": { x: 1285, y: 312 },
          "46": { x: 1425, y: 312 },
          "35": { x: 1285, y: 458 }
        };

        if (state.inserted) {
          const finalPoint = useInsertedLayout ? { x: 800, y: yRoot } : { x: 815, y: yRoot };
          let p = state.roots.includes(state.inserted.id) ? 1 : progress;
          p = Math.max(0, Math.min(1, p));
          const eased = easeInOut(p);
          const start = { x: 815, y: 64 };
          map[state.inserted.id] = {
            x: start.x + (finalPoint.x - start.x) * eased,
            y: start.y + (finalPoint.y - start.y) * eased
          };
        }

        return map;
      }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function currentProgress() {
        if (!state.animation) return 1;
        const elapsed = performance.now() - state.animation.start;
        return Math.max(0, Math.min(1, elapsed / state.animation.duration));
      }

      function defs() {
        const d = el("defs", {}, svg);
        [
          ["arrowBlack", "#111111"],
          ["arrowOrange", "#c75b12"],
          ["arrowBlue", "#1265d8"],
          ["arrowPurple", "#7c3fc7"],
          ["arrowGreen", "#18804c"],
          ["arrowAccent", "#0d5cc8"]
        ].forEach(([id, color]) => {
          const marker = el("marker", {
            id,
            viewBox: "0 0 10 10",
            refX: 8.4,
            refY: 5,
            markerWidth: 7,
            markerHeight: 7,
            orient: "auto-start-reverse"
          }, d);
          el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }, marker);
        });
      }

      function arrow(start, end, offsetStart, offsetEnd) {
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const len = Math.hypot(dx, dy) || 1;
        const sx = start.x + (dx / len) * (offsetStart || radius);
        const sy = start.y + (dy / len) * (offsetStart || radius);
        const ex = end.x - (dx / len) * (offsetEnd || radius);
        const ey = end.y - (dy / len) * (offsetEnd || radius);
        return { sx, sy, ex, ey };
      }

      function lineArrow(group, start, end, className, markerId, offsetStart, offsetEnd) {
        const p = arrow(start, end, offsetStart, offsetEnd);
        return el("path", {
          d: `M ${p.sx.toFixed(1)} ${p.sy.toFixed(1)} L ${p.ex.toFixed(1)} ${p.ey.toFixed(1)}`,
          class: className,
          "marker-end": `url(#${markerId})`
        }, group);
      }

      function curvedArrow(group, d, className, markerId) {
        return el("path", {
          d,
          class: className,
          "marker-end": `url(#${markerId})`
        }, group);
      }

      function label(group, text, x, y, className) {
        const t = el("text", { x, y, class: className || "small-label" }, group);
        t.textContent = text;
        return t;
      }

      function render() {
        const progress = currentProgress();
        const pos = positions(progress);
        const order = rootOrderForRender(progress);
        svg.replaceChildren();
        defs();

        const root = el("g", {}, svg);
        label(root, state.mode === "abstract" ? "(a)" : "(b)", 42, 166, "panel-label");
        renderMinPointer(root, pos, progress);

        if (state.mode === "abstract") {
          renderAbstract(root, pos, order);
        } else {
          renderPointers(root, pos, order, progress);
          renderHighlights(root, pos, order);
        }

        renderNodes(root, pos, order);
        renderCaption(root);
        updateControls(progress);

        if (state.animation && progress < 1) {
          requestAnimationFrame(render);
        } else if (state.animation && progress >= 1) {
          finishInsertion();
        }
      }

      function renderMinPointer(group, pos, progress) {
        let minId = state.min;
        if (state.inserted && state.inserted.key < 3 && progress >= 0.78) {
          minId = state.inserted.id;
        }
        const target = pos[minId] || pos["3"];
        label(group, "H.min", target.x, 47, "heap-label");
        lineArrow(group, { x: target.x, y: 64 }, { x: target.x, y: target.y - radius + 1 }, "min-arrow", "arrowBlack", 0, 0);
      }

      function renderAbstract(group, pos, order) {
        const edges = el("g", {}, group);
        const rootY = pos["3"].y;
        const first = pos[order[0]];
        const last = pos[order[order.length - 1]];
        el("path", {
          d: `M ${first.x + radius} ${rootY} L ${last.x - radius} ${rootY}`,
          class: "root-line"
        }, edges);

        Object.keys(state.nodes).forEach((id) => {
          const node = state.nodes[id];
          node.children.forEach((childId) => {
            if (pos[id] && pos[childId]) {
              lineArrow(edges, pos[id], pos[childId], "tree-edge", "arrowBlack", radius - 2, radius - 2).removeAttribute("marker-end");
            }
          });
        });

        if (state.inserted && state.inserted.id && !state.roots.includes(state.inserted.id)) {
          el("path", {
            d: `M ${pos[state.inserted.id].x - 55} ${pos[state.inserted.id].y - 54} C ${pos[state.inserted.id].x - 18} ${pos[state.inserted.id].y - 82}, ${pos[state.inserted.id].x + 18} ${pos[state.inserted.id].y - 82}, ${pos[state.inserted.id].x + 55} ${pos[state.inserted.id].y - 54}`,
            class: "pointer-edge",
            "stroke-dasharray": "6 7"
          }, edges);
        }
      }

      function renderPointers(group, pos, order, progress) {
        const edges = el("g", {}, group);
        drawSiblingList(edges, order, pos, "root", progress);
        Object.keys(state.nodes).forEach((id) => {
          const node = state.nodes[id];
          if (node.children.length) {
            drawSiblingList(edges, node.children, pos, "children", progress);
            node.children.forEach((childId, index) => {
              if (!pos[id] || !pos[childId]) return;
              if (index === 0) {
                lineArrow(edges, pos[id], pos[childId], "pointer-edge", "arrowBlack", radius - 3, radius - 1);
              }
              lineArrow(edges, pos[childId], pos[id], "pointer-edge", "arrowBlack", radius - 1, radius - 3);
            });
          }
        });

        if (state.animation && progress < 0.88 && state.inserted) {
          const newId = state.inserted.id;
          const mid = pos[newId];
          const left = pos["3"];
          const right = pos["17"];
          if (progress > 0.35) {
            lineArrow(edges, left, mid, "highlight-edge highlight-right", "arrowGreen", radius - 2, radius - 2);
            lineArrow(edges, mid, right, "highlight-edge highlight-right", "arrowGreen", radius - 2, radius - 2);
            lineArrow(edges, right, mid, "highlight-edge highlight-left", "arrowPurple", radius - 2, radius - 2);
            lineArrow(edges, mid, left, "highlight-edge highlight-left", "arrowPurple", radius - 2, radius - 2);
          }
        }
      }

      function drawSiblingList(group, list, pos, kind, progress) {
        const existing = list.filter((id) => pos[id]);
        if (!existing.length) return;

        if (existing.length === 1) {
          drawSelfLoops(group, pos[existing[0]]);
          return;
        }

        const laneOffset = kind === "root" ? 22 : 20;
        for (let i = 0; i < existing.length - 1; i += 1) {
          const a = pos[existing[i]];
          const b = pos[existing[i + 1]];
          drawHorizontalPair(group, a, b, laneOffset);
        }

        const first = pos[existing[0]];
        const last = pos[existing[existing.length - 1]];
        const lift = kind === "root" ? 52 : 46;
        const topY = Math.min(first.y, last.y) - lift;
        const bottomY = Math.max(first.y, last.y) + lift;
        curvedArrow(group,
          `M ${last.x + radius - 6} ${last.y - 12} C ${last.x + 92} ${topY}, ${first.x - 92} ${topY}, ${first.x - radius + 6} ${first.y - 12}`,
          "pointer-edge",
          "arrowBlack"
        );
        curvedArrow(group,
          `M ${first.x - radius + 6} ${first.y + 12} C ${first.x - 92} ${bottomY}, ${last.x + 92} ${bottomY}, ${last.x + radius - 6} ${last.y + 12}`,
          "pointer-edge",
          "arrowBlack"
        );
      }

      function drawHorizontalPair(group, a, b, laneOffset) {
        curvedArrow(group,
          `M ${a.x + radius - 5} ${a.y - laneOffset} C ${(a.x + b.x) / 2} ${a.y - laneOffset - 10}, ${(a.x + b.x) / 2} ${b.y - laneOffset - 10}, ${b.x - radius + 5} ${b.y - laneOffset}`,
          "pointer-edge",
          "arrowBlack"
        );
        curvedArrow(group,
          `M ${b.x - radius + 5} ${b.y + laneOffset} C ${(a.x + b.x) / 2} ${b.y + laneOffset + 10}, ${(a.x + b.x) / 2} ${a.y + laneOffset + 10}, ${a.x + radius - 5} ${a.y + laneOffset}`,
          "pointer-edge",
          "arrowBlack"
        );
      }

      function drawSelfLoops(group, p) {
        curvedArrow(group,
          `M ${p.x - radius + 7} ${p.y - 19} C ${p.x - 78} ${p.y - 54}, ${p.x + 78} ${p.y - 54}, ${p.x + radius - 7} ${p.y - 19}`,
          "pointer-edge",
          "arrowBlack"
        );
        curvedArrow(group,
          `M ${p.x + radius - 7} ${p.y + 19} C ${p.x + 78} ${p.y + 54}, ${p.x - 78} ${p.y + 54}, ${p.x - radius + 7} ${p.y + 19}`,
          "pointer-edge",
          "arrowBlack"
        );
      }

      function renderHighlights(group, pos, order) {
        const id = state.selected;
        if (!id || !pos[id] || !state.nodes[id]) return;

        const node = state.nodes[id];
        const high = el("g", {}, group);
        const p = pos[id];
        const siblingList = node.parent ? state.nodes[node.parent].children : order;
        const idx = siblingList.indexOf(id);
        const leftId = siblingList[(idx - 1 + siblingList.length) % siblingList.length];
        const rightId = siblingList[(idx + 1) % siblingList.length];

        if (node.parent && pos[node.parent]) {
          lineArrow(high, p, pos[node.parent], "highlight-edge highlight-parent", "arrowOrange", radius - 2, radius - 2);
          label(high, "p", (p.x + pos[node.parent].x) / 2 - 18, (p.y + pos[node.parent].y) / 2 - 14, "small-label");
        } else {
          const nilY = p.y - 92;
          curvedArrow(high, `M ${p.x - 20} ${p.y - radius - 4} C ${p.x - 55} ${nilY}, ${p.x + 55} ${nilY}, ${p.x + 20} ${p.y - radius - 4}`, "highlight-edge highlight-parent nil-line", "arrowOrange");
          label(high, "p=NIL", p.x, nilY - 7, "small-label");
        }

        if (node.children.length && pos[node.children[0]]) {
          lineArrow(high, p, pos[node.children[0]], "highlight-edge highlight-child", "arrowBlue", radius - 2, radius - 2);
          label(high, "child", (p.x + pos[node.children[0]].x) / 2 + 30, (p.y + pos[node.children[0]].y) / 2 + 3, "small-label");
        } else {
          const nilY = p.y + 88;
          curvedArrow(high, `M ${p.x + 20} ${p.y + radius + 4} C ${p.x + 55} ${nilY}, ${p.x - 55} ${nilY}, ${p.x - 20} ${p.y + radius + 4}`, "highlight-edge highlight-child nil-line", "arrowBlue");
          label(high, "child=NIL", p.x, nilY + 17, "small-label");
        }

        if (leftId === id) {
          drawColoredSelfLoop(high, p, "highlight-left", "arrowPurple", -1);
          label(high, "left", p.x - 72, p.y + 4, "small-label");
        } else if (pos[leftId]) {
          lineArrow(high, p, pos[leftId], "highlight-edge highlight-left", "arrowPurple", radius - 2, radius - 2);
          label(high, "left", (p.x + pos[leftId].x) / 2, (p.y + pos[leftId].y) / 2 + 34, "small-label");
        }

        if (rightId === id) {
          drawColoredSelfLoop(high, p, "highlight-right", "arrowGreen", 1);
          label(high, "right", p.x + 76, p.y + 4, "small-label");
        } else if (pos[rightId]) {
          lineArrow(high, p, pos[rightId], "highlight-edge highlight-right", "arrowGreen", radius - 2, radius - 2);
          label(high, "right", (p.x + pos[rightId].x) / 2, (p.y + pos[rightId].y) / 2 - 34, "small-label");
        }
      }

      function drawColoredSelfLoop(group, p, className, markerId, direction) {
        if (direction < 0) {
          curvedArrow(group,
            `M ${p.x - radius + 8} ${p.y + 20} C ${p.x - 100} ${p.y + 56}, ${p.x - 100} ${p.y - 56}, ${p.x - radius + 8} ${p.y - 20}`,
            `highlight-edge ${className}`,
            markerId
          );
        } else {
          curvedArrow(group,
            `M ${p.x + radius - 8} ${p.y - 20} C ${p.x + 100} ${p.y - 56}, ${p.x + 100} ${p.y + 56}, ${p.x + radius - 8} ${p.y + 20}`,
            `highlight-edge ${className}`,
            markerId
          );
        }
      }

      function renderNodes(group, pos, order) {
        const nodeGroup = el("g", {}, group);
        Object.keys(state.nodes).forEach((id) => {
          if (!pos[id]) return;
          const node = state.nodes[id];
          const classes = ["node"];
          if (node.marked) classes.push("marked");
          if (state.selected === id) classes.push("selected");
          if (state.inserted && state.inserted.id === id && state.animation) classes.push("ghost");

          const g = el("g", {
            class: classes.join(" "),
            tabindex: "0",
            role: "button",
            "aria-label": `node ${node.key}`,
            transform: `translate(${pos[id].x}, ${pos[id].y})`
          }, nodeGroup);
          el("circle", { r: radius }, g);
          const txt = el("text", {
            y: node.key >= 100 || node.key <= -10 ? 1 : 0,
            style: `font-size: ${node.key >= 100 || node.key <= -10 ? 27 : 40}px`
          }, g);
          txt.textContent = String(node.key);
          g.addEventListener("click", () => selectNode(id));
          g.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectNode(id);
            }
          });
        });
      }

      function renderCaption(group) {
        el("rect", { x: 50, y: 566, width: 1400, height: 48, rx: 8, class: "caption-band" }, group);
        const caption = state.mode === "abstract"
          ? "Abstract view: five min-heap-ordered trees share a dashed circular root list; black nodes are marked."
          : "Pointer view: root and child sibling sets are circular doubly linked lists; select a node to color its p, child, left, and right fields.";
        const t = el("text", { x: 750, y: 596, class: "caption", "text-anchor": "middle" }, group);
        t.textContent = caption;
      }

      function selectNode(id) {
        state.selected = id;
        if (state.mode !== "pointer") state.mode = "pointer";
        render();
      }

      function updateControls(progress) {
        modeA.setAttribute("aria-pressed", String(state.mode === "abstract"));
        modeB.setAttribute("aria-pressed", String(state.mode === "pointer"));
        insertBtn.disabled = Boolean(state.inserted);

        const node = state.nodes[state.selected];
        if (!node) return;
        selectedTitle.textContent = `Selected node: ${node.key}`;

        const order = rootOrderForRender(progress);
        const siblings = node.parent ? state.nodes[node.parent].children : order;
        const idx = siblings.indexOf(state.selected);
        const left = siblings[(idx - 1 + siblings.length) % siblings.length];
        const right = siblings[(idx + 1) % siblings.length];
        const rows = [
          ["p", node.parent ? state.nodes[node.parent].key : "NIL"],
          ["child", node.children.length ? state.nodes[node.children[0]].key : "NIL"],
          ["left", left ? state.nodes[left].key : "NIL"],
          ["right", right ? state.nodes[right].key : "NIL"]
        ];
        fieldList.replaceChildren();
        rows.forEach(([name, value]) => {
          const dt = document.createElement("dt");
          dt.textContent = name;
          const dd = document.createElement("dd");
          dd.textContent = String(value);
          fieldList.append(dt, dd);
        });

        if (state.animation) {
          const stageIndex = Math.min(stages.length - 1, Math.floor(progress * stages.length));
          statusText.textContent = stages[stageIndex];
        } else if (state.mode === "abstract") {
          statusText.textContent = "Panel (a) shows the five min-heap-ordered trees sharing one dashed circular root list.";
        } else {
          statusText.textContent = `Panel (b) shows node ${node.key}'s four pointer fields in the circular-list representation.`;
        }
      }

      function finishInsertion() {
        if (!state.inserted) return;
        const id = state.inserted.id;
        if (!state.roots.includes(id)) {
          state.roots.splice(state.roots.indexOf("3") + 1, 0, id);
        }
        if (state.nodes[id].key < state.nodes[state.min].key) state.min = id;
        state.selected = id;
        state.animation = null;
        statusText.textContent = state.nodes[id].key < 3
          ? `Inserted ${state.nodes[id].key}; because it is smaller than 3, H.min now points to the new root.`
          : `Inserted ${state.nodes[id].key}; H.min remains at root 3.`;
        render();
      }

      function runInsert() {
        if (state.inserted) return;
        let key = Number.parseInt(insertKey.value, 10);
        if (!Number.isFinite(key)) key = 2;
        key = Math.max(-99, Math.min(999, key));
        insertKey.value = String(key);

        const id = "new";
        state.mode = "pointer";
        state.nodes[id] = { key, marked: false, parent: null, children: [] };
        state.inserted = { id, key };
        state.selected = id;
        state.animation = { start: performance.now(), duration: 3200 };
        render();
      }

      function resetHeap() {
        state.mode = "abstract";
        state.selected = "3";
        state.nodes = cloneNodes(baseNodes);
        state.roots = baseRoots.slice();
        state.min = "3";
        state.inserted = null;
        state.animation = null;
        render();
      }

      modeA.addEventListener("click", () => {
        state.mode = "abstract";
        render();
      });
      modeB.addEventListener("click", () => {
        state.mode = "pointer";
        render();
      });
      insertBtn.addEventListener("click", runInsert);
      resetBtn.addEventListener("click", resetHeap);
      insertKey.addEventListener("keydown", (event) => {
        if (event.key === "Enter") runInsert();
      });

      render();
    })();
  </script>
</body>
</html>
