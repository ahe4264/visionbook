<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slicing a Solid into Slabs</title>
  <style>
    :root {
      --ink: #242229;
      --muted: #626874;
      --paper: #ffffff;
      --page: #eef2f6;
      --panel: #f9fbfd;
      --line: #d7dfe8;
      --axis: #25252a;
      --red: #ff5562;
      --red-soft: rgba(255, 111, 101, 0.25);
      --peach: rgba(249, 199, 185, 0.58);
      --peach-2: rgba(252, 219, 209, 0.72);
      --blue: #80bee0;
      --blue-strong: #3d95bd;
      --blue-deep: #126283;
      --gold: #ffe3ad;
      --gold-edge: #c4c8ce;
      --shadow: 0 18px 50px rgba(35, 44, 58, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    main {
      width: min(1240px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .formula {
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(0.98rem, 1.7vw, 1.18rem);
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) repeat(4, minmax(130px, auto));
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .slider-wrap {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    label,
    .metric-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      min-width: 120px;
      accent-color: var(--blue-deep);
    }

    output,
    .metric-value {
      color: var(--ink);
      font-size: 0.96rem;
      font-weight: 760;
      white-space: nowrap;
    }

    .metric {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .metric-value.math {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 650;
    }

    .stage-wrap {
      padding: 10px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 420px;
      border: 1px solid #e1e7ee;
      border-radius: 8px;
      background: #ffffff;
      touch-action: none;
    }

    .math-text {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .caption-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      fill: #1e1c20;
    }

    .caption-plain {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-style: normal;
      font-weight: 600;
    }

    .axis-label,
    .base-label {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      fill: var(--ink);
    }

    .small-note {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .draggable {
      cursor: ew-resize;
    }

    @media (max-width: 820px) {
      body {
        padding: 8px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .formula {
        white-space: normal;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .slider-wrap {
        grid-column: 1 / -1;
      }

      .stage-wrap {
        padding: 6px;
      }

      svg {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="figure-title">
    <div class="topbar">
      <h1 id="figure-title">Volume by slicing a solid into cross-sectional slabs</h1>
      <div class="formula">V = lim &sum; A(x<sub>k</sub><sup>*</sup>)&Delta;x<sub>k</sub> = &int;<sub>a</sub><sup>b</sup> A(x) dx</div>
    </div>

    <section class="controls" aria-label="Interactive controls and values">
      <div class="slider-wrap">
        <label for="slabCount">Slabs n</label>
        <input id="slabCount" type="range" min="3" max="24" value="7" step="1">
        <output id="nValue" for="slabCount">7</output>
      </div>
      <div class="metric">
        <div class="metric-label">Selected slice</div>
        <div class="metric-value math" id="sliceValue">S<sub>3</sub></div>
      </div>
      <div class="metric">
        <div class="metric-label">Cross-section</div>
        <div class="metric-value math" id="areaValue">A(x<sub>3</sub><sup>*</sup>) = 2.32</div>
      </div>
      <div class="metric">
        <div class="metric-label">Slab volume</div>
        <div class="metric-value math" id="slabVolume">1.99</div>
      </div>
      <div class="metric">
        <div class="metric-label">Riemann sum</div>
        <div class="metric-value math" id="sumValue">18.98</div>
      </div>
    </section>

    <div class="stage-wrap">
      <svg id="figure" viewBox="0 0 1200 650" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">A solid divided into slabs and one slab isolated as a right prism</title>
        <desc id="svgDesc">The left panel shows a solid S from x equals a to x equals b partitioned into n slabs with one blue slab highlighted. The right panel zooms the selected slab and shows its width Delta x k, sample point x star k, cross-sectional area A at that point, slab volume, and the Riemann sum approximation.</desc>

        <defs>
          <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#25252a"></path>
          </marker>
          <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffe3ad" stroke="#bfc3ca" stroke-width="0.8"></path>
          </marker>
          <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="none" stroke="#bfc3ca" stroke-width="2"></path>
          </marker>
          <linearGradient id="peach-front" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#ffd9cf" stop-opacity="0.72"></stop>
            <stop offset="1" stop-color="#ffd0c7" stop-opacity="0.9"></stop>
          </linearGradient>
          <linearGradient id="blue-slab" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#a9d5eb" stop-opacity="0.95"></stop>
            <stop offset="1" stop-color="#70b4dc" stop-opacity="0.95"></stop>
          </linearGradient>
          <linearGradient id="prism-blue" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#bde1f2" stop-opacity="0.78"></stop>
            <stop offset="1" stop-color="#75b8df" stop-opacity="0.92"></stop>
          </linearGradient>
          <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d2b3a" flood-opacity="0.12"></feDropShadow>
          </filter>
        </defs>

        <g id="connector"></g>
        <g id="leftPanel"></g>
        <g id="rightPanel" class="draggable"></g>
      </svg>
    </div>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("figure");
      const leftPanel = document.getElementById("leftPanel");
      const rightPanel = document.getElementById("rightPanel");
      const connector = document.getElementById("connector");
      const nSlider = document.getElementById("slabCount");
      const nValue = document.getElementById("nValue");
      const sliceValue = document.getElementById("sliceValue");
      const areaValue = document.getElementById("areaValue");
      const slabVolume = document.getElementById("slabVolume");
      const sumValue = document.getElementById("sumValue");

      const NS = "http://www.w3.org/2000/svg";
      const state = { n: Number(nSlider.value), k: 3, dragging: false };
      const intervalLength = 6;

      const left = {
        ax: 76,
        bx: 520,
        base: 402,
        depthX: 125,
        depthY: -82
      };

      const zoom = {
        xL: 825,
        xR: 1005,
        base: 466,
        depthX: 104,
        depthY: -72,
        axisY: 466
      };

      function area01(t) {
        return 1.15 + 2.25 * t + 0.62 * Math.sin(Math.PI * t) + 0.18 * Math.sin(2 * Math.PI * t + 0.3);
      }

      function heightAt(t) {
        return 68 + area01(t) * 47;
      }

      function exactVolume() {
        let sum = 0;
        const samples = 1800;
        for (let i = 0; i < samples; i += 1) {
          const t = (i + 0.5) / samples;
          sum += area01(t);
        }
        return intervalLength * sum / samples;
      }

      function riemannSum(n) {
        let sum = 0;
        const dx = intervalLength / n;
        for (let i = 0; i < n; i += 1) {
          sum += area01((i + 0.5) / n) * dx;
        }
        return sum;
      }

      function selectedData() {
        const n = state.n;
        const k = Math.min(state.k, n);
        const t0 = (k - 1) / n;
        const t1 = k / n;
        const ts = (k - 0.5) / n;
        const a = area01(ts);
        const dx = intervalLength / n;
        return { n, k, t0, t1, ts, area: a, dx, slab: a * dx, sum: riemannSum(n), exact: exactVolume() };
      }

      function el(name, attrs = {}, parent) {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => {
          if (key === "text") {
            node.textContent = value;
          } else if (key === "html") {
            node.innerHTML = value;
          } else {
            node.setAttribute(key, value);
          }
        });
        if (parent) parent.appendChild(node);
        return node;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function fmt(value, digits = 2) {
        return Number(value).toFixed(digits);
      }

      function xAt(t) {
        return left.ax + (left.bx - left.ax) * t;
      }

      function topPoint(t) {
        return { x: xAt(t), y: left.base - heightAt(t) };
      }

      function pathThrough(points) {
        if (!points.length) return "";
        let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
        for (let i = 1; i < points.length; i += 1) {
          d += ` L ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)}`;
        }
        return d;
      }

      function sampleTop(t0 = 0, t1 = 1, samples = 36) {
        const pts = [];
        for (let i = 0; i <= samples; i += 1) {
          const t = t0 + (t1 - t0) * (i / samples);
          pts.push(topPoint(t));
        }
        return pts;
      }

      function addSubText(parent, main, sub, sup) {
        parent.textContent = "";
        const m = el("tspan", { text: main }, parent);
        if (sub !== undefined && sub !== null) {
          el("tspan", { text: sub, "baseline-shift": "sub", "font-size": "65%" }, parent);
        }
        if (sup !== undefined && sup !== null) {
          el("tspan", { text: sup, "baseline-shift": "super", "font-size": "65%" }, parent);
        }
        return m;
      }

      function addMathLabel(parent, x, y, main, sub, sup, attrs = {}) {
        const text = el("text", {
          x,
          y,
          class: "base-label",
          "font-size": attrs.size || 28,
          "text-anchor": attrs.anchor || "middle"
        }, parent);
        addSubText(text, main, sub, sup);
        return text;
      }

      function partitionLabel(parent, x, y, index) {
        const text = el("text", {
          x,
          y,
          class: "base-label",
          "font-size": 26,
          "text-anchor": "middle"
        }, parent);
        el("tspan", { text: "x" }, text);
        el("tspan", { text: index, "baseline-shift": "sub", "font-size": "65%" }, text);
      }

      function polygon(points) {
        return points.map((p) => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(" ");
      }

      function curvedSlicePath(t0, t1, includeBase = true) {
        const pts = sampleTop(t0, t1, Math.max(5, Math.ceil((t1 - t0) * 60)));
        const x0 = xAt(t0);
        const x1 = xAt(t1);
        if (includeBase) {
          return `M ${x0.toFixed(2)} ${left.base} L ${pathThrough(pts).slice(2)} L ${x1.toFixed(2)} ${left.base} Z`;
        }
        return pathThrough(pts);
      }

      function topRibbonPath(t0, t1) {
        const front = sampleTop(t0, t1, Math.max(5, Math.ceil((t1 - t0) * 60)));
        const back = front.map((p) => ({ x: p.x + left.depthX, y: p.y + left.depthY })).reverse();
        return `${pathThrough(front)} L ${back.map((p) => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" L ")} Z`;
      }

      function drawConnector() {
        clear(connector);
        el("path", {
          d: "M 228 453 C 330 528 526 535 684 392",
          fill: "none",
          stroke: "#bfc3ca",
          "stroke-width": 31,
          "stroke-linecap": "butt",
          opacity: 0.95,
          "marker-end": "url(#arrow-gray)"
        }, connector);
        el("path", {
          d: "M 226 451 C 330 525 523 531 679 389",
          fill: "none",
          stroke: "#ffe3ad",
          "stroke-width": 26,
          "stroke-linecap": "butt",
          opacity: 0.88,
          "marker-end": "url(#arrow-gold)"
        }, connector);
      }

      function drawLeftPanel() {
        clear(leftPanel);
        const data = selectedData();

        el("line", {
          x1: 0,
          y1: left.base,
          x2: 624,
          y2: left.base,
          stroke: "var(--axis)",
          "stroke-width": 2,
          "marker-end": "url(#arrow-dark)"
        }, leftPanel);

        const front = sampleTop(0, 1, 80);
        const frontPath = `${pathThrough(front)} L ${left.bx} ${left.base} L ${left.ax} ${left.base} Z`;
        const backFront = front.map((p) => ({ x: p.x + left.depthX, y: p.y + left.depthY }));
        const rightTop = topPoint(1);

        el("path", {
          d: topRibbonPath(0, 1),
          fill: "var(--peach-2)",
          stroke: "var(--red)",
          "stroke-width": 2.2,
          "stroke-linejoin": "round"
        }, leftPanel);

        el("polygon", {
          points: polygon([
            { x: left.bx, y: left.base },
            rightTop,
            { x: rightTop.x + left.depthX, y: rightTop.y + left.depthY },
            { x: left.bx + left.depthX, y: left.base + left.depthY }
          ]),
          fill: "rgba(255, 212, 203, 0.62)",
          stroke: "var(--red)",
          "stroke-width": 2.1
        }, leftPanel);

        el("path", {
          d: frontPath,
          fill: "url(#peach-front)",
          stroke: "var(--red)",
          "stroke-width": 2.1,
          "stroke-linejoin": "round"
        }, leftPanel);

        el("path", {
          d: topRibbonPath(data.t0, data.t1),
          fill: "rgba(114, 181, 219, 0.62)",
          stroke: "var(--blue-deep)",
          "stroke-width": 1.5,
          "stroke-linejoin": "round"
        }, leftPanel);

        el("path", {
          d: curvedSlicePath(data.t0, data.t1, true),
          fill: "url(#blue-slab)",
          stroke: "var(--blue-deep)",
          "stroke-width": 1.7,
          "stroke-linejoin": "round"
        }, leftPanel);

        for (let i = 0; i <= data.n; i += 1) {
          const t = i / data.n;
          const p = topPoint(t);
          const weight = i === 0 || i === data.n ? 2.1 : 2;
          const color = i === data.k - 1 || i === data.k ? "#1f252d" : "#3b3638";
          el("line", {
            x1: p.x,
            y1: left.base,
            x2: p.x,
            y2: p.y,
            stroke: color,
            "stroke-width": weight,
            opacity: i === 0 || i === data.n ? 0.92 : 0.82
          }, leftPanel);
          el("line", {
            x1: p.x,
            y1: p.y,
            x2: p.x + left.depthX,
            y2: p.y + left.depthY,
            stroke: color,
            "stroke-width": weight,
            opacity: i === 0 || i === data.n ? 0.92 : 0.78
          }, leftPanel);
        }

        el("path", {
          d: pathThrough(backFront),
          fill: "none",
          stroke: "rgba(48, 48, 50, 0.48)",
          "stroke-width": 2.1
        }, leftPanel);

        el("text", {
          x: 328,
          y: 128,
          class: "math-text",
          "font-size": 31,
          text: "S"
        }, leftPanel);

        const s1x = xAt(Math.min(0.5 / data.n, 0.18));
        const s2x = xAt(Math.min(1.5 / data.n, 0.34));
        addMathLabel(leftPanel, s1x, left.base - 18, "S", "1", null, { size: 28 });
        if (data.n > 3) addMathLabel(leftPanel, s2x, left.base - 30, "S", "2", null, { size: 28 });
        addMathLabel(leftPanel, xAt(1 - 0.5 / data.n) + 4, left.base - 72, "S", "n", null, { size: 28 });

        addMathLabel(leftPanel, left.ax, left.base + 32, "a", null, null, { size: 26 });
        addMathLabel(leftPanel, left.bx, left.base + 32, "b", null, null, { size: 26 });

        if (data.n <= 6) {
          for (let i = 1; i < data.n; i += 1) {
            partitionLabel(leftPanel, xAt(i / data.n), left.base + 32, i);
          }
        } else {
          partitionLabel(leftPanel, xAt(1 / data.n), left.base + 32, 1);
          partitionLabel(leftPanel, xAt(2 / data.n), left.base + 32, 2);
          el("text", {
            x: (xAt(2 / data.n) + xAt((data.n - 1) / data.n)) / 2,
            y: left.base + 30,
            class: "base-label",
            "font-size": 30,
            "text-anchor": "middle",
            text: ". . ."
          }, leftPanel);
          partitionLabel(leftPanel, xAt((data.n - 1) / data.n), left.base + 32, data.n - 1);
        }
      }

      function roundedCalloutPath(x, y, w, h, r, notchY, tipX, tipY) {
        const notchTop = notchY - 23;
        const notchBottom = notchY + 23;
        return [
          `M ${x + r} ${y}`,
          `H ${x + w - r}`,
          `Q ${x + w} ${y} ${x + w} ${y + r}`,
          `V ${notchTop}`,
          `H ${x + w + 45}`,
          `L ${tipX} ${tipY}`,
          `L ${x + w + 45} ${notchBottom}`,
          `H ${x + w}`,
          `V ${y + h - r}`,
          `Q ${x + w} ${y + h} ${x + w - r} ${y + h}`,
          `H ${x + r}`,
          `Q ${x} ${y + h} ${x} ${y + h - r}`,
          `V ${y + r}`,
          `Q ${x} ${y} ${x + r} ${y}`,
          "Z"
        ].join(" ");
      }

      function drawRightPanel() {
        clear(rightPanel);
        const data = selectedData();
        const z = zoom;
        const h = 122 + data.area * 47;
        const yTop = z.base - h;
        const sampleRel = 0.38;
        const xStar = z.xL + (z.xR - z.xL) * sampleRel;

        el("line", {
          x1: 720,
          y1: z.axisY,
          x2: 1130,
          y2: z.axisY,
          stroke: "var(--axis)",
          "stroke-width": 2.2,
          "marker-end": "url(#arrow-dark)"
        }, rightPanel);

        el("polygon", {
          points: polygon([
            { x: z.xL, y: yTop },
            { x: z.xR, y: yTop },
            { x: z.xR + z.depthX, y: yTop + z.depthY },
            { x: z.xL + z.depthX, y: yTop + z.depthY }
          ]),
          fill: "rgba(196, 228, 243, 0.76)",
          stroke: "#7e909c",
          "stroke-width": 2
        }, rightPanel);

        el("polygon", {
          points: polygon([
            { x: z.xL, y: z.base },
            { x: z.xL, y: yTop },
            { x: z.xL + z.depthX, y: yTop + z.depthY },
            { x: z.xL + z.depthX, y: z.base + z.depthY }
          ]),
          fill: "rgba(184, 218, 237, 0.65)",
          stroke: "#7e909c",
          "stroke-width": 2
        }, rightPanel);

        el("polygon", {
          points: polygon([
            { x: z.xL, y: z.base },
            { x: z.xR, y: z.base },
            { x: z.xR, y: yTop },
            { x: z.xL, y: yTop }
          ]),
          fill: "url(#prism-blue)",
          stroke: "#7e909c",
          "stroke-width": 2
        }, rightPanel);

        el("polygon", {
          points: polygon([
            { x: z.xR, y: z.base },
            { x: z.xR, y: yTop },
            { x: z.xR + z.depthX, y: yTop + z.depthY },
            { x: z.xR + z.depthX, y: z.base + z.depthY }
          ]),
          fill: "rgba(98, 168, 209, 0.62)",
          stroke: "#7e909c",
          "stroke-width": 2.2
        }, rightPanel);

        const backEdges = [
          [{ x: z.xL + z.depthX, y: z.base + z.depthY }, { x: z.xR + z.depthX, y: z.base + z.depthY }],
          [{ x: z.xR + z.depthX, y: z.base + z.depthY }, { x: z.xR + z.depthX, y: yTop + z.depthY }],
          [{ x: z.xL + z.depthX, y: yTop + z.depthY }, { x: z.xR + z.depthX, y: yTop + z.depthY }]
        ];
        backEdges.forEach(([a, b]) => {
          el("line", {
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y,
            stroke: "rgba(67, 82, 91, 0.58)",
            "stroke-width": 2
          }, rightPanel);
        });

        const plane = [
          { x: xStar, y: z.base },
          { x: xStar, y: yTop },
          { x: xStar + z.depthX, y: yTop + z.depthY },
          { x: xStar + z.depthX, y: z.base + z.depthY }
        ];
        el("polygon", {
          points: polygon(plane),
          fill: "rgba(226, 245, 255, 0.33)",
          stroke: "#20242b",
          "stroke-width": 4,
          "stroke-linejoin": "round"
        }, rightPanel);
        el("line", {
          x1: xStar,
          y1: z.base,
          x2: xStar,
          y2: yTop,
          stroke: "#20242b",
          "stroke-width": 5,
          "stroke-linecap": "round"
        }, rightPanel);

        el("circle", {
          cx: xStar,
          cy: z.axisY,
          r: 8,
          fill: "#20242b"
        }, rightPanel);

        addMathLabel(rightPanel, xStar + 8, z.axisY + 38, "x", "k", "*", { size: 27 });
        addMathLabel(rightPanel, 1126, z.axisY - 17, "x", null, null, { size: 27, anchor: "end" });

        const dimY = 542;
        el("line", { x1: z.xL, y1: z.base + 3, x2: z.xL, y2: dimY - 6, stroke: "#333", "stroke-width": 1.4 }, rightPanel);
        el("line", { x1: z.xR, y1: z.base + 3, x2: z.xR, y2: dimY - 6, stroke: "#333", "stroke-width": 1.4 }, rightPanel);
        el("line", {
          x1: z.xL + 14,
          y1: dimY,
          x2: z.xR - 14,
          y2: dimY,
          stroke: "#333",
          "stroke-width": 1.8,
          "marker-start": "url(#arrow-dark)",
          "marker-end": "url(#arrow-dark)"
        }, rightPanel);
        const dxText = el("text", {
          x: (z.xL + z.xR) / 2,
          y: dimY + 31,
          class: "base-label",
          "font-size": 29,
          "text-anchor": "middle"
        }, rightPanel);
        el("tspan", { text: String.fromCharCode(916) + "x" }, dxText);
        el("tspan", { text: "k", "baseline-shift": "sub", "font-size": "65%" }, dxText);

        const calloutTip = { x: xStar - 7, y: yTop + 0.55 * h };
        el("path", {
          d: roundedCalloutPath(635, 120, 138, 300, 24, 360, calloutTip.x, calloutTip.y),
          fill: "var(--gold)",
          stroke: "var(--gold-edge)",
          "stroke-width": 3,
          filter: "url(#soft-shadow)"
        }, rightPanel);

        const ct = el("text", {
          x: 704,
          y: 157,
          class: "caption-text",
          "text-anchor": "middle"
        }, rightPanel);
        ["The", "cross", "section", "here", "has", "area"].forEach((line, i) => {
          el("tspan", {
            x: 704,
            dy: i === 0 ? 0 : 33,
            class: "caption-plain",
            text: line
          }, ct);
        });
        const areaLine = el("tspan", { x: 704, dy: 37 }, ct);
        el("tspan", { text: "A(x" }, areaLine);
        el("tspan", { text: "k", "baseline-shift": "sub", "font-size": "65%" }, areaLine);
        el("tspan", { text: "*", "baseline-shift": "super", "font-size": "65%" }, areaLine);
        el("tspan", { text: ")." }, areaLine);

        addMathLabel(rightPanel, 1082, z.base - 58, "S", "k", null, { size: 30 });

        el("rect", {
          x: 612,
          y: 75,
          width: 546,
          height: 510,
          fill: "transparent",
          class: "draggable",
          id: "zoomHit"
        }, rightPanel);
      }

      function updateReadouts() {
        const data = selectedData();
        const error = Math.abs(data.sum - data.exact);
        nValue.value = String(data.n);
        sliceValue.innerHTML = `S<sub>${data.k}</sub>`;
        areaValue.innerHTML = `A(x<sub>${data.k}</sub><sup>*</sup>) = ${fmt(data.area)}`;
        slabVolume.textContent = fmt(data.slab);
        sumValue.innerHTML = `${fmt(data.sum)} <span style="color:#68707d;font-weight:650">error ${fmt(error, 3)}</span>`;
      }

      function render() {
        state.k = Math.max(1, Math.min(state.k, state.n));
        drawConnector();
        drawLeftPanel();
        drawRightPanel();
        updateReadouts();
      }

      function svgPoint(evt) {
        const point = svg.createSVGPoint();
        point.x = evt.clientX;
        point.y = evt.clientY;
        return point.matrixTransform(svg.getScreenCTM().inverse());
      }

      function selectFromPointer(evt) {
        const p = svgPoint(evt);
        const minX = 645;
        const maxX = 1128;
        const t = Math.max(0, Math.min(0.999, (p.x - minX) / (maxX - minX)));
        state.k = Math.max(1, Math.min(state.n, Math.floor(t * state.n) + 1));
        render();
      }

      nSlider.addEventListener("input", () => {
        state.n = Number(nSlider.value);
        state.k = Math.max(1, Math.min(state.k, state.n));
        render();
      });

      rightPanel.addEventListener("pointerdown", (evt) => {
        state.dragging = true;
        rightPanel.setPointerCapture(evt.pointerId);
        selectFromPointer(evt);
      });

      rightPanel.addEventListener("pointermove", (evt) => {
        if (state.dragging) selectFromPointer(evt);
      });

      rightPanel.addEventListener("pointerup", (evt) => {
        state.dragging = false;
        if (rightPanel.hasPointerCapture(evt.pointerId)) rightPanel.releasePointerCapture(evt.pointerId);
      });

      rightPanel.addEventListener("pointercancel", () => {
        state.dragging = false;
      });

      render();
    })();
  </script>
</body>
</html>
