<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rutherford Gold Foil Scattering</title>
  <style>
    :root {
      --paper: #fbfcff;
      --ink: #111318;
      --muted: #4e5968;
      --panel: #ffffff;
      --beam: #64db00;
      --beam-dark: #37a900;
      --gold: #d5b100;
      --accent: #0f6fff;
      --danger: #c90000;
      --line: #050505;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, #eef3f8 0%, #fbfcff 32%, #f5f8fc 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1320px, 100vw);
      padding: clamp(8px, 1.5vw, 18px);
    }

    .figure-wrap {
      background: var(--paper);
      border: 1px solid #d7dee8;
      box-shadow: 0 18px 42px rgba(30, 42, 58, 0.12);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      background: #fff;
    }

    .panel-box {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2.8;
      vector-effect: non-scaling-stroke;
    }

    .label {
      font-size: 25px;
      line-height: 1.05;
      fill: var(--ink);
      font-weight: 500;
    }

    .small-label {
      font-size: 24px;
      fill: var(--ink);
      font-weight: 500;
    }

    .caption {
      font-size: 24px;
      fill: var(--ink);
      font-weight: 500;
    }

    .leader {
      fill: none;
      stroke: var(--line);
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .beam {
      fill: none;
      stroke: var(--beam);
      stroke-width: 10;
      stroke-linecap: square;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .beam-thin {
      fill: none;
      stroke: var(--beam);
      stroke-width: 8;
      stroke-linecap: square;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .interactive-path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 1px 2px rgba(15, 111, 255, 0.35));
    }

    .interactive-guide {
      fill: none;
      stroke: #1f5ea8;
      stroke-width: 2.4;
      stroke-dasharray: 8 7;
      vector-effect: non-scaling-stroke;
    }

    .foil-face {
      stroke: #b98500;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .foil-band {
      fill: #fff5a8;
      stroke: #c08d00;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .atom {
      stroke: rgba(116, 94, 0, 0.35);
      stroke-width: 0.8;
    }

    .nucleus-dot {
      fill: var(--danger);
      stroke: #8b0000;
      stroke-width: 0.5;
    }

    .probability-halo {
      fill: rgba(255, 48, 48, 0.18);
      stroke: rgba(201, 0, 0, 0.45);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .drag-target {
      fill: transparent;
      cursor: ns-resize;
    }

    .alpha-handle {
      fill: #ffffff;
      stroke: var(--accent);
      stroke-width: 4;
      cursor: ns-resize;
      filter: drop-shadow(0 2px 4px rgba(12, 36, 80, 0.35));
      vector-effect: non-scaling-stroke;
    }

    .alpha-core {
      fill: var(--accent);
      pointer-events: none;
    }

    .measurement-text {
      font-size: 18px;
      fill: #123150;
      font-weight: 700;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .magnifier-arrow {
      fill: #e7ecef;
      stroke: #111;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .control-strip {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(180px, 0.7fr) minmax(170px, 0.6fr);
      gap: 14px;
      align-items: center;
      padding: 12px clamp(14px, 2vw, 24px) 16px;
      border-top: 1px solid #d7dee8;
      background: #f7f9fc;
    }

    .control-strip label {
      display: grid;
      gap: 6px;
      color: #18222f;
      font-size: 15px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .readout {
      min-width: 0;
      color: #18222f;
      font-size: 15px;
      font-weight: 700;
    }

    .readout span {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .probability-meter {
      height: 12px;
      margin-top: 7px;
      border-radius: 999px;
      background: #dce3ec;
      overflow: hidden;
      border: 1px solid #c6d0dc;
    }

    .probability-fill {
      height: 100%;
      width: 14%;
      background: linear-gradient(90deg, #20a04a, #f1c232, #db3c30);
      transform-origin: left center;
    }

    @media (max-width: 760px) {
      main {
        padding: 0;
      }

      .figure-wrap {
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }

      .control-strip {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const svg = document.getElementById("scene");
      const path = document.getElementById("interactivePath");
      const guide = document.getElementById("impactGuide");
      const halo = document.getElementById("halo");
      const handle = document.getElementById("alphaHandle");
      const dragTarget = document.getElementById("dragTarget");
      const sizeSlider = document.getElementById("nucleusSize");
      const angleText = document.getElementById("angleText");
      const impactText = document.getElementById("impactText");
      const angleReadout = document.getElementById("angleReadout");
      const probabilityReadout = document.getElementById("probabilityReadout");
      const probabilityFill = document.getElementById("probabilityFill");
      const nuclei = Array.from(document.querySelectorAll(".nucleus-dot"));

      const panel = { xMin: 650, xMax: 1286, yMin: 156, yMax: 682 };
      const nucleus = { x: 854, y: 350 };
      const atomRadius = 40;
      const baselineRadius = 2.8 + 28 * 0.075;
      let impactY = 386;
      let lastSign = 1;
      let dragging = false;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function svgPointFromEvent(event) {
        const point = new DOMPoint(event.clientX, event.clientY);
        return point.matrixTransform(svg.getScreenCTM().inverse());
      }

      function currentNucleusRadius() {
        return 2.8 + Number(sizeSlider.value) * 0.075;
      }

      function rayToPanelEdge(origin, angle) {
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        const candidates = [];

        if (Math.abs(dx) > 0.0001) {
          candidates.push((panel.xMax - origin.x) / dx);
          candidates.push((panel.xMin - origin.x) / dx);
        }
        if (Math.abs(dy) > 0.0001) {
          candidates.push((panel.yMax - origin.y) / dy);
          candidates.push((panel.yMin - origin.y) / dy);
        }

        const distances = candidates
          .filter((t) => t > 0)
          .map((t) => ({
            t,
            x: origin.x + dx * t,
            y: origin.y + dy * t
          }))
          .filter((p) => p.x >= panel.xMin - 1 && p.x <= panel.xMax + 1 && p.y >= panel.yMin - 1 && p.y <= panel.yMax + 1)
          .sort((a, b) => a.t - b.t);

        const hit = distances[0] || { x: panel.xMax, y: origin.y };
        return {
          x: origin.x + (hit.x - origin.x) * 0.965,
          y: origin.y + (hit.y - origin.y) * 0.965
        };
      }

      function scatteringAngle(impactParameter, radius) {
        const absB = Math.abs(impactParameter);
        if (absB < radius * 1.1) {
          return Math.PI - (absB / (radius * 1.1)) * 0.44;
        }
        const strength = 16 + radius * 2.25;
        return clamp(2 * Math.atan(strength / absB), 0.018, Math.PI * 0.94);
      }

      function updateScene() {
        const radius = currentNucleusRadius();
        nuclei.forEach((dot) => dot.setAttribute("r", radius.toFixed(2)));
        halo.setAttribute("r", (radius * 3.35).toFixed(2));

        const b = impactY - nucleus.y;
        if (Math.abs(b) > 1) {
          lastSign = Math.sign(b);
        }

        const sign = Math.abs(b) < 1 ? lastSign : Math.sign(b);
        const theta = scatteringAngle(b, radius);
        const deflection = sign * theta;
        const close = {
          x: nucleus.x - Math.max(radius + 10, 15),
          y: impactY
        };
        const exit = rayToPanelEdge(close, deflection);
        const midAngle = deflection * 0.48;
        const c1 = {
          x: close.x + Math.cos(midAngle) * 78,
          y: close.y + Math.sin(midAngle) * 78
        };

        path.setAttribute(
          "d",
          `M ${panel.xMin} ${impactY.toFixed(1)} L ${(close.x - 38).toFixed(1)} ${impactY.toFixed(1)} Q ${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${exit.x.toFixed(1)} ${exit.y.toFixed(1)}`
        );
        guide.setAttribute(
          "d",
          `M ${nucleus.x} ${nucleus.y} L ${nucleus.x} ${impactY.toFixed(1)} M ${nucleus.x - 9} ${nucleus.y} L ${nucleus.x + 9} ${nucleus.y} M ${nucleus.x - 9} ${impactY.toFixed(1)} L ${nucleus.x + 9} ${impactY.toFixed(1)}`
        );

        handle.setAttribute("transform", `translate(0 ${impactY - 386})`);
        handle.setAttribute("aria-valuenow", Math.round(impactY - nucleus.y).toString());

        const degrees = Math.round(theta * 180 / Math.PI);
        const relative = (radius * radius) / (baselineRadius * baselineRadius);
        const meter = clamp((relative / 12) * 100, 5, 100);

        angleText.textContent = `Deflection: ${degrees}\u00b0`;
        impactText.textContent = `Impact parameter: ${Math.round(Math.abs(b))}`;
        angleReadout.textContent = `${degrees}\u00b0`;
        probabilityReadout.textContent = `${relative.toFixed(1)}x`;
        probabilityFill.style.width = `${meter}%`;
      }

      function setImpactFromPointer(event) {
        const point = svgPointFromEvent(event);
        impactY = clamp(point.y, panel.yMin + 20, panel.yMax - 22);
        updateScene();
      }

      function beginDrag(event) {
        dragging = true;
        if (event.pointerId !== undefined) {
          dragTarget.setPointerCapture(event.pointerId);
        }
        setImpactFromPointer(event);
      }

      function endDrag(event) {
        dragging = false;
        if (event.pointerId !== undefined && dragTarget.hasPointerCapture(event.pointerId)) {
          dragTarget.releasePointerCapture(event.pointerId);
        }
      }

      dragTarget.addEventListener("pointerdown", beginDrag);
      handle.addEventListener("pointerdown", beginDrag);
      dragTarget.addEventListener("pointermove", (event) => {
        if (dragging) {
          setImpactFromPointer(event);
        }
      });
      handle.addEventListener("pointermove", (event) => {
        if (dragging) {
          setImpactFromPointer(event);
        }
      });
      dragTarget.addEventListener("pointerup", endDrag);
      dragTarget.addEventListener("pointercancel", endDrag);
      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);

      handle.addEventListener("keydown", (event) => {
        const step = event.shiftKey ? 20 : 8;
        if (event.key === "ArrowUp") {
          impactY = clamp(impactY - step, panel.yMin + 20, panel.yMax - 22);
          updateScene();
          event.preventDefault();
        }
        if (event.key === "ArrowDown") {
          impactY = clamp(impactY + step, panel.yMin + 20, panel.yMax - 22);
          updateScene();
          event.preventDefault();
        }
      });

      sizeSlider.addEventListener("input", updateScene);
      updateScene();
    })();
  </script>
</body>
</html>
