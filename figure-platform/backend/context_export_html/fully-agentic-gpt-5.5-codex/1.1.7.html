<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riemann Sums by Inscribed Rectangles</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e1f23;
      --muted: #5d6570;
      --paper: #ffffff;
      --page: #eef2f5;
      --axis: #242426;
      --curve: #279fd6;
      --curve-dark: #147fb0;
      --fill: #c8e2ed;
      --rect: #c9e3ee;
      --rect-edge: #4d4d4d;
      --accent: #1e6c92;
      --accent-2: #7b4e24;
      --line: #d7dde4;
      --shadow: 0 18px 44px rgba(24, 33, 42, 0.14);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: clamp(12px, 2vw, 26px);
    }

    main {
      width: min(1260px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .figure-shell,
    .control-shell {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .title-row {
      padding: 16px clamp(16px, 2vw, 24px) 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      background: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.22rem, 2.1vw, 1.72rem);
      line-height: 1.15;
      letter-spacing: 0;
      font-weight: 760;
    }

    .caption {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.42;
      max-width: 78ch;
    }

    .status-chip {
      flex: 0 0 auto;
      border: 1px solid #b9c9d2;
      background: #f4fafc;
      border-radius: 999px;
      padding: 8px 12px;
      color: #164d68;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .stage {
      padding: clamp(12px, 1.8vw, 20px);
      background: #ffffff;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(240px, 1fr));
      gap: clamp(14px, 2vw, 26px);
      align-items: start;
    }

    .panel {
      min-width: 0;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .single-wrap {
      display: none;
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .single-mode .compare-grid {
      display: none;
    }

    .single-mode .single-wrap {
      display: block;
    }

    .control-shell {
      padding: clamp(14px, 2vw, 20px);
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr);
      gap: 16px 22px;
      align-items: center;
    }

    .range-block {
      display: grid;
      gap: 9px;
    }

    .control-label,
    .toggle-label {
      color: #20242a;
      font-weight: 720;
      font-size: 0.98rem;
      letter-spacing: 0;
    }

    .range-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    output {
      min-width: 4.4rem;
      border: 1px solid #b9c9d2;
      background: #f7fbfd;
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
      color: #164d68;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      justify-content: flex-end;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .track {
      width: 54px;
      height: 30px;
      border: 1px solid #9eb3bf;
      border-radius: 999px;
      background: #e8eef2;
      position: relative;
      transition: background 160ms ease, border-color 160ms ease;
      flex: 0 0 auto;
    }

    .track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.24);
      transition: transform 160ms ease;
    }

    .switch input:checked + .track {
      background: var(--accent);
      border-color: var(--accent);
    }

    .switch input:checked + .track::after {
      transform: translateX(24px);
    }

    .readouts {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(170px, 1fr));
      gap: 10px;
      padding-top: 2px;
    }

    .metric {
      border: 1px solid #d5dde4;
      border-radius: 8px;
      background: #fafcfd;
      padding: 10px 12px;
      min-width: 0;
    }

    .metric b {
      display: block;
      color: #20242a;
      font-size: 0.86rem;
      margin-bottom: 2px;
    }

    .metric span {
      color: var(--accent);
      font-size: clamp(1.02rem, 1.55vw, 1.22rem);
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .curve {
      fill: none;
      stroke: var(--curve);
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .area-fill,
    .rect-fill {
      fill: var(--fill);
    }

    .area-fill {
      opacity: 0.95;
    }

    .rect-fill {
      stroke: var(--rect-edge);
      stroke-width: 1.6;
      shape-rendering: geometricPrecision;
    }

    .axis,
    .bound-line {
      stroke: var(--axis);
      stroke-width: 2.1;
      vector-effect: non-scaling-stroke;
    }

    .bound-line {
      stroke-width: 1.8;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1.6;
      vector-effect: non-scaling-stroke;
    }

    .math-label {
      fill: var(--axis);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 32px;
    }

    .small-label {
      fill: #3d4650;
      font-size: 16px;
      font-weight: 720;
    }

    .panel-letter {
      fill: var(--axis);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 32px;
    }

    .hint {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .gap-line {
      stroke: var(--accent-2);
      stroke-width: 2;
      stroke-dasharray: 6 5;
      opacity: 0.78;
      vector-effect: non-scaling-stroke;
    }

    .focus-dot {
      fill: #ffffff;
      stroke: var(--curve-dark);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 920px) {
      .title-row {
        align-items: start;
        flex-direction: column;
      }

      .status-chip {
        white-space: normal;
      }

      .compare-grid {
        grid-template-columns: 1fr;
      }

      .control-shell {
        grid-template-columns: 1fr;
      }

      .toggle-row {
        justify-content: flex-start;
      }

      .readouts {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 8px;
      }

      .title-row,
      .stage,
      .control-shell {
        padding: 12px;
      }

      .math-label,
      .panel-letter {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="figure-shell" id="figureShell" aria-labelledby="figureTitle">
      <div class="title-row">
        <div>
          <h1 id="figureTitle">Area Under a Curve by Inscribed Rectangles</h1>
          <p class="caption">Equal-width rectangles sit below the curve on [a, b]. As n increases, their total area approaches the shaded area.</p>
        </div>
        <div class="status-chip" id="statusChip">Lower sum: 0.0000</div>
      </div>

      <div class="stage">
        <div class="compare-grid" id="compareGrid" aria-label="Three panel comparison">
          <div class="panel">
            <svg id="panelArea" role="img" aria-label="Panel a: exact shaded area under the curve"></svg>
          </div>
          <div class="panel">
            <svg id="panelCoarse" role="img" aria-label="Panel b: coarse inscribed rectangle approximation"></svg>
          </div>
          <div class="panel">
            <svg id="panelFine" role="img" aria-label="Panel c: adjustable inscribed rectangle approximation"></svg>
          </div>
        </div>
        <div class="single-wrap" aria-label="Single animated view">
          <svg id="singlePanel" role="img" aria-label="Single animated Riemann sum view"></svg>
        </div>
      </div>
    </section>

    <section class="control-shell" aria-label="Interactive controls">
      <div class="range-block">
        <label class="control-label" for="nSlider">Number of rectangles n</label>
        <div class="range-line">
          <input id="nSlider" type="range" min="4" max="48" step="1" value="28">
          <output id="nOutput" for="nSlider">28</output>
        </div>
      </div>

      <div class="toggle-row">
        <label class="switch">
          <input id="singleToggle" type="checkbox">
          <span class="track" aria-hidden="true"></span>
          <span class="toggle-label">Single animated view</span>
        </label>
      </div>

      <div class="readouts" aria-live="polite">
        <div class="metric">
          <b>Riemann sum</b>
          <span id="sumReadout">0.0000</span>
        </div>
        <div class="metric">
          <b>Exact area</b>
          <span id="areaReadout">0.0000</span>
        </div>
        <div class="metric">
          <b>Remaining gap</b>
          <span id="gapReadout">0.0000</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const SVG_NS = "http://www.w3.org/2000/svg";
      const state = {
        n: 28,
        lastSingleN: 28,
        morphStart: null,
        morphFrom: 28,
        morphTo: 28
      };

      const elements = {
        shell: document.getElementById("figureShell"),
        area: document.getElementById("panelArea"),
        coarse: document.getElementById("panelCoarse"),
        fine: document.getElementById("panelFine"),
        single: document.getElementById("singlePanel"),
        slider: document.getElementById("nSlider"),
        nOutput: document.getElementById("nOutput"),
        toggle: document.getElementById("singleToggle"),
        sum: document.getElementById("sumReadout"),
        areaReadout: document.getElementById("areaReadout"),
        gap: document.getElementById("gapReadout"),
        status: document.getElementById("statusChip")
      };

      const G = {
        w: 620,
        h: 350,
        left: 68,
        right: 565,
        bottom: 268,
        top: 34,
        a: 112,
        b: 492,
        axisY: 268,
        axisX: 68,
        scaleY: 220
      };

      const SG = {
        w: 820,
        h: 430,
        left: 84,
        right: 760,
        bottom: 330,
        top: 38,
        a: 150,
        b: 668,
        axisY: 330,
        axisX: 84,
        scaleY: 280
      };

      function curve(t) {
        const peak = 0.64 * Math.exp(-Math.pow((t - 0.30) / 0.33, 2));
        const valley = 0.20 * Math.exp(-Math.pow((t - 0.73) / 0.18, 2));
        const rightLift = 0.26 * Math.pow(Math.max(0, t - 0.71), 2);
        const farLeftEase = 0.05 * Math.exp(-Math.pow((t + 0.08) / 0.13, 2));
        return 0.27 + peak - valley + rightLift - farLeftEase;
      }

      function px(t, geom) {
        return geom.a + t * (geom.b - geom.a);
      }

      function py(y, geom) {
        return geom.bottom - y * geom.scaleY;
      }

      function make(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        Object.keys(attrs || {}).forEach((key) => el.setAttribute(key, attrs[key]));
        return el;
      }

      function clear(svg) {
        while (svg.firstChild) {
          svg.removeChild(svg.firstChild);
        }
      }

      function addText(svg, text, attrs) {
        const node = make("text", attrs);
        node.textContent = text;
        svg.appendChild(node);
        return node;
      }

      function addMarker(svg, id) {
        const defs = make("defs");
        const marker = make("marker", {
          id,
          markerWidth: 11,
          markerHeight: 11,
          refX: 8.5,
          refY: 5.5,
          orient: "auto",
          markerUnits: "strokeWidth"
        });
        marker.appendChild(make("path", {
          d: "M 0 0 L 11 5.5 L 0 11 z",
          fill: "var(--axis)"
        }));
        defs.appendChild(marker);
        svg.appendChild(defs);
      }

      function curvePath(geom, t0, t1, steps) {
        let d = "";
        for (let i = 0; i <= steps; i += 1) {
          const t = t0 + (t1 - t0) * (i / steps);
          const cmd = i === 0 ? "M" : "L";
          d += `${cmd} ${px(t, geom).toFixed(2)} ${py(curve(t), geom).toFixed(2)} `;
        }
        return d.trim();
      }

      function areaPath(geom, steps) {
        let d = `M ${px(0, geom).toFixed(2)} ${py(0, geom).toFixed(2)} `;
        d += `L ${px(0, geom).toFixed(2)} ${py(curve(0), geom).toFixed(2)} `;
        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps;
          d += `L ${px(t, geom).toFixed(2)} ${py(curve(t), geom).toFixed(2)} `;
        }
        d += `L ${px(1, geom).toFixed(2)} ${py(0, geom).toFixed(2)} Z`;
        return d;
      }

      function lowerHeight(x0, x1) {
        let min = Infinity;
        const samples = 32;
        for (let i = 0; i <= samples; i += 1) {
          const t = x0 + (x1 - x0) * (i / samples);
          min = Math.min(min, curve(t));
        }
        return Math.max(0, min);
      }

      function rectangles(n) {
        const dx = 1 / n;
        const rects = [];
        let sum = 0;
        for (let i = 0; i < n; i += 1) {
          const x0 = i * dx;
          const x1 = (i + 1) * dx;
          const h = lowerHeight(x0, x1);
          rects.push({ x0, x1, h });
          sum += h * dx;
        }
        return { rects, sum, dx };
      }

      function exactArea() {
        const n = 1600;
        const h = 1 / n;
        let total = curve(0) + curve(1);
        for (let i = 1; i < n; i += 1) {
          total += curve(i * h) * (i % 2 === 0 ? 2 : 4);
        }
        return total * h / 3;
      }

      const exact = exactArea();

      function drawAxes(svg, geom, markerId) {
        svg.appendChild(make("line", {
          class: "axis",
          x1: geom.left - 44,
          y1: geom.axisY,
          x2: geom.right + 34,
          y2: geom.axisY,
          markerEnd: `url(#${markerId})`
        }));
        svg.appendChild(make("line", {
          class: "axis",
          x1: geom.axisX,
          y1: geom.bottom + 55,
          x2: geom.axisX,
          y2: geom.top - 12,
          markerEnd: `url(#${markerId})`
        }));
        addText(svg, "x", {
          class: "math-label",
          x: geom.right + 22,
          y: geom.axisY - 16,
          textAnchor: "middle"
        });
        addText(svg, "y", {
          class: "math-label",
          x: geom.axisX + 24,
          y: geom.top - 12,
          textAnchor: "middle"
        });
      }

      function drawIntervalLabels(svg, geom) {
        svg.appendChild(make("line", {
          class: "tick",
          x1: px(0, geom),
          y1: geom.axisY,
          x2: px(0, geom),
          y2: geom.axisY + 8
        }));
        svg.appendChild(make("line", {
          class: "tick",
          x1: px(1, geom),
          y1: geom.axisY,
          x2: px(1, geom),
          y2: geom.axisY + 8
        }));
        addText(svg, "a", {
          class: "math-label",
          x: px(0, geom),
          y: geom.axisY + 35,
          textAnchor: "middle"
        });
        addText(svg, "b", {
          class: "math-label",
          x: px(1, geom),
          y: geom.axisY + 35,
          textAnchor: "middle"
        });
      }

      function drawBoundaries(svg, geom) {
        svg.appendChild(make("line", {
          class: "bound-line",
          x1: px(0, geom),
          y1: geom.axisY,
          x2: px(0, geom),
          y2: py(curve(0), geom)
        }));
        svg.appendChild(make("line", {
          class: "bound-line",
          x1: px(1, geom),
          y1: geom.axisY,
          x2: px(1, geom),
          y2: py(curve(1), geom)
        }));
      }

      function drawRectangles(svg, geom, n, emphasizeGap) {
        const data = rectangles(n);
        data.rects.forEach((rect) => {
          const x = px(rect.x0, geom);
          const y = py(rect.h, geom);
          const width = Math.max(0, px(rect.x1, geom) - px(rect.x0, geom));
          const height = geom.axisY - y;
          svg.appendChild(make("rect", {
            class: "rect-fill",
            x: x.toFixed(2),
            y: y.toFixed(2),
            width: width.toFixed(2),
            height: height.toFixed(2)
          }));
        });

        if (emphasizeGap && n <= 14) {
          data.rects.forEach((rect) => {
            const mid = (rect.x0 + rect.x1) / 2;
            svg.appendChild(make("line", {
              class: "gap-line",
              x1: px(mid, geom),
              y1: py(rect.h, geom),
              x2: px(mid, geom),
              y2: py(curve(mid), geom)
            }));
          });
        }

        return data;
      }

      function drawPanel(svg, config) {
        const geom = config.geom || G;
        clear(svg);
        svg.setAttribute("viewBox", `0 0 ${geom.w} ${geom.h}`);
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

        const markerId = `${svg.id}-arrow`;
        addMarker(svg, markerId);
        drawAxes(svg, geom, markerId);

        if (config.kind === "area") {
          svg.appendChild(make("path", {
            class: "area-fill",
            d: areaPath(geom, 120)
          }));
          drawBoundaries(svg, geom);
          addText(svg, "true area", {
            class: "hint",
            x: (px(0, geom) + px(1, geom)) / 2,
            y: geom.axisY - 42,
            textAnchor: "middle"
          });
        } else {
          drawRectangles(svg, geom, config.n, config.showGap);
          addText(svg, `n = ${config.n}`, {
            class: "small-label",
            x: px(0.5, geom),
            y: geom.top + 14,
            textAnchor: "middle"
          });
        }

        svg.appendChild(make("path", {
          class: "curve",
          d: curvePath(geom, -0.06, 1.10, 180)
        }));

        if (config.kind === "rects" && config.n > 18) {
          const last = rectangles(config.n).rects[config.n - 1];
          const t = (last.x0 + last.x1) / 2;
          svg.appendChild(make("circle", {
            class: "focus-dot",
            cx: px(t, geom),
            cy: py(last.h, geom),
            r: 4.3
          }));
        }

        drawIntervalLabels(svg, geom);

        if (config.letter) {
          addText(svg, config.letter, {
            class: "panel-letter",
            x: geom.w / 2,
            y: geom.h - 12,
            textAnchor: "middle"
          });
        }
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function currentSingleN() {
        if (!state.morphStart) {
          return state.n;
        }
        const elapsed = performance.now() - state.morphStart;
        const p = Math.min(1, elapsed / 520);
        const mixed = state.morphFrom + (state.morphTo - state.morphFrom) * easeOutCubic(p);
        if (p >= 1) {
          state.morphStart = null;
          state.lastSingleN = state.n;
          return state.n;
        }
        requestAnimationFrame(renderSingle);
        return Math.max(4, Math.round(mixed));
      }

      function drawSingle(svg) {
        const geom = SG;
        const n = currentSingleN();
        clear(svg);
        svg.setAttribute("viewBox", `0 0 ${geom.w} ${geom.h}`);
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

        const markerId = `${svg.id}-arrow`;
        addMarker(svg, markerId);
        drawAxes(svg, geom, markerId);
        svg.appendChild(make("path", {
          class: "area-fill",
          d: areaPath(geom, 150),
          opacity: 0.35
        }));
        drawRectangles(svg, geom, n, n <= 12);
        svg.appendChild(make("path", {
          class: "curve",
          d: curvePath(geom, -0.06, 1.10, 220)
        }));
        drawBoundaries(svg, geom);
        drawIntervalLabels(svg, geom);
        addText(svg, `n = ${n}`, {
          class: "small-label",
          x: px(0.5, geom),
          y: geom.top + 18,
          textAnchor: "middle"
        });
      }

      function renderSingle() {
        if (elements.shell.classList.contains("single-mode")) {
          drawSingle(elements.single);
        }
      }

      function updateReadouts() {
        const data = rectangles(state.n);
        const gap = Math.max(0, exact - data.sum);
        elements.nOutput.value = String(state.n);
        elements.sum.textContent = data.sum.toFixed(4);
        elements.areaReadout.textContent = exact.toFixed(4);
        elements.gap.textContent = gap.toFixed(4);
        elements.status.textContent = `Lower sum: ${data.sum.toFixed(4)}`;
      }

      function renderAll() {
        drawPanel(elements.area, { kind: "area", letter: "(a)", geom: G });
        drawPanel(elements.coarse, { kind: "rects", n: 6, letter: "(b)", showGap: true, geom: G });
        drawPanel(elements.fine, { kind: "rects", n: state.n, letter: "(c)", showGap: state.n <= 12, geom: G });
        renderSingle();
        updateReadouts();
      }

      function handleSlider() {
        const next = Number(elements.slider.value);
        state.morphFrom = state.lastSingleN;
        state.morphTo = next;
        state.morphStart = performance.now();
        state.n = next;
        renderAll();
      }

      elements.slider.addEventListener("input", handleSlider);
      elements.toggle.addEventListener("change", () => {
        elements.shell.classList.toggle("single-mode", elements.toggle.checked);
        state.lastSingleN = state.n;
        state.morphStart = elements.toggle.checked ? performance.now() : null;
        state.morphFrom = elements.toggle.checked ? 6 : state.n;
        state.morphTo = state.n;
        renderAll();
      });

      renderAll();
    }());
  </script>
</body>
</html>
