<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polar Rectangle R</title>
  <style>
    :root {
      --ink: #242124;
      --muted: #5e6874;
      --blue: #279bd7;
      --blue-fill: rgba(127, 196, 226, 0.44);
      --red: #f0525d;
      --orange: #c77a16;
      --orange-fill: rgba(244, 173, 76, 0.18);
      --panel: #fbfcfd;
      --line: #d7dde5;
      --focus: #0c6fb7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      grid-template-areas: "stage controls";
    }

    main {
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      padding: 18px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .figure-frame {
      width: min(100%, 900px);
      min-height: 0;
      border: 1px solid #e8edf2;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      box-shadow: 0 16px 45px rgba(31, 49, 74, 0.08);
      overflow: hidden;
      display: flex;
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 420px;
      display: block;
      touch-action: none;
    }

    aside {
      grid-area: controls;
      min-width: 0;
      min-height: 0;
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: 0;
    }

    .bounds {
      margin: 0;
      color: var(--muted);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .control-group {
      display: grid;
      gap: 12px;
    }

    .control-row {
      display: grid;
      gap: 6px;
    }

    .control-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 13px;
      font-weight: 650;
    }

    output {
      color: #334155;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--focus);
    }

    .toggle {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 11px 12px;
      border: 1px solid #dfe5ec;
      border-radius: 8px;
      background: #ffffff;
      font-size: 13px;
      line-height: 1.35;
      cursor: pointer;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--orange);
    }

    .measurements {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .measure {
      min-width: 0;
      padding: 10px;
      border: 1px solid #e0e6ed;
      border-radius: 8px;
      background: #ffffff;
    }

    .measure span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .measure strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .axis {
      stroke: #222222;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .ray {
      stroke: var(--red);
      stroke-width: 3;
      stroke-dasharray: 16 10;
      stroke-linecap: round;
    }

    .arc {
      fill: none;
      stroke: var(--blue);
      stroke-width: 6;
      stroke-linecap: butt;
      stroke-linejoin: round;
    }

    .region {
      fill: var(--blue-fill);
      stroke: rgba(39, 155, 215, 0.38);
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .cart-rect {
      fill: var(--orange-fill);
      stroke: var(--orange);
      stroke-width: 2.5;
      stroke-dasharray: 8 7;
      stroke-linejoin: round;
    }

    .cart-edge {
      stroke: var(--orange);
      stroke-width: 2;
      stroke-dasharray: 4 6;
      stroke-linecap: round;
    }

    .label {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 34px;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .small-label {
      fill: #30343a;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 24px;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .overlay-label {
      fill: #8f5310;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 750;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .ghost {
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .ghost.visible {
      opacity: 1;
    }

    @media (max-width: 780px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
        grid-template-areas:
          "stage"
          "controls";
      }

      main {
        padding: 10px;
      }

      .figure-frame {
        width: 100%;
      }

      svg {
        min-height: 330px;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 12px;
        max-height: 42vh;
      }

      .panel-title {
        font-size: 16px;
      }

      .measurements {
        grid-template-columns: repeat(4, minmax(76px, 1fr));
      }
    }

    @media (max-width: 520px) {
      .measurements {
        grid-template-columns: 1fr 1fr;
      }

      .label {
        font-size: 29px;
      }

      .small-label {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Interactive polar rectangle figure">
    <div class="figure-frame">
      <svg id="diagram" viewBox="0 0 760 520" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Polar rectangle bounded by two radii and two angles</title>
        <desc id="svgDesc">A shaded polar rectangle R with circular arc boundaries r equals r1 and r equals r2, and dashed ray boundaries theta equals theta1 and theta equals theta2.</desc>
        <g id="plot">
          <line id="xAxis" class="axis"></line>
          <line id="theta1Ray" class="ray"></line>
          <line id="theta2Ray" class="ray"></line>
          <polygon id="region" class="region"></polygon>
          <polyline id="innerArc" class="arc"></polyline>
          <polyline id="outerArc" class="arc"></polyline>
          <g id="cartGroup" class="ghost" aria-hidden="true">
            <polygon id="cartRect" class="cart-rect"></polygon>
            <line id="cartDr" class="cart-edge"></line>
            <line id="cartDt" class="cart-edge"></line>
            <text id="cartLabel" class="overlay-label">straight rectangle</text>
            <text id="drLabel" class="overlay-label">Delta r</text>
            <text id="dtLabel" class="overlay-label">Delta theta</text>
          </g>
          <text id="r2Label" class="label"></text>
          <text id="r1Label" class="label"></text>
          <text id="theta2Label" class="label"></text>
          <text id="theta1Label" class="label"></text>
          <text id="regionLabel" class="label">R</text>
          <text id="arcNote" class="small-label">constant r arcs</text>
        </g>
      </svg>
    </div>
  </main>

  <aside aria-label="Controls">
    <h1 class="panel-title">Polar Rectangle R</h1>
    <p id="boundsReadout" class="bounds"></p>

    <div class="control-group">
      <label class="control-row" for="r1Input">
        <span class="control-top"><span>r1</span><output id="r1Val">1.50</output></span>
        <input id="r1Input" type="range" min="0.80" max="2.20" step="0.01" value="1.50">
      </label>

      <label class="control-row" for="r2Input">
        <span class="control-top"><span>r2</span><output id="r2Val">2.00</output></span>
        <input id="r2Input" type="range" min="1.00" max="2.45" step="0.01" value="2.00">
      </label>

      <label class="control-row" for="theta1Input">
        <span class="control-top"><span>theta1</span><output id="theta1Val">pi/6</output></span>
        <input id="theta1Input" type="range" min="0.18" max="1.05" step="0.005" value="0.5235987756">
      </label>

      <label class="control-row" for="theta2Input">
        <span class="control-top"><span>theta2</span><output id="theta2Val">pi/4</output></span>
        <input id="theta2Input" type="range" min="0.30" max="1.25" step="0.005" value="0.7853981634">
      </label>
    </div>

    <label class="toggle" for="cartToggle">
      <input id="cartToggle" type="checkbox">
      <span>Straight-sided rectangle overlay</span>
    </label>

    <div class="measurements" aria-label="Current interval measurements">
      <div class="measure"><span>Delta r</span><strong id="deltaR">0.50</strong></div>
      <div class="measure"><span>Delta theta</span><strong id="deltaTheta">pi/12</strong></div>
      <div class="measure"><span>Inner r</span><strong id="innerR">1.50</strong></div>
      <div class="measure"><span>Outer r</span><strong id="outerR">2.00</strong></div>
    </div>
  </aside>

  <script>
    (function () {
      "use strict";

      var state = {
        r1: 1.5,
        r2: 2,
        theta1: Math.PI / 6,
        theta2: Math.PI / 4,
        showCart: false
      };

      var minGapR = 0.16;
      var minGapTheta = 0.08;
      var maxRForScale = 2.62;
      var frame = {
        left: 72,
        right: 704,
        top: 34,
        bottom: 470,
        originX: 90,
        originY: 470,
        scale: 168
      };

      var ids = [
        "xAxis", "theta1Ray", "theta2Ray", "region", "innerArc", "outerArc",
        "cartGroup", "cartRect", "cartDr", "cartDt", "cartLabel", "drLabel",
        "dtLabel", "r2Label", "r1Label", "theta2Label", "theta1Label",
        "regionLabel", "arcNote", "boundsReadout", "r1Input", "r2Input",
        "theta1Input", "theta2Input", "cartToggle", "r1Val", "r2Val",
        "theta1Val", "theta2Val", "deltaR", "deltaTheta", "innerR", "outerR"
      ];

      var el = {};
      ids.forEach(function (id) {
        el[id] = document.getElementById(id);
      });

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function point(r, theta) {
        return {
          x: frame.originX + r * frame.scale * Math.cos(theta),
          y: frame.originY - r * frame.scale * Math.sin(theta)
        };
      }

      function screenVector(theta, length) {
        return {
          x: length * Math.cos(theta),
          y: -length * Math.sin(theta)
        };
      }

      function tangentVector(theta, length) {
        return {
          x: -length * Math.sin(theta),
          y: -length * Math.cos(theta)
        };
      }

      function setLine(node, a, b) {
        node.setAttribute("x1", a.x.toFixed(2));
        node.setAttribute("y1", a.y.toFixed(2));
        node.setAttribute("x2", b.x.toFixed(2));
        node.setAttribute("y2", b.y.toFixed(2));
      }

      function pointsToString(points) {
        return points.map(function (p) {
          return p.x.toFixed(2) + "," + p.y.toFixed(2);
        }).join(" ");
      }

      function arcPoints(r, start, end, extra) {
        var a0 = clamp(start - extra, 0.02, 1.38);
        var a1 = clamp(end + extra, 0.04, 1.45);
        var steps = Math.max(28, Math.ceil((a1 - a0) * 80));
        var pts = [];
        for (var i = 0; i <= steps; i += 1) {
          var t = a0 + (a1 - a0) * i / steps;
          pts.push(point(r, t));
        }
        return pts;
      }

      function regionPoints() {
        var steps = Math.max(24, Math.ceil((state.theta2 - state.theta1) * 90));
        var pts = [];
        var i;
        for (i = 0; i <= steps; i += 1) {
          pts.push(point(state.r2, state.theta1 + (state.theta2 - state.theta1) * i / steps));
        }
        for (i = steps; i >= 0; i -= 1) {
          pts.push(point(state.r1, state.theta1 + (state.theta2 - state.theta1) * i / steps));
        }
        return pts;
      }

      function formatNumber(value) {
        return value.toFixed(2);
      }

      function formatAngle(value) {
        var fractions = [
          [1, 12], [1, 10], [1, 8], [1, 6], [1, 5], [1, 4],
          [3, 10], [1, 3], [3, 8], [2, 5], [5, 12], [1, 2]
        ];
        var i;
        for (i = 0; i < fractions.length; i += 1) {
          var n = fractions[i][0];
          var d = fractions[i][1];
          if (Math.abs(value - Math.PI * n / d) < 0.012) {
            return n === 1 ? "pi/" + d : n + "pi/" + d;
          }
        }
        return (value / Math.PI).toFixed(2) + "pi";
      }

      function prettyAngle(value) {
        return formatAngle(value).replace(/pi/g, "\u03c0");
      }

      function labelText(prefix, value, angle) {
        if (angle) {
          return prefix + " = " + prettyAngle(value);
        }
        return prefix + " = " + formatNumber(value);
      }

      function moveText(node, x, y, anchor) {
        node.setAttribute("x", x.toFixed(2));
        node.setAttribute("y", y.toFixed(2));
        node.setAttribute("text-anchor", anchor || "middle");
      }

      function syncInputs() {
        el.r1Input.value = state.r1.toFixed(2);
        el.r2Input.value = state.r2.toFixed(2);
        el.theta1Input.value = state.theta1.toFixed(3);
        el.theta2Input.value = state.theta2.toFixed(3);
        el.cartToggle.checked = state.showCart;

        el.r1Val.value = formatNumber(state.r1);
        el.r2Val.value = formatNumber(state.r2);
        el.theta1Val.value = prettyAngle(state.theta1);
        el.theta2Val.value = prettyAngle(state.theta2);
        el.deltaR.textContent = formatNumber(state.r2 - state.r1);
        el.deltaTheta.textContent = prettyAngle(state.theta2 - state.theta1);
        el.innerR.textContent = formatNumber(state.r1);
        el.outerR.textContent = formatNumber(state.r2);

        el.boundsReadout.textContent =
          formatNumber(state.r1) + " <= r <= " + formatNumber(state.r2) +
          ",  " + prettyAngle(state.theta1) + " <= \u03b8 <= " + prettyAngle(state.theta2);
      }

      function enforceBounds(changed) {
        var rMin = parseFloat(el.r1Input.min);
        var rMax = parseFloat(el.r2Input.max);
        var tMin = parseFloat(el.theta1Input.min);
        var tMax = parseFloat(el.theta2Input.max);

        state.r1 = clamp(state.r1, rMin, parseFloat(el.r1Input.max));
        state.r2 = clamp(state.r2, parseFloat(el.r2Input.min), rMax);
        state.theta1 = clamp(state.theta1, tMin, parseFloat(el.theta1Input.max));
        state.theta2 = clamp(state.theta2, parseFloat(el.theta2Input.min), tMax);

        if (state.r2 - state.r1 < minGapR) {
          if (changed === "r1") {
            state.r2 = clamp(state.r1 + minGapR, parseFloat(el.r2Input.min), rMax);
            if (state.r2 - state.r1 < minGapR) state.r1 = state.r2 - minGapR;
          } else {
            state.r1 = clamp(state.r2 - minGapR, rMin, parseFloat(el.r1Input.max));
            if (state.r2 - state.r1 < minGapR) state.r2 = state.r1 + minGapR;
          }
        }

        if (state.theta2 - state.theta1 < minGapTheta) {
          if (changed === "theta1") {
            state.theta2 = clamp(state.theta1 + minGapTheta, parseFloat(el.theta2Input.min), tMax);
            if (state.theta2 - state.theta1 < minGapTheta) state.theta1 = state.theta2 - minGapTheta;
          } else {
            state.theta1 = clamp(state.theta2 - minGapTheta, tMin, parseFloat(el.theta1Input.max));
            if (state.theta2 - state.theta1 < minGapTheta) state.theta2 = state.theta1 + minGapTheta;
          }
        }
      }

      function drawCartOverlay() {
        var base = point(state.r1, state.theta1);
        var radial = screenVector(state.theta1, (state.r2 - state.r1) * frame.scale);
        var tangent = tangentVector(state.theta1, (state.theta2 - state.theta1) * frame.scale);
        var p1 = base;
        var p2 = { x: base.x + radial.x, y: base.y + radial.y };
        var p3 = { x: p2.x + tangent.x, y: p2.y + tangent.y };
        var p4 = { x: base.x + tangent.x, y: base.y + tangent.y };

        el.cartRect.setAttribute("points", pointsToString([p1, p2, p3, p4]));
        setLine(el.cartDr, p1, p2);
        setLine(el.cartDt, p1, p4);

        moveText(el.cartLabel, (p3.x + p4.x) / 2, (p3.y + p4.y) / 2 - 10, "middle");
        moveText(el.drLabel, (p1.x + p2.x) / 2 + 7, (p1.y + p2.y) / 2 + 22, "middle");
        moveText(el.dtLabel, (p1.x + p4.x) / 2 - 22, (p1.y + p4.y) / 2, "middle");
        el.cartGroup.setAttribute("class", state.showCart ? "ghost visible" : "ghost");
      }

      function drawLabels() {
        var mid = (state.theta1 + state.theta2) / 2;
        var rMid = (state.r1 + state.r2) / 2;
        var center = point(rMid, mid);
        moveText(el.regionLabel, center.x + 5, center.y + 12, "middle");

        var outerLabel = point(state.r2, clamp(state.theta2 + 0.12, 0.25, 1.34));
        var innerLabel = point(state.r1, clamp(state.theta2 + 0.10, 0.25, 1.34));
        moveText(el.r2Label, outerLabel.x - 22, Math.max(40, outerLabel.y - 14), "end");
        moveText(el.r1Label, innerLabel.x - 26, Math.max(72, innerLabel.y + 6), "end");
        el.r2Label.textContent = labelText("r", state.r2, false);
        el.r1Label.textContent = labelText("r", state.r1, false);

        var t2LabelPoint = point(0.76, state.theta2);
        var t1LabelPoint = point(0.98, state.theta1);
        moveText(el.theta2Label, Math.max(52, t2LabelPoint.x - 44), t2LabelPoint.y - 22, "end");
        moveText(el.theta1Label, t1LabelPoint.x + 18, Math.min(frame.bottom - 30, t1LabelPoint.y + 62), "start");
        el.theta2Label.textContent = labelText("\u03b8", state.theta2, true);
        el.theta1Label.textContent = labelText("\u03b8", state.theta1, true);

        var notePoint = point(state.r2 + 0.23, mid + 0.04);
        moveText(el.arcNote, Math.min(690, notePoint.x + 20), Math.max(54, notePoint.y), "middle");
      }

      function render() {
        enforceBounds();
        syncInputs();

        setLine(el.xAxis, { x: 22, y: frame.originY }, { x: 725, y: frame.originY });
        setLine(el.theta1Ray, point(0, state.theta1), point(maxRForScale, state.theta1));
        setLine(el.theta2Ray, point(0, state.theta2), point(maxRForScale, state.theta2));

        el.region.setAttribute("points", pointsToString(regionPoints()));
        el.innerArc.setAttribute("points", pointsToString(arcPoints(state.r1, state.theta1, state.theta2, 0.13)));
        el.outerArc.setAttribute("points", pointsToString(arcPoints(state.r2, state.theta1, state.theta2, 0.13)));

        drawCartOverlay();
        drawLabels();
      }

      el.r1Input.addEventListener("input", function () {
        state.r1 = parseFloat(this.value);
        enforceBounds("r1");
        render();
      });

      el.r2Input.addEventListener("input", function () {
        state.r2 = parseFloat(this.value);
        enforceBounds("r2");
        render();
      });

      el.theta1Input.addEventListener("input", function () {
        state.theta1 = parseFloat(this.value);
        enforceBounds("theta1");
        render();
      });

      el.theta2Input.addEventListener("input", function () {
        state.theta2 = parseFloat(this.value);
        enforceBounds("theta2");
        render();
      });

      el.cartToggle.addEventListener("change", function () {
        state.showCart = this.checked;
        render();
      });

      window.addEventListener("resize", render);
      render();
    }());
  </script>
</body>
</html>
