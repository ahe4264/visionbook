<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Similar Triangles for Perspective Projection</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111318;
      --muted: #5e6875;
      --paper: #ffffff;
      --surface: #f3f6f8;
      --line: #d7dee7;
      --red: #f31313;
      --green: #26e214;
      --green-dark: #0a7b1e;
      --cyan: #52edf0;
      --cyan-dark: #0f7b96;
      --accent: #8b3a20;
      --shadow: 0 18px 48px rgba(31, 42, 55, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #edf1f5;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    main {
      min-width: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .figure-frame {
      width: min(100%, 1220px);
      aspect-ratio: 1280 / 820;
      max-height: calc(100vh - 32px);
      background: var(--paper);
      border: 1px solid #cdd5df;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
      touch-action: none;
      user-select: none;
    }

    aside {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      background: var(--surface);
      border-left: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(30, 40, 50, 0.07);
    }

    .readout {
      display: grid;
      gap: 9px;
      font-family: "Cambria Math", Georgia, serif;
      font-size: 22px;
      line-height: 1.22;
    }

    .readout small {
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.3;
    }

    .control {
      display: grid;
      gap: 9px;
    }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #252b33;
    }

    .value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--red);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
      font-weight: 700;
      color: #252b33;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 46px;
      height: 26px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #bac4cf;
      transition: background 160ms ease;
    }

    .track::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      top: 3px;
      left: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(20, 30, 40, 0.28);
      transition: transform 160ms ease;
    }

    .switch input:checked + .track {
      background: #222831;
    }

    .switch input:checked + .track::after {
      transform: translateX(20px);
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: auto;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .swatch {
      width: 18px;
      height: 10px;
      border-radius: 2px;
      flex: 0 0 auto;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }

    .swatch.green {
      background: rgba(38, 226, 20, 0.55);
    }

    .swatch.cyan {
      background: rgba(82, 237, 240, 0.6);
    }

    .axis-label,
    .math-label {
      font-family: Georgia, "Times New Roman", serif;
      fill: #111318;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 5px;
      stroke-linejoin: round;
      font-style: italic;
      pointer-events: none;
    }

    .axis-label {
      font-size: 54px;
    }

    .math-label {
      font-size: 42px;
    }

    .small-label {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      fill: #17202a;
      font-size: 16px;
      font-weight: 800;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 4px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .measure-label {
      font-family: "Cambria Math", Georgia, serif;
      font-size: 26px;
      font-style: italic;
      fill: #112018;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 4px;
      pointer-events: none;
    }

    .badge text {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 800;
      fill: #101418;
      pointer-events: none;
    }

    .badge rect {
      fill: rgba(255, 255, 255, 0.9);
      stroke: #20242b;
      stroke-width: 1.2;
      rx: 5;
    }

    .outline {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      cursor: grab;
    }

    .point:active {
      cursor: grabbing;
    }

    .hint-ring {
      fill: none;
      stroke: rgba(243, 19, 19, 0.42);
      stroke-width: 2.5;
      opacity: 0;
      pointer-events: none;
    }

    .point:hover + .hint-ring,
    .dragging .hint-ring {
      opacity: 1;
    }

    @media (max-width: 920px) {
      body {
        grid-template-columns: 1fr;
      }

      main {
        min-height: auto;
        padding: 10px;
      }

      .figure-frame {
        max-height: none;
      }

      aside {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .readout {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        font-size: 19px;
      }
    }

    @media (max-width: 560px) {
      .axis-label {
        font-size: 44px;
      }

      .math-label {
        font-size: 34px;
      }

      .measure-label {
        font-size: 22px;
      }

      aside {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="figure-frame">
      <svg id="scene" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
        <title id="title">Similar triangles deriving perspective projection</title>
        <desc id="desc">Interactive pinhole projection diagram with a draggable world point, a focal length slider, and matching side labels for the X-Z and Y-Z similar triangles.</desc>
        <defs>
          <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#111318"></path>
          </marker>
          <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#16d60c"></path>
          </marker>
          <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#f31313"></path>
          </marker>
          <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <g id="fills"></g>
        <g id="plane"></g>
        <g id="construction"></g>
        <g id="axes"></g>
        <g id="measurements"></g>
        <g id="labels"></g>
        <g id="dragLayer"></g>
      </svg>
    </div>
  </main>

  <aside>
    <h1>Perspective Projection from Similar Triangles</h1>

    <section class="panel readout" aria-live="polite">
      <div>
        <span id="eqX">x/f = X/Z</span><br>
        <small id="valX">x = 0.00, X = 0.00</small>
      </div>
      <div>
        <span id="eqY">y/f = Y/Z</span><br>
        <small id="valY">y = 0.00, Y = 0.00</small>
      </div>
      <div>
        <span id="depthText">Z = 0.00</span><br>
        <small>shared depth</small>
      </div>
      <div>
        <span id="fText">f = 0.00</span><br>
        <small>image plane distance</small>
      </div>
    </section>

    <section class="panel control">
      <div class="control-head">
        <label for="focal">Focal length <i>f</i></label>
        <span class="value" id="focalValue">2.20</span>
      </div>
      <input id="focal" type="range" min="1.25" max="3.45" step="0.01" value="2.20">
    </section>

    <section class="panel">
      <div class="toggle-row">
        <label for="correspondence">Correspondence labels</label>
        <span class="switch">
          <input id="correspondence" type="checkbox" checked>
          <span class="track" aria-hidden="true"></span>
        </span>
      </div>
    </section>

    <section class="legend" aria-label="Legend">
      <div class="legend-row"><span class="swatch green"></span><span>X-Z triangle pair: x/f = X/Z</span></div>
      <div class="legend-row"><span class="swatch cyan"></span><span>Y-Z triangle pair: y/f = Y/Z</span></div>
    </section>
  </aside>

  <script>
    (() => {
      "use strict";

      const svg = document.getElementById("scene");
      const groups = {
        fills: document.getElementById("fills"),
        plane: document.getElementById("plane"),
        construction: document.getElementById("construction"),
        axes: document.getElementById("axes"),
        measurements: document.getElementById("measurements"),
        labels: document.getElementById("labels"),
        dragLayer: document.getElementById("dragLayer")
      };

      const focal = document.getElementById("focal");
      const correspondence = document.getElementById("correspondence");
      const focalValue = document.getElementById("focalValue");
      const eqX = document.getElementById("eqX");
      const eqY = document.getElementById("eqY");
      const valX = document.getElementById("valX");
      const valY = document.getElementById("valY");
      const depthText = document.getElementById("depthText");
      const fText = document.getElementById("fText");

      const origin = { x: 530, y: 416 };
      const scale = 67;
      const basis = {
        z: { x: 1, y: 0 },
        x: { x: 0.55, y: 0.72 },
        y: { x: 0.48, y: -0.66 }
      };

      const state = {
        X: 2.45,
        Y: 1.85,
        Z: 6.55,
        f: Number(focal.value),
        showCorrespondence: correspondence.checked,
        dragging: false,
        dragStart: null
      };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const fmt = (value) => value.toFixed(2);

      function el(tag, attrs = {}, parent = null) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (value !== null && value !== undefined) {
            node.setAttribute(key, value);
          }
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      function clear(group) {
        while (group.firstChild) group.removeChild(group.firstChild);
      }

      function p3(x, y, z) {
        return {
          X: x,
          Y: y,
          Z: z,
          sx: origin.x + scale * (z * basis.z.x + x * basis.x.x + y * basis.y.x),
          sy: origin.y + scale * (z * basis.z.y + x * basis.x.y + y * basis.y.y)
        };
      }

      function linePath(points) {
        return points.map((point, index) => `${index ? "L" : "M"} ${point.sx.toFixed(2)} ${point.sy.toFixed(2)}`).join(" ");
      }

      function polyPoints(points) {
        return points.map((point) => `${point.sx.toFixed(2)},${point.sy.toFixed(2)}`).join(" ");
      }

      function midpoint(a, b, shift = { x: 0, y: 0 }) {
        return {
          sx: (a.sx + b.sx) / 2 + shift.x,
          sy: (a.sy + b.sy) / 2 + shift.y
        };
      }

      function addText(parent, text, point, className, attrs = {}) {
        const node = el("text", {
          x: point.sx,
          y: point.sy,
          class: className,
          "text-anchor": attrs.anchor || "middle",
          "dominant-baseline": attrs.baseline || "middle"
        }, parent);
        node.textContent = text;
        return node;
      }

      function addLine(parent, a, b, attrs = {}) {
        return el("line", {
          x1: a.sx,
          y1: a.sy,
          x2: b.sx,
          y2: b.sy,
          ...attrs
        }, parent);
      }

      function addSegment(parent, a, b, color, width, extra = {}) {
        return addLine(parent, a, b, {
          class: "outline",
          stroke: color,
          "stroke-width": width,
          ...extra
        });
      }

      function addBadge(parent, text, point, tone) {
        const g = el("g", { class: "badge" }, parent);
        const padX = 8;
        const width = Math.max(48, text.length * 7.6 + padX * 2);
        el("rect", {
          x: point.sx - width / 2,
          y: point.sy - 13,
          width,
          height: 26,
          fill: "rgba(255,255,255,0.92)",
          stroke: tone
        }, g);
        const label = el("text", {
          x: point.sx,
          y: point.sy + 1,
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, g);
        label.textContent = text;
        return g;
      }

      function arrowLabel(parent, text, a, b, color, shift, marker) {
        addSegment(parent, a, b, color, 4, {
          "marker-end": marker,
          filter: state.showCorrespondence ? "url(#softGlow)" : null
        });
        addText(parent, text, midpoint(a, b, shift), "measure-label");
      }

      function getGeometry() {
        const xImage = state.f * state.X / state.Z;
        const yImage = state.f * state.Y / state.Z;

        return {
          O: p3(0, 0, 0),
          P: p3(state.X, state.Y, state.Z),
          D: p3(0, 0, state.Z),
          Qx: p3(state.X, 0, state.Z),
          Qy: p3(0, state.Y, state.Z),
          C: p3(0, 0, -state.f),
          Ix: p3(-xImage, 0, -state.f),
          Iy: p3(0, -yImage, -state.f),
          I: p3(-xImage, -yImage, -state.f),
          xImage,
          yImage
        };
      }

      function drawPlane(g) {
        const spanX = 2.95;
        const spanY = 2.65;
        const c = -state.f;
        const corners = [
          p3(-spanX, -spanY, c),
          p3(spanX, -spanY, c),
          p3(spanX, spanY, c),
          p3(-spanX, spanY, c)
        ];
        el("polygon", {
          points: polyPoints(corners),
          fill: "#e8edf0",
          stroke: "#1d2229",
          "stroke-width": 3,
          opacity: 0.78
        }, g);
        addLine(g, p3(-spanX, 0, c), p3(spanX, 0, c), {
          stroke: "#21db10",
          "stroke-width": 2.5,
          opacity: 0.85
        });
        addLine(g, p3(0, -spanY, c), p3(0, spanY, c), {
          stroke: "#21db10",
          "stroke-width": 2.5,
          opacity: 0.85
        });
      }

      function drawFills(g, geo) {
        el("polygon", {
          points: polyPoints([geo.O, geo.D, geo.Qy]),
          fill: "rgba(82, 237, 240, 0.55)",
          stroke: "none"
        }, g);
        el("polygon", {
          points: polyPoints([geo.O, geo.C, geo.Iy]),
          fill: "rgba(82, 237, 240, 0.46)",
          stroke: "none"
        }, g);
        el("polygon", {
          points: polyPoints([geo.O, geo.D, geo.Qx]),
          fill: "rgba(38, 226, 20, 0.48)",
          stroke: "none"
        }, g);
        el("polygon", {
          points: polyPoints([geo.O, geo.C, geo.Ix]),
          fill: "rgba(38, 226, 20, 0.38)",
          stroke: "none"
        }, g);
      }

      function drawAxes(g, geo) {
        const axisStyle = {
          stroke: "#111318",
          "stroke-width": 8,
          "stroke-linecap": "round",
          "marker-end": "url(#arrowBlack)"
        };
        addLine(g, geo.O, p3(0, 0, 9.35), axisStyle);
        addLine(g, geo.O, p3(4.15, 0, 0), axisStyle);
        addLine(g, geo.O, p3(0, 4.0, 0), axisStyle);

        addText(g, "Z", p3(0, 0, 5.45), "axis-label");
        addText(g, "X", p3(4.05, 0, 8.1), "axis-label");
        addText(g, "Y", p3(0, 4.0, 8.2), "axis-label");

        el("circle", {
          cx: geo.O.sx,
          cy: geo.O.sy,
          r: 5,
          fill: "#111318"
        }, g);
      }

      function drawConstruction(g, geo) {
        addSegment(g, geo.O, geo.D, "#f31313", 7);
        addSegment(g, geo.D, geo.Qx, "#f31313", 7);
        addSegment(g, geo.D, geo.Qy, "#f31313", 7);
        addSegment(g, geo.O, geo.C, "#f31313", 5);
        addSegment(g, geo.C, geo.Ix, "#f31313", 5);
        addSegment(g, geo.C, geo.Iy, "#f31313", 5);

        addLine(g, geo.Ix, geo.I, {
          stroke: "#21db10",
          "stroke-width": 2,
          "stroke-dasharray": "8 7",
          opacity: 0.75
        });
        addLine(g, geo.Iy, geo.I, {
          stroke: "#21db10",
          "stroke-width": 2,
          "stroke-dasharray": "8 7",
          opacity: 0.75
        });

        el("path", {
          d: linePath([geo.I, geo.O, geo.P]),
          fill: "none",
          stroke: "#151515",
          "stroke-width": 6,
          "stroke-dasharray": "8 10",
          "stroke-linecap": "round"
        }, g);

        addLine(g, geo.P, geo.D, {
          stroke: "#8b99a8",
          "stroke-width": 3,
          opacity: 0.78
        });
        addLine(g, geo.Qx, geo.P, {
          stroke: "#8b99a8",
          "stroke-width": 2.5,
          opacity: 0.55
        });
        addLine(g, geo.Qy, geo.P, {
          stroke: "#8b99a8",
          "stroke-width": 2.5,
          opacity: 0.55
        });
      }

      function drawMeasurements(g, geo) {
        arrowLabel(g, "x", geo.C, geo.Ix, "#18d20c", { x: -14, y: -28 }, "url(#arrowGreen)");
        arrowLabel(g, "y", geo.C, geo.Iy, "#18d20c", { x: -36, y: 8 }, "url(#arrowGreen)");

        addText(g, "f", midpoint(geo.O, geo.C, { x: -18, y: 72 }), "math-label");
        addText(g, "P", { sx: geo.P.sx + 28, sy: geo.P.sy - 22 }, "small-label", { anchor: "start" });
        addText(g, "p", { sx: geo.I.sx - 22, sy: geo.I.sy - 15 }, "small-label");

        if (state.showCorrespondence) {
          addSegment(g, geo.D, geo.Qx, "#0aa31f", 8, { opacity: 0.82, filter: "url(#softGlow)" });
          addSegment(g, geo.C, geo.Ix, "#0aa31f", 7, { opacity: 0.82, filter: "url(#softGlow)" });
          addSegment(g, geo.D, geo.Qy, "#0c96b2", 8, { opacity: 0.82, filter: "url(#softGlow)" });
          addSegment(g, geo.C, geo.Iy, "#0c96b2", 7, { opacity: 0.82, filter: "url(#softGlow)" });
          addSegment(g, geo.O, geo.D, "#f31313", 9, { opacity: 0.58, filter: "url(#softGlow)" });
          addSegment(g, geo.O, geo.C, "#f31313", 7, { opacity: 0.58, filter: "url(#softGlow)" });

          addBadge(g, "X ↔ x", midpoint(geo.Qx, geo.D, { x: 18, y: 26 }), "#0aa31f");
          addBadge(g, "Y ↔ y", midpoint(geo.Qy, geo.D, { x: 22, y: -26 }), "#0c96b2");
          addBadge(g, "Z ↔ f", midpoint(geo.O, geo.D, { x: 18, y: -26 }), "#f31313");
          addBadge(g, "same ray", midpoint(geo.O, geo.P, { x: 4, y: 34 }), "#20242b");
        }
      }

      function drawLabels(g, geo) {
        addText(g, "x/f = X/Z", { sx: 876, sy: 722 }, "small-label");
        addText(g, "y/f = Y/Z", { sx: 876, sy: 755 }, "small-label");
      }

      function drawPoint(g, geo) {
        const shadow = el("circle", {
          cx: geo.P.sx,
          cy: geo.P.sy,
          r: 20,
          fill: "rgba(0, 0, 0, 0.15)"
        }, g);
        shadow.setAttribute("transform", "translate(3 3)");

        const point = el("circle", {
          id: "worldPoint",
          class: "point",
          cx: geo.P.sx,
          cy: geo.P.sy,
          r: 18,
          fill: "#ff1717",
          stroke: "#1b1b1b",
          "stroke-width": 3,
          tabindex: "0",
          role: "button",
          "aria-label": "Drag 3D point P"
        }, g);
        el("circle", {
          class: "hint-ring",
          cx: geo.P.sx,
          cy: geo.P.sy,
          r: 28
        }, g);

        el("circle", {
          cx: geo.I.sx,
          cy: geo.I.sy,
          r: 15,
          fill: "#8b3a20",
          stroke: "#1b1b1b",
          "stroke-width": 3
        }, g);

        point.addEventListener("pointerdown", startDrag);
        point.addEventListener("keydown", nudgePoint);
      }

      function render() {
        const geo = getGeometry();
        clear(groups.fills);
        clear(groups.plane);
        clear(groups.construction);
        clear(groups.axes);
        clear(groups.measurements);
        clear(groups.labels);
        clear(groups.dragLayer);

        drawFills(groups.fills, geo);
        drawPlane(groups.plane);
        drawConstruction(groups.construction, geo);
        drawAxes(groups.axes, geo);
        drawMeasurements(groups.measurements, geo);
        drawLabels(groups.labels, geo);
        drawPoint(groups.dragLayer, geo);

        focalValue.textContent = fmt(state.f);
        fText.textContent = `f = ${fmt(state.f)}`;
        depthText.textContent = `Z = ${fmt(state.Z)}`;
        eqX.textContent = `x/f = X/Z = ${fmt(state.X / state.Z)}`;
        eqY.textContent = `y/f = Y/Z = ${fmt(state.Y / state.Z)}`;
        valX.textContent = `x = ${fmt(geo.xImage)}, X = ${fmt(state.X)}`;
        valY.textContent = `y = ${fmt(geo.yImage)}, Y = ${fmt(state.Y)}`;
      }

      function svgPoint(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function solveDelta(dx, dy) {
        const columns = [
          { x: basis.x.x * scale, y: basis.x.y * scale, weight: 1.25 },
          { x: basis.y.x * scale, y: basis.y.y * scale, weight: 1.25 },
          { x: basis.z.x * scale, y: basis.z.y * scale, weight: 0.86 }
        ];

        let aa = 0;
        let ab = 0;
        let bb = 0;
        for (const col of columns) {
          const wx = col.x / col.weight;
          const wy = col.y / col.weight;
          aa += wx * wx;
          ab += wx * wy;
          bb += wy * wy;
        }
        const det = aa * bb - ab * ab;
        const ux = (bb * dx - ab * dy) / det;
        const uy = (-ab * dx + aa * dy) / det;

        return {
          X: (columns[0].x * ux + columns[0].y * uy) / columns[0].weight,
          Y: (columns[1].x * ux + columns[1].y * uy) / columns[1].weight,
          Z: (columns[2].x * ux + columns[2].y * uy) / columns[2].weight
        };
      }

      function startDrag(event) {
        event.preventDefault();
        const pt = svgPoint(event);
        state.dragging = true;
        svg.classList.add("dragging");
        state.dragStart = {
          pointer: pt,
          X: state.X,
          Y: state.Y,
          Z: state.Z
        };
        event.currentTarget.setPointerCapture(event.pointerId);
        event.currentTarget.addEventListener("pointermove", dragPoint);
        event.currentTarget.addEventListener("pointerup", endDrag, { once: true });
        event.currentTarget.addEventListener("pointercancel", endDrag, { once: true });
      }

      function dragPoint(event) {
        if (!state.dragging || !state.dragStart) return;
        const pt = svgPoint(event);
        const delta = solveDelta(pt.x - state.dragStart.pointer.x, pt.y - state.dragStart.pointer.y);
        state.X = clamp(state.dragStart.X + delta.X, 0.6, 3.35);
        state.Y = clamp(state.dragStart.Y + delta.Y, 0.5, 2.95);
        state.Z = clamp(state.dragStart.Z + delta.Z, 4.15, 7.45);
        render();
      }

      function endDrag(event) {
        state.dragging = false;
        state.dragStart = null;
        svg.classList.remove("dragging");
        event.currentTarget.releasePointerCapture(event.pointerId);
        event.currentTarget.removeEventListener("pointermove", dragPoint);
      }

      function nudgePoint(event) {
        const step = event.shiftKey ? 0.25 : 0.1;
        let changed = true;
        switch (event.key) {
          case "ArrowLeft":
            state.Z = clamp(state.Z - step, 4.15, 7.45);
            break;
          case "ArrowRight":
            state.Z = clamp(state.Z + step, 4.15, 7.45);
            break;
          case "ArrowUp":
            state.Y = clamp(state.Y + step, 0.5, 2.95);
            break;
          case "ArrowDown":
            state.X = clamp(state.X + step, 0.6, 3.35);
            break;
          default:
            changed = false;
        }
        if (changed) {
          event.preventDefault();
          render();
        }
      }

      focal.addEventListener("input", () => {
        state.f = Number(focal.value);
        render();
      });

      correspondence.addEventListener("change", () => {
        state.showCorrespondence = correspondence.checked;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
