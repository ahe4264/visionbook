<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D Convolution Sliding Window</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --page: #eef1f3;
      --ink: #101214;
      --muted: #657078;
      --faint: #b8c2c5;
      --line: #cbd3d7;
      --active: #dce7e8;
      --active-strong: #77c8c3;
      --terra: #bf705d;
      --terra-soft: rgba(191, 112, 93, 0.5);
      --panel: #f7f9fa;
      --shadow: rgba(24, 35, 45, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 344px;
      min-height: 100vh;
    }

    main {
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .figure-frame {
      width: min(100%, 1360px);
      aspect-ratio: 1600 / 1080;
      min-height: 420px;
      background: var(--paper);
      border: 1px solid #ccd4d8;
      box-shadow: 0 18px 46px var(--shadow);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #fff;
      touch-action: none;
    }

    aside {
      min-height: 100vh;
      padding: 18px;
      background: var(--panel);
      border-left: 1px solid #d3dadd;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .control {
      display: grid;
      gap: 9px;
    }

    label,
    .label {
      font-size: 13px;
      font-weight: 700;
      color: #2c3439;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--terra);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pill {
      min-width: 46px;
      padding: 4px 8px;
      border: 1px solid #cbd5d9;
      border-radius: 7px;
      background: #fff;
      font-variant-numeric: tabular-nums;
      text-align: center;
      font-weight: 700;
    }

    button {
      width: 100%;
      border: 1px solid #a95645;
      background: #bf705d;
      color: #fff;
      border-radius: 7px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }

    button[aria-pressed="true"] {
      background: #8f4c3e;
    }

    .readout,
    .calc {
      border: 1px solid #d6dde0;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
    }

    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .readout strong {
      display: block;
      color: var(--ink);
      font-size: 18px;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .calc h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .equation {
      font-family: Cambria, Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.45;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .term-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin-top: 10px;
    }

    .term {
      min-height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #d3dbdf;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      font-family: Cambria, Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 1.1;
      background: #fbfcfc;
    }

    .term.zero {
      color: #934b3f;
      background: #fff7f4;
      border-color: #ddb9ae;
    }

    .legend {
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border: 1.5px solid #111;
      border-radius: 50%;
      background: var(--active);
      flex: 0 0 auto;
    }

    .swatch.square {
      border-radius: 2px;
      background: #fff;
    }

    .swatch.skip {
      border-color: var(--terra);
      border-style: dashed;
      background: #fff;
    }

    .panel-letter {
      font-size: 50px;
      font-weight: 500;
      fill: #050505;
    }

    .caption {
      font-size: 29px;
      fill: #050505;
    }

    .math {
      font-family: Cambria, Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .math.bold {
      font-weight: 700;
      font-style: normal;
    }

    .cell-label {
      font-family: Cambria, Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 23px;
      dominant-baseline: middle;
      text-anchor: middle;
      pointer-events: none;
    }

    .weight-label {
      font-family: Cambria, Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 22px;
      dominant-baseline: middle;
      text-anchor: middle;
      pointer-events: none;
    }

    .output-hit,
    .input-hit {
      cursor: pointer;
    }

    .relation-line {
      stroke: var(--terra);
      stroke-width: 2.1;
      stroke-linecap: round;
      opacity: 0.58;
    }

    .sum-line {
      stroke: var(--terra);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-dasharray: 8 8;
      opacity: 0.58;
    }

    .symbol-line {
      stroke: var(--terra);
      stroke-width: 1.7;
      stroke-linecap: round;
      fill: none;
    }

    .focus-panel {
      fill: none;
      stroke: rgba(119, 200, 195, 0.9);
      stroke-width: 3;
      rx: 10;
    }

    @media (max-width: 980px) {
      body {
        display: block;
      }

      main {
        padding: 10px;
      }

      .figure-frame {
        min-height: 440px;
      }

      aside {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid #d3dadd;
      }
    }

    @media (max-width: 620px) {
      .figure-frame {
        aspect-ratio: 1 / 1.45;
      }

      aside {
        padding: 14px;
      }

      .readout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="figure-frame">
      <svg id="conv-svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Four panel interactive 2D convolution diagram</title>
        <desc id="svg-desc">Input X, 3 by 3 kernel Omega, and hidden layer H1 are drawn as perspective grids. Dragging the highlighted receptive field or clicking output cells updates the active convolution patch.</desc>
      </svg>
    </div>
  </main>

  <aside>
    <div>
      <h1>2D convolution window</h1>
      <p class="subtle">Drag over panel a input cells, click an H<sub>1</sub> cell, or animate the scan.</p>
    </div>

    <div class="control">
      <div class="control-row">
        <label for="stride">Stride</label>
        <span class="pill" id="stride-value">1</span>
      </div>
      <input id="stride" type="range" min="1" max="3" step="1" value="1">
    </div>

    <button id="animate" type="button" aria-pressed="false">Animate Window</button>

    <div class="readout" aria-live="polite">
      <div>Output grid<strong id="out-size">4 x 6</strong></div>
      <div>Active cell<strong id="active-cell">h23</strong></div>
      <div>Kernel center<strong id="center-cell">x23</strong></div>
      <div>Padding terms<strong id="pad-count">0</strong></div>
    </div>

    <section class="calc" aria-live="polite">
      <h2 id="calc-title">Dot product for h<sub>23</sub></h2>
      <div class="equation" id="equation"></div>
      <div class="term-grid" id="term-grid"></div>
    </section>

    <div class="legend">
      <div class="legend-row"><span class="swatch"></span><span>Active receptive field and output.</span></div>
      <div class="legend-row"><span class="swatch square"></span><span>Fixed 3 x 3 weights &Omega;.</span></div>
      <div class="legend-row"><span class="swatch skip"></span><span>Skipped centers when stride is larger than 1.</span></div>
    </div>
  </aside>

  <script>
    (function () {
      "use strict";

      const svg = document.getElementById("conv-svg");
      const strideInput = document.getElementById("stride");
      const strideValue = document.getElementById("stride-value");
      const animateButton = document.getElementById("animate");
      const outSize = document.getElementById("out-size");
      const activeCell = document.getElementById("active-cell");
      const centerCell = document.getElementById("center-cell");
      const padCount = document.getElementById("pad-count");
      const calcTitle = document.getElementById("calc-title");
      const equation = document.getElementById("equation");
      const termGrid = document.getElementById("term-grid");
      const NS = "http://www.w3.org/2000/svg";

      const rows = 4;
      const cols = 6;
      const kernel = 3;
      const pad = 1;
      const iso = {
        col: { x: 34, y: -17 },
        row: { x: -26, y: 35 }
      };
      const weightBasis = {
        col: { x: 44, y: -17 },
        row: { x: 0, y: 42 }
      };
      const panelBoxes = [
        { id: "a", x: 18, y: 20, w: 760, h: 500 },
        { id: "b", x: 820, y: 20, w: 760, h: 500 },
        { id: "c", x: 18, y: 560, w: 760, h: 500 },
        { id: "d", x: 820, y: 560, w: 760, h: 500 }
      ];

      let stride = 1;
      let active = { r: 2, c: 3 };
      let dragging = false;
      let timer = null;

      function el(name, attrs, text) {
        const node = document.createElementNS(NS, name);
        for (const key in attrs || {}) {
          if (Object.prototype.hasOwnProperty.call(attrs, key)) {
            node.setAttribute(key, attrs[key]);
          }
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function add(parent, name, attrs, text) {
        const node = el(name, attrs, text);
        parent.appendChild(node);
        return node;
      }

      function outputShape() {
        return {
          r: Math.floor((rows + 2 * pad - kernel) / stride) + 1,
          c: Math.floor((cols + 2 * pad - kernel) / stride) + 1
        };
      }

      function clampActive() {
        const shape = outputShape();
        active.r = Math.max(1, Math.min(shape.r, active.r));
        active.c = Math.max(1, Math.min(shape.c, active.c));
      }

      function centerFor(outR, outC) {
        return {
          r: 1 + (outR - 1) * stride,
          c: 1 + (outC - 1) * stride
        };
      }

      function project(origin, r, c) {
        return {
          x: origin.x + (c - 1) * iso.col.x + (r - 1) * iso.row.x,
          y: origin.y + (c - 1) * iso.col.y + (r - 1) * iso.row.y
        };
      }

      function weightPoint(origin, r, c) {
        const p = {
          x: origin.x + (c - 1) * weightBasis.col.x + (r - 1) * weightBasis.row.x,
          y: origin.y + (c - 1) * weightBasis.col.y + (r - 1) * weightBasis.row.y
        };
        return {
          x: p.x + (weightBasis.col.x + weightBasis.row.x) / 2,
          y: p.y + (weightBasis.col.y + weightBasis.row.y) / 2
        };
      }

      function patchCells(outR, outC) {
        const center = centerFor(outR, outC);
        const cells = [];
        for (let kr = 1; kr <= 3; kr += 1) {
          for (let kc = 1; kc <= 3; kc += 1) {
            const r = center.r + kr - 2;
            const c = center.c + kc - 2;
            cells.push({
              r: r,
              c: c,
              kr: kr,
              kc: kc,
              inside: r >= 1 && r <= rows && c >= 1 && c <= cols
            });
          }
        }
        return cells;
      }

      function labelX(r, c) {
        return "x" + r + c;
      }

      function labelH(r, c) {
        return "h" + r + c;
      }

      function labelOmega(r, c) {
        return "\u03c9" + r + c;
      }

      function sub(label) {
        return label.charAt(0) + "<sub>" + label.slice(1) + "</sub>";
      }

      function panelLayout(box) {
        return {
          input: { x: box.x + 128, y: box.y + 110 },
          weight: { x: box.x + 315, y: box.y + 170 },
          output: { x: box.x + 545, y: box.y + 292 }
        };
      }

      function defaultPanels() {
        const shape = outputShape();
        const candidates = [
          active,
          { r: Math.min(shape.r, Math.max(1, 3)), c: Math.min(shape.c, Math.max(1, 5)) },
          { r: Math.min(shape.r, Math.max(1, 3)), c: 1 },
          { r: 1, c: shape.c }
        ];
        return candidates.map(function (candidate) {
          return {
            r: Math.max(1, Math.min(shape.r, candidate.r)),
            c: Math.max(1, Math.min(shape.c, candidate.c))
          };
        });
      }

      function drawCircledOperator(group, cx, cy, kind) {
        add(group, "circle", {
          cx: cx,
          cy: cy,
          r: 14,
          fill: "none",
          stroke: "var(--terra)",
          "stroke-width": 1.4
        });
        if (kind === "times") {
          add(group, "line", { x1: cx - 8, y1: cy - 8, x2: cx + 8, y2: cy + 8, class: "symbol-line" });
          add(group, "line", { x1: cx + 8, y1: cy - 8, x2: cx - 8, y2: cy + 8, class: "symbol-line" });
        } else {
          add(group, "line", { x1: cx - 9, y1: cy, x2: cx + 9, y2: cy, class: "symbol-line" });
          add(group, "line", { x1: cx, y1: cy - 9, x2: cx, y2: cy + 9, class: "symbol-line" });
        }
      }

      function drawPanel(box, panelIndex, state) {
        const group = add(svg, "g", { "data-panel": panelIndex });
        const layout = panelLayout(box);
        const shape = outputShape();
        const patches = patchCells(state.r, state.c);
        const patchKey = {};
        patches.forEach(function (cell) {
          if (cell.inside) {
            patchKey[cell.r + "," + cell.c] = true;
          }
        });

        if (panelIndex === 0) {
          add(group, "rect", {
            x: box.x + 2,
            y: box.y + 3,
            width: box.w - 8,
            height: box.h - 12,
            class: "focus-panel"
          });
        }

        add(group, "text", { x: box.x - 10, y: box.y + 18, class: "panel-letter" }, box.id + ")");

        drawRelations(group, layout, patches, state);
        drawInput(group, layout.input, patchKey, patches, panelIndex);
        drawWeight(group, layout.weight);
        drawOutput(group, layout.output, shape, state, panelIndex);
        drawCircledOperator(group, box.x + 333, box.y + 102, "times");
        drawCircledOperator(group, box.x + 486, box.y + 242, "plus");

        add(group, "text", { x: box.x + 2, y: box.y + 318, class: "caption" }, "Input, ");
        add(group, "text", { x: box.x + 90, y: box.y + 318, class: "caption math bold" }, "X");
        add(group, "text", { x: box.x + 218, y: box.y + 350, class: "caption" }, "Weights, ");
        add(group, "text", { x: box.x + 344, y: box.y + 350, class: "caption math bold" }, "\u03a9");
        add(group, "text", { x: box.x + 430, y: box.y + 466, class: "caption" }, "Hidden layer, ");
        add(group, "text", { x: box.x + 610, y: box.y + 466, class: "caption math bold" }, "H");
        add(group, "text", { x: box.x + 631, y: box.y + 474, class: "caption math bold", "font-size": "18" }, "1");
      }

      function drawRelations(group, layout, patches, state) {
        const activeOutPoint = project(layout.output, state.r, state.c);
        patches.forEach(function (cell) {
          const start = project(layout.input, cell.r, cell.c);
          const end = weightPoint(layout.weight, cell.kr, cell.kc);
          add(group, "line", {
            x1: start.x,
            y1: start.y,
            x2: end.x,
            y2: end.y,
            class: "relation-line"
          });
        });
        const wMid = weightPoint(layout.weight, 2, 3);
        add(group, "line", {
          x1: wMid.x + 20,
          y1: wMid.y + 8,
          x2: activeOutPoint.x - 20,
          y2: activeOutPoint.y - 4,
          class: "sum-line"
        });
      }

      function drawInput(group, origin, patchKey, patches, panelIndex) {
        const centerRows = {};
        const centerCols = {};
        const shape = outputShape();
        for (let r = 1; r <= shape.r; r += 1) centerRows[centerFor(r, 1).r] = true;
        for (let c = 1; c <= shape.c; c += 1) centerCols[centerFor(1, c).c] = true;

        for (let r = 1; r <= rows; r += 1) {
          for (let c = 1; c <= cols; c += 1) {
            const p = project(origin, r, c);
            const activePatch = !!patchKey[r + "," + c];
            const skipped = panelIndex === 0 && stride > 1 && !(centerRows[r] && centerCols[c]);
            add(group, "circle", {
              cx: p.x,
              cy: p.y,
              r: 22,
              fill: activePatch ? "var(--active)" : "#fff",
              stroke: skipped ? "var(--terra)" : "#111",
              "stroke-width": activePatch ? 2.2 : 1.9,
              "stroke-dasharray": skipped && !activePatch ? "5 4" : "none",
              class: panelIndex === 0 ? "input-hit" : "",
              "data-input-panel": panelIndex,
              "data-input-r": r,
              "data-input-c": c
            });
          }
        }

        for (let r = 1; r <= rows; r += 1) {
          for (let c = 1; c <= cols; c += 1) {
            const p = project(origin, r, c);
            const activePatch = !!patchKey[r + "," + c];
            add(group, "text", {
              x: p.x,
              y: p.y + 1,
              class: "cell-label",
              fill: activePatch ? "#111" : "var(--faint)"
            }, labelX(r, c));
          }
        }

        const zeroKeys = {};
        patches.forEach(function (cell) {
          if (!cell.inside) {
            const key = cell.r + "," + cell.c;
            if (!zeroKeys[key]) {
              zeroKeys[key] = true;
              const p = project(origin, cell.r, cell.c);
              add(group, "text", {
                x: p.x,
                y: p.y + 2,
                class: "cell-label",
                fill: "#111"
              }, "0");
            }
          }
        });
      }

      function drawWeight(group, origin) {
        for (let r = 1; r <= 3; r += 1) {
          for (let c = 1; c <= 3; c += 1) {
            const p = {
              x: origin.x + (c - 1) * weightBasis.col.x + (r - 1) * weightBasis.row.x,
              y: origin.y + (c - 1) * weightBasis.col.y + (r - 1) * weightBasis.row.y
            };
            const p2 = { x: p.x + weightBasis.col.x, y: p.y + weightBasis.col.y };
            const p3 = { x: p2.x + weightBasis.row.x, y: p2.y + weightBasis.row.y };
            const p4 = { x: p.x + weightBasis.row.x, y: p.y + weightBasis.row.y };
            add(group, "polygon", {
              points: [p, p2, p3, p4].map(function (q) { return q.x + "," + q.y; }).join(" "),
              fill: "#fff",
              stroke: "#111",
              "stroke-width": 1.8
            });
            const center = weightPoint(origin, r, c);
            add(group, "text", {
              x: center.x,
              y: center.y + 1,
              class: "weight-label",
              fill: "#111"
            }, labelOmega(r, c));
          }
        }
      }

      function drawOutput(group, origin, shape, state, panelIndex) {
        for (let r = 1; r <= shape.r; r += 1) {
          for (let c = 1; c <= shape.c; c += 1) {
            const p = project(origin, r, c);
            const activeOut = r === state.r && c === state.c;
            add(group, "circle", {
              cx: p.x,
              cy: p.y,
              r: 22,
              fill: activeOut ? "var(--active)" : "#fff",
              stroke: activeOut ? "#111" : "var(--line)",
              "stroke-width": activeOut ? 2.2 : 1.9,
              class: "output-hit",
              "data-output-panel": panelIndex,
              "data-out-r": r,
              "data-out-c": c
            });
            if (activeOut) {
              add(group, "circle", {
                cx: p.x + 10,
                cy: p.y - 10,
                r: 5,
                fill: "var(--active-strong)",
                stroke: "none",
                "pointer-events": "none"
              });
            }
          }
        }
        for (let r = 1; r <= shape.r; r += 1) {
          for (let c = 1; c <= shape.c; c += 1) {
            const p = project(origin, r, c);
            const activeOut = r === state.r && c === state.c;
            add(group, "text", {
              x: p.x,
              y: p.y + 1,
              class: "cell-label",
              fill: activeOut ? "#111" : "var(--faint)"
            }, labelH(r, c));
          }
        }
      }

      function render() {
        clampActive();
        while (svg.firstChild) {
          svg.removeChild(svg.firstChild);
        }
        add(svg, "title", { id: "svg-title" }, "Four panel interactive 2D convolution diagram");
        add(svg, "desc", { id: "svg-desc" }, "Input X, kernel Omega, and hidden layer H1 are drawn as perspective grids.");
        const panels = defaultPanels();
        panelBoxes.forEach(function (box, index) {
          drawPanel(box, index, panels[index]);
        });
        updateReadout();
      }

      function updateReadout() {
        const shape = outputShape();
        const center = centerFor(active.r, active.c);
        const patches = patchCells(active.r, active.c);
        const padding = patches.filter(function (cell) { return !cell.inside; }).length;
        const terms = patches.map(function (cell) {
          if (cell.inside) {
            return {
              html: sub(labelX(cell.r, cell.c)) + " &times; " + sub(labelOmega(cell.kr, cell.kc)),
              zero: false
            };
          }
          return {
            html: "0 &times; " + sub(labelOmega(cell.kr, cell.kc)),
            zero: true
          };
        });

        strideValue.textContent = String(stride);
        outSize.textContent = shape.r + " x " + shape.c;
        activeCell.textContent = labelH(active.r, active.c);
        centerCell.textContent = labelX(center.r, center.c);
        padCount.textContent = String(padding);
        calcTitle.innerHTML = "Dot product for " + sub(labelH(active.r, active.c));
        equation.innerHTML = sub(labelH(active.r, active.c)) + " = " + terms.map(function (term) {
          return term.html;
        }).join(" + ");
        termGrid.innerHTML = "";
        terms.forEach(function (term) {
          const div = document.createElement("div");
          div.className = "term" + (term.zero ? " zero" : "");
          div.innerHTML = term.html;
          termGrid.appendChild(div);
        });
      }

      function allOutputs() {
        const shape = outputShape();
        const list = [];
        for (let r = 1; r <= shape.r; r += 1) {
          for (let c = 1; c <= shape.c; c += 1) {
            list.push({ r: r, c: c });
          }
        }
        return list;
      }

      function setActive(outR, outC) {
        const shape = outputShape();
        active = {
          r: Math.max(1, Math.min(shape.r, outR)),
          c: Math.max(1, Math.min(shape.c, outC))
        };
        render();
      }

      function nearestOutputFromPoint(point) {
        const origin = panelLayout(panelBoxes[0]).input;
        const candidates = allOutputs();
        let best = candidates[0];
        let bestDist = Infinity;
        candidates.forEach(function (candidate) {
          const center = centerFor(candidate.r, candidate.c);
          const p = project(origin, center.r, center.c);
          const d = Math.pow(point.x - p.x, 2) + Math.pow(point.y - p.y, 2);
          if (d < bestDist) {
            bestDist = d;
            best = candidate;
          }
        });
        return best;
      }

      function nearestOutputInPanel(point, panelIndex) {
        const origin = panelLayout(panelBoxes[panelIndex]).output;
        const candidates = allOutputs();
        let best = candidates[0];
        let bestDist = Infinity;
        candidates.forEach(function (candidate) {
          const p = project(origin, candidate.r, candidate.c);
          const d = Math.pow(point.x - p.x, 2) + Math.pow(point.y - p.y, 2);
          if (d < bestDist) {
            bestDist = d;
            best = candidate;
          }
        });
        return best;
      }

      function svgPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function startAnimation() {
        if (timer) return;
        animateButton.setAttribute("aria-pressed", "true");
        const scan = allOutputs();
        let index = scan.findIndex(function (item) {
          return item.r === active.r && item.c === active.c;
        });
        timer = window.setInterval(function () {
          index = (index + 1) % scan.length;
          active = { r: scan[index].r, c: scan[index].c };
          render();
        }, 620);
      }

      function stopAnimation() {
        if (!timer) return;
        window.clearInterval(timer);
        timer = null;
        animateButton.setAttribute("aria-pressed", "false");
      }

      strideInput.addEventListener("input", function () {
        stride = Number(strideInput.value);
        stopAnimation();
        clampActive();
        render();
      });

      animateButton.addEventListener("click", function () {
        if (timer) {
          stopAnimation();
        } else {
          startAnimation();
        }
      });

      svg.addEventListener("pointerdown", function (evt) {
        const target = evt.target;
        if (target && target.classList && target.classList.contains("output-hit")) {
          stopAnimation();
          const panelIndex = Number(target.getAttribute("data-output-panel"));
          const nearest = nearestOutputInPanel(svgPoint(evt), panelIndex);
          setActive(nearest.r, nearest.c);
          return;
        }
        if (target && target.classList && target.classList.contains("input-hit") && target.getAttribute("data-input-panel") === "0") {
          stopAnimation();
          dragging = true;
          svg.setPointerCapture(evt.pointerId);
          const nearest = nearestOutputFromPoint(svgPoint(evt));
          setActive(nearest.r, nearest.c);
        }
      });

      svg.addEventListener("pointermove", function (evt) {
        if (!dragging) return;
        const nearest = nearestOutputFromPoint(svgPoint(evt));
        if (nearest.r !== active.r || nearest.c !== active.c) {
          setActive(nearest.r, nearest.c);
        }
      });

      svg.addEventListener("pointerup", function (evt) {
        dragging = false;
        try {
          svg.releasePointerCapture(evt.pointerId);
        } catch (error) {
          return;
        }
      });

      svg.addEventListener("pointercancel", function () {
        dragging = false;
      });

      render();
    }());
  </script>
</body>
</html>
