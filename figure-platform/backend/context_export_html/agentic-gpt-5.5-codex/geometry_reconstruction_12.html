<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      grid-area: stage;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
    }

    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="figTooltip"></div>
  <div id="ui">
    <button id="btnReset" style="display:none">Reset View</button>
    <button id="btnProjToggle" style="display:none">3D view</button>
    <!-- @FIGURE_UI_BEGIN -->
    <label>Depth z <span id="zRead">4.40</span>
      <input id="depthSlider" type="range" min="3.10" max="5.35" step="0.01" value="4.40" />
    </label>
    <label>Rotation R yaw <span id="yawRead">0&deg;</span>
      <input id="yawSlider" type="range" min="-32" max="32" step="1" value="0" />
    </label>
    <label>Rotation R pitch <span id="pitchRead">0&deg;</span>
      <input id="pitchSlider" type="range" min="-18" max="18" step="1" value="0" />
    </label>
    <label>Translation T<sub>x</sub> <span id="txRead">0.20</span>
      <input id="txSlider" type="range" min="-0.25" max="0.75" step="0.01" value="0.20" />
    </label>
    <label>Translation T<sub>z</sub> <span id="tzRead">-0.40</span>
      <input id="tzSlider" type="range" min="-0.95" max="0.15" step="0.01" value="-0.40" />
    </label>
    <label>Translation T<sub>y</sub> <span id="tyRead">0.00</span>
      <input id="tySlider" type="range" min="-0.35" max="0.35" step="0.01" value="0.00" />
    </label>
    <!-- @FIGURE_UI_END -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">Reload</button>
  </div>

  <script>
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = e.message || 'Figure failed to load';
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const _stage = document.getElementById('stage');
    const _ui = document.getElementById('ui');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    function setUiLayout() {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      const next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', `${sizePx}px`);
    }

    function _autoUiLayout() {
      const hasEditor = Boolean(_ui.querySelector('textarea'));
      const mode = 'right';
      const start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    function _growDockToFit(mode, startPx) {
      const cap = Math.round(window.innerWidth * 0.45);
      let size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', `${size}px`);
      let guard = 0;
      const step = () => {
        if (guard++ > 6) return;
        if (_ui.scrollHeight <= _ui.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', `${size}px`);
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    new MutationObserver(() => {
      clearTimeout(_autoUiLayout._t);
      _autoUiLayout._t = setTimeout(_autoUiLayout, 0);
    }).observe(_ui, { childList: true, subtree: true });
    window.addEventListener('resize', () => { _autoUiLayout(); });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const d = 3;
    let aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
    let camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
    camera.position.set(4, 3.5, 4.5);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const _labels = [];
    const _interactives = [];
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _tooltip = document.getElementById('figTooltip');

    function addLabel(htmlString, position, options = {}) {
      const el = document.createElement('div');
      el.className = `lbl ${options.className || ''}`.trim();
      el.innerHTML = htmlString;
      if (options.fontSize) el.style.fontSize = options.fontSize;
      if (options.fontFamily) el.style.fontFamily = options.fontFamily;
      if (options.fontWeight) el.style.fontWeight = options.fontWeight;
      if (options.color) el.style.color = options.color;
      if (options.lineHeight) el.style.lineHeight = options.lineHeight;
      if (options.textShadow != null) el.style.textShadow = options.textShadow;
      _stage.appendChild(el);
      const label = {
        el,
        position,
        offsetX: options.offsetX || 0,
        offsetY: options.offsetY || 0,
      };
      _labels.push(label);
      return label;
    }

    function _syncLabels() {
      const w = canvas.clientWidth || 1;
      const h = canvas.clientHeight || 1;
      for (const label of _labels) {
        const p = label.position.clone().project(camera);
        const hidden = p.z < -1 || p.z > 1;
        label.el.style.display = hidden ? 'none' : 'block';
        label.el.style.left = `${(p.x * 0.5 + 0.5) * w + label.offsetX}px`;
        label.el.style.top = `${(-p.y * 0.5 + 0.5) * h + label.offsetY}px`;
      }
    }

    function showTooltip(title, body, x = 0, y = 0) {
      _tooltip.innerHTML = `<strong>${title}</strong>${body ? `<br>${body}` : ''}`;
      _tooltip.style.left = `${x + 12}px`;
      _tooltip.style.top = `${y + 12}px`;
      _tooltip.style.display = 'block';
    }

    function hideTooltip() {
      _tooltip.style.display = 'none';
    }

    function showPopup(title, body) {
      showTooltip(title, body, window.innerWidth * 0.5, window.innerHeight * 0.5);
    }

    function hidePopup() {
      hideTooltip();
    }

    function registerInteractive(object, info = {}) {
      object.userData.interactive = info;
      _interactives.push(object);
    }

    renderer.domElement.addEventListener('pointermove', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      _raycaster.setFromCamera(_pointer, camera);
      const hit = _raycaster.intersectObjects(_interactives, true)[0];
      if (hit) {
        const info = hit.object.userData.interactive || hit.object.parent?.userData.interactive || {};
        showTooltip(info.title || 'Geometry', info.tooltip || info.body || '', event.clientX, event.clientY);
      } else {
        hideTooltip();
      }
    });
    renderer.domElement.addEventListener('pointerleave', hideTooltip);

    function resizeRendererToDisplaySize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const needResize = canvas.width !== Math.round(width * renderer.getPixelRatio()) ||
        canvas.height !== Math.round(height * renderer.getPixelRatio());
      if (needResize) {
        renderer.setSize(width, height, false);
        aspect = width / Math.max(1, height);
        if (camera.isOrthographicCamera) {
          camera.left = -d * aspect;
          camera.right = d * aspect;
          camera.top = d;
          camera.bottom = -d;
          camera.updateProjectionMatrix();
        }
      }
    }

    function setCameraView(opts = {}) {
      camera.position.set(4.0, 3.15, 4.35);
      camera.up.set(0, 1, 0);
      controls.target.copy(opts.target || new THREE.Vector3(0.0, -0.15, -0.35));
      camera.lookAt(controls.target);
      camera.zoom = opts.heightFraction ? 0.74 / opts.heightFraction : 1.02;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function setStandardView() {
      setCameraView({ projection: 'orthographic', axisScreenAngles: { x: 30, z: 30 }, heightFraction: 0.72 });
    }

    function _disposeObject(object) {
      object.geometry?.dispose?.();
      if (Array.isArray(object.material)) {
        object.material.forEach((m) => m.dispose?.());
      } else {
        object.material?.dispose?.();
      }
    }

    function compileExpr(src, vars) {
      if (!window.exprEval?.Parser) throw new Error('Expression parser unavailable');
      const parser = new window.exprEval.Parser();
      const expr = parser.parse(src);
      return (...args) => {
        const scope = {};
        vars.forEach((name, i) => { scope[name] = args[i]; });
        return expr.evaluate(scope);
      };
    }

    function bindEquationInput() {}
    function plotCurve3D() {}
    function plotParametric3D() {}
    function plotSurface() {}

    function animate() {
      resizeRendererToDisplaySize();
      controls.update();
      _syncLabels();
      renderer.render(scene, camera);
      window.__markRendered?.();
      requestAnimationFrame(animate);
    }

    /* generated figure payload */
    // @FIGURE_CODE_BEGIN
    // target image plane -> LineLoop rectangle, translucent Mesh plane, black outline
    // reference image plane -> LineLoop rectangle, translucent Mesh plane, black outline
    // camera centers -> SphereGeometry black
    // target image point p -> SphereGeometry red on target plane
    // reference image point p' -> SphereGeometry red on reference plane
    // reconstructed point P -> SphereGeometry red above the planes
    // back-projection ray P = zK^-1p -> dashed Line plus grey TubeGeometry arrow
    // transform P' = MP -> small grey circular TubeGeometry arrow around P
    // reprojection p' = KP -> dashed Line plus grey TubeGeometry arrow to reference plane
    // relative pose R,T -> large grey QuadraticBezierCurve3 TubeGeometry arrow between cameras
    // projection helper lines -> thin black Line segments from cameras to image points

    const black = 0x080808;
    const grey = 0x9b9b9b;
    const red = 0xd91010;
    const planeFill = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.18,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const planeLineMat = new THREE.LineBasicMaterial({ color: black });
    const thinMat = new THREE.LineBasicMaterial({ color: black });
    const dashMat = new THREE.LineDashedMaterial({ color: black, dashSize: 0.13, gapSize: 0.08 });
    const arrowMat = new THREE.MeshBasicMaterial({ color: grey });
    const redMat = new THREE.MeshBasicMaterial({ color: red });
    const camMat = new THREE.MeshBasicMaterial({ color: black });

    const C2 = new THREE.Vector3(-1.95, -1.65, 0.75);
    const C1 = new THREE.Vector3(0.45, -1.75, 0.90);
    const pTarget = new THREE.Vector3(-1.10, -0.55, 0.00);
    const rayDir = pTarget.clone().sub(C2).normalize();
    const refPlaneZ = 0.00;
    const refPlane = {
      center: new THREE.Vector3(1.02, -0.64, refPlaneZ),
      width: 1.18,
      height: 1.34,
    };
    const targetPlane = {
      center: new THREE.Vector3(-1.18, -0.82, 0.00),
      width: 1.08,
      height: 1.34,
    };

    const state = {
      z: 4.4,
      yaw: 0,
      pitch: 0,
      tx: 0.2,
      ty: 0,
      tz: -0.4,
    };

    function makePlaneFrame(plane, label) {
      const group = new THREE.Group();
      const hw = plane.width / 2;
      const hh = plane.height / 2;
      const corners = [
        new THREE.Vector3(-hw, -hh, 0),
        new THREE.Vector3(hw, -hh, 0),
        new THREE.Vector3(hw, hh, 0),
        new THREE.Vector3(-hw, hh, 0),
      ];
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(plane.width, plane.height), planeFill.clone());
      group.add(mesh);
      const outline = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(corners),
        planeLineMat.clone(),
      );
      outline.material.linewidth = 3;
      group.add(outline);
      group.position.copy(plane.center);
      group.userData.label = label;
      scene.add(group);
      registerInteractive(group, {
        title: label,
        tooltip: label === 'Target frame' ? 'The fixed image point p defines a ray; depth z selects P along it.' : 'The transformed point projects to p prime on this reference image.',
      });
      return group;
    }

    const targetPlaneGroup = makePlaneFrame(targetPlane, 'Target frame');
    const refPlaneGroup = makePlaneFrame(refPlane, 'Reference frame');

    function makeSphere(radius, mat, pos) {
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), mat);
      sphere.position.copy(pos);
      scene.add(sphere);
      return sphere;
    }

    const targetCamera = makeSphere(0.07, camMat, C2);
    const refCamera = makeSphere(0.07, camMat, C1);
    const pSphere = makeSphere(0.085, redMat, pTarget);
    const pPrimeSphere = makeSphere(0.085, redMat, new THREE.Vector3());
    const PSphere = makeSphere(0.095, redMat, new THREE.Vector3());
    [targetCamera, refCamera, pSphere, pPrimeSphere, PSphere].forEach((obj) => {
      obj.renderOrder = 5;
    });

    registerInteractive(PSphere, {
      title: '3D point P',
      tooltip: 'Depth z moves this point along the back-projected ray P = zK^-1p.',
    });
    registerInteractive(pSphere, {
      title: 'Image point p',
      tooltip: 'This target-frame point remains fixed while z changes the 3D point along its ray.',
    });
    registerInteractive(pPrimeSphere, {
      title: "Image point p'",
      tooltip: "The reference correspondence updates from the current R, T, and depth.",
    });

    function makeLine(material) {
      const line = new THREE.Line(new THREE.BufferGeometry(), material);
      scene.add(line);
      return line;
    }

    const targetSight = makeLine(dashMat.clone());
    const refSight = makeLine(dashMat.clone());
    const targetShort = makeLine(thinMat.clone());
    const refShort = makeLine(thinMat.clone());

    function setLine(line, pts) {
      line.geometry.dispose();
      line.geometry = new THREE.BufferGeometry().setFromPoints(pts);
      if (line.material.isLineDashedMaterial) line.computeLineDistances();
    }

    function makeArrowGroup() {
      const group = new THREE.Group();
      const tube = new THREE.Mesh(new THREE.BufferGeometry(), arrowMat.clone());
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 32), arrowMat.clone());
      group.add(tube, head);
      scene.add(group);
      return { group, tube, head };
    }

    const backArrow = makeArrowGroup();
    const projectArrow = makeArrowGroup();
    const bottomArrow = makeArrowGroup();
    const topLoop = makeArrowGroup();

    function updateArrow(arrow, curve, radius = 0.018) {
      const old = arrow.tube.geometry;
      arrow.tube.geometry = new THREE.TubeGeometry(curve, 48, radius, 10, false);
      old.dispose();
      const end = curve.getPoint(1);
      const almost = curve.getPoint(0.94);
      const tangent = end.clone().sub(almost).normalize();
      arrow.head.position.copy(end).sub(tangent.clone().multiplyScalar(0.08));
      arrow.head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
    }

    function updateLoopArrow(arrow, center) {
      const pts = [];
      const r = 0.36;
      for (let i = 0; i <= 42; i++) {
        const a = THREE.MathUtils.degToRad(-205 + i * 300 / 42);
        pts.push(new THREE.Vector3(
          center.x + Math.cos(a) * r,
          center.y + 0.05 + Math.sin(a) * r,
          center.z - 0.03,
        ));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      updateArrow(arrow, curve, 0.016);
    }

    const bottomCurve = new THREE.QuadraticBezierCurve3(
      C2.clone().add(new THREE.Vector3(0.10, -0.16, -0.04)),
      new THREE.Vector3(-0.55, -2.55, -0.22),
      C1.clone().add(new THREE.Vector3(-0.05, -0.06, -0.05)),
    );
    updateArrow(bottomArrow, bottomCurve, 0.018);

    const P = new THREE.Vector3();
    const PPrime = new THREE.Vector3();
    const pPrime = new THREE.Vector3();
    const labelAnchors = {
      p: pTarget.clone().add(new THREE.Vector3(-0.07, 0.24, 0.01)),
      pPrime: pPrime.clone(),
      P: P.clone(),
      eqBack: new THREE.Vector3(-0.32, 0.90, -0.54),
      eqTransform: PPrime.clone(),
      eqProject: new THREE.Vector3(1.68, -0.03, -0.06),
      targetFrame: new THREE.Vector3(-1.82, -2.28, 0.05),
      refFrame: new THREE.Vector3(1.35, -2.28, 0.05),
      rt: new THREE.Vector3(-0.52, -2.50, -0.18),
      l2: new THREE.Vector3(-0.86, -1.18, 0.03),
      l1: new THREE.Vector3(1.42, -1.10, 0.03),
    };

    function makeLabel(html, anchor, fontSize, offsetX = 0, offsetY = 0, weight = '700') {
      return addLabel(html, anchor, {
        fontSize,
        fontFamily: 'Times New Roman, Times, serif',
        fontWeight: weight,
        offsetX,
        offsetY,
        textShadow: '0 1px 2px #fff',
      });
    }

    makeLabel('P', labelAnchors.P, '34px', -34, -20);
    makeLabel('p', labelAnchors.p, '32px', -10, -20);
    makeLabel("p'", labelAnchors.pPrime, '32px', 24, 30);
    makeLabel('P=zK<sup>-1</sup>p', labelAnchors.eqBack, '31px', -8, -6);
    makeLabel("P'=MP", labelAnchors.eqTransform, '31px', 84, 12);
    makeLabel("p'=KP", labelAnchors.eqProject, '31px', 20, -18);
    makeLabel('R, T', labelAnchors.rt, '35px', 0, 18);
    makeLabel('&ell;<sub>2</sub>', labelAnchors.l2, '34px', 20, 0);
    makeLabel('&ell;<sub>1</sub>', labelAnchors.l1, '34px', 18, 2);
    makeLabel('Target frame', labelAnchors.targetFrame, '38px', -15, 8, '400');
    makeLabel('Reference frame', labelAnchors.refFrame, '38px', 30, 8, '400');

    const controlsEls = {
      depth: document.getElementById('depthSlider'),
      yaw: document.getElementById('yawSlider'),
      pitch: document.getElementById('pitchSlider'),
      tx: document.getElementById('txSlider'),
      ty: document.getElementById('tySlider'),
      tz: document.getElementById('tzSlider'),
      zRead: document.getElementById('zRead'),
      yawRead: document.getElementById('yawRead'),
      pitchRead: document.getElementById('pitchRead'),
      txRead: document.getElementById('txRead'),
      tyRead: document.getElementById('tyRead'),
      tzRead: document.getElementById('tzRead'),
    };

    function intersectReferencePlane(from, to) {
      const dz = to.z - from.z;
      const t = Math.abs(dz) < 0.0001 ? 0.5 : (refPlaneZ - from.z) / dz;
      const q = from.clone().lerp(to, THREE.MathUtils.clamp(t, 0.05, 0.94));
      const hw = refPlane.width / 2 - 0.07;
      const hh = refPlane.height / 2 - 0.07;
      q.x = THREE.MathUtils.clamp(q.x, refPlane.center.x - hw, refPlane.center.x + hw);
      q.y = THREE.MathUtils.clamp(q.y, refPlane.center.y - hh, refPlane.center.y + hh);
      q.z = refPlaneZ + 0.012;
      return q;
    }

    function updateFigure() {
      state.z = Number(controlsEls.depth.value);
      state.yaw = THREE.MathUtils.degToRad(Number(controlsEls.yaw.value));
      state.pitch = THREE.MathUtils.degToRad(Number(controlsEls.pitch.value));
      state.tx = Number(controlsEls.tx.value);
      state.ty = Number(controlsEls.ty.value);
      state.tz = Number(controlsEls.tz.value);

      controlsEls.zRead.textContent = state.z.toFixed(2);
      controlsEls.yawRead.textContent = `${Number(controlsEls.yaw.value)}deg`;
      controlsEls.pitchRead.textContent = `${Number(controlsEls.pitch.value)}deg`;
      controlsEls.txRead.textContent = state.tx.toFixed(2);
      controlsEls.tyRead.textContent = state.ty.toFixed(2);
      controlsEls.tzRead.textContent = state.tz.toFixed(2);

      P.copy(C2).add(rayDir.clone().multiplyScalar(state.z));
      const rot = new THREE.Euler(state.pitch, state.yaw, 0, 'YXZ');
      PPrime.copy(P).applyEuler(rot).add(new THREE.Vector3(state.tx, state.ty, state.tz));
      pPrime.copy(intersectReferencePlane(C1, PPrime));

      PSphere.position.copy(PPrime);
      pPrimeSphere.position.copy(pPrime);

      setLine(targetSight, [C2, P]);
      setLine(refSight, [C1, PPrime]);
      setLine(targetShort, [C2, pTarget]);
      setLine(refShort, [C1, pPrime]);

      const backMid = pTarget.clone().lerp(P, 0.54).add(new THREE.Vector3(-0.18, 0.24, -0.10));
      updateArrow(backArrow, new THREE.QuadraticBezierCurve3(pTarget, backMid, P), 0.018);

      const projMid = PPrime.clone().lerp(pPrime, 0.50).add(new THREE.Vector3(0.22, 0.02, 0.04));
      updateArrow(projectArrow, new THREE.QuadraticBezierCurve3(PPrime, projMid, pPrime), 0.018);
      updateLoopArrow(topLoop, PPrime.clone().add(new THREE.Vector3(0.14, 0.26, 0.02)));

      labelAnchors.P.copy(PPrime).add(new THREE.Vector3(-0.03, 0.16, 0));
      labelAnchors.pPrime.copy(pPrime).add(new THREE.Vector3(0.02, -0.04, 0.01));
      labelAnchors.eqTransform.copy(PPrime).add(new THREE.Vector3(0.33, -0.04, 0));
      labelAnchors.eqBack.copy(pTarget).lerp(P, 0.58).add(new THREE.Vector3(-0.22, 0.16, -0.05));
      labelAnchors.eqProject.copy(PPrime).lerp(pPrime, 0.55).add(new THREE.Vector3(0.42, 0.05, 0.02));
    }

    for (const key of ['depth', 'yaw', 'pitch', 'tx', 'ty', 'tz']) {
      controlsEls[key].addEventListener('input', updateFigure);
    }

    const resetButton = document.getElementById('btnReset');
    resetButton.style.display = 'block';
    resetButton.addEventListener('click', () => {
      controlsEls.depth.value = '4.40';
      controlsEls.yaw.value = '0';
      controlsEls.pitch.value = '0';
      controlsEls.tx.value = '0.20';
      controlsEls.ty.value = '0.00';
      controlsEls.tz.value = '-0.40';
      updateFigure();
      setStandardView();
    });

    updateFigure();
    setCameraView({ projection: 'orthographic', axisScreenAngles: { x: 30, z: 30 }, heightFraction: 0.72, target: new THREE.Vector3(-0.05, -0.22, -0.32) });
    // @FIGURE_CODE_END

    _autoUiLayout();
    animate();
  </script>
</body>

</html>
