<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure 5.2.6</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) min(var(--ui-size, 310px), 45vw);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
      font-family: sans-serif;
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      grid-area: stage;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: "Times New Roman", Times, serif;
      font-size: 24px;
      line-height: 1;
      color: #111;
      text-align: center;
    }

    .lbl.small {
      font-size: 18px;
    }

    .lbl.tiny {
      font-size: 14px;
      font-family: sans-serif;
    }

    .lbl.callout {
      width: 96px;
      white-space: normal;
      font-size: 22px;
      line-height: 1.12;
      font-family: sans-serif;
    }

    #ui {
      position: relative;
      grid-area: ui;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      box-sizing: border-box;
      font-family: sans-serif;
      font-size: 12px;
      background: #fbfbfc;
      border-left: 1px solid #dcdfe3;
      overflow: auto;
      z-index: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #ui input[type=range] {
      width: 100%;
    }

    .readout {
      padding: 7px 8px;
      border: 1px solid #d8dce2;
      border-radius: 4px;
      background: #fff;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .readout strong {
      font-weight: 650;
    }

    .swatch-line {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(0, 0, 0, 0.22);
    }

    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }

    @media (max-width: 640px) {
      #stage {
        padding: 8px;
      }

      #ui {
        padding: 9px 8px;
        font-size: 11px;
      }

      .lbl {
        font-size: 14px;
      }

      .lbl.small {
        font-size: 11px;
      }

      .lbl.tiny {
        font-size: 10px;
      }

      .lbl.callout {
        width: 58px;
        font-size: 13px;
        line-height: 1.08;
      }
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="figTooltip"></div>
  <div id="ui">
    <button id="btnReset" style="display:none">Reset View</button>
    <button id="btnProjToggle" style="display:none">3D view</button>
    <!-- @FIGURE_UI_BEGIN -->
    <label>
      <span>Number of slabs: <strong id="nValue">8</strong></span>
      <input id="nSlider" type="range" min="3" max="24" step="1" value="8" />
    </label>
    <label>
      <span>Zoomed slab: <strong id="kValue">3</strong></span>
      <input id="kSlider" type="range" min="1" max="8" step="1" value="3" />
    </label>
    <div class="readout" id="sumReadout"></div>
    <div class="readout" id="sliceReadout"></div>
    <div class="readout">
      <div class="swatch-line"><span class="swatch" style="background:#f9cfc6"></span><span>Partitioned solid S</span></div>
      <div class="swatch-line"><span class="swatch" style="background:#8dc6e9"></span><span>Selected slab S<sub>k</sub></span></div>
    </div>
    <!-- @FIGURE_UI_END -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">Reload</button>
  </div>

  <script>
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = e.message || 'Figure failed to load';
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(() => {
      if (!_rendered) _errOverlay.style.display = 'flex';
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const _stage = document.getElementById('stage');
    const _ui = document.getElementById('ui');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0xffffff, 1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.OrthographicCamera(-4, 4, 3, -3, -100, 100);
    camera.position.set(0, 0, 14);
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableRotate = false;
    controls.enablePan = true;
    controls.minZoom = 0.55;
    controls.maxZoom = 3.0;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const _labels = [];
    const interactives = [];
    const tooltip = document.getElementById('figTooltip');
    let oblique = { active: false, shearX: 0.36, shearY: 0.36, heightFraction: 0.74 };

    function setUiLayout() {}

    function addLabel(htmlString, position, options = {}) {
      const el = document.createElement('div');
      el.className = `lbl ${options.className || ''}`.trim();
      el.innerHTML = htmlString;
      _stage.appendChild(el);
      const item = {
        el,
        position: position.clone ? position.clone() : new THREE.Vector3(position.x, position.y, position.z),
        offset: options.offset || { x: 0, y: 0 },
      };
      _labels.push(item);
      _syncLabels();
      return el;
    }

    function removeFigureLabels() {
      while (_labels.length) {
        const item = _labels.pop();
        item.el.remove();
      }
    }

    function _syncLabels() {
      const rect = canvas.getBoundingClientRect();
      for (const item of _labels) {
        const p = item.position.clone().project(camera);
        const visible = Number.isFinite(p.x) && Number.isFinite(p.y) && p.z > -1.1 && p.z < 1.1;
        item.el.style.display = visible ? 'block' : 'none';
        if (!visible) continue;
        item.el.style.left = `${(p.x * 0.5 + 0.5) * rect.width + (item.offset.x || 0)}px`;
        item.el.style.top = `${(-p.y * 0.5 + 0.5) * rect.height + (item.offset.y || 0)}px`;
      }
    }

    function registerInteractive(object, data) {
      object.userData.interactive = data;
      interactives.push(object);
      return object;
    }

    function showTooltip(text, event) {
      if (!text) return;
      tooltip.textContent = text;
      tooltip.style.display = 'block';
      tooltip.style.transform = `translate(${event.clientX + 12}px, ${event.clientY + 12}px)`;
    }

    function hideTooltip() {
      tooltip.style.display = 'none';
    }

    function showPopup(title, body) {
      showTooltip(`${title}: ${body}`, { clientX: window.innerWidth * 0.5, clientY: 20 });
    }

    function hidePopup() {
      hideTooltip();
    }

    function setCameraView(options = {}) {
      const projection = options.projection || 'orthographic';
      oblique.active = projection === 'oblique';
      const angle = THREE.MathUtils.degToRad(options.obliqueAngleDeg ?? 45);
      const scale = options.depthScale ?? 0.5;
      oblique.shearX = Math.cos(angle) * scale;
      oblique.shearY = Math.sin(angle) * scale;
      oblique.heightFraction = options.heightFraction ?? 0.74;
      camera.position.set(0, 0, 14);
      camera.up.set(0, 1, 0);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      fitCameraToScene();
    }

    function makeObliqueProjection() {
      camera.updateProjectionMatrix();
      if (!oblique.active) return;
      const e = camera.projectionMatrix.elements;
      e[8] = e[0] * oblique.shearX;
      e[9] = e[5] * oblique.shearY;
    }

    function projectedBounds() {
      camera.updateMatrixWorld(true);
      const inv = camera.matrixWorldInverse;
      const box = new THREE.Box3().setFromObject(figureRoot);
      if (box.isEmpty()) return null;
      const pts = [
        new THREE.Vector3(box.min.x, box.min.y, box.min.z),
        new THREE.Vector3(box.min.x, box.min.y, box.max.z),
        new THREE.Vector3(box.min.x, box.max.y, box.min.z),
        new THREE.Vector3(box.min.x, box.max.y, box.max.z),
        new THREE.Vector3(box.max.x, box.min.y, box.min.z),
        new THREE.Vector3(box.max.x, box.min.y, box.max.z),
        new THREE.Vector3(box.max.x, box.max.y, box.min.z),
        new THREE.Vector3(box.max.x, box.max.y, box.max.z),
      ];
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of pts) {
        p.applyMatrix4(inv);
        const x = p.x + (oblique.active ? oblique.shearX * p.z : 0);
        const y = p.y + (oblique.active ? oblique.shearY * p.z : 0);
        minX = Math.min(minX, x);
        maxX = Math.max(maxX, x);
        minY = Math.min(minY, y);
        maxY = Math.max(maxY, y);
      }
      return { minX, maxX, minY, maxY };
    }

    function fitCameraToScene() {
      const rect = _stage.getBoundingClientRect();
      const aspect = Math.max(0.2, rect.width / Math.max(1, rect.height));
      const b = projectedBounds();
      if (!b) return;
      const width = Math.max(1, b.maxX - b.minX);
      const height = Math.max(1, b.maxY - b.minY);
      let viewHeight = height / oblique.heightFraction;
      let viewWidth = viewHeight * aspect;
      if (viewWidth < width / oblique.heightFraction) {
        viewWidth = width / oblique.heightFraction;
        viewHeight = viewWidth / aspect;
      }
      const cx = (b.minX + b.maxX) * 0.5;
      const cy = (b.minY + b.maxY) * 0.5;
      camera.left = cx - viewWidth * 0.5;
      camera.right = cx + viewWidth * 0.5;
      camera.top = cy + viewHeight * 0.5;
      camera.bottom = cy - viewHeight * 0.5;
      makeObliqueProjection();
      _syncLabels();
    }

    function resizeRendererToDisplaySize() {
      const rect = _stage.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      const needResize = canvas.width !== Math.floor(width * renderer.getPixelRatio()) ||
        canvas.height !== Math.floor(height * renderer.getPixelRatio());
      if (needResize) {
        renderer.setSize(width, height, false);
        fitCameraToScene();
      }
    }

    function disposeTree(object) {
      object.traverse((child) => {
        child.geometry?.dispose?.();
        if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose?.());
        else child.material?.dispose?.();
      });
      object.clear();
    }

    function material(color, opacity = 1, depthWrite = true) {
      return new THREE.MeshBasicMaterial({
        color,
        transparent: opacity < 1,
        opacity,
        side: THREE.DoubleSide,
        depthWrite,
      });
    }

    function lineMaterial(color, opacity = 1) {
      return new THREE.LineBasicMaterial({
        color,
        transparent: opacity < 1,
        opacity,
      });
    }

    function makeLine(points, color = 0x111111, opacity = 1) {
      const geom = new THREE.BufferGeometry().setFromPoints(points);
      return new THREE.Line(geom, lineMaterial(color, opacity));
    }

    function makePolyline(points, color = 0x111111, opacity = 1) {
      return makeLine(points, color, opacity);
    }

    function makeArrow(start, end, color = 0x111111, radius = 0.035) {
      const group = new THREE.Group();
      group.add(makeLine([start, end], color));
      const dir = end.clone().sub(start).normalize();
      const cone = new THREE.Mesh(new THREE.ConeGeometry(radius, radius * 3.2, 24), material(color));
      cone.position.copy(end);
      const q = new THREE.Quaternion();
      q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      cone.quaternion.copy(q);
      group.add(cone);
      return group;
    }

    function makeDimensionArrow(start, end, color = 0x111111) {
      const group = new THREE.Group();
      group.add(makeLine([start, end], color));
      const dir = end.clone().sub(start).normalize();
      for (const [pos, sign] of [[start, 1], [end, -1]]) {
        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.09, 18), material(color));
        cone.position.copy(pos);
        const q = new THREE.Quaternion();
        q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().multiplyScalar(sign));
        cone.quaternion.copy(q);
        group.add(cone);
      }
      return group;
    }

    function slabGeometry(x0, x1, h0, h1, depth) {
      const vertices = new Float32Array([
        x0, 0, 0, x1, 0, 0, x1, h1, 0, x0, h0, 0,
        x0, 0, depth, x1, 0, depth, x1, h1, depth, x0, h0, depth,
      ]);
      const indices = [
        0, 1, 2, 0, 2, 3,
        4, 6, 5, 4, 7, 6,
        0, 5, 1, 0, 4, 5,
        3, 2, 6, 3, 6, 7,
        0, 3, 7, 0, 7, 4,
        1, 5, 6, 1, 6, 2,
      ];
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      geom.computeBoundingBox();
      geom.computeBoundingSphere();
      return geom;
    }

    function addEdges(mesh, color = 0xef4d55, opacity = 1) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 18);
      const lines = new THREE.LineSegments(edges, lineMaterial(color, opacity));
      mesh.add(lines);
      return lines;
    }

    function crossAreaAt(t) {
      return heightAt(t) * solidDepth;
    }

    function heightAt(t) {
      const s = Math.max(0, Math.min(1, t));
      return 0.48 + 0.56 * Math.sin(0.24 * Math.PI + 0.68 * Math.PI * s) + 0.22 * s;
    }

    function riemannSum(n) {
      let sum = 0;
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n;
        sum += crossAreaAt(t) * (domainLength / n);
      }
      return sum;
    }

    function trueVolume() {
      const samples = 800;
      let area = 0;
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const weight = i === 0 || i === samples ? 0.5 : 1;
        area += weight * crossAreaAt(t);
      }
      return area * domainLength / samples;
    }

    // @FIGURE_CODE_BEGIN
    // solid slabs -> custom transparent hexahedron meshes with red/black edge lines
    // highlighted slab -> same slab geometry in blue with selectable interaction
    // left partition planes -> Line rectangles at x_i cross sections
    // right zoom slab -> enlarged prism mesh with black x_k* section rectangle
    // axes and dimension marks -> Line objects plus ConeGeometry arrowheads
    // curved connector -> TubeGeometry along QuadraticBezierCurve3 with cone arrowhead
    // callout balloon -> ShapeGeometry with grey outline and HTML label
    // labels -> addLabel anchored to Three.Vector3 positions

    const figureRoot = new THREE.Group();
    const leftRoot = new THREE.Group();
    const rightRoot = new THREE.Group();
    const arrowRoot = new THREE.Group();
    const calloutRoot = new THREE.Group();
    scene.add(figureRoot);
    figureRoot.add(leftRoot, rightRoot, arrowRoot, calloutRoot);

    const leftOffset = new THREE.Vector3(-3.05, -0.88, 0);
    const rightOffset = new THREE.Vector3(1.22, -0.88, 0);
    const domainLength = 2.72;
    const solidDepth = 0.58;
    const selectedColor = 0x8dc6e9;
    const pinkColor = 0xf9cfc6;
    const redLine = 0xff4d5b;
    const greyLine = 0x777777;
    let n = 8;
    let k = 3;
    let draggingZoom = false;
    let dragStartX = 0;
    let dragStartK = 1;
    const volumeExact = trueVolume();

    const nSlider = document.getElementById('nSlider');
    const kSlider = document.getElementById('kSlider');
    const nValue = document.getElementById('nValue');
    const kValue = document.getElementById('kValue');
    const sumReadout = document.getElementById('sumReadout');
    const sliceReadout = document.getElementById('sliceReadout');

    function localXFromIndex(i, nValue) {
      return (i / nValue) * domainLength;
    }

    function addPartitionLabels() {
      addLabel('<i>S</i>', leftOffset.clone().add(new THREE.Vector3(1.58, 1.42, 0.18)));
      addLabel('<i>S</i><sub>1</sub>', leftOffset.clone().add(new THREE.Vector3(0.25, 0.24, -0.01)), { className: 'small' });
      addLabel('<i>S</i><sub>2</sub>', leftOffset.clone().add(new THREE.Vector3(0.58, 0.33, -0.01)), { className: 'small' });
      addLabel('<i>S</i><sub>n</sub>', leftOffset.clone().add(new THREE.Vector3(2.2, 0.58, -0.01)), { className: 'small' });
      addLabel('<i>a</i>', leftOffset.clone().add(new THREE.Vector3(0, -0.18, 0)), { className: 'small' });
      addLabel('<i>x</i><sub>1</sub>', leftOffset.clone().add(new THREE.Vector3(localXFromIndex(1, n), -0.18, 0)), { className: 'small' });
      addLabel('<i>x</i><sub>2</sub>', leftOffset.clone().add(new THREE.Vector3(localXFromIndex(2, n), -0.18, 0)), { className: 'small' });
      addLabel('. . .', leftOffset.clone().add(new THREE.Vector3(domainLength * 0.58, -0.16, 0)), { className: 'small' });
      addLabel('<i>x</i><sub>n-1</sub>', leftOffset.clone().add(new THREE.Vector3(domainLength - domainLength / n, -0.18, 0)), { className: 'small' });
      addLabel('<i>b</i>', leftOffset.clone().add(new THREE.Vector3(domainLength, -0.18, 0)), { className: 'small' });
    }

    function buildLeftSolid() {
      disposeTree(leftRoot);
      const dx = domainLength / n;
      for (let i = 0; i < n; i++) {
        const x0 = localXFromIndex(i, n);
        const x1 = localXFromIndex(i + 1, n);
        const h0 = heightAt(i / n);
        const h1 = heightAt((i + 1) / n);
        const isSelected = i + 1 === k;
        const mesh = new THREE.Mesh(
          slabGeometry(x0, x1, h0, h1, solidDepth),
          material(isSelected ? selectedColor : pinkColor, isSelected ? 0.76 : 0.46, false)
        );
        mesh.position.copy(leftOffset);
        mesh.renderOrder = isSelected ? 2 : 1;
        addEdges(mesh, isSelected ? 0x2e89bf : redLine, isSelected ? 0.95 : 0.78);
        registerInteractive(mesh, {
          tooltip: `Click to zoom slab S${i + 1}.`,
          selectIndex: i + 1,
        });
        leftRoot.add(mesh);

        const xi = x0;
        const hi = h0;
        const planeLine = makePolyline([
          leftOffset.clone().add(new THREE.Vector3(xi, 0, 0)),
          leftOffset.clone().add(new THREE.Vector3(xi, hi, 0)),
          leftOffset.clone().add(new THREE.Vector3(xi, hi, solidDepth)),
          leftOffset.clone().add(new THREE.Vector3(xi, 0, solidDepth)),
        ], i === 0 ? redLine : 0x222222, i === 0 ? 0.95 : 0.74);
        leftRoot.add(planeLine);
      }
      const endH = heightAt(1);
      leftRoot.add(makePolyline([
        leftOffset.clone().add(new THREE.Vector3(domainLength, 0, 0)),
        leftOffset.clone().add(new THREE.Vector3(domainLength, endH, 0)),
        leftOffset.clone().add(new THREE.Vector3(domainLength, endH, solidDepth)),
        leftOffset.clone().add(new THREE.Vector3(domainLength, 0, solidDepth)),
      ], redLine, 0.95));

      const frontTop = [];
      const backTop = [];
      for (let j = 0; j <= 80; j++) {
        const t = j / 80;
        frontTop.push(leftOffset.clone().add(new THREE.Vector3(t * domainLength, heightAt(t), 0)));
        backTop.push(leftOffset.clone().add(new THREE.Vector3(t * domainLength, heightAt(t), solidDepth)));
      }
      leftRoot.add(makePolyline(frontTop, redLine, 1));
      leftRoot.add(makePolyline(backTop, 0x222222, 0.85));
      leftRoot.add(makeArrow(
        leftOffset.clone().add(new THREE.Vector3(-0.48, 0, 0)),
        leftOffset.clone().add(new THREE.Vector3(domainLength + 0.55, 0, 0)),
        0x111111,
        0.035
      ));
    }

    function buildRightZoom() {
      disposeTree(rightRoot);
      const t0 = (k - 1) / n;
      const t1 = k / n;
      const tm = (k - 0.5) / n;
      const h = heightAt(tm) * 1.18;
      const w = 0.82;
      const depth = 0.78;
      const x0 = 0;
      const x1 = w;
      const dxWorld = domainLength / n;
      const geom = slabGeometry(x0, x1, h, h, depth);
      const prism = new THREE.Mesh(geom, material(selectedColor, 0.72, false));
      prism.position.copy(rightOffset);
      addEdges(prism, 0x6f8f9f, 0.9);
      registerInteractive(prism, { tooltip: 'Drag this zoomed slab to choose a different S_k.', dragZoom: true });
      rightRoot.add(prism);

      const sideTint = new THREE.Mesh(slabGeometry(x1 - 0.02, x1, h, h, depth), material(0x62a9cf, 0.5, false));
      sideTint.position.copy(rightOffset);
      rightRoot.add(sideTint);

      const sectionX = w * 0.23;
      const section = makePolyline([
        rightOffset.clone().add(new THREE.Vector3(sectionX, 0, 0)),
        rightOffset.clone().add(new THREE.Vector3(sectionX, h, 0)),
        rightOffset.clone().add(new THREE.Vector3(sectionX, h, depth)),
        rightOffset.clone().add(new THREE.Vector3(sectionX, 0, depth)),
        rightOffset.clone().add(new THREE.Vector3(sectionX, 0, 0)),
      ], 0x111111, 1);
      section.material.linewidth = 3;
      rightRoot.add(section);

      rightRoot.add(makeArrow(
        rightOffset.clone().add(new THREE.Vector3(-1.05, 0, 0)),
        rightOffset.clone().add(new THREE.Vector3(1.18, 0, 0)),
        0x111111,
        0.036
      ));
      rightRoot.add(makeLine([
        rightOffset.clone().add(new THREE.Vector3(0, -0.02, 0)),
        rightOffset.clone().add(new THREE.Vector3(0, -0.58, 0)),
      ], 0x111111));
      rightRoot.add(makeLine([
        rightOffset.clone().add(new THREE.Vector3(w, -0.02, 0)),
        rightOffset.clone().add(new THREE.Vector3(w, -0.58, 0)),
      ], 0x111111));
      rightRoot.add(makeDimensionArrow(
        rightOffset.clone().add(new THREE.Vector3(-0.02, -0.48, 0)),
        rightOffset.clone().add(new THREE.Vector3(w + 0.02, -0.48, 0)),
        0x111111
      ));
      rightRoot.add(makeLine([
        rightOffset.clone().add(new THREE.Vector3(sectionX, -0.02, 0)),
        rightOffset.clone().add(new THREE.Vector3(sectionX, -0.36, 0)),
      ], 0x111111));

      addLabel('<i>S</i><sub>k</sub>', rightOffset.clone().add(new THREE.Vector3(w + 0.18, 0.52 * h, depth * 0.48)), { className: 'small' });
      addLabel('<i>x</i>', rightOffset.clone().add(new THREE.Vector3(1.12, 0.18, 0)), { className: 'small' });
      addLabel('<i>x</i><sub>k</sub><sup>*</sup>', rightOffset.clone().add(new THREE.Vector3(sectionX, -0.22, 0)), { className: 'small' });
      addLabel('&Delta;<i>x</i><sub>k</sub>', rightOffset.clone().add(new THREE.Vector3(w * 0.5, -0.64, 0)), { className: 'small' });

      const area = crossAreaAt(tm);
      const slabVolume = area * dxWorld;
      sliceReadout.innerHTML =
        `<strong>Selected slice</strong><br>S<sub>k</sub> = S<sub>${k}</sub>, &Delta;x<sub>k</sub> = ${dxWorld.toFixed(3)}<br>` +
        `A(x<sub>k</sub><sup>*</sup>) = ${area.toFixed(3)}<br>volume = ${slabVolume.toFixed(3)}`;
    }

    function buildConnector() {
      disposeTree(arrowRoot);
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(-2.0, -1.35, 0.02),
        new THREE.Vector3(-0.34, -2.05, 0.02),
        new THREE.Vector3(0.58, -0.55, 0.02)
      );
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 48, 0.055, 18, false),
        material(0xf7ddb0, 0.92, false)
      );
      arrowRoot.add(tube);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.48, 3), material(0xf7ddb0, 0.92, false));
      head.position.set(0.58, -0.55, 0.02);
      head.rotation.z = -0.62;
      arrowRoot.add(head);
      arrowRoot.add(makePolyline(curve.getPoints(56), 0xbec1c7, 0.95));
    }

    function buildCallout() {
      disposeTree(calloutRoot);
      const x = 0.26, y = 0.1, w = 0.84, h = 1.92;
      const shape = new THREE.Shape();
      shape.moveTo(x, y);
      shape.lineTo(x + w, y);
      shape.lineTo(x + w, y + 0.35);
      shape.lineTo(x + w + 0.42, y + 0.18);
      shape.lineTo(x + w, y + 0.68);
      shape.lineTo(x + w, y + h);
      shape.lineTo(x, y + h);
      shape.quadraticCurveTo(x - 0.12, y + h, x - 0.12, y + h - 0.12);
      shape.lineTo(x - 0.12, y + 0.12);
      shape.quadraticCurveTo(x - 0.12, y, x, y);
      const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), material(0xffdea1, 0.82, false));
      fill.position.set(0, 0, -0.04);
      calloutRoot.add(fill);
      const pts = shape.getPoints(36).map((p) => new THREE.Vector3(p.x, p.y, -0.035));
      pts.push(pts[0].clone());
      calloutRoot.add(makePolyline(pts, 0xb5b8be, 0.95));
      addLabel('The<br>cross<br>section<br>here<br>has<br>area<br><i>A</i>(<i>x</i><sub>k</sub><sup>*</sup>).',
        new THREE.Vector3(x + 0.34, y + 1.0, -0.02),
        { className: 'callout' });
    }

    function rebuild() {
      n = Number(nSlider.value);
      kSlider.max = String(n);
      k = Math.min(n, Math.max(1, Number(kSlider.value)));
      kSlider.value = String(k);
      nValue.textContent = String(n);
      kValue.textContent = String(k);
      removeFigureLabels();
      interactives.length = 0;
      buildLeftSolid();
      buildRightZoom();
      buildConnector();
      buildCallout();
      addPartitionLabels();
      const approx = riemannSum(n);
      sumReadout.innerHTML =
        `<strong>Riemann sum</strong><br>&Sigma; A(x<sub>k</sub><sup>*</sup>)&Delta;x<sub>k</sub> = ${approx.toFixed(3)}<br>` +
        `Limit volume<br>&int;<sub>a</sub><sup>b</sup>A(x)dx &asymp; ${volumeExact.toFixed(3)}`;
      fitCameraToScene();
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pick(event) {
      setPointer(event);
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObjects(interactives, true)[0] || null;
    }

    canvas.addEventListener('pointerdown', (event) => {
      const hit = pick(event);
      if (!hit) return;
      let obj = hit.object;
      while (obj && !obj.userData.interactive) obj = obj.parent;
      const data = obj?.userData.interactive;
      if (!data) return;
      if (data.selectIndex) {
        kSlider.value = String(data.selectIndex);
        rebuild();
      }
      if (data.dragZoom) {
        draggingZoom = true;
        dragStartX = event.clientX;
        dragStartK = k;
        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = 'grabbing';
      }
    });

    canvas.addEventListener('pointermove', (event) => {
      if (draggingZoom) {
        const delta = Math.round((event.clientX - dragStartX) / 34);
        const next = Math.max(1, Math.min(n, dragStartK + delta));
        if (next !== k) {
          kSlider.value = String(next);
          rebuild();
        }
        return;
      }
      const hit = pick(event);
      if (!hit) {
        hideTooltip();
        canvas.style.cursor = 'default';
        return;
      }
      let obj = hit.object;
      while (obj && !obj.userData.interactive) obj = obj.parent;
      const data = obj?.userData.interactive;
      canvas.style.cursor = data?.dragZoom ? 'grab' : 'pointer';
      showTooltip(data?.tooltip, event);
    });

    window.addEventListener('pointerup', (event) => {
      if (!draggingZoom) return;
      draggingZoom = false;
      try { canvas.releasePointerCapture(event.pointerId); } catch {}
      canvas.style.cursor = 'default';
    });

    nSlider.addEventListener('input', () => {
      const oldN = n;
      n = Number(nSlider.value);
      const proportional = Math.max(1, Math.min(n, Math.round((k - 0.5) / oldN * n + 0.5)));
      kSlider.value = String(proportional);
      rebuild();
    });

    kSlider.addEventListener('input', rebuild);

    setCameraView({ projection: 'oblique', obliqueAngleDeg: 45, depthScale: 0.5, heightFraction: 0.72 });
    rebuild();

    function animate() {
      resizeRendererToDisplaySize();
      controls.update();
      makeObliqueProjection();
      _syncLabels();
      renderer.render(scene, camera);
      if (!window.__figureDidMark) {
        window.__figureDidMark = true;
        window.__markRendered?.();
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      fitCameraToScene();
      _syncLabels();
    });

    animate();
    // @FIGURE_CODE_END
  </script>
</body>

</html>
