<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure 14.4.5</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      grid-area: stage;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      color: #1f1f1f;
      line-height: 1.1;
    }

    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 7px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    #ui input[type=text] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 5px 7px;
      font: 12px/1.3 ui-monospace, Consolas, monospace;
      background: #fff;
    }

    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 230px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
      min-height: 0.9em;
    }

    .readout {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #333;
      font-size: 11px;
    }

    .swatch {
      display: inline-block;
      width: 0.8em;
      height: 0.8em;
      border-radius: 50%;
      margin-right: 4px;
      transform: translateY(1px);
    }

    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }

    #err-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 13px;
      color: #555;
      gap: 10px;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="figTooltip"></div>
  <div id="ui">
    <button id="btnReset" style="display:none">Reset View</button>
    <button id="btnProjToggle" style="display:none">3D view</button>
    <!-- @FIGURE_UI_BEGIN -->
    <label>
      <span>x(u,v)</span>
      <input id="eqX" type="text" value="v" autocomplete="off" spellcheck="false" />
      <span id="eqX-err" class="eq-err"></span>
    </label>
    <label>
      <span>y(u,v)</span>
      <input id="eqY" type="text" value="u" autocomplete="off" spellcheck="false" />
      <span id="eqY-err" class="eq-err"></span>
    </label>
    <label>
      <span>z(u,v)</span>
      <input id="eqZ" type="text" value="0.25*u^2 - 0.16*v^2 + 0.12*u*v" autocomplete="off" spellcheck="false" />
      <span id="eqZ-err" class="eq-err"></span>
    </label>
    <label>
      <span><span class="swatch" style="background:#f39a18"></span>u constant</span>
      <input id="uSlider" type="range" min="-1.2" max="1.2" step="0.01" value="-0.10" />
      <span class="readout"><span>u</span><span id="uValue"></span></span>
    </label>
    <label>
      <span><span class="swatch" style="background:#b85ab5"></span>v constant</span>
      <input id="vSlider" type="range" min="-1.2" max="1.2" step="0.01" value="0.18" />
      <span class="readout"><span>v</span><span id="vValue"></span></span>
    </label>
    <button id="resetEquations">Reset Equations</button>
    <!-- @FIGURE_UI_END -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <div id="err-overlay">
    <span id="err-msg">Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">Reload</button>
  </div>

  <script>
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => {
      _rendered = true;
      document.body.dataset.rendered = 'true';
      _errOverlay.style.display = 'none';
    };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = e.message || 'Figure failed to load';
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(() => {
      if (!_rendered) _errOverlay.style.display = 'flex';
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const _stage = document.getElementById('stage');
    const _ui = document.getElementById('ui');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    function setUiLayout() {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      document.body.setAttribute('data-ui-layout', 'right');
      if (sizePx) document.body.style.setProperty('--ui-size', `${sizePx}px`);
    }

    function _autoUiLayout() {
      const start = _ui.querySelector('textarea') ? 400 : 300;
      const cap = Math.round(window.innerWidth * 0.45);
      _applyUiLayout('right', Math.min(start, cap));
    }

    new MutationObserver(() => {
      clearTimeout(_autoUiLayout._t);
      _autoUiLayout._t = setTimeout(_autoUiLayout, 0);
    }).observe(_ui, { childList: true, subtree: true });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const d = 3;
    let aspect = Math.max(1, canvas.clientWidth) / Math.max(1, canvas.clientHeight);
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
    camera.position.set(4.2, 3.1, 5.4);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.target.set(0, 0, 0);

    const ambient = new THREE.AmbientLight(0xffffff, 0.78);
    scene.add(ambient);
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
    keyLight.position.set(2.4, 4.3, 3.8);
    scene.add(keyLight);

    const _labels = [];

    function addLabel(htmlString, position, options = {}) {
      const el = document.createElement('div');
      el.className = 'lbl';
      el.innerHTML = htmlString;
      if (options.className) el.classList.add(options.className);
      if (options.fontSize) el.style.fontSize = `${options.fontSize}px`;
      if (options.color) el.style.color = options.color;
      if (options.align === 'left') el.style.transform = 'translate(0, -50%)';
      if (options.align === 'right') el.style.transform = 'translate(-100%, -50%)';
      _stage.appendChild(el);
      const label = { el, position: position.clone(), visible: true };
      _labels.push(label);
      return label;
    }

    function _syncLabels() {
      const rect = canvas.getBoundingClientRect();
      for (const label of _labels) {
        const p = label.position.clone().project(camera);
        const visible = label.visible !== false && p.z >= -1 && p.z <= 1;
        label.el.style.display = visible ? 'block' : 'none';
        if (!visible) continue;
        label.el.style.left = `${(p.x * 0.5 + 0.5) * rect.width}px`;
        label.el.style.top = `${(-p.y * 0.5 + 0.5) * rect.height}px`;
      }
    }

    function _disposeObject(obj) {
      obj.traverse?.((child) => {
        child.geometry?.dispose?.();
        const mat = child.material;
        if (Array.isArray(mat)) mat.forEach((m) => m.dispose?.());
        else mat?.dispose?.();
      });
    }

    function clearGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        _disposeObject(child);
      }
    }

    function compileExpr(src, vars) {
      const parser = new exprEval.Parser();
      const expr = parser.parse(src);
      return (...args) => {
        const scope = {};
        vars.forEach((name, i) => { scope[name] = args[i]; });
        return expr.evaluate(scope);
      };
    }

    function bindEquationInput(inputId, targets, { variables, onChange } = {}) {
      const input = document.getElementById(inputId);
      const err = document.getElementById(`${inputId}-err`);
      const targetList = Array.isArray(targets) ? targets : [targets];
      const apply = () => {
        try {
          const fn = compileExpr(input.value, variables || ['u', 'v']);
          for (const target of targetList) {
            if (target?.handle && target?.method) target.handle[target.method](fn, input.value);
            else if (target?.setExpr) target.setExpr(fn, input.value);
          }
          if (err) err.textContent = '';
          onChange?.(fn, input.value);
        } catch (e) {
          if (err) err.textContent = e.message || 'Invalid expression';
        }
      };
      input.addEventListener('input', apply);
      apply();
      return apply;
    }

    function setCameraView(opts = {}) {
      const heightFraction = opts.heightFraction ?? 0.74;
      const target = opts.target ? new THREE.Vector3(...opts.target) : new THREE.Vector3(0, 0, 0);
      const direction = new THREE.Vector3(4.2, 3.1, 5.4).normalize();
      camera.position.copy(target).add(direction.multiplyScalar(opts.distanceScale ?? 9));
      camera.up.set(0, 1, 0);
      camera.lookAt(target);
      controls.target.copy(target);
      controls.update();

      const box = new THREE.Box3().setFromObject(figureRoot);
      if (!box.isEmpty()) {
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);
        camera.position.copy(center).add(new THREE.Vector3(4.2, 3.1, 5.4).normalize().multiplyScalar(9));
        camera.lookAt(center);
        camera.updateMatrixWorld(true);
        const inv = camera.matrixWorldInverse;
        const pts = [
          new THREE.Vector3(box.min.x, box.min.y, box.min.z),
          new THREE.Vector3(box.min.x, box.min.y, box.max.z),
          new THREE.Vector3(box.min.x, box.max.y, box.min.z),
          new THREE.Vector3(box.min.x, box.max.y, box.max.z),
          new THREE.Vector3(box.max.x, box.min.y, box.min.z),
          new THREE.Vector3(box.max.x, box.min.y, box.max.z),
          new THREE.Vector3(box.max.x, box.max.y, box.min.z),
          new THREE.Vector3(box.max.x, box.max.y, box.max.z),
        ].map((p) => p.applyMatrix4(inv));
        const min = new THREE.Vector3(Infinity, Infinity, Infinity);
        const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
        pts.forEach((p) => { min.min(p); max.max(p); });
        const spanX = Math.max(0.001, max.x - min.x);
        const spanY = Math.max(0.001, max.y - min.y);
        const halfH = Math.max(spanY / (2 * heightFraction), spanX / (2 * aspect * heightFraction));
        camera.left = -halfH * aspect;
        camera.right = halfH * aspect;
        camera.top = halfH;
        camera.bottom = -halfH;
      }
      camera.near = 0.1;
      camera.far = 100;
      camera.updateProjectionMatrix();
    }

    function registerInteractive() {}
    function showPopup() {}
    function hidePopup() {}
    function showTooltip() {}
    function hideTooltip() {}
    function setStandardView() {
      setCameraView({ projection: 'orthographic', axisScreenAngles: { x: 30, z: 30 }, heightFraction: 0.72 });
    }

    const figureRoot = new THREE.Group();
    scene.add(figureRoot);

    function resizeRenderer() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const needsResize = canvas.width !== Math.floor(width * renderer.getPixelRatio()) ||
        canvas.height !== Math.floor(height * renderer.getPixelRatio());
      if (needsResize) renderer.setSize(width, height, false);
      aspect = width / height;
      setCameraView({ projection: 'orthographic', axisScreenAngles: { x: 30, z: 30 }, heightFraction: 0.72 });
    }

    new ResizeObserver(() => {
      _autoUiLayout();
      resizeRenderer();
    }).observe(_stage);

    // @FIGURE_CODE_BEGIN
    // uv axes -> Line segments plus ConeGeometry arrowheads, black
    // uv constant lines -> TubeGeometry in camera-parallel uv panel, orange and purple
    // mapping arrow -> curved BufferGeometry ribbon with triangular head, pale yellow with gray outline
    // xyz axes -> Line segments plus ConeGeometry arrowheads, black
    // parametric surface -> sampled BufferGeometry mesh, translucent gray
    // surface coordinate net -> Line curves sampled from the same x(u,v), y(u,v), z(u,v)
    // highlighted constant curves -> TubeGeometry sampled from fixed u or fixed v, orange and purple

    const ORANGE = 0xf39a18;
    const PURPLE = 0xb85ab5;
    const GRID = 0x8d8f93;
    const AXIS = 0x1f1f1f;
    const U_MIN = -1.2;
    const U_MAX = 1.2;
    const V_MIN = -1.2;
    const V_MAX = 1.2;
    const SURFACE_SEGMENTS = 38;
    const CURVE_SAMPLES = 96;

    const surfaceRoot = new THREE.Group();
    surfaceRoot.position.set(1.42, -0.1, 0.04);
    figureRoot.add(surfaceRoot);

    const staticRoot = new THREE.Group();
    figureRoot.add(staticRoot);

    const uvDynamicRoot = new THREE.Group();
    figureRoot.add(uvDynamicRoot);

    const surfaceDynamicRoot = new THREE.Group();
    surfaceRoot.add(surfaceDynamicRoot);

    const paramFns = {
      x: compileExpr('v', ['u', 'v']),
      y: compileExpr('u', ['u', 'v']),
      z: compileExpr('0.25*u^2 - 0.16*v^2 + 0.12*u*v', ['u', 'v'])
    };

    const paramSurfaceHandle = {
      setX(fn) { paramFns.x = fn; rebuildSurface(); },
      setY(fn) { paramFns.y = fn; rebuildSurface(); },
      setZ(fn) { paramFns.z = fn; rebuildSurface(); }
    };

    const uSlider = document.getElementById('uSlider');
    const vSlider = document.getElementById('vSlider');
    const uValue = document.getElementById('uValue');
    const vValue = document.getElementById('vValue');
    const defaults = {
      eqX: 'v',
      eqY: 'u',
      eqZ: '0.25*u^2 - 0.16*v^2 + 0.12*u*v'
    };

    camera.updateMatrixWorld(true);
    const screenRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const screenUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const screenOrigin = new THREE.Vector3(0, 0, 0);

    function screenPoint(x, y, z = 0) {
      return screenOrigin.clone()
        .addScaledVector(screenRight, x)
        .addScaledVector(screenUp, y)
        .addScaledVector(new THREE.Vector3().crossVectors(screenRight, screenUp).normalize(), z);
    }

    function lineObject(points, color, opacity = 1) {
      const geom = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
      return new THREE.Line(geom, mat);
    }

    function tubeObject(points, radius, color, opacity = 1) {
      const curve = new THREE.CatmullRomCurve3(points);
      const geom = new THREE.TubeGeometry(curve, Math.max(8, points.length * 2), radius, 8, false);
      const mat = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, side: THREE.DoubleSide });
      return new THREE.Mesh(geom, mat);
    }

    function arrowObject(start, end, color = AXIS, radius = 0.009, headLength = 0.12, headRadius = 0.045) {
      const group = new THREE.Group();
      const dir = end.clone().sub(start);
      const len = dir.length();
      const unit = dir.clone().normalize();
      const shaftEnd = end.clone().addScaledVector(unit, -headLength * 0.76);
      group.add(lineObject([start, shaftEnd], color));
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(headRadius, headLength, 24),
        new THREE.MeshBasicMaterial({ color })
      );
      cone.position.copy(end).addScaledVector(unit, -headLength * 0.38);
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), unit);
      group.add(cone);
      return group;
    }

    function makeScreenTube(localPts, radius, color, opacity = 1) {
      return tubeObject(localPts.map((p) => screenPoint(p.x, p.y, p.z || 0)), radius, color, opacity);
    }

    function makeScreenLine(localPts, color, opacity = 1) {
      return lineObject(localPts.map((p) => screenPoint(p.x, p.y, p.z || 0)), color, opacity);
    }

    function buildUvPanel() {
      const xAxisY = -0.82;
      const yAxisX = -2.45;
      staticRoot.add(arrowObject(screenPoint(-2.75, xAxisY), screenPoint(-1.0, xAxisY), AXIS, 0.01, 0.13, 0.05));
      staticRoot.add(arrowObject(screenPoint(yAxisX, -1.32), screenPoint(yAxisX, 1.15), AXIS, 0.01, 0.13, 0.05));
      addLabel('<i>u</i>', screenPoint(-0.94, xAxisY + 0.12), { fontSize: 24 });
      addLabel('<i>v</i>', screenPoint(yAxisX + 0.12, 1.24), { fontSize: 24 });
      addLabel('<i>u</i> constant', screenPoint(-1.82, 0.88), { fontSize: 24, align: 'left' });
      addLabel('<i>v</i> constant', screenPoint(-1.25, 0.08), { fontSize: 24, align: 'left' });
    }

    function buildMappingArrow() {
      const p0 = new THREE.Vector2(-0.6, 0.74);
      const p1 = new THREE.Vector2(-0.18, 1.42);
      const p2 = new THREE.Vector2(0.68, 1.2);
      const halfWidth = 0.085;
      const centers = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24;
        const a = p0.clone().multiplyScalar((1 - t) * (1 - t));
        const b = p1.clone().multiplyScalar(2 * (1 - t) * t);
        const c = p2.clone().multiplyScalar(t * t);
        centers.push(a.add(b).add(c));
      }
      const left = [];
      const right = [];
      for (let i = 0; i < centers.length; i++) {
        const prev = centers[Math.max(0, i - 1)];
        const next = centers[Math.min(centers.length - 1, i + 1)];
        const tangent = next.clone().sub(prev).normalize();
        const normal = new THREE.Vector2(-tangent.y, tangent.x);
        left.push(centers[i].clone().addScaledVector(normal, halfWidth));
        right.push(centers[i].clone().addScaledVector(normal, -halfWidth));
      }
      const positions = [];
      const indices = [];
      for (let i = 0; i < centers.length; i++) {
        const lp = screenPoint(left[i].x, left[i].y, -0.08);
        const rp = screenPoint(right[i].x, right[i].y, -0.08);
        positions.push(lp.x, lp.y, lp.z, rp.x, rp.y, rp.z);
        if (i < centers.length - 1) {
          const j = i * 2;
          indices.push(j, j + 1, j + 2, j + 1, j + 3, j + 2);
        }
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      const mesh = new THREE.Mesh(
        geom,
        new THREE.MeshBasicMaterial({ color: 0xffe5ad, transparent: true, opacity: 0.78, side: THREE.DoubleSide })
      );
      staticRoot.add(mesh);
      const end = centers[centers.length - 1];
      const tangent = centers[centers.length - 1].clone().sub(centers[centers.length - 4]).normalize();
      const normal = new THREE.Vector2(-tangent.y, tangent.x);
      const tip = end.clone().addScaledVector(tangent, 0.27);
      const base = end.clone().addScaledVector(tangent, -0.06);
      const headPts = [
        screenPoint(tip.x, tip.y, -0.08),
        screenPoint(base.x + normal.x * 0.24, base.y + normal.y * 0.24, -0.08),
        screenPoint(base.x - normal.x * 0.24, base.y - normal.y * 0.24, -0.08)
      ];
      const headGeom = new THREE.BufferGeometry().setFromPoints(headPts);
      headGeom.setIndex([0, 1, 2]);
      headGeom.computeVertexNormals();
      staticRoot.add(new THREE.Mesh(headGeom, mesh.material.clone()));
      staticRoot.add(makeScreenLine([...left, tip, ...right.reverse(), left[0]].map((p) => ({ x: p.x, y: p.y, z: -0.09 })), 0x9fa2a6, 0.9));
    }

    function safeEval(fn, u, v) {
      try {
        const out = fn(u, v);
        return Number.isFinite(out) ? out : 0;
      } catch {
        return 0;
      }
    }

    function paramPoint(u, v) {
      const x = safeEval(paramFns.x, u, v);
      const y = safeEval(paramFns.y, u, v);
      const z = safeEval(paramFns.z, u, v);
      const s = 0.72;
      return new THREE.Vector3(y * s, z * s + 0.18, -x * s);
    }

    function buildSurfaceMesh() {
      const positions = [];
      const indices = [];
      for (let j = 0; j <= SURFACE_SEGMENTS; j++) {
        const v = V_MIN + (V_MAX - V_MIN) * (j / SURFACE_SEGMENTS);
        for (let i = 0; i <= SURFACE_SEGMENTS; i++) {
          const u = U_MIN + (U_MAX - U_MIN) * (i / SURFACE_SEGMENTS);
          const p = paramPoint(u, v);
          positions.push(p.x, p.y, p.z);
        }
      }
      const row = SURFACE_SEGMENTS + 1;
      for (let j = 0; j < SURFACE_SEGMENTS; j++) {
        for (let i = 0; i < SURFACE_SEGMENTS; i++) {
          const a = j * row + i;
          indices.push(a, a + 1, a + row, a + 1, a + row + 1, a + row);
        }
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        color: 0xd9dcdf,
        roughness: 0.82,
        metalness: 0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.86
      });
      return new THREE.Mesh(geom, mat);
    }

    function sampleUCurve(u, samples = CURVE_SAMPLES) {
      const pts = [];
      for (let i = 0; i < samples; i++) {
        const v = V_MIN + (V_MAX - V_MIN) * (i / (samples - 1));
        pts.push(paramPoint(u, v));
      }
      return pts;
    }

    function sampleVCurve(v, samples = CURVE_SAMPLES) {
      const pts = [];
      for (let i = 0; i < samples; i++) {
        const u = U_MIN + (U_MAX - U_MIN) * (i / (samples - 1));
        pts.push(paramPoint(u, v));
      }
      return pts;
    }

    function buildGridLines() {
      const group = new THREE.Group();
      const values = [-1.2, -0.6, 0, 0.6, 1.2];
      for (const u of values) group.add(lineObject(sampleUCurve(u, 80), GRID, 0.78));
      for (const v of values) group.add(lineObject(sampleVCurve(v, 80), GRID, 0.78));
      return group;
    }

    function buildAxes() {
      const origin = new THREE.Vector3(-1.08, -0.92, 0.92);
      surfaceRoot.add(arrowObject(origin, new THREE.Vector3(-1.08, 1.16, 0.92), AXIS, 0.01, 0.16, 0.055));
      surfaceRoot.add(arrowObject(origin, new THREE.Vector3(1.48, -0.92, 0.92), AXIS, 0.01, 0.16, 0.055));
      surfaceRoot.add(arrowObject(origin, new THREE.Vector3(-1.08, -1.42, 1.72), AXIS, 0.01, 0.16, 0.055));
      addLabel('<i>z</i>', surfaceRoot.localToWorld(new THREE.Vector3(-1.01, 1.29, 0.92)), { fontSize: 24 });
      addLabel('<i>y</i>', surfaceRoot.localToWorld(new THREE.Vector3(1.63, -0.82, 0.92)), { fontSize: 24 });
      addLabel('<i>x</i>', surfaceRoot.localToWorld(new THREE.Vector3(-1.0, -1.55, 1.82)), { fontSize: 24 });
    }

    let uCurveLabel;
    let vCurveLabel;

    function updateUvLines() {
      clearGroup(uvDynamicRoot);
      const u = Number(uSlider.value);
      const v = Number(vSlider.value);
      uValue.textContent = u.toFixed(2);
      vValue.textContent = v.toFixed(2);
      const uX = -2.45 + ((u - U_MIN) / (U_MAX - U_MIN)) * 1.18;
      const vY = -0.82 + ((v - V_MIN) / (V_MAX - V_MIN)) * 1.44;
      uvDynamicRoot.add(makeScreenTube([{ x: uX, y: -1.18 }, { x: uX, y: 1.04 }], 0.012, ORANGE));
      uvDynamicRoot.add(makeScreenTube([{ x: -2.68, y: vY }, { x: -1.26, y: vY }], 0.012, PURPLE));
    }

    function updateCurveLabels() {
      const u = Number(uSlider.value);
      const v = Number(vSlider.value);
      const uPts = sampleUCurve(u, 12);
      const vPts = sampleVCurve(v, 12);
      const uWorld = surfaceRoot.localToWorld(uPts[Math.floor(uPts.length * 0.72)].clone());
      const vWorld = surfaceRoot.localToWorld(vPts[Math.floor(vPts.length * 0.9)].clone());
      uCurveLabel.position.copy(uWorld.addScaledVector(screenUp, 0.34).addScaledVector(screenRight, 0.04));
      vCurveLabel.position.copy(vWorld.addScaledVector(screenRight, 0.56).addScaledVector(screenUp, -0.16));
    }

    function rebuildSurface() {
      clearGroup(surfaceDynamicRoot);
      surfaceDynamicRoot.add(buildSurfaceMesh());
      surfaceDynamicRoot.add(buildGridLines());
      const u = Number(uSlider.value);
      const v = Number(vSlider.value);
      surfaceDynamicRoot.add(tubeObject(sampleUCurve(u), 0.025, ORANGE));
      surfaceDynamicRoot.add(tubeObject(sampleVCurve(v), 0.025, PURPLE));
      if (uCurveLabel && vCurveLabel) updateCurveLabels();
    }

    buildUvPanel();
    buildMappingArrow();
    buildAxes();
    updateUvLines();
    rebuildSurface();

    const uvPlaneAnchor = screenPoint(-2.38, -1.08);
    const surfaceAnchor = surfaceRoot.localToWorld(new THREE.Vector3(0.0, 0.82, 0.0));
    addLabel('', uvPlaneAnchor, { fontSize: 1 });
    uCurveLabel = addLabel('Constant <i>u</i>-curve', surfaceAnchor, { fontSize: 21, align: 'left' });
    vCurveLabel = addLabel('Constant<br><i>v</i>-curve', surfaceRoot.localToWorld(new THREE.Vector3(1.0, 0.12, -0.1)), { fontSize: 21, align: 'left' });
    updateCurveLabels();

    bindEquationInput('eqX', { handle: paramSurfaceHandle, method: 'setX' }, { variables: ['u', 'v'] });
    bindEquationInput('eqY', { handle: paramSurfaceHandle, method: 'setY' }, { variables: ['u', 'v'] });
    bindEquationInput('eqZ', { handle: paramSurfaceHandle, method: 'setZ' }, { variables: ['u', 'v'] });

    uSlider.addEventListener('input', () => {
      updateUvLines();
      rebuildSurface();
    });
    vSlider.addEventListener('input', () => {
      updateUvLines();
      rebuildSurface();
    });

    document.getElementById('resetEquations').addEventListener('click', () => {
      document.getElementById('eqX').value = defaults.eqX;
      document.getElementById('eqY').value = defaults.eqY;
      document.getElementById('eqZ').value = defaults.eqZ;
      paramFns.x = compileExpr(defaults.eqX, ['u', 'v']);
      paramFns.y = compileExpr(defaults.eqY, ['u', 'v']);
      paramFns.z = compileExpr(defaults.eqZ, ['u', 'v']);
      for (const id of ['eqX-err', 'eqY-err', 'eqZ-err']) document.getElementById(id).textContent = '';
      rebuildSurface();
    });

    setCameraView({ projection: 'orthographic', axisScreenAngles: { x: 30, z: 30 }, heightFraction: 0.72 });
    // @FIGURE_CODE_END

    _autoUiLayout();
    resizeRenderer();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      _syncLabels();
      if (!window.__figureMarked) {
        window.__figureMarked = true;
        requestAnimationFrame(() => window.__markRendered?.());
      }
    }

    animate();
  </script>
</body>

</html>
