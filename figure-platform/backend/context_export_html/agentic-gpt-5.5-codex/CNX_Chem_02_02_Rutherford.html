<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      grid-area: stage;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: sans-serif;
      font-size: 13px;
      color: #111;
      line-height: 1.15;
    }

    .figure-label {
      font-size: 16px;
      max-width: 210px;
      white-space: normal;
    }

    .figure-label.center {
      text-align: center;
    }

    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }

    .figure-ui-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .figure-readout {
      border: 1px solid #d5dbe1;
      border-radius: 4px;
      padding: 7px 8px;
      background: #fff;
      line-height: 1.35;
    }

    .figure-key {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 7px;
      align-items: center;
      font-size: 11px;
    }

    .swatch {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      background: #65d900;
    }

    .swatch.thin {
      height: 2px;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="figTooltip"></div>
  <div id="ui">
    <button id="btnReset" style="display:none">Reset View</button>
    <button id="btnProjToggle" style="display:none">3D view</button>
    <!-- @FIGURE_UI_BEGIN -->
    <div class="figure-ui-row">
      <button id="btnAnimate" class="active" type="button">Pause particles</button>
      <button id="btnLabels" class="active" type="button">Labels</button>
    </div>
    <label>
      Gold foil thickness: <span id="thicknessText">3 layers</span>
      <input id="thickness" type="range" min="1" max="5" value="3" step="1" />
    </label>
    <div id="scatterStats" class="figure-readout"></div>
    <div class="figure-key" aria-hidden="true">
      <span class="swatch"></span><span>beam and animated &alpha; particles</span>
      <span class="swatch thin"></span><span>observed scattered paths</span>
    </div>
    <!-- @FIGURE_UI_END -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">Reload</button>
  </div>

  <script>
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = e.message || 'Figure failed to load';
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const _stage = document.getElementById('stage');
    const _ui = document.getElementById('ui');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setClearColor(0xffffff, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const d = 3;
    let aspect = 1;
    const camera = new THREE.OrthographicCamera(-d, d, d, -d, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableRotate = true;
    controls.screenSpacePanning = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.72);
    const key = new THREE.DirectionalLight(0xffffff, 0.66);
    key.position.set(2.5, 3.2, 5);
    scene.add(ambient, key);

    const _labels = [];
    const _raycaster = new THREE.Raycaster();
    const _pointer = new THREE.Vector2();
    const _interactive = [];
    const _tooltip = document.getElementById('figTooltip');

    function _autoUiLayout() {
      const hasEditor = Boolean(_ui.querySelector('textarea'));
      const start = hasEditor ? 400 : 300;
      document.body.setAttribute('data-ui-layout', 'right');
      document.body.style.setProperty('--ui-size', `${Math.min(start, Math.round(window.innerWidth * 0.45))}px`);
    }

    function _updateRendererSize() {
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      aspect = width / height;
      renderer.setSize(width, height, false);
      if (camera.isOrthographicCamera) {
        const span = camera.top - camera.bottom;
        camera.left = -span * aspect / 2;
        camera.right = span * aspect / 2;
        camera.updateProjectionMatrix();
      } else {
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
      }
    }

    function setCameraView(opts = {}) {
      _updateRendererSize();
      const target = new THREE.Vector3(
        opts.target?.x ?? 0,
        opts.target?.y ?? 0,
        opts.target?.z ?? 0
      );
      const box = new THREE.Box3().setFromObject(scene);
      const size = new THREE.Vector3();
      if (!box.isEmpty()) {
        box.getSize(size);
        box.getCenter(target);
      }
      const heightFraction = opts.heightFraction || 0.72;
      const neededHeight = Math.max(size.y || 1, (size.x || 1) / aspect) / heightFraction;
      if (opts.projection === 'perspective') {
        const perspective = new THREE.PerspectiveCamera(35, aspect, 0.1, 100);
        perspective.position.copy(target).add(new THREE.Vector3(0, 0, Math.max(6, neededHeight * 1.6)));
        perspective.lookAt(target);
        Object.assign(camera, perspective);
      } else {
        const span = Math.max(2, neededHeight);
        camera.left = -span * aspect / 2;
        camera.right = span * aspect / 2;
        camera.top = span / 2;
        camera.bottom = -span / 2;
        camera.near = 0.1;
        camera.far = 100;
        if (opts.axisScreenAngles) {
          camera.position.copy(target).add(new THREE.Vector3(3.4, 2.4, 5.6));
        } else {
          camera.position.copy(target).add(new THREE.Vector3(0, 0, 10));
        }
        camera.lookAt(target);
        camera.updateProjectionMatrix();
      }
      controls.target.copy(target);
      controls.update();
      _syncLabels();
    }

    function setStandardView() {
      setCameraView({ projection: 'orthographic', axisScreenAngles: null, heightFraction: 0.77 });
    }

    function addLabel(htmlString, position, options = {}) {
      const el = document.createElement('div');
      el.className = `lbl ${options.className || ''}`.trim();
      el.innerHTML = htmlString;
      if (options.style) Object.assign(el.style, options.style);
      _stage.appendChild(el);
      const pos = position.clone ? position.clone() : new THREE.Vector3(position.x, position.y, position.z || 0);
      _labels.push({ el, position: pos });
      _syncLabels();
      return el;
    }

    function _syncLabels() {
      for (const item of _labels) {
        const projected = item.position.clone().project(camera);
        const visible = projected.z > -1 && projected.z < 1;
        const left = canvas.offsetLeft + (projected.x * 0.5 + 0.5) * canvas.clientWidth;
        const top = canvas.offsetTop + (-projected.y * 0.5 + 0.5) * canvas.clientHeight;
        item.el.style.display = visible ? '' : 'none';
        item.el.style.left = `${left}px`;
        item.el.style.top = `${top}px`;
      }
    }

    function registerInteractive(object, meta) {
      object.userData.interactive = meta;
      _interactive.push(object);
      return object;
    }

    function showTooltip(text, x, y) {
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _tooltip.style.transform = `translate(${x + 12}px, ${y + 12}px)`;
    }

    function hideTooltip() {
      _tooltip.style.display = 'none';
    }

    function showPopup(title, body) {
      showTooltip(`${title}: ${body}`, window.innerWidth / 2, window.innerHeight / 2);
    }

    function hidePopup() {
      hideTooltip();
    }

    canvas.addEventListener('pointermove', (event) => {
      const rect = canvas.getBoundingClientRect();
      _pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      _pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      _raycaster.setFromCamera(_pointer, camera);
      const hit = _raycaster.intersectObjects(_interactive, true)[0];
      if (hit) {
        let obj = hit.object;
        while (obj && !obj.userData.interactive) obj = obj.parent;
        const meta = obj?.userData.interactive;
        showTooltip(meta?.tooltip || meta?.title || '', event.clientX, event.clientY);
      } else {
        hideTooltip();
      }
    });
    canvas.addEventListener('pointerleave', hideTooltip);

    function compileExpr(src, vars) {
      if (!window.exprEval) throw new Error('Expression parser unavailable');
      const parser = new window.exprEval.Parser();
      const expr = parser.parse(src);
      return (...args) => {
        const scope = {};
        vars.forEach((name, i) => { scope[name] = args[i]; });
        return expr.evaluate(scope);
      };
    }

    function bindEquationInput() {}
    function plotCurve3D() {}
    function plotParametric3D() {}
    function plotSurface() {}

    const _resizeObserver = new ResizeObserver(() => {
      _updateRendererSize();
      _syncLabels();
    });
    _resizeObserver.observe(_stage);

    let _lastTime = performance.now();
    function animate(time = performance.now()) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, Math.max(0, (time - _lastTime) / 1000));
      _lastTime = time;
      controls.update();
      if (typeof window.__figureTick === 'function') window.__figureTick(dt, time / 1000);
      renderer.render(scene, camera);
      _syncLabels();
      window.__markRendered();
    }

    // @FIGURE_CODE_BEGIN
    // source housing -> transparent BoxGeometry faces plus black LineSegments outline
    // collimator tunnel -> dashed LineSegments rectangle inside the housing
    // radium source -> SphereGeometry green emitter disk
    // alpha beam -> TubeGeometry bright green horizontal path
    // luminescent screen -> elliptical annular ShapeGeometry with TubeGeometry rims
    // thin gold foil -> small yellow BoxGeometry plate at the screen center
    // observed alpha paths -> green TubeGeometry polylines from foil to detector positions
    // animated alpha particles -> small SphereGeometry instances moving along path curves
    // callout pointers -> black CylinderGeometry shafts with ConeGeometry tips

    const root = new THREE.Group();
    scene.add(root);

    const palette = {
      beam: 0x62d700,
      screen: 0xcfeadd,
      screenEdge: 0x839695,
      source: 0x4dd300,
      foil: 0xffdc35,
      black: 0x111111,
      grey: 0x82918e,
      glass: 0xbfd2cf,
      tunnel: 0x222222
    };

    const matBeam = new THREE.MeshBasicMaterial({ color: palette.beam });
    const matBeamDim = new THREE.MeshBasicMaterial({ color: palette.beam, transparent: true, opacity: 0.86 });
    const matBeamFaint = new THREE.MeshBasicMaterial({ color: palette.beam, transparent: true, opacity: 0.48 });
    const matBlack = new THREE.MeshBasicMaterial({ color: palette.black });
    const matSource = new THREE.MeshBasicMaterial({ color: palette.source });
    const matScreen = new THREE.MeshBasicMaterial({
      color: palette.screen,
      transparent: true,
      opacity: 0.62,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const matScreenEdge = new THREE.MeshBasicMaterial({ color: palette.screenEdge });
    const matHousing = new THREE.MeshLambertMaterial({
      color: palette.glass,
      transparent: true,
      opacity: 0.62,
      side: THREE.DoubleSide
    });
    const matHousingSide = new THREE.MeshLambertMaterial({
      color: 0x99aaa6,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide
    });
    const matFoil = new THREE.MeshLambertMaterial({ color: palette.foil, side: THREE.DoubleSide });
    const matFoilSide = new THREE.MeshLambertMaterial({ color: 0xcaa51c, side: THREE.DoubleSide });

    function v(x, y, z = 0) {
      return new THREE.Vector3(x, y, z);
    }

    function makeTube(points, radius, material, segments = 24) {
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.12);
      const geom = new THREE.TubeGeometry(curve, Math.max(2, segments), radius, 8, false);
      const mesh = new THREE.Mesh(geom, material);
      root.add(mesh);
      return mesh;
    }

    function makeLine(points, material, z = 0.06) {
      const geom = new THREE.BufferGeometry().setFromPoints(points.map((p) => v(p.x, p.y, z)));
      const line = new THREE.Line(geom, material);
      root.add(line);
      return line;
    }

    function makeEllipseTube(cx, cy, rx, ry, radius, material, start = 0, end = Math.PI * 2, z = 0.01) {
      const pts = [];
      const steps = Math.max(12, Math.ceil(Math.abs(end - start) * 38));
      for (let i = 0; i <= steps; i++) {
        const t = start + (end - start) * (i / steps);
        pts.push(v(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry, z));
      }
      return makeTube(pts, radius, material, steps);
    }

    function makeArrow(start, end) {
      const from = start.clone();
      const to = end.clone();
      const dir = to.clone().sub(from);
      const len = dir.length();
      if (len < 0.001) return new THREE.Group();
      dir.normalize();
      const shaftLen = Math.max(0.001, len - 0.07);
      const group = new THREE.Group();
      const shaftGeom = new THREE.CylinderGeometry(0.009, 0.009, shaftLen, 8);
      const shaft = new THREE.Mesh(shaftGeom, matBlack);
      shaft.position.copy(from).add(dir.clone().multiplyScalar(shaftLen / 2));
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const coneGeom = new THREE.ConeGeometry(0.035, 0.09, 16);
      const cone = new THREE.Mesh(coneGeom, matBlack);
      cone.position.copy(to).add(dir.clone().multiplyScalar(-0.045));
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft, cone);
      root.add(group);
      return group;
    }

    function polygonMesh(points, material, z = 0) {
      const shape = new THREE.Shape(points.map((p) => new THREE.Vector2(p.x, p.y)));
      const geom = new THREE.ShapeGeometry(shape);
      const mesh = new THREE.Mesh(geom, material);
      mesh.position.z = z;
      root.add(mesh);
      return mesh;
    }

    function outline(points, close = true, z = 0.04) {
      const closed = close ? [...points, points[0]] : points;
      return makeLine(closed, new THREE.LineBasicMaterial({ color: palette.black }), z);
    }

    const boxFront = [
      { x: -2.32, y: -0.46 }, { x: -1.28, y: -0.46 },
      { x: -1.28, y: 0.36 }, { x: -2.32, y: 0.36 }
    ];
    const boxOffset = { x: 0.36, y: 0.18 };
    const boxTop = [
      boxFront[2],
      { x: boxFront[2].x + boxOffset.x, y: boxFront[2].y + boxOffset.y },
      { x: boxFront[3].x + boxOffset.x, y: boxFront[3].y + boxOffset.y },
      boxFront[3]
    ];
    const boxSide = [
      boxFront[1],
      { x: boxFront[1].x + boxOffset.x, y: boxFront[1].y + boxOffset.y },
      { x: boxFront[2].x + boxOffset.x, y: boxFront[2].y + boxOffset.y },
      boxFront[2]
    ];
    polygonMesh(boxTop, matHousingSide, -0.03);
    polygonMesh(boxSide, matHousingSide, -0.025);
    polygonMesh(boxFront, matHousing, -0.02);
    outline(boxFront);
    outline([
      boxFront[3],
      { x: boxFront[3].x + boxOffset.x, y: boxFront[3].y + boxOffset.y },
      { x: boxFront[2].x + boxOffset.x, y: boxFront[2].y + boxOffset.y },
      boxFront[2]
    ], false);
    outline([
      boxFront[2],
      { x: boxFront[2].x + boxOffset.x, y: boxFront[2].y + boxOffset.y },
      { x: boxFront[1].x + boxOffset.x, y: boxFront[1].y + boxOffset.y },
      boxFront[1]
    ], false);

    const tunnelMat = new THREE.LineDashedMaterial({ color: palette.tunnel, dashSize: 0.08, gapSize: 0.06 });
    const tunnelPts = [
      v(-1.84, -0.12, 0.07), v(-1.18, -0.12, 0.07),
      v(-1.18, 0.26, 0.07), v(-1.84, 0.26, 0.07), v(-1.84, -0.12, 0.07)
    ];
    const tunnel = new THREE.Line(new THREE.BufferGeometry().setFromPoints(tunnelPts), tunnelMat);
    tunnel.computeLineDistances();
    root.add(tunnel);
    outline([
      { x: -1.18, y: -0.12 }, { x: -1.05, y: -0.05 },
      { x: -1.05, y: 0.20 }, { x: -1.18, y: 0.26 }
    ]);

    const sourceSphere = new THREE.Mesh(new THREE.SphereGeometry(0.075, 32, 16), matSource);
    sourceSphere.position.set(-1.68, 0.02, 0.12);
    root.add(sourceSphere);
    registerInteractive(sourceSphere, {
      title: 'Radium source',
      tooltip: 'Radium emits positively charged alpha particles into the collimator.'
    });

    makeTube([v(-1.68, 0.02, 0.1), v(1.12, 0.02, 0.1)], 0.018, matBeam, 64);

    const screenCx = 1.08;
    const screenCy = 0.02;
    const outerRx = 0.94;
    const outerRy = 0.42;
    const innerRx = 0.75;
    const innerRy = 0.25;
    const ringShape = new THREE.Shape();
    ringShape.absellipse(screenCx, screenCy, outerRx, outerRy, 0, Math.PI * 2, false, 0);
    const hole = new THREE.Path();
    hole.absellipse(screenCx, screenCy, innerRx, innerRy, 0, Math.PI * 2, true, 0);
    ringShape.holes.push(hole);
    const ringMesh = new THREE.Mesh(new THREE.ShapeGeometry(ringShape, 96), matScreen);
    ringMesh.position.z = -0.035;
    root.add(ringMesh);
    makeEllipseTube(screenCx, screenCy, outerRx, outerRy, 0.016, matScreenEdge, 0, Math.PI * 2, 0.03);
    makeEllipseTube(screenCx, screenCy, innerRx, innerRy, 0.009, matScreenEdge, 0, Math.PI * 2, 0.035);
    makeEllipseTube(screenCx, screenCy - 0.15, outerRx, outerRy * 0.86, 0.007, matScreenEdge, Math.PI, Math.PI * 2, 0.0);
    registerInteractive(ringMesh, {
      title: 'Luminescent screen',
      tooltip: 'The circular detector flashes where scattered alpha particles strike it.'
    });

    const foil = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.44, 0.035), matFoil);
    foil.position.set(1.12, 0.02, 0.16);
    root.add(foil);
    const foilSide = polygonMesh([
      { x: 1.155, y: -0.20 },
      { x: 1.205, y: -0.17 },
      { x: 1.205, y: 0.20 },
      { x: 1.155, y: 0.24 }
    ], matFoilSide, 0.13);
    registerInteractive(foil, {
      title: 'Thin gold foil',
      tooltip: 'A very thin foil exposes alpha particles to many gold atoms.'
    });
    registerInteractive(foilSide, {
      title: 'Thin gold foil',
      tooltip: 'Increasing thickness raises the chance of small deflections.'
    });

    const outcomePaths = {
      straight: [[v(-1.68, 0.02, 0.14), v(1.12, 0.02, 0.14), v(2.02, 0.02, 0.14)]],
      slight: [
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(1.96, 0.21, 0.12)],
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(1.92, -0.16, 0.12)],
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(1.75, 0.31, 0.12)],
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(1.83, -0.25, 0.12)],
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(2.03, -0.04, 0.12)]
      ],
      rare: [
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(0.25, 0.42, 0.12)],
        [v(-1.68, 0.02, 0.12), v(1.12, 0.02, 0.12), v(0.49, -0.34, 0.12)]
      ]
    };
    const staticSlightLines = outcomePaths.slight.map((path, i) => {
      const mesh = makeTube(path.slice(1), 0.006, i < 2 ? matBeamDim : matBeamFaint, 28);
      mesh.userData.baseOpacity = i < 2 ? 0.86 : 0.48;
      return mesh;
    });
    outcomePaths.rare.forEach((path) => makeTube(path.slice(1), 0.006, matBeamDim, 28));
    makeTube(outcomePaths.straight[0].slice(1), 0.015, matBeam, 32);

    const hitMat = new THREE.MeshBasicMaterial({ color: palette.beam });
    const hitPoints = [
      v(2.02, 0.02, 0.15), v(1.96, 0.21, 0.15), v(1.92, -0.16, 0.15),
      v(1.75, 0.31, 0.15), v(0.25, 0.42, 0.15), v(0.49, -0.34, 0.15)
    ];
    hitPoints.forEach((p) => {
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.018, 16, 8), hitMat);
      dot.position.copy(p);
      root.add(dot);
    });

    const labelArrowGroup = new THREE.Group();
    root.add(labelArrowGroup);
    function attachArrow(start, end) {
      const arrow = makeArrow(start, end);
      labelArrowGroup.add(arrow);
      return arrow;
    }
    attachArrow(v(-0.44, 0.88, 0.25), v(-0.44, 0.11, 0.25));
    attachArrow(v(-1.50, -1.02, 0.25), v(-1.67, 0.03, 0.25));
    attachArrow(v(0.20, 1.08, 0.25), v(0.52, 0.28, 0.25));
    attachArrow(v(1.39, 1.05, 0.25), v(1.61, 0.22, 0.25));
    attachArrow(v(1.83, 1.03, 0.25), v(1.83, 0.06, 0.25));
    attachArrow(v(0.28, -0.94, 0.25), v(0.63, -0.43, 0.25));
    attachArrow(v(1.44, -0.92, 0.25), v(1.15, -0.15, 0.25));

    const labels = [
      addLabel('Beam of<br>&alpha; particles', v(-0.42, 0.99, 0.3), { className: 'figure-label' }),
      addLabel('Radium source of &alpha; particles', v(-1.55, -1.16, 0.3), { className: 'figure-label center' }),
      addLabel('A very small number<br>of &alpha; particles<br>are significantly<br>deflected', v(0.02, 1.30, 0.3), { className: 'figure-label' }),
      addLabel('A few &alpha;<br>particles are<br>slightly deflected', v(1.19, 1.28, 0.3), { className: 'figure-label', style: { maxWidth: '140px' } }),
      addLabel('Most &alpha; particles<br>pass straight<br>through foil', v(1.82, 1.28, 0.3), { className: 'figure-label', style: { maxWidth: '155px' } }),
      addLabel('Luminescent screen<br>to detect scattered<br>&alpha; particles', v(0.28, -1.17, 0.3), { className: 'figure-label center' }),
      addLabel('Thin gold<br>foil', v(1.40, -1.15, 0.3), { className: 'figure-label' })
    ];

    const particleGeom = new THREE.SphereGeometry(0.025, 16, 8);
    const particleMat = new THREE.MeshBasicMaterial({ color: palette.beam });
    const particles = [];
    for (let i = 0; i < 36; i++) {
      const p = new THREE.Mesh(particleGeom, particleMat);
      p.visible = false;
      root.add(p);
      particles.push({ mesh: p, active: false, t: 0, speed: 1.2, curve: null, type: 'straight' });
    }

    let animating = true;
    let thickness = 3;
    let spawnTimer = 0;
    let spawnIndex = 0;

    function curveForPath(path) {
      return new THREE.CatmullRomCurve3(path, false, 'catmullrom', 0.08);
    }

    const curves = {
      straight: outcomePaths.straight.map(curveForPath),
      slight: outcomePaths.slight.map(curveForPath),
      rare: outcomePaths.rare.map(curveForPath)
    };

    function sharesForThickness() {
      const rare = 3;
      const slight = 12 + thickness * 7;
      const straight = 100 - rare - slight;
      return { straight, slight, rare };
    }

    function chooseType() {
      const shares = sharesForThickness();
      const r = Math.random() * 100;
      if (r < shares.rare) return 'rare';
      if (r < shares.rare + shares.slight) return 'slight';
      return 'straight';
    }

    function spawnParticle() {
      const slot = particles[spawnIndex % particles.length];
      spawnIndex += 1;
      const type = chooseType();
      const list = curves[type];
      slot.type = type;
      slot.curve = list[Math.floor(Math.random() * list.length)];
      slot.t = 0;
      slot.speed = type === 'straight' ? 1.52 : type === 'slight' ? 1.25 : 1.08;
      slot.active = true;
      slot.mesh.visible = true;
      slot.mesh.scale.setScalar(type === 'rare' ? 1.18 : 1);
    }

    function updateStats() {
      const shares = sharesForThickness();
      document.getElementById('thicknessText').textContent = `${thickness} layer${thickness === 1 ? '' : 's'}`;
      document.getElementById('scatterStats').innerHTML =
        `Expected detections:<br>` +
        `<strong>${shares.straight}%</strong> pass straight through<br>` +
        `<strong>${shares.slight}%</strong> are slightly deflected<br>` +
        `<strong>${shares.rare}%</strong> are significantly deflected`;
      staticSlightLines.forEach((line, i) => {
        line.visible = i < thickness;
      });
    }

    function updateParticles(dt) {
      if (animating) {
        spawnTimer += dt;
        while (spawnTimer > 0.09) {
          spawnTimer -= 0.09;
          spawnParticle();
        }
      }
      for (const particle of particles) {
        if (!particle.active) continue;
        particle.t += dt * particle.speed;
        if (particle.t >= 1) {
          particle.active = false;
          particle.mesh.visible = false;
          continue;
        }
        particle.mesh.position.copy(particle.curve.getPointAt(particle.t));
      }
    }

    document.getElementById('btnAnimate').addEventListener('click', (event) => {
      animating = !animating;
      event.currentTarget.classList.toggle('active', animating);
      event.currentTarget.textContent = animating ? 'Pause particles' : 'Play particles';
    });

    document.getElementById('btnLabels').addEventListener('click', (event) => {
      const show = !event.currentTarget.classList.contains('active');
      event.currentTarget.classList.toggle('active', show);
      labelArrowGroup.visible = show;
      labels.forEach((label) => {
        label.style.visibility = show ? 'visible' : 'hidden';
      });
    });

    document.getElementById('thickness').addEventListener('input', (event) => {
      thickness = Number(event.target.value);
      updateStats();
    });

    updateStats();
    setCameraView({ projection: 'orthographic', axisScreenAngles: null, heightFraction: 0.83 });
    window.__figureTick = updateParticles;
    // @FIGURE_CODE_END

    _autoUiLayout();
    _updateRendererSize();
    setStandardView();
    animate();
  </script>
</body>

</html>
