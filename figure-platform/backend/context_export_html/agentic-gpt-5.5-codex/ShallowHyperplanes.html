<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      grid-area: stage;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lbl {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      color: #050505;
      z-index: 4;
    }

    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 300px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 8px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range],
    body[data-ui-layout="right"] #ui select,
    body[data-ui-layout="bottom"] #ui select {
      width: 100%;
      box-sizing: border-box;
    }

    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }

    .controlGroup {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border: 1px solid #d8dde3;
      border-radius: 6px;
      background: #fff;
    }

    .controlGroup strong {
      font-size: 12px;
      line-height: 1.2;
    }

    .readout {
      padding: 6px 7px;
      border-radius: 4px;
      background: #edf3f7;
      color: #1d2a31;
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="figTooltip"></div>
  <div id="ui">
    <button id="btnReset" style="display:none">Reset View</button>
    <button id="btnProjToggle" style="display:none">3D view</button>
    <!-- @FIGURE_UI_BEGIN -->
    <div class="controlGroup">
      <strong>Hyperplane controls</strong>
      <label>
        Selected boundary
        <select id="planeSelect">
          <option value="teal">Teal vertical plane</option>
          <option value="orange">Orange horizontal plane</option>
        </select>
      </label>
      <label>
        Weight w: <span id="weightValue">0.00</span>
        <input id="weightSlider" type="range" min="-1.2" max="1.2" step="0.01" value="0">
      </label>
      <div class="readout" id="planeReadout">w = 0.00 keeps the source orientation.</div>
    </div>
    <div class="controlGroup">
      <strong>Input point</strong>
      <label>
        x1: <span id="x1Value">0.35</span>
        <input id="x1Slider" type="range" min="-1" max="1" step="0.01" value="0.35">
      </label>
      <label>
        x2: <span id="x2Value">0.30</span>
        <input id="x2Slider" type="range" min="-1" max="1" step="0.01" value="0.30">
      </label>
      <label>
        x3: <span id="x3Value">0.35</span>
        <input id="x3Slider" type="range" min="-1" max="1" step="0.01" value="0.35">
      </label>
      <button id="resetPoint">Reset point</button>
      <div class="readout" id="classReadout">Drag the point in panel c.</div>
    </div>
    <!-- @FIGURE_UI_END -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
    }
  }
  </script>

  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">Reload</button>
  </div>

  <script>
    let _rendered = false;
    const _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = () => { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', (e) => {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = e.message || 'Figure failed to load';
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(() => {
      if (!_rendered) { _errOverlay.style.display = 'flex'; }
    }, 12000);
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const _stage = document.getElementById('stage');
    const _ui = document.getElementById('ui');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    function setUiLayout() {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      const next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', `${sizePx}px`);
    }

    function _autoUiLayout() {
      _applyUiLayout('right', 300);
    }

    new MutationObserver(() => {
      clearTimeout(_autoUiLayout._t);
      _autoUiLayout._t = setTimeout(_autoUiLayout, 0);
    }).observe(_ui, { childList: true, subtree: true });
    window.addEventListener('resize', () => { _autoUiLayout(); });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const d = 3;
    let aspect = Math.max(1, canvas.clientWidth / Math.max(canvas.clientHeight, 1));
    let camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableRotate = false;
    controls.screenSpacePanning = true;
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
    controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;

    const _labels = [];

    function addLabel(htmlString, position, options = {}) {
      const el = document.createElement('div');
      el.className = 'lbl';
      el.innerHTML = htmlString;
      if (options.className) el.classList.add(options.className);
      if (options.style) Object.assign(el.style, options.style);
      _stage.appendChild(el);
      const entry = { el, position: position.clone ? position.clone() : new THREE.Vector3(position.x, position.y, position.z || 0) };
      _labels.push(entry);
      return entry;
    }

    function _syncLabels() {
      const canvasRect = canvas.getBoundingClientRect();
      const stageRect = _stage.getBoundingClientRect();
      for (const label of _labels) {
        const p = label.position.clone().project(camera);
        const x = (p.x * 0.5 + 0.5) * canvasRect.width + (canvasRect.left - stageRect.left);
        const y = (-p.y * 0.5 + 0.5) * canvasRect.height + (canvasRect.top - stageRect.top);
        label.el.style.left = `${x}px`;
        label.el.style.top = `${y}px`;
        label.el.style.display = p.z < -1 || p.z > 1 ? 'none' : 'block';
      }
    }

    function showTooltip(text, x, y) {
      const tip = document.getElementById('figTooltip');
      tip.textContent = text;
      tip.style.display = 'block';
      tip.style.transform = `translate(${x + 12}px, ${y + 12}px)`;
    }

    function hideTooltip() {
      document.getElementById('figTooltip').style.display = 'none';
    }

    function registerInteractive(object, meta) {
      object.userData.interactive = meta || {};
      return object;
    }

    function showPopup() {}
    function hidePopup() {}
    function compileExpr(src, vars) {
      const parser = window.exprEval?.Parser ? new window.exprEval.Parser() : null;
      if (!parser) throw new Error('Expression parser unavailable');
      const expr = parser.parse(src);
      return (...args) => {
        const scope = {};
        vars.forEach((name, i) => { scope[name] = args[i]; });
        return expr.evaluate(scope);
      };
    }
    function bindEquationInput() {}
    function plotCurve3D() {}
    function plotParametric3D() {}
    function plotSurface() {}
    function setStandardView() {
      setCameraView({ projection: 'orthographic', axisScreenAngles: null, heightFraction: 0.82 });
    }

    function fitCameraToScene(heightFraction = 0.82) {
      const box = new THREE.Box3().setFromObject(scene);
      if (box.isEmpty()) return;
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      const canvasAspect = Math.max(0.1, canvas.clientWidth / Math.max(canvas.clientHeight, 1));
      const halfHeightByY = Math.max(size.y / (2 * heightFraction), 0.5);
      const halfHeightByX = Math.max(size.x / (2 * canvasAspect * heightFraction), 0.5);
      const halfHeight = Math.max(halfHeightByY, halfHeightByX);
      camera.left = center.x - halfHeight * canvasAspect;
      camera.right = center.x + halfHeight * canvasAspect;
      camera.top = center.y + halfHeight;
      camera.bottom = center.y - halfHeight;
      camera.near = 0.1;
      camera.far = 100;
      camera.position.set(center.x, center.y, 10);
      camera.lookAt(center.x, center.y, 0);
      controls.target.set(center.x, center.y, 0);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function setCameraView(opts = {}) {
      fitCameraToScene(opts.heightFraction ?? 0.82);
    }

    function resizeRendererToDisplaySize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const needResize = canvas.width !== Math.floor(width * renderer.getPixelRatio()) ||
        canvas.height !== Math.floor(height * renderer.getPixelRatio());
      if (needResize) {
        renderer.setSize(width, height, false);
        fitCameraToScene(0.82);
      }
    }

    const ro = new ResizeObserver(() => {
      resizeRendererToDisplaySize();
      _syncLabels();
    });
    ro.observe(_stage);

    // @FIGURE_CODE_BEGIN
    // panel letters -> HTML labels positioned in world space
    // axes in panels a, b, c -> black rectangular segment meshes plus triangular arrowhead meshes
    // 1D threshold point -> black SphereGeometry(0.055)
    // 1D hyperplane marker -> translucent teal rectangular segment mesh
    // 2D hyperplanes -> teal/orange rectangular segment meshes through the origin
    // 2D half-spaces -> translucent ShapeGeometry polygons clipped by the selected boundary
    // 3D cube/front face -> translucent grey ShapeGeometry rectangle
    // 3D teal and orange hyperplanes -> translucent ShapeGeometry parallelograms
    // hidden 3D guides -> dashed Line geometry
    // draggable input -> SphereGeometry(0.07) plus small ring mesh

    const COLORS = {
      teal: 0x9edbd6,
      tealLine: 0x99d9d4,
      orange: 0xd7845f,
      orangeLine: 0xd28664,
      grey: 0xb9c0c3,
      black: 0x000000,
      pointGood: 0x227a53,
      pointBad: 0xb13d52,
      blue: 0x477db3
    };

    const mats = {
      black: new THREE.MeshBasicMaterial({ color: COLORS.black, transparent: true, opacity: 1, depthTest: false, depthWrite: false }),
      teal: new THREE.MeshBasicMaterial({ color: COLORS.teal, transparent: true, opacity: 0.92, side: THREE.DoubleSide, depthTest: false, depthWrite: false }),
      tealSoft: new THREE.MeshBasicMaterial({ color: COLORS.teal, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthTest: false, depthWrite: false }),
      orange: new THREE.MeshBasicMaterial({ color: COLORS.orange, transparent: true, opacity: 0.92, side: THREE.DoubleSide, depthTest: false, depthWrite: false }),
      orangeSoft: new THREE.MeshBasicMaterial({ color: COLORS.orange, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthTest: false, depthWrite: false }),
      grey: new THREE.MeshBasicMaterial({ color: COLORS.grey, transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthTest: false, depthWrite: false }),
      point: new THREE.MeshBasicMaterial({ color: COLORS.blue, transparent: true, opacity: 1, depthTest: false, depthWrite: false }),
      ring: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, depthTest: false, depthWrite: false })
    };

    function v2(x, y) {
      return new THREE.Vector2(x, y);
    }

    function v3(x, y, z = 0) {
      return new THREE.Vector3(x, y, z);
    }

    function makeSegment(a, b, width, material, z = 0) {
      const len = a.distanceTo(b);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(len, width), material);
      mesh.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, z);
      mesh.rotation.z = Math.atan2(b.y - a.y, b.x - a.x);
      mesh.renderOrder = material === mats.black ? 40 : 20;
      scene.add(mesh);
      return mesh;
    }

    function updateSegment(mesh, a, b, width) {
      const len = Math.max(a.distanceTo(b), 0.001);
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(len, width);
      mesh.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, mesh.position.z);
      mesh.rotation.z = Math.atan2(b.y - a.y, b.x - a.x);
    }

    function makeTriangleArrow(tip, angle, size, material, z = 0) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(-size, size * 0.42);
      shape.lineTo(-size, -size * 0.42);
      shape.lineTo(0, 0);
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), material);
      mesh.position.set(tip.x, tip.y, z);
      mesh.rotation.z = angle;
      mesh.renderOrder = material === mats.black ? 41 : 21;
      scene.add(mesh);
      return mesh;
    }

    function makeDoubleArrow(a, b, width = 0.025, z = 0.22) {
      makeSegment(a, b, width, mats.black, z);
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      makeTriangleArrow(b, angle, 0.18, mats.black, z + 0.01);
      makeTriangleArrow(a, angle + Math.PI, 0.18, mats.black, z + 0.01);
    }

    function makeArrow(a, b, width = 0.025, z = 0.23) {
      makeSegment(a, b, width, mats.black, z);
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      makeTriangleArrow(b, angle, 0.17, mats.black, z + 0.01);
    }

    function makeShape(points, material, z = 0) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x, points[i].y);
      shape.lineTo(points[0].x, points[0].y);
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), material);
      mesh.position.z = z;
      mesh.renderOrder = 5;
      scene.add(mesh);
      return mesh;
    }

    function updateShape(mesh, points) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x, points[i].y);
      shape.lineTo(points[0].x, points[0].y);
      mesh.geometry.dispose();
      mesh.geometry = new THREE.ShapeGeometry(shape);
    }

    function makeDashedLine(points, color = COLORS.black, z = 0.24) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points.map((p) => v3(p.x, p.y, z)));
      const material = new THREE.LineDashedMaterial({
        color,
        dashSize: 0.08,
        gapSize: 0.06,
        depthTest: false,
        depthWrite: false
      });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = 42;
      line.computeLineDistances();
      scene.add(line);
      return line;
    }

    function makeDot(pos, radius, material, z = 0.35) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 12), material);
      mesh.position.set(pos.x, pos.y, z);
      mesh.renderOrder = material === mats.black ? 45 : 44;
      scene.add(mesh);
      return mesh;
    }

    function projectC(local) {
      const depthScale = 0.58;
      const angle = -135 * Math.PI / 180;
      return v2(
        C.x + local.x + local.z * depthScale * Math.cos(angle),
        C.y + local.y + local.z * depthScale * Math.sin(angle)
      );
    }

    function planePolyC(kind, w) {
      if (kind === 'teal') {
        const xAtZ = (z) => w * z * 0.42;
        return [
          projectC({ x: xAtZ(1.45), y: -1.48, z: 1.45 }),
          projectC({ x: xAtZ(1.45), y: 1.28, z: 1.45 }),
          projectC({ x: xAtZ(-1.45), y: 1.48, z: -1.45 }),
          projectC({ x: xAtZ(-1.45), y: -1.28, z: -1.45 })
        ];
      }
      const yAtX = (x) => -w * x * 0.26;
      return [
        projectC({ x: -1.65, y: yAtX(-1.65), z: 1.12 }),
        projectC({ x: 1.62, y: yAtX(1.62), z: 1.12 }),
        projectC({ x: 1.62, y: yAtX(1.62), z: -1.12 }),
        projectC({ x: -1.65, y: yAtX(-1.65), z: -1.12 })
      ];
    }

    const A = v2(-4.55, -0.05);
    const B = v2(-0.45, -0.05);
    const C = v2(3.55, -0.05);

    makeDoubleArrow(v2(A.x - 1.45, A.y), v2(A.x + 1.45, A.y), 0.025, 0.18);
    makeSegment(v2(A.x, A.y - 0.34), v2(A.x, A.y + 0.34), 0.08, mats.teal, 0.12);
    makeDot(A, 0.055, mats.black, 0.34);

    makeDoubleArrow(v2(B.x - 1.48, B.y), v2(B.x + 1.48, B.y), 0.026, 0.18);
    makeDoubleArrow(v2(B.x, B.y - 1.22), v2(B.x, B.y + 1.36), 0.026, 0.18);

    const boxB = [
      v2(B.x - 1.23, B.y - 1.03),
      v2(B.x + 1.23, B.y - 1.03),
      v2(B.x + 1.23, B.y + 1.03),
      v2(B.x - 1.23, B.y + 1.03)
    ];
    let halfPositive = makeShape(boxB, mats.tealSoft, 0.02);
    let halfNegative = makeShape(boxB, mats.orangeSoft, 0.01);
    const tealLineB = makeSegment(v2(B.x, B.y - 1.04), v2(B.x, B.y + 1.04), 0.06, mats.teal, 0.21);
    const orangeLineB = makeSegment(v2(B.x - 1.14, B.y), v2(B.x + 1.14, B.y), 0.055, mats.orange, 0.22);
    makeDot(B, 0.055, mats.black, 0.36);

    const greyFace = makeShape([
      projectC({ x: -1.18, y: -1.15, z: 0 }),
      projectC({ x: 1.48, y: -1.15, z: 0 }),
      projectC({ x: 1.48, y: 1.15, z: 0 }),
      projectC({ x: -1.18, y: 1.15, z: 0 })
    ], mats.grey, 0.03);
    const tealPlaneC = makeShape(planePolyC('teal', 0), mats.teal, 0.04);
    const orangePlaneC = makeShape(planePolyC('orange', 0), mats.orange, 0.05);

    const x1Left = projectC({ x: -1.45, y: 0, z: 0 });
    const x1Right = projectC({ x: 1.55, y: 0, z: 0 });
    const x2Bottom = projectC({ x: 0, y: -1.28, z: 0 });
    const x2Top = projectC({ x: 0, y: 1.32, z: 0 });
    const x3End = projectC({ x: 0, y: 0, z: 1.28 });
    makeDoubleArrow(x1Left, x1Right, 0.026, 0.26);
    makeDoubleArrow(x2Bottom, x2Top, 0.026, 0.26);
    makeArrow(projectC({ x: 0, y: 0, z: 0 }), x3End, 0.026, 0.27);
    makeDashedLine([projectC({ x: 0, y: 0, z: 0 }), projectC({ x: -1.35, y: 0, z: 0 })], COLORS.black, 0.25);
    makeDashedLine([projectC({ x: 0, y: 0, z: 0 }), projectC({ x: 0, y: -0.88, z: 0 })], COLORS.black, 0.25);
    makeDashedLine([projectC({ x: 0, y: 0, z: 0 }), projectC({ x: 0, y: 0, z: -1.05 })], COLORS.black, 0.25);
    makeDot(projectC({ x: 0, y: 0, z: 0 }), 0.055, mats.black, 0.39);

    const inputState = { x1: 0.35, x2: 0.3, x3: 0.35 };
    const inputDot = makeDot(projectC({ x: inputState.x1, y: inputState.x2, z: inputState.x3 }), 0.075, mats.point, 0.5);
    const ringGeom = new THREE.RingGeometry(0.09, 0.12, 36);
    const inputRing = new THREE.Mesh(ringGeom, mats.ring);
    inputRing.position.set(inputDot.position.x, inputDot.position.y, 0.49);
    inputRing.renderOrder = 43;
    scene.add(inputRing);
    registerInteractive(inputDot, {
      tooltip: 'Input point: drag in panel c, or use the sliders.'
    });

    addLabel('a)', v3(-6.12, 1.58), { style: { fontFamily: 'Arial, sans-serif', fontSize: '34px' } });
    addLabel('b)', v3(-2.2, 1.58), { style: { fontFamily: 'Arial, sans-serif', fontSize: '34px' } });
    addLabel('c)', v3(2.25, 1.58), { style: { fontFamily: 'Arial, sans-serif', fontSize: '34px' } });
    addLabel('<i>x</i><sub>1</sub>', v3(A.x + 1.56, A.y - 0.08), { style: { fontSize: '31px' } });
    addLabel('<i>x</i><sub>1</sub>', v3(B.x + 1.58, B.y - 0.08), { style: { fontSize: '31px' } });
    addLabel('<i>x</i><sub>2</sub>', v3(B.x + 0.12, B.y + 1.45), { style: { fontSize: '31px' } });
    addLabel('<i>x</i><sub>1</sub>', v3(C.x + 1.66, C.y - 0.08), { style: { fontSize: '31px' } });
    addLabel('<i>x</i><sub>2</sub>', v3(C.x - 0.16, C.y + 1.48), { style: { fontSize: '31px' } });
    addLabel('<i>x</i><sub>3</sub>', v3(x3End.x - 0.08, x3End.y - 0.15), { style: { fontSize: '31px' } });

    const planeSelect = document.getElementById('planeSelect');
    const weightSlider = document.getElementById('weightSlider');
    const weightValue = document.getElementById('weightValue');
    const planeReadout = document.getElementById('planeReadout');
    const classReadout = document.getElementById('classReadout');
    const pointControls = {
      x1: [document.getElementById('x1Slider'), document.getElementById('x1Value')],
      x2: [document.getElementById('x2Slider'), document.getElementById('x2Value')],
      x3: [document.getElementById('x3Slider'), document.getElementById('x3Value')]
    };

    function clipHalfPlane(poly, normal, offset, keepPositive) {
      const inside = (p) => {
        const val = normal.x * (p.x - B.x) + normal.y * (p.y - B.y) + offset;
        return keepPositive ? val >= -1e-6 : val <= 1e-6;
      };
      const intersect = (a, b) => {
        const va = normal.x * (a.x - B.x) + normal.y * (a.y - B.y) + offset;
        const vb = normal.x * (b.x - B.x) + normal.y * (b.y - B.y) + offset;
        const t = va / (va - vb || 1);
        return v2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
      };
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const cur = poly[i];
        const prev = poly[(i + poly.length - 1) % poly.length];
        const curIn = inside(cur);
        const prevIn = inside(prev);
        if (curIn) {
          if (!prevIn) out.push(intersect(prev, cur));
          out.push(cur);
        } else if (prevIn) {
          out.push(intersect(prev, cur));
        }
      }
      return out.length >= 3 ? out : [B.clone(), B.clone().add(v2(0.001, 0)), B.clone().add(v2(0, 0.001))];
    }

    function updateHalfSpaces(angle) {
      const normal = v2(-Math.sin(angle), Math.cos(angle));
      updateShape(halfPositive, clipHalfPlane(boxB, normal, 0, true));
      updateShape(halfNegative, clipHalfPlane(boxB, normal, 0, false));
    }

    function updatePointVisual() {
      const p = projectC({ x: inputState.x1, y: inputState.x2, z: inputState.x3 });
      inputDot.position.set(p.x, p.y, 0.5);
      inputRing.position.set(p.x, p.y, 0.49);
      const w = Number(weightSlider.value);
      const tealScore = inputState.x1 + w * inputState.x3 * 0.55;
      const orangeScore = inputState.x2 - w * inputState.x1 * 0.35;
      const combined = tealScore >= 0 && orangeScore >= 0;
      inputDot.material.color.setHex(combined ? COLORS.pointGood : COLORS.pointBad);
      pointControls.x1[1].textContent = inputState.x1.toFixed(2);
      pointControls.x2[1].textContent = inputState.x2.toFixed(2);
      pointControls.x3[1].textContent = inputState.x3.toFixed(2);
      classReadout.textContent = `teal ${tealScore >= 0 ? '+' : '-'}, orange ${orangeScore >= 0 ? '+' : '-'} -> class ${combined ? '+1' : '-1'}`;
    }

    function updateWeight() {
      const w = Number(weightSlider.value);
      const selected = planeSelect.value;
      weightValue.textContent = w.toFixed(2);
      const baseAngle = selected === 'teal' ? Math.PI / 2 : 0;
      const angle = baseAngle + w * 0.55;
      const dir = v2(Math.cos(angle), Math.sin(angle));
      const halfLen = 1.16;
      if (selected === 'teal') {
        updateSegment(tealLineB, v2(B.x - dir.x * halfLen, B.y - dir.y * halfLen), v2(B.x + dir.x * halfLen, B.y + dir.y * halfLen), 0.06);
        updateSegment(orangeLineB, v2(B.x - 1.14, B.y), v2(B.x + 1.14, B.y), 0.055);
        updateShape(tealPlaneC, planePolyC('teal', w));
        updateShape(orangePlaneC, planePolyC('orange', 0));
      } else {
        updateSegment(tealLineB, v2(B.x, B.y - 1.04), v2(B.x, B.y + 1.04), 0.06);
        updateSegment(orangeLineB, v2(B.x - dir.x * halfLen, B.y - dir.y * halfLen), v2(B.x + dir.x * halfLen, B.y + dir.y * halfLen), 0.055);
        updateShape(tealPlaneC, planePolyC('teal', 0));
        updateShape(orangePlaneC, planePolyC('orange', w));
      }
      updateHalfSpaces(angle);
      planeReadout.textContent = selected === 'teal'
        ? `teal decision: x1 + ${w.toFixed(2)} x3 = 0`
        : `orange decision: x2 - ${w.toFixed(2)} x1 = 0`;
      updatePointVisual();
    }

    function setPointAxis(axis, value) {
      inputState[axis] = THREE.MathUtils.clamp(Number(value), -1, 1);
      pointControls[axis][0].value = inputState[axis].toFixed(2);
      updatePointVisual();
    }

    for (const axis of ['x1', 'x2', 'x3']) {
      pointControls[axis][0].addEventListener('input', (event) => setPointAxis(axis, event.target.value));
    }
    weightSlider.addEventListener('input', updateWeight);
    planeSelect.addEventListener('change', updateWeight);
    document.getElementById('resetPoint').addEventListener('click', () => {
      setPointAxis('x1', 0.35);
      setPointAxis('x2', 0.3);
      setPointAxis('x3', 0.35);
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let draggingPoint = false;

    function pointerToWorld(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      const point = new THREE.Vector3(pointer.x, pointer.y, 0).unproject(camera);
      return point;
    }

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(inputDot, false)[0];
      if (hit) {
        draggingPoint = true;
        controls.enabled = false;
        canvas.setPointerCapture(event.pointerId);
      }
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!draggingPoint) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObject(inputDot, false)[0];
        if (hit) showTooltip(inputDot.userData.interactive.tooltip, event.clientX, event.clientY);
        else hideTooltip();
        return;
      }
      const world = pointerToWorld(event);
      const depthScale = 0.58;
      const angle = -135 * Math.PI / 180;
      const zx = inputState.x3 * depthScale * Math.cos(angle);
      const zy = inputState.x3 * depthScale * Math.sin(angle);
      setPointAxis('x1', world.x - C.x - zx);
      setPointAxis('x2', world.y - C.y - zy);
    });

    canvas.addEventListener('pointerup', (event) => {
      if (draggingPoint) {
        draggingPoint = false;
        controls.enabled = true;
        canvas.releasePointerCapture(event.pointerId);
      }
    });

    canvas.addEventListener('pointerleave', () => {
      hideTooltip();
    });

    updateWeight();
    setCameraView({ projection: 'orthographic', axisScreenAngles: null, heightFraction: 0.82 });
    _syncLabels();
    // @FIGURE_CODE_END

    _autoUiLayout();

    function animate() {
      resizeRendererToDisplaySize();
      controls.update();
      _syncLabels();
      renderer.render(scene, camera);
      if (!window.__figureMarked) {
        window.__figureMarked = true;
        window.__markRendered?.();
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
