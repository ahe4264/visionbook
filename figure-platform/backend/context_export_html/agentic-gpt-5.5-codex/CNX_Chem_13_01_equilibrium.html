    html,

    /* ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ Figure mount point ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ */

    /* ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ Control panel (mirrors base_scene_new.html #ui) ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;

      overflow-x: hidden;
      background: transparent;
      border: 0;

      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    }

    }

    #ui button.active {

      border-color: #5aabf0;
    }

    #ui label {

      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {

    }

    /* ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ Docked control panel ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {

    body[data-ui-layout="bottom"] #ui label {

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {

      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ Inline equation parse errors ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ */

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
    // Library: svgjs
    var mount = document.getElementById('container');
    var W = 650;
    var H = 1285;
    var draw = SVG().addTo(mount).size('100%', '100%').viewbox(0, 0, W, H);
    draw.node.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    var state = {
      initial: 1.0,
      time: 6.2,
      singleGraph: false,
      rateMode: false,
      dragGraph: null
    };
    var eqTime = 5.0;
    var tMax = 10;
    var activeGraphs = [];

    var C = {
      red: '#c4492d',
      redDark: '#b33e25',
      blue: '#5069b0',
      blueDark: '#334d96',
      axis: '#111111',
      gray: '#858585',
      pale: '#f7efcf',
      tubePale: '#d8dcf5',
      tubePre: '#eec95b',
      tubeEq: '#e98634'
    };

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function easeToEq(t, tau) {
      var tt = clamp(t, 0, eqTime);
      return (1 - Math.exp(-tt / tau)) / (1 - Math.exp(-eqTime / tau));
    }
    function valuesAt(t) {
      var I = state.initial;
      var tau = 1.25 + (1.05 - I) * 0.22;
      var n2Start = 1.22 * I;
      var n2Eq = 0.34 + 0.18 * I;
      var no2Eq = 0.78 + 0.36 * I;
      var a = easeToEq(t, tau);
      var b = easeToEq(t, tau * 1.08);
      var common = 0.45 + 0.17 * I;
      var fStart = 0.92 + 0.32 * I;
      return {
        n2o4: n2Start + (n2Eq - n2Start) * b,
        no2: no2Eq * a,
        forward: fStart + (common - fStart) * b,
        reverse: common * a,
        common: common,
        stage: t < 1.25 ? 0 : (t < eqTime ? 1 : 2)
      };
    }

    function setControlValues() {
      var tOut = document.getElementById('timeVal');
      var tIn = document.getElementById('timeInput');
      var iOut = document.getElementById('initialVal');
      var iIn = document.getElementById('initialInput');
      if (tOut) tOut.value = state.time.toFixed(1);
      if (tIn) tIn.value = state.time.toFixed(1);
      if (iOut) iOut.value = state.initial.toFixed(1);
      if (iIn) iIn.value = state.initial.toFixed(1);
      var r = valuesAt(state.time);
      var readout = document.getElementById('valuesReadout');
      if (readout) {
        readout.textContent = '[N2O4] ' + r.n2o4.toFixed(2) + '   [NO2] ' + r.no2.toFixed(2) +
          '   forward ' + r.forward.toFixed(2) + '   reverse ' + r.reverse.toFixed(2);
      }
    }

    function labelText(parent, str, x, y, size, opts) {
      opts = opts || {};
      var t = parent.text(str).font({ family: 'Arial, Helvetica, sans-serif', size: size, anchor: opts.anchor || 'middle' })
        .fill(opts.fill || '#000');
      t.move(x, y);
      if (opts.rotate) t.rotate(opts.rotate, x, y);
      if (opts.halo !== false) {
        t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': opts.strokeWidth || 5, 'stroke-linejoin': 'round' });
      }
      return t;
    }

    function interactive(el, tip, title, body) {
      el.css('cursor', 'pointer');
      el.on('mousemove', function (e) { showTooltip(tip, e); });
      el.on('mouseleave', function () { hideTooltip(); });
      el.on('click', function () { showPopup(title, body); });
      return el;
    }

    function redBall(parent, x, y, r) {
      parent.circle(r * 2).center(x, y).fill('#e51f2d');
      parent.circle(r * 0.75).center(x - r * 0.35, y - r * 0.35).fill('#ff6670').opacity(0.78);
    }
    function blueBall(parent, x, y, r) {
      parent.circle(r * 2).center(x, y).fill('#315ca9');
      parent.circle(r * 0.75).center(x - r * 0.35, y - r * 0.35).fill('#7b9be0').opacity(0.72);
    }
    function moleculeN2O4(parent, x, y, s, rot) {
      var g = parent.group();
      redBall(g, -12 * s, -11 * s, 8 * s);
      redBall(g, -15 * s, 10 * s, 8 * s);
      redBall(g, 12 * s, -11 * s, 8 * s);
      redBall(g, 15 * s, 10 * s, 8 * s);
      blueBall(g, -4 * s, 0, 8 * s);
      blueBall(g, 8 * s, 0, 8 * s);
      g.move(x, y).rotate(rot || 0, x, y);
      return g;
    }
    function moleculeNO2(parent, x, y, s, rot) {
      var g = parent.group();
      redBall(g, -10 * s, -4 * s, 8 * s);
      redBall(g, 12 * s, 5 * s, 8 * s);
      blueBall(g, 1 * s, 0, 8 * s);
      g.move(x, y).rotate(rot || 0, x, y);
      return g;
    }

    function tube(parent, cx, cy, color, active, stageIndex) {
      var g = parent.group();
      var tint = color;
      var darken = 1 + (state.initial - 1) * 0.45;
      if (stageIndex > 0) tint = stageIndex === 1 ? shade(C.tubePre, darken) : shade(C.tubeEq, darken);
      var tubeG = g.group();
      tubeG.rect(29, 150).radius(15).center(cx, cy).fill(tint).opacity(stageIndex === 0 ? 0.58 : 0.72)
        .stroke({ color: '#bfc2d2', width: 1.2 });
      tubeG.rect(15, 128).radius(9).center(cx - 5, cy - 6).fill('#ffffff').opacity(stageIndex === 0 ? 0.35 : 0.20);
      tubeG.path('M' + (cx - 15) + ' ' + (cy + 65) + ' Q' + cx + ' ' + (cy + 83) + ' ' + (cx + 15) + ' ' + (cy + 65))
        .fill(tint).opacity(0.85).stroke({ color: '#bfc2d2', width: 1 });
      tubeG.rotate(-33, cx, cy);
      if (active) {
        g.ellipse(55, 170).center(cx - 4, cy + 3).fill('none').stroke({ color: '#f0a63a', width: 4, opacity: 0.8 }).rotate(-33, cx, cy);
      }
      interactive(g, 'Gas color mirrors the changing mixture composition.', 'Sealed tube', 'The tube darkens as colorless N2O4 decomposes into brown NO2. At equilibrium the color is steady even though both reactions keep occurring.');
      return g;
    }

    function shade(hex, factor) {
      var n = parseInt(hex.slice(1), 16);
      var r = clamp(Math.round(((n >> 16) & 255) * factor), 0, 255);
      var g = clamp(Math.round(((n >> 8) & 255) * factor), 0, 255);
      var b = clamp(Math.round((n & 255) * factor), 0, 255);
      return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
    }

    function drawArrow(parent, x1, y1, x2, y2) {
      parent.path('M' + x1 + ' ' + y1 + ' C' + (x1 - 18) + ' ' + (y1 + 35) + ' ' + (x2 - 25) + ' ' + (y2 - 38) + ' ' + x2 + ' ' + y2)
        .fill('none').stroke({ color: '#111', width: 1.2 });
      parent.polygon([[x2 - 24, y2 - 38], [x2 + 24, y2 - 38], [x2, y2 + 2]]).fill('#f7f7f7').stroke({ color: '#111', width: 1.2 });
    }

    function drawPanelA(root) {
      var activeStage = valuesAt(state.time).stage;
      var xs = [112, 325, 535];
      var labels = ['t = 0', 'pre-equilibrium', 'at equilibrium'];
      var colors = [C.tubePale, C.tubePre, C.tubeEq];
      for (var i = 0; i < 3; i++) {
        labelText(root, labels[i], xs[i], 16, 24, { anchor: 'middle', halo: false });
        tube(root, xs[i] + (i === 0 ? -2 : 0), 116, colors[i], i === activeStage, i);
        drawArrow(root, xs[i], 127, xs[i], 225);
        var ring = root.circle(150).center(xs[i], 312).fill('#fff').stroke({ color: i === activeStage ? '#777' : '#878787', width: i === activeStage ? 5 : 4 });
        if (i === activeStage) root.circle(164).center(xs[i], 312).fill('none').stroke({ color: '#f1b24d', width: 3, opacity: 0.75 });
        interactive(ring, 'Particle snapshot for this time region.', 'Molecular snapshot', 'Large paired molecules represent N2O4, while smaller bent molecules represent NO2. The mixture changes until the equilibrium proportions become constant.');
      }
      var s = 0.82;
      [[-43, -34, -20], [8, -42, 8], [42, -20, 38], [-48, 28, -12], [-5, 3, 31], [39, 37, 8], [-1, 49, -28]].forEach(function (p) { moleculeN2O4(root, xs[0] + p[0], 305 + p[1], s, p[2]); });
      [[-50, -28, -25], [-5, -35, 15], [39, -22, 35], [-42, 26, 8], [20, 39, -25]].forEach(function (p) { moleculeN2O4(root, xs[1] + p[0], 305 + p[1], 0.72, p[2]); });
      [[28, -39, -20], [-9, 4, 35], [48, 18, 8], [-18, 41, -22]].forEach(function (p) { moleculeNO2(root, xs[1] + p[0], 305 + p[1], 0.58, p[2]); });
      [[-49, -25, -20], [9, 42, 16], [43, -10, 28]].forEach(function (p) { moleculeN2O4(root, xs[2] + p[0], 305 + p[1], 0.70, p[2]); });
      [[-16, -40, 15], [15, -25, -20], [-39, 2, 25], [7, 1, -12], [42, 19, 5], [-17, 27, -25], [53, -32, 30], [-58, 33, 5]].forEach(function (p) { moleculeNO2(root, xs[2] + p[0], 305 + p[1], 0.56, p[2]); });
      root.line(144, 357, 179, 384).stroke({ color: '#000', width: 5 });
      labelText(root, 'N2O4', 181, 386, 28, { anchor: 'start' });
      root.line(330, 353, 372, 386).stroke({ color: '#000', width: 5 });
      labelText(root, 'NO2', 376, 386, 27, { anchor: 'start' });
      labelText(root, '(a)', 325, 436, 26, { halo: false });
    }

    function graphMap(frame, yMax) {
      return {
        x: function (t) { return frame.x + (t / tMax) * frame.w; },
        y: function (v) { return frame.y + frame.h - (v / yMax) * frame.h; }
      };
    }
    function curvePath(frame, yMax, getter) {
      var m = graphMap(frame, yMax);
      var d = '';
      for (var i = 0; i <= 160; i++) {
        var t = (i / 160) * tMax;
        var p = i === 0 ? 'M' : 'L';
        d += p + m.x(t).toFixed(2) + ' ' + m.y(getter(valuesAt(t))).toFixed(2) + ' ';
      }
      return d;
    }
    function axis(parent, frame, yLabel) {
      parent.line(frame.x, frame.y + frame.h, frame.x + frame.w + 36, frame.y + frame.h).stroke({ color: C.axis, width: 2.2 });
      parent.polygon([[frame.x + frame.w + 36, frame.y + frame.h], [frame.x + frame.w + 13, frame.y + frame.h - 9], [frame.x + frame.w + 13, frame.y + frame.h + 9]]).fill(C.axis);
      parent.line(frame.x, frame.y + frame.h, frame.x, frame.y - 36).stroke({ color: C.axis, width: 2.2 });
      parent.polygon([[frame.x, frame.y - 36], [frame.x - 8, frame.y - 13], [frame.x + 8, frame.y - 13]]).fill(C.axis);
      labelText(parent, yLabel, frame.x - 44, frame.y + frame.h / 2, 25, { rotate: -90, halo: false });
      labelText(parent, 'Time', frame.x + frame.w / 2 + 5, frame.y + frame.h + 27, 25, { halo: false });
      labelText(parent, '0', frame.x + 14, frame.y + frame.h + 29, 25, { halo: false });
    }
    function addTimeMarker(parent, frame) {
      var m = graphMap(frame, 1);
      var x = m.x(state.time);
      parent.line(x, frame.y - 1, x, frame.y + frame.h).stroke({ color: '#000', width: 1.6, dasharray: '14 10' });
      parent.circle(13).center(x, frame.y + frame.h).fill('#fff').stroke({ color: '#111', width: 2 });
      var hit = parent.rect(frame.w + 54, frame.h + 58).move(frame.x - 6, frame.y - 36).fill('#fff').opacity(0);
      hit.css('cursor', 'ew-resize');
      hit.on('pointerdown', function (e) {
        state.dragGraph = frame;
        setTimeFromEvent(e, frame);
        if (hit.node.setPointerCapture && e.pointerId !== undefined) hit.node.setPointerCapture(e.pointerId);
      });
      activeGraphs.push(frame);
    }
    function equilibriumShade(parent, frame) {
      var m = graphMap(frame, 1);
      parent.rect(frame.x + frame.w - m.x(eqTime), frame.h).move(m.x(eqTime), frame.y).fill(C.pale).opacity(0.94);
      parent.line(m.x(eqTime), frame.y, m.x(eqTime), frame.y + frame.h).stroke({ color: '#000', width: 1.5, dasharray: '14 10' });
      labelText(parent, 'Equilibrium\nachieved', m.x(eqTime) + 78, frame.y + frame.h * 0.30, 25, { anchor: 'start', halo: false });
    }
    function drawConcentrationGraph(parent, frame, panelLabel) {
      var yMax = 1.45;
      equilibriumShade(parent, frame);
      axis(parent, frame, 'Concentration');
      parent.path(curvePath(frame, yMax, function (v) { return v.no2; })).fill('none').stroke({ color: C.red, width: 5, linecap: 'round' });
      parent.path(curvePath(frame, yMax, function (v) { return v.n2o4; })).fill('none').stroke({ color: C.blue, width: 5, linecap: 'round' });
      var m = graphMap(frame, yMax);
      labelText(parent, 'NO2', m.x(3.25), m.y(valuesAt(3.25).no2) - 30, 27, { anchor: 'start' });
      labelText(parent, 'N2O4', m.x(3.25), m.y(valuesAt(3.25).n2o4) + 20, 27, { anchor: 'start' });
      addTimeMarker(parent, frame);
      var v = valuesAt(state.time);
      parent.circle(11).center(m.x(state.time), m.y(v.no2)).fill(C.red).stroke({ color: '#fff', width: 3 });
      parent.circle(11).center(m.x(state.time), m.y(v.n2o4)).fill(C.blue).stroke({ color: '#fff', width: 3 });
      labelText(parent, panelLabel, frame.x + frame.w / 2, frame.y + frame.h + 72, 26, { halo: false });
    }
    function drawRateGraph(parent, frame, panelLabel) {
      var yMax = 1.45;
      equilibriumShade(parent, frame);
      axis(parent, frame, 'Rate');
      parent.path(curvePath(frame, yMax, function (v) { return v.forward; })).fill('none').stroke({ color: C.blue, width: 5, linecap: 'round' });
      parent.path(curvePath(frame, yMax, function (v) { return v.reverse; })).fill('none').stroke({ color: C.red, width: 5, linecap: 'round' });
      var m = graphMap(frame, yMax);
      labelText(parent, 'kf[N2O4]', m.x(1.0), m.y(valuesAt(1.0).forward) - 34, 24, { anchor: 'start' });
      labelText(parent, 'kr[NO2]2', m.x(0.85), m.y(valuesAt(1.5).reverse) + 28, 24, { anchor: 'start' });
      addTimeMarker(parent, frame);
      var v = valuesAt(state.time);
      parent.circle(11).center(m.x(state.time), m.y(v.forward)).fill(C.blue).stroke({ color: '#fff', width: 3 });
      parent.circle(11).center(m.x(state.time), m.y(v.reverse)).fill(C.red).stroke({ color: '#fff', width: 3 });
      labelText(parent, panelLabel, frame.x + frame.w / 2, frame.y + frame.h + 72, 26, { halo: false });
    }

    function render() {
      draw.clear();
      activeGraphs = [];
      var root = draw.group();
      root.rect(W, H).fill('#fff');
      drawPanelA(root);
      if (state.singleGraph) {
        var large = { x: 83, y: 535, w: 486, h: 545 };
        if (state.rateMode) drawRateGraph(root, large, '(c)');
        else drawConcentrationGraph(root, large, '(b)');
      } else {
        drawConcentrationGraph(root, { x: 83, y: 535, w: 486, h: 240 }, '(b)');
        drawRateGraph(root, { x: 83, y: 945, w: 486, h: 240 }, '(c)');
      }
      setControlValues();
    }

    function svgPoint(evt) {
      var pt = draw.node.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      var ctm = draw.node.getScreenCTM();
      if (!ctm) return { x: 0, y: 0 };
      return pt.matrixTransform(ctm.inverse());
    }
    function setTimeFromEvent(evt, frame) {
      var p = svgPoint(evt);
      state.time = clamp(((p.x - frame.x) / frame.w) * tMax, 0, tMax);
      render();
    }
    window.addEventListener('pointermove', function (evt) {
      if (state.dragGraph) setTimeFromEvent(evt, state.dragGraph);
    });
    window.addEventListener('pointerup', function () { state.dragGraph = null; });

    function update_initial(v) { state.initial = clamp(v, 0.6, 1.4); render(); }
    function update_time(v) { state.time = clamp(v, 0, tMax); render(); }
    function toggle_singleGraph(on) { state.singleGraph = !!on; render(); }
    function toggle_rateMode(on) { state.rateMode = !!on; render(); }
    function setUiFromInitial() {
      var single = document.getElementById('singleGraphInput');
      var rate = document.getElementById('rateModeInput');
      if (single) single.checked = state.singleGraph;
      if (rate) rate.checked = state.rateMode;
    }

    setUiFromInitial();
    render();
    window.__markRendered();
    // @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>

</html>
