<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<div id="demo-player" style="border: 1px solid #ddd; padding: 8px; background: #fafbfc; margin-bottom: 12px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
  <p id="demoNarration" style="margin:0 0 8px 0; font-size:11px; max-width:100%; line-height:1.4; color:#333; min-height: 46px;"></p>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <button onclick="prevStep()" style="padding:3px 8px; font-size:10px;">◀ Prev</button>
    <span id="stepLabel" style="font-size:11px; font-weight:bold; color:#555;"></span>
    <button onclick="nextStep()" style="padding:3px 8px; font-size:10px;">Next ▶</button>
  </div>
</div>

<label style="display:flex; align-items:center; gap:6px; margin-bottom:12px; font-weight:bold; border-bottom:1px solid #dcdfe3; padding-bottom:8px;">
  <input type="checkbox" id="stabilityToggleInput" onchange="toggle_stabilityToggle(this.checked)">
  Highlight duplicates
</label>

<div class="ce-panel" style="display:flex; flex-direction:column; gap:6px;">
  <label style="font-weight:bold; display:flex; flex-direction:column; gap:3px;">
    Initial array:
    <input id="mergeImplementationInput" value="5, 2, 4, 7, 1, 3, 2, 6" style="width:100%; box-sizing:border-box; font-family:ui-monospace, monospace; font-size:11px; padding:4px; border:1px solid #ccc; border-radius:3px;">
  </label>
  
  <div class="ce-tabs" style="display:flex; gap:4px; margin-top:2px;">
    <button id="tab-sample" class="active" onclick="setTab('sample')">Sample</button>
    <button id="tab-buggy" onclick="setTab('buggy')">Buggy</button>
    <button id="tab-starter" onclick="setTab('starter')">Starter</button>
  </div>
  
  <textarea id="mergeImplementationCode" style="min-height:160px; margin:0; width:100%; box-sizing:border-box; font-family:ui-monospace, Consolas, monospace; font-size:11px; line-height:1.4; padding:6px; border:1px solid #cfd4da; border-radius:4px;"></textarea>
  
  <div style="display:flex; gap:4px; align-items:center; margin-top:2px; flex-wrap:wrap;">
    <button id="ce-run" onclick="runWorker(false)" style="background:#5aabf0; color:#fff; border:none; font-weight:bold; padding:4px 10px;">Run</button>
    <button onclick="goTo(0)" title="First" style="padding:4px 6px;">|&lt;</button>
    <button onclick="goTo(frameIdx-1)" title="Prev" style="padding:4px 6px;">&lt;</button>
    <button id="ce-play" onclick="togglePlay()" style="width:48px; padding:4px 0;">Play</button>
    <button onclick="goTo(frameIdx+1)" title="Next" style="padding:4px 6px;">&gt;</button>
    <button onclick="goTo(frames.length-1)" title="Last" style="padding:4px 6px;">&gt;|</button>
    <span id="ce-counter" style="margin-left:auto; font-size:10px; font-weight:bold; color:#666;">0/0</span>
  </div>
  
  <div id="ce-status" style="font-weight:bold; font-size:11px; margin-top:4px;"></div>
  <div id="ce-message" style="font-family:ui-monospace, Consolas, monospace; font-size:10px; background:#f0f2f5; padding:6px; border-radius:3px; min-height:28px; border:1px solid #e1e4e8; color:#333; line-height:1.4;"></div>
</div>

<style>
  .ce-tabs button { flex:1; padding:4px 0; font-size:10px; border:1px solid #ccc; background:#f9f9f9; cursor:pointer; border-radius:3px; transition: background 0.1s; }
  .ce-tabs button:hover { background:#eaeaea; }
  .ce-tabs button.active { background:#dee2e6; font-weight:bold; border-color:#adb5bd; }
</style>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
const draw = SVG().addTo('#container').size('100%', '100%');
const W = 600;
const H = 460;
setPlotFrame({ xDomain: [0, W], yDomain: [0, H], margin: 0 }); 
draw.viewbox(0, 0, W, H);

// Box locations forming the merge sort tree
const boxDefs = [
    { id: 0, x: 90, y: 360, size: 1 },
    { id: 1, x: 150, y: 360, size: 1 },
    { id: 2, x: 210, y: 360, size: 1 },
    { id: 3, x: 270, y: 360, size: 1 },
    { id: 4, x: 330, y: 360, size: 1 },
    { id: 5, x: 390, y: 360, size: 1 },
    { id: 6, x: 450, y: 360, size: 1 },
    { id: 7, x: 510, y: 360, size: 1 },
    { id: 8, x: 120, y: 260, size: 2 },
    { id: 9, x: 240, y: 260, size: 2 },
    { id: 10, x: 360, y: 260, size: 2 },
    { id: 11, x: 480, y: 260, size: 2 },
    { id: 12, x: 180, y: 160, size: 4 },
    { id: 13, x: 420, y: 160, size: 4 },
    { id: 14, x: 300, y: 60, size: 8 }
];

// Structural mapping from children to parents
const merges = [
    { p: 8, c1: 0, c2: 1 },
    { p: 9, c1: 2, c2: 3 },
    { p: 10, c1: 4, c2: 5 },
    { p: 11, c1: 6, c2: 7 },
    { p: 12, c1: 8, c2: 9 },
    { p: 13, c1: 10, c2: 11 },
    { p: 14, c1: 12, c2: 13 }
];

// Define arrowhead for lines
let defs = draw.defs();
defs.marker('arrowhead', 12, 12, function(add) {
    add.path('M 0 0 L 10 5 L 0 10 z').fill('#888');
}).attr({ refX: 8, refY: 5, orient: 'auto' });

// Groups to manage drawing order (z-index)
const bgGroup = draw.group();
const fgGroup = draw.group();

function drawArrow(group, x1, y1, x2, y2) {
    let dx = x2 - x1, dy = y2 - y1;
    let L = Math.sqrt(dx*dx + dy*dy);
    let ux = dx/L, uy = dy/L;
    let sx = x1 + ux * 8, sy = y1 + uy * 8;
    let ex = x2 - ux * 20, ey = y2 - uy * 20;
    
    group.line(sx, sy, ex, ey).stroke({ width: 5, color: '#888', linecap: 'round' })
         .attr('marker-end', 'url(#arrowhead)');
}

// Draw static structural connections
merges.forEach(m => {
    let p = boxDefs.find(b => b.id === m.p);
    let c1 = boxDefs.find(b => b.id === m.c1);
    let c2 = boxDefs.find(b => b.id === m.c2);
    
    // Arrows from the top center of children toward the bottom quarter-points of the parent
    let qOffset = (p.size * 24) / 4;
    drawArrow(bgGroup, c1.x, c1.y - 15, p.x - qOffset, p.y + 15);
    drawArrow(bgGroup, c2.x, c2.y - 15, p.x + qOffset, p.y + 15);
    
    // Merge labels perfectly halfway vertically
    bgGroup.text("merge").attr({ x: p.x, y: (p.y + c1.y) / 2 })
           .font({ size: 18, anchor: 'middle', family: 'serif' }).fill('#000')
           .attr('dominant-baseline', 'central');
});

// Title text
bgGroup.text("initial sequence").attr({ x: 300, y: 415 })
       .font({ size: 18, anchor: 'middle', family: 'serif' });
bgGroup.text("sorted sequence").attr({ x: 300, y: 15 })
       .font({ size: 18, anchor: 'middle', family: 'serif' });

// Global app state
window.frames = [];
window.frameIdx = 0;
let playing = false;
let playInterval = null;
let stabilityMode = false;
let initialRenderDone = false;

window.toggle_stabilityToggle = function(on) {
    stabilityMode = on;
    renderFrame(frameIdx);
};

const codes = {
    sample: "while (!isEmpty(L) && !isEmpty(R)) {\n    if (peek(L) <= peek(R)) {\n        take(L);\n    } else {\n        take(R);\n    }\n}\nwhile (!isEmpty(L)) take(L);\nwhile (!isEmpty(R)) take(R);",
    buggy: "// BUG: using '<' instead of '<=' breaks stability!\nwhile (!isEmpty(L) && !isEmpty(R)) {\n    if (peek(L) < peek(R)) {\n        take(L);\n    } else {\n        take(R);\n    }\n}\nwhile (!isEmpty(L)) take(L);\nwhile (!isEmpty(R)) take(R);",
    starter: "// Write your merge logic here\n// Use: isEmpty(arr), peek(arr), take(arr)\n"
};

window.setTab = function(name) {
    document.getElementById('mergeImplementationCode').value = codes[name];
    document.querySelectorAll('.ce-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
};
setTab('sample');

window.goTo = function(i) {
    if(frames.length === 0) return;
    if(i < 0) i = 0;
    if(i >= frames.length) i = frames.length - 1;
    frameIdx = i;
    renderFrame(frameIdx);
};

window.togglePlay = function() {
    playing = !playing;
    document.getElementById('ce-play').innerText = playing ? 'Pause' : 'Play';
    if(playing) {
        if(frameIdx >= frames.length - 1) goTo(0);
        playInterval = setInterval(() => {
            if(frameIdx < frames.length - 1) {
                goTo(frameIdx + 1);
            } else {
                togglePlay();
            }
        }, 400); // 400ms per operation ensures it's readable
    } else {
        clearInterval(playInterval);
    }
};

function renderFrame(idx) {
    fgGroup.clear();
    if(!frames || frames.length === 0) return;
    
    let frame = frames[idx];
    let state = frame.state;
    let active = frame.active_merge || [];
    let highlighted = frame.indices || [];

    // Render every box for this state
    boxDefs.forEach(b => {
        let boxItems = state[b.id] || [];
        
        let isDest = active[2] === b.id;
        let isSource = active[0] === b.id || active[1] === b.id;
        
        let strokeColor = '#222';
        let strokeWidth = 1;
        let fillColor = '#e5e5e5';
        
        // Highlight active source arrays and destination array during replay
        if (isDest) { strokeColor = '#2ca02c'; strokeWidth = 2; fillColor = '#eaffea'; }
        else if (isSource) { strokeColor = '#ff7f0e'; strokeWidth = 2; fillColor = '#ffeee0'; }
        
        // Highlight specifically interacting elements (peek or take)
        if (highlighted.includes(b.id)) {
            strokeColor = '#d62728';
            strokeWidth = 3;
        }

        let w = b.size * 24;
        let h = 30;
        let bx = b.x - w / 2;
        let by = b.y - h / 2;
        
        // Draw container
        fgGroup.rect(w, h).attr({ x: bx, y: by })
            .fill(fillColor).stroke({ color: strokeColor, width: strokeWidth, linejoin: 'round' });
        
        // Draw elements inside container
        boxItems.forEach((item, k) => {
            let color = stabilityMode ? (item.color || '#000') : '#000';
            let fontW = stabilityMode && color !== '#000' ? 'bold' : 'normal';
            
            fgGroup.text(String(item.val))
                .attr({ x: bx + k * 24 + 12, y: by + 16 })
                .font({ size: 16, anchor: 'middle', weight: fontW, family: 'serif' })
                .attr('dominant-baseline', 'central')
                .fill(color);
        });
    });
    
    document.getElementById('ce-message').innerText = frame.message || '';
    document.getElementById('ce-counter').innerText = (idx + 1) + ' / ' + frames.length;
}

let workerObj = null;

window.runWorker = function(jumpToLast = false) {
    if(playing) togglePlay();
    if(workerObj) workerObj.terminate();
    
    let btn = document.getElementById('ce-run');
    btn.disabled = true;
    btn.innerText = 'Running...';
    
    let statusEl = document.getElementById('ce-status');
    statusEl.innerText = 'Running...';
    statusEl.style.color = '#555';
    
    let code = document.getElementById('mergeImplementationCode').value;
    let inputStr = document.getElementById('mergeImplementationInput').value;
    
    // A secure worker Blob is created to evaluate user code purely synchronously.
    const workerScript = `
onmessage = function(e) {
    let code = e.data.code;
    let inputStr = e.data.inputStr;
    try {
        let initVals = inputStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        if(initVals.length !== 8) throw new Error("Input must have exactly 8 numbers separated by commas.");

        // Automatically assign tracking IDs and highlight colors to duplicated values
        let firstDup = null;
        let seen = new Set();
        for (let v of initVals) {
            if (seen.has(v)) { firstDup = v; break; }
            seen.add(v);
        }
        let cIdx = 0;
        
        let state = Array.from({length: 15}, () => []);
        for (let i = 0; i < 8; i++) {
            let color = '#000';
            if (initVals[i] === firstDup) {
                if (cIdx === 0) color = '#1f77b4'; // Original left instance (Blue)
                else if (cIdx === 1) color = '#d62728'; // Original right instance (Red)
                cIdx++;
            }
            state[i].push({ val: initVals[i], id: i, color: color });
        }

        let frames = [];
        let opCount = 0;
        const MAX_OPS = 2000;
        let currentL = null, currentR = null, currentDest = null;

        function saveFrame(kind, indices, msg) {
            frames.push({
                kind: kind,
                state: JSON.parse(JSON.stringify(state)), // Deep clone data structural snapshot
                indices: indices,
                active_merge: [currentL, currentR, currentDest],
                message: msg
            });
        }

        saveFrame('init', [], 'Initial state loaded');

        // Controlled API exposure
        function isEmpty(arr) {
            opCount++;
            if(opCount > MAX_OPS) throw new Error("Timeout: Execution ran too long, check for infinite loops.");
            return arr.head >= arr.items.length;
        }

        function peek(arr) {
            opCount++;
            if(opCount > MAX_OPS) throw new Error("Timeout: Execution ran too long.");
            if(isEmpty(arr)) throw new Error("peek() called on an empty sequence (" + arr.name + ")");
            let val = arr.items[arr.head].val;
            saveFrame('peek', [arr.id], 'peek ' + arr.name + ' → ' + val);
            return val;
        }

        function take(arr) {
            opCount++;
            if(opCount > MAX_OPS) throw new Error("Timeout: Execution ran too long.");
            if(isEmpty(arr)) throw new Error("take() called on an empty sequence (" + arr.name + ")");
            let item = arr.items[arr.head];
            arr.head++;
            arr.dest.items.push(item);
            saveFrame('take', [arr.id, arr.dest.id], 'take from ' + arr.name + ' → ' + item.val);
            return item.val;
        }

        // Dynamically compile user trace logic mapping onto safe internal wrappers
        let user_merge = new Function('L', 'R', 'isEmpty', 'peek', 'take', code);

        function doMerge(l_id, r_id, dest_id) {
            currentL = l_id; currentR = r_id; currentDest = dest_id;
            let L = { id: l_id, items: state[l_id], head: 0, dest: { id: dest_id, items: state[dest_id] }, name: 'L' };
            let R = { id: r_id, items: state[r_id], head: 0, dest: { id: dest_id, items: state[dest_id] }, name: 'R' };
            
            user_merge(L, R, isEmpty, peek, take);
            
            if (L.head < L.items.length || R.head < R.items.length) {
                throw new Error("Merge routine completed before consuming all available elements.");
            }
            
            currentL = null; currentR = null; currentDest = null;
            saveFrame('merge_done', [dest_id], 'Merge complete into sorted run.');
        }

        // Run the 7 static merges that compose an 8-element bottom-up merge sort
        doMerge(0, 1, 8);
        doMerge(2, 3, 9);
        doMerge(4, 5, 10);
        doMerge(6, 7, 11);
        doMerge(8, 9, 12);
        doMerge(10, 11, 13);
        doMerge(12, 13, 14);

        let success = true;
        let stabilityIntact = true;
        let finalArr = state[14];
        
        if (finalArr.length !== 8) {
            success = false;
        } else {
            for (let i = 1; i < 8; i++) {
                if (finalArr[i-1].val > finalArr[i].val) success = false;
                if (finalArr[i-1].val === finalArr[i].val && finalArr[i-1].id > finalArr[i].id) stabilityIntact = false;
            }
        }

        postMessage({ type: 'done', frames: frames, success: success, stabilityIntact: stabilityIntact });

    } catch(err) {
        postMessage({ type: 'error', error: err.message });
    }
};
    `;
    
    let blob = new Blob([workerScript], { type: 'application/javascript' });
    workerObj = new Worker(URL.createObjectURL(blob));
    
    let timeoutId = setTimeout(() => {
        workerObj.terminate();
        finishWorkerError("Execution timed out. Check for infinite while loops.");
    }, 1500);
    
    workerObj.onmessage = function(e) {
        clearTimeout(timeoutId);
        btn.disabled = false;
        btn.innerText = 'Run';
        
        if (e.data.type === 'error') {
            finishWorkerError(e.data.error);
        } else {
            frames = e.data.frames;
            let msg = '';
            let color = '';
            if (e.data.success) {
                if (!e.data.stabilityIntact) {
                    msg = 'Sorted, but Unstable! (Elements swapped relative order)';
                    color = '#d62728'; // Red
                } else {
                    msg = 'Success! Correct and stable.';
                    color = '#2ca02c'; // Green
                }
            } else {
                msg = 'Wrong Answer (Resulting array not properly sorted)';
                color = '#ff7f0e'; // Orange
            }
            
            statusEl.innerText = msg;
            statusEl.style.color = color;
            
            if (jumpToLast) {
                goTo(frames.length - 1);
            } else {
                goTo(0);
            }
            
            if (!initialRenderDone) {
                window.__markRendered();
                initialRenderDone = true;
            }
        }
    };
    
    workerObj.postMessage({ code: code, inputStr: inputStr });
};

function finishWorkerError(errMsg) {
    document.getElementById('ce-run').disabled = false;
    document.getElementById('ce-run').innerText = 'Run';
    document.getElementById('ce-status').innerText = 'Code Error / Incomplete';
    document.getElementById('ce-status').style.color = '#d62728';
    
    if(!frames) frames = [];
    let stateCopy = frames.length > 0 ? JSON.parse(JSON.stringify(frames[frames.length-1].state)) : Array.from({length: 15}, () => []);
    frames.push({
        kind: 'error',
        state: stateCopy,
        indices: [],
        active_merge: [],
        message: 'Error: ' + errMsg
    });
    goTo(frames.length - 1);
    
    if (!initialRenderDone) {
        window.__markRendered();
        initialRenderDone = true;
    }
}

const steps = [
    {
        title: "The Merge Process",
        narration: "Merge sort works bottom-up. It treats each element as a sorted run of length 1, then merges adjacent pairs into sorted runs of length 2, 4, and finally 8.",
        state: { stability: false }
    },
    {
        title: "Algorithm Stability",
        narration: "Notice the two '2's. A stable sort keeps them in their original order. Using '<=' instead of '<' in the merge condition guarantees the left '2' is taken first when they tie. Try running the buggy code to see stability break!",
        state: { stability: true }
    }
];

let currentStep = 0;
window.applyStep = function(i) {
    if(i < 0) i = 0;
    if(i >= steps.length) i = steps.length - 1;
    currentStep = i;
    
    document.getElementById('demoNarration').innerText = steps[i].narration;
    document.getElementById('stepLabel').innerText = (i + 1) + " / " + steps.length;
    
    let isStab = steps[i].state.stability;
    document.getElementById('stabilityToggleInput').checked = isStab;
    stabilityMode = isStab;
    
    if (i === 1) {
        setTab('buggy');
    } else {
        setTab('sample');
    }
    
    // Auto-run and jump straight to the end state for educational clarity on step switch
    runWorker(true);
};

window.prevStep = function() { applyStep(currentStep - 1); };
window.nextStep = function() { applyStep(currentStep + 1); };

// Initialize demo (will internally invoke runWorker(true) and then call __markRendered)
applyStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
