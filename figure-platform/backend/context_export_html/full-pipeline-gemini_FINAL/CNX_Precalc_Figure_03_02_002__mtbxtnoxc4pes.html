<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<div style="background:#f9fafb; border:1px solid #e2e8f0; border-radius:6px; padding:12px; margin-bottom:12px;">
  <h4 id="demoTitle" style="margin:0 0 6px 0; font-size:13px; color:#1e293b;">Anatomy of a parabola</h4>
  <p id="demoNarration" style="margin:0 0 10px 0; font-size:11px; line-height:1.5; color:#475569;">
    A quadratic graph forms a U-shaped curve called a parabola. Its key features help us understand its position, shape, and mathematical behavior.
  </p>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <button onclick="prevStep()" style="padding:3px 10px;">◀</button>
    <span id="stepLabel" style="font-size:11px; font-weight:600; color:#334155;">Step 1 / 4</span>
    <button onclick="nextStep()" style="padding:3px 10px;">▶</button>
  </div>
</div>

<label>Highlight features:
  <select id="featureHighlightInput" onchange="update_featureHighlight(this.value)" style="margin-top:2px; padding:4px; border-radius:4px; border:1px solid #ccc; font-family:sans-serif; font-size:11px;">
    <option value="All features" selected>All features</option>
    <option value="Vertex & Symmetry">Vertex & Symmetry</option>
    <option value="Intercepts">Intercepts</option>
  </select>
</label>

<label style="margin-top:8px;">Vertex x-position: <output id="vertexXVal">1</output>
  <input id="vertexXInput" type="range" min="-3" max="3" step="1" value="1" oninput="document.getElementById('vertexXVal').value=this.value;update_vertexX(+this.value)">
</label>

<label>Vertex y-position: <output id="vertexYVal">-4</output>
  <input id="vertexYInput" type="range" min="-5" max="2" step="1" value="-4" oninput="document.getElementById('vertexYVal').value=this.value;update_vertexY(+this.value)">
</label>

<label>Vertical stretch (a): <output id="verticalStretchVal">1</output>
  <input id="verticalStretchInput" type="range" min="0.25" max="2" step="0.25" value="1" oninput="document.getElementById('verticalStretchVal').value=this.value;update_verticalStretch(+this.value)">
</label>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

const container = document.getElementById('container');
container.innerHTML = '<canvas style="width:100%;height:100%;display:block;"></canvas>';
const canvas = container.querySelector('canvas');
const ctx = canvas.getContext('2d');

const state = { vX: 1, vY: -4, a: 1, highlight: "All features" };

// Calculate accurate curve points clipped right at the edge of the visible frame
function getParabolaData(vX, vY, a) {
    let x_start = -6.5;
    let y_start = a * Math.pow(-6.5 - vX, 2) + vY;
    if (y_start > 6.5) {
        x_start = vX - Math.sqrt((6.5 - vY) / a);
    }
    
    let x_end = 6.5;
    let y_end = a * Math.pow(6.5 - vX, 2) + vY;
    if (y_end > 6.5) {
        x_end = vX + Math.sqrt((6.5 - vY) / a);
    }

    const data = [];
    const steps = 100;
    for (let i = 0; i <= steps; i++) {
        const x = x_start + (x_end - x_start) * (i / steps);
        const y = a * Math.pow(x - vX, 2) + vY;
        data.push({ x, y });
    }
    return data;
}

// Compute key points and their highlight opacities depending on current mode
function getKeyPoints(st) {
    const pts = [];
    const colors = [];
    const alphaSym = (st.highlight === 'All features' || st.highlight === 'Vertex & Symmetry') ? 1 : 0.15;
    const alphaInt = (st.highlight === 'All features' || st.highlight === 'Intercepts') ? 1 : 0.15;

    pts.push({ x: st.vX, y: st.vY });
    colors.push(`rgba(0, 0, 0, ${alphaSym})`);

    const yInt = st.a * st.vX * st.vX + st.vY;
    pts.push({ x: 0, y: yInt });
    colors.push(`rgba(0, 0, 0, ${alphaInt})`);

    pts.push({ x: 2 * st.vX, y: yInt });
    colors.push(`rgba(0, 0, 0, ${alphaSym})`);

    const y0 = -st.vY / st.a;
    if (y0 >= 0) {
        const dx = Math.sqrt(y0);
        pts.push({ x: st.vX - dx, y: 0 });
        colors.push(`rgba(0, 0, 0, ${alphaInt})`);
        if (dx > 0) {
            pts.push({ x: st.vX + dx, y: 0 });
            colors.push(`rgba(0, 0, 0, ${alphaInt})`);
        }
    }
    return { pts, colors };
}

// Drawing utilities
function drawArrowhead(ctx, fromX, fromY, toX, toY, color, size = 6) {
    const angle = Math.atan2(toY - fromY, toX - fromX);
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - size * Math.cos(angle - Math.PI / 6), toY - size * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(toX - size * Math.cos(angle + Math.PI / 6), toY - size * Math.sin(angle + Math.PI / 6));
    ctx.fillStyle = color;
    ctx.fill();
}

function drawArrow(ctx, fromX, fromY, toX, toY, color = '#000', lineWidth = 1) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    const angle = Math.atan2(toY - fromY, toX - fromX);
    const headLen = 6;
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
}

function drawTextWithHalo(ctx, text, x, y, font = '15px "Times New Roman", serif') {
    ctx.save();
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#fff';
    ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = '#000';
    ctx.fillText(text, x, y);
    ctx.restore();
}

// Custom plugin to render all rich annotations perfectly tracking the data coords
const customAnnotationsPlugin = {
    id: 'customAnnotations',
    afterDraw(chart) {
        const ctx = chart.ctx;
        const xAxis = chart.scales.x;
        const yAxis = chart.scales.y;
        const st = chart.options.plugins.customAnnotations.simState;
        
        const xMin = xAxis.getPixelForValue(-6.5);
        const xMax = xAxis.getPixelForValue(6.5);
        const yMin = yAxis.getPixelForValue(-6.5);
        const yMax = yAxis.getPixelForValue(6.5);
        const zeroX = xAxis.getPixelForValue(0);
        const zeroY = yAxis.getPixelForValue(0);

        // Axis arrows
        drawArrowhead(ctx, xMax - 10, zeroY, xMax, zeroY, '#000', 8);
        drawArrowhead(ctx, xMin + 10, zeroY, xMin, zeroY, '#000', 8);
        drawArrowhead(ctx, zeroX, yMax + 10, zeroX, yMax, '#000', 8);
        drawArrowhead(ctx, zeroX, yMin - 10, zeroX, yMin, '#000', 8);

        // Axis labels
        drawTextWithHalo(ctx, 'x', xMax - 10, zeroY - 15, 'italic 18px "Times New Roman", serif');
        drawTextWithHalo(ctx, 'y', zeroX + 15, yMax + 10, 'italic 18px "Times New Roman", serif');

        // Curve outward arrows
        const meta = chart.getDatasetMeta(0);
        if (meta.data.length >= 2) {
            const p0 = meta.data[0], p1 = meta.data[1];
            drawArrowhead(ctx, p1.x, p1.y, p0.x, p0.y, '#147696', 7);
            const pn = meta.data[meta.data.length - 1], pn_1 = meta.data[meta.data.length - 2];
            drawArrowhead(ctx, pn_1.x, pn_1.y, pn.x, pn.y, '#147696', 7);
        }

        const alphaAll = 1, alphaFade = 0.15;
        const alphaSymmetry = (st.highlight === 'All features' || st.highlight === 'Vertex & Symmetry') ? alphaAll : alphaFade;
        const alphaIntercepts = (st.highlight === 'All features' || st.highlight === 'Intercepts') ? alphaAll : alphaFade;
        const defaultFont = '15.5px "Times New Roman", serif';

        // 1. Vertex Annotation
        ctx.globalAlpha = alphaSymmetry;
        const vXpx = xAxis.getPixelForValue(st.vX);
        const vYpx = yAxis.getPixelForValue(st.vY);

        let vLabelDataX = st.vX + 1.8;
        if (vLabelDataX > 5) vLabelDataX = st.vX - 1.8;
        let vLabelDataY = st.vY - 1.2;
        if (vLabelDataY < -5.5) vLabelDataY = st.vY + 1.2;

        const vLabelX = xAxis.getPixelForValue(vLabelDataX);
        const vLabelY = yAxis.getPixelForValue(vLabelDataY);

        drawTextWithHalo(ctx, 'Vertex', vLabelX, vLabelY, defaultFont);
        const vArrowStartX = vLabelX + (vLabelDataX > st.vX ? -25 : 25);
        const vArrowStartY = vLabelY + (vLabelDataY > st.vY ? -10 : 10);
        drawArrow(ctx, vArrowStartX, vArrowStartY, vXpx + (vLabelDataX > st.vX ? 5 : -5), vYpx + (vLabelDataY > st.vY ? 5 : -5), '#000', 1.5);

        // 2. Axis of symmetry Annotation
        let symLabelDataX = st.vX + 2.5;
        if (symLabelDataX > 5) symLabelDataX = st.vX - 2.5;
        if (symLabelDataX < -5) symLabelDataX = st.vX + 2.5;

        const symLabelX = xAxis.getPixelForValue(symLabelDataX);
        const symLabelY = yAxis.getPixelForValue(5);
        drawTextWithHalo(ctx, 'Axis of symmetry', symLabelX, symLabelY, defaultFont);
        
        const symArrowStartX = symLabelX + (symLabelDataX > st.vX ? -60 : 60); 
        drawArrow(ctx, symArrowStartX, symLabelY, vXpx + (symLabelDataX > st.vX ? 5 : -5), symLabelY, '#000', 1.5);

        // 3. y-intercept Annotation
        ctx.globalAlpha = alphaIntercepts;
        const yInt = st.a * st.vX * st.vX + st.vY;
        let yIntDraw = yInt;
        if (yIntDraw > 6) yIntDraw = 5.5; 
        if (yIntDraw < -6) yIntDraw = -5.5;
        
        const yIntXpx = zeroX;
        const yIntYpx = yAxis.getPixelForValue(yInt);

        let yLabelDataX = -2.5;
        if (st.vX < 0) yLabelDataX = 2.5; 
        const yLabelX = xAxis.getPixelForValue(yLabelDataX);
        const yLabelY = yAxis.getPixelForValue(yIntDraw - 0.5);

        drawTextWithHalo(ctx, 'y-intercept', yLabelX, yLabelY, defaultFont);
        const yArrowStartX = yLabelX + (yLabelDataX > 0 ? -40 : 40);
        drawArrow(ctx, yArrowStartX, yLabelY, yIntXpx + (yLabelDataX > 0 ? 5 : -5), yIntYpx + (yInt > yIntDraw-0.5 ? -5 : 5), '#000', 1.5);

        // 4. x-intercepts Annotation
        const y0 = -st.vY / st.a;
        if (y0 >= 0) {
            const dx = Math.sqrt(y0);
            const x1 = st.vX - dx;
            const x2 = st.vX + dx;
            
            const x1px = xAxis.getPixelForValue(x1);
            const x2px = xAxis.getPixelForValue(x2);
            
            let rightMostX = Math.max(x1, x2);
            let xLabelDataX = rightMostX + 1.8;
            if (xLabelDataX > 5) xLabelDataX = Math.min(x1, x2) - 1.8;
            if (xLabelDataX < -5) xLabelDataX = 0; 
            
            const xLabelX = xAxis.getPixelForValue(xLabelDataX);
            const xLabelY = yAxis.getPixelForValue(1.5);

            drawTextWithHalo(ctx, 'x-intercepts', xLabelX, xLabelY, defaultFont);
            
            const xArrowStartX = xLabelX + (xLabelDataX > rightMostX ? -45 : (xLabelDataX < Math.min(x1,x2) ? 45 : 0));
            drawArrow(ctx, xArrowStartX, xLabelY - 10, x2px + (x2 > xLabelDataX ? -5 : 5), zeroY - 6, '#000', 1.5);
            if (dx > 0) {
                drawArrow(ctx, xArrowStartX, xLabelY - 10, x1px + (x1 > xLabelDataX ? -5 : 5), zeroY - 6, '#000', 1.5);
            }
        }
        ctx.globalAlpha = 1;
    }
};

const initialKeyPts = getKeyPoints(state);

const chartConfig = {
    type: 'line',
    data: {
        datasets: [
            {
                type: 'line',
                data: getParabolaData(state.vX, state.vY, state.a),
                borderColor: '#147696',
                borderWidth: 2.5,
                pointRadius: 0,
                fill: false,
                tension: 0
            },
            {
                type: 'line',
                data: [{x: state.vX, y: -6.5}, {x: state.vX, y: 6.5}],
                borderColor: 'rgba(204, 0, 0, 1)',
                borderWidth: 2,
                borderDash: [6, 6],
                pointRadius: 0,
                fill: false
            },
            {
                type: 'scatter',
                data: initialKeyPts.pts,
                backgroundColor: initialKeyPts.colors,
                pointRadius: 5.5,
                hoverRadius: 8
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: 25 },
        animation: { duration: 350 },
        plugins: {
            legend: { display: false },
            tooltip: { enabled: false },
            customAnnotations: { simState: state }
        },
        scales: {
            x: {
                type: 'linear',
                min: -6.5, max: 6.5,
                afterBuildTicks: (axis) => {
                    axis.ticks = [];
                    for (let i = -6; i <= 6; i++) axis.ticks.push({ value: i });
                },
                ticks: {
                    callback: (val) => (val !== 0 && val % 2 === 0) ? val : '',
                    font: { size: 14, family: '"Times New Roman", serif' }
                },
                grid: {
                    color: (ctx) => ctx.tick.value === 0 ? '#000' : '#d1d5db',
                    borderDash: (ctx) => ctx.tick.value === 0 ? [] : [3, 4],
                    lineWidth: (ctx) => ctx.tick.value === 0 ? 1.5 : 1,
                    drawTicks: false,
                },
                border: { display: false }
            },
            y: {
                type: 'linear',
                min: -6.5, max: 6.5,
                afterBuildTicks: (axis) => {
                    axis.ticks = [];
                    for (let i = -6; i <= 6; i++) axis.ticks.push({ value: i });
                },
                ticks: {
                    callback: (val) => (val !== 0 && val % 2 === 0) ? val : '',
                    font: { size: 14, family: '"Times New Roman", serif' }
                },
                grid: {
                    color: (ctx) => ctx.tick.value === 0 ? '#000' : '#d1d5db',
                    borderDash: (ctx) => ctx.tick.value === 0 ? [] : [3, 4],
                    lineWidth: (ctx) => ctx.tick.value === 0 ? 1.5 : 1,
                    drawTicks: false
                },
                border: { display: false }
            }
        },
        onHover: (e, activeElements) => {
            if (activeElements.length > 0) {
                const el = activeElements[0];
                if (el.datasetIndex === 2) {
                    e.native.target.style.cursor = 'pointer';
                    const idx = el.index;
                    let label = '';
                    if (idx === 0) label = "Vertex: The turning point of the parabola.";
                    else if (idx === 1) label = "y-intercept: Where the curve crosses the y-axis (x=0).";
                    else if (idx === 2) label = "Mirror point: Symmetrical match to the y-intercept across the axis of symmetry.";
                    else if (idx === 3 || idx === 4) label = "x-intercept: Where the curve crosses the x-axis (y=0).";
                    showTooltip(label, e.native);
                    return;
                }
            }
            e.native.target.style.cursor = 'default';
            hideTooltip();
        },
        onClick: (e, activeElements) => {
            if (activeElements.length > 0) {
                const el = activeElements[0];
                if (el.datasetIndex === 2) {
                    const idx = el.index;
                    let title = '', body = '';
                    if (idx === 0) {
                        title = "Vertex";
                        body = "The vertex is the minimum or maximum point of the parabola. It lies exactly on the axis of symmetry and dictates the overall position of the shape.";
                    } else if (idx === 1) {
                        title = "y-intercept";
                        body = "The y-intercept occurs when x=0. Evaluating the quadratic equation at x=0 yields the height at which the parabola crosses the vertical axis.";
                    } else if (idx === 2) {
                        title = "Mirrored point";
                        body = "Because the parabola is perfectly symmetric, the y-intercept has a partner point located at exactly the same horizontal distance on the opposite side of the axis of symmetry.";
                    } else if (idx === 3 || idx === 4) {
                        title = "x-intercept(s)";
                        body = "The x-intercepts (or roots) occur when y=0. Depending on the vertex's vertical position and the stretch factor, a parabola can cross the x-axis twice, once, or not at all.";
                    }
                    showPopup(title, body);
                }
            } else {
                hidePopup();
            }
        }
    },
    plugins: [customAnnotationsPlugin]
};

const myChart = new Chart(canvas, chartConfig);
window.__markRendered();

function updateChart() {
    myChart.data.datasets[0].data = getParabolaData(state.vX, state.vY, state.a);
    myChart.data.datasets[1].data = [{x: state.vX, y: -6.5}, {x: state.vX, y: 6.5}];
    const symAlpha = (state.highlight === 'All features' || state.highlight === 'Vertex & Symmetry') ? 1 : 0.15;
    myChart.data.datasets[1].borderColor = `rgba(204, 0, 0, ${symAlpha})`;

    const kp = getKeyPoints(state);
    myChart.data.datasets[2].data = kp.pts;
    myChart.data.datasets[2].backgroundColor = kp.colors;

    myChart.options.plugins.customAnnotations.simState = state;
    myChart.update();
}

window.update_featureHighlight = function(val) { state.highlight = val; updateChart(); };
window.update_vertexX = function(val) { state.vX = val; updateChart(); };
window.update_vertexY = function(val) { state.vY = val; updateChart(); };
window.update_verticalStretch = function(val) { state.a = val; updateChart(); };

const demoSteps = [
    {
      title: "Anatomy of a parabola",
      narration: "A quadratic graph forms a U-shaped curve called a parabola. Its key features help us understand its position, shape, and mathematical behavior.",
      state: { featureHighlight: "All features", vertexX: 1, vertexY: -4, verticalStretch: 1 }
    },
    {
      title: "Vertex and Symmetry",
      narration: "The vertex is the turning point. The axis of symmetry runs exactly through it, acting as a mirror—every point on the left has a matching partner on the right.",
      state: { featureHighlight: "Vertex & Symmetry", vertexX: 1, vertexY: -4, verticalStretch: 1 }
    },
    {
      title: "Moving the anchor",
      narration: "If we shift the vertex horizontally, the axis of symmetry and the entire mirrored structure move in lockstep.",
      state: { featureHighlight: "Vertex & Symmetry", vertexX: -2, vertexY: -4, verticalStretch: 1 }
    },
    {
      title: "Intercepts and stretch",
      narration: "The intercepts are where the curve crosses the grid's axes. Altering the parabola's width changes the distance between x-intercepts, and shifting it vertically can remove them entirely.",
      state: { featureHighlight: "Intercepts", vertexX: -2, vertexY: -1, verticalStretch: 0.5 }
    }
];

let currentStep = 0;
window.applyStep = function(index) {
    currentStep = index;
    const step = demoSteps[currentStep];
    
    document.getElementById('demoTitle').innerText = step.title;
    document.getElementById('demoNarration').innerText = step.narration;
    document.getElementById('stepLabel').innerText = `Step ${currentStep + 1} / ${demoSteps.length}`;
    
    document.getElementById('featureHighlightInput').value = step.state.featureHighlight;
    document.getElementById('vertexXInput').value = step.state.vertexX;
    document.getElementById('vertexYInput').value = step.state.vertexY;
    document.getElementById('verticalStretchInput').value = step.state.verticalStretch;
    
    document.getElementById('vertexXVal').value = step.state.vertexX;
    document.getElementById('vertexYVal').value = step.state.vertexY;
    document.getElementById('verticalStretchVal').value = step.state.verticalStretch;
    
    state.highlight = step.state.featureHighlight;
    state.vX = step.state.vertexX;
    state.vY = step.state.vertexY;
    state.a = step.state.verticalStretch;
    
    updateChart();
};

window.prevStep = function() {
    if (currentStep > 0) window.applyStep(currentStep - 1);
};

window.nextStep = function() {
    if (currentStep < demoSteps.length - 1) window.applyStep(currentStep + 1);
};
