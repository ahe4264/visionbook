<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0;font-size:10px;max-width:180px"></p>
<span style="white-space:nowrap"><button onclick="prevStep()">◀</button> <span id="stepLabel"></span> <button onclick="nextStep()">▶</button></span>
<span style="font-weight:bold;border-top:1px solid #ccc;padding-top:4px">Active merge tier</span>
<button id="mlBtn0" onclick="setMergeLevel(0)">level 1: singletons → pairs</button>
<button id="mlBtn1" onclick="setMergeLevel(1)">level 2: pairs → quads</button>
<button id="mlBtn2" onclick="setMergeLevel(2)">level 3: quads → final</button>
<label><input id="stabilityTraceInput" type="checkbox" onchange="toggle_stabilityTrace(this.checked)"> Stability trace: tag duplicate 2s</label>
<span style="font-weight:bold;border-top:1px solid #ccc;padding-top:4px">Implement merge(left, right)</span>
<span style="white-space:nowrap"><button onclick="loadCode('sample')">sample</button> <button onclick="loadCode('buggy')">buggy (strict &lt;)</button> <button onclick="loadCode('starter')">starter</button></span>
<textarea id="mergeImplementationCode" spellcheck="false"></textarea>
<label>Runs to merge (left | right) <input id="mergeImplementationInput" type="text" value="2, 4, 5, 7 | 1, 2, 3, 6" style="width:100%;box-sizing:border-box"></label>
<button id="runBtn" onclick="trigger_runMerge()">▶ Run merge</button>
<span id="mergeStatus" style="font-weight:bold;color:#666">not run yet</span>
<span style="white-space:nowrap"><button onclick="replayFirst()">⏮</button> <button onclick="replayPrev()">◀</button> <button id="playBtn" onclick="replayPlayPause()">▶</button> <button onclick="replayNext()">⏭</button> <select id="speedSel" onchange="setSpeed(+this.value)"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select> <span id="frameCounter"></span></span>
<span id="replayCaption" style="font-size:10px;font-style:italic"></span>
<textarea id="replayLog" readonly spellcheck="false" style="min-height:70px;font-size:10px;background:#fdfdfd"></textarea>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);

     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.

        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.

            'plotParametric: setX, setY).'

     *            or an array of any of those.

     * good curve is kept and the message is shown inline — this function NEVER

     *

        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

function parseRuns(str) {
  var parts = String(str).split('|');
  if (parts.length !== 2) throw new Error('expected two runs separated by |');
  function parseSide(s) {
    var toks = s.split(',').map(function(t){return t.trim();}).filter(function(t){return t.length;});
    if (!toks.length) throw new Error('a run is empty');
    var nums = toks.map(Number);
    if (nums.some(function(n){ return !isFinite(n); })) throw new Error('runs must be numbers separated by commas');
    if (nums.length > 8) throw new Error('runs can have at most 8 values');
    return nums;
  }
  return { left: parseSide(parts[0]), right: parseSide(parts[1]) };
}
function eqArr(a, b) {
  if (a.length !== b.length) return false;
  for (var q = 0; q < a.length; q++) if (a[q] !== b[q]) return false;
  return true;

function findMerge(lv, rv) {

/* ── worker: run student code with framing API ──────────────────── */
var workerFn = function () {
  var L = [], R = [], out = [], li = 0, ri = 0, frames = [], ops = 0, t0 = 0;
  var MAXOPS = 3000, MAXFRAMES = 600, LIMIT = 1500;
  function tick() {
    if (Date.now() - t0 > LIMIT) throw new Error('time limit exceeded — check for an infinite loop');
    if (++ops > MAXOPS) throw new Error('operation limit exceeded');
  }
  function copyOut() { return out.map(function(e){ return {v:e.v, tag:e.tag, uid:e.uid}; }); }
  function snap(kind, indices, msg) {
    frames.push({kind:kind, indices:indices, message:msg, state:{li:li, ri:ri, out:copyOut()}});
    if (frames.length > MAXFRAMES) throw new Error('frame limit exceeded');
  }
  function arrOf(side) {
    if (side === 'left') return L; if (side === 'right') return R;
    throw new Error('side must be "left" or "right", got ' + JSON.stringify(side));
  }
  function fmt(e) { return e ? String(e.v) : 'undefined'; }
  function front(side) {
    tick(); var A = arrOf(side); var idx = (side === 'left') ? li : ri; var e = A[idx];
    snap('front', [{side:side, index:idx}], 'front("' + side + '") -> ' + fmt(e) + (e ? '' : ' (run is empty)'));
    return e ? e.v : undefined;
  }
  function isEmpty(side) {
    tick(); var A = arrOf(side); var idx = (side === 'left') ? li : ri; var empty = idx >= A.length;
    snap('isempty', [{side:side, index:Math.min(idx, A.length-1)}], 'isEmpty("' + side + '") -> ' + empty);
    return empty;
  }
  function lessOrEqual(a, b) {
    tick(); var r = (a <= b);
    snap('compare', [{side:'left', index:li}, {side:'right', index:ri}],
      'is ' + a + ' <= ' + b + ' ? -> ' + r + ((a === b && r) ? '  (tie -> prefer LEFT, keeps the sort stable)' : ''));
    return r;
  }
  function take(side) {
    tick(); var A = arrOf(side); var idx = (side === 'left') ? li : ri; var e = A[idx];
    if (!e) throw new Error('take("' + side + '") on an empty run');
    if (side === 'left') li++; else ri++;
    out.push(e);
    snap('take', [{side:side, index:idx}, {side:'out', index:out.length-1}],
      'take ' + e.v + (e.tag ? '(' + e.tag + ')' : '') + ' from ' + side + ' -> output[' + (out.length-1) + ']');
    return e.v;
  }
  function note(t) { tick(); snap('note', [], String(t)); }
  onmessage = function (ev) {
    var d = ev.data;
    L = d.left; R = d.right; out = []; li = 0; ri = 0; frames = []; ops = 0; t0 = Date.now();
    var fn;
    try {
      fn = new Function('front','isEmpty','lessOrEqual','take','note',
        '"use strict";\n' + d.code + '\n;if (typeof merge === "function") { merge("left","right"); }');
    } catch (e1) {
      postMessage({ok:false, error:'Syntax error: ' + (e1 && e1.message ? e1.message : e1), frames:[]});
      return;
    }
    try {
      fn(front, isEmpty, lessOrEqual, take, note);
      snap('done', [], 'merge returned — output holds ' + out.length + ' value(s)');
      postMessage({ok:true, frames:frames});
    } catch (e2) {
      postMessage({ok:false, error:String((e2 && e2.message) || e2), frames:frames});
    }
  };
};

function uidRank(u) { return u.charAt(0) === 'L' ? (+u.slice(1)) : 10000 + (+u.slice(1)); }
function checkResult(out, total) {
  if (out.length < total) return { ok:false, why:'only ' + out.length + ' of ' + total + ' values were taken — the merge must drain both runs' };
  for (var q = 1; q < out.length; q++)
    if (out[q].v < out[q-1].v) return { ok:false, why:'output is not non-decreasing (' + out[q-1].v + ' before ' + out[q].v + ')' };
  var pairs = [];
  for (var a = 0; a < out.length; a++) for (var b = a+1; b < out.length; b++)
    if (out[a].v === out[b].v && uidRank(out[a].uid) > uidRank(out[b].uid)) pairs.push([a, b]);
  if (pairs.length) return { ok:false, pairs:pairs, why:"sorted, but UNSTABLE — a tie took the right run's 2 before the left run's 2 (use <=, not <)" };
  return { ok:true };
}

var currentWorker = null;

  frames = data.frames || [];
  if (!data.ok) {
    var st = frames.length ? frames[frames.length-1].state : {li:0, ri:0, out:[]};
    frames.push({kind:'error', indices:[], message:'⚠ ' + (data.error || 'unknown error'), state:st});
  }
  wrongPairs = [];
  if (!frames.length) { setStatus('⚠ ' + (data.error || 'no frames produced'), '#c0392b'); return; }
  if (!data.ok) {
    runVerdict = 'error';
    setStatus('⚠ error — see the last replay frame', '#c0392b');
  } else {
    var out = frames[frames.length-1].state.out;
    var chk = checkResult(out, activeMerge.left.els.length + activeMerge.right.els.length);
    if (chk.ok) { runVerdict = 'correct'; setStatus('✓ correct — sorted AND stable: ties took the LEFT run', '#1e8449'); }
    else { runVerdict = 'wrong'; wrongPairs = chk.pairs || []; setStatus('✗ ' + chk.why, '#c0392b'); }
  }
  frameIdx = 0;
  drawFrame(0);
}

/* ── replay drawing ─────────────────────────────────────────────── */
var KINDCOLOR = { compare:'#e67e22', take:'#1e8449', front:'#5dade2', isempty:'#85c1e9', note:'#888' };
function paintRun(node, ptr, color) {
  for (var q = 0; q < node.cells.length; q++) {
    var c = node.cells[q], el = node.els[q];
    if (q < ptr) {
      c.bg.fill('#f6f6f6'); c.text.fill('#b4b4b4');
      c.tag.opacity(traceOn && el.tag ? 0.35 : 0);
    } else {
      c.bg.fill('#e7e7e7'); c.text.fill('#111');
      c.tag.opacity(traceOn && el.tag ? 1 : 0);
    }
    if (q === ptr) {
      overlayG.rect(CW-10, RH-10).move(c.x+5, node.y+5).fill('none').stroke({color:color, width:3});
      overlayG.polygon((c.cx-7)+','+(node.y+6)+' '+(c.cx+7)+','+(node.y+6)+' '+c.cx+','+(node.y+17)).fill(color);
    }
  }
}
function drawFrame(idx) {
  if (!activeMerge || !frames.length) return;
  frameIdx = idx;
  var f = frames[idx];
  var P = activeMerge.parent, L = activeMerge.left, R = activeMerge.right;
  overlayG.clear();
  resetNodeDisplay(P); resetNodeDisplay(L); resetNodeDisplay(R);
  [P, L, R].forEach(function (nd) {
    overlayG.rect(nd.w+10, RH+10).move(nd.x-5, nd.y-5).fill('none')
      .stroke({color:'#2e86c1', width:2, opacity:0.55}).attr('stroke-dasharray','6,4');
  });
  var st = f.state, out = st.out;
  for (k = 0; k < P.cells.length; k++) {
    var pc = P.cells[k];
    if (k < out.length) {
      pc.text.text(String(out[k].v)).fill('#111').opacity(1);
      if (out[k].tag) { pc.tag.text(out[k].tag).fill(TAGC[out[k].tag]).opacity(traceOn ? 1 : 0); } else pc.tag.opacity(0);
    } else { pc.text.text(''); pc.tag.opacity(0); }
    if (k === out.length && f.kind !== 'done' && f.kind !== 'error') {
      overlayG.rect(CW-8, RH-8).move(pc.x+4, P.y+4).fill('none').stroke({color:'#7d6608', width:2}).attr('stroke-dasharray','4,3');
    }
  }
  paintRun(L, st.li, '#0b7fab');
  paintRun(R, st.ri, '#c25e10');
  var col = KINDCOLOR[f.kind] || '#888';
  (f.indices || []).forEach(function (ix) {
    var cell = null, ny = 0;
    if (ix.side === 'left' && L.cells[ix.index])  { cell = L.cells[ix.index];  ny = L.y; }
    if (ix.side === 'right' && R.cells[ix.index]) { cell = R.cells[ix.index];  ny = R.y; }
    if (ix.side === 'out' && P.cells[ix.index])   { cell = P.cells[ix.index];  ny = P.y; }
    if (cell) overlayG.rect(CW-6, RH-6).move(cell.x+3, ny+3).fill('none').stroke({color:col, width:3});
  });
  if (idx === frames.length-1) {
    if (runVerdict === 'correct') {
      overlayG.rect(P.w+14, RH+14).move(P.x-7, P.y-7).fill('none').stroke({color:'#1e8449', width:4});
    } else if (wrongPairs.length) {
      wrongPairs.forEach(function (pr) {
        [pr[0], pr[1]].forEach(function (kk) {
          if (P.cells[kk]) overlayG.rect(CW-4, RH-4).move(P.cells[kk].x+2, P.y+2).fill('none').stroke({color:'#c0392b', width:4});
        });
      });
    }
  }
  var cap = document.getElementById('replayCaption');
  cap.textContent = f.message;
  cap.style.color = f.kind === 'error' ? '#c0392b' : '#333';
  document.getElementById('frameCounter').textContent = (idx+1) + ' of ' + frames.length;
  var log = document.getElementById('replayLog');
  var lines = [];
  for (var q = 0; q <= idx; q++) lines.push((q+1) + '. ' + frames[q].message);
  log.value = lines.join('\n');
  log.scrollTop = log.scrollHeight;
}

/* ── playback controls ──────────────────────────────────────────── */
function pause() {
  playing = false;
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  var pb = document.getElementById('playBtn'); if (pb) pb.textContent = '▶';
}
function scheduleNext() {
  if (!playing) return;
  if (frameIdx >= frames.length-1) { pause(); return; }
  playTimer = setTimeout(function () {
    if (!playing) return;
    frameIdx++; drawFrame(frameIdx); scheduleNext();
  }, 550 / speed);
}
function replayFirst() { if (!frames.length) return; pause(); drawFrame(0); }
function replayPrev()  { if (!frames.length) return; pause(); if (frameIdx > 0) drawFrame(frameIdx-1); }
function replayNext()  { if (!frames.length) return; pause(); if (frameIdx < frames.length-1) drawFrame(frameIdx+1); }
function replayPlayPause() {
  if (!frames.length) return;
  if (playing) { pause(); return; }
  if (frameIdx >= frames.length-1) frameIdx = -1;
  if (frameIdx < 0) { frameIdx = 0; drawFrame(0); }
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  scheduleNext();
}
function setSpeed(v) { speed = v; }

/* ── demo steps ─────────────────────────────────────────────────── */
var STEPS = [
  { title:'Read the lattice bottom-up', tier:0, trace:false,
    narration:'Eight singletons merge into four sorted pairs, then two sorted quads, then one sorted sequence. Box width scales with run length, so each tier doubles the sorted-run size and halves the run count.' },
  { title:'Write the merge routine', tier:2, trace:false,
    narration:'The active pair and destination highlight at the final tier. Implement merge(left, right) with the front/isEmpty/take primitives and watch the replay fill the output box one comparison at a time — this one routine is the whole algorithm.' },
  { title:'Prove stability on the 2s', tier:2, trace:true,
    narration:'Turn on the stability trace and rerun: the two 2s stay in their original left-then-right order only if ties resolve toward the left run. Swap <= for < and the trace shows the order flip while the values still look sorted.' }
];
var curStep = 0;
function applyStep(s) {
  curStep = s;
  var st = STEPS[s];
  document.getElementById('demoNarration').textContent = 'Step ' + (s+1) + ' — ' + st.title + ': ' + st.narration;
  document.getElementById('stepLabel').textContent = (s+1) + ' / ' + STEPS.length;
  setMergeLevel(st.tier);
  var cb = document.getElementById('stabilityTraceInput');
  cb.checked = st.trace;
  toggle_stabilityTrace(st.trace);
}
function prevStep() { if (curStep > 0) applyStep(curStep-1); }
function nextStep() { if (curStep < STEPS.length-1) applyStep(curStep+1); }

/* ── init ───────────────────────────────────────────────────────── */
document.getElementById('mergeImplementationCode').value = SAMPLE;
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
