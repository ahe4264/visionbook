<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0;font-size:10px;max-width:200px">Bucket sort (CLRS Fig 8.4). Distribute each value of <i>A</i> into bucket <i>B</i>[⌊10·x⌋], keeping each list sorted; concatenating <i>B</i>[0..9] yields the sorted output.</p>
<label>Step through <i>A</i>: <span id="stepLabel">0 / 10</span>
  <span style="display:flex;gap:4px"><button id="stepBtn" onclick="trigger_step()">Step ▶</button><button onclick="trigger_stepReset()">Reset</button></span>
</label>
<label>Test a boundary value: <input id="boundaryInput" value="0.94" style="width:70px"> <button onclick="trigger_boundary()">Test</button></label>
<label><input id="showIntervalsInput" type="checkbox" onchange="toggle_intervals(this.checked)"> Show bucket intervals [i/10,(i+1)/10)</label>
<div id="boundaryNote" style="font-size:10px;max-width:200px;color:#333"></div>
<hr style="width:100%;border:0;border-top:1px solid #ccc;margin:2px 0">
<div style="font-size:10px;font-weight:bold">Code editor — bucket distribution</div>
<div style="display:flex;gap:3px">
  <button id="tabSample" class="active" onclick="setTab('sample')">Sample</button>
  <button id="tabBuggy" onclick="setTab('buggy')">Buggy</button>
  <button id="tabStarter" onclick="setTab('starter')">Starter</button>
</div>
<textarea id="codeEditorCode" spellcheck="false"></textarea>
<label>Input values: <input id="codeInput" value=".78, .17, .39, .26, .72, .94, .21, .12, .23, .68" style="width:100%"></label>
<button id="runBtn" onclick="trigger_run()">▶ Run</button>
<div id="runStatus" style="font-size:10px;color:#555">status: not-run</div>
<div style="display:flex;gap:3px;align-items:center">
  <button onclick="play_first()">⏮</button><button onclick="play_prev()">◀</button>
  <button id="playBtn" onclick="play_toggle()">▶</button><button onclick="play_next()">⏭</button>
  <label style="flex-direction:row;align-items:center;gap:3px">spd<input id="speedInput" type="range" min="1" max="8" value="3" style="width:50px"></label>
</div>
<div id="frameCounter" style="font-size:10px">0 of 0</div>
<div id="frameCaption" style="font-size:10px;max-width:200px;min-height:24px;color:#222"></div>
<div id="runLog" style="font-size:9px;max-width:200px;max-height:90px;overflow:auto;border:1px solid #ddd;background:#fafafa;padding:3px;font-family:monospace"></div>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
// Library: svgjs (SVG.js v3)
var W = 1000, H = 640;
var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%').viewbox(0, 0, W, H);
var stat = draw.group();
var dyn = draw.group();

var DEFAULT_VALUES = [0.78, 0.17, 0.39, 0.26, 0.72, 0.94, 0.21, 0.12, 0.23, 0.68];
var CELL_X = 72, CELL_W = 46, CELL_H = 46, ROW0 = 44, ROWSTEP = 50;
var BCELL_X = 300;
var NODE_W = 96, NODE_H = 40, NODE_X0 = 420, NODE_STEP = 132;

function rowTop(r) { return ROW0 + r * ROWSTEP; }
function rowCenter(r) { return rowTop(r) + CELL_H / 2; }
function fmt(v) { var s = ('' + v); return s.replace(/^0\./, '.'); }

// arrowhead marker
var arrow = draw.marker(10, 10, function (add) { add.path('M0,0 L10,5 L0,10 z').fill('#000'); });

function halo(t) { return t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3, 'stroke-linejoin': 'round' }); }

function addArrowLine(g, x1, y1, x2, y2) {
  return g.line(x1, y1, x2, y2).stroke({ color: '#000', width: 1.4 }).marker('end', arrow);
}
function slashIn(g, x, y, w, h) {
  g.line(x + 4, y + h - 4, x + w - 4, y + 4).stroke({ color: '#000', width: 1.4 });
}

// ---- static panel ----
function buildStatic() {
  stat.clear();
  halo(stat.text('A').font({ family: 'Georgia, serif', style: 'italic', size: 22 }).move(CELL_X + 14, 6));
  halo(stat.text('B').font({ family: 'Georgia, serif', style: 'italic', size: 22 }).move(BCELL_X + 14, 6));
  for (var r = 0; r < 10; r++) {
    var cy = rowCenter(r);
    halo(stat.text('' + (r + 1)).font({ size: 15 }).move(40, cy - 8).attr('text-anchor', 'end'));
    halo(stat.text('' + r).font({ size: 15 }).move(288, cy - 8).attr('text-anchor', 'end'));
    stat.rect(CELL_W, CELL_H).move(CELL_X, rowTop(r)).fill('#d9d9d9').stroke({ color: '#000', width: 1.2 });
    halo(stat.text(fmt(DEFAULT_VALUES[r])).font({ size: 15 }).move(CELL_X + 8, cy - 8));
    stat.rect(CELL_W, CELL_H).move(BCELL_X, rowTop(r)).fill('#d9d9d9').stroke({ color: '#000', width: 1.2 });
  }
  halo(stat.text('(a)').font({ family: 'Georgia, serif', size: 18 }).move(CELL_X + 4, 600));
  halo(stat.text('(b)').font({ family: 'Georgia, serif', size: 18 }).move(520, 600));
}
buildStatic();

// ---- dynamic render from a single frame ----
var wrongBad = [];
function render(fr) {
  dyn.clear();
  var buckets = fr ? fr.state.buckets : [];
  if (!buckets.length) buckets = Array.from({ length: 10 }, function () { return []; });
  var processed = fr ? fr.state.processed : 0;
  var curBucket = fr ? fr.state.curBucket : -1;
  var curPos = fr ? fr.state.curPos : -1;
  var curCell = fr ? fr.state.curCell : -1;

  // A highlights
  for (var r = 0; r < 10; r++) {
    if (r < processed) dyn.rect(CELL_W, CELL_H).move(CELL_X, rowTop(r)).fill('#bfe0ff').attr('opacity', 0.55);
    if (r === curCell) dyn.rect(CELL_W, CELL_H).move(CELL_X, rowTop(r)).fill('none').stroke({ color: '#e07b00', width: 3 });
  }
  // interval labels
  var showInt = document.getElementById('showIntervalsInput').checked;
  for (var i = 0; i < 10; i++) {
    if (showInt || i === curBucket) {
      var lbl = '[' + (i / 10).toFixed(1).replace(/^0\./, '.') + ', ' + ((i + 1) / 10).toFixed(1).replace(/^0\./, '.') + ')';
      var tt = dyn.text(lbl).font({ size: 11, family: 'monospace' }).move(150, rowCenter(i) - 7);
      if (i === curBucket) { tt.fill('#c0392b').font({ weight: 'bold', size: 12 }); halo(tt); }
      else tt.fill('#999');
    }
  }
  if (curBucket >= 0) dyn.rect(CELL_W, CELL_H).move(BCELL_X, rowTop(curBucket)).fill('#bfe0ff').attr('opacity', 0.5);

  // B chains
  for (var b = 0; b < 10; b++) {
    var cy = rowCenter(b);
    var arr = buckets[b] || [];
    if (arr.length === 0) { slashIn(dyn, BCELL_X, rowTop(b), CELL_W, CELL_H); continue; }
    addArrowLine(dyn, BCELL_X + CELL_W, cy, NODE_X0 - 3, cy);
    for (var p = 0; p < arr.length; p++) {
      var nx = NODE_X0 + p * NODE_STEP, ny = cy - NODE_H / 2;
      var isCur = (b === curBucket && p === curPos);
      var isBad = wrongBad.indexOf('B' + b + '_' + p) >= 0;
      var strokeC = isBad ? '#c00000' : (isCur ? '#e07b00' : '#000');
      var strokeW = (isBad || isCur) ? 3 : 1.2;
      dyn.rect(NODE_W, NODE_H).move(nx, ny).fill('#ececec').stroke({ color: strokeC, width: strokeW });
      dyn.line(nx + NODE_W / 2, ny, nx + NODE_W / 2, ny + NODE_H).stroke({ color: '#000', width: 1 });
      halo(dyn.text(fmt(arr[p])).font({ size: 15 }).move(nx + 8, cy - 8));
      if (p < arr.length - 1) {
        dyn.line(nx + NODE_W / 2 + 6, cy, nx + NODE_W - 3, cy).stroke({ color: '#000', width: 1.2 });
        addArrowLine(dyn, nx + NODE_W, cy, nx + NODE_STEP - 3, cy);
      } else {
        slashIn(dyn, nx + NODE_W / 2, ny, NODE_W / 2, NODE_H);
      }
    }
  }
}
render(null);

// ---- correct trace generator ----
function snap(buckets, processed, curBucket, curPos, curCell) {
  return { buckets: buckets.map(function (b) { return b.slice(); }), processed: processed, curBucket: curBucket, curPos: curPos, curCell: curCell };
}
function correctTrace(values) {
  var frames = []; var buckets = Array.from({ length: 10 }, function () { return []; });
  frames.push({ kind: 'read', state: snap(buckets, 0, -1, -1, -1), message: 'Read input array A (' + values.length + ' values).' });
  values.forEach(function (x, k) {
    var i = Math.floor(10 * x);
    frames.push({ kind: 'bucket', state: snap(buckets, k, i, -1, k), message: 'A[' + (k + 1) + ']=' + fmt(x) + ' → bucket ' + i + ', interval [' + (i / 10) + ', ' + ((i + 1) / 10) + ').' });
    var a = buckets[i]; var pos = a.length;
    for (var p = 0; p < a.length; p++) { if (x < a[p]) { pos = p; break; } }
    a.splice(pos, 0, x);
    frames.push({ kind: 'insert', state: snap(buckets, k + 1, i, pos, -1), message: 'insertSorted(' + i + ', ' + fmt(x) + ') at position ' + pos + '.' });
  });
  frames.push({ kind: 'done', state: snap(buckets, values.length, -1, -1, -1), message: 'Done. Concatenate B[0..9] for the sorted output.' });
  return frames;
}

// ---- player state ----
var frames = [], idx = -1, framesSource = 'none', playTimer = null;
function showFrame() {
  wrongBad = [];
  if (idx >= 0 && idx < frames.length) { render(frames[idx]); document.getElementById('frameCaption').textContent = frames[idx].message; }
  else { render(null); document.getElementById('frameCaption').textContent = ''; }
  document.getElementById('frameCounter').textContent = (idx + 1) + ' of ' + frames.length;
}
function play_first() { stopPlay(); idx = 0; showFrame(); }
function play_prev() { stopPlay(); if (idx > 0) idx--; showFrame(); }
function play_next() { stopPlay(); if (idx < frames.length - 1) idx++; showFrame(); }
function play_toggle() { if (playTimer) stopPlay(); else startPlay(); }
function startPlay() {
  if (!frames.length) return;
  document.getElementById('playBtn').textContent = '⏸';
  playTimer = setInterval(function () {
    if (idx < frames.length - 1) { idx++; showFrame(); } else stopPlay();
  }, 1100 - (+document.getElementById('speedInput').value) * 120);
}
function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; } document.getElementById('playBtn').textContent = '▶'; }

// ---- step-through (correct algorithm on default A) ----
var stepIdx = -1;
function trigger_step() {
  stopPlay();
  if (framesSource !== 'step') { frames = correctTrace(DEFAULT_VALUES); framesSource = 'step'; stepIdx = -1; }
  if (stepIdx < frames.length - 1) stepIdx++;
  idx = stepIdx; wrongBad = []; showFrame();
  document.getElementById('stepLabel').textContent = Math.min(Math.floor((idx) / 2), 10) + ' / 10';
}
function trigger_stepReset() { stopPlay(); framesSource = 'none'; frames = []; idx = -1; stepIdx = -1; wrongBad = []; showFrame(); document.getElementById('stepLabel').textContent = '0 / 10'; }

// ---- boundary test ----
function trigger_boundary() {
  var v = parseFloat(document.getElementById('boundaryInput').value);
  var note = document.getElementById('boundaryNote');
  if (isNaN(v)) { note.textContent = 'Enter a number.'; return; }
  if (v < 0 || v >= 1) { note.innerHTML = '<b>' + v + '</b> is outside [0,1). Bucket sort assumes the half-open interval [0,1); such a value has no valid bucket.'; wrongBad = []; render(null); return; }
  var i = Math.floor(10 * v);
  note.innerHTML = '<b>' + fmt(v) + '</b> → bucket <b>' + i + '</b>, interval [' + (i / 10) + ', ' + ((i + 1) / 10) + '). The right end is open, so 1.0 would NOT fall in bucket 9 — that is the half-open convention.';
  wrongBad = [];
  render({ state: { buckets: [], processed: 0, curBucket: i, curPos: -1, curCell: -1 } });
}
function toggle_intervals(on) { wrongBad = []; if (idx >= 0 && idx < frames.length) render(frames[idx]); else render(null); }

// ---- code editor ----
var SAMPLE = 'function run(api) {\n  const vals = api.getValues();\n  for (const x of vals) {\n    const i = api.bucketIndex(x);   // floor(10*x)\n    api.insertSorted(i, x);       // keep list sorted\n  }\n}';
var BUGGY = 'function run(api) {\n  const vals = api.getValues();\n  for (const x of vals) {\n    const i = Math.round(10 * x); // BUG: rounds, not floors\n    api.append(i % 10, x);        // BUG: unsorted append\n  }\n}';
var STARTER = 'function run(api) {\n  // TODO: for each value x in api.getValues(),\n  // compute i = api.bucketIndex(x) and call api.insertSorted(i, x).\n}';
var TABS = { sample: SAMPLE, buggy: BUGGY, starter: STARTER };
function setTab(t) {
  document.getElementById('codeEditorCode').value = TABS[t];
  ['sample', 'buggy', 'starter'].forEach(function (k) { document.getElementById('tab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('active', k === t); });
}
setTab('sample');

function parseValues() {
  return document.getElementById('codeInput').value.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (v) { return !isNaN(v); });
}
function setStatus(s, color) { var el = document.getElementById('runStatus'); el.textContent = 'status: ' + s; el.style.color = color || '#555'; }
function logLine(t) { var l = document.getElementById('runLog'); l.innerHTML += t + '<br>'; l.scrollTop = l.scrollHeight; }

function trigger_run() {
  stopPlay();
  var values = parseValues();
  if (!values.length) { setStatus('error: no input values', '#c00000'); return; }
  var code = document.getElementById('codeEditorCode').value;
  var btn = document.getElementById('runBtn'); btn.disabled = true;
  setStatus('running…', '#b07d00');
  document.getElementById('runLog').innerHTML = '';
  document.getElementById('frameCaption').textContent = '';

  var workerSrc = 'self.onmessage=function(e){var src=e.data.code,values=e.data.values;' +
    'var frames=[],buckets=[],i;for(i=0;i<10;i++)buckets.push([]);' +
    'var ops=0,MAXOPS=400,MAXFR=800;' +
    'function snap(p,b,q,c){return{buckets:buckets.map(function(x){return x.slice();}),processed:p,curBucket:b,curPos:q,curCell:c};}' +
    'function push(k,p,b,q,c,m){if(frames.length<MAXFR)frames.push({kind:k,state:snap(p,b,q,c),message:m});}' +
    'var api={getValues:function(){ops++;push("read",0,-1,-1,-1,"Read input array ("+values.length+" values).");return values.slice();},' +
    'bucketIndex:function(x){ops++;if(ops>MAXOPS)throw new Error("Too many operations");var bi=Math.floor(10*x);var k=values.indexOf(x);push("bucket",k,bi,-1,k,"bucketIndex("+x+") = "+bi+", interval ["+(bi/10)+", "+((bi+1)/10)+").");return bi;},' +
    'insertSorted:function(bi,x){ops++;if(ops>MAXOPS)throw new Error("Too many operations");if(bi<0||bi>9)throw new Error("bucket index "+bi+" out of range [0,9]");var a=buckets[bi],pos=a.length,p;for(p=0;p<a.length;p++){if(x<a[p]){pos=p;break;}}a.splice(pos,0,x);push("insert",-1,bi,pos,-1,"insertSorted("+bi+", "+x+") at position "+pos+".");},' +
    'append:function(bi,x){ops++;if(ops>MAXOPS)throw new Error("Too many operations");if(bi<0||bi>9)throw new Error("bucket index "+bi+" out of range [0,9]");buckets[bi].push(x);push("insert",-1,bi,buckets[bi].length-1,-1,"append("+bi+", "+x+") at end (UNSORTED).");}};' +
    'Object.freeze(api);var status="correct",err=null,bad=[];' +
    'try{var fn=new Function("api",src+"\\n;return run(api);");fn(api);}' +
    'catch(e){status="error";err=(e&&e.message)?e.message:String(e);}' +
    'if(status!=="error"){var seen=[];outer:for(i=0;i<10;i++){var arr=buckets[i];for(var p=0;p<arr.length;p++){var v=arr[p];seen.push(v);' +
    'if(Math.floor(10*v)!==i){status="wrong";err="value "+v+" placed in wrong bucket "+i;bad.push("B"+i+"_"+p);break outer;}' +
    'if(p>0&&arr[p-1]>v){status="wrong";err="bucket "+i+" is not sorted at "+v;bad.push("B"+i+"_"+p);break outer;}}}' +
    'if(status==="correct"&&seen.length!==values.length){status="wrong";err="expected "+values.length+" values, found "+seen.length;}}' +
    'push("done",values.length,-1,-1,-1,status==="correct"?"Done. Concatenate B[0..9] for sorted output.":"Finished with status: "+status);' +
    'self.postMessage({frames:frames,status:status,err:err,bad:bad});};';

  var blob = new Blob([workerSrc], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);
  var worker = new Worker(url);
  var done = false;
  var to = setTimeout(function () { if (!done) { done = true; worker.terminate(); URL.revokeObjectURL(url); btn.disabled = false; setStatus('error: timeout', '#c00000'); logLine('⚠ timed out (>1.5s)'); } }, 1500);
  worker.onmessage = function (e) {
    if (done) return; done = true; clearTimeout(to); worker.terminate(); URL.revokeObjectURL(url); btn.disabled = false;
    var d = e.data;
    frames = d.frames; framesSource = 'code'; idx = 0; wrongBad = d.bad || [];
    showFrame();
    if (d.status === 'correct') setStatus('correct ✓', '#1a7f1a');
    else if (d.status === 'wrong') setStatus('wrong answer', '#c00000');
    else setStatus('error', '#c00000');
    if (d.err) logLine('⚠ ' + d.err);
    frames.forEach(function (f, k) { logLine((k + 1) + '. ' + f.message); });
  };
  worker.onerror = function (e) { if (done) return; done = true; clearTimeout(to); worker.terminate(); URL.revokeObjectURL(url); btn.disabled = false; setStatus('error', '#c00000'); logLine('⚠ ' + (e.message || 'worker error')); };
  worker.postMessage({ code: code, values: values });
}

window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
