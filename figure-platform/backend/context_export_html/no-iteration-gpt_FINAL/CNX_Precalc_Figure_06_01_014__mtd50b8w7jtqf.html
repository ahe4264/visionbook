<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span id="demoNarration" style="margin:0;font-size:10px;max-width:180px;display:block">The curve oscillates around the orange midline y = 1. Its peak is 3 units above that line, and one full cycle is completed over a horizontal distance of pi.</span>
<span style="display:flex;align-items:center;gap:6px"><button onclick="prevStep()">◀</button><span id="stepLabel">1/4</span><button onclick="nextStep()">▶</button></span>
<label>Amplitude |A|: <output id="amplitudeVal">3</output><input id="amplitudeInput" type="range" min="0.5" max="5" step="0.1" value="3" oninput="document.getElementById('amplitudeVal').value=this.value;update_amplitude(+this.value)"></label>
<label>Midline y = D: <output id="midlineVal">1</output><input id="midlineInput" type="range" min="-1" max="3" step="0.1" value="1" oninput="document.getElementById('midlineVal').value=this.value;update_midline(+this.value)"></label>
<label>Period P: <output id="periodVal">3.1416</output><input id="periodInput" type="range" min="1.5708" max="6.2832" step="0.01" value="3.1416" oninput="document.getElementById('periodVal').value=this.value;update_period(+this.value)"></label>
<span id="equationReadout" style="font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#333">y = 1 + 3 sin(2πx/π)</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var container = document.getElementById('container');
var canvas = document.createElement('canvas');
canvas.style.width = '100%';
canvas.style.height = '100%';
canvas.style.display = 'block';
canvas.setAttribute('aria-label', 'Interactive sine graph showing amplitude, midline, and period');
container.appendChild(canvas);

var state = { A: 3, D: 1, P: 3.1416 };
var currentStep = 0;

var demoSteps = [
  {
    title: 'Read the original graph',
    narration: 'The curve oscillates around the orange midline y = 1. Its peak is 3 units above that line, and one full cycle is completed over a horizontal distance of pi.',
    state: { amplitude: 3, midline: 1, period: 3.1416 }
  },
  {
    title: 'Change amplitude only',
    narration: 'Increasing or decreasing amplitude moves the peak and trough farther from or closer to the midline. The orange midline stays fixed, so the vertical stretch is isolated.',
    state: { amplitude: 4, midline: 1, period: 3.1416 }
  },
  {
    title: 'Move the midline',
    narration: 'Changing the midline shifts the entire sine wave up or down. The distance from the midline to the peak remains the amplitude.',
    state: { amplitude: 3, midline: 2, period: 3.1416 }
  },
  {
    title: 'Stretch the period',
    narration: 'Changing the period stretches or compresses the wave horizontally. The graph still completes exactly one full cycle over the red span.',
    state: { amplitude: 3, midline: 1, period: 5 }
  }
];

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function near(a, b, eps) {
  return Math.abs(a - b) <= (eps || 0.004);
}

function prettyNumber(v, digits) {
  var d = digits == null ? 2 : digits;
  var s = Number(v).toFixed(d);
  s = s.replace(/\.?0+$/, '');
  return s;
}

function periodText(v) {
  if (near(v, Math.PI, 0.015)) return 'π';
  if (near(v, Math.PI / 2, 0.015)) return 'π/2';
  if (near(v, 2 * Math.PI, 0.015)) return '2π';
  return prettyNumber(v, 2);
}

function coefficientText(v) {
  if (near(v, Math.PI, 0.015)) return 'π';
  return prettyNumber(v, 2);
}

function tickHalfLabel() {
  return near(state.P, Math.PI, 0.015) ? 'π/2' : 'P/2';
}

function tickEndLabel() {
  return near(state.P, Math.PI, 0.015) ? 'π' : 'P';
}

function sineData() {
  var pts = [];
  var n = 220;
  for (var i = 0; i < n; i++) {
    var x = state.P * i / (n - 1);
    pts.push({ x: x, y: state.D + state.A * Math.sin(2 * Math.PI * x / state.P) });
  }
  return pts;
}

function domains() {
  var peak = state.D + state.A;
  var trough = state.D - state.A;
  return {
    xMin: -0.10 * state.P,
    xMax: 1.24 * state.P,
    yMin: Math.min(-2.7, trough - 0.9),
    yMax: Math.max(4.65, peak + 0.75)
  };
}

function updateEquationReadout() {
  var el = document.getElementById('equationReadout');
  if (!el) return;
  el.textContent = 'y = ' + prettyNumber(state.D, 1) + ' + ' + prettyNumber(state.A, 1) + ' sin(2πx/' + coefficientText(state.P) + ')';
}

function setOutput(id, value, digits) {
  var input = document.getElementById(id + 'Input');
  var out = document.getElementById(id + 'Val');
  if (input) input.value = String(value);
  if (out) out.value = prettyNumber(value, digits == null ? 2 : digits);
}

function refreshChart() {
  var d = domains();
  chart.options.scales.x.min = d.xMin;
  chart.options.scales.x.max = d.xMax;
  chart.options.scales.y.min = d.yMin;
  chart.options.scales.y.max = d.yMax;
  chart.data.datasets[0].data = sineData();
  updateEquationReadout();
  chart.update('none');
}

function update_amplitude(v) {
  state.A = v;
  refreshChart();
}

function update_midline(v) {
  state.D = v;
  refreshChart();
}

function update_period(v) {
  state.P = v;
  refreshChart();
}

function drawArrow(ctx, x1, y1, x2, y2, color, width, head, both) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  function headAt(ax, ay, bx, by) {
    var ang = Math.atan2(by - ay, bx - ax);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx - head * Math.cos(ang - Math.PI / 6), by - head * Math.sin(ang - Math.PI / 6));
    ctx.lineTo(bx - head * Math.cos(ang + Math.PI / 6), by - head * Math.sin(ang + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
  }

  headAt(x1, y1, x2, y2);
  if (both) headAt(x2, y2, x1, y1);
  ctx.restore();
}

function drawHaloText(ctx, text, x, y, opts) {
  opts = opts || {};
  ctx.save();
  ctx.font = opts.font || '13px sans-serif';
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = opts.halo || '#fff';
  ctx.lineWidth = opts.haloWidth || 4;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = opts.color || '#111';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function distToSegment(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  if (!len2) return Math.hypot(px - x1, py - y1);
  var t = clamp(((px - x1) * dx + (py - y1) * dy) / len2, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

var sineTeachingPlugin = {
  id: 'sineTeachingPlugin',

  beforeDatasetsDraw: function(chart) {
    var ctx = chart.ctx;
    var area = chart.chartArea;
    var x = chart.scales.x;
    var y = chart.scales.y;
    var m = Math.max(1, Math.min(area.width, area.height));
    var axisW = clamp(m * 0.005, 1, 1.7);
    var tickLen = clamp(m * 0.022, 4, 7);
    var head = clamp(m * 0.032, 6, 10);
    var fontSize = clamp(m * 0.047, 10, 15);
    var smallFont = clamp(m * 0.043, 9, 13);

    chart.$hitRegions = [];

    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.fillRect(area.left, area.top, area.width, area.height);
    ctx.restore();

    var x0 = x.getPixelForValue(0);
    var y0 = y.getPixelForValue(0);
    var right = area.right - head * 0.6;
    var top = area.top + head * 0.4;
    var bottom = area.bottom - head * 0.35;

    drawArrow(ctx, x0, bottom, x0, top, '#222222', axisW, head, true);
    drawArrow(ctx, x0 - head * 0.55, y0, right, y0, '#222222', axisW, head, false);

    drawHaloText(ctx, 'y', x0 - head * 0.45, top - fontSize * 0.9, {
      color: '#000',
      font: 'italic bold ' + (fontSize + 2) + 'px sans-serif',
      align: 'center',
      baseline: 'middle',
      haloWidth: 3
    });
    drawHaloText(ctx, 'x', right + fontSize * 0.55, y0 + fontSize * 0.15, {
      color: '#000',
      font: 'italic bold ' + (fontSize + 1) + 'px sans-serif',
      align: 'left',
      baseline: 'middle',
      haloWidth: 3
    });

    ctx.save();
    ctx.strokeStyle = '#555';
    ctx.fillStyle = '#111';
    ctx.lineWidth = axisW;
    ctx.font = smallFont + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    var yMinTick = Math.ceil(y.min);
    var yMaxTick = Math.floor(y.max);
    for (var yy = yMinTick; yy <= yMaxTick; yy++) {
      var py = y.getPixelForValue(yy);
      if (py < area.top + 3 || py > area.bottom - 3) continue;
      ctx.beginPath();
      ctx.moveTo(x0 - tickLen * 0.65, py);
      ctx.lineTo(x0 + tickLen * 0.65, py);
      ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.strokeText(String(yy).replace('-', '−'), x0 - tickLen * 1.05, py);
      ctx.fillStyle = '#111';
      ctx.fillText(String(yy).replace('-', '−'), x0 - tickLen * 1.05, py);
      ctx.strokeStyle = '#555';
      ctx.lineWidth = axisW;
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var xTicks = [
      { v: state.P / 4, label: '' },
      { v: state.P / 2, label: tickHalfLabel() },
      { v: 3 * state.P / 4, label: '' },
      { v: state.P, label: tickEndLabel() }
    ];
    for (var i = 0; i < xTicks.length; i++) {
      var px = x.getPixelForValue(xTicks[i].v);
      ctx.beginPath();
      ctx.moveTo(px, y0 - tickLen * 0.65);
      ctx.lineTo(px, y0 + tickLen * 0.65);
      ctx.stroke();
      if (xTicks[i].label) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.font = (xTicks[i].label.indexOf('π') >= 0 ? 'italic ' : '') + smallFont + 'px sans-serif';
        ctx.strokeText(xTicks[i].label, px, y0 + tickLen * 1.15);
        ctx.fillStyle = '#111';
        ctx.fillText(xTicks[i].label, px, y0 + tickLen * 1.15);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = axisW;
      }
    }
    ctx.restore();

    var midY = y.getPixelForValue(state.D);
    drawArrow(ctx, x0, midY, x.getPixelForValue(state.P * 1.02), midY, '#f05a28', clamp(m * 0.0065, 1.3, 2.2), clamp(m * 0.024, 5, 8), false);
  },

  afterDatasetsDraw: function(chart) {
    var ctx = chart.ctx;
    var area = chart.chartArea;
    var x = chart.scales.x;
    var y = chart.scales.y;
    var m = Math.max(1, Math.min(area.width, area.height));
    var annW = clamp(m * 0.008, 1.5, 2.7);
    var thinW = clamp(m * 0.004, 0.9, 1.4);
    var head = clamp(m * 0.030, 6, 10);
    var fontSize = clamp(m * 0.051, 10, 16);
    var smallFont = clamp(m * 0.046, 9, 14);

    var orange = '#f05a28';
    var teal = '#008b98';
    var red = '#e33a2c';
    var blue = '#174d86';

    var x0 = x.getPixelForValue(0);
    var xP = x.getPixelForValue(state.P);
    var xQuarter = x.getPixelForValue(state.P / 4);
    var yMid = y.getPixelForValue(state.D);
    var yPeak = y.getPixelForValue(state.D + state.A);
    var yTrough = y.getPixelForValue(state.D - state.A);
    var yPeriodValue = state.D - state.A - 0.62;
    var yPeriod = y.getPixelForValue(yPeriodValue);

    drawArrow(ctx, xQuarter, yMid, xQuarter, yPeak, teal, annW, head, false);

    ctx.save();
    ctx.strokeStyle = teal;
    ctx.lineWidth = thinW;
    ctx.beginPath();
    var labelAmpX = x.getPixelForValue(state.P * 0.58);
    var labelAmpY = clamp(yPeak + (yMid - yPeak) * 0.35 - fontSize * 1.0, area.top + fontSize * 1.2, area.bottom - fontSize * 3.3);
    ctx.moveTo(xQuarter + head * 0.45, yPeak + (yMid - yPeak) * 0.42);
    ctx.lineTo(labelAmpX - fontSize * 0.5, labelAmpY + fontSize * 1.6);
    ctx.stroke();
    ctx.restore();

    drawHaloText(ctx, 'Amplitude: |A| = ' + prettyNumber(state.A, 1), labelAmpX, labelAmpY, {
      color: teal,
      font: fontSize + 'px sans-serif',
      align: 'left',
      baseline: 'middle',
      haloWidth: 4
    });

    var midLabelX = x.getPixelForValue(state.P * 1.07);
    var midLabelY = clamp(yMid, area.top + fontSize * 1.1, area.bottom - fontSize * 1.1);
    drawHaloText(ctx, 'Midline: y = ' + prettyNumber(state.D, 1), midLabelX, midLabelY, {
      color: orange,
      font: fontSize + 'px sans-serif',
      align: 'left',
      baseline: 'middle',
      haloWidth: 4
    });

    drawArrow(ctx, x0, yPeriod, xP, yPeriod, red, annW, head, true);
    drawHaloText(ctx, 'Period = ' + periodText(state.P), x.getPixelForValue(state.P * 1.07), yPeriod, {
      color: red,
      font: fontSize + 'px sans-serif',
      align: 'left',
      baseline: 'middle',
      haloWidth: 4
    });

    ctx.save();
    ctx.fillStyle = blue;
    var r = clamp(m * 0.010, 2, 3.4);
    [
      [0, state.D],
      [state.P / 4, state.D + state.A],
      [3 * state.P / 4, state.D - state.A],
      [state.P, state.D]
    ].forEach(function(pt) {
      ctx.beginPath();
      ctx.arc(x.getPixelForValue(pt[0]), y.getPixelForValue(pt[1]), r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    chart.$hitRegions = [
      {
        name: 'amplitude',
        tooltip: 'Amplitude is the vertical distance from the midline to a peak or trough.',
        title: 'Amplitude',
        body: 'The teal arrow measures from the orange midline to the peak. It is not the total height from trough to peak; that total height is twice the amplitude.',
        hit: function(px, py) { return distToSegment(px, py, xQuarter, yMid, xQuarter, yPeak) < head; }
      },
      {
        name: 'midline',
        tooltip: 'The midline is the vertical center of the sinusoid.',
        title: 'Midline',
        body: 'The orange line y = D is the center around which the curve oscillates. Moving D shifts the entire wave up or down without changing its height or repeat length.',
        hit: function(px, py) { return distToSegment(px, py, x0, yMid, x.getPixelForValue(state.P * 1.02), yMid) < head; }
      },
      {
        name: 'period',
        tooltip: 'The period is the horizontal length of one complete cycle.',
        title: 'Period',
        body: 'The red double arrow spans from the starting point to the point where the sine wave returns to the same midline position and direction. Changing P stretches or compresses the graph horizontally.',
        hit: function(px, py) { return distToSegment(px, py, x0, yPeriod, xP, yPeriod) < head; }
      },
      {
        name: 'curve',
        tooltip: 'This curve is y = D + A sin(2πx/P), rebuilt from midline, amplitude, and period.',
        title: 'Reconstructing the sinusoid',
        body: 'Once the midline D, amplitude |A|, and period P are known, the sine curve can be written as y = D + A sin(2πx/P). These three features control vertical center, vertical distance, and horizontal repeat length separately.',
        hit: function(px, py) {
          var pts = chart.data.datasets[0].data;
          for (var i = 1; i < pts.length; i += 3) {
            var x1 = x.getPixelForValue(pts[i - 1].x), y1 = y.getPixelForValue(pts[i - 1].y);
            var x2 = x.getPixelForValue(pts[i].x), y2 = y.getPixelForValue(pts[i].y);
            if (distToSegment(px, py, x1, y1, x2, y2) < head * 0.8) return true;
          }
          return false;
        }
      }
    ];
  }
};

var initialDomain = domains();
var chart = new Chart(canvas, {
  type: 'line',
  data: {
    datasets: [{
      data: sineData(),
      parsing: false,
      borderColor: '#174d86',
      borderWidth: 3,
      pointRadius: 0,
      tension: 0.25,
      fill: false
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 180 },
    normalized: true,
    layout: { padding: { left: 45, right: 96, top: 22, bottom: 34 } },
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false }
    },
    scales: {
      x: {
        type: 'linear',
        min: initialDomain.xMin,
        max: initialDomain.xMax,
        display: false,
        grid: { display: false },
        border: { display: false }
      },
      y: {
        type: 'linear',
        min: initialDomain.yMin,
        max: initialDomain.yMax,
        display: false,
        grid: { display: false },
        border: { display: false }
      }
    }
  },
  plugins: [sineTeachingPlugin]
});

window.__markRendered();

canvas.addEventListener('mousemove', function(evt) {
  var rect = canvas.getBoundingClientRect();
  var px = evt.clientX - rect.left;
  var py = evt.clientY - rect.top;
  var found = null;
  var regions = chart.$hitRegions || [];
  for (var i = 0; i < regions.length; i++) {
    if (regions[i].hit(px, py)) {
      found = regions[i];
      break;
    }
  }
  if (found) {
    canvas.style.cursor = 'pointer';
    showTooltip(found.tooltip, evt);
  } else {
    canvas.style.cursor = 'default';
    hideTooltip();
  }
});

canvas.addEventListener('mouseleave', function() {
  canvas.style.cursor = 'default';
  hideTooltip();
});

canvas.addEventListener('click', function(evt) {
  var rect = canvas.getBoundingClientRect();
  var px = evt.clientX - rect.left;
  var py = evt.clientY - rect.top;
  var regions = chart.$hitRegions || [];
  for (var i = 0; i < regions.length; i++) {
    if (regions[i].hit(px, py)) {
      showPopup(regions[i].title, regions[i].body);
      return;
    }
  }
});

function applyStep(index) {
  currentStep = clamp(index, 0, demoSteps.length - 1);
  var step = demoSteps[currentStep];
  state.A = step.state.amplitude;
  state.D = step.state.midline;
  state.P = step.state.period;

  setOutput('amplitude', state.A, 1);
  setOutput('midline', state.D, 1);
  setOutput('period', state.P, 4);

  var n = document.getElementById('demoNarration');
  if (n) n.textContent = step.narration;
  var label = document.getElementById('stepLabel');
  if (label) label.textContent = (currentStep + 1) + '/' + demoSteps.length + ' ' + step.title;

  refreshChart();
}

function prevStep() {
  applyStep(currentStep - 1);
}

function nextStep() {
  applyStep(currentStep + 1);
}

applyStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
