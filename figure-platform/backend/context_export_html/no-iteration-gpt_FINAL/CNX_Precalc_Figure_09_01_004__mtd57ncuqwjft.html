<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span id="demoNarration" style="display:block;margin:0 0 4px 0;font-size:10px;max-width:180px">The blue line represents x + 2y = -1 and the red line represents -x + y = 3. Their single crossing point, (-7/3, 2/3), is the solution because it lies on both lines.</span>
<button onclick="prevStep()">◀</button> <span id="stepLabel">1 / 4: Original system</span> <button onclick="nextStep()">▶</button>
<br>
<label>Blue line y-intercept: <output id="blueYInterceptVal">-0.5</output><input id="blueYInterceptInput" type="range" min="-5" max="5" step="0.25" value="-0.5" oninput="document.getElementById('blueYInterceptVal').value=this.value;update_blueYIntercept(+this.value)"></label>
<label>Red line slope: <output id="redSlopeVal">1</output><input id="redSlopeInput" type="range" min="-2" max="3" step="0.25" value="1" oninput="document.getElementById('redSlopeVal').value=this.value;update_redSlope(+this.value)"></label>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var canvas = document.createElement('canvas');
canvas.style.width = '100%';
canvas.style.height = '100%';
canvas.style.display = 'block';

  blueB: -0.5,
  redM: 1,
  redB: 3,
  selected: false,
  step: 0,
  geom: null,
  dot: null,
  lineSegments: []
};

var demoSteps = [

  },

  }
];

function update_blueYIntercept(v) {
  figState.blueB = v;
  figState.selected = false;
  chart.update('none');
}

function update_redSlope(v) {
  figState.redM = v;
  figState.selected = false;
  chart.update('none');
}

function prevStep() {
  figState.step = (figState.step + demoSteps.length - 1) % demoSteps.length;
  applyStep(figState.step);
}

function nextStep() {
  figState.step = (figState.step + 1) % demoSteps.length;
  applyStep(figState.step);
}

function applyStep(i) {
  var st = demoSteps[i];
  figState.selected = false;
  document.getElementById('demoNarration').textContent = st.narration;
  document.getElementById('stepLabel').textContent = (i + 1) + ' / ' + demoSteps.length + ': ' + st.title;

  var blueInput = document.getElementById('blueYInterceptInput');
  var redInput = document.getElementById('redSlopeInput');
  blueInput.value = st.state.blueYIntercept;
  redInput.value = st.state.redSlope;
  document.getElementById('blueYInterceptVal').value = st.state.blueYIntercept;
  document.getElementById('redSlopeVal').value = st.state.redSlope;

  figState.redM = +st.state.redSlope;

function computePlotRect(chart) {
  var w = chart.width;
  var h = chart.height;
  var leftReserve = Math.min(128, Math.max(48, w * 0.22));
  var rightReserve = Math.min(48, Math.max(22, w * 0.07));
  var topReserve = Math.min(34, Math.max(16, h * 0.07));
  var bottomReserve = Math.min(34, Math.max(18, h * 0.08));
  var availW = Math.max(80, w - leftReserve - rightReserve);
  var availH = Math.max(70, h - topReserve - bottomReserve);
  var plotW = Math.min(availW, availH * 1.2);
  var plotH = plotW / 1.2;
  if (plotH > availH) {
    plotH = availH;
    plotW = plotH * 1.2;
  }
  var left = leftReserve + (availW - plotW) / 2;
  var top = topReserve + (availH - plotH) / 2;
  return {
    left: left,
    right: left + plotW,
    top: top,
    bottom: top + plotH,
    width: plotW,
    height: plotH,
    font: Math.max(8, Math.min(14, Math.min(plotW, plotH) * 0.04))
  };
}

function X(g, x) {
  return g.left + ((x + 6) / 12) * g.width;
}

function Y(g, y) {
  return g.bottom - ((y + 5) / 10) * g.height;
}

function drawArrowHead(ctx, x, y, angle, size, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-size, -size * 0.55);
  ctx.lineTo(-size, size * 0.55);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawDoubleArrowLine(ctx, p1, p2, color, width, arrowSize) {
  var a = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  drawArrowHead(ctx, p2.x, p2.y, a, arrowSize, color);
  drawArrowHead(ctx, p1.x, p1.y, a + Math.PI, arrowSize, color);
  ctx.restore();
}

function lineSegmentInBox(m, b, g) {
  var pts = [];
  function add(x, y) {
    if (x >= -6 - 1e-9 && x <= 6 + 1e-9 && y >= -5 - 1e-9 && y <= 5 + 1e-9) {
      for (var i = 0; i < pts.length; i++) {
        if (Math.abs(pts[i].x - x) < 1e-7 && Math.abs(pts[i].y - y) < 1e-7) return;
      }
      pts.push({ x: x, y: y });
    }
  }
  add(-6, m * -6 + b);
  add(6, m * 6 + b);
  if (Math.abs(m) > 1e-12) {
    add((-5 - b) / m, -5);
    add((5 - b) / m, 5);
  }
  if (pts.length < 2) return null;
  pts.sort(function (a, c) { return a.x - c.x; });
  return {
    w1: pts[0],
    w2: pts[pts.length - 1],
    p1: { x: X(g, pts[0].x), y: Y(g, pts[0].y) },
    p2: { x: X(g, pts[pts.length - 1].x), y: Y(g, pts[pts.length - 1].y) }
  };
}

function intersection() {
  var dm = figState.blueM - figState.redM;
  if (Math.abs(dm) < 1e-10) {
    if (Math.abs(figState.blueB - figState.redB) < 1e-10) return { type: 'coincident' };
    return { type: 'parallel' };
  }
  var x = (figState.redB - figState.blueB) / dm;
  var y = figState.blueM * x + figState.blueB;
  return { type: 'one', x: x, y: y, visible: x >= -6 && x <= 6 && y >= -5 && y <= 5 };
}

function niceMinus(s) {
  return String(s).replace(/-/g, '−');
}

function fmt(n) {
  if (Math.abs(n) < 1e-10) n = 0;
  var r = Math.round(n * 1000) / 1000;
  return niceMinus(Number.isInteger(r) ? String(r) : String(r));
}

function fraction(n) {
  var sign = n < 0 ? -1 : 1;
  n = Math.abs(n);
  var bestD = 1, bestN = Math.round(n), bestErr = Math.abs(n - bestN);
  for (var d = 1; d <= 24; d++) {
    var num = Math.round(n * d);
    var err = Math.abs(n - num / d);
    if (err < bestErr) {
      bestErr = err;
      bestD = d;
      bestN = num;
    }
  }
  if (bestErr > 1e-6 || bestD === 1) return { text: fmt(sign * n), frac: false };
  return { num: sign * bestN, den: bestD, frac: true };
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHaloText(ctx, text, x, y, color, font, align) {
  ctx.save();
  ctx.font = font;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawStatus(ctx, g, sol) {
  var text = sol.type === 'parallel' ? 'parallel: no solution'
    : sol.type === 'coincident' ? 'coincident: infinitely many solutions'
    : sol.visible ? 'one solution' : 'one solution, off screen';
  ctx.save();
  var fs = g.font * 0.9;
  ctx.font = fs + 'px sans-serif';
  var pad = fs * 0.45;
  var w = ctx.measureText(text).width + 2 * pad;
  var h = fs * 1.65;
  var x = g.right - w - 4;
  var y = g.top + 4;
  drawRoundedRect(ctx, x, y, w, h, 5);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fill();
  ctx.strokeStyle = '#d4d4d4';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#555555';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + pad, y + h / 2);
  ctx.restore();
}

function drawFractionLabel(ctx, cx, cy, wx, wy, g) {
  var fx = fraction(wx);
  var fy = fraction(wy);
  var fs = g.font * 1.05;
  ctx.save();
  ctx.font = fs + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  function tokenWidth(tok) {
    if (!tok.frac) return ctx.measureText(tok.text).width;
    return Math.max(ctx.measureText(niceMinus(tok.num)).width, ctx.measureText(String(tok.den)).width) + fs * 0.35;
  }

  var lp = ctx.measureText('(').width;
  var comma = ctx.measureText(', ').width;
  var rp = ctx.measureText(')').width;
  var fw1 = tokenWidth(fx);
  var fw2 = tokenWidth(fy);
  var total = lp + fw1 + comma + fw2 + rp;
  var labelX = cx - total * 0.52;
  var labelY = cy - g.font * 2.15;

  if (labelX < g.left + 4) labelX = cx + g.font * 0.9;
  if (labelY < g.top + fs) labelY = cy + g.font * 2.0;

  var boxH = fs * 2.1;
  drawRoundedRect(ctx, labelX - fs * 0.45, labelY - boxH / 2, total + fs * 0.9, boxH, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.86)';
  ctx.fill();

  var x = labelX;
  ctx.fillStyle = '#222';
  ctx.textAlign = 'left';
  ctx.fillText('(', x, labelY);
  x += lp;

  function drawTok(tok, x0, w) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#222';
    if (!tok.frac) {
      ctx.fillText(tok.text, x0 + w / 2, labelY);
    } else {
      ctx.fillText(niceMinus(tok.num), x0 + w / 2, labelY - fs * 0.45);
      ctx.beginPath();
      ctx.moveTo(x0 + fs * 0.12, labelY);
      ctx.lineTo(x0 + w - fs * 0.12, labelY);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillText(String(tok.den), x0 + w / 2, labelY + fs * 0.55);
    }
  }

  drawTok(fx, x, fw1);
  x += fw1;
  ctx.textAlign = 'left';
  ctx.fillText(', ', x, labelY);
  x += comma;
  drawTok(fy, x, fw2);
  x += fw2;
  ctx.textAlign = 'left';
  ctx.fillText(')', x, labelY);

  ctx.restore();
}

function blueEquationLabel() {
  var c = 2 * figState.blueB;
  if (Math.abs(c + 1) < 1e-10) return 'x + 2y = −1';
  return 'x + 2y = ' + fmt(c);
}

function redEquationLabel() {
  if (Math.abs(figState.redM - 1) < 1e-10) return '−x + y = 3';
  return 'y = ' + fmt(figState.redM) + 'x + 3';
}

function drawCallout(ctx, g, sol) {
  if (!figState.selected || sol.type !== 'one' || !sol.visible) return;
  var fs = Math.max(9, g.font * 0.88);
  var lines = [
    'Substitute the point:',
    'blue: x + 2y = ' + fmt(sol.x + 2 * sol.y),
    'red: y − mx = ' + fmt(sol.y - figState.redM * sol.x)
  ];
  var dotX = X(g, sol.x), dotY = Y(g, sol.y);
  ctx.save();
  ctx.font = fs + 'px sans-serif';
  var w = 0;
  for (var i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
  w += fs * 1.2;
  var h = fs * 4.15;
  var x = Math.min(g.right - w - 4, dotX + fs * 2);
  var y = Math.max(g.top + fs, Math.min(g.bottom - h - fs, dotY - h * 0.55));
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(dotX + fs * 0.35, dotY - fs * 0.35);
  ctx.lineTo(x, y + h * 0.55);
  ctx.stroke();
  drawRoundedRect(ctx, x, y, w, h, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();
  ctx.strokeStyle = '#bdbdbd';
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], x + fs * 0.6, y + fs * 0.55 + j * fs * 1.15);
  ctx.restore();
}

function distancePointToSegment(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  var len2 = dx * dx + dy * dy;
  if (!len2) return Math.hypot(px - ax, py - ay);
  var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

var systemPlugin = {
  id: 'systemInteractiveDrawing',
  beforeDraw: function (chart) {
    var ctx = chart.ctx;
    var g = computePlotRect(chart);
    figState.geom = g;
    figState.lineSegments = [];
    figState.dot = null;

    ctx.clearRect(0, 0, chart.width, chart.height);
    ctx.save();

    var s = Math.min(g.width, g.height);
    var axisExt = Math.max(8, s * 0.04);
    var tick = Math.max(3, s * 0.016);
    var axisY = Y(g, 0);
    var axisX = X(g, 0);

    ctx.setLineDash([1.2, 3.2]);
    ctx.strokeStyle = '#bfbfbf';
    ctx.lineWidth = Math.max(0.75, s * 0.0022);
    for (var xi = -6; xi <= 6; xi++) {
      ctx.beginPath();
      ctx.moveTo(X(g, xi), g.top);
      ctx.lineTo(X(g, xi), g.bottom);
      ctx.stroke();
    }
    for (var yi = -5; yi <= 5; yi++) {
      ctx.beginPath();
      ctx.moveTo(g.left, Y(g, yi));
      ctx.lineTo(g.right, Y(g, yi));
      ctx.stroke();
    }
    ctx.setLineDash([]);

    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#111';
    ctx.lineWidth = Math.max(1, s * 0.004);
    ctx.beginPath();
    ctx.moveTo(g.left - axisExt, axisY);
    ctx.lineTo(g.right + axisExt, axisY);
    ctx.moveTo(axisX, g.bottom + axisExt);
    ctx.lineTo(axisX, g.top - axisExt);
    ctx.stroke();

    var ah = Math.max(6, s * 0.028);
    drawArrowHead(ctx, g.right + axisExt, axisY, 0, ah, '#111');
    drawArrowHead(ctx, g.left - axisExt, axisY, Math.PI, ah, '#111');
    drawArrowHead(ctx, axisX, g.top - axisExt, -Math.PI / 2, ah, '#111');
    drawArrowHead(ctx, axisX, g.bottom + axisExt, Math.PI / 2, ah, '#111');

    ctx.font = g.font + 'px serif';
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (var x = -6; x <= 6; x++) {
      var px = X(g, x);
      ctx.beginPath();
      ctx.moveTo(px, axisY - tick);
      ctx.lineTo(px, axisY + tick);
      ctx.stroke();
      if (x !== 0) ctx.fillText(niceMinus(x), px, axisY + tick + 2);
    }
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var y = -5; y <= 5; y++) {
      var py = Y(g, y);
      ctx.beginPath();
      ctx.moveTo(axisX - tick, py);
      ctx.lineTo(axisX + tick, py);
      ctx.stroke();
      if (y !== 0) ctx.fillText(niceMinus(y), axisX - tick - 4, py);
    }

    ctx.font = (g.font * 1.5) + 'px serif';
    ctx.fillText('x', g.right + axisExt + ah + g.font * 1.2, axisY + g.font * 0.15);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('y', axisX, g.top - axisExt - ah - 2);

    var blue = lineSegmentInBox(figState.blueM, figState.blueB, g);
    var red = lineSegmentInBox(figState.redM, figState.redB, g);
    var lw = Math.max(1.6, s * 0.006);
    if (blue) {
      drawDoubleArrowLine(ctx, blue.p1, blue.p2, '#0077a6', lw, Math.max(7, s * 0.028));
      figState.lineSegments.push({ name: blueEquationLabel(), color: '#0077a6', p1: blue.p1, p2: blue.p2 });
    }
    if (red) {
      drawDoubleArrowLine(ctx, red.p1, red.p2, '#ff0000', lw, Math.max(7, s * 0.028));
      figState.lineSegments.push({ name: redEquationLabel(), color: '#ff0000', p1: red.p1, p2: red.p2 });
    }

    var sol = intersection();
    if (sol.type === 'one' && sol.visible) {
      var dx = X(g, sol.x);
      var dy = Y(g, sol.y);
      figState.dot = { x: dx, y: dy, wx: sol.x, wy: sol.y };
      ctx.beginPath();
      ctx.arc(dx, dy, Math.max(3.2, s * 0.012), 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();
      drawFractionLabel(ctx, dx, dy, sol.x, sol.y, g);
    }

    var labelFont = 'italic ' + (g.font * 1.35) + 'px serif';
    var blueY = blue ? Math.max(g.top + g.font, Math.min(g.bottom - g.font, Y(g, figState.blueM * -5.6 + figState.blueB) - g.font * 0.7)) : g.top + g.font;
    var redY = red ? Math.max(g.top + g.font, Math.min(g.bottom - g.font, Y(g, figState.redM * -5.6 + figState.redB) + g.font * 0.8)) : g.bottom - g.font;
    if (g.left > 52) {
      drawHaloText(ctx, blueEquationLabel(), g.left - g.font * 0.9, blueY, '#0077a6', labelFont, 'right');
      drawHaloText(ctx, redEquationLabel(), g.left - g.font * 0.9, redY, '#ff0000', labelFont, 'right');
    } else {
      drawHaloText(ctx, blueEquationLabel(), g.left + g.font, g.top + g.font * 1.2, '#0077a6', labelFont, 'left');
      drawHaloText(ctx, redEquationLabel(), g.left + g.font, g.bottom - g.font * 1.2, '#ff0000', labelFont, 'left');
    }

    drawStatus(ctx, g, sol);
    drawCallout(ctx, g, sol);

    ctx.restore();
  }
};

var chart = new Chart(canvas, {
  type: 'scatter',
  data: { datasets: [] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    events: [],
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false }
    },
    scales: {
      x: { display: false, min: -6, max: 6 },
      y: { display: false, min: -5, max: 5 }
    }
  },
  plugins: [systemPlugin]
});

function canvasPoint(evt) {
  var rect = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - rect.left,
    y: evt.clientY - rect.top
  };
}

canvas.addEventListener('mousemove', function (evt) {
  var p = canvasPoint(evt);
  var hit = false;

  if (figState.dot && Math.hypot(p.x - figState.dot.x, p.y - figState.dot.y) < 10) {
    canvas.style.cursor = 'pointer';
    showTooltip('Click to substitute this ordered pair into both equations.', evt);
    hit = true;
  } else {
    for (var i = 0; i < figState.lineSegments.length; i++) {
      var seg = figState.lineSegments[i];
      var d = distancePointToSegment(p.x, p.y, seg.p1.x, seg.p1.y, seg.p2.x, seg.p2.y);
      if (d < 6) {
        canvas.style.cursor = 'pointer';
        showTooltip(seg.name + ': every point on this line satisfies that equation.', evt);
        hit = true;
        break;
      }
    }
  }

  if (!hit) {
    canvas.style.cursor = 'default';
    hideTooltip();
  }
});

canvas.addEventListener('mouseleave', function () {
  canvas.style.cursor = 'default';
  hideTooltip();
});

canvas.addEventListener('click', function (evt) {
  var p = canvasPoint(evt);
  if (!figState.dot || Math.hypot(p.x - figState.dot.x, p.y - figState.dot.y) > 12) return;
  figState.selected = true;
  var x = figState.dot.wx;
  var y = figState.dot.wy;
  var blueLeft = x + 2 * y;
  var redLeft = y - figState.redM * x;
  chart.update('none');
  showPopup(
    'The shared solution',
    'The clicked point is (' + fmt(x) + ', ' + fmt(y) + '). It satisfies the blue equation because x + 2y = ' + fmt(blueLeft) + ', and it satisfies the red equation because y − mx = ' + fmt(redLeft) + '. Since the same ordered pair makes both equations true, it is the solution of the system.'
  );
});

applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
