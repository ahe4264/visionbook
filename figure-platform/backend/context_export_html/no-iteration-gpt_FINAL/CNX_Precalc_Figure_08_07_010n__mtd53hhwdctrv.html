<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<label>Distance from hitter: <output id="ballDistanceVal">200</output><input id="ballDistanceInput" type="range" min="0" max="560" step="10" value="200" oninput="document.getElementById('ballDistanceVal').value=this.value;update_ballDistance(+this.value)"></label>
<label>Outfield wall position: <output id="wallPositionVal">400</output><input id="wallPositionInput" type="range" min="250" max="550" step="10" value="400" oninput="document.getElementById('wallPositionVal').value=this.value;update_wallPosition(+this.value)"></label>
<label><input id="trajectoryViewInput" type="checkbox" onchange="toggle_trajectoryView(this.checked)"> View: sampled points</label>
<span id="demoNarration" style="margin:0;font-size:10px;max-width:180px">The ball starts at the hitter, rises along a parabolic arc, then returns to the ground. Move the distance marker to see that each horizontal distance corresponds to one ball height.</span>
<span><button onclick="prevStep()">◀</button> <span id="stepLabel">Step 1 of 4</span> <button onclick="nextStep()">▶</button></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var container = document.getElementById('container');
var canvas = document.createElement('canvas');
canvas.style.width = '100%';
canvas.style.height = '100%';
canvas.style.display = 'block';
container.appendChild(canvas);

var TEAL = '#0086a8';
var RED = '#e31b2f';
var GRID = 'rgba(80,80,80,0.62)';
var AXIS = '#000000';
var WALL_HEIGHT = 25;
var RANGE = 570;
var PEAK_HEIGHT = 155;
var ballDistance = 200;
var wallPosition = 400;
var sampledMode = false;
var currentStep = 0;
var lastHoverTarget = null;

function trajectoryHeight(x) {
  var y = PEAK_HEIGHT * 4 * x * (RANGE - x) / (RANGE * RANGE);
  return Math.max(0, y);
}

function trajectorySlope(x) {
  return PEAK_HEIGHT * 4 * (RANGE - 2 * x) / (RANGE * RANGE);
}

function makeTrajectoryData() {
  var pts = [];
  for (var x = 0; x <= RANGE; x += 5) {
    pts.push({ x: x, y: trajectoryHeight(x) });
  }
  return pts;
}

function makeSampleData() {
  var pts = [];
  for (var x = 0; x <= 560; x += 40) {
    pts.push({ x: x, y: trajectoryHeight(x) });
  }
  return pts;
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function chartScaleSize(chart, factor, min, max) {
  var ca = chart.chartArea || { left: 0, right: chart.width, top: 0, bottom: chart.height };
  var s = Math.min(Math.max(1, ca.right - ca.left), Math.max(1, ca.bottom - ca.top));
  return clamp(s * factor, min, max);
}

function drawArrowhead(ctx, x, y, angle, len, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(len, 0);
  ctx.lineTo(-len * 0.55, -len * 0.48);
  ctx.lineTo(-len * 0.25, 0);
  ctx.lineTo(-len * 0.55, len * 0.48);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawLeaderLabel(ctx, text, x, y, tx, ty, fs) {
  ctx.save();
  ctx.font = fs + 'px "Times New Roman", Times, serif';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(1, fs * 0.055);
  ctx.strokeStyle = AXIS;
  ctx.fillStyle = AXIS;
  ctx.beginPath();
  ctx.moveTo(x + fs * 0.35, y + fs * 0.45);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  var ang = Math.atan2(ty - (y + fs * 0.45), tx - (x + fs * 0.35));
  drawArrowhead(ctx, tx, ty, ang, fs * 0.26, AXIS);
  ctx.lineWidth = Math.max(3, fs * 0.18);
  ctx.strokeStyle = '#ffffff';
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawTextBox(ctx, text, x, y, fs, color, align) {
  ctx.save();
  ctx.font = fs + 'px Arial, sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  var pad = fs * 0.32;
  var w = ctx.measureText(text).width;
  var bx = x;
  if (ctx.textAlign === 'center') bx = x - w / 2;
  if (ctx.textAlign === 'right') bx = x - w;
  ctx.fillStyle = 'rgba(255,255,255,0.86)';
  ctx.fillRect(bx - pad, y - fs * 0.62 - pad * 0.28, w + 2 * pad, fs * 1.24 + pad * 0.56);
  ctx.fillStyle = color || AXIS;
  ctx.fillText(text, x, y);
  ctx.restore();
}

var projectilePlugin = {
  id: 'projectileAnnotations',
  beforeUpdate: function (chart) {
    var s = Math.min(chart.width || 680, chart.height || 380);
    var tickFs = clamp(s * 0.043, 11, 22);
    var titleFs = clamp(s * 0.052, 13, 25);
    chart.options.scales.x.ticks.font = { family: '"Times New Roman", Times, serif', size: tickFs };
    chart.options.scales.y.ticks.font = { family: '"Times New Roman", Times, serif', size: tickFs };
    chart.options.scales.x.title.font = { family: '"Times New Roman", Times, serif', size: titleFs };
    chart.options.scales.y.title.font = { family: '"Times New Roman", Times, serif', size: titleFs };
  },
  afterDraw: function (chart) {
    var ctx = chart.ctx;
    var xS = chart.scales.x;
    var yS = chart.scales.y;
    var ca = chart.chartArea;
    var s = Math.min(ca.right - ca.left, ca.bottom - ca.top);
    var axisW = clamp(s * 0.006, 1.1, 2.2);
    var tickLen = clamp(s * 0.018, 4, 8);
    var fs = chartScaleSize(chart, 0.055, 13, 24);
    var smallFs = chartScaleSize(chart, 0.038, 10, 16);
    var tinyFs = chartScaleSize(chart, 0.032, 9, 13);
    var markerR = chartScaleSize(chart, 0.022, 5, 9);
    var x0 = xS.getPixelForValue(0);
    var x600 = xS.getPixelForValue(600);
    var y0 = yS.getPixelForValue(0);
    var y300 = yS.getPixelForValue(300);

    ctx.save();

    ctx.strokeStyle = AXIS;
    ctx.fillStyle = AXIS;
    ctx.lineWidth = axisW;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(Math.min(chart.width - 4, x600 + tickLen * 2.2), y0);
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0, Math.max(3, y300 - tickLen * 2.3));
    ctx.stroke();
    drawArrowhead(ctx, Math.min(chart.width - 4, x600 + tickLen * 2.2), y0, 0, tickLen * 1.35, AXIS);
    drawArrowhead(ctx, x0, Math.max(3, y300 - tickLen * 2.3), -Math.PI / 2, tickLen * 1.35, AXIS);

    ctx.lineWidth = axisW;
    for (var tx = 50; tx <= 600; tx += 50) {
      var px = xS.getPixelForValue(tx);
      ctx.beginPath();
      ctx.moveTo(px, y0 - tickLen);
      ctx.lineTo(px, y0 + tickLen);
      ctx.stroke();
    }
    for (var ty = 50; ty <= 300; ty += 50) {
      var py = yS.getPixelForValue(ty);
      ctx.beginPath();
      ctx.moveTo(x0 - tickLen, py);
      ctx.lineTo(x0 + tickLen, py);
      ctx.stroke();
    }

    var guideX = xS.getPixelForValue(ballDistance);
    var guideY = yS.getPixelForValue(trajectoryHeight(ballDistance));
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(70,70,70,0.55)';
    ctx.lineWidth = clamp(s * 0.004, 1, 1.6);
    ctx.beginPath();
    ctx.moveTo(guideX, guideY);
    ctx.lineTo(guideX, y0);
    ctx.stroke();
    ctx.restore();

    [35, 115, 340, 460, 565].forEach(function (ax) {
      var ay = trajectoryHeight(ax);
      var p1x = xS.getPixelForValue(ax);
      var p1y = yS.getPixelForValue(ay);
      var p2x = xS.getPixelForValue(ax + 8);
      var p2y = yS.getPixelForValue(trajectoryHeight(ax + 8));
      drawArrowhead(ctx, p1x, p1y, Math.atan2(p2y - p1y, p2x - p1x), chartScaleSize(chart, 0.029, 7, 12), TEAL);
    });

    var wallX = xS.getPixelForValue(wallPosition);
    var wallTop = yS.getPixelForValue(WALL_HEIGHT);
    var wallWidth = Math.max(5, Math.abs(xS.getPixelForValue(wallPosition + 10) - xS.getPixelForValue(wallPosition)));
    ctx.fillStyle = RED;
    ctx.fillRect(wallX - wallWidth / 2, wallTop, wallWidth, y0 - wallTop);

    var ballAtWall = trajectoryHeight(wallPosition);
    var wallBallY = yS.getPixelForValue(ballAtWall);
    var clears = ballAtWall > WALL_HEIGHT;
    var compColor = clears ? '#238443' : '#b2182b';
    ctx.strokeStyle = compColor;
    ctx.fillStyle = compColor;
    ctx.lineWidth = clamp(s * 0.007, 1.5, 3);
    ctx.beginPath();
    ctx.moveTo(wallX, wallTop);
    ctx.lineTo(wallX, wallBallY);
    ctx.stroke();
    var cap = chartScaleSize(chart, 0.02, 5, 9);
    ctx.beginPath();
    ctx.moveTo(wallX - cap, wallTop);
    ctx.lineTo(wallX + cap, wallTop);
    ctx.moveTo(wallX - cap, wallBallY);
    ctx.lineTo(wallX + cap, wallBallY);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(guideX, guideY, markerR, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = clamp(s * 0.007, 1.5, 3);
    ctx.strokeStyle = TEAL;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(guideX, guideY, markerR * 1.18, 0, Math.PI * 2);
    ctx.lineWidth = clamp(s * 0.0045, 1, 2);
    ctx.strokeStyle = '#ff6b1a';
    ctx.stroke();

    drawLeaderLabel(ctx, 'Trajectory of ball', xS.getPixelForValue(38), yS.getPixelForValue(215), xS.getPixelForValue(178), yS.getPixelForValue(152), fs);
    drawLeaderLabel(ctx, 'Position of hitter', xS.getPixelForValue(75), yS.getPixelForValue(36), xS.getPixelForValue(6), yS.getPixelForValue(4), fs);

    ctx.save();
    ctx.font = fs + 'px "Times New Roman", Times, serif';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, fs * 0.18);
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = AXIS;
    var wallLabelX = clamp(wallX - fs * 3.3, ca.left + fs * 0.5, ca.right - fs * 5.2);
    var wallLabelY = yS.getPixelForValue(34);
    ctx.strokeText('Outfield wall', wallLabelX, wallLabelY);
    ctx.fillText('Outfield wall', wallLabelX, wallLabelY);
    ctx.restore();

    var hText = Math.round(trajectoryHeight(ballDistance)) + ' ft';
    var boxX = clamp(guideX + markerR * 1.9, ca.left + 35, ca.right - 35);
    var boxY = clamp(guideY - markerR * 2.2, ca.top + 13, ca.bottom - 30);
    drawTextBox(ctx, hText, boxX, boxY, smallFs, TEAL, 'left');

    var statusText = clears ? 'Clears wall' : 'Does not clear wall';
    var statusX = clamp(wallX + cap * 1.6, ca.left + 48, ca.right - 52);
    var statusY = clears ? Math.max(ca.top + smallFs, wallBallY - smallFs * 1.6) : Math.min(ca.bottom - smallFs * 1.2, wallTop + smallFs * 1.8);
    drawTextBox(ctx, statusText, statusX, statusY, tinyFs, compColor, 'left');

    ctx.restore();
  }
};

var projectileChart = new Chart(canvas.getContext('2d'), {
  type: 'scatter',
  data: {
    datasets: [
      {
        label: 'Trajectory',
        data: makeTrajectoryData(),
        parsing: false,
        showLine: true,
        pointRadius: 0,
        borderColor: TEAL,
        borderWidth: 3,
        borderCapStyle: 'round',
        borderJoinStyle: 'round',
        tension: 0.25
      },
      {
        label: 'Sampled points',
        data: makeSampleData(),
        parsing: false,
        showLine: false,
        pointRadius: 4,
        pointHoverRadius: 5,
        pointBackgroundColor: TEAL,
        pointBorderColor: '#ffffff',
        pointBorderWidth: 1.2,
        hidden: true
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    layout: { padding: { top: 8, right: 24, bottom: 2, left: 4 } },
    interaction: { mode: 'nearest', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false }
    },
    scales: {
      x: {
        type: 'linear',
        min: 0,
        max: 600,
        title: { display: true, text: 'Distance (ft)', color: '#000000' },
        ticks: {
          stepSize: 50,
          color: '#000000',
          callback: function (value) {
            return value % 100 === 0 ? value : '';
          }
        },
        grid: {
          color: GRID,
          borderDash: [1, 3],
          lineWidth: 1,
          drawTicks: false
        },
        border: { display: false }
      },
      y: {
        min: 0,
        max: 300,
        title: { display: true, text: 'Height (ft)', color: '#000000' },
        ticks: {
          stepSize: 50,
          color: '#000000',
          callback: function (value) {
            return value === 100 || value === 200 || value === 300 ? value : '';
          }
        },
        grid: {
          color: GRID,
          borderDash: [1, 3],
          lineWidth: 1,
          drawTicks: false
        },
        border: { display: false }
      }
    },
    onHover: function (event) {
      handleHover(event, projectileChart);
    },
    onClick: function (event) {
      handleClick(event, projectileChart);
    }
  },
  plugins: [projectilePlugin]
});
window.__markRendered();

function refreshChart() {
  if (!projectileChart) return;
  projectileChart.data.datasets[0].borderColor = sampledMode ? 'rgba(0,134,168,0.28)' : TEAL;
  projectileChart.data.datasets[0].borderWidth = sampledMode ? 2 : 3;
  projectileChart.data.datasets[1].hidden = !sampledMode;
  projectileChart.update('none');
}

function update_ballDistance(v) {
  ballDistance = v;
  refreshChart();
}

function update_wallPosition(v) {
  wallPosition = v;
  refreshChart();
}

function toggle_trajectoryView(on) {
  sampledMode = !!on;
  refreshChart();
}

var demoSteps = [
  {
    title: 'Read the trajectory as height over distance',
    narration: 'The ball starts at the hitter, rises along a parabolic arc, then returns to the ground. Move the distance marker to see that each horizontal distance corresponds to one ball height.',
    state: { ballDistance: 200, wallPosition: 400, trajectoryView: 'Smooth path' }
  },
  {
    title: 'Compare the ball with the wall',
    narration: "At the wall's distance, the important question is not where the ball eventually lands, but whether the curve is above the top of the wall at that exact x-value.",
    state: { ballDistance: 400, wallPosition: 400, trajectoryView: 'Smooth path' }
  },
  {
    title: 'Move the wall',
    narration: "Slide the wall left and right to test different fence distances. The verdict changes only when the wall is placed where the ball's trajectory is lower than the wall height.",
    state: { ballDistance: 450, wallPosition: 500, trajectoryView: 'Smooth path' }
  },
  {
    title: 'See the same motion as data points',
    narration: 'Switching to sampled points shows the same arc as individual distance-height measurements on the grid, linking the graph to numerical table values.',
    state: { ballDistance: 400, wallPosition: 400, trajectoryView: 'Sampled points' }
  }
];

function applyStep(i) {
  currentStep = clamp(i, 0, demoSteps.length - 1);
  var step = demoSteps[currentStep];
  ballDistance = step.state.ballDistance;
  wallPosition = step.state.wallPosition;
  sampledMode = step.state.trajectoryView === 'Sampled points';

  document.getElementById('ballDistanceInput').value = ballDistance;
  document.getElementById('ballDistanceVal').value = ballDistance;
  document.getElementById('wallPositionInput').value = wallPosition;
  document.getElementById('wallPositionVal').value = wallPosition;
  document.getElementById('trajectoryViewInput').checked = sampledMode;
  document.getElementById('demoNarration').textContent = step.narration;
  document.getElementById('stepLabel').textContent = 'Step ' + (currentStep + 1) + ' of ' + demoSteps.length;
  refreshChart();
}

function prevStep() {
  applyStep(currentStep - 1);
}

function nextStep() {
  applyStep(currentStep + 1);
}

function getHitTarget(rx, ry, chart) {
  var xS = chart.scales.x;
  var yS = chart.scales.y;
  var ca = chart.chartArea;
  if (!ca) return null;
  var s = Math.min(ca.right - ca.left, ca.bottom - ca.top);
  var tol = clamp(s * 0.045, 8, 18);

  var bx = xS.getPixelForValue(ballDistance);
  var by = yS.getPixelForValue(trajectoryHeight(ballDistance));
  if (Math.hypot(rx - bx, ry - by) < tol) return 'marker';

  var wx = xS.getPixelForValue(wallPosition);
  var wt = yS.getPixelForValue(WALL_HEIGHT);
  var y0 = yS.getPixelForValue(0);
  if (rx > wx - tol * 0.7 && rx < wx + tol * 0.7 && ry > wt - tol * 0.3 && ry < y0 + tol * 0.3) return 'wall';

  var wallBallY = yS.getPixelForValue(trajectoryHeight(wallPosition));
  if (Math.abs(rx - wx) < tol * 0.7 && ry >= Math.min(wt, wallBallY) - tol && ry <= Math.max(wt, wallBallY) + tol) return 'comparison';

  for (var x = 0; x <= RANGE; x += 20) {
    var px = xS.getPixelForValue(x);
    var py = yS.getPixelForValue(trajectoryHeight(x));
    if (Math.hypot(rx - px, ry - py) < tol * 0.65) return 'trajectory';
  }
  return null;
}

function handleHover(event, chart) {
  var native = event.native || event;
  var target = getHitTarget(event.x, event.y, chart);
  lastHoverTarget = target;
  canvas.style.cursor = target ? 'pointer' : 'default';
  if (!target) {
    hideTooltip();
    return;
  }
  if (target === 'marker') {
    showTooltip('Selected distance: ' + ballDistance + ' ft; ball height: about ' + Math.round(trajectoryHeight(ballDistance)) + ' ft.', native);
  } else if (target === 'wall') {
    showTooltip('Outfield wall: ' + wallPosition + ' ft from the hitter and ' + WALL_HEIGHT + ' ft high.', native);
  } else if (target === 'comparison') {
    var h = trajectoryHeight(wallPosition);
    showTooltip('At x = ' + wallPosition + ' ft, compare ball height ' + Math.round(h) + ' ft with wall height ' + WALL_HEIGHT + ' ft.', native);
  } else if (target === 'trajectory') {
    showTooltip('The curve gives the ball height for each horizontal distance.', native);
  }
}

function handleClick(event, chart) {
  var native = event.native || event;
  var target = getHitTarget(event.x, event.y, chart) || lastHoverTarget;
  if (target === 'marker') {
    showPopup('Height at a distance', 'The marker is a single point on the projectile path. Its x-coordinate is distance from the hitter, and its y-coordinate is the ball height at that distance.');
  } else if (target === 'wall' || target === 'comparison') {
    var h = trajectoryHeight(wallPosition);
    var clears = h > WALL_HEIGHT;
    showPopup('Wall comparison', 'At the wall, the ball is about ' + Math.round(h) + ' ft high while the wall is ' + WALL_HEIGHT + ' ft high. The ball ' + (clears ? 'clears the wall because the trajectory is above the wall top.' : 'does not clear the wall because the trajectory is below the wall top.'));
  } else if (target === 'trajectory') {
    showPopup('Projectile trajectory', 'The teal parabola models the baseball height as a function of horizontal distance. Clearing the wall depends on the height of this curve at the wall’s x-position, not on the peak height alone.');
  }
}

canvas.addEventListener('mouseout', function () {
  lastHoverTarget = null;
  canvas.style.cursor = 'default';
  hideTooltip();
});

applyStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
