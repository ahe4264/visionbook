<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span id="demoNarration" style="display:block;margin:0;font-size:10px;max-width:180px;line-height:1.25"></span>
<span style="display:flex;gap:4px;align-items:center"><button onclick="prevStep()">◀</button><span id="stepLabel"></span><button onclick="nextStep()">▶</button></span>
<label>Equivalents of HO−: <output id="baseEquivalentsVal">1</output><input id="baseEquivalentsInput" type="range" min="0" max="2" step="0.01" value="1" oninput="document.getElementById('baseEquivalentsVal').value=(+this.value).toFixed(2);update_baseEquivalents(+this.value)"></label>
<label><input id="rightPanelViewInput" type="checkbox" onchange="toggle_rightPanelView(this.checked)"> Right panel view: <span id="rightPanelViewVal">Species</span></label>
<span style="font-size:10px;line-height:1.25">Click × landmarks on the curve for pKa vs. pI explanations.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

var PKA1 = 2.34, PKA2 = 9.69, PI = 6.01;
var currentEq = 1;
var netChargeView = false;
var selectedLandmark = 'pI';
var hitRegions = [];
var currentStep = 0;

var demoSteps = [
  {
    title: 'Start fully protonated',
    narration: 'At very low equivalents of added base, alanine is mostly fully protonated: the amino group is H3N+ and the carboxyl group is COOH, giving a net positive charge.',

function nbarFromPH(pH) {
  var ka1 = Math.pow(10, -PKA1), ka2 = Math.pow(10, -PKA2);
  var h = Math.pow(10, -pH);
  var d = h * h + ka1 * h + ka1 * ka2;
  return (ka1 * h + 2 * ka1 * ka2) / d;
}

function pHFromEq(eq) {
  if (eq <= 0) return 0;
  if (eq >= 2) return 11.6;
  var lo = -0.2, hi = 12.2;
  for (var i = 0; i < 70; i++) {
    var mid = (lo + hi) / 2;
    if (nbarFromPH(mid) < eq) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

function activeRegion() {
  if (currentEq < 0.25) return 'low';
  if (currentEq < 0.75) return 'pKa1';
  if (currentEq < 1.25) return 'pI';
  if (currentEq < 1.75) return 'pKa2';
  return 'high';
}

function update_baseEquivalents(v) {
  currentEq = Math.max(0, Math.min(2, v));
  selectedLandmark = activeRegion();
  var out = document.getElementById('baseEquivalentsVal');
  if (out) out.value = currentEq.toFixed(2);
  if (chart) chart.update('none');
}

function toggle_rightPanelView(on) {
  netChargeView = !!on;
  var lab = document.getElementById('rightPanelViewVal');
  if (lab) lab.textContent = netChargeView ? 'Net charge' : 'Species';
  if (chart) chart.update('none');
}

function prevStep() {
  goToStep(Math.max(0, currentStep - 1));
}

function nextStep() {
  goToStep(Math.min(demoSteps.length - 1, currentStep + 1));
}

function goToStep(i) {
  currentStep = i;
  var st = demoSteps[i];
  var narr = document.getElementById('demoNarration');
  var label = document.getElementById('stepLabel');
  if (narr) narr.textContent = st.narration;
  if (label) label.textContent = (i + 1) + '/' + demoSteps.length + ' ' + st.title;
  var slider = document.getElementById('baseEquivalentsInput');
  if (slider) slider.value = st.state.baseEquivalents;
  currentEq = st.state.baseEquivalents;
  var out = document.getElementById('baseEquivalentsVal');
  if (out) out.value = currentEq.toFixed(2);
  var cb = document.getElementById('rightPanelViewInput');
  netChargeView = st.state.rightPanelView === 'Net charge';
  if (cb) cb.checked = netChargeView;
  var lab = document.getElementById('rightPanelViewVal');
  if (lab) lab.textContent = netChargeView ? 'Net charge' : 'Species';
  selectedLandmark = activeRegion();
  if (chart) chart.update('none');
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function drawArrow(ctx, x1, y1, x2, y2, color, width, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  var a = Math.atan2(y2 - y1, x2 - x1);
  var len = 7;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - len * Math.cos(a - Math.PI / 7), y2 - len * Math.sin(a - Math.PI / 7));
  ctx.lineTo(x2 - len * Math.cos(a + Math.PI / 7), y2 - len * Math.sin(a + Math.PI / 7));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTextHalo(ctx, text, x, y, color, font, align) {
  ctx.save();
  ctx.font = font;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineWidth = 4;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color || '#111';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawSegmentedText(ctx, pieces, x, y, fs) {
  var cx = x;
  ctx.textBaseline = 'alphabetic';
  ctx.font = fs + 'px Arial';
  for (var i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    if (p.sub || p.sup) {
      ctx.font = Math.max(7, fs * 0.68) + 'px Arial';
      ctx.fillStyle = p.color || '#111';
      ctx.fillText(p.text, cx, y + (p.sub ? fs * 0.22 : -fs * 0.45));
      cx += ctx.measureText(p.text).width;
      ctx.font = fs + 'px Arial';
    } else {
      ctx.fillStyle = p.color || '#111';
      ctx.fillText(p.text, cx, y);
      cx += ctx.measureText(p.text).width;
    }
  }
  return cx - x;
}

function drawAlanine(ctx, x, y, kind, s) {
  var fs = Math.max(8, 15 * s);
  var mag = '#ff0099', blue = '#008bd2', black = '#111';
  ctx.save();
  ctx.lineWidth = Math.max(0.8, 1.2 * s);
  ctx.strokeStyle = black;
  ctx.fillStyle = black;
  ctx.font = fs + 'px Arial';
  var protonatedN = kind !== 'deprot';
  var acid = kind === 'full';
  drawSegmentedText(ctx, [
    { text: 'H', color: protonatedN ? mag : blue },
    { text: protonatedN ? '3' : '2', color: protonatedN ? mag : blue, sub: true },
    { text: 'N', color: protonatedN ? mag : blue }
  ], x, y, fs);
  if (protonatedN) {
    ctx.font = Math.max(7, fs * 0.76) + 'px Arial';
    ctx.fillStyle = black;
    ctx.fillText('+', x + 30 * s, y - 12 * s);
  }
  ctx.font = fs + 'px Arial';
  ctx.fillStyle = black;
  ctx.fillText('CH', x + 45 * s, y);
  ctx.fillText('C', x + 82 * s, y);
  ctx.fillText('O', x + 106 * s, y);
  if (acid) {
    ctx.fillStyle = mag;
    ctx.fillText('H', x + 119 * s, y);
  } else {
    ctx.font = Math.max(8, fs * 0.82) + 'px Arial';
    ctx.fillStyle = black;
    ctx.fillText('−', x + 121 * s, y - 4 * s);
  }
  ctx.font = fs + 'px Arial';
  ctx.fillStyle = black;
  ctx.fillText('O', x + 82 * s, y - 36 * s);
  ctx.beginPath();
  ctx.moveTo(x + 86 * s, y - 8 * s);
  ctx.lineTo(x + 86 * s, y - 28 * s);
  ctx.moveTo(x + 93 * s, y - 8 * s);
  ctx.lineTo(x + 93 * s, y - 28 * s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 56 * s, y + 5 * s);
  ctx.lineTo(x + 56 * s, y + 24 * s);
  ctx.stroke();
  drawSegmentedText(ctx, [{ text: 'CH', color: black }, { text: '3', sub: true, color: black }], x + 45 * s, y + 43 * s, fs);
  ctx.restore();
  return { x: x - 8 * s, y: y - 47 * s, w: 145 * s, h: 101 * s };
}

function drawBracket(ctx, x, y, w, h, s) {
  ctx.save();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = Math.max(0.8, 1.2 * s);
  var k = 12 * s;
  ctx.beginPath();
  ctx.moveTo(x + k, y); ctx.lineTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + k, y + h);
  ctx.moveTo(x + w - k, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - k, y + h);
  ctx.stroke();
  ctx.restore();
}

function drawChargeCard(ctx, x, y, w, h, title, body, charge, active) {
  ctx.save();
  if (active) {
    ctx.fillStyle = 'rgba(255,0,153,0.10)';
    ctx.strokeStyle = '#ff0099';
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  }
  ctx.lineWidth = active ? 2 : 1;
  roundRect(ctx, x, y, w, h, 10, true, true);
  ctx.fillStyle = charge === '+1' ? '#ff0099' : (charge === '−1' ? '#008bd2' : '#111');
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(charge, x + 35, y + h / 2);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#111';
  ctx.font = 'bold 13px Arial';
  ctx.fillText(title, x + 70, y + 22);
  ctx.font = '11px Arial';
  ctx.fillText(body, x + 70, y + 43);
  ctx.restore();
}

function drawFigure(chart) {
  var ctx = chart.ctx, W = chart.width, H = chart.height;
  ctx.clearRect(0, 0, W, H);
  hitRegions = [];

  var small = W < 760;
  var plotX0 = 54, plotY0 = 34;
  var plotH = Math.max(300, H - 84);
  var plotW = small ? Math.max(255, W * 0.45) : Math.min(W * 0.43, 470);
  if (plotX0 + plotW > W - 230) plotW = Math.max(240, W - 285 - plotX0);
  var rightX = plotX0 + plotW + 38;
  var rightW = Math.max(180, W - rightX - 10);
  var s = Math.min(1, rightW / 520, H / 610);
  if (small) s = Math.max(0.58, s);

  function px(eq) { return plotX0 + (eq / 2) * plotW; }
  function py(pH) { return plotY0 + plotH - (pH / 12) * plotH; }

  ctx.fillStyle = '#e3f5ff';
  ctx.fillRect(plotX0, plotY0, plotW, plotH);

  ctx.strokeStyle = 'rgba(0,0,0,0.42)';
  ctx.lineWidth = 1;
  ctx.font = '12px Arial';
  ctx.fillStyle = '#111';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var yy = 0; yy <= 12; yy += 2) {
    var gy = py(yy);
    ctx.beginPath();
    ctx.moveTo(plotX0, gy);
    ctx.lineTo(plotX0 + plotW, gy);
    ctx.stroke();
    ctx.fillText(String(yy), plotX0 - 10, gy);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (var xx = 0; xx <= 2.001; xx += 0.5) {
    var gx = px(xx);
    ctx.beginPath();
    ctx.moveTo(gx, plotY0);
    ctx.lineTo(gx, plotY0 + plotH);
    ctx.stroke();
    ctx.fillText(xx.toFixed(1), gx, plotY0 + plotH + 18);
  }

  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(plotX0, plotY0);
  ctx.lineTo(plotX0, plotY0 + plotH);
  ctx.lineTo(plotX0 + plotW, plotY0 + plotH);
  ctx.stroke();

  ctx.font = '22px Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('pH', plotX0 - 55, plotY0 + plotH / 2);
  ctx.font = '18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('Equivalents of HO−', plotX0 + plotW / 2, plotY0 + plotH + 44);

  ctx.strokeStyle = '#ff0099';
  ctx.lineWidth = Math.max(2, Math.min(plotW, plotH) * 0.006);
  ctx.beginPath();
  for (var i = 0; i <= 400; i++) {
    var eq = 2 * i / 400;
    var ph = pHFromEq(eq);
    var cx = px(eq), cy = py(ph);
    if (i === 0) ctx.moveTo(cx, cy);
    else ctx.lineTo(cx, cy);
  }
  ctx.stroke();

  var landmarks = [
    { id: 'pKa1', eq: 0.5, ph: PKA1, label: 'pKa1 = 2.34', lx: px(0.06), ly: py(3.55), popup: 'At pKa1, the carboxyl group is half deprotonated. Fully protonated alanine and the zwitterion are present in equal amounts.' },
    { id: 'pI', eq: 1.0, ph: PI, label: 'Isoelectric\npoint = 6.01', lx: px(0.43), ly: py(6.9), popup: 'The isoelectric point is not a 50:50 mixture point. It is where the neutral zwitterion dominates, with +1 and −1 internal charges canceling to net zero.' },
    { id: 'pKa2', eq: 1.5, ph: PKA2, label: 'pKa2 = 9.69', lx: px(1.05), ly: py(11.65), popup: 'At pKa2, the ammonium group is half deprotonated. The zwitterion and the fully deprotonated anion are present in equal amounts.' }
  ];

  ctx.font = '16px Arial';
  landmarks.forEach(function (lm) {
    var x = px(lm.eq), y = py(lm.ph);
    if (selectedLandmark === lm.id) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,0,153,0.45)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7);
    ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7);
    ctx.stroke();
    drawArrow(ctx, lm.lx + (lm.id === 'pI' ? 92 : 72), lm.ly - 4, x - 5, y - 2, '#111', 1, 0.95);
    if (lm.label.indexOf('\n') >= 0) {
      drawTextHalo(ctx, 'Isoelectric', lm.lx, lm.ly - 16, '#111', '15px Arial', 'left');
      drawTextHalo(ctx, 'point = 6.01', lm.lx, lm.ly + 2, '#111', '15px Arial', 'left');
    } else {
      drawTextHalo(ctx, lm.label, lm.lx, lm.ly, '#111', '16px Arial', 'left');
    }
    hitRegions.push({ type: 'landmark', id: lm.id, x: x - 14, y: y - 14, w: 28, h: 28, text: lm.label.replace('\n', ' '), popup: lm.popup, eq: lm.eq });
  });

  var mPh = pHFromEq(currentEq);
  var mx = px(currentEq), my = py(mPh);
  ctx.save();
  ctx.fillStyle = '#fff7a8';
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(mx, my, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  var readX = Math.min(plotX0 + plotW - 58, mx + 12);
  var readY = Math.max(plotY0 + 20, my - 14);
  drawTextHalo(ctx, 'pH ' + mPh.toFixed(2), readX, readY, '#111', '13px Arial', 'left');

  var yTop = py(11.4), yPka2 = py(9.05), yPi = py(6.0), yPka1 = py(2.75), yLow = py(0.35);
  var anchors = {
    high: { x: rightX + 12 * s, y: yTop },
    pKa2: { x: rightX + 6 * s, y: yPka2 },
    pI: { x: rightX + 10 * s, y: yPi },
    pKa1: { x: rightX + 6 * s, y: yPka1 },
    low: { x: rightX + 10 * s, y: yLow }
  };

  var ar = activeRegion();
  drawArrow(ctx, px(0.02), py(0.05), anchors.low.x - 10, anchors.low.y, '#111', selectedLandmark === 'low' ? 1.7 : 1, 0.95);
  drawArrow(ctx, px(0.55), py(PKA1), anchors.pKa1.x - 10, anchors.pKa1.y, '#111', selectedLandmark === 'pKa1' ? 1.7 : 1, 0.95);
  drawArrow(ctx, px(1.02), py(PI), anchors.pI.x - 10, anchors.pI.y, '#111', selectedLandmark === 'pI' ? 1.7 : 1, 0.95);
  drawArrow(ctx, px(1.52), py(PKA2), anchors.pKa2.x - 10, anchors.pKa2.y, '#111', selectedLandmark === 'pKa2' ? 1.7 : 1, 0.95);
  drawArrow(ctx, px(2.0), py(11.55), anchors.high.x - 10, anchors.high.y, '#111', selectedLandmark === 'high' ? 1.7 : 1, 0.95);

  if (netChargeView) {
    var cw = Math.min(330, rightW - 16), ch = 55;
    drawChargeCard(ctx, rightX + 8, yTop - 34, cw, ch, 'Fully deprotonated', 'H2NCH(CH3)COO−', '−1', ar === 'high');
    drawChargeCard(ctx, rightX + 8, yPka2 - 34, cw, ch, 'pKa2 mixture', '50:50 net 0 and −1 forms', '½', ar === 'pKa2');
    drawChargeCard(ctx, rightX + 8, yPi - 34, cw, ch, 'Isoelectric zwitterion', '+ and − internal charges cancel', '0', ar === 'pI');
    drawChargeCard(ctx, rightX + 8, yPka1 - 34, cw, ch, 'pKa1 mixture', '50:50 net +1 and 0 forms', '½', ar === 'pKa1');
    drawChargeCard(ctx, rightX + 8, yLow - 34, cw, ch, 'Fully protonated', 'H3N+CH(CH3)COOH', '+1', ar === 'low');
  } else {
    var box;
    if (ar === 'high') { ctx.fillStyle = 'rgba(0,139,210,0.10)'; ctx.strokeStyle = '#008bd2'; ctx.lineWidth = 2; roundRect(ctx, rightX - 2, yTop - 63 * s, 170 * s, 118 * s, 8, true, true); }
    box = drawAlanine(ctx, rightX + 14 * s, yTop, 'deprot', s);
    hitRegions.push({ type: 'species', x: box.x, y: box.y, w: box.w, h: box.h, text: 'Fully deprotonated alanine: H2NCH(CH3)COO−, net −1.' });

    if (ar === 'pKa2') { ctx.fillStyle = 'rgba(255,0,153,0.08)'; ctx.strokeStyle = '#ff0099'; ctx.lineWidth = 2; roundRect(ctx, rightX - 2, yPka2 - 68 * s, 360 * s, 128 * s, 8, true, true); }
    drawBracket(ctx, rightX, yPka2 - 70 * s, 370 * s, 130 * s, s);
    drawAlanine(ctx, rightX + 18 * s, yPka2, 'zwitter', s);
    ctx.fillStyle = '#111'; ctx.font = Math.max(11, 19 * s) + 'px Arial'; ctx.fillText('+', rightX + 168 * s, yPka2 - 2 * s);
    drawAlanine(ctx, rightX + 205 * s, yPka2, 'deprot', s);
    hitRegions.push({ type: 'species', x: rightX, y: yPka2 - 70 * s, w: 370 * s, h: 130 * s, text: 'pKa2: 50:50 zwitterion and deprotonated alanine.' });

    if (ar === 'pI') { ctx.fillStyle = 'rgba(255,0,153,0.10)'; ctx.strokeStyle = '#ff0099'; ctx.lineWidth = 2; roundRect(ctx, rightX - 2, yPi - 63 * s, 170 * s, 118 * s, 8, true, true); }
    box = drawAlanine(ctx, rightX + 14 * s, yPi, 'zwitter', s);
    hitRegions.push({ type: 'species', x: box.x, y: box.y, w: box.w, h: box.h, text: 'Zwitterionic alanine: internal + and − charges, net 0.' });

    if (ar === 'pKa1') { ctx.fillStyle = 'rgba(255,0,153,0.08)'; ctx.strokeStyle = '#ff0099'; ctx.lineWidth = 2; roundRect(ctx, rightX - 2, yPka1 - 68 * s, 360 * s, 128 * s, 8, true, true); }
    drawBracket(ctx, rightX, yPka1 - 70 * s, 370 * s, 130 * s, s);
    drawAlanine(ctx, rightX + 18 * s, yPka1, 'full', s);
    ctx.fillStyle = '#111'; ctx.font = Math.max(11, 19 * s) + 'px Arial'; ctx.fillText('+', rightX + 168 * s, yPka1 - 2 * s);
    drawAlanine(ctx, rightX + 205 * s, yPka1, 'zwitter', s);
    hitRegions.push({ type: 'species', x: rightX, y: yPka1 - 70 * s, w: 370 * s, h: 130 * s, text: 'pKa1: 50:50 fully protonated alanine and zwitterion.' });

    if (ar === 'low') { ctx.fillStyle = 'rgba(255,0,153,0.10)'; ctx.strokeStyle = '#ff0099'; ctx.lineWidth = 2; roundRect(ctx, rightX - 2, yLow - 63 * s, 170 * s, 118 * s, 8, true, true); }
    box = drawAlanine(ctx, rightX + 14 * s, yLow, 'full', s);
    hitRegions.push({ type: 'species', x: box.x, y: box.y, w: box.w, h: box.h, text: 'Fully protonated alanine: H3N+ and COOH, net +1.' });
  }
}

var alaninePlugin = {
  id: 'alanineTitrationCustom',
  afterDraw: function (chart) {
    drawFigure(chart);
  }
};

var chart = new Chart(canvas.getContext('2d'), {
  type: 'scatter',
  data: { datasets: [] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    events: [],
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: { x: { display: false, min: 0, max: 2 }, y: { display: false, min: 0, max: 12 } }
  },
  plugins: [alaninePlugin]
});
window.__markRendered();

canvas.addEventListener('mousemove', function (e) {
  var r = canvas.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var hit = null;
  for (var i = hitRegions.length - 1; i >= 0; i--) {
    var h = hitRegions[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { hit = h; break; }
  }
  if (hit) {
    canvas.style.cursor = 'pointer';
    showTooltip(hit.text, e);
  } else {
    canvas.style.cursor = 'default';
    hideTooltip();
  }
});

canvas.addEventListener('mouseleave', function () {
  canvas.style.cursor = 'default';
  hideTooltip();
});

canvas.addEventListener('click', function (e) {
  var r = canvas.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  for (var i = hitRegions.length - 1; i >= 0; i--) {
    var h = hitRegions[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
      if (h.type === 'landmark') {
        selectedLandmark = h.id;
        currentEq = h.eq;
        var slider = document.getElementById('baseEquivalentsInput');
        if (slider) slider.value = currentEq;
        var out = document.getElementById('baseEquivalentsVal');
        if (out) out.value = currentEq.toFixed(2);
        chart.update('none');
        showPopup(h.text, h.popup);
      } else {
        showPopup('Alanine form', h.text + ' Moving the base-equivalents slider shifts which form or mixture is emphasized.');
      }
      return;
    }
  }
});

document.addEventListener('fig-resize', function () {
  if (chart) chart.resize();
});

goToStep(0);
