<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<strong style="font-size:12px">Total internal reflection</strong>
<span style="font-size:11px;color:#555;line-height:1.35">Panels (a)(b)(c) are three frames of one sweep. Switch to the live panel and raise θ₁ past θ<sub>c</sub>.</span>
<label><input id="viewModeInput" type="checkbox" onchange="toggle_viewMode(this.checked)"> Single-panel sweep (live)</label>
<label>Angle of incidence θ₁ (degrees): <output id="incidentAngleVal">25</output><input id="incidentAngleInput" type="range" min="0" max="89" step="1" value="25" oninput="document.getElementById('incidentAngleVal').value=this.value;update_incidentAngle(+this.value)"></label>
<label>Index ratio n₂/n₁: <output id="indexRatioVal">0.67</output><input id="indexRatioInput" type="range" min="0.3" max="0.95" step="0.01" value="0.67" oninput="document.getElementById('indexRatioVal').value=(+this.value).toFixed(2);update_indexRatio(+this.value)"></label>
<label><input id="showCriticalRefInput" type="checkbox" checked onchange="toggle_showCriticalRef(this.checked)"> Show dashed θ<sub>c</sub> reference ray</label>
<label><input id="showReadoutInput" type="checkbox" onchange="toggle_showReadout(this.checked)"> Expand numeric readout chip</label>
<span style="border-top:1px solid #dcdfe3;margin-top:4px;padding-top:5px;font-size:11px;font-weight:bold" id="demoTitle">1. The figure as printed</span>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.4;color:#333">Three panels of one boundary.</p>
<span style="display:flex;gap:6px;align-items:center"><button onclick="prevStep()">◀</button> <span id="stepLabel">1 / 7</span> <button onclick="nextStep()">▶</button></span>
<button onclick="showKeyInsight()">Key insight</button>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var TEAL = '#1B7A8C', TEAL_HOT = '#0F8FA8', INK = '#1a1a1a';
var SERIF = 'Georgia, "Times New Roman", serif';
var fdraw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
var fstate = { theta1: 25, ratio: 0.67, single: false, showCrit: true, readout: false };
var fgrad = null;

/* ---------- text helpers ---------- */
function fTxt(g, str, x, y, size, color, italic, align) {
  var t = g.text(str).font({ family: SERIF, size: size, style: italic ? 'italic' : 'normal' }).fill(color || INK);
  t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': Math.max(2.4, size * 0.30), 'stroke-linejoin': 'round' });
  t.css('pointer-events', 'none');
  var b = t.bbox();
  if (align === 'left') t.move(x, y - b.height / 2);
  else if (align === 'right') t.move(x - b.width, y - b.height / 2);
  else t.move(x - b.width / 2, y - b.height / 2);
  return t;
}
/* rich text with subscripts: parts = [{s:'θ',it:true},{s:'c',sub:true}] — every run
   is positioned at an explicit x offset, never with trailing spaces */
function fRich(g, parts, x, y, size, color, align) {
  var els = [], wsum = 0, i;
  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    var sz = p.sub ? size * 0.72 : size;
    var t = g.text(p.s).font({ family: SERIF, size: sz, style: p.it ? 'italic' : 'normal' }).fill(p.c || color || INK);
    t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': Math.max(2.4, sz * 0.30), 'stroke-linejoin': 'round' });
    t.css('pointer-events', 'none');
    var b = t.bbox();
    els.push({ t: t, w: b.width + (p.gap || 0), h: b.height, sub: p.sub });
    wsum += b.width + (p.gap || 0);
  }
  var sx = (align === 'left') ? x : (align === 'right' ? x - wsum : x - wsum / 2);
  for (i = 0; i < els.length; i++) {
    var e = els[i];
    e.t.move(sx, y - e.h / 2 + (e.sub ? size * 0.26 : 0));
    sx += e.w;
  }
  return wsum;
}

/* ---------- geometry helpers ---------- */
function fArrow(g, x, y, ux, uy, size, color) {
  var px = -uy, py = ux;
  var tx = x + ux * size * 0.60, ty = y + uy * size * 0.60;
  var bx = x - ux * size * 0.45, byy = y - uy * size * 0.45;
  g.polygon([[tx, ty], [bx + px * size * 0.40, byy + py * size * 0.40], [bx - px * size * 0.40, byy - py * size * 0.40]])
    .fill(color).stroke('none').css('pointer-events', 'none');
}
function fClamp(cx, cy, ux, uy, b, L) {
  if (ux > 1e-6) L = Math.min(L, (b.x1 - cx) / ux); else if (ux < -1e-6) L = Math.min(L, (b.x0 - cx) / ux);
  if (uy > 1e-6) L = Math.min(L, (b.y1 - cy) / uy); else if (uy < -1e-6) L = Math.min(L, (b.y0 - cy) / uy);
  return Math.max(6, L);
}
function fArc(g, cx, cy, r, a0, a1, dir, color, dash, wdt) {
  var pts = [], n = 28;
  for (var i = 0; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; var d = dir(a); pts.push([cx + r * d[0], cy + r * d[1]]); }
  var p = g.polyline(pts).fill('none').stroke({ color: color, width: wdt || 1.3 }).css('pointer-events', 'none');
  if (dash) p.attr('stroke-dasharray', '5,4');
  return p;
}
var DL = function (a) { return [-Math.sin(a), Math.cos(a)]; };
var DR = function (a) { return [Math.sin(a), Math.cos(a)]; };
var UR = function (a) { return [Math.sin(a), -Math.cos(a)]; };

function fHit(g, x1, y1, x2, y2, wdt, tip, title, body) {
  var h = g.line(x1, y1, x2, y2).stroke({ color: '#000', width: Math.max(14, wdt * 4), opacity: 0, linecap: 'round' });
  h.css('cursor', 'pointer');
  h.on('mousemove', function (e) { showTooltip(tip, e); });
  h.on('mouseleave', function () { hideTooltip(); });
  h.on('click', function () { showPopup(title, body); });
  return h;
}

/* ---------- annotation with curved leader ---------- */
function boxExit(tx, ty, hw, hh, ux, uy) {
  var t = 1e9;
  if (Math.abs(ux) > 1e-6) t = Math.min(t, hw / Math.abs(ux));
  if (Math.abs(uy) > 1e-6) t = Math.min(t, hh / Math.abs(uy));
  return [tx + ux * t, ty + uy * t];
}
function fAnnot(g, label, lx, ly, ax, ay, fs, bend) {
  var t = fTxt(g, label, lx, ly, fs, INK, false, 'center');
  var b = t.bbox();
  var dx = ax - lx, dy = ay - ly, L = Math.sqrt(dx * dx + dy * dy) || 1;
  var ux = dx / L, uy = dy / L;
  var s = boxExit(lx, ly, b.width / 2 + fs * 0.25, b.height / 2 + fs * 0.2, ux, uy);
  var ex = ax - ux * fs * 0.55, ey = ay - uy * fs * 0.55;
  var mx = (s[0] + ex) / 2 - uy * fs * bend, my = (s[1] + ey) / 2 + ux * fs * bend;
  g.path('M' + s[0] + ',' + s[1] + ' Q' + mx + ',' + my + ' ' + ex + ',' + ey)
    .fill('none').stroke({ color: INK, width: Math.max(1.3, fs * 0.085), linecap: 'round' })
    .css('pointer-events', 'none');
  var tgx = ex - mx, tgy = ey - my, tl = Math.sqrt(tgx * tgx + tgy * tgy) || 1;
  fArrow(g, ex, ey, tgx / tl, tgy / tl, fs * 0.95, INK);
}

/* ---------- one optical panel ---------- */
function drawPanel(o) {
  var g = fdraw.group();
  var x0 = o.x0, y0 = o.y0, w = o.w, h = o.h;
  var blockH = Math.min(w / 2.2, h * 0.46);
  var upperH = blockH * 0.85;
  var top = y0 + (h - blockH - upperH) / 2;
  var by = top + upperH, blockBot = by + blockH;
  var cx = x0 + w * 0.47;
  var fs = Math.max(o.fsMin, Math.min(26, blockH * 0.108));
  var sw = Math.max(2, blockH * 0.0125);
  var r = blockH * 0.30;
  var ov = blockH * 0.075;                       /* rays overshoot the vertex slightly */

  var th1 = o.theta1 * Math.PI / 180;
  var ratio = o.ratio;
  var thc = Math.asin(Math.min(0.9999, ratio)), thcDeg = thc * 180 / Math.PI;
  var s2 = Math.sin(th1) / ratio;
  var grazing = Math.abs(o.theta1 - thcDeg) < 0.8;
  var refr = !grazing && s2 < 1;
  var tir = !grazing && s2 >= 1;
  var th2 = refr ? Math.asin(Math.min(1, s2)) : Math.PI / 2;

  /* denser medium block */
  var med = g.rect(w, blockH).move(x0, by).fill(fgrad).stroke({ color: '#7fb2cc', width: 1.1 });
  med.css('cursor', 'pointer');
  med.on('mousemove', function (e) { showTooltip('Denser medium n₁ — the light travels inside here', e); });
  med.on('mouseleave', function () { hideTooltip(); });
  med.on('click', function () { showPopup('The denser medium n₁', 'Light starts inside this medium, whose index n₁ is larger than the index n₂ above. Because n₁ > n₂ the refracted ray always bends away from the normal, which is exactly why a critical angle exists.'); });

  /* normal */
  var ntop = top + blockH * 0.12;
  g.line(cx, ntop, cx, blockBot - blockH * 0.02).stroke({ color: '#222', width: 1.4, dasharray: '8,6' }).css('pointer-events', 'none');
  fHit(g, cx, ntop, cx, blockBot, 1.4, 'Normal — every angle is measured from this line',
    'The normal', 'The dashed line is perpendicular to the interface. Every angle in Snell\'s law — θ₁, θ₂ and θ_c — is measured from this normal, not from the surface.');

  /* bounds (rays are allowed to overshoot the block edge a little, as in the source) */
  var lb = { x0: x0 - w * 0.012, x1: x0 + w + w * 0.012, y0: by, y1: blockBot + blockH * 0.05 };
  var ub = { x0: x0 + w * 0.02, x1: x0 + w - w * 0.02, y0: top + blockH * (o.annot ? 0.22 : 0.08), y1: by };

  var si = Math.sin(th1), ci = Math.cos(th1);

  /* incident ray (tail lower-left → vertex, overshooting slightly past it) */
  var Li = fClamp(cx, by, -si, ci, lb, blockH * 3);
  var ix = cx - Li * si, iy = by + Li * ci;
  g.line(ix, iy, cx + ov * si, by - ov * ci).stroke({ color: TEAL, width: sw, linecap: 'round' }).css('pointer-events', 'none');
  fArrow(g, cx - Li * 0.40 * si, by + Li * 0.40 * ci, si, -ci, sw * 3.4, TEAL);
  fHit(g, ix, iy, cx, by, sw, 'Incident ray, θ₁ = ' + o.theta1.toFixed(0) + '°',
    'Incident ray', 'Light travelling inside the dense medium n₁ strikes the boundary at angle θ₁ from the normal. Snell\'s law n₁ sin θ₁ = n₂ sin θ₂ decides what happens next.');

  /* reflected ray */
  var Lr = fClamp(cx, by, si, ci, lb, blockH * 3);
  var rx = cx + Lr * si, ry = by + Lr * ci;
  var rcol = tir ? TEAL_HOT : TEAL, rwid = tir ? sw * 1.45 : sw;
  g.line(cx - ov * si, by - ov * ci, rx, ry).stroke({ color: rcol, width: rwid, linecap: 'round' }).css('pointer-events', 'none');
  fArrow(g, cx + Lr * 0.86 * si, by + Lr * 0.86 * ci, si, ci, rwid * 3.2, rcol);
  fHit(g, cx, by, rx, ry, rwid, tir ? 'Reflected ray — now carries 100% of the light' : 'Reflected ray, also at θ₁',
    'Reflected ray', 'Reflection always happens, at an angle equal to θ₁ on the other side of the normal. Beyond the critical angle it is the only surviving ray, so it carries all of the light.');

  /* refracted ray */
  var fx = 0, fy = 0;
  if (refr) {
    var s2s = Math.sin(th2), c2 = Math.cos(th2);
    var L2 = fClamp(cx, by, s2s, -c2, ub, blockH * 1.05);
    fx = cx + L2 * s2s; fy = by - L2 * c2;
    g.line(cx - ov * 0.7 * s2s, by + ov * 0.7 * c2, fx, fy).stroke({ color: TEAL, width: sw, linecap: 'round' }).css('pointer-events', 'none');
    fArrow(g, cx + L2 * 0.86 * s2s, by - L2 * 0.86 * c2, s2s, -c2, sw * 3.2, TEAL);
    fHit(g, cx, by, fx, fy, sw, 'Refracted ray, θ₂ = ' + (th2 * 180 / Math.PI).toFixed(1) + '°',
      'Refracted ray', 'The transmitted ray bends away from the normal because n₂ < n₁. As θ₁ grows, θ₂ races toward 90° much faster — and once sin θ₁ exceeds n₂/n₁ there is no angle θ₂ left to use.');
  } else if (grazing) {
    var Lg = Math.min(w * 0.42, x0 + w - w * 0.03 - cx);
    g.line(cx, by, cx + Lg, by).stroke({ color: TEAL, width: sw, linecap: 'round' }).css('pointer-events', 'none');
    fArrow(g, cx + Lg * 0.87, by, 1, 0, sw * 3.2, TEAL);
    fHit(g, cx, by, cx + Lg, by, sw, 'Refracted ray grazes the surface: θ₂ = 90°',
      'Grazing refraction', 'At exactly the critical angle the refracted ray lies flat along the interface, θ₂ = 90°. Putting θ₂ = 90° into Snell\'s law gives sin θ_c = n₂/n₁.');
    /* right-angle square between normal and boundary (source panel b) */
    var sq = blockH * 0.115;
    g.rect(sq, sq).move(cx, by - sq).fill('none').stroke({ color: '#222', width: 1.4 }).css('pointer-events', 'none');
  }

  /* dashed critical-angle reference ray */
  var showC = o.showCrit;
  var cxr = 0, cyr = 0;
  if (showC) {
    var Lc = fClamp(cx, by, -Math.sin(thc), Math.cos(thc), lb, blockH * 3) * 0.90;
    cxr = cx - Lc * Math.sin(thc); cyr = by + Lc * Math.cos(thc);
    g.line(cxr, cyr, cx, by).stroke({ color: TEAL, width: Math.max(1.6, sw * 0.8), dasharray: '10,6', opacity: 0.85 }).css('pointer-events', 'none');
    fHit(g, cxr, cyr, cx, by, sw, 'Critical-angle reference: θc = ' + thcDeg.toFixed(1) + '°',
      'The critical angle θc', 'This dashed ray is drawn at sin θ_c = n₂/n₁. Any incident ray inside this angle refracts; any ray outside it is totally internally reflected. Change the index ratio and the dashed line swings to a new threshold.');
  }

  /* angle arcs */
  fArc(g, cx, by, r, 0, th1, DL, INK, false, 1.3);
  fArc(g, cx, by, r, 0, th1, DR, INK, false, 1.3);
  if (refr) fArc(g, cx, by, r * 0.92, 0, th2, UR, INK, false, 1.3);
  if (showC && Math.abs(thc - th1) > 0.02) fArc(g, cx, by, r * 1.70, 0, thc, DL, TEAL, true, 1.2);

  /* ---------- text layer (drawn last, haloed) ---------- */
  fTxt(g, 'n₁', x0 + w * 0.90, by + blockH * 0.16, fs * 1.08, INK, true, 'center');
  fTxt(g, 'n₂', x0 + w * 0.08, by - blockH * 0.50, fs * 1.08, INK, true, 'center');

  var rl = r * 1.50;
  if (grazing) {
    fRich(g, [{ s: 'θ', it: true }, { s: 'c', sub: true }], cx - rl * Math.sin(th1 * 0.55), by + rl * Math.cos(th1 * 0.55), fs, INK, 'center');
    fRich(g, [{ s: 'θ', it: true }, { s: 'c', sub: true }], cx + rl * Math.sin(th1 * 0.55), by + rl * Math.cos(th1 * 0.55), fs, INK, 'center');
    fTxt(g, 'θ₂ = 90°', cx + blockH * 0.135 + fs * 0.45, by - blockH * 0.075, fs, INK, false, 'left');
  } else {
    var leftIsCrit = showC && tir;               /* source panel (c): left arc reads θc */
    if (leftIsCrit) {
      fRich(g, [{ s: 'θ', it: true }, { s: 'c', sub: true }], cx - r * 2.10 * Math.sin(thc * 0.55), by + r * 2.10 * Math.cos(thc * 0.55), fs, INK, 'center');
      fTxt(g, 'θ₁', cx - rl * Math.sin(th1 * 0.55), by + rl * Math.cos(th1 * 0.55), fs, INK, true, 'center');
    } else {
      fTxt(g, 'θ₁', cx - rl * Math.sin(th1 * 0.55), by + rl * Math.cos(th1 * 0.55), fs, INK, true, 'center');
      if (showC) fRich(g, [{ s: 'θ', it: true }, { s: 'c', sub: true }],
        cx - r * 2.10 * Math.sin(thc * 0.55), by + r * 2.10 * Math.cos(thc * 0.55), fs, TEAL, 'center');
    }
    fTxt(g, 'θ₁', cx + rl * Math.sin(th1 * 0.55), by + rl * Math.cos(th1 * 0.55), fs, INK, true, 'center');
    if (refr) fTxt(g, 'θ₂', cx + r * 1.44 * Math.sin(th2 * 0.55), by - r * 1.44 * Math.cos(th2 * 0.55), fs, INK, true, 'center');
  }

  if (tir) {   /* source panel (c) wording, two lines inside the lower medium */
    fTxt(g, 'Total internal', x0 + w * 0.79, by + blockH * 0.30, fs * 0.98, INK, false, 'center');
    fTxt(g, 'reflection', x0 + w * 0.79, by + blockH * 0.30 + fs * 1.18, fs * 0.98, INK, false, 'center');
  }

  /* word annotations with curved leaders (source panel (a) only / live panel) */
  if (o.annot) {
    var af = fs * 0.92;
    fAnnot(g, 'Incident ray', x0 + w * 0.15, by - af * 1.05,
      cx - Li * 0.55 * si, by + Li * 0.55 * ci, af, 0.7);
    fAnnot(g, 'Reflected ray', cx + w * 0.24, blockBot + af * 1.7,
      cx + Lr * 0.62 * si, by + Lr * 0.62 * ci, af, -0.9);
    if (refr) {
      var mlx = Math.min(Math.max(cx + (fx - cx) * 0.45, x0 + w * 0.18), x0 + w * 0.80);
      fAnnot(g, 'Refracted ray', mlx, top + af * 0.85,
        cx + (fx - cx) * 0.72, by + (fy - by) * 0.72, af, 0.8);
    }
  }
  return g;
}

/* ---------- collapsible numeric readout chip ---------- */
function drawChip(x, y) {
  var g = fdraw.group();
  var exp = fstate.readout, f = 15.5;
  var th1d = fstate.theta1, ratio = fstate.ratio;
  var thc = Math.asin(Math.min(0.9999, ratio)) * 180 / Math.PI;
  var s2 = Math.sin(th1d * Math.PI / 180) / ratio;
  var graz = Math.abs(th1d - thc) < 0.8;
  var live = fstate.single;
  var w = exp ? 252 : 156, h = exp ? (live ? 136 : 116) : 27;
  var bg = g.rect(w, h).move(x, y).radius(6).fill('#ffffff').opacity(0.96).stroke({ color: '#b9c4cd', width: 1.1 });
  bg.css('cursor', 'pointer');
  bg.on('mousemove', function (e) { showTooltip(exp ? 'Click to collapse the readout' : 'Click to expand the numeric readout', e); });
  bg.on('mouseleave', function () { hideTooltip(); });
  bg.on('click', function () { toggle_showReadout(!fstate.readout); document.getElementById('showReadoutInput').checked = fstate.readout; });

  var tx = x + 12, dy = f * 1.30;
  if (!exp) {
    fRich(g, [{ s: '▸', gap: 8 }, { s: 'θ', it: true }, { s: 'c', sub: true, gap: 2 },
    { s: '= ' + thc.toFixed(1) + '°', gap: 0 }], tx, y + h / 2, f, INK, 'left');
    return g;
  }
  var ty = y + 18;
  fTxt(g, '▾', x + w - 16, y + 15, f * 0.85, '#666', false, 'center');
  var i = 0;
  if (live) {
    fTxt(g, 'θ₁ = ' + th1d.toFixed(0) + '°', tx, ty + i * dy, f, INK, false, 'left'); i++;
    var s2txt, s2col;
    if (graz) { s2txt = 'θ₂ = 90°  (grazing)'; s2col = '#a35c00'; }
    else if (s2 < 1) { s2txt = 'θ₂ = ' + (Math.asin(s2) * 180 / Math.PI).toFixed(1) + '°'; s2col = TEAL; }
    else { s2txt = 'θ₂ = none  (total refl.)'; s2col = '#a63428'; }
    fTxt(g, s2txt, tx, ty + i * dy, f, s2col, false, 'left'); i++;
  } else {
    fTxt(g, '(a) θ₁ < θc   (b) θ₁ = θc   (c) θ₁ > θc', tx, ty + i * dy, f * 0.86, '#444', false, 'left'); i++;
  }
  fTxt(g, 'n₂/n₁ = ' + ratio.toFixed(2), tx, ty + i * dy, f, INK, false, 'left'); i++;
  fRich(g, [{ s: 'θ', it: true }, { s: 'c', sub: true, gap: 3 }, { s: '= ' + thc.toFixed(1) + '°' }],
    tx, ty + i * dy, f, INK, 'left'); i++;
  fTxt(g, 'n₁ sin θ₁ = n₂ sin θ₂', tx, ty + i * dy + 5, f * 0.92, '#555', true, 'left'); i++;
  fRich(g, [{ s: 'sin ', it: true }, { s: 'θ', it: true }, { s: 'c', sub: true, gap: 3 }, { s: '= n₂/n₁', it: true }],
    tx, ty + i * dy + 5, f * 0.92, '#555', 'left');
  return g;
}

/* ---------- render ---------- */
function render() {
  fdraw.clear();
  fgrad = fdraw.gradient('linear', function (add) {
    add.stop(0, '#a4c6da'); add.stop(0.45, '#dcecf4'); add.stop(0.74, '#ffffff'); add.stop(1, '#cfe3ee');
  });
  fgrad.from(0, 0).to(1, 0.75);

  if (fstate.single) {
    var chipH = fstate.readout ? 136 : 27;
    var vbH = 600;
    fdraw.viewbox(0, 0, 720, vbH);
    drawPanel({
      x0: 10, y0: 4, w: 700, h: vbH - chipH - 26, fsMin: 17, annot: true,
      theta1: fstate.theta1, ratio: fstate.ratio, showCrit: fstate.showCrit
    });
    drawChip(12, vbH - chipH - 10);
  } else {
    var exp = fstate.readout;
    var vbH2 = exp ? 540 : 400;
    fdraw.viewbox(0, 0, 990, vbH2);
    var gap = 16, pw = (990 - 4 * gap) / 3, ph = 340, py = 6;
    var thc = Math.asin(Math.min(0.9999, fstate.ratio)) * 180 / Math.PI;
    var angs = [Math.max(6, thc - 18), thc, Math.min(88, thc + 17)];
    var caps = ['(a)', '(b)', '(c)'];
    for (var i = 0; i < 3; i++) {
      var px = gap + i * (pw + gap);
      drawPanel({
        x0: px, y0: py, w: pw, h: ph, fsMin: 15, annot: (i === 0),
        theta1: angs[i], ratio: fstate.ratio,
        showCrit: (i === 2) ? true : (fstate.showCrit && i === 0)
      });
      fTxt(fdraw, caps[i], px + pw * 0.47, py + ph + 18, 20, INK, false, 'center');
    }
    drawChip(exp ? 20 : 814, exp ? 400 : 368);
  }
}

/* ---------- controls ---------- */
function update_incidentAngle(v) { fstate.theta1 = v; if (!fstate.single) { fstate.single = true; document.getElementById('viewModeInput').checked = true; } render(); }
function update_indexRatio(v) { fstate.ratio = v; render(); }
function toggle_viewMode(on) { fstate.single = on; render(); }
function toggle_showCriticalRef(on) { fstate.showCrit = on; render(); }
function toggle_showReadout(on) { fstate.readout = on; render(); }
function showKeyInsight() {
  showPopup('Key insight', 'Total internal reflection is not a new effect but the point where refraction runs out of room: once θ₂ would have to exceed 90°, Snell\'s law has no solution and all the light must reflect — and that threshold is fixed entirely by sin θ_c = n₂/n₁.');
}

/* ---------- demo steps ---------- */
var STEPS = [
  { t: 'The figure as printed', n: 'Three panels of one boundary between a dense medium n₁ below and a lighter medium n₂ above: in (a) the ray refracts out, in (b) it grazes the surface at θ₂ = 90°, in (c) it is entirely reflected back.', s: { v: false, r: 0.67, c: true, o: false } },
  { t: 'Ordinary refraction (a)', n: 'Switch to the live single panel at a modest angle: the ray splits, part reflecting at θ₁ and part refracting into n₂, bent away from the normal so θ₂ > θ₁.', s: { v: true, a: 25, r: 0.67, c: true, o: true } },
  { t: 'Bending farther out', n: 'Push θ₁ higher and the refracted ray swings toward the surface far faster than θ₁ grows, because n₁ sin θ₁ = n₂ sin θ₂ with n₁ > n₂.', s: { v: true, a: 36, r: 0.67, c: true, o: true } },
  { t: 'The critical angle (b)', n: 'At θ₁ = θc ≈ 42° the refracted ray lies flat along the boundary, θ₂ = 90°, and the live ray sits exactly on the dashed reference — this is where sin θc = n₂/n₁.', s: { v: true, a: 42, r: 0.67, c: true, o: true } },
  { t: 'Total internal reflection (c)', n: 'Beyond θc Snell\'s law has no solution for θ₂ — the refracted ray disappears and all the light returns into n₁ as a brighter reflected ray.', s: { v: true, a: 60, r: 0.67, c: true, o: true } },
  { t: 'Moving the threshold', n: 'Hold θ₁ at 60° and raise n₂/n₁: the dashed θc line swings outward and, once θc passes 60°, the refracted ray reappears. The indices control the threshold, not the ray.', s: { v: true, a: 60, r: 0.92, c: true, o: true } },
  { t: 'Back to the three snapshots', n: 'Returning to the printed figure, (a), (b) and (c) now read as θ₁ < θc, θ₁ = θc and θ₁ > θc — one continuous story frozen at three moments.', s: { v: false, r: 0.67, c: true, o: false } }
];
var curStep = 0;
function applyStep(i) {
  curStep = (i + STEPS.length) % STEPS.length;
  var st = STEPS[curStep].s;
  if (st.a != null) fstate.theta1 = st.a;
  fstate.ratio = st.r; fstate.single = st.v; fstate.showCrit = st.c; fstate.readout = st.o;
  document.getElementById('incidentAngleInput').value = fstate.theta1;
  document.getElementById('incidentAngleVal').value = fstate.theta1;
  document.getElementById('indexRatioInput').value = fstate.ratio;
  document.getElementById('indexRatioVal').value = fstate.ratio.toFixed(2);
  document.getElementById('viewModeInput').checked = fstate.single;
  document.getElementById('showCriticalRefInput').checked = fstate.showCrit;
  document.getElementById('showReadoutInput').checked = fstate.readout;
  document.getElementById('demoTitle').textContent = (curStep + 1) + '. ' + STEPS[curStep].t;
  document.getElementById('demoNarration').textContent = STEPS[curStep].n;
  document.getElementById('stepLabel').textContent = (curStep + 1) + ' / ' + STEPS.length;
  render();
}
function nextStep() { applyStep(curStep + 1); }
function prevStep() { applyStep(curStep - 1); }

applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
