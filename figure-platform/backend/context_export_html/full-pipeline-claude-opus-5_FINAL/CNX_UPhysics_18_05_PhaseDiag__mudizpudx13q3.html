<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:bold;font-size:12px">H₂O phase diagram — guided demo</span>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.45;min-height:80px"></span>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;flex:1;text-align:center"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Temperature <i>T</i> (°C): <output id="temperatureVal">25</output>
  <input id="temperatureInput" type="range" min="0.022" max="0.9" step="0.0005" value="0.408" oninput="update_temperature(+this.value)">
</label>
<label>Pressure <i>p</i> (atm): <output id="pressureVal">1.00</output>
  <input id="pressureInput" type="range" min="-3" max="2.477" step="0.002" value="0" oninput="update_pressure(+this.value)">
</label>
<label>Heating path
  <select id="heatingPathInput" onchange="toggle_heatingPath(this.value)">
    <option>Free explore</option>
    <option>1 atm path</option>
    <option>Low-pressure path (0.003 atm)</option>
    <option>Supercritical path (250 atm)</option>
  </select>
</label>
<button onclick="trigger_tracePath()">▶ Heat the sample along the path</button>
<span style="font-size:11px;border-top:1px solid #dcdfe3;padding-top:5px"><b>State point</b></span>
<span id="stateReadout" style="font-size:11px;font-family:ui-monospace,Consolas,monospace"></span>
<span id="phaseReadout" style="font-size:12px;font-weight:bold"></span>
<span style="font-size:10px;color:#666;line-height:1.35">Drag inside the plot to move the state point. Hover curves and dots for detail; click them for an explanation. Both axes are schematic and strongly compressed, so values close to 0 °C and 0.006 atm are stretched apart.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

        ctx.strokeStyle = '#333'; ctx.lineWidth = cl(S * 0.0026, 1, 2);
        seg(ctx, cxp, yp - hs, cxp, yp + hs);
        var done = uT(state.T) >= cs[i].u;
        txt(ctx, cs[i].label, cxp, yp - hs - 3, {
          align: 'center', baseline: 'alphabetic',
          font: (done ? 'bold ' : '') + (fs * 0.82) + 'px sans-serif', color: done ? '#b0300a' : '#444'
        });
      }
      if (state.path > PC) {
        txt(ctx, 'no boundary crossed', PXu(0.62), yp + hs + fs * 1.05,
          { align: 'center', baseline: 'alphabetic', font: (fs * 0.82) + 'px sans-serif', color: '#7038b0' });
      }
    }

    /* movable state marker — ghosted until the student interacts */
    var ph2 = phaseOf(state.T, state.p);
    var mxp = PXu(cl(uT(state.T), 0, 1)), myp = PYv(cl(vP(state.p), 0, 1));
    var rm = cl(S * 0.016, 4, 8.5);
    ctx.save();
    ctx.globalAlpha = touched ? 1 : 0.22;
    ctx.lineWidth = cl(S * 0.0045, 1.5, 3);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111';
    ctx.beginPath(); ctx.arc(mxp, myp, rm, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = PHASE[ph2].c;
    ctx.beginPath(); ctx.arc(mxp, myp, rm * 0.36, 0, 6.2832); ctx.fill();
    ctx.restore();

    ctx.restore();
  }
};

var layoutPlugin = {
  id: 'padw',
  beforeLayout: function (chart) {
    var w = chart.width, h = chart.height, S = Math.min(w, h);
    chart.options.layout.padding = {
      left: cl(w * 0.20, 54, 130), right: cl(w * 0.15, 46, 105),
      top: cl(h * 0.14, 34, 74), bottom: cl(h * 0.15, 38, 76)
    };
    var bw = cl(S * 0.0048, 1.4, 2.6);
    chart.data.datasets.forEach(function (d) { d.borderWidth = bw; });
  }
};

var chart = new Chart(_cv.getContext('2d'), {
  type: 'scatter',
  data: {
    datasets: [
      { label: 'melting', data: meltPts, showLine: true, pointRadius: 0, borderColor: RED, borderWidth: 2, tension: 0 },
      { label: 'vaporization', data: vapPts, showLine: true, pointRadius: 0, borderColor: RED, borderWidth: 2, tension: 0 },
      { label: 'sublimation', data: subPts, showLine: true, pointRadius: 0, borderColor: RED, borderWidth: 2, tension: 0 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false, animation: false, events: [],
    layout: { padding: 40 },
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      x: { type: 'linear', min: 0, max: 1, display: false },
      y: { type: 'linear', min: 0, max: 1, display: false }
    }
  },
  plugins: [layoutPlugin, bgPlugin, fgPlugin]
});
window.__markRendered();

/* ================= formatting / setters ================= */
function fmtT(T) {
  if (Math.abs(T) < 0.1) return T.toFixed(3);
  if (Math.abs(T) < 10) return T.toFixed(1);
  return T.toFixed(0);
}
function fmtP(p) {
  if (p < 0.01) return p.toFixed(4);
  if (p < 1) return p.toFixed(3);
  if (p < 10) return p.toFixed(2);
  return p.toFixed(0);
}
function setT(T) {
  T = cl(T, -20, 500);
  state.T = T;
  document.getElementById('temperatureInput').value = uT(T).toFixed(4);
  document.getElementById('temperatureVal').value = fmtT(T);
}
function setP(p) {
  p = cl(p, 0.001, 300);
  state.p = p;
  document.getElementById('pressureInput').value = String(cl(L10(p), -3, 2.477));
  document.getElementById('pressureVal').value = fmtP(p);
}
function redraw() {
  var ph = phaseOf(state.T, state.p);
  document.getElementById('stateReadout').textContent =
    'T = ' + fmtT(state.T) + ' °C   p = ' + fmtP(state.p) + ' atm';
  var el = document.getElementById('phaseReadout');
  el.textContent = PHASE[ph].name;
  el.style.color = PHASE[ph].c;
  chart.update('none');
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }

/* ================= controls ================= */
function update_temperature(u) {
  stopAnim(); touched = true;
  var T = cl(Tu(u), -20, 500);
  state.T = T;
  document.getElementById('temperatureVal').value = fmtT(T);
  redraw();
}
function update_pressure(lg) {
  stopAnim(); touched = true;
  var p = cl(Math.pow(10, lg), 0.001, 300);
  state.p = p;
  document.getElementById('pressureVal').value = fmtP(p);
  redraw();
}
function applyPath(name) {
  state.path = PATHS[name] || null;
  var pi = document.getElementById('pressureInput');
  if (state.path) { setP(state.path); pi.disabled = true; } else { pi.disabled = false; }
}
function toggle_heatingPath(v) { stopAnim(); touched = true; applyPath(v); redraw(); }
function pathEndU() {
  var p = state.p;
  if (p > PC) return 0.90;
  if (p < PT) return 0.64;
  return Math.min(0.90, VAP.inv(vP(p)) + 0.105);
}
function animateU(uTarget, dur) {
  stopAnim(); touched = true;
  var u0 = uT(state.T), t0 = performance.now(); dur = dur || 3400;
  function frame(now) {
    var k = cl((now - t0) / dur, 0, 1);
    setT(Tu(u0 + (uTarget - u0) * k));
    redraw();
    anim = (k < 1) ? requestAnimationFrame(frame) : null;
  }
  anim = requestAnimationFrame(frame);
}
function animateP(pTarget, dur) {
  stopAnim(); touched = true;
  var v0 = vP(state.p), v1 = vP(pTarget), t0 = performance.now(); dur = dur || 2800;
  function frame(now) {
    var k = cl((now - t0) / dur, 0, 1);
    setP(Pv(v0 + (v1 - v0) * k));
    redraw();
    anim = (k < 1) ? requestAnimationFrame(frame) : null;
  }
  anim = requestAnimationFrame(frame);
}
function trigger_tracePath() {
  stopAnim(); touched = true;
  var end = pathEndU();
  setT(Tu(0.05)); redraw();
  animateU(end);
}

/* ================= demo steps ================= */
var U_SQUEEZE = 0.221;   /* inside the solid sliver, left of the triple point */
var STEPS = [
  {
    title: 'Read the map',
    narration: 'Three red curves carve the plane into solid (s), liquid (l) and vapor (v). At room conditions, 25 °C and 1 atm, the state point (faint circle) sits inside the liquid wedge — water is liquid there for no other reason than its location on this map.',
    state: { temperature: 25, pressure: 1, heatingPath: 'Free explore' }
  },
  {
    title: 'Cross the boiling curve',
    narration: 'Slide the temperature right at 1 atm. At 100 °C the point crosses the vaporization curve and the tinted region flips from liquid to vapor — that crossing is boiling.',
    state: { temperature: 130, pressure: 1, heatingPath: 'Free explore' }
  },
  {
    title: 'The triple point',
    narration: 'Drop the pressure to 0.006 atm and the temperature to 0.01 °C. All three curves meet at this single dot, the one condition where ice, water and steam coexist.',
    state: { temperature: 0.01, pressure: 0.006, heatingPath: 'Free explore' }
  },
  {
    title: 'Squeeze ice into water',
    narration: 'Park the point just inside the solid sliver at 1 atm (the T axis is stretched near 0 °C so the fusion curve\u2019s small LEFT lean is readable). Now watch the pressure climb: near 50 atm the point crosses the melting curve and ice becomes liquid — pressure alone melted it, possible only because that curve leans left.',
    state: { temperature: null, pressure: 200, heatingPath: 'Free explore', squeeze: true }
  },
  {
    title: 'Sublimation path',
    narration: 'Choose the low-pressure path, below the triple-point pressure, and heat. The point crosses only the sublimation curve: ice turns straight into vapor with no liquid stage.',
    state: { heatingPath: 'Low-pressure path (0.003 atm)', pressure: 0.003, temperature: 20 }
  },
  {
    title: 'Past the critical point',
    narration: 'Now take the supercritical path above 218 atm and heat past 374 °C. No boundary is crossed — liquid and vapor merge continuously into one indistinguishable supercritical fluid.',
    state: { heatingPath: 'Supercritical path (250 atm)', pressure: 250, temperature: 450 }
  }
];
var curStep = 0;
function applyStep(i) {
  stopAnim();
  curStep = (i + STEPS.length) % STEPS.length;
  var s = STEPS[curStep], st = s.state;
  touched = (curStep !== 0);
  if (st.heatingPath !== undefined) {
    document.getElementById('heatingPathInput').value = st.heatingPath;
    applyPath(st.heatingPath);
  }
  if (st.squeeze) {
    setT(Tu(U_SQUEEZE)); setP(1);
  } else {
    if (st.pressure !== undefined) setP(st.pressure);
    if (st.temperature !== null && st.temperature !== undefined) setT(st.temperature);
  }
  document.getElementById('demoNarration').textContent = s.narration;
  document.getElementById('stepLabel').textContent = (curStep + 1) + '/' + STEPS.length + ' · ' + s.title;
  redraw();
  if (st.squeeze) {
    setTimeout(function () { if (curStep === 3) animateP(st.pressure); }, 400);
  } else if (st.heatingPath && st.heatingPath !== 'Free explore') {
    setT(Tu(0.05)); redraw();
    setTimeout(function () { if (curStep === i % STEPS.length || true) animateU(uT(st.temperature)); }, 350);
  }
}
function nextStep() { applyStep(curStep + 1); }
function prevStep() { applyStep(curStep - 1); }

/* ================= hover / click / drag ================= */
function dist2seg(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  var t = L ? cl(((px - x1) * dx + (py - y1) * dy) / L, 0, 1) : 0;
  var ax = x1 + t * dx - px, ay = y1 + t * dy - py;
  return Math.sqrt(ax * ax + ay * ay);
}
function nearCurve(pts, x, y) {
  var m = 1e9;
  for (var i = 1; i < pts.length; i++) m = Math.min(m, dist2seg(x, y, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]));
  return m;
}
function inArea(x, y) { return gArea && x >= gArea.left && x <= gArea.right && y >= gArea.top && y <= gArea.bottom; }
function hitTest(x, y) {
  if (!gArea) return null;
  var r = cl(gS * 0.03, 8, 14);
  var xt = PXu(uTP), yt = PYv(vTP), xc = PXu(uCP), yc = PYv(vCP);
  if (Math.hypot(x - xt, y - yt) < r) return {
    tip: 'Triple point — 0.01 °C, 0.006 atm', title: 'Triple point',
    popup: 'At 0.01 °C and 0.006 atm the melting, boiling and sublimation curves all meet. This is the only pressure–temperature combination where ice, liquid water and water vapor coexist in equilibrium.'
  };
  if (Math.hypot(x - xc, y - yc) < r) return {
    tip: 'Critical point — 374 °C, 218 atm', title: 'Critical point',
    popup: 'The vaporization curve ends here at 374 °C and 218 atm. Above the critical point the liquid and vapor densities become equal, so there is no boundary left to cross: the substance is a single supercritical fluid.'
  };
  var th = cl(gS * 0.018, 5, 9);
  if (nearCurve(scrCurves.melt, x, y) < th) return {
    tip: 'Fusion (melting) curve — solid ⇄ liquid', title: 'Melting (fusion) curve',
    popup: 'This nearly vertical boundary separates ice from liquid water. For water it leans slightly to the LEFT (negative slope) because ice is less dense than the liquid, so compressing ice at fixed temperature can push the state point across the curve and melt it.'
  };
  if (nearCurve(scrCurves.vap, x, y) < th) return {
    tip: 'Vaporization (boiling) curve — liquid ⇄ vapor', title: 'Vaporization curve',
    popup: 'Along this curve liquid and vapor coexist; it gives the boiling temperature at each pressure (100 °C at 1 atm). It starts at the triple point and rises ever more steeply to the critical point, where the distinction between liquid and vapor disappears.'
  };
  if (nearCurve(scrCurves.sub, x, y) < th) return {
    tip: 'Sublimation curve — solid ⇄ vapor', title: 'Sublimation curve',
    popup: 'Below the triple-point pressure of 0.006 atm no liquid can exist. Heating ice at such low pressure carries the state point across this curve, and the solid passes directly into vapor — sublimation.'
  };
  return null;
}
function setFromPos(x, y) {
  var u = cl((x - gArea.left) / (gArea.right - gArea.left), 0, 1);
  var v = cl((gArea.bottom - y) / (gArea.bottom - gArea.top), 0, 1);
  setT(cl(Tu(u), -20, 500));
  if (!state.path) setP(cl(Pv(v), 0.001, 300));
  redraw();
}
_cv.addEventListener('mousemove', function (ev) {
  var x = ev.offsetX, y = ev.offsetY;
  if (dragging) { setFromPos(x, y); return; }
  var h = hitTest(x, y);
  if (h) { _cv.style.cursor = 'pointer'; showTooltip(h.tip, ev); return; }
  if (inArea(x, y)) {
    _cv.style.cursor = 'crosshair';
    var u = (x - gArea.left) / (gArea.right - gArea.left), v = (gArea.bottom - y) / (gArea.bottom - gArea.top);
    var T = Tu(u), p = Pv(v);
    showTooltip('T = ' + fmtT(T) + ' °C, p = ' + fmtP(p) + ' atm → ' + PHASE[phaseOf(T, p)].name, ev);
  } else { _cv.style.cursor = 'default'; hideTooltip(); }
});
_cv.addEventListener('mouseleave', function () { hideTooltip(); dragging = false; });
_cv.addEventListener('mousedown', function (ev) {
  var x = ev.offsetX, y = ev.offsetY, h = hitTest(x, y);
  if (h) { showPopup(h.title, h.popup); return; }
  if (inArea(x, y)) { stopAnim(); touched = true; dragging = true; setFromPos(x, y); }
});
window.addEventListener('mouseup', function () { dragging = false; });
document.addEventListener('fig-resize', function () { chart.resize(); redraw(); });

/* ================= init ================= */
(function () {
  var ti = document.getElementById('temperatureInput');
  ti.min = uT(-20).toFixed(4);
  ti.max = uT(500).toFixed(4);
})();
applyStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
