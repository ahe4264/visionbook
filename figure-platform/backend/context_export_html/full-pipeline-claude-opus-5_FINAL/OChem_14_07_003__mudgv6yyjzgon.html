<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<strong style="font-size:12px">UV spectrum of 1,3‑butadiene</strong>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.4;color:#333"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:10px;color:#555;flex:1"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Wavelength (nm): <output id="wavelengthScrubVal">217</output>
  <input id="wavelengthScrubInput" type="range" min="200" max="400" step="1" value="217"
    oninput="document.getElementById('wavelengthScrubVal').value=this.value;update_wavelengthScrub(+this.value)">
</label>
<label>Region emphasis
  <select id="regionViewInput" onchange="toggle_regionView(this.value)" style="font-size:11px;padding:2px">
    <option>Full spectrum</option>
    <option>Peak region (200–240 nm)</option>
    <option>Tail region (250–400 nm)</option>
  </select>
</label>
<button onclick="trigger_jumpPeak()">Jump to λmax (217 nm)</button>
<span id="uiReadout" style="font-size:11px;color:#b3006b;font-weight:600;min-height:14px"></span>
<span style="font-size:10px;color:#666;line-height:1.35">Hover or click the plot to read absorbance at any wavelength.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var MAIN = '#e5007e';
var DIM = 'rgba(229,0,126,0.18)';
var PINK = '232,62,142';

function clamp(lo, hi, v) { return Math.max(lo, Math.min(hi, v)); }

/* ── Absorption model ──────────────────────────────────────────────────────
   Broad left flank, rounded crest at ~215 nm (A ≈ 0.87), sharp initial fall
   with a slightly heavier right flank so A ≈ 0.09 at 240 nm, merging smoothly
   into a near-flat tail (0.065 at 250 nm → 0.028 at 400 nm).                */
function tailA(l) { return 0.065 - 0.0002467 * (l - 250); }
function absorb(l) {
  var d = l - 215, pk;
  if (d <= 0) {
    pk = 0.80 * Math.exp(-(d * d) / (2 * 10.06 * 10.06));
  } else {
    var g = 0.88 * Math.exp(-(d * d) / (2 * 7.5 * 7.5));
    var wing = 0.12 / (1 + Math.pow(d / 14, 2.6));
    pk = 0.80 * (g + wing);
  }
  return tailA(l) + pk;
}

var state = { lambda: 217, region: 'Full spectrum', touched: false };

function regionBounds() {
  if (state.region.indexOf('Peak') === 0) return [200, 240];
  if (state.region.indexOf('Tail') === 0) return [250, 400];
  return [200, 400];
}
function inRegion(x) { var b = regionBounds(); return x >= b[0] && x <= b[1]; }

var pts = [];
for (var L = 200; L <= 395.001; L += 0.5) pts.push({ x: L, y: absorb(L) });

/* ── Canvas ─────────────────────────────────────────────────────────────── */
var canvas = document.createElement('canvas');
canvas.style.cssText = 'width:100%;height:100%;display:block';
document.getElementById('container').appendChild(canvas);

/* ── Helpers ────────────────────────────────────────────────────────────── */
function halo(ctx, txt, x, y, color) {
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color || '#111';
  ctx.fillText(txt, x, y);
}
function arrow(ctx, x1, y1, x2, y2, lw, color) {
  var ang = Math.atan2(y2 - y1, x2 - x1);
  var hd = lw * 3.2;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - Math.cos(ang) * hd * 0.7, y2 - Math.sin(ang) * hd * 0.7);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - 0.42) * hd, y2 - Math.sin(ang - 0.42) * hd);
  ctx.lineTo(x2 - Math.cos(ang + 0.42) * hd, y2 - Math.sin(ang + 0.42) * hd);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawLambdaMax(ctx, x, y, fs) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  var cur = x;
  ctx.font = 'italic ' + fs.toFixed(1) + 'px Georgia, "Times New Roman", serif';
  halo(ctx, 'λ', cur, y); cur += ctx.measureText('λ').width;
  ctx.font = 'italic ' + (fs * 0.72).toFixed(1) + 'px Georgia, "Times New Roman", serif';
  halo(ctx, 'max', cur, y + fs * 0.20); cur += ctx.measureText('max').width;
  ctx.font = fs.toFixed(1) + 'px Georgia, "Times New Roman", serif';
  halo(ctx, ' = 217 nm', cur, y);
}
function plotMetric(chart) {
  var a = chart.chartArea;
  if (!a) return 240;
  return Math.min(a.width, a.height * 1.8);
}

/* ── Layout: wide landscape plot that fills most of the frame ───────────── */
var aspectPlugin = {
  id: 'aspectPlugin',
  beforeLayout: function (chart) {
    var w = chart.width, h = chart.height;
    if (!w || !h) return;
    var base = Math.min(w, h * 1.8);
    var fs = clamp(8.5, 14, base * 0.024);
    /* left column reserves room for BOTH the rotated title and the tick labels */
    var padL = clamp(48, 86, w * 0.115);
    var padR = clamp(10, 26, w * 0.03);
    var padTopMin = clamp(8, 20, h * 0.03);
    var padBotMin = clamp(34, 72, base * 0.12);
    var plotW = Math.max(60, w - padL - padR);
    var avail = Math.max(40, h - padTopMin - padBotMin);
    var target = Math.min(avail, plotW / 1.62);
    var extra = Math.max(0, avail - target);
    chart.options.layout.padding = {
      left: padL, right: padR,
      top: padTopMin + extra * 0.45,
      bottom: padBotMin + extra * 0.55
    };
    chart.__padL = padL;
    chart.options.scales.x.ticks.font = { size: fs, family: 'system-ui, sans-serif' };
    chart.options.scales.y.ticks.font = { size: fs, family: 'system-ui, sans-serif' };
  }
};

/* ── Background: soft pink gradient fading slowly to white + region wash ── */
var bgPlugin = {
  id: 'bgPlugin',
  beforeDatasetsDraw: function (chart) {
    var ctx = chart.ctx, a = chart.chartArea, xs = chart.scales.x;
    if (!a) return;
    ctx.save();
    var g = ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0.00, 'rgba(' + PINK + ',0.26)');
    g.addColorStop(0.30, 'rgba(' + PINK + ',0.175)');
    g.addColorStop(0.55, 'rgba(' + PINK + ',0.100)');
    g.addColorStop(0.75, 'rgba(' + PINK + ',0.045)');
    g.addColorStop(0.90, 'rgba(' + PINK + ',0.014)');
    g.addColorStop(1.00, 'rgba(' + PINK + ',0.00)');
    ctx.fillStyle = g;
    ctx.fillRect(a.left, a.top, a.width, a.height);

    if (state.region !== 'Full spectrum') {
      var b = regionBounds();
      var x0 = xs.getPixelForValue(b[0]), x1 = xs.getPixelForValue(b[1]);
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      if (x0 > a.left) ctx.fillRect(a.left, a.top, x0 - a.left, a.height);
      if (x1 < a.right) ctx.fillRect(x1, a.top, a.right - x1, a.height);
      ctx.fillStyle = 'rgba(' + PINK + ',0.07)';
      ctx.fillRect(x0, a.top, x1 - x0, a.height);
      ctx.strokeStyle = 'rgba(' + PINK + ',0.45)';
      ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
      ctx.strokeRect(x0 + 0.5, a.top + 0.5, Math.max(1, x1 - x0 - 1), a.height - 1);
      ctx.setLineDash([]);
    }
    /* faint top/right frame, as in the source plate */
    ctx.strokeStyle = 'rgba(0,0,0,0.13)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.left, a.top + 0.5); ctx.lineTo(a.right - 0.5, a.top + 0.5);
    ctx.lineTo(a.right - 0.5, a.bottom);
    ctx.stroke();
    ctx.restore();
  }
};

/* ── Overlay: λmax annotation + (only after interaction) marker ─────────── */
var overlayPlugin = {
  id: 'overlayPlugin',
  afterDatasetsDraw: function (chart) {
    var ctx = chart.ctx, a = chart.chartArea, xs = chart.scales.x, ys = chart.scales.y;
    if (!a) return;
    var S = plotMetric(chart);
    var fs = clamp(9, 16, S * 0.038);

    /* λmax = 217 nm — just above / right of the crest, over open whitespace */
    ctx.save();
    drawLambdaMax(ctx, xs.getPixelForValue(222), ys.getPixelForValue(0.925), fs);
    ctx.restore();

    if (!state.touched) return;

    var lam = state.lambda, A = absorb(lam);
    var px = xs.getPixelForValue(lam), py = ys.getPixelForValue(A);

    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(229,0,126,0.40)';
    ctx.lineWidth = clamp(0.8, 1.5, S * 0.003);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, a.bottom); ctx.stroke();
    ctx.setLineDash([]);
    var r = clamp(2.6, 5.5, S * 0.013);
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = MAIN; ctx.fill();
    ctx.lineWidth = clamp(0.9, 1.8, S * 0.004); ctx.strokeStyle = '#fff'; ctx.stroke();

    /* small halo label beside the dot — no box, no corner chip */
    var lfs = clamp(8.5, 12.5, S * 0.030);
    ctx.font = '600 ' + lfs.toFixed(1) + 'px system-ui, sans-serif';
    var txt = lam.toFixed(0) + ' nm · A = ' + (A < 0.1 ? A.toFixed(3) : A.toFixed(2));
    var tw = ctx.measureText(txt).width;
    var tx = px + r + lfs * 0.6, ty = py - lfs * 1.0;
    if (tx + tw > a.right - 4) { ctx.textAlign = 'right'; tx = px - r - lfs * 0.6; }
    else { ctx.textAlign = 'left'; }
    if (ty < a.top + lfs) ty = py + lfs * 1.7;
    ctx.textBaseline = 'middle';
    halo(ctx, txt, tx, ty, '#b3006b');
    ctx.restore();
  },
  afterDraw: function (chart) {
    var ctx = chart.ctx, a = chart.chartArea;
    if (!a) return;
    var S = plotMetric(chart);
    var tfs = clamp(9, 15, S * 0.038);
    var lw = clamp(1.1, 2.4, S * 0.006);

    /* x-axis title + magenta right arrow, anchored under the tick labels */
    ctx.save();
    ctx.font = tfs.toFixed(1) + 'px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var t = 'Wavelength (nm)';
    var tw = ctx.measureText(t).width;
    var gap = tfs * 0.7, alen = tfs * 3.0;
    var total = tw + gap + alen;
    var sx = (a.left + a.right) / 2 - total / 2;
    var by = Math.min(chart.height - tfs * 0.8, a.bottom + tfs * 2.9);
    ctx.fillStyle = '#111';
    ctx.fillText(t, sx, by);
    arrow(ctx, sx + tw + gap, by, sx + tw + gap + alen, by, lw, MAIN);
    ctx.restore();

    /* y-axis title (rotated) sits in its own far-left column, clear of ticks */
    var padL = chart.__padL || 56;
    var yScaleLeft = (chart.scales.y && chart.scales.y.left != null) ? chart.scales.y.left : a.left;
    var yx = Math.max(tfs * 0.95, Math.min(padL * 0.26, yScaleLeft - tfs * 1.9));
    ctx.save();
    ctx.translate(yx, a.top + a.height * 0.62);
    ctx.rotate(-Math.PI / 2);
    ctx.font = tfs.toFixed(1) + 'px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#111';
    ctx.fillText('Absorbance', 0, 0);
    ctx.restore();
    arrow(ctx, yx, a.top + a.height * 0.34, yx, a.top + a.height * 0.08, lw, MAIN);
  }
};

/* ── Chart ──────────────────────────────────────────────────────────────── */
var chart = new Chart(canvas.getContext('2d'), {
  type: 'line',
  data: {
    datasets: [{
      label: '1,3-butadiene',
      data: pts,
      parsing: false,
      borderColor: MAIN,
      backgroundColor: 'transparent',
      pointRadius: 0,
      pointHitRadius: 0,
      borderJoinStyle: 'round',
      borderCapStyle: 'round',
      tension: 0,
      borderWidth: function (c) {
        var a = c.chart.chartArea;
        var S = a ? Math.min(a.width, a.height * 1.8) : 300;
        return clamp(1.4, 3, S * 0.0072);
      },
      segment: {
        borderColor: function (c) {
          var mid = (c.p0.parsed.x + c.p1.parsed.x) / 2;
          return inRegion(mid) ? MAIN : DIM;
        }
      }
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    layout: { padding: { left: 60, right: 18, top: 14, bottom: 42 } },
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      x: {
        type: 'linear', min: 200, max: 400,
        grid: { display: false, drawTicks: true, tickColor: '#000' },
        border: { color: '#000', width: 1 },
        ticks: {
          color: '#000', stepSize: 20, autoSkip: false,
          font: { size: 12, family: 'system-ui, sans-serif' }, padding: 4
        },
        title: { display: false }
      },
      y: {
        min: 0, max: 1,
        grid: { display: false, drawTicks: true, tickColor: '#000' },
        border: { color: '#000', width: 1 },
        ticks: {
          color: '#000', stepSize: 0.2,
          font: { size: 12, family: 'system-ui, sans-serif' }, padding: 5,
          callback: function (v) { return v === 0 ? '0' : Number(v).toFixed(1); }
        },
        title: { display: false }
      }
    }
  },
  plugins: [aspectPlugin, bgPlugin, overlayPlugin]
});
window.__markRendered();

/* ── Interaction handlers ───────────────────────────────────────────────── */
function syncReadout() {
  var el = document.getElementById('uiReadout');
  if (!el) return;
  if (!state.touched) { el.textContent = ''; return; }
  var A = absorb(state.lambda);
  el.textContent = 'λ = ' + state.lambda.toFixed(0) + ' nm → A = ' +
    (A < 0.1 ? A.toFixed(3) : A.toFixed(2)) +
    (Math.abs(state.lambda - 217) <= 1 ? '  (λmax)' : '');
}
function setLambda(v) { state.lambda = +v; syncReadout(); chart.update('none'); }
function update_wavelengthScrub(v) { state.touched = true; setLambda(v); }
function toggle_regionView(v) { state.region = v; chart.update('none'); }
function trigger_jumpPeak() {
  var i = document.getElementById('wavelengthScrubInput');
  i.value = 217;
  document.getElementById('wavelengthScrubVal').value = 217;
  update_wavelengthScrub(217);
  showPopup('λmax = 217 nm',
    'The curve reaches its single highest absorbance at the crest near 215–217 nm. This π→π* transition of the conjugated diene is what λmax reports; combined with A, path length and concentration it gives the molar absorptivity ε = A/(c·l).');
}

/* ── Hover / click ──────────────────────────────────────────────────────── */
canvas.addEventListener('mousemove', function (e) {
  var a = chart.chartArea; if (!a) return;
  var rect = canvas.getBoundingClientRect();
  var px = e.clientX - rect.left;
  if (px < a.left || px > a.right) { hideTooltip(); canvas.style.cursor = 'default'; return; }
  var l = chart.scales.x.getValueForPixel(px);
  canvas.style.cursor = 'pointer';
  showTooltip('λ = ' + l.toFixed(0) + ' nm · A = ' + absorb(l).toFixed(3), e);
});
canvas.addEventListener('mouseleave', hideTooltip);
canvas.addEventListener('click', function (e) {
  var a = chart.chartArea; if (!a) return;
  var rect = canvas.getBoundingClientRect();
  var px = e.clientX - rect.left;
  if (px < a.left || px > a.right) return;
  var l = Math.round(chart.scales.x.getValueForPixel(px));
  document.getElementById('wavelengthScrubInput').value = l;
  document.getElementById('wavelengthScrubVal').value = l;
  update_wavelengthScrub(l);
  var A = absorb(l);
  var msg;
  if (l < 206) msg = 'At the short-wavelength edge the band is already well up its broad left flank — this absorbance belongs to the same 217 nm transition, not to a separate feature.';
  else if (l <= 235) msg = 'You are inside the absorption band. Absorbance changes very fast with wavelength here, which is why λmax must be read at the crest rather than anywhere on the slope.';
  else msg = 'Past ~250 nm 1,3-butadiene is essentially transparent: absorbance is a flat, near-zero tail. Extending the conjugation would shift a new peak into this window.';
  showPopup('λ = ' + l + ' nm, A = ' + (A < 0.1 ? A.toFixed(3) : A.toFixed(2)), msg);
});

document.addEventListener('fig-resize', function () { chart.resize(); });

/* ── Demo step player ───────────────────────────────────────────────────── */
var steps = [
  {
    title: 'The whole spectrum',
    narration: 'Absorbance is plotted against wavelength from 200 to 400 nm. One rounded crest dominates the left edge; the rest of the trace hugs the baseline.',
    state: { regionView: 'Full spectrum', wavelengthScrub: 200, marker: false }
  },
  {
    title: 'Climbing toward the maximum',
    narration: 'Drag the marker to 210 nm and the readout climbs fast — absorbance rises steeply over just ten nanometers as the π→π* transition comes into resonance.',
    state: { regionView: 'Full spectrum', wavelengthScrub: 210, marker: true }
  },
  {
    title: 'λmax = 217 nm',
    narration: 'At the crest the readout reaches its highest value. This single wavelength, λmax, is what is reported for 1,3-butadiene and what is paired with concentration and path length to get molar absorptivity.',
    state: { regionView: 'Peak region (200–240 nm)', wavelengthScrub: 217, marker: true }
  },
  {
    title: 'Falling off the peak',
    narration: 'Move past 240 nm and absorbance collapses to about 0.1. The band is narrow: only a small window of wavelengths matches the transition energy.',
    state: { regionView: 'Peak region (200–240 nm)', wavelengthScrub: 245, marker: true }
  },
  {
    title: 'The uninformative tail',
    narration: 'Beyond 250 nm the curve is almost flat and almost zero — butadiene is transparent here. More conjugation would push a peak into this region, which is why the tail is worth watching.',
    state: { regionView: 'Tail region (250–400 nm)', wavelengthScrub: 320, marker: true }
  }
];
var curStep = 0;
function applyStep(i) {
  curStep = (i + steps.length) % steps.length;
  var s = steps[curStep];
  var sl = document.getElementById('wavelengthScrubInput');
  sl.value = s.state.wavelengthScrub;
  document.getElementById('wavelengthScrubVal').value = s.state.wavelengthScrub;
  state.touched = !!s.state.marker;
  var sel = document.getElementById('regionViewInput');
  sel.value = s.state.regionView;
  state.region = s.state.regionView;
  setLambda(s.state.wavelengthScrub);
  document.getElementById('demoNarration').textContent = s.narration;
  document.getElementById('stepLabel').textContent = (curStep + 1) + '/' + steps.length + ' · ' + s.title;
}
function nextStep() { applyStep(curStep + 1); }
function prevStep() { applyStep(curStep - 1); }
applyStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
