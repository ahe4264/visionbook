<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span id="stepTitle" style="font-weight:600;font-size:12px;color:#223">Step 1 · The afocal baseline</span>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#333"></p>
<span style="display:flex;gap:6px;align-items:center;margin-bottom:2px">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px">1 / 5</span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Objective focal length f₁: <output id="focalLength1Val">6.0</output>
  <input id="focalLength1Input" type="range" min="2" max="8" step="0.1" value="6" oninput="document.getElementById('focalLength1Val').value=this.value;update_focalLength1(+this.value)"></label>
<label>Eyepiece focal length f₂: <output id="focalLength2Val">2.0</output>
  <input id="focalLength2Input" type="range" min="0.5" max="4" step="0.1" value="2" oninput="document.getElementById('focalLength2Val').value=this.value;update_focalLength2(+this.value)"></label>
<label>Input ray angle δᵢ (degrees): <output id="inputAngleVal">1.5</output>
  <input id="inputAngleInput" type="range" min="-4" max="4" step="0.1" value="1.5" oninput="document.getElementById('inputAngleVal').value=this.value;update_inputAngle(+this.value)"></label>
<label style="flex-direction:row;align-items:center;gap:5px"><input id="afocalLockInput" type="checkbox" checked onchange="toggle_afocalLock(this.checked)"> Lock eyepiece to afocal position (f₁ − f₂)</label>
<label>Eyepiece shift from afocal position (unlock first): <output id="lens2OffsetVal">0.00</output>
  <input id="lens2OffsetInput" type="range" min="-1.5" max="1.5" step="0.05" value="0" oninput="document.getElementById('lens2OffsetVal').value=(+this.value).toFixed(2);update_lens2Offset(+this.value)"></label>
<span style="display:block;margin-top:4px;padding:7px 8px;border:1px solid #d4d8e0;border-radius:4px;background:#fff">
  <span style="display:block;font-weight:600;font-size:11px;color:#223;margin-bottom:3px">Readout</span>
  <span id="roF" style="display:block;font-size:11px;color:#111;line-height:1.5"></span>
  <span id="roAng" style="display:block;font-size:11px;color:#111;line-height:1.5"></span>
  <span id="roM" style="display:block;font-size:11px;color:#6a1b9a;line-height:1.5"></span>
  <span id="roD" style="display:block;font-size:11px;color:#333;line-height:1.5"></span>
  <span id="roStatus" style="display:block;font-size:11px;line-height:1.5;margin-top:2px"></span>
</span>
<span style="font-size:10px;color:#666">Hover the lenses, rays, focal point and the <i>d</i> arrow for details; click any of them for a longer explanation.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
/* ── state ─────────────────────────────────────────────────────────────── */
var S = { f1: 6, f2: 2, di: 1.5, lock: true, off: 0 };
var hA = 0.32;          // entry height of the thick ray at lens 1 (world units)
var hB = 0.12;          // entry height of the thin ray at lens 1

/* ── diagram frame (fixed viewBox → uniform scaling at any figure size) ── */
var VW = 1000, VH = 400;
var X0 = 250, XS = 76;                 // pixel of world x = 0, px per world unit
var AY = 160, VEX = 3, YS = XS * VEX;  // axis pixel row, vertical exaggeration
var XMIN = 72, XMAX = 994, YMIN = 12, YMAX = 306; // ray clipping window
var LH1 = 124, LH2 = Math.round(LH1 * 0.58);      // lens half-heights (FIXED)

var C = { ray: '#c77fe0', rayD: '#b160d6', blue: '#0d0dd9', lab: '#0000ff', blk: '#000000' };

var figDraw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
figDraw.viewbox(0, 0, VW, VH);
var root = figDraw.group();

function px(w) { return X0 + w * XS; }
function py(w) { return AY - w * YS; }

/* ── small helpers ─────────────────────────────────────────────────────── */
function clipSeg(x1, y1, x2, y2) {
  var t0 = 0, t1 = 1, dx = x2 - x1, dy = y2 - y1;
  var p = [-dx, dx, -dy, dy], q = [x1 - XMIN, XMAX - x1, y1 - YMIN, YMAX - y1];
  for (var i = 0; i < 4; i++) {
    if (Math.abs(p[i]) < 1e-12) { if (q[i] < 0) return null; }
    else {
      var r = q[i] / p[i];
      if (p[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
  }
  return [[x1 + dx * t0, y1 + dy * t0], [x1 + dx * t1, y1 + dy * t1]];
}
function figLabel(g, str, x, y, size, color, anchor, italic) {
  var t = g.plain(str).font({
    family: 'Georgia, "Times New Roman", Times, serif', size: size, anchor: anchor || 'start'
  }).fill(color);
  if (italic) t.font({ style: 'italic' });
  t.attr({ x: x, y: y });
  return t;
}
function halo(t) {
  t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': 4, 'stroke-linejoin': 'round' });
  return t;
}
function mathSub(g, base, sub, x, y, size, color, anchor, withHalo) {
  var t1 = figLabel(g, base, x, y, size, color, anchor, true);
  var bb;
  try { bb = t1.bbox(); } catch (e) { bb = { x2: x + size * 0.55 }; }
  var t2 = figLabel(g, sub, bb.x2 + size * 0.04, y + size * 0.26, size * 0.62, color, 'start', true);
  if (withHalo) { halo(t1); halo(t2); }
  return [t1, t2];
}
function arrowHead(g, x, y, dx, dy, size, color) {
  var L = Math.sqrt(dx * dx + dy * dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  var pts = [[x, y],
  [x - ux * size + nx * size * 0.42, y - uy * size + ny * size * 0.42],
  [x - ux * size - nx * size * 0.42, y - uy * size - ny * size * 0.42]];
  return g.polygon(pts.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' ')).fill(color);
}
function arcPoly(g, cx, cy, R, a0, a1, color, w) {
  var pts = [], n = 18;
  for (var i = 0; i <= n; i++) {
    var a = a0 + (a1 - a0) * i / n;
    pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  g.polyline(pts.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' '))
    .fill('none').stroke({ color: color, width: w || 1.8, linecap: 'round' });
  return pts;
}
function biconvex(g, cx, cy, h, w, color) {
  var d = 'M ' + cx + ' ' + (cy - h) + ' Q ' + (cx + 2 * w) + ' ' + cy + ' ' + cx + ' ' + (cy + h) +
    ' Q ' + (cx - 2 * w) + ' ' + cy + ' ' + cx + ' ' + (cy - h) + ' Z';
  return g.path(d).fill('none').stroke({ color: color, width: 3, linejoin: 'round' });
}
function biconcave(g, cx, cy, h, w, inset, color) {
  var d = 'M ' + (cx - w) + ' ' + (cy - h) + ' Q ' + (cx - w + 2 * inset) + ' ' + cy + ' ' + (cx - w) + ' ' + (cy + h) +
    ' L ' + (cx + w) + ' ' + (cy + h) + ' Q ' + (cx + w - 2 * inset) + ' ' + cy + ' ' + (cx + w) + ' ' + (cy - h) + ' Z';
  return g.path(d).fill('none').stroke({ color: color, width: 3, linejoin: 'round' });
}
function bracket(g, x1, x2, y, tick, color) {
  var gg = g.group();
  gg.line(x1, y, x2, y).stroke({ color: color, width: 2.2 });
  gg.line(x1, y - tick, x1, y + tick).stroke({ color: color, width: 2.2 });
  gg.line(x2, y - tick, x2, y + tick).stroke({ color: color, width: 2.2 });
  return gg;
}
function hov(el, tip, ptitle, pbody) {
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); });
  el.on('mouseleave', function () { hideTooltip(); });
  if (ptitle) el.on('click', function () { showPopup(ptitle, pbody); });
  return el;
}

/* ── ray transfer through the two thin lenses ──────────────────────────── */
function rayData(h, t, f1, f2, sep) {
  var m1 = -t - h / f1;          // slope after the convex objective
  var y2 = h + m1 * sep;         // height at the eyepiece
  var m2 = m1 + y2 / f2;         // slope after the concave eyepiece (f = −f₂)
  return { h: h, m1: m1, y2: y2, m2: m2 };
}

/* ── main render ───────────────────────────────────────────────────────── */
function drawAll() {
  root.clear();
  var t = Math.tan(S.di * Math.PI / 180);
  var f1 = S.f1;
  var f2 = Math.min(S.f2, f1 - 0.4);
  var afocSep = f1 - f2;
  var sep = afocSep + (S.lock ? 0 : S.off);
  sep = Math.max(0.6, Math.min(f1 + 1.6, sep));
  var afoc = Math.abs(sep - afocSep) < 1e-9;
  var d = t * f1;                                  // focal offset (below axis if t > 0)
  var rA = rayData(hA, t, f1, f2, sep);
  var rB = rayData(hB, t, f1, f2, sep);

  /* optical axis */
  hov(root.line(18, AY, VW - 6, AY).stroke({ color: C.blue, width: 1.4 }),
    'optical axis', 'Optical axis',
    'The common axis of the two lenses. Both δᵢ and δₒ are measured from this line; the lower input ray uses the axis itself as its reference line.');

  /* blue reference line at the thick ray entry height */
  root.line(XMIN, py(hA), px(0), py(hA)).stroke({ color: C.blue, width: 1.2 });

  /* brackets f₁ and f₂ */
  var b1 = bracket(root, px(0), px(f1), 372, 9, C.blk);
  mathSub(root, 'f', '1', (px(0) + px(f1)) / 2 - 6, 358, 24, C.blk, 'middle');
  hov(b1, 'f₁ = ' + f1.toFixed(1) + ' — lens 1 to the focal plane', 'Objective focal length f₁',
    'Parallel light entering the convex objective is focused in its focal plane, one f₁ to the right of the lens. Lengthening f₁ pushes that plane further right and raises the magnification f₁/f₂.');
  var b2 = bracket(root, px(sep), px(sep + f2), 330, 9, C.blk);
  mathSub(root, 'f', '2', (px(sep) + px(sep + f2)) / 2 - 6, 316, 24, C.blk, 'middle');
  hov(b2, 'f₂ = ' + f2.toFixed(1) + (afoc ? ' — ends exactly on the focal plane' : ' — no longer ends on the focal plane'),
    'Eyepiece focal length f₂',
    'The concave eyepiece has its own focal plane one f₂ away. Only when that plane coincides with the objective\'s focal plane (the two bracket ends line up) does the light leave as a parallel bundle.');

  /* lenses */
  var L1 = biconvex(root, px(0), AY, LH1, 9, C.blk);
  hov(L1, 'lens 1 — convex objective, f₁ = ' + f1.toFixed(1), 'Lens 1 — objective (convex, f₁)',
    'Every parallel bundle tilted by δᵢ is brought to one point in the objective focal plane, a height d = f₁·tan δᵢ off the axis. A bigger input tilt simply slides that point along the focal plane.');
  var L2 = biconcave(root, px(sep), AY, LH2, 11, 6, C.blk);
  hov(L2, 'lens 2 — concave eyepiece, f₂ = ' + f2.toFixed(1), 'Lens 2 — eyepiece (concave, f₂)',
    'The diverging eyepiece sits one f₂ before the objective\'s focal plane, so the converging cone is straightened back into a parallel bundle, now tilted by δₒ with tan δₒ = d/f₂. Move it and the exit bundle stops being parallel.');

  /* dashed continuation of the thin ray towards the shared focal point */
  var dsh = clipSeg(px(sep), py(rB.y2), px(f1), py(-d));
  if (dsh) {
    root.line(dsh[0][0], dsh[0][1], dsh[1][0], dsh[1][1])
      .stroke({ color: C.rayD, width: 2, dasharray: '7,5', linecap: 'round' });
  }

  /* rays */
  function drawRay(r, thick, name) {
    var w = thick ? 6.5 : 1.9;
    var g = root.group();
    var P0 = [px(0), py(r.h)], P2 = [px(sep), py(r.y2)];
    // thick ray terminates at the shared focal plane, as in the source figure
    var xEnd = thick ? Math.max(f1, sep + 0.8) : ((XMAX - X0) / XS + 1);
    var segs = [
      clipSeg(px(-9), py(r.h + 9 * t), P0[0], P0[1]),
      clipSeg(P0[0], P0[1], P2[0], P2[1]),
      clipSeg(P2[0], P2[1], px(xEnd), py(r.y2 + r.m2 * (xEnd - sep)))
    ];
    for (var i = 0; i < segs.length; i++) {
      if (!segs[i]) continue;
      g.line(segs[i][0][0], segs[i][0][1], segs[i][1][0], segs[i][1][1])
        .stroke({ color: C.ray, width: w, linecap: 'round' });
    }
    hov(g, name + ' — in at δᵢ = ' + S.di.toFixed(1) + '°, out at ' +
      (Math.atan(-r.m2) * 180 / Math.PI).toFixed(2) + '°',
      name, 'Both input rays are parallel (same δᵢ). The objective aims them at one common focal point; the eyepiece re-collimates them, so they leave parallel again but steeper — that steepening is the angular magnification.');
    return g;
  }
  drawRay(rB, false, 'Ray B (thin)');
  drawRay(rA, true, 'Ray A (thick)');

  /* where the exit rays cross when the telescope is not afocal */
  if (!afoc && Math.abs(rA.m2 - rB.m2) > 1e-6) {
    var xc = sep + (rB.y2 - rA.y2) / (rA.m2 - rB.m2);
    var yc = rA.y2 + rA.m2 * (xc - sep);
    var pxc = px(xc), pyc = py(yc);
    if (pxc > XMIN && pxc < XMAX && pyc > YMIN && pyc < YMAX) {
      hov(root.circle(15).center(pxc, pyc).fill('none').stroke({ color: '#e06a00', width: 2.2 }),
        'exit rays cross here — the bundle is not parallel', 'Not afocal',
        'With the eyepiece off the afocal spacing the exit rays converge (or diverge) and meet at a finite distance, so a distant object no longer appears at infinity to the relaxed eye.');
    }
  }

  /* shared focal point, axis dot and the d arrow */
  var fx = px(f1), fy = py(-d);
  var dotG = root.group();
  dotG.circle(11).center(fx, AY).fill(C.lab);
  dotG.circle(15).center(fx, fy).fill(C.ray).stroke({ color: C.rayD, width: 1.5 });
  if (Math.abs(fy - AY) > 12) {
    var sgn = (fy > AY) ? 1 : -1;
    dotG.line(fx, AY + sgn * 6, fx, fy - sgn * 8).stroke({ color: C.blk, width: 2 });
    arrowHead(dotG, fx, fy - sgn * 7, 0, sgn, 10, C.blk);
    halo(figLabel(root, 'd', fx + 11, (AY + fy) / 2 + sgn * 4 + 7, 23, C.blk, 'start', false));
  }
  hov(dotG, 'shared focal point — d = ' + Math.abs(d).toFixed(3),
    'The shared focal plane',
    'Both lenses focus on this one plane, so the same off-axis height d serves both: d = f₁·tan δᵢ for the objective and d = f₂·tan δₒ for the eyepiece. Eliminating d gives δₒ/δᵢ = f₁/f₂ — the angular magnification is just the ratio of focal lengths.');

  /* δᵢ hooks and labels at the far left */
  if (Math.abs(t) > 0.0015) {
    var xh = 95, wxh = (xh - X0) / XS;
    function hook(refY, rayY, labY) {
      var mid = (refY + rayY) / 2;
      root.path('M ' + xh + ' ' + refY + ' Q ' + (xh - 14) + ' ' + mid + ' ' + xh + ' ' + rayY)
        .fill('none').stroke({ color: C.blk, width: 1.8 });
      arrowHead(root, xh, rayY, -1, -t * VEX, 9, C.blk);
      mathSub(root, 'δ', 'i', 26, labY, 24, C.blk, 'start', true);
    }
    var rayAy = py(hA - t * wxh), rayBy = py(hB - t * wxh);
    hook(py(hA), rayAy, (py(hA) + rayAy) / 2 + 7);
    hook(AY, rayBy, (AY + rayBy) / 2 + 7);
  }

  /* δₒ annotation at the far right margin */
  if (Math.abs(t) > 0.0015) {
    var ax = 900, R = 34;
    var a1 = Math.atan(-rA.m2 * VEX);
    var pts = arcPoly(root, ax, AY, R, 0, a1, C.blk, 1.8);
    var pe = pts[pts.length - 1], pp = pts[pts.length - 2];
    arrowHead(root, pe[0], pe[1], pe[0] - pp[0], pe[1] - pp[1], 10, C.blk);
    var ly = AY + R * Math.sin(a1) + (a1 >= 0 ? 20 : -8);
    mathSub(root, 'δ', 'o', ax + R + 8, ly, 24, C.blk, 'start', true);
  }

  /* lens name labels */
  halo(figLabel(root, 'lens 1', px(0), AY - LH1 - 12, 22, C.lab, 'middle', false));
  halo(figLabel(root, 'lens 2', px(sep), AY - LH2 - 12, 22, C.lab, 'middle', false));

  /* numeric readout lives in the HTML control column (never over the figure) */
  var doDeg = Math.atan(-rA.m2) * 180 / Math.PI;
  updateReadout(f1, f2, sep, afoc, doDeg, d, f2 * Math.abs(rA.m2));
}

/* ── readout (HTML panel) ──────────────────────────────────────────────── */
function updateReadout(f1, f2, sep, afoc, doDeg, d, f2tan) {
  function $(id) { return document.getElementById(id); }
  $('roF').textContent = 'f₁ = ' + f1.toFixed(1) + '  ·  f₂ = ' + f2.toFixed(1) +
    '  ·  separation = ' + sep.toFixed(2);
  $('roAng').textContent = 'δᵢ = ' + S.di.toFixed(1) + '°  ·  δₒ = ' + doDeg.toFixed(2) + '°';
  if (afoc) {
    var m = (Math.abs(S.di) > 1e-6) ? Math.abs(doDeg / S.di) : (f1 / f2);
    $('roM').textContent = 'M = δₒ/δᵢ = ' + m.toFixed(2) + ' = f₁/f₂ = ' + (f1 / f2).toFixed(2);
    $('roD').textContent = 'd = f₁·tanδᵢ = f₂·tanδₒ = ' + Math.abs(d).toFixed(3);
    $('roStatus').textContent = '✓ afocal — exit bundle is parallel';
    $('roStatus').style.color = '#1b7a2f';
  } else {
    $('roM').textContent = 'Exit rays are not parallel, so there is no single δₒ — M is undefined (δₒ above is the thick ray alone).';
    $('roD').textContent = 'f₁·tanδᵢ = ' + Math.abs(d).toFixed(3) +
      '   but   f₂·tanδₒ = ' + f2tan.toFixed(3) + '  → no longer equal';
    $('roStatus').textContent = '✗ not afocal — eyepiece shifted by Δ = ' + (sep - (f1 - f2)).toFixed(2);
    $('roStatus').style.color = '#c23b00';
  }
}

/* ── control handlers ──────────────────────────────────────────────────── */
function clampF2() {
  var lim = Math.round((S.f1 - 0.4) * 10) / 10;
  if (S.f2 > lim) S.f2 = lim;
  if (S.f2 < 0.5) S.f2 = 0.5;
}
function syncUI() {
  document.getElementById('focalLength1Input').value = S.f1;
  document.getElementById('focalLength1Val').value = S.f1.toFixed(1);
  document.getElementById('focalLength2Input').value = S.f2;
  document.getElementById('focalLength2Val').value = S.f2.toFixed(1);
  document.getElementById('inputAngleInput').value = S.di;
  document.getElementById('inputAngleVal').value = S.di.toFixed(1);
  document.getElementById('afocalLockInput').checked = S.lock;
  document.getElementById('lens2OffsetInput').value = S.off;
  document.getElementById('lens2OffsetInput').disabled = S.lock;
  document.getElementById('lens2OffsetVal').value = S.off.toFixed(2);
}
function update_focalLength1(v) { S.f1 = v; clampF2(); syncUI(); drawAll(); }
function update_focalLength2(v) { S.f2 = v; clampF2(); syncUI(); drawAll(); }
function update_inputAngle(v) { S.di = v; drawAll(); }
function toggle_afocalLock(on) { S.lock = on; syncUI(); drawAll(); }
function update_lens2Offset(v) { S.off = v; if (!S.lock) drawAll(); }

/* ── demo step player ──────────────────────────────────────────────────── */
var STEPS = [
  {
    title: 'The afocal baseline',
    narration: 'Two parallel rays arrive tilted by δᵢ. The convex objective aims them at a point one f₁ away, and the concave eyepiece — placed one f₂ short of that point — straightens them into a parallel bundle again, now tilted by the larger angle δₒ.',
    state: { focalLength1: 6, focalLength2: 2, inputAngle: 1.5, afocalLock: true, lens2Offset: 0 }
  },
  {
    title: 'Angle in, angle out',
    narration: 'Sweep the input tilt. The focal point slides along the focal plane (d = f₁·tanδᵢ) and the exit angle follows in lockstep — but the ratio δₒ/δᵢ never budges.',
    state: { focalLength1: 6, focalLength2: 2, inputAngle: -2.5, afocalLock: true, lens2Offset: 0 }
  },
  {
    title: 'Magnification is a ratio',
    narration: 'Shorten the eyepiece focal length. The lens separation shrinks to stay afocal, the exit rays fan out much more steeply, and the readout climbs to M = f₁/f₂.',
    state: { focalLength1: 7, focalLength2: 1, inputAngle: 1.5, afocalLock: true, lens2Offset: 0 }
  },
  {
    title: 'Break the afocal condition',
    narration: 'Unlock and slide the eyepiece away from f₁ − f₂. The f₂ bracket no longer reaches the focal plane, the exit bundle stops being parallel (orange crossing), and f₁·tanδᵢ and f₂·tanδₒ are no longer equal.',
    state: { focalLength1: 6, focalLength2: 2, inputAngle: 1.5, afocalLock: false, lens2Offset: 0.8 }
  },
  {
    title: 'Restore alignment',
    narration: 'Return the eyepiece to the afocal spacing and the bundle snaps back to parallel — this is the focusing adjustment on a real Galilean telescope.',
    state: { focalLength1: 6, focalLength2: 2, inputAngle: 1.5, afocalLock: true, lens2Offset: 0 }
  }
];
var curStep = 0;
function setStep(i) {
  curStep = (i + STEPS.length) % STEPS.length;
  var st = STEPS[curStep].state;
  S.f1 = st.focalLength1; S.f2 = st.focalLength2; S.di = st.inputAngle;
  S.lock = st.afocalLock; S.off = st.lens2Offset;
  clampF2();
  document.getElementById('stepTitle').textContent = 'Step ' + (curStep + 1) + ' · ' + STEPS[curStep].title;
  document.getElementById('demoNarration').textContent = STEPS[curStep].narration;
  document.getElementById('stepLabel').textContent = (curStep + 1) + ' / ' + STEPS.length;
  syncUI();
  drawAll();
}
function nextStep() { setStep(curStep + 1); }
function prevStep() { setStep(curStep - 1); }

setStep(0);
window.__markRendered();
