<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700;font-size:12px">Endpoint error — guided demo</span>
<span id="stepTitle" style="font-weight:600;color:#123"></span>
<span id="demoNarration" style="display:block;font-size:12px;line-height:1.45;color:#333"></span>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;color:#555"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Error metric shown
  <select id="metricViewInput" onchange="toggle_metricView(this.value)">
    <option value="Endpoint error">Endpoint error</option>
    <option value="Angular error">Angular error</option>
    <option value="Both">Both</option>
  </select>
</label>
<label>Scale predicted magnitude (direction fixed): <output id="predictedMagnitudeVal">1</output>
  <input id="predictedMagnitudeInput" type="range" min="0" max="2" step="0.05" value="1"
    oninput="document.getElementById('predictedMagnitudeVal').value=this.value;update_predictedMagnitude(+this.value)">
</label>
<label><input id="showGridInput" type="checkbox" onchange="toggle_showGrid(this.checked)"> Show faint grid / axes</label>
<button onclick="trigger_reset()">Reset vectors</button>
<span style="border-top:1px solid #dfe3e8;padding-top:6px;font-size:11px;color:#444;line-height:1.6;font-family:ui-monospace,Consolas,monospace">
  (u, v) = <span id="roGT">—</span><br>
  (u&#770;, v&#770;) = <span id="roPR">—</span><br>
  <span style="color:#cc0000">EPE = <span id="roEPE">—</span></span><br>
  <span style="color:#1a7f37">&theta; = <span id="roTheta">—</span></span>
</span>
<span style="font-size:11px;color:#666">Move the pointer over the figure to reveal the tip handles, then drag either arrow tip. Hover or click the arrows, the red segment and the arc for explanations.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var W = 963, H = 672;
var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
draw.viewbox(0, 0, W, H);
draw.rect(W, H).fill('#ffffff');

var PPU = 100;                        // px per flow unit
var O = { x: 32, y: 645 };            // common origin (lower-left)

var GT0 = { x: 546, y: -629 };        // ground-truth offset from origin
var PR0 = { x: 632, y: -343 };        // predicted offset (base, before scaling)

var gt = { x: GT0.x, y: GT0.y };
var predBase = { x: PR0.x, y: PR0.y };
var predScale = 1;
var metric = 'Endpoint error';
var showGrid = false;
var canvasHover = false;
var stepIdx = 0;

var SERIF = 'Times New Roman, Times, serif';

var gGrid = draw.group();
var gRays = draw.group();
var gArc = draw.group();
var gRed = draw.group();
var gArrows = draw.group();
var gLabels = draw.group();
var gHandles = draw.group();

/* ---------- optional faint grid (off by default: source is plain white) ---------- */
function renderGrid() {
  gGrid.clear();
  if (!showGrid) return;
  for (var x = 0; x <= W; x += 60) gGrid.line(x, 0, x, H).stroke({ color: '#f3f5f7', width: 1 });
  for (var y = 0; y <= H; y += 60) gGrid.line(0, y, W, y).stroke({ color: '#f3f5f7', width: 1 });
  gGrid.line(0, O.y, W, O.y).stroke({ color: '#e8ecef', width: 1.4 });
  gGrid.line(O.x, 0, O.x, H).stroke({ color: '#e8ecef', width: 1.4 });
}

/* ---------- helpers ---------- */
function tipGT() { return { x: O.x + gt.x, y: O.y + gt.y }; }
function tipPR() { return { x: O.x + predBase.x * predScale, y: O.y + predBase.y * predScale }; }
function units(p) { return { u: (p.x - O.x) / PPU, v: (O.y - p.y) / PPU }; }
function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2); }
function polar(cx, cy, r, a) { return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
function halo(t, w) {
  return t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': (w == null ? 5 : w), 'stroke-linejoin': 'round' });
}

function drawArrow(g, o, t, color, sw, hl, hw) {
  var dx = t.x - o.x, dy = t.y - o.y, L = Math.hypot(dx, dy);
  if (L < 4) return null;
  var ux = dx / L, uy = dy / L, px = -uy, py = ux;
  hl = Math.min(hl, L * 0.85);
  var b = { x: t.x - ux * hl, y: t.y - uy * hl };
  var notch = { x: t.x - ux * hl * 0.70, y: t.y - uy * hl * 0.70 };
  g.line(o.x, o.y, b.x + ux * hl * 0.5, b.y + uy * hl * 0.5)
    .stroke({ color: color, width: sw, linecap: 'round' });
  g.polygon([[t.x, t.y], [b.x + px * hw, b.y + py * hw], [notch.x, notch.y], [b.x - px * hw, b.y - py * hw]])
    .fill(color);
  return g;
}

/* ---------- serif math labels with explicit caret (hat) glyphs ---------- */
function drawCaret(g, cx, baseY, size, color) {
  var w = 0.30 * size, h = 0.17 * size;
  var bot = baseY - 0.60 * size;          // caret legs sit just above the x-height
  var apex = bot - h;
  var d = 'M ' + (cx - w / 2) + ' ' + bot + ' L ' + cx + ' ' + apex + ' L ' + (cx + w / 2) + ' ' + bot;
  g.path(d).fill('none').stroke({ color: '#ffffff', width: 0.13 * size, linecap: 'round', linejoin: 'round' });
  g.path(d).fill('none').stroke({ color: color, width: 0.062 * size, linecap: 'round', linejoin: 'round' });
}

/* tokens: glyph, advance (fraction of size), wears a hat */
function vecLabel(g, ax, baseY, size, hat, color, anchor) {
  var toks = [['(', 0.39, false], ['u', 0.54, hat], [',', 0.30, false],
              [' ', 0.18, false], ['v', 0.50, hat], [')', 0.39, false]];
  var total = 0, i;
  for (i = 0; i < toks.length; i++) total += toks[i][1] * size;
  var x = (anchor === 'end') ? ax - total : (anchor === 'middle') ? ax - total / 2 : ax;
  var x0 = x;
  for (i = 0; i < toks.length; i++) {
    var c = toks[i][0], adv = toks[i][1] * size;
    if (c !== ' ') {
      var t = g.plain(c).font({ family: SERIF, size: size, style: 'italic' }).fill(color)
        .attr({ x: x, y: baseY });
      halo(t, 5);
      if (toks[i][2]) drawCaret(g, x + adv * 0.46 + size * 0.10, baseY, size, color);
    }
    x += adv;
  }
  return { x0: x0, x1: x0 + total, width: total, baseY: baseY };
}

/* ---------- main render ---------- */
function render() {
  gRays.clear(); gArc.clear(); gRed.clear(); gArrows.clear();
  gLabels.clear(); gHandles.clear();

  var T = tipGT(), P = tipPR();
  var showEPE = (metric === 'Endpoint error' || metric === 'Both');
  var showANG = (metric === 'Angular error' || metric === 'Both');

  var aG = Math.atan2(T.y - O.y, T.x - O.x);
  var aP = Math.atan2(P.y - O.y, P.x - O.x);
  var Lp = Math.hypot(P.x - O.x, P.y - O.y);
  var Lg = Math.hypot(T.x - O.x, T.y - O.y);
  var d = aG - aP;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  var thetaDeg = Math.abs(d) * 180 / Math.PI;
  var epe = Math.hypot((T.x - P.x) / PPU, (T.y - P.y) / PPU);

  /* dashed unit-direction rays (angular modes only) */
  if (showANG) {
    var rg = Math.min(Lg + 60, 880), rp = Math.min(Lp + 60, 880);
    var eg = polar(O.x, O.y, rg, aG), ep = polar(O.x, O.y, rp, aP);
    gRays.line(O.x, O.y, eg.x, eg.y).stroke({ color: '#9aa5b1', width: 2, dasharray: '8,7' });
    if (Lp > 8) gRays.line(O.x, O.y, ep.x, ep.y).stroke({ color: '#9aa5b1', width: 2, dasharray: '8,7' });
  }

  /* angular arc — only when the angular metric is selected */
  if (showANG && Lp > 8) {
    var R = Math.min(200, Math.max(120, Math.min(Lg, Lp) * 0.45));
    var s = polar(O.x, O.y, R, aP), e = polar(O.x, O.y, R, aG);
    var sweep = d > 0 ? 1 : 0;
    var large = Math.abs(d) > Math.PI ? 1 : 0;
    var arc = gArc.path('M ' + s.x + ' ' + s.y + ' A ' + R + ' ' + R + ' 0 ' + large + ' ' + sweep + ' ' + e.x + ' ' + e.y)
      .fill('none').stroke({ color: '#1a7f37', width: 3.5 });

    var half = Math.max(0.06, Math.abs(d) / 2);
    var need = 70 / Math.sin(half);
    var rLab = Math.min(Math.max(R + 70, need), Math.min(Lg, Lp) * 0.92 + 120, 700);
    var mid = polar(O.x, O.y, rLab, aP + d / 2);
    mid.x = Math.max(90, Math.min(W - 90, mid.x));
    mid.y = Math.max(46, Math.min(H - 30, mid.y));
    halo(gArc.text('\u03B8 = ' + thetaDeg.toFixed(1) + '\u00B0')
      .font({ family: SERIF, size: 32, anchor: 'middle', style: 'italic' })
      .fill('#1a7f37')).center(mid.x, mid.y);

    arc.css('cursor', 'pointer')
      .on('mousemove', function (ev) { showTooltip('Angular error \u03B8 = ' + thetaDeg.toFixed(1) + '\u00B0 — the opening angle at the origin', ev); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Angular error', 'Angular error measures only the angle between the predicted and the ground-truth flow direction. It ignores how long each vector is, so a prediction that points perfectly but moves twice too far scores zero angular error.');
      });
  }

  /* red endpoint-error segment — shaft-weight stroke, as in the source */
  var seg = gRed.line(T.x, T.y, P.x, P.y)
    .stroke({
      color: showEPE ? '#ff0000' : '#b3bbc2',
      width: showEPE ? 6 : 4,
      linecap: 'butt',
      dasharray: showEPE ? '' : '9,8'
    });
  var segHit = gRed.line(T.x, T.y, P.x, P.y).stroke({ color: '#fff', width: 24, opacity: 0 });
  segHit.css('cursor', 'pointer')
    .on('mousemove', function (ev) { showTooltip('Endpoint error = ' + fmt(epe) + ' (distance between the two tips)', ev); })
    .on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup('Endpoint error', 'The red segment is the vector difference (u,v) \u2212 (\u00FB,\u1E7D) drawn in place. Its length is the endpoint error, so any mistake in direction OR in magnitude lengthens it. Only a prediction whose tip lands exactly on the ground-truth tip gives zero.');
    });

  /* arrows */
  var gGtArrow = gArrows.group();
  drawArrow(gGtArrow, O, T, '#000000', 14, 92, 33);
  gGtArrow.css('cursor', 'pointer')
    .on('mousemove', function (ev) { var q = units(T); showTooltip('Ground-truth flow (u, v) = (' + fmt(q.u) + ', ' + fmt(q.v) + ')', ev); })
    .on('mouseleave', hideTooltip)
    .on('click', function () { showPopup('Ground-truth flow (u, v)', 'This is the true motion of the pixel between two frames. Every error metric is measured relative to this reference vector — change it and the same prediction can become good or bad.'); });

  var gPrArrow = gArrows.group();
  drawArrow(gPrArrow, O, P, '#000000', 14, 86, 32);
  gPrArrow.css('cursor', 'pointer')
    .on('mousemove', function (ev) { var q = units(P); showTooltip('Predicted flow (\u00FB, \u1E7D) = (' + fmt(q.u) + ', ' + fmt(q.v) + ')', ev); })
    .on('mouseleave', hideTooltip)
    .on('click', function () { showPopup('Predicted flow (\u00FB, \u1E7D)', 'This is what the optical-flow algorithm estimated for the same pixel. Drag its tip, or scale it along its own direction with the slider, and watch how the two metrics react differently.'); });

  /* ---- math labels (serif, hats drawn as carets) ---- */
  var MS = 68;
  var gtAX = Math.max(260, Math.min(W - 20, T.x - 95));
  var gtAY = Math.max(MS * 0.9, Math.min(H - 20, T.y + 58));
  vecLabel(gLabels, gtAX, gtAY, MS, false, '#000000', 'end');

  if (Lp > 10) {
    var prAX = Math.max(90, Math.min(W - 90, P.x - 55));
    var prAY = Math.max(MS, Math.min(H - 14, P.y + 145));
    vecLabel(gLabels, prAX, prAY, MS, true, '#000000', 'middle');
  }

  /* 'Endpoint / error' label, just right of the red segment */
  var midX = (T.x + P.x) / 2, midY = (T.y + P.y) / 2;
  var labX = Math.max(40, Math.min(W - 300, midX + 30));
  var labY = Math.max(120, Math.min(H - 70, midY));
  var errCol = showEPE ? '#000000' : '#b3bbc2';
  var gErr = gLabels.group();
  /* leader shown only on hover over the label */
  var leader = gErr.line(midX + 6, midY, labX - 12, labY - 10)
    .stroke({ color: '#f0a0a0', width: 1.4 }).opacity(0);
  halo(gErr.plain('Endpoint').font({ family: SERIF, size: 68 }).fill(errCol)
    .attr({ x: labX, y: labY - 46 }));
  halo(gErr.plain('error').font({ family: SERIF, size: 68 }).fill(errCol)
    .attr({ x: labX, y: labY + 50 }));
  gErr.css('cursor', 'pointer')
    .on('mouseenter', function () { leader.animate(120).opacity(1); })
    .on('mousemove', function (ev) { showTooltip('Endpoint error = ' + fmt(epe) + ' flow units', ev); })
    .on('mouseleave', function () { leader.animate(120).opacity(0); hideTooltip(); })
    .on('click', function () {
      showPopup('Endpoint error', 'EPE = \u2016(u,v) \u2212 (\u00FB,\u1E7D)\u2016. One number charges simultaneously for pointing the wrong way and for moving the wrong amount, which is why it is the standard optical-flow benchmark metric.');
    });

  /* drag handles (hidden until the pointer is over the figure) */
  makeHandle(T, 'gt');
  if (Lp > 10) makeHandle(P, 'pred');
  updateHandleVis();

  /* numeric readout lives in the side panel, not on the drawing */
  var qg = units(T), qp = units(P);
  setText('roGT', '(' + fmt(qg.u) + ', ' + fmt(qg.v) + ')');
  setText('roPR', '(' + fmt(qp.u) + ', ' + fmt(qp.v) + ')');
  setText('roEPE', fmt(epe));
  setText('roTheta', thetaDeg.toFixed(1) + '\u00B0');
}

function setText(id, s) { var el = document.getElementById(id); if (el) el.textContent = s; }

function makeHandle(p, which) {
  var c = gHandles.circle(22).center(p.x, p.y)
    .fill({ color: '#ffffff', opacity: 0.25 })
    .stroke({ color: '#2b7fd4', width: 2.4 })
    .css('cursor', 'grab');
  c.on('mouseenter', function () { c.fill({ color: '#cfe8ff', opacity: 0.95 }); gHandles.opacity(1); });
  c.on('mouseleave', function () { c.fill({ color: '#ffffff', opacity: 0.25 }); hideTooltip(); });
  c.on('mousemove', function (ev) {
    showTooltip(which === 'gt' ? 'Drag: move the ground-truth tip' : 'Drag: move the predicted tip', ev);
  });
  c.on('pointerdown', function (ev) { startDrag(which, ev); });
}

function updateHandleVis() {
  gHandles.opacity((canvasHover || dragging || stepIdx >= 1) ? 1 : 0);
}

/* ---------- dragging ---------- */
var dragging = null;
function toLocal(ev) {
  var pt = draw.node.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  var m = draw.node.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  var q = pt.matrixTransform(m.inverse());
  return { x: q.x, y: q.y };
}
function startDrag(which, ev) { ev.preventDefault(); dragging = which; hideTooltip(); }
window.addEventListener('pointermove', function (ev) {
  if (!dragging) return;
  var p = toLocal(ev);
  p.x = Math.max(18, Math.min(W - 18, p.x));
  p.y = Math.max(18, Math.min(H - 18, p.y));
  if (dragging === 'gt') { gt.x = p.x - O.x; gt.y = p.y - O.y; }
  else {
    if (predScale < 0.12) { predScale = 1; syncSlider(1); }
    predBase.x = (p.x - O.x) / predScale;
    predBase.y = (p.y - O.y) / predScale;
  }
  render();
});
window.addEventListener('pointerup', function () { dragging = null; updateHandleVis(); });

var containerEl = document.getElementById('container');
containerEl.addEventListener('mouseenter', function () { canvasHover = true; updateHandleVis(); });
containerEl.addEventListener('mouseleave', function () { canvasHover = false; updateHandleVis(); });

/* ---------- controls ---------- */
function toggle_metricView(v) { metric = v; render(); }
function update_predictedMagnitude(v) { predScale = v; render(); }
function toggle_showGrid(on) { showGrid = on; renderGrid(); }

function syncSlider(v) {
  var s = document.getElementById('predictedMagnitudeInput');
  var o = document.getElementById('predictedMagnitudeVal');
  if (s) s.value = v;
  if (o) o.value = v;
}

function trigger_reset() {
  gt = { x: GT0.x, y: GT0.y };
  predBase = { x: PR0.x, y: PR0.y };
  predScale = 1; syncSlider(1);
  metric = 'Endpoint error';
  document.getElementById('metricViewInput').value = 'Endpoint error';
  render();
}

/* ---------- demo steps ---------- */
var steps = [
  {
    title: 'Two flow vectors, one origin',
    narration: 'The long black arrow is the ground-truth flow (u, v) and the shorter one is the predicted flow (\u00FB, \u1E7D); both start at the same pixel. The red segment between their tips is the endpoint error.',
    state: { metricView: 'Endpoint error', predictedMagnitude: 1 }
  },
  {
    title: 'Drag the prediction',
    narration: 'Small blue handles now sit at both tips. Drag the tip of (\u00FB, \u1E7D) anywhere: the red segment stretches and shrinks in real time. Bring the tip onto the ground-truth tip and the error collapses to zero.',
    state: { metricView: 'Endpoint error', predictedMagnitude: 1 }
  },
  {
    title: 'Right direction, wrong length',
    narration: 'Scale the prediction along its own direction. The vectors still point the same way, yet the red segment keeps growing — magnitude errors count fully.',
    state: { metricView: 'Endpoint error', predictedMagnitude: 1.8 }
  },
  {
    title: 'Angular error tells a different story',
    narration: 'Switch to angular error: the arc at the origin stays the same size while you scale the vector, so this metric is blind to the magnitude mistake that endpoint error just punished.',
    state: { metricView: 'Angular error', predictedMagnitude: 1.8 }
  },
  {
    title: 'Compare the two metrics',
    narration: 'With both overlays on, move the tips around and watch EPE and \u03B8 change independently — a small angle can hide a large endpoint error, and a short vector can have a huge angle but a tiny EPE.',
    state: { metricView: 'Both', predictedMagnitude: 1 }
  }
];

function applyStep(i) {
  stepIdx = Math.max(0, Math.min(steps.length - 1, i));
  var s = steps[stepIdx];
  document.getElementById('metricViewInput').value = s.state.metricView;
  metric = s.state.metricView;
  syncSlider(s.state.predictedMagnitude);
  predScale = s.state.predictedMagnitude;
  render();
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('demoNarration').textContent = s.narration;
  document.getElementById('stepLabel').textContent = 'Step ' + (stepIdx + 1) + ' / ' + steps.length;
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

/* ---------- init ---------- */
renderGrid();
render();
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
