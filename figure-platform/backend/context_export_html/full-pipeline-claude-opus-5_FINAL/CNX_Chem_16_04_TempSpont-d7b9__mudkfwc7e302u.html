<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="display:block;font-weight:700;font-size:12px;">ΔG = ΔH − TΔS</span>
<span id="demoNarration" style="display:block;margin:0;font-size:11px;line-height:1.4;color:#333;min-height:74px"></span>
<span style="display:flex;gap:6px;align-items:center;">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;min-width:70px;text-align:center">Step 1 / 6</span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Temperature (K): <output id="temperatureVal">0</output>
  <input id="temperatureInput" type="range" min="0" max="1000" step="10" value="0"
         oninput="document.getElementById('temperatureVal').value=this.value;update_temperature(+this.value)">
</label>
<label>Sign combination:
  <select id="caseSelectInput" onchange="toggle_caseSelect(this.value)" style="font-size:11px;padding:2px">
    <option value="All four">All four</option>
    <option value="ΔH&gt;0, ΔS&lt;0">ΔH&gt;0, ΔS&lt;0 (never)</option>
    <option value="ΔH&gt;0, ΔS&gt;0">ΔH&gt;0, ΔS&gt;0 (turns on)</option>
    <option value="ΔH&lt;0, ΔS&lt;0">ΔH&lt;0, ΔS&lt;0 (turns off)</option>
    <option value="ΔH&lt;0, ΔS&gt;0">ΔH&lt;0, ΔS&gt;0 (always)</option>
  </select>
</label>
<span id="readout" style="display:block;font-size:11px;line-height:1.5;"></span>
<span style="display:block;font-size:10px;color:#666;line-height:1.35;">Hover a line for its meaning; click it for a fuller explanation.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

var FIG_PINK = '#f4d7d4', FIG_GREEN = '#e3ecd5';
var FIG_ASPECT = 0.78;            // width : height (portrait, like the source)
var figGutter = 26;               // empty gutter inside the y-axis for ΔG labels
var figTagSpace = 22;             // empty strip under the x-axis for the T tag
var SERIF = '"Times New Roman", Times, Georgia, serif';

var CASES = [
  {
    key: 'ΔH>0, ΔS<0', dH: 40, dS: -0.055, color: '#c0392b',
    l1: 'ΔH > 0', l2: 'ΔS < 0', labelT: 250,
    title: 'ΔH > 0, ΔS < 0 — never spontaneous',
    desc: 'Both terms work against the reaction: the positive ΔH puts the line in the pink half at low T, and because ΔS is negative the term −TΔS is positive, so heating pushes ΔG even higher. This line never reaches the zero line.'
  },
  {
    key: 'ΔH>0, ΔS>0', dH: 40, dS: 0.058, color: '#e2b02e',
    l1: 'ΔH > 0', l2: 'ΔS > 0', labelT: 335,
    title: 'ΔH > 0, ΔS > 0 — spontaneous only when hot',
    desc: 'The positive ΔH starts this reaction in the nonspontaneous pink half, but the positive ΔS gives a downward slope of −ΔS. Above the crossover temperature T = ΔH/ΔS the entropy term outweighs the enthalpy term and ΔG becomes negative.'
  },
  {
    key: 'ΔH<0, ΔS<0', dH: -40, dS: -0.061, color: '#e2b02e',
    l1: 'ΔH < 0', l2: 'ΔS < 0', labelT: 290,
    title: 'ΔH < 0, ΔS < 0 — spontaneous only when cold',
    desc: 'The negative ΔH starts this reaction in the spontaneous green half, but the negative ΔS makes the slope −ΔS positive, so heating raises ΔG. Above T = ΔH/ΔS the unfavourable entropy change wins and the reaction becomes nonspontaneous.'
  },
  {
    key: 'ΔH<0, ΔS>0', dH: -40, dS: 0.05, color: '#86b53f',
    l1: 'ΔH < 0', l2: 'ΔS > 0', labelT: 390,
    title: 'ΔH < 0, ΔS > 0 — always spontaneous',
    desc: 'Both terms favour the reaction: negative ΔH puts the line in the green half and positive ΔS tilts it further down as temperature rises. ΔG stays negative at every temperature.'
  }
];

var figState = { T: 0, sel: 'All four', step: 0 };

function figG(c, T) { return c.dH - T * c.dS; }
function figCross(c) {
  if (c.dS === 0) return null;
  var t = c.dH / c.dS;
  return (t > 5 && t < 995) ? t : null;
}
function figDim(c) { return figState.sel !== 'All four' && figState.sel !== c.key; }

/* inline ΔH/ΔS label position: staggered along each line, exactly as in the
   source, and FIXED (never jumps while the cursor is dragged) */
function inlineLabelT(c) {
  return (figState.sel === 'All four') ? c.labelT : 520;
}

/* ---------------- mount: portrait-constrained canvas ---------------- */
var figContainer = document.getElementById('container');
var figOuter = document.createElement('div');
figOuter.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;';
var figInner = document.createElement('div');
figInner.style.cssText = 'position:relative;';
var figCanvas = document.createElement('canvas');
figCanvas.style.cssText = 'width:100%;height:100%;display:block';
figInner.appendChild(figCanvas);
figOuter.appendChild(figInner);
figContainer.appendChild(figOuter);

function figLayout(w, h) {
  if (!w || !h) return;
  var tw = Math.min(w, h * FIG_ASPECT);
  var th = Math.min(h, tw / FIG_ASPECT);
  figInner.style.width = Math.round(tw) + 'px';
  figInner.style.height = Math.round(th) + 'px';
  figGutter = Math.max(16, Math.min(34, tw * 0.058));
  figTagSpace = Math.max(16, Math.min(30, tw * 0.05));
  if (window.figChart) { figChart.resize(); figChart.update('none'); }
}
document.addEventListener('fig-resize', function (e) {
  figLayout(e.detail.width, e.detail.height);
});
(function () {
  var st = getComputedStyle(figContainer);
  var padX = (parseFloat(st.paddingLeft) || 0) + (parseFloat(st.paddingRight) || 0);
  var padY = (parseFloat(st.paddingTop) || 0) + (parseFloat(st.paddingBottom) || 0);
  figLayout(figContainer.clientWidth - padX, figContainer.clientHeight - padY);
})();

function haloText(ctx, text, x, y, font, color, lw) {
  ctx.font = font;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(1.4, lw || 3);
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

var bgPlugin = {
  id: 'figBg',
  beforeDatasetsDraw: function (chart) {
    var ctx = chart.ctx, ca = chart.chartArea;
    if (!ca) return;
    var y0 = chart.scales.y.getPixelForValue(0);
    ctx.save();
    ctx.fillStyle = FIG_PINK;
    ctx.fillRect(ca.left, ca.top, ca.right - ca.left, y0 - ca.top);
    ctx.fillStyle = FIG_GREEN;
    ctx.fillRect(ca.left, y0, ca.right - ca.left, ca.bottom - y0);
    ctx.strokeStyle = '#8d8d8d';
    ctx.lineWidth = Math.max(1, Math.min(2.2, (ca.bottom - ca.top) * 0.004));
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(ca.left, y0);
    ctx.lineTo(ca.right, y0);
    ctx.stroke();
    ctx.restore();
  }
};

var annPlugin = {
  id: 'figAnn',
  afterDatasetsDraw: function (chart) {
    var ctx = chart.ctx, ca = chart.chartArea;
    if (!ca) return;
    var w = ca.right - ca.left, h = ca.bottom - ca.top;
    var s = Math.min(w, h);
    var fs = Math.max(12, Math.min(23, w * 0.047));       // inline ΔH/ΔS labels (serif italic)
    var fsG = Math.max(10, Math.min(18, w * 0.040));      // ΔG gutter labels
    var fsR = Math.max(12, Math.min(24, w * 0.048));      // region labels
    var fsA = Math.max(9, Math.min(14, w * 0.032));       // small annotations
    var xS = chart.scales.x, yS = chart.scales.y;
    var fontInline = 'italic ' + fs.toFixed(1) + 'px ' + SERIF;

    /* ---- pre-compute inline label geometry (used for collision dimming) ---- */
    var labelInfo = [];
    for (var i = 0; i < CASES.length; i++) {
      var c = CASES[i];
      if (figDim(c)) continue;
      var pA = { x: xS.getPixelForValue(0), y: yS.getPixelForValue(figG(c, 0)) };
      var pB = { x: xS.getPixelForValue(1000), y: yS.getPixelForValue(figG(c, 1000)) };
      var lt = inlineLabelT(c);
      labelInfo.push({
        c: c,
        x: xS.getPixelForValue(lt),
        y: yS.getPixelForValue(figG(c, lt)),
        ang: Math.atan2(pB.y - pA.y, pB.x - pA.x)
      });
    }
    ctx.save();
    ctx.font = fontInline;
    var halfW = fs * 2.4;
    for (var q = 0; q < labelInfo.length; q++) {
      var wl = Math.max(ctx.measureText(labelInfo[q].c.l1).width,
        ctx.measureText(labelInfo[q].c.l2).width);
      labelInfo[q].hw = wl / 2 + fs * 0.4;
    }
    ctx.restore();

    function nearLabel(mx, my) {
      for (var k = 0; k < labelInfo.length; k++) {
        var L = labelInfo[k];
        var dx = mx - L.x, dy = my - L.y;
        var cs = Math.cos(L.ang), sn = Math.sin(L.ang);
        var u = dx * cs + dy * sn;
        var v = -dx * sn + dy * cs;
        if (Math.abs(u) < (L.hw || halfW) + fs * 0.4 && v > -fs * 1.0 && v < fs * 3.3) return true;
      }
      return false;
    }

    /* ---- region labels ---- */
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fontR = fsR.toFixed(1) + 'px Helvetica, Arial, sans-serif';
    haloText(ctx, 'Nonspontaneous', ca.left + w * 0.72, ca.top + h * 0.25, fontR, '#1b1b1b', fsR * 0.26);
    haloText(ctx, 'Spontaneous', ca.left + w * 0.72, ca.top + h * 0.755, fontR, '#1b1b1b', fsR * 0.26);
    ctx.restore();

    /* ---- ΔG > 0 / ΔG < 0 : in the y-axis gutter, OUTSIDE the plot ---- */
    var gx = ca.left - figGutter * 0.72;
    var fontV = 'italic ' + fsG.toFixed(1) + 'px ' + SERIF;
    [[52, 'ΔG > 0'], [-52, 'ΔG < 0']].forEach(function (p) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.translate(gx, yS.getPixelForValue(p[0]));
      ctx.rotate(-Math.PI / 2);
      ctx.font = fontV;
      ctx.fillStyle = '#1b1b1b';
      ctx.fillText(p[1], 0, 0);
      ctx.restore();
    });

    /* ---- temperature cursor + markers ---- */
    if (figState.T > 0) {
      var cx = xS.getPixelForValue(figState.T);
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = '#4a4a4a';
      ctx.lineWidth = Math.max(1, s * 0.0035);
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, ca.top);
      ctx.lineTo(cx, ca.bottom + figTagSpace * 0.25);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      var mr = Math.max(3.5, Math.min(9, s * 0.019));
      for (var m = 0; m < CASES.length; m++) {
        var cc = CASES[m];
        if (figDim(cc)) continue;
        var g = figG(cc, figState.T);
        var my = yS.getPixelForValue(g);
        if (my < ca.top - 2 || my > ca.bottom + 2) continue;
        var masked = nearLabel(cx, my);      // marker sits on an inline label
        ctx.save();
        ctx.globalAlpha = masked ? 0.42 : 1;
        ctx.beginPath();
        ctx.arc(cx, my, mr, 0, Math.PI * 2);
        ctx.fillStyle = (g > 0) ? '#b03a2e' : '#3d7a24';
        ctx.fill();
        if (!masked) {
          ctx.lineWidth = Math.max(1.5, mr * 0.42);
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
          ctx.lineWidth = Math.max(1, mr * 0.28);
          ctx.strokeStyle = cc.color;
          ctx.beginPath();
          ctx.arc(cx, my, mr + Math.max(1.4, mr * 0.34), 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      /* T tag lives in the reserved strip BELOW the x-axis line */
      var tTxt = figState.T + ' K';
      ctx.font = '600 ' + fsA.toFixed(1) + 'px Helvetica, Arial, sans-serif';
      var tw = ctx.measureText(tTxt).width + fsA * 0.9;
      var th = fsA * 1.5;
      var tx = Math.max(ca.left + tw / 2, Math.min(ca.right - tw / 2, cx));
      var ty = ca.bottom + figTagSpace * 0.28;
      ctx.beginPath();
      var rr = th * 0.3;
      ctx.moveTo(tx - tw / 2 + rr, ty);
      ctx.arcTo(tx + tw / 2, ty, tx + tw / 2, ty + th, rr);
      ctx.arcTo(tx + tw / 2, ty + th, tx - tw / 2, ty + th, rr);
      ctx.arcTo(tx - tw / 2, ty + th, tx - tw / 2, ty, rr);
      ctx.arcTo(tx - tw / 2, ty, tx + tw / 2, ty, rr);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#9a9a9a';
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#333';
      ctx.fillText(tTxt, tx, ty + th / 2 + 0.5);
      ctx.restore();
    }

    /* ---- single-case annotations (clamped inside the frame) ---- */
    if (figState.sel !== 'All four' && w > 190) {
      var sc = null;
      for (var k2 = 0; k2 < CASES.length; k2++) if (CASES[k2].key === figState.sel) sc = CASES[k2];
      if (sc) {
        ctx.save();
        ctx.font = fsA.toFixed(1) + 'px Helvetica, Arial, sans-serif';
        var ix = xS.getPixelForValue(0), iy = yS.getPixelForValue(sc.dH);
        var r = Math.max(3, Math.min(6.5, s * 0.013));
        var rising = sc.dS < 0;                       // slope = −ΔS
        var off = fsA * 2.1;
        var ly = rising ? iy + off : iy - off;
        if (ly < ca.top + fsA * 1.2) ly = iy + off;
        if (ly > ca.bottom - fsA * 1.2) ly = iy - off;
        ly = Math.max(ca.top + fsA * 1.2, Math.min(ca.bottom - fsA * 1.2, ly));

        var itxt = 'intercept = ΔH';
        var itw = ctx.measureText(itxt).width;
        var itx = ix + fsA * 0.9;
        if (itx + itw > ca.right - 5) itx = Math.max(ca.left + 3, ca.right - 5 - itw);

        ctx.strokeStyle = '#8a8a8a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ix, ly > iy ? iy + r : iy - r);
        ctx.lineTo(itx - fsA * 0.35, ly);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ix, iy, r, 0, Math.PI * 2);
        ctx.fillStyle = sc.color;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        haloText(ctx, itxt, itx, ly, fsA.toFixed(1) + 'px Helvetica, Arial, sans-serif', '#333', fsA * 0.36);

        // slope callout near the right end of the line
        var stT = 840;
        var sx = xS.getPixelForValue(stT), sy = yS.getPixelForValue(figG(sc, stT));
        var sTxt = 'slope = −ΔS';
        ctx.font = fsA.toFixed(1) + 'px Helvetica, Arial, sans-serif';
        var stw = ctx.measureText(sTxt).width;
        var above = sc.dS > 0;                     // falling line → text above it
        var sty = above ? sy - fsA * 1.7 : sy + fsA * 1.7;
        if (sty < ca.top + fsA * 1.1) sty = sy + fsA * 1.7;
        if (sty > ca.bottom - fsA * 1.1) sty = sy - fsA * 1.7;
        sty = Math.max(ca.top + fsA * 1.1, Math.min(ca.bottom - fsA * 1.1, sty));
        var stx = Math.max(ca.left + 4, ca.right - 6 - stw);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#8a8a8a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(Math.min(sx + fsA * 0.9, stx + stw * 0.5), sty + (sty > sy ? -fsA * 0.55 : fsA * 0.55));
        ctx.stroke();
        haloText(ctx, sTxt, stx, sty, fsA.toFixed(1) + 'px Helvetica, Arial, sans-serif', '#333', fsA * 0.36);
        ctx.restore();
      }
    }

    /* ---- inline rotated ΔH/ΔS labels (serif italic, drawn last, on top) ---- */
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (var j = 0; j < labelInfo.length; j++) {
      var L2 = labelInfo[j];
      ctx.save();
      ctx.translate(L2.x, L2.y);
      ctx.rotate(L2.ang);
      haloText(ctx, L2.c.l1, 0, fs * 0.30, fontInline, '#141414', fs * 0.20);
      haloText(ctx, L2.c.l2, 0, fs * 0.30 + fs * 1.24, fontInline, '#141414', fs * 0.20);
      ctx.restore();
    }
    ctx.restore();
  }
};

function updateReadout() {
  var el = document.getElementById('readout');
  var html = '';
  for (var i = 0; i < CASES.length; i++) {
    var c = CASES[i];
    var g = figG(c, figState.T);
    var sp = g < 0;
    var dim = figDim(c);
    var cross = figCross(c);
    html += '<span style="display:flex;align-items:center;gap:5px;opacity:' + (dim ? 0.35 : 1) + '">' +
      '<span style="flex:0 0 16px;height:0;border-top:3px solid ' + c.color + ';"></span>' +
      '<span style="flex:0 0 84px;">' + c.l1 + ', ' + c.l2 + '</span>' +
      '<span style="flex:0 0 46px;text-align:right;">ΔG ' + (g >= 0 ? '&gt;' : '&lt;') + ' 0</span>' +
      '<span style="flex:1;text-align:right;font-weight:600;color:' + (sp ? '#3d7a24' : '#b03a2e') + '">' +
      (sp ? 'spontaneous' : 'nonspont.') + '</span></span>' +
      (cross ? '<span style="display:block;margin:-1px 0 3px 21px;font-size:10px;color:#666;opacity:' +
        (dim ? 0.35 : 1) + '">flips at T ≈ ' + Math.round(cross) + ' K</span>' : '');
  }
  html += '<span style="display:block;margin-top:3px;color:#555">Cursor: T = ' + figState.T + ' K</span>';
  el.innerHTML = html;
}

/* ---------------- interactions ---------------- */
function update_temperature(v) {
  figState.T = v;
  updateReadout();
  figChart.update('none');
}

function toggle_caseSelect(val) {
  figState.sel = val;
  for (var i = 0; i < CASES.length; i++) {
    var dim = figDim(CASES[i]);
    figChart.data.datasets[i].borderColor = dim ? '#d6d6d6' : CASES[i].color;
    figChart.data.datasets[i].borderWidth = dim ? 2.5 : 4;
  }
  updateReadout();
  figChart.update('none');
}

/* ---------------- demo steps ---------------- */
var DEMO = [
  { title: 'The map: two halves, one dashed line', narration: 'Above the gray dashed line ΔG is positive and the process is nonspontaneous; below it ΔG is negative and the process is spontaneous. Every line here is just ΔG = ΔH − TΔS plotted against T.', state: { caseSelect: 'All four', temperature: 0 } },
  { title: 'Never spontaneous: ΔH > 0, ΔS < 0', narration: 'The red line starts in the pink half (positive ΔH) and climbs as temperature rises, because −TΔS is positive. It never reaches zero — heating only makes things worse.', state: { caseSelect: 'ΔH>0, ΔS<0', temperature: 700 } },
  { title: 'Always spontaneous: ΔH < 0, ΔS > 0', narration: 'The green line starts in the green half (negative ΔH) and falls further as temperature rises. Both terms favor the reaction, so it is spontaneous at every temperature.', state: { caseSelect: 'ΔH<0, ΔS>0', temperature: 700 } },
  { title: 'Turns on when heated: ΔH > 0, ΔS > 0', narration: 'This yellow line begins nonspontaneous but slopes downward. Push the temperature cursor past its x-intercept and the marker drops into the green half — the entropy term has overtaken the enthalpy term.', state: { caseSelect: 'ΔH>0, ΔS>0', temperature: 620 } },
  { title: 'Turns off when heated: ΔH < 0, ΔS < 0', narration: 'The other yellow line starts spontaneous but slopes upward, crossing zero at its own temperature. Above that point the unfavorable entropy change wins and the reaction stops being spontaneous.', state: { caseSelect: 'ΔH<0, ΔS<0', temperature: 620 } },
  { title: 'Sweep all four at once', narration: 'With all four lines showing, slide the temperature cursor from cold to hot: the red and green markers stay on their own sides, while only the two yellow markers cross the dashed line — each at a different crossover temperature.', state: { caseSelect: 'All four', temperature: 900 } }
];

function applyStep(i) {
  figState.step = Math.max(0, Math.min(DEMO.length - 1, i));
  var st = DEMO[figState.step];
  var sel = document.getElementById('caseSelectInput');
  sel.value = st.state.caseSelect;
  toggle_caseSelect(st.state.caseSelect);
  var sl = document.getElementById('temperatureInput');
  sl.value = st.state.temperature;
  document.getElementById('temperatureVal').value = st.state.temperature;
  update_temperature(+st.state.temperature);
  document.getElementById('demoNarration').innerHTML =
    '<b>' + st.title + '</b><br>' + st.narration;
  document.getElementById('stepLabel').textContent =
    'Step ' + (figState.step + 1) + ' / ' + DEMO.length;
}
function nextStep() { applyStep(figState.step + 1); }
function prevStep() { applyStep(figState.step - 1); }

/* ---------------- hover / click on lines ---------------- */
function figHitTest(evt) {
  var rect = figCanvas.getBoundingClientRect();
  var px = (evt.clientX - rect.left) * (figCanvas.width / rect.width) / (window.devicePixelRatio || 1);
  var py = (evt.clientY - rect.top) * (figCanvas.height / rect.height) / (window.devicePixelRatio || 1);
  var ca = figChart.chartArea;
  if (!ca || px < ca.left || px > ca.right || py < ca.top || py > ca.bottom) return null;
  var T = figChart.scales.x.getValueForPixel(px);
  var best = null, bd = 1e9;
  for (var i = 0; i < CASES.length; i++) {
    var c = CASES[i];
    if (figDim(c)) continue;
    var ly = figChart.scales.y.getPixelForValue(figG(c, T));
    var d = Math.abs(ly - py);
    if (d < bd) { bd = d; best = c; }
  }
  return (bd < Math.max(8, figChart.chartArea.height * 0.018)) ? { c: best, T: T } : null;
}

figCanvas.addEventListener('mousemove', function (e) {
  var hit = figHitTest(e);
  if (hit) {
    var g = figG(hit.c, hit.T);
    showTooltip(hit.c.l1 + ', ' + hit.c.l2 + '  →  ΔG ' + (g >= 0 ? '> 0 (nonspontaneous)' : '< 0 (spontaneous)') +
      ' at T ≈ ' + Math.round(hit.T) + ' K', e);
    figCanvas.style.cursor = 'pointer';
  } else {
    hideTooltip();
    figCanvas.style.cursor = 'default';
  }
});
figCanvas.addEventListener('mouseleave', function () { hideTooltip(); });
figCanvas.addEventListener('click', function (e) {
  var hit = figHitTest(e);
  if (hit) showPopup(hit.c.title, hit.c.desc);
});

applyStep(0);
// @FIGURE_CODE_END

    _autoUiLayout();
  </script>
