<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700;font-size:12px">Bellman-Ford — relax every edge, 4 passes</span>
<span id="demoNarration" style="font-size:11px;line-height:1.45;min-height:64px"></span>
<span style="display:flex;align-items:center;gap:6px">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="flex:1;text-align:center;font-size:11px"></span>
  <button onclick="nextStep()">▶</button>
</span>
<span style="font-weight:600;margin-top:2px;font-size:11px">All five panels — click one</span>
<span id="thumbStrip" style="display:flex;flex-wrap:wrap;gap:3px"></span>
<span id="impRead" style="font-size:11px;color:#333">distances improved this pass: 0</span>
<span id="noteRead" style="font-size:11px;color:#666;line-height:1.35;min-height:28px"></span>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="showTreeInput" type="checkbox" checked onchange="toggle_showTree(this.checked)"> Shade predecessor tree</label>
<span style="font-weight:600;margin-top:4px;font-size:11px">Edge order this pass</span>
<span id="orderStrip" style="line-height:1.7"></span>
<button id="labToggle" onclick="toggleLab()" style="margin-top:6px;text-align:left">▸ Code lab — implement relax(u, v, w)</button>
<span id="labBody" style="display:none;flex-direction:column;gap:6px">
  <span style="font-size:10px;color:#555;line-height:1.35">API: d(v) · setD(v,val) · setPred(v,u) · w(u,v) · note(text). Your function is called once per edge, 10 edges × 4 passes.</span>
  <span style="display:flex;gap:4px">
    <button id="tabBtn_sample" onclick="loadCode('sample')">Sample</button>
    <button id="tabBtn_buggy" onclick="loadCode('buggy')">Buggy</button>
    <button id="tabBtn_starter" onclick="loadCode('starter')">Starter</button>
  </span>
  <textarea id="relaxEditorCode" spellcheck="false"></textarea>
  <label style="font-size:10px">Edge relaxation order (fixed, 4 passes)<input id="relaxEditorInput" value="(t,x,5) (t,y,8) (t,z,-4) (x,t,-2) (y,x,-3) (y,z,9) (z,x,7) (z,s,2) (s,t,6) (s,y,7)"></label>
  <button id="runBtn" onclick="trigger_run()">▶ Run 4 passes</button>
  <span id="runStatus" style="font-size:11px;color:#555">Status: not run</span>
  <span style="display:flex;gap:4px;align-items:center">
    <button onclick="playFirst()">⏮</button>
    <button onclick="playPrev()">◀</button>
    <button id="playBtn" onclick="playToggle()">▶</button>
    <button onclick="playNext()">▶|</button>
    <span id="frameCounter" style="font-size:10px;color:#555">0 of 0</span>
  </span>
  <label style="font-size:10px">Speed: <output id="speedVal">6</output> fps<input id="speedInput" type="range" min="1" max="20" step="1" value="6" oninput="document.getElementById('speedVal').value=this.value;update_speed(+this.value)"></label>
  <span id="frameCaption" style="font-size:11px;min-height:28px;line-height:1.35"></span>
  <span id="runLog" style="font-family:ui-monospace,Consolas,monospace;font-size:10px;white-space:pre-wrap;max-height:110px;overflow:auto;color:#444"></span>
</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },

  ['init', 'pass1', 'pass2', 'pass3', 'pass4'].forEach(function (k) {
    var el = byId('thumb_' + k);
    if (!el) return;
    var on = (k === name);
    el.style.borderColor = on ? '#5aabf0' : '#e2e2e2';
    el.style.background = on ? '#eaf5ff' : '#fff';
  });
}
function setSnapshot(name) {
  stopPlay();
  mode = 'snapshot'; curSnap = name;
  setActiveSnap(name);
  var s = SNAPS[name];
  renderView({ dist: s.dist, pred: s.pred, caption: PANEL[name], capSize: 26, imp: s.imp, note: s.note,
               cur: null, tent: null, edgeIdx: -1, bad: [], badVerts: [] });
  var fc = byId('frameCaption');
  if (fc) fc.textContent = PANEL[name] + ' ' + s.note;
}
function toggle_showTree(on) {
  treeOn = on;
  renderThumbs();
  if (mode === 'snapshot') setSnapshot(curSnap); else showFrame(idx);
}

/* ─────────── code lab disclosure ─────────── */
var labOpen = false;
function setLab(open) {
  labOpen = open;
  var body = byId('labBody'), btn = byId('labToggle');
  if (body) body.style.display = open ? 'flex' : 'none';
  if (btn) btn.textContent = (open ? '\u25be' : '\u25b8') + ' Code lab — implement relax(u, v, w)';
}
function toggleLab() { setLab(!labOpen); }

/* ─────────── worker: student relax() ─────────── */
function bfWorkerBody() {
  function fmtv(v) { return (v === Infinity || v === null) ? '\u221e' : String(v); }
  self.onmessage = function (ev) {
    var msg = ev.data, edges = msg.edges, verts = msg.verts, passes = msg.passes, source = msg.source;
    var dist = {}, pred = {};
    for (var i = 0; i < verts.length; i++) dist[verts[i]] = (verts[i] === source) ? 0 : Infinity;
    var frames = [], ops = 0, MAXOPS = 200000, MAXF = 1200;
    var pass = 0, edgeIdx = -1, impPass = 0, curEdge = null;
    function snap() {
      var d = {}, p = {}, k;
      for (k in dist) d[k] = (dist[k] === Infinity ? null : dist[k]);
      for (k in pred) p[k] = pred[k];
      return { dist: d, pred: p };
    }
    function push(kind, indices, message, tent) {
      if (frames.length >= MAXF) throw new Error('__CAP__frame cap (' + MAXF + ') hit — is relax() writing in a loop?');
      frames.push({ kind: kind, state: snap(), indices: indices || [], message: message || '',
        tent: (tent === undefined ? null : tent), pass: pass, imp: impPass, edgeIdx: edgeIdx,
        cur: curEdge ? [curEdge.u, curEdge.v] : null });
    }
    function guard() { if (++ops > MAXOPS) throw new Error('__CAP__operation cap hit — too many API calls'); }
    function chk(v) { v = String(v); if (verts.indexOf(v) < 0) throw new Error('unknown vertex "' + v + '"'); return v; }
    var API = {
      d: function (v) { guard(); return dist[chk(v)]; },
      w: function (u, v) { guard(); u = chk(u); v = chk(v);
        for (var i = 0; i < edges.length; i++) if (edges[i].u === u && edges[i].v === v) return edges[i].w;
        return Infinity; },
      setD: function (v, val) { guard(); v = chk(v);
        if (typeof val !== 'number' || isNaN(val)) throw new Error('setD(' + v + ', \u2026) expects a number');
        var old = dist[v]; if (val < old) impPass++;
        dist[v] = val;
        push('update', [v], 'set d[' + v + '] = ' + fmtv(val) + '  (was ' + fmtv(old) + ')'); },
      setPred: function (v, u) { guard(); v = chk(v); u = chk(u); pred[v] = u;
        push('pred', [u, v], '\u03c0[' + v + '] = ' + u + '   tree edge ' + u + '\u2192' + v); },
      note: function (txt) { guard(); if (frames.length) frames[frames.length - 1].message += '  \u00b7  ' + String(txt); }
    };
    if (Object.freeze) Object.freeze(API);
    var relax = null;
    try {
      var factory = new Function('d', 'setD', 'setPred', 'w', 'note',
        '"use strict";\n' + msg.code + '\n;return (typeof relax === "function") ? relax : null;');
      relax = factory(API.d, API.setD, API.setPred, API.w, API.note);
    } catch (err) {
      self.postMessage({ ok: false, frames: [], error: 'Syntax error: ' + (err && err.message ? err.message : err) });
      return;
    }
    if (!relax) {
      self.postMessage({ ok: false, frames: [], error: 'No function named relax(u, v, w) was defined \u2014 the entry point must be called relax.' });
      return;
    }
    try {
      push('init', [], 'Initialization: d[' + source + '] = 0, every other estimate = \u221e');
      for (pass = 1; pass <= passes; pass++) {
        impPass = 0;
        for (edgeIdx = 0; edgeIdx < edges.length; edgeIdx++) {
          var e = edges[edgeIdx]; curEdge = e;
          var du = dist[e.u], sum = du + e.w;
          push('test', [e.u, e.v], 'Pass ' + pass + ': test (' + e.u + ',' + e.v + ') w=' + e.w +
            ' \u2192 d[' + e.u + ']+w = ' + fmtv(du === Infinity ? Infinity : sum) +
            '  vs  d[' + e.v + '] = ' + fmtv(dist[e.v]), (du === Infinity ? null : sum));
          relax(e.u, e.v, e.w);
        }
        curEdge = null; edgeIdx = -1;
        push('passend', [], 'End of pass ' + pass + ' \u2014 distances improved this pass: ' + impPass);
      }
      self.postMessage({ ok: true, frames: frames, final: snap() });
    } catch (err) {
      var m = String(err && err.message ? err.message : err);
      if (m.indexOf('__CAP__') === 0) m = m.slice(7);
      curEdge = null;
      try { push('error', [], 'Error: ' + m); } catch (e2) {}
      self.postMessage({ ok: false, frames: frames, error: m });
    }
  };
}

/* ─────────── run / replay ─────────── */
var frames = [], idx = 0, badEdges = [], badVerts = [], worker = null, playTimer = null, fps = 6;
var currentCode = 'sample';

function parseOrder(src) {
  var re = /\(\s*([A-Za-z_]\w*)\s*,\s*([A-Za-z_]\w*)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)/g, m, out = [];
  while ((m = re.exec(src))) {
    if (VERTS.indexOf(m[1]) < 0 || VERTS.indexOf(m[2]) < 0)
      throw new Error('unknown vertex in (' + m[1] + ',' + m[2] + ') — use s, t, x, y, z');
    out.push({ u: m[1], v: m[2], w: parseFloat(m[3]) });
  }
  if (!out.length) throw new Error('no edges parsed — expected entries like (t,x,5)');
  return out;
}
function setStatus(kind, txt) {
  var el = byId('runStatus');
  if (!el) return;
  el.textContent = txt;
  el.style.color = (kind === 'ok') ? '#177a2e' : (kind === 'err') ? '#c00000' : (kind === 'warn') ? '#a35400' : '#555';
}
function loadCode(which) {
  currentCode = which;
  var ta = byId('relaxEditorCode');
  if (ta) ta.value = CODES[which];
  ['sample', 'buggy', 'starter'].forEach(function (k) {
    var b = byId('tabBtn_' + k); if (b) b.className = (k === which) ? 'active' : '';
  });
}
function trigger_run() {
  stopPlay();
  setLab(true);
  var inp = byId('relaxEditorInput'), ta = byId('relaxEditorCode');
  if (!inp || !ta) return;
  var edges;
  try { edges = parseOrder(inp.value); }
  catch (e) { setStatus('err', '\u2716 Edge list: ' + e.message); return; }
  orderEdges = edges; rebuildOrderList(edges);
  var code = ta.value;
  setStatus('run', 'running\u2026');
  var btn = byId('runBtn'); if (btn) btn.disabled = true;
  if (worker) { worker.terminate(); worker = null; }
  var url = URL.createObjectURL(new Blob(['(' + bfWorkerBody.toString() + ')()'], { type: 'text/javascript' }));
  var done = false;
  function cleanup() {
    if (worker) { worker.terminate(); worker = null; }
    URL.revokeObjectURL(url);
    if (btn) btn.disabled = false;
  }
  worker = new Worker(url);
  var timer = setTimeout(function () {
    if (done) return; done = true; cleanup();
    finishRun({ ok: false, frames: [], error: 'Timed out after 1.5 s \u2014 infinite loop in relax()?' });
  }, 1500);
  worker.onmessage = function (ev) { if (done) return; done = true; clearTimeout(timer); cleanup(); finishRun(ev.data); };
  worker.onerror = function (ev) {
    if (done) return; done = true; clearTimeout(timer); cleanup();
    finishRun({ ok: false, frames: [], error: 'Worker error: ' + (ev.message || 'unknown') });
  };
  worker.postMessage({ code: code, edges: edges, verts: VERTS, passes: 4, source: 's' });
}
function checkRun(final) {
  badEdges = []; badVerts = [];
  var dist = final.dist, pred = final.pred || {};
  orderEdges.forEach(function (e) {
    var du = dist[e.u], dv = dist[e.v];
    if (du === null) return;
    if (dv === null || dv > du + e.w + 1e-9) badEdges.push(e.u + '>' + e.v);
  });
  var exp = { s: 0, t: 2, x: 4, y: 7, z: -2 };
  VERTS.forEach(function (k) { if (dist[k] !== exp[k]) badVerts.push(k); });
  var treeOK = pred.y === 's' && pred.x === 'y' && pred.t === 'x' && pred.z === 't';
  if (!badEdges.length && !badVerts.length && treeOK)
    return { ok: true, text: '\u2714 correct \u2014 d = (s 0, t 2, x 4, y 7, z \u22122), tree s\u2192y\u2192x\u2192t\u2192z' };
  var bits = [];
  if (badVerts.length) bits.push('wrong d at ' + badVerts.join(', '));
  if (badEdges.length) bits.push(badEdges.length + ' edge(s) still violate d[v] \u2264 d[u]+w (dashed red)');
  if (!treeOK && !badVerts.length) bits.push('predecessor tree is not s\u2192y\u2192x\u2192t\u2192z');
  return { ok: false, text: '\u2716 wrong answer \u2014 ' + bits.join('; ') };
}
function finishRun(res) {
  frames = res.frames || [];
  badEdges = []; badVerts = [];
  if (res.ok) { var c = checkRun(res.final); setStatus(c.ok ? 'ok' : 'warn', c.text); }
  else { setStatus('err', '\u2716 ' + (res.error || 'error')); }
  if (frames.length) { mode = 'replay'; setActiveSnap(null); showFrame(frames.length - 1); }
  else { var fc = byId('frameCounter'); if (fc) fc.textContent = '0 of 0'; }
}
function showFrame(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  var f = frames[idx];
  var cap = f.pass ? ('pass ' + f.pass + ' of 4') : (f.kind === 'error' ? 'run stopped' : 'initialization');
  var isLast = (idx === frames.length - 1);
  renderView({
    dist: f.state.dist, pred: f.state.pred, caption: cap, capSize: 20, imp: f.imp,
    note: f.message,
    cur: f.cur, tent: (f.kind === 'test' ? f.tent : null),
    upd: (f.kind === 'update' ? f.indices[0] : null),
    edgeIdx: f.edgeIdx, bad: isLast ? badEdges : [], badVerts: isLast ? badVerts : []
  });
  var fc = byId('frameCounter'); if (fc) fc.textContent = (idx + 1) + ' of ' + frames.length;
  var cp = byId('frameCaption'); if (cp) cp.textContent = f.message;
  var lg = byId('runLog');
  if (lg) {
    var lines = [];
    for (var k = Math.max(0, idx - 7); k <= idx; k++) lines.push((k + 1) + '. ' + frames[k].message);
    lg.textContent = lines.join('\n');
  }
}
function playFirst() { stopPlay(); if (frames.length) { mode = 'replay'; setActiveSnap(null); showFrame(0); } }
function playPrev() { stopPlay(); if (frames.length) { mode = 'replay'; setActiveSnap(null); showFrame(idx - 1); } }
function playNext() { stopPlay(); if (frames.length) { mode = 'replay'; setActiveSnap(null); showFrame(idx + 1); } }
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  var b = byId('playBtn'); if (b) { b.textContent = '\u25b6'; b.className = ''; }
}
function playToggle() {
  if (playTimer) { stopPlay(); return; }
  if (!frames.length) { setStatus('warn', 'Run the code first, then replay.'); return; }
  mode = 'replay'; setActiveSnap(null);
  if (idx >= frames.length - 1) showFrame(0);
  var b = byId('playBtn'); if (b) { b.textContent = '\u2759\u2759'; b.className = 'active'; }
  playTimer = setInterval(function () {
    if (idx >= frames.length - 1) { stopPlay(); return; }
    showFrame(idx + 1);
  }, Math.round(1000 / fps));
}
function update_speed(v) { fps = v; if (playTimer) { stopPlay(); playToggle(); } }

/* ─────────── demo step player ─────────── */
var STEPS = [
  { title: '(a) Initialization', snap: 'init', code: 'sample',
    narration: 'Every estimate starts at \u221e except the source s, which is 0. All ten edges are thin and unshaded \u2014 no predecessor links exist yet.' },
  { title: '(b) After pass 1', snap: 'pass1', code: 'sample',
    narration: 'Only edges leaving s can improve anything on the first sweep: d[t] becomes 6 and d[y] becomes 7. Paths of one edge are now correct.' },
  { title: '(c) After pass 2', snap: 'pass2', code: 'sample',
    narration: 'With t and y settled, relaxing y\u2192x (\u22123) gives d[x] = 4 and t\u2192z (\u22124) gives d[z] = 2. Two-edge paths are correct, and the tree rewires to s\u2192y\u2192x.' },
  { title: '(d) After pass 3', snap: 'pass3', code: 'sample',
    narration: 'The negative edge x\u2192t pays off: s\u2192y\u2192x\u2192t costs 2, beating the direct edge of weight 6. d[t] drops 6\u21922 and t\u2019s parent switches from s to x.' },
  { title: '(e) After pass 4 \u2014 converged', snap: 'pass4', code: 'sample',
    narration: 'The improved d[t] = 2 finally flows through t\u2192z, pushing d[z] to \u22122. A fifth pass would change nothing: every edge satisfies d[v] \u2264 d[u] + w.' },
  { title: 'Break the relaxation', snap: 'pass4', code: 'buggy', run: true, openLab: true,
    narration: 'The code lab is now open with the buggy relaxation \u2014 it drops the edge weight from the comparison \u2014 and it has just been run. Read the status line and scrub the frames: the first setD that ignores w shows why the whole algorithm lives in that one inequality. Edit and re-run to compare.' }
];
var stepI = 0;
function applyStep(i) {
  stepI = Math.max(0, Math.min(STEPS.length - 1, i));
  var st = STEPS[stepI];
  var nar = byId('demoNarration'); if (nar) nar.textContent = st.narration;
  var lab = byId('stepLabel'); if (lab) lab.textContent = (stepI + 1) + '/' + STEPS.length + '  ' + st.title;
  var cb = byId('showTreeInput');
  if (cb) cb.checked = true;
  treeOn = true;
  renderThumbs();
  loadCode(st.code);
  setSnapshot(st.snap);
  if (st.openLab) setLab(true);
  if (st.run) trigger_run();
}
function nextStep() { applyStep(stepI + 1); }
function prevStep() { applyStep(stepI - 1); }

/* ─────────── boot ─────────── */
buildThumbs();
rebuildOrderList(orderEdges);
setLab(false);
loadCode('sample');
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
