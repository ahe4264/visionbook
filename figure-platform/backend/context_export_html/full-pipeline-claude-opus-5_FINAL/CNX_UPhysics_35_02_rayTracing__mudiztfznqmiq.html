<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700;font-size:12px">Ray diagrams: locating the image</span>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#222"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;flex:1"></span>
  <button onclick="nextStep()">▶</button>
</span>
<span style="height:1px;background:#dcdfe3"></span>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="mirrorTypeInput" type="checkbox" onchange="toggle_mirrorType(this.checked)"> <span>Convex mirror <span style="color:#666">(unticked = concave)</span></span></label>
<span id="statusLine" style="font-size:11.5px;font-weight:700"></span>
<label>Object distance: <output id="objectDistanceVal">3</output> × f
  <input id="objectDistanceInput" type="range" min="1.2" max="5" step="0.1" value="3"
         oninput="document.getElementById('objectDistanceVal').value=this.value;update_objectDistance(+this.value)"></label>
<span id="imgInfo" style="font-size:10.5px;line-height:1.4;color:#333"></span>
<span style="height:1px;background:#dcdfe3"></span>
<span style="font-size:11px;font-weight:700">Principal rays — click to isolate</span>
<button id="rayBtn1" onclick="selectRay(1)" style="text-align:left;border-left:6px solid #1f7fa8">1 · parallel in → out through F</button>
<button id="rayBtn2" onclick="selectRay(2)" style="text-align:left;border-left:6px solid #e02b2b">2 · in through F → out parallel</button>
<button id="rayBtn3" onclick="selectRay(3)" style="text-align:left;border-left:6px solid #8064b0">3 · along radius through C → retraces</button>
<button id="rayBtn4" onclick="selectRay(4)" style="text-align:left;border-left:6px solid #7fa640">4 · to vertex V → equal angles</button>
<button id="rayBtn0" onclick="selectRay(0)">Show all four rays</button>
<span id="ruleBox" style="font-size:10.5px;line-height:1.45;color:#333"></span>
<button onclick="keyIdea()">💡 Key idea</button>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;

    { a: M3, b: mv(M3, Q, 1.3), ar: [0.3, 0.74], nf: [0.5, 0.64, 0.8, 0.38] }];
    if (mode === 'convex') p3.push({ a: M3, b: mv(M3, Cp, 1.05), dash: true });
    rays.push({ n: 3, parts: p3, rm: M3 });
  }

  var p4 = [{ a: Q, b: V, ar: [0.5], nf: [0.34, 0.46, 0.6, 0.72] }];
  if (mode === 'concave') {
    p4.push({ a: V, b: mv(V, Qp, 1.95), ar: [0.35, 0.82], nf: [0.58, 0.74, 0.9, 0.46] });
  } else {
    p4.push({ a: V, b: dirTo(V, [-d, -h], far * 0.5), ar: [0.5], nf: [0.34, 0.5, 0.68] });
    p4.push({ a: V, b: mv(V, Qp, 1.45), dash: true });
  }
  rays.push({ n: 4, parts: p4 });

  /* ---- frame (two passes so text pads use the real font size) ---- */
  var xiD = (mode === 'concave') ? Math.max(xi, -(d + 5)) : xi;
  var x0 = Math.min(-d, xiD) - 0.35, x1 = (mode === 'concave') ? 0.85 : (Cx + 0.6);
  var yTop = Math.max(yAp, h + 0.3, (hi > 0 ? hi + 0.5 : 0));
  var yBot = -Math.max(yAp, (hi < 0 ? Math.min(-hi + 0.5, yAp * 1.9 + 1.6) : 0));
  applyFrame(x0, x1, yBot, yTop);
  var pL = (fs * 4.8) / unit, pR = (fs * 2.3) / unit, pT = (fs * 1.6) / unit, pB = (fs * 2.7) / unit;
  applyFrame(x0 - pL, x1 + pR, yBot - pB, yTop + pT);

  draw.clear();
  placedBoxes = []; obstacles = [];
  var g = draw.group();
  var xd = _plotFrame.xDomain, yd = _plotFrame.yDomain;
  var box = { xlo: xd[0] + 0.14, xhi: xd[1] - 0.14, ylo: yd[0] + 0.14, yhi: yd[1] - 0.14 };
  var lblBox = { xlo: xd[0] + 0.1, xhi: xd[1] - 0.1, ylo: yd[0] + (fs * 1.6) / unit, yhi: yd[1] - 0.1 };

  /* clip every ray segment to the visible frame */
  rays.forEach(function (r) {
    var kept = [];
    r.parts.forEach(function (p) {
      var c = clipSeg(p.a, p.b, box);
      if (!c) return;
      p.a = c[0]; p.b = c[1];
      kept.push(p);
    });
    r.parts = kept;
  });

  /* ---- axis ---- */
  g.line(plotX(box.xlo), plotY(0), plotX(box.xhi), plotY(0))
    .stroke({ color: COL.axis, width: Math.max(0.8, unit * 0.022) });
  obstacles.push([[box.xlo, 0], [box.xhi, 0]]);

  /* ---- mirror ---- */
  var arcPts = [], i, y;
  for (i = 0; i <= 72; i++) { y = -yAp + 2 * yAp * i / 72; arcPts.push([mxf(y), y]); }
  drawMirror(g, arcPts, mode, Xc0, Rd);
  for (i = 0; i < arcPts.length - 1; i++) obstacles.push([arcPts[i], arcPts[i + 1]]);

  /* ---- rays ---- */
  rays.forEach(function (r) { r.parts.forEach(function (p) { obstacles.push([p.a, p.b]); }); });
  obstacles.push([[-d, 0], [-d, h]]);

  var rayGroups = {};
  rays.forEach(function (r) {
    var c = COL[r.n], sel = state.sel, active = (sel === 0 || sel === r.n);
    var w = lw * (sel === r.n ? 1.95 : 1);
    var rg = g.group().css('cursor', 'pointer').opacity(active ? 1 : 0.16);
    rayGroups[r.n] = active ? 1 : 0.16;
    var ah = unit * 0.23 * (sel === r.n ? 1.25 : 1);
    r.parts.forEach(function (p) { seg(rg, p.a, p.b, c, p.dash ? w * 0.92 : w, !!p.dash); });
    r.parts.forEach(function (p) {
      if (p.dash) return;
      (p.ar || []).forEach(function (t) { arrowOn(rg, p.a, p.b, t, c, ah); });
    });
    if (r.rm) {
      var M = r.rm, nx = (M[0] - Xc0) / Rd, ny = M[1] / Rd;
      var tx = -ny, ty = nx;
      if ((M[1] > 0 && ty > 0) || (M[1] <= 0 && ty < 0)) { tx = -tx; ty = -ty; }
      var ux = Q[0] - M[0], uy = Q[1] - M[1], uL = hyp(ux, uy) || 1; ux /= uL; uy /= uL;
      var q = Math.max(0.2, (fs * 0.48) / unit);
      var a1 = [M[0] + ux * q, M[1] + uy * q];
      var a3 = [M[0] + tx * q, M[1] + ty * q];
      var a2 = [a1[0] + tx * q, a1[1] + ty * q];
      rg.polyline([a1, a2, a3].map(function (p) { return plotX(p[0]) + ',' + plotY(p[1]); }).join(' '))
        .fill('none').stroke({ color: '#333', width: Math.max(0.8, lw * 0.5) });
    }
    r.parts.forEach(function (p) {
      rg.line(plotX(p.a[0]), plotY(p.a[1]), plotX(p.b[0]), plotY(p.b[1]))
        .stroke({ color: '#fff', width: Math.max(9, lw * 6), opacity: 0.01 });
    });
    rg.on('mousemove', function (e) { showTooltip(RULES[r.n].s, e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () { selectRay(r.n); showPopup('Ray ' + r.n, RULES[r.n].l); });
  });

  /* ---- axis dots ---- */
  var rDot = Math.max(2.0, unit * 0.068);
  function dot(wx, wy, col, rr) { g.circle((rr || rDot) * 2).center(plotX(wx), plotY(wy)).fill(col).stroke('none'); }
  if (inBox(Cp, box)) dot(Cx, 0, '#111');
  if (inBox(Fp, box)) dot(Fx, 0, '#e02b2b');
  dot(-d, 0, '#2b6cb0');
  if (xi > box.xlo && xi < box.xhi) dot(xi, 0, '#c0392b', rDot * 0.9);

  /* ---- object ---- */
  var ow = Math.max(3.2, unit * 0.115);
  g.line(plotX(-d), plotY(0), plotX(-d), plotY(h * 0.84)).stroke({ color: COL.obj, width: ow, linecap: 'butt' });
  addArrow(g, -d, h, 0, 0.45, COL.obj, unit * 0.48);

  /* ---- image ---- */
  var igrp = g.group().css('cursor', 'pointer');
  var imgSeg = clipSeg([xi, 0], [xi, hi * 0.82], box);
  if (imgSeg) {
    igrp.line(plotX(imgSeg[0][0]), plotY(imgSeg[0][1]), plotX(imgSeg[1][0]), plotY(imgSeg[1][1]))
      .stroke({ color: COL.img, width: ow * 0.88, linecap: 'butt' });
  }
  var tipVisible = inBox(Qp, box);
  if (tipVisible) addArrow(igrp, xi, hi, 0, (hi > 0 ? 0.36 : -0.36), COL.img, unit * 0.42);
  igrp.on('mousemove', function (e) {
    showTooltip((mode === 'concave' ? 'Real, inverted image' : 'Virtual, upright image') + ' · m = ' + m.toFixed(2), e);
  }).on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup(mode === 'concave' ? 'Real image' : 'Virtual image',
        mode === 'concave'
          ? 'All the reflected rays physically pass through Q′, so light really is concentrated there — a screen placed at P′ would catch the inverted image.'
          : 'No reflected ray ever reaches Q′; only the dashed backward extensions meet there. The image is upright, reduced and cannot be caught on a screen.');
    });
  if (imgSeg) obstacles.push([imgSeg[0], imgSeg[1]]);

  /* ---- eye (lower-left clear space) ---- */
  var eCands = [], cx, cy;
  var exLo = box.xlo + 1.1, exHi = (mode === 'concave') ? -1.5 : -0.8;
  var eyLo = box.ylo + 0.9, eyHi = -0.9;
  if (exHi > exLo && eyHi > eyLo) {
    for (cx = exLo; cx <= exHi; cx += Math.max(0.25, (exHi - exLo) / 8)) {
      for (cy = eyLo; cy <= eyHi; cy += Math.max(0.25, (eyHi - eyLo) / 5)) eCands.push([cx, cy]);
    }
  }
  if (!eCands.length) eCands.push([box.xlo + 1.2, box.ylo + 1.0]);
  var ebest = eCands[0], ebv = -1;
  eCands.forEach(function (c) { var v = clearanceOf(c); if (v > ebv) { ebv = v; ebest = c; } });
  var eyeSz = clamp((yd[1] - yd[0]) * 0.055, 0.26, 0.62);
  drawEye(g, ebest[0], ebest[1], eyeSz);
  obstacles.push([[ebest[0] - eyeSz * 1.4, ebest[1]], [ebest[0] + eyeSz * 1.4, ebest[1]]]);

  /* ───── labels (drawn last, collision-aware, with halos) ───── */
  var L = g.group();
  var off = (fs * 1.0) / unit;

  placeLabel(L, [[-d - 0.55, h + 0.2], [-d - 0.2, h + 0.72], [-d + 0.55, h + 0.35], [-d - 0.8, h - 0.25]],
    'Q', '#111', fs, true, null, lblBox);

  var objHw = (6 * fs * 0.31) / unit;
  placeLabel(L, [[-d - 0.38 - objHw, h * 0.52], [-d - 0.38 - objHw, h * 0.82], [-d - 0.38 - objHw, h * 0.22]],
    'Object', '#111', fs * 0.95, false, null, lblBox);

  placeLabel(L, [[-d - 0.34, -off * 0.95], [-d + 0.34, -off * 0.95], [-d - 0.34, off * 0.95]],
    'P', '#111', fs, true, null, lblBox);

  var axisPts = [];
  if (inBox(Cp, box)) axisPts.push({ x: Cx, s: 'C' });
  if (inBox(Fp, box)) axisPts.push({ x: Fx, s: 'F' });
  if (xi > box.xlo && xi < box.xhi) axisPts.push({ x: xi, s: 'P\u2032' });
  axisPts.sort(function (A, B) { return A.x - B.x; });
  axisPts.forEach(function (it, k) {
    var up = (k % 2 === 0);
    var c = up
      ? [[it.x, off], [it.x, -off], [it.x, off * 2.15], [it.x, -off * 2.15]]
      : [[it.x, -off], [it.x, off], [it.x, -off * 2.15], [it.x, off * 2.15]];
    placeLabel(L, c, it.s, '#111', fs, true, null, lblBox);
  });

  /* V sits outside the arc, beside the vertex (as in the source) */
  var vx = (mode === 'concave') ? 0.55 : -0.55;
  placeLabel(L, [[vx, off * 0.55], [vx, -off * 0.55], [vx, off * 1.7], [vx, -off * 1.7]],
    'V', '#111', fs, true, null, lblBox);

  /* Q′ exactly at the ray crossing */
  if (tipVisible) {
    var qo = off * 1.15, qc = [];
    [[1, -0.55], [1, 0.55], [-1, -0.55], [-1, 0.55], [0.35, -1], [0.35, 1]].forEach(function (v) {
      qc.push([xi + v[0] * qo, hi + v[1] * qo]);
    });
    placeLabel(L, qc, 'Q\u2032', '#111', fs, true, null, lblBox);

    /* 'Image' label in clear space + curved leader to the image arrow */
    var cands = [], xLoC, xHiC, yLoC, yHiC;
    if (mode === 'concave') {
      xLoC = xi + 0.6; xHiC = Math.min(box.xhi - 0.9, xi + 3.2); yLoC = hi - 2.6; yHiC = hi - 0.8;
    } else {
      xLoC = xi - 1.2; xHiC = Math.min(box.xhi - 0.9, xi + 2.4); yLoC = -2.6; yHiC = -0.9;
    }
    for (cx = xLoC; cx <= xHiC + 1e-6; cx += Math.max(0.2, (xHiC - xLoC) / 6)) {
      for (cy = yLoC; cy <= yHiC + 1e-6; cy += Math.max(0.2, (yHiC - yLoC) / 5)) {
        if (cy < lblBox.ylo + 0.3 || cy > lblBox.yhi - 0.3) continue;
        if (mode === 'concave' && cx > mxf(clamp(cy, -yAp, yAp)) - 0.8) continue;
        cands.push([cx, cy]);
      }
    }
    if (!cands.length) cands.push([xi + 1.2, hi - 1.3]);
    var lbest = cands[0], lbv = -1;
    cands.forEach(function (c) {
      var v = clearanceOf(c);
      placedBoxes.forEach(function (b) {
        if (Math.abs(c[0] - b.x) < b.hw + 0.7 && Math.abs(c[1] - b.y) < b.hh + 0.4) v -= 1.4;
      });
      if (v > lbv) { lbv = v; lbest = c; }
    });
    var target = [xi + (lbest[0] > xi ? 0.1 : -0.1), hi * 0.75];
    leader(L, lbest, target, unit * 0.42);
    placeLabel(L, [lbest], 'Image', '#111', fs * 0.95, false, null, lblBox);
  }

  /* ray numerals — offset along each segment so they never collide */
  rays.forEach(function (r) {
    var c = COL[r.n], opa = rayGroups[r.n];
    var ng = L.group().opacity(opa);
    r.parts.forEach(function (p) {
      if (p.dash || !p.nf) return;
      var dx = p.b[0] - p.a[0], dy = p.b[1] - p.a[1], len = hyp(dx, dy);
      if (len < 0.5) return;
      var nx = -dy / len, ny = dx / len;
      if (ny < 0) { nx = -nx; ny = -ny; }
      var o = (fs * 0.82) / unit, cands = [];
      p.nf.forEach(function (t) {
        var px = p.a[0] + dx * t, py = p.a[1] + dy * t;
        cands.push([px + nx * o, py + ny * o]);
        cands.push([px - nx * o, py - ny * o]);
      });
      placeLabel(ng, cands, String(r.n), c, fs * 0.95, false, '700', lblBox);
    });
  });

  /* caption only — explanatory text lives in the side panel */
  txtAt(L, (xd[0] + xd[1]) / 2, yd[0] + (fs * 0.95) / unit,
    mode === 'concave' ? '(a) concave mirror' : '(b) convex mirror', '#111', fs * 0.95, 'middle');

  /* ---- panel readouts ---- */
  var st = document.getElementById('statusLine');
  if (st) {
    st.textContent = (mode === 'concave')
      ? 'Real, inverted image — the rays actually cross.'
      : 'Virtual, upright image — only the extensions cross.';
    st.style.color = (mode === 'concave') ? '#2c6e49' : '#8a5000';
  }
  var info = document.getElementById('imgInfo');
  if (info) {
    var msg = 'Object ' + (d / F0).toFixed(1) + 'f in front  ·  image ' +
      Math.abs(di / F0).toFixed(2) + 'f ' + (di > 0 ? 'in front (real)' : 'behind (virtual)') +
      '  ·  m = ' + m.toFixed(2) + (m < 0 ? ' (inverted)' : ' (upright)');
    var miss = [];
    if (!use2) miss.push('2');
    if (!use3) miss.push('3');
    if (miss.length) msg += '  —  ray ' + miss.join(' & ') + ' would strike far outside this finite mirror, so it is not drawn.';
    if (!tipVisible) msg += '  —  Q′ lies beyond the frame: as the object nears F the image races away.';
    info.textContent = msg;
  }
  window.__markRendered();
}

/* ───────── interactions ───────── */
function toggle_mirrorType(on) {
  state.mode = on ? 'convex' : 'concave';
  render();
}
function update_objectDistance(v) { state.s = v; render(); }
function selectRay(n) { state.sel = (state.sel === n) ? 0 : n; updateRuleUI(); render(); }

function updateRuleUI() {
  for (var k = 0; k <= 4; k++) {
    var b = document.getElementById('rayBtn' + k);
    if (b) b.className = (state.sel === k) ? 'active' : '';
  }
  var rb = document.getElementById('ruleBox');
  if (rb) rb.textContent = state.sel ? RULES[state.sel].l
    : 'All rays shown. Any two are enough to locate Q′ — the others confirm it.';
}

function keyIdea() {
  showPopup('Key idea',
    'An image is simply where the rays from a point on the object meet. If they meet in real space the image is real and inverted (concave mirror); if only their backward extensions meet, the image is virtual and upright behind the mirror (convex mirror).');
}

/* ───────── demo steps ───────── */
function goStep(i) {
  i = (i + STEPS.length) % STEPS.length;
  state.step = i;
  var st = STEPS[i];
  state.mode = st.mode; state.s = st.s; state.sel = st.sel;
  var cb = document.getElementById('mirrorTypeInput');
  if (cb) cb.checked = (state.mode === 'convex');
  var sl = document.getElementById('objectDistanceInput');
  if (sl) sl.value = state.s;
  var so = document.getElementById('objectDistanceVal');
  if (so) so.value = state.s;
  document.getElementById('demoNarration').textContent = st.n;
  document.getElementById('stepLabel').textContent = 'Step ' + (i + 1) + '/' + STEPS.length + ' — ' + st.t;
  updateRuleUI();
  render();
}
function nextStep() { goStep(state.step + 1); }
function prevStep() { goStep(state.step - 1); }

document.addEventListener('fig-resize', function () { render(); });
goStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
