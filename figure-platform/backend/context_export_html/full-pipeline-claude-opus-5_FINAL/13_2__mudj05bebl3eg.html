<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span id="demoNarration" style="display:block;margin:0 0 2px 0;font-size:12px;line-height:1.45;color:#222"></span>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="flex:1;text-align:center;font-size:11px;color:#444"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label><span><input id="directionInput" type="checkbox" onchange="toggle_direction(this.checked)"> Reverse: Right-Rotate(T,&nbsp;y)</span></label>
<label><span><input id="inorderRibbonInput" type="checkbox" onchange="toggle_inorderRibbon(this.checked)"> Show inorder walk</span></label>
<label>Assignment: <output id="playbackVal">before</output>
  <input id="playbackInput" type="range" min="0" max="5" step="1" value="0" oninput="update_playback(+this.value)"></label>
<span style="display:flex;gap:4px;align-items:center">
  <button onclick="trigger_first()" title="first">⏮</button>
  <button onclick="trigger_prev()" title="previous">◀</button>
  <button id="playBtn" onclick="trigger_play()" title="play / pause">▶</button>
  <button onclick="trigger_next()" title="next">⏭</button>
  <span id="frameCount" style="font-size:10px;color:#555"></span>
</span>
<label>Speed: <input id="speedInput" type="range" min="200" max="1600" step="100" value="850" oninput="update_speed(+this.value)"></label>
<span id="frameMsg" style="font-size:11px;line-height:1.4;color:#333;min-height:3.2em"></span>
<button id="wbToggle" onclick="toggleWorkbench()" style="margin-top:6px;text-align:left">▸ Code workbench — implement Left-Rotate(T, x)</button>
<span id="wbBody" style="display:none;flex-direction:column;gap:5px">
  <span style="font-size:10px;color:#555;line-height:1.35">Ops: right(n) left(n) parent(n) setLeft(p,c) setRight(p,c) replaceInParent(old,new) note(text). Every op records one replay frame.</span>
  <span style="display:flex;gap:4px">
    <button id="tabSample" onclick="loadSample('sample')">Sample</button>
    <button id="tabBuggy" onclick="loadSample('buggy')">Buggy</button>
    <button id="tabStarter" onclick="loadSample('starter')">Starter</button>
  </span>
  <textarea id="rotateCodeCode" spellcheck="false"></textarea>
  <label>Starting subtree: <input id="rotateCodeInput" value="x: left=alpha, right=y; y: left=beta, right=gamma; x has unnamed parent" readonly title="fixed starting configuration"></label>
  <span style="display:flex;gap:4px"><button id="runBtn" onclick="trigger_runCode()">▶ Run code</button><button onclick="trigger_reset()">Back to guided demo</button></span>
  <span id="runStatus" style="font-size:11px;color:#555">Status: not run</span>
  <span id="runLog" style="font-size:10px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:110px;overflow:auto;color:#444"></span>
</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;

  g.polygon([[px(32), y], [px(40), y - 6.2], [px(36.5), y], [px(40), y + 6.2]]).fill(col);
}
function dottedRule(g, x1, x2, y) {
  g.line(x1, y, x2, y).stroke({ color: '#000', width: 5.4, linecap: 'round' })
    .attr({ 'stroke-dasharray': '0.1,8.6' });
}
function drawCenter(g) {
  var dim = (rs.idx > 0 || rs.mode === 'code');
  var gu = g.group(), gl = g.group();
  /* upper: LEFT-ROTATE, arrow points left */
  dottedRule(gu, 326, 522, 110);
  arrowHead(gu, 280, 110, -1, '#000');
  richText(gu, '<tspan style="font-variant:small-caps">Left-Rotate(</tspan><tspan font-style="italic">T</tspan><tspan>, </tspan><tspan font-style="italic">x</tspan><tspan>)</tspan>', 400, 68, 26);
  /* lower: RIGHT-ROTATE, arrow points right */
  dottedRule(gl, 280, 476, 192);
  arrowHead(gl, 522, 192, 1, '#000');
  richText(gl, '<tspan style="font-variant:small-caps">Right-Rotate(</tspan><tspan font-style="italic">T</tspan><tspan>, </tspan><tspan font-style="italic">y</tspan><tspan>)</tspan>', 400, 240, 26);
  if (dim) { gu.opacity(rs.dir === 'left' ? 1 : 0.22); gl.opacity(rs.dir === 'right' ? 1 : 0.22); }
}

/* ───────── trace strip (centre gutter, clear of both trees) ───────── */
var TRACE = {
  left: ['Left-Rotate(T, x)', '1  y = x.right', '2  x.right = y.left  [β]', '3  y takes x’s place', '4  y.left = x'],
  right: ['Right-Rotate(T, y)', '1  x = y.left', '2  y.left = x.right  [β]', '3  x takes y’s place', '4  x.right = y']
};
function drawTrace(g) {
  var lines, cur;
  if (rs.mode === 'code') {
    var fr = curFrames();
    lines = ['recorded ops'];
    var start = Math.max(0, rs.idx - 3);
    for (var i = start; i <= rs.idx; i++) {
      var m = (fr[i].msg || '').replace(/\s+/g, ' ');
      if (m.length > 25) m = m.slice(0, 24) + '…';
      lines.push(i + '  ' + m);
    }
    cur = lines.length - 1;
  } else {
    lines = TRACE[rs.dir];
    cur = (rs.idx >= 1 && rs.idx <= 4) ? rs.idx : (rs.idx === 5 ? 5 : 0);
  }
  var y = TRACE_Y;
  lines.forEach(function (ln, i) {
    var col = '#000', op = 1;
    if (i === 0) {
      halo(g.text(ln).font({ family: SERIF, size: 14.5, style: 'italic', anchor: 'start' }).fill('#666')
        .attr({ 'xml:space': 'preserve' }).move(TRACE_X, y)).opacity(0.85);
      y += 19; return;
    }
    if (rs.mode === 'code') { col = (i === cur) ? HI : '#333'; op = (i === cur) ? 1 : 0.55; }
    else { col = (i === cur) ? HI : '#000'; op = (i <= (cur === 5 ? 4 : cur)) ? 1 : 0.26; }
    halo(g.text(ln).font({ family: MONO, size: 13, anchor: 'start' }).fill(col)
      .attr({ 'xml:space': 'preserve' }).move(TRACE_X, y)).opacity(op);
    y += 19;
  });
}

/* ───────── inorder ribbon ───────── */
function drawRibbon(g, fr, O) {
  var lay = layoutFrame(fr, O);
  var items = Object.keys(lay.pos).map(function (id) { return { id: id, x: lay.pos[id].x, det: !!lay.pos[id].det }; });
  if (!items.length) return;
  items.sort(function (a, b) { return a.x - b.x; });
  var minx = items[0].x - 20, maxx = items[items.length - 1].x + 20;
  g.line(minx, RIB_Y, maxx, RIB_Y).stroke({ color: '#8a8a8a', width: 1.3 });
  var seq = [];
  items.forEach(function (it) {
    g.line(it.x, RIB_Y - 6, it.x, RIB_Y + 6).stroke({ color: '#8a8a8a', width: 1.3 });
    halo(g.text(GLY[it.id]).font({ family: SERIF, size: 22, style: 'italic', anchor: 'middle' })
      .fill(it.det ? GHOSTC : '#333').center(it.x, RIB_Y + 22));
    seq.push(GLY[it.id]);
  });
  var hit = g.rect(maxx - minx, 46).move(minx, RIB_Y - 12).fill('#fff').opacity(0).css('cursor', 'pointer');
  hit.on('mousemove', function (e) { showTooltip('left-to-right order: ' + seq.join('  '), e); })
    .on('mouseleave', hideTooltip)
    .on('click', function () { showPopup('The inorder invariant', 'Reading the nodes left to right gives the inorder walk of the subtree. Both shapes read α, x, β, y, γ — a rotation is legal precisely because it leaves this sequence untouched while changing the tree’s height.'); });
}

/* ───────── render ───────── */
var rs = { dir: 'left', idx: 0, ribbon: false, mode: 'scripted', codeFrames: null, speed: 850, violations: [] };
function curFrames() { return rs.mode === 'code' ? rs.codeFrames : SCRIPT[rs.dir]; }
function maxIdx() { return curFrames().length - 1; }
function panelCaption(g, O, txt, col) {
  halo(g.text(txt).font({ family: SERIF, size: 14, style: 'italic', anchor: 'middle' }).fill(col).center(O.x, CAP_Y));
}
function render() {
  fscene.clear();
  var frames = curFrames();
  var fr = frames[rs.idx];
  var prev = rs.idx > 0 ? frames[rs.idx - 1] : null;
  var stepping = (rs.idx > 0 || rs.mode === 'code');
  var liveO = rs.dir === 'left' ? RP : LP;
  var statO = rs.dir === 'left' ? LP : RP;
  var statF = STATIC[rs.dir];

  if (stepping) {
    var x0 = Math.max(3, liveO.x - 150), x1 = Math.min(CW - 3, liveO.x + 150);
    fscene.rect(x1 - x0, 356).move(x0, 5).radius(10)
      .fill('#fffaf1').stroke({ color: '#e8dcc4', width: 1 }).attr({ 'stroke-dasharray': '6,5' });
  }
  drawCenter(fscene);

  /* reference (source) shape — ghosted once the working copy starts moving */
  var gs = fscene.group();
  drawPanel(gs, statF, statO, {});
  if (rs.ribbon) drawRibbon(gs, statF, statO);
  if (stepping) { gs.opacity(0.3); panelCaption(fscene, statO, 'reference — start shape', '#8a8a8a'); }

  /* live working copy */
  drawPanel(fscene, fr, liveO, {
    live: true, prev: prev,
    violations: (rs.mode === 'code' && rs.idx === maxIdx()) ? rs.violations : null
  });
  if (rs.ribbon) drawRibbon(fscene, fr, liveO);
  if (stepping) {

  }
}
function stateName(i) {
  if (rs.mode === 'code') { var f = curFrames()[i]; return (f && f.kind === 'error') ? 'error' : ('op ' + i); }
  return NAMES[rs.dir][i] || ('step ' + i);
}
function setIdx(i) {
  var m = maxIdx();
  rs.idx = Math.max(0, Math.min(m, i));
  var sl = document.getElementById('playbackInput');
  sl.max = String(m); sl.value = String(rs.idx);
  document.getElementById('playbackVal').value = stateName(rs.idx);
  document.getElementById('frameCount').textContent = (rs.idx + 1) + ' of ' + (m + 1);
  document.getElementById('frameMsg').textContent = curFrames()[rs.idx].msg || '';

}

/* ───────── controls ───────── */
function update_playback(v) { stopPlay(); setIdx(v); }
function toggle_direction(on) {
  stopPlay();
  rs.dir = on ? 'right' : 'left';
  if (rs.mode === 'code') { rs.mode = 'scripted'; setStatus('Status: guided demo (code result cleared)', '#555'); }
  setIdx(Math.min(rs.idx, maxIdx()));
}
function toggle_inorderRibbon(on) { rs.ribbon = !!on; render(); }
function update_speed(v) { rs.speed = v; if (playTimer) { stopPlay(); trigger_play(); } }

function trigger_prev() { stopPlay(); setIdx(rs.idx - 1); }

var playTimer = null;

function trigger_play() {
  if (playTimer) { stopPlay(); return; }
  if (rs.idx >= maxIdx()) setIdx(0);
  document.getElementById('playBtn').textContent = '❚❚';
  playTimer = setInterval(function () {

}
function toggleWorkbench() {
  var b = document.getElementById('wbBody'), t = document.getElementById('wbToggle');
  var open = b.style.display === 'none';
  b.style.display = open ? 'flex' : 'none';
  t.textContent = (open ? '▾' : '▸') + ' Code workbench — implement Left-Rotate(T, x)';

/* ───────── demo steps ───────── */
var PBNAME = { 'before': 0, 'y = x.right': 1, 'beta reparented': 2, 'parent relinked': 3, 'x is y.left': 4, 'after': 5 };
var DEMO = [
  { t: 'The two shapes', n: 'The same five items appear in two shapes: on the left y is on top with x as its left child; on the right x is on top with y as its right child. Only the x–y link and the owner of β differ.', s: { dir: 'left', pb: 'before', rib: false } },
  { t: 'Order is the invariant', n: 'Turn on the inorder ribbon: both shapes read α, x, β, y, γ from left to right. Rotation is allowed precisely because this sequence is untouched.', s: { dir: 'left', pb: 'before', rib: true } },
  { t: 'β changes parents', n: 'Step to the second assignment. The left drawing is now the dimmed reference; the tinted panel is the working copy. β, which was y’s left child, becomes x’s right child — the only subtree that moves.', s: { dir: 'left', pb: 'beta reparented', rib: true } },
  { t: 'The parent link flips', n: 'Next, y is attached where x used to hang on the unnamed parent. Forgetting this line is the classic bug: the rotated subtree floats free of the tree.', s: { dir: 'left', pb: 'parent relinked', rib: false } },
  { t: 'x descends', n: 'Finally x becomes y’s left child. The working copy has become the mirror shape of the dimmed reference — three assignments, constant time, no subtree traversed.', s: { dir: 'left', pb: 'after', rib: true } },
  { t: 'Run it backwards', n: 'Switch to Right-Rotate(T, y) and step again: the identical three links are reassigned in mirror image, returning the original shape.', s: { dir: 'right', pb: 'after', rib: true } }
];
var demoIdx = 0;
function applyDemo(i) {
  stopPlay();
  demoIdx = (i + DEMO.length) % DEMO.length;
  var st = DEMO[demoIdx].s;
  rs.mode = 'scripted';
  document.getElementById('directionInput').checked = (st.dir === 'right');
  rs.dir = st.dir;
  document.getElementById('inorderRibbonInput').checked = !!st.rib;
  rs.ribbon = !!st.rib;
  document.getElementById('demoNarration').textContent = DEMO[demoIdx].n;
  document.getElementById('stepLabel').textContent = 'Step ' + (demoIdx + 1) + '/' + DEMO.length + ' — ' + DEMO[demoIdx].t;
  setIdx(PBNAME[st.pb]);
}
function nextStep() { applyDemo(demoIdx + 1); }
function prevStep() { applyDemo(demoIdx - 1); }

/* ───────── code workbench ───────── */
var SAMPLES = {
  sample: 'function leftRotate(T, x) {\n  const y = right(x);            // y becomes the new subtree root\n  note(\'y = x.right\');\n  setRight(x, left(y));          // beta moves to x\'s right\n  note(\'beta reparented to x\');\n  replaceInParent(x, y);         // y takes x\'s place under the parent\n  note(\'y linked to x.p\');\n  setLeft(y, x);                 // x becomes y\'s left child\n  note(\'x is now y.left\');\n}',
  buggy: 'function leftRotate(T, x) {\n  const y = right(x);\n  setLeft(y, x);                 // BUG: attaching x before moving beta\n  setRight(x, left(y));          // left(y) is now x itself - beta is lost\n  replaceInParent(x, y);\n}',
  starter: 'function leftRotate(T, x) {\n  // Use: right(n) left(n) parent(n)\n  //      setLeft(p,c) setRight(p,c)\n  //      replaceInParent(old,new) note(text)\n  // Goal: y = x.right becomes the subtree root,\n  //       beta moves to x.right, x becomes y.left.\n}'
};
function loadSample(k) {
  document.getElementById('rotateCodeCode').value = SAMPLES[k];
  ['Sample', 'Buggy', 'Starter'].forEach(function (n) {
    var b = document.getElementById('tab' + n);
    if (b) b.className = (n.toLowerCase() === k) ? 'active' : '';
  });
}
function setStatus(txt, col) {
  var e = document.getElementById('runStatus');
  e.textContent = txt; e.style.color = col || '#555';
}
function workerBody() {
  function newS() {
    var ids = ['P', 'x', 'y', 'alpha', 'beta', 'gamma'], s = { L: {}, R: {}, Par: {} };
    ids.forEach(function (i) { s.L[i] = null; s.R[i] = null; s.Par[i] = null; });
    s.L.P = 'x'; s.Par.x = 'P'; s.L.x = 'alpha'; s.Par.alpha = 'x'; s.R.x = 'y'; s.Par.y = 'x';
    s.L.y = 'beta'; s.Par.beta = 'y'; s.R.y = 'gamma'; s.Par.gamma = 'y';
    return s;
  }
  self.onmessage = function (ev) {
    var src = ev.data.code, s = newS(), frames = [], ops = 0;
    var G = { x: 'x', y: 'y', alpha: 'α', beta: 'β', gamma: 'γ', P: 'parent' };
    function lbl(n) { return n ? (G[n] || n) : 'NIL'; }
    function snap(kind, touched, links, msg) {
      if (frames.length > 300) throw new Error('frame cap (300) exceeded — is there a loop?');
      frames.push({
        L: Object.assign({}, s.L), R: Object.assign({}, s.R), Par: Object.assign({}, s.Par),
        kind: kind, touched: touched || [], links: links || [], msg: msg
      });
    }
    function guard() { if (++ops > 120) throw new Error('operation cap (120) exceeded — a rotation needs only a handful of ops.'); }
    function chk(n, who) {
      if (n === null || n === undefined) return null;
      if (typeof n !== 'string' || !(n in s.L)) throw new Error(who + ': "' + String(n) + '" is not a node');
      return n;
    }
    function internal(n, who) {
      chk(n, who);
      if (n !== 'x' && n !== 'y') throw new Error(who + ': ' + lbl(n) + ' is a subtree label, not an internal node');
      return n;
    }
    function detach(c) { var p = s.Par[c]; if (p) { if (s.L[p] === c) s.L[p] = null; if (s.R[p] === c) s.R[p] = null; } }
    var api = {
      right: function (n) { guard(); n = chk(n, 'right'); var v = n ? s.R[n] : null; snap('read', n ? [n] : [], v ? [[n, v]] : [], 'right(' + lbl(n) + ') → ' + lbl(v)); return v; },
      left: function (n) { guard(); n = chk(n, 'left'); var v = n ? s.L[n] : null; snap('read', n ? [n] : [], v ? [[n, v]] : [], 'left(' + lbl(n) + ') → ' + lbl(v)); return v; },
      parent: function (n) { guard(); n = chk(n, 'parent'); var v = n ? s.Par[n] : null; snap('read', n ? [n] : [], [], 'parent(' + lbl(n) + ') → ' + lbl(v)); return v; },
      setLeft: function (p, c) {
        guard(); internal(p, 'setLeft'); c = chk(c, 'setLeft');
        var old = s.L[p]; if (old && old !== c) s.Par[old] = null;
        if (c) { detach(c); s.Par[c] = p; }
        s.L[p] = c;
        snap('write', [p].concat(c ? [c] : []), c ? [[p, c]] : [], 'setLeft(' + lbl(p) + ', ' + lbl(c) + ') — ' + lbl(c) + ' is now ' + lbl(p) + '.left');
      },
      setRight: function (p, c) {
        guard(); internal(p, 'setRight'); c = chk(c, 'setRight');
        var old = s.R[p]; if (old && old !== c) s.Par[old] = null;
        if (c) { detach(c); s.Par[c] = p; }
        s.R[p] = c;
        snap('write', [p].concat(c ? [c] : []), c ? [[p, c]] : [], 'setRight(' + lbl(p) + ', ' + lbl(c) + ') — ' + lbl(c) + ' is now ' + lbl(p) + '.right');
      },
      replaceInParent: function (o, n2) {
        guard(); chk(o, 'replaceInParent'); chk(n2, 'replaceInParent');
        var pa = s.Par[o];
        if (!pa) throw new Error('replaceInParent: ' + lbl(o) + ' has no parent (it is already detached)');
        if (s.L[pa] !== o && s.R[pa] !== o) throw new Error('replaceInParent: ' + lbl(o) + ' is no longer a child of ' + lbl(pa));
        if (n2) detach(n2);
        if (s.L[pa] === o) s.L[pa] = n2; else s.R[pa] = n2;
        if (n2) s.Par[n2] = pa;
        s.Par[o] = null;
        snap('write', n2 ? [n2] : [], (pa && n2) ? [[pa, n2]] : [], 'replaceInParent(' + lbl(o) + ', ' + lbl(n2) + ') — ' + lbl(n2) + ' now hangs on ' + lbl(pa));
      },
      note: function (t) { guard(); snap('note', [], [], String(t)); }
    };
    Object.freeze(api);
    var err = null;
    try {
      snap('before', [], [], 'Before: x is the subtree root, y is its right child.');
      var f = new Function('right', 'left', 'parent', 'setLeft', 'setRight', 'replaceInParent', 'note',
        '"use strict";' + src + '\nreturn typeof leftRotate==="function"?leftRotate:null;');
      var entry = f(api.right, api.left, api.parent, api.setLeft, api.setRight, api.replaceInParent, api.note);
      if (!entry) throw new Error('no function named leftRotate(T, x) was defined');
      entry({}, 'x');
    } catch (e) {
      err = (e && e.message) ? e.message : String(e);
      frames.push({
        L: Object.assign({}, s.L), R: Object.assign({}, s.R), Par: Object.assign({}, s.Par),
        kind: 'error', touched: [], links: [], msg: '⚠ ' + err
      });
    }
    self.postMessage({ frames: frames, error: err });
  };
}
function inorderOf(fr) {
  var out = [], seen = {};
  (function w(id) { if (!id || seen[id]) return; seen[id] = 1; w(fr.L[id]); out.push(id); w(fr.R[id]); })(fr.L.P || fr.R.P);
  return out;
}
function acceptFrames(data) {
  if (!data || !data.frames || !data.frames.length) { failFrames('⚠ no frames were recorded'); return; }
  rs.codeFrames = data.frames; rs.mode = 'code'; rs.dir = 'left';
  document.getElementById('directionInput').checked = false;
  var last = data.frames[data.frames.length - 1];
  var viol = [];
  if (last.L.P !== 'y') viol.push('y');
  if (last.L.y !== 'x') viol.push('x');
  if (last.R.y !== 'gamma') viol.push('gamma');
  if (last.L.x !== 'alpha') viol.push('alpha');
  if (last.R.x !== 'beta') viol.push('beta');
  var io = inorderOf(last).join(',');
  var ok = (viol.length === 0) && io === 'alpha,x,beta,y,gamma';
  rs.violations = viol;
  if (last.kind === 'error') setStatus('Status: error — ' + last.msg.replace('⚠ ', ''), '#c62828');
  else if (ok) setStatus('Status: correct ✓ inorder still α, x, β, y, γ', '#2e7d32');
  else setStatus('Status: wrong answer — broken: ' + viol.map(function (v) { return GLY[v]; }).join(', '), '#c62828');
  document.getElementById('runLog').textContent =
    data.frames.map(function (f, i) { return i + '  ' + (f.msg || ''); }).join('\n');
  document.getElementById('demoNarration').textContent = 'Code mode: the dimmed drawing is the reference shape; the tinted panel is your working copy. Scrub the frames below — each one is a single recorded operation.';
  document.getElementById('stepLabel').textContent = 'code trace';
  setIdx(0);
}
function failFrames(msg) {
  var s = newState('left');
  rs.codeFrames = [snapOf(s, 'error', [], [], msg)];
  rs.mode = 'code'; rs.violations = [];
  setStatus('Status: ' + msg, '#c62828');
  document.getElementById('runLog').textContent = msg;
  setIdx(0);
}
function trigger_runCode() {
  stopPlay();
  var btn = document.getElementById('runBtn');
  btn.disabled = true;
  setStatus('Status: running…', '#555');
  var code = document.getElementById('rotateCodeCode').value;
  var url;
  try {
    url = URL.createObjectURL(new Blob(['(' + workerBody.toString() + ')()'], { type: 'text/javascript' }));
  } catch (e) { btn.disabled = false; failFrames('⚠ cannot start worker: ' + e.message); return; }
  var w = new Worker(url), done = false;
  function finish() { done = true; try { w.terminate(); } catch (e) { } URL.revokeObjectURL(url); btn.disabled = false; }
  var to = setTimeout(function () { if (done) return; finish(); failFrames('⚠ timed out after 1.5 s — infinite loop?'); }, 1500);
  w.onmessage = function (e) { if (done) return; clearTimeout(to); finish(); acceptFrames(e.data); };
  w.onerror = function (e) { if (done) return; clearTimeout(to); finish(); failFrames('⚠ ' + (e.message || 'worker error')); };
  w.postMessage({ code: code });
}
function trigger_reset() {
  rs.mode = 'scripted'; rs.violations = []; rs.codeFrames = null;
  setStatus('Status: not run', '#555');
  document.getElementById('runLog').textContent = '';
  applyDemo(0);
}

/* ───────── init ───────── */
loadSample('sample');
applyDemo(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
