<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0 0 2px 0;font-size:11px;line-height:1.45"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;white-space:nowrap"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label style="flex-direction:row;align-items:center;gap:6px;margin-top:4px"><input id="pathChoiceInput" type="checkbox" onchange="toggle_pathChoice(this.checked)"> Path (b): parabola y = x²</label>
<span style="font-size:10px;color:#666;margin-top:-2px">unchecked = path (a): vertical segment at x = −π/2</span>
<label style="margin-top:4px">Parameter t along C: <output id="tParamVal">0.00</output><input id="tParamInput" type="range" min="0" max="1" step="0.01" value="0" oninput="document.getElementById('tParamVal').value=(+this.value).toFixed(2);update_tParam(+this.value)"></label>
<span style="display:flex;gap:6px;margin-top:2px"><button onclick="trigger_sweep()">▶ Sweep t</button><button onclick="trigger_reset()">↺ Reset path</button></span>
<span style="font-size:10px;color:#555;line-height:1.4;margin-top:4px">Drag the red endpoint dots to reshape C. Hover anywhere in the shaded panel to read F there; click the red curve for a note.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.

        namedSpan.style.display = 'none';

      if (existing) return existing;

    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.

            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'

        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'

    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *

      var appliers = [];

          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.

      apply(input.value);

    }

var mount = document.getElementById('container');
var svg = SVG().addTo(mount).size('100%', '100%');

var gBg = svg.group(), gField = svg.group(), gAxes = svg.group(), gHit = svg.group(),
    gCurve = svg.group(), gOver = svg.group(), gChrome = svg.group(), gRead = svg.group();

var SERIF = 'Georgia, "Times New Roman", serif';
var MONO = 'ui-monospace, Consolas, "Courier New", monospace';
var RED = '#ea1c2a', LRED = '#f4837c', BLUE = '#1f6fd0', GRN = '#139a55', ORG = '#e8821e';
var MINT = '#dcecdf', INK = '#111111';

var PANEL = {
  a: { xd: [-3.40, 1.70], yd: [-1.20, 3.15], nx: 12, ny: 12,
       xticks: [{ v: -Math.PI / 2, lab: '\u2212\u03C0/2' }], yticks: [1, 2],
       side: 'right', cap: '(a)' },
  b: { xd: [-2.60, 3.60], yd: [-0.80, 4.80], nx: 13, ny: 13,
       xticks: [{ v: -2, lab: '\u22122' }, { v: -1, lab: '\u22121' }, { v: 1, lab: '1' }, { v: 2, lab: '2' }, { v: 3, lab: '3' }],
       yticks: [1, 2, 3, 4], side: 'left', cap: '(b)' }
};

var DEF = { a: { p0: [-Math.PI / 2, 2], p1: [-Math.PI / 2, 1] }, b: { p0: [-1, 1], p1: [2, 4] } };
var ends = { a: { p0: DEF.a.p0.slice(), p1: DEF.a.p1.slice() },
             b: { p0: DEF.b.p0.slice(), p1: DEF.b.p1.slice() } };
var CTRL = [0.5, -2];                       // control point making the default (b) exactly y = x²
var state = { path: 'a', t: 0, step: 0 };
var L = {}, pw = 100, ph = 100, SU = 100, fs = 11;
var dragging = null, sweepRAF = 0;

/* ---------- geometry of the path ---------- */
function rAt(t) {
  var e = ends[state.path];
  if (state.path === 'a') {
    return [e.p0[0] + (e.p1[0] - e.p0[0]) * t, e.p0[1] + (e.p1[1] - e.p0[1]) * t];
  }
  var u = 1 - t, a = e.p0, b = e.p1, c = CTRL;
  return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0],
          u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]];
}
function drAt(t) {
  var e = ends[state.path];
  if (state.path === 'a') return [e.p1[0] - e.p0[0], e.p1[1] - e.p0[1]];
  var u = 1 - t, a = e.p0, b = e.p1, c = CTRL;
  return [2 * u * (c[0] - a[0]) + 2 * t * (b[0] - c[0]),
          2 * u * (c[1] - a[1]) + 2 * t * (b[1] - c[1])];
}
function fieldAt(x) { return [Math.cos(x), Math.sin(x)]; }

/* ---------- running integral ---------- */
var NQ = 480, cum = new Float64Array(NQ + 1), total = 0, maxAbs = 1e-3;
function integrand(t) {
  var p = rAt(t), d = drAt(t), F = fieldAt(p[0]);
  return F[0] * d[0] + F[1] * d[1];
}
function recompute() {
  var h = 1 / NQ, prev = integrand(0);
  cum[0] = 0; maxAbs = 1e-3;
  for (var i = 1; i <= NQ; i++) {
    var cur = integrand(i * h);
    cum[i] = cum[i - 1] + (prev + cur) * 0.5 * h;
    if (Math.abs(cum[i]) > maxAbs) maxAbs = Math.abs(cum[i]);
    prev = cur;
  }
  total = cum[NQ];
}
function running(t) {
  var u = Math.max(0, Math.min(1, t)) * NQ, i = Math.floor(u);
  if (i >= NQ) return cum[NQ];
  return cum[i] + (cum[i + 1] - cum[i]) * (u - i);
}

/* ---------- layout ---------- */
function layout() {
  var P = PANEL[state.path];
  var f = setPlotFrame({ xDomain: P.xd, yDomain: P.yd, margin: 10, draw: svg });
  var Wp = f.width, Hp = f.height;
  var M = Math.max(24, Math.min(58, Wp * 0.075));
  var TB = Math.max(22, Math.min(46, Hp * 0.085));
  var BB = Math.max(38, Math.min(92, Hp * 0.17));
  f.margin = M;
  f.sx = (Wp - 2 * M) / (P.xd[1] - P.xd[0]);
  f.height = Hp - BB + M;
  f.sy = Math.max(1, (f.height - M - TB) / (P.yd[1] - P.yd[0]));
  L = { W: Wp, H: Hp, M: M, TB: TB, BB: BB, sx: f.sx, sy: f.sy };
  pw = Math.max(20, Wp - 2 * M);
  ph = Math.max(20, (Hp - BB) - TB);
  SU = Math.min(pw, ph);
  fs = Math.max(8.5, Math.min(15, SU * 0.035));
}
function wx2(px) { var x0 = plotX(0), sx = plotX(1) - plotX(0); return (px - x0) / sx; }
function wy2(py) { var y0 = plotY(0), sy = plotY(0) - plotY(1); return (y0 - py) / sy; }
function scrDir(vx, vy) {
  var dx = vx * L.sx, dy = -vy * L.sy, m = Math.hypot(dx, dy) || 1;
  return [dx / m, dy / m];
}

/* ---------- small drawing helpers ---------- */
function label(g, str, x, y, size, color, o) {
  o = o || {};
  var t = g.plain(str);
  t.attr({
    x: x, y: y, fill: color || INK,
    'font-family': o.family || SERIF, 'font-size': size,
    'font-style': o.italic ? 'italic' : 'normal',
    'text-anchor': o.anchor || 'middle',
    'dominant-baseline': o.baseline || 'middle'
  });
  if (o.halo) t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': Math.max(2, size * 0.3), 'stroke-linejoin': 'round' });
  return t;
}
function drawArrow(g, x1, y1, x2, y2, col, w, hs) {
  var dx = x2 - x1, dy = y2 - y1, Ln = Math.hypot(dx, dy);
  if (Ln < 0.4) return;
  var ux = dx / Ln, uy = dy / Ln;
  var bx = x2 - ux * hs, by = y2 - uy * hs;
  g.line(x1, y1, bx + ux * hs * 0.3, by + uy * hs * 0.3).stroke({ color: col, width: w, linecap: 'round' });
  var nx = -uy, ny = ux, k = hs * 0.42;
  g.polygon([x2 + ',' + y2, (bx + nx * k) + ',' + (by + ny * k), (bx - nx * k) + ',' + (by - ny * k)].join(' ')).fill(col);
}
function triAt(g, t, col, size) {
  var p = rAt(t), d = drAt(t), u = scrDir(d[0], d[1]);
  var x = plotX(p[0]), y = plotY(p[1]), nx = -u[1], ny = u[0];
  g.polygon([
    (x + u[0] * size) + ',' + (y + u[1] * size),
    (x - u[0] * size * 0.55 + nx * size * 0.72) + ',' + (y - u[1] * size * 0.55 + ny * size * 0.72),
    (x - u[0] * size * 0.55 - nx * size * 0.72) + ',' + (y - u[1] * size * 0.55 - ny * size * 0.72)
  ].join(' ')).fill(col);
}

/* ---------- static layer ---------- */
function drawStatic() {
  gBg.clear(); gField.clear(); gAxes.clear(); gHit.clear(); gChrome.clear();
  var P = PANEL[state.path];
  var x0 = plotX(P.xd[0]), x1 = plotX(P.xd[1]), yTop = plotY(P.yd[1]), yBot = plotY(P.yd[0]);
  var ix = (x1 - x0) * 0.045, iy = (yBot - yTop) * 0.045;
  var gx0 = x0 + ix, gx1 = x1 - ix, gy0 = yTop + iy, gy1 = yBot - iy;
  gBg.rect(gx1 - gx0, gy1 - gy0).move(gx0, gy0).fill(MINT);

  /* field of unit arrows */
  var cw = (gx1 - gx0) / P.nx, ch = (gy1 - gy0) / P.ny;
  var alen = Math.min(cw, ch) * 0.80;
  var lw = Math.max(0.55, SU * 0.0042);
  for (var i = 0; i < P.nx; i++) {
    for (var j = 0; j < P.ny; j++) {
      var cx = gx0 + (i + 0.5) * cw, cy = gy0 + (j + 0.5) * ch;
      var u = scrDir(Math.cos(wx2(cx)), Math.sin(wx2(cx)));
      drawArrow(gField, cx - u[0] * alen / 2, cy - u[1] * alen / 2,
                        cx + u[0] * alen / 2, cy + u[1] * alen / 2, INK, lw, alen * 0.34);
    }
  }

  /* axes */
  var aw = Math.max(1.1, SU * 0.006);
  var ay = plotY(0), ax = plotX(0), hs = Math.max(5, SU * 0.028);
  var xEnd = x1 + L.M * 0.5, yEnd = yTop - L.TB * 0.35;
  gAxes.line(x0 - 6, ay, xEnd - hs * 0.4, ay).stroke({ color: INK, width: aw });
  gAxes.polygon([xEnd + ',' + ay, (xEnd - hs) + ',' + (ay - hs * 0.42), (xEnd - hs) + ',' + (ay + hs * 0.42)].join(' ')).fill(INK);
  gAxes.line(ax, yBot + 6, ax, yEnd + hs * 0.4).stroke({ color: INK, width: aw });
  gAxes.polygon([ax + ',' + yEnd, (ax - hs * 0.42) + ',' + (yEnd + hs), (ax + hs * 0.42) + ',' + (yEnd + hs)].join(' ')).fill(INK);
  label(gChrome, 'x', xEnd + fs * 0.75, ay - fs * 0.95, fs * 1.25, INK, { italic: true, halo: true });
  label(gChrome, 'y', ax + fs * 0.95, yEnd + fs * 0.3, fs * 1.25, INK, { italic: true, halo: true });

  /* ticks */
  var tk = Math.max(3.5, SU * 0.016);
  P.yticks.forEach(function (v) {
    var py = plotY(v);
    gAxes.line(ax - tk, py, ax + tk, py).stroke({ color: INK, width: aw });
    label(gChrome, String(v), ax - tk - fs * 0.45, py, fs * 1.05, INK, { anchor: 'end', halo: true });
  });
  P.xticks.forEach(function (o) {
    var px = plotX(o.v);
    gAxes.line(px, ay - tk, px, ay + tk).stroke({ color: INK, width: aw });
    label(gChrome, o.lab, px, ay + tk + fs * 0.95, fs * 1.05, INK, { halo: true });
  });

  /* transparent hover surface over the field (below curve, so dots stay draggable) */
  gHit.rect(gx1 - gx0, gy1 - gy0).move(gx0, gy0).fill('#fff').attr({ 'fill-opacity': 0, 'pointer-events': 'all' })
    .on('mousemove', function (e) {
      var r = svg.node.getBoundingClientRect();
      var wx = wx2(e.clientX - r.left), wy = wy2(e.clientY - r.top);
      var F = fieldAt(wx);
      showTooltip('F(' + wx.toFixed(2) + ', ' + wy.toFixed(2) + ') = (' + F[0].toFixed(2) + ', ' + F[1].toFixed(2) + ')  —  depends on x only', e);
    })
    .on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup('The vector field F', 'Every black arrow is F = cos(x) i + sin(x) j drawn at unit length ("vectors not to scale"). Because F depends only on x, the pattern is identical along every vertical line: straight down at x = \u2212\u03C0/2, straight right at x = 0, straight up at x = \u03C0/2.');
    });

  /* title, legend, caption */
  label(gChrome, 'Vectors not to scale', L.W / 2, L.TB * 0.42, fs * 1.3, '#222', { italic: true, halo: true });
  drawLegend();
  label(gChrome, P.cap, L.W / 2, L.H - L.BB * 0.17, fs * 1.55, '#111', { italic: true });
}

function drawLegend() {
  var items = [{ c: INK, t: 'field F' }, { c: RED, t: 'oriented path C' }, { c: GRN, t: 'tangent T' }, { c: BLUE, t: 'F at the point' }];
  var lfs = Math.max(8, fs * 0.82), seg = Math.max(12, SU * 0.05), gap = lfs * 0.5;
  var widths = items.map(function (it) { return seg + gap + it.t.length * lfs * 0.52; });
  var totalW = widths.reduce(function (a, b) { return a + b; }, 0) + (items.length - 1) * lfs * 1.4;
  var x = Math.max(6, L.W / 2 - totalW / 2), y = L.H - L.BB + L.BB * 0.34;
  items.forEach(function (it, k) {
    drawArrow(gChrome, x, y, x + seg, y, it.c, Math.max(1, SU * 0.006), seg * 0.4);
    label(gChrome, it.t, x + seg + gap, y, lfs, '#333', { anchor: 'start', family: 'sans-serif', halo: true });

/* ---------- dynamic layer ---------- */
function drawDynamic() {
  gCurve.clear(); gOver.clear();
  var P = PANEL[state.path];
  var cwid = Math.max(2.2, SU * 0.013);

  var pts = [], i;
  for (i = 0; i <= 160; i++) {
    var p = rAt(i / 160);
    pts.push(plotX(p[0]).toFixed(2) + ',' + plotY(p[1]).toFixed(2));
  }
  gCurve.polyline(pts.join(' ')).fill('none')
    .stroke({ color: RED, width: cwid, linecap: 'round', linejoin: 'round' })
    .css('cursor', 'pointer')
    .on('mousemove', function (e) { showTooltip('C — the oriented path. \u222B\u1D04 F\u00B7dr = ' + total.toFixed(3), e); })
    .on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup('The line integral \u222B\u1D04 F\u00B7dr',
        'Walking along C, only the part of F pointing along the direction of travel counts: the integrand is F\u00B7T times the speed. Where the arrows push you forward the running total rises (blue); where they oppose you it falls (orange). Reverse the orientation and the answer changes sign.');
    });

  var hsz = Math.max(4.5, SU * 0.028);
  if (state.path === 'a') { triAt(gCurve, 0.52, LRED, hsz); }
  else { triAt(gCurve, 0.18, LRED, hsz); triAt(gCurve, 0.80, LRED, hsz); }

  /* italic C label beside the curve */
  var lt = state.path === 'a' ? 0.62 : 0.90;
  var lp = rAt(lt), ld = drAt(lt), lu = scrDir(ld[0], ld[1]);
  label(gCurve, 'C', plotX(lp[0]) - lu[1] * fs * 1.9, plotY(lp[1]) + lu[0] * fs * 1.9, fs * 1.5, RED, { italic: true, halo: true });

  /* draggable endpoints */
  mkDot(rAt(0), 'p0'); mkDot(rAt(1), 'p1');

  drawOverlay();
  drawReadout();
}

function mkDot(p, key) {
  var r = Math.max(3.6, SU * 0.019);
  var c = gCurve.circle(r * 2).center(plotX(p[0]), plotY(p[1])).fill(RED).stroke({ color: '#fff', width: Math.max(0.8, r * 0.28) });
  c.css('cursor', 'grab');
  c.on('mousemove', function (e) { showTooltip('Drag me: reshape C and watch \u222B\u1D04 F\u00B7dr change', e); })
   .on('mouseleave', hideTooltip)
   .on('pointerdown', function (ev) { ev.preventDefault(); dragging = key; hideTooltip(); });
}

function drawOverlay() {
  var t = state.t, p = rAt(t), d = drAt(t);
  var F = fieldAt(p[0]);
  var dl = Math.hypot(d[0], d[1]) || 1;
  var T = [d[0] / dl, d[1] / dl];
  var dot = F[0] * T[0] + F[1] * T[1];
  var x = plotX(p[0]), y = plotY(p[1]);
  var Lv = Math.max(16, SU * 0.15);
  var uF = scrDir(F[0], F[1]), uT = scrDir(T[0], T[1]);
  var aw = Math.max(1.4, SU * 0.009), hh = Math.max(5, SU * 0.03);

  /* shaded projection of F on T */
  var projLen = dot * Lv;
  gOver.line(x, y, x + uT[0] * projLen, y + uT[1] * projLen)
    .stroke({ color: dot >= 0 ? BLUE : ORG, width: Math.max(5, SU * 0.028), linecap: 'butt', opacity: 0.30 });
  gOver.line(x + uF[0] * Lv, y + uF[1] * Lv, x + uT[0] * projLen, y + uT[1] * projLen)
    .stroke({ color: '#666', width: Math.max(0.8, SU * 0.004), dasharray: '3,3' });

  drawArrow(gOver, x, y, x + uT[0] * Lv, y + uT[1] * Lv, GRN, aw, hh);
  drawArrow(gOver, x, y, x + uF[0] * Lv, y + uF[1] * Lv, BLUE, aw, hh);

  label(gOver, 'T', x + uT[0] * (Lv + fs * 0.95), y + uT[1] * (Lv + fs * 0.95), fs, GRN, { italic: true, halo: true });
  label(gOver, 'F', x + uF[0] * (Lv + fs * 0.95), y + uF[1] * (Lv + fs * 0.95), fs, BLUE, { italic: true, halo: true });

  var tr = gOver.circle(Math.max(6, SU * 0.028)).center(x, y).fill('#fff').stroke({ color: '#333', width: Math.max(1, SU * 0.006) });
  tr.css('cursor', 'pointer')
    .on('mousemove', function (e) { showTooltip('t = ' + t.toFixed(2) + '   F\u00B7T = ' + dot.toFixed(3), e); })
    .on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup('The tangential component F\u00B7T',
        'The green arrow T is the unit direction of travel; the blue arrow is the field there. The shaded bar is their dot product F\u00B7T — the part of F that actually helps you along. F\u00B7T = 1 means the field points exactly your way, 0 means it is perpendicular (it contributes nothing), and negative means you are pushing against it.');
    });
}

function drawReadout() {
  gRead.clear();
  var P = PANEL[state.path];
  var t = state.t, p = rAt(t), d = drAt(t), F = fieldAt(p[0]);
  var dl = Math.hypot(d[0], d[1]) || 1, T = [d[0] / dl, d[1] / dl];
  var dot = F[0] * T[0] + F[1] * T[1], run = running(t);

  var rfs = Math.max(7.5, fs * 0.82), lh = rfs * 1.55, pad = rfs * 0.8;
  var lines = [
    ['t = ' + t.toFixed(2), '#222'],
    ['x = ' + p[0].toFixed(2) + '   y = ' + p[1].toFixed(2), '#222'],
    ['F = (' + F[0].toFixed(2) + ', ' + F[1].toFixed(2) + ')', BLUE],
    ['T = (' + T[0].toFixed(2) + ', ' + T[1].toFixed(2) + ')', GRN],
    ['F \u00B7 T = ' + dot.toFixed(3), dot >= 0 ? BLUE : ORG],
    ['\u222B F\u00B7dr = ' + run.toFixed(3), run >= 0 ? BLUE : ORG],
    ['total = ' + total.toFixed(3), '#555']
  ];
  var rw = Math.max(112, Math.min(pw * 0.44, rfs * 15));
  var barH = Math.max(6, rfs * 0.8);
  var rh = pad * 2 + lines.length * lh + barH + rfs * 0.7;
  var bx = (P.side === 'right') ? plotX(P.xd[1]) - rw - 4 : plotX(P.xd[0]) + 4;
  var by = L.TB + 4;
  if (rh > ph * 0.92) { rh = ph * 0.92; }

  gRead.rect(rw, rh).move(bx, by).radius(4).fill('#ffffff').opacity(0.93).stroke({ color: '#b6c2b8', width: 1 });
  for (var i = 0; i < lines.length; i++) {
    label(gRead, lines[i][0], bx + pad, by + pad + lh * (i + 0.5), rfs, lines[i][1], { anchor: 'start', family: MONO });
  }
  /* accumulation bar */
  var bw = rw - pad * 2, byy = by + pad + lines.length * lh + rfs * 0.15;
  var cxx = bx + pad + bw / 2;
  gRead.rect(bw, barH).move(bx + pad, byy).fill('#eceff0').stroke({ color: '#ccd2ce', width: 0.8 });
  var sc = Math.max(Math.abs(total), maxAbs, 1e-3);
  var w = (run / sc) * (bw / 2);
  if (Math.abs(w) > 0.5) {
    gRead.rect(Math.abs(w), barH).move(w >= 0 ? cxx : cxx + w, byy).fill(run >= 0 ? BLUE : ORG).opacity(0.85);
  }
  gRead.line(cxx, byy - 1.5, cxx, byy + barH + 1.5).stroke({ color: '#8a938c', width: 0.9 });
}

/* ---------- interaction handlers ---------- */
function redrawAll() { layout(); drawStatic(); drawDynamic(); }

function toggle_pathChoice(on) {
  state.path = on ? 'b' : 'a';
  recompute();
  redrawAll();
}
function update_tParam(v) { state.t = v; drawDynamic(); }
function setT(v) {
  state.t = v;
  var inp = document.getElementById('tParamInput');
  if (inp) inp.value = v;
  var out = document.getElementById('tParamVal');
  if (out) out.value = v.toFixed(2);
  drawDynamic();
}
function trigger_reset() {
  ends[state.path] = { p0: DEF[state.path].p0.slice(), p1: DEF[state.path].p1.slice() };
  recompute(); drawDynamic();
}
function trigger_sweep() {
  if (sweepRAF) { cancelAnimationFrame(sweepRAF); sweepRAF = 0; return; }
  var start = state.t >= 0.999 ? 0 : state.t, t0 = performance.now();
  function step(now) {
    var u = start + (now - t0) / 3200;
    if (u >= 1) u = 1;
    setT(u);
    sweepRAF = (u < 1) ? requestAnimationFrame(step) : 0;
  }
  sweepRAF = requestAnimationFrame(step);
}

window.addEventListener('pointermove', function (ev) {
  if (!dragging) return;
  var r = svg.node.getBoundingClientRect();
  var P = PANEL[state.path];
  var wx = Math.max(P.xd[0] + 0.05, Math.min(P.xd[1] - 0.05, wx2(ev.clientX - r.left)));
  var wy = Math.max(P.yd[0] + 0.05, Math.min(P.yd[1] - 0.05, wy2(ev.clientY - r.top)));
  ends[state.path][dragging] = [wx, wy];
  recompute(); drawDynamic();
});
window.addEventListener('pointerup', function () { dragging = null; });

/* ---------- demo steps ---------- */
var STEPS = [
  { title: 'The field alone',
    n: 'Black arrows show F = cos(x) i + sin(x) j sampled on a grid. Near x = \u2212\u03C0/2 they point straight down; near x = 0 straight right; the pattern sweeps periodically across the plane.',
    s: { path: 'a', t: 0 } },
  { title: 'Path (a): straight down the field',
    n: 'The red segment runs from (\u2212\u03C0/2, 2) down to (\u2212\u03C0/2, 1), exactly parallel to the downward arrows there. Every tangent points with the field, so every contribution is positive.',
    s: { path: 'a', t: 0 } },
  { title: 'Walk along (a)',
    n: 'Sweep t: the field vector and the unit tangent stay aligned, F\u00B7T holds steady at 1, and the running total climbs smoothly to the total value 1 — exactly the length of the path.',
    s: { path: 'a', t: 1 } },
  { title: 'Path (b): a long curve through the field',
    n: 'Now follow the parabola y = x\u00B2 from (\u22121,1) to (2,4). Its slope 2x tracks the field slope tan x closely, so the arrows nearly always help — but the journey is much longer.',
    s: { path: 'b', t: 0 } },
  { title: 'Watch the tangential component',
    n: 'Step t forward: F\u00B7T stays near 1 while the curve runs with the arrows, then dips toward 0.78 past x = \u03C0/2 where the field tilts away from the tangent. The bar stays blue: contributions are positive.',
    s: { path: 'b', t: 0.45 } },
  { title: 'Compare the totals',
    n: 'Finish the sweep: path (a) gives 1.00, the parabola about 5.84. Length alone is not the reason — it is the accumulation of F\u00B7T. A path crossing the arrows would score far less for the same distance.',
    s: { path: 'b', t: 1 } },
  { title: 'Reshape the path yourself',
    n: 'Drag the red endpoints. Steer the curve into regions where the arrows oppose the motion and F\u00B7T goes negative, the bar turns orange, and the integral falls — it can even end up below zero.',
    s: { path: 'b', t: 1 } }
];

function applyStep(i) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, i));
  var st = STEPS[state.step];
  var cb = document.getElementById('pathChoiceInput');
  var wantB = st.s.path === 'b';
  if (cb) cb.checked = wantB;
  var changed = (state.path !== st.s.path);
  state.path = st.s.path;
  var inp = document.getElementById('tParamInput'), out = document.getElementById('tParamVal');
  if (inp) inp.value = st.s.t;
  if (out) out.value = (+st.s.t).toFixed(2);
  state.t = st.s.t;
  recompute();
  if (changed) redrawAll(); else drawDynamic();
  var nar = document.getElementById('demoNarration');
  if (nar) nar.innerHTML = '<b>' + st.title + '.</b> ' + st.n;
  var lab = document.getElementById('stepLabel');
  if (lab) lab.textContent = 'Step ' + (state.step + 1) + ' / ' + STEPS.length;
}
function nextStep() { applyStep(state.step + 1); }
function prevStep() { applyStep(state.step - 1); }

/* ---------- boot ---------- */
document.addEventListener('fig-resize', function () { redrawAll(); });
layout();
recompute();
drawStatic();
drawDynamic();
applyStep(0);
window.__markRendered();
