<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700;font-size:12px;color:#1a1a1a" id="stepTitle">Light everywhere, in every direction</span>
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45;color:#333"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;color:#555">1 / 5</span>
  <button onclick="nextStep()">▶</button>
</span>
<span style="display:block;height:1px;background:#e0e0e0;margin:4px 0"></span>
<label><input id="locationModeInput" type="checkbox" onchange="toggle_locationMode(this.checked)"> Sample inside pinhole camera</label>
<label>Pinhole aperture width: <output id="apertureSizeVal">0.08</output>
  <input id="apertureSizeInput" type="range" min="0.02" max="1" step="0.02" value="0.08" oninput="document.getElementById('apertureSizeVal').value=this.value;update_apertureSize(+this.value)"></label>
<button onclick="trigger_swapDot()">Switch image-plane point (upper / lower)</button>
<span style="font-size:10px;color:#666;line-height:1.4">Click anywhere in the open sky to move the free-space sample point. Hover the dots, the tree and the aperture for details.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
/* ---------------- canvas ---------------- */
var FW = 1200, FH = 415;
var fig = SVG().addTo(document.getElementById('container')).size('100%', '100%');
fig.viewbox(0, 0, FW, FH);

var gScene = fig.group(), gCam = fig.group(), gDyn = fig.group(),
    gPanel = fig.group(), gAnn = fig.group(), gLab = fig.group();

/* ---------------- geometry ---------------- */
var GROUND_Y = 404;
var CAM = { l: 73, r: 227, t: 163, b: 375 };
var PIN_Y = 270;
var DOT_U = { x: 88, y: 196 }, DOT_D = { x: 88, y: 300 };
var FREE_B = { x: 566, y: 109 };
var TREE = { cx: 892, cy: 132, rx: 196, ry: 102 };
var GREEN = '#2bc41f', BROWN = '#8f5f3b', RED = '#ff0000';

var RAD = {
  sky:     { L: 1.00, c: '#7fb2d9' },
  tree:    { L: 0.60, c: GREEN },
  trunk:   { L: 0.45, c: BROWN },
  ground:  { L: 0.25, c: '#555555' },
  camera:  { L: 0.08, c: '#333333' },
  blocked: { L: 0.00, c: '#cccccc' }
};

var state = { mode: 'free', aperture: 0.08, sample: { x: 460, y: 293 },
              camDot: 'upper', crossing: false, step: 0 };

/* ---------------- helpers ---------------- */
function canopyF(a) {
  return 1 + 0.055 * Math.sin(3 * a + 0.7) + 0.035 * Math.cos(5 * a + 1.9) + 0.028 * Math.sin(7 * a + 0.3);
}
function inCanopy(x, y) {
  var dx = x - TREE.cx, dy = y - TREE.cy, f = canopyF(Math.atan2(dy, dx));
  var u = dx / (TREE.rx * f), v = dy / (TREE.ry * f);
  return (u * u + v * v) <= 1;
}
function inTrunk(x, y) { return x > 838 && x < 956 && y > 130 && y < GROUND_Y; }
function inCamBox(x, y) { return x >= CAM.l - 2 && x <= CAM.r + 2 && y >= CAM.t - 2 && y <= CAM.b + 2; }

function mk(type, dist) { return { type: type, dist: dist, L: RAD[type].L, c: RAD[type].c }; }

function traceScene(px, py, a) {
  var dx = Math.cos(a), dy = -Math.sin(a);
  for (var t = 2; t < 1700; t += 4) {
    var x = px + dx * t, y = py + dy * t;
    if (y >= GROUND_Y) return mk('ground', t);
    if (x < -30 || x > FW + 30 || y < -30) return mk('sky', t);
    if (inCanopy(x, y)) return mk('tree', t);
    if (inTrunk(x, y)) return mk('trunk', t);
    if (inCamBox(x, y)) return mk('camera', t);
  }
  return mk('sky', 1700);
}
function gapPx() { return 4 + state.aperture * 56; }
function traceCam(dot, a) {
  var dx = Math.cos(a), dy = -Math.sin(a);
  if (dx <= 1e-6) return mk('blocked', 10);
  var t = (CAM.r - dot.x) / dx, yAt = dot.y + dy * t, g = gapPx();
  if (yAt < PIN_Y - g / 2 || yAt > PIN_Y + g / 2) return mk('blocked', t);
  return traceScene(CAM.r + 3, yAt, a);
}
function camDotObj() { return state.camDot === 'upper' ? DOT_U : DOT_D; }
function sampleRadiance(a) {
  return (state.mode === 'camera') ? traceCam(camDotObj(), a)
                                   : traceScene(state.sample.x, state.sample.y, a);
}

function arrow(g, x1, y1, x2, y2, color, w, head) {
  var dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  var ux = dx / L, uy = dy / L;
  head = head || 9;
  var bx = x2 - ux * head, by = y2 - uy * head;
  g.line(x1, y1, bx, by).stroke({ color: color, width: w, linecap: 'butt' });
  var px = -uy, py = ux, hw = head * 0.36;
  g.polygon([[x2, y2], [bx + px * hw, by + py * hw], [bx - px * hw, by - py * hw]]).fill(color);
}
function halo(t) {
  t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3, 'stroke-linejoin': 'round' });
  return t;
}
function hoverable(el, tip, ttl, body) {
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); });
  el.on('mouseleave', hideTooltip);
  if (ttl) el.on('click', function (e) { e.stopPropagation(); showPopup(ttl, body); });
  return el;
}

/* ---------------- static scene ---------------- */
function closedSmoothPath(pts) {
  var n = pts.length, d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
  for (var i = 0; i < n; i++) {
    var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) +
         ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
  }
  return d + ' Z';
}
function buildScene() {
  gScene.rect(FW, FH).fill('#ffffff');

  /* trunk */
  var trunk = gScene.path(
    'M862,150 C858,220 848,300 842,350 C838,382 828,392 812,400 L856,400 ' +
    'C868,398 872,384 874,366 C877,344 888,340 896,356 C903,370 906,392 918,400 ' +
    'L958,400 C944,392 938,366 936,330 C932,270 944,190 950,150 Z'
  ).fill(BROWN).stroke('none');

  /* canopy */
  var pts = [], i;
  for (i = 0; i < 26; i++) {
    var a = i / 26 * 2 * Math.PI, f = canopyF(a);
    pts.push([TREE.cx + TREE.rx * f * Math.cos(a), TREE.cy + TREE.ry * f * Math.sin(a)]);
  }
  var canopy = gScene.path(closedSmoothPath(pts)).fill(GREEN).stroke({ color: '#000', width: 3 });

  hoverable(canopy, 'Tree canopy — a bright radiance source; rays leaving it carry green light.',
    'Radiance source', 'Every patch of the canopy emits (reflects) light in all directions. Those rays are part of the plenoptic function L(x, y, θ) at every point of space they pass through.');
  hoverable(trunk, 'Tree trunk — darker brown radiance.', null, null);

  /* bird */
  var bird = gScene.path(
    'M1129,72 C1131,56 1136,44 1145,36 C1138,31 1135,23 1137,15 C1142,22 1149,25 1157,24 ' +
    'C1164,23 1170,19 1173,13 C1174,22 1169,31 1161,35 C1168,39 1172,46 1172,54 ' +
    'C1166,46 1158,42 1149,43 C1142,44 1135,55 1133,72 Z'
  ).fill('none').stroke({ color: '#000', width: 2.2, linejoin: 'round' });
  hoverable(bird, 'A bird — also a source of rays filling the surrounding space.', null, null);

  /* ground */
  gScene.line(0, GROUND_Y, FW, GROUND_Y).stroke({ color: '#000', width: 6 });

  /* labels */
  halo(gLab.text('Pinhole camera').font({ family: 'sans-serif', size: 21, anchor: 'middle', fill: '#000' })
    .center(152, 142));
  halo(gLab.text('red dot = sampling location   ·   arrow = incoming ray   ·   dark green = light coming from the canopy')
    .font({ family: 'sans-serif', size: 9.5, anchor: 'start', fill: '#666' }).move(8, 380));
}

/* ---------------- camera ---------------- */
function drawCamera() {
  gCam.clear();
  var g = gapPx(), gt = PIN_Y - g / 2, gb = PIN_Y + g / 2;
  var st = { color: '#000', width: 3, linecap: 'square' };

  var inner = gCam.rect(CAM.r - CAM.l, CAM.b - CAM.t).move(CAM.l, CAM.t).fill('#ffffff').opacity(0.01);
  hoverable(inner, 'Inside the camera: walls block almost every direction.',
    'Pinhole camera', 'The box is opaque except for one tiny hole. A point on the image plane therefore receives light from essentially one direction only — the camera does not create the image, it masks the plenoptic function down to a sparse sample.');

  gCam.line(CAM.l, CAM.t, CAM.l, CAM.b).stroke(st);
  gCam.line(CAM.l, CAM.t, CAM.r, CAM.t).stroke(st);
  gCam.line(CAM.l, CAM.b, CAM.r, CAM.b).stroke(st);
  gCam.line(CAM.r, CAM.t, CAM.r, gt).stroke(st);
  gCam.line(CAM.r, gb, CAM.r, CAM.b).stroke(st);

  var ap = gCam.rect(16, Math.max(g, 10)).center(CAM.r, PIN_Y).fill('#ffffff').opacity(0.01);
  hoverable(ap, 'Pinhole aperture — width ' + state.aperture.toFixed(2),
    'The aperture', 'The aperture selects which directions survive. Narrow → one ray per image point (sharp). Wide → a cone of directions lands on the same point (blurred).');
}

/* ---------------- dynamic layer ---------------- */
function starburst(grpParent, p, selected) {
  var g = grpParent.group();
  for (var i = 0; i < 20; i++) {
    var a = i / 20 * 2 * Math.PI + 0.16;
    var h = traceScene(p.x, p.y, a);
    var Rout = Math.max(32, Math.min(106, h.dist - 4));
    var dx = Math.cos(a), dy = -Math.sin(a);
    var col = (h.type === 'tree') ? '#1c6b12' : ((h.type === 'trunk') ? '#4b3520' : '#000');
    arrow(g, p.x + dx * Rout, p.y + dy * Rout, p.x + dx * 14, p.y + dy * 14, col, 1.4, 9);
  }
  if (selected) g.circle(44).center(p.x, p.y).fill('none').stroke({ color: '#000', width: 1.4, dasharray: '4,3' });
  var d = g.circle(24).center(p.x, p.y).fill(RED);
  hoverable(d, 'Free-space sample point: radiance arrives from (almost) every direction.',
    'A point in free space', 'The plenoptic function L(x, y, θ) is defined here even though nothing physical sits at this spot. Light from the sky, the canopy and the ground all stream through, in all directions at once.');
  return g;
}

function drawCamRays(g) {
  var gp = gapPx(), gt = PIN_Y - gp / 2;
  var n = Math.max(1, Math.round(gp / 8)); if (n % 2 === 0) n++;
  var pairs = [
    { dot: DOT_U, col: state.crossing ? '#0b57d0' : '#000' },
    { dot: DOT_D, col: state.crossing ? '#e08200' : '#000' }
  ];
  pairs.forEach(function (p) {
    for (var i = 0; i < n; i++) {
      var frac = (n === 1) ? 0.5 : i / (n - 1);
      var gy = gt + frac * gp;
      var vx = CAM.r - p.dot.x, vy = gy - p.dot.y, L = Math.hypot(vx, vy);
      var ux = vx / L, uy = vy / L, len = 205;
      arrow(g, p.dot.x + ux * len, p.dot.y + uy * len, p.dot.x + ux * 11, p.dot.y + uy * 11,
            p.col, state.crossing ? 2.2 : 1.7, 11);
    }
  });
}

function distToWall(dot, dx, dy) {
  var ts = [];
  if (dx > 1e-6) ts.push((CAM.r - dot.x) / dx);
  if (dx < -1e-6) ts.push((CAM.l - dot.x) / dx);
  if (dy > 1e-6) ts.push((CAM.b - dot.y) / dy);
  if (dy < -1e-6) ts.push((CAM.t - dot.y) / dy);
  ts = ts.filter(function (t) { return t > 0; });
  return ts.length ? Math.min.apply(null, ts) : 0;
}
function drawStubs(g, dot) {
  for (var k = 0; k < 30; k++) {
    var a = k / 30 * 2 * Math.PI;
    var h = traceCam(dot, a);
    if (h.L > 0.02) continue;
    var dx = Math.cos(a), dy = -Math.sin(a);
    var r0 = 14, r1 = Math.min(27, distToWall(dot, dx, dy) - 1);
    if (r1 < r0 + 3) continue;
    g.line(dot.x + dx * r0, dot.y + dy * r0, dot.x + dx * r1, dot.y + dy * r1)
      .stroke({ color: '#c9c9c9', width: 1.3 });
  }
}

function drawDynamic() {
  gDyn.clear();
  var camMode = (state.mode === 'camera');

  var gFree = gDyn.group().opacity(camMode ? 0.22 : 1);
  starburst(gFree, FREE_B, false);
  starburst(gFree, state.sample, !camMode);

  if (camMode) {
    var blurR = 6 + Math.max(0, gapPx() - 8) * 0.55;
    [DOT_U, DOT_D].forEach(function (d) {
      gDyn.circle(blurR * 2).center(d.x, d.y).fill(RED).opacity(0.22);
      drawStubs(gDyn, d);
    });
  }
  drawCamRays(gDyn);

  [{ d: DOT_U, key: 'upper' }, { d: DOT_D, key: 'lower' }].forEach(function (o) {
    if (camMode && state.camDot === o.key) {
      gDyn.circle(46).center(o.d.x, o.d.y).fill('none')
        .stroke({ color: '#000', width: 1.4, dasharray: '4,3' });
    }
    var c = gDyn.circle(24).center(o.d.x, o.d.y).fill(RED);
    if (state.crossing) {
      c.stroke({ color: o.key === 'upper' ? '#0b57d0' : '#e08200', width: 3 });
    }
    hoverable(c, 'Image-plane point (' + o.key + '): only directions through the pinhole carry light.',
      'A point on the image plane', 'This is a "pixel". Almost every direction is dark because the walls block it; only the narrow cone through the aperture carries radiance. The camera image is a sparse slice of the plenoptic function.');
  });
}

/* ---------------- polar panel ---------------- */
function drawPanel() {
  gPanel.clear();
  gPanel.rect(166, 198).move(230, 4).radius(7).fill('#ffffff').opacity(0.93)
    .stroke({ color: '#e4e4e4', width: 1 });

  var cx = 313, cy = 100, baseR = 10, R = 54, N = 132, on = 0;
  gPanel.circle((baseR + R) * 2).center(cx, cy).fill('none')
    .stroke({ color: '#cccccc', width: 1, dasharray: '3,3' });

  for (var k = 0; k < N; k++) {
    var a = k / N * 2 * Math.PI;
    var h = sampleRadiance(a);
    var dx = Math.cos(a), dy = -Math.sin(a);
    if (h.L > 0.02) {
      on++;
      gPanel.line(cx + dx * baseR, cy + dy * baseR, cx + dx * (baseR + h.L * R), cy + dy * (baseR + h.L * R))
        .stroke({ color: h.c, width: 2.4 });
    } else {
      gPanel.line(cx + dx * baseR, cy + dy * baseR, cx + dx * (baseR + 3.5), cy + dy * (baseR + 3.5))
        .stroke({ color: '#e0e0e0', width: 2.2 });
    }
  }
  gPanel.circle(8).center(cx, cy).fill(RED);

  gPanel.text('L(θ)  radiance vs. direction')
    .font({ family: 'sans-serif', size: 10.5, anchor: 'middle', fill: '#333' }).center(cx, 18);

  var p = (state.mode === 'camera') ? camDotObj() : state.sample;
  var sx = (p.x / FW * 10).toFixed(1), sy = ((GROUND_Y - p.y) / FW * 10).toFixed(1);
  var where = (state.mode === 'camera') ? ('image plane · ' + state.camDot + ' point') : 'free space';
  gPanel.text('(x, y) = (' + sx + ', ' + sy + ')  ·  ' + where)
    .font({ family: 'sans-serif', size: 9.5, anchor: 'start', fill: '#555' }).move(238, 168);
  var pct = Math.round(on / N * 100);
  gPanel.text('directions carrying light: ' + pct + '%')
    .font({ family: 'sans-serif', size: 9.5, anchor: 'start', fill: pct > 50 ? '#1c6b12' : '#b00000' })
    .move(238, 181);

  var hit = gPanel.rect(166, 198).move(230, 4).fill('#fff').opacity(0.001);
  hoverable(hit, 'Distance from the centre = radiance arriving from that direction.',
    'The angular distribution', 'This rose plot is L(θ) at the selected point. In free space it is full and bumpy (light from everywhere); on the image plane it collapses to a single narrow spike through the pinhole. A NeRF learns exactly this function over all of space.');
}

/* ---------------- step-5 annotation ---------------- */
function drawAnn() {
  gAnn.clear();
  if (!state.crossing) return;
  var rows = [
    { c: '#0b57d0', t: 'upper dot  ←  ray from below' },
    { c: '#e08200', t: 'lower dot  ←  ray from above' }
  ];
  rows.forEach(function (r, i) {
    var y = 212 + i * 14;
    gAnn.line(238, y, 258, y).stroke({ color: r.c, width: 2.6 });
    halo(gAnn.text(r.t).font({ family: 'sans-serif', size: 9, anchor: 'start', fill: '#333' }).move(263, y - 6));
  });
}

/* ---------------- redraw ---------------- */
function redrawAll() { drawCamera(); drawDynamic(); drawPanel(); drawAnn(); }

/* ---------------- interactions ---------------- */
function toggle_locationMode(on) { state.mode = on ? 'camera' : 'free'; redrawAll(); }
function update_apertureSize(v) { state.aperture = v; redrawAll(); }
function trigger_swapDot() {
  state.camDot = (state.camDot === 'upper') ? 'lower' : 'upper';
  if (state.mode !== 'camera') {
    state.mode = 'camera';
    document.getElementById('locationModeInput').checked = true;
  }
  redrawAll();
}

function toVB(e) {
  var pt = fig.node.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  var m = fig.node.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  var p = pt.matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
fig.on('click', function (e) {
  var p = toVB(e);
  if (state.mode === 'camera') {
    state.camDot = (Math.abs(p.y - DOT_U.y) < Math.abs(p.y - DOT_D.y)) ? 'upper' : 'lower';
    redrawAll();
    return;
  }
  if (p.x < 25 || p.x > FW - 25 || p.y < 25 || p.y > GROUND_Y - 20) return;
  if (inCanopy(p.x, p.y) || inTrunk(p.x, p.y) || inCamBox(p.x, p.y)) return;
  state.sample = { x: p.x, y: p.y };
  redrawAll();
});

/* ---------------- demo steps ---------------- */
var STEPS = [
  { t: 'Light everywhere, in every direction',
    n: 'A red dot marks a sample point floating in open air between the camera and the tree. Arrows stream into it from every direction — green-tinted from the canopy, bright from the sky — because radiance arrives there from the whole surrounding scene.',
    s: { mode: 'free', ap: 0.08, sample: { x: 460, y: 293 }, camDot: 'upper', crossing: false } },
  { t: 'Move the point: the field is continuous',
    n: 'Click anywhere in the sky or near the tree to relocate the sample point. The polar plot of L(θ) changes smoothly as you move, showing the plenoptic function is defined at every location, not just at cameras or surfaces.',
    s: { mode: 'free', ap: 0.08, sample: { x: 676, y: 200 }, camDot: 'upper', crossing: false } },

    n: 'Now the sample point sits on the camera\'s image plane. Nearly all directions are dead (grey stubs) — the camera walls block them — and a single arrow squeezes through the pinhole. The dense star has collapsed to one spike.',
    s: { mode: 'camera', ap: 0.08, sample: { x: 460, y: 293 }, camDot: 'upper', crossing: false } },
  { t: 'Open the aperture and blur the image',
    n: 'Widening the pinhole admits a cone of directions at each image point, so several rays now overlap on one spot and the picture blurs. A camera image is just a 2D slice of the plenoptic function, selected by the aperture.',
    s: { mode: 'camera', ap: 0.60, sample: { x: 460, y: 293 }, camDot: 'upper', crossing: false } },
  { t: 'Two points, an upside-down image',
    n: 'Compare the upper and lower image-plane points: the one high on the wall receives light from low in the scene and vice versa. The crossing rays through the pinhole are why the recorded image is inverted.',

];

function applyStep(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  state.step = i;
  var s = STEPS[i].s;
  state.mode = s.mode;
  state.aperture = s.ap;
  state.sample = { x: s.sample.x, y: s.sample.y };
  state.camDot = s.camDot;
  state.crossing = s.crossing;

  document.getElementById('locationModeInput').checked = (s.mode === 'camera');
  document.getElementById('apertureSizeInput').value = s.ap;
  document.getElementById('apertureSizeVal').value = s.ap.toFixed(2);
  document.getElementById('stepTitle').textContent = STEPS[i].t;
  document.getElementById('demoNarration').textContent = STEPS[i].n;
  document.getElementById('stepLabel').textContent = (i + 1) + ' / ' + STEPS.length;
  redrawAll();
}
function nextStep() { applyStep(state.step + 1); }
function prevStep() { applyStep(state.step - 1); }

/* ---------------- boot ---------------- */
buildScene();
applyStep(0);
window.__markRendered();
