<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="display:block;font-weight:bold;font-size:12px">Enzyme binding models</span>
<label><input id="modelToggleInput" type="checkbox" onchange="toggle_modelToggle(this.checked)"> Binding model: <span id="modelName">Lock-and-key (a)</span></label>
<label>Substrate docking progress: <output id="bindingProgressVal">0</output><input id="bindingProgressInput" type="range" min="0" max="1" step="0.01" value="0" oninput="document.getElementById('bindingProgressVal').value=this.value;update_bindingProgress(+this.value)"></label>
<label><input id="shapeGhostInput" type="checkbox" onchange="toggle_shapeGhost(this.checked)"> Show unbound active-site outline</label>
<button id="playBtn" onclick="trigger_playBinding()">▶ Play substrate binding</button>
<span style="display:block;border-top:1px solid #dcdfe3;margin-top:5px;padding-top:5px;font-weight:bold" id="stepTitle">Guided demo</span>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.45;color:#333">Press ▶ below to walk through the six guided steps.</span>
<span style="display:flex;gap:8px;align-items:center"><button onclick="prevStep()">◀</button><span id="stepLabel">Step 1 / 6</span><button onclick="nextStep()">▶</button></span>
<button onclick="showPopup('Key insight','Both models end with the same tightly matched enzyme–substrate complex. Lock-and-key assumes the complementary shape already exists before binding; induced fit says the arriving substrate itself sculpts the active site into that complementary shape.')">Key insight</button>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
(function () {
  var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
  var VW = 960, VH = 440;
  draw.viewbox(0, 0, VW, VH);

  var C = {
    enzFill: '#e8f1c9', enzStroke: '#8db43e',
    subFill: '#cabce3', subStroke: '#231f20',
    knob: '#e7b797', text: '#231f20', ghost: '#8c8c8c',
    hl: '#eaf3fd'
  };
  var S = 252, BY = 348;

  var bg = draw.group();
  var dyn = draw.group();

  var hlA = bg.rect(470, 424).move(14, 8).radius(14).fill(C.hl).opacity(0);
  var hlB = bg.rect(456, 424).move(496, 8).radius(14).fill(C.hl).opacity(0);

  var diagrams = [
    { cx: 148, mode: 'lock', dock: true },
    { cx: 368, mode: 'lock', dock: false },
    { cx: 628, mode: 'fit', dock: true },
    { cx: 848, mode: 'fit', dock: false }
  ];

  var state = { model: 'Lock-and-key', progress: 0, ghost: false };

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function ease(t) { t = clamp(t); return t * t * (3 - 2 * t); }
  function r1(v) { return Math.round(v * 10) / 10; }

  /* ---------- geometry ---------- */
  function cleftParams(m) {
    return {
      CW: lerp(44, 31, m),
      rw: lerp(9, 5, m),
      pd: lerp(14, 27, m),
      rt: lerp(8, 3, m),
      pd2: lerp(12, 23, m)
    };
  }

  function cleftSeg(cx, p) {
    var CW = p.CW, rw = p.rw, pd = p.pd, rt = p.rt, pd2 = p.pd2, s = '';
    s += ' L ' + r1(cx - CW) + ' ' + r1(S + pd - 7);
    s += ' Q ' + r1(cx - CW) + ' ' + r1(S + pd) + ' ' + r1(cx - CW + 7) + ' ' + r1(S + pd);
    s += ' L ' + r1(cx - rw - 4) + ' ' + r1(S + pd);
    s += ' Q ' + r1(cx - rw) + ' ' + r1(S + pd) + ' ' + r1(cx - rw) + ' ' + r1(S + pd - 7);
    s += ' L ' + r1(cx - rw) + ' ' + r1(S + rt);
    s += ' Q ' + r1(cx) + ' ' + r1(S + rt - 4) + ' ' + r1(cx + rw) + ' ' + r1(S + rt);
    s += ' L ' + r1(cx + rw + 4) + ' ' + r1(S + pd2 - 5);
    s += ' Q ' + r1(cx + rw + 10) + ' ' + r1(S + pd2) + ' ' + r1(cx + rw + 17) + ' ' + r1(S + pd2 - 9);
    s += ' L ' + r1(cx + CW) + ' ' + r1(S);
    return s;
  }

  function enzymePath(cx, p) {
    var CW = p.CW, q = (72 + CW) / 2;
    var d = 'M ' + (cx - 100) + ' ' + (BY - 16) +
      ' C ' + (cx - 100) + ' ' + (S + 40) + ' ' + (cx - 94) + ' ' + (S + 14) + ' ' + (cx - 72) + ' ' + (S + 7) +
      ' Q ' + r1(cx - q) + ' ' + (S + 1) + ' ' + r1(cx - CW) + ' ' + S +
      cleftSeg(cx, p) +
      ' Q ' + r1(cx + q) + ' ' + (S + 1) + ' ' + (cx + 72) + ' ' + (S + 7) +
      ' C ' + (cx + 94) + ' ' + (S + 14) + ' ' + (cx + 100) + ' ' + (S + 40) + ' ' + (cx + 100) + ' ' + (BY - 16) +
      ' Q ' + (cx + 100) + ' ' + BY + ' ' + (cx + 88) + ' ' + BY +
      ' L ' + (cx - 88) + ' ' + BY +
      ' Q ' + (cx - 100) + ' ' + BY + ' ' + (cx - 100) + ' ' + (BY - 16) + ' Z';
    return d;
  }

  function ghostPath(cx, p) {
    return 'M ' + r1(cx - p.CW - 16) + ' ' + (S - 1) + ' L ' + r1(cx - p.CW) + ' ' + S +
      cleftSeg(cx, p) + ' L ' + r1(cx + p.CW + 16) + ' ' + (S - 1);
  }

  var LEFT_BODY = 'M 17 -30 L 9 -30 L 9 -16 L -9 -16 L -9 -30 L -33 -30 Q -45 -30 -45 -42 L -45 -78 Q -45 -90 -33 -90 L 17 -90 Z';
  var LEFT_KNOB = 'M -9 -17 L 9 -17 L 9 -6 Q 9 0 3 0 L -3 0 Q -9 0 -9 -6 Z';
  var RIGHT_BODY = 'M -14 -34 L -14 -74 C -14 -98 6 -106 22 -94 C 36 -84 36 -58 22 -44 C 18 -40 14 -36 10 -34 L 10 -17 L -8 -17 L -8 -34 Z';
  var RIGHT_KNOB = 'M -8 -18 L 8 -18 L 5 -5 Q 3 0 0 0 Q -3 0 -5 -5 Z';

  function substrate(g, bodyD, knobD, x, y, tip) {
    var grp = g.group().transform({ translate: [x, y] });
    grp.path(bodyD).fill(C.subFill).stroke({ color: C.subStroke, width: 2.2, linejoin: 'round' });
    grp.path(knobD).fill(C.knob).stroke({ color: C.subStroke, width: 1.6, linejoin: 'round' });
    grp.css('cursor', 'pointer')
      .on('mousemove', function (ev) { showTooltip(tip, ev); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Substrate',
          'Substrates are the reactant molecules an enzyme acts on. The small tan knob is the binding face that must match the contour of the active site; specificity comes from this complementary fit.');
      });
    return grp;
  }

  function txt(g, s, x, y, size, halo, weight) {
    var t = g.plain(s)
      .font({ family: 'sans-serif', size: size, anchor: 'middle', weight: weight || 'normal' })
      .fill(C.text).attr({ x: x, y: y });
    if (halo) t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 3.5, 'stroke-linejoin': 'round' });
    return t;
  }

  function arrowHead(g, x, y, ang, op) {
    var L = 13, Wd = 6.5;
    var pts = [
      [x, y],
      [x - L * Math.cos(ang) + Wd * Math.sin(ang), y - L * Math.sin(ang) - Wd * Math.cos(ang)],
      [x - L * Math.cos(ang) - Wd * Math.sin(ang), y - L * Math.sin(ang) + Wd * Math.cos(ang)]
    ];
    g.polygon(pts.map(function (p) { return r1(p[0]) + ',' + r1(p[1]); }).join(' ')).fill(C.text).opacity(op);
  }

  /* ---------- one diagram ---------- */
  function drawDiagram(d) {
    var g = dyn.group();
    var cx = d.cx;
    var t = d.dock ? state.progress : 1;
    var e = ease(t);
    var m = (d.mode === 'fit') ? e : 1;
    var p = cleftParams(m);

    var enz = g.path(enzymePath(cx, p))
      .fill(C.enzFill).stroke({ color: C.enzStroke, width: 5, linejoin: 'round' });
    enz.css('cursor', 'pointer')
      .on('mousemove', function (ev) {
        showTooltip(d.mode === 'fit'
          ? 'Enzyme (induced fit): the cleft reshapes as the substrate arrives'
          : 'Enzyme (lock-and-key): the cleft keeps one rigid shape', ev);
      })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Enzyme and active site',
          'The enzyme is a large protein; the notched cleft on its upper surface is the active site where catalysis happens. In the lock-and-key model this cleft is rigid and pre-shaped; in the induced-fit model it is flexible and molds around the substrate.');
      });

    // ghost of the unbound active-site contour
    if (state.ghost) {
      var p0 = cleftParams(d.mode === 'fit' ? 0 : 1);
      var gh = g.path(ghostPath(cx, p0)).fill('none')
        .stroke({ color: C.ghost, width: 2.2, dasharray: '6,4', linejoin: 'round' });
      gh.css('cursor', 'pointer')
        .on('mousemove', function (ev) {
          showTooltip(d.mode === 'fit'
            ? 'Unbound active-site outline — clearly wider than the bound shape'
            : 'Unbound active-site outline — identical to the bound shape', ev);
        })
        .on('mouseleave', hideTooltip)
        .on('click', function () {
          showPopup('Conformational change',
            'The grey dashed line is the shape of the active site before any substrate arrives. In lock-and-key it lies exactly on the bound contour (no change). In induced fit it sits outside the bound contour, measuring how far the enzyme bent to wrap the substrate.');
        });
    }

    // substrates
    var lx = lerp(cx - 100, cx - 17, e), ly = lerp(S - 84, S + 24, e);
    var rx = lerp(cx + 18, cx + 14, e), ry = lerp(S - 76, S + 16, e);
    substrate(g, LEFT_BODY, LEFT_KNOB, lx, ly, 'Substrate 1 — square-lobed, with a tan binding knob');
    substrate(g, RIGHT_BODY, RIGHT_KNOB, rx, ry, 'Substrate 2 — round-lobed, with a tapered binding knob');

    // contact marks of the formed complex
    var cop = clamp((e - 0.8) / 0.2);
    if (cop > 0.01) {
      var mid = (lx + 17 + rx - 14) / 2;
      var cg = g.group().opacity(cop);
      cg.line(mid, ly - 90, mid, ry - 18).stroke({ color: '#000', width: 3.6, linecap: 'round' });
      cg.path('M ' + r1(lx - 9) + ' ' + r1(ly - 7) + ' Q ' + r1(lx - 9) + ' ' + r1(ly) + ' ' + r1(lx - 3) + ' ' + r1(ly) +
        ' L ' + r1(lx + 3) + ' ' + r1(ly) + ' Q ' + r1(lx + 9) + ' ' + r1(ly) + ' ' + r1(lx + 9) + ' ' + r1(ly - 7))
        .fill('none').stroke({ color: '#000', width: 4, linecap: 'round', linejoin: 'round' });
      cg.path('M ' + r1(rx - 6) + ' ' + r1(ry - 9) + ' Q ' + r1(rx - 3) + ' ' + r1(ry) + ' ' + r1(rx) + ' ' + r1(ry) +
        ' Q ' + r1(rx + 3) + ' ' + r1(ry) + ' ' + r1(rx + 6) + ' ' + r1(ry - 9))
        .fill('none').stroke({ color: '#000', width: 4, linecap: 'round', linejoin: 'round' });
      cg.css('cursor', 'pointer')
        .on('mousemove', function (ev) { showTooltip('Contact surfaces of the enzyme–substrate complex', ev); })
        .on('mouseleave', hideTooltip)
        .on('click', function () {
          showPopup('Enzyme–substrate complex',
            'The bold black lines mark the tight contacts: substrate against substrate in the middle, and each substrate knob against the active-site surface. Both models end here — an identical, snugly matched complex.');
        });
    }

    // active-site hover target
    g.rect(2 * p.CW + 16, 40).move(cx - p.CW - 8, S - 8).fill({ color: '#fff', opacity: 0 })
      .css('cursor', 'pointer')
      .on('mousemove', function (ev) { showTooltip('Active site — the notched cleft with a central ridge', ev); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Active site',
          'The active site is a small pocket made of a few amino-acid side chains. Its shape and chemistry determine which substrates can bind — this is the structural basis of enzyme specificity.');
      });

    // annotations
    if (d.dock) {
      var aOp = clamp(1 - e / 0.5);
      if (aOp > 0.01) {
        var ag = g.group().opacity(aOp);
        // "Substrates" label + leader lines
        ag.line(cx - 76, 33, lx - 22, ly - 88).stroke({ color: C.text, width: 1.2 });
        ag.line(cx - 40, 33, rx + 4, ry - 100).stroke({ color: C.text, width: 1.2 });
        txt(ag, 'Substrates', cx - 58, 28, 17, true);
        // annotation text
        var lines = (d.mode === 'fit')
          ? ['Active', 'site', 'changes', 'to fit']
          : ['Active', 'site is', 'proper', 'shape'];
        for (var i = 0; i < lines.length; i++) txt(ag, lines[i], cx - 40, 100 + i * 19, 14.5, true);
        // curved arrows into the cleft
        ag.path('M ' + (cx - 70) + ' ' + (S - 74) + ' C ' + (cx - 64) + ' ' + (S - 42) + ' ' +
          (cx - 48) + ' ' + (S - 28) + ' ' + (cx - 27) + ' ' + (S - 12))
          .fill('none').stroke({ color: C.text, width: 2.4, linecap: 'round' });
        arrowHead(ag, cx - 27, S - 12, Math.atan2(16, 21), 1);
        ag.path('M ' + (cx + 42) + ' ' + (S - 74) + ' C ' + (cx + 40) + ' ' + (S - 44) + ' ' +
          (cx + 28) + ' ' + (S - 28) + ' ' + (cx + 15) + ' ' + (S - 12))
          .fill('none').stroke({ color: C.text, width: 2.4, linecap: 'round' });
        arrowHead(ag, cx + 15, S - 12, Math.atan2(16, -13), 1);
      }
    }

    var capOp = d.dock ? clamp((e - 0.72) / 0.28) : 1;
    if (capOp > 0.01) {
      var cg2 = g.group().opacity(capOp);
      txt(cg2, 'Substrate', cx, 92, 17, true);
      txt(cg2, 'complex', cx, 112, 17, true);
      txt(cg2, 'formed', cx, 132, 17, true);
    }

    txt(g, 'Enzyme', cx, 378, 18, false);
  }

  /* ---------- render ---------- */
  function renderAll() {
    dyn.clear();
    diagrams.forEach(drawDiagram);
    hlA.opacity(state.model === 'Lock-and-key' ? 0.85 : 0);
    hlB.opacity(state.model === 'Induced fit' ? 0.85 : 0);

    var capA = txt(dyn, '(a) Lock-and-key model', 258, 419, 18, false,
      state.model === 'Lock-and-key' ? 'bold' : 'normal');
    var capB = txt(dyn, '(b) Induced fit model', 738, 419, 18, false,
      state.model === 'Induced fit' ? 'bold' : 'normal');
    capA.css('cursor', 'pointer')
      .on('mousemove', function (ev) { showTooltip('Lock-and-key: rigid, pre-shaped active site', ev); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Lock-and-key model',
          'Emil Fischer (1894) proposed that the active site is already exactly complementary to the substrate, like a lock waiting for its key. The enzyme does not change shape: the cleft looks identical before and after binding.');
      });
    capB.css('cursor', 'pointer')
      .on('mousemove', function (ev) { showTooltip('Induced fit: flexible site that molds to the substrate', ev); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Induced fit model',
          'Daniel Koshland (1958) showed that the active site is flexible. The approaching substrate induces a conformational change, so the complementary shape is created during binding — which also strains the substrate and helps catalysis.');
      });
  }

  /* ---------- controls ---------- */
  window.toggle_modelToggle = function (on) {
    state.model = on ? 'Induced fit' : 'Lock-and-key';
    var n = document.getElementById('modelName');
    if (n) n.textContent = on ? 'Induced fit (b)' : 'Lock-and-key (a)';
    renderAll();
  };
  window.update_bindingProgress = function (v) {
    state.progress = v;
    renderAll();
  };
  window.toggle_shapeGhost = function (on) {
    state.ghost = on;
    renderAll();
  };

  function setProgress(v) {
    var inp = document.getElementById('bindingProgressInput');
    var out = document.getElementById('bindingProgressVal');
    if (inp) inp.value = v;
    if (out) out.value = Math.round(v * 100) / 100;
    state.progress = v;
    renderAll();
  }

  var playing = false, rafId = null, animT = 0, lastTs = 0;
  window.trigger_playBinding = function () {
    playing = !playing;
    var b = document.getElementById('playBtn');
    if (b) b.textContent = playing ? '⏸ Pause binding' : '▶ Play substrate binding';
    if (playing) { animT = 0; lastTs = performance.now(); rafId = requestAnimationFrame(tick); }
    else if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  };
  function tick(ts) {
    if (!playing) return;
    var dt = (ts - lastTs) / 1000; lastTs = ts;
    animT += dt;
    var cycle = 3.6, ph = animT % cycle;
    setProgress(ph < 2.4 ? ph / 2.4 : 1);
    rafId = requestAnimationFrame(tick);
  }

  /* ---------- demo steps ---------- */
  var steps = [
    { title: 'The enzyme and its active site', narration: 'A large green enzyme carries a notched cleft on its surface — the active site. Two purple substrate molecules float above it, unbound.', state: { modelToggle: 'Lock-and-key', bindingProgress: 0, shapeGhost: false } },
    { title: 'Lock-and-key: a pre-shaped pocket', narration: 'Drag the substrates down. The cleft already matches their contours exactly, like a key entering a lock — the enzyme never alters its shape.', state: { modelToggle: 'Lock-and-key', bindingProgress: 0.5, shapeGhost: false } },
    { title: 'Lock-and-key complex formed', narration: 'The substrates seat snugly and the enzyme–substrate complex forms. The dashed outline of the original active site lies exactly on the bound one: zero conformational change.', state: { modelToggle: 'Lock-and-key', bindingProgress: 1, shapeGhost: true } },
    { title: 'Induced fit: an open, flexible site', narration: 'Switch models. Before binding, this active site is wider and less complementary — it is not yet the right shape.', state: { modelToggle: 'Induced fit', bindingProgress: 0, shapeGhost: false } },
    { title: 'The site reshapes as the substrate approaches', narration: 'As the substrates descend, the enzyme\u2019s surface bends inward to wrap around them. Specificity is created during binding, not before it.', state: { modelToggle: 'Induced fit', bindingProgress: 0.5, shapeGhost: true } },
    { title: 'Induced-fit complex formed', narration: 'The complex is formed with a tight, molded contact surface. The dashed original outline now clearly differs from the bound shape — the substrate induced the fit.', state: { modelToggle: 'Induced fit', bindingProgress: 1, shapeGhost: true } }
  ];
  var stepIdx = 0;

  function applyStep(i) {
    stepIdx = (i + steps.length) % steps.length;
    var st = steps[stepIdx].state;
    if (playing) window.trigger_playBinding();

    var mOn = (st.modelToggle === 'Induced fit');
    var mi = document.getElementById('modelToggleInput');
    if (mi) mi.checked = mOn;
    state.model = st.modelToggle;
    var n = document.getElementById('modelName');
    if (n) n.textContent = mOn ? 'Induced fit (b)' : 'Lock-and-key (a)';

    var gi = document.getElementById('shapeGhostInput');
    if (gi) gi.checked = !!st.shapeGhost;
    state.ghost = !!st.shapeGhost;

    setProgress(st.bindingProgress);

    var tEl = document.getElementById('stepTitle');
    var nEl = document.getElementById('demoNarration');
    var lEl = document.getElementById('stepLabel');
    if (tEl) tEl.textContent = steps[stepIdx].title;
    if (nEl) nEl.textContent = steps[stepIdx].narration;
    if (lEl) lEl.textContent = 'Step ' + (stepIdx + 1) + ' / ' + steps.length;
  }
  window.nextStep = function () { applyStep(stepIdx + 1); };
  window.prevStep = function () { applyStep(stepIdx - 1); };

  renderAll();
  applyStep(0);
  window.__markRendered();
})();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
