<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700;font-size:13px;color:#12657f">Total internal reflection</span>
<span style="font-weight:600;font-size:11.5px;color:#555">Guided demo</span>
<span id="stepTitle" style="font-weight:700;font-size:12px;color:#12657f"></span>
<span id="demoNarration" style="display:block;font-size:11.5px;line-height:1.45;color:#222;min-height:92px"></span>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;color:#555"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Incident angle θ₁: <output id="incidentAngleVal">60</output>°
  <input id="incidentAngleInput" type="range" min="0" max="89" step="1" value="60"
    oninput="document.getElementById('incidentAngleVal').value=this.value;update_incidentAngle(+this.value)"></label>
<label>Index ratio n₂ / n₁: <output id="indexRatioVal">0.67</output>
  <input id="indexRatioInput" type="range" min="0.3" max="0.98" step="0.01" value="0.67"
    oninput="document.getElementById('indexRatioVal').value=this.value;update_indexRatio(+this.value)"></label>
<label><input id="viewModeInput" type="checkbox" checked onchange="toggle_viewMode(this.checked)"> Textbook triptych (a)(b)(c)</label>
<span id="uiReadout" style="font-size:11.5px;line-height:1.5;color:#222;border-top:1px solid #dcdfe3;padding-top:5px"></span>
<button onclick="trigger_keyInsight()">💡 Key insight</button>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

var TEAL = '#1a7f9c', TEAL_D = '#12657f', INK = '#1b1b1b';
var RAD = Math.PI / 180;

var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
draw.viewbox(0, 0, 980, 344).attr('preserveAspectRatio', 'xMidYMid meet');

var mediumGrad = draw.gradient('linear', function (add) {
  add.stop(0, '#a9c9dc');
  add.stop(0.55, '#e9f2f8');
  add.stop(1, '#cfe3ef');
});

var root = draw.group();
var state = { theta1: 60, ratio: 0.67, triptych: true };

/* ───────── drawing helpers ───────── */
function txt(g, str, x, y, o) {
  o = o || {};
  var gg = g.group();
  var t = gg.text(str).font({
    family: o.family || 'Helvetica, Arial, sans-serif',
    size: o.size || 16,
    style: o.italic ? 'italic' : 'normal',
    weight: o.weight || 'normal',
    leading: o.leading || 1.2
  }).fill(o.fill || INK);
  if (o.halo !== false) {
    t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': o.haloW || 4, 'stroke-linejoin': 'round' });
  }
  var b = gg.bbox();
  var ax = (o.anchor === 'middle') ? b.cx : (o.anchor === 'end' ? b.x2 : b.x);
  var ay = (o.baseline === 'middle') ? b.cy : (o.baseline === 'bottom' ? b.y2 : b.y);
  gg.translate(x - ax, y - ay);
  gg.__bw = b.width; gg.__bh = b.height;
  return gg;
}

/* θ with an italic 'c' subscript */
function thetaC(g, x, y, size) {
  var gg = g.group();
  var t1 = gg.text('θ').font({ family: 'Georgia, serif', size: size, style: 'italic' }).fill(INK);
  var b1 = t1.bbox();
  var t2 = gg.text('c').font({ family: 'Georgia, serif', size: size * 0.64, style: 'italic' }).fill(INK);
  t2.translate(b1.width * 0.95, size * 0.30);
  [t1, t2].forEach(function (t) {
    t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round' });
  });
  var b = gg.bbox();
  gg.translate(x - b.cx, y - b.cy);
  return gg;
}

function arrowHead(g, x, y, ux, uy, size, color, op) {
  var px = -uy, py = ux;
  return g.polygon([
    [x, y],
    [x - ux * size + px * size * 0.46, y - uy * size + py * size * 0.46],
    [x - ux * size - px * size * 0.46, y - uy * size - py * size * 0.46]
  ]).fill({ color: color, opacity: op == null ? 1 : op }).stroke('none');
}

/* arc from unit-dir u to unit-dir v around (cx,cy) */
function arcBetween(g, cx, cy, r, u, v, color, w, dashed) {
  var a0 = Math.atan2(u.y, u.x), a1 = Math.atan2(v.y, v.x);
  var d = a1 - a0;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  var pts = [];
  for (var i = 0; i <= 26; i++) {
    var a = a0 + d * i / 26;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  var p = g.polyline(pts).fill('none').stroke({ color: color, width: w, linecap: 'round' });
  if (dashed) p.attr('stroke-dasharray', '4,3');
  return p;
}

/* place a label inside an angular wedge, angles measured from the normal
   (0 = along the normal), sign: +right / -left, below=true → downward */
function wedgePos(cx, cy, a0, a1, fs, minR, maxR, room, downward) {
  var mid = (a0 + a1) / 2, half = Math.abs(a1 - a0) / 2;
  var need = fs * 0.66 + 6;
  var R = Math.max(minR, need / Math.max(0.07, Math.sin(half)));
  R = Math.min(R, maxR, (room - 8) / Math.max(0.2, Math.cos(mid)));
  return { x: cx + Math.sin(mid) * R, y: cy + (downward ? 1 : -1) * Math.cos(mid) * R };
}

function inter(el, tip, title, body) {
  el.css('cursor', 'pointer');
  el.on('mousemove', function (e) { showTooltip(tip, e); });
  el.on('mouseleave', function () { hideTooltip(); });
  if (title) el.on('click', function () { showPopup(title, body); });
  return el;
}

function hitLine(g, x1, y1, x2, y2, tip, title, body, wgt) {
  var h = g.line(x1, y1, x2, y2).stroke({ color: '#000', width: wgt || 16, opacity: 0.001 })
    .attr('pointer-events', 'stroke');
  return inter(h, tip, title, body);
}

/* short bent arrow from a label out to the thing it names */
function curvedLeader(g, x0, y0, x1, y1, bow, s) {
  var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  var dx = x1 - x0, dy = y1 - y0, L = Math.sqrt(dx * dx + dy * dy) || 1;
  var qx = mx + (-dy / L) * bow, qy = my + (dx / L) * bow;
  g.path('M' + x0 + ' ' + y0 + ' Q' + qx + ' ' + qy + ' ' + x1 + ' ' + y1)
    .fill('none').stroke({ color: '#1b1b1b', width: 1.9 * s, linecap: 'round' });
  var tx = x1 - qx, ty = y1 - qy, tl = Math.sqrt(tx * tx + ty * ty) || 1;
  arrowHead(g, x1, y1, tx / tl, ty / tl, 8.5 * s, '#1b1b1b');
}

function nameLabel(g, str, lx, ly, tx, ty, bow, s, fs) {
  var t = txt(g, str, lx, ly, { size: fs, anchor: 'middle', baseline: 'middle', haloW: 5 });
  var ux = tx - lx, uy = ty - ly, L = Math.sqrt(ux * ux + uy * uy) || 1;
  ux /= L; uy /= L;
  var ex = lx + ux * (t.__bw / 2 + 7), ey = ly + uy * (t.__bh / 2 + 6);
  if (Math.abs(tx - ex) + Math.abs(ty - ey) > 6) curvedLeader(g, ex, ey, tx, ty, bow, s);
  return t;
}

/* ───────── the ray-optics scene ───────── */
function drawScene(g, o) {
  var s = o.scale, ts = (o.tscale == null ? 1 : o.tscale);
  var cx = o.cx, cy = o.cy;
  var th1 = o.theta1 * RAD, ratio = o.ratio;
  var thc = Math.asin(Math.min(1, ratio));
  var sin2 = Math.sin(th1) / ratio;
  var hasRefr = sin2 <= 1.000001;
  var th2 = hasRefr ? Math.asin(Math.min(1, sin2)) : null;
  var graze = hasRefr && th2 >= 88 * RAD;

  var Rf = 1, Tf = 0;
  if (hasRefr) {
    var c1 = Math.cos(th1), c2 = Math.cos(th2);
    var rs = (c1 - ratio * c2) / (c1 + ratio * c2);
    var rp = (c2 - ratio * c1) / (c2 + ratio * c1);
    Rf = Math.min(1, (rs * rs + rp * rp) / 2); Tf = 1 - Rf;
  }

  var FT = 25 * ts, FN = 26 * ts, FR = 20 * ts;
  var gb = g.group(), gr = g.group(), gh = g.group(), gl = g.group();

  /* medium n1 */
  var rect = gb.rect(o.right - o.left, o.bottom - cy).move(o.left, cy)
    .fill(mediumGrad).stroke({ color: '#7fb3cc', width: 1.2 });
  inter(rect, 'n₁ — the denser medium; the light starts here',
    'The denser medium n₁',
    'Light travels inside the denser medium (larger index n₁) and strikes the boundary from below. Because n₂ < n₁ the refracted ray bends AWAY from the normal, so θ₂ is always larger than θ₁.');
  gb.line(o.left, cy, o.right, cy).stroke({ color: '#6fa9c4', width: 1.4 });

  /* normal */
  gb.line(cx, cy - o.normUp, cx, cy + o.normDown)
    .stroke({ color: '#222', width: Math.max(1, 1.5 * s) })
    .attr('stroke-dasharray', (9 * s) + ',' + (7 * s));
  hitLine(gh, cx, cy - o.normUp, cx, cy + o.normDown, 'Normal to the surface', 'The normal',
    'Every angle in Snell\'s law is measured from this dashed perpendicular — never from the surface itself.', 13 * s);

  var below = o.bottom - cy - 12 * s;
  var above = cy - o.topY;
  var Lb = Math.min(o.Lmax, below / Math.max(0.30, Math.cos(th1)),
    (cx - o.left - 16) / Math.max(0.10, Math.sin(th1)));
  var ui = { x: -Math.sin(th1), y: Math.cos(th1) };
  var ur = { x: Math.sin(th1), y: Math.cos(th1) };
  var aw = 11 * s;

  /* ── refracted ray ── */
  if (hasRefr) {
    var op = graze ? 0.9 : Math.max(0.22, Math.pow(Math.max(0, Tf), 0.5));
    if (graze) {
      var xe = Math.min(o.right - 16 * s, cx + o.Lmax * 1.15);
      var yf = cy - 2.5 * s;
      gr.line(cx, yf, xe, yf).stroke({ color: TEAL, width: 2.4 * s, linecap: 'round', opacity: op });
      arrowHead(gr, cx + (xe - cx) * 0.72, yf, 1, 0, aw, TEAL, op);
      hitLine(gh, cx, yf, xe, yf, 'Refracted ray grazing the surface — θ₂ = 90°',
        'Grazing exit', 'At θ₁ = θc Snell\'s law gives sin θ₂ = 1, so the refracted ray runs flat along the boundary. One degree more and there is no solution at all.', 14 * s);
      var sq = 15 * s;
      gr.polyline([[cx, cy - sq], [cx + sq, cy - sq], [cx + sq, cy]])
        .fill('none').stroke({ color: '#222', width: 1.4 * s });
      txt(gl, 'θ₂ = 90°', cx + sq + 10 * s, cy - sq - 8 * s,
        { size: FT, italic: true, family: 'Georgia, serif', baseline: 'bottom' });
    } else {
      var Lu = Math.min(o.Lmax, above / Math.max(0.25, Math.cos(th2)),
        (o.right - cx - 20) / Math.max(0.05, Math.sin(th2)));
      var uf = { x: Math.sin(th2), y: -Math.cos(th2) };
      var ex = cx + uf.x * Lu, ey = cy + uf.y * Lu;
      gr.line(cx, cy, ex, ey).stroke({ color: TEAL, width: 2.3 * s, linecap: 'round', opacity: op });
      arrowHead(gr, cx + uf.x * Lu * 0.66, cy + uf.y * Lu * 0.66, uf.x, uf.y, aw, TEAL, op);
      hitLine(gh, cx, cy, ex, ey,
        'Refracted ray — θ₂ = ' + (th2 / RAD).toFixed(1) + '°, carrying ' + Math.round(Tf * 100) + '% of the light',
        'Refracted ray',
        'Snell\'s law gives sin θ₂ = (n₁/n₂)·sin θ₁. Since n₂ < n₁ that is larger than sin θ₁, so θ₂ > θ₁. As θ₁ grows, θ₂ races toward 90° and the ray fades because more energy is reflected.', 14 * s);
      arcBetween(gr, cx, cy, 48 * s, { x: 0, y: -1 }, uf, TEAL_D, 1.3 * s);
      var p2 = wedgePos(cx, cy, 0, th2, FT, 52 * s, 150 * s, above, false);
      txt(gl, 'θ₂', p2.x, p2.y, { size: FT, italic: true, family: 'Georgia, serif', anchor: 'middle', baseline: 'middle' });
      if (o.showNames) {
        var lp = { x: -Math.cos(th2), y: -Math.sin(th2) };
        var ax0 = cx + uf.x * Lu * 0.72, ay0 = cy + uf.y * Lu * 0.72;
        var nx = ax0 + lp.x * 58 * s, ny = Math.max(o.topY + 12 * ts, ay0 + lp.y * 58 * s);
        nameLabel(gl, 'Refracted ray', nx, ny, ax0, ay0, 11 * s, s, FR);
      }
    }
  }

  /* ── critical-angle reference ray ── */
  if (o.showThetaC) {
    var Lc = Math.min(o.Lmax * 0.95, below / Math.max(0.22, Math.cos(thc)));
    var uc = { x: -Math.sin(thc), y: Math.cos(thc) };
    gr.line(cx, cy, cx + uc.x * Lc, cy + uc.y * Lc)
      .stroke({ color: TEAL, width: 1.9 * s, linecap: 'round', opacity: 0.9 })
      .attr('stroke-dasharray', (10 * s) + ',' + (7 * s));
    hitLine(gh, cx, cy, cx + uc.x * Lc, cy + uc.y * Lc,
      'Critical-angle reference: θc = ' + (thc / RAD).toFixed(1) + '°',
      'The critical angle θc',
      'sin θc = n₂/n₁. This dashed ray marks the exact incidence at which the refracted ray would graze the surface. It depends only on the two media — not on the ray you send in.', 12 * s);
    arcBetween(gr, cx, cy, 100 * s, { x: 0, y: 1 }, uc, TEAL_D, 1.3 * s, true);
    var pc = wedgePos(cx, cy, -thc, 0, FT, 112 * s, 210 * s, below, true);
    thetaC(gl, pc.x, pc.y, FT);
  }

  /* ── incident ray ── */
  var ix = cx + ui.x * Lb, iy = cy + ui.y * Lb;
  gr.line(cx, cy, ix, iy).stroke({ color: TEAL, width: 2.5 * s, linecap: 'round' });
  arrowHead(gr, cx + ui.x * Lb * 0.5, cy + ui.y * Lb * 0.5, -ui.x, -ui.y, aw, TEAL);
  hitLine(gh, cx, cy, ix, iy, 'Incident ray — θ₁ = ' + o.theta1.toFixed(0) + '°', 'Incident ray',
    'The incoming ray travels inside n₁ and meets the boundary at θ₁ from the normal. Everything that happens next is decided by comparing sin θ₁ with n₂/n₁.', 14 * s);

  /* ── reflected ray ── */
  var rw = (2.0 + 2.0 * Rf) * s;
  var rx = cx + ur.x * Lb, ry = cy + ur.y * Lb;
  gr.line(cx, cy, rx, ry).stroke({ color: TEAL, width: rw, linecap: 'round' });
  arrowHead(gr, cx + ur.x * Lb * 0.64, cy + ur.y * Lb * 0.64, ur.x, ur.y, aw * (0.95 + 0.22 * Rf), TEAL);
  hitLine(gh, cx, cy, rx, ry,
    'Reflected ray — θ₁ = ' + o.theta1.toFixed(0) + '°, carrying ' + Math.round(Rf * 100) + '% of the light',
    'Reflected ray',
    'Reflection always obeys angle in = angle out. Its share of the energy grows as θ₁ approaches θc and reaches 100% beyond it — which is why this line thickens.', 14 * s);

  /* ── angle arcs + labels below the surface ── */
  arcBetween(gr, cx, cy, 46 * s, { x: 0, y: 1 }, ui, TEAL_D, 1.3 * s);
  arcBetween(gr, cx, cy, 46 * s, { x: 0, y: 1 }, ur, TEAL_D, 1.3 * s);
  var innerL = o.showThetaC ? thc : 0;
  var pL = wedgePos(cx, cy, -th1, -innerL, FT, 56 * s, o.showThetaC ? 130 * s : 210 * s, below, true);
  var pR = wedgePos(cx, cy, 0, th1, FT, 56 * s, 210 * s, below, true);
  function angLab(p, sub) {
    if (sub === 'c') thetaC(gl, p.x, p.y, FT);
    else txt(gl, 'θ₁', p.x, p.y, { size: FT, italic: true, family: 'Georgia, serif', anchor: 'middle', baseline: 'middle' });
  }
  angLab(pL, o.subLeft || '1');
  angLab(pR, o.subRight || '1');

  /* ── medium labels ── */
  txt(gl, 'n₂', o.left + 62 * s, cy - o.normUp * 0.55,
    { size: FN, italic: true, family: 'Georgia, serif', anchor: 'middle', baseline: 'middle' });
  txt(gl, 'n₁', o.right - 52 * s, cy + 46 * s,
    { size: FN, italic: true, family: 'Georgia, serif', anchor: 'middle', baseline: 'middle' });

  /* ── total internal reflection annotation ── */
  if (!hasRefr) {
    var tx0 = cx + 0.60 * (o.right - cx), ty0 = cy + 0.52 * (o.bottom - cy);
    var tt = txt(gl, 'Total internal\nreflection', tx0, ty0,
      { size: 21 * ts, anchor: 'middle', baseline: 'middle', haloW: 5 });
    inter(tt, 'No refracted ray exists — all the light stays inside n₁',
      'Total internal reflection',
      'For θ₁ > θc, sin θ₂ = sin θ₁ ÷ (n₂/n₁) would exceed 1. No real angle has a sine larger than 1, so Snell\'s law has no solution: the refracted ray simply does not exist and 100% of the light reflects.');
  }

  /* ── ray name labels ── */
  if (o.showNames) {
    var ai = { x: cx + ui.x * Lb * 0.80, y: cy + ui.y * Lb * 0.80 };
    var lpi = { x: -Math.cos(th1), y: Math.sin(th1) };
    var ilx = Math.max(o.left + 52 * ts, ai.x + lpi.x * 62 * s);
    var ily = Math.min(o.bottom - 20 * ts, ai.y + lpi.y * 62 * s - 18 * s);
    nameLabel(gl, 'Incident ray', ilx, ily, ai.x, ai.y, -12 * s, s, FR);

    var aq = { x: cx + ur.x * Lb * 0.80, y: cy + ur.y * Lb * 0.80 };
    var lpr = { x: Math.cos(th1), y: -Math.sin(th1) };
    var rlx = Math.min(o.right - 58 * ts, aq.x + lpr.x * 62 * s);
    var rly = Math.min(o.bottom - 20 * ts, Math.max(cy + 30 * s, aq.y + lpr.y * 62 * s));
    nameLabel(gl, 'Reflected ray', rlx, rly, aq.x, aq.y, 12 * s, s, FR);
  }

  return { thc: thc, th2: th2, hasRefr: hasRefr, graze: graze, R: Rf, T: Tf, sin2: sin2 };
}

/* ───────── readout card (single-panel view) ───────── */
function drawReadout(g, d) {
  var x = 654, y = 18, w = 288, h = 166;
  g.rect(w, h).move(x, y).radius(7).fill('#ffffff').stroke({ color: '#cfd8de', width: 1 }).opacity(0.95);
  var px = x + 14, py = y + 13, lh = 22;
  txt(g, 'θ₁ = ' + state.theta1.toFixed(0) + '°', px, py, { size: 16, fill: TEAL_D, weight: '700', halo: false });
  py += lh;
  if (d.hasRefr) {
    txt(g, 'θ₂ = ' + (d.th2 / RAD).toFixed(1) + '°' + (d.graze ? '  (grazing)' : ''), px, py,
      { size: 16, fill: TEAL_D, weight: '700', halo: false });
  } else {
    txt(g, 'θ₂ : none — no refracted ray', px, py, { size: 16, fill: '#c0392b', weight: '700', halo: false });
  }
  py += lh;
  txt(g, 'n₂/n₁ = ' + state.ratio.toFixed(2) + '     θc = ' + (d.thc / RAD).toFixed(1) + '°', px, py,
    { size: 15, fill: '#333', halo: false });
  py += 8;
  g.line(px, py + 10, x + w - 14, py + 10).stroke({ color: '#e2e7ea', width: 1 });
  py += 20;
  txt(g, 'n₁ sin θ₁ = n₂ sin θ₂', px, py, { size: 15, italic: true, family: 'Georgia, serif', halo: false });
  py += lh;
  txt(g, 'sin θ₂ = ' + d.sin2.toFixed(3) + (d.hasRefr ? '' : '  > 1  ✗'), px, py,
    { size: 15, italic: true, family: 'Georgia, serif', fill: d.hasRefr ? '#222' : '#c0392b', halo: false });
  py += lh;
  txt(g, 'sin θc = n₂/n₁ = ' + state.ratio.toFixed(2), px, py,
    { size: 15, italic: true, family: 'Georgia, serif', halo: false });

  inter(g.rect(w, h).move(x, y).fill('#fff').opacity(0),
    'Live values and the two governing equations',
    'Reading the numbers',
    'Snell\'s law is solved here for sin θ₂. While that number stays below 1 a refracted ray exists; the instant it passes 1 no angle can satisfy the equation, and refraction drops out of the physics entirely.');
}

/* ───────── views ───────── */
function drawSingle() {
  var thcDeg = Math.asin(Math.min(1, state.ratio)) / RAD;
  var d = drawScene(root, {
    theta1: state.theta1, ratio: state.ratio,
    cx: 400, cy: 300, left: 30, right: 930, bottom: 500, topY: 40,
    normUp: 260, normDown: 200, Lmax: 230, scale: 1, tscale: 1,
    showNames: true, showThetaC: state.theta1 > thcDeg + 3
  });
  drawReadout(root, d);
}

function drawTriptych() {
  var thcDeg = Math.asin(Math.min(1, state.ratio)) / RAD;
  var ta = Math.max(6, Math.min(state.theta1, thcDeg * 0.62));
  var tb = thcDeg;
  var tc = (state.theta1 > thcDeg + 2) ? Math.min(88, state.theta1) : Math.min(88, thcDeg + 18);
  var panels = [
    { cx: 165, th: ta, cap: '(a)', sl: '1', sr: '1', tc: false, names: true,
      tip: 'θ₁ < θc — the light splits into a refracted and a reflected ray',
      body: 'Below the critical angle Snell\'s law has a solution, so part of the light escapes into n₂ (bent away from the normal) and part reflects back into n₁.' },
    { cx: 490, th: tb, cap: '(b)', sl: 'c', sr: 'c', tc: false, names: false,
      tip: 'θ₁ = θc — the refracted ray grazes the surface, θ₂ = 90°',
      body: 'At exactly sin θ₁ = n₂/n₁ the refracted ray lies flat along the boundary. This is the definition of the critical angle θc.' },
    { cx: 815, th: tc, cap: '(c)', sl: '1', sr: '1', tc: true, names: false,
      tip: 'θ₁ > θc — total internal reflection',
      body: 'Past θc, sin θ₂ would have to exceed 1, which is impossible. The refracted ray vanishes and every bit of light is reflected back into the denser medium.' }
  ];
  panels.forEach(function (p) {
    var g = root.group();
    drawScene(g, {
      theta1: p.th, ratio: state.ratio,
      cx: p.cx, cy: 112, left: p.cx - 150, right: p.cx + 150, bottom: 252, topY: 18,
      normUp: 80, normDown: 140, Lmax: 148, scale: 0.62, tscale: 0.84,
      showNames: p.names, showThetaC: p.tc, subLeft: p.sl, subRight: p.sr
    });
    var cap = txt(root, p.cap, p.cx, 296, { size: 22, anchor: 'middle', baseline: 'middle' });
    inter(cap, p.tip, 'Panel ' + p.cap, p.body);
  });
}

/* ───────── render ───────── */
function render() {
  root.clear();
  if (state.triptych) { draw.viewbox(0, 0, 980, 330); drawTriptych(); }
  else { draw.viewbox(0, 0, 960, 560); drawSingle(); }
  updateUiReadout();
}

function updateUiReadout() {
  var thc = Math.asin(Math.min(1, state.ratio)) / RAD;
  var s2 = Math.sin(state.theta1 * RAD) / state.ratio;
  var el = document.getElementById('uiReadout');
  if (!el) return;
  el.innerHTML = 'θc = <b>' + thc.toFixed(1) + '°</b> &nbsp; sin θ₂ = <b>' + s2.toFixed(3) + '</b><br>'
    + (s2 <= 1 ? '<span style="color:#12657f">refracted ray exists (θ₂ = '
      + (Math.asin(Math.min(1, s2)) / RAD).toFixed(1) + '°)</span>'
      : '<span style="color:#c0392b">no solution → total internal reflection</span>');
}

/* ───────── controls ───────── */
function update_incidentAngle(v) { state.theta1 = +v; render(); }
function update_indexRatio(v) { state.ratio = +v; render(); }
function toggle_viewMode(on) { state.triptych = !!on; render(); }
function trigger_keyInsight() {
  showPopup('Key insight',
    'Total internal reflection is not a new law — it is Snell\'s law running out of room. Once sin θ₁ > n₂/n₁ there is no angle θ₂ whose sine equals n₁ sin θ₁ / n₂, so the refracted ray cannot exist and 100% of the light reflects back into the denser medium.');
}

/* ───────── guided demo ───────── */
var STEPS = [
  {
    title: '1. The textbook figure',
    narration: 'Three snapshots of one boundary. (a) θ₁ below the critical angle: the light splits into a refracted and a reflected ray. (b) θ₁ = θc: the refracted ray grazes the surface at θ₂ = 90°. (c) θ₁ > θc: nothing escapes. Hover any ray or panel for details.',
    state: { incidentAngle: 60, indexRatio: 0.67, triptych: true }
  },
  {
    title: '2. Ordinary refraction',
    narration: 'Switching to the single interactive panel: with θ₁ well below θc the ray splits. Most light refracts into n₂, bending away from the normal because n₂ < n₁, while a weaker reflected ray returns into n₁ at the same angle θ₁.',
    state: { incidentAngle: 25, indexRatio: 0.67, triptych: false }
  },
  {
    title: '3. Approaching the critical angle',
    narration: 'Raise θ₁ and watch θ₂ grow much faster — the refracted ray swings toward the surface and dims, while the reflected ray thickens as it takes a larger share of the energy.',
    state: { incidentAngle: 38, indexRatio: 0.67, triptych: false }
  },
  {
    title: '4. θ₁ = θc : grazing exit',
    narration: 'At θ₁ ≈ 42° the refracted ray lies flat along the boundary: θ₂ = 90°, marked by the right-angle square. This is exactly where sin θc = n₂/n₁.',
    state: { incidentAngle: 42, indexRatio: 0.67, triptych: false }
  },
  {
    title: '5. Total internal reflection',
    narration: 'Push past θc and the refracted ray disappears — sin θ₂ would have to exceed 1, so Snell\'s law has no solution. The dashed θc reference now appears, and all the light stays trapped in n₁.',
    state: { incidentAngle: 60, indexRatio: 0.67, triptych: false }
  },
  {
    title: '6. Change the media',
    narration: 'Hold θ₁ fixed and shrink n₂/n₁: θc collapses and a ray that used to refract is suddenly totally internally reflected. The critical angle belongs to the materials, not to the ray.',
    state: { incidentAngle: 45, indexRatio: 0.5, triptych: false }
  }
];
var curStep = 0;

function setControl(id, v) {
  var inp = document.getElementById(id + 'Input');
  if (inp) inp.value = v;
  var out = document.getElementById(id + 'Val');
  if (out) out.value = v;
}

function applyStep(i) {
  curStep = ((i % STEPS.length) + STEPS.length) % STEPS.length;
  var st = STEPS[curStep].state;
  state.theta1 = st.incidentAngle;
  state.ratio = st.indexRatio;
  state.triptych = !!st.triptych;
  setControl('incidentAngle', st.incidentAngle);
  setControl('indexRatio', st.indexRatio.toFixed(2));
  var chk = document.getElementById('viewModeInput');
  if (chk) chk.checked = state.triptych;
  document.getElementById('stepTitle').textContent = STEPS[curStep].title;
  document.getElementById('demoNarration').textContent = STEPS[curStep].narration;
  document.getElementById('stepLabel').textContent = 'Step ' + (curStep + 1) + ' / ' + STEPS.length;
  render();
}
function nextStep() { applyStep(curStep + 1); }
function prevStep() { applyStep(curStep - 1); }

applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees

    _autoUiLayout();
