<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="display:block;font-weight:bold;font-size:12px;">Cross-ratio under central projection</span>
<span id="stepTitle" style="display:block;font-weight:bold;font-size:11.5px;color:#E8175D;"></span>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.45;min-height:56px;"></span>
<span style="display:flex;gap:8px;align-items:center;">
  <button onclick="prevStep()">◀</button><span id="stepLabel" style="font-size:11px;"></span><button onclick="nextStep()">▶</button>
</span>
<label>Slope of R-transversal (0 → parallel to ray O&#8202;P₁Q₁): <output id="rLineSlopeVal">-0.18</output>
  <input id="rLineSlopeInput" type="range" min="-0.6" max="0" step="0.01" value="-0.18"
   oninput="document.getElementById('rLineSlopeVal').value=this.value;update_rLineSlope(+this.value)"></label>
<label>Highlight point set
  <select id="activeTransversalInput" onchange="toggle_activeTransversal(this.value)">
    <option value="all">all three transversals</option>
    <option value="P">P₁…P₄ only</option>
    <option value="Q">Q₁…Q₄ only</option>
    <option value="R">R₁…R₄ only</option>
  </select></label>
<label><input id="showDistancesInput" type="checkbox" onchange="toggle_showDistances(this.checked)"> Show segment lengths</label>
<button onclick="trigger_reset()">↺ Reset figure</button>
<span id="readout" style="display:block;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;background:#fff;border:1px solid #e3e3e3;border-radius:4px;padding:5px 6px;"></span>
<span style="display:block;font-size:10px;color:#555;line-height:1.4;">Drag: the big <b>O</b> dot, any <span style="color:#E8175D">magenta</span> transversal, or the small circles at the ray tips.</span>
<span style="display:block;font-size:10px;color:#555;line-height:1.4;">Legend — black: projection rays from O &nbsp;·&nbsp; <span style="color:#E8175D">magenta</span>: transversals carrying the four collinear points.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN

var DEFAULTS = {
  O: { x: 43, y: 292 },
  rayAng: [Math.atan2(0.2155, 1), Math.atan2(-0.0945, 1), Math.atan2(-0.246, 1), Math.atan2(-0.531, 1)],
  pAnchor: { x: 287, y: 250 }, pAng: Math.atan2(-185, 23),
  qAnchor: { x: 410, y: 265 }, qAng: Math.atan2(251, 163),
  rAnchor: { x: 376, y: 115 },
  rSlider: -0.18, active: 'all', showDist: false
};
var S = JSON.parse(JSON.stringify(DEFAULTS));

var gRay = draw.group(), gTrans = draw.group(), gDist = draw.group(),
    gDot = draw.group(), gLab = draw.group(), gAnno = draw.group(), gBox = draw.group();

/* ---------- small vector helpers ---------- */
function dir(a) { return { x: Math.cos(a), y: Math.sin(a) }; }
function cross(a, b) { return a.x * b.y - a.y * b.x; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function inCanvas(p, m) { m = (m == null) ? 6 : m; return p.x >= -m && p.x <= W + m && p.y >= -m && p.y <= H + m; }
function fmt(v) { return (isFinite(v)) ? v.toFixed(4) : '—'; }

function rayEdge(O, d) {
  var tm = Infinity;
  if (d.x > 1e-9) tm = Math.min(tm, (W - O.x) / d.x); else if (d.x < -1e-9) tm = Math.min(tm, (0 - O.x) / d.x);
  if (d.y > 1e-9) tm = Math.min(tm, (H - O.y) / d.y); else if (d.y < -1e-9) tm = Math.min(tm, (0 - O.y) / d.y);
  if (!isFinite(tm)) tm = W;
  return { x: O.x + tm * d.x, y: O.y + tm * d.y };
}

function clipSeg(p, d, s0, s1, pad) {
  var lo = s0, hi = s1;
  function slab(p0, dd, mn, mx) {
    if (Math.abs(dd) < 1e-9) { if (p0 < mn || p0 > mx) { lo = 1; hi = 0; } return; }
    var a = (mn - p0) / dd, b = (mx - p0) / dd, t;
    if (a > b) { t = a; a = b; b = t; }
    lo = Math.max(lo, a); hi = Math.min(hi, b);
  }
  slab(p.x, d.x, pad, W - pad); slab(p.y, d.y, pad, H - pad);
  return [lo, hi];
}

/* ---------- text with halo ---------- */
function txt(g, str, x, y, size, color, anchor, weight) {
  var t = g.text(str);
  t.font({ family: 'Georgia, "Times New Roman", serif', size: size, weight: weight || 'normal', anchor: anchor || 'start' });
  t.fill(color);
  t.attr({ x: x, y: y, 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': size * 0.18 + 1.2, 'stroke-linejoin': 'round' });
  var ts = t.node.firstChild;
  if (ts && ts.setAttribute) { ts.setAttribute('x', x); ts.setAttribute('dy', 0); }
  return t;
}
function labelSub(g, letter, sub, x, y, size, color) {
  txt(g, letter, x, y, size, color, 'start', 'bold');
  txt(g, sub, x + size * 0.63, y + size * 0.30, size * 0.62, color, 'start', 'bold');
}

/* ---------- geometry ---------- */
function computeTrans(key, anchor, td, rd) {
  var info = { key: key, anchor: anchor, d: td, pts: [] };
  for (var i = 0; i < 4; i++) {
    var den = cross(rd[i], td);
    var w = { x: anchor.x - S.O.x, y: anchor.y - S.O.y };
    if (Math.abs(den) < 1e-10) { info.pts.push({ inf: true }); continue; }
    var s = cross(w, rd[i]) / den;
    info.pts.push({ inf: false, s: s, p: { x: anchor.x + s * td.x, y: anchor.y + s * td.y } });
  }
  var q = info.pts;
  if (q[0].inf) {
    info.cr = (q[3].s - q[1].s) / (q[2].s - q[1].s);
    info.limit = true;
  } else {
    info.cr = ((q[2].s - q[0].s) * (q[3].s - q[1].s)) / ((q[2].s - q[1].s) * (q[3].s - q[0].s));
    info.limit = false;
  }
  return info;
}

var OFFS = {
  P: [[14, 24], [19, 22], [17, 18], [10, 34]],
  Q: [[16, -12], [30, 26], [26, 22], [24, 16]],
  R: [[14, 22], [-11, -18], [-11, -18], [-13, -18]]
};

function isActive(k) { return S.active === 'all' || S.active === k; }

/* ---------- drawing ---------- */
function drawRays(O, rd) {
  for (var i = 0; i < 4; i++) {
    (function (i) {
      var e = rayEdge(O, rd[i]);
      gRay.line(O.x, O.y, e.x, e.y).stroke({ color: '#000', width: 2.4, linecap: 'round' });
      var hit = gRay.line(O.x, O.y, e.x, e.y).stroke({ color: '#000', width: 14, opacity: 0 })
        .attr('pointer-events', 'stroke').css('cursor', 'help');
      hit.on('mousemove', function (ev) { showTooltip('Ray ' + (i + 1) + ' of the pencil through O', ev); })
        .on('mouseleave', hideTooltip)
        .on('click', function () {
          showPopup('A pencil of four rays',
            'All four black lines pass through the projection centre O. Every transversal that cuts this pencil records the same cross-ratio, so the number belongs to the pencil of rays itself, not to the line you cut it with.');
        });
      var hx = e.x - 15 * rd[i].x, hy = e.y - 15 * rd[i].y;
      var h = gRay.circle(10).center(hx, hy).fill('#fff').stroke({ color: '#8f8f8f', width: 1.3 }).css('cursor', 'grab');
      h.on('pointerdown', function (ev) { startDrag({ kind: 'ray', idx: i }, ev); });
      h.on('mousemove', function (ev) { showTooltip('Drag to re-aim ray ' + (i + 1) + ': all three cross-ratios change together — and stay equal.', ev); })
        .on('mouseleave', hideTooltip);
    })(i);
  }
}

function drawTransversal(info) {
  var on = isActive(info.key);
  var ss = [], i;
  for (i = 0; i < 4; i++) if (!info.pts[i].inf && inCanvas(info.pts[i].p, 70)) ss.push(info.pts[i].s);
  if (ss.length < 2) { for (i = 0; i < 4; i++) if (!info.pts[i].inf) ss.push(info.pts[i].s); }
  if (ss.length < 2) return;
  var s0 = Math.min.apply(null, ss) - 32, s1 = Math.max.apply(null, ss) + 32;
  var cl = clipSeg(info.anchor, info.d, s0, s1, 2);
  if (cl[1] <= cl[0]) return;
  var a = { x: info.anchor.x + cl[0] * info.d.x, y: info.anchor.y + cl[0] * info.d.y };
  var b = { x: info.anchor.x + cl[1] * info.d.x, y: info.anchor.y + cl[1] * info.d.y };
  gTrans.line(a.x, a.y, b.x, b.y).stroke({ color: on ? MAGENTA : DIMLINE, width: on ? 3.5 : 2.4, linecap: 'round' });
  var hit = gTrans.line(a.x, a.y, b.x, b.y).stroke({ color: '#000', width: 18, opacity: 0 })
    .attr('pointer-events', 'stroke').css('cursor', 'move');
  hit.on('pointerdown', function (ev) { startDrag({ kind: 'trans', idx: { P: 0, Q: 1, R: 2 }[info.key] }, ev); });
  hit.on('mousemove', function (ev) {
    showTooltip('Transversal ' + info.key + ' — drag to slide it. Its four points move, its cross-ratio does not.', ev);
  }).on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup('Transversal ' + info.key,
        'This magenta line cuts the four rays in four collinear points. Their cross-ratio (|AC|·|BD|)/(|BC|·|AD|) equals ' + fmt(info.cr) +
        ' — exactly the value read off the other transversals, however differently the individual distances come out.');
    });
}

function drawPoints(info) {
  var on = isActive(info.key);
  for (var i = 0; i < 4; i++) {
    var q = info.pts[i];
    if (q.inf || !inCanvas(q.p, -4)) continue;
    (function (i, q) {
      var name = info.key + '\u2081\u2082\u2083\u2084'.charAt(i);
      var c = gDot.circle(15).center(q.p.x, q.p.y).fill(on ? '#000' : DIMDOT).css('cursor', 'pointer');
      c.on('mousemove', function (ev) { showTooltip(name + ' — transversal ' + info.key + ' meets ray ' + (i + 1), ev); })
        .on('mouseleave', hideTooltip)
        .on('click', function () {
          showPopup(name,
            'The intersection of transversal ' + info.key + ' with ray ' + (i + 1) + '. Slide the transversal or move O: this point runs along its ray and all the spacings change, yet the double ratio of the four points stays at ' + fmt(info.cr) + '.');
        });
      var o = OFFS[info.key][i];
      labelSub(gLab, info.key, '\u2081\u2082\u2083\u2084'.charAt(i), q.p.x + o[0], q.p.y + o[1], 21, on ? '#000' : DIMTXT);
    })(i, q);
  }
}

function drawDistances(res) {
  for (var i = 0; i < 3; i++) {
    var info = res[i];
    if (!isActive(info.key)) continue;
    var d = info.d, n = { x: -d.y, y: d.x };
    if (Math.abs(d.y) > Math.abs(d.x)) { if (n.x > 0) { n.x = -n.x; n.y = -n.y; } }
    else { if (n.y > 0) { n.x = -n.x; n.y = -n.y; } }
    for (var j = 0; j < 3; j++) {
      var a = info.pts[j], b = info.pts[j + 1];
      if (a.inf || b.inf) continue;
      if (!inCanvas(a.p, -4) || !inCanvas(b.p, -4)) continue;
      var mx = (a.p.x + b.p.x) / 2 + n.x * 15, my = (a.p.y + b.p.y) / 2 + n.y * 15;
      txt(gDist, Math.abs(b.s - a.s).toFixed(0), mx, my, 11, '#555', 'middle');
    }
  }
}

function drawAnno(rInfo) {
  var q = rInfo.pts[0];
  var far = q.inf || Math.abs(q.s) > 2600;
  var c = isActive('R') ? '#000' : DIMTXT;
  labelSub(gAnno, 'R', '\u2081', 876, 202, 21, c);
  gAnno.line(910, 195, 944, 195).stroke({ color: c, width: 2.2 });
  gAnno.polygon('944,189 958,195 944,201').fill(c);
  if (far) txt(gAnno, '\u221E', 963, 204, 25, c, 'start', 'normal');
  else txt(gAnno, Math.round(Math.abs(q.s)) + ' px', 963, 200, 12.5, c, 'start', 'normal');
  var hot = gAnno.rect(130, 44).move(868, 172).fill('#fff').opacity(0).css('cursor', 'help');
  hot.on('mousemove', function (ev) {
    showTooltip(q.inf ? 'R-transversal is exactly parallel to ray 1: R₁ lies at infinity.'
      : 'R₁ is ' + Math.round(Math.abs(q.s)) + ' px away along the R-transversal — far off the figure.', ev);
  }).on('mouseleave', hideTooltip)
    .on('click', function () {
      showPopup('R₁ → ∞',
        'The third transversal is (nearly) parallel to the ray through P₁ and Q₁, so their meeting point R₁ runs off the figure. In the cross-ratio the two factors containing R₁ both blow up at the same rate and cancel, leaving |R₂R₄|/|R₂R₃| — the same invariant value.');
    });
}

function drawO(O) {
  var c = gDot.circle(19).center(O.x, O.y).fill('#000').css('cursor', 'grab');
  c.on('pointerdown', function (ev) { startDrag({ kind: 'O' }, ev); });

    .on('mouseleave', hideTooltip)
    .on('click', function () {

        'Every ray of the pencil passes through O. Moving O redraws the whole fan and changes every spacing on every transversal, but the three cross-ratio readouts remain identical to each other.');
    });

function drawBox(res) {
  var x = 12, y = 10, w = 256, h = 84;
  var r = gBox.rect(w, h).move(x, y).radius(5).fill({ color: '#fff', opacity: 0.93 }).stroke({ color: '#e4e4e4', width: 1 }).css('cursor', 'help');
  txt(gBox, 'CR = (AC\u00B7BD) / (BC\u00B7AD)', x + 11, y + 21, 13, '#333', 'start', 'bold');

    });

function updateReadout(res) {
  var q = res[2].pts[0];
  var dist = res[2].limit ? '\u221E' : (Math.abs(q.s) > 2600 ? Math.round(Math.abs(q.s)) + ' px (off figure)' : Math.round(Math.abs(q.s)) + ' px');

    'CR(P\u2081P\u2082;P\u2083P\u2084) = ' + fmt(res[0].cr) + '<br>' +
    'CR(Q\u2081Q\u2082;Q\u2083Q\u2084) = ' + fmt(res[1].cr) + '<br>' +
    'CR(R\u2081R\u2082;R\u2083R\u2084) = ' + fmt(res[2].cr) + (res[2].limit ? '  \u2190 |R\u2082R\u2084|/|R\u2082R\u2083|' : '') + '<br>' +
    'dist(R\u2082,R\u2081) = ' + dist;
}

/* ---------- master render ---------- */
function render() {
  [gRay, gTrans, gDist, gDot, gLab, gAnno, gBox].forEach(function (g) { g.clear(); });
  var O = S.O, rd = [], i;
  for (i = 0; i < 4; i++) rd.push(dir(S.rayAng[i]));
  drawRays(O, rd);
  var tdefs = [
    { key: 'P', anchor: S.pAnchor, d: dir(S.pAng) },
    { key: 'Q', anchor: S.qAnchor, d: dir(S.qAng) },
    { key: 'R', anchor: S.rAnchor, d: dir(S.rayAng[0] + 0.5 * S.rSlider * S.rSlider) }
  ];
  var res = tdefs.map(function (td) { return computeTrans(td.key, td.anchor, td.d, rd); });
  res.forEach(drawTransversal);
  res.forEach(drawPoints);
  if (S.showDist) drawDistances(res);
  drawAnno(res[2]);
  drawO(O);
  drawBox(res);
  updateReadout(res);
}

/* ---------- dragging ---------- */
var drag = null;
function toWorld(ev) {
  var p = svgNode.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(svgNode.getScreenCTM().inverse());
}
function anchorOf(i) { return [S.pAnchor, S.qAnchor, S.rAnchor][i]; }
function startDrag(target, ev) {
  if (ev.preventDefault) ev.preventDefault();
  var w = toWorld(ev);
  drag = { t: target, start: w, orig: null };
  if (target.kind === 'O') drag.orig = { x: S.O.x, y: S.O.y };
  if (target.kind === 'trans') { var a = anchorOf(target.idx); drag.orig = { x: a.x, y: a.y }; }
  hideTooltip();
}
window.addEventListener('pointermove', function (ev) {
  if (!drag) return;
  var w = toWorld(ev);
  if (drag.t.kind === 'O') {
    S.O.x = clamp(drag.orig.x + (w.x - drag.start.x), 10, W * 0.5);
    S.O.y = clamp(drag.orig.y + (w.y - drag.start.y), 25, H - 15);
  } else if (drag.t.kind === 'trans') {
    var a = anchorOf(drag.t.idx);
    a.x = clamp(drag.orig.x + (w.x - drag.start.x), 90, W - 90);
    a.y = clamp(drag.orig.y + (w.y - drag.start.y), 20, H - 20);
  } else if (drag.t.kind === 'ray') {
    var i = drag.t.idx;
    var ang = Math.atan2(w.y - S.O.y, w.x - S.O.x);
    if (w.x - S.O.x < 5) ang = S.rayAng[i];
    var hi = (i === 0) ? 1.25 : S.rayAng[i - 1] - 0.07;
    var lo = (i === 3) ? -1.30 : S.rayAng[i + 1] + 0.07;
    S.rayAng[i] = clamp(ang, lo, hi);
  }
  render();
});
window.addEventListener('pointerup', function () { drag = null; });
window.addEventListener('pointercancel', function () { drag = null; });

/* ---------- controls ---------- */
function update_rLineSlope(v) { S.rSlider = v; render(); }
function toggle_activeTransversal(v) { S.active = v; render(); }
function toggle_showDistances(on) { S.showDist = on; render(); }
function trigger_reset() {
  S = JSON.parse(JSON.stringify(DEFAULTS));
  document.getElementById('rLineSlopeInput').value = S.rSlider;
  document.getElementById('rLineSlopeVal').value = S.rSlider.toFixed(2);
  document.getElementById('activeTransversalInput').value = S.active;
  document.getElementById('showDistancesInput').checked = S.showDist;
  render();
}

/* ---------- demo steps ---------- */
var steps = [
  {
    title: '1 · A pencil of four rays',
    narration: 'Four rays leave the projection centre O. Any line crossing them picks out four collinear points — here P₁…P₄ on the first magenta transversal.',
    state: { activeTransversal: 'all', showDistances: false, rLineSlope: -0.18, O: { x: 43, y: 292 } }
  },
  {
    title: '2 · Distances are not invariant',
    narration: 'Segment lengths are on: the spacings of Q₁…Q₄ are nothing like those of P₁…P₄. Simple ratios of lengths are destroyed by projection.',
    state: { activeTransversal: 'Q', showDistances: true, rLineSlope: -0.18, O: { x: 43, y: 292 } }
  },
  {
    title: '3 · The double ratio survives',
    narration: 'Compute (|AC|·|BD|)/(|BC|·|AD|) on each transversal. Despite the wildly different spacings, all three readouts show the same number — the cross-ratio.',
    state: { activeTransversal: 'all', showDistances: true, rLineSlope: -0.18, O: { x: 43, y: 292 } }
  },
  {
    title: '4 · Sending R₁ to infinity',
    narration: 'Slide the slope to 0: the third transversal becomes parallel to the ray through P₁ and Q₁. R₁ escapes to infinity, yet the cross-ratio settles on the same value — the infinite terms cancel and CR = |R₂R₄|/|R₂R₃|.',
    state: { activeTransversal: 'R', showDistances: false, rLineSlope: 0, O: { x: 43, y: 292 } }
  },
  {
    title: '5 · Any centre, same invariant',
    narration: 'O has been moved and the whole figure deforms. Drag O, the transversals or the ray tips yourself: the three cross-ratio values move together and stay equal.',
    state: { activeTransversal: 'all', showDistances: false, rLineSlope: -0.1, O: { x: 95, y: 196 } }
  }
];
var stepIdx = 0;
function applyStep(i) {
  stepIdx = (i + steps.length) % steps.length;
  var st = steps[stepIdx], s = st.state;
  document.getElementById('stepTitle').textContent = st.title;
  document.getElementById('demoNarration').textContent = st.narration;
  document.getElementById('stepLabel').textContent = (stepIdx + 1) + ' / ' + steps.length;
  var sl = document.getElementById('rLineSlopeInput');
  sl.value = s.rLineSlope;
  document.getElementById('rLineSlopeVal').value = (+s.rLineSlope).toFixed(2);
  S.rSlider = +s.rLineSlope;
  var sel = document.getElementById('activeTransversalInput');
  sel.value = s.activeTransversal; S.active = s.activeTransversal;
  var cb = document.getElementById('showDistancesInput');
  cb.checked = !!s.showDistances; S.showDist = !!s.showDistances;
  if (s.O) { S.O.x = s.O.x; S.O.y = s.O.y; }
  render();
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
