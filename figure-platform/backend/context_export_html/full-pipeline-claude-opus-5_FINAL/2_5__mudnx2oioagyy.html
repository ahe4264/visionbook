<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0;font-size:12px;line-height:1.5;color:#222"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;flex:1;text-align:center;color:#555"></span>
  <button onclick="nextStep()">▶</button>
</span>
<span style="height:1px;background:#e0e3e7;margin:4px 0"></span>
<button id="stageBtn" onclick="trigger_expandStage()">Expand the recurrence</button>
<label>Problem size <i>n</i> (powers of 2): <output id="problemSizeVal">16</output>
  <input id="problemSizeInput" type="range" min="2" max="6" step="1" value="4"
         oninput="document.getElementById('problemSizeVal').value=Math.pow(2,+this.value);update_problemSize(+this.value)">
</label>
<label><input id="levelCostsInput" type="checkbox" onchange="toggle_levelCosts(this.checked)"> Level-cost overlay</label>
<span style="font-size:11px;color:#666;line-height:1.45">Click any level — its nodes or its <i>cn</i> on the right — to see 2<sup>i</sup> × cn/2<sup>i</sup> = cn.</span>
<span id="readout" style="font-size:11px;color:#333;line-height:1.45"></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

(function () {
  var W = 1240, H = 1010;
  var ACCENT = '#e09b2d', ACCENT_DK = '#a8650a', GHOST = '#8a8f95';
  var SERIF = 'Georgia, "Times New Roman", Times, serif';

  var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
  draw.viewbox(0, 0, W, H);

  var gTop = draw.group();
  var gTreeBG = draw.group();
  var gTree = draw.group();

  /* ---------- helpers ---------- */
  function txt(g, s, x, y, size, o) {

      .font({ family: SERIF, size: size, anchor: o.anchor || 'middle', style: o.upright ? 'normal' : 'italic' })
      .attr({ x: x, y: y, 'dominant-baseline': 'central' })

  }

    r.on('mousemove', function (e) { showTooltip(tip, e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () { hideTooltip(); if (onClick) onClick(); });
    return r;
  }
  function edge(g, px, py, cx, cy, o) {
    o = o || {};
    var dx = cx - px, dy = cy - py;
    g.line(px + dx * 0.16, py + dy * 0.16, cx - dx * 0.18, cy - dy * 0.18)
      .stroke({ color: o.color || '#000', width: o.width || 1.8 });
  }
  function dottedArrow(g, x1, x2, y, color) {
    if (x2 - x1 < 30) return;
    g.line(x1, y, x2 - 13, y).stroke({ color: color, width: 3.2, dasharray: '2,7', linecap: 'round' });
    g.polygon((x2 - 13) + ',' + (y - 7) + ' ' + x2 + ',' + y + ' ' + (x2 - 13) + ',' + (y + 7)).fill(color);
  }
  function ellipsisH(g, x, y, col) { [-18, 0, 18].forEach(function (d) { g.circle(8).center(x + d, y).fill(col || '#000'); }); }
  function ellipsisV(g, x, y) { [-26, 0, 26].forEach(function (d) { g.circle(8).center(x, y + d).fill('#000'); }); }
  function brace(g, x1, x2, y, d) {
    var mid = (x1 + x2) / 2, r = 16;
    var p = 'M' + x1 + ',' + y + ' q0,' + d + ' ' + r + ',' + d +
      ' H' + (mid - r) + ' q' + r + ',0 ' + r + ',' + d +
      ' q0,-' + d + ' ' + r + ',-' + d +
      ' H' + (x2 - r) + ' q' + r + ',0 ' + r + ',-' + d;
    g.path(p).fill('none').stroke({ color: '#000', width: 1.8, linejoin: 'round' });
  }
  function vArrow(g, x, y1, y2) {
    g.line(x, y1 + 10, x, y2 - 10).stroke({ color: '#000', width: 2.2 });
    g.polygon(x + ',' + y1 + ' ' + (x - 10) + ',' + (y1 + 20) + ' ' + (x + 10) + ',' + (y1 + 20)).fill('#000');
    g.polygon(x + ',' + y2 + ' ' + (x - 10) + ',' + (y2 - 20) + ' ' + (x + 10) + ',' + (y2 - 20)).fill('#000');
  }
  function halfW(label, size) { return label.length * size * 0.26 + 8; }
  function lerp(t, a, b) { return a + (b - a) * t; }

  var FS = 32, FS_SM = 28;

  function node(g, label, x, y, o) {
    o = o || {};
    var size = o.size || FS;
    txt(g, label, x, y, size, { fill: o.accent ? ACCENT_DK : '#000', halo: o.halo !== false });
    hit(g, x, y, label.length * size * 0.52 + 20, size + 16, o.tip || label, o.onClick);
  }

  /* ---------- geometry ---------- */
  var X0 = 200, X1 = 900;
  function xAt(i, j) { return X0 + (X1 - X0) * ((j + 0.5) / Math.pow(2, i)); }
  var YTOP = 442, YLEAF = 832;
  var COLX = 1135, ARROWEND = 1080;
  var STAGEY = [442, 604, 766];

  var stageNames = ['(a) T(n)', '(b) one split', '(c) two splits', '(d) full tree'];
  var state = { stage: 3, k: 4, overlay: false, active: -1 };

  function costLabel(i) { return i === 0 ? 'cn' : 'cn/' + Math.pow(2, i); }
  function termLabel(i) { return i === 0 ? 'T(n)' : 'T(n/' + Math.pow(2, i) + ')'; }

  /* ---------- static stages (a) (b) (c) ---------- */
  var hlRects = [];
  function mkHL(x, y, w, h) {
    var r = gTopHL.rect(w, h).move(x, y).radius(12)
      .fill({ color: ACCENT, opacity: 0.15 }).stroke({ color: ACCENT, width: 1.8 }).opacity(0);
    hlRects.push(r); return r;
  }
  function drawTop() {
    mkHL(8, 8, 96, 56); mkHL(140, 8, 330, 212); mkHL(530, 8, 700, 330);

    // (a)
    node(gTop, 'T(n)', 56, 36, { tip: '(a) The bare recurrence term T(n)', onClick: function () { setStage(0); } });
    txt(gTop, '(a)', 56, 366, 30, { upright: true });

    // (b)
    edge(gTop, 300, 36, 216, 178); edge(gTop, 300, 36, 386, 178);
    node(gTop, 'cn', 300, 36, { tip: '(b) Root cost cn — the merge step on n elements' });
    node(gTop, 'T(n/2)', 216, 178, { size: FS_SM, tip: 'Still-unresolved subproblem of size n/2' });
    node(gTop, 'T(n/2)', 386, 178, { size: FS_SM, tip: 'Still-unresolved subproblem of size n/2' });
    txt(gTop, '(b)', 300, 366, 30, { upright: true });
    hit(gTop, 305, 114, 330, 212, '(b) One substitution: T(n) = cn + 2T(n/2)', function () { setStage(1); });

    // (c)  — widened so the four T(n/4) labels keep clear gaps
    edge(gTop, 860, 36, 690, 166); edge(gTop, 860, 36, 1030, 166);
    edge(gTop, 690, 166, 605, 300); edge(gTop, 690, 166, 775, 300);
    edge(gTop, 1030, 166, 945, 300); edge(gTop, 1030, 166, 1115, 300);
    node(gTop, 'cn', 860, 36, { tip: 'Root cost cn' });
    node(gTop, 'cn/2', 690, 166, { tip: 'Resolved cost cn/2 at this node' });
    node(gTop, 'cn/2', 1030, 166, { tip: 'Resolved cost cn/2 at this node' });
    [605, 775, 945, 1115].forEach(function (x) {
      node(gTop, 'T(n/4)', x, 300, { size: FS_SM, tip: 'Still-unresolved subproblem of size n/4' });
    });
    txt(gTop, '(c)', 860, 366, 30, { upright: true });
    hit(gTop, 880, 170, 700, 326, '(c) Substitute again: each T(n/2) becomes cn/2 + 2T(n/4)', function () { setStage(2); });
  }

  /* ---------- level focus ---------- */
  function setActive(i) {
    state.active = (state.active === i) ? -1 : i;
    render();
    if (state.active < 0) { hidePopup(); return; }
    var nv = Math.pow(2, state.k), cnt = Math.pow(2, i);
    if (i === state.k) {
      showPopup('Leaf level (level ' + i + ')',
        'The bottom level holds n = ' + nv + ' leaves, each a base case of cost c. Together they cost n\u00b7c = cn — exactly the same as every internal level above them.');
    } else {
      showPopup('Level ' + i,
        'Level ' + i + ' has 2^' + i + ' = ' + cnt + ' nodes, each costing cn/' + cnt + '. Multiplying gives ' + cnt + ' \u00d7 cn/' + cnt + ' = cn. The doubling of nodes exactly cancels the halving of cost, so every level sums to cn.');
    }
  }
  function levelTip(i, kind) {
    var cnt = Math.pow(2, i);
    if (kind === 'leaf') return 'Leaf level: n = ' + Math.pow(2, state.k) + ' nodes of cost c \u2192 cn total (click for detail)';
    if (kind === 'ghost') return 'Omitted level ' + i + ': ' + cnt + ' nodes of cost cn/' + cnt + ' \u2192 cn total (click for detail)';
    return 'Level ' + i + ': ' + cnt + ' node' + (cnt > 1 ? 's' : '') + ' of cost cn/' + cnt + ' \u2192 cn total (click for detail)';
  }
  function band(y, strong) {
    gTreeBG.rect(1090, 60).move(140, y - 30).radius(10)
      .fill({ color: ACCENT, opacity: strong ? 0.22 : 0.07 });
  }
  function costRow(i, y, xStart, kind) {
    var act = state.active === i;
    if (act) band(y, true); else if (state.overlay) band(y, false);
    var col = act ? ACCENT_DK : (kind === 'ghost' ? GHOST : '#000');
    dottedArrow(gTree, xStart, ARROWEND, y, col);
    txt(gTree, 'cn', COLX, y, FS, { fill: col, halo: true });
    if (state.overlay || act) {
      var cnt = Math.pow(2, i);
      var s = (kind === 'leaf') ? (Math.pow(2, state.k) + ' \u00d7 c') : (cnt + ' \u00d7 cn/' + cnt);
      txt(gTree, s, COLX, y + 28, 18, { fill: act ? ACCENT_DK : GHOST, upright: true, halo: true });
    }
    hit(gTree, COLX, y, 170, 54, levelTip(i, kind), function () { setActive(i); });
  }

  /* ---------- stage (d) region ---------- */
  function drawTree() {
    var stg = state.stage, k = state.k, i, j;

    if (stg === 0) {
      node(gTree, 'T(n)', xAt(0, 0), STAGEY[0], {
        accent: state.active === 0,
        tip: 'Unresolved: the whole problem costs T(n) = 2T(n/2) + cn',
        onClick: function () { setActive(0); }
      });
      return;
    }

    if (stg < 3) {
      for (i = 0; i <= stg; i++) {
        var cnt = Math.pow(2, i), y = STAGEY[i];
        if (state.active === i) band(y, true);
        if (i < stg) {
          for (j = 0; j < cnt; j++) {
            edge(gTree, xAt(i, j), y, xAt(i + 1, 2 * j), STAGEY[i + 1]);
            edge(gTree, xAt(i, j), y, xAt(i + 1, 2 * j + 1), STAGEY[i + 1]);
          }
        }
        for (j = 0; j < cnt; j++) {
          (function (i2, j2) {
            var x = xAt(i2, j2);
            if (i2 < stg) {
              node(gTree, costLabel(i2), x, STAGEY[i2], {
                accent: state.active === i2, tip: levelTip(i2, 'level'),
                onClick: function () { setActive(i2); }
              });
            } else {
              node(gTree, termLabel(i2), x, STAGEY[i2], {
                size: i2 >= 2 ? FS_SM : FS, accent: state.active === i2,
                tip: 'Unresolved subproblem — press "Expand" to substitute its definition',
                onClick: function () { setActive(i2); }
              });
            }
          })(i, j);
        }
        if (i < stg) costRow(i, y, xAt(i, cnt - 1) + halfW(costLabel(i), FS) + 26, 'level');
      }
      return;
    }

    /* ---- full tree ---- */
    var nv = Math.pow(2, k);
    var gap = (YLEAF - YTOP) / k, rowY = [];
    for (i = 0; i <= k; i++) rowY.push(YTOP + gap * i);
    var complete = (k <= 3);
    var realTop = complete ? k - 1 : 2;
    var showGhosts = !complete && (state.overlay || k !== 4);

    // edges between real internal levels
    for (i = 0; i < realTop; i++) {
      for (j = 0; j < Math.pow(2, i); j++) {
        edge(gTree, xAt(i, j), rowY[i], xAt(i + 1, 2 * j), rowY[i + 1]);
        edge(gTree, xAt(i, j), rowY[i], xAt(i + 1, 2 * j + 1), rowY[i + 1]);
      }
    }

    var leaves = [];
    if (complete) {
      for (j = 0; j < Math.pow(2, k - 1); j++) {
        edge(gTree, xAt(k - 1, j), rowY[k - 1], xAt(k, 2 * j), rowY[k]);
        edge(gTree, xAt(k - 1, j), rowY[k - 1], xAt(k, 2 * j + 1), rowY[k]);
      }
      for (j = 0; j < nv; j++) leaves.push({ x: xAt(k, j), dots: false });
    } else {
      var sy0 = rowY[2] + 22, sy1 = rowY[2] + Math.min(82, gap * 0.72);
      for (j = 0; j < 8; j++) {
        var px = xAt(2, Math.floor(j / 2)), cx = xAt(3, j);
        gTree.line(lerp(0.06, px, cx), lerp(0.06, sy0, sy1), lerp(0.50, px, cx), lerp(0.50, sy0, sy1))
          .stroke({ color: '#000', width: 1.8 });
        gTree.line(lerp(0.58, px, cx), lerp(0.58, sy0, sy1), lerp(0.94, px, cx), lerp(0.94, sy0, sy1))
          .stroke({ color: '#000', width: 1.6, dasharray: '7,7' });
        var isDots = (j === 5);
        if (!isDots) {
          // true dashed drop-line down to the leaf row (omitted-level cue)
          gTree.line(cx, sy1 + 16, cx, rowY[k] - 28)
            .stroke({ color: '#000', width: 1.7, dasharray: '6,6', linecap: 'butt' });
        }
        leaves.push({ x: cx, dots: isDots });
      }
      // omitted (ghost) levels 3 .. k-1
      if (showGhosts) {
        for (i = 3; i <= k - 1; i++) {
          if (state.active === i) band(rowY[i], true); else if (state.overlay) band(rowY[i], false);
          var gcol = state.active === i ? ACCENT_DK : GHOST;
          for (j = 0; j < 8; j++) gTree.circle(10).center(xAt(3, j), rowY[i]).fill(gcol).opacity(0.8);
        }
      }
    }

    // band highlights for real levels + leaf level
    for (i = 0; i <= realTop; i++) {
      if (state.active === i) band(rowY[i], true); else if (state.overlay) band(rowY[i], false);
    }
    if (state.active === k) band(rowY[k], true); else if (state.overlay) band(rowY[k], false);

    // internal cost nodes
    for (i = 0; i <= realTop; i++) {
      for (j = 0; j < Math.pow(2, i); j++) {
        (function (i2, j2) {
          node(gTree, costLabel(i2), xAt(i2, j2), rowY[i2], {
            accent: state.active === i2, tip: levelTip(i2, 'level'),
            onClick: function () { setActive(i2); }
          });
        })(i, j);
      }
    }

    // leaves
    leaves.forEach(function (L) {
      if (L.dots) { ellipsisH(gTree, L.x, rowY[k]); return; }
      node(gTree, 'c', L.x, rowY[k], {
        accent: state.active === k, tip: levelTip(k, 'leaf'),
        onClick: function () { setActive(k); }
      });
    });

    // brace + n
    var bx1 = leaves[0].x - 30, bx2 = leaves[leaves.length - 1].x + 30;
    brace(gTree, bx1, bx2, rowY[k] + 38, 16);
    txt(gTree, 'n', (bx1 + bx2) / 2, rowY[k] + 94, FS);
    if (state.overlay) txt(gTree, '= ' + nv, (bx1 + bx2) / 2 + 42, rowY[k] + 94, 20, { fill: ACCENT_DK, upright: true, anchor: 'start' });
    hit(gTree, (bx1 + bx2) / 2, rowY[k] + 68, bx2 - bx1, 76,
      'The bottom row holds n = ' + nv + ' leaves, each of cost c \u2192 cn total', function () { setActive(k); });

    // lg n arrow (label sits to the LEFT of the shaft)
    vArrow(gTree, 112, rowY[0] - 16, rowY[k] + 18);
    var ly = (rowY[0] + rowY[k]) / 2;
    gTree.rect(92, 58).center(58, ly).fill('#fff');
    txt(gTree, 'lg', 62, ly, FS, { anchor: 'end', upright: true });
    txt(gTree, 'n', 70, ly, FS, { anchor: 'start' });
    if (state.overlay) txt(gTree, '= ' + k, 58, ly + 36, 20, { fill: ACCENT_DK, upright: true });
    hit(gTree, 78, ly, 110, rowY[k] - rowY[0] + 40,
      'Tree height = lg n = ' + k + ', so there are lg n + 1 = ' + (k + 1) + ' levels', null);

    // right-hand cost column
    for (i = 0; i <= realTop; i++) {
      costRow(i, rowY[i], xAt(i, Math.pow(2, i) - 1) + halfW(costLabel(i), FS) + 26, 'level');
    }
    if (!complete) {
      if (showGhosts) { for (i = 3; i <= k - 1; i++) costRow(i, rowY[i], 930, 'ghost'); }
      else {
        var my = (rowY[2] + rowY[k]) / 2;
        ellipsisV(gTree, COLX, my);
        hit(gTree, COLX, my, 120, 120, 'The levels between are omitted — each of them also costs cn', null);
      }
    }
    costRow(k, rowY[k], leaves[leaves.length - 1].x + 30, 'leaf');

    // rule + total
    gTree.line(1050, 896, 1212, 896).stroke({ color: '#000', width: 2 });
    txt(gTree, 'Total:', 958, 950, 29, { anchor: 'end', upright: true });
    txt(gTree, 'cn lg n + cn', 970, 950, 29, { anchor: 'start' });
    hit(gTree, 1050, 950, 290, 54,
      (k + 1) + ' levels \u00d7 cn = cn lg n + cn = \u0398(n lg n)', function () {
        showPopup('Adding the column',
          'There are lg n = ' + k + ' internal levels plus one leaf level, and every one of them costs exactly cn. So T(n) = cn\u00b7lg n + cn = \u0398(n lg n).');
      });

    // (d) caption — bottom-left, well clear of the brace label "n"
    txt(gTree, '(d)', 200, 972, 30, { upright: true });
  }

  /* ---------- render ---------- */
  function render() {
    gTree.clear(); gTreeBG.clear();
    for (var i = 0; i < hlRects.length; i++) hlRects[i].opacity(state.stage === i ? 1 : 0);
    drawTree();
    var btn = document.getElementById('stageBtn');
    if (btn) btn.textContent = 'Expand \u25b8 now at ' + stageNames[state.stage];
    var ro = document.getElementById('readout');
    if (ro) {
      var nv = Math.pow(2, state.k);
      ro.innerHTML = '<i>n</i> = ' + nv + ' &middot; lg <i>n</i> = ' + state.k + ' &middot; levels = lg <i>n</i> + 1 = ' + (state.k + 1) +
        ' &middot; each level costs <i>cn</i> &rarr; total = ' + (state.k + 1) + '<i>cn</i>';
    }
  }

  /* ---------- controls ---------- */
  function setStage(s) { state.stage = s; state.active = -1; hidePopup(); render(); }
  window.setStage = setStage;
  window.trigger_expandStage = function () { setStage((state.stage + 1) % 4); };
  window.update_problemSize = function (v) { state.k = Math.round(v); state.active = -1; hidePopup(); render(); };
  window.toggle_levelCosts = function (on) { state.overlay = !!on; render(); };

  /* ---------- demo player ---------- */
  var steps = [
    { title: 'The printed figure', narration: 'Recursion tree for T(n) = 2T(n/2) + cn. Stages (a)\u2013(c) show the substitution unfolding; (d) is the finished tree. Use the controls, or step through the guided tour.', state: { expandStage: '(d) full tree', levelCosts: 'off', problemSize: 16 } },
    { title: 'Start with the recurrence', narration: 'The figure begins with a single unresolved term, T(n), for merge sort\u2019s running time defined by T(n) = 2T(n/2) + cn.', state: { expandStage: '(a) T(n)', levelCosts: 'off', problemSize: 16 } },
    { title: 'One split', narration: 'Replace T(n) by its definition: a root of cost cn with two children that are still unresolved, T(n/2) and T(n/2).', state: { expandStage: '(b) one split', levelCosts: 'off', problemSize: 16 } },
    { title: 'Split again', narration: 'Apply the same substitution to each T(n/2). The two children become cost nodes cn/2, each spawning two T(n/4) terms \u2014 the pattern is self-similar.', state: { expandStage: '(c) two splits', levelCosts: 'off', problemSize: 16 } },
    { title: 'The full tree', narration: 'Continue until every leaf is a base case of cost c. There are n leaves across the bottom, and the height marker on the left reads lg n.', state: { expandStage: '(d) full tree', levelCosts: 'off', problemSize: 16 } },
    { title: 'Every level costs cn', narration: 'Turn on the level-cost overlay: level i has 2^i nodes of cost cn/2^i, so each row sums to exactly cn. The omitted levels appear as grey rows \u2014 they each cost cn too.', state: { expandStage: '(d) full tree', levelCosts: 'on', problemSize: 16 } },
    { title: 'Change n and watch the height', narration: 'Grow n to 64: the tree gains levels (two more grey rows appear, each worth cn) while the left arrow still reads lg n. Slide down to n = 8 or 4 to see the whole tree drawn out.', state: { expandStage: '(d) full tree', levelCosts: 'on', problemSize: 64 } },
    { title: 'Add the column', narration: 'With lg n levels of internal cost cn plus the leaf level of cost cn, the total is cn lg n + cn = \u0398(n lg n).', state: { expandStage: '(d) full tree', levelCosts: 'on', problemSize: 32 } }
  ];
  var cur = 0;

  function applyStep(idx) {
    cur = Math.max(0, Math.min(steps.length - 1, idx));
    var st = steps[cur].state;
    state.stage = stageNames.indexOf(st.expandStage);
    var k = Math.round(Math.log(st.problemSize) / Math.LN2);
    state.k = k;
    document.getElementById('problemSizeInput').value = k;
    document.getElementById('problemSizeVal').value = st.problemSize;
    state.overlay = (st.levelCosts === 'on');
    document.getElementById('levelCostsInput').checked = state.overlay;
    state.active = -1;
    hidePopup();
    document.getElementById('demoNarration').innerHTML = '<b>' + steps[cur].title + '</b><br>' + steps[cur].narration;
    document.getElementById('stepLabel').textContent = cur === 0 ? 'overview' : ('step ' + cur + ' / ' + (steps.length - 1));
    render();
  }
  window.nextStep = function () { applyStep(cur + 1); };
  window.prevStep = function () { applyStep(cur - 1); };

  drawTop();
  applyStep(0);
  window.__markRendered();
})();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees

    _autoUiLayout();
  </script>
