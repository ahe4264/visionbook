<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<b style="font-size:12px">Hashing with chaining</b>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.45;min-height:64px;background:#fff;border:1px solid #e2e5e9;border-radius:4px;padding:6px 7px"></span>
<span style="display:flex;gap:4px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="flex:1;text-align:center;font-size:11px"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label><input id="annotationsInput" type="checkbox" onchange="toggle_annotations(this.checked)"> Show numeric detail (key values, slot indices, α)</label>
<label>Table size m (slots): <output id="tableSizeVal">10</output>
  <input id="tableSizeInput" type="range" min="4" max="16" step="1" value="10" oninput="document.getElementById('tableSizeVal').value=this.value;update_tableSize(+this.value)">
</label>
<label>Actual keys (values of k₁…k₈)
  <input id="hashCodeInput" value="11, 25, 17, 41, 15, 28, 35, 18">
</label>
<span style="font-size:11px"><b>Define h and insert every key</b> — API: <code>m()</code>, <code>insert(k,i)</code>, <code>chainLength(i)</code>, <code>note(msg)</code>; entry point <code>hashAll(keys)</code></span>
<span style="display:flex;gap:3px;flex-wrap:wrap">
  <button id="tab-sample" onclick="setTab('sample')">Sample</button>
  <button id="tab-buggy" onclick="setTab('buggy')">Buggy</button>
  <button id="tab-bad" onclick="setTab('bad')">h(k)=0</button>
  <button id="tab-blank" onclick="setTab('blank')">Blank</button>
</span>
<textarea id="hashCodeCode" spellcheck="false"></textarea>
<span style="display:flex;gap:6px;align-items:center">
  <button id="runBtn" onclick="trigger_hashCode()">▶ Run</button>
  <span id="runStatus" style="font-size:11px;color:#666">not run</span>
</span>
<span style="display:flex;gap:3px;align-items:center">
  <button onclick="pbFirst()" title="first">⏮</button>
  <button onclick="pbPrev()" title="previous">◀</button>
  <button id="playBtn" onclick="pbPlay()" title="play / pause">▶</button>
  <button onclick="pbNext()" title="next">▶|</button>
  <span id="frameCounter" style="font-size:11px;color:#555">0 of 0</span>
</span>
<label>Replay speed: <output id="speedVal">1.00</output>×
  <input id="speedInput" type="range" min="0.25" max="4" step="0.25" value="1" oninput="document.getElementById('speedVal').value=(+this.value).toFixed(2)">
</label>
<span id="frameCaption" style="display:block;font-size:11px;min-height:28px;color:#222"></span>
<span id="runLog" style="display:block;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:10px;line-height:1.35;max-height:110px;overflow:auto;background:#fff;border:1px solid #e2e5e9;border-radius:4px;padding:5px"></span>
<span style="font-size:10px;color:#666">Click a slot, a key dot, or a chain node to light up one collision set; click the background to clear.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();

  update_tableSize(v);
}

var SAMPLES = {
  sample: 'function hashAll(keys) {\n  for (const k of keys) {\n    const i = k % m();        // division method\n    note("h(" + k + ") = " + i);\n    insert(k, i);\n  }\n}',
  buggy: 'function hashAll(keys) {\n  for (const k of keys) {\n    // BUG: table size hardcoded as 10 instead of m(),\n    // so slots go out of range (or are never used) when m changes\n    const i = k % 10;\n    insert(k, i);\n  }\n}',
  bad: 'function hashAll(keys) {\n  // A legal but terrible hash: everything to slot 0\n  for (const k of keys) {\n    insert(k, 0);\n  }\n}',
  blank: 'function hashAll(keys) {\n  // your hash function here\n  // available: m(), insert(k, i), chainLength(i), note(msg)\n  for (const k of keys) {\n\n  }\n}'
};
function setTab(name) {
  document.getElementById('hashCodeCode').value = SAMPLES[name] || SAMPLES.blank;
  ['sample', 'buggy', 'bad', 'blank'].forEach(function (t) {
    var b = document.getElementById('tab-' + t); if (b) b.className = (t === name ? 'active' : '');
  });
}

/* ---------- sandboxed runner ---------- */
var WORKER_SRC = [
  'self.onmessage = function(ev){',
  '  var d = ev.data, m = d.m, keys = d.keys, code = d.code;',
  '  var chains = []; for (var i=0;i<m;i++) chains.push([]);',
  '  var frames = [], ops = 0, t0 = Date.now(), used = [];',
  '  function copy(){ var c=[]; for(var a=0;a<chains.length;a++){ var r=[]; for(var b=0;b<chains[a].length;b++){ var n=chains[a][b]; r.push({label:n.label,value:n.value,kIdx:n.kIdx}); } c.push(r);} return c; }',
  '  function push(kind, idx, msg, kIdx){ frames.push({kind:kind,state:{m:m,chains:copy()},indices:idx,message:msg,kIdx:(kIdx==null?-1:kIdx)}); if(frames.length>300) throw new Error("__CAP__frame cap (300) reached \u2014 is your loop terminating?"); }',
  '  function guard(){ ops++; if(ops>3000) throw new Error("__CAP__operation cap (3000) reached"); if(Date.now()-t0>1500) throw new Error("__CAP__time limit exceeded \u2014 infinite loop?"); }',
  '  function labelFor(k){ for(var i=0;i<keys.length;i++){ if(!used[i] && keys[i]===k){ used[i]=1; return {label:d.labels[i], kIdx:i}; } } return {label:String(k), kIdx:-1}; }',
  '  var api = {',
  '    m: function(){ guard(); return m; },',
  '    chainLength: function(i){ guard(); var ii=Number(i); if(!isFinite(ii)||Math.floor(ii)!==ii||ii<0||ii>=m) throw new Error("chainLength("+i+"): slot out of range 0.."+(m-1)); return chains[ii].length; },',
  '    note: function(msg){ guard(); push("note", [], String(msg), -1); },',
  '    insert: function(k, i){ guard();',
  '      var kk=Number(k); if(!isFinite(kk)) throw new Error("insert("+k+", "+i+"): key must be a number");',
  '      var ii=Number(i); if(!isFinite(ii)||Math.floor(ii)!==ii) throw new Error("insert("+kk+", "+i+"): slot must be an integer");',
  '      if(ii<0||ii>=m) throw new Error("insert("+kk+", "+ii+"): slot out of range 0.."+(m-1)+"   (m() = "+m+")");',
  '      var L=labelFor(kk); chains[ii].unshift({label:L.label,value:kk,kIdx:L.kIdx});',
  '      push("insert",[ii], L.label+" = "+kk+"  \u2192  slot "+ii+"   (chain length now "+chains[ii].length+")", L.kIdx);',
  '      return ii; }',
  '  };',
  '  if (Object.freeze) Object.freeze(api);',
  '  var entry=null, err=null;',
  '  try {',
  '    var factory = new Function("api", "\'use strict\'; var m=api.m, insert=api.insert, chainLength=api.chainLength, note=api.note;\\n" + code + "\\nreturn (typeof hashAll===\'function\') ? hashAll : null;");',
  '    entry = factory(api);',
  '  } catch(e){ err = "Syntax error: " + ((e&&e.message)?e.message:e); }',
  '  if(!err && !entry) err = "entry point hashAll(keys) not found \u2014 define  function hashAll(keys) { ... }";',
  '  if(!err){ try { entry(keys.slice()); } catch(e){ var msg=(e&&e.message)?e.message:String(e); if(msg.indexOf("__CAP__")===0) msg=msg.slice(7); err = msg; } }',
  '  if(err){ try{ push("error", [], "\u26d4 " + err, -1); }catch(e2){} }',
  '  else { push("done", [], "done \u2014 " + keys.length + " key(s) processed", -1); }',
  '  self.postMessage({frames:frames, error:err});',
  '};'
].join('\n');

function evaluateRun(finalChains, err) {
  if (err) return { cls: '#c62828', text: '\u26d4 error \u2014 see caption', bad: [] };
  var seen = {}, extra = 0, i, j;
  for (i = 0; i < finalChains.length; i++) for (j = 0; j < finalChains[i].length; j++) {
    var n = finalChains[i][j];
    if (n.kIdx >= 0) seen[n.kIdx] = (seen[n.kIdx] || 0) + 1; else extra++;
  }
  var missing = [], dup = [];
  for (i = 0; i < S.keys.length; i++) if (!seen[i]) missing.push(i);
  for (var k in seen) if (seen[k] > 1) dup.push(+k);
  if (missing.length) return { cls: '#c62828', text: '\u2717 not stored: ' + missing.map(function (i) { return plain(i); }).join(', '), bad: missing };
  if (dup.length) return { cls: '#c62828', text: '\u2717 stored twice: ' + dup.map(function (i) { return plain(i); }).join(', '), bad: dup };
  if (extra) return { cls: '#c62828', text: '\u2717 ' + extra + ' key(s) inserted that are not in the input', bad: [] };
  var occ = 0, maxL = 0;
  for (i = 0; i < finalChains.length; i++) { if (finalChains[i].length) occ++; maxL = Math.max(maxL, finalChains[i].length); }
  if (finalChains.length > 1 && occ === 1 && S.keys.length > 1)
    return { cls: '#b26a00', text: '\u2713 stored \u2014 but all ' + S.keys.length + ' in ONE chain: \u0398(n) search', bad: [] };
  return { cls: '#1b7a30', text: '\u2713 correct \u2014 ' + S.keys.length + ' keys, longest chain ' + maxL, bad: [] };
}

function trigger_hashCode(autoplay, cb) {
  if (FR.running) return;
  autoplay = (autoplay === undefined) ? true : autoplay;
  stopPlay();
  S.keys = parseKeys();
  S.m = +document.getElementById('tableSizeInput').value;
  S.highlight = null; S.bad = null;
  var code = document.getElementById('hashCodeCode').value;
  var labels = S.keys.map(function (v, i) { return klabel(i); });
  var btn = document.getElementById('runBtn');
  FR.running = true; btn.disabled = true;
  setStatus('#1565c0', 'running\u2026');
  var url = null, w = null, done = false, timer = 0;
  function finish() { if (timer) clearTimeout(timer); FR.running = false; btn.disabled = false; if (url) URL.revokeObjectURL(url); }
  try {
    url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    w = new Worker(url);
  } catch (e) {
    finish(); setStatus('#c62828', '\u26d4 sandbox unavailable: ' + e.message); return;
  }
  timer = setTimeout(function () {
    if (done) return; done = true; w.terminate(); finish();
    FR.frames = [{ kind: 'error', state: { m: S.m, chains: defaultChainsEmpty(S.m) }, indices: [], message: '\u26d4 timed out (2 s) \u2014 worker terminated. Infinite loop?', kIdx: -1 }];
    setFrame(0); setStatus('#c62828', '\u26d4 timeout');
  }, 2000);
  w.onerror = function (e) {
    if (done) return; done = true; w.terminate(); finish();
    setStatus('#c62828', '\u26d4 ' + (e.message || 'worker error'));
  };
  w.onmessage = function (ev) {
    if (done) return; done = true; w.terminate(); finish();
    var res = ev.data;
    FR.frames = res.frames || [];
    if (!FR.frames.length) { setStatus('#c62828', '\u26d4 no frames produced'); return; }
    var last = FR.frames[FR.frames.length - 1].state.chains;
    var verdict = evaluateRun(last, res.error);
    setStatus(verdict.cls, verdict.text);
    S.bad = verdict.bad && verdict.bad.length ? verdict.bad : null;
    if (autoplay) { setFrame(0); pbPlay(); } else { setFrame(FR.frames.length - 1); }
    if (typeof cb === 'function') cb();
  };
  w.postMessage({ m: S.m, keys: S.keys.slice(), code: code, labels: labels });
}
function defaultChainsEmpty(m) { var c = []; for (var i = 0; i < m; i++) c.push([]); return c; }

/* ---------- playback ---------- */
function setFrame(i) {
  if (!FR.frames.length) return;
  FR.i = Math.max(0, Math.min(FR.frames.length - 1, i));
  var f = FR.frames[FR.i];
  S.m = f.state.m; S.chains = f.state.chains;
  S.flashSlot = (f.indices && f.indices.length) ? f.indices[0] : -1;
  S.flashK = (f.kIdx == null ? -1 : f.kIdx);
  document.getElementById('frameCounter').textContent = (FR.i + 1) + ' of ' + FR.frames.length;
  document.getElementById('frameCaption').textContent = f.message || '';
  var lines = [];
  for (var j = 0; j <= FR.i; j++) lines.push((j + 1) + '. ' + FR.frames[j].message);
  var lg = document.getElementById('runLog');
  lg.textContent = lines.join('\n'); lg.scrollTop = lg.scrollHeight;
  render();
}
function stopPlay() {
  if (FR.timer) { clearInterval(FR.timer); FR.timer = 0; }
  FR.playing = false;
  var b = document.getElementById('playBtn'); if (b) b.textContent = '\u25b6';
}
function pbPlay() {
  if (!FR.frames.length) return;
  if (FR.playing) { stopPlay(); return; }
  if (FR.i >= FR.frames.length - 1) setFrame(0);
  FR.playing = true; document.getElementById('playBtn').textContent = '\u23f8';
  var sp = +document.getElementById('speedInput').value || 1;
  FR.timer = setInterval(function () {
    if (FR.i >= FR.frames.length - 1) { stopPlay(); return; }
    setFrame(FR.i + 1);
  }, Math.max(90, 750 / sp));
}
function pbFirst() { stopPlay(); setFrame(0); }
function pbPrev() { stopPlay(); setFrame(FR.i - 1); }
function pbNext() { stopPlay(); setFrame(FR.i + 1); }

/* ---------- demo steps ---------- */
var STEPS = [
  {
    t: 'The universe and the actual keys',
    n: 'U holds every key that could ever occur; only the handful in K are really stored. T has far fewer slots than |U|, so some keys must share a slot.',
    go: function () { setAnn(false); setSlider(10); resetFigure(); }
  },
  {
    t: 'Run h(k) = k mod m',
    n: 'The code walks the keys and calls insert(k, k % m()). Each mapping arrow is drawn one at a time; when a second key reaches an occupied slot it is prepended in front of the node already there.',
    go: function () { setAnn(false); setSlider(10); setTab('sample'); trigger_hashCode(true); }
  },
  {
    t: 'A collision is just a longer list',
    n: 'One slot ends up with three keys and a three-node doubly linked chain; another holds one; the rest stay NIL. Chaining never rejects a key — it only lengthens a list. (Numeric detail is on: slot indices, key values, α.)',
    go: function () { setAnn(true); setSlider(10); setTab('sample'); trigger_hashCode(false, function () { setHighlight(5); }); }
  },
  {
    t: 'Shrink the table',
    n: 'Drop m to 5 and re-run: the same eight keys crowd into fewer slots, chains roughly double and α = n/m jumps — search cost follows chain length, not table size.',
    go: function () { setAnn(true); setSlider(5); setTab('sample'); trigger_hashCode(true); }
  },
  {
    t: 'A bad hash function',
    n: 'Load a hash that returns 0 for everything (or the Buggy tab with m ≠ 10): every key funnels into one slot and the table degenerates into a single linked list with Θ(n) search. Fix h and the chains flatten again.',
    go: function () { setAnn(false); setSlider(10); setTab('bad'); trigger_hashCode(true); }
  }
];
var stepIdx = 0;
function setStep(i) {
  stepIdx = Math.max(0, Math.min(STEPS.length - 1, i));
  var s = STEPS[stepIdx];
  document.getElementById('demoNarration').innerHTML = '<b>' + s.t + '</b><br>' + s.n;
  document.getElementById('stepLabel').textContent = 'step ' + (stepIdx + 1) + ' / ' + STEPS.length;
  s.go();
}
function nextStep() { setStep(stepIdx + 1); }
function prevStep() { setStep(stepIdx - 1); }
