<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<strong id="stepTitle" style="font-size:12.5px;color:#222"></strong>
<p id="demoNarration" style="margin:0;font-size:11.5px;line-height:1.45;color:#333"></p>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;color:#555"></span>
  <button onclick="nextStep()">▶</button>
</span>
<span style="height:1px;background:#e0e3e7;display:block;margin:4px 0"></span>
<label>Probability threshold: <output id="thresholdVal">0.50</output>
  <input id="thresholdInput" type="range" min="0.05" max="0.95" step="0.01" value="0.5"
         oninput="document.getElementById('thresholdVal').value=this.value;update_threshold(+this.value)">
</label>
<label><input id="decisionRegionsInput" type="checkbox" onchange="toggle_decisionRegions(this.checked)"> Show decision regions</label>
<span style="font-size:10.5px;color:#666;line-height:1.4">Drag inside the plot to slide the orange marker along the curve. Hover the curve for values; click the curve or the threshold line for an explanation.</span>
<button onclick="trigger_reset()">↺ Reset to step 1</button>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
const SERIF = "Georgia,'Times New Roman',Times,serif";
const C_ORANGE = '#d9795a';
const C_BLUE = '#4a6fa5';
const C_GUIDE = '#bdbdbd';
const TARGET_AR = 1.45;   /* plot-area width / height, matching the source figure */

function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
function logitOf(p) { return Math.log(p / (1 - p)); }
function clampN(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

const figState = {
  threshold: 0.5,
  regions: false,
  showThreshold: false,
  markerZ: 0,
  showMarker: false,
  showReadout: false
};

const figCanvas = document.createElement('canvas');
figCanvas.style.cssText = 'width:100%;height:100%;display:block';
document.getElementById('container').appendChild(figCanvas);

const curvePts = [];
for (let i = 0; i <= 400; i++) { const z = -5 + 10 * i / 400; curvePts.push({ x: z, y: sigmoid(z) }); }

function fontOf(chart) { return chart.$f || Math.max(10, Math.min(24, Math.min(chart.width, chart.height) * 0.055)); }
function baseS(chart) {
  const a = chart.chartArea;
  if (!a) return Math.min(chart.width, chart.height);
  return Math.min(a.right - a.left, a.bottom - a.top);
}

/* ---------- text helpers ---------- */
function runsWidth(ctx, runs, size) {
  let w = 0;
  for (const r of runs) { ctx.font = (r[1] ? 'italic ' : '') + size + 'px ' + SERIF; w += ctx.measureText(r[0]).width; }
  return w;
}
function drawRuns(ctx, runs, x, y, size, color, halo) {
  let cx = x;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const r of runs) {
    ctx.font = (r[1] ? 'italic ' : '') + size + 'px ' + SERIF;
    if (halo) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size * 0.34); ctx.strokeStyle = '#fff'; ctx.strokeText(r[0], cx, y); }
    ctx.fillStyle = color; ctx.fillText(r[0], cx, y);
    cx += ctx.measureText(r[0]).width;
  }
  return cx - x;
}
function haloText(ctx, txt, x, y, size, color, align) {
  ctx.font = size + 'px ' + SERIF;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size * 0.36); ctx.strokeStyle = '#fff';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color; ctx.fillText(txt, x, y);
}

/* ---------- collision helpers (labels are boxes checked against the curve) ---- */
function rectsOverlap(a, b) {
  return !(a.x1 < b.x0 || b.x1 < a.x0 || a.y1 < b.y0 || b.y1 < a.y0);
}
function curveHitsRect(chart, r, padPx) {
  const x = chart.scales.x, y = chart.scales.y;
  const p = padPx || 0;
  const n = 24;
  for (let i = 0; i <= n; i++) {
    const px = r.x0 + (r.x1 - r.x0) * i / n;
    const z = x.getValueForPixel(px);
    if (z < -5 || z > 5) continue;
    const cy = y.getPixelForValue(sigmoid(z));
    if (cy >= r.y0 - p && cy <= r.y1 + p) return true;
  }
  return false;
}
function pickPlacement(chart, cands, avoid, padPx) {
  for (let i = 0; i < cands.length; i++) {
    const r = cands[i];
    let bad = curveHitsRect(chart, r, padPx);
    if (!bad && avoid) for (let k = 0; k < avoid.length; k++) if (rectsOverlap(r, avoid[k])) { bad = true; break; }
    if (!bad) return r;
  }
  return cands[cands.length - 1];
}

/* ---------- background layer ---------- */
const bgPlugin = {
  id: 'figBg',
  beforeDatasetsDraw(chart) {
    const a = chart.chartArea; if (!a) return;
    const ctx = chart.ctx, x = chart.scales.x, y = chart.scales.y, S = baseS(chart);
    ctx.save();
    ctx.beginPath(); ctx.rect(a.left, a.top, a.right - a.left, a.bottom - a.top); ctx.clip();

    if (figState.regions) {
      const zs = clampN(logitOf(figState.threshold), -5, 5);
      const px = x.getPixelForValue(zs);
      ctx.fillStyle = 'rgba(74,111,165,0.10)';
      ctx.fillRect(a.left, a.top, px - a.left, a.bottom - a.top);
      ctx.fillStyle = 'rgba(217,121,86,0.12)';
      ctx.fillRect(px, a.top, a.right - px, a.bottom - a.top);
    }

    /* dotted guides through (0, 0.5) — as in the source figure */
    ctx.setLineDash([1.6, 3.6]);
    ctx.lineWidth = Math.max(1, S * 0.0045);
    ctx.strokeStyle = C_GUIDE;
    const gx = x.getPixelForValue(0), gy = y.getPixelForValue(0.5);
    ctx.beginPath();
    ctx.moveTo(a.left, gy); ctx.lineTo(gx, gy);
    ctx.moveTo(gx, a.bottom); ctx.lineTo(gx, gy);
    ctx.stroke();

    if (figState.showThreshold) {
      const ty = y.getPixelForValue(figState.threshold);
      ctx.setLineDash([7, 5]);
      ctx.strokeStyle = C_BLUE;
      ctx.lineWidth = Math.max(1.4, S * 0.006);
      ctx.beginPath(); ctx.moveTo(a.left, ty); ctx.lineTo(a.right, ty); ctx.stroke();

      const zs = clampN(logitOf(figState.threshold), -5, 5);
      const px = x.getPixelForValue(zs);
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#7488a6';
      ctx.beginPath(); ctx.moveTo(px, ty); ctx.lineTo(px, a.bottom); ctx.stroke();
    }
    ctx.restore();
  }
};

/* ---------- foreground layer ---------- */
const fgPlugin = {
  id: 'figFg',
  afterDatasetsDraw(chart) {
    const a = chart.chartArea; if (!a) return;
    const ctx = chart.ctx, x = chart.scales.x, y = chart.scales.y;
    const S = baseS(chart), f = fontOf(chart);
    const W = a.right - a.left, H = a.bottom - a.top;
    const halfStroke = (chart.data.datasets[0].borderWidth || 4) / 2;
    ctx.save();

    /* tick marks (major at -5/0/5 and 0.0/1.0, minor elsewhere) */
    ctx.strokeStyle = '#222';
    ctx.lineWidth = Math.max(1, S * 0.005);
    ctx.setLineDash([]);
    for (let i = -5; i <= 5; i++) {
      const px = x.getPixelForValue(i);
      const L = (i === -5 || i === 0 || i === 5) ? S * 0.028 : S * 0.015;
      ctx.beginPath(); ctx.moveTo(px, a.bottom); ctx.lineTo(px, a.bottom + L); ctx.stroke();
    }
    for (let i = 0; i <= 10; i++) {
      const v = i / 10, py = y.getPixelForValue(v);
      const L = (i === 0 || i === 10) ? S * 0.028 : S * 0.015;
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.left - L, py); ctx.stroke();
    }

    /* heavy black frame */
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(1.8, S * 0.008);
    ctx.strokeRect(a.left, a.top, W, H);

    /* axis titles, drawn manually so 'z' can be italic and large */
    const tf = f * 1.55;
    const xRuns = [['z', true]];
    const wx = runsWidth(ctx, xRuns, tf);
    drawRuns(ctx, xRuns, a.left + W / 2 - wx / 2, a.bottom + f * 3.15 + tf * 0.1, tf, '#000', false);

    const yRuns = [['sig[', false], ['z', true], [']', false]];
    const wy = runsWidth(ctx, yRuns, tf);
    ctx.save();
    ctx.translate(a.left - f * 3.1, a.top + H / 2);
    ctx.rotate(-Math.PI / 2);
    drawRuns(ctx, yRuns, -wy / 2, 0, tf, '#000', false);
    ctx.restore();

    /* ---- formula 1 / (1 + exp[-z]) as a stacked fraction, kept off the curve ---- */
    const ff = Math.min(f * 1.28, W * 0.080, H * 0.118);
    const den = [['1+exp[\u2212', false], ['z', true], [']', false]];
    const wDen = runsWidth(ctx, den, ff);
    const padF = ff * 0.22;
    const ruleY = a.top + H * 0.135;
    const minCx = a.left + wDen / 2 + padF + 4;
    const maxCx = a.right - wDen / 2 - padF - 4;
    let cx = clampN(a.left + W * 0.365, minCx, maxCx);
    const boxAt = function (c) {
      return {
        x0: c - wDen / 2 - padF, x1: c + wDen / 2 + padF,
        y0: ruleY - ff * 1.55, y1: ruleY + ff * 1.35
      };
    };
    let fracBox = boxAt(cx);
    let guard = 0;
    while (curveHitsRect(chart, fracBox, halfStroke + ff * 0.18) && guard++ < 60 && cx > minCx) {
      cx = Math.max(minCx, cx - W * 0.012);
      fracBox = boxAt(cx);
    }
    ctx.font = ff + 'px ' + SERIF;
    const w1 = ctx.measureText('1').width;
    drawRuns(ctx, [['1', false]], cx - w1 / 2, ruleY - ff * 0.33, ff, '#111', true);
    drawRuns(ctx, den, cx - wDen / 2, ruleY + ff * 1.02, ff, '#111', true);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = Math.max(1, ff * 0.065);
    ctx.beginPath();
    ctx.moveTo(cx - wDen / 2 - ff * 0.10, ruleY);
    ctx.lineTo(cx + wDen / 2 + ff * 0.10, ruleY);
    ctx.stroke();

    const occupied = [fracBox];

    /* ---- threshold annotations ---- */
    if (figState.showThreshold) {
      const ty = y.getPixelForValue(figState.threshold);
      const zs = clampN(logitOf(figState.threshold), -5, 5);
      const px = x.getPixelForValue(zs);
      const lf = f * 0.84;
      const gap = lf * 0.45, pad = S * 0.025;

      const tTxt = 'threshold = ' + figState.threshold.toFixed(2);
      ctx.font = lf + 'px ' + SERIF;
      const tw = ctx.measureText(tTxt).width, th = lf * 1.15;
      const xL = a.left + pad, xR = a.right - pad - tw;
      const cands = [];
      const pushC = function (x0, yTop) {
        cands.push({ x0: x0, x1: x0 + tw, y0: yTop, y1: yTop + th });
      };
      if (zs > 0) { /* left half is empty when the cutoff is high */
        pushC(xL, ty - gap - th); pushC(xL, ty + gap);
        pushC(xR, ty + gap); pushC(xR, ty - gap - th);
      } else {
        pushC(xR, ty - gap - th); pushC(xR, ty + gap);
        pushC(xL, ty - gap - th); pushC(xL, ty + gap);
      }
      const tp = pickPlacement(chart, cands, occupied, halfStroke + 2);
      haloText(ctx, tTxt, tp.x0, tp.y1 - lf * 0.22, lf, C_BLUE, 'left');
      occupied.push(tp);

      /* z* label near the foot of the drop line */
      const zr = [['z', true], ['* = ' + zs.toFixed(2), false]];
      const wz = runsWidth(ctx, zr, lf);
      const zyTop = a.bottom - S * 0.045 - lf;
      const zc = [];
      const zRight = { x0: px + S * 0.022, x1: px + S * 0.022 + wz, y0: zyTop, y1: zyTop + th };
      const zLeft = { x0: px - S * 0.022 - wz, x1: px - S * 0.022, y0: zyTop, y1: zyTop + th };
      if (zs <= 0) { zc.push(zRight, zLeft); } else { zc.push(zLeft, zRight); }
      let zp = pickPlacement(chart, zc, occupied, halfStroke + 1);
      zp = { x0: clampN(zp.x0, a.left + 4, a.right - wz - 4), y0: zp.y0, y1: zp.y1 };
      drawRuns(ctx, zr, zp.x0, zp.y1 - lf * 0.22, lf, '#54657f', true);
      occupied.push({ x0: zp.x0, x1: zp.x0 + wz, y0: zp.y0, y1: zp.y1 });
    }

    /* ---- decision-region legends, placed in open whitespace ---- */
    if (figState.regions) {
      const lf = f * 0.88;
      const zs = clampN(logitOf(figState.threshold), -5, 5);
      const pxs = x.getPixelForValue(zs);
      ctx.font = lf + 'px ' + SERIF;
      const place = function (txt, zMid, ys, color) {
        const w = ctx.measureText(txt).width, h = lf * 1.15;
        const cxp = x.getPixelForValue(zMid);
        const cands = [];
        for (let i = 0; i < ys.length; i++) {
          const yp = y.getPixelForValue(ys[i]);
          cands.push({ x0: cxp - w / 2, x1: cxp + w / 2, y0: yp - h * 0.8, y1: yp + h * 0.35 });
        }
        const p = pickPlacement(chart, cands, occupied, halfStroke + 2);
        const px0 = clampN(p.x0, a.left + 4, a.right - w - 4);
        haloText(ctx, txt, px0 + w / 2, p.y1 - lf * 0.2, lf, color, 'center');
        occupied.push({ x0: px0, x1: px0 + w, y0: p.y0, y1: p.y1 });
      };
      if (pxs - a.left > lf * 4.5) place('predict 0', (-5 + zs) / 2, [0.45, 0.30, 0.62, 0.16], '#3f6394');
      if (a.right - pxs > lf * 4.5) place('predict 1', (zs + 5) / 2, [0.35, 0.52, 0.20, 0.66], '#b4593a');
    }

    /* ---- draggable marker (hidden in the default view) ---- */
    if (figState.showMarker) {
      const mz = clampN(figState.markerZ, -5, 5), mp = sigmoid(mz);
      const dx = x.getPixelForValue(mz), dy = y.getPixelForValue(mp);
      const r = Math.max(3, S * 0.020);
      ctx.beginPath(); ctx.arc(dx, dy, r + Math.max(1.2, S * 0.005), 0, 6.2832);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(dx, dy, r, 0, 6.2832);
      ctx.fillStyle = C_ORANGE; ctx.fill();
      ctx.strokeStyle = '#a8543a'; ctx.lineWidth = Math.max(1, S * 0.003); ctx.stroke();

      if (figState.showReadout) {
        const rf = f * 0.84;
        const l1 = 'z = ' + mz.toFixed(2);
        const l2 = 'sig[z] = ' + mp.toFixed(3);
        ctx.font = rf + 'px ' + SERIF;
        const bw = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) + rf * 0.9;
        const bh = rf * 2.85;
        const off = r + rf * 0.55;
        const opts = [
          { x: dx + off, y: dy + off },
          { x: dx - off - bw, y: dy + off },
          { x: dx + off, y: dy - off - bh },
          { x: dx - off - bw, y: dy - off - bh }
        ];
        let best = null;
        for (let i = 0; i < opts.length; i++) {
          const bx = clampN(opts[i].x, a.left + 3, a.right - bw - 3);
          const by = clampN(opts[i].y, a.top + 3, a.bottom - bh - 3);
          const rct = { x0: bx, x1: bx + bw, y0: by, y1: by + bh };
          let bad = curveHitsRect(chart, rct, halfStroke);
          if (!bad) for (let k = 0; k < occupied.length; k++) if (rectsOverlap(rct, occupied[k])) { bad = true; break; }
          if (!bad) { best = rct; break; }
          if (!best) best = rct;
        }
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.strokeStyle = C_ORANGE; ctx.lineWidth = 1;
        ctx.beginPath();
        if (ctx.roundRect) { ctx.roundRect(best.x0, best.y0, bw, bh, 4); } else { ctx.rect(best.x0, best.y0, bw, bh); }
        ctx.fill(); ctx.stroke();
        haloText(ctx, l1, best.x0 + rf * 0.45, best.y0 + rf * 1.20, rf, '#333', 'left');
        haloText(ctx, l2, best.x0 + rf * 0.45, best.y0 + rf * 2.36, rf, '#333', 'left');
      }
    }
    ctx.restore();
  }
};

/* ---------- sizing: fonts, stroke width, and a source-matched aspect ---------- */
const sizePlugin = {
  id: 'figSizer',
  beforeLayout(chart) {
    const W = chart.width, H = chart.height;
    const f = Math.max(10, Math.min(26, Math.min(W * 0.75, H) * 0.062));
    chart.$f = f;
    chart.options.scales.x.ticks.font.size = f * 1.05;
    chart.options.scales.y.ticks.font.size = f * 1.05;

    /* space reserved by tick labels (chart) + manual axis titles */
    const tickLeft = f * 2.9, tickBottom = f * 2.2;
    let padL = f * 2.2, padR = f * 1.0, padT = f * 0.8, padB = f * 2.3;

    let availW = W - padL - padR - tickLeft;
    let availH = H - padT - padB - tickBottom;
    if (availW > 0 && availH > 0) {
      if (availW / availH > TARGET_AR) {
        const extra = availW - availH * TARGET_AR;
        padL += extra * 0.5; padR += extra * 0.5;
        availW -= extra;
      } else {
        const extra = availH - availW / TARGET_AR;
        padT += extra * 0.3; padB += extra * 0.7;
        availH -= extra;
      }
    }
    chart.options.layout.padding = { left: padL, right: padR, top: padT, bottom: padB };
    chart.data.datasets[0].borderWidth =
      clampN(Math.min(Math.max(availW, 1), Math.max(availH, 1)) * 0.019, 3, 11);
  }
};

const chart = new Chart(figCanvas.getContext('2d'), {
  type: 'line',
  data: {
    datasets: [{
      data: curvePts,
      borderColor: C_ORANGE,
      backgroundColor: 'transparent',
      borderWidth: 5,
      pointRadius: 0,
      pointHitRadius: 0,
      tension: 0,
      borderCapStyle: 'round',
      borderJoinStyle: 'round'
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    events: [],
    layout: { padding: 12 },
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      x: {
        type: 'linear', min: -5, max: 5,
        ticks: {
          stepSize: 5, autoSkip: false, padding: 10, maxRotation: 0,
          color: '#000', font: { size: 15, family: SERIF },
          callback: function (v) {
            if (Math.abs(v + 5) < 1e-6) return '-5.0';
            if (Math.abs(v) < 1e-6) return '0.0';
            if (Math.abs(v - 5) < 1e-6) return '5.0';
            return '';
          }
        },
        grid: { display: false, drawTicks: false, drawOnChartArea: false },
        border: { display: false },
        title: { display: false }
      },
      y: {
        type: 'linear', min: 0, max: 1,
        ticks: {
          stepSize: 1, autoSkip: false, padding: 10,
          color: '#000', font: { size: 15, family: SERIF },
          callback: function (v) {
            if (Math.abs(v) < 1e-6) return '0.0';
            if (Math.abs(v - 1) < 1e-6) return '1.0';
            return '';
          }
        },
        grid: { display: false, drawTicks: false, drawOnChartArea: false },
        border: { display: false },
        title: { display: false }
      }
    }
  },
  plugins: [sizePlugin, bgPlugin, fgPlugin]
});

window.__markRendered();

/* ---------- pointer interaction ---------- */
function figPos(e) {
  const r = figCanvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function inArea(p) {
  const a = chart.chartArea;
  return a && p.x >= a.left - 2 && p.x <= a.right + 2 && p.y >= a.top - 2 && p.y <= a.bottom + 2;
}
function setMarkerFromPixel(px) {
  figState.markerZ = clampN(chart.scales.x.getValueForPixel(px), -5, 5);
  figState.showMarker = true;
  figState.showReadout = true;
  chart.render();
}

let dragging = false, downX = 0, downY = 0, movedAmt = 0;

figCanvas.addEventListener('pointerdown', function (e) {
  const p = figPos(e);
  if (!inArea(p)) return;
  dragging = true; movedAmt = 0; downX = p.x; downY = p.y;
  try { figCanvas.setPointerCapture(e.pointerId); } catch (err) { }
  setMarkerFromPixel(p.x);
});

figCanvas.addEventListener('pointermove', function (e) {
  const p = figPos(e);
  if (dragging) {
    movedAmt = Math.max(movedAmt, Math.abs(p.x - downX) + Math.abs(p.y - downY));
    setMarkerFromPixel(p.x);
    return;
  }
  const a = chart.chartArea;
  if (!a || !inArea(p)) { hideTooltip(); figCanvas.style.cursor = 'default'; return; }
  const x = chart.scales.x, y = chart.scales.y;
  const dz = clampN(x.getValueForPixel(p.x), -5, 5);
  const curveY = y.getPixelForValue(sigmoid(dz));
  const tol = Math.max(7, baseS(chart) * 0.03);
  const mx = x.getPixelForValue(figState.markerZ), my = y.getPixelForValue(sigmoid(figState.markerZ));
  const dDot = figState.showMarker ? Math.hypot(p.x - mx, p.y - my) : 1e9;
  if (dDot < tol * 1.3) {
    figCanvas.style.cursor = 'grab';
    showTooltip('Drag me: z = ' + figState.markerZ.toFixed(2) + ' → sig[z] = ' + sigmoid(figState.markerZ).toFixed(3), e);
  } else if (Math.abs(p.y - curveY) < tol) {
    figCanvas.style.cursor = 'pointer';
    showTooltip('sig[' + dz.toFixed(2) + '] = ' + sigmoid(dz).toFixed(3), e);
  } else if (figState.showThreshold && Math.abs(p.y - y.getPixelForValue(figState.threshold)) < tol * 0.8) {
    figCanvas.style.cursor = 'pointer';
    showTooltip('Threshold ' + figState.threshold.toFixed(2) + '  ⇔  z* = ' + logitOf(figState.threshold).toFixed(2), e);
  } else {
    figCanvas.style.cursor = 'crosshair';
    hideTooltip();
  }
});

figCanvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  if (movedAmt < 4) {
    const p = figPos(e);
    const y = chart.scales.y;
    if (figState.showThreshold && Math.abs(p.y - y.getPixelForValue(figState.threshold)) < Math.max(8, baseS(chart) * 0.03)) {
      showPopup('A probability cutoff is a cutoff in z',
        'Setting a probability threshold p* is the same as setting a score threshold z* = log[p*/(1−p*)]. Because the sigmoid is strictly increasing, "sig[z] ≥ p*" and "z ≥ z*" select exactly the same inputs. Moving the slider slides the vertical boundary along the z axis.');
    } else {
      showPopup('The logistic sigmoid',
        'sig[z] = 1/(1+exp[−z]) maps every real number into the open interval (0,1), so an unbounded score can be read as a probability. It is monotone, symmetric about (0, 0.5), and steepest at z = 0 — far from the origin huge changes in z barely move the output.');
    }
  }
});

figCanvas.addEventListener('pointerleave', function () { hideTooltip(); figCanvas.style.cursor = 'default'; });

document.addEventListener('fig-resize', function () { chart.resize(); });

/* ---------- control handlers ---------- */
function update_threshold(v) {
  figState.threshold = v;
  figState.showThreshold = true;
  const o = document.getElementById('thresholdVal');
  if (o) o.value = Number(v).toFixed(2);
  chart.render();
}
function toggle_decisionRegions(on) {
  figState.regions = on;
  if (on) figState.showThreshold = true;
  chart.render();
}
function trigger_reset() { applyStep(0); }

function setThresholdUI(v) {
  const i = document.getElementById('thresholdInput');
  if (i) i.value = v;
  const o = document.getElementById('thresholdVal');
  if (o) o.value = Number(v).toFixed(2);
  figState.threshold = +v;
}
function setRegionsUI(on) {
  const c = document.getElementById('decisionRegionsInput');
  if (c) c.checked = on;
  figState.regions = on;
}

/* ---------- demo step player ---------- */
const demoSteps = [
  {
    title: 'A curve with two ceilings',
    narration: 'The orange curve never touches 0 or 1 but approaches both. Drag inside the plot to place a marker and slide it toward either edge — large-magnitude scores barely change the probability.',
    apply: function () {
      setThresholdUI(0.5); setRegionsUI(false);
      figState.showThreshold = false;
      figState.markerZ = 0; figState.showMarker = false; figState.showReadout = false;
    }
  },
  {
    title: 'The centre point',
    narration: 'At z = 0 the sigmoid passes through exactly 0.5, where the curve is steepest. This is the point of maximum sensitivity: small changes in the score move the probability the most.',
    apply: function () {
      setThresholdUI(0.5); setRegionsUI(false);
      figState.showThreshold = false;
      figState.markerZ = 0; figState.showMarker = true; figState.showReadout = true;
    }
  },
  {
    title: 'A threshold is a cutoff in z',
    narration: 'The dashed line marks a probability cutoff; where it meets the curve defines z*. At 0.5 the cutoff sits at z* = 0 — the natural, symmetric decision boundary.',
    apply: function () {
      setThresholdUI(0.5); setRegionsUI(true);
      figState.showThreshold = true;
      figState.markerZ = 0; figState.showMarker = true; figState.showReadout = true;
    }
  },
  {
    title: 'Raising the bar',
    narration: 'Demand 90% confidence and z* slides far to the right: far fewer inputs are classified as class 1. Lower the threshold and the boundary slides left.',
    apply: function () {
      setThresholdUI(0.9); setRegionsUI(true);
      figState.showThreshold = true;
      figState.markerZ = logitOf(0.9); figState.showMarker = true; figState.showReadout = true;
    }
  },
  {
    title: 'Lowering the bar',
    narration: 'At a 0.2 threshold almost any mildly positive score is labelled class 1. The curve is unchanged — only where we cut it has moved.',
    apply: function () {
      setThresholdUI(0.2); setRegionsUI(true);
      figState.showThreshold = true;
      figState.markerZ = logitOf(0.2); figState.showMarker = true; figState.showReadout = true;
    }
  }
];

let stepIdx = 0;
function applyStep(i) {
  stepIdx = (i % demoSteps.length + demoSteps.length) % demoSteps.length;
  const s = demoSteps[stepIdx];
  s.apply();
  document.getElementById('demoNarration').textContent = s.narration;
  document.getElementById('stepTitle').textContent = (stepIdx + 1) + '. ' + s.title;
  document.getElementById('stepLabel').textContent = 'step ' + (stepIdx + 1) + ' / ' + demoSteps.length;
  chart.render();
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

applyStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
