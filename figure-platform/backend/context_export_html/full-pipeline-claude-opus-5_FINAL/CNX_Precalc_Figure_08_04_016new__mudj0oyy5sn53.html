<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="display:block;font-weight:600;font-size:12px">Rose curves &nbsp;r = a·cos(nθ) , a·sin(nθ)</span>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.45;min-height:58px;color:#222"></span>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:10px;flex:1"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Petal parameter n: <output id="nStepVal">4</output>
  <input id="nStepInput" type="range" min="1" max="8" step="1" value="4"
    oninput="document.getElementById('nStepVal').value=this.value;update_nStep(+this.value)">
</label>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="trigFormInput" type="checkbox" style="width:auto" onchange="toggle_trigForm(this.checked)"> Sine form (r = a·sin nθ)</label>
<label>Amplitude a: <output id="amplitudeVal">4.0</output>
  <input id="amplitudeInput" type="range" min="0.5" max="5" step="0.1" value="4"
    oninput="update_amplitude(+this.value)">
</label>
<label>Trace θ up to: <output id="thetaSweepVal">4.00π</output>
  <input id="thetaSweepInput" type="range" min="0" max="12.566" step="0.05" value="12.566"
    oninput="update_thetaSweep(+this.value)">
</label>
<button onclick="trigger_animate()">▶ Animate the θ-sweep</button>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="highlightInput" type="checkbox" style="width:auto" onchange="toggle_highlight(this.checked)"> Shade the generating petal</label>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="compareInput" type="checkbox" style="width:auto" checked onchange="toggle_compare(this.checked)"> Compare mode: (a) even vs (b) odd</label>
<label>r(θ) = <input id="rThetaInput" value="4*cos(3*theta)"></label>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="customInput" type="checkbox" style="width:auto" onchange="toggle_custom(this.checked)"> Use my r(θ) instead</label>
<span style="display:block;font-size:10px;color:#555;line-height:1.5">
  <span style="color:#1B87A8">━</span> rose curve &nbsp;
  <span style="color:#1B87A8;opacity:.35">━</span> not yet traced &nbsp;
  <span style="color:#6a6a6a">┈</span> polar grid &nbsp;
  <span style="color:#bdbdbd">━</span> envelope r = a
</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var TMAX = 4 * Math.PI;
var TEAL = '#1B87A8', GRIDC = '#6a6a6a';
var draw = SVG().addTo(document.getElementById('container')).size('100%', '100%');

var S = {
  n: 4, sine: false, a: 4, sweep: TMAX,
  custom: false, customFn: null, customSrc: '4*cos(3*theta)',
  highlight: false, compare: true
};
var FW = { w: 600, h: 450 };

/* ── frame: world units == pixels, so plotX/plotY drive every placement ── */
function configureFrame(w, h) {
  FW.w = Math.max(80, w || 600);
  FW.h = Math.max(80, h || 450);
  setPlotFrame({ xDomain: [0, FW.w], yDomain: [0, FW.h], margin: 0, draw: draw });
}
var f0 = setPlotFrame({ xDomain: [0, 1], yDomain: [0, 1], margin: 0, draw: draw });
configureFrame(f0.width, f0.height);
document.addEventListener('fig-resize', function (e) {
  configureFrame(e.detail.width, e.detail.height);
  redraw();
});
function PX(x) { return plotX(x); }
function PY(y) { return plotY(FW.h - y); }

/* ── helpers ───────────────────────────────────────────────────────────── */
function fmtNum(v) {
  var r = Math.round(v * 10) / 10;
  return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : r.toFixed(1);
}
function prettySrc(s) { return String(s).replace(/theta/g, 'θ').replace(/\*/g, ''); }

function radialOf(o) {
  return function (th) {
    if (o.custom && o.fn) return o.fn(th);
    return o.a * (o.sine ? Math.sin(o.n * th) : Math.cos(o.n * th));
  };
}
function roseSegs(o, t0, t1, cx, cy, sc) {
  var rf = radialOf(o);
  var perUnit = 80 + 20 * (o.custom ? 6 : o.n);
  var N = Math.min(3200, Math.max(60, Math.round((t1 - t0) * perUnit)));
  var segs = [], cur = [];
  for (var i = 0; i <= N; i++) {
    var th = t0 + (t1 - t0) * i / N, r;
    try { r = rf(th); } catch (e) { r = NaN; }
    if (typeof r === 'number' && isFinite(r) && Math.abs(r) <= 6.4) {
      cur.push([cx + sc * r * Math.cos(th), cy - sc * r * Math.sin(th)]);
    } else { if (cur.length > 1) segs.push(cur); cur = []; }
  }
  if (cur.length > 1) segs.push(cur);
  return segs;
}
function ptsAttr(p) {
  return p.map(function (q) { return q[0].toFixed(2) + ',' + q[1].toFixed(2); }).join(' ');
}

/* italic/upright mixed serif math text, centred at (cx,cy) */
function mathText(g, parts, size, cx, cy) {
  var t = g.text(function (add) {
    parts.forEach(function (p) { add.tspan(p[0]).font({ style: p[1] ? 'italic' : 'normal' }); });
  });
  t.font({ family: 'Georgia, "Times New Roman", serif', size: size, leading: 1 }).fill('#111');
  t.attr({
    'paint-order': 'stroke', stroke: '#fff',
    'stroke-width': Math.max(1.6, size * 0.2), 'stroke-linejoin': 'round'
  });
  t.center(cx, cy);
  return t;
}
function plainText(g, str, size, cx, cy, left) {
  var t = g.text(str).font({ family: 'Helvetica, Arial, sans-serif', size: size }).fill('#3b3b3b');
  t.attr({
    'paint-order': 'stroke', stroke: '#fff',
    'stroke-width': Math.max(1.5, size * 0.22), 'stroke-linejoin': 'round'
  });
  if (left) { t.x(cx); t.cy(cy); } else { t.center(cx, cy); }
  return t;
}

/* ── panel pieces ─────────────────────────────────────────────────────── */
function drawAxes(g, cx, cy, R) {
  var AL = 1.40 * R, hl = 0.135 * R, hw = 0.058 * R, aw = Math.max(1.1, R * 0.0145);
  function ax(dx, dy, tip) {
    var ex = cx + dx * AL, ey = cy + dy * AL;
    g.line(cx, cy, ex - dx * hl * 0.55, ey - dy * hl * 0.55).stroke({ color: '#000', width: aw });
    var nx = -dy, ny = dx;
    var head = g.polygon([
      [ex, ey],
      [ex - dx * hl + nx * hw, ey - dy * hl + ny * hw],
      [ex - dx * hl - nx * hw, ey - dy * hl - ny * hw]
    ]).fill('#000');
    head.css('cursor', 'pointer')
      .on('mousemove', function (e) { showTooltip(tip, e); })
      .on('mouseleave', hideTooltip);
  }
  ax(1, 0, 'Polar axis: θ = 0 direction');
  ax(-1, 0, 'θ = π direction');
  ax(0, -1, 'θ = π/2 direction');
  ax(0, 1, 'θ = 3π/2 direction');
}

function drawPanel(g, cx, cy, R, o) {
  var sc = R / 5;
  var lw = Math.max(0.85, R * 0.0095);
  var dash = (lw * 1.05).toFixed(2) + ',' + (lw * 2.5).toFixed(2);

  for (var i = 1; i <= 5; i++) {
    var ring = g.circle(2 * sc * i).center(cx, cy).fill('none')
      .stroke({ color: GRIDC, width: lw, dasharray: dash, linecap: 'round' });
    ring.css('cursor', 'pointer');
    (function (rr, el) {
      el.on('mousemove', function (e) { showTooltip('Polar grid ring: r = ' + rr, e); })
        .on('mouseleave', hideTooltip);
    })(i, ring);
  }
  var RR = 5 * sc;
  [30, 60, 120, 150].forEach(function (d) {
    var th = d * Math.PI / 180;
    g.line(cx - RR * Math.cos(th), cy + RR * Math.sin(th), cx + RR * Math.cos(th), cy - RR * Math.sin(th))
      .stroke({ color: GRIDC, width: lw, dasharray: dash, linecap: 'round' });
  });

  if (o.envelope && !o.custom && o.a > 0.05) {
    var env = g.circle(2 * sc * Math.min(o.a, 5.9)).center(cx, cy).fill('none')
      .stroke({ color: '#bdbdbd', width: lw * 1.6 });
    env.css('cursor', 'pointer')
      .on('mousemove', function (e) { showTooltip('Envelope r = a = ' + fmtNum(o.a) + ': every petal tip touches it', e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('The amplitude a', 'a is the largest value |r| can reach, so every petal stops on this circle. Changing a stretches the whole rose uniformly; it never adds or removes a petal.');
      });
  }

  drawAxes(g, cx, cy, R);

  if (o.highlight && !o.custom) {
    var a0 = o.sine ? 0 : -Math.PI / (2 * o.n);
    var a1 = o.sine ? Math.PI / o.n : Math.PI / (2 * o.n);
    var hs = roseSegs(o, a0, a1, cx, cy, sc);
    if (hs.length) {
      var pg = g.polygon(ptsAttr([[cx, cy]].concat(hs[0])))
        .fill({ color: TEAL, opacity: 0.18 }).stroke('none');
      pg.css('cursor', 'pointer')
        .on('mousemove', function (e) {
          showTooltip('One petal is generated by a θ-interval of width π/n = ' + (Math.PI / o.n).toFixed(2) + ' rad', e);
        })
        .on('mouseleave', hideTooltip);
    }
  }

  if (o.ghost && o.sweep < TMAX - 1e-3) {
    roseSegs(o, 0, TMAX, cx, cy, sc).forEach(function (sg) {
      g.polyline(ptsAttr(sg)).fill('none')
        .stroke({ color: TEAL, width: Math.max(1.6, R * 0.040), opacity: 0.22, linecap: 'round', linejoin: 'round' });
    });
  }

  if (o.sweep > 1e-3) {
    var tip = o.custom
      ? 'r = ' + prettySrc(o.srcText) + '  (custom expression)'
      : 'r = ' + fmtNum(o.a) + (o.sine ? ' sin(' : ' cos(') + o.n + 'θ)  →  ' +
      (o.n % 2 === 0 ? (2 * o.n) + ' petals (n even)' : o.n + ' petals (n odd)');
    roseSegs(o, 0, o.sweep, cx, cy, sc).forEach(function (sg) {
      var pl = g.polyline(ptsAttr(sg)).fill('none')
        .stroke({ color: TEAL, width: Math.max(2, R * 0.047), linecap: 'round', linejoin: 'round' });
      pl.css('cursor', 'pointer')
        .on('mousemove', function (e) { showTooltip(tip, e); })
        .on('mouseleave', hideTooltip)
        .on('click', function () {
          showPopup('Why parity decides the count',
            'Over 0 ≤ θ ≤ π the factor cos(nθ) (or sin(nθ)) completes n half-waves, so n petals get drawn. For odd n the next interval π ≤ θ ≤ 2π gives negative r, and a negative radius lands on the ray opposite θ — exactly the petals already there, so they are retraced: still n petals. For even n nothing lines up with what exists, so n brand-new petals appear between the old ones, giving 2n.');
        });
    });
  }

  if (o.trace && o.sweep > 1e-3 && o.sweep < TMAX - 1e-3) {
    var rf = radialOf(o), rv;
    try { rv = rf(o.sweep); } catch (e) { rv = NaN; }
    if (isFinite(rv) && Math.abs(rv) <= 6.4) {
      var pxp = cx + sc * rv * Math.cos(o.sweep), pyp = cy - sc * rv * Math.sin(o.sweep);
      g.line(cx, cy, pxp, pyp).stroke({
        color: TEAL, width: lw * 1.9, dasharray: (R * 0.024) + ',' + (R * 0.02)
      });
      var dot = g.circle(R * 0.062).center(pxp, pyp).fill(TEAL);
      dot.css('cursor', 'pointer')
        .on('mousemove', function (e) {
          showTooltip('θ = ' + o.sweep.toFixed(2) + ' rad (' + (o.sweep * 180 / Math.PI).toFixed(0) + '°), r = ' + rv.toFixed(2) +
            (rv < 0 ? '  — negative r plots on the opposite ray' : ''), e);
        })
        .on('mouseleave', hideTooltip);
    }
  }
}

/* ── captions ─────────────────────────────────────────────────────────── */
function symbolicParts(sine, parity) {
  return [['r', 1], [' = ', 0], ['a', 1], [sine ? 'sin(' : 'cos(', 0], ['n', 1], ['θ', 1], ['), ', 0], ['n', 1], [' ' + parity, 0]];
}
function numericParts() {
  if (S.custom && S.customFn) return [['r', 1], [' = ', 0], [prettySrc(S.customSrc), 1]];
  return [['r', 1], [' = ', 0], [fmtNum(S.a), 1], [S.sine ? ' sin(' : ' cos(', 0], [String(S.n), 1], ['θ', 1], [')', 0]];
}
function badgeStr() {
  if (S.custom && S.customFn) return 'custom r(θ) — predict, then count the petals';
  return (S.n % 2 === 0)
    ? 'n = ' + S.n + ' (even)  →  2n = ' + (2 * S.n) + ' petals'
    : 'n = ' + S.n + ' (odd)  →  n = ' + S.n + ' petals';
}

/* ── full redraw ──────────────────────────────────────────────────────── */
function redraw() {
  draw.clear();
  var g = draw.group();
  var W = FW.w, H = FW.h;

  if (S.compare) {
    var R = Math.min(W / 5.90, H / 4.02);
    var top = (H - 4.02 * R) / 2;
    var cyS = top + 1.48 * R;
    var evenN = (S.n % 2 === 0) ? S.n : Math.min(8, S.n + 1);
    var oddN = (S.n % 2 === 1) ? S.n : Math.max(1, S.n - 1);
    var panels = [
      { dx: -1.50, n: evenN, sine: false, parity: 'even', tag: '(a)' },
      { dx: 1.50, n: oddN, sine: true, parity: 'odd', tag: '(b)' }
    ];
    panels.forEach(function (p) {
      var cxS = W / 2 + p.dx * R;
      var cx = PX(cxS), cy = PY(cyS);
      var o = {
        n: p.n, sine: p.sine, a: S.a, sweep: TMAX,
        custom: false, envelope: false, ghost: false, trace: false, highlight: false
      };
      drawPanel(g, cx, cy, R, o);
      var count = (p.n % 2 === 0) ? 2 * p.n : p.n;
      var cap = mathText(g, symbolicParts(p.sine, p.parity), 0.205 * R, cx, PY(cyS + 1.78 * R));
      cap.css('cursor', 'pointer')
        .on('mousemove', function (e) {
          showTooltip('Here n = ' + p.n + ' (' + p.parity + ') → ' + count + ' petals. Turn off Compare mode for the live numeric formula.', e);
        })
        .on('mouseleave', hideTooltip)
        .on('click', function () {
          showPopup(p.parity === 'even' ? 'Panel (a): n even' : 'Panel (b): n odd',
            p.parity === 'even'
              ? 'With n even the sweep 0 ≤ θ ≤ 2π draws 2n distinct petals: the second half of the sweep has nothing to retrace, so a fresh set of petals appears between the first set.'
              : 'With n odd only n petals appear. Past θ = π the radius goes negative, and a negative radius plots on the opposite ray — right on top of a petal already drawn, so the curve retraces itself.');
        });
      var ann = plainText(g, '(n = ' + p.n + ')  →  ' + count + ' petals', 0.128 * R, cx, PY(cyS + 2.09 * R));
      ann.css('cursor', 'pointer')
        .on('mousemove', function (e) {
          showTooltip('The n-slider drives this panel: it always shows the nearest ' + p.parity + ' value of n.', e);
        })
        .on('mouseleave', hideTooltip);
      mathText(g, [[p.tag, 0]], 0.175 * R, cx, PY(cyS + 2.42 * R));
    });
  } else {
    var R2 = Math.min(W / 3.02, H / 4.02);
    var top2 = (H - 4.02 * R2) / 2;
    var cy2 = top2 + 1.48 * R2;
    var cxp = PX(W / 2), cyp = PY(cy2);
    var o2 = {
      n: S.n, sine: S.sine, a: S.a, sweep: S.sweep,
      custom: S.custom && !!S.customFn, fn: S.customFn, srcText: S.customSrc,
      envelope: true, ghost: true, trace: true, highlight: S.highlight
    };
    drawPanel(g, cxp, cyp, R2, o2);

    var ft = mathText(g, numericParts(), 0.205 * R2, cxp, PY(cy2 + 1.78 * R2));
    ft.css('cursor', 'pointer')
      .on('mousemove', function (e) { showTooltip('Live formula: a = ' + fmtNum(S.a) + ', n = ' + S.n, e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('Reading r = a·cos(nθ)', 'a fixes the petal length (the envelope radius). n fixes how fast r oscillates, hence how many petals: n if n is odd, 2n if n is even. Choosing sin instead of cos rotates the whole rose by π/(2n) without changing the count.');
      });
    var bt = plainText(g, badgeStr(), 0.128 * R2, cxp, PY(cy2 + 2.14 * R2));
    bt.css('cursor', 'pointer')
      .on('mousemove', function (e) { showTooltip('Parity rule: odd n → n petals, even n → 2n petals', e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('The parity rule', 'Counting petals is not memorization: the second half of the θ-sweep either retraces the first half (odd n) or fills the gaps with new petals (even n). Animate the sweep with n = 3 and then n = 4 to watch both cases happen.');
      });
    if (S.sweep < TMAX - 1e-3) {
      plainText(g, 'θ = ' + S.sweep.toFixed(2) + ' rad = ' + (S.sweep * 180 / Math.PI).toFixed(0) + '°  (of 720°)',
        0.125 * R2, PX(0.02 * W), PY(0.045 * H), true);
    }
  }
}

/* ── control handlers ─────────────────────────────────────────────────── */
function leaveCompare() {
  if (S.compare) { S.compare = false; document.getElementById('compareInput').checked = false; }
}
function syncCustomBox() { document.getElementById('customInput').checked = !!S.custom; }

function update_nStep(v) { S.n = Math.round(v); S.custom = false; syncCustomBox(); redraw(); }
function toggle_trigForm(on) { S.sine = !!on; S.custom = false; syncCustomBox(); if (on) leaveCompare(); redraw(); }
function update_amplitude(v) {
  S.a = v; document.getElementById('amplitudeVal').value = v.toFixed(1);
  S.custom = false; syncCustomBox(); redraw();
}
function setSweepUI(v) {
  document.getElementById('thetaSweepInput').value = v;
  document.getElementById('thetaSweepVal').value = (v / Math.PI).toFixed(2) + 'π';
}
function update_thetaSweep(v) {
  S.sweep = v; document.getElementById('thetaSweepVal').value = (v / Math.PI).toFixed(2) + 'π';
  leaveCompare(); redraw();
}
function toggle_highlight(on) { S.highlight = !!on; if (on) leaveCompare(); redraw(); }
function toggle_compare(on) { S.compare = !!on; redraw(); }
function toggle_custom(on) {
  S.custom = !!on && !!S.customFn;
  if (S.custom) leaveCompare();
  syncCustomBox(); redraw();
}

var animT = null;
function trigger_animate() {
  if (animT) { cancelAnimationFrame(animT); animT = null; }
  leaveCompare();
  var start = performance.now(), dur = 6500;
  function frame(t) {
    var k = Math.min(1, (t - start) / dur);
    S.sweep = k * TMAX;
    setSweepUI(S.sweep);
    redraw();
    animT = (k < 1) ? requestAnimationFrame(frame) : null;
  }
  animT = requestAnimationFrame(frame);
}

/* ── equation input (scaffold owns parsing) ───────────────────────────── */
var eqFirst = true;
bindEquationInput('rThetaInput', function (fn, src) {
  S.customFn = fn; S.customSrc = src;
  if (eqFirst) { eqFirst = false; }
  else { S.custom = true; leaveCompare(); syncCustomBox(); }
  redraw();
}, { variables: ['theta'] });

/* ── demo step player ─────────────────────────────────────────────────── */
var steps = [
  { title: 'Start with one petal', narration: 'With n = 1 the curve r = a cos(θ) is a single circular petal along the polar axis. This is the simplest rose and the baseline for counting.', state: { n: 1, sine: false, a: 4, sweep: TMAX } },
  { title: 'Odd n: three petals', narration: 'Set n = 3 and three petals appear, not six. The trace stops at θ = 2π; slide it back and watch: after θ = π the curve simply retraces the same three petals, because negative r flips the point onto a ray already used.', state: { n: 3, sine: false, a: 4, sweep: 6.283 } },
  { title: 'Even n: petal count doubles', narration: 'Now n = 4 — the curve from panel (a). Eight petals fill the circle: four along the axes and four on the diagonals. Nothing is retraced, so the count is 2n.', state: { n: 4, sine: false, a: 4, sweep: TMAX } },
  { title: 'Sine rotates, it does not recount', narration: 'Toggle to the sine form with n = 3 to reproduce panel (b): still three petals, but the rose has rotated by π/(2n) so one petal points straight down. Orientation and parity are separate ideas.', state: { n: 3, sine: true, a: 4, sweep: TMAX } },
  { title: 'a changes size only', narration: 'Drag the amplitude down and every petal shortens to the new maximum radius a, all together — the gray envelope circle shrinks with them. Three petals stay three petals: a scales the rose, n counts it.', state: { n: 3, sine: true, a: 1.5, sweep: TMAX } },
  { title: 'Test the rule yourself', narration: 'Step to a large even n, then type your own r(θ) in the equation box. Predict the petal count before the graph redraws — and try a non-integer n to see the rose fail to close.', state: { n: 6, sine: false, a: 4, sweep: TMAX } }
];
var stepIdx = -1;

function syncUI() {
  document.getElementById('nStepInput').value = S.n;
  document.getElementById('nStepVal').value = S.n;
  document.getElementById('trigFormInput').checked = S.sine;
  document.getElementById('amplitudeInput').value = S.a;
  document.getElementById('amplitudeVal').value = S.a.toFixed(1);
  setSweepUI(S.sweep);
  document.getElementById('highlightInput').checked = S.highlight;
  document.getElementById('compareInput').checked = S.compare;
  syncCustomBox();
}

function applyStep(i) {
  if (animT) { cancelAnimationFrame(animT); animT = null; }
  stepIdx = Math.max(-1, Math.min(steps.length - 1, i));
  if (stepIdx < 0) {
    S.n = 4; S.sine = false; S.a = 4; S.sweep = TMAX;
    S.custom = false; S.highlight = false; S.compare = true;
    document.getElementById('stepLabel').textContent = 'Overview — the textbook figure';
    document.getElementById('demoNarration').textContent =
      'The original figure: (a) r = a cos(nθ) with n even draws 2n petals — here 8; (b) r = a sin(nθ) with n odd draws only n — here 3. Press ▶ to see why the parity of n, not the trig function, sets the count.';
  } else {
    var st = steps[stepIdx];
    S.n = st.state.n; S.sine = st.state.sine; S.a = st.state.a; S.sweep = st.state.sweep;
    S.custom = false; S.compare = false;
    document.getElementById('stepLabel').textContent = 'Step ' + (stepIdx + 1) + '/' + steps.length + ': ' + st.title;
    document.getElementById('demoNarration').textContent = st.narration;
  }
  syncUI();
  redraw();
}
function nextStep() { applyStep(stepIdx + 1 > steps.length - 1 ? -1 : stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1 < -1 ? steps.length - 1 : stepIdx - 1); }

applyStep(-1);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
