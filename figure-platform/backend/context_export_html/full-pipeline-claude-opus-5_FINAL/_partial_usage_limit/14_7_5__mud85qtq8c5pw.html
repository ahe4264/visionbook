<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="display:block;font-weight:700;font-size:12px">Transformation T: (u,v) → (x,y)</span>
<label>x(u,v) = <input id="xExprInput" value="u*cos(v)"></label>
<label>y(u,v) = <input id="yExprInput" value="u*sin(v)"></label>
<label>Cell size (Δu = Δv): <output id="cellSizeVal">0.80</output>
  <input id="cellSizeInput" type="range" min="0.05" max="1.2" step="0.05" value="0.8"
         oninput="document.getElementById('cellSizeVal').value=this.value;update_cellSize(+this.value)"></label>
<label><input id="showJacobianInput" type="checkbox" onchange="toggle_showJacobian(this.checked)"> Overlay: tangent parallelogram + area readout</label>
<span style="display:block;font-size:11px;color:#555;line-height:1.35">Drag the blue dots in the uv‑plane: the lower‑left dot moves (u₀,v₀); the upper‑right dot resizes Δu and Δv.</span>
<span id="jacReadout" style="display:block;font-size:11px;line-height:1.45;font-family:ui-monospace,Consolas,monospace;background:#f2f7fb;border:1px solid #d6e4ee;border-radius:4px;padding:5px 6px"></span>
<span style="display:block;border-top:1px solid #dcdfe3;margin-top:4px;padding-top:5px;font-weight:700;font-size:12px">Guided demo</span>
<span id="stepTitle" style="display:block;font-size:11.5px;font-weight:700"></span>
<span id="demoNarration" style="display:block;font-size:11px;line-height:1.4;min-height:52px"></span>
<span style="display:flex;gap:6px;align-items:center">
  <button onclick="prevStep()">◀</button><span id="stepLabel" style="font-size:11px"></span><button onclick="nextStep()">▶</button>
</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
var FIGW = 1120, FIGH = 340;
var fdraw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
fdraw.viewbox(0, 0, FIGW, FIGH);
var gRoot = fdraw.group();

var C_BLUE = '#29a8dd', C_FILL = '#c9e2f1', C_TAN = '#fbe3b6', C_GREY = '#9a9a9a',
    C_ORANGE = '#e8742c', C_MAG = '#c0396b', C_INK = '#111111';
var SERIF = 'Georgia, "Times New Roman", serif';

var st = { u0: 1.5, v0: 0.35, du: 0.8, dv: 0.8, overlay: false, fx: null, fy: null, focus: null };

/* ---------- left (uv) panel frame ---------- */
var LX0 = 80, LY0 = 300, LSU = 110, LSV = 125, LAX = 486;
var U_MAX = 2.6, V_MAX = 1.9;
function lx(u) { return LX0 + u * LSU; }
function ly(v) { return LY0 - v * LSV; }

/* ---------- right (xy) panel frame (auto-fitted) ---------- */
var RB = { x0: 672, y0: 20, x1: 1112, y1: 318 };
var rS = 100, rCx = 1, rCy = 1;
function rx(x) { return (RB.x0 + RB.x1) / 2 + (x - rCx) * rS; }
function ry(y) { return (RB.y0 + RB.y1) / 2 - (y - rCy) * rS; }

function fclamp(a, lo, hi) { return a < lo ? lo : (a > hi ? hi : a); }

/* ---------- drawing helpers ---------- */
function mkText(g, s, x, y, size, opt) {
  opt = opt || {};
  var t = g.plain(s);
  t.font({ family: SERIF, size: size, anchor: opt.anchor || 'middle', style: (opt.italic === false ? 'normal' : 'italic') });
  t.fill(opt.fill || C_INK);
  t.attr({ x: x, y: y });
  if (opt.halo !== false) t.attr({ 'paint-order': 'stroke', stroke: '#ffffff', 'stroke-width': (opt.halo || 3.4), 'stroke-linejoin': 'round' });
  return t;
}
function arrowHead(g, x, y, ang, size, color) {
  function P(dx, dy) { return [x + dx * Math.cos(ang) - dy * Math.sin(ang), y + dx * Math.sin(ang) + dy * Math.cos(ang)]; }
  var p = [P(0, 0), P(-size, size * 0.42), P(-size * 0.7, 0), P(-size, -size * 0.42)];
  return g.polygon(p.map(function (q) { return q[0].toFixed(2) + ',' + q[1].toFixed(2); }).join(' ')).fill(color).stroke('none');
}
function ptsAttr(pts) { return pts.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' '); }

/* ---------- the map ---------- */
function safeEval(f, u, v) {
  var r;
  try { r = f(u, v); } catch (e) { return NaN; }
  return (typeof r === 'number' && isFinite(r)) ? r : NaN;
}
function Tmap(u, v) { return [safeEval(st.fx, u, v), safeEval(st.fy, u, v)]; }
function sampleCurve(kind, c, a, b, n) {
  var pts = [], i, t, p;
  for (i = 0; i <= n; i++) {
    t = a + (b - a) * i / n;
    p = (kind === 'u') ? Tmap(c, t) : Tmap(t, c);
    if (isFinite(p[0]) && isFinite(p[1])) pts.push(p);
  }
  return pts;
}
function polyArea(pts) {
  var a = 0, i, j;
  for (i = 0; i < pts.length; i++) { j = (i + 1) % pts.length; a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1]; }
  return Math.abs(a) / 2;
}
function jacobianAt(u, v) {
  var h = 1e-4;
  var xu = (safeEval(st.fx, u + h, v) - safeEval(st.fx, u - h, v)) / (2 * h);
  var yu = (safeEval(st.fy, u + h, v) - safeEval(st.fy, u - h, v)) / (2 * h);
  var xv = (safeEval(st.fx, u, v + h) - safeEval(st.fx, u, v - h)) / (2 * h);
  var yv = (safeEval(st.fy, u, v + h) - safeEval(st.fy, u, v - h)) / (2 * h);
  return { xu: xu, yu: yu, xv: xv, yv: yv, J: xu * yv - xv * yu };
}

/* ---------- label collision resolution ---------- */
function placeLabels(g, labels) {
  var rects = labels.map(function (l) {
    var w = l.text.length * l.size * 0.46, h = l.size;
    var x0 = l.anchor === 'start' ? l.x : (l.anchor === 'end' ? l.x - w : l.x - w / 2);
    return { x0: x0, y0: l.y - h * 0.82, x1: x0 + w, y1: l.y + h * 0.24, l: l };
  });
  rects.forEach(function (r) {
    var dx = 0, dy = 0;
    if (r.x0 < 6) dx = 6 - r.x0;
    if (r.x1 + dx > FIGW - 6) dx = FIGW - 6 - r.x1;
    r.x0 += dx; r.x1 += dx; r.l.x += dx;
    if (r.y0 < 16) dy = 16 - r.y0;
    if (r.y1 + dy > FIGH - 5) dy = FIGH - 5 - r.y1;
    r.y0 += dy; r.y1 += dy; r.l.y += dy;
  });
  var it, i, j, A, B, lower, upper, ov, d;
  for (it = 0; it < 4; it++) {
    for (i = 0; i < rects.length; i++) for (j = i + 1; j < rects.length; j++) {
      A = rects[i]; B = rects[j];
      if (A.x0 < B.x1 && B.x0 < A.x1 && A.y0 < B.y1 && B.y0 < A.y1) {
        lower = (A.y0 < B.y0) ? B : A; upper = (A.y0 < B.y0) ? A : B;
        ov = upper.y1 - lower.y0 + 4;
        lower.y0 += ov; lower.y1 += ov; lower.l.y += ov;
        if (lower.y1 > FIGH - 5) {
          d = lower.y1 - (FIGH - 5);
          lower.y0 -= d; lower.y1 -= d; lower.l.y -= d;
          upper.y0 -= ov; upper.y1 -= ov; upper.l.y -= ov;
        }
      }
    }
  }
  labels.forEach(function (l) { mkText(g, l.text, l.x, l.y, l.size, { anchor: l.anchor, italic: l.italic }); });
}

/* ================= LEFT PANEL ================= */
function drawLeft() {
  var g = gRoot.group();
  g.line(38, LY0, LAX, LY0).stroke({ color: C_INK, width: 2 });
  arrowHead(g, LAX + 11, LY0, 0, 12, C_INK);
  g.line(LX0, 333, LX0, 46, 0).stroke({ color: C_INK, width: 2 });
  arrowHead(g, LX0, 35, -Math.PI / 2, 12, C_INK);
  mkText(g, 'u', LAX - 6, LY0 - 12, 18, { anchor: 'end' });
  mkText(g, 'v', LX0 + 14, 50, 18, { anchor: 'start' });

  var uL = lx(st.u0), uR = lx(st.u0 + st.du), vB = ly(st.v0), vT = ly(st.v0 + st.dv);
  var ext = 30;

  var rect = g.rect(uR - uL, vB - vT).move(uL, vT).fill({ color: C_FILL, opacity: 0.95 }).stroke('none');
  rect.css('cursor', 'pointer');
  rect.on('mousemove', function (e) { showTooltip('S: rectangle in the uv-plane, area = Δu·Δv = ' + (st.du * st.dv).toFixed(3), e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () {
        showPopup('The source rectangle S',
          'S is the small rectangle [u₀, u₀+Δu] × [v₀, v₀+Δv] in the uv-plane. Its area is exactly Δu·Δv. ' +
          'Everything on the right is the image of this one rectangle under the map T.');
      });

  var sw = 3;
  g.line(uL, vT - ext, uL, vB + ext).stroke({ color: C_BLUE, width: sw });
  g.line(uR, vT - ext, uR, vB + ext).stroke({ color: C_BLUE, width: sw });
  g.line(uL - ext, vB, uR + ext, vB).stroke({ color: C_BLUE, width: sw });
  g.line(uL - ext, vT, uR + ext, vT).stroke({ color: C_BLUE, width: sw });

  [[uL, vB], [uR, vB], [uL, vT], [uR, vT]].forEach(function (p) {
    g.circle(11).center(p[0], p[1]).fill(C_BLUE).stroke({ color: '#fff', width: 1 });
  });

  /* labels */
  var narrow = (uR - uL) < 145;
  var topY = vT - ext - 9;
  mkText(g, 'u = u₀', fclamp(uL, 46, FIGW - 40), topY - (narrow ? 23 : 0), 16, { anchor: 'middle' });
  mkText(g, 'u = u₀ + Δu', fclamp(uR, 70, 470), topY, 16, { anchor: 'middle' });

  var gap = vB - vT, yTopLab = vT + 5, yBotLab = vB + 5;
  if (gap < 30) { yTopLab = vT - 7; yBotLab = vB + 19; }
  mkText(g, 'v = v₀ + Δv', uR + ext + 9, yTopLab, 16, { anchor: 'start' });
  mkText(g, 'v = v₀', uR + ext + 9, yBotLab, 16, { anchor: 'start' });

  mkText(g, '(u₀, v₀)', uL - 12, vB + 28, 16, { anchor: 'end' });
  mkText(g, 'Δu', (uL + uR) / 2, vB + 25, 16, { anchor: 'middle' });
  if (uR - uL > 52) mkText(g, 'Δv', uR - 9, (vT + vB) / 2 + 5, 16, { anchor: 'end' });
  else mkText(g, 'Δv', uL - 12, (vT + vB) / 2 + 5, 16, { anchor: 'end' });
  if (uR - uL > 40 && vB - vT > 30) mkText(g, 'S', (uL + uR) / 2, (vT + vB) / 2 + 7, 21, { anchor: 'middle' });

  /* drag handles */
  mkHandle(g, uL, vB, 'll', 'Drag to move the cell (u₀,v₀)');
  mkHandle(g, uR, vT, 'ur', 'Drag to resize Δu and Δv');
}

var dragMode = null;
function mkHandle(g, x, y, mode, tip) {
  var h = g.circle(24).center(x, y).fill({ color: C_BLUE, opacity: 0.001 });
  h.css('cursor', 'move');
  h.on('mousemove', function (e) { showTooltip(tip, e); }).on('mouseleave', hideTooltip);
  h.on('pointerdown', function (ev) { ev.preventDefault(); dragMode = mode; hideTooltip(); });
  return h;
}
function clientToUser(ev) {
  var m = fdraw.node.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  var p = fdraw.node.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(m.inverse());
}
document.addEventListener('pointermove', function (ev) {
  if (!dragMode) return;
  var q = clientToUser(ev);
  var u = (q.x - LX0) / LSU, v = (LY0 - q.y) / LSV;
  if (dragMode === 'll') {
    st.u0 = fclamp(u, 0.15, U_MAX - st.du);
    st.v0 = fclamp(v, 0.08, V_MAX - st.dv);
  } else {
    st.du = fclamp(u - st.u0, 0.05, U_MAX - st.u0);
    st.dv = fclamp(v - st.v0, 0.05, V_MAX - st.v0);
    var sl = document.getElementById('cellSizeInput'), o = document.getElementById('cellSizeVal');
    if (sl) sl.value = st.du.toFixed(2);
    if (o) o.value = st.du.toFixed(2);
  }
  redraw();
});
document.addEventListener('pointerup', function () { dragMode = null; });

/* ================= CENTER ARROW ================= */
function drawArrow() {
  var g = gRoot.group();
  var d = 'M 505,232 C 535,186 575,162 620,160 L 620,140 L 663,182 L 620,224 L 620,204 ' +
          'C 580,206 548,224 520,258 Z';
  var a = g.path(d).fill(C_TAN).stroke({ color: C_GREY, width: 2, linejoin: 'round' });
  a.css('cursor', 'pointer');
  a.on('mousemove', function (e) { showTooltip('T : (u,v) ↦ (x(u,v), y(u,v))', e); })
   .on('mouseleave', hideTooltip)
   .on('click', function () {
     showPopup('The transformation T',
       'T carries every point of the uv-plane to a point of the xy-plane. Straight grid lines u = const and v = const ' +
       'become curves, so the rectangle S becomes the curvilinear region R. Change the formulas in the panel to see a different T.');
   });
  mkText(g, 'T', 568, 148, 21, { anchor: 'middle' });
}

/* ================= RIGHT PANEL ================= */
function fitView(pts, withOrigin, padx, pady) {
  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  pts.forEach(function (p) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  });
  if (withOrigin) { x0 = Math.min(x0, 0); x1 = Math.max(x1, 0); y0 = Math.min(y0, 0); y1 = Math.max(y1, 0); }
  var w = Math.max(x1 - x0, 1e-9), h = Math.max(y1 - y0, 1e-9);
  var s = Math.min((RB.x1 - RB.x0 - 2 * padx) / w, (RB.y1 - RB.y0 - 2 * pady) / h);
  return { s: s, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: w, h: h };
}

function drawRight() {
  var g = gRoot.group();
  var n = 44;
  var eu = 0.3 * st.du, ev = 0.3 * st.dv;
  var cU0 = sampleCurve('u', st.u0, st.v0 - ev, st.v0 + st.dv + ev, n);
  var cU1 = sampleCurve('u', st.u0 + st.du, st.v0 - ev, st.v0 + st.dv + ev, n);
  var cV0 = sampleCurve('v', st.v0, st.u0 - eu, st.u0 + st.du + eu, n);
  var cV1 = sampleCurve('v', st.v0 + st.dv, st.u0 - eu, st.u0 + st.du + eu, n);
  var reg = [].concat(
    sampleCurve('v', st.v0, st.u0, st.u0 + st.du, n),
    sampleCurve('u', st.u0 + st.du, st.v0, st.v0 + st.dv, n),
    sampleCurve('v', st.v0 + st.dv, st.u0 + st.du, st.u0, n),
    sampleCurve('u', st.u0, st.v0 + st.dv, st.v0, n));

  if (reg.length < 8) {
    mkText(g, 'image undefined for this cell', (RB.x0 + RB.x1) / 2, (RB.y0 + RB.y1) / 2, 15,
      { italic: false, fill: '#999' });
    updateReadout(st.du * st.dv, NaN, NaN);
    return;
  }

  var jac = jacobianAt(st.u0, st.v0);
  var P0 = Tmap(st.u0, st.v0);
  var av = [jac.xu * st.du, jac.yu * st.du], bv = [jac.xv * st.dv, jac.yv * st.dv];
  var par = [P0, [P0[0] + av[0], P0[1] + av[1]], [P0[0] + av[0] + bv[0], P0[1] + av[1] + bv[1]], [P0[0] + bv[0], P0[1] + bv[1]]];
  var parOk = par.every(function (p) { return isFinite(p[0]) && isFinite(p[1]); });

  var all = [].concat(cU0, cU1, cV0, cV1);
  if (st.overlay && parOk) all = all.concat(par);

  var bb = fitView(reg, false, 0, 0);
  var vA = fitView(all, true, 46, 34);
  var view = vA;
  if (Math.max(bb.w, bb.h) * vA.s < 0.22 * Math.min(RB.x1 - RB.x0, RB.y1 - RB.y0)) {
    var vB2 = fitView(all, false, 58, 46);
    view = vB2;
  }
  rS = view.s; rCx = view.cx; rCy = view.cy;

  /* axes */
  var ax = ry(0), ay = rx(0);
  if (ax > RB.y0 + 6 && ax < RB.y1 + 40) {
    var axc = fclamp(ax, RB.y0 + 6, RB.y1);
    g.line(RB.x0 - 4, axc, RB.x1 - 12, axc).stroke({ color: C_INK, width: 2 });
    arrowHead(g, RB.x1 - 1, axc, 0, 12, C_INK);
    mkText(g, 'x', RB.x1 - 16, axc - 12, 18, { anchor: 'end' });
  }
  if (ay > RB.x0 - 40 && ay < RB.x1 - 6) {
    var ayc = fclamp(ay, RB.x0, RB.x1 - 6);
    g.line(ayc, RB.y1 + 18, ayc, RB.y0 + 12).stroke({ color: C_INK, width: 2 });
    arrowHead(g, ayc, RB.y0 + 1, -Math.PI / 2, 12, C_INK);
    mkText(g, 'y', ayc + 14, RB.y0 + 22, 18, { anchor: 'start' });
  }

  /* region */
  var regPx = reg.map(function (p) { return [rx(p[0]), ry(p[1])]; });
  var areaS = st.du * st.dv, areaR = polyArea(reg);
  var poly = g.polygon(ptsAttr(regPx)).fill({ color: C_FILL, opacity: 0.95 }).stroke('none');
  poly.css('cursor', 'pointer');
  poly.on('mousemove', function (e) {
    showTooltip('R = T(S): area ≈ ' + areaR.toFixed(4) + '  (ratio ' + (areaR / areaS).toFixed(3) + ')', e);
  }).on('mouseleave', hideTooltip).on('click', function () {
    showPopup('The image region R',
      'R is the image of S. Its measured area is ' + areaR.toFixed(4) + ', while area(S) = ' + areaS.toFixed(4) +
      '. The ratio ' + (areaR / areaS).toFixed(3) + ' approaches |J(u₀,v₀)| = ' + Math.abs(jac.J).toFixed(3) +
      ' as the cell shrinks — that is exactly the statement dA = |J| du dv.');
  });

  /* boundary curves */
  [cV0, cU1, cV1, cU0].forEach(function (c) {
    if (c.length < 2) return;
    g.polyline(ptsAttr(c.map(function (p) { return [rx(p[0]), ry(p[1])]; })))
      .fill('none').stroke({ color: C_BLUE, width: 3, linecap: 'round', linejoin: 'round' });
  });

  /* centroid + R label */
  var cx = 0, cy = 0;
  regPx.forEach(function (p) { cx += p[0]; cy += p[1]; });
  cx /= regPx.length; cy /= regPx.length;
  var wc = [0, 0];
  reg.forEach(function (p) { wc[0] += p[0]; wc[1] += p[1]; });
  wc[0] /= reg.length; wc[1] /= reg.length;
  mkText(g, 'R', cx, cy + 7, 21, { anchor: 'middle' });

  /* curve labels on outward normals */
  function labelSpec(c, text) {
    var k = Math.floor(c.length / 2);
    var a = c[Math.max(0, k - 2)], b = c[Math.min(c.length - 1, k + 2)], m = c[k];
    var tx = b[0] - a[0], ty = b[1] - a[1];
    var nx = -ty, ny = tx, L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    if ((m[0] - wc[0]) * nx + (m[1] - wc[1]) * ny < 0) { nx = -nx; ny = -ny; }
    var snx = nx, sny = -ny;
    var d = 42;
    var px = rx(m[0]) + snx * d, py = ry(m[1]) + sny * d;
    py += (sny > 0.3 ? 11 : (sny < -0.3 ? -5 : 4));
    var anch = snx > 0.25 ? 'start' : (snx < -0.25 ? 'end' : 'middle');
    return { text: text, x: px, y: py, anchor: anch, size: 15.5, italic: false };
  }
  var labs = [];
  if (cU0.length > 3) labs.push(labelSpec(cU0, 'Image of u = u₀'));
  if (cU1.length > 3) labs.push(labelSpec(cU1, 'Image of u = u₀ + Δu'));
  if (cV1.length > 3) labs.push(labelSpec(cV1, 'Image of v = v₀ + Δv'));
  if (cV0.length > 3) labs.push(labelSpec(cV0, 'Image of v = v₀'));
  placeLabels(g, labs);

  /* overlay */
  if (st.overlay && parOk) {
    var pPx = par.map(function (p) { return [rx(p[0]), ry(p[1])]; });
    g.polygon(ptsAttr(pPx)).fill('none')
      .stroke({ color: C_ORANGE, width: 2, linejoin: 'round' }).attr('stroke-dasharray', '6,4');
    drawVec(g, pPx[0], pPx[1], C_ORANGE, '(∂r/∂u)Δu');
    drawVec(g, pPx[0], pPx[3], C_MAG, '(∂r/∂v)Δv');
    g.circle(8).center(pPx[0][0], pPx[0][1]).fill('#333');

    var bx = RB.x0 + 4, by = RB.y1 - 76;
    var box = g.rect(206, 74).move(bx, by).radius(5)
      .fill({ color: '#ffffff', opacity: 0.9 }).stroke({ color: '#cdd8e0', width: 1 });
    box.css('cursor', 'pointer').on('click', function () {
      showPopup('Why the Jacobian is the area factor',
        'The vectors (∂r/∂u)Δu and (∂r/∂v)Δv are the linear approximations of the two edges of R at T(u₀,v₀). ' +
        'The parallelogram they span has area |xu·yv − xv·yu|·ΔuΔv = |J|·ΔuΔv, and as Δu,Δv → 0 this matches area(R) exactly.');
    });
    var ty0 = by + 18, lh = 16;
    mkText(g, 'area(S) = ΔuΔv = ' + areaS.toFixed(4), bx + 9, ty0, 12.5, { anchor: 'start', italic: false, halo: false });
    mkText(g, 'area(R) = ' + areaR.toFixed(4), bx + 9, ty0 + lh, 12.5, { anchor: 'start', italic: false, halo: false });
    mkText(g, 'area(R)/area(S) = ' + (areaR / areaS).toFixed(4), bx + 9, ty0 + 2 * lh, 12.5, { anchor: 'start', italic: false, halo: false });
    mkText(g, '|J(u₀,v₀)| = ' + Math.abs(jac.J).toFixed(4), bx + 9, ty0 + 3 * lh, 12.5, { anchor: 'start', italic: false, halo: false, fill: C_ORANGE });
  }

  updateReadout(areaS, areaR, jac.J);
}

function drawVec(g, p0, p1, color, label) {
  var ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
  var L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
  if (L < 3) return;
  var hs = Math.min(12, Math.max(6, L * 0.3));
  g.line(p0[0], p0[1], p1[0] - Math.cos(ang) * hs * 0.6, p1[1] - Math.sin(ang) * hs * 0.6)
    .stroke({ color: color, width: 2.6, linecap: 'round' });
  arrowHead(g, p1[0], p1[1], ang, hs, color);
  var mx = (p0[0] + p1[0]) / 2 - Math.sin(ang) * 14, my = (p0[1] + p1[1]) / 2 + Math.cos(ang) * 14;
  mkText(g, label, mx, my, 12, { anchor: 'middle', italic: false, fill: color });
}

function updateReadout(areaS, areaR, J) {
  var el = document.getElementById('jacReadout');
  if (!el) return;
  el.innerHTML =
    '(u₀,v₀) = (' + st.u0.toFixed(2) + ', ' + st.v0.toFixed(2) + ')<br>' +
    'Δu = ' + st.du.toFixed(2) + ', Δv = ' + st.dv.toFixed(2) + '<br>' +
    'area(S) = ' + areaS.toFixed(4) + '<br>' +
    'area(R) = ' + (isFinite(areaR) ? areaR.toFixed(4) : '—') + '<br>' +
    'ratio&nbsp;&nbsp;&nbsp; = ' + (isFinite(areaR) ? (areaR / areaS).toFixed(4) : '—') + '<br>' +
    '|J(u₀,v₀)| = ' + (isFinite(J) ? Math.abs(J).toFixed(4) : '—');
}

/* ================= focus veil + master redraw ================= */
function drawFocus() {
  if (st.focus === 'left') gRoot.rect(496, 336).move(6, 2).radius(10).fill('#eef7fd').stroke('none');
  if (st.focus === 'right') gRoot.rect(458, 336).move(658, 2).radius(10).fill('#eef7fd').stroke('none');
}
function redraw() {
  if (!st.fx || !st.fy) return;
  gRoot.clear();
  drawFocus();
  drawLeft();
  drawArrow();
  drawRight();
}

/* ================= controls ================= */
function update_cellSize(v) {
  st.du = v; st.dv = v;
  if (st.u0 + st.du > U_MAX) st.u0 = Math.max(0.15, U_MAX - st.du);
  if (st.v0 + st.dv > V_MAX) st.v0 = Math.max(0.08, V_MAX - st.dv);
  var o = document.getElementById('cellSizeVal'); if (o) o.value = v.toFixed(2);
  redraw();
}
function toggle_showJacobian(on) { st.overlay = !!on; redraw(); }

/* ================= equation inputs ================= */
var bindX = bindEquationInput('xExprInput', function (fn) { st.fx = fn; redraw(); }, { variables: ['u', 'v'] });
var bindY = bindEquationInput('yExprInput', function (fn) { st.fy = fn; redraw(); }, { variables: ['u', 'v'] });

/* ================= demo steps ================= */
var STEPS = [
  { t: 'A rectangle in the uv-plane',
    n: 'On the left, the four lines u = u₀, u = u₀+Δu, v = v₀, v = v₀+Δv cut out a plain rectangle S of area ΔuΔv. Nothing curved yet.',
    s: { cell: 0.8, ov: false, u0: 1.5, v0: 0.35, x: 'u*cos(v)', y: 'u*sin(v)', focus: null } },
  { t: 'Apply the transformation',
    n: 'The polar map x = u·cos v, y = u·sin v carries each edge of S to a curve: u = const edges become circular arcs, v = const edges become radial segments. The image R is a curved quadrilateral — not the same area as S.',
    s: { cell: 0.8, ov: false, u0: 1.5, v0: 0.35, x: 'u*cos(v)', y: 'u*sin(v)', focus: 'right' } },
  { t: 'Move the cell around',
    n: 'Watch (u₀,v₀) slide outward (you can drag it yourself). The same rectangle produces a much larger image far from the origin — the stretching factor is a function of position.',
    s: { cell: 0.8, ov: false, u0: 1.4, v0: 0.35, tween: 2.25, x: 'u*cos(v)', y: 'u*sin(v)', focus: null } },
  { t: 'Shrink the cell',
    n: 'Reduce Δu and Δv. The curvature of R\u2019s edges becomes invisible and R looks like a straight-sided parallelogram. (The right panel zooms in automatically.)',
    s: { cell: 0.15, ov: false, u0: 2.25, v0: 0.35, x: 'u*cos(v)', y: 'u*sin(v)', focus: 'right' } },
  { t: 'Read off the Jacobian',
    n: 'The tangent vectors (∂r/∂u)Δu and (∂r/∂v)Δv span a parallelogram of area |∂(x,y)/∂(u,v)|·ΔuΔv, and the measured ratio area(R)/area(S) matches |J| to within a hair. For polar coordinates |J| = u.',
    s: { cell: 0.15, ov: true, u0: 2.25, v0: 0.35, x: 'u*cos(v)', y: 'u*sin(v)', focus: null } },
  { t: 'Change the formula',
    n: 'Now x = u² − v², y = 2uv. The rectangle S is untouched, but R takes a new shape and a new area ratio: the Jacobian is just bookkeeping for whatever your formula does to area. Edit the fields to try your own map.',
    s: { cell: 0.3, ov: true, u0: 1.2, v0: 0.5, x: 'u^2 - v^2', y: '2*u*v', focus: null } }
];
var stepIdx = 0, tweenId = 0;

function tweenU0(target, ms) {
  var s0 = st.u0, t0 = (window.performance ? performance.now() : Date.now()), id = ++tweenId;
  function fr(t) {
    if (id !== tweenId) return;
    var k = Math.min(1, (t - t0) / ms);
    st.u0 = s0 + (target - s0) * (k * k * (3 - 2 * k));
    redraw();
    if (k < 1) requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
}

function applyStep(i) {
  stepIdx = (i + STEPS.length) % STEPS.length;
  var s = STEPS[stepIdx].s;
  tweenId++;
  st.overlay = s.ov;
  var cb = document.getElementById('showJacobianInput'); if (cb) cb.checked = s.ov;
  st.du = s.cell; st.dv = s.cell;
  var sl = document.getElementById('cellSizeInput'), o = document.getElementById('cellSizeVal');
  if (sl) sl.value = s.cell; if (o) o.value = s.cell.toFixed(2);
  st.u0 = s.u0; st.v0 = s.v0; st.focus = s.focus;
  var xi = document.getElementById('xExprInput'), yi = document.getElementById('yExprInput');
  if (xi && xi.value !== s.x) { xi.value = s.x; bindX.apply(s.x); }
  if (yi && yi.value !== s.y) { yi.value = s.y; bindY.apply(s.y); }
  document.getElementById('stepTitle').textContent = (stepIdx + 1) + '. ' + STEPS[stepIdx].t;
  document.getElementById('demoNarration').textContent = STEPS[stepIdx].n;
  document.getElementById('stepLabel').textContent = (stepIdx + 1) + ' / ' + STEPS.length;
  redraw();
  if (s.tween != null) tweenU0(s.tween, 900);
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

/* ================= boot ================= */
document.getElementById('stepTitle').textContent = '1. ' + STEPS[0].t;
document.getElementById('demoNarration').textContent = STEPS[0].n;
document.getElementById('stepLabel').textContent = '1 / ' + STEPS.length;
redraw();
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
