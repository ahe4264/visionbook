<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0;font-size:12.5px;line-height:1.5"></p>
<span style="display:flex;gap:6px;align-items:center;">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11.5px;min-width:74px;text-align:center">Step 1 / 7</span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Panel the sliders drive:
  <select id="activePanelInput" onchange="toggle_activePanel(this.value)">
    <option value="both">Both</option>
    <option value="single">Single observer (left)</option>
    <option value="two">Two observers (right)</option>
  </select></label>
<label><input id="annotationsInput" type="checkbox" onchange="toggle_annotations(this.checked)"> Show captions, formulas &amp; degree values on the figure</label>
<label><input id="trueScaleInput" type="checkbox" onchange="toggle_trueScale(this.checked)"> Left panel at true 1:1 scale</label>
<label id="hRow">Eye height h (m): <output id="observerHeightVal">40</output><input id="observerHeightInput" type="range" min="2" max="120" step="1" value="40" oninput="document.getElementById('observerHeightVal').value=this.value;update_observerHeight(+this.value)"></label>
<label id="tRow">Observer separation t (m): <output id="observerSeparationVal">80</output><input id="observerSeparationInput" type="range" min="5" max="200" step="5" value="80" oninput="document.getElementById('observerSeparationVal').value=this.value;update_observerSeparation(+this.value)"></label>
<label>True boat distance d (m): <output id="boatDistanceVal">400</output><input id="boatDistanceInput" type="range" min="50" max="1200" step="10" value="400" oninput="document.getElementById('boatDistanceVal').value=this.value;update_boatDistance(+this.value)"></label>
<span id="readout" style="display:block;font-size:12px;line-height:1.5;border-top:1px solid #dcdfe3;padding-top:6px"></span>
<span style="font-size:11px;color:#555">Drag either boat sideways to change d. Hover or click any arc, ray or label in the figure for an explanation.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;

      'The unknown distance',
      'With t known and both angles measured, d = t · sin β / sin(α + β). No height and no horizon are needed — only a baseline and two angles.');

    var aAB = Math.atan2(RUT[1], RUT[0]), aAP = Math.atan2(RU[1], RU[0]);
    var spA = angSpan(aAP, aAB);
    var rA = Math.max(20, Math.min(46, 0.50 * R.Bl));
    attach(arcEl(g, A[0], A[1], rA, spA.a1, spA.a2, act ? 2.6 : 2),
      'α — angle at the upper observer, between baseline and sight ray',
      'Angle α', 'The upper observer measures the angle between the baseline to the partner and the sight ray to the boat. It is read off the actual drawn geometry, never from a stored constant.');
    var posA = arcLabel(g, 'α', A[0], A[1], rA, spA.mid, 26, 48);
    if (ann) T(g, deg(R.al).toFixed(1) + '°', posA[0] + 40, posA[1] + 16, 22, { sans: true, color: '#333' });

    var spB = angSpan(Math.atan2(-RUT[1], -RUT[0]), Math.atan2(P[1] - B[1], P[0] - B[0]));
    var rBa = Math.max(18, Math.min(40, 0.45 * R.Bl));
    attach(arcEl(g, B[0], B[1], rBa, spB.a1, spB.a2, act ? 2.6 : 2),
      'β — angle at the lower observer to the same boat',
      'Angle β', 'The second observer measures its own angle to the same boat. Two angles plus the baseline fix the third vertex of the triangle completely.');
    var extra = 26;
    for (var it = 0; it < 8; it++) {
      var p = [B[0] + (rBa + extra) * Math.cos(spB.mid), B[1] + (rBa + extra) * Math.sin(spB.mid)];
      if (dist(p, posA) > 56) break;
      extra += 9;
    }
    var posB = arcLabel(g, 'β', B[0], B[1], rBa, spB.mid, extra, 48);
    if (ann) T(g, deg(R.be).toFixed(1) + '°', posB[0] + 42, posB[1] + 14, 22, { sans: true, color: '#333' });

    if (ann) {
      var spP = angSpan(Math.atan2(A[1] - P[1], A[0] - P[0]), Math.atan2(B[1] - P[1], B[0] - P[0]));
      attach(arcEl(g, P[0], P[1], 34, spP.a1, spP.a2, 2.4),
        'apex (parallax) angle at the boat = 180° − α − β',
        'The apex angle',
        'The angle the baseline subtends at the boat is the whole ball game: as it collapses toward zero the triangle degenerates and the inferred distance becomes wildly sensitive to angular error.');
      T(g, deg(R.ga).toFixed(1) + '°', P[0] - 74, P[1] - 46, 22,
        { sans: true, color: deg(R.ga) < 2.5 ? WARN : '#333' });
    }

    // d? inside the thin wedge between the two sight rays
    var xq = A[0] + 0.62 * (P[0] - A[0]);
    var y1 = A[1] + (xq - A[0]) * (P[1] - A[1]) / (P[0] - A[0] || 1);
    var y2 = (Math.abs(P[0] - B[0]) > 1) ? B[1] + (xq - B[0]) * (P[1] - B[1]) / (P[0] - B[0]) : y1 + 30;
    var yq = (Math.abs(y1 - y2) < 30) ? (y1 - 26) : (y1 + y2) / 2;
    T(g, 'd?', xq, yq, 46, { italic: true });

    var tm = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2], off = R.Bl < 60 ? 46 : 30;
    T(g, 't', tm[0] - off * RUT[1], tm[1] + off * RUT[0], 48, { italic: true });

    boat(g, P[0], P[1], 0.92, 'R');
    eye(g, A[0], A[1], false, 'Upper observer — measures α',
      'Observer A', 'Observer A measures the angle α between the baseline and the boat. Neither observer needs to know a height, and neither needs the horizon.');
    eye(g, B[0], B[1], true, 'Lower observer — measures β',
      'Observer B', 'Observer B measures β to the same boat. The two bearings intersect at exactly one point, and the known baseline converts that intersection into metres.');

    if (ann) {
      T(g, 'Two observers: triangulation', PW / 2, 22, 22, { sans: true, bold: true, color: act ? '#111' : '#888' });
      T(g, 'd = t · sin β / sin(α + β)', PW - 40, 52, 24, { anchor: 'end', italic: true, color: '#222' });
    }
  }

  /* ---------------- side-panel read-out ---------------- */
  function updateReadout() {
    var el = document.getElementById('readout');
    if (!el) return;
    var G = leftGeom();
    var aT = Math.atan(S.h / S.dL);
    var aD = Math.atan2(G.waterY - G.eyeY, G.P[0] - G.eyeX) - 0;
    aD = Math.atan2(G.P[1] - G.eyeY, G.P[0] - G.eyeX);
    var E = (G.hpx / S.h) / (G.dpx / S.dL);
    var R = rightGeom();
    var dImp = S.t * Math.sin(R.be) / Math.sin(R.al + R.be);

    var h1 = '<b>Left — one observer</b><br>' +
      'h = ' + S.h + ' m &nbsp; d = ' + Math.round(S.dL) + ' m<br>' +
      'α = atan(h / d) = <b>' + deg(aT).toFixed(2) + '°</b><br>' +
      'd = h / tan α = <b>' + Math.round(S.h / Math.tan(aT)) + ' m</b><br>';
    if (S.trueScale) {
      h1 += '<span style="color:#2a7a2a">drawn 1:1 — the arc on screen is the true α (' + deg(aD).toFixed(2) + '°)</span>';
    } else {
      h1 += '<span style="color:#777">arc as drawn: ' + deg(aD).toFixed(1) +
        '° — the sketch stretches the vertical scale ×' + E.toFixed(1) +
        ' so the tiny true angle stays visible. Tick “true 1:1 scale” to remove the stretch.</span>';
    }
    if (deg(aT) < 1.5) h1 += '<br><span style="color:' + WARN + '">⚠ α &lt; 1.5°: a 0.1° error shifts d by hundreds of metres.</span>';

    var h2 = '<b>Right — two observers</b><br>' +
      't = ' + S.t + ' m &nbsp; d = ' + Math.round(S.dR) + ' m<br>' +
      'α = <b>' + deg(R.al).toFixed(1) + '°</b> &nbsp; β = <b>' + deg(R.be).toFixed(1) +
      '°</b> &nbsp; apex = <b>' + deg(R.ga).toFixed(1) + '°</b><br>' +
      'd = t · sin β / sin(α + β) = <b>' + Math.round(dImp) + ' m</b><br>' +
      '<span style="color:#2a7a2a">panel drawn to one uniform scale — the drawn angles are the real ones ✓</span>';
    if (deg(R.ga) < 2.5) h2 += '<br><span style="color:' + WARN + '">⚠ apex angle &lt; 2.5°: baseline far too short for this range — d is barely determined.</span>';

    el.innerHTML = h1 + '<br><br>' + h2;
  }

  /* ---------------- render ---------------- */
  function render() {
    root.clear();
    root.rect(VW, VH).fill('#fff');
    var actL = (S.mode === 'both' || S.mode === 'single');
    var actR = (S.mode === 'both' || S.mode === 'two');

    var gL = root.group().attr('transform', 'translate(' + OXL + ',' + MT + ')');
    gL.clipWith(clipL); drawLeft(gL, actL, S.ann);
    var gR = root.group().attr('transform', 'translate(' + OXR + ',' + MT + ')');
    gR.clipWith(clipR); drawRight(gR, actR, S.ann);
    if (!actL) gL.opacity(0.45);
    if (!actR) gR.opacity(0.45);

    root.rect(PW, PH).move(OXL, MT).fill('none').stroke({ color: INK, width: 6 });
    root.rect(PW, PH).move(OXR, MT).fill('none').stroke({ color: INK, width: 6 });
    if (S.mode === 'single') ring(OXL);
    if (S.mode === 'two') ring(OXR);
    updateReadout();
  }
  function ring(ox) {
    root.rect(PW + 12, PH + 12).move(ox - 6, MT - 6).radius(6)
      .fill('none').stroke({ color: ACC, width: 3.5, opacity: 0.85 });
  }
  window.figRender = render;

  /* ---------------- drag ---------------- */
  function toVB(e) {
    var pt = draw.node.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var m = draw.node.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    return pt.matrixTransform(m.inverse());
  }
  function invert(fn, target, lo, hi) {
    for (var i = 0; i < 44; i++) {
      var mid = (lo + hi) / 2;
      if (fn(mid) < target) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  window.addEventListener('mousemove', function (e) {
    if (!dragPanel) return;
    var p = toVB(e), nd;
    if (dragPanel === 'L') {
      nd = invert(function (dd) { return 96 + leftDpxFor(dd) * 0.9909; }, p.x - OXL, 50, 1200);
    } else {
      nd = invert(function (dd) { return rightCalc(S.t, dd).P[0]; }, p.x - OXR, 50, 1200);
    }
    nd = Math.max(50, Math.min(1200, Math.round(nd / 10) * 10));
    if (dragPanel === 'L' && nd !== S.dL) { S.dL = nd; figSetSlider('boatDistance', nd); render(); }
    if (dragPanel === 'R' && nd !== S.dR) { S.dR = nd; figSetSlider('boatDistance', nd); render(); }
  });
  window.addEventListener('mouseup', function () { dragPanel = null; });

  render();
  window.__markRendered();
})();

/* ---------------- UI plumbing ---------------- */
function figSetSlider(id, v) {
  var i = document.getElementById(id + 'Input'), o = document.getElementById(id + 'Val');
  if (i) i.value = v;
  if (o) o.value = v;
}
window.figSetSlider = figSetSlider;

function figSyncUI() {
  var m = window.figState.mode;
  var hRow = document.getElementById('hRow'), tRow = document.getElementById('tRow');
  if (hRow) hRow.style.opacity = (m === 'two') ? '0.45' : '1';
  if (tRow) tRow.style.opacity = (m === 'single') ? '0.45' : '1';
}

function update_observerHeight(v) { window.figState.h = v; window.figRender(); }
function update_observerSeparation(v) { window.figState.t = v; window.figRender(); }
function update_boatDistance(v) {
  var S = window.figState;
  if (S.mode === 'both') { S.dL = v; S.dR = v; }
  else if (S.mode === 'single') { S.dL = v; }
  else { S.dR = v; }
  window.figRender();
}
function toggle_activePanel(v) { window.figState.mode = v; figSyncUI(); window.figRender(); }
function toggle_trueScale(on) { window.figState.trueScale = on; window.figRender(); }
function toggle_annotations(on) { window.figState.ann = on; window.figRender(); }

/* ---------------- demo steps ---------------- */
var demoSteps = [
  { title: 'The unknown: how far is the boat?',
    narration: 'Both panels show the same sea and the same boat at distance d. The picture alone cannot tell you how far it is — you need one known length somewhere in the scene.',
    state: { activePanel: 'both', observerHeight: 40, observerSeparation: 80, boatDistance: 400, annotations: false } },
  { title: 'Left panel: height plus horizon',
    narration: 'The known length is the eye height h, and the horizon supplies an exactly horizontal reference. The depression angle α closes the right triangle: d = h / tan α. All numbers are in the read-out below.',
    state: { activePanel: 'single', observerHeight: 40, observerSeparation: 80, boatDistance: 400, annotations: false } },
  { title: 'Climb the cliff',
    narration: 'Raise the eye and α opens up for the very same boat — the arc visibly widens, and the degree values (now printed on the figure too) grow with it. A high lookout measures a bigger, more reliable angle.',
    state: { activePanel: 'single', observerHeight: 110, observerSeparation: 80, boatDistance: 400, annotations: true } },
  { title: 'Push the boat out',
    narration: 'Send the boat toward the horizon: α collapses in the left panel while the apex angle in the right panel nearly vanishes too. A tiny angular error now becomes a huge distance error.',
    state: { activePanel: 'both', observerHeight: 40, observerSeparation: 80, boatDistance: 1100, annotations: true } },
  { title: 'Right panel: a baseline of two eyes',
    narration: 'Here the known length is the separation t between two observers. Each reads its own angle — α at the upper eye, β at the lower one — and the law of sines fixes the boat: no horizon, no height needed.',
    state: { activePanel: 'two', observerHeight: 40, observerSeparation: 80, boatDistance: 400, annotations: true } },
  { title: 'Shrink the baseline',
    narration: 'Bring the observers together and the two sight rays become almost parallel: α + β approaches 180°, the apex angle collapses, and d is barely determined. This is exactly the small-baseline problem in stereo vision.',
    state: { activePanel: 'two', observerHeight: 40, observerSeparation: 10, boatDistance: 400, annotations: true } },
  { title: 'Widen the baseline — compare both',
    narration: 'Separate them fully and the apex angle opens up, pinning the distance down. Side by side the panels do the same job: a known baseline plus measured angles equals depth, and both degrade as that baseline shrinks relative to d.',
    state: { activePanel: 'both', observerHeight: 40, observerSeparation: 190, boatDistance: 400, annotations: false } }
];
var demoIdx = 0;

function applyDemoStep(i) {
  demoIdx = (i + demoSteps.length) % demoSteps.length;
  var st = demoSteps[demoIdx], s = st.state, S = window.figState;
  if (s.activePanel) {
    S.mode = s.activePanel;
    var sel = document.getElementById('activePanelInput');
    if (sel) sel.value = s.activePanel;
  }
  if (s.annotations !== undefined) {
    S.ann = s.annotations;
    var cb = document.getElementById('annotationsInput');
    if (cb) cb.checked = s.annotations;
  }
  if (s.observerHeight !== undefined) { S.h = s.observerHeight; figSetSlider('observerHeight', s.observerHeight); }
  if (s.observerSeparation !== undefined) { S.t = s.observerSeparation; figSetSlider('observerSeparation', s.observerSeparation); }
  if (s.boatDistance !== undefined) { S.dL = s.boatDistance; S.dR = s.boatDistance; figSetSlider('boatDistance', s.boatDistance); }
  var n = document.getElementById('demoNarration');
  if (n) n.innerHTML = '<b>' + st.title + '</b><br>' + st.narration;
  var lab = document.getElementById('stepLabel');
  if (lab) lab.textContent = 'Step ' + (demoIdx + 1) + ' / ' + demoSteps.length;
  figSyncUI();
  window.figRender();
}
function nextStep() { applyDemoStep(demoIdx + 1); }
function prevStep() { applyDemoStep(demoIdx - 1); }

applyDemoStep(0);
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>
