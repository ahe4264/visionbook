<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0;font-size:11px;line-height:1.45"></p>
<span style="display:flex;gap:5px;align-items:center">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="font-size:11px;min-width:56px;text-align:center"></span>
  <button onclick="nextStep()">▶</button>
  <button onclick="showSchematic()" title="return to the schematic picture">Schematic</button>
</span>
<span style="display:flex;flex-wrap:wrap;gap:8px;font-size:10px;align-items:center;margin-top:2px">
  <span><span style="display:inline-block;width:13px;height:10px;background:#e8e8e8;border:1px solid #000;vertical-align:-1px"></span> ≤ <i>x</i></span>
  <span><span style="display:inline-block;width:13px;height:10px;background:#a8a8a8;border:1px solid #000;vertical-align:-1px"></span> &gt; <i>x</i></span>
  <span><span style="display:inline-block;width:13px;height:10px;background:#fff;border:1px solid #000;vertical-align:-1px"></span> unrestricted</span>
  <span><span style="display:inline-block;width:13px;height:10px;background:#ffe3e3;border:1px solid #d62728;vertical-align:-1px"></span> violates invariant</span>
</span>
<label>Jump to next iteration where:
  <select id="caseFocusInput" onchange="toggle_caseFocus(this.value)">
    <option>A[j] &gt; x (skip branch)</option>
    <option>A[j] ≤ x (swap branch)</option>
  </select>
</label>
<button id="applyIterBtn" onclick="trigger_applyIter()">Apply this iteration ▸</button>
<label><input id="invariantOverlayInput" type="checkbox" checked onchange="toggle_invariantOverlay(this.checked)"> Verify invariant on every cell</label>
<span style="font-size:11px;font-weight:bold;margin-top:6px">Implement PARTITION(A, p, r)</span>
<span style="display:flex;gap:4px">
  <button onclick="loadSample('sample')">Sample</button>
  <button onclick="loadSample('buggy')">Buggy</button>
  <button onclick="loadSample('starter')">Starter</button>
</span>
<span style="font-size:10px;color:#555">ops: pivot() · value(k) · lessEq(k) · swap(a,b) · setI(k) · setJ(k) · note(text)</span>
<label>Initial subarray A[p..r] (pivot is the last value)
  <input id="partitionInput" value="2, 8, 7, 1, 3, 5, 6, 4">
</label>
<textarea id="partitionCode" spellcheck="false"></textarea>
<span style="display:flex;gap:6px;align-items:center">
  <button id="runBtn" onclick="runCode()">▶ Run</button>
  <span id="runStatus" style="font-size:11px;color:#555">not run yet</span>
</span>
<span style="display:flex;gap:4px;align-items:center">
  <button onclick="fFirst()" title="first frame">⏮</button>
  <button onclick="fPrev()" title="previous">◀</button>
  <button id="playBtn" onclick="fPlay()" title="play / pause">▶</button>
  <button onclick="fNext()" title="next">⏭</button>
  <span id="frameCount" style="font-size:11px">0 of 0</span>
</span>
<label>Speed: <output id="speedVal">2</output> fps
  <input id="speedInput" type="range" min="0.5" max="6" step="0.5" value="2" oninput="document.getElementById('speedVal').value=this.value;update_speed(+this.value)">
</label>
<span id="frameCaption" style="font-size:11px;min-height:24px;color:#222"></span>
<span id="runLog" style="display:block;white-space:pre-wrap;max-height:90px;overflow:auto;font:10px/1.35 ui-monospace,Consolas,monospace;border:1px solid #e0e0e0;border-radius:4px;padding:4px;background:#fff"></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);

    function findRoot(fn, a, b, tol) {

      for (var i = 0; i < 200; i++) {

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN
/* ───────────────────────── geometry & palette ─────────────────────────
   Banner aspect (~3.6:1) matches the source strip so the figure fills the
   container width instead of being letterboxed, and every font size is a
   large fraction of the viewBox so the p/i/j/r and brace captions dominate. */
var PAL = { pale: '#e8e8e8', dark: '#a8a8a8', white: '#ffffff', accent: '#e8720c', bad: '#d62728' };
var FIG_W = 660, FIG_H = 186;
var STRIP_X = 14, STRIP_W = FIG_W - 2 * STRIP_X;      // 632
var CY = 52, CH = 44;                                  // strip 52 .. 96
var LABELY = 36;                                       // p i j r centre
var ARROWY = 16;                                       // j-advance arrow
var BY = 104, CAPY = 146, NOTEY = 174;                 // braces, captions, note

var figDraw = SVG().addTo(document.getElementById('container')).size('100%', '100%');
figDraw.viewbox(0, 0, FIG_W, FIG_H);

var hatch = figDraw.pattern(7, 7, function (add) {
  add.rect(7, 7).fill('#ffe3e3');
  add.line(0, 7, 7, 0).stroke({ color: PAL.bad, width: 1.4 });
});

var gCells = figDraw.group(), gBars = figDraw.group(), gBraces = figDraw.group(),
  gArrow = figDraw.group(), gLabels = figDraw.group(), gAnno = figDraw.group();

/* ───────────────────────── drawing helpers ───────────────────────── */
function drawBrace(g, x0, x1, y) {
  var w = x1 - x0;
  if (w < 10) return;
  var d = Math.min(10, w / 4), mid = (x0 + x1) / 2;
  var p = 'M' + x0 + ' ' + y +
    ' Q' + x0 + ' ' + (y + d) + ' ' + (x0 + d) + ' ' + (y + d) +
    ' L' + (mid - d) + ' ' + (y + d) +
    ' Q' + mid + ' ' + (y + d) + ' ' + mid + ' ' + (y + 2 * d) +
    ' Q' + mid + ' ' + (y + d) + ' ' + (mid + d) + ' ' + (y + d) +
    ' L' + (x1 - d) + ' ' + (y + d) +
    ' Q' + x1 + ' ' + (y + d) + ' ' + x1 + ' ' + y;
  g.path(p).fill('none').stroke({ color: '#000', width: 1.5, linecap: 'round', linejoin: 'round' });
}

function arrowHead(g, x, y, dx, dy, size, color) {
  var len = Math.sqrt(dx * dx + dy * dy) || 1; dx /= len; dy /= len;
  var px = -dy, py = dx;
  var pts = [
    x + ',' + y,
    (x - dx * size + px * size * 0.55) + ',' + (y - dy * size + py * size * 0.55),
    (x - dx * size - px * size * 0.55) + ',' + (y - dy * size - py * size * 0.55)
  ].join(' ');
  g.polygon(pts).fill(color);
}

function swapArc(g, xa, xb, color) {
  var y0 = CY - 3, mid = (xa + xb) / 2;
  var apex = Math.max(18, y0 - (10 + Math.abs(xb - xa) * 0.22));
  g.path('M' + xa + ' ' + y0 + ' Q' + mid + ' ' + apex + ' ' + xb + ' ' + y0)
    .fill('none').stroke({ color: color, width: 2 });
  arrowHead(g, xa, y0, -(mid - xa), -(apex - y0), 7, color);
  arrowHead(g, xb, y0, (xb - mid), (y0 - apex), 7, color);
}

function halo(t, w) {
  t.attr({ 'paint-order': 'stroke', stroke: '#fff', 'stroke-width': (w == null ? 3.5 : w), 'stroke-linejoin': 'round' });
  return t;
}

function regionBlurb(region, bad) {
  var m = {
    le: 'This cell lies in A[p..i]: the loop has already proved its value is ≤ the pivot x. The i bar is the frontier of this known-small region.',
    gt: 'This cell lies in A[i+1..j-1]: it has been examined and found greater than x, so it stays put and the region simply grows to the right.',
    un: 'This cell lies in A[j..r-1]: it has never been looked at. Each iteration examines exactly one of these cells.',
    pivot: 'This is the pivot x = A[r]. It sits out of the way until the loop ends, then one final swap drops it on the seam between the two regions.'
  };
  return (bad ? 'INVARIANT VIOLATED here. ' : '') + m[region];
}

/* ───────────────────────── the renderer ───────────────────────── */
function render(st) {
  [gCells, gBars, gBraces, gArrow, gLabels, gAnno].forEach(function (g) { g.clear(); });
  var n = st.n, cw = STRIP_W / n;
  var pivotCell = (st.pivotCell == null ? st.r : st.pivotCell);
  function ex(k) { return STRIP_X + k * cw; }
  function cx(k) { return STRIP_X + (k + 0.5) * cw; }

  for (var k = 0; k < n; k++) {
    var region, fill;
    if (k === pivotCell) { region = 'pivot'; fill = PAL.white; }
    else if (k <= st.i) { region = 'le'; fill = PAL.pale; }
    else if (k < st.j) { region = 'gt'; fill = PAL.dark; }
    else { region = 'un'; fill = PAL.white; }
    var bad = !!(st.violations && st.violations.indexOf(k) >= 0);
    var cell = gCells.rect(cw, CH).move(ex(k), CY)
      .fill(bad ? hatch : fill).stroke({ color: '#000', width: 1.1 });
    cell.css('cursor', 'pointer');
    (function (idx, reg, isBad) {
      var names = { le: '≤ x (known small)', gt: '> x (known large)', un: 'unrestricted (not yet examined)', pivot: 'the pivot x' };
      var val = st.values ? String(st.values[idx]) : null;
      cell.on('mousemove', function (e) {
        showTooltip('A[' + idx + ']' + (val ? ' = ' + val : '') + ' — ' + names[reg] + (isBad ? '  ⚠ violates the invariant' : ''), e);
      }).on('mouseleave', hideTooltip)
        .on('click', function () { showPopup('Cell A[' + idx + ']', regionBlurb(reg, isBad)); });
    })(k, region, bad);

    if (st.values) {
      halo(gCells.text(String(st.values[k]))
        .font({ family: 'Georgia, serif', size: Math.min(21, cw * 0.48), anchor: 'middle' })
        .fill('#111'), 3).center(cx(k), CY + CH / 2);
    } else if (k === pivotCell && st.pivotText) {
      // pivot glyph is LEFT-aligned inside its cell, as in the source figure
      var pt = gCells.text(st.pivotText)
        .font({ family: 'Georgia, serif', size: Math.min(27, cw * 0.62), anchor: 'start', style: 'italic' })
        .fill('#111');
      pt.x(ex(k) + cw * 0.16);
      pt.cy(CY + CH / 2);
    }
  }

  // heavy boundary bars
  var bw = Math.max(4, Math.min(11, cw * 0.26));
  var bars = st.bars || [
    { edge: st.i + 1, label: 'The i bar', tip: 'i = ' + st.i + ' — everything left of this bar is known ≤ x. i is the frontier of what is known small.' },
    { edge: st.j, label: 'The j bar', tip: 'j = ' + st.j + ' — everything left of this bar has been examined. j is the frontier of what has been looked at at all.' },
    { edge: pivotCell, label: 'The pivot boundary', tip: 'The pivot x = A[' + pivotCell + '] waits here, outside all three regions, until the loop ends.' }
  ];
  bars.forEach(function (b) {
    var bx = Math.min(Math.max(ex(b.edge), STRIP_X + bw / 2), STRIP_X + STRIP_W - bw / 2);
    var rct = gBars.rect(bw, CH + 10).move(bx - bw / 2, CY - 5).fill('#000');
    rct.css('cursor', 'pointer')
      .on('mousemove', function (e) { showTooltip(b.tip, e); })
      .on('mouseleave', hideTooltip)
      .on('click', function () { showPopup(b.label, b.tip); });
  });

  // braces + captions — endpoints sit flush with the bars / array ends
  var braces = st.braces || [
    { a: st.p, b: st.i, t: '≤ x', it: true },
    { a: st.i + 1, b: Math.min(st.j - 1, pivotCell - 1), t: '> x', it: true },
    { a: st.j, b: pivotCell - 1, t: 'unrestricted', it: false }
  ];
  braces.forEach(function (br) {
    if (br.b < br.a || br.a < 0 || br.b > n - 1) return;
    var x0 = ex(br.a), x1 = ex(br.b + 1);
    drawBrace(gBraces, x0, x1, BY);
    var cap = gBraces.text(br.t)
      .font({ family: 'Georgia, serif', size: br.it ? 21 : 19, anchor: 'middle', style: br.it ? 'italic' : 'normal' })
      .fill('#000');
    halo(cap).center((x0 + x1) / 2, CAPY);
  });

  // motion indicators
  if (st.moveJ) {
    var xa = Math.max(STRIP_X, ex(st.moveJ[0])), xb = Math.min(STRIP_X + STRIP_W, ex(st.moveJ[1]));
    gArrow.line(xa, ARROWY, xb - 7, ARROWY).stroke({ color: PAL.accent, width: 2 });
    arrowHead(gArrow, xb, ARROWY, 1, 0, 7, PAL.accent);
  }
  if (st.swapPair) {
    swapArc(gArrow, cx(st.swapPair[0]), cx(st.swapPair[1]), PAL.accent);
  }
  if (st.compared != null && st.compared >= 0 && st.compared < n) {
    gArrow.rect(cw - 4, CH - 4).move(ex(st.compared) + 2, CY + 2)
      .fill('none').stroke({ color: PAL.accent, width: 2.8, linejoin: 'round' });
  }

  // index labels (drawn last, haloed, always readable)
  var labels = st.labels || [
    { k: st.p, t: 'p' }, { k: st.i, t: 'i' }, { k: st.j, t: 'j' }, { k: st.r, t: 'r' }
  ];
  labels.forEach(function (L) {
    var lx;
    if (L.k < 0) lx = STRIP_X - 9;
    else if (L.k > n - 1) lx = STRIP_X + STRIP_W + 9;
    else lx = cx(L.k);
    lx = Math.max(11, Math.min(FIG_W - 11, lx));
    halo(gLabels.text(L.t)
      .font({ family: 'Georgia, serif', size: 24, style: 'italic', anchor: 'middle' })
      .fill('#000')).center(lx, LABELY);
  });

  if (st.note) {
    var txt = st.note.length > 108 ? st.note.slice(0, 105) + '…' : st.note;
    halo(gAnno.text(txt)
      .font({ family: 'Helvetica, Arial, sans-serif', size: 12, anchor: 'middle' })
      .fill('#333')).center(FIG_W / 2, NOTEY);
  }
}

/* ───────────────────────── schematic (default) view ───────────────────────── */
var viewMode = 'schematic';
var schematic = { branch: 'skip', phase: 'idle' };

function renderSchematic() {
  var st = {
    n: 16, p: 0, r: 15, i: 3, j: 10, pivotCell: 15,
    values: null, pivotText: 'x', compared: null, swapPair: null,
    violations: [], note: null, moveJ: null
  };
  if (schematic.phase === 'before') {
    st.compared = 10;
    if (schematic.branch === 'swap') {
      st.swapPair = [4, 10];
      st.note = 'A[j] ≤ x — the ≤ x region must grow, so i++ and swap A[i] with A[j]: both bars advance.';
    } else {
      st.moveJ = [10, 11];
      st.note = 'A[j] > x — nothing is exchanged: j advances alone and the > x region swallows the cell.';
    }
  } else if (schematic.phase === 'after') {
    if (schematic.branch === 'swap') {
      st.i = 4; st.j = 11;
      st.note = 'Invariant restored: ≤ x grew by one cell, the evicted > x value landed at the end of the > x run.';
    } else {
      st.i = 3; st.j = 11;
      st.note = 'Invariant restored: > x grew by one cell, i and the pale region never moved.';
    }
  }
  render(st);
  document.getElementById('applyIterBtn').textContent =
    (schematic.phase === 'after') ? '◂ Reset iteration' : 'Apply this iteration ▸';
}

/* ───────────────────────── sandboxed trace runner ───────────────────────── */
var RUNNER_BODY = `
function runPartition(code, arr){
  var A = arr.slice();
  var p = 0, r = A.length - 1;
  var I = p - 1, J = p;
  var frames = [];
  var ops = 0, MAXOPS = 20000, MAXFRAMES = 400;
  var t0 = Date.now();
  function guard(){
    ops++;
    if (ops > MAXOPS) throw new Error('Operation cap reached (' + MAXOPS + ') - the loop never ends.');
    if (frames.length >= MAXFRAMES) throw new Error('Frame cap reached (' + MAXFRAMES + ') - too many recorded steps.');
    if (Date.now() - t0 > 1500) throw new Error('Timed out after 1.5 s - the loop probably never ends.');
  }
  function chk(k, name){
    k = Number(k);
    if (!isFinite(k) || Math.floor(k) !== k || k < 0 || k > r) throw new Error(name + '(' + k + '): index outside 0..' + r);
    return k;
  }
  function push(kind, idx, msg, cmp, swp){
    frames.push({ kind: kind, state: A.slice(), i: I, j: J, p: p, r: r, indices: idx || [], message: msg, compared: cmp || null, swap: swp || null });
  }
  function pivot(){ return A[r]; }
  function value(k){ k = chk(k, 'value'); return A[k]; }
  function lessEq(k){
    guard(); k = chk(k, 'lessEq');
    var res = A[k] <= A[r];
    push('compare', [k, r], 'compare A[' + k + '] = ' + A[k] + (res ? ' \\u2264 ' : ' > ') + 'x = ' + A[r] + '  \\u2192  ' + res, { k: k, res: res }, null);
    return res;
  }
  function swap(a, b){
    guard(); a = chk(a, 'swap'); b = chk(b, 'swap');
    var t = A[a]; A[a] = A[b]; A[b] = t;
    push('swap', [a, b], 'swap A[' + a + '] \\u2194 A[' + b + ']  \\u2192  A[' + a + ']=' + A[a] + ', A[' + b + ']=' + A[b], null, [a, b]);
  }
  function setI(k){
    guard(); k = Number(k);
    if (!isFinite(k) || Math.floor(k) !== k || k < p - 1 || k > r) throw new Error('setI(' + k + '): must be between ' + (p - 1) + ' and ' + r);
    I = k;
    push('setI', [k], 'i = ' + k + (k < p ? '  \\u2192  the \\u2264 x region is empty' : '  \\u2192  \\u2264 x region is A[' + p + '..' + k + ']'), null, null);
  }
  function setJ(k){
    guard(); k = Number(k);
    if (!isFinite(k) || Math.floor(k) !== k || k < p || k > r) throw new Error('setJ(' + k + '): must be between ' + p + ' and ' + r);
    J = k;
    push('setJ', [k], 'j = ' + k + '  \\u2192  now examining cell ' + k, null, null);
  }
  function note(t){
    if (frames.length) frames[frames.length - 1].message = String(t);
    else push('note', [], String(t), null, null);
  }
  var view = A;
  try { view = new Proxy(A, { set: function(){ throw new Error('A cannot be assigned directly - use swap(a, b).'); } }); } catch(e) {}
  var q = null;
  try {
    var factory = new Function('pivot','value','lessEq','swap','setI','setJ','note',
      '"use strict";\\n' + code + '\\nif (typeof partition !== "function") { throw new Error("No function named partition(A, p, r) was defined."); }\\nreturn partition;');
    var entry = factory(pivot, value, lessEq, swap, setI, setJ, note);
    q = entry(view, p, r);
  } catch(e){
    frames.push({ kind:'error', state: A.slice(), i: I, j: J, p: p, r: r, indices: [], message: '\\u26a0 ' + ((e && e.message) ? e.message : String(e)), compared: null, swap: null, error: true });
    return { frames: frames, q: null, error: true };
  }
  frames.push({ kind:'done', state: A.slice(), i: I, j: J, p: p, r: r, indices: [], message: 'loop finished \\u2014 partition returned q = ' + q, compared: null, swap: null, done: true, q: (typeof q === 'number' ? q : null) });
  return { frames: frames, q: (typeof q === 'number' ? q : null), error: false };
}
`;

var WORKER_SRC = RUNNER_BODY +
  '\nself.onmessage = function(ev){ var out; try { out = runPartition(ev.data.code, ev.data.arr); }' +
  ' catch(e){ out = { frames: [{ kind:"error", state: ev.data.arr.slice(), i:-1, j:0, p:0, r:ev.data.arr.length-1,' +
  ' indices:[], message: "\\u26a0 " + ((e && e.message) ? e.message : e), compared:null, swap:null, error:true }], q:null, error:true }; }' +
  ' self.postMessage(out); };';

var _mainRunner = null;
function mainRun(code, arr) {

    if (!_mainRunner) _mainRunner = new Function(RUNNER_BODY + '\nreturn runPartition;')();

      frames: [{
        kind: 'error', state: arr.slice(), i: -1, j: 0, p: 0, r: arr.length - 1,
        indices: [], message: '⚠ ' + (e && e.message ? e.message : e), compared: null, swap: null, error: true
      }], q: null, error: true
    };
  }
}

/* ───────────────────────── code samples ───────────────────────── */
var SAMPLES = {
  sample: [
    'function partition(A, p, r) {',
    '  const x = pivot();            // x = A[r]',
    '  let i = p - 1;',
    '  setI(i);                      // the ≤ x region starts empty',
    '  for (let j = p; j < r; j++) {',
    '    setJ(j);',
    '    if (lessEq(j)) {            // A[j] ≤ x',
    '      i = i + 1;',
    '      setI(i);',
    '      swap(i, j);               // move it into the ≤ x region',
    "      note('A[j] ≤ x: ≤ x region grows, both bars advance');",
    '    } else {',
    "      note('A[j] > x: only j advances, > x region grows');",
    '    }',
    '  }',
    '  swap(i + 1, r);               // drop the pivot on the seam',
    '  setI(i + 1);',
    '  return i + 1;',
    '}'
  ].join('\n'),
  buggy: [
    'function partition(A, p, r) {',
    '  const x = pivot();',
    '  let i = p - 1;',
    '  setI(i);',
    '  for (let j = p; j < r; j++) {',
    '    setJ(j);',
    '    if (lessEq(j)) {',
    '      i = i + 1;',
    '      setI(i);                  // BUG: the bar moves ...',
    '      // swap(i, j);            // ... but the element never does,',
    "      note('bar moved, element did not!');  // so a > x value is left inside ≤ x",
    '    }',
    '  }',
    '  swap(i + 1, r);',
    '  setI(i + 1);',
    '  return i + 1;',
    '}'
  ].join('\n'),
  starter: [
    'function partition(A, p, r) {',
    '  const x = pivot();',
    '  let i = p - 1;',
    '  setI(i);',
    '  // your loop here:',
    '  //   setJ(j) before you look at a cell',
    '  //   lessEq(j) to compare, swap(a, b) to exchange,',
    '  //   setI(i) whenever the ≤ x frontier moves.',
    '',
    '  return i + 1;',
    '}'
  ].join('\n')
};

function loadSample(which) {
  document.getElementById('partitionCode').value = SAMPLES[which] || SAMPLES.starter;
}

/* ───────────────────────── replay state ───────────────────────── */
var frames = [], fidx = -1, origArr = [], lastQ = null, finalBad = [], runState = 'idle';
var invariantOn = true, playTimer = null, playFps = 2, caseFocus = 'A[j] > x (skip branch)';

function setStatus(txt, color) {
  var el = document.getElementById('runStatus');
  el.textContent = txt; el.style.color = color || '#555';
}

function parseArr() {
  var raw = document.getElementById('partitionInput').value;
  var parts = raw.split(/[^0-9eE.+-]+/).filter(function (s) { return s.length; });
  var nums = parts.map(Number);
  if (nums.length < 2 || nums.some(function (v) { return !isFinite(v); }))
    throw new Error('Enter at least 2 numbers, comma separated.');
  return nums.slice(0, 16);
}

function frameViolations(f) {
  if (!invariantOn || !f.state) return [];
  if (f.done) return finalBad.slice();
  var x = f.state[f.r], bad = [], k;
  for (k = f.p; k <= f.i && k < f.r; k++) if (f.state[k] > x) bad.push(k);
  for (k = f.i + 1; k < f.j && k < f.r; k++) if (f.state[k] <= x) bad.push(k);
  return bad;
}

function renderFrame() {
  if (fidx < 0 || !frames.length) { renderSchematic(); return; }
  var f = frames[fidx];
  var st = {
    n: f.state.length, p: f.p, r: f.r, i: f.i, j: f.j, pivotCell: f.r,
    values: f.state, pivotText: null,
    compared: f.compared ? f.compared.k : null,
    swapPair: f.swap || null,
    violations: frameViolations(f),
    note: f.message, moveJ: null
  };
  if (f.done && typeof f.q === 'number' && f.q >= 0 && f.q <= f.r) {
    var q = f.q;
    st.i = q - 1; st.j = f.r + 1; st.pivotCell = q;
    st.braces = [{ a: f.p, b: q - 1, t: '≤ x', it: true }, { a: q + 1, b: f.r, t: '> x', it: true }];
    st.labels = [{ k: f.p, t: 'p' }, { k: q, t: 'q' }, { k: f.r, t: 'r' }];
    st.bars = [
      { edge: q, label: 'the seam', tip: 'The pivot now sits at A[' + q + '] = ' + f.state[q] + ': every cell left of it is ≤ it.' },
      { edge: q + 1, label: 'the seam', tip: 'Every cell right of the pivot is > it. q = ' + q + ' is the returned split point.' }
    ];
    st.compared = q;
    st.violations = invariantOn ? finalBad.slice() : [];
  }
  render(st);
  document.getElementById('frameCaption').textContent = f.message;
  updateCounter(); updateLog();
}

function renderCurrent() { if (viewMode === 'trace') renderFrame(); else renderSchematic(); }

function updateCounter() {
  document.getElementById('frameCount').textContent = (frames.length ? (fidx + 1) : 0) + ' of ' + frames.length;
}
function updateLog() {
  var el = document.getElementById('runLog'), out = [];
  for (var k = 0; k <= fidx && k < frames.length; k++) out.push((k + 1) + '. ' + frames[k].message);
  el.textContent = out.slice(-60).join('\n');
  el.scrollTop = el.scrollHeight;
}

/* ───────────────────────── running ───────────────────────── */
function evaluate(out) {
  finalBad = [];
  var last = out.frames[out.frames.length - 1];
  if (out.error) { runState = 'error'; setStatus(last ? last.message : '⚠ error', '#c62828'); return; }
  var A = last.state, r = A.length - 1, q = out.q, x0 = origArr[origArr.length - 1], k;
  if (typeof q !== 'number' || q < 0 || q > r || Math.floor(q) !== q) {
    runState = 'wrong'; setStatus('✘ partition() did not return a valid index', '#c62828'); return;
  }
  if (A[q] !== x0) finalBad.push(q);
  for (k = 0; k < q; k++) if (A[k] > x0) finalBad.push(k);
  for (k = q + 1; k <= r; k++) if (A[k] <= x0) finalBad.push(k);
  if (finalBad.length === 0) { runState = 'ok'; setStatus('✔ correctly partitioned — q = ' + q, '#2e7d32'); }
  else {
    runState = 'wrong';
    setStatus('✘ not partitioned: cell' + (finalBad.length > 1 ? 's' : '') + ' ' + finalBad.join(', ') + ' violate the property (hatched red)', '#c62828');
  }
}

function finishRun(out, afterFn) {
  document.getElementById('runBtn').disabled = false;
  frames = out.frames || [];
  lastQ = out.q;
  evaluate(out);
  viewMode = 'trace';
  fidx = frames.length ? 0 : -1;
  renderFrame();
  if (typeof afterFn === 'function') afterFn();
}

function runCode(afterFn) {
  stopPlay();
  var arr;
  try { arr = parseArr(); } catch (e) { setStatus('⚠ ' + e.message, '#c62828'); return; }
  origArr = arr.slice();
  var code = document.getElementById('partitionCode').value;
  setStatus('running…', '#555');
  document.getElementById('runBtn').disabled = true;
  var used = false;
  try {
    var url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    var w = new Worker(url);
    var done = false;
    var to = setTimeout(function () {
      if (done) return; done = true; w.terminate(); URL.revokeObjectURL(url);
      finishRun({
        frames: [{
          kind: 'error', state: arr.slice(), i: -1, j: 0, p: 0, r: arr.length - 1, indices: [],
          message: '⚠ Timed out — your loop never finished.', compared: null, swap: null, error: true
        }], q: null, error: true
      }, afterFn);
    }, 2200);
    w.onmessage = function (ev) {
      if (done) return; done = true; clearTimeout(to); w.terminate(); URL.revokeObjectURL(url);
      finishRun(ev.data, afterFn);
    };
    w.onerror = function () {
      if (done) return; done = true; clearTimeout(to); w.terminate(); URL.revokeObjectURL(url);
      finishRun(mainRun(code, arr), afterFn);
    };
    used = true;
  } catch (e) { used = false; }
  if (!used) finishRun(mainRun(code, arr), afterFn);
}

/* ───────────────────────── playback ───────────────────────── */
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  document.getElementById('playBtn').textContent = '▶';
}
function fFirst() { stopPlay(); if (frames.length) { viewMode = 'trace'; fidx = 0; renderFrame(); } }
function fPrev() { stopPlay(); if (frames.length && fidx > 0) { viewMode = 'trace'; fidx--; renderFrame(); } }
function fNext() { stopPlay(); if (frames.length && fidx < frames.length - 1) { viewMode = 'trace'; fidx++; renderFrame(); } }
function fPlay() {
  if (playTimer) { stopPlay(); return; }
  if (!frames.length) return;
  viewMode = 'trace';
  if (fidx >= frames.length - 1) fidx = 0;
  document.getElementById('playBtn').textContent = '⏸';
  playTimer = setInterval(function () {
    if (fidx >= frames.length - 1) { stopPlay(); return; }
    fidx++; renderFrame();
  }, 1000 / playFps);
}
function update_speed(v) {
  playFps = v;
  if (playTimer) { stopPlay(); fPlay(); }
}

/* ───────────────────────── controls ───────────────────────── */
function toggle_invariantOverlay(on) { invariantOn = on; renderCurrent(); }

function applyCase(v) {
  caseFocus = v;
  document.getElementById('caseFocusInput').value = v;
  schematic.branch = (v.indexOf('≤') >= 0) ? 'swap' : 'skip';
}

function toggle_caseFocus(v) {
  caseFocus = v;
  var wantTrue = (v.indexOf('≤') >= 0);
  if (viewMode === 'trace' && frames.length) {
    stopPlay();
    var k;
    for (k = fidx + 1; k < frames.length; k++) {
      if (frames[k].kind === 'compare' && frames[k].compared && frames[k].compared.res === wantTrue) { fidx = k; renderFrame(); return; }
    }
    for (k = 0; k < frames.length; k++) {
      if (frames[k].kind === 'compare' && frames[k].compared && frames[k].compared.res === wantTrue) { fidx = k; renderFrame(); return; }
    }
    document.getElementById('frameCaption').textContent = 'no ' + v + ' iteration in this run';
  } else {
    schematic.branch = wantTrue ? 'swap' : 'skip';
    if (schematic.phase === 'idle') schematic.phase = 'before';
    viewMode = 'schematic';
    renderSchematic();
  }
}

function trigger_applyIter() {
  if (viewMode === 'trace') { fNext(); return; }
  schematic.phase = (schematic.phase === 'after') ? 'before' : 'after';
  renderSchematic();
}

function showSchematic() {
  stopPlay();
  viewMode = 'schematic';
  schematic.phase = 'idle';
  document.getElementById('frameCaption').textContent = '';
  renderSchematic();
}

/* ───────────────────────── demo steps ───────────────────────── */
function setInv(on) {
  invariantOn = on;
  document.getElementById('invariantOverlayInput').checked = on;
}
function gotoFirstCompare() {
  for (var k = 0; k < frames.length; k++) if (frames[k].kind === 'compare') { fidx = k; renderFrame(); return; }
}
function gotoFirstViolation() {
  for (var k = 0; k < frames.length; k++) {
    if (frameViolations(frames[k]).length) { fidx = k; renderFrame(); return; }
  }
  fidx = frames.length - 1; renderFrame();
}

var demoSteps = [
  {
    t: 'Read the picture before running anything',
    n: 'The strip shows the state at the top of one iteration: pale gray cells are already known ≤ x, dark gray cells are known > x, white cells have not been looked at, and the pivot x sits alone at position r. The bars at i and j are the only things that move.',
    run: function () { stopPlay(); viewMode = 'schematic'; schematic.phase = 'idle'; applyCase('A[j] > x (skip branch)'); setInv(true); renderSchematic(); }
  },
  {
    t: 'The skip branch: A[j] > x',
    n: 'When the scanned cell is greater than the pivot, nothing is exchanged — j advances by one and the dark gray > x region simply swallows the cell. The i bar and the pale gray region are untouched. Press “Apply this iteration ▸” to watch the picture restore itself.',
    run: function () { stopPlay(); viewMode = 'schematic'; applyCase('A[j] > x (skip branch)'); schematic.phase = 'before'; setInv(true); renderSchematic(); }
  },
  {
    t: 'The swap branch: A[j] ≤ x',
    n: 'When the scanned cell is at most the pivot, the ≤ x region must grow by one cell, but that cell is currently occupied by a > x value. Incrementing i and swapping A[i] with A[j] moves the small value left and pushes the big value to the far end of the > x region — both bars advance.',
    run: function () { stopPlay(); viewMode = 'schematic'; applyCase('A[j] ≤ x (swap branch)'); schematic.phase = 'before'; setInv(true); renderSchematic(); }
  },
  {
    t: 'Write the loop yourself',
    n: 'Implement partition with lessEq, swap, setI and setJ, then replay it frame by frame. Every boundary you see move is one of your own setI/setJ calls; every recoloured cell is one of your swaps.',
    run: function () { setInv(true); loadSample('sample'); runCode(gotoFirstCompare); }
  },
  {
    t: 'Break it on purpose',
    n: 'Load the buggy version that advances the i bar without swapping the small element into place. With invariant checking on, watch a cell greater than x appear inside the pale gray region — the picture stops being true, and the final array is no longer partitioned.',
    run: function () { setInv(true); loadSample('buggy'); runCode(gotoFirstViolation); }
  },
  {
    t: 'Termination: place the pivot',
    n: 'When j reaches r the unrestricted region is empty, so the array is just ≤ x followed by > x followed by the pivot. One final swap of A[i+1] with A[r] drops the pivot exactly on the seam, and i+1 is the returned split point q.',
    run: function () { setInv(true); loadSample('sample'); runCode(function () { fidx = frames.length - 1; renderFrame(); }); }
  }
];
var stepIdx = 0;

function applyStep(k) {
  stepIdx = Math.max(0, Math.min(demoSteps.length - 1, k));
  var s = demoSteps[stepIdx];
  document.getElementById('demoNarration').innerHTML = '<b>' + s.t + '</b><br>' + s.n;
  document.getElementById('stepLabel').textContent = (stepIdx + 1) + ' / ' + demoSteps.length;
  s.run();
}
function nextStep() { applyStep(stepIdx + 1); }
function prevStep() { applyStep(stepIdx - 1); }

/* ───────────────────────── init ───────────────────────── */
loadSample('sample');
applyStep(0);
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
</body>

</html>
