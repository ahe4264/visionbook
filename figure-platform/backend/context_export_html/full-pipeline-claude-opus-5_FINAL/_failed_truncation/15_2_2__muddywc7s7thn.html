<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<p id="demoNarration" style="margin:0 0 2px 0;font-size:12px;line-height:1.45;color:#222"></p>
<span style="display:flex;gap:6px;align-items:center;font-size:11px">
  <button onclick="prevStep()">◀</button>
  <span id="stepLabel" style="flex:1;text-align:center"></span>
  <button onclick="nextStep()">▶</button>
</span>
<label>Number of partition arcs n: <output id="numSegmentsVal">8</output>
  <input id="numSegmentsInput" type="range" min="3" max="60" step="1" value="8"
    oninput="document.getElementById('numSegmentsVal').value=this.value;update_numSegments(+this.value)"></label>
<label>Which arc k is magnified: <output id="highlightArcVal">5</output>
  <input id="highlightArcInput" type="range" min="1" max="8" step="1" value="5"
    oninput="document.getElementById('highlightArcVal').value=this.value;update_highlightArc(+this.value)"></label>
<label>Sample point P<sub>k</sub>* inside the arc: <output id="sampleWithinArcVal">0.50</output>
  <input id="sampleWithinArcInput" type="range" min="0" max="1" step="0.01" value="0.5"
    oninput="document.getElementById('sampleWithinArcVal').value=(+this.value).toFixed(2);update_sampleWithinArc(+this.value)"></label>
<label>Display:
  <select id="viewModeInput" onchange="update_viewMode(this.value)">
    <option>Geometry only</option>
    <option>Show density f</option>
    <option>Show Riemann sum</option>
  </select></label>
<span style="font-size:11px;color:#555;line-height:1.4">Drag the red dot P<sub>k</sub>* in the magnified inset — any point of the arc is a legal choice.</span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);

    mathText(gLabels,cap.x,cap.y+12,PARTS.mass,30,{anchor:'middle'});

    labelAt(0,PARTS.P0,{fx:4,fy:56,anchor:'middle'});
    labelAt(L,PARTS.Q,{fx:-6,fy:-34,anchor:'middle'});
    var side = (MODE==='geom')?1:-1;
    if(N<=16){
      [1,2,3].forEach(function(idx){
        if(idx<N && idx!==K-1 && idx!==K) labelAt(sArr[idx],P_(String(idx)),{side:side,off:36});
      });
      if(N-1>3 && N-1!==K-1 && N-1!==K) labelAt(sArr[N-1],PARTS.Pn1,{side:side,off:38});
    }
    labelAt(s1,PARTS.Pk1,{side:side,off:38,back:true});
    labelAt(s2,PARTS.Pk,{side:side,off:110,leader:true});

    /* ---- ribbon zoom arrow ---- */
    var A={x:mid.x+nm.x*20,y:mid.y+nm.y*20}, B={x:752,y:672};
    var C={x:(A.x+B.x)/2+130,y:(A.y+B.y)/2-110};
    var poly=ribbonPath(A,C,B,9,34,2.0);
    var rib=gRibbon.polygon(ptsStr(poly)).fill('#fae3ba').stroke({color:'#b3b3b3',width:3.5,linejoin:'round'}).css('cursor','pointer');
    rib.on('mousemove',function(e){showTooltip('Magnify the kth arc →',e);}).on('mouseleave',hideTooltip);

    /* ---- inset ---- */
    drawInset(arcPts,arcLen,sSample);

    /* ---- panel + legend ---- */
    if(MODE!=='geom') drawLegend();
    if(MODE==='riemann') drawPanel(sArr);
  }

  function labelAt(s,parts,o){
    o=o||{};
    var p=pointAt(s);
    if(o.fx!=null){ mathText(gLabels,p.x+o.fx,p.y+o.fy,parts,34,{anchor:o.anchor||'middle'}); return; }
    var t=tanAt(s), nv=rnorm(t);
    if(o.side<0) nv={x:-nv.x,y:-nv.y};
    var off=o.off||36;
    var q={x:p.x+nv.x*off,y:p.y+nv.y*off};
    if(o.back){ q.x-=t.x*26; q.y-=t.y*26; }
    var anchor = nv.x>0.3?'start':(nv.x<-0.3?'end':'middle');
    var xx=q.x+(anchor==='start'?8:(anchor==='end'?-8:0));
    var yy=q.y+(nv.y>0.3?22:(nv.y<-0.3?-6:11));
    if(o.leader){
      var lp={x:p.x+nv.x*20,y:p.y+nv.y*20};
      gAnno.line(q.x-nv.x*14,q.y-nv.y*14,lp.x,lp.y).stroke({color:'#000',width:2});
      head(gAnno,lp.x,lp.y,lp.x-q.x,lp.y-q.y,14,'#000');
    }
    mathText(gLabels,xx,yy,parts,34,{anchor:anchor});
  }

  function drawInset(arcPts,arcLen,sSample){
    var a=arcPts[0], b=arcPts[arcPts.length-1];
    var ang=Math.atan2(b.y-a.y,b.x-a.x), rot=-0.19-ang;
    var ca=Math.cos(rot), sa=Math.sin(rot), loc=[];
    var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(var i=0;i<arcPts.length;i++){
      var dx=arcPts[i].x-a.x, dy=arcPts[i].y-a.y;
      var lp={x:dx*ca-dy*sa,y:dx*sa+dy*ca};
      loc.push(lp);
      if(lp.x<minx)minx=lp.x; if(lp.x>maxx)maxx=lp.x;
      if(lp.y<miny)miny=lp.y; if(lp.y>maxy)maxy=lp.y;
    }
    var bw=Math.max(maxx-minx,1), bh=Math.max(maxy-miny,1);
    var sc=Math.min(340/bw,150/bh,9);
    var cx=(minx+maxx)/2, cy=(miny+maxy)/2, CX=960, CY=866;
    insetPts=loc.map(function(p){return {x:CX+(p.x-cx)*sc,y:CY+(p.y-cy)*sc};});
    insetCum=[0];
    for(var j=1;j<insetPts.length;j++)
      insetCum.push(insetCum[j-1]+Math.hypot(insetPts[j].x-insetPts[j-1].x,insetPts[j].y-insetPts[j-1].y));

    gInset.polyline(ptsStr(insetPts)).fill('none').stroke({color:BLUE,width:9,linecap:'round',linejoin:'round'});
    var st=insetPts[0], en=insetPts[insetPts.length-1];
    gInset.circle(24).center(st.x,st.y).fill(BLUE);
    gInset.circle(24).center(en.x,en.y).fill(BLUE);
    mathText(gLabels,st.x-6,st.y+54,PARTS.Pk1,34,{anchor:'middle'});
    mathText(gLabels,en.x+26,en.y+12,PARTS.Pk,34,{anchor:'start'});

    /* inset Δs bracket */
    var minY=1e9; insetPts.forEach(function(p){ if(p.y<minY) minY=p.y; });
    var yBr=minY-62, up={x:0,y:-1};
    tick(gInset,{x:st.x,y:yBr},up,-24,24,'#000');
    tick(gInset,{x:en.x,y:yBr},up,-24,24,'#000');
    doubleArrow(gInset,{x:st.x,y:yBr},{x:en.x,y:yBr},'#000',2.6,16);
    mathText(gLabels,(st.x+en.x)/2,yBr-16,PARTS.ds,32,{anchor:'middle'});

    /* red sample dot */
    var target=U*insetCum[insetCum.length-1], idx=0;
    for(var k2=1;k2<insetCum.length;k2++){ if(insetCum[k2]>=target){ idx=k2; break; } }
    var rp=insetPts[idx]||insetPts[Math.floor(insetPts.length/2)];
    var dot=gInset.circle(26).center(rp.x,rp.y).fill(RED).stroke({color:'#fff',width:2}).css('cursor','grab');
    dot.on('mousemove',function(e){showTooltip('Drag me — Pₖ* may be ANY point of the arc. f(Pₖ*) = '+fAt(pointAt(sSample)).toFixed(2),e);})
       .on('mouseleave',hideTooltip)
       .on('click',function(){showPopup('The sample point Pₖ*',
         'Pₖ*(xₖ*, yₖ*, zₖ*) is an arbitrarily chosen point of the kth arc. Different choices give different Riemann sums, but as the arcs shrink every choice gives the same limit — the line integral ∫_C f ds.');});
    dot.node.addEventListener('pointerdown',function(e){ dragging=true; e.preventDefault(); });
    mathText(gLabels,1010,1000,PARTS.star,32,{anchor:'middle',color:'#b8221a'});
    gInset.line(1010,972,rp.x,rp.y+18).stroke({color:'#b8221a',width:2});
  }

  function drawLegend(){
    var x0=760,y0=300,w=220,h=18;
    for(var i=0;i<44;i++){
      gPanel.rect(w/44+0.7,h).move(x0+i*w/44,y0)
        .fill(colorFor(FMIN+(FMAX-FMIN)*(i+0.5)/44)).stroke('none');
    }
    gPanel.rect(w,h).move(x0,y0).fill('none').stroke({color:'#999',width:1.5});
    mathText(gPanel,x0,y0+44,[['low ','r'],['f','i']],24,{anchor:'start',color:'#444'});
    mathText(gPanel,x0+w,y0+44,[['high ','r'],['f','i']],24,{anchor:'end',color:'#444'});
    mathText(gPanel,x0,y0+80,[['f','i'],[' = linear density along the wire','r']],24,{anchor:'start',color:'#444'});
  }

  function drawPanel(sArr){
    var sum=0;
    for(var i=0;i<N;i++){
      var ss=sArr[i], se=sArr[i+1];
      sum+=fAt(pointAt(ss+(se-ss)*U))*(se-ss)/100;
    }
    var box=gPanel.rect(452,176).move(742,76).fill('#ffffff').stroke({color:'#c8c8c8',width:2.5}).radius(8).css('cursor','pointer');
    box.on('mousemove',function(e){showTooltip('Riemann sum vs. exact line integral — raise n to watch them merge',e);})
       .on('mouseleave',hideTooltip)
       .on('click',function(){showPopup('Riemann sum → line integral',
         'The sum Σ f(Pₖ*)Δsₖ adds one approximate mass per arc. As n increases the arcs shrink, the error shrinks like the variation of f over an arc, and the sum converges to ∫_C f ds — regardless of where the sample points sit inside their arcs.');});
    mathText(gPanel,766,118,[['Riemann sum,  ','r'],['n','i'],[' = '+N,'r']],27,{anchor:'start',color:'#333',halo:false});
    mathText(gPanel,766,162,[['Σ ','r'],['f','i'],['(','r'],['P','i'],['k','sr'],['*','sup'],[')','r'],['Δ','r'],['s','i'],['k','sr'],[' = '+sum.toFixed(3),'r']],30,{anchor:'start',halo:false});
    mathText(gPanel,766,204,[['∫','r'],['C','sr'],[' f','i'],[' ds','i'],[' = '+EXACT.toFixed(3),'r']],30,{anchor:'start',halo:false});
    mathText(gPanel,766,240,[['error = '+Math.abs(sum-EXACT).toFixed(3),'r']],25,{anchor:'start',color:'#b8221a',halo:false});
  }

  /* ---------------- dragging ---------------- */
  function svgPt(e){
    var p=draw.node.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
    return p.matrixTransform(draw.node.getScreenCTM().inverse());
  }
  document.addEventListener('pointermove',function(e){
    if(!dragging||!insetPts.length) return;
    var p=svgPt(e), best=0, bd=1e18;
    for(var i=0;i<insetPts.length;i++){
      var d=(insetPts[i].x-p.x)*(insetPts[i].x-p.x)+(insetPts[i].y-p.y)*(insetPts[i].y-p.y);
      if(d<bd){bd=d;best=i;}
    }
    var tot=insetCum[insetCum.length-1]||1;
    U=Math.max(0,Math.min(1,insetCum[best]/tot));
    document.getElementById('sampleWithinArcInput').value=U;
    document.getElementById('sampleWithinArcVal').value=U.toFixed(2);
    redraw();
  });
  document.addEventListener('pointerup',function(){ dragging=false; });

  /* ---------------- controls ---------------- */
  window.update_numSegments=function(v){
    N=Math.round(v);
    var hi=document.getElementById('highlightArcInput');
    hi.max=String(N);
    if(K>N){ K=N; hi.value=String(K); document.getElementById('highlightArcVal').value=String(K); }
    redraw();
  };
  window.update_highlightArc=function(v){ K=Math.max(1,Math.min(N,Math.round(v))); redraw(); };
  window.update_sampleWithinArc=function(v){ U=v; redraw(); };
  window.update_viewMode=function(v){
    MODE = v==='Show density f'?'density':(v==='Show Riemann sum'?'riemann':'geom');
    redraw();
  };

  /* ---------------- demo steps ---------------- */
  var STEPS=[
    {t:'The curve and its endpoints',n:'A wire runs through space from P = P₀ to Q = Pₙ. We want its total mass when the linear density varies from point to point.',s:{numSegments:3,viewMode:'Geometry only',highlightArc:2}},
    {t:'Partition into n arcs',n:'Mark points P₁, P₂, …, Pₙ₋₁ along the curve. The kth arc, from Pₖ₋₁ to Pₖ, has arc length Δsₖ and carries mass ΔMₖ.',s:{numSegments:8,viewMode:'Geometry only',highlightArc:5}},
    {t:'Zoom in on one arc',n:'Magnifying the kth arc shows it is nearly straight and short. Pick any point Pₖ*(xₖ*, yₖ*, zₖ*) on it — drag the red dot to see that the choice is free.',s:{numSegments:8,viewMode:'Show density f',highlightArc:5}},
    {t:'Approximate the mass of one arc',n:'Over such a tiny arc the density is nearly constant, so ΔMₖ ≈ f(xₖ*, yₖ*, zₖ*) Δsₖ — density at the sample point times arc length.',s:{numSegments:8,viewMode:'Show density f',highlightArc:5}},
    {t:'Sum over all arcs',n:'Adding these approximations gives the Riemann sum Σ f(Pₖ*)Δsₖ, an estimate of the total mass of the wire.',s:{numSegments:14,viewMode:'Show Riemann sum',highlightArc:5}},
    {t:'Let n → ∞',n:'Push n higher: the arcs shrink, the choice of sample point stops mattering, and the sum converges to the line integral ∫_C f ds.',s:{numSegments:60,viewMode:'Show Riemann sum',highlightArc:5}}
  ];
  var stepIdx=0;
  function showNarration(){
    document.getElementById('demoNarration').textContent=STEPS[stepIdx].n;
    document.getElementById('stepLabel').textContent='Step '+(stepIdx+1)+'/'+STEPS.length+' — '+STEPS[stepIdx].t;
  }
  function applyStep(i){
    stepIdx=Math.max(0,Math.min(STEPS.length-1,i));
    var st=STEPS[stepIdx].s;
    N=st.numSegments;
    var ni=document.getElementById('numSegmentsInput');
    ni.value=String(N); document.getElementById('numSegmentsVal').value=String(N);
    var hi=document.getElementById('highlightArcInput');
    hi.max=String(N);
    K=Math.max(1,Math.min(N,st.highlightArc));
    hi.value=String(K); document.getElementById('highlightArcVal').value=String(K);
    document.getElementById('viewModeInput').value=st.viewMode;
    MODE = st.viewMode==='Show density f'?'density':(st.viewMode==='Show Riemann sum'?'riemann':'geom');
    showNarration();
    redraw();
  }
  window.nextStep=function(){ applyStep(stepIdx+1); };
  window.prevStep=function(){ applyStep(stepIdx-1); };

  /* ---------------- init (matches the source figure) ---------------- */
  showNarration();
  redraw();
  window.__markRendered();
})();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
