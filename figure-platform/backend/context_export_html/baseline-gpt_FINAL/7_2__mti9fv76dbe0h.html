<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so #ui always takes a right-side column instead of covering
       the figure. The #container ResizeObserver then fires 'fig-resize', so
       setPlotFrame re-lays the figure out at its new size automatically.        */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
      padding: var(--figure-canvas-padding, 18px);
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       #ui is a grid cell with its own scroll, an opaque background, and roomier
       type. Generated code cannot switch it to an overlay or bottom strip.      */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body data-ui-layout="right">
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span style="font-weight:700">PARTITION workbench</span>
<span style="font-size:11px;color:#444">Edit the algorithm, run it, then scrub the recorded invariant states.</span>
<span><button onclick="loadCodeSample('correct')">Correct sample</button> <button onclick="loadCodeSample('buggy')">Buggy sample</button> <button onclick="loadCodeSample('starter')">Starter</button></span>
<label>Input A <input id="partInput" value="9,3,7,2,8,5,1,6" style="width:100%;box-sizing:border-box"></label>
<textarea id="partCode">function PARTITION(api) {
  const p = api.p(), r = api.r(), x = api.pivot();
  let i = p - 1;
  api.setI(i);

  for (let j = p; j &lt; r; j++) {
    api.beginIteration(j, i);
    api.setJ(j);

    if (api.compare(j, x)) {
      i = i + 1;
      api.setI(i);
      api.swap(i, j);
    }

    api.endIteration(j, i);
  }

  api.setJ(r);
  api.swap(i + 1, r);
  return i + 1;
}</textarea>
<button onclick="runPartition()">Run PARTITION</button>
<span id="statusText" style="font-size:11px;color:#555">Status: not run</span>
<span><button onclick="firstFrame()">|◀</button> <button onclick="prevFrame()">◀</button> <button id="playBtn" onclick="togglePlay()">▶</button> <button onclick="nextFrame()">▶</button> <button onclick="lastFrame()">▶|</button></span>
<label>Replay speed <output id="speedVal">1</output>x<input id="speedInput" type="range" min="0.5" max="4" step="0.5" value="1" oninput="document.getElementById('speedVal').value=this.value;setReplaySpeed(+this.value)"></label>
<span id="frameCounter" style="font-size:11px">0 of 0</span>
<span id="captionText" style="font-size:11px;color:#222">Source schematic: the loop invariant at the top of an iteration.</span>
<label><input id="caseInput" type="checkbox" onchange="toggle_case(this.checked)"> Test case A[j] ≤ x</label>
<button onclick="trigger_branch()">Apply selected branch</button>
<span id="demoNarration" style="margin:0;font-size:10px;max-width:180px">Step 0: schematic invariant view from CLRS Figure 7.2.</span>
<span><button onclick="prevStep()">◀</button> <span id="stepLabel">step 1 of 5</span> <button onclick="nextStep()">▶</button></span>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    function _containerInnerSize() {
      var container = document.getElementById('container');
      var style = getComputedStyle(container);
      var padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
      var padY = (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0);
      return {
        width: Math.max(0, container.clientWidth - padX),
        height: Math.max(0, container.clientHeight - padY)
      };
    }

    new ResizeObserver(function () {
      var rect = _containerInnerSize();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: keep controls in a right-side column ─────────────────────
     * setUiLayout(...) is retained only so older generated payloads do not
     * crash. It deliberately cannot change the side, overlay state, or size.
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     */
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _autoUiLayout();
    }

    function _applyUiLayout(mode, sizePx) {
      var next = 'right';
      document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Generated figures do not get to decide panel placement: a stable right
    // column prevents controls from covering the figure and avoids layout jumps.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var mode = 'right';
      var start = hasEditor ? 400 : 300;
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var innerSize = _containerInnerSize();
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: innerSize.width || 900,
        height: innerSize.height || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({
              color: opts.fill || '#7fb3ff',
              opacity: (opts.opacity == null) ? 0.45 : opts.opacity
            });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4', width: opts.width || 2,
                linecap: 'round', linejoin: 'round'
              });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** integrateSimpson(fn, a, b, n=200) → number. Composite Simpson's rule. */
    function integrateSimpson(fn, a, b, n) {
      n = Math.max(2, n || 200);
      if (n % 2) n++;
      var h = (b - a) / n, s = fn(a) + fn(b);
      for (var i = 1; i < n; i++) s += fn(a + i * h) * ((i % 2) ? 4 : 2);
      return (s * h) / 3;
    }

    /** findRoot(fn, a, b, tol=1e-9) → number | null. Bisection; null if no sign change. */
    function findRoot(fn, a, b, tol) {
      tol = tol || 1e-9;
      var fa = fn(a), fb = fn(b);
      if (!isFinite(fa) || !isFinite(fb) || fa * fb > 0) return null;
      for (var i = 0; i < 200; i++) {
        var m = (a + b) / 2, fm = fn(m);
        if (!isFinite(fm)) return null;
        if (Math.abs(fm) < tol || (b - a) / 2 < tol) return m;
        if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
      }
      return (a + b) / 2;
    }

    /* ── Equation input binding ──────────────────────────────────────────── */
    /**
     * The error slot is keyed PER INPUT (id "eq-err-<inputId>"), never just
     * "the first .eq-err under my parent": generated figures routinely put
     * several equation inputs under one parent, and a shared slot means a valid
     * edit of field B hides field A's still-current parse error, leaving A's
     * curve stale with nothing on screen to explain why.
     * The .eq-err class is kept so the scaffold CSS still applies.
     *
     * DUPLICATED: keep in sync with _equationErrorSlot in base_scene_new.html.
     */
    function _equationErrorSlot(input) {
      var parent = input.parentNode || document.getElementById('ui');
      if (input.id) {
        var slotId = 'eq-err-' + input.id;
        var byId = document.getElementById(slotId);
        if (byId) return byId;
        var namedSpan = document.createElement('span');
        namedSpan.id = slotId;
        namedSpan.className = 'eq-err';
        namedSpan.style.display = 'none';
        parent.appendChild(namedSpan);
        return namedSpan;
      }
      var existing = parent.querySelector('.eq-err');
      if (existing) return existing;
      var span = document.createElement('span');
      span.className = 'eq-err';
      span.style.display = 'none';
      parent.appendChild(span);
      return span;
    }

    /**
     * _resolveEqTarget(inputId, t) → function(fn, src)
     * Turns one bindEquationInput target into a concrete applier, and THROWS on
     * anything it cannot drive. Silently skipping an unrecognised target is the
     * worst possible outcome: the figure renders, typing changes nothing, and
     * nothing reports it. Throwing makes verify2dHtml catch the mistake at
     * generation time instead of the student discovering it.
     *
     * DUPLICATED: keep in sync with _resolveEqTarget in base_scene_new.html.
     */
    function _resolveEqTarget(inputId, t) {
      if (typeof t === 'function') {
        return function (fn, src) { t(fn, src); };
      }
      if (t && t.handle) {
        var method = t.method || 'setFn';
        if (typeof t.handle[method] !== 'function') {
          throw new Error(
            'bindEquationInput("' + inputId + '"): target handle has no method "' + method +
            '". Use { handle, method: \'...\' } with a method the handle really has ' +
            '(plotFunction: setExpr, setFn; fillBetween: setLower, setUpper; ' +
            'plotParametric: setX, setY).'
          );
        }
        return function (fn) { t.handle[method](fn); };
      }
      if (t && typeof t.setFn === 'function') {
        return function (fn) { t.setFn(fn); };
      }
      throw new Error(
        'bindEquationInput("' + inputId + '"): this target cannot be driven — it is not a ' +
        'function and has no .setFn. Handles without .setFn (fillBetween, plotParametric) ' +
        'must be passed as { handle, method: \'setUpper\' } naming the setter to call.'
      );
    }

    /**
     * bindEquationInput(inputId, targets, opts) → { apply, input, errorSlot }
     *   targets: a plot handle, a { handle, method } pair, a function(fn, src),
     *            or an array of any of those.
     *   opts   : { variables=['x'], onChange(fn, src) }
     *
     * On every valid edit, every target re-samples. On a parse error the last
     * good curve is kept and the message is shown inline — this function NEVER
     * substitutes a hardcoded default.
     * Throws at bind time on a target it cannot drive (see _resolveEqTarget).
     *
     * DUPLICATED: keep in sync with bindEquationInput in base_scene_new.html.
     */
    function bindEquationInput(inputId, targets, opts) {
      opts = opts || {};
      var input = document.getElementById(inputId);
      if (!input) throw new Error('bindEquationInput: no element with id "' + inputId + '"');
      var vars = opts.variables || ['x'];
      var list = Array.isArray(targets) ? targets : [targets];
      var slot = _equationErrorSlot(input);
      // Validated once, loudly, before anything is wired up.
      var appliers = [];
      for (var k = 0; k < list.length; k++) appliers.push(_resolveEqTarget(inputId, list[k]));

      function apply(src) {
        try {
          // The dispatch is INSIDE the try as well: an error thrown while
          // applying (a target callback that throws, a handle mutated later)
          // would otherwise escape uncaught from the input event handler and
          // leave the figure stale with no visible reason.
          var fn = compileExpr(src, vars);
          for (var i = 0; i < appliers.length; i++) appliers[i](fn, src);
          if (typeof opts.onChange === 'function') opts.onChange(fn, src);
        } catch (e) {
          slot.textContent = e.message;
          slot.style.display = '';
          input.setAttribute('data-eq-valid', 'false');
          return false;
        }
        slot.textContent = '';
        slot.style.display = 'none';
        input.setAttribute('data-eq-valid', 'true');
        return true;
      }

      input.addEventListener('input', function () { apply(input.value); });
      apply(input.value);
      return { apply: apply, input: input, errorSlot: slot };
    }

    // @FIGURE_CODE_BEGIN

function regionColor(region, focus) {
  if (focus === 'le' && region === 'le') return '#d6ebff';
  if (focus === 'gt' && region === 'gt') return '#8f8f8f';
  if ((focus === 'leCase' || focus === 'gtCase') && region === 'un') return '#fff8c9';
  if (region === 'le') return '#e5e5e5';
  if (region === 'gt') return '#a6a6a6';
  return '#ffffff';
}

function addUnderBrace(g, x1, x2, y, h, label, size) {
  if (x2 <= x1 + 8) return;
  var mid = (x1 + x2) / 2;
  var span = x2 - x1;
  var a = Math.min(80, span * 0.22);
  var path = [
    'M', x1, y,
    'C', x1, y + h * 0.55, x1 + a * 0.45, y + h * 0.55, x1 + a, y + h * 0.55,
    'C', mid - a * 0.45, y + h * 0.55, mid - a * 0.22, y + h * 0.78, mid, y + h,
    'C', mid + a * 0.22, y + h * 0.78, mid + a * 0.45, y + h * 0.55, x2 - a, y + h * 0.55,
    'C', x2 - a * 0.45, y + h * 0.55, x2, y + h * 0.55, x2, y
  ].join(' ');
  g.path(path).fill('none').stroke({ color: '#000000', width: 2.2, linecap: 'round', linejoin: 'round' });
  g.text(label).font({ family: 'Times New Roman, serif', size: size || 38 }).center(mid, y + h + 30);
}

function drawFrame(frame) {
  root.clear();
  frame = frame || makeSourceFrame();
  var s = frame.state || makeSourceFrame().state;
  var A = s.A || [];
  var n = Math.max(2, A.length);
  var x0 = 40, y0 = 90, totalW = 1120, cellH = 70;
  var cw = totalW / n;
  var p = Math.max(0, Math.min(n - 1, s.p == null ? 0 : s.p));
  var r = Math.max(0, Math.min(n - 1, s.r == null ? n - 1 : s.r));
  var i = s.i == null ? p - 1 : s.i;
  var j = s.j == null ? p : s.j;
  var focus = frame.regionFocus || '';
  var highlight = {};
  (frame.indices || []).forEach(function (k) { highlight[k] = true; });
  (frame.badIndices || []).forEach(function (k) { highlight[k] = 'bad'; });

  var g = root.group();

  for (var k = 0; k < n; k++) {
    var region = 'un';
    if (k >= p && k <= i) region = 'le';
    else if (k > i && k < j && k < r) region = 'gt';
    else region = 'un';

    var fill = (k === r) ? '#ffffff' : regionColor(region, focus);
    if (highlight[k] === true && k !== r) fill = frame.kind === 'compare' ? '#fff3a6' : fill;
    if (highlight[k] === 'bad') fill = '#ffd6d6';

    var rect = g.rect(cw, cellH).move(x0 + k * cw, y0).fill(fill).stroke({ color: '#000000', width: 1.6 });
    rect.css('cursor', 'pointer');
    (function (kk, rr) {
      rect.on('mousemove', function (e) {
        var msg = kk === r ? 'Pivot cell A[r]. The pivot value x is stored here until the final swap.' :
          rr === 'le' ? 'Classified region A[p..i]: every item here is ≤ x.' :
          rr === 'gt' ? 'Classified region A[i+1..j−1]: every item here is > x.' :
          'Unrestricted region A[j..r−1]: these items have not yet been examined.';
        showTooltip(msg, e);
      }).on('mouseleave', function () { hideTooltip(); })
        .on('click', function () {
          showPopup('Array cell A[' + kk + ']', kk === r
            ? 'This is the pivot position r. The algorithm stores x = A[r] here while it scans the rest of the subarray.'
            : 'The cell color shows what the loop invariant currently knows about this position.');
        });
    })(k, region);

    if (s.showValues && A[k] !== '' && A[k] != null) {
      g.text(String(A[k])).font({ family: 'sans-serif', size: Math.min(28, cw * 0.35), weight: 600 })
        .center(x0 + k * cw + cw / 2, y0 + cellH / 2 + 1);
    } else if (!s.showValues && k === r) {
      g.text('x').font({ family: 'Times New Roman, serif', size: 46, style: 'italic' })
        .center(x0 + k * cw + cw / 2, y0 + cellH / 2);
    }
  }

  function barAt(boundary, label, labelAtCell) {
    var bx = x0 + boundary * cw;
    if (boundary < 0) bx = x0;
    if (boundary > n) bx = x0 + n * cw;
    g.rect(Math.max(10, cw * 0.15), cellH + 18).center(bx, y0 + cellH / 2).fill('#000000');
    if (label) {
      var lx = labelAtCell == null ? bx : x0 + labelAtCell * cw + cw / 2;
      g.text(label).font({ family: 'Times New Roman, serif', size: 44, style: 'italic' }).center(lx, y0 - 34);
    }
  }

  g.text('p').font({ family: 'Times New Roman, serif', size: 44, style: 'italic' })
    .center(x0 + p * cw + cw / 2, y0 - 34);
  barAt(Math.max(0, Math.min(n, i + 1)), 'i');
  barAt(Math.max(0, Math.min(n, j)), 'j');
  barAt(r, null);
  g.text('r').font({ family: 'Times New Roman, serif', size: 44, style: 'italic' })
    .center(x0 + r * cw + cw / 2, y0 - 34);

  var braceY = y0 + cellH + 18;
  addUnderBrace(g, x0 + p * cw, x0 + Math.max(p, i + 1) * cw, braceY, 34, '≤ x', 38);
  addUnderBrace(g, x0 + Math.max(p, i + 1) * cw, x0 + Math.max(Math.max(p, i + 1), j) * cw, braceY, 34, '> x', 38);
  addUnderBrace(g, x0 + Math.max(j, p) * cw, x0 + r * cw, braceY, 34, 'unrestricted', 34);

  if (frame.kind === 'compare' && j >= 0 && j < n) {
    var arrowX = x0 + j * cw + cw / 2;
    var arrow = g.path('M ' + arrowX + ' ' + (y0 - 6) + ' L ' + arrowX + ' ' + (y0 - 32))
      .fill('none').stroke({ color: '#d27b00', width: 3, linecap: 'round' });
    arrow.marker('end', 8, 8, function (add) {
      add.path('M0,0 L8,4 L0,8 z').fill('#d27b00');
    });
  }

  if (frame.kind === 'swap' && (frame.indices || []).length >= 2) {
    var a = frame.indices[0], b = frame.indices[1];
    var ax = x0 + a * cw + cw / 2, bx2 = x0 + b * cw + cw / 2;
    var sy = y0 - 18;
    var swapPath = g.path('M ' + ax + ' ' + sy + ' C ' + ax + ' ' + (sy - 28) + ' ' + bx2 + ' ' + (sy - 28) + ' ' + bx2 + ' ' + sy)
      .fill('none').stroke({ color: '#0066cc', width: 2.5, linecap: 'round' });
    swapPath.marker('end', 8, 8, function (add) { add.path('M0,0 L8,4 L0,8 z').fill('#0066cc'); });
  }

  document.getElementById('captionText').textContent = frame.message || '';
  document.getElementById('frameCounter').textContent = traceFrames.length ? ((traceIndex + 1) + ' of ' + traceFrames.length) : '0 of 0';
}

function parseArrayInput() {
  var raw = document.getElementById('partInput').value;
  var arr = raw.split(/[,\s]+/).filter(Boolean).map(function (v) { return Number(v); });
  if (arr.length < 2 || arr.some(function (v) { return !isFinite(v); })) {
    throw new Error('Enter at least two numeric array values, separated by commas.');
  }
  if (arr.length > 18) throw new Error('Use at most 18 values so the strip remains readable.');
  return arr;
}

function workerSource() {
  return `
self.onmessage = function (ev) {
  const code = ev.data.code;
  const input = ev.data.input.slice();
  const A = input.slice();
  const p = 0, r = A.length - 1, x = A[r];
  let i = p - 1, j = p;
  let frames = [];
  let ops = 0;
  const OP_CAP = 5000, FRAME_CAP = 1200;

  function fail(msg) { throw new Error(msg); }
  function range(k, name) {
    if (!Number.isInteger(k) || k < p || k > r) fail(name + ' index ' + k + ' is outside p..r');
  }
  function push(kind, indices, message, extra) {
    ops++;
    if (ops > OP_CAP) fail('operation cap hit; possible infinite algorithm');
    if (frames.length >= FRAME_CAP) fail('frame cap hit; too many recorded states');
    frames.push(Object.assign({
      kind: kind,
      indices: indices || [],
      message: message,
      state: { A: A.slice(), p: p, r: r, i: i, j: j, x: x, showValues: true }
    }, extra || {}));
  }

  push('start', [], 'Start: pivot x = A[r] = ' + x + '; no elements have been classified yet.');

  const api = Object.freeze({
    p: function () { return p; },
    r: function () { return r; },
    pivot: function () { return x; },
    length: function () { return A.length; },
    get: function (k) { range(k, 'get'); return A[k]; },
    setI: function (v) {
      if (!Number.isInteger(v) || v < p - 1 || v >= r) fail('i must stay in p−1..r−1');
      i = v;
      push('setI', [Math.max(p, Math.min(r, i))], 'set i = ' + i + '; the ≤ x region ends at i.');
    },
    setJ: function (v) {
      if (!Number.isInteger(v) || v < p || v > r) fail('j must stay in p..r');
      j = v;
      push('setJ', [Math.min(j, r)], 'set j = ' + j + '; A[j..r−1] is the unrestricted region.');
    },
    beginIteration: function (jj, ii) {
      if (Number.isInteger(ii)) i = ii;
      if (Number.isInteger(jj)) j = jj;
      if (j < p || j > r) fail('beginIteration received an invalid j');
      push('begin', [Math.min(j, r)], 'Before the iteration: invariant regions are shown; now inspect A[j].');
    },
    endIteration: function (jj, ii) {
      if (Number.isInteger(ii)) i = ii;
      if (Number.isInteger(jj)) j = jj;
      push('end', [], 'After the iteration: the invariant is restored for the next value of j.');
    },
    compare: function (k, value) {
      range(k, 'compare');
      const result = A[k] <= value;
      push('compare', [k], 'compare A[' + k + ']=' + A[k] + ' with x=' + value + ' → ' + result);
      return result;
    },
    swap: function (a, b) {
      range(a, 'swap');
      range(b, 'swap');
      const beforeA = A[a], beforeB = A[b];
      const tmp = A[a]; A[a] = A[b]; A[b] = tmp;
      push('swap', [a, b], 'swap A[' + a + ']=' + beforeA + ' with A[' + b + ']=' + beforeB + '.');
    }
  });

  try {
    const runner = new Function('api', code + '\\n;if (typeof PARTITION !== "function") throw new Error("Define function PARTITION(api).");\\nreturn PARTITION(api);');
    const q = runner(api);
    push('return', [q], 'PARTITION returned q = ' + q + '.', { result: q });
    self.postMessage({ ok: true, frames: frames, result: q });
  } catch (err) {
    push('error', [], 'Error: ' + (err && err.message ? err.message : String(err)));
    self.postMessage({ ok: false, frames: frames, error: err && err.message ? err.message : String(err) });
  }
};`;
}

function checkPartition(frames, q) {
  if (!frames.length || !Number.isInteger(q)) return { ok: false, bad: [], reason: 'No integer partition index was returned.' };
  var A = frames[frames.length - 1].state.A;
  var p = frames[frames.length - 1].state.p;
  var r = frames[frames.length - 1].state.r;
  var x = frames[frames.length - 1].state.x;
  var bad = [];
  if (q < p || q > r) bad.push(Math.max(p, Math.min(r, q || p)));
  for (var k = p; k < q && k < A.length; k++) if (!(A[k] <= x)) bad.push(k);
  for (var m = q + 1; m <= r && m < A.length; m++) if (!(A[m] > x)) bad.push(m);
  if (q >= p && q <= r && A[q] !== x) bad.push(q);
  return { ok: bad.length === 0, bad: bad, reason: bad.length ? 'Some cells violate the final partition property.' : 'Correct partition.' };
}

function runPartition() {
  stopPlay();
  var status = document.getElementById('statusText');
  status.textContent = 'Status: running…';
  status.style.color = '#555';

  var arr, code;
  try {
    arr = parseArrayInput();
    lastInputArray = arr.slice();
    code = document.getElementById('partCode').value;
  } catch (e) {
    status.textContent = 'Status: error — ' + e.message;
    status.style.color = '#b00020';
    return;
  }

  var blob = new Blob([workerSource()], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);
  var worker = new Worker(url);
  var done = false;

  var timeout = setTimeout(function () {
    if (done) return;
    done = true;
    worker.terminate();
    URL.revokeObjectURL(url);
    traceFrames = [{
      kind: 'error',
      message: 'Error: timeout; the worker was stopped, likely because the loop never finished.',
      state: { A: arr.slice(), p: 0, r: arr.length - 1, i: -1, j: 0, x: arr[arr.length - 1], showValues: true },
      indices: []
    }];
    traceIndex = 0;
    drawFrame(traceFrames[0]);
    status.textContent = 'Status: error — timeout';
    status.style.color = '#b00020';
  }, 1800);

  worker.onmessage = function (ev) {
    if (done) return;
    done = true;
    clearTimeout(timeout);
    worker.terminate();
    URL.revokeObjectURL(url);

    traceFrames = ev.data.frames || [];
    var result = checkPartition(traceFrames, ev.data.result);
    if (traceFrames.length && !result.ok) {
      traceFrames[traceFrames.length - 1].badIndices = result.bad;
      traceFrames[traceFrames.length - 1].message += ' Wrong answer: ' + result.reason;
    }

    traceIndex = 0;
    drawFrame(traceFrames[0] || makeSourceFrame());

    if (!ev.data.ok) {
      status.textContent = 'Status: error — ' + ev.data.error;
      status.style.color = '#b00020';
    } else if (result.ok) {
      status.textContent = 'Status: correct';
      status.style.color = '#1b7f32';
    } else {
      status.textContent = 'Status: wrong answer';
      status.style.color = '#b26b00';
    }
  };

  worker.postMessage({ code: code, input: arr });
}

function showTraceIndex(idx) {
  if (!traceFrames.length) return;
  traceIndex = Math.max(0, Math.min(traceFrames.length - 1, idx));
  drawFrame(traceFrames[traceIndex]);
}

function firstFrame() { showTraceIndex(0); }
function prevFrame() { showTraceIndex(traceIndex - 1); }
function nextFrame() { showTraceIndex(traceIndex + 1); }
function lastFrame() { showTraceIndex(traceFrames.length - 1); }

function setReplaySpeed(v) { replaySpeed = v || 1; if (replayTimer) { stopPlay(); togglePlay(); } }

function togglePlay() {
  if (replayTimer) { stopPlay(); return; }
  document.getElementById('playBtn').textContent = 'Ⅱ';
  replayTimer = setInterval(function () {
    if (!traceFrames.length || traceIndex >= traceFrames.length - 1) {
      stopPlay();
      return;
    }
    nextFrame();
  }, 650 / replaySpeed);
}

function stopPlay() {
  if (replayTimer) clearInterval(replayTimer);
  replayTimer = null;
  document.getElementById('playBtn').textContent = '▶';
}

function toggle_case(on) {
  stopPlay();
  var A = on ? [2, 4, 1, 8, 7, 3, 9, 6] : [2, 4, 1, 8, 7, 9, 5, 6];
  var msg = on
    ? 'Selected case: A[j] = 3 ≤ x = 6. The branch will increment i and swap A[i] with A[j].'
    : 'Selected case: A[j] = 9 > x = 6. The branch will leave i fixed and simply advance j.';
  drawFrame({
    kind: 'compare',
    message: msg,
    state: { A: A, p: 0, i: 2, j: 5, r: 7, x: 6, showValues: true },
    indices: [5],
    regionFocus: on ? 'leCase' : 'gtCase'
  });
}

function trigger_branch() {
  var on = document.getElementById('caseInput').checked;
  if (on) {
    drawFrame({
      kind: 'swap',
      message: 'Because A[j] ≤ x, i advances from 2 to 3 and the small item is swapped into A[p..i].',
      state: { A: [2, 4, 1, 3, 7, 8, 9, 6], p: 0, i: 3, j: 5, r: 7, x: 6, showValues: true },
      indices: [3, 5],
      regionFocus: 'le'
    });
  } else {
    drawFrame({
      kind: 'end',
      message: 'Because A[j] > x, there is no swap. When j advances, this item joins the > x region.',
      state: { A: [2, 4, 1, 8, 7, 9, 5, 6], p: 0, i: 2, j: 6, r: 7, x: 6, showValues: true },
      indices: [5],
      regionFocus: 'gt'
    });
  }
}

function updateDemoUi() {
  document.getElementById('demoNarration').textContent = 'Step ' + demoStep + ': ' + demoFrames[demoStep].message;
  document.getElementById('stepLabel').textContent = 'step ' + (demoStep + 1) + ' of ' + demoFrames.length;
}

function showDemoStep() {
  stopPlay();
  traceFrames = [];
  traceIndex = 0;
  drawFrame(demoFrames[demoStep]);
  updateDemoUi();
}

function prevStep() {
  demoStep = Math.max(0, demoStep - 1);
  showDemoStep();
}

function nextStep() {
  demoStep = Math.min(demoFrames.length - 1, demoStep + 1);
  showDemoStep();
}

drawFrame(makeSourceFrame());
updateDemoUi();
window.__markRendered();
// @FIGURE_CODE_END

    // Decide the panel layout once the generated UI exists. Runs last so it sees
    // the final #ui content; a setUiLayout() call in the block above wins.
    _autoUiLayout();
  </script>
