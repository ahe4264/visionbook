<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Some Familiar Solids of Revolution</title>
<style>
  :root{
    --teal:#17b3b8;
    --teal-deep:#0e7f86;
    --region:#c6e9ea;
    --ink:#1b1b1b;
    --muted:#5d6668;
    --line:#b9c0c2;
    --bg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:18px 18px 38px;}
  h1{
    font-weight:500;font-size:clamp(20px,2.6vw,30px);
    text-align:center;margin:4px 0 14px;letter-spacing:.2px;
  }
  .controls{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:10px 16px;padding:10px 14px;margin:0 auto 16px;
    border:1px solid var(--line);border-radius:10px;background:#fbfdfd;
    max-width:980px;
  }
  button{
    font:inherit;font-size:13px;padding:6px 13px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  button:hover{border-color:var(--teal);color:var(--teal-deep)}
  button.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
  button.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
  .ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  input[type=range]{width:190px;accent-color:var(--teal)}
  .theta-read{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:52px;display:inline-block;text-align:right}
  label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
  input[type=checkbox]{accent-color:var(--teal);width:15px;height:15px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.grid{grid-template-columns:1fr}}

  .panel{
    display:flex;flex-direction:column;align-items:center;
    padding:6px 4px 10px;border-radius:12px;border:1px solid transparent;
    cursor:pointer;transition:opacity .25s, border-color .25s, background .25s;
  }
  .panel.is-focus{border-color:#8fd9dc;background:#f4fcfc}
  .grid.has-focus .panel:not(.is-focus){opacity:.34}
  .panel svg.flat{width:100%;height:auto;display:block}
  .panel canvas{width:100%;display:block;touch-action:none;cursor:grab}
  .panel canvas:active{cursor:grabbing}
  .namebox{
    margin-top:6px;border:1px solid #9aa3a5;border-radius:3px;
    padding:7px 10px;font-size:14px;line-height:1.25;text-align:center;
    min-height:44px;display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .letter{margin-top:8px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:18px}

  .detail{
    max-width:980px;margin:18px auto 0;border:1px solid var(--line);border-radius:10px;
    padding:13px 16px;background:#fbfdfd;font-size:14.5px;line-height:1.6;color:#23292a;
    min-height:86px;
  }
  .detail h2{margin:0 0 4px;font-size:15.5px;color:var(--teal-deep);font-weight:700}
  .detail .eq{font-family:"Cambria Math",Cambria,Georgia,"Times New Roman",serif;font-size:16.5px}
  .detail .dim{color:var(--muted);font-size:13.5px}
  .hint{color:var(--muted);font-size:13.5px}
  sub,sup{font-size:.72em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Some Familiar Solids of Revolution</h1>

  <div class="controls">
    <button id="play" class="primary">▶ Revolve</button>
    <div class="ctl">
      <span>Sweep&nbsp;angle&nbsp;&theta;</span>
      <input id="theta" type="range" min="0" max="360" step="1" value="360">
      <span class="theta-read" id="thetaRead">360°</span>
    </div>
    <label class="chk"><input type="checkbox" id="showRegion" checked> Show generating region</label>
    <button id="reset">Reset views</button>
    <button id="showAll">Show all panels</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="detail" id="detail"></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 *  Some Familiar Solids of Revolution
 *  Every solid is genuinely generated by revolving its plane region:
 *  the mesh is the surface swept by the region's boundary over the
 *  sweep angle theta, capped by the plane region itself at t = 0 and
 *  t = theta.  Nothing is drawn by hand.
 * ------------------------------------------------------------------ */

var TAU = Math.PI * 2;

/* ---------------- panel definitions (shared world units) ----------- */
var R_CYL = 0.63, R_SPH = 0.72, R_CON = 0.60, R1 = 0.30, R2 = 0.68;

var PANELS = [
  {
    letter: "(a)", name: "Right circular cylinder", key: "cylinder",
    x0: -1, x1: 1, rhi: function(){ return R_CYL; }, rlo: function(){ return 0; },
    alpha: 1, nx: 14,
    flat: function(P){ return rect(P, -1, 1, 0, R_CYL); },
    title: "(a) Rectangle → right circular cylinder",
    body: "Region: the rectangle 0 ≤ y ≤ R over 0 ≤ x ≤ h, with one side lying on the axis. "
        + "Revolving it about the axis sends every horizontal slice to a full circle, so each cross-section "
        + "perpendicular to the axis is a <em>disk</em> of constant radius R.",
    eq: "V = ∫<sub>0</sub><sup>h</sup> πR² dx = πR²h",
    dim: "Here R = " + R_CYL + ", h = 2 (world units)."
  },
  {
    letter: "(b)", name: "Solid sphere", key: "sphere",
    x0: -R_SPH, x1: R_SPH,
    rhi: function(x){ return Math.sqrt(Math.max(0, R_SPH*R_SPH - x*x)); },
    rlo: function(){ return 0; },
    alpha: 1, nx: 34,
    flat: function(P){ return semicircle(P, R_SPH); },
    title: "(b) Semicircular region → solid sphere",
    body: "Region: the half-disk 0 ≤ y ≤ √(R² − x²), −R ≤ x ≤ R, with its diameter on the axis. "
        + "Each cross-section is a disk whose radius is the semicircle's height √(R² − x²), and every point of "
        + "the boundary stays a distance R from the centre — the surface swept out is a sphere.",
    eq: "V = ∫<sub>−R</sub><sup>R</sup> π(R² − x²) dx = ⁴⁄₃ πR³",
    dim: "Here R = " + R_SPH + "."
  },
  {
    letter: "(c)", name: "Solid cone", key: "cone",
    x0: -1, x1: 1,
    rhi: function(x){ return R_CON * (x + 1) / 2; }, rlo: function(){ return 0; },
    alpha: 1, nx: 14,
    flat: function(P){ return triangle(P, -1, 1, R_CON); },
    title: "(c) Right triangle → solid cone",
    body: "Region: the triangle 0 ≤ y ≤ (R/h)x over 0 ≤ x ≤ h, with one leg on the axis. "
        + "The hypotenuse sweeps the slanted lateral surface; the radius of the disk cross-section grows "
        + "linearly from 0 at the apex to R at the base.",
    eq: "V = ∫<sub>0</sub><sup>h</sup> π(Rx/h)² dx = ⅓ πR²h",
    dim: "Here R = " + R_CON + ", h = 2."
  },
  {
    letter: "(d)", name: "Hollowed right circular cylinder", key: "tube",
    x0: -1, x1: 1,
    rhi: function(){ return R2; }, rlo: function(){ return R1; },
    alpha: 0.6, nx: 14,
    flat: function(P){ return rect(P, -1, 1, R1, R2); },
    title: "(d) Rectangle off the axis → hollowed right circular cylinder",
    body: "Region: the rectangle r₁ ≤ y ≤ r₂ over 0 ≤ x ≤ h, separated from the axis by the gap r₁. "
        + "Because no point of the region touches the axis, the revolved solid has a cylindrical hole through it: "
        + "each cross-section is a <em>washer</em> (annulus), not a disk.",
    eq: "V = ∫<sub>0</sub><sup>h</sup> π(r₂² − r₁²) dx = π(r₂² − r₁²)h",
    dim: "Here r₁ = " + R1 + ", r₂ = " + R2 + ", h = 2."
  }
];

/* ---------------- global interaction state ------------------------- */
var state = { theta: TAU, playing: false, focus: -1, showRegion: true };
var DEF_AZ = -0.36, DEF_EL = 0.0;

/* ---------------- 2-D (plane region) drawing ----------------------- */
var U2 = 78, CX2 = 112, AY2 = 118;           // px per world unit, centre, axis line y
function X2(x){ return CX2 + x * U2; }
function Y2(r){ return AY2 - r * U2; }

function rect(P, x0, x1, ra, rb){
  return '<rect class="reg" x="' + X2(x0).toFixed(2) + '" y="' + Y2(rb).toFixed(2) +
         '" width="' + ((x1 - x0) * U2).toFixed(2) + '" height="' + ((rb - ra) * U2).toFixed(2) + '"/>';
}
function semicircle(P, R){
  var a = X2(-R), b = X2(R), r = R * U2;
  return '<path class="reg" d="M' + a.toFixed(2) + ' ' + AY2 + ' A' + r.toFixed(2) + ' ' + r.toFixed(2) +
         ' 0 0 1 ' + b.toFixed(2) + ' ' + AY2 + ' Z"/>';
}
function triangle(P, x0, x1, R){
  return '<path class="reg" d="M' + X2(x0).toFixed(2) + ' ' + AY2 + ' L' + X2(x1).toFixed(2) + ' ' +
         Y2(R).toFixed(2) + ' L' + X2(x1).toFixed(2) + ' ' + AY2 + ' Z"/>';
}

/* curved rotation arrow: an ellipse seen edge-on, wrapped round the axis */
function arrowPath(cx, cy, rx, ry){
  var d = "", a;
  for (a = 30; a >= -300; a -= 5){
    var t = a * Math.PI / 180;
    var px = cx + rx * Math.cos(t), py = cy + ry * Math.sin(t);
    d += (d ? "L" : "M") + px.toFixed(2) + " " + py.toFixed(2);
  }
  // tangent at the final point (a = -300 deg == 60 deg), travelling with decreasing a
  var te = 60 * Math.PI / 180;
  var ex = cx + rx * Math.cos(te), ey = cy + ry * Math.sin(te);
  var tx = rx * Math.sin(te), ty = -ry * Math.cos(te);
  var m = Math.hypot(tx, ty); tx /= m; ty /= m;
  var nx = -ty, ny = tx, L = 11, W = 4.6;
  var head = "M" + (ex + tx * L).toFixed(2) + " " + (ey + ty * L).toFixed(2) +
             "L" + (ex + nx * W).toFixed(2) + " " + (ey + ny * W).toFixed(2) +
             "L" + (ex - nx * W).toFixed(2) + " " + (ey - ny * W).toFixed(2) + "Z";
  return { arc: d, head: head };
}

function buildSVG(P, i){
  var ar = arrowPath(213, AY2, 10, 26);
  return '' +
  '<svg class="flat" viewBox="0 0 240 152" role="img" aria-label="plane region for ' + P.name + '">' +
    '<g class="regionG">' + P.flat(P) + '</g>' +
    '<line class="axis2" x1="6" y1="' + AY2 + '" x2="236" y2="' + AY2 + '"/>' +
    '<path class="arrowArc" d="' + ar.arc + '"/>' +
    '<path class="arrowHead" d="' + ar.head + '"/>' +
    '<text class="axlbl" x="5" y="141">Axis of revolution</text>' +
  '</svg>';
}

/* ---------------- colour ramp (cached) ----------------------------- */
var STOPS = [
  [0.00,  10,  84,  94],
  [0.45,  58, 178, 186],
  [0.76, 172, 228, 232],
  [1.00, 255, 255, 255]
];
var RAMP_N = 200, RAMP = new Array(RAMP_N);
(function(){
  for (var i = 0; i < RAMP_N; i++){
    var t = i / (RAMP_N - 1), k = 0;
    while (k < STOPS.length - 2 && t > STOPS[k + 1][0]) k++;
    var a = STOPS[k], b = STOPS[k + 1];
    var f = (t - a[0]) / (b[0] - a[0]); if (f < 0) f = 0; if (f > 1) f = 1;
    RAMP[i] = "rgb(" + Math.round(a[1] + (b[1] - a[1]) * f) + "," +
                       Math.round(a[2] + (b[2] - a[2]) * f) + "," +
                       Math.round(a[3] + (b[3] - a[3]) * f) + ")";
  }
})();
function ramp(t){
  var i = (t * (RAMP_N - 1)) | 0;
  return RAMP[i < 0 ? 0 : (i >= RAMP_N ? RAMP_N - 1 : i)];
}
/* flat plane-region faces use the same pale teal as the 2-D panels */
var REGION_FILL = "#c6e9ea", REGION_FILL_DIM = "#a9dcde", REGION_EDGE = "#0e8f96";

/* light (view space) */
var LX = 0.20, LY = 0.20, LZ = 0.96;
(function(){ var m = Math.hypot(LX, LY, LZ); LX /= m; LY /= m; LZ /= m; })();
var HX = LX, HY = LY, HZ = LZ + 1;
(function(){ var m = Math.hypot(HX, HY, HZ); HX /= m; HY /= m; HZ /= m; })();

/* ---------------- geometry construction ---------------------------- */
function buildProfile(P, NX, NR){
  var pts = [], flag = [], i, k, x;          // flag marks the inner (hole) wall
  for (i = 0; i <= NX; i++){ x = P.x0 + (P.x1 - P.x0) * i / NX; pts.push(x, P.rhi(x)); flag.push(0); }
  var xr = P.x1, hR = P.rhi(xr), lR = P.rlo(xr);
  for (k = 1; k <= NR; k++){ pts.push(xr, hR + (lR - hR) * k / NR); flag.push(k === NR && lR > 1e-9 ? 1 : 0); }
  for (i = NX - 1; i >= 0; i--){
    x = P.x0 + (P.x1 - P.x0) * i / NX; pts.push(x, P.rlo(x)); flag.push(P.rlo(x) > 1e-9 ? 1 : 0);
  }
  var xl = P.x0, hL = P.rhi(xl), lL = P.rlo(xl);
  for (k = 1; k < NR; k++){ pts.push(xl, lL + (hL - lL) * k / NR); flag.push(0); }
  return { pts: pts, flag: flag };  // flat [x,r, x,r, ...] closed loop
}
function buildCapGrid(P, NX, NR){
  var g = [], i, b, x;
  for (i = 0; i <= NX; i++){
    x = P.x0 + (P.x1 - P.x0) * i / NX;
    var lo = P.rlo(x), hi = P.rhi(x);
    for (b = 0; b <= NR; b++) g.push(x, lo + (hi - lo) * b / NR);
  }
  return g;                          // row-major [(i,b)] -> (i*(NR+1)+b)*2
}

/* ---------------- panel objects ------------------------------------ */
var panels = [];

function makePanel(P, i){
  var sec = document.createElement("section");
  sec.className = "panel";
  sec.innerHTML = buildSVG(P, i) +
    '<canvas></canvas>' +
    '<div class="namebox">' + P.name + '</div>' +
    '<div class="letter">' + P.letter + '</div>';
  document.getElementById("grid").appendChild(sec);

  var o = {
    def: P, index: i, el: sec,
    canvas: sec.querySelector("canvas"),
    az: DEF_AZ, el_: DEF_EL,
    W: 10, H: 10, dpr: 1,
    quality: 1, prof: null, cap: null, NX: 0, NR: 0
  };
  o.ctx = o.canvas.getContext("2d");
  panels.push(o);

  /* ---- drag to rotate --------------------------------------------- */
  var dragging = false, lx = 0, ly = 0, moved = 0;
  o.canvas.addEventListener("pointerdown", function(e){
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
    o.canvas.setPointerCapture(e.pointerId); e.preventDefault();
  });
  o.canvas.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    o.az -= dx * 0.010;
    o.el_ += dy * 0.010;
    if (o.el_ > 0.78) o.el_ = 0.78;
    if (o.el_ < -0.78) o.el_ = -0.78;
    draw(o);
  });
  function endDrag(e){ if (dragging){ dragging = false; try{ o.canvas.releasePointerCapture(e.pointerId); }catch(_){} } }
  o.canvas.addEventListener("pointerup", endDrag);
  o.canvas.addEventListener("pointercancel", endDrag);

  sec.addEventListener("click", function(){
    if (moved > 6){ moved = 0; return; }
    setFocus(state.focus === i ? -1 : i);
  });

  return o;
}

/* ---------------- sizing ------------------------------------------- */
var SCALE_DEN_X = 1.70, SCALE_DEN_Y = 1.40;   // worst-case half-extents (shared by all panels)
function resizePanel(o){
  var w = o.canvas.clientWidth || 260;
  var h = Math.max(150, Math.min(250, Math.round(w * 0.82)));
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  o.W = w; o.H = h; o.dpr = dpr;
  o.canvas.style.height = h + "px";
  o.canvas.width = Math.round(w * dpr);
  o.canvas.height = Math.round(h * dpr);
  var pad = 8;
  o.S = Math.min((w / 2 - pad) / SCALE_DEN_X, (h / 2 - pad) / SCALE_DEN_Y);
}

/* ---------------- the renderer ------------------------------------- */
var VXa = null, VYa = null, VZa = null, SXa = null, SYa = null;
var QA = null, QD = null, QT = null, QZ = null, QI = null;

function ensure(nV, nQ){
  if (!VXa || VXa.length < nV){
    VXa = new Float32Array(nV); VYa = new Float32Array(nV); VZa = new Float32Array(nV);
    SXa = new Float32Array(nV); SYa = new Float32Array(nV);
  }
  if (!QA || QA.length < nQ * 4){
    QA = new Int32Array(nQ * 4); QT = new Uint8Array(nQ); QZ = new Float32Array(nQ);
    QI = new Int32Array(nQ);
  }
}

function draw(o){
  var P = o.def, ctx = o.ctx, W = o.W, H = o.H;
  ctx.setTransform(o.dpr, 0, 0, o.dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var q = o.quality;                                   // 1 = full, 0 = fast
  var NX = Math.max(6, Math.round(P.nx * (q ? 1 : 0.62)));
  var NR = q ? 4 : 3;
  var NTfull = q ? 46 : 28;

  if (o.NX !== NX || o.NR !== NR){
    var pr_ = buildProfile(P, NX, NR);
    o.prof = pr_.pts; o.pflag = pr_.flag;
    o.cap  = buildCapGrid(P, NX, NR);
    o.NX = NX; o.NR = NR;
  }

  var th = state.theta;
  var full = th >= TAU - 1e-6;
  var NT = Math.max(1, Math.ceil(NTfull * th / TAU));
  var dt = th / NT;
  var M = o.prof.length / 2;                            // boundary samples
  var nLat = (th > 1e-6) ? M * (NT + 1) : 0;
  var capN = (NX + 1) * (NR + 1);
  var nV = nLat + (full ? 0 : 2 * capN);
  var nQ = (th > 1e-6 ? M * NT : 0) + (full ? 0 : 2 * NX * NR);
  ensure(nV + 4, nQ + 4);

  /* rotation matrix  M = Rx(el) * Ry(az) */
  var ca = Math.cos(o.az), sa = Math.sin(o.az), ce = Math.cos(o.el_), se = Math.sin(o.el_);
  var m00 = ca,       m01 = 0,  m02 = sa;
  var m10 = se * sa,  m11 = ce, m12 = -se * ca;
  var m20 = -ce * sa, m21 = se, m22 = ce * ca;
  var cx = W / 2, cy = H / 2, S = o.S;

  function put(k, wx, wy, wz){
    var vx = m00 * wx + m01 * wy + m02 * wz;
    var vy = m10 * wx + m11 * wy + m12 * wz;
    var vz = m20 * wx + m21 * wy + m22 * wz;
    VXa[k] = vx; VYa[k] = vy; VZa[k] = vz;
    SXa[k] = cx + S * vx; SYa[k] = cy - S * vy;
  }

  /* --- vertices: lateral surface = boundary curve revolved ---------- */
  var i, j, b, k;
  if (nLat){
    var cosT = new Float64Array(NT + 1), sinT = new Float64Array(NT + 1);
    for (j = 0; j <= NT; j++){ var t = j * dt; cosT[j] = Math.cos(t); sinT[j] = Math.sin(t); }
    for (i = 0; i < M; i++){
      var px = o.prof[i * 2], pr = o.prof[i * 2 + 1];
      var base = i * (NT + 1);
      for (j = 0; j <= NT; j++) put(base + j, px, pr * cosT[j], -pr * sinT[j]);
    }
  }
  /* --- vertices: the plane region itself, at t = 0 and t = theta ---- */
  var cap0 = nLat, cap1 = nLat + capN;
  if (!full){
    var c0 = 1, s0 = 0, c1 = Math.cos(th), s1 = Math.sin(th);
    for (k = 0; k < capN; k++){
      var gx = o.cap[k * 2], gr = o.cap[k * 2 + 1];
      put(cap0 + k, gx, gr * c0, -gr * s0);
      put(cap1 + k, gx, gr * c1, -gr * s1);
    }
  }

  /* --- quads -------------------------------------------------------- */
  var nq = 0;
  var opaque = P.alpha >= 0.999;
  var frontIdx = [], backIdx = [];
  function pushQuad(a, bq, c, d, type){
    // view-space normal  n = (P1-P0) x (P3-P0)   (outward by construction)
    var ax = VXa[bq] - VXa[a], ay = VYa[bq] - VYa[a], az = VZa[bq] - VZa[a];
    var bx = VXa[d] - VXa[a], by = VYa[d] - VYa[a], bz = VZa[d] - VZa[a];
    var nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
    if (len < 1e-9) return;                       // degenerate (on the axis)
    if (opaque && nz <= 0) return;                // back-face cull
    QA[nq * 4] = a; QA[nq * 4 + 1] = bq; QA[nq * 4 + 2] = c; QA[nq * 4 + 3] = d;
    QT[nq] = type;
    QZ[nq] = (VZa[a] + VZa[bq] + VZa[c] + VZa[d]) * 0.25;
    QI[nq] = nq;
    if (!opaque) (nz > 0 ? frontIdx : backIdx).push(nq);
    nq++;
  }

  if (nLat){
    for (i = 0; i < M; i++){
      var i2 = (i + 1) % M;
      var r0 = o.prof[i * 2 + 1], r1p = o.prof[i2 * 2 + 1];
      if (r0 < 1e-9 && r1p < 1e-9) continue;       // edge lying on the axis
      var b0 = i * (NT + 1), b1 = i2 * (NT + 1);
      var ty = (o.pflag[i] && o.pflag[i2]) ? 3 : 0;      // 3 = inner (hole) wall
      for (j = 0; j < NT; j++) pushQuad(b0 + j, b1 + j, b1 + j + 1, b0 + j + 1, ty);
    }
  }
  if (!full){
    var stride = NR + 1;
    for (i = 0; i < NX; i++){
      for (b = 0; b < NR; b++){
        var a0 = cap0 + i * stride + b;
        pushQuad(a0, a0 + stride, a0 + stride + 1, a0 + 1, 1);              // t = 0 face
        var a1 = cap1 + i * stride + b;
        pushQuad(a1, a1 + 1, a1 + stride + 1, a1 + stride, 2);              // t = theta face
      }
    }
  }

  /* --- axis of revolution: black underneath ------------------------- */
  var ax0 = P.x0 - 0.42, ax1 = P.x1 + 0.42;
  var A0x = cx + S * (m00 * ax0), A0y = cy - S * (m10 * ax0);
  var A1x = cx + S * (m00 * ax1), A1y = cy - S * (m10 * ax1);
  ctx.lineCap = "round";
  ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(A0x, A0y); ctx.lineTo(A1x, A1y); ctx.stroke();

  /* --- painter's algorithm ------------------------------------------ */
  var showReg = state.showRegion;
  function byDepth(p, r){ return QZ[p] - QZ[r]; }
  function drawList(c2, list){
    c2.lineJoin = "round";
    for (var kk = 0; kk < list.length; kk++){
      var qi = list[kk], o4 = qi * 4;
      var a = QA[o4], bq = QA[o4 + 1], c = QA[o4 + 2], d = QA[o4 + 3];
      var axv = VXa[bq] - VXa[a], ayv = VYa[bq] - VYa[a], azv = VZa[bq] - VZa[a];
      var bxv = VXa[d] - VXa[a], byv = VYa[d] - VYa[a], bzv = VZa[d] - VZa[a];
      var nx = ayv * bzv - azv * byv, ny = azv * bxv - axv * bzv, nz = axv * byv - ayv * bxv;
      var L = Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx /= L; ny /= L; nz /= L;
      if (nz < 0){ nx = -nx; ny = -ny; nz = -nz; }         // two-sided shading
      var diff = nx * LX + ny * LY + nz * LZ; if (diff < 0) diff = 0;
      var sp = nx * HX + ny * HY + nz * HZ; if (sp < 0) sp = 0;
      sp = Math.pow(sp, 13);
      var lum = 0.18 + 0.60 * diff + 0.46 * sp; if (lum > 1) lum = 1;

      var fill;
      if (QT[qi] === 0) fill = ramp(lum);
      else if (QT[qi] === 3) fill = ramp(lum * 0.62);          // shaded hole wall
      else if (showReg) fill = (QT[qi] === 1 ? REGION_FILL : REGION_FILL_DIM);
      else fill = ramp(0.20 + 0.45 * diff);

      c2.fillStyle = fill; c2.strokeStyle = fill; c2.lineWidth = 0.7;
      c2.beginPath();
      c2.moveTo(SXa[a], SYa[a]); c2.lineTo(SXa[bq], SYa[bq]);
      c2.lineTo(SXa[c], SYa[c]); c2.lineTo(SXa[d], SYa[d]);
      c2.closePath(); c2.fill(); c2.stroke();
    }
  }

  if (opaque){
    var order = Array.prototype.slice.call(QI.subarray(0, nq));
    order.sort(byDepth);
    drawList(ctx, order);
  } else {
    /* Translucent solid: render the far half opaquely, then composite the
       near half over it with one uniform alpha.  Each half is internally
       opaque, so no tessellation seams show through.                     */
    backIdx.sort(byDepth); frontIdx.sort(byDepth);
    drawList(ctx, backIdx);
    ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(A0x, A0y); ctx.lineTo(A1x, A1y); ctx.stroke();
    if (!o.off){ o.off = document.createElement("canvas"); o.offctx = o.off.getContext("2d"); }
    if (o.off.width !== o.canvas.width || o.off.height !== o.canvas.height){
      o.off.width = o.canvas.width; o.off.height = o.canvas.height;
    }
    var oc = o.offctx;
    oc.setTransform(o.dpr, 0, 0, o.dpr, 0, 0);
    oc.clearRect(0, 0, W, H);
    drawList(oc, frontIdx);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = P.alpha;
    ctx.drawImage(o.off, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* --- outline the generating region where it faces us -------------- */
  if (!full && showReg){
    // outward normals of the two flat faces, in view space
    outlineCap(ctx, o, 0,  0, 0, 1);
    outlineCap(ctx, o, th, 0, -Math.sin(th), -Math.cos(th));
  }

  /* --- axis drawn again, faintly, over the solid -------------------- */
  ctx.save();
  ctx.globalAlpha = 0.32; ctx.strokeStyle = "#111"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(A0x, A0y); ctx.lineTo(A1x, A1y); ctx.stroke();
  ctx.restore();

  function outlineCap(c2, oo, t, wnx, wny, wnz){
    var vnz = m20 * wnx + m21 * wny + m22 * wnz;
    if (vnz <= 0.02) return;                          // face points away
    var ct = Math.cos(t), st = Math.sin(t);
    c2.beginPath();
    for (var q2 = 0; q2 < M; q2++){
      var qx = oo.prof[q2 * 2], qr = oo.prof[q2 * 2 + 1];
      var wy = qr * ct, wz = -qr * st;
      var vx = m00 * qx + m01 * wy + m02 * wz;
      var vy = m10 * qx + m11 * wy + m12 * wz;
      var sx = cx + S * vx, sy = cy - S * vy;
      if (q2 === 0) c2.moveTo(sx, sy); else c2.lineTo(sx, sy);
    }
    c2.closePath();
    c2.strokeStyle = REGION_EDGE; c2.lineWidth = 1.7; c2.stroke();
  }
}

/* ---------------- focus / detail ----------------------------------- */
function setFocus(i){
  state.focus = i;
  var grid = document.getElementById("grid");
  grid.classList.toggle("has-focus", i >= 0);
  panels.forEach(function(p, k){ p.el.classList.toggle("is-focus", k === i); });
  updateDetail();
}

function updateDetail(){
  var d = document.getElementById("detail");
  var degs = Math.round(state.theta * 180 / Math.PI);
  var frac = state.theta / TAU;
  var sweepLine = '<div class="dim">Swept so far: &theta; = ' + degs + '&deg; &rarr; volume = (' + degs +
    '&deg;/360&deg;)&middot;V = ' + frac.toFixed(2) + '&thinsp;V' +
    (degs === 360 ? " (the complete solid)." : ".") + '</div>';
  if (state.focus < 0){
    d.innerHTML = '<h2>Revolving a plane region</h2>' +
      '<div>Each pair shows a plane region (top) and the solid it sweeps out when the region is revolved ' +
      'one full turn about the axis of revolution (bottom). Drag any solid to rotate it; ' +
      'drag the &theta; slider or press <strong>Revolve</strong> to watch the region sweep the solid out. ' +
      '<span class="hint">Click a panel to focus on it.</span></div>' + sweepLine;
    return;
  }
  var P = PANELS[state.focus];
  d.innerHTML = '<h2>' + P.title + '</h2>' +
    '<div>' + P.body + '</div>' +
    '<div class="eq">' + P.eq + '</div>' +
    '<div class="dim">' + P.dim + '</div>' + sweepLine;
}

/* ---------------- build & wire up ---------------------------------- */
PANELS.forEach(makePanel);

var slider = document.getElementById("theta");
var read = document.getElementById("thetaRead");
var playBtn = document.getElementById("play");

function redrawAll(){ for (var i = 0; i < panels.length; i++) draw(panels[i]); }
function resizeAll(){ for (var i = 0; i < panels.length; i++) resizePanel(panels[i]); }

slider.addEventListener("input", function(){
  state.theta = (+slider.value) * Math.PI / 180;
  state.playing = false; playBtn.textContent = "▶ Revolve"; playBtn.classList.add("primary");
  setQuality(1);
  read.textContent = slider.value + "°";
  redrawAll(); updateDetail();
});

playBtn.addEventListener("click", function(){
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? "⏸ Pause" : "▶ Revolve";
  playBtn.classList.toggle("primary", !state.playing);
  setQuality(state.playing ? 0 : 1);
  if (state.playing && state.theta >= TAU - 1e-6) state.theta = 0;
  last = performance.now();
  if (!state.playing) redrawAll();
});

document.getElementById("showRegion").addEventListener("change", function(e){
  state.showRegion = e.target.checked; redrawAll();
});
document.getElementById("reset").addEventListener("click", function(e){
  e.stopPropagation();
  panels.forEach(function(p){ p.az = DEF_AZ; p.el_ = DEF_EL; });
  redrawAll();
});
document.getElementById("showAll").addEventListener("click", function(e){
  e.stopPropagation(); setFocus(-1);
});

function setQuality(q){ panels.forEach(function(p){ p.quality = q; }); }

var last = performance.now();
function loop(now){
  if (state.playing){
    var dtms = Math.min(60, now - last); last = now;
    state.theta += dtms * 0.00105;
    if (state.theta >= TAU){ state.theta = TAU; state.playing = false;
      playBtn.textContent = "▶ Revolve"; playBtn.classList.add("primary"); setQuality(1); }
    slider.value = Math.round(state.theta * 180 / Math.PI);
    read.textContent = slider.value + "°";
    redrawAll(); updateDetail();
  } else { last = now; }
  requestAnimationFrame(loop);
}

if (window.ResizeObserver){
  var ro = new ResizeObserver(function(){ resizeAll(); redrawAll(); });
  panels.forEach(function(p){ ro.observe(p.canvas); });
}
window.addEventListener("resize", function(){ resizeAll(); redrawAll(); });

resizeAll();
setFocus(-1);
redrawAll();
requestAnimationFrame(loop);
</script>

  /* SVG styling for the plane-region panels */
  svg.flat .reg{ fill:#c6e9ea; stroke:#17b3b8; stroke-width:2.4; stroke-linejoin:round; }
  .panel.is-focus svg.flat .reg{ stroke-width:3.4; fill:#b6e4e6; }
  svg.flat .axis2{ stroke:#111; stroke-width:2.2; }
  svg.flat .arrowArc{ fill:none; stroke:#111; stroke-width:2; }
  svg.flat .arrowHead{ fill:#111; }
  svg.flat .axlbl{ font-family:"Segoe UI",system-ui,sans-serif; font-size:11.5px; fill:#4b5456; }
</style>
