<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Figure</title>

  <!-- Blocking CDN scripts — no async/defer; must be ready before body <script> runs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3/dist/svg.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/expr-eval@2/dist/bundle.min.js"></script>

  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ── Layout ──────────────────────────────────────────────────────────────
       body is a grid so heavy UI can TAKE space instead of covering the figure.
       data-ui-layout on <body> picks the mode; see setUiLayout() below.
         "overlay" (default) — #ui floats over the figure, exactly as before
         "right" / "bottom"  — #ui becomes a real grid cell and #container shrinks
       The #container ResizeObserver then fires 'fig-resize', so setPlotFrame
       re-lays the figure out at its new size automatically.                     */
    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      grid-template-areas: "stage";
    }

    /* ── Figure mount point ──────────────────────────────────────────────── */
    #container {
      position: relative;
      grid-area: stage;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Control panel (mirrors base_scene_new.html #ui) ─────────────────── */
    #ui {
      position: absolute;
      left: 6px;
      bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-family: sans-serif;
      font-size: 11px;
      max-width: 190px;
      max-height: 34%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      border: 0;
      box-shadow: none;
      opacity: 0.88;
      transform: none;
      transition: opacity 0.16s ease;
      z-index: 10;
    }

    #ui:hover,
    #ui:focus-within {
      opacity: 1;
    }

    #ui button {
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f5f5f5;
      border-radius: 4px;
    }

    #ui button:hover {
      background: #e0e0e0;
    }

    #ui button.active {
      background: #c8e6ff;
      border-color: #5aabf0;
    }

    #ui label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-shadow: 0 1px 2px #fff;
    }

    #ui input[type=range] {
      width: 86px;
    }

    /* ── Docked control panel ────────────────────────────────────────────────
       When #ui is docked it stops being an overlay: a grid cell with its own
       scroll, an opaque background, and roomier type. Default overlay mode is
       untouched.                                                               */
    body[data-ui-layout="right"] {
      grid-template-columns: 1fr var(--ui-size, 320px);
      grid-template-rows: 1fr;
      grid-template-areas: "stage ui";
    }

    body[data-ui-layout="bottom"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr var(--ui-size, 240px);
      grid-template-areas: "stage" "ui";
    }

    body[data-ui-layout="right"] #ui,
    body[data-ui-layout="bottom"] #ui {
      position: relative;
      grid-area: ui;
      left: auto;
      bottom: auto;
      max-width: none;
      max-height: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
      gap: 6px;
      padding: 10px 12px;
      font-size: 12px;
      background: #fbfbfc;
      opacity: 1;
      overflow: auto;
      z-index: 1;
    }

    body[data-ui-layout="right"] #ui {
      border-left: 1px solid #dcdfe3;
    }

    body[data-ui-layout="bottom"] #ui {
      border-top: 1px solid #dcdfe3;
    }

    body[data-ui-layout="right"] #ui label,
    body[data-ui-layout="bottom"] #ui label {
      text-shadow: none;
    }

    body[data-ui-layout="right"] #ui input[type=range],
    body[data-ui-layout="bottom"] #ui input[type=range] {
      width: 100%;
    }

    body[data-ui-layout="right"] #ui textarea,
    body[data-ui-layout="bottom"] #ui textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      tab-size: 2;
      border: 1px solid #cfd4da;
      border-radius: 4px;
      padding: 6px 8px;
    }

    body[data-ui-layout="bottom"] #ui textarea {
      min-height: 110px;
    }

    /* ── Inline equation parse errors ────────────────────────────────────── */
    .eq-err {
      color: #c00000;
      font-size: 10px;
      max-width: 180px;
      white-space: normal;
      text-shadow: 0 1px 2px #fff;
    }

    /* ── Hover tooltip ───────────────────────────────────────────────────── */
    #figTooltip {
      position: fixed;
      left: 0;
      top: 0;
      display: none;
      max-width: 210px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font: 11px/1.35 sans-serif;
      pointer-events: none;
      white-space: normal;
      z-index: 20;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="figTooltip"></div>
  <div id="ui">
    <!-- @FIGURE_UI_BEGIN -->
<span id="demoNarration" style="margin:0;font-size:11px;max-width:330px;line-height:1.35">The same ten values are shown twice: as the array A and as a complete binary tree using 1-indexed heap positions. Parent-child links come entirely from array indices, not from pointer structure.</span><span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><button onclick="prevStep()">◀</button><span id="stepLabel">Step 1 / 6</span><button onclick="nextStep()">▶</button></span><span style="height:6px"></span><span style="font-weight:bold">Implement MAX-HEAPIFY</span><label>Initial array <input id="heapInput" value="4, 1, 3, 2, 16, 9, 10, 14, 8, 7"></label><span style="display:flex;gap:4px;flex-wrap:wrap"><button onclick="loadSample('sample')">Correct sample</button><button onclick="loadSample('buggy')">Buggy sample</button><button onclick="loadSample('starter')">Starter</button></span><textarea id="heapifyEditorCode" spellcheck="false"></textarea><span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><button id="runBtn" onclick="runHeapifyCode()">Run BUILD-MAX-HEAP</button><span id="statusText">not run</span></span><span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap"><button onclick="firstFrame()">|◀</button><button onclick="prevFrame()">◀</button><button id="playBtn" onclick="togglePlay()">▶</button><button onclick="nextFrame()">▶</button><span id="frameCounter">0 of 0</span></span><label>Playback speed <input id="speedInput" type="range" min="1" max="5" step="1" value="3"></label><span id="frameCaption" style="font-size:11px;line-height:1.3;max-width:330px"></span><textarea id="heapLog" readonly spellcheck="false" style="min-height:92px"></textarea>
<!-- @FIGURE_UI_END -->
  </div>

  <!-- Error overlay: shown if CDN fails or JS throws before rendering -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:999;
       flex-direction:column;align-items:center;justify-content:center;
       font-family:sans-serif;font-size:13px;color:#555;gap:10px;">
    <span id="err-msg">⚠ Figure failed to load</span>
    <button onclick="location.reload()" style="padding:5px 14px;border:1px solid #aaa;
        border-radius:5px;background:#f5f5f5;cursor:pointer;font-size:12px;">↻ Reload</button>
  </div>

  <script>
    /* ── Error overlay ───────────────────────────────────────────────────── */
    var _rendered = false;
    var _errOverlay = document.getElementById('err-overlay');
    window.__markRendered = function () { _rendered = true; _errOverlay.style.display = 'none'; };
    window.addEventListener('error', function (e) {
      if (!_rendered) {
        document.getElementById('err-msg').textContent = '⚠ ' + (e.message || 'Figure failed to load');
        _errOverlay.style.display = 'flex';
      }
    });
    setTimeout(function () { if (!_rendered) { _errOverlay.style.display = 'flex'; } }, 12000);

    /* ── Tooltip + popup helpers ─────────────────────────────────────────── */
    var _tooltip = document.getElementById('figTooltip');

    function showPopup(title, body) {
      window.parent.postMessage({ type: 'alex-popup', title: title, body: body }, '*');
    }
    function hidePopup() {
      window.parent.postMessage({ type: 'alex-popup', title: null }, '*');
    }
    function showTooltip(text, event) {
      if (!_tooltip || !text) return;
      _tooltip.textContent = text;
      _tooltip.style.display = 'block';
      _moveTooltip(event);
    }
    function _moveTooltip(event) {
      if (!_tooltip || _tooltip.style.display === 'none') return;
      var pad = 12;
      var x = Math.min(event.clientX + pad, window.innerWidth - (_tooltip.offsetWidth || 100) - pad);
      var y = Math.max(pad, event.clientY - (_tooltip.offsetHeight || 40) - pad);
      _tooltip.style.left = x + 'px';
      _tooltip.style.top = y + 'px';
    }
    function hideTooltip() {
      if (_tooltip) _tooltip.style.display = 'none';
    }
    document.addEventListener('mousemove', function (e) { _moveTooltip(e); });

    /* ── Resize event ────────────────────────────────────────────────────── */
    new ResizeObserver(function () {
      var rect = document.getElementById('container').getBoundingClientRect();
      document.dispatchEvent(new CustomEvent('fig-resize', {
        detail: { width: rect.width, height: rect.height }
      }));
    }).observe(document.getElementById('container'));

    /* ── UI layout: dock heavy controls instead of covering the figure ────────
     * setUiLayout('overlay' | 'right' | 'bottom', sizePx?)
     *   overlay — #ui floats bottom-left over the figure. Not used by the
     *             auto-dock heuristic below; available only as an explicit override.
     *   right   — #ui becomes a real column and the figure shrinks beside it.
     *             The auto-dock default.
     *   bottom  — same, as a strip under the figure. The auto-dock default on
     *             narrow viewports (<560px).
     * Docking resizes #container, which fires 'fig-resize', so setPlotFrame
     * re-lays the figure out at its new size instead of it being covered.
     * Calling this explicitly also turns OFF the auto-dock heuristic below.
     */
    var _uiLayoutExplicit = false;
    var _uiEl = document.getElementById('ui');

    function setUiLayout(mode, sizePx) {
      _uiLayoutExplicit = true;
      _applyUiLayout(mode, sizePx);
    }

    function _applyUiLayout(mode, sizePx) {
      var next = (mode === 'right' || mode === 'bottom') ? mode : 'overlay';
      if (next === 'overlay') document.body.removeAttribute('data-ui-layout');
      else document.body.setAttribute('data-ui-layout', next);
      if (sizePx) document.body.style.setProperty('--ui-size', sizePx + 'px');
    }

    // Auto-dock: generated figures do not reliably remember to call setUiLayout,
    // and an overlay that covers the figure is the most common way these demos
    // fail. So always dock #ui to a side column instead of floating it over the
    // figure. Deciding this from content height alone caused a visible
    // mid-session layout jump on demos whose content grows between interactive
    // states (e.g. demo_steps with longer/shorter narration per step) — always
    // docking avoids that entirely.
    var _autoUiTimer = 0;
    function _autoUiLayout() {
      if (_uiLayoutExplicit) return;
      var hasEditor = Boolean(_uiEl.querySelector('textarea'));
      var narrow = window.innerWidth < 560;
      var mode = narrow ? 'bottom' : 'right';
      var start = narrow ? (hasEditor ? 300 : 220) : (hasEditor ? 400 : 300);
      _applyUiLayout(mode, start);
      _growDockToFit(mode, start);
    }

    // A fixed dock size still clips a long control stack in a small inline
    // figure. Grow the dock until the panel stops scrolling, capped so the
    // figure always keeps the larger share of the frame.
    function _growDockToFit(mode, startPx) {
      var cap = mode === 'bottom'
        ? Math.round(window.innerHeight * 0.5)
        : Math.round(window.innerWidth * 0.45);
      // Clamp down too: on a small figure the default dock can itself exceed the
      // cap, and the figure must always keep the larger share.
      var size = Math.min(startPx, cap);
      if (size !== startPx) document.body.style.setProperty('--ui-size', size + 'px');
      var guard = 0;
      function step() {
        if (_uiLayoutExplicit || guard++ > 6) return;
        if (_uiEl.scrollHeight <= _uiEl.clientHeight + 2 || size >= cap) return;
        size = Math.min(cap, size + 60);
        document.body.style.setProperty('--ui-size', size + 'px');
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    window.__autoUiLayout = _autoUiLayout;

    // Re-evaluate when generated code adds controls after first paint.
    new MutationObserver(function () {
      if (_uiLayoutExplicit) return;
      clearTimeout(_autoUiTimer);
      _autoUiTimer = setTimeout(_autoUiLayout, 0);
    }).observe(_uiEl, { childList: true, subtree: true });
    window.addEventListener('resize', function () { if (!_uiLayoutExplicit) _autoUiLayout(); });

    /* ── Keyboard dismiss ────────────────────────────────────────────────── */
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePopup(); hideTooltip(); }
    });

    /* ── Expression parsing ──────────────────────────────────────────────── */
    /**
     * compileExpr(src, vars) → function(...args)
     *   src  : math source, e.g. 'sin(x) + 1', 'x^2', '2*x - 3'
     *   vars : variable names in argument order, e.g. ['x'] or ['x', 'y']
     * Throws an Error with a readable message on a syntax error or when the
     * source references a variable outside `vars`. Never returns a fallback.
     *
     * DUPLICATED (deliberately): base_scene_new.html has an equivalent ES-module
     * copy. Each scaffold is a standalone served HTML file and neither can
     * import the other, so behaviour changes must be made TWICE.
     * Keep this in sync with compileExpr in base_scene_new.html.
     */
    function compileExpr(src, vars) {
      if (!window.exprEval || !window.exprEval.Parser) {
        throw new Error('Expression parser unavailable (expr-eval CDN did not load)');
      }
      var names = (vars && vars.length) ? vars : ['x'];
      var parsed;
      try {
        parsed = new window.exprEval.Parser().parse(String(src));
      } catch (e) {
        throw new Error('Cannot parse "' + src + '": ' + ((e && e.message) ? e.message : e));
      }
      var used = parsed.variables();
      for (var i = 0; i < used.length; i++) {
        if (names.indexOf(used[i]) === -1) {
          throw new Error('Unknown variable "' + used[i] + '" (expected: ' + names.join(', ') + ')');
        }
      }
      return function () {
        var scope = {};
        for (var j = 0; j < names.length; j++) scope[names[j]] = arguments[j];
        var v;
        try { v = parsed.evaluate(scope); } catch (e) { return NaN; }
        return (typeof v === 'number') ? v : NaN;
      };
    }

    /* ── Plot frame: world → screen mapping (owns resize) ────────────────── */
    var _plotFrame = null;
    var _plots = [];
    var _plotResizeBound = false;

    /**
     * setPlotFrame({ xDomain, yDomain, margin, draw }) → frame
     * Establishes the world→screen mapping used by plotX / plotY and by every
     * plot helper. Call this once, before creating any plots. Registered plots
     * are re-sampled automatically on resize.
     */
    function setPlotFrame(opts) {
      opts = opts || {};
      var container = document.getElementById('container');
      _plotFrame = {
        xDomain: opts.xDomain || [-5, 5],
        yDomain: opts.yDomain || [-5, 5],
        margin: (opts.margin == null) ? 24 : opts.margin,
        draw: opts.draw || SVG().addTo('#container').size('100%', '100%'),
        width: container.clientWidth || 900,
        height: container.clientHeight || 600
      };
      _recomputePlotScale();
      if (!_plotResizeBound) {
        _plotResizeBound = true;
        document.addEventListener('fig-resize', function (e) {
          if (!_plotFrame) return;
          _plotFrame.width = e.detail.width || _plotFrame.width;
          _plotFrame.height = e.detail.height || _plotFrame.height;
          _recomputePlotScale();
          for (var i = 0; i < _plots.length; i++) _plots[i].sample();
        });
      }
      return _plotFrame;
    }

    function _recomputePlotScale() {
      var f = _plotFrame, m = f.margin;
      f.sx = (f.width - 2 * m) / (f.xDomain[1] - f.xDomain[0]);
      f.sy = (f.height - 2 * m) / (f.yDomain[1] - f.yDomain[0]);
    }

    /** plotX(worldX) → screen px. Requires setPlotFrame() first. */
    function plotX(wx) {
      var f = _plotFrame;
      return f.margin + (wx - f.xDomain[0]) * f.sx;
    }

    /** plotY(worldY) → screen px (y axis flipped). Requires setPlotFrame() first. */
    function plotY(wy) {
      var f = _plotFrame;
      return f.height - f.margin - (wy - f.yDomain[0]) * f.sy;
    }

    function _registerPlot(handle) {
      _plots.push(handle);
      return handle;
    }

    function _unregisterPlot(handle) {
      var i = _plots.indexOf(handle);
      if (i >= 0) _plots.splice(i, 1);
    }

    function _resolveFn(value, vars) {
      if (typeof value === 'function') return value;
      return compileExpr(value, vars);
    }

    function _pointsAttr(points) {
      return points.map(function (p) { return p[0] + ',' + p[1]; }).join(' ');
    }

    /**
     * plotFunction(id, opts) → handle
     *   opts: { expr | fn, variables=['x'], domain, samples=200,
     *           stroke='#1f77b4', width=2, dashed=false }
     * The drawn polyline is ALWAYS produced by sampling the compiled function
     * across `domain`. Non-finite samples split the line into segments instead
     * of drawing a spike.
     */
    function plotFunction(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'plot-' + id);
      var handle = {
        id: id,
        node: group,
        fn: opts.fn ? opts.fn : (opts.expr != null ? compileExpr(opts.expr, vars) : null),
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setExpr: function (src) { this.fn = _resolveFn(src, vars); return this.sample(); },
        setFn: function (f) { this.fn = f; return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          if (!this.fn) return this;
          var segs = _sampleSegments(this.fn, this.domain, this.samples);
          for (var s = 0; s < segs.length; s++) {
            if (segs[s].length < 2) continue;
            var line = group.polyline(_pointsAttr(segs[s]))
              .fill('none')
              .stroke({
                color: opts.stroke || '#1f77b4',
                width: opts.width || 2,
                linecap: 'round',
                linejoin: 'round'
              });
            if (opts.dashed) line.attr('stroke-dasharray', '5,4');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /** Sample fn across domain, splitting at non-finite values. → [[ [px,py], … ], …] */
    function _sampleSegments(fn, domain, samples) {
      var a = domain[0], b = domain[1], n = Math.max(2, samples | 0);
      var segs = [], cur = [];
      for (var i = 0; i < n; i++) {
        var t = a + (b - a) * (i / (n - 1));
        var v;
        try { v = fn(t); } catch (e) { v = NaN; }
        if (typeof v === 'number' && isFinite(v)) {
          cur.push([plotX(t), plotY(v)]);
        } else if (cur.length) {
          segs.push(cur);
          cur = [];
        }
      }
      if (cur.length) segs.push(cur);
      return segs;
    }

    /**
     * fillBetween(id, opts) → handle
     *   opts: { lower, upper, variables=['x'], domain, samples=200,
     *           fill='#7fb3ff', opacity=0.45, stroke, strokeWidth=1 }
     * `lower` / `upper` may be expression strings or functions. The polygon is
     * built from EVERY sampled point on both boundaries, so a curved boundary
     * produces a curved region with no caller involvement.
     */
    function fillBetween(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['x'];
      var group = _plotFrame.draw.group().attr('id', 'fill-' + id);
      var handle = {
        id: id,
        node: group,
        lower: opts.lower != null ? _resolveFn(opts.lower, vars) : function () { return 0; },
        upper: opts.upper != null ? _resolveFn(opts.upper, vars) : function () { return 0; },
        domain: opts.domain || _plotFrame.xDomain.slice(),
        samples: opts.samples || 200,
        setLower: function (src) { this.lower = _resolveFn(src, vars); return this.sample(); },
        setUpper: function (src) { this.upper = _resolveFn(src, vars); return this.sample(); },
        setDomain: function (dm) { this.domain = dm; return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.domain[0], b = this.domain[1], n = Math.max(2, this.samples | 0);
          var top = [], bottom = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var lo, hi;
            try { lo = this.lower(t); hi = this.upper(t); } catch (e) { lo = NaN; hi = NaN; }
            if (isFinite(lo) && isFinite(hi)) {
              top.push([plotX(t), plotY(hi)]);
              bottom.push([plotX(t), plotY(lo)]);
            }
          }
          if (top.length < 2) return this;
          bottom.reverse();
          var poly = group.polygon(_pointsAttr(top.concat(bottom)))
            .fill({ color: opts.fill || '#7fb3ff',
                    opacity: (opts.opacity == null) ? 0.45 : opts.opacity });
          if (opts.stroke) {
            poly.stroke({ color: opts.stroke, width: opts.strokeWidth || 1, linejoin: 'round' });
          } else {
            poly.stroke('none');
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

    /**
     * plotParametric(id, opts) → handle
     *   opts: { x, y, variables=['t'], tDomain=[0,1], samples=200, stroke, width }
     */
    function plotParametric(id, opts) {
      opts = opts || {};
      var vars = opts.variables || ['t'];
      var group = _plotFrame.draw.group().attr('id', 'param-' + id);
      var handle = {
        id: id,
        node: group,
        fx: _resolveFn(opts.x, vars),
        fy: _resolveFn(opts.y, vars),
        tDomain: opts.tDomain || [0, 1],
        samples: opts.samples || 200,
        setX: function (src) { this.fx = _resolveFn(src, vars); return this.sample(); },
        setY: function (src) { this.fy = _resolveFn(src, vars); return this.sample(); },
        remove: function () { group.remove(); _unregisterPlot(this); },
        sample: function () {
          group.clear();
          var a = this.tDomain[0], b = this.tDomain[1], n = Math.max(2, this.samples | 0);
          var pts = [];
          for (var i = 0; i < n; i++) {
            var t = a + (b - a) * (i / (n - 1));
            var vx, vy;
            try { vx = this.fx(t); vy = this.fy(t); } catch (e) { vx = NaN; vy = NaN; }
            if (isFinite(vx) && isFinite(vy)) pts.push([plotX(vx), plotY(vy)]);
          }
          if (pts.length >= 2) {
            group.polyline(_pointsAttr(pts))
              .fill('none')
              .stroke({ color: opts.stroke || '#1f77b4', width: opts.width || 2,
                        linecap: 'round', linejoin: 'round' });
          }
          return this;
        }
      };
      return _registerPlot(handle).sample();
    }

function sourceTreePoint(i, cx, cy, scale) {

    6: [45, 168],

function dynamicTreePoint(i, cx, cy, scale, n) {
  var level = Math.floor(Math.log(i) / Math.log(2));
  var first = Math.pow(2, level);
  var pos = i - first;
  var count = Math.pow(2, level);
  var width = 760 * scale;
  var step = width / count;
  return {
    x: cx - width / 2 + step / 2 + pos * step,
    y: cy + level * 92 * scale
  };

function drawArrow(g, from, to, color, width, r) {

function runHeapifyCode() {
  stopPlay();
  var inputVals;
  try {
    inputVals = parseInputArray();
  } catch (e) {
    setStatus('error: ' + e.message, '#9b0000');
    return;
  }
  var code = document.getElementById('heapifyEditorCode').value;
  document.getElementById('runBtn').disabled = true;
  setStatus('running…', '#555');
  document.getElementById('heapLog').value = '';
  frames = [];
  frameIndex = 0;
  updatePlaybackUi();

  if (activeWorker) activeWorker.terminate();
  var blob = new Blob([buildWorkerSource()], { type: 'application/javascript' });
  var url = URL.createObjectURL(blob);
  activeWorker = new Worker(url);
  URL.revokeObjectURL(url);

  var timedOut = false;
  var timeoutId = setTimeout(function () {
    timedOut = true;
    if (activeWorker) activeWorker.terminate();
    document.getElementById('runBtn').disabled = false;
    frames = [{ kind: 'error', state: inputVals, indices: [], message: 'Error: execution timed out. Check for infinite recursion or loops.' }];
    frameIndex = 0;
    renderCurrentFrame();
    updateLog();
    setStatus('error: timed out', '#9b0000');
    activeWorker = null;
  }, 1800);

  activeWorker.onmessage = function (e) {
    if (timedOut) return;
    clearTimeout(timeoutId);
    document.getElementById('runBtn').disabled = false;
    activeWorker = null;
    frames = e.data.frames || [];
    if (!frames.length) frames = [{ kind: 'error', state: inputVals, indices: [], message: 'No frames were recorded.' }];
    var finalFrame = frames[frames.length - 1];
    if (e.data.error) {
      setStatus('error', '#9b0000');
    } else {
      var bad = heapViolations(finalFrame.state);
      if (bad.length) {
        finalFrame.kind = 'wrong';
        finalFrame.indices = bad;
        finalFrame.message = 'Wrong answer: at least one parent is smaller than a child. The highlighted indices violate the max-heap property.';
        setStatus('wrong answer', '#9b0000');
      } else {
        finalFrame.kind = 'done';
        finalFrame.message = 'Correct: every parent is at least as large as its children.';
        setStatus('correct', '#157a28');
      }
    }
    frameIndex = 0;
    renderCurrentFrame();
    updateLog();
  };

  activeWorker.onerror = function (e) {
    if (timedOut) return;
    clearTimeout(timeoutId);
    document.getElementById('runBtn').disabled = false;
    activeWorker = null;
    frames = [{ kind: 'error', state: inputVals, indices: [], message: 'Worker error: ' + (e.message || 'unknown error') }];
    frameIndex = 0;
    renderCurrentFrame();
    updateLog();
    setStatus('error', '#9b0000');
  };

  activeWorker.postMessage({ code: code, input: inputVals });
}

    'function snap(){return A.slice(1);}',
    'function checkIndex(i){if(!Number.isInteger(i)||i<1||i>n)throw new Error("index "+i+" is outside 1.."+n);}',
    'function add(kind,indices,message,extra){ops++; if(ops>maxOps)throw new Error("operation limit exceeded"); if(frames.length>=maxFrames)throw new Error("frame limit exceeded"); var f={kind:kind,state:snap(),indices:(indices||[]).slice(),message:String(message||""),markIndex:currentMark,markLabel:currentLabel,buildRoot:buildRoot}; if(extra){for(var k in extra)f[k]=extra[k];} frames.push(f);}',
    'function left(i){checkIndex(i); var v=2*i; add("left",[i],"left("+i+") = "+v); return v;}',
    'function right(i){checkIndex(i); var v=2*i+1; add("right",[i],"right("+i+") = "+v); return v;}',
    'function value(i){checkIndex(i); add("value",[i],"read A["+i+"] = "+A[i]); return A[i];}',
    'function greater(i,j){checkIndex(i); checkIndex(j); var res=A[i]>A[j]; add("greater",[i,j],"compare A["+i+"]="+A[i]+" with A["+j+"]="+A[j]+" \\u2192 "+res,{compare:[i,j]}); return res;}',
    'function swap(i,j){checkIndex(i); checkIndex(j); var ai=A[i],aj=A[j]; var t=A[i]; A[i]=A[j]; A[j]=t; add("swap",[i,j],"swap A["+i+"]="+ai+" with A["+j+"]="+aj,{swap:[i,j]});}',
    'function mark(i,label){checkIndex(i); currentMark=i; currentLabel=String(label||"i").slice(0,8); add("mark",[i],"mark index "+i+" as "+currentLabel);}',
    'try{',
    'var factory=new Function("left","right","value","greater","swap","mark", code+"\\n; return (typeof maxHeapify===\\"function\\") ? maxHeapify : null;");',
    'var maxHeapify=factory(left,right,value,greater,swap,mark);',
    'if(typeof maxHeapify!=="function")throw new Error("Define function maxHeapify(i, heapSize).");',
    'add("start",[],"Initial array. BUILD-MAX-HEAP will call MAX-HEAPIFY from floor(n/2) down to 1.");',
    'for(var i=Math.floor(n/2);i>=1;i--){buildRoot=i; currentMark=i; currentLabel="i"; add("call",[i],"BUILD-MAX-HEAP calls maxHeapify("+i+", "+n+")."); maxHeapify(i,n);}',
    'buildRoot=null; currentMark=null; currentLabel=""; add("done",[],"BUILD-MAX-HEAP finished.");',
    'postMessage({frames:frames,final:snap()});',
    '}catch(err){try{add("error",[],"Error: "+(err&&err.message?err.message:err));}catch(e){} postMessage({frames:frames,error:String(err&&err.message?err.message:err),final:snap()});}',
    '}'
  ].join('');
}

function heapViolations(arr) {
  var bad = [];
  for (var i = 1; i <= Math.floor(arr.length / 2); i++) {
    var l = 2 * i, r = 2 * i + 1;
    if (l <= arr.length && arr[i - 1] < arr[l - 1]) { bad.push(i); bad.push(l); }
    if (r <= arr.length && arr[i - 1] < arr[r - 1]) { bad.push(i); bad.push(r); }
  }
  var seen = {};
  return bad.filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
}

function setStatus(text, color) {
  var el = document.getElementById('statusText');
  el.textContent = text;
  el.style.color = color || '#555';
}

function renderCurrentFrame() {
  if (!frames.length) return;
  frameIndex = Math.max(0, Math.min(frames.length - 1, frameIndex));
  drawSingleFrame(frames[frameIndex]);
  updatePlaybackUi();
}

function updatePlaybackUi() {
  document.getElementById('frameCounter').textContent = frames.length ? ((frameIndex + 1) + ' of ' + frames.length) : '0 of 0';
  document.getElementById('frameCaption').textContent = frames.length ? frames[frameIndex].message : '';
}

function updateLog() {
  var lines = frames.map(function (f, i) { return (i + 1) + '. ' + f.message; });
  document.getElementById('heapLog').value = lines.join('\n');
}

function firstFrame() { if (frames.length) { frameIndex = 0; renderCurrentFrame(); } }
function prevFrame() { if (frames.length) { frameIndex = Math.max(0, frameIndex - 1); renderCurrentFrame(); } }
function nextFrame() { if (frames.length) { frameIndex = Math.min(frames.length - 1, frameIndex + 1); renderCurrentFrame(); } }

function togglePlay() {
  if (playTimer) {
    stopPlay();
    return;
  }
  if (!frames.length) return;
  document.getElementById('playBtn').textContent = '❚❚';
  var speed = Number(document.getElementById('speedInput').value || 3);
  var delay = Math.max(120, 900 - speed * 140);
  playTimer = setInterval(function () {
    if (frameIndex >= frames.length - 1) {
      stopPlay();
    } else {
      frameIndex++;
      renderCurrentFrame();
    }
  }, delay);
}

function stopPlay() {
  if (playTimer) clearInterval(playTimer);
  playTimer = null;
  document.getElementById('playBtn').textContent = '▶';
}

document.getElementById('heapifyEditorCode').value = sampleCode;
setStep(0);
updatePlaybackUi();
window.__markRendered();
