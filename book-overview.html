<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foundations of Computer Vision — Chapter DAG</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0c0e16; color: #e2e8f0;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}
header {
  padding: 10px 20px 8px;
  border-bottom: 1px solid #1a2030;
  display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  z-index: 2;
}
header h1 { font-size: 13px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.01em; }
#subtitle { font-size: 11px; color: #3d4f6e; }
#hint-bar {
  font-size: 10px; color: #3d4f6e;
  padding: 5px 20px;
  border-bottom: 1px solid #141920;
  flex-shrink: 0;
  display: flex; align-items: center; gap: 18px;
}
.legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; }
#graph { flex: 1; position: relative; overflow: hidden; }
svg { width: 100%; height: 100%; }

/* Nodes */
.ch-node { cursor: pointer; }
.ch-node circle {
  transition: filter 0.15s, r 0.15s;
}
.ch-node:hover circle { filter: brightness(1.5); }
.ch-node text { pointer-events: none; font-family: 'Inter', system-ui, sans-serif; }
.ch-num  { font-size: 10px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
.ch-title { font-size: 7.5px; font-weight: 500; fill: rgba(255,255,255,0.65); text-anchor: middle; dominant-baseline: middle; }

/* Isolated nodes (no cross-chapter edges) */
.ch-node.isolated circle { opacity: 0.45; }
.ch-node.isolated text   { opacity: 0.5; }

/* Edges */
.ch-edge {
  fill: none;
  stroke-opacity: 0.35;
  stroke-linecap: round;
}
.ch-edge.strong { stroke-opacity: 0.7; }

/* Tooltip */
#tooltip {
  position: fixed; pointer-events: none;
  background: rgba(10,13,22,0.97);
  border: 1px solid #1e2d45;
  border-radius: 8px;
  padding: 10px 14px;
  display: none; z-index: 100;
  min-width: 200px;
}
#tt-ch    { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
#tt-title { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; line-height: 1.35; }
#tt-stats { font-size: 10px; color: #64748b; line-height: 1.8; }
#tt-open  { font-size: 9px; color: #818cf8; margin-top: 6px; }

#loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; background: #0c0e16; z-index: 10;
}
#loading p { font-size: 12px; color: #475569; }
.spinner {
  width: 24px; height: 24px; border: 2px solid #1e2d45;
  border-top-color: #6366f1; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Foundations of Computer Vision</h1>
  <span id="subtitle">Loading…</span>
</header>
<div id="hint-bar">
  <span>Click chapter to open its concept graph</span>
  <span>·</span>
  <span>Scroll to zoom · Drag to pan</span>
  <span>·</span>
  <span style="color:#64748b">Dimmed = no cross-chapter links</span>
</div>
<div id="graph">
  <div id="loading"><div class="spinner"></div><p>Computing DAG layout…</p></div>
  <svg id="svg"></svg>
  <div id="tooltip">
    <div id="tt-ch"></div>
    <div id="tt-title"></div>
    <div id="tt-stats"></div>
    <div id="tt-open">Click to open concept graph ↗</div>
  </div>
</div>

<script>
// ── Colour palette (one per chapter) ────────────────────────────────────────
const PALETTE = [
  '#10b981','#3b82f6','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#ef4444','#84cc16',
  '#f97316','#a78bfa','#14b8a6','#fbbf24','#e879f9','#60a5fa','#34d399','#fb923c',
  '#f472b6','#4ade80','#38bdf8','#c084fc','#2dd4bf','#facc15','#f87171','#a3e635',
  '#818cf8','#fb7185','#22d3ee','#fde68a','#86efac','#7dd3fc','#d8b4fe','#fca5a5',
  '#6ee7b7','#fdba74','#93c5fd','#c4b5fd','#5eead4','#fcd34d','#f9a8d4','#bef264',
  '#67e8f9','#fda4af','#a5b4fc','#6d28d9','#b45309','#0f766e','#b91c1c','#1d4ed8',
  '#15803d','#9333ea','#c2410c','#0369a1','#7e22ce','#be185d','#4d7c0f',
];
const chColor = n => PALETTE[(n - 1) % PALETTE.length];

// ── Load data ────────────────────────────────────────────────────────────────
fetch(`concept-graph-vision-data.json?v=${Date.now()}`)
  .then(r => r.json())
  .then(build)
  .catch(err => {
    document.getElementById('loading').innerHTML =
      `<p style="color:#ef4444">Failed to load: ${err.message}</p>`;
  });

function build(g) {
  // ── Aggregate per chapter ──────────────────────────────────────────────────
  const chMeta = {};
  g.chapters.forEach(c => {
    chMeta[c.chapter] = { ...c, concepts: 0, prereqIn: 0, prereqOut: 0 };
  });
  const cid2ch = {};
  g.concepts.forEach(c => {
    const ch = c.position?.chapter || 0;
    cid2ch[c.id] = ch;
    if (chMeta[ch]) chMeta[ch].concepts++;
  });

  // Cross-chapter edges: e.from = dependent, e.to = prereq
  // DAG direction: prereq (e.to chapter) → dependent (e.from chapter)
  const crossCount = {};
  g.edges.prereq.forEach(e => {
    const chDep  = cid2ch[e.from]; // dependent chapter
    const chPreq = cid2ch[e.to];   // prereq chapter
    if (!chDep || !chPreq || chDep === chPreq) return;
    const key = `${chPreq}-${chDep}`; // prereq → dependent
    crossCount[key] = (crossCount[key] || 0) + 1;
    chMeta[chDep].prereqIn   = (chMeta[chDep].prereqIn  || 0) + 1;
    chMeta[chPreq].prereqOut = (chMeta[chPreq].prereqOut || 0) + 1;
  });

  const chapters = Object.values(chMeta)
    .filter(c => c.chapter > 0)
    .sort((a, b) => a.chapter - b.chapter);

  // Only edges with count >= 1
  const edges = Object.entries(crossCount)
    .map(([key, count]) => {
      const [from, to] = key.split('-').map(Number); // from=prereq, to=dependent
      return { from, to, count };
    });

  const connectedChs = new Set(edges.flatMap(e => [e.from, e.to]));

  document.getElementById('subtitle').textContent =
    `${chapters.length} chapters · ${edges.length} cross-chapter links`;

  // ── Dagre layout ──────────────────────────────────────────────────────────
  const dg = new dagre.graphlib.Graph({ directed: true, multigraph: false });
  dg.setGraph({
    rankdir: 'LR',
    ranker:  'tight-tree',
    nodesep: 50,
    ranksep: 90,
    marginx: 60,
    marginy: 60,
  });
  dg.setDefaultEdgeLabel(() => ({}));

  // Node radius scales with concept count
  const nodeR = ch => Math.round(14 + Math.sqrt(ch.concepts) * 1.8);

  chapters.forEach(ch => {
    const r = nodeR(ch);
    dg.setNode(ch.chapter, { width: r * 2 + 8, height: r * 2 + 8, chapter: ch.chapter });
  });

  edges.forEach(e => {
    if (dg.hasNode(e.from) && dg.hasNode(e.to)) {
      dg.setEdge(e.from, e.to, { count: e.count });
    }
  });

  dagre.layout(dg);

  // ── Render ────────────────────────────────────────────────────────────────
  const div   = document.getElementById('graph');
  const W = div.clientWidth, H = div.clientHeight;
  const svg   = d3.select('#svg').attr('width', W).attr('height', H);

  // Defs: arrow markers per chapter color + a generic dim one
  const defs = svg.append('defs');

  // generic prereq arrow (blue)
  defs.append('marker').attr('id', 'arr-blue')
    .attr('markerUnits', 'userSpaceOnUse')
    .attr('markerWidth', 9).attr('markerHeight', 9)
    .attr('refX', 9).attr('refY', 4.5).attr('orient', 'auto')
    .append('path').attr('d', 'M0,0 L0,9 L9,4.5 z').attr('fill', '#4f7dc4').attr('opacity', 0.7);

  defs.append('marker').attr('id', 'arr-dim')
    .attr('markerUnits', 'userSpaceOnUse')
    .attr('markerWidth', 7).attr('markerHeight', 7)
    .attr('refX', 7).attr('refY', 3.5).attr('orient', 'auto')
    .append('path').attr('d', 'M0,0 L0,7 L7,3.5 z').attr('fill', '#2a3a52').attr('opacity', 0.6);

  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.05, 5])
    .on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoom);

  // Compute bounds and fit
  const dgGraph = dg.graph();
  const gw = dgGraph.width, gh = dgGraph.height;
  const scale = Math.min(W / (gw + 80), H / (gh + 80)) * 0.92;
  const tx = (W - gw * scale) / 2;
  const ty = (H - gh * scale) / 2;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));

  // ── Edges ─────────────────────────────────────────────────────────────────
  const edgeLayer = root.append('g').attr('class', 'edge-layer');
  dg.edges().forEach(e => {
    const ed = dg.edge(e);
    const pts = ed.points || [];
    if (pts.length < 2) return;
    const count = ed.count || 1;
    const strong = count >= 4;

    // Build smooth path through points
    const line = d3.line().x(p => p.x).y(p => p.y).curve(d3.curveCatmullRom.alpha(0.5));

    // Target node radius for arrow offset
    const tgtCh   = chMeta[e.w];
    const tgtR    = tgtCh ? nodeR(tgtCh) + 4 : 20;
    const last    = pts[pts.length - 1];
    const prev    = pts[pts.length - 2];
    const dx = last.x - prev.x, dy = last.y - prev.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const trimmedLast = { x: last.x - (dx/dist) * tgtR, y: last.y - (dy/dist) * tgtR };
    const drawPts = [...pts.slice(0, -1), trimmedLast];

    edgeLayer.append('path')
      .attr('class', `ch-edge${strong ? ' strong' : ''}`)
      .attr('d', line(drawPts))
      .attr('stroke', strong ? '#4f7dc4' : '#2a3a52')
      .attr('stroke-width', strong ? Math.min(2.5, 0.8 + Math.log2(count) * 0.7) : 0.8)
      .attr('marker-end', strong ? 'url(#arr-blue)' : 'url(#arr-dim)');
  });

  // ── Nodes ─────────────────────────────────────────────────────────────────
  const nodeLayer = root.append('g').attr('class', 'node-layer');

  chapters.forEach(ch => {
    const pos = dg.node(ch.chapter);
    if (!pos) return;
    const r    = nodeR(ch);
    const col  = chColor(ch.chapter);
    const isol = !connectedChs.has(ch.chapter);

    const g = nodeLayer.append('g')
      .attr('class', `ch-node${isol ? ' isolated' : ''}`)
      .attr('transform', `translate(${pos.x},${pos.y})`)
      .on('click', () => window.open(`concept-graph.html?book_chapter=${ch.chapter}`, '_blank'))
      .on('mouseenter', ev => showTip(ev, ch))
      .on('mousemove', moveTip)
      .on('mouseleave', hideTip);

    // Glow ring
    g.append('circle')
      .attr('r', r + 3)
      .attr('fill', 'none')
      .attr('stroke', col)
      .attr('stroke-width', 0.5)
      .attr('opacity', 0.2);

    // Main circle
    g.append('circle')
      .attr('r', r)
      .attr('fill', col + '22')
      .attr('stroke', col)
      .attr('stroke-width', 1.8);

    // Chapter number
    g.append('text')
      .attr('class', 'ch-num')
      .attr('y', ch.chapter_title && ch.chapter_title.length > 0 ? -6 : 0)
      .attr('fill', col)
      .text(`${ch.chapter}`);

    // Short title (up to 2 lines, ~14 chars each)
    const title = ch.chapter_title || '';
    const words = title.split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
      if ((cur + ' ' + w).trim().length <= 14) {
        cur = (cur + ' ' + w).trim();
      } else {
        if (cur) lines.push(cur);
        cur = w;
        if (lines.length >= 1) break;
      }
    }
    if (cur && lines.length < 2) lines.push(cur);

    lines.forEach((line, i) => {
      g.append('text')
        .attr('class', 'ch-title')
        .attr('y', 6 + i * 9)
        .text(line);
    });
  });

  document.getElementById('loading').style.display = 'none';

  // ── Tooltip ───────────────────────────────────────────────────────────────
  const tipEl = document.getElementById('tooltip');

  function showTip(ev, ch) {
    document.getElementById('tt-ch').textContent = `Chapter ${ch.chapter}`;
    document.getElementById('tt-ch').style.color = chColor(ch.chapter);
    document.getElementById('tt-title').textContent = ch.chapter_title || '';
    document.getElementById('tt-stats').innerHTML =
      `${ch.concepts} concepts<br>`+
      `${ch.prereqIn  || 0} cross-chapter prereqs in · `+
      `${ch.prereqOut || 0} prereqs out`;
    tipEl.style.display = 'block';
    moveTip(ev);
  }
  function moveTip(ev) {
    const x = ev.clientX + 14, y = ev.clientY - 10;
    tipEl.style.left = (x + tipEl.offsetWidth  > window.innerWidth  ? ev.clientX - tipEl.offsetWidth  - 14 : x) + 'px';
    tipEl.style.top  = (y + tipEl.offsetHeight > window.innerHeight ? ev.clientY - tipEl.offsetHeight - 4  : y) + 'px';
  }
  function hideTip() { tipEl.style.display = 'none'; }
}
</script>
</body>
</html>
