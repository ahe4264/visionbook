<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Loop Generation Flow</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #64748b;
            --line: #334155;
            --blue: #2563eb;
            --blue-bg: #eff6ff;
            --green: #15803d;
            --green-bg: #f0fdf4;
            --amber: #d97706;
            --amber-bg: #fffbeb;
            --rose: #be123c;
            --rose-bg: #fff1f2;
            --violet: #6d28d9;
            --violet-bg: #f5f3ff;
            --paper: #ffffff;
            --bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            padding: 28px;
        }

        .slide {
            max-width: 1160px;
            margin: 0 auto;
            background: var(--paper);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px 30px 18px;
            box-shadow: 0 1px 5px rgba(15, 23, 42, 0.06);
        }

        h1 {
            font-size: 22px;
            line-height: 1.2;
            text-align: center;
            letter-spacing: -0.2px;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .caption {
            margin-top: 10px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.45;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .lane-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            fill: #475569;
        }

        .box-title {
            font-size: 13px;
            font-weight: 700;
            fill: var(--ink);
        }

        .box-body {
            font-size: 10.5px;
            fill: #475569;
        }

        .file-label {
            font-size: 9.5px;
            fill: #64748b;
            font-style: italic;
        }

        .small {
            font-size: 9.5px;
            fill: #64748b;
        }

        .mono {
            font-family: "Cascadia Mono", "Courier New", monospace;
            font-size: 9.5px;
            fill: #334155;
        }

        .chip-label {
            font-size: 9.5px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main class="slide">
        <h1>Two-Phase Generation Flow</h1>
        <p class="subtitle">Phase 1 stabilizes 3D geometry; Phase 2 adds interactivity and explanatory content.</p>

        <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
            <title id="title">Generic diagram of the two-loop generation flow</title>
            <desc id="desc">Diagram showing source inputs, a geometry generation and critic loop, a planner after
                geometry approval, a content generation and critic loop, final generated figure, and saved geometry
                draft.</desc>

            <defs>
                <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0,9 3.5,0 7" fill="#334155" />
                </marker>
                <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0,9 3.5,0 7" fill="#2563eb" />
                </marker>
                <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0,9 3.5,0 7" fill="#15803d" />
                </marker>
                <marker id="arrow-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0,9 3.5,0 7" fill="#be123c" />
                </marker>
                <marker id="arrow-violet" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0,9 3.5,0 7" fill="#6d28d9" />
                </marker>
                <marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0,9 3.5,0 7" fill="#d97706" />
                </marker>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#0f172a" flood-opacity="0.10" />
                </filter>
            </defs>

            <!-- ============ PHASE BACKGROUNDS ============ -->
            <rect x="22" y="44" width="1156" height="178" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
            <rect x="22" y="234" width="1156" height="346" rx="12" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5" />

            <!-- Phase 1 label: circle+text sit 20px below band top, matching Phase 2 -->
            <circle cx="44" cy="64" r="12" fill="#2563eb" />
            <text x="44" y="69" text-anchor="middle" fill="white" font-weight="700" font-size="14"
                font-family="Segoe UI, system-ui, sans-serif">1</text>
            <text x="64" y="69" class="lane-title">Phase 1 — Geometry Loop</text>

            <!-- Phase 2 label -->
            <circle cx="44" cy="254" r="12" fill="#15803d" />
            <text x="44" y="259" text-anchor="middle" fill="white" font-weight="700" font-size="14"
                font-family="Segoe UI, system-ui, sans-serif">2</text>
            <text x="64" y="259" class="lane-title">Phase 2 — Planning + Content Loop</text>

            <!-- ============ ROW 1 — six boxes: Inputs, Generation Planner, Geometry Generator, Geometry Critic, Orchestrator, Approved Geometry ============ -->
            <rect x="32" y="88" width="150" height="112" rx="10" fill="var(--blue-bg)" stroke="var(--blue)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="107" y="116" text-anchor="middle" class="box-title">Inputs</text>
            <text x="52" y="140" class="box-body">Original figure</text>
            <text x="52" y="160" class="box-body">Base scene scaffold</text>
            <text x="52" y="180" class="box-body">Textbook content</text>

            <rect x="220" y="88" width="150" height="112" rx="10" fill="var(--green-bg)" stroke="var(--green)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="295" y="116" text-anchor="middle" class="box-title">Generation Planner</text>
            <text x="240" y="140" class="box-body">Plans geometric</text>
            <text x="240" y="160" class="box-body">elements based on</text>
            <text x="240" y="180" class="box-body">figure.</text>

            <rect x="408" y="88" width="150" height="112" rx="10" fill="var(--rose-bg)" stroke="var(--rose)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="483" y="116" text-anchor="middle" class="box-title">Geometry Generator</text>
            <text x="428" y="140" class="box-body">Build static 3D draft:</text>
            <text x="428" y="160" class="box-body">primitives, depth, camera,</text>
            <text x="428" y="180" class="box-body">crop, labels, scale.</text>

            <rect x="596" y="88" width="150" height="112" rx="10" fill="var(--amber-bg)" stroke="var(--amber)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="671" y="116" text-anchor="middle" class="box-title">Geometry Critic</text>
            <text x="616" y="140" class="box-body">Rubric subset:</text>
            <text x="616" y="160" class="box-body">geometry, labels,</text>
            <text x="616" y="180" class="box-body">faithfulness</text>

            <rect x="784" y="88" width="150" height="112" rx="10" fill="var(--violet-bg)" stroke="var(--violet)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="859" y="116" text-anchor="middle" class="box-title">Orchestrator</text>
            <text x="804" y="140" class="box-body">Routes next step.</text>

            <rect x="972" y="88" width="172" height="112" rx="10" fill="var(--violet-bg)" stroke="var(--violet)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="1058" y="116" text-anchor="middle" class="box-title">Approved Geometry</text>
            <text x="992" y="140" class="box-body">Saved geometry draft</text>
            <text x="992" y="160" class="box-body">becomes the stable base.</text>

            <!-- Row 1 arrows — all on the shared center line y=144 -->
            <line x1="182" y1="144" x2="220" y2="144" stroke="var(--blue)" stroke-width="2.3"
                marker-end="url(#arrow-blue)" />
            <line x1="370" y1="144" x2="408" y2="144" stroke="var(--green)" stroke-width="2.3"
                marker-end="url(#arrow-green)" />
            <line x1="558" y1="144" x2="596" y2="144" stroke="var(--amber)" stroke-width="2.3"
                marker-end="url(#arrow-amber)" />
            <line x1="746" y1="144" x2="784" y2="144" stroke="var(--amber)" stroke-width="2.3"
                marker-end="url(#arrow-amber)" />
            <line x1="934" y1="144" x2="972" y2="144" stroke="var(--violet)" stroke-width="2.3"
                marker-end="url(#arrow-violet)" />
            <rect x="936" y="120" width="34" height="20" rx="4" fill="#fff" stroke="var(--violet)" stroke-width="1.2" />
            <text x="953" y="134" text-anchor="middle" class="chip-label" fill="var(--violet)">pass</text>

            <!-- Fail loop: Orchestrator → back into Geometry Generator -->
            <path d="M 859 200 L 859 224 L 483 224 L 483 200" fill="none" stroke="var(--amber)" stroke-width="2.3"
                stroke-dasharray="7 5" marker-end="url(#arrow-amber)" />
            <rect x="654" y="214" width="34" height="20" rx="4" fill="#fff" stroke="var(--amber)" stroke-width="1.2" />
            <text x="671" y="228" text-anchor="middle" class="chip-label" fill="var(--amber)">fail</text>

            <!-- Approved geometry → Phase 2 handoff, feeds the Interactivity Generator -->
            <path d="M 1058 200 L 1058 239 L 558 239 L 558 278" fill="none" stroke="var(--violet)" stroke-width="2.3"
                marker-end="url(#arrow-violet)" />
            <text x="808" y="234" text-anchor="middle" font-size="9.5" fill="var(--violet)"
                font-family="Segoe UI, system-ui, sans-serif">approved geometry → Phase 2</text>

            <!-- ============ ROW 2 — same grid as Row 1 (top=278, height=112, 54px gaps) ============ -->
            <rect x="32" y="278" width="160" height="112" rx="10" fill="var(--blue-bg)" stroke="var(--blue)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="112" y="306" text-anchor="middle" class="box-title">Inputs</text>
            <text x="52" y="330" class="box-body">Textbook context</text>

            <rect x="246" y="278" width="172" height="112" rx="10" fill="var(--green-bg)" stroke="var(--green)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="332" y="306" text-anchor="middle" class="box-title">Planner</text>
            <text x="266" y="330" class="box-body">Runs after geometry</text>
            <text x="266" y="350" class="box-body">is accepted.</text>
            <text x="266" y="370" class="box-body">Plans interactions/content.</text>

            <rect x="472" y="278" width="172" height="112" rx="10" fill="var(--rose-bg)" stroke="var(--rose)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="558" y="306" text-anchor="middle" class="box-title">Interactivity Generator</text>
            <text x="492" y="330" class="box-body">Uses approved geometry</text>
            <text x="492" y="350" class="box-body">and planner output.</text>
            <text x="492" y="370" class="box-body">Adds interactivity/content.</text>

            <rect x="698" y="278" width="164" height="112" rx="10" fill="var(--amber-bg)" stroke="var(--amber)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="780" y="306" text-anchor="middle" class="box-title">Content Critic</text>
            <text x="718" y="330" class="box-body">Rubric subset:</text>
            <text x="718" y="350" class="box-body">interactivity,</text>
            <text x="718" y="370" class="box-body">concept accuracy</text>

            <rect x="916" y="278" width="172" height="112" rx="10" fill="var(--violet-bg)" stroke="var(--violet)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="1002" y="306" text-anchor="middle" class="box-title">Orchestrator</text>
            <text x="936" y="330" class="box-body">Routes next step.</text>

            <!-- Final Candidate, centered beneath the Content Critic / Orchestrator gap -->
            <rect x="474" y="470" width="172" height="90" rx="10" fill="var(--green-bg)" stroke="var(--green)"
                stroke-width="2" filter="url(#shadow)" />
            <text x="560" y="508" text-anchor="middle" class="box-title">Final Candidate</text>
            <text x="560" y="532" text-anchor="middle" class="box-body">Ready for evaluation</text>

            <!-- Row 2 arrows — all on the shared center line y=334 -->
            <line x1="192" y1="334" x2="246" y2="334" stroke="var(--blue)" stroke-width="2.3"
                marker-end="url(#arrow-blue)" />
            <line x1="418" y1="334" x2="472" y2="334" stroke="var(--green)" stroke-width="2.3"
                marker-end="url(#arrow-green)" />
            <line x1="644" y1="334" x2="698" y2="334" stroke="var(--amber)" stroke-width="2.3"
                marker-end="url(#arrow-amber)" />
            <line x1="862" y1="334" x2="916" y2="334" stroke="var(--amber)" stroke-width="2.3"
                marker-end="url(#arrow-amber)" />

            <!-- Fail loop: Orchestrator → back into Interactivity Generator -->
            <path d="M 1002 390 L 1002 414 L 558 414 L 558 390" fill="none" stroke="var(--amber)" stroke-width="2.3"
                stroke-dasharray="7 5" marker-end="url(#arrow-amber)" />
            <rect x="763" y="404" width="34" height="20" rx="4" fill="#fff" stroke="var(--amber)" stroke-width="1.2" />
            <text x="780" y="418" text-anchor="middle" class="chip-label" fill="var(--amber)">fail</text>

            <!-- Pass: Orchestrator → Final Candidate -->
            <path d="M 1088 334 L 1108 334 L 1108 515 L 646 515" fill="none" stroke="var(--green)" stroke-width="2.3"
                marker-end="url(#arrow-green)" />
            <rect x="860" y="505" width="34" height="20" rx="4" fill="#fff" stroke="var(--green)" stroke-width="1.2" />
            <text x="877" y="519" text-anchor="middle" class="chip-label" fill="var(--green)">pass</text>
        </svg>
    </main>
</body>

</html>
