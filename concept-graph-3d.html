<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Concept Graph 3D — Foundations of Computer Vision</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #080b12; color: #e2e8f0;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}
header {
  padding: 9px 18px 8px;
  border-bottom: 1px solid #1a2035;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  z-index: 10; position: relative;
}
header h1 { font-size: 14px; font-weight: 700; color: #f1f5f9; white-space: nowrap; }
#stats { font-size: 11px; color: #475569; white-space: nowrap; }
#search-wrap { flex: 1; display: flex; align-items: center; gap: 8px; }
#search {
  flex: 1; max-width: 240px;
  background: #131929; border: 1px solid #1e2d45; border-radius: 6px;
  color: #e2e8f0; font-size: 12px; padding: 5px 10px; font-family: inherit; outline: none;
}
#search:focus { border-color: #4f46e5; }
#search::placeholder { color: #334155; }
.axis-legend {
  display: flex; gap: 12px; font-size: 10px; color: #475569;
}
.axis-legend span { display: flex; align-items: center; gap: 4px; }
.axis-dot { width: 8px; height: 8px; border-radius: 50%; }

#layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
#sidebar {
  width: 210px; flex-shrink: 0;
  background: #08090f; border-right: 1px solid #1a2035;
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-header {
  padding: 9px 12px 7px;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: #334155;
  border-bottom: 1px solid #1a2035; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
#clear-filter { font-size: 9px; color: #6366f1; cursor: pointer; font-weight: 600; display: none; }
#clear-filter:hover { color: #818cf8; }
#chapter-list { flex: 1; overflow-y: auto; padding: 4px 0; }
#chapter-list::-webkit-scrollbar { width: 3px; }
#chapter-list::-webkit-scrollbar-thumb { background: #1e2535; border-radius: 2px; }
.ch-item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px; cursor: pointer; transition: background 0.08s;
}
.ch-item:hover { background: #111827; }
.ch-item.active { background: #131d30; }
.ch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ch-label { font-size: 9.5px; color: #64748b; flex: 1; line-height: 1.3; }
.ch-item.active .ch-label { color: #cbd5e1; }
.ch-count { font-size: 8px; color: #334155; font-weight: 600; }

/* Canvas */
#graph { flex: 1; position: relative; }
#c { display: block; width: 100%; height: 100%; }

/* Tooltip */
#tooltip {
  position: absolute; pointer-events: none;
  background: rgba(15, 20, 35, 0.92);
  border: 1px solid #2d3d52; border-radius: 6px;
  padding: 6px 10px; font-size: 11px; color: #e2e8f0;
  max-width: 220px; display: none; z-index: 20;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#tooltip .tt-kind { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; }
#tooltip .tt-title { font-weight: 700; }
#tooltip .tt-ch { font-size: 9px; color: #475569; margin-top: 1px; }

/* Detail panel */
#panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px;
  width: 248px;
  background: rgba(20, 26, 46, 0.96);
  backdrop-filter: blur(8px);
  border: 1px solid #1e2d45; border-radius: 10px;
  padding: 13px; overflow-y: auto;
  display: none; flex-direction: column; gap: 9px;
  z-index: 20;
}
#panel.visible { display: flex; }
#panel::-webkit-scrollbar { width: 3px; }
#panel::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 2px; }
#p-close {
  position: absolute; top: 9px; right: 11px;
  font-size: 14px; color: #334155; cursor: pointer;
}
#p-close:hover { color: #e2e8f0; }
#p-kind {
  font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 2px 7px; border-radius: 3px; display: inline-block; align-self: flex-start;
}
#p-title { font-size: 13px; font-weight: 700; color: #f1f5f9; line-height: 1.3; }
#p-location { font-size: 9px; color: #475569; line-height: 1.5; }
#p-one-liner { font-size: 10px; color: #7c8ea3; line-height: 1.55; }
.p-sec { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #334155; margin-bottom: 4px; }
#p-content { font-size: 10px; color: #64748b; line-height: 1.6; max-height: 120px; overflow-y: auto; }
#p-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 8px; padding: 2px 6px; background: #0c1e33; border: 1px solid #1e3a5a; border-radius: 3px; color: #60a5fa; }
#p-deps-wrap { display: none; }
#p-dep-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.dep-tag {
  font-size: 8px; padding: 2px 6px; background: #1a1540; border: 1px solid #3730a3;
  border-radius: 3px; color: #a5b4fc; cursor: pointer;
}
.dep-tag:hover { background: #251f56; }
#p-items { font-size: 9px; color: #475569; }

/* HUD labels */
#axis-labels {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 20px; font-size: 10px; color: #334155;
  pointer-events: none; z-index: 5;
}
#axis-labels span { display: flex; align-items: center; gap: 5px; }
.ax { display: inline-block; width: 22px; height: 2px; border-radius: 1px; }

#loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; background: #080b12; z-index: 50;
}
#loading p { font-size: 13px; color: #475569; }
.spinner { width: 26px; height: 26px; border: 2px solid #1e2535; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Foundations of Computer Vision — 3D Concept Graph</h1>
  <span id="stats">Loading…</span>
  <div id="search-wrap">
    <input id="search" placeholder="Search concepts…" autocomplete="off">
  </div>
  <div class="axis-legend">
    <span><div class="axis-dot" style="background:#3b82f6"></div> X = Chapter</span>
    <span><div class="axis-dot" style="background:#10b981"></div> Y = Section</span>
    <span><div class="axis-dot" style="background:#f59e0b"></div> Z = Prereq depth</span>
  </div>
</header>

<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header">
      Chapters
      <span id="clear-filter" onclick="clearFilter()">Clear ×</span>
    </div>
    <div id="chapter-list"></div>
  </div>
  <div id="graph">
    <div id="loading"><div class="spinner"></div><p>Building 3D scene…</p></div>
    <canvas id="c"></canvas>
    <div id="tooltip">
      <div class="tt-kind" id="tt-kind"></div>
      <div class="tt-title" id="tt-title"></div>
      <div class="tt-ch" id="tt-ch"></div>
    </div>
    <div id="panel">
      <span id="p-close" onclick="closePanel()">✕</span>
      <span id="p-kind"></span>
      <div id="p-title"></div>
      <div id="p-location"></div>
      <div id="p-one-liner"></div>
      <div><div class="p-sec">Description</div><div id="p-content"></div></div>
      <div id="p-tags-wrap"><div class="p-sec">Tags</div><div id="p-tags"></div></div>
      <div id="p-deps-wrap"><div class="p-sec">Prerequisites</div><div id="p-dep-tags"></div></div>
      <div id="p-items-wrap" style="display:none"><div class="p-sec">Items</div><div id="p-items"></div></div>
    </div>
    <div id="axis-labels">
      <span><div class="ax" style="background:#3b82f6"></div> ← Chapters 1–55 →</span>
      <span><div class="ax" style="background:#f59e0b"></div> Depth: foundational → advanced</span>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Palette (55 distinct chapter colors) ─────────────────────────────────
const PALETTE = [
  '#10b981','#3b82f6','#f59e0b','#ec4899','#8b5cf6',
  '#06b6d4','#ef4444','#84cc16','#f97316','#a78bfa',
  '#14b8a6','#fbbf24','#e879f9','#60a5fa','#34d399',
  '#fb923c','#f472b6','#4ade80','#38bdf8','#c084fc',
  '#2dd4bf','#facc15','#f87171','#a3e635','#818cf8',
  '#fb7185','#22d3ee','#fde68a','#86efac','#7dd3fc',
  '#d8b4fe','#fca5a5','#6ee7b7','#fdba74','#93c5fd',
  '#c4b5fd','#5eead4','#fcd34d','#f9a8d4','#bef264',
  '#67e8f9','#fda4af','#a5b4fc','#6d28d9','#b45309',
  '#0f766e','#b91c1c','#1d4ed8','#15803d','#9333ea',
  '#c2410c','#0369a1','#7e22ce','#be185d','#4d7c0f',
];
function chColor(ch) { return PALETTE[(ch - 1) % PALETTE.length]; }
function hexToRGB(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return [r, g, b];
}

const KIND_COLORS = {
  definition: { bg:'#052e16', fg:'#6ee7b7', border:'#065f46' },
  idea:       { bg:'#0c2a40', fg:'#7dd3fc', border:'#075985' },
  technique:  { bg:'#1e1b4b', fg:'#a5b4fc', border:'#3730a3' },
  property:   { bg:'#2a1e2a', fg:'#d8b4fe', border:'#7e22ce' },
  result:     { bg:'#1c1917', fg:'#d6d3d1', border:'#57534e' },
};
function kindStyle(k) { return KIND_COLORS[k] || { bg:'#131929', fg:'#94a3b8', border:'#1e2d45' }; }

// ── State ─────────────────────────────────────────────────────────────────
let nodes = [], edges = { prereq: [], overlay: [] };
let nodeById = {};
let topoDepth = {};
let pointsMesh, colorAttr, edgeLines, highlightLines;
let renderer, scene, camera, controls;
let raycaster, mouse;
let hoveredIdx = -1, lockedIdx = -1;
let activeChapter = null;
let visibilityMask = null;   // Float32Array: 1 = visible, 0 = filtered out

// ── Seeded random ─────────────────────────────────────────────────────────
function seededRand(seed) {
  let s = (seed * 1664525 + 1013904223) & 0x7fffffff;
  return (s / 0x7fffffff) * 2 - 1;
}

// ── Load ──────────────────────────────────────────────────────────────────
fetch('concept-graph-vision-data.json')
  .then(r => r.json())
  .then(init)
  .catch(e => {
    document.getElementById('loading').innerHTML =
      `<p style="color:#ef4444">Failed to load data: ${e.message}</p>`;
  });

function computeTopoDepths(concepts, prereqEdges) {
  const conceptSet = new Set(concepts.map(c => c.id));
  const preds = {};
  concepts.forEach(c => preds[c.id] = []);
  prereqEdges.forEach(e => {
    if (conceptSet.has(e.from) && conceptSet.has(e.to))
      preds[e.to].push(e.from);
  });
  const cache = {};
  const visiting = new Set();
  function depth(id) {
    if (id in cache) return cache[id];
    if (visiting.has(id)) return (cache[id] = 0);
    visiting.add(id);
    const ps = preds[id] || [];
    cache[id] = ps.length ? 1 + Math.max(...ps.map(depth)) : 0;
    visiting.delete(id);
    return cache[id];
  }
  concepts.forEach(c => depth(c.id));
  return cache;
}

function init(g) {
  // Compute topo depths
  topoDepth = computeTopoDepths(g.concepts, g.edges?.prereq || []);

  // Build node list with 3D positions
  nodes = g.concepts.map((c, i) => {
    const ch   = c.position?.chapter || 1;
    const secY = (c.position?.section_order || 0);
    const d    = topoDepth[c.id] || 0;
    const rx   = seededRand(i * 3 + 0) * 30;
    const ry   = seededRand(i * 3 + 1) * 12;
    const rz   = seededRand(i * 3 + 2) * 20;
    return {
      id: c.id,
      title: c.title,
      kind: c.kind || 'definition',
      one_liner: c.one_liner || '',
      content: c.content || '',
      tags: c.tags || [],
      chapter: ch,
      chapter_title: c.position?.chapter_title || '',
      section: c.position?.section || '',
      section_title: c.position?.section_title || '',
      item_ids: c.item_ids || {},
      depth: d,
      x: (ch - 1) * 120 + rx,
      y: secY * 28 + ry,
      z: Math.min(d, 8) * 55 + rz,
    };
  });
  nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

  edges = {
    prereq:  (g.edges?.prereq  || []).filter(e => nodeById[e.from] && nodeById[e.to]),
    overlay: (g.edges?.overlay || []).filter(e => nodeById[e.from] && nodeById[e.to]),
  };

  visibilityMask = new Float32Array(nodes.length).fill(1);

  document.getElementById('stats').textContent =
    `${nodes.length} concepts · ${edges.prereq.length} prereq edges · ch1→55 × depth 0–26`;

  buildSidebar(g.chapters);
  buildScene();
  document.getElementById('loading').style.display = 'none';
}

// ── Sidebar ───────────────────────────────────────────────────────────────
function buildSidebar(chapters) {
  const counts = {};
  nodes.forEach(n => counts[n.chapter] = (counts[n.chapter] || 0) + 1);
  const sorted = [...chapters].sort((a,b) => a.chapter - b.chapter);
  const list = document.getElementById('chapter-list');
  sorted.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.dataset.ch = ch.chapter;
    div.innerHTML = `
      <div class="ch-dot" style="background:${chColor(ch.chapter)}"></div>
      <div class="ch-label">Ch ${ch.chapter}. ${ch.chapter_title}</div>
      <div class="ch-count">${counts[ch.chapter]||0}</div>`;
    div.onclick = () => filterChapter(ch.chapter, div);
    list.appendChild(div);
  });
}

function filterChapter(ch, el) {
  if (activeChapter === ch) { clearFilter(); return; }
  activeChapter = ch;
  document.querySelectorAll('.ch-item').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('clear-filter').style.display = 'block';
  applyFilter();
}

window.clearFilter = function() {
  activeChapter = null;
  document.querySelectorAll('.ch-item').forEach(d => d.classList.remove('active'));
  document.getElementById('clear-filter').style.display = 'none';
  applyFilter();
};

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  nodes.forEach((n, i) => {
    const matchCh = !activeChapter || n.chapter === activeChapter;
    const matchQ  = !q || n.title.toLowerCase().includes(q) || n.tags.some(t => t.includes(q));
    visibilityMask[i] = (matchCh && matchQ) ? 1 : 0;
  });
  if (lockedIdx >= 0) {
    setHighlight(lockedIdx);
  } else {
    clearHighlight();
  }
}

document.getElementById('search').addEventListener('input', applyFilter);

// ── Three.js scene ────────────────────────────────────────────────────────
function makeCircleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  // Soft-edged circle
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.95)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function buildScene() {
  const container = document.getElementById('graph');
  let W = container.clientWidth, H = container.clientHeight;

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.setClearColor(0x080b12);

  scene = new THREE.Scene();
  // No fog — it was darkening everything

  camera = new THREE.PerspectiveCamera(55, W / H, 1, 80000);
  const cx = nodes.length ? (Math.max(...nodes.map(n=>n.x)) / 2) : 3000;
  const cz = nodes.length ? (Math.max(...nodes.map(n=>n.z)) / 2) : 1500;
  // Start in front of foundational nodes, looking into depth
  camera.position.set(cx, 1200, -2200);
  camera.lookAt(cx, 100, cz);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(cx, 100, cz);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 80;
  controls.maxDistance = 25000;

  // ── Flat circle points ────────────────────────────────────────────────
  const positions = new Float32Array(nodes.length * 3);
  const colorData = new Float32Array(nodes.length * 3);
  nodes.forEach((n, i) => {
    positions[i*3]   = n.x;
    positions[i*3+1] = n.y;
    positions[i*3+2] = n.z;
    const [r, g, b] = hexToRGB(chColor(n.chapter));
    colorData[i*3] = r; colorData[i*3+1] = g; colorData[i*3+2] = b;
  });

  const ptGeo = new THREE.BufferGeometry();
  ptGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  colorAttr = new THREE.BufferAttribute(colorData, 3);
  ptGeo.setAttribute('color', colorAttr);

  const ptMat = new THREE.PointsMaterial({
    size: 38,
    sizeAttenuation: true,
    vertexColors: true,
    map: makeCircleTexture(),
    transparent: true,
    alphaTest: 0.15,
    depthWrite: false,
  });

  pointsMesh = new THREE.Points(ptGeo, ptMat);
  scene.add(pointsMesh);

  // ── Prereq edges ──────────────────────────────────────────────────────
  edgeLines      = buildEdgeLines(edges.prereq, 0x2d4a6b, 0.0);
  highlightLines = buildEdgeLines([],           0x6366f1, 1.0);
  scene.add(edgeLines);
  scene.add(highlightLines);

  // ── Raycaster ─────────────────────────────────────────────────────────
  raycaster = new THREE.Raycaster();
  raycaster.params.Mesh = {};
  mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  renderer.domElement.addEventListener('dblclick', onDblClick);

  window.addEventListener('resize', () => {
    W = container.clientWidth; H = container.clientHeight;
    renderer.setSize(W, H);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  });

  animate();
}

function buildEdgeLines(edgeList, color, opacity) {
  const pos = new Float32Array(edgeList.length * 6);
  edgeList.forEach((e, i) => {
    const a = nodeById[e.from], b = nodeById[e.to];
    if (!a || !b) return;
    pos[i*6+0] = a.x; pos[i*6+1] = a.y; pos[i*6+2] = a.z;
    pos[i*6+3] = b.x; pos[i*6+4] = b.y; pos[i*6+5] = b.z;
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  return new THREE.LineSegments(geo, mat);
}

function rebuildHighlightLines(edgeList) {
  const pos = new Float32Array(edgeList.length * 6);
  edgeList.forEach((e, i) => {
    const a = nodeById[e.from], b = nodeById[e.to];
    if (!a || !b) return;
    pos[i*6+0] = a.x; pos[i*6+1] = a.y; pos[i*6+2] = a.z;
    pos[i*6+3] = b.x; pos[i*6+4] = b.y; pos[i*6+5] = b.z;
  });
  highlightLines.geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  highlightLines.geometry.attributes.position.needsUpdate = true;
}

// ── Highlight ─────────────────────────────────────────────────────────────
function setHighlight(idx) {
  const node = nodes[idx];
  const connectedIds = new Set([node.id]);
  const connectedEdges = [];

  edges.prereq.forEach(e => {
    if (e.from === node.id || e.to === node.id) {
      connectedEdges.push(e);
      connectedIds.add(e.from);
      connectedIds.add(e.to);
    }
  });

  nodes.forEach((n, i) => {
    const visible = visibilityMask[i] === 1;
    const connected = connectedIds.has(n.id);
    if (!visible || !connected) {
      colorAttr.setXYZ(i, 0.04, 0.05, 0.09);
    } else {
      const [r, g, b] = hexToRGB(chColor(n.chapter));
      colorAttr.setXYZ(i, r, g, b);
    }
  });
  // Selected node: bright white-tinted
  const [r, g, b] = hexToRGB(chColor(node.chapter));
  colorAttr.setXYZ(idx, Math.min(r*1.6,1), Math.min(g*1.6,1), Math.min(b*1.6,1));

  colorAttr.needsUpdate = true;
  edgeLines.material.opacity = 0.06;
  rebuildHighlightLines(connectedEdges);
}

function clearHighlight() {
  nodes.forEach((n, i) => {
    const visible = visibilityMask[i] === 1;
    if (visible) {
      const [r, g, b] = hexToRGB(chColor(n.chapter));
      colorAttr.setXYZ(i, r, g, b);
    } else {
      colorAttr.setXYZ(i, 0.03, 0.03, 0.05);
    }
  });
  colorAttr.needsUpdate = true;
  edgeLines.material.opacity = 0.2;
  rebuildHighlightLines([]);
}

// ── Mouse interaction ─────────────────────────────────────────────────────
let lastMoveTime = 0;

function getMouseIdx(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x =  ((event.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((event.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  raycaster.params.Points = { threshold: 14 };
  const hits = raycaster.intersectObject(pointsMesh);
  return hits.length > 0 ? hits[0].index : -1;
}

function onMouseMove(event) {
  const now = Date.now();
  if (now - lastMoveTime < 40) return;  // throttle to ~25fps
  lastMoveTime = now;

  const idx = getMouseIdx(event);
  const tooltip = document.getElementById('tooltip');

  if (idx >= 0 && idx !== hoveredIdx) {
    hoveredIdx = idx;
    const n = nodes[idx];
    document.getElementById('tt-kind').textContent = n.kind;
    document.getElementById('tt-title').textContent = n.title;
    document.getElementById('tt-ch').textContent = `Ch ${n.chapter} · §${n.section} · depth ${n.depth}`;
    tooltip.style.display = 'block';
    if (lockedIdx < 0) setHighlight(idx);
  } else if (idx < 0 && hoveredIdx >= 0) {
    hoveredIdx = -1;
    tooltip.style.display = 'none';
    if (lockedIdx < 0) clearHighlight();
    else setHighlight(lockedIdx);
  }

  if (idx >= 0) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    tooltip.style.left = (x + 14) + 'px';
    tooltip.style.top  = (y - 10) + 'px';
  }
}

function onClick(event) {
  const idx = getMouseIdx(event);
  if (idx >= 0) {
    lockedIdx = idx;
    setHighlight(idx);
    showPanel(nodes[idx]);
  } else {
    lockedIdx = -1;
    if (hoveredIdx >= 0) setHighlight(hoveredIdx);
    else clearHighlight();
    closePanel();
  }
}

function onDblClick(event) {
  // Double-click: fly camera toward the node
  const idx = getMouseIdx(event);
  if (idx < 0) return;
  const n = nodes[idx];
  const target = new THREE.Vector3(n.x, n.y, n.z);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const newPos = target.clone().add(dir.multiplyScalar(400));
  // Simple lerp animation
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  let t = 0;
  function flyTick() {
    t += 0.04;
    if (t >= 1) { camera.position.copy(newPos); controls.target.copy(target); controls.update(); return; }
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(startPos, newPos, ease);
    controls.target.lerpVectors(startTarget, target, ease);
    controls.update();
    requestAnimationFrame(flyTick);
  }
  flyTick();
}

// ── Detail panel ──────────────────────────────────────────────────────────
function showPanel(n) {
  const ks = kindStyle(n.kind);
  const kind = document.getElementById('p-kind');
  kind.textContent = n.kind || 'concept';
  kind.style.background = ks.bg; kind.style.color = ks.fg; kind.style.border = `1px solid ${ks.border}`;

  document.getElementById('p-title').textContent = n.title;
  document.getElementById('p-location').textContent =
    `Ch ${n.chapter}. ${n.chapter_title} · §${n.section} ${n.section_title} · depth ${n.depth}`;
  document.getElementById('p-one-liner').textContent = n.one_liner;
  document.getElementById('p-content').textContent = n.content;

  document.getElementById('p-tags').innerHTML =
    n.tags.map(t => `<span class="tag">${t}</span>`).join('');

  const prereqs = edges.prereq
    .filter(e => e.to === n.id)
    .map(e => nodeById[e.from]).filter(Boolean);

  const dw = document.getElementById('p-deps-wrap');
  if (prereqs.length > 0) {
    dw.style.display = 'block';
    document.getElementById('p-dep-tags').innerHTML = prereqs.map(p =>
      `<span class="dep-tag" onclick="jumpTo('${p.id}')">${p.title}</span>`
    ).join('');
  } else { dw.style.display = 'none'; }

  const ids = n.item_ids || {};
  const parts = [];
  if (ids.figures?.length)   parts.push(`${ids.figures.length} figures`);
  if (ids.exercises?.length) parts.push(`${ids.exercises.length} exercises`);
  if (ids.examples?.length)  parts.push(`${ids.examples.length} examples`);
  const iw = document.getElementById('p-items-wrap');
  if (parts.length) { iw.style.display = 'block'; document.getElementById('p-items').textContent = parts.join(' · '); }
  else iw.style.display = 'none';

  document.getElementById('panel').classList.add('visible');
}

window.jumpTo = function(id) {
  const idx = nodes.findIndex(n => n.id === id);
  if (idx < 0) return;
  lockedIdx = idx;
  setHighlight(idx);
  showPanel(nodes[idx]);
  onDblClick({ clientX: window.innerWidth/2, clientY: window.innerHeight/2, _forceIdx: idx });
  // Fly to node
  const n = nodes[idx];
  const target = new THREE.Vector3(n.x, n.y, n.z);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const newPos = target.clone().add(dir.multiplyScalar(400));
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  let t = 0;
  function tick() {
    t += 0.04; if (t > 1) t = 1;
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(startPos, newPos, ease);
    controls.target.lerpVectors(startTarget, target, ease);
    controls.update();
    if (t < 1) requestAnimationFrame(tick);
  }
  tick();
};

window.closePanel = function() {
  document.getElementById('panel').classList.remove('visible');
  lockedIdx = -1;
  if (hoveredIdx >= 0) setHighlight(hoveredIdx);
  else clearHighlight();
};

// ── Animate ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
